name: ISEF TESS post-prime LC truth refinement

on:
  push:
    paths:
      - '.github/workflows/isef-tess-binary-postprime-lc-truth-refine.yml'
  workflow_dispatch:

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests lxml html5lib beautifulsoup4
      - name: Download frozen post-prime geometry artifact
        uses: actions/download-artifact@v4
        with:
          name: isef-tess-binary-postprime-known-geometry
          path: input_geometry
          github-token: ${{ github.token }}
          run-id: 33457113454
      - name: Refine to lightcurve-discovered known binaries
        id: refine
        shell: bash
        run: |
          set +e
          python isef/tess_binary_postprime_lc_truth_refine.py input_geometry > refine.log 2>&1
          code=$?
          cat refine.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-tess-binary-postprime-lc-truth
          path: |
            refine.log
            results/tess_binary_postprime_lc_truth_refine/
          if-no-files-found: warn
      - name: Preserve failure status
        if: steps.refine.outputs.exit_code != '0'
        run: exit 1
