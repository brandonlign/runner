name: ISEF TESS post-prime LC truth refinement

on:
  push:
    paths:
      - '.github/workflows/isef-tess-binary-postprime-lc-truth-refine.yml'
  workflow_dispatch:

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests lxml html5lib beautifulsoup4
      - name: Download frozen post-prime geometry artifact
        uses: actions/download-artifact@v4
        with:
          name: isef-tess-binary-postprime-known-geometry
          path: input_geometry
          github-token: ${{ github.token }}
          run-id: 33457113454
      - name: Refine to lightcurve-discovered known binaries
        run: python isef/tess_binary_postprime_lc_truth_refine.py input_geometry
      - uses: actions/upload-artifact@v4
        with:
          name: isef-tess-binary-postprime-lc-truth
          path: results/tess_binary_postprime_lc_truth_refine/
