name: OrbitTrace sparse-tail augmentation development

on:
  pull_request:
    branches:
      - agent/orbittrace-hybrid-2022-validation
    paths:
      - orbittrace_sparse_tail_augmentation/**
      - .github/workflows/orbittrace_sparse_tail_augmentation_development.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-sparse-tail-augmentation-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-sparse-tail-augmentation-development

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen development source
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_sparse_tail_augmentation/PROTOCOL.md)" = "0b7a6cb05f0d93c9d272d164d396627aa470c0a3"
          test "$(git hash-object orbittrace_sparse_tail_augmentation/develop_sparse_tail_margin.py)" = "163aadc64e18065ddecf0e92949fddaa3908147c"
          python -m py_compile orbittrace_sparse_tail_augmentation/develop_sparse_tail_margin.py
          grep -Fq 'MARGINS = (0.0, 0.25, 0.5, 0.75, 1.0)' orbittrace_sparse_tail_augmentation/develop_sparse_tail_margin.py
          grep -Fq 'prospective_corpus_reserved": 2021' orbittrace_sparse_tail_augmentation/develop_sparse_tail_margin.py

      - name: Install frozen analysis dependencies
        run: python -m pip install numpy==2.1.3 scikit-learn==1.5.2

      - name: Retrieve exact exposed development records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/2025 input/2023 input/2022 output
          gh run download 31104654956 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-sonotaco-2025-wavelet-episode-comparison \
            --dir input/2025
          gh run download 31105278114 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-sonotaco-2023-wavelet-episode-transfer \
            --dir input/2023
          gh run download 31107311777 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-sonotaco-2022-fixed4-wavelet-hybrid-validation \
            --dir input/2022
          echo '0dfe2d312818318768ebbf2fc2ded4275b734339849392187878eb142726462c  input/2025/positive_literature_records.jsonl.gz' | sha256sum -c -
          echo 'e6757788f44f6881e059e7b167555b0cd497cae31b2abb366cd6c22df7684996  input/2025/negative_literature_records.jsonl.gz' | sha256sum -c -
          echo 'ba3c0dc382a66afdec6616bb39724f22705d7ba87d703d21ce65c695f4e85d2f  input/2023/positive_literature_records.jsonl.gz' | sha256sum -c -
          echo '2a2c2e521402bba8beefaef98582f9fee86715cbb7e587d6e6d66a435cdeb1b7  input/2023/negative_literature_records.jsonl.gz' | sha256sum -c -
          echo '41c551cbe58321941e549f1c49bdc1e58467ab9400ebbb62095480c69323848e  input/2022/positive_hybrid_records.jsonl.gz' | sha256sum -c -
          echo '58c897fb8277d7e29822fbd5e4c21b0acfc17015125770322c3afaa2885a694a  input/2022/negative_hybrid_records.jsonl.gz' | sha256sum -c -

      - name: Select the frozen margin
        run: |
          set -euo pipefail
          python orbittrace_sparse_tail_augmentation/develop_sparse_tail_margin.py \
            --input-2025 input/2025 \
            --input-2023 input/2023 \
            --input-2022 input/2022 \
            --output output
          cat output/SPARSE_TAIL_AUGMENTATION_DEVELOPMENT.md

      - name: Enforce development boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/sparse_tail_augmentation_development.json').read_text())
          allowed = {
              'PASS_SPARSE_TAIL_AUGMENTATION_DEVELOPMENT',
              'FAIL_SPARSE_TAIL_AUGMENTATION_DEVELOPMENT',
          }
          if result.get('verdict') not in allowed:
              raise SystemExit(f"invalid verdict: {result.get('verdict')}")
          if result.get('candidate_margins') != [0.0, 0.25, 0.5, 0.75, 1.0]:
              raise SystemExit('candidate grid changed')
          if result.get('development_corpora') != [2025, 2023, 2022]:
              raise SystemExit('development corpora changed')
          if result.get('prospective_corpus_reserved') != 2021:
              raise SystemExit('prospective corpus changed')
          print(json.dumps({
              'verdict': result['verdict'],
              'selected_margin': result['selected_margin'],
              'selection_summary': result['selection_summary'],
              'gates': result['gates'],
          }, indent=2))
          PY

      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            orbittrace_sparse_tail_augmentation/PROTOCOL.md \
            orbittrace_sparse_tail_augmentation/develop_sparse_tail_margin.py \
            input/2025/positive_literature_records.jsonl.gz \
            input/2025/negative_literature_records.jsonl.gz \
            input/2023/positive_literature_records.jsonl.gz \
            input/2023/negative_literature_records.jsonl.gz \
            input/2022/positive_hybrid_records.jsonl.gz \
            input/2022/negative_hybrid_records.jsonl.gz \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-sparse-tail-augmentation-development
          path: output
          if-no-files-found: error
          retention-days: 90
