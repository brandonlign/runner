name: OrbitTrace v6 replay repair source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-exact-fanout-v2
    paths:
      - 'orbittrace_v6_exact_fanout_v2/**'
      - 'orbittrace_v6_replay_repair/**'
      - '.github/workflows/orbittrace_v6_replay_repair_source_audit.yml'

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: execution
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
          fetch-depth: 1
      - name: Reconstruct authoritative frozen v6 and audit repair-critical source
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,base64,gzip,hashlib
          from pathlib import Path
          root=Path('frozen-v6/orbittrace_v3_catalogue_v6/exact_parts')
          parts=sorted(root.glob('part*.b64'))
          encoded=''.join(''.join(p.read_text().split()) for p in parts)
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9',digest
          src=raw.decode('utf-8')
          tree=ast.parse(src)
          lines=src.splitlines()
          wanted={'calibrate_year_v6','exact_rescore_window_v6','component_records_track_v6','scan_year_v6','main'}
          found={n.name:n for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name in wanted}
          assert set(found)==wanted,set(found)
          for name in ('calibrate_year_v6','exact_rescore_window_v6','component_records_track_v6'):
              fn=found[name]
              print(f'--- {name} ---')
              for i in range(fn.lineno,fn.end_lineno+1):
                  print(f'{i:04d}: {lines[i-1]}')
          # Print only main statements that consume year scan outputs/audit or gate a verdict.
          main=found['main']
          print('--- main scan/audit/verdict contexts ---')
          for node in ast.walk(main):
              if not hasattr(node,'lineno'):
                  continue
              text=ast.get_source_segment(src,node) or ''
              needles=('scan_year_v6(', 'audits', 'prefilter_candidates', 'proposal_candidates_scored',
                       'primary_proposals_selected_before_dedup','rescue_proposals_selected_before_dedup',
                       'deduplicated_exact_proposals','PASS_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT',
                       'FAIL_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT')
              if any(n in text for n in needles) and isinstance(node,(ast.Assign,ast.AnnAssign,ast.If,ast.Expr,ast.Return)):
                  print(f'{node.lineno:04d}: {text[:1800]}')
          print('PASS_V6_REPLAY_REPAIR_SOURCE_AUDIT',digest)
          PY
