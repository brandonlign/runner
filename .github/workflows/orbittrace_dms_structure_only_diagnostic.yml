name: OrbitTrace DMS structure-only diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 1374 &&
      github.event.comment.user.login == 'brandonlign' &&
      github.event.comment.body == 'DIAG_ORBITTRACE_DMS_STRUCTURE_ONLY_V1'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v15-dms-coverage-eligibility-run-v5
          fetch-depth: 1

      - name: Fetch official DMS archive and emit structure only
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY' > output/dms_structure_only.json
          import collections, hashlib, io, json, re, urllib.request, zipfile
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          PAGE='https://ceres.ta3.sk/iaumdcdb/home/catalog/video'
          ANCHOR='DMS1991-1998 - ZIP archive'
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.href=None; self.parts=[]; self.a=[]
              def handle_starttag(self,t,attrs):
                  if t.lower()=='a': self.href=dict(attrs).get('href'); self.parts=[]
              def handle_data(self,d):
                  if self.href is not None: self.parts.append(d)
              def handle_endtag(self,t):
                  if t.lower()=='a' and self.href is not None:
                      self.a.append((''.join(self.parts).strip(),self.href)); self.href=None; self.parts=[]
          def get(u):
              r=urllib.request.Request(u,headers={'User-Agent':'OrbitTrace-DMS-structure-only/1.0'})
              with urllib.request.urlopen(r,timeout=60) as f:return f.read()
          page=get(PAGE); p=P(); p.feed(page.decode('utf-8'))
          links=[h for text,h in p.a if text==ANCHOR]; assert len(links)==1
          url=urljoin(PAGE,links[0]); raw=get(url); assert raw[:4]==b'PK\x03\x04'
          result={'archive_sha256':hashlib.sha256(raw).hexdigest(),'member_count':0,'members':[],'cell_values_accessed':False,'scientific_values_accessed':False}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for info in z.infolist():
                  if info.is_dir(): continue
                  b=z.read(info.filename)
                  enc=None;text=None
                  for e in ('utf-8-sig','utf-8','cp1252','latin-1'):
                      try:text=b.decode(e);enc=e;break
                      except UnicodeDecodeError: pass
                  m={'name':info.filename,'size':info.file_size,'sha256':hashlib.sha256(b).hexdigest(),'encoding':enc}
                  if text is not None:
                      lines=[ln for ln in text.splitlines() if ln.strip()]
                      m['nonblank_line_count']=len(lines)
                      m['line_length_counts']=dict(collections.Counter(len(ln) for ln in lines).most_common(10))
                      structures={}
                      for name,splitter in [
                          ('comma',lambda s:s.split(',')),('semicolon',lambda s:s.split(';')),('tab',lambda s:s.split('\t')),('pipe',lambda s:s.split('|')),('whitespace',lambda s:re.split(r'\s+',s.strip()))]:
                          widths=[len(splitter(ln)) for ln in lines]
                          structures[name]={'width_counts':dict(collections.Counter(widths).most_common(10)),'constant_width':len(set(widths))==1}
                      m['token_structure']=structures
                  result['members'].append(m)
          result['member_count']=len(result['members'])
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          cat output/dms_structure_only.json

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-dms-structure-only-v1-${{ github.run_id }}
          path: output/dms_structure_only.json
          retention-days: 30

      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1374 --repo "${{ github.repository }}" --body "ORBITTRACE_DMS_STRUCTURE_DIAGNOSTIC=${GITHUB_RUN_ID}"
