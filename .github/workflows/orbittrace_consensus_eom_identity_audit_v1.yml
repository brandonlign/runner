name: OrbitTrace consensus-EOM HDBSCAN v1 identity audit

on:
  push:
    branches:
      - agent/orbittrace-consensus-eom-hdbscan-v1
    paths:
      - 'orbittrace_consensus_eom_hdbscan_v1/AUDIT_ACTIVATE.md'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  synthetic-zero-truth:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-consensus-eom-hdbscan-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          test "$(git hash-object orbittrace_consensus_eom_hdbscan_v1/PROTOCOL.md)" = '6a2650585a8d92356581d75316f2c92a33b80471'
          test "$(git hash-object orbittrace_consensus_eom_hdbscan_v1/consensus_eom.py)" = 'cef79d99bded4f93dfce6a930703b5493fd72fb6'
          test "$(git hash-object orbittrace_consensus_eom_hdbscan_v1/audit_identity.py)" = '94d1c72caf3305f919d7cc8935cfee695b2dc2ea'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          python -m py_compile \
            orbittrace_consensus_eom_hdbscan_v1/consensus_eom.py \
            orbittrace_consensus_eom_hdbscan_v1/audit_identity.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py
          echo PASS_CONSENSUS_EOM_FROZEN_ENGINEERING_SOURCE_PINS
      - name: Run synthetic identity audit only
        run: |
          set -euo pipefail
          rm -rf orbittrace_consensus_eom_hdbscan_v1/output
          python -u orbittrace_consensus_eom_hdbscan_v1/audit_identity.py
          python - <<'PY'
          import json
          p='orbittrace_consensus_eom_hdbscan_v1/output/CONSENSUS_EOM_ZERO_TRUTH_AUDIT.json'
          r=json.load(open(p))
          assert r['verdict']=='PASS_CONSENSUS_EOM_HDBSCAN_V1_ZERO_TRUTH_IDENTITY_AUDIT'
          assert r['synthetic_only'] is True and len(r['cases'])==3
          assert r['ordinary_hdbscan_partition_identity'] is True
          assert r['ordinary_selected_node_ancestor_labeller_identity'] is True
          assert r['recurrent_selected_node_ancestor_labeller_identity'] is True
          assert r['componentwise_reduces_to_scalar_eom_when_components_identical'] is True
          assert r['consensus_requires_positive_stability_both_years'] is True
          assert r['scientific_labels_accessed'] is False and r['gmn_catalogue_accessed'] is False
          assert r['sonotaco_accessed'] is False and r['efn_accessed'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          for c in r['cases']:
              assert c['ordinary_partition_sha256']==c['ordinary_custom_partition_sha256']==c['scalar_reduced_consensus_partition_sha256']
              assert c['recurrent_partition_sha256']==c['recurrent_custom_partition_sha256']
          print(r['verdict'])
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p orbittrace_consensus_eom_hdbscan_v1/output
          sha256sum \
            orbittrace_consensus_eom_hdbscan_v1/PROTOCOL.md \
            orbittrace_consensus_eom_hdbscan_v1/consensus_eom.py \
            orbittrace_consensus_eom_hdbscan_v1/audit_identity.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_consensus_eom_hdbscan_v1/output/CONSENSUS_EOM_ZERO_TRUTH_AUDIT.json \
            > orbittrace_consensus_eom_hdbscan_v1/output/source_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > orbittrace_consensus_eom_hdbscan_v1/output/execution_commit.txt
          python --version > orbittrace_consensus_eom_hdbscan_v1/output/python_version.txt
          python -m pip freeze > orbittrace_consensus_eom_hdbscan_v1/output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-consensus-eom-identity-audit-v1
          path: orbittrace_consensus_eom_hdbscan_v1/output
          if-no-files-found: error
          retention-days: 90
