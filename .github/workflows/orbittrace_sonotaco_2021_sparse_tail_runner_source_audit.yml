name: OrbitTrace SonotaCo 2021 sparse-tail runner source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-sparse-tail-2021-source-audit
    paths:
      - .github/workflows/orbittrace_sonotaco_2021_sparse_tail_runner_source_audit.yml
      - orbittrace_sparse_tail_augmentation/sparse_tail_augmentation.py
      - orbittrace_sparse_tail_augmentation/run_sonotaco_2021_sparse_tail_validation.py
      - orbittrace_sparse_tail_augmentation/SONOTACO_2021_VALIDATION_PROTOCOL.json
      - orbittrace_literature_freeze/SONOTACO_2021_LABEL_ELIGIBILITY_RESULT.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbittrace-sonotaco-2021-sparse-tail-runner-source-audit
  cancel-in-progress: false

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-sparse-tail-2021-runner-source-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source-audit dependencies
        run: python -m pip install numpy==2.1.3 scikit-learn==1.5.2

      - name: Verify exact frozen source and protocol
        env:
          PYTHONPATH: orbittrace_sparse_tail_augmentation:orbittrace_literature_comparison
        run: |
          set -euo pipefail
          mkdir -p output
          test "$(git hash-object orbittrace_sparse_tail_augmentation/sparse_tail_augmentation.py)" = "d29a6f978643b9ce678c7252642ce51c1ea43a4d"
          test "$(git hash-object orbittrace_sparse_tail_augmentation/SONOTACO_2021_VALIDATION_PROTOCOL.json)" = "cf4fac60518c0b49c58b2f5a4d4d4f30688ec573"
          test "$(git hash-object orbittrace_sparse_tail_augmentation/run_sonotaco_2021_sparse_tail_validation.py)" = "20f2945eab9d84c55225d9a8066a3238f36116f7"
          python -m py_compile \
            orbittrace_sparse_tail_augmentation/sparse_tail_augmentation.py \
            orbittrace_sparse_tail_augmentation/run_sonotaco_2021_sparse_tail_validation.py
          python orbittrace_sparse_tail_augmentation/sparse_tail_augmentation.py
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import sparse_tail_augmentation as sparse_tail
          import wavelet_episode_comparator as wavelet

          protocol = json.loads(Path('orbittrace_sparse_tail_augmentation/SONOTACO_2021_VALIDATION_PROTOCOL.json').read_text())
          eligibility = json.loads(Path('orbittrace_literature_freeze/SONOTACO_2021_LABEL_ELIGIBILITY_RESULT.json').read_text())
          runner_path = Path('orbittrace_sparse_tail_augmentation/run_sonotaco_2021_sparse_tail_validation.py')
          runner = runner_path.read_text()
          tree = ast.parse(runner)

          assert protocol['status'] == 'frozen_before_any_sonotaco_2021_component_or_sparse_tail_score'
          assert protocol['method']['id'] == sparse_tail.METHOD_ID
          assert protocol['method']['margin'] == sparse_tail.MARGIN == 0.25
          assert protocol['prospective_panel']['year'] == 2021
          assert protocol['prospective_panel']['eligibility_artifact'] == 8970738643
          assert protocol['prospective_panel']['calibration_episodes'] == 4224
          assert protocol['prospective_panel']['negative_episodes'] == 2112
          assert protocol['prospective_panel']['positive_episodes'] == 592
          assert protocol['promotion_gates'] == {
              'weak_auc_exceeds_wavelet': True,
              'k4_recall_005_exceeds_wavelet': True,
              'recall_005_not_below_both_components_for_every_k': True,
              'fpr_005_at_most': 0.065,
              'fpr_001_at_most': 0.02,
              'worst_sector_fpr_005_at_most': 0.08,
          }
          assert eligibility['verdict'] == 'PASS_SONOTACO_2021_LABEL_ELIGIBILITY_AUDIT'
          assert eligibility['confirmation_source_sha256'] == '1af6addf880c8041b613fa12fc8c4d588a7140ae8e40fab0e2ceebcd0d566337'
          assert eligibility['counts']['supported_bin_count'] == 33
          assert eligibility['counts']['eligible_shower_count'] == 37
          assert eligibility['counts']['calibration_episodes'] == 4224
          assert eligibility['counts']['negative_episodes'] == 2112
          assert eligibility['counts']['positive_episodes'] == 592
          assert not any(eligibility['prohibited_access'].values())

          assert sparse_tail.METHOD_ID == 'wavelet_primary_fixed4_margin_025'
          assert sparse_tail.MARGIN == 0.25
          assert all(sparse_tail.self_test().values())
          assert wavelet.ANGULAR_PROBE_DEG == 4.0
          assert wavelet.SPEED_PROBE_FRACTION == 0.10
          assert wavelet.TRUNCATION_RADIUS == 4.0
          assert wavelet.KERNEL_DIMENSION == 3.0
          assert all(wavelet.self_test().values())

          functions = {node.name for node in ast.walk(tree) if isinstance(node, ast.FunctionDef)}
          required = {
              'parse_args','sha256_bytes','decode_file','decode_parts','load_module','load_sources',
              'validate_freezes','score_episode','score_background','score_positive','auc','rate','main'
          }
          assert required.issubset(functions)
          calls = set()
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id)
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr)
          assert 'fixed4_wavelet_hybrid' not in imports
          assert 'calibration_statistics' in calls
          assert 'target_statistic' in calls
          assert 'final_pvalue' in calls
          assert 'target_hybrid_statistic' not in calls
          assert 'YEAR = 2021' in runner
          assert 'CORPUS = "sonotaco-2021-sparse-tail-validation"' in runner
          assert 'EXPECTED_CALIBRATION_EPISODES = 4224' in runner
          assert 'EXPECTED_NEGATIVE_EPISODES = 2112' in runner
          assert 'EXPECTED_POSITIVE_EPISODES = 592' in runner
          assert 'parse_sonotaco_2021_events' in runner
          assert 'PROMOTE_SPARSE_TAIL_AUGMENTATION' in runner
          assert '0.065' in runner and '0.02' in runner and '0.08' in runner
          assert 'MARGINS' not in runner
          assert '2022' not in runner
          assert '2023' not in runner
          assert '2025' not in runner

          audit = {
              'verdict': 'PASS_SONOTACO_2021_SPARSE_TAIL_RUNNER_SOURCE_AUDIT',
              'archive_accessed': False,
              'labels_accessed': False,
              'scores_computed': False,
              'method_id': sparse_tail.METHOD_ID,
              'margin': sparse_tail.MARGIN,
              'runner_functions': sorted(functions),
              'promotion_gates': protocol['promotion_gates'],
          }
          Path('output/sonotaco_2021_sparse_tail_runner_source_audit.json').write_text(
              json.dumps(audit, indent=2) + '\n'
          )
          print(json.dumps(audit, indent=2))
          PY

      - name: Preserve audited source and provenance
        run: |
          cp orbittrace_sparse_tail_augmentation/sparse_tail_augmentation.py output/
          cp orbittrace_sparse_tail_augmentation/run_sonotaco_2021_sparse_tail_validation.py output/
          cp orbittrace_sparse_tail_augmentation/SONOTACO_2021_VALIDATION_PROTOCOL.json output/
          sha256sum \
            orbittrace_sparse_tail_augmentation/sparse_tail_augmentation.py \
            orbittrace_sparse_tail_augmentation/run_sonotaco_2021_sparse_tail_validation.py \
            orbittrace_sparse_tail_augmentation/SONOTACO_2021_VALIDATION_PROTOCOL.json \
            orbittrace_literature_freeze/SONOTACO_2021_LABEL_ELIGIBILITY_RESULT.json \
            > output/source_sha256.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-sonotaco-2021-sparse-tail-runner-source-audit
          path: output
          if-no-files-found: error
          retention-days: 90
