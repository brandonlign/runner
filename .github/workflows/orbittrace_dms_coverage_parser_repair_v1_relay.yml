name: OrbitTrace DMS full-header-only diagnostic relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 1374 &&
      github.event.comment.user.login == 'brandonlign' &&
      github.event.comment.body == 'DIAG_ORBITTRACE_DMS_FULL_HEADER_ONLY_V1'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Announce exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1374 --repo "${{ github.repository }}" --body "ORBITTRACE_DMS_FULL_HEADER_STARTED=${GITHUB_RUN_ID}"

      - name: Read exactly two DMS header rows, no data values
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,io,json,urllib.request,zipfile
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          PAGE='https://ceres.ta3.sk/iaumdcdb/home/catalog/video';ANCHOR='DMS1991-1998 - ZIP archive'
          class P(HTMLParser):
              def __init__(self):super().__init__();self.h=None;self.p=[];self.a=[]
              def handle_starttag(self,t,attrs):
                  if t.lower()=='a':self.h=dict(attrs).get('href');self.p=[]
              def handle_data(self,d):
                  if self.h is not None:self.p.append(d)
              def handle_endtag(self,t):
                  if t.lower()=='a' and self.h is not None:self.a.append((''.join(self.p).strip(),self.h));self.h=None;self.p=[]
          def get(u):
              r=urllib.request.Request(u,headers={'User-Agent':'OrbitTrace-DMS-header-only/1.0'})
              with urllib.request.urlopen(r,timeout=60) as f:return f.read()
          page=get(PAGE);p=P();p.feed(page.decode());links=[h for text,h in p.a if text==ANCHOR];assert len(links)==1
          raw=get(urljoin(PAGE,links[0]))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              names=[i.filename for i in z.infolist() if not i.is_dir()];assert len(names)==1;text=z.read(names[0]).decode('utf-8-sig')
          rows=[r for r in csv.reader(io.StringIO(text),delimiter=';') if r and any(c.strip() for c in r)]
          assert len(rows)==910 and len(rows[0])==len(rows[1])==42
          print(json.dumps([{'index':i,'header0':rows[0][i].strip(),'header1':rows[1][i].strip()} for i in range(42)],indent=2))
          PY

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1374 --repo "${{ github.repository }}" --body "ORBITTRACE_DMS_FULL_HEADER_SUCCESS=${GITHUB_RUN_ID}"
