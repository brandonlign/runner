name: OrbitTrace selected drift-track generalization audit

on:
  push:
    branches:
      - research/orbittrace-new-discovery-screen-20260828
    paths:
      - orbittrace_new_discovery_screen/drift_track_generalization_cell.py
      - .github/workflows/orbittrace_drift_track_generalization.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generalization-control:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        control: [M2025-K1, M2025-O1, M2025-Q1, M2025-V1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOCOL_ID: 'orbittrace-raw/DRIFT_TRACK_GENERALIZATION_AUDIT@1e92bff1'
      SELECTED_VARIANT: 'A_EOM_5_3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 \
            requests==2.32.5 beautifulsoup4==4.12.3 click==8.0.4 future==1.0.0
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Execute frozen generalization control
        run: |
          set -euo pipefail
          echo "Executing ${PROTOCOL_ID}, selected=${SELECTED_VARIANT}, control=${{ matrix.control }}"
          python -m orbittrace_new_discovery_screen.drift_track_generalization_cell \
            --control '${{ matrix.control }}' \
            --out generalization_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-track-generalization-${{ matrix.control }}
          path: generalization_output/
          if-no-files-found: warn
          retention-days: 60
