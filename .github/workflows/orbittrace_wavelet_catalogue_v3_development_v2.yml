name: OrbitTrace wavelet catalogue v3 development v2 (superseded)

on:
  pull_request:
    branches:
      - agent/orbittrace-fixed4-support-normalized-wrapper-development
    paths:
      - orbittrace_wavelet_catalogue_v3/**
      - .github/workflows/orbittrace_wavelet_catalogue_v3_development_v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbittrace-wavelet-catalogue-v3-development-v2
  cancel-in-progress: true

jobs:
  superseded:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Superseded by orbittrace_wavelet_catalogue_v3_runtime_recovery.yml"
