name: OrbitTrace SonotaCo 2021 label eligibility audit

on:
  pull_request:
    branches:
      - agent/orbittrace-sparse-tail-augmentation-development
    paths:
      - .github/workflows/orbittrace_sonotaco_2021_label_eligibility_audit.yml
      - orbittrace_sparse_tail_augmentation/build_sonotaco_2021_confirmation_source.py
      - orbittrace_sparse_tail_augmentation/run_sonotaco_2021_label_eligibility_audit.py
      - orbittrace_literature_freeze/SONOTACO_2021_ARCHIVE_STRUCTURE_RESULT.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-sonotaco-2021-label-eligibility-audit
  cancel-in-progress: false

jobs:
  eligibility-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-sparse-tail-2021-source-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt

      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt

      - name: Verify frozen structure and score-free eligibility source
        run: |
          set -euo pipefail
          mkdir -p input output
          test "$(git hash-object orbittrace_sparse_tail_augmentation/build_sonotaco_2021_confirmation_source.py)" = "e3eee93f92c19739bfca05592799dae94ea3ede5"
          test "$(git hash-object orbittrace_sparse_tail_augmentation/run_sonotaco_2021_label_eligibility_audit.py)" = "12637f6f81580f522f7ddefdc89e6fdf785ff996"
          python -m py_compile \
            orbittrace_sparse_tail_augmentation/build_sonotaco_2021_confirmation_source.py \
            orbittrace_sparse_tail_augmentation/run_sonotaco_2021_label_eligibility_audit.py
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          structure = json.loads(Path('orbittrace_literature_freeze/SONOTACO_2021_ARCHIVE_STRUCTURE_RESULT.json').read_text())
          assert structure['verdict'] == 'PASS_SONOTACO_2021_ARCHIVE_STRUCTURE_AUDIT'
          assert structure['workflow_run'] == 31108504845
          assert structure['artifact_id'] == 8970617025
          assert structure['artifact_sha256'] == 'ae99029ad69e989380f0ed85e7c671cc303259fc74aed7a44e850dbc3e224455'
          assert structure['archive']['sha256'] == '8d58f089c4137e4de3994fedf57d10571a98e6f594535199fe30d5ec5f251efb'
          assert structure['annual_member']['sha256'] == 'adc4057714b6720a350d1dd965be558bb6a1bc9fa1db5c74a1c700ef70c7a8fc'
          assert structure['annual_member']['total_nonblank_rows'] == 41177
          assert not any(structure['prohibited_access'].values())

          source = Path('orbittrace_sparse_tail_augmentation/run_sonotaco_2021_label_eligibility_audit.py').read_text()
          tree = ast.parse(source)
          calls = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id)
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr)
          forbidden_calls = {
              'fixed4_score','score_all','wavelet_episode_score','target_hybrid_statistic',
              'augmented_score','sparse_tail_score','roc_auc_score','auc','rate'
          }
          assert not calls.intersection(forbidden_calls)
          assert 'parse_sonotaco_2021_events' in source
          assert 'sparse_tail_margin": 0.25' in source
          print('PASS_SCORE_FREE_2021_ELIGIBILITY_SOURCE_GUARD')
          PY

      - name: Retrieve validated 2023 parser source and frozen mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30920687116 \
            --repo "$GITHUB_REPOSITORY" \
            --name sonotaco-2023-confirmation-source-repair-v2 \
            --dir input/repaired
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/repaired/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -

      - name: Build and audit deterministic 2021 parser before label access
        run: |
          set -euo pipefail
          python orbittrace_sparse_tail_augmentation/build_sonotaco_2021_confirmation_source.py \
            --source-2023 input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            --output /tmp/run_sonotaco_2021_confirmation.py \
            | tee output/parser_build.txt
          python -m py_compile /tmp/run_sonotaco_2021_confirmation.py
          sha256sum /tmp/run_sonotaco_2021_confirmation.py | tee output/parser_source_sha256.txt
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/run_sonotaco_2021_confirmation.py').read_text()
          assert 'YEAR = 2021' in source
          assert 'CORPUS = "sonotaco-2021-sparse-tail-validation"' in source
          assert 'def parse_sonotaco_2021_events(' in source
          assert 'f"SNM2021:{row_index}"' in source
          assert '8d58f089c4137e4de3994fedf57d10571a98e6f594535199fe30d5ec5f251efb' in source
          assert 'adc4057714b6720a350d1dd965be558bb6a1bc9fa1db5c74a1c700ef70c7a8fc' in source
          assert 'EXPECTED_ROWS = 41_177' in source
          print('PASS_BUILT_2021_PARSER_SOURCE_AUDIT')
          PY

      - name: Download exact SonotaCo 2021 archive
        run: |
          curl --fail --location --retry 3 \
            --output input/021a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/021a.zip
          echo '8d58f089c4137e4de3994fedf57d10571a98e6f594535199fe30d5ec5f251efb  input/021a.zip' | sha256sum -c -

      - name: Execute label and episode eligibility audit without scoring
        run: |
          set -euo pipefail
          python orbittrace_sparse_tail_augmentation/run_sonotaco_2021_label_eligibility_audit.py \
            --archive input/021a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --confirmation-source /tmp/run_sonotaco_2021_confirmation.py \
            --output output

      - name: Enforce eligibility-only result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/sonotaco_2021_label_eligibility_audit.json').read_text())
          if result.get('verdict') != 'PASS_SONOTACO_2021_LABEL_ELIGIBILITY_AUDIT':
              raise SystemExit(f"unexpected verdict: {result.get('verdict')}")
          if any(result['prohibited_access'].values()):
              raise SystemExit('scientific scoring occurred during eligibility audit')
          if result['benchmark_constants']['sparse_tail_margin'] != 0.25:
              raise SystemExit('frozen margin changed')
          print(json.dumps(result, indent=2))
          PY

      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            orbittrace_sparse_tail_augmentation/PROTOCOL.md \
            orbittrace_literature_freeze/SONOTACO_2021_ARCHIVE_STRUCTURE_RESULT.json \
            orbittrace_sparse_tail_augmentation/build_sonotaco_2021_confirmation_source.py \
            orbittrace_sparse_tail_augmentation/run_sonotaco_2021_label_eligibility_audit.py \
            input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            input/audit.json input/021a.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          if [ -f /tmp/run_sonotaco_2021_confirmation.py ]; then
            sha256sum /tmp/run_sonotaco_2021_confirmation.py >> output/source_and_input_sha256.txt
          fi
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-sonotaco-2021-label-eligibility-audit
          path: output
          if-no-files-found: error
          retention-days: 90
