name: GhostStream NOP static population audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ghoststream_static_population_stage0/**
      - .github/workflows/ghoststream_static_population_stage0.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ghoststream-static-population-stage0
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CANDIDATE_ARTIFACT_ID: '8814798136'
      CANDIDATE_ARTIFACT_SHA256: '716b70313465d5df4bfb092a85a81680e6f618606b71e25470c63c480b6449f5'
      REAL_SHOWER_ARTIFACT_ID: '8871850235'
      REAL_SHOWER_ARTIFACT_SHA256: '5f2501b3eee19b51a5dc81f8493dce67a810ef5c480045dac143de060369534d'
      NOP_ARTIFACT_ID: '8875235491'
      NOP_ARTIFACT_SHA256: '978e59f2e6b9c63644b0640d21662ab56307633da25d298bbb4d870dfb897ab7'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-static-population-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ghoststream_static_population_stage0/requirements.txt
      - name: Install frozen dependency
        run: python -m pip install --upgrade pip -r ghoststream_static_population_stage0/requirements.txt
      - name: Download exact evidence artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ghoststream_static_population_stage0/input/candidate_outer \
                   ghoststream_static_population_stage0/input/candidate \
                   ghoststream_static_population_stage0/input/real \
                   ghoststream_static_population_stage0/input/nop \
                   ghoststream_static_population_stage0/results
          for spec in \
            "candidate:${CANDIDATE_ARTIFACT_ID}:${CANDIDATE_ARTIFACT_SHA256}" \
            "real:${REAL_SHOWER_ARTIFACT_ID}:${REAL_SHOWER_ARTIFACT_SHA256}" \
            "nop:${NOP_ARTIFACT_ID}:${NOP_ARTIFACT_SHA256}"
          do
            IFS=: read -r name artifact_id expected_sha <<< "${spec}"
            curl --fail-with-body -L \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "ghoststream_static_population_stage0/input/${name}_artifact.zip"
            echo "${expected_sha}  ghoststream_static_population_stage0/input/${name}_artifact.zip" | sha256sum -c -
          done
          unzip -q ghoststream_static_population_stage0/input/candidate_artifact.zip \
            -d ghoststream_static_population_stage0/input/candidate_outer
          bundle="$(find ghoststream_static_population_stage0/input/candidate_outer -name 'GhostStream_Expert_Review_Bundle.zip' -print -quit)"
          test -n "${bundle}"
          unzip -q "${bundle}" -d ghoststream_static_population_stage0/input/candidate
          unzip -q ghoststream_static_population_stage0/input/real_artifact.zip \
            -d ghoststream_static_population_stage0/input/real
          unzip -q ghoststream_static_population_stage0/input/nop_artifact.zip \
            -d ghoststream_static_population_stage0/input/nop
          test -s ghoststream_static_population_stage0/input/real/selected_events.jsonl.gz
          test -s ghoststream_static_population_stage0/input/real/audit.json
          test -s ghoststream_static_population_stage0/input/nop/combined_source_matched_orbits.csv
          test "$(find ghoststream_static_population_stage0/input/candidate -name 'april_candidate_members.csv' | wc -l)" -eq 1
      - name: Compile verified launcher
        run: python -m py_compile ghoststream_static_population_stage0/run_static_population.py
      - name: Run frozen static classifier gate
        shell: bash
        run: |
          set -o pipefail
          python ghoststream_static_population_stage0/run_static_population.py \
            --candidate-root ghoststream_static_population_stage0/input/candidate \
            --real-events ghoststream_static_population_stage0/input/real/selected_events.jsonl.gz \
            --real-audit ghoststream_static_population_stage0/input/real/audit.json \
            --nop-orbits ghoststream_static_population_stage0/input/nop/combined_source_matched_orbits.csv \
            --output ghoststream_static_population_stage0/results \
            2>&1 | tee ghoststream_static_population_stage0/results/execution.log
      - name: Record provenance
        if: always()
        run: |
          sha256sum \
            ghoststream_static_population_stage0/run_static_population.py \
            ghoststream_static_population_stage0/run_static_population.py.gz.b64 \
            ghoststream_static_population_stage0/STATIC_GATE.md \
            ghoststream_static_population_stage0/requirements.txt \
            > ghoststream_static_population_stage0/results/source_sha256.txt
          sha256sum \
            ghoststream_static_population_stage0/input/candidate_artifact.zip \
            ghoststream_static_population_stage0/input/real_artifact.zip \
            ghoststream_static_population_stage0/input/nop_artifact.zip \
            ghoststream_static_population_stage0/input/real/selected_events.jsonl.gz \
            ghoststream_static_population_stage0/input/real/audit.json \
            ghoststream_static_population_stage0/input/nop/combined_source_matched_orbits.csv \
            > ghoststream_static_population_stage0/results/input_sha256.txt
          python --version > ghoststream_static_population_stage0/results/python_version.txt
          python -m pip freeze > ghoststream_static_population_stage0/results/environment.txt
      - name: Upload static classification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-nop-static-population-audit
          path: ghoststream_static_population_stage0/results
          if-no-files-found: error
          retention-days: 90
