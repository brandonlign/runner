name: OrbitTrace P18 MAARSY external addendum source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - orbittrace_p17_rank_halo_membership_p18/P18_MAARSY_2020_2021_EXTERNAL_ADDENDUM.md
      - .github/workflows/orbittrace_p18_maarsy_external_addendum_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove P18 MAARSY reservation preserves the preregistered panel, gates, fail-closed closure, and target firewall
        run: |
          set -euo pipefail
          proto=orbittrace_p17_rank_halo_membership_p18/P18_PROTOCOL.md
          ext=orbittrace_p17_rank_halo_membership_p18/P18_MAARSY_2020_2021_EXTERNAL_ADDENDUM.md
          test "$(git hash-object "$proto")" = '44357f1be4f62827002e188f3581e6ed4e513e8c'
          for x in \
            'MAARSY 2020 and 2021' \
            'f563ca63e169e6ddfe846219d8f00384f3451797' \
            'bbf71f190ca128e3e24f71900fefbd1472cdacb6' \
            '31325401462' \
            '3e0bcc3db805f60310ec9b01d6d48f76b29544780119c05e71fc225c04e3fe48' \
            '10,000 events per bin' \
            'EPISODE_SIZE=128' \
            'MIN_DIRECTION_NEGATIVES=128' \
            'CHARACTERIZATION_UNAVAILABLE_INSUFFICIENT_NEGATIVES' \
            'missing reciprocal reliability is represented as false' \
            'at least 5 truth labels with at least 4 usable events in each year and at least 5 recurrent cores' \
            'POWER_INCONCLUSIVE_MAARSY_2020_2021' \
            'at least 0.08' \
            'at least 1.5 times immutable core recall' \
            'exact halo precision must be at least 0.85' \
            '31332157812' '9043232586' \
            'c0c39d1bd660efbe5e5353b5a33185428a6f60f4a3759be3acd16a15a063012a' \
            '31331471689' '9043046136' \
            'PASS_P18_MATCHED_SPARSE_SUPERIORITY_BOTH_COMPARATORS_BOTH_YEARS' \
            'PASS_P18_MAARSY_2020_2021_NO_RETUNING_EXTERNAL' \
            'FAIL_P18_MAARSY_2020_2021_NO_RETUNING_EXTERNAL' \
            'ARCHITECTURE_INCOMPATIBLE' \
            'authorizes no OrbitTrace target access'; do
            grep -F "$x" "$ext"
          done
          grep -F 'P18 is the **sole primary literature challenger**' "$proto"
          grep -F 'family existence and support-safe multiplicity rank remain immutable P14/P17 core-only' "$proto" || true
          # Protocol-only: no executable data-fetch or activation surface is permitted here.
          if grep -Eq '(^|[^A-Za-z])(curl|wget|gh run download|requests\.get|h5py|numpy\.load|np\.load)([^A-Za-z]|$)|EXECUTE_P18|MATCHED_EVALUATOR_RUN|EXTERNAL_RUN' "$ext"; then
            echo 'executable/data-access surface leaked into P18 external addendum' >&2
            exit 1
          fi
          test ! -e orbittrace_p17_rank_halo_membership_p18/P18_MAARSY_EXTERNAL_RUN.md
          echo PASS_P18_MAARSY_EXTERNAL_ADDENDUM_SOURCE_FREEZE_BEFORE_MATCHED_TRUTH
          echo NO_MATCHED_RESULT_NO_MAARSY_EVENT_VALUES_NO_TARGET_ACCESS
