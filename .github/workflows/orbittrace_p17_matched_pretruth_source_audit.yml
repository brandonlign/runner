name: OrbitTrace P17 matched pretruth launcher source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - orbittrace_reciprocal_support_closure_p17/generate_matched_pretruth_p17.py
      - .github/workflows/orbittrace_p17_matched_pretruth.yml
      - .github/workflows/orbittrace_p17_matched_pretruth_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Prove final P17 launcher is exact-source, development-gated, and pretruth-only
        run: |
          set -euo pipefail
          gen=orbittrace_reciprocal_support_closure_p17/generate_matched_pretruth_p17.py
          wf=.github/workflows/orbittrace_p17_matched_pretruth.yml
          python -m py_compile "$gen" \
            orbittrace_reciprocal_support_closure_p17/apply_p17_reciprocal_support_closure.py \
            orbittrace_reciprocal_support_closure_p17/augment_pretruth_checkpoint_p17.py
          test "$(git hash-object "$gen")" = 'f59ce54b5ba7321332372f6aa4a0032b7297275c'
          test "$(git hash-object orbittrace_reciprocal_support_closure_p17/apply_p17_reciprocal_support_closure.py)" = '60d371b46d330ccbd59a08598fd36be88881c23d'
          test "$(git hash-object orbittrace_reciprocal_support_closure_p17/adjudicate_p17_development_vacuity.py)" = '5400c522b60dfaec7afcb803859b829e8582b279'
          test "$(git hash-object orbittrace_reciprocal_support_closure_p17/augment_pretruth_checkpoint_p17.py)" = '89a2e408aca91261eb5c5e1d5e5a5490d7e50b1e'
          test "$(git hash-object orbittrace_support_safe_halo_p15/generate_matched_pretruth_p15_v2.py)" = 'fc4bc35019e08d4a9ed08fba9fcf1b0e5c490032'
          test "$(git hash-object orbittrace_core_halo_p13_literature/run_p13_matched_launcher_v3.sh)" = '1fb46484a51bb7d7edd60c865dcf5341550277a1'

          python "$gen" orbittrace_core_halo_p13_literature/run_p13_matched_launcher_v3.sh /tmp/p17_pretruth.sh
          bash -n /tmp/p17_pretruth.sh
          for x in \
            'PASS_P15_OUTER_ONE_FILE_ACTIVATION_ALREADY_VERIFIED' \
            'PASS_P15_MATCHED_SUPPORT_SAFE_HALO_SOURCE_ACTIVE' \
            'PASS_P17_MATCHED_SOURCE_ACTIVE' \
            'P17_OUTPUT_SHA256=c0c39d1bd660efbe5e5353b5a33185428a6f60f4a3759be3acd16a15a063012a' \
            'P17_SCOPE=represent P15-unavailable reciprocal explicitly; missing reciprocal reliability is fail-closed false; no P12 threshold/model/geometry/rank/proposal change' \
            "assert c['p13_transport_source_sha256']=='55a1efed550498d51b859ffec555797ba8473d7d8b5f20ad6831c5f15b43b415'" \
            "assert c['p13_transport_parent_source_sha256']=='f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae'" \
            "assert c['p14_p12_snm_id_transport_scientific_delta'] is False" \
            'PASS_P14_BOTH_MATCHED_CHECKPOINTS_FROZEN_BEFORE_TRUTH_OR_CLUSTER_VALUES' \
            'fetch_exact_assignment_artifact 9012424187' \
            'fetch_exact_assignment_artifact 8955917326' \
            'fetch_exact_assignment_artifact 8957940764' \
            'fetch_exact_assignment_artifact 8957263372' \
            'prepare_strict_id_manifest.py' \
            'PASS_P14_DIRECT_ASSIGNMENT_IDS_FROZEN_CLUSTER_VALUES_UNREAD' \
            'exit 0'; do grep -F "$x" /tmp/p17_pretruth.sh; done
          if grep -Fq "assert c['p13_transport_source_sha256']=='f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae'" /tmp/p17_pretruth.sh; then
            echo 'obsolete P13 transport source equality survived P17 technical repair' >&2
            exit 1
          fi
          for x in \
            '31332157812' '9043232586' \
            'sha256:f89e1330da616e4224bec063e82194042f6e5625cf02cf851f8d6e511d408852' \
            'cac4c68e329ad06a802fbdc5ab12b7526f64720065000d5b3c094c49d57eb5dd' \
            'PASS_P17_RECIPROCAL_SUPPORT_CLOSURE_DEVELOPMENT_VACUITY' \
            'c0c39d1bd660efbe5e5353b5a33185428a6f60f4a3759be3acd16a15a063012a' \
            'p17_reciprocal_closure_frozen_before_truth' \
            'p17_fail_closed_no_proposals' \
            'orbittrace-p17-matched-pretruth-checkpoints'; do grep -F "$x" "$wf"; done

          # All four assignment artifacts are inherited, preregistered row-universe inputs.
          # The only pretruth consumer is prepare_strict_id_manifest.py, and the inherited
          # barrier explicitly certifies cluster values remain unread. The generated shell
          # must contain no postfreeze truth/evaluator stage, external panel, or target surface.
          test "$(grep -Fc 'fetch_exact_assignment_artifact ' /tmp/p17_pretruth.sh)" -eq 4
          for forbidden in \
            'evaluate_frozen_blindsafe.py' 'finalize_p3_evaluator_result.py' \
            'OPEN TRUTH + COMPETITOR CLUSTER VALUES EXACTLY ONCE' \
            "progress 'POSTFREEZE TRUTH PARSERS + EVALUATOR SOURCE'" \
            'MAARSY' 'OrbitTrace-April' 'target_coordinate'; do
            if grep -Fq "$forbidden" /tmp/p17_pretruth.sh; then
              echo "posttruth/external/target surface leaked into generated P17 shell: $forbidden" >&2
              exit 1
            fi
          done
          for sentinel in 'evaluate_frozen_blindsafe.py' 'finalize_p3_evaluator_result.py' 'OrbitTrace-April' 'target_coordinate'; do
            test "$(grep -Fc "$sentinel" "$wf")" -eq 1
          done
          test ! -e orbittrace_reciprocal_support_closure_p17/MATCHED_PRETRUTH_RUN.md
          echo PASS_P17_MATCHED_PRETRUTH_LAUNCHER_WITH_AUDITED_TRANSPORT_PROVENANCE_BARRIER
          echo P17_SCIENTIFIC_SOURCE_UNCHANGED_TECHNICAL_BARRIER_ONLY
          echo NO_COMPARATOR_CLUSTER_VALUES_NO_KNOWN_SHOWER_TRUTH_NO_EXTERNAL_NO_TARGET_ACCESS
