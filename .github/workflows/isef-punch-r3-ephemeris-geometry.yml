name: ISEF PUNCH R3 ephemeris geometry
on:
  push:
    branches: [main]
    paths:
      - 'isef/punch_r3_ephemeris_geometry.py'
      - '.github/workflows/isef-punch-r3-ephemeris-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install astropy astroquery
      - name: Generate frozen Horizons geometry
        run: python isef/punch_r3_ephemeris_geometry.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-punch-r3-ephemeris-geometry
          path: results/punch_r3_ephemeris_geometry/
          if-no-files-found: error
