name: OrbitTrace recurrent local TopoModal trunk v1 import repair

on:
  push:
    branches: [agent/orbittrace-recurrent-local-topomodal-trunk-v1-activate]
    paths:
      - '.github/workflows/orbittrace_recurrent_local_topomodal_trunk_v1_import_repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  binding:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 312b1b718ae105813de242355142a74e7d377d65
          path: sparse-src

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Audit unchanged science and install exact runtime
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/PROTOCOL.md)" = 'de8d040a1f9d3b0825ce56532efd5950acefc689'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py)" = '32abfb3e68520cfdc83585a88731fa3982900cde'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/build_prelabel.py)" = 'cd3fb15263fd4b2e38e4b413ece9b347b64816d5'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/evaluate_truth.py)" = '749a527b7a9ee3c5f1a70832669d83fa1af592d7'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/PROTOCOL.md)" = '1187cbba37372c834bdbbf7eb05b1f7c31f8dcf9'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/run_development.py)" = '157813ca331165180a6d20aa71bfc78d5984396f'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          python -m py_compile orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py orbittrace_recurrent_local_topomodal_trunk_v1/build_prelabel.py orbittrace_recurrent_local_topomodal_trunk_v1/evaluate_truth.py
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/v3 input/ranker input/v8 input/parent output/geometry output/prelabel output/truth output/provenance
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852836840

      - name: Rebind immutable scientific inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json | cut -d' ' -f1)" = 'efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = 'ca6aeed2b82739003ea5d39b59e869df876de2962164344a938fe4935ea38711'
          python - <<'PY'
          import json
          p=json.load(open('input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json'))
          r=json.load(open('input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json'))
          assert p['scientific_role']=='PRELABEL_FROZEN_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1'
          assert p['events_total']==738682 and p['events_by_year']=={'2022':315024,'2023':423658}
          assert p['successor_candidate_count']==2094
          assert p['successor_ordered_membership_sha256']=='e8f374ad03e7072463118ee6440a54d96d11e3aab17202cfe336f866530224f2'
          assert r['verdict']=='PASS_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT'
          assert r['prelabel_sha256']=='efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          PY

      - name: Export label-free target-excluded GMN geometry
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:sparse-src
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json

      - name: Build and seal frozen local-trunk membership prelabel
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/build_prelabel.py \
            --protocol orbittrace_recurrent_local_topomodal_trunk_v1/PROTOCOL.md \
            --geometry output/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json \
            --parent-prelabel input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --parent-result input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            --output output/prelabel/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json
          sha256sum output/prelabel/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json | tee output/prelabel/PRELABEL_SHA256.txt
          python - <<'PY'
          import json
          p=json.load(open('output/prelabel/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json'))
          assert p['scientific_role']=='PRELABEL_TARGET_EXCLUDED_FIXED_RANK_MEMBERSHIP_REPRESENTATION'
          assert p['shower_truth_used'] is False
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert p['parent_candidate_count']==p['successor_candidate_count']==2094
          assert p['catalogue_slot_order_unchanged'] is True
          assert p['every_successor_subset_of_same_rank_parent'] is True
          assert p['successor_slots_pairwise_event_disjoint'] is True
          print({'changed_slot_count':p['changed_slot_count'],'successor_ordered_membership_sha256':p['successor_ordered_membership_sha256']})
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-recurrent-local-topomodal-trunk-v1-prelabel-import-repair
          path: output/prelabel
          if-no-files-found: error
          retention-days: 90

      - name: Remove mutable prelabel copy before truth
        run: |
          set -euo pipefail
          rm -rf input/frozen-prelabel
          mkdir -p input/frozen-prelabel
          rm -f output/prelabel/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-local-topomodal-trunk-v1-prelabel-import-repair
          path: input/frozen-prelabel

      - name: Rebind uploaded prelabel artifact
        run: |
          set -euo pipefail
          expected="$(cut -d' ' -f1 output/prelabel/PRELABEL_SHA256.txt)"
          got="$(sha256sum input/frozen-prelabel/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json | cut -d' ' -f1)"
          test "$got" = "$expected"
          echo "$got" > output/provenance/binding_prelabel_sha256.txt

      - name: Run first technically valid truth evaluation against immutable prelabel
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:sparse-src
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/evaluate_truth.py \
            --prelabel input/frozen-prelabel/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json \
            --parent-prelabel input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --parent-result input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_BINDING_RESULT.json

      - name: Enforce binding result shape and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/truth/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_BINDING_RESULT.json'))
          assert r['verdict'] in {'PASS_RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1','FAIL_RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1'}
          assert r['total_gate_count']==16 and len(r['gates'])==16
          assert r['binding_retrieval_metric']=='zero_filled_eligible_query_mrr'
          assert r['historical_conditional_mrr_is_diagnostic_only'] is True
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_2013_2014_access'] is False
          assert r['asfn_event_level_access'] is False and r['efn_event_level_access'] is False
          assert r['amos_scientific_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['post_result_parameter_search'] is False
          print(r['verdict'])
          print(json.dumps({'passed_gate_count':r['passed_gate_count'],'changed_slot_count':r['changed_slot_count'],'parent_metrics':{y:{k:v for k,v in m.items() if k!='first_rank_by_label'} for y,m in r['parent_metrics'].items()},'successor_metrics':{y:{k:v for k,v in m.items() if k!='first_rank_by_label'} for y,m in r['successor_metrics'].items()},'annual_gates':r['annual_gates'],'global_gates':r['global_gates']},indent=2,sort_keys=True))
          PY

      - name: Preserve binding provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/provenance/execution_commit.txt
          git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/PROTOCOL.md > output/provenance/protocol_blob.txt
          git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py > output/provenance/export_geometry_blob.txt
          git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/build_prelabel.py > output/provenance/build_prelabel_blob.txt
          git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/evaluate_truth.py > output/provenance/evaluate_truth_blob.txt
          git hash-object input/v3/multi_anchor_energy_v3.py > output/provenance/multi_anchor_energy_v3_blob.txt
          python --version > output/provenance/python_version.txt
          python -m pip freeze > output/provenance/environment.txt
          sha256sum orbittrace_recurrent_local_topomodal_trunk_v1/PROTOCOL.md orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py orbittrace_recurrent_local_topomodal_trunk_v1/build_prelabel.py orbittrace_recurrent_local_topomodal_trunk_v1/evaluate_truth.py input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json input/frozen-prelabel/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json output/truth/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_BINDING_RESULT.json > output/provenance/binding_provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-local-topomodal-trunk-v1-binding-import-repair
          path: output
          if-no-files-found: error
          retention-days: 90
