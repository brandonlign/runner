name: OrbitTrace specific-M2D antichain v1 pretruth

on:
  pull_request:
    branches: [agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1]
    paths:
      - 'orbittrace_m2d_specific_antichain_v1/**'
      - '.github/workflows/orbittrace_m2d_specific_antichain_v1_pretruth.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-m2d-recursive-evidence-cut-v1
          path: recursive-src
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          test "$(git hash-object orbittrace_m2d_specific_antichain_v1/PROTOCOL.md)" = '3d4f705db5c9fd0de94fcb96c9353fe5f0a6a36a'
          test "$(git hash-object orbittrace_m2d_specific_antichain_v1/build_gmn_pretruth.py)" = 'e4103c587a67ac8a4ba473ac49985ea17fb00f40'
          test "$(git -C recursive-src hash-object orbittrace_m2d_recursive_evidence_cut_v1/build_gmn_pretruth.py)" = 'f0c34d1f4d0fde5e957352dd89aeb93a5dcbf156'
          python -m py_compile orbittrace_m2d_specific_antichain_v1/build_gmn_pretruth.py recursive-src/orbittrace_m2d_recursive_evidence_cut_v1/build_gmn_pretruth.py
          mkdir -p input/v3 input/v8 input/ranker input/structural input/bif input/baseline output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-active-urc-ranker-source-export-v1, path: input/ranker, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31344632499}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-pooled-year-centroid-v8-development, path: input/v8, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31217916558}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-hierarchy-scale-v1, path: input/structural, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31955621864}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-annual-density-bifiltration-gmn-ranking-v1-prelabel, path: input/bif, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 32037435314}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-support-cut-bifiltration-internal-mass-v1, path: input/baseline, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 32041661731}
      - name: Verify immutable inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json | cut -d' ' -f1)" = 'e8cf7d92e96db9a1c99578f6efc63baf1534b94ab975e94f789fa6bc4a718497'
          test "$(sha256sum input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json | cut -d' ' -f1)" = '95f8a57718a30b2c7e85016d505276d72cccb9e4ac1d6eb29f13067efc73dd0c'
          test "$(sha256sum input/baseline/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json | cut -d' ' -f1)" = '7b1ddfcd32cd0b52321e3b3dfc614a88dd9b973f947c1d4d0de74fddf26b59cd'
      - name: Build truth-free specific-M2D antichain
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_specific_antichain_v1/build_gmn_pretruth.py \
            --recursive-builder recursive-src/orbittrace_m2d_recursive_evidence_cut_v1/build_gmn_pretruth.py \
            --structural-runner orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --structural-result-json input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --baseline-m2d-prelabel input/baseline/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json \
            --bif-prelabel input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json \
            --output output/M2D_SPECIFIC_ANTICHAIN_V1_PRETRUTH.json
      - name: Seal before truth and record structural gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='output/M2D_SPECIFIC_ANTICHAIN_V1_PRETRUTH.json'; r=json.load(open(p))
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_SPECIFIC_M2D_ANTICHAIN_FROZEN_BEFORE_TRUTH'
          assert r['shower_truth_used'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False and r['sonotaco_scientific_access'] is False
          assert r['configuration']['new_tuned_parameters']==[] and r['post_result_parameter_search'] is False and r['total_rejected_broad_ancestor_count']>0
          b=r['global_size_summary']['baseline']; x=r['global_size_summary']['refined']; g={'mean_strictly_lower':x['mean_member_count']<b['mean_member_count'],'p90_strictly_lower':x['p90_member_count']<b['p90_member_count'],'max_strictly_lower':x['max_member_count']<b['max_member_count']}; r['structural_promotion_gates']=g
          open(p,'w').write(json.dumps(r,separators=(',',':'),sort_keys=True)+'\n'); raw=open(p,'rb').read(); h=hashlib.sha256(raw).hexdigest(); open('output/PRETRUTH_SHA256.txt','w').write(h+'  M2D_SPECIFIC_ANTICHAIN_V1_PRETRUTH.json\n'); print('SEALED',h); print(json.dumps({'sizes':r['global_size_summary'],'gates':g,'rejections':r['total_overlap_rejection_count'],'broad':r['total_rejected_broad_ancestor_count']},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: orbittrace-m2d-specific-antichain-v1-pretruth, path: output, if-no-files-found: error, retention-days: 90}
