name: OrbitTrace GMN thinning family-stability diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - 'orbittrace_gmn_thinning_family_stability_diagnostic_v1/**'
      - '.github/workflows/orbittrace_gmn_thinning_family_stability_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-gmn-thinning-family-stability-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 63dc5b552d5217601003f738996477fb019ff7c8
          path: active-ranker
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact runtime and reconstruct frozen source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          mkdir -p input/v3 input/v8 input/p19 input/p20 input/panels/{A10,B10,C20,D20} output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          base64 -d active-ranker/orbittrace_urc_union_ranking_lab_v1/run_lab.py.gz.b64 | gzip -dc > /tmp/run_urc_union.py
          test "$(sha256sum /tmp/run_urc_union.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          python -m py_compile orbittrace_gmn_thinning_family_stability_diagnostic_v1/run_diagnostic.py /tmp/run_urc_union.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p20-recurrent-isolated-quartet-development
          path: input/p20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31341591263
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-urc-generator-stress-A10
          path: input/panels/A10
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31343277893
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-urc-generator-stress-B10
          path: input/panels/B10
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31343277893
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-urc-generator-stress-C20
          path: input/panels/C20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31343277893
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-urc-generator-stress-D20
          path: input/panels/D20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31343277893
      - name: Verify immutable base artifacts
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/p19/p19_subthreshold_reciprocal_recurrence_development.json | cut -d' ' -f1)" = '6f1ad0626b8a8bda03f18e7f3435f0651af8bebf65cfd1d970a6b61a8ba52319'
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
          test "$(sha256sum input/p20/p20_recurrent_isolated_quartet_development.json | cut -d' ' -f1)" = '9ec53f29281b11002a9e22b1086d12e054392e466ea74fe82ead0187289ba303'
          test "$(sha256sum input/p20/p20_prelabel_payload.json | cut -d' ' -f1)" = '8ca358ae0f3ac96b188de9eac7bcfd6f870470873a2b7ee73b7ae76497c12734'
      - name: Run target-excluded GMN stability diagnostic
        env:
          PYTHONPATH: active-ranker:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_thinning_family_stability_diagnostic_v1/run_diagnostic.py \
            --active-ranker-source /tmp/run_urc_union.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p19-result-json input/p19/p19_subthreshold_reciprocal_recurrence_development.json \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --p20-result-json input/p20/p20_recurrent_isolated_quartet_development.json \
            --p20-prelabel-json input/p20/p20_prelabel_payload.json \
            --panel-root input/panels \
            --output output
      - name: Enforce firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/GMN_THINNING_FAMILY_STABILITY_DIAGNOSTIC_V1.json'))
          assert r['agreement_radius']==1.0
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['original_counts']=={'hard':226,'p19':1075,'p20':3203}
          assert r['sonotaco_2013_2014_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_gmn_thinning_family_stability_diagnostic_v1/PROTOCOL.md orbittrace_gmn_thinning_family_stability_diagnostic_v1/run_diagnostic.py /tmp/run_urc_union.py > output/source_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/diagnostic_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-thinning-family-stability-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
