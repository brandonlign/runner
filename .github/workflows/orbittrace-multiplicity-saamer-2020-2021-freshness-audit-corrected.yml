name: OrbitTrace multiplicity SAAMER 2020-2021 corrected repo freshness audit

on:
  pull_request:
    branches:
      - agent/orbittrace-multiplicity-saamer-2020-2021-freshness-audit
    paths:
      - 'orbittrace_multiplicity_saamer_2020_2021_freshness_audit/RUN2.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all remote branch refs
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Run corrected history-only audit
        run: |
          set -euo pipefail
          test ! -e input
          python orbittrace_multiplicity_saamer_2020_2021_freshness_audit/audit_history_corrected.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/saamer_2020_2021_repo_freshness_audit_corrected.json').read_text())
          assert r['verdict']=='PASS_SAAMER_2020_2021_REPO_SCIENTIFIC_FRESHNESS_AUDIT'
          assert r['candidate_years']==[2020,2021]
          assert r['potential_exposure_hit_count']==0
          assert r['literature_citation_only_count']==1
          assert r['catalogue_access_this_audit'] is False
          assert r['scientific_value_access_this_audit'] is False
          assert r['label_access_this_audit'] is False
          assert r['target_information_access'] is False
          assert r['positive_controls']['edmond_2017_spent_detected'] is True
          assert r['positive_controls']['sonotaco_2023_spent_detected'] is True
          PY
      - name: Record correction provenance
        run: |
          git rev-parse HEAD > output/audit_commit.txt
          sha256sum \
            orbittrace_multiplicity_saamer_2020_2021_freshness_audit/audit_history.py \
            orbittrace_multiplicity_saamer_2020_2021_freshness_audit/audit_history_corrected.py \
            orbittrace_multiplicity_saamer_2020_2021_freshness_audit/AUDIT_CORRECTION.md > output/audit_source_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-multiplicity-saamer-2020-2021-freshness-audit-corrected
          path: output
          if-no-files-found: error
          retention-days: 90
