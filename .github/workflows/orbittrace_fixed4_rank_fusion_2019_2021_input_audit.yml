name: OrbitTrace fixed4 rank-fusion 2019-2021 input audit

on:
  pull_request:
    branches:
      - agent/orbittrace-fixed4-rank-fusion-prospective-source-audit
    paths:
      - orbittrace_fixed4_rank_fusion/audit_2019_2021_input.py
      - orbittrace_fixed4_rank_fusion/FROZEN_DEVELOPMENT_RESULT.json
      - .github/workflows/orbittrace_fixed4_rank_fusion_2019_2021_input_audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbittrace-fixed4-rank-fusion-2019-2021-input-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-fixed4-rank-fusion-2019-2021-input-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact scanner dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Verify score-free source and frozen development result
        run: |
          set -euo pipefail
          mkdir -p output
          test "$(git hash-object orbittrace_fixed4_rank_fusion/audit_2019_2021_input.py)" = "72c145d3ef1321d8d46dd3193f9e511dce086c61"
          python -m py_compile orbittrace_fixed4_rank_fusion/audit_2019_2021_input.py
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          development = json.loads(Path('orbittrace_fixed4_rank_fusion/FROZEN_DEVELOPMENT_RESULT.json').read_text())
          assert development['verdict'] == 'PASS_PERSISTENCE_ANCHORED_RANK_FUSION_DEVELOPMENT'
          assert development['selected_weight'] == 0.02
          assert development['prospective_years_reserved'] == [2019, 2020, 2021]

          source = Path('orbittrace_fixed4_rank_fusion/audit_2019_2021_input.py').read_text()
          tree = ast.parse(source)
          calls = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id)
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr)
          forbidden = {
              'scan_year','scores_for_episode','quartet_score','component_records','build_families',
              'rank_families','evaluate_panel','develop_wrapper'
          }
          assert not calls.intersection(forbidden)
          assert 'YEARS = (2019, 2020, 2021)' in source
          assert 'BLIND_INTERVAL = (20.0, 55.0)' in source
          assert 'f"{year}-{month:02d}"' in source
          print('PASS_SCORE_FREE_2019_2021_INPUT_SOURCE_GUARD')
          PY

      - name: Execute target-excluded input and eligibility audit
        run: |
          set -euo pipefail
          python orbittrace_fixed4_rank_fusion/audit_2019_2021_input.py \
            --scanner-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --output output
          cat output/FIXED4_RANK_FUSION_2019_2021_INPUT_AUDIT.md

      - name: Enforce score-free audit result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/fixed4_rank_fusion_2019_2021_input_audit.json').read_text())
          if result.get('verdict') != 'PASS_FIXED4_RANK_FUSION_2019_2021_INPUT_AUDIT':
              raise SystemExit(f"input audit failed: {result.get('verdict')}")
          if any(result['prohibited_access'].values()):
              raise SystemExit('prohibited prospective scientific access occurred')
          if result['configuration']['years'] != [2019, 2020, 2021]:
              raise SystemExit('prospective years changed')
          if result['configuration']['frozen_rank_fusion_weight'] != 0.02:
              raise SystemExit('fusion weight changed')
          print(json.dumps({
              'verdict': result['verdict'],
              'scan_event_counts': result['scan_event_counts'],
              'calibration_event_counts': result['calibration_event_counts'],
              'eligible_shower_count': result['eligible_shower_count'],
              'gates': result['gates'],
          }, indent=2))
          PY

      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            orbittrace_fixed4_rank_fusion/audit_2019_2021_input.py \
            orbittrace_fixed4_rank_fusion/FROZEN_DEVELOPMENT_RESULT.json \
            orbittrace_fixed4_support_wrapper_development/source_parts/part00.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part01.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part02.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part03.b64 \
            sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            > output/source_and_input_sha256.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-fixed4-rank-fusion-2019-2021-input-audit
          path: output
          if-no-files-found: error
          retention-days: 90
