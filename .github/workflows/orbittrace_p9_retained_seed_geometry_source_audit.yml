name: OrbitTrace P9 retained-seed geometry source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p8-full-finite-sample-order-stat-freeze
    paths:
      - orbittrace_retained_seed_geometry_p9/**
      - .github/workflows/orbittrace_p9_retained_seed_geometry_source_audit.yml
      - .github/workflows/orbittrace_p9_retained_seed_geometry_development.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact lineage and audit fully pinned P9 freeze
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2_v1.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2_v1.py /tmp/p2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2.py' | sha256sum -c -
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          echo 'f6c4c5a76b8b3f35d434aed4f1fb15035be05c40d0e0531c343ff620f3ba8185  /tmp/p3.py' | sha256sum -c -
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          echo '290c4f1b6401eaab6f182760eaeaa2f91cc994854febf465f58f7cacc5d73b2a  /tmp/p4.py' | sha256sum -c -
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          echo 'b48b3e6a45a7a371eb8e73c70ee217a33a96c596c61b51ebb7dc9c7b60100456  /tmp/p5.py' | sha256sum -c -
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          echo 'd32648136b58e2f777912d6403d9de3cbd091a8c23e16aedcda0b146f09f38c2  /tmp/p6.py' | sha256sum -c -
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          echo '89cf23c9d58692aedfaf12a9c2b7de4a08d641e6326794d82872f2e18608df54  /tmp/p7.py' | sha256sum -c -
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          echo 'd3bdcdaf18639e36cc02f5106b3a3c816f5e51eb19543f425717ba1c48a26470  /tmp/p8.py' | sha256sum -c -
          python orbittrace_retained_seed_geometry_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          expected="$(tr -d '[:space:]' < orbittrace_retained_seed_geometry_p9/SOURCE_SHA256)"
          test "$expected" = '646fc9f253b288d1c0096a794b4d38885245ca35f8f248fb3a3d2927ce9edc7b'
          echo "$expected  /tmp/p9.py" | sha256sum -c -
          python -m py_compile /tmp/p9.py orbittrace_retained_seed_geometry_p9/run_header_compatible.py

          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p9.py').read_text()
          protocol=Path('orbittrace_retained_seed_geometry_p9/PROTOCOL.md').read_text()
          wrapper=Path('orbittrace_retained_seed_geometry_p9/run_header_compatible.py').read_text()
          workflow=Path('.github/workflows/orbittrace_p9_retained_seed_geometry_development.yml').read_text()
          assert Path('orbittrace_retained_seed_geometry_p9/SOURCE_SHA256').read_text().strip()=='646fc9f253b288d1c0096a794b4d38885245ca35f8f248fb3a3d2927ce9edc7b'
          for token in (
              'geometry_retained_seed_mask = np.asarray(pp >= membership_floor, dtype=bool)',
              'geometry_retained_seed_rows = np.asarray(xp[geometry_retained_seed_mask], dtype=np.float64)',
              'geometry_retained_seed_probabilities = np.asarray(pp[geometry_retained_seed_mask], dtype=np.float64)',
              'for seed_row in geometry_retained_seed_rows:',
              'np.all(geometry_retained_seed_rows >= seed_row[None, :], axis=1)',
              'p9_geometry_retained_seed_count','p9_geometry_dropped_seed_count',
              'p9_geometry_uses_only_p8_retained_seeds','p9_rank_one_geometry_unchanged',
              'p9_every_surviving_proposal_supported_by_retained_seed_frontier','p9_geometry_change_nonvacuous',
              'PASS_RETAINED_SEED_GEOMETRY_MEMBERSHIP_P9_DEVELOPMENT','FAIL_RETAINED_SEED_GEOMETRY_MEMBERSHIP_P9_NO_GO',
              '"p9_new_numeric_threshold": None','"p9_parameter_search": False',
              'retained_seed_geometry_membership_p9_development.json','p9_membership_pretruth.sha256','p9_decisions_pretruth.sha256',
              'P3_NEGATIVE_TAIL_MAX = 0.10','int(math.floor(P3_NEGATIVE_TAIL_MAX * (len(sorted_seed_probabilities) + 1)))',
              'feature_ceiling = np.max(xp, axis=0).astype(np.float64, copy=False)',
              'scoring_scaler, scoring_classifier = crossfit_runtime_models[scoring_fold]',
              'RESPONSIBILITY_THRESHOLD = 0.5',
          ): assert token in p, token
          for token in (
              '742 inherited P5 frontier vectors','71 frontier vectors below','There is exactly one primary P9 configuration',
              'qualified known-shower matches >=95','Sparse-stream superiority against both Sugar and HDBSCAN',
          ): assert token in protocol, token
          for token in (
              "EXPECTED_P9_SOURCE = Path('/tmp/run_p9.py')",
              "spec_from_file_location('orbittrace_p9_runtime', EXPECTED_P9_SOURCE)",
              'module.exact_header_positions = compatible_exact_header_positions','PASS_P9_HEADER_WHITESPACE_COMPAT_SELF_TEST',
              'GMN_NETWORK_RETRY_DELAYS_SECONDS = (0, 1, 2, 4, 8, 16)',
              'except requests.exceptions.RequestException as exc:',
              'original_get_all_monthly_file_urls = dd.get_all_monthly_file_urls',
              'original_get_monthly_file_content_by_date = dd.get_monthly_file_content_by_date',
              'dd.get_all_monthly_file_urls = robust_get_all_monthly_file_urls',
              'dd.get_monthly_file_content_by_date = robust_get_monthly_file_content_by_date',
              "payload_sha = hashlib.sha256(value.encode('utf-8')).hexdigest()",
              'PASS_P9_GMN_FETCH_RESILIENCE_SELF_TEST',
              'install_gmn_fetch_resilience(module)',
              'no alternate source',
          ): assert token in wrapper, token
          assert 'except Exception' not in wrapper
          assert 'http://' not in wrapper and 'https://' not in wrapper
          for token in (
              'EXECUTE_P9_AFTER_AUTHORITATIVE_P8_SCIENTIFIC_NO_GO','31296889081','9033444168',
              'f9d91b1633022a2ca7d5386d3b8de2e9b81a4237fc115eb4cbf668edc0317979',
              '646fc9f253b288d1c0096a794b4d38885245ca35f8f248fb3a3d2927ce9edc7b',
              'RETAINED_SEED_GEOMETRY_MEMBERSHIP_P9_DEVELOPMENT.md','p9_geometry_dropped_seeds_total',
              'orbittrace-retained-seed-geometry-membership-p9-development',
          ): assert token in workflow, token
          for token in ('OrbitTrace-April','target_coordinate'):
              assert token not in p and token not in workflow and token not in wrapper, token
          print('PASS_P9_RETAINED_SEED_GEOMETRY_FULL_FREEZE_AUDIT')
          print('PASS_P9_GMN_TRANSPORT_RESILIENCE_STATIC_AUDIT')
          PY
          sha256sum /tmp/p9.py orbittrace_retained_seed_geometry_p9/PROTOCOL.md orbittrace_retained_seed_geometry_p9/apply_p9_patch.py orbittrace_retained_seed_geometry_p9/run_header_compatible.py orbittrace_retained_seed_geometry_p9/SOURCE_SHA256 .github/workflows/orbittrace_p9_retained_seed_geometry_development.yml

      - name: Assert source-only firewall
        run: |
          set -euo pipefail
          test ! -e orbittrace_retained_seed_geometry_p9/RUN.md
          test ! -e target
          echo NO_P9_TRUTH_EXECUTION_NO_TARGET_ACCESS
