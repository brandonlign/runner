name: OrbitTrace probabilistic membership P1 development

on:
  pull_request:
    branches:
      - agent/orbittrace-probabilistic-membership-p1-freeze-v2
    paths:
      - 'orbittrace_probabilistic_membership_p1/RUN.md'

permissions:
  contents: read
  actions: read

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Enforce execution-only child and frozen parent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "orbittrace_probabilistic_membership_p1/RUN.md"
          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_probabilistic_membership_p1/RUN.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Restore exact sources and v8 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/{v3,v8} output
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          root=Path('orbittrace_probabilistic_membership_p1/source_parts')
          parts=sorted(root.glob('part*.b64'))
          assert [p.name for p in parts]==['part00.b64','part01.b64']
          encoded=''.join(''.join(p.read_text().split()) for p in parts)
          src=gzip.decompress(base64.b64decode(encoded,validate=True))
          digest=hashlib.sha256(src).hexdigest()
          assert digest=='4075934cac8b8d2934f3d7580ad29cc5826c83a4b4e2153714b57c0673379cde',digest
          Path('/tmp/run_probabilistic_membership_p1.py').write_bytes(src)
          PY
          python -m py_compile /tmp/run_probabilistic_membership_p1.py

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"
          cp input/v3/multi_anchor_energy_v3.py input/v3/wavelet_episode_comparator.py

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" -o input/v8.zip
          echo '3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v8.zip' | sha256sum -c -
          unzip -q input/v8.zip -d input/v8
          echo 'f76b8448f299ccf078fc5978c0890b9a084f131080db8d2136b5e6dba77edc7b  input/v8/label_free_sparse_support_v6_families.json.gz' | sha256sum -c -
          echo 'ed81975fe10c35b49862487b0073b5d192c0983ea47dc56f281d7b4f8a250c03  input/v8/label_free_sparse_support_v6_evaluation.json.gz' | sha256sum -c -
          echo 'e97f840059956c47e3088484d884d7836e3a20e6c415b461564befb0e0699858  input/v8/label_free_sparse_support_v6_rankings.json' | sha256sum -c -
      - name: Execute one-shot target-excluded P1 development
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: input/v3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python -u /tmp/run_probabilistic_membership_p1.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --v8-families-json-gz input/v8/label_free_sparse_support_v6_families.json.gz \
            --v8-evaluation-json-gz input/v8/label_free_sparse_support_v6_evaluation.json.gz \
            --v8-rankings-json input/v8/label_free_sparse_support_v6_rankings.json \
            --output output
          cat output/PROBABILISTIC_MEMBERSHIP_P1_DEVELOPMENT.md
      - name: Enforce frozen result boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/probabilistic_membership_p1_development.json').read_text())
          assert r['verdict'] in {'PASS_PROBABILISTIC_MEMBERSHIP_P1_DEVELOPMENT','FAIL_PROBABILISTIC_MEMBERSHIP_P1_NO_GO'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['parameter_search'] is False
          assert r['configuration']['new_members_can_seed_growth'] is False
          assert len(r['membership_pretruth_sha256'])==64
          print('ORBITTRACE_P1_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'baseline_v8':r['baseline_v8'],'p1':r['p1'],'gates':r['gates'],'diagnostics':r['diagnostics']},indent=2))
          print('ORBITTRACE_P1_RESULT_END')
          PY
      - name: Record immutable environment
        if: always()
        run: |
          set +e
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum /tmp/run_probabilistic_membership_p1.py orbittrace_probabilistic_membership_p1/PROTOCOL.md > output/source_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-probabilistic-membership-p1-development
          path: output
          if-no-files-found: error
          retention-days: 90