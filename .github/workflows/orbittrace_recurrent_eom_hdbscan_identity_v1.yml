name: OrbitTrace recurrent-EOM HDBSCAN identity audit v1

on:
  push:
    branches:
      - agent/orbittrace-recurrence-core-hdbscan-v1
    paths:
      - '.github/workflows/orbittrace_recurrent_eom_hdbscan_identity_v1.yml'
      - 'orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py'
      - 'orbittrace_recurrent_eom_hdbscan_v1/audit_identity.py'
  workflow_dispatch:

jobs:
  identity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
      - name: Verify frozen source blobs
        shell: bash
        run: |
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = "30ac3fa3bc47910370df528fcf3ae8ecb6277b47"
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/audit_identity.py)" = "277d83685fc449812088226187354f7efde2e2e0"
      - name: Run zero-truth identity audit
        working-directory: orbittrace_recurrent_eom_hdbscan_v1
        run: python audit_identity.py
      - uses: actions/upload-artifact@v4
        with:
          name: recurrent-eom-hdbscan-identity-v1
          path: orbittrace_recurrent_eom_hdbscan_v1/identity_audit.json
