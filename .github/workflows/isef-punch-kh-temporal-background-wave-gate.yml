name: ISEF PUNCH KH temporal-background wave gate
on:
  push:
    branches: [main]
    paths:
      - 'isef/punch_kh_real_background_controls_v2.py'
      - 'isef/punch_kh_real_background_wave_gate.py'
      - 'isef/punch_kh_temporal_background_wave_gate.py'
      - '.github/workflows/isef-punch-kh-temporal-background-wave-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy astropy requests 'fsspec[http]'
      - name: Run 48-distinct-epoch temporal background gate
        id: temporal
        continue-on-error: true
        run: python isef/punch_kh_temporal_background_wave_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-punch-kh-temporal-background-wave-gate
          path: results/punch_kh_temporal_background_wave_gate/
          if-no-files-found: error
      - name: Preserve scientific gate status
        if: steps.temporal.outcome == 'failure'
        run: exit 1
