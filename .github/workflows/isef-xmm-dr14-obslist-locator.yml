name: ISEF XMM DR14 observation-list locator
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_dr14_obslist_locator.py'
      - '.github/workflows/isef-xmm-dr14-obslist-locator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python isef/xmm_dr14_obslist_locator.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-dr14-obslist-locator
          path: results/xmm_dr14_obslist_locator.json
          if-no-files-found: error
