name: Cross-year partial-transport screening

on:
  pull_request:
    branches:
      - main
    paths:
      - cross_year_transport_stage0/**
      - .github/workflows/cross_year_partial_transport_screen.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cross-year-partial-transport-stage0
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_ARTIFACT_ID: '8871850235'
      DATA_ARTIFACT_SHA256: '5f2501b3eee19b51a5dc81f8493dce67a810ef5c480045dac143de060369534d'
      BASELINE_ARTIFACT_ID: '8871912750'
      BASELINE_ARTIFACT_SHA256: 'd5f7f50262b2cd2f64901db913cd2babb0fccb897391d46b2af25f0f6d4723c4'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-year-partial-transport-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cross_year_transport_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r cross_year_transport_stage0/requirements.txt
      - name: Download exact authorized artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cross_year_transport_stage0/input/data cross_year_transport_stage0/input/baseline cross_year_transport_stage0/results
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DATA_ARTIFACT_ID}/zip" \
            -o cross_year_transport_stage0/input/data.zip
          echo "${DATA_ARTIFACT_SHA256}  cross_year_transport_stage0/input/data.zip" | sha256sum -c -
          unzip -q cross_year_transport_stage0/input/data.zip -d cross_year_transport_stage0/input/data
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" \
            -o cross_year_transport_stage0/input/baseline.zip
          echo "${BASELINE_ARTIFACT_SHA256}  cross_year_transport_stage0/input/baseline.zip" | sha256sum -c -
          unzip -q cross_year_transport_stage0/input/baseline.zip -d cross_year_transport_stage0/input/baseline
          test -s cross_year_transport_stage0/input/data/selected_events.jsonl.gz
          test -s cross_year_transport_stage0/input/data/audit.json
          test -s cross_year_transport_stage0/input/baseline/baseline_ceiling.json
      - name: Compile frozen source
        run: python -m py_compile cross_year_transport_stage0/run_transport_screen_source.py
      - name: Run frozen screening panel
        run: |
          python cross_year_transport_stage0/run_transport_screen_source.py \
            --events cross_year_transport_stage0/input/data/selected_events.jsonl.gz \
            --audit cross_year_transport_stage0/input/data/audit.json \
            --baseline cross_year_transport_stage0/input/baseline/baseline_ceiling.json \
            --output cross_year_transport_stage0/results
      - name: Record provenance
        run: |
          sha256sum \
            cross_year_transport_stage0/run_transport_screen_source.py \
            cross_year_transport_stage0/PROTOCOL.md \
            > cross_year_transport_stage0/results/source_sha256.txt
          sha256sum \
            cross_year_transport_stage0/input/data/selected_events.jsonl.gz \
            cross_year_transport_stage0/input/data/audit.json \
            cross_year_transport_stage0/input/baseline/baseline_ceiling.json \
            > cross_year_transport_stage0/results/input_sha256.txt
          python --version > cross_year_transport_stage0/results/python_version.txt
          python -m pip freeze > cross_year_transport_stage0/results/environment.txt
      - name: Upload screening evidence
        uses: actions/upload-artifact@v4
        with:
          name: cross-year-partial-transport-screen
          path: cross_year_transport_stage0/results
          if-no-files-found: error
          retention-days: 90
