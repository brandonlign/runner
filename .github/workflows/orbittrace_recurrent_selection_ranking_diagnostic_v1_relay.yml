name: OrbitTrace recurrent selection-ranking diagnostic v1 relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: orbittrace-recurrent-selection-ranking-diagnostic-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  BENCH_BRANCH: agent/orbittrace-recurrent-selection-ranking-diagnostic-v1
  FROZEN_HEAD: 92929fa515f5da94a425a612ff382ddd591d54e2

jobs:
  diagnostic:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 1364 &&
      github.event.comment.user.login == 'brandonlign' &&
      github.event.comment.body == 'RUN_ORBITTRACE_RECURRENT_SELECTION_RANKING_DIAGNOSTIC_V1'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1364 --repo "${{ github.repository }}" --body "ORBITTRACE_RECURRENT_SELECTION_RANKING_STARTED=${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BENCH_BRANCH }}
          fetch-depth: 1

      - name: Bind frozen zero-label diagnostic
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FROZEN_HEAD}"
          test ! -e orbittrace_recurrent_selection_ranking_diagnostic_v1/RESULT.json
          test "$(git hash-object orbittrace_recurrent_selection_ranking_diagnostic_v1/run_diagnostic.py)" = 'aa7e74b5dc9abad854da5f9d75a942b57700d0c9'
          test "$(git hash-object orbittrace_recurrent_selection_ranking_diagnostic_v1/PROTOCOL.md)" = 'f3849d4649ef320f13cf8e7941cd5aa120f43c85'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'scipy==1.11.4' 'scikit-learn==1.4.2'
          python -m pip install --disable-pip-version-check --no-deps 'hdbscan==0.8.44'
          python -m py_compile orbittrace_recurrent_selection_ranking_diagnostic_v1/run_diagnostic.py orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py
          mkdir -p input/rows output

      - name: Download exact paper label-free rows
        uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-sonotaco-label-free-preparation-v2
          path: input/rows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31354363306

      - name: Run zero-label decomposition
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_selection_ranking_diagnostic_v1/run_diagnostic.py --rows-root input/rows --output output
          test -f output/RESULT.json
          sha256sum output/RESULT.json | tee output/RESULT_SHA256.txt
          python - <<'PY'
          import json
          p=json.load(open('output/RESULT.json'))
          assert p['truth_accessed'] is False
          assert p['shower_label_fields_accessed'] is False
          print('PASS_ZERO_LABEL_DIAGNOSTIC')
          PY

      - name: Upload immutable result
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-recurrent-selection-ranking-diagnostic-v1-${{ github.run_id }}
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Commit diagnostic result
        run: |
          set -euo pipefail
          cp output/RESULT.json orbittrace_recurrent_selection_ranking_diagnostic_v1/RESULT.json
          cp output/RESULT_SHA256.txt orbittrace_recurrent_selection_ranking_diagnostic_v1/RESULT_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orbittrace_recurrent_selection_ranking_diagnostic_v1/RESULT.json orbittrace_recurrent_selection_ranking_diagnostic_v1/RESULT_SHA256.txt
          git commit -m 'Record recurrent selection-ranking diagnostic'
          git push origin HEAD:"${BENCH_BRANCH}"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1364 --repo "${{ github.repository }}" --body "ORBITTRACE_RECURRENT_SELECTION_RANKING_SUCCESS=${GITHUB_RUN_ID}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1364 --repo "${{ github.repository }}" --body "ORBITTRACE_RECURRENT_SELECTION_RANKING_FAILED=${GITHUB_RUN_ID}"
