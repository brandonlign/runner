name: Execute frozen density-sync matched-capacity GMN literature audit v1

on:
  pull_request:
    branches: [agent/orbittrace-density-sync-gmn-literature-fairness-v1]

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  fairness:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 5bf8f088bd109cdaf8613143676fa49ef21d32f8
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: d4b2f0279eea803275970c1de5804d06b1e3f5e7
          path: direct-src
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit frozen science and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '5bf8f088bd109cdaf8613143676fa49ef21d32f8'
          test "$(git hash-object orbittrace_density_sync_gmn_literature_fairness_v1/PROTOCOL.md)" = '21dbd0139c13fbfb33183e9c6029fc2aa587de58'
          test "$(git hash-object orbittrace_density_sync_gmn_literature_fairness_v1/evaluate_fairness.py)" = '8bb0fd2f7732dbb3a5bc01ccba822958d5eb81ef'
          test "$(git -C direct-src hash-object orbittrace_recurrent_eom_gmn_literature_direct_v1/evaluate_truth.py)" = 'bb4dec3a40429db7d017bafcb442c536c4c7e6d6'
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/{v3,ranker,v8,density-sync,direct-pretruth,direct-result} output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/density-sync
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852836840
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-eom-gmn-literature-direct-v1-pretruth
          path: input/direct-pretruth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32152924956
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-eom-gmn-literature-direct-v1-binding
          path: input/direct-result
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32152924956
      - name: Rebind immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum input/density-sync/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json | cut -d' ' -f1)" = 'efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          test "$(sha256sum input/density-sync/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = 'ca6aeed2b82739003ea5d39b59e869df876de2962164344a938fe4935ea38711'
          test "$(sha256sum input/direct-pretruth/GMN_LITERATURE_DIRECT_V1_PRETRUTH.json | cut -d' ' -f1)" = 'f52371ba1a302d57a4050b380c2a744a3be560fee0916b28ba10efbdf20e8351'
          test "$(sha256sum input/direct-result/GMN_LITERATURE_DIRECT_V1_RESULT.json | cut -d' ' -f1)" = '20dd97323813f168da57383fe27dbd9685e68ddacd9b2ca1b9b31040c1cf1c4c'
          python - <<'PY'
          import json
          p=json.load(open('input/density-sync/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json'))
          r=json.load(open('input/density-sync/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json'))
          assert p['scientific_role']=='PRELABEL_FROZEN_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1'
          assert len(p['successor_candidates'])==2094
          assert r['verdict']=='PASS_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT'
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          print('PASS_DENSITY_SYNC_LITERATURE_INPUT_REBIND')
          PY
      - name: Run binding matched-capacity literature evaluation
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        shell: bash
        run: |
          set -euo pipefail
          python -u orbittrace_density_sync_gmn_literature_fairness_v1/evaluate_fairness.py \
            --protocol orbittrace_density_sync_gmn_literature_fairness_v1/PROTOCOL.md \
            --density-sync-prelabel input/density-sync/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --density-sync-result input/density-sync/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            --direct-pretruth input/direct-pretruth/GMN_LITERATURE_DIRECT_V1_PRETRUTH.json \
            --direct-result input/direct-result/GMN_LITERATURE_DIRECT_V1_RESULT.json \
            --parent-evaluator direct-src/orbittrace_recurrent_eom_gmn_literature_direct_v1/evaluate_truth.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/DENSITY_SYNC_GMN_LITERATURE_FAIRNESS_V1_RESULT.json
          sha256sum output/DENSITY_SYNC_GMN_LITERATURE_FAIRNESS_V1_RESULT.json > output/RESULT_SHA256.txt
          printf '%s\n' '5bf8f088bd109cdaf8613143676fa49ef21d32f8' > output/science_commit.txt
      - name: Enforce binding result shape and firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/DENSITY_SYNC_GMN_LITERATURE_FAIRNESS_V1_RESULT.json'))
          assert r['verdict'] in {'PASS_DENSITY_SYNC_GMN_MATCHED_CAPACITY_LITERATURE_4_OF_4','NO_DENSITY_SYNC_GMN_MATCHED_CAPACITY_4_OF_4_SUPERIORITY'}
          assert r['total_pair_gates']==4 and len(r['pair_gates'])==4
          assert r['scientific_role']=='RETROSPECTIVE_CHARACTERIZATION_OF_PREEXISTING_FROZEN_METHOD'
          assert r['method_selection_changed'] is False and r['gmn_method_development_reopened'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_scientific_access'] is False and r['amos_scientific_access'] is False
          assert r['asfn_efn_event_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['post_result_parameter_search'] is False
          print(r['verdict'])
          print(json.dumps(r['pair_gates'],indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-density-sync-gmn-literature-fairness-v1-binding
          path: output
          if-no-files-found: error
          retention-days: 90
