name: OrbitTrace v31 three-way full-universe selectivity diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v31_threeway_full_universe_selectivity_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v31_threeway_full_universe_selectivity_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v31-threeway-full-universe-selectivity-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 31704c312c09be2765ad3f65a0685d1acfd2b055
          path: frozen-v40
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and pin runtime and diagnostic sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/joint input/auth input/truth output/pretruth output/diag
          test "$(git hash-object orbittrace_v31_threeway_full_universe_selectivity_diagnostic_v1/PROTOCOL.md)" = '1b696bef01d71dcb718e94b4d4a52aa2c1f12299'
          test "$(git hash-object orbittrace_v31_threeway_full_universe_selectivity_diagnostic_v1/diagnose.py)" = '81c45819d9c53782514c621f9c6dda9ad3b2e4f9'
          test "$(git -C frozen-v40 rev-parse HEAD)" = '31704c312c09be2765ad3f65a0685d1acfd2b055'
          test "$(git -C frozen-v40 hash-object orbittrace_v40_component_best_evidence_representative_v1/train_evaluate.py)" = '710944a43111e72ed286b3a5c06010db619c807f'
          test "$(git -C frozen-v40 hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git -C frozen-v40 hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v31_threeway_full_universe_selectivity_diagnostic_v1/diagnose.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify immutable #839 ranker
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - name: Restore immutable #950 pretruth payload before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          for route,n in (('sugar',267),('hdbscan',229)):
              m=json.load(open(f'input/payload/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              f=json.load(open(f'input/payload/{route}/family_memberships.json'))
              assert m['truth_accessed'] is False and f['truth_accessed'] is False
              assert m['feature_dimension']==71 and len(m['family_ids'])==n
              assert [str(x['family_id']) for x in f['families']]==list(map(str,m['family_ids']))
              assert m['target_information_access'] is False
              assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_THREEWAY_UNIVERSE_IMMUTABLE_PRETRUTH_PAYLOAD')
          PY
      - name: Reproduce exact #1064 graph and #1072 components before truth
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v31_threeway_full_universe_selectivity_diagnostic_v1/diagnose.py pretruth \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --output output/pretruth
          echo '2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25  output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json' | sha256sum -c -
          echo 'c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd  output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json' | sha256sum -c -
      - name: Restore exact #1098 truth-free parent joint vector before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088724826/zip' -o input/joint.zip
          echo '11498b73237304f4175f37910596700ed78284bc6106d0c21dcaab66f97b7978  input/joint.zip' | sha256sum -c -
          unzip -q input/joint.zip -d input/joint
          echo 'a3bcea66b72003a38cc492ea3b182d92cd20f3d1b94a43acbc8a0cbdd465ed07  input/joint/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json' | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('input/joint/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json'))
          assert r['verdict']=='PASS_V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL_FREEZE'
          assert r['scientific_role']=='FULL_FIXED_HDB_FAMILY_SIGNAL_VECTOR_NO_OUTCOME_USED_FOR_DEFINITION'
          assert r['family_count']==229 and len(r['families'])==229
          assert sum(bool(x['joint_signal']) for x in r['families'])==60
          assert r['graph_sha256']=='2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25'
          assert r['component_sha256']=='c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd'
          print('PASS_THREEWAY_UNIVERSE_PARENT_JOINT_PIN')
          PY
      - name: Restore and verify #1114 authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088912217/zip' -o input/auth.zip
          echo '0c5618c8f217493a0e2455a759b8710b43a2e2aa9ecab7e958fb1a495c005c4a  input/auth.zip' | sha256sum -c -
          unzip -q input/auth.zip -d input/auth
          echo '31681b318f6e2732cd8338d484959dfdcade08d65b7f90225d9a0c269d4630eb  input/auth/diag/V31_THREEWAY_CONSENSUS_DIAGNOSTIC.json' | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('input/auth/diag/V31_THREEWAY_CONSENSUS_DIAGNOSTIC.json'))
          assert r['verdict']=='PASS_V31_THREEWAY_CONSENSUS_DIAGNOSTIC'
          assert r['threeway_direction_supported_both_years'] is True
          assert r['threeway_definition']=='positive_quality_suppression AND component_closure_opportunity AND crossroute_positive'
          assert r['new_rank_or_score_evaluated'] is False and r['selector_order_evaluated'] is False
          assert r['replacement_rule_evaluated'] is False and r['successor_selected'] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          print('PASS_THREEWAY_UNIVERSE_AUTHORIZATION_PIN')
          PY
      - name: Load immutable exposed truth only after truth-free inputs are pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
      - name: Freeze complete three-way vector then audit conditional specificity
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v31_threeway_full_universe_selectivity_diagnostic_v1/diagnose.py diagnose \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --graph-file output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json \
            --component-file output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json \
            --joint-signal-file input/joint/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json \
            --threeway-authorization-file input/auth/diag/V31_THREEWAY_CONSENSUS_DIAGNOSTIC.json \
            --output output/diag
      - name: Enforce diagnostic-only scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s=json.load(open('output/diag/V31_THREEWAY_FULL_UNIVERSE_SIGNAL.json'))
          r=json.load(open('output/diag/V31_THREEWAY_FULL_UNIVERSE_SELECTIVITY_DIAGNOSTIC.json'))
          assert s['verdict']=='PASS_V31_THREEWAY_FULL_UNIVERSE_SIGNAL_FREEZE'
          assert s['family_count']==229 and len(s['families'])==229 and s['parent_joint_family_count']==60
          assert s['threeway_definition']=='parent_joint_signal AND direct_crossroute_positive'
          assert s['parent_joint_source_run']==31457923695 and s['parent_joint_source_artifact']==9088724826
          assert s['threeway_authorization_run']==31458509957 and s['threeway_authorization_artifact']==9088912217
          assert s['graph_sha256']=='2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25'
          assert s['component_sha256']=='c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd'
          for k in ('threshold_selected','top_k_selected','rank_window_selected','edge_distance_rule_selected','neighbor_count_rule_selected','alternate_neighbor_aggregation_evaluated','alternate_boolean_rule_evaluated','oracle_identity_hardcoded','truth_aware_group_identity_used_for_signal','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert s[k] is False
          assert r['verdict'] in {'PASS_V31_THREEWAY_FULL_UNIVERSE_SELECTIVITY_DIAGNOSTIC','FAIL_V31_THREEWAY_FULL_UNIVERSE_SELECTIVITY_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_RESULT_CONDITIONAL_SELECTOR_SPECIFICITY_DIAGNOSTIC_NO_ORDER_OR_SUCCESSOR_EVALUATED'
          assert r['family_count']==229 and r['parent_joint_family_count']==60
          assert r['threeway_family_count']==s['threeway_family_count']
          assert r['signal_vector_sha256']==s['canonical_sha256_without_self_field']
          assert r['parent_v31_reproduction_pass'] is True and len(r['parent_v31_controls'])==4
          assert set(r['annual_diagnostics'])=={'2013','2014'}
          for y in ('2013','2014'):
              assert set(r['annual_diagnostics'][y])=={'family_level','diagnostic_group_level'}
          for k in ('new_rank_or_score_evaluated','candidate_total_order_evaluated','selector_order_evaluated','placement_rule_evaluated','replacement_rule_evaluated','literature_panel_evaluated','successor_selected','threshold_search','effect_size_threshold_selected','top_k_search','rank_window_search','edge_distance_rule_search','neighbor_count_rule_search','alternate_neighbor_aggregation_search','boolean_combination_search','pairwise_fallback_evaluated','or_logic_search','xor_logic_search','component_size_search','q_calibration_search','quality_suppression_magnitude_search','route_specific_rule','year_specific_rule','budget_specific_rule','graph_or_component_redefinition','feature_search','model_search','k_search','scaling_search','diversity_search','fusion_search','source_quota_selected','oracle_identity_hardcoded','truth_aware_group_identity_used_for_ranking','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'], r['threeway_family_count'])
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v31_threeway_full_universe_selectivity_diagnostic_v1/PROTOCOL.md \
            orbittrace_v31_threeway_full_universe_selectivity_diagnostic_v1/diagnose.py \
            input/joint/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json \
            input/auth/diag/V31_THREEWAY_CONSENSUS_DIAGNOSTIC.json \
            output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json \
            output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json \
            > output/V31_THREEWAY_FULL_UNIVERSE_SELECTIVITY_SOURCE_SHA256.txt 2>/dev/null || true
          git -C frozen-v40 rev-parse HEAD > output/frozen_v40_execution_commit.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-threeway-full-universe-selectivity-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
