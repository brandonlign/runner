name: OrbitTrace v44 joint-gated component-best placement v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v44_joint_component_best_placement_v1/**'
      - '.github/workflows/orbittrace_v44_joint_component_best_placement_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v44-joint-component-best-placement-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 97e388bf8fdda6bbcf58d180285986e090046266
          path: frozen-v42
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 31704c312c09be2765ad3f65a0685d1acfd2b055
          path: frozen-v40
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and pin frozen scientific sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/auth_joint input/auth_placement input/truth output/pretruth output/result
          test "$(git hash-object orbittrace_v44_joint_component_best_placement_v1/PROTOCOL.md)" = '81b82a279ae8fc9f97e93f4f4b9716e9125c1c49'
          test "$(git hash-object orbittrace_v44_joint_component_best_placement_v1/train_evaluate.py)" = 'fe58c85c0b2c65d64656c4e4622dcea455bdd58a'
          test "$(git -C frozen-v42 rev-parse HEAD)" = '97e388bf8fdda6bbcf58d180285986e090046266'
          test "$(git -C frozen-v42 hash-object orbittrace_v42_quality_component_gated_rescue_v1/train_evaluate.py)" = 'ad76d79abb9eb0fe82d7d2a7869a446814e6e3a4'
          test "$(git -C frozen-v40 rev-parse HEAD)" = '31704c312c09be2765ad3f65a0685d1acfd2b055'
          test "$(git -C frozen-v40 hash-object orbittrace_v40_component_best_evidence_representative_v1/train_evaluate.py)" = '710944a43111e72ed286b3a5c06010db619c807f'
          test "$(git -C frozen-v40 hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git -C frozen-v40 hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v44_joint_component_best_placement_v1/train_evaluate.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify immutable #839 ranker
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - name: Restore immutable #950 pretruth payload before authorizers or truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          for route,n in (('sugar',267),('hdbscan',229)):
              m=json.load(open(f'input/payload/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              f=json.load(open(f'input/payload/{route}/family_memberships.json'))
              assert m['truth_accessed'] is False and f['truth_accessed'] is False
              assert m['feature_dimension']==71 and len(m['family_ids'])==n
              assert [str(x['family_id']) for x in f['families']]==list(map(str,m['family_ids']))
              assert m['target_information_access'] is False
              assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          h=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          assert len(h['quality_order'])==229 and set(map(str,h['quality_order']))==set(map(str,h['family_ids']))
          print('PASS_V44_IMMUTABLE_PRETRUTH_PAYLOAD')
          PY
      - name: Freeze exact graph and component identities before authorizers or truth
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v42:frozen-v40:frozen-v8:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v44_joint_component_best_placement_v1/train_evaluate.py pretruth \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --output output/pretruth
          echo '2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25  output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json' | sha256sum -c -
          echo 'c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd  output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json' | sha256sum -c -
      - name: Restore exact #1091 gate and #1113 placement authorizers after scientific freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088402091/zip' -o input/auth_joint.zip
          echo 'd1943f629964633f44e154252a225f7171c380674ae6e60e5fcbbd3f8b890dd7  input/auth_joint.zip' | sha256sum -c -
          unzip -q input/auth_joint.zip -d input/auth_joint
          echo '2edb949dbab2d7cbf6ed5e808e2a049116eb0934b25b356572463b615d730842  input/auth_joint/diag/V31_QUALITY_COMPONENT_JOINT_SIGNAL_DIAGNOSTIC.json' | sha256sum -c -

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088994714/zip' -o input/auth_placement.zip
          echo '5bddfbe4abda60006757561d4c6477102317e02f5fb9555330e0b62eaf3353df  input/auth_placement.zip' | sha256sum -c -
          unzip -q input/auth_placement.zip -d input/auth_placement
          echo '939f4288a5f0d2de84ef566bb93713da664230deb65777c422795c93fba10c6d  input/auth_placement/diag/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json' | sha256sum -c -
          python - <<'PY'
          import json
          j=json.load(open('input/auth_joint/diag/V31_QUALITY_COMPONENT_JOINT_SIGNAL_DIAGNOSTIC.json'))
          p=json.load(open('input/auth_placement/diag/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json'))
          assert j['verdict']=='PASS_V31_QUALITY_COMPONENT_JOINT_SIGNAL_DIAGNOSTIC'
          assert j['joint_direction_supported_both_years'] is True
          assert j['new_rank_or_score_evaluated'] is False and j['successor_selected'] is False
          assert p['verdict']=='PASS_V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC'
          assert p['placement_direction_supported_both_years_both_levels'] is True and p['joint_family_count']==60
          assert p['new_rank_or_score_evaluated'] is False and p['successor_selected'] is False
          assert p['placement_statistic']=='component_best_v31_percentile from frozen #1098 signal; lower is better'
          for r in (j,p):
              assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
              assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
              assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
              assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_V44_AUTHORIZERS_PINNED')
          PY
      - name: Restore immutable exposed truth only after v44 source and authorizers are pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
      - name: Reproduce exact v31 and evaluate sole v44 order
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v42:frozen-v40:frozen-v8:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v44_joint_component_best_placement_v1/train_evaluate.py evaluate \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --graph-file output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json \
            --component-file output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json \
            --joint-authorizer input/auth_joint/diag/V31_QUALITY_COMPONENT_JOINT_SIGNAL_DIAGNOSTIC.json \
            --placement-authorizer input/auth_placement/diag/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json \
            --output output/result
      - name: Enforce v44 scientific/result firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/result/V44_JOINT_COMPONENT_BEST_PLACEMENT_RESULT.json'))
          assert r['verdict'] in {'PASS_V44_JOINT_COMPONENT_BEST_PLACEMENT_ALL_PANEL_LITERATURE_SUPERIORITY_DEVELOPMENT','FAIL_V44_JOINT_COMPONENT_BEST_PLACEMENT_ALL_PANEL_LITERATURE_SUPERIORITY_DEVELOPMENT'}
          assert r['parent_v31_reproduction_pass'] is True and len(r['parent_v31_controls'])==4
          assert r['pretruth_graph_sha256']=='2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25'
          assert r['pretruth_component_sha256']=='c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd'
          assert r['gate_authorizing_run']==31456963941 and r['placement_authorizing_run']==31458734952
          assert r['joint_positive_candidate_count']==60 and len(r['hdb_candidate_rows'])==229
          assert r['sugar_rule']=='exact v31 unchanged'
          assert r['hdb_placement_key']=='component_best_v31_percentile if joint gate else own exact-v31 percentile'
          assert r['order_diagnostics']['sugar']['exact_v31_unchanged'] is True
          assert len(r['panels'])==4
          for row in r['hdb_candidate_rows']:
              exp=row['component_best_v31_percentile'] if row['joint_gate'] else row['v31_percentile']
              assert abs(row['v44_key']-exp) <= 1e-15
          for k in ('component_best_threshold_search','quality_component_blend_search','promotion_coefficient_search','promotion_bonus_search','promotion_cap_search','promotion_interpolation_search','top_k_selected','rank_window_selected','oracle_correction_count_used','threeway_signal_used','boolean_combination_search','route_specific_rule','year_specific_rule','budget_specific_rule','radius_search','metric_search','graph_pruning','graph_expansion','component_definition_search','candidate_generation_changed','candidate_membership_changed','feature_search','model_search','k_search','scaling_search','annual_combiner_search','diversity_search','fusion_search','source_quota_selected','oracle_identity_used_for_ranking','truth_aware_group_identity_used_for_ranking','post_result_second_search','maarsy_scientific_access','dms_scientific_access','target_information_access','target_region_events_accessed'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'])
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v44_joint_component_best_placement_v1/PROTOCOL.md \
            orbittrace_v44_joint_component_best_placement_v1/train_evaluate.py \
            frozen-v42/orbittrace_v42_quality_component_gated_rescue_v1/train_evaluate.py \
            frozen-v40/orbittrace_v40_component_best_evidence_representative_v1/train_evaluate.py \
            input/ranker/run_urc_union_ranker.py \
            output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json \
            output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json \
            input/auth_joint/diag/V31_QUALITY_COMPONENT_JOINT_SIGNAL_DIAGNOSTIC.json \
            input/auth_placement/diag/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json \
            > output/V44_JOINT_COMPONENT_BEST_PLACEMENT_SOURCE_SHA256.txt 2>/dev/null || true
          git -C frozen-v42 rev-parse HEAD > output/frozen_v42_execution_commit.txt 2>/dev/null || true
          git -C frozen-v40 rev-parse HEAD > output/frozen_v40_execution_commit.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v44-joint-component-best-placement-development-v1
          path: output
          if-no-files-found: error
          retention-days: 90
