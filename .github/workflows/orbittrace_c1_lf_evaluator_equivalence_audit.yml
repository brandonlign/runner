name: OrbitTrace C1-LF evaluator equivalence audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-lf-core-probabilistic-membership-c1-freeze
    paths:
      - orbittrace_v6_lf_core_probabilistic_membership_c1/audit_evaluator_equivalence.py
      - .github/workflows/orbittrace_c1_lf_evaluator_equivalence_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: exact-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluator-only dependency
        run: python -m pip install numpy==2.1.3
      - name: Reconstruct exact repaired-v6 source without data access
        run: |
          set -euo pipefail
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.frozen.py' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import hashlib
          original=Path('/tmp/v6.frozen.py').read_text()
          before='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
              rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
              capped = primary_capped + rescue_capped

              components = primary_components + rescue_components
          '''.replace('          ','')
          after='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
              rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
              capped = primary_capped + rescue_capped

              primary_components = component_records_track_v6(old, year, primary_capped, event_lookup, base, "v3")
              rescue_components = component_records_track_v6(old, year, rescue_capped, event_lookup, base, "fixed4_rescue")
              components = primary_components + rescue_components
          '''.replace('          ','')
          assert original.count(before)==1
          patched=original.replace(before,after,1)
          assert hashlib.sha256(patched.encode()).hexdigest()=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          Path('/tmp/v6_exact.py').write_text(patched)
          print('PASS_EXACT_REPAIRED_V6_SOURCE_IDENTITY')
          PY
      - name: Prove exact shared primary endpoints are evaluator-equivalent
        run: |
          set -euo pipefail
          python orbittrace_v6_lf_core_probabilistic_membership_c1/audit_evaluator_equivalence.py
      - name: Assert synthetic source-only boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          echo NO_CATALOGUE_NO_LABEL_VALUES_NO_TARGET_REGION_NO_SCIENTIFIC_RESULT
