name: OrbitTrace P9 bidirectional reliability source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p8-full-finite-sample-order-stat-freeze
    paths:
      - orbittrace_bidirectional_reliability_p9/**
      - .github/workflows/orbittrace_p9_bidirectional_reliability_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact P8 and audit P9 transform
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2_v1.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2_v1.py /tmp/p2_canonical_v2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2_canonical_v2.py' | sha256sum -c -
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2_canonical_v2.py /tmp/run_p3.py
          echo 'f6c4c5a76b8b3f35d434aed4f1fb15035be05c40d0e0531c343ff620f3ba8185  /tmp/run_p3.py' | sha256sum -c -
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/run_p3.py /tmp/run_p4.py
          echo '290c4f1b6401eaab6f182760eaeaa2f91cc994854febf465f58f7cacc5d73b2a  /tmp/run_p4.py' | sha256sum -c -
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/run_p4.py /tmp/run_p5.py
          echo 'b48b3e6a45a7a371eb8e73c70ee217a33a96c596c61b51ebb7dc9c7b60100456  /tmp/run_p5.py' | sha256sum -c -
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/run_p5.py /tmp/run_p6.py
          echo 'd32648136b58e2f777912d6403d9de3cbd091a8c23e16aedcda0b146f09f38c2  /tmp/run_p6.py' | sha256sum -c -
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/run_p6.py /tmp/run_p7.py
          echo '89cf23c9d58692aedfaf12a9c2b7de4a08d641e6326794d82872f2e18608df54  /tmp/run_p7.py' | sha256sum -c -
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/run_p7.py /tmp/run_p8.py
          echo 'd3bdcdaf18639e36cc02f5106b3a3c816f5e51eb19543f425717ba1c48a26470  /tmp/run_p8.py' | sha256sum -c -
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/run_p8.py /tmp/run_p9.py
          python -m py_compile /tmp/run_p9.py orbittrace_bidirectional_reliability_p9/run_header_compatible.py
          echo "P9_GENERATED_SOURCE_SHA256=$(sha256sum /tmp/run_p9.py | awk '{print $1}')"

          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/run_p9.py').read_text()
          protocol=Path('orbittrace_bidirectional_reliability_p9/PROTOCOL.md').read_text()
          wrapper=Path('orbittrace_bidirectional_reliability_p9/run_header_compatible.py').read_text()
          required=(
              'reciprocal_key = f"{direction[\'family_id\']}|{direction[\'target_year\']}|{direction[\'source_year\']}"',
              'if not (bool(gate["reliable"]) and bool(reciprocal_gate["reliable"])):',
              '"p9_bidirectional_reliability": True',
              'p9_pretruth_family_reliability_pattern_reproduced',
              'p9_only_bidirectionally_reliable_families_can_propose',
              'PASS_BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P9_DEVELOPMENT',
              'FAIL_BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P9_NO_GO',
              '"p9_new_numeric_thresholds": False',
              '"p9_parameter_search": False',
              'bidirectional_reliability_membership_p9_development.json',
              'p9_membership_pretruth.sha256',
              'p9_decisions_pretruth.sha256',
          )
          for token in required:
              assert token in p, token
          inherited=(
              'P3_FOLD_COUNT = 5','P3_NEGATIVE_TAIL_MAX = 0.10','P3_SEED_FLOOR_MIN = 0.5',
              'RESPONSIBILITY_THRESHOLD = 0.5',
              'int(math.floor(P3_NEGATIVE_TAIL_MAX * (len(sorted_seed_probabilities) + 1)))',
              'p4_two_view_seed_envelope','p5_joint_seed_support',
              'scoring_scaler, scoring_classifier = crossfit_runtime_models[scoring_fold]',
              'probabilities = scoring_classifier.predict_proba(scoring_scaler.transform(features))[:, 1]',
              'new_members_can_seed_growth','ranking_after_membership',
          )
          for token in inherited:
              assert token in p, token
          for token in (
              'comment `5230013045`','218 families','3 families have exactly one reliable direction',
              '3,320 / 24,945','13.309','no new numeric threshold','qualified known-shower matches >=95',
              'both Sugar and catalogue HDBSCAN','Solar longitude 20°–55°',
          ):
              assert token in protocol, token
          for token in (
              "EXPECTED_P9_SOURCE = Path('/tmp/run_p9.py')",
              "spec_from_file_location('orbittrace_p9_runtime', EXPECTED_P9_SOURCE)",
              'module.exact_header_positions = compatible_exact_header_positions',
              'PASS_P9_HEADER_WHITESPACE_COMPAT_SELF_TEST',
          ):
              assert token in wrapper, token
          for token in ('OrbitTrace-April','target_coordinate'):
              assert token not in p and token not in protocol, token
          assert 'probabilities = classifier.predict_proba(scaler.transform(features))[:, 1]' not in p
          print('PASS_P9_BIDIRECTIONAL_RELIABILITY_SOURCE_AUDIT')
          PY
          sha256sum /tmp/run_p9.py orbittrace_bidirectional_reliability_p9/PROTOCOL.md orbittrace_bidirectional_reliability_p9/apply_p9_patch.py orbittrace_bidirectional_reliability_p9/run_header_compatible.py

      - name: Assert source-only firewall
        run: |
          set -euo pipefail
          test ! -e orbittrace_bidirectional_reliability_p9/RUN.md
          test ! -e target
          echo NO_P9_TRUTH_EXECUTION_NO_TARGET_ACCESS
