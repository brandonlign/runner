name: OrbitTrace M2D blind rediscovery parallel v1

on:
  pull_request:
    branches:
      - agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1
    paths:
      - orbittrace_m2d_blind_rediscovery_v1/run_blind_m2d_shard.py
      - orbittrace_m2d_blind_rediscovery_v1/aggregate_shards.py
      - orbittrace_m2d_blind_rediscovery_v1/run_blind_m2d.py
      - orbittrace_m2d_blind_rediscovery_v1/reveal_exact_ids.py
      - orbittrace_m2d_blind_rediscovery_v1/internal_mass_exact.cpp
      - .github/workflows/orbittrace_m2d_blind_rediscovery_parallel_v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install scientific runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          python -m py_compile orbittrace_m2d_blind_rediscovery_v1/run_blind_m2d.py orbittrace_m2d_blind_rediscovery_v1/run_blind_m2d_shard.py
          g++ -O3 -std=c++17 orbittrace_m2d_blind_rediscovery_v1/internal_mass_exact.cpp -o /tmp/m2d_exact
          mkdir -p output
      - name: Run target-free M2D shard
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_blind_rediscovery_v1/run_blind_m2d_shard.py \
            --shard-index ${{ matrix.shard }} --shard-count 6 \
            --blind-source-parts orbittrace_fixed4_blind_catalogue/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --support-source orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py \
            --structural-source orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --exact-exe /tmp/m2d_exact --output output
      - uses: actions/upload-artifact@v4
        with:
          name: m2d-blind-shard-${{ matrix.shard }}
          path: output
          if-no-files-found: error
          retention-days: 90

  aggregate-reveal:
    needs: shard
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: m2d-blind-shard-*
          path: input/shards
          merge-multiple: true
      - name: Freeze deterministic global M2D ranking
        run: |
          set -euo pipefail
          mkdir -p output input
          python orbittrace_m2d_blind_rediscovery_v1/aggregate_shards.py --input input/shards --output output --shard-count 6
          test -s output/M2D_BLIND_PRETRUTH.sha256
          cat output/M2D_BLIND_PRETRUTH.md
      - name: Retrieve canonical IDs only after global pretruth freeze
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANONICAL_ARTIFACT_ID: '8814798136'
          CANONICAL_ARTIFACT_SHA256: '716b70313465d5df4bfb092a85a81680e6f618606b71e25470c63c480b6449f5'
        run: |
          set -euo pipefail
          curl --fail-with-body -L -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANONICAL_ARTIFACT_ID}/zip" -o input/canonical.zip
          echo "${CANONICAL_ARTIFACT_SHA256}  input/canonical.zip" | sha256sum -c -
      - name: Exact-ID-only reveal
        run: |
          set -euo pipefail
          python orbittrace_m2d_blind_rediscovery_v1/reveal_exact_ids.py --pretruth output/M2D_BLIND_PRETRUTH.json.gz --canonical-zip input/canonical.zip --output output
          cat output/M2D_BLIND_REVEAL.md
      - name: Provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_m2d_blind_rediscovery_v1/* output/* > output/SHA256SUMS.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-blind-rediscovery-parallel-v1
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s output/M2D_BLIND_REVEAL.md; then gh pr comment 1378 --repo "$GITHUB_REPOSITORY" --body-file output/M2D_BLIND_REVEAL.md; else gh pr comment 1378 --repo "$GITHUB_REPOSITORY" --body "Parallel M2D blind run ended without a reveal; this is a technical no-result. Workflow $GITHUB_RUN_ID."; fi
