name: OrbitTrace v31 annual-min bottleneck diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v31_annual_min_bottleneck_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v31_annual_min_bottleneck_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v31-annual-min-bottleneck-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen scientific sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/truth input/rankgap output/parent output/freeze output/diag
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          test "$(git hash-object orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py)" = '917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          test "$(git hash-object orbittrace_v31_annual_min_bottleneck_diagnostic_v1/PROTOCOL.md)" = 'e42357c8b257099f106640f3409fa86db21a616b'
          test "$(git hash-object orbittrace_v31_annual_min_bottleneck_diagnostic_v1/diagnose.py)" = 'd5e2feab128ddbc76ae60702df3f37d1954659de'
          python -m py_compile orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py orbittrace_v31_annual_min_bottleneck_diagnostic_v1/diagnose.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify immutable #839 ranker
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - name: Restore immutable #950 payload before diagnostic status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          test "$(sha256sum input/payload/result/V24_EXPOSED_TWOHEAD_OOF_RESULT.json | cut -d' ' -f1)" = 'c8d95bc02ad1436c9924ec14a25bcd36e0eacd960fda1fb33db3a91738fe30cf'
          python - <<'PY'
          import json
          for route,n in (('sugar',267),('hdbscan',229)):
              m=json.load(open(f'input/payload/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              f=json.load(open(f'input/payload/{route}/family_memberships.json'))
              assert m['truth_accessed'] is False and f['truth_accessed'] is False
              assert m['feature_dimension']==71 and len(m['family_ids'])==n
              assert m['target_information_access'] is False
              assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_ANNUAL_MIN_IMMUTABLE_PAYLOAD')
          PY

      - name: Load immutable exposed v31 training truth before status attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth

      - name: Reproduce exact v31 parent before #1046 is available
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --output output/parent
          python - <<'PY'
          import json
          r=json.load(open('output/parent/V31_LOCAL_GEOMETRY_OOF_RESULT.json'))
          assert r['verdict']=='FAIL_V31_LOCAL_GEOMETRY_ALL_PANEL_LITERATURE_SUPERIORITY_DEVELOPMENT'
          assert r['panel_wins']==2
          got={(x['comparator'],x['year']):(x['candidate_macro_f1'],x['candidate_recovered_f1_gt_0_5']) for x in r['panels']}
          exp={('sugar',2013):(0.2719801488280529,16),('sugar',2014):(0.31529041952487225,17),('hdbscan',2013):(0.14888037368183737,9),('hdbscan',2014):(0.15198123772301594,9)}
          for k,v in exp.items():
              assert abs(got[k][0]-v[0])<1e-12 and got[k][1]==v[1]
          print('PASS_ANNUAL_MIN_EXACT_V31_PARENT')
          PY

      - name: Freeze complete HDB annual-margin vector before #1046 status
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          test ! -e input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json
          python -u orbittrace_v31_annual_min_bottleneck_diagnostic_v1/diagnose.py freeze \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --parent-result output/parent/V31_LOCAL_GEOMETRY_OOF_RESULT.json \
            --output output/freeze
          python - <<'PY'
          import json
          v=json.load(open('output/freeze/V31_HDB_ANNUAL_MARGIN_VECTOR.json'))
          assert v['verdict']=='PASS_V31_HDB_ANNUAL_MARGIN_VECTOR_FREEZE'
          assert v['scientific_role']=='EXACT_V31_HDB_ANNUAL_MARGIN_VECTOR_FROZEN_BEFORE_1046_SURFACED_MISSED_STATUS_ATTACHMENT'
          assert v['family_count']==229 and len(v['families'])==229
          assert v['rankgap_1046_loaded_before_vector_freeze'] is False
          assert v['new_rank_or_score_used_for_ranking'] is False
          assert v['alternate_annual_combiner_evaluated'] is False
          assert v['successor_selected'] is False
          assert v['target_information_access'] is False and v['target_region_events_accessed'] is False
          assert v['maarsy_scientific_access'] is False and v['dms_scientific_access'] is False
          assert v['blind_exclusion']==[20.0,55.0]
          print('PASS_ANNUAL_MIN_VECTOR_FROZEN',v['canonical_family_vector_sha256'])
          PY

      - name: Restore authoritative #1046 status only after vector freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9086399760/zip' -o input/rankgap.zip
          echo 'a2c373df77ef7e0065c1d8aceb1f6e5826f1e30b6286f2331c362d959f1d7f69  input/rankgap.zip' | sha256sum -c -
          unzip -p input/rankgap.zip diag/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json > input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json
          echo 'e4e09546e17b9a5da7ce12ad9af4bb7129533fd9b5be846ebc859719f01a9758  input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json' | sha256sum -c -

      - name: Run sole annual-min bottleneck diagnostic
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v31_annual_min_bottleneck_diagnostic_v1/diagnose.py diagnose \
            --vector-file output/freeze/V31_HDB_ANNUAL_MARGIN_VECTOR.json \
            --rankgap-file input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json \
            --output output/diag

      - name: Enforce diagnostic-only scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V31_ANNUAL_MIN_BOTTLENECK_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V31_ANNUAL_MIN_BOTTLENECK_DIAGNOSTIC','FAIL_V31_ANNUAL_MIN_BOTTLENECK_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_V56_MECHANISM_DIAGNOSTIC_ONLY_NO_ALTERNATE_COMBINER_OR_SUCCESSOR_EVALUATED'
          assert set(r['annual_diagnostics'])=={'2013','2014'}
          assert r['new_rank_or_score_used_for_ranking'] is False
          assert r['alternate_annual_combiner_evaluated'] is False and r['annual_specific_order_evaluated'] is False
          assert r['threshold_search'] is False and r['quantile_search'] is False and r['top_k_search'] is False and r['rank_window_search'] is False
          assert r['budget_specific_rule'] is False and r['representative_search'] is False
          assert r['feature_search'] is False and r['metric_search'] is False and r['k_search'] is False and r['scaling_search'] is False
          assert r['diversity_search'] is False and r['fusion_search'] is False and r['model_search'] is False
          assert r['component_or_topology_search'] is False and r['crossroute_search'] is False
          assert r['oracle_identity_used_for_ranking'] is False and r['successor_selected'] is False and r['post_result_second_search'] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v31_annual_min_bottleneck_diagnostic_v1/PROTOCOL.md \
            orbittrace_v31_annual_min_bottleneck_diagnostic_v1/diagnose.py \
            orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py \
            input/ranker/run_urc_union_ranker.py \
            output/parent/V31_LOCAL_GEOMETRY_OOF_RESULT.json \
            output/freeze/V31_HDB_ANNUAL_MARGIN_VECTOR.json \
            input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json \
            output/diag/V31_ANNUAL_MIN_BOTTLENECK_DIAGNOSTIC.json \
            > output/V31_ANNUAL_MIN_BOTTLENECK_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-annual-min-bottleneck-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
