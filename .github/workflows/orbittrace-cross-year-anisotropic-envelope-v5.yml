name: OrbitTrace cross-year anisotropic envelope v5 development

on:
  pull_request:
    branches:
      - agent/orbittrace-pooled-year-centroid-v8
    paths:
      - 'orbittrace_cross_year_anisotropic_envelope_v5/**'
      - '.github/workflows/orbittrace-cross-year-anisotropic-envelope-v5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-cross-year-anisotropic-envelope-v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Enforce pre-data provenance and v4 no-go
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v1/orbittrace_cross_year_seed_support_expansion_v1 input/v4_result input/mav3 input/v6 input/centroid output
          touch input/v1/orbittrace_cross_year_seed_support_expansion_v1/__init__.py

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/wavelet_catalogue_v3_source_audit.json').read_text())
          assert r['verdict']=='PASS_WAVELET_CATALOGUE_V3_SOURCE_AUDIT'
          assert r['development_years']==[2022,2023]
          assert r['held_out_catalogues_loaded'] is False
          assert r['target_information_present'] is False
          assert r['labels_enter_candidate_generation'] is False
          PY

          # Exact v1 scaffold keeps the previously frozen evaluation and promotion gates unchanged.
          git fetch --no-tags --depth=1 origin e87a61909f06b2c8f4e763a2f915d13b5c365620
          git show FETCH_HEAD:orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            > input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py
          test "$(git hash-object input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py)" = "2f48496362494d600652ae35d721e3b107c19a22"

          # Bind the exact v4 no-go before v5 development-data access.
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9015894267/zip" -o input/v4_result.zip
          echo "1a823ee65b29622065c8f52c81a27e17c1247246323d971a85de6238c1d5ce07  input/v4_result.zip" | sha256sum -c -
          unzip -q input/v4_result.zip -d input/v4_result
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('input/v4_result/cross_year_observed_support_envelope_v4_development.json').read_text())
          assert r['verdict']=='FAIL_CROSS_YEAR_OBSERVED_SUPPORT_ENVELOPE_V4_DEVELOPMENT'
          assert r['family_count']==226
          assert r['expansion_diagnostics']['total_new_members']==7405
          assert r['expanded_metrics']['multiplicity']['recovered_at_100']==59
          assert r['expanded_metrics']['multiplicity']['qualified_matches']==94
          assert abs(r['expanded_metrics']['multiplicity']['top100_dominant_precision']-0.6889856519785035)<1e-12
          assert abs(r['annual_mean_f1_delta']['2022']['all']-0.01954690877749625)<1e-12
          assert abs(r['annual_mean_f1_delta']['2023']['all']-0.028264407714623872)<1e-12
          assert r['scientific_gates']['annual_all_mean_f1_gain_at_least_010_both_years'] is False
          assert r['scientific_gates']['at_least_one_moderate_or_large_bin_material_gain_both_years'] is False
          assert r['scientific_gates']['expanded_qualified_nonregression'] is False
          assert all(r['integrity_gates'].values())
          PY

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/mav3/multi_anchor_energy_v3.py
          test "$(git hash-object input/mav3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" -o input/v6.zip
          echo "3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v6.zip" | sha256sum -c -
          unzip -q input/v6.zip -d input/v6

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009091129/zip" -o input/centroid.zip
          echo "a1faacf51e1f4ca2a3a92b20e27d1f07f00e1d32ab33993916379ff36acea062  input/centroid.zip" | sha256sum -c -
          unzip -q input/centroid.zip -d input/centroid

          python -m py_compile \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            orbittrace_cross_year_anisotropic_envelope_v5/run_development.py
          rm -rf output/*
          echo PASS_ANISOTROPIC_ENVELOPE_V5_PREDATA_GUARDS

      - name: Run frozen target-excluded v5 development
        env:
          PYTHONPATH: input/v1:input/mav3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python orbittrace_cross_year_anisotropic_envelope_v5/run_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --source-audit-json output/wavelet_catalogue_v3_source_audit.json \
            --v6-result-json input/v6/label_free_sparse_support_v6_development.json \
            --centroid-audit-json input/centroid/component_centroid_source_audit.json \
            --output output
          cat output/CROSS_YEAR_ANISOTROPIC_ENVELOPE_V5_DEVELOPMENT.md

      - name: Enforce frozen v5 blindness and verdict schema
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/cross_year_anisotropic_envelope_v5_development.json').read_text())
          assert r['verdict'] in {
            'PASS_CROSS_YEAR_ANISOTROPIC_ENVELOPE_V5_DEVELOPMENT',
            'FAIL_CROSS_YEAR_ANISOTROPIC_ENVELOPE_V5_DEVELOPMENT',
          }
          c=r['configuration']
          assert c['blind_exclusion']==[20.0,55.0]
          assert c['support_unit']=='frozen source-year component anisotropic envelope'
          assert c['residual_representation']=='exact four scaled residual coordinates underlying frozen v6/v8 centroid distance'
          assert c['covariance_estimator']=='sklearn.covariance.LedoitWolf(assume_centered=True)'
          assert c['assume_centered'] is True
          assert c['mahalanobis_threshold']=='maximum source-member squared Mahalanobis distance'
          assert c['threshold_multiplier'] is None and c['threshold_quantile'] is None
          assert c['raw_distance_cap']==1.5
          assert c['component_centroids_refit'] is False
          assert c['covariance_estimator_search'] is False
          assert c['threshold_search_v5'] is False and c['raw_cap_search'] is False
          assert c['ranking_changed'] is False and c['recursive_growth'] is False
          assert c['v4_predecessor_run']==31236659166
          assert c['v4_predecessor_artifact']==9015894267
          assert c['v4_predecessor_artifact_digest']=='sha256:1a823ee65b29622065c8f52c81a27e17c1247246323d971a85de6238c1d5ce07'
          assert r['family_count']==226
          assert r['integrity_gates']['exact_frozen_anisotropic_estimator'] is True
          assert r['integrity_gates']['max_training_mahalanobis_support_no_multiplier'] is True
          assert r['integrity_gates']['all_covariances_positive_definite'] is True
          assert r['integrity_gates']['raw_predecessor_cap_1p5_preserved'] is True
          assert r['integrity_gates']['no_anisotropic_parameter_search'] is True
          assert len(r['prelabel_payload_sha256'])==64
          assert 'No OrbitTrace target information' in r['claim_boundary']
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/development_commit.txt
          sha256sum \
            orbittrace_cross_year_anisotropic_envelope_v5/PROTOCOL.md \
            orbittrace_cross_year_anisotropic_envelope_v5/run_development.py \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-cross-year-anisotropic-envelope-v5-development
          path: output
          if-no-files-found: error
          retention-days: 90
