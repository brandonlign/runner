name: Uncertainty-Mondrian source audit

on:
  pull_request:
    branches:
      - agent/uncertainty-inflated-quartet-stage0
    paths:
      - .github/workflows/uncertainty_inflated_quartet_stage0.yml
      - uncertainty_mondrian_quartet_stage0/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uncertainty-mondrian-source-audit
  cancel-in-progress: true

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uncertainty-mondrian-quartet-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode and verify exact uncertainty-quartet source
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          parts = sorted(Path('uncertainty_inflated_quartet_stage0/source_parts').glob('part*.b64'))
          expected = ['part00.b64', 'part01.b64', 'part02.b64']
          if [part.name for part in parts] != expected:
              raise RuntimeError(f'unexpected source parts: {[part.name for part in parts]}')
          encoded = ''.join(''.join(part.read_text().split()) for part in parts)
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected_digest = '12cc8c9b0bcf674e918cca35bc572accd4b4139f0c16989d719df6857f6daf5b'
          if digest != expected_digest:
              raise RuntimeError(f'source mismatch: {digest}')
          Path('output/run_uncertainty_quartet.py').write_bytes(source)
          Path('output/SOURCE_AUDIT.txt').write_text(
              f'encoded_length={len(encoded)}\nsource_bytes={len(source)}\nsource_sha256={digest}\n'
          )
          print(Path('output/SOURCE_AUDIT.txt').read_text())
          PY
          python -m py_compile output/run_uncertainty_quartet.py
      - name: Upload no-score source audit
        uses: actions/upload-artifact@v4
        with:
          name: uncertainty-mondrian-source-audit
          path: output
          if-no-files-found: error
          retention-days: 30
