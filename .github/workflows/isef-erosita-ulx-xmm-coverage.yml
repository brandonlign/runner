name: ISEF eROSITA new-ULX XMM metadata coverage
on:
  push:
    branches: [main]
    paths:
      - 'isef/erosita_ulx_xmm_coverage.py'
      - '.github/workflows/isef-erosita-ulx-xmm-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install astropy pandas requests
      - run: python isef/erosita_ulx_xmm_coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-erosita-ulx-xmm-coverage
          path: results/erosita_ulx_xmm_coverage/
          if-no-files-found: warn
