name: OrbitTrace RFT v2 soft-evidence flow GMN 2022

on:
  push:
    branches:
      - agent/orbittrace-rft-v2-soft-evidence-flow-v1
    paths:
      - 'orbittrace_recurrent_flow_tube_v2/**'
      - '.github/workflows/orbittrace_recurrent_flow_tube_v2.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-rft-v2-soft-evidence-flow-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and pin frozen RFT v2 sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/v8 input/ranker input/shards output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py)
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          test "$(git hash-object orbittrace_recurrent_flow_tube_v2/PROTOCOL.md)" = 'fa6ec175e1ec32608e12b0571d7bcab686408443'
          test "$(git hash-object orbittrace_recurrent_flow_tube_v2/run_development.py)" = '4128d4d43a02dd583170d35d817866418f1fa880'
          test "$(git hash-object orbittrace_recurrent_flow_tube_v1/run_development.py)" = 'a5d5371f0c30a9c57ee4d8756ea41f454cd86301'
          python -m py_compile orbittrace_recurrent_flow_tube_v2/run_development.py orbittrace_recurrent_flow_tube_v1/run_development.py
          echo PASS_RFT_V2_SOURCE_PINS

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          pattern: rft-v1-uv-parallel-replica-*
          path: input/shards
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31552533324

      - name: Verify immutable runtime and 17-shard engineering cache
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python - <<'PY'
          import glob,gzip,json
          paths=sorted(glob.glob('input/shards/rft_v1_replica_*.json.gz'))
          assert len(paths)==17, len(paths)
          reps=[]
          for p in paths:
              with gzip.open(p,'rt') as f: r=json.load(f)
              reps.append(int(r['replica']))
              assert r['schema']=='RFT_V1_ENGINEERING_REPLICA_SHARD_V1'
              assert r['frozen_science_blob']=='a5d5371f0c30a9c57ee4d8756ea41f454cd86301'
              assert r['blind_exclusion']==[20.0,55.0]
              for k in ['target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access','sonotaco_2013_2014_access','gmn_2023_access']:
                  assert r[k] is False
          assert sorted(reps)==list(range(17))
          print('PASS_RFT_V2_IMMUTABLE_17_SHARD_CACHE')
          PY

      - name: Run binding frozen RFT v2 GMN 2022 development
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_flow_tube_v2/run_development.py \
            --shards-dir input/shards \
            --frozen-source orbittrace_recurrent_flow_tube_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce binding gate and protected-data firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='output/RFT_V2_GMN2022_PRELABEL.json'
          r=json.load(open('output/RFT_V2_GMN2022_DEVELOPMENT.json'))
          pre=json.load(open(p))
          digest=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert digest==r['prelabel_sha256']
          assert pre['labels_enter_candidate_generation'] is False and r['labels_enter_candidate_generation'] is False
          assert pre['parameter_search'] is False and r['parameter_search'] is False
          assert pre['persistence_cutoff'] is False and r['persistence_cutoff'] is False
          assert pre['fusion_weight_search'] is False and r['fusion_weight_search'] is False
          assert r['post_result_rescue_authorized'] is False
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_DEVELOPMENT_ONLY'
          assert r['blind_exclusion']==[20.0,55.0]
          for k in ['target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access','sonotaco_2013_2014_access','gmn_2023_access']:
              assert r[k] is False and pre[k] is False
          assert set(r['binding_gates'])=={'qualified_ge_120','recovered_at_100_ge_55','top100_precision_ge_0p60','fragmentation_median_le_3'}
          print('RFT_V2_BINDING_RESULT',r['verdict'],r['binding_gates'])
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_recurrent_flow_tube_v2/PROTOCOL.md orbittrace_recurrent_flow_tube_v2/run_development.py orbittrace_recurrent_flow_tube_v1/run_development.py input/ranker/run_urc_union_ranker.py input/v8/pooled_year_centroid_v8_development.json > output/RFT_V2_SOURCE_INPUT_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-rft-v2-soft-evidence-flow-gmn2022
          path: output
          if-no-files-found: error
          retention-days: 90
