name: OrbitTrace reciprocal-transfer HDBSCAN v1 synthetic audit

on:
  push:
    branches:
      - agent/orbittrace-reciprocal-transfer-hdbscan-v1
    paths:
      - '.github/workflows/orbittrace_reciprocal_transfer_hdbscan_synthetic_audit_v1.yml'
      - 'orbittrace_reciprocal_transfer_hdbscan_v1/PROTOCOL.md'
      - 'orbittrace_reciprocal_transfer_hdbscan_v1/reciprocal_transfer.py'
      - 'orbittrace_reciprocal_transfer_hdbscan_v1/synthetic_audit.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  synthetic-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'

      - name: Verify frozen pre-GMN source bytes
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_reciprocal_transfer_hdbscan_v1/PROTOCOL.md)" = '6181ba8e4dfa34f869249389bda2eae46ca2c690'
          test "$(git hash-object orbittrace_reciprocal_transfer_hdbscan_v1/reciprocal_transfer.py)" = 'f3a7c8d5ea53bf856fb8d0225d5d578c4248e5ce'
          test "$(git hash-object orbittrace_reciprocal_transfer_hdbscan_v1/synthetic_audit.py)" = 'f2972d33e17fbcce948638cc37e486ce003b55d7'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          python -m py_compile \
            orbittrace_reciprocal_transfer_hdbscan_v1/reciprocal_transfer.py \
            orbittrace_reciprocal_transfer_hdbscan_v1/synthetic_audit.py

      - name: Run synthetic-only audit
        run: |
          set -euo pipefail
          rm -rf output_reciprocal_transfer_synthetic
          python -u -m orbittrace_reciprocal_transfer_hdbscan_v1.synthetic_audit

      - name: Enforce frozen audit/firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('output_reciprocal_transfer_synthetic/RECIPROCAL_TRANSFER_HDBSCAN_V1_SYNTHETIC_AUDIT.json'))
          assert p['verdict']=='PASS_RECIPROCAL_TRANSFER_HDBSCAN_V1_SYNTHETIC_AUDIT'
          assert p['prediction_data_native_identity_2022'] is True
          assert p['prediction_data_native_identity_2023'] is True
          assert p['strict_majority_50_percent_rejected'] is True
          assert p['strict_majority_75_percent_accepted'] is True
          assert p['deterministic_repeated_execution'] is True
          assert p['reciprocal_candidate_count'] >= 2
          for key in ('gmn_accessed','truth_accessed','sonotaco_accessed','amos_accessed','efn_accessed','orbittrace_target_access','maarsy_scientific_access','dms_scientific_access'):
              assert p[key] is False, key
          print(p['verdict'])
          PY

      - name: Preserve audit provenance
        if: always()
        run: |
          set +e
          mkdir -p output_reciprocal_transfer_synthetic
          sha256sum \
            orbittrace_reciprocal_transfer_hdbscan_v1/PROTOCOL.md \
            orbittrace_reciprocal_transfer_hdbscan_v1/reciprocal_transfer.py \
            orbittrace_reciprocal_transfer_hdbscan_v1/synthetic_audit.py \
            output_reciprocal_transfer_synthetic/RECIPROCAL_TRANSFER_HDBSCAN_V1_SYNTHETIC_AUDIT.json \
            > output_reciprocal_transfer_synthetic/source_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output_reciprocal_transfer_synthetic/execution_commit.txt
          python --version > output_reciprocal_transfer_synthetic/python_version.txt
          python -m pip freeze > output_reciprocal_transfer_synthetic/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-reciprocal-transfer-hdbscan-v1-synthetic-audit
          path: output_reciprocal_transfer_synthetic
          if-no-files-found: error
          retention-days: 90
