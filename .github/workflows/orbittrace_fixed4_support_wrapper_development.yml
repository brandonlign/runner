name: OrbitTrace fixed4 support wrapper development

on:
  pull_request:
    branches:
      - agent/orbittrace-fixed4-wrapper-saturation-audit
    paths:
      - orbittrace_fixed4_support_wrapper_development/**
      - .github/workflows/orbittrace_fixed4_support_wrapper_development.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-fixed4-support-wrapper-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEVELOPMENT_SOURCE_SHA256: 'fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62'
      DEVELOPMENT_SOURCE_BYTES: '36311'
      DEVELOPMENT_ENCODED_LENGTH: '13320'
      FROZEN_SCANNER_SHA256: '48434df612f790924e6efce45b6b8d4de1401880f398994bc58eef2fce0987e5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-fixed4-support-normalized-wrapper-development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Reconstruct and audit development source
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import ast
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          def decode_parts(root: str, count: int) -> bytes:
              paths = sorted(Path(root).glob('part*.b64'))
              expected = [f'part{i:02d}.b64' for i in range(count)]
              if [p.name for p in paths] != expected:
                  raise RuntimeError(f'wrong source parts under {root}: {[p.name for p in paths]}')
              encoded = ''.join(''.join(p.read_text(encoding='ascii').split()) for p in paths)
              return encoded.encode('ascii'), gzip.decompress(base64.b64decode(encoded, validate=True))

          encoded, source = decode_parts('orbittrace_fixed4_support_wrapper_development/source_parts', 4)
          if len(encoded) != int(os.environ['DEVELOPMENT_ENCODED_LENGTH']):
              raise RuntimeError(f'encoded length mismatch: {len(encoded)}')
          if len(source) != int(os.environ['DEVELOPMENT_SOURCE_BYTES']):
              raise RuntimeError(f'source byte mismatch: {len(source)}')
          digest = hashlib.sha256(source).hexdigest()
          if digest != os.environ['DEVELOPMENT_SOURCE_SHA256']:
              raise RuntimeError(f'development source hash mismatch: {digest}')

          _, original = decode_parts('orbittrace_fixed4_blind_catalogue/source_parts', 4)
          original_digest = hashlib.sha256(original).hexdigest()
          if original_digest != os.environ['FROZEN_SCANNER_SHA256']:
              raise RuntimeError(f'frozen scanner hash mismatch: {original_digest}')

          text = source.decode('utf-8')
          original_text = original.decode('utf-8')
          forbidden = [
              '247.17', '-14.34', '37.62', 'F0059', '8958194010', '8814798136',
              'april_candidate_members.csv', 'GhostStream_Expert_Review_Bundle',
          ]
          found = [value for value in forbidden if value in text]
          if found:
              raise RuntimeError(f'target information present in development source: {found}')

          def functions(value: str) -> dict[str, str]:
              tree = ast.parse(value)
              return {
                  node.name: ast.dump(node, include_attributes=False)
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              }

          before = functions(original_text)
          after = functions(text)
          changed = {name for name in before.keys() & after.keys() if before[name] != after[name]}
          allowed = {'parse_catalogue', 'scan_year', 'component_records', 'build_families', 'main'}
          if changed != allowed:
              raise RuntimeError(f'unexpected changed scanner functions: {sorted(changed)}')
          required_unchanged = {
              'read_gmn_frame', 'column_map', 'normalize_label', 'load_sources', 'feature_matrix',
              'exact_anchor_distances', 'quartet_score', 'circular_mean_deg', 'centroid_distance',
          }
          missing = [name for name in required_unchanged if before.get(name) != after.get(name)]
          if missing:
              raise RuntimeError(f'detector-core equivalence failed: {missing}')
          required_new = {'family_scores', 'rank_families', 'evaluate_panel', 'develop_wrapper'}
          if not required_new.issubset(after):
              raise RuntimeError(f'missing wrapper interfaces: {sorted(required_new - after.keys())}')

          parse_block = text[text.index('def parse_catalogue'):text.index('def circular_mean_deg')]
          if parse_block.index('between(BLIND_LOW, BLIND_HIGH') >= parse_block.index('map(normalize_label)'):
              raise RuntimeError('blind interval is not removed before label normalization')
          selection_block = text[text.index('def selection_key'):text.index('selected_variant =')]
          if 'validation' in selection_block:
              raise RuntimeError('validation result enters ranking selection')
          required_literals = [
              'YEARS = (2022, 2023, 2024, 2025)',
              'BLIND_LOW = 20.0', 'BLIND_HIGH = 55.0', 'CALIBRATION_PER_BIN = 128',
              'SHORTLIST_K = 64', 'AUDIT_SHORTLIST_K = 128', 'FAMILY_LINK_RADIUS = 1.5',
              '"development": (2022, 2023)', '"validation": (2024, 2025)',
              'PASS_SUPPORT_NORMALIZED_WRAPPER_DEVELOPMENT',
              'FAIL_SUPPORT_NORMALIZED_WRAPPER_DEVELOPMENT',
          ]
          absent = [value for value in required_literals if value not in text]
          if absent:
              raise RuntimeError(f'missing frozen literals: {absent}')

          Path('/tmp/run_fixed4_support_wrapper_development.py').write_bytes(source)
          Path('output/development_source_sha256.txt').write_text(digest + '\n', encoding='ascii')
          print('development source bytes:', len(source))
          print('development source SHA-256:', digest)
          print('frozen scanner SHA-256:', original_digest)
          print('changed functions:', sorted(changed))
          PY
          python -m py_compile /tmp/run_fixed4_support_wrapper_development.py
      - name: Run target-excluded temporal development
        run: |
          set -euo pipefail
          python /tmp/run_fixed4_support_wrapper_development.py \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --output output
          cat output/ORBITTRACE_FIXED4_SUPPORT_WRAPPER_DEVELOPMENT.md
      - name: Enforce result integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/orbittrace_fixed4_support_wrapper_development.json').read_text())
          allowed = {
              'PASS_SUPPORT_NORMALIZED_WRAPPER_DEVELOPMENT',
              'FAIL_SUPPORT_NORMALIZED_WRAPPER_DEVELOPMENT',
          }
          if result.get('verdict') not in allowed:
              raise SystemExit(f"invalid verdict: {result.get('verdict')}")
          development = result['development']
          if development['selection_used_years'] != [2022, 2023]:
              raise SystemExit('selection years changed')
          if development['untouched_validation_years'] != [2024, 2025]:
              raise SystemExit('validation years changed')
          print(json.dumps({
              'verdict': result['verdict'],
              'selected_variant': development['selected_variant'],
              'improvement_over_persistence': development['improvement_over_persistence'],
          }, indent=2))
          PY
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            orbittrace_fixed4_support_wrapper_development/PROTOCOL.md \
            orbittrace_fixed4_support_wrapper_development/source_parts/part00.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part01.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part02.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part03.b64 \
            sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-fixed4-support-normalized-wrapper-development
          path: output
          if-no-files-found: error
          retention-days: 90
