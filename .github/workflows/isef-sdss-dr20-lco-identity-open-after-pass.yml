name: ISEF SDSS DR20 guarded LCO identity opening
on:
  push:
    paths:
      - '.github/workflows/isef-sdss-dr20-lco-identity-open-after-pass.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  identity-open:
    runs-on: ubuntu-24.04
    env:
      ALLOW_IDENTITY_OPEN: YES_AFTER_ANONYMOUS_PASS
      EXPECTED_ANONYMOUS_SURVIVORS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'scipy>=1.16' 'astropy>=7.1,<8' 'galpy>=1.12,<2'
      - run: timeout 3600s python isef/sdss_dr20_lco_identity_open_after_pass.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-sdss-dr20-lco-identity-open-after-pass
          path: results/sdss_dr20_lco_final_anonymous_gate.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## SDSS DR20 guarded identity opening'; echo '```json'; cat results/sdss_dr20_lco_final_anonymous_gate.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
