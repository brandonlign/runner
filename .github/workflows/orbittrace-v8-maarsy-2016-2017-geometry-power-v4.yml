name: OrbitTrace v8 MAARSY 2016-2017 geometry-power v4

on:
  pull_request:
    branches:
      - agent/orbittrace-v8-maarsy-2016-2017-geometry-power
    paths:
      - 'orbittrace_v8_maarsy_2016_2017_geometry_power/RUN_V4.md'

permissions:
  contents: read
  actions: read

jobs:
  geometry_power:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out frozen geometry-power parent
        uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v8-maarsy-2016-2017-geometry-power
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact scientific dependencies before data access
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'h5py==3.11.0'
          python - <<'PY'
          import h5py
          assert h5py.__version__=='3.11.0'
          PY

      - name: Enforce frozen sources and exact ingestion corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v3 input/v8 input/author input/source_audit input/stage0e runtime output

          test -f orbittrace_v8_maarsy_2016_2017_geometry_power/PREDATA_AST_GUARD_CORRECTION.md
          test -f orbittrace_v8_maarsy_2016_2017_geometry_power/ZENODO_FILE_LINK_SCHEMA_CORRECTION.md
          test -f orbittrace_v8_maarsy_2016_2017_geometry_power/ARCHIVE_MEMBER_ORDER_CORRECTION.md
          test "$(git hash-object orbittrace_v8_maarsy_2016_2017_geometry_power/run_geometry_power.py)" = '2c04a1be4134ee07162b60e3168c6f1684299cf3'
          test "$(git hash-object orbittrace_v8_maarsy_2016_2017_geometry_power/apply_zenodo_file_link_schema_fix.py)" = '95f1028968cbf71634c64295515cfeffcd2d82bb'
          test "$(git hash-object orbittrace_v8_maarsy_2016_2017_geometry_power/apply_archive_member_order_fix.py)" = 'f38c1c8e1ddcfb8bd73d795e132bf744b4b70787'
          python -m py_compile \
            orbittrace_v8_maarsy_2016_2017_geometry_power/run_geometry_power.py \
            orbittrace_v8_maarsy_2016_2017_geometry_power/apply_zenodo_file_link_schema_fix.py \
            orbittrace_v8_maarsy_2016_2017_geometry_power/apply_archive_member_order_fix.py
          test "$(git hash-object orbittrace_pooled_year_centroid_v8/run_development.py)" = 'f248df78e1258b132b41aecca6a985a5eb782654'
          test "$(git hash-object orbittrace_label_free_sparse_support_v6/run_development.py)" = '7995fc6b75d1fd51eb4b304ace39db28a5a1e876'
          test "$(git hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'

          rm -rf output/*
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          cp output/wavelet_catalogue_v3_source_audit.json input/source_audit/source_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('input/source_audit/source_audit.json').read_text())
          assert r['verdict']=='PASS_WAVELET_CATALOGUE_V3_SOURCE_AUDIT'
          assert r['support_source_sha256']=='fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62'
          assert r['target_information_present'] is False
          assert r['labels_enter_candidate_generation'] is False
          PY
          rm -rf output/*

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009728299/zip" \
            -o input/v8.zip
          echo '88d2d607e05d027015c338f7e23b64a6195e55ae24f1b2ac745f5e9bc6df599e  input/v8.zip' | sha256sum -c -
          unzip -q input/v8.zip -d input/v8
          test -f input/v8/pooled_year_centroid_v8_development.json

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9014157024/zip" \
            -o input/stage0e.zip
          echo '9e65634b640ff3919ee1e64d696cdbd012f6f46995d8e21c0b9ebaaabdaa9e00  input/stage0e.zip' | sha256sum -c -
          unzip -q input/stage0e.zip -d input/stage0e
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('input/stage0e/stage0e_metadata.json').read_text())
          assert r['event_row_access'] is False
          assert r['file_bytes_downloaded'] is False
          f=r['file']
          assert f['key']=='silseth_thesis_data.tar.gz'
          assert f['size']==21485785089
          assert f['checksum']=='md5:01820c6a90ea1415b011bb013a4d9213'
          assert f['links']=={'self':'https://zenodo.org/api/records/15553437/files/silseth_thesis_data.tar.gz/content'}
          PY

          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/jvierine/pansy_receiver/a9f40ab941fa6fec0a781de552c2a4341c8639ba/simple_radiant.py' \
            -o input/author/simple_radiant.py
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/jvierine/pansy_receiver/a9f40ab941fa6fec0a781de552c2a4341c8639ba/plot_simple_fits.py' \
            -o input/author/plot_simple_fits.py
          test "$(git hash-object input/author/simple_radiant.py)" = '8a02bd409cc07436c61b1a557bb26754485abbea'
          test "$(git hash-object input/author/plot_simple_fits.py)" = '6383dfd00b0981c1c2f5d741353bda5a5b5b8969'
          grep -Fq "transform_to('geocentricmeanecliptic')" input/author/simple_radiant.py
          grep -Fq 'sc_gc_lat = c_ecl.lat.deg' input/author/simple_radiant.py
          grep -Fq 'slats.append(dd[k]["eclat"])' input/author/plot_simple_fits.py
          grep -Fq 'slons.append(dd[k]["eclon"])' input/author/plot_simple_fits.py
          grep -Fq 'vgs.append(n.linalg.norm(dd[k]["v0"]))' input/author/plot_simple_fits.py
          grep -Fq 'Geocentric velocity (km/s)' input/author/plot_simple_fits.py

          # Correction 1: exact pre-frozen Zenodo file-link schema only.
          python orbittrace_v8_maarsy_2016_2017_geometry_power/apply_zenodo_file_link_schema_fix.py \
            --source orbittrace_v8_maarsy_2016_2017_geometry_power/run_geometry_power.py \
            --output runtime/intermediate.py
          test "$(sha256sum runtime/intermediate.py | awk '{print $1}')" = '90d431819212e97adbc272acfa3c34595dac411f2bfe7c14a1a53535d789a01d'

          # Correction 2: remove only the physical tar-header chronology assertion.
          python orbittrace_v8_maarsy_2016_2017_geometry_power/apply_archive_member_order_fix.py \
            --source runtime/intermediate.py \
            --output runtime/run_geometry_power.py
          python -m py_compile runtime/run_geometry_power.py
          ! grep -Fq 'non-monotonic selected month order' runtime/run_geometry_power.py
          grep -Fq 'duplicate selected year-month' runtime/run_geometry_power.py
          grep -Fq 'selected_months[year].append(month)' runtime/run_geometry_power.py

          # Verify the exact two-patch source relationship.
          python - <<'PY'
          from pathlib import Path
          original=Path('orbittrace_v8_maarsy_2016_2017_geometry_power/run_geometry_power.py').read_text()
          runtime=Path('runtime/run_geometry_power.py').read_text()
          zneedle='(f.get("links") or {}).get("content", "")'
          zrepl='((f.get("links") or {}).get("content") or (f.get("links") or {}).get("self") or "")'
          oneedle='''                if selected_months[year]:\n                    require(month > selected_months[year][-1], f"non-monotonic selected month order in {year}: {month}")\n                selected_months[year].append(month)\n'''
          orepl='''                selected_months[year].append(month)\n'''
          expected=original.replace(zneedle,zrepl).replace(oneedle,orepl)
          assert runtime==expected
          PY

          # Same HDF5 source firewall as before.
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('runtime/run_geometry_power.py')
          tree=ast.parse(p.read_text())
          literal=[]; dynamic=0
          for n in ast.walk(tree):
              if isinstance(n,ast.Subscript) and isinstance(n.value,ast.Name) and n.value.id=='h':
                  s=n.slice
                  if isinstance(s,ast.Constant) and isinstance(s.value,str): literal.append(s.value)
                  else: dynamic+=1
          allowed={'sun_lon','slat','slon','vels'}
          assert not (set(literal)-allowed), sorted(set(literal)-allowed)
          assert dynamic==2, dynamic
          source=p.read_text()
          assert 'REQUIRED_GEOMETRY_DATASETS = ("sun_lon", "slat", "slon", "vels")' in source
          PY

          # Pre-data synthetic proof that the exact identity cap is processing-order invariant.
          PYTHONPATH=input/v3:orbittrace_wavelet_catalogue_v3:. python - <<'PY'
          import importlib.util, random
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('maarsy_runtime',Path('runtime/run_geometry_power.py'))
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          events=[{'id':f'SYNTH|{i:05d}','sol':1.0,'sun_lon':0.0,'ecl_lat':0.0,'vg':30.0} for i in range(10050)]
          def retained(seq):
              h=[]
              for e in seq: m.heap_push_smallest(h,e)
              return sorted(x[2]['id'] for x in h)
          forward=retained(events)
          reverse=retained(list(reversed(events)))
          shuffled=list(events); random.Random(1701).shuffle(shuffled)
          permuted=retained(shuffled)
          assert len(forward)==10000
          assert forward==reverse==permuted
          print('PASS_IDENTITY_CAP_ORDER_INVARIANCE')
          PY

          test ! -e orbittrace_v8_final_blind_discovery/STAGE_A_EXECUTION_REQUEST.json
          test ! -e orbittrace_v8_final_blind_discovery/STAGE_B_EXECUTION_REQUEST.json
          echo PASS_MAARSY_2016_2017_GEOMETRY_POWER_V4_PREDATA_GUARDS

      - name: Run archive-order-corrected frozen MAARSY geometry-power stage
        env:
          PYTHONPATH: input/v3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python runtime/run_geometry_power.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --source-audit-json input/source_audit/source_audit.json \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output
          cat output/V8_MAARSY_2016_2017_GEOMETRY_POWER.md

      - name: Enforce frozen result boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('output/v8_maarsy_2016_2017_geometry_power.json').read_text())
          assert r['verdict'] in {
            'FAIL_MAARSY_GEOMETRY_INTERFACE_OR_INTEGRITY',
            'INCONCLUSIVE_V8_MAARSY_EXTERNAL_POWER_N',
            'PASS_V8_MAARSY_EXTERNAL_N_POWER_GATE',
          }
          assert r['configuration']['years']==[2016,2017]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['density_cap_per_10deg_bin']==10000
          assert r['configuration']['family_link_radius']==1.5
          assert r['configuration']['episode_size']==128
          assert r['configuration']['minimum_recurrent_families_N']==100
          assert r['configuration']['orbital_power_floor_Q_deferred']==30
          assert r['orbit_access'] is False
          assert r['target_information_access'] is False
          assert r['v8_method_changed'] is False
          assert r['external_power_floors_lowered'] is False
          assert r['final_gmn_stage_a_authorized'] is False
          assert r['transport_and_parser_audit']['target_interval_radiant_speed_read'] is False
          assert r['transport_and_parser_audit']['orbital_dataset_opened'] is False
          ranked=json.loads(Path('output/maarsy_v8_geometry_rankings.json').read_text())
          canon=json.dumps(ranked,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          assert hashlib.sha256(canon).hexdigest()==r['ranking_sha256_before_any_orbit_access']
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_source_commit.txt
          sha256sum \
            orbittrace_v8_maarsy_2016_2017_geometry_power/PROTOCOL.md \
            orbittrace_v8_maarsy_2016_2017_geometry_power/PREDATA_AST_GUARD_CORRECTION.md \
            orbittrace_v8_maarsy_2016_2017_geometry_power/ZENODO_FILE_LINK_SCHEMA_CORRECTION.md \
            orbittrace_v8_maarsy_2016_2017_geometry_power/ARCHIVE_MEMBER_ORDER_CORRECTION.md \
            orbittrace_v8_maarsy_2016_2017_geometry_power/run_geometry_power.py \
            orbittrace_v8_maarsy_2016_2017_geometry_power/apply_zenodo_file_link_schema_fix.py \
            orbittrace_v8_maarsy_2016_2017_geometry_power/apply_archive_member_order_fix.py \
            runtime/run_geometry_power.py \
            input/stage0e/stage0e_metadata.json \
            input/author/simple_radiant.py input/author/plot_simple_fits.py \
            > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload MAARSY geometry-power v4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v8-maarsy-2016-2017-geometry-power-v4
          path: output
          if-no-files-found: error
          retention-days: 90
