name: OrbitTrace fixed4 RRF diagnosis

on:
  pull_request:
    branches:
      - agent/orbittrace-fixed4-support-normalized-wrapper-development
    paths:
      - orbittrace_fixed4_rrf_diagnosis/**
      - .github/workflows/orbittrace_fixed4_rrf_diagnosis.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_ID: '8971289223'
      ARTIFACT_SHA256: '01a7158ee5cf79e212689b3eb24438bbf98f959dc3588141f073412b1a9c5999'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-fixed4-rrf-diagnosis
      - name: Retrieve exact v2 artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o input.zip
          echo "${ARTIFACT_SHA256}  input.zip" | sha256sum -c -
          unzip -q input.zip -d input
      - name: Run frozen diagnosis
        run: |
          set -euo pipefail
          python orbittrace_fixed4_rrf_diagnosis/audit.py --input input --output output
      - name: Record provenance
        if: always()
        run: |
          sha256sum orbittrace_fixed4_rrf_diagnosis/PROTOCOL.md orbittrace_fixed4_rrf_diagnosis/audit.py input.zip > output/source_and_input_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-fixed4-rrf-diagnosis
          path: output
          if-no-files-found: error
          retention-days: 90
