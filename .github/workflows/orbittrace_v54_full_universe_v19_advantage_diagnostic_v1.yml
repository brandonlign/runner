name: OrbitTrace v54 full-universe v19-advantage diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v54_full_universe_v19_advantage_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v54_full_universe_v19_advantage_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v54-full-universe-v19-advantage-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen v54 diagnostic sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v51 input/v1157 input/payload input/truth output/freeze output/diag
          test "$(git hash-object orbittrace_v54_full_universe_v19_advantage_diagnostic_v1/PROTOCOL.md)" = 'b4cf66db8c9073027ace2ff371f9b9e6bfd59462'
          test "$(git hash-object orbittrace_v54_full_universe_v19_advantage_diagnostic_v1/diagnose.py)" = '7845bbee839c613fec49fe6c6296705e9435b43e'
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v54_full_universe_v19_advantage_diagnostic_v1/diagnose.py
          echo PASS_V54_FROZEN_SOURCE_PINS

      - name: Restore prior v51 and #1157 authorizers before current outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9101972590/zip' -o input/v51.zip
          echo '56258a0be52d83c0d6dbfcffdb9fd9a2c6b73587ba8d92d7bdccdef9729868c9  input/v51.zip' | sha256sum -c -
          unzip -q input/v51.zip -d input/v51
          echo '5f20a8bedb6e7b8d6c06d66e45d5037057a9853ded35a2b360333d6ea5e2c4cc  input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json' | sha256sum -c -

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9102914767/zip' -o input/v1157.zip
          echo '2441cb6fb4401601976ada3feb59db6cf658bc8eba4f0e5a3bc06b743aa8c167  input/v1157.zip' | sha256sum -c -
          unzip -q input/v1157.zip -d input/v1157
          echo '165f094fafa0f0f1e78b57dca83fbbf2aeee5d15bdefc9ba4b6f349d495e0aa7  input/v1157/diag/V31_INTERNAL_V19_SUPPRESSION_DIAGNOSTIC.json' | sha256sum -c -
          echo PASS_V54_PRIOR_AUTHORIZER_PINS

      - name: Freeze complete 229-family v19-advantage vector before current recoverability
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.
        run: |
          set -euo pipefail
          python -u orbittrace_v54_full_universe_v19_advantage_diagnostic_v1/diagnose.py freeze \
            --v51-vector input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json \
            --v1157-result input/v1157/diag/V31_INTERNAL_V19_SUPPRESSION_DIAGNOSTIC.json \
            --output output/freeze
          python - <<'PY'
          import hashlib,json
          p='output/freeze/V54_FULL_UNIVERSE_V19_ADVANTAGE_VECTOR.json'
          r=json.load(open(p))
          assert r['verdict']=='PASS_V54_FULL_UNIVERSE_V19_ADVANTAGE_VECTOR_FREEZE'
          assert r['scientific_role']=='COMPLETE_229_HDB_V19_ADVANTAGE_VECTOR_FROZEN_BEFORE_CURRENT_RECOVERABILITY_ATTACHMENT'
          assert r['family_count']==229 and len(r['families'])==229 and len({x['family_id'] for x in r['families']})==229
          assert r['positive_advantage_count']==104 and r['negative_advantage_count']==124 and r['zero_advantage_count']==1
          assert abs(r['minimum_v19_advantage']-(-176/228))<1e-15
          assert abs(r['maximum_v19_advantage']-(160/228))<1e-15
          assert r['current_annual_f1_attached'] is False and r['current_recoverability_attached'] is False
          for k in ('literature_budget_used','literature_panel_evaluated','boundary_identity_used','v1157_missed_surfaced_identity_used','v52_substitution_identity_used','component_quality_topology_signal_used','new_candidate_order_evaluated','selector_evaluated','replacement_rule_evaluated','successor_selected','threshold_selected','quantile_selected','top_k_selected','rank_window_selected','fusion_weight_search','rank_algebra_search','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print('PASS_V54_FULL_UNIVERSE_VECTOR_FREEZE',hashlib.sha256(open(p,'rb').read()).hexdigest(),r['canonical_sha256_without_self_field'])
          PY

      - name: Restore immutable #950 HDB payload only after vector freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f output/freeze/V54_FULL_UNIVERSE_V19_ADVANTAGE_VECTOR.json
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          m=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          f=json.load(open('input/payload/hdbscan/family_memberships.json'))
          assert m['truth_accessed'] is False and f['truth_accessed'] is False
          assert m['feature_dimension']==71 and len(m['family_ids'])==229 and len(f['families'])==229
          assert [str(x['family_id']) for x in f['families']]==list(map(str,m['family_ids']))
          assert m['target_information_access'] is False
          assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_V54_IMMUTABLE_HDB_PRETRUTH_PAYLOAD')
          PY

      - name: Load immutable exposed SonotaCo truth only after full-universe vector freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f output/freeze/V54_FULL_UNIVERSE_V19_ADVANTAGE_VECTOR.json
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
          echo PASS_V54_EXPOSED_TRUTH_LOADED_AFTER_VECTOR_FREEZE

      - name: Run sole frozen full-universe v19-advantage diagnostic
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.
        run: |
          set -euo pipefail
          python -u orbittrace_v54_full_universe_v19_advantage_diagnostic_v1/diagnose.py diagnose \
            --vector-file output/freeze/V54_FULL_UNIVERSE_V19_ADVANTAGE_VECTOR.json \
            --hdb-root input/payload/hdbscan --truth-root input/truth \
            --output output/diag

      - name: Enforce diagnostic-only scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V54_FULL_UNIVERSE_V19_ADVANTAGE_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V54_FULL_UNIVERSE_V19_ADVANTAGE_DIAGNOSTIC','FAIL_V54_FULL_UNIVERSE_V19_ADVANTAGE_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_V1157_FULL_UNIVERSE_V19_ADVANTAGE_MECHANISM_DIAGNOSTIC_ONLY_NO_SUCCESSOR_EVALUATED'
          assert r['family_count']==229 and set(r['annual_diagnostics'])=={'2013','2014'}
          for y in ('2013','2014'):
              assert set(r['annual_diagnostics'][y])=={'recoverable','nonrecoverable','median_difference_recoverable_minus_nonrecoverable','direction_pass'}
          for k in ('literature_panel_evaluated','new_candidate_order_evaluated','selector_evaluated','replacement_rule_evaluated','successor_selected','positive_sign_selector_evaluated','rank_gap_threshold_search','magnitude_threshold_search','quantile_search','top_k_search','rank_window_search','budget_specific_rule','year_specific_rule','group_aggregation_evaluated','alternate_rank_normalization_search','absolute_gap_search','ratio_search','log_transform_search','fusion_weight_search','rank_algebra_search','component_quality_topology_rescue','boundary_identity_used','oracle_identity_used_for_ranking','feature_search','model_search','k_search','metric_search','scaling_search','diversity_search','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['annual_diagnostics'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v54_full_universe_v19_advantage_diagnostic_v1/PROTOCOL.md \
            orbittrace_v54_full_universe_v19_advantage_diagnostic_v1/diagnose.py \
            input/v51.zip input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json \
            input/v1157.zip input/v1157/diag/V31_INTERNAL_V19_SUPPRESSION_DIAGNOSTIC.json \
            output/freeze/V54_FULL_UNIVERSE_V19_ADVANTAGE_VECTOR.json \
            input/payload.zip input/truth.zip \
            output/diag/V54_FULL_UNIVERSE_V19_ADVANTAGE_DIAGNOSTIC.json \
            > output/V54_FULL_UNIVERSE_V19_ADVANTAGE_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v54-full-universe-v19-advantage-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
