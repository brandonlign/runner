name: OrbitTrace phase-equalized recurrent-EOM v1 synthetic audit

on:
  push:
    branches:
      - agent/orbittrace-phase-equalized-recurrent-eom-v1
    paths:
      - '.github/workflows/orbittrace_phase_equalized_recurrent_eom_v1_synthetic_audit.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  synthetic-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact synthetic runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3'
          mkdir -p output
          test "$(git hash-object orbittrace_phase_equalized_recurrent_eom_v1/PROTOCOL.md)" = 'ff509b57fd2139406e823497a85468017414dcca'
          test "$(git hash-object orbittrace_phase_equalized_recurrent_eom_v1/phase_equalization.py)" = '6577d900814b8c79aad355bdb05d426204f20d4a'
          test "$(git hash-object orbittrace_phase_equalized_recurrent_eom_v1/synthetic_audit.py)" = '2a3b8bd2f534c0ba7dc4c12a7e5d18b1dc452080'
          python -m py_compile \
            orbittrace_phase_equalized_recurrent_eom_v1/phase_equalization.py \
            orbittrace_phase_equalized_recurrent_eom_v1/synthetic_audit.py
      - name: Run zero-data synthetic audit
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m orbittrace_phase_equalized_recurrent_eom_v1.synthetic_audit --output output
          python - <<'PY'
          import json
          p=json.load(open('output/PHASE_EQUALIZED_RECURRENT_EOM_V1_SYNTHETIC_AUDIT.json'))
          assert p['verdict']=='PASS_PHASE_EQUALIZED_RECURRENT_EOM_V1_SYNTHETIC_AUDIT'
          assert all(p['checks'].values())
          assert p['gmn_accessed'] is False
          assert p['truth_accessed'] is False
          assert p['target_information_access'] is False
          assert p['target_region_events_accessed'] is False
          assert p['sonotaco_2013_2014_access'] is False
          assert p['amos_scientific_access'] is False
          assert p['efn_scientific_access'] is False
          assert p['asfn_scientific_access'] is False
          assert p['maarsy_scientific_access'] is False
          assert p['dms_scientific_access'] is False
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_phase_equalized_recurrent_eom_v1/PROTOCOL.md \
            orbittrace_phase_equalized_recurrent_eom_v1/phase_equalization.py \
            orbittrace_phase_equalized_recurrent_eom_v1/synthetic_audit.py \
            output/PHASE_EQUALIZED_RECURRENT_EOM_V1_SYNTHETIC_AUDIT.json \
            > output/source_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-phase-equalized-recurrent-eom-v1-synthetic-audit
          path: output
          if-no-files-found: error
          retention-days: 90
