name: InvariantStreamNet Stage-0

on:
  push:
    branches:
      - agent/invariant-streamnet-stage0
    paths:
      - invariant_streamnet_stage0/**
      - .github/workflows/invariant_streamnet_stage0.yml
  pull_request:
    branches:
      - main
    paths:
      - invariant_streamnet_stage0/**
      - .github/workflows/invariant_streamnet_stage0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invariant-streamnet-stage0
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/invariant-streamnet-stage0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: invariant_streamnet_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r invariant_streamnet_stage0/requirements.txt
      - name: Verify launcher and frozen source
        run: |
          python -m py_compile invariant_streamnet_stage0/run_stage0.py
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payload = Path('invariant_streamnet_stage0/run_stage0.py.gz.b64')
          source = gzip.decompress(base64.b64decode(''.join(payload.read_text().split()), validate=True))
          expected = '9e5aff4130b416c3b12d8b05bc88c8591adfd0b968bb454f6ffcfd7ef81e56e7'
          actual = hashlib.sha256(source).hexdigest()
          print(f'bytes={len(source)} sha256={actual}')
          assert len(source) == 32787
          assert actual == expected
          compile(source, '<frozen-invariant-streamnet-stage0>', 'exec')
          PY
      - name: Run frozen cross-network real-background kill test
        run: python invariant_streamnet_stage0/run_stage0.py --train-samples 6000 --val-samples 1500 --calibration-samples 800 --test-samples 1600 --epochs 12
      - name: Record execution provenance
        run: |
          mkdir -p invariant_streamnet_stage0/results
          sha256sum invariant_streamnet_stage0/run_stage0.py.gz.b64 invariant_streamnet_stage0/run_stage0.py > invariant_streamnet_stage0/results/source_files_sha256.txt
          python --version > invariant_streamnet_stage0/results/python_version.txt
          python -m pip freeze > invariant_streamnet_stage0/results/environment.txt
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: invariant-streamnet-stage0
          path: |
            invariant_streamnet_stage0/results
            invariant_streamnet_stage0/PROTOCOL.md
            invariant_streamnet_stage0/PRIOR_ART_BOUNDARY.md
            invariant_streamnet_stage0/run_stage0.py
            invariant_streamnet_stage0/run_stage0.py.gz.b64
          if-no-files-found: error
          retention-days: 90
      - name: Preserve benchmark result on runner branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add invariant_streamnet_stage0/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Preserve InvariantStreamNet Stage-0 result'
            git pull --rebase origin agent/invariant-streamnet-stage0
            git push origin HEAD:agent/invariant-streamnet-stage0
          fi
