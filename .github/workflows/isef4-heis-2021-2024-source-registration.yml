name: LUNARSHIFT unreported-interval Heis actual calibrated source registration
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/isef4-heis-2021-2024-source-registration.yml"
      - "scripts/isef4_heis_post2021_registration.py"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: isef4-heis-2021-2024-original-scene-affine
  cancel-in-progress: false
jobs:
  actual-temporal-source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source geometric model code
        run: python -m py_compile scripts/isef4_heis_post2021_registration.py
      - name: Restore exact 2021 and 2024 official calibrated original NAC pixels
        uses: actions/download-artifact@v4
        with:
          name: isef4-Heis-2021-2024-actual-original-calibrated-NAC-pair
          run-id: 35488946344
          github-token: ${{ github.token }}
          path: work/source
      - name: Fit off-slide terrain and report all withheld model scores
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy opencv-python-headless
          python scripts/isef4_heis_post2021_registration.py \
            --source-folder work/source/output/heis_2021_2024_verified_original_CDR \
            --source-manifest diagnostics/isef4_heis_2021_2024_original_calibrated_source_pair.json \
            --out diagnostics/isef4_heis_2021_2024_off_event_registration.json
      - name: Preserve failed and successful original source fits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef4-Heis-2021-2024-unreported-interval-source-registration
          path: diagnostics/isef4_heis_2021_2024_off_event_registration.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit bounded actual source registration metrics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f=diagnostics/isef4_heis_2021_2024_off_event_registration.json
          if [[ -f "$f" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$f"
            if ! git diff --cached --quiet; then
              git commit -m 'Audit actual 2021-to-2024 lunar terrain registration'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
