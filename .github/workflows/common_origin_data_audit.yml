name: Common-origin methodology data audit

on:
  push:
    branches:
      - agent/common-origin-stage0-pilot
    paths:
      - common_origin_pilot/**
      - .github/workflows/common_origin_data_audit.yml
  pull_request:
    branches:
      - main
    paths:
      - common_origin_pilot/**
      - .github/workflows/common_origin_data_audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: common-origin-stage0
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/common-origin-stage0-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: common_origin_pilot/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r common_origin_pilot/requirements.txt
      - name: Compile
        run: python -m py_compile common_origin_pilot/audit_lookup_table.py
      - name: Audit published shower lookup table
        run: python common_origin_pilot/audit_lookup_table.py
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: common-origin-lookup-audit
          path: common_origin_pilot/results
          if-no-files-found: error
          retention-days: 90
      - name: Preserve audit results on branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add common_origin_pilot/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Preserve shower lookup audit results'
            git pull --rebase origin agent/common-origin-stage0-pilot
            git push origin HEAD:agent/common-origin-stage0-pilot
          fi
