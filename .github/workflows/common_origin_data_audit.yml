name: Common-origin Stage-0 surrogate benchmark

on:
  push:
    branches:
      - agent/common-origin-stage0-pilot
    paths:
      - common_origin_pilot/**
      - .github/workflows/common_origin_data_audit.yml
  pull_request:
    branches:
      - main
    paths:
      - common_origin_pilot/**
      - .github/workflows/common_origin_data_audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: common-origin-stage0
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/common-origin-stage0-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: common_origin_pilot/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r common_origin_pilot/requirements.txt
      - name: Reconstruct and verify frozen source
        run: |
          rm -f common_origin_pilot/run_stage0_surrogate.py
          for part in common_origin_pilot/stage0_parts/part*.b64; do
            base64 --decode --ignore-garbage "$part"
          done > common_origin_pilot/run_stage0_surrogate.py
          actual="$(sha256sum common_origin_pilot/run_stage0_surrogate.py | cut -d' ' -f1)"
          expected="c0ba3eeef11e0826ad1332956fde5b3afb82ae0515faf1b7b9f7dc8484653edb"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"
          python -m py_compile common_origin_pilot/run_stage0_surrogate.py
      - name: Run parent-disjoint surrogate kill test
        run: python common_origin_pilot/run_stage0_surrogate.py
      - name: Record execution provenance
        run: |
          mkdir -p common_origin_pilot/results
          sha256sum common_origin_pilot/run_stage0_surrogate.py > common_origin_pilot/results/stage0_source_sha256.txt
          python --version > common_origin_pilot/results/python_version.txt
          python -m pip freeze > common_origin_pilot/results/environment.txt
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: common-origin-stage0-surrogate
          path: |
            common_origin_pilot/results
            common_origin_pilot/run_stage0_surrogate.py
          if-no-files-found: error
          retention-days: 90
      - name: Preserve verified results on branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add common_origin_pilot/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Preserve common-origin Stage-0 surrogate results'
            git pull --rebase origin agent/common-origin-stage0-pilot
            git push origin HEAD:agent/common-origin-stage0-pilot
          fi
