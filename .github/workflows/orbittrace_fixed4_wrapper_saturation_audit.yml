name: OrbitTrace GMN member-covariance shape OOF v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-member-covariance-shape-oof-v1
    paths:
      - orbittrace_gmn_member_covariance_shape_oof_v1/**
      - .github/workflows/orbittrace_fixed4_wrapper_saturation_audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-gmn-member-covariance-shape-oof-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-gmn-member-covariance-shape-oof-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact runtime and verify frozen successor source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          mkdir -p input/v3 input/parent output
          test "$(git hash-object orbittrace_gmn_member_covariance_shape_oof_v1/PROTOCOL.md)" = 'a3d9c3aac54480ea2fb6654e1873b602ac26f60b'
          test "$(git hash-object orbittrace_gmn_member_covariance_shape_oof_v1/run_development.py)" = 'f041a187337b6a0927d6c0ab19859737612f4d1f'
          python -m py_compile orbittrace_gmn_member_covariance_shape_oof_v1/run_development.py
      - name: Restore exact promoted-v8 runtime and #1194 parent
        run: |
          set -euo pipefail
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          git fetch --no-tags --depth=1 origin a2d11f45cd6e5d6a3f80738a43e04962162abd23
          git show FETCH_HEAD:orbittrace_gmn_representative_share_ranking_v1/run_development.py > input/parent/run_development.py
          test "$(git hash-object input/parent/run_development.py)" = '340f9d54b42ba2500652d7f0a74f22bbd3354f2e'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p20-recurrent-isolated-quartet-development
          path: input/p20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31341591263
      - name: Verify immutable development inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/p19/p19_subthreshold_reciprocal_recurrence_development.json | cut -d' ' -f1)" = '6f1ad0626b8a8bda03f18e7f3435f0651af8bebf65cfd1d970a6b61a8ba52319'
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
          test "$(sha256sum input/p20/p20_recurrent_isolated_quartet_development.json | cut -d' ' -f1)" = '9ec53f29281b11002a9e22b1086d12e054392e466ea74fe82ead0187289ba303'
          test "$(sha256sum input/p20/p20_prelabel_payload.json | cut -d' ' -f1)" = '8ca358ae0f3ac96b188de9eac7bcfd6f870470873a2b7ee73b7ae76497c12734'
          python -m py_compile input/parent/run_development.py input/ranker/run_urc_union_ranker.py
      - name: Run sole frozen member-covariance OOF evaluation
        env:
          ORBITTRACE_REPRESENTATIVE_SHARE_PARENT_SOURCE: input/parent/run_development.py
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_member_covariance_shape_oof_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p19-result-json input/p19/p19_subthreshold_reciprocal_recurrence_development.json \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --p20-result-json input/p20/p20_recurrent_isolated_quartet_development.json \
            --p20-prelabel-json input/p20/p20_prelabel_payload.json \
            --output output
      - name: Enforce binding schema and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/GMN_MEMBER_COVARIANCE_SHAPE_OOF_V1.json'))
          assert r['candidate_counts']=={'hard':226,'p19':1075,'p20':3203,'union':4504}
          assert r['feature_dimension_parent']==34 and r['feature_dimension_candidate']==40
          assert len(r['shape_feature_names'])==6
          p=r['parent_oof']
          assert p['recovered_at_25']==22 and p['recovered_at_50']==43 and p['recovered_at_100']==80 and p['recovered_at_500']==171
          assert p['qualified_matches']==256
          assert abs(p['top100_dominant_precision']-0.8075287489258385)<1e-12
          assert abs(p['mrr']-0.02016666446026534)<1e-12
          assert r['parent_oof_order_sha256']=='a2f365e0a35fc3e8eef39022128c0444448671ab4c4d4b45c89f718de4505592'
          assert r['parent_feature_sha256']=='5d215c5562c0ccce967d81ff0a087ca83b1afda95a269888d2219ef669d198d1'
          assert r['representative_share_target_sha256']=='4433b443030a568f9d5f6ddceab2077e9d78e50497f7ce2473bad5c113f8ab39'
          assert r['grouped_weights_sha256']=='4ee439f0f04c9763a3dcc1527be66681496ea730df369f3c2f1815c9ef4a67f6'
          assert r['full_candidate_model_fit'] is False
          assert r['feature_search'] is False and r['model_search'] is False and r['hyperparameter_search'] is False and r['diversity_search'] is False and r['target_search'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['sonotaco_2013_2014_access'] is False and r['sonotaco_feature_access'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['verdict'] in {'PASS_GMN_MEMBER_COVARIANCE_SHAPE_OOF_V1','FAIL_GMN_MEMBER_COVARIANCE_SHAPE_OOF_V1'}
          print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - name: Record binding provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum \
            orbittrace_gmn_member_covariance_shape_oof_v1/PROTOCOL.md \
            orbittrace_gmn_member_covariance_shape_oof_v1/run_development.py \
            input/parent/run_development.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            input/p19/p19_prelabel_payload.json \
            input/p20/p20_prelabel_payload.json \
            > output/binding_provenance_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-member-covariance-shape-oof-v1
          path: output
          if-no-files-found: error
          retention-days: 90
