name: OrbitTrace GMN balanced logit OOF v1 binding

on:
  push:
    branches:
      - agent/orbittrace-gmn-balanced-logit-oof-v1
    paths:
      - .github/workflows/orbittrace_fixed4_wrapper_saturation_audit.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-gmn-balanced-logit-oof-v1-binding
  cancel-in-progress: false

jobs:
  binding-development:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      FROZEN_PROTOCOL_SHA: 5b2cf9aae07a2a84da03233a1e3a7105cc1eb5d0
      FROZEN_IMPLEMENTATION_SHA: 6331a0fbe9731cf1f7a02cc199a08e726ab0ac04
      FROZEN_V8_RUNTIME_SHA: c9d6c44704013ba0c9430100e98a29a56b453304
      V3_SOURCE_SHA: d8258581af143308495bd97bedcc142abbbd951a
      PYTHONPATH: ${{ github.workspace }}/input/ranker:${{ github.workspace }}:${{ github.workspace }}/input/v3:${{ github.workspace }}/frozen-v8/orbittrace_wavelet_catalogue_v3:${{ github.workspace }}/frozen-v8
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Check out binding branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Check out exact runtime used by verified Fisher fixture
        uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
          fetch-depth: 1

      - name: Assert frozen scientific implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-v8 rev-parse HEAD)" = "$FROZEN_V8_RUNTIME_SHA"
          git cat-file -e "${FROZEN_PROTOCOL_SHA}^{commit}"
          git cat-file -e "${FROZEN_IMPLEMENTATION_SHA}^{commit}"
          git diff --exit-code "${FROZEN_IMPLEMENTATION_SHA}" HEAD -- \
            orbittrace_gmn_balanced_logit_oof_v1 \
            orbittrace_gmn_v31_principle_local_geometry_oof_v1
          bad="$(git diff --name-only "${FROZEN_IMPLEMENTATION_SHA}" HEAD | grep -v '^\.github/workflows/' || true)"
          test -z "$bad"

      - name: Set up recorded Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact verified-fixture runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2 joblib==1.5.3

      - name: Reconstruct exact historical source runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/v3
          git -C frozen-v8 fetch --no-tags --depth=1 origin "$V3_SOURCE_SHA"
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )

      - name: Retrieve exact immutable fixture and ranker artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/fixture input/ranker output
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9129787782/zip > /tmp/fixture.zip
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9046896881/zip > /tmp/ranker.zip
          echo '14caf01be46de095ff2771cfded8034bad9fa8b6d9567285aa8e657681776a21  /tmp/fixture.zip' | sha256sum -c -
          echo '0143b6291b031b4de2305fc8e85ca3e1a7db1c20e72d85323fb82e9895832649  /tmp/ranker.zip' | sha256sum -c -
          unzip -q /tmp/fixture.zip -d input/fixture
          unzip -q /tmp/ranker.zip -d input/ranker
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | awk '{print $1}')" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          python -m py_compile input/ranker/run_urc_union_ranker.py \
            orbittrace_gmn_v31_principle_local_geometry_oof_v1/run_development.py \
            orbittrace_gmn_balanced_logit_oof_v1/run_development.py

      - name: Assert cached firewall and parent identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('input/fixture/GMN_DEVELOPMENT_FIXTURE_V1.json').read_text())
          assert m['verdict']=='PASS_GMN_DEVELOPMENT_FIXTURE_V1'
          assert m['scientific_change'] is False
          assert m['blind_exclusion']==[20.0,55.0]
          for k in ('sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert m[k] is False, (k,m[k])
          assert m['feature_matrix_sha256']=='fea3b063772c75b675e37a227b53a4aa3c5b86fdcbfcef1487b1e1448689cdf5'
          assert m['hard_order_sha256']=='2dcaaffaefca68e877fea82ff46a68bbd4c7960dedfdd00a114311d41605b65e'
          assert m['parent_margin_sha256']=='f38c96e3fa4ea98f51217b36d639e96edbf3ebcb65123248f0f118d3298173bd'
          assert m['fisher_scaled_sha256']=='9957292fbe41efa407b9bc5b1f4160cdc0899632135a10b56d2f91f04d54c46e'
          assert m['fisher_metrics']['recovered_at_100']==69
          assert m['fisher_metrics']['recovered_at_50']==41
          assert abs(m['fisher_metrics']['top100_dominant_precision']-0.7677499561973543)<1e-15
          assert abs(m['fisher_metrics']['mrr']-0.05055989766869564)<1e-15
          assert m['fisher_metrics']['qualified_matches']==95
          print('PASS_EXACT_TARGET_EXCLUDED_GMN_BINDING_INPUTS')
          PY

      - name: Execute first valid frozen balanced-logit outcome
        shell: bash
        run: |
          set -euo pipefail
          python orbittrace_gmn_balanced_logit_oof_v1/run_development.py \
            --fixture-root input/fixture \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --output output 2>&1 | tee output/binding_combined.log

      - name: Record binding provenance
        if: always()
        shell: bash
        run: |
          mkdir -p output
          printf '%s\n' \
            'frozen_protocol_commit=5b2cf9aae07a2a84da03233a1e3a7105cc1eb5d0' \
            'frozen_implementation_commit=6331a0fbe9731cf1f7a02cc199a08e726ab0ac04' \
            'frozen_v8_runtime_commit=c9d6c44704013ba0c9430100e98a29a56b453304' \
            'v3_source_commit=d8258581af143308495bd97bedcc142abbbd951a' \
            'fixture_run_id=31566749364' \
            'fixture_artifact_id=9129787782' \
            'fixture_artifact_digest=sha256:14caf01be46de095ff2771cfded8034bad9fa8b6d9567285aa8e657681776a21' \
            'ranker_run_id=31344632499' \
            'ranker_artifact_id=9046896881' \
            'ranker_artifact_digest=sha256:0143b6291b031b4de2305fc8e85ca3e1a7db1c20e72d85323fb82e9895832649' \
            "binding_workflow_commit=${GITHUB_SHA}" \
            > output/BINDING_PROVENANCE.txt

      - name: Upload binding outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-gmn-balanced-logit-oof-v1-binding
          path: output
          if-no-files-found: error
          retention-days: 90
