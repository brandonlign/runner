name: OrbitTrace fixed4 wrapper saturation audit

on:
  push:
    branches:
      - agent/orbittrace-fixed4-wrapper-saturation-audit
    paths:
      - orbittrace_fixed4_wrapper_audit/**
      - .github/workflows/orbittrace_fixed4_wrapper_saturation_audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-fixed4-wrapper-saturation-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROAD_ARTIFACT_ID: '8957230278'
      BROAD_ARTIFACT_SHA256: '2ee3d5c9edf299c0f9ea69b2d6254d7918e0aa659f8cc2c659bb99ff2dfc0d17'
      CAL_SCAN_ARTIFACT_ID: '8958042095'
      CAL_SCAN_ARTIFACT_SHA256: '3ce72dde553cf58c6d4b9e734c29558a0f2bbefee664ba98189f4e90e821c596'
      CAL_REVEAL_ARTIFACT_ID: '8958194010'
      CAL_REVEAL_ARTIFACT_SHA256: '74c95a3fd59650126a2a298fc1bab5cc055caa91bff2feae6c9256521fdc00aa'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-fixed4-wrapper-saturation-audit
      - name: Retrieve exact frozen artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/broad input/cal_scan input/cal_reveal output
          fetch_artifact() {
            local id="$1" out="$2"
            curl --fail-with-body -L \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "${out}"
          }
          fetch_artifact "${BROAD_ARTIFACT_ID}" input/broad.zip
          fetch_artifact "${CAL_SCAN_ARTIFACT_ID}" input/cal_scan.zip
          fetch_artifact "${CAL_REVEAL_ARTIFACT_ID}" input/cal_reveal.zip
          echo "${BROAD_ARTIFACT_SHA256}  input/broad.zip" | sha256sum -c -
          echo "${CAL_SCAN_ARTIFACT_SHA256}  input/cal_scan.zip" | sha256sum -c -
          echo "${CAL_REVEAL_ARTIFACT_SHA256}  input/cal_reveal.zip" | sha256sum -c -
          unzip -q input/broad.zip -d input/broad
          unzip -q input/cal_scan.zip -d input/cal_scan
          unzip -q input/cal_reveal.zip -d input/cal_reveal
      - name: Audit ranking saturation
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import json
          from collections import Counter
          from pathlib import Path

          def unique(root: str, name: str) -> Path:
              found = list(Path(root).rglob(name))
              if len(found) != 1:
                  raise RuntimeError(f'expected one {name} under {root}, found {found}')
              return found[0]

          broad_scan = json.loads(unique('input/broad', 'blind_scan.json').read_text(encoding='utf-8'))
          broad_reveal = json.loads(unique('input/broad', 'orbittrace_blind_reveal.json').read_text(encoding='utf-8'))
          with gzip.open(unique('input/cal_scan', 'orbittrace_fixed4_blind_scan.json.gz'), 'rt', encoding='utf-8') as handle:
              calibrated_scan = json.load(handle)
          calibrated_reveal = json.loads(unique('input/cal_reveal', 'orbittrace_fixed4_blind_reveal.json').read_text(encoding='utf-8'))

          threshold_support = {}
          complete_saturation = True
          for threshold in ('1.5', '2', '2.5'):
              families = broad_scan['families'][threshold]
              if len(families) != 5000:
                  raise RuntimeError(f'unexpected family count at {threshold}: {len(families)}')
              counts = Counter(int(f['support']) for f in families)
              threshold_support[threshold] = {str(k): int(v) for k, v in sorted(counts.items())}
              complete_saturation &= counts == Counter({8: 5000})

          availability = broad_reveal['canonical_availability']
          canonical_by_year = {
              str(year): int(record['present_in_blind_catalogue'])
              for year, record in sorted(availability.items())
          }
          quartet_capable_years = [year for year, count in canonical_by_year.items() if count >= 4]
          if sum(canonical_by_year.values()) != 101:
              raise RuntimeError('canonical availability does not sum to 101')

          selected = calibrated_reveal['selected_family']
          if not (
              calibrated_reveal['verdict'] == 'PARTIAL_BLIND_ORBITTRACE_RECOVERY'
              and selected['family_id'] == 'F0059'
              and selected['rank'] == 59
              and selected['year_count'] == 4
              and selected['event_count'] == 39
              and selected['canonical_overlap'] == 29
          ):
              raise RuntimeError('calibrated reveal invariants changed')
          family = next(f for f in calibrated_scan['families'] if f['family_id'] == 'F0059')
          if family['year_count'] != 4 or family['rank'] != 59:
              raise RuntimeError('calibrated scan family invariants changed')

          minimum_broad_support = min(
              int(f['support'])
              for threshold in ('1.5', '2', '2.5')
              for f in broad_scan['families'][threshold]
          )
          classification = (
              'PERSISTENCE_RANKING_SATURATION_CONFIRMED'
              if complete_saturation and selected['year_count'] < minimum_broad_support
              else 'NO_COMPLETE_PERSISTENCE_SATURATION'
          )
          result = {
              'classification': classification,
              'broad_threshold_support_distributions': threshold_support,
              'broad_preserved_families_per_threshold': 5000,
              'broad_minimum_preserved_year_support': minimum_broad_support,
              'broad_canonical_availability_by_year': canonical_by_year,
              'broad_quartet_capable_canonical_years': quartet_capable_years,
              'broad_quartet_capable_year_count': len(quartet_capable_years),
              'calibrated_selected_family': {
                  'family_id': selected['family_id'],
                  'rank': selected['rank'],
                  'year_count': selected['year_count'],
                  'years': selected['years'],
                  'event_count': selected['event_count'],
                  'canonical_overlap': selected['canonical_overlap'],
                  'precision': selected['precision'],
              },
              'interpretation': (
                  'The broad negative is valid for its frozen persistence-first wrapper, but its reveal set '
                  'contains no family with fewer than eight years. It therefore does not provide a balanced '
                  'negative test of four-year episodic recurrence and cannot be treated as an equal-strength '
                  'refutation of the calibrated partial recovery.'
              ),
              'authorized_next_step': (
                  'Develop and freeze a support-normalized generic catalogue ranking using only known '
                  'non-OrbitTrace showers after removing solar longitude 20-55 degrees before labels and endpoints.'
              ),
          }
          Path('output/orbittrace_fixed4_wrapper_saturation_audit.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          md = f'''# OrbitTrace fixed4 wrapper-saturation audit

Classification: `{classification}`

## Broad ranked-quartet wrapper

All three preserved top-5,000 lists were saturated by eight-year families:

- threshold 1.5: `{threshold_support['1.5']}`
- threshold 2.0: `{threshold_support['2']}`
- threshold 2.5: `{threshold_support['2.5']}`

The minimum year support anywhere in the preserved broad reveal set was **{minimum_broad_support}**.

Canonical OrbitTrace availability was `{canonical_by_year}`. Only **{len(quartet_capable_years)}** years contained at least four canonical events: `{quartet_capable_years}`.

## Calibrated component wrapper

Family **F0059** ranked **59/780**, spanned **4 years**, contained **29/39** exact canonical members, and had precision **{selected['precision']:.4f}**.

## Interpretation

The broad negative remains a valid result for its persistence-first wrapper. It is not an equally informative refutation of episodic recovery because every preserved family had eight-year support, whereas the independently recovered OrbitTrace family had four-year support. The conflict is therefore explained primarily by ranking saturation, not by disagreement in the fixed four-clique core.

The next authorized development is a support-normalized generic ranking trained and selected only on non-OrbitTrace showers after removing solar longitude 20–55° before labels and endpoints.
'''
          Path('output/ORBITTRACE_FIXED4_WRAPPER_SATURATION_AUDIT.md').write_text(md, encoding='utf-8')
          print(md)
          if classification != 'PERSISTENCE_RANKING_SATURATION_CONFIRMED':
              raise SystemExit('frozen saturation classification did not pass')
          PY
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            orbittrace_fixed4_wrapper_audit/PROTOCOL.md \
            input/broad.zip input/cal_scan.zip input/cal_reveal.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-fixed4-wrapper-saturation-audit
          path: output
          if-no-files-found: error
          retention-days: 90
