name: OrbitTrace GMN listwise representative-share OOF v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-listwise-representative-share-oof-v1
    paths:
      - orbittrace_gmn_listwise_representative_share_oof_v1/**
      - .github/workflows/orbittrace_fixed4_wrapper_saturation_audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-gmn-listwise-representative-share-oof-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify frozen source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/v8 input/p19 input/p20 input/ranker output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(git hash-object orbittrace_gmn_listwise_representative_share_oof_v1/PROTOCOL.md)" = '1c592a45da7a57e4458993a25f4efec7cb1aa5c7'
          test "$(git hash-object orbittrace_gmn_listwise_representative_share_oof_v1/run_development.py)" = '2546213a3fbb61258a11d73219f2f051eaf5c649'
          python -m py_compile orbittrace_gmn_listwise_representative_share_oof_v1/run_development.py
          echo PASS_GMN_LISTWISE_REPRESENTATIVE_SHARE_FROZEN_SOURCE

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify exact #839 ranking source
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          PYTHONPATH=input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8 python -m py_compile input/ranker/run_urc_union_ranker.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p20-recurrent-isolated-quartet-development
          path: input/p20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31341591263

      - name: Verify immutable GMN inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/p19/p19_subthreshold_reciprocal_recurrence_development.json | cut -d' ' -f1)" = '6f1ad0626b8a8bda03f18e7f3435f0651af8bebf65cfd1d970a6b61a8ba52319'
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
          test "$(sha256sum input/p20/p20_recurrent_isolated_quartet_development.json | cut -d' ' -f1)" = '9ec53f29281b11002a9e22b1086d12e054392e466ea74fe82ead0187289ba303'
          test "$(sha256sum input/p20/p20_prelabel_payload.json | cut -d' ' -f1)" = '8ca358ae0f3ac96b188de9eac7bcfd6f870470873a2b7ee73b7ae76497c12734'
          echo PASS_GMN_LISTWISE_REPRESENTATIVE_SHARE_IMMUTABLE_INPUTS

      - name: Run sole frozen listwise candidate
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_listwise_representative_share_oof_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p19-result-json input/p19/p19_subthreshold_reciprocal_recurrence_development.json \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --p20-result-json input/p20/p20_recurrent_isolated_quartet_development.json \
            --p20-prelabel-json input/p20/p20_prelabel_payload.json \
            --output output

      - name: Enforce scientific firewall and binding result schema
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/GMN_LISTWISE_REPRESENTATIVE_SHARE_OOF_V1.json'))
          assert r['verdict'] in {'PASS_GMN_LISTWISE_REPRESENTATIVE_SHARE_OOF_V1','FAIL_GMN_LISTWISE_REPRESENTATIVE_SHARE_OOF_V1'}
          assert r['scientific_role']=='GMN_2022_2023_TARGET_EXCLUDED_METHOD_DEVELOPMENT_ONLY'
          assert r['candidate_counts']=={'hard':226,'p19':1075,'p20':3203,'union':4504}
          assert r['feature_dimension']==34
          q=r['quality_839_control']
          assert (q['recovered_at_25'],q['recovered_at_50'],q['recovered_at_100'],q['recovered_at_500'],q['qualified_matches'])==(22,40,75,159,256)
          assert abs(q['top100_dominant_precision']-0.7645689180574315)<1e-12 and abs(q['mrr']-0.019037817654898162)<1e-12
          s=r['representative_share_1194_control']
          assert (s['recovered_at_25'],s['recovered_at_50'],s['recovered_at_100'],s['recovered_at_500'],s['qualified_matches'])==(22,43,80,171,256)
          assert abs(s['top100_dominant_precision']-0.8075287489258385)<1e-12 and abs(s['mrr']-0.02016666446026534)<1e-12
          assert len(r['optimizer_folds'])==5 and all(x['success'] for x in r['optimizer_folds'])
          assert r['diversity']=={'lambda':0.8,'scale':1.0}
          for k in ('target_search','feature_search','model_search','hyperparameter_search','diversity_search','source_quota_selected','family_deletion','post_result_second_search','sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['same_shower_all_fragments_same_fold'] is True
          assert r['blind_exclusion']==[20.0,55.0]
          f=json.load(open('output/FULL_MODEL_FREEZE.json'))
          if r['verdict'].startswith('PASS_'):
              assert all(r['promotion_gate'].values())
              assert f['verdict']=='PASS_GMN_LISTWISE_REPRESENTATIVE_SHARE_FULL_MODEL_FREEZE'
              assert f['model_payload_sha256']
          else:
              assert f['verdict']=='NOT_FROZEN_GMN_LISTWISE_REPRESENTATIVE_SHARE_FAIL'
              assert f['model_payload_sha256'] is None
          print(r['verdict'])
          print(r['listwise_candidate'])
          print(r['promotion_gate'])
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/development_commit.txt
          sha256sum \
            orbittrace_gmn_listwise_representative_share_oof_v1/PROTOCOL.md \
            orbittrace_gmn_listwise_representative_share_oof_v1/run_development.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            input/p19/p19_subthreshold_reciprocal_recurrence_development.json \
            input/p19/p19_prelabel_payload.json \
            input/p20/p20_recurrent_isolated_quartet_development.json \
            input/p20/p20_prelabel_payload.json \
            output/GMN_LISTWISE_REPRESENTATIVE_SHARE_OOF_V1.json \
            output/FULL_MODEL_FREEZE.json \
            > output/source_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-listwise-representative-share-oof-v1
          path: output
          if-no-files-found: error
          retention-days: 90
