name: OrbitTrace GMN cross-generator consensus diagnostic v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-crossgenerator-consensus-diagnostic-v1
    paths:
      - orbittrace_gmn_crossgenerator_consensus_diagnostic_v1/**
      - .github/workflows/orbittrace_fixed4_wrapper_saturation_audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-gmn-crossgenerator-consensus-diagnostic-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  freeze_pretruth_graph:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-gmn-crossgenerator-consensus-diagnostic-v1
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: staging/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p20-recurrent-isolated-quartet-development
          path: staging/p20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31341591263
      - name: Isolate exact prelabel payloads before graph construction
        run: |
          set -euo pipefail
          mkdir -p input/pretruth output/pretruth
          P19=$(find staging/p19 -type f -name p19_prelabel_payload.json -print -quit)
          P20=$(find staging/p20 -type f -name p20_prelabel_payload.json -print -quit)
          test -n "$P19" && test -n "$P20"
          cp "$P19" input/pretruth/p19_prelabel_payload.json
          cp "$P20" input/pretruth/p20_prelabel_payload.json
          test "$(sha256sum input/pretruth/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
          test "$(sha256sum input/pretruth/p20_prelabel_payload.json | cut -d' ' -f1)" = '8ca358ae0f3ac96b188de9eac7bcfd6f870470873a2b7ee73b7ae76497c12734'
          rm -rf staging
      - name: Freeze label-free cross-generator graph
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_crossgenerator_consensus_diagnostic_v1/run_diagnostic.py freeze \
            --p19-prelabel-json input/pretruth/p19_prelabel_payload.json \
            --p20-prelabel-json input/pretruth/p20_prelabel_payload.json \
            --output output/pretruth/crossgenerator_consensus_graph_v1.json
          sha256sum output/pretruth/crossgenerator_consensus_graph_v1.json | cut -d' ' -f1 > output/pretruth/graph_file_sha256.txt
          sha256sum \
            orbittrace_gmn_crossgenerator_consensus_diagnostic_v1/PROTOCOL.md \
            orbittrace_gmn_crossgenerator_consensus_diagnostic_v1/run_diagnostic.py \
            input/pretruth/p19_prelabel_payload.json \
            input/pretruth/p20_prelabel_payload.json \
            > output/pretruth/pretruth_provenance_sha256.txt
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('output/pretruth/crossgenerator_consensus_graph_v1.json').read_text())
          assert g['pretruth_graph_frozen'] is True
          assert g['labels_loaded'] is False and g['truth_accessed'] is False
          assert g['candidate_order_evaluated'] is False and g['membership_changed'] is False
          assert g['sonotaco_2013_2014_access'] is False
          assert g['sonotaco_feature_access'] is False
          assert g['target_information_access'] is False
          assert g['target_region_events_accessed'] is False
          assert g['maarsy_scientific_access'] is False
          assert g['dms_scientific_access'] is False
          assert g['blind_exclusion'] == [20.0,55.0]
          print({'edge_count': g['edge_count'], 'canonical_edge_sha256': g['canonical_edge_sha256']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-gmn-crossgenerator-consensus-pretruth-v1
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  evaluate_frozen_graph:
    needs: freeze_pretruth_graph
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-gmn-crossgenerator-consensus-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact development dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Restore exact promoted-v8 runtime
        run: |
          set -euo pipefail
          mkdir -p input/v3 output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-gmn-crossgenerator-consensus-pretruth-v1
          path: input/pretruth_graph
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p20-recurrent-isolated-quartet-development
          path: input/p20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31341591263
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify frozen evaluation inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
          test "$(sha256sum input/p20/p20_prelabel_payload.json | cut -d' ' -f1)" = '8ca358ae0f3ac96b188de9eac7bcfd6f870470873a2b7ee73b7ae76497c12734'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          GRAPH_SHA=$(cat input/pretruth_graph/graph_file_sha256.txt)
          test "$(sha256sum input/pretruth_graph/crossgenerator_consensus_graph_v1.json | cut -d' ' -f1)" = "$GRAPH_SHA"
          python -m py_compile orbittrace_gmn_crossgenerator_consensus_diagnostic_v1/run_diagnostic.py input/ranker/run_urc_union_ranker.py
      - name: Evaluate only the frozen graph
        env:
          PYTHONPATH: .:input/v3:input/ranker:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          GRAPH_SHA=$(cat input/pretruth_graph/graph_file_sha256.txt)
          python -u orbittrace_gmn_crossgenerator_consensus_diagnostic_v1/run_diagnostic.py evaluate \
            --graph-json input/pretruth_graph/crossgenerator_consensus_graph_v1.json \
            --expected-graph-sha256 "$GRAPH_SHA" \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --p20-prelabel-json input/p20/p20_prelabel_payload.json \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/crossgenerator_consensus_diagnostic_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/crossgenerator_consensus_diagnostic_v1.json').read_text())
          assert r['sonotaco_2013_2014_access'] is False
          assert r['sonotaco_feature_access'] is False
          assert r['target_information_access'] is False
          assert r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False
          assert r['dms_scientific_access'] is False
          assert r['blind_exclusion'] == [20.0,55.0]
          print(r['verdict'])
          PY
      - name: Record binding provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          cat input/pretruth_graph/graph_file_sha256.txt > output/frozen_graph_sha256.txt 2>/dev/null || true
          sha256sum \
            orbittrace_gmn_crossgenerator_consensus_diagnostic_v1/PROTOCOL.md \
            orbittrace_gmn_crossgenerator_consensus_diagnostic_v1/run_diagnostic.py \
            input/pretruth_graph/crossgenerator_consensus_graph_v1.json \
            input/p19/p19_prelabel_payload.json \
            input/p20/p20_prelabel_payload.json \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            > output/binding_provenance_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-crossgenerator-consensus-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
