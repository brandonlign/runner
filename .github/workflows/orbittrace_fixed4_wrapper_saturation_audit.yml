name: OrbitTrace GMN event uncertainty schema audit v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-event-uncertainty-schema-audit-v1
    paths:
      - .github/workflows/orbittrace_fixed4_wrapper_saturation_audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-gmn-event-uncertainty-schema-audit-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Restore exact target-excluded runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          mkdir -p input/v3 output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Verify exact source and development control
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
      - name: Inspect label-free scan event schema only
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from types import SimpleNamespace
          import run_urc_union_ranker as q

          q.v1.mult.YEARS=q.YEARS
          q.v1.mult.MONTH_KEYS=q.MONTH_KEYS
          q.v1.mult.TOP_K=100
          runtime=q.v1.mult.load_frozen_runtime()
          support=runtime.load_support_module(Path('frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts'))
          support.YEARS=q.YEARS
          support.MONTH_KEYS=q.MONTH_KEYS
          support.CORPUS=q.CORPUS
          support.RANKING_VARIANTS=('persistence',)
          assert float(support.BLIND_LOW)==20.0 and float(support.BLIND_HIGH)==55.0
          a=SimpleNamespace(
              support_source_parts=Path('frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts'),
              candidate_payload=Path('frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64'),
              baseline_payload=Path('frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64'),
              scorer_parts=Path('frozen-v8/mondrian_clique_development/source_parts_v2'),
              v8_result_json=Path('input/v8/pooled_year_centroid_v8_development.json'),
              fixed4_baseline_json=Path('input/v8/pooled_year_centroid_v8_development.json'),
              output=Path('output'),
          )
          _cand,base,_sc=support.load_sources(a)
          scan,_cal,_labels,sources=support.parse_catalogue(base)
          assert sorted(scan)==[2022,2023]
          assert [x['key'] for x in sources]==list(q.MONTH_KEYS)
          rows=[r for y in q.YEARS for r in scan[y]]
          assert rows
          keys=sorted(set().union(*(r.keys() for r in rows)))
          lower={k:k.lower() for k in keys}
          uncertainty=[k for k in keys if any(t in lower[k] for t in ('uncert','sigma','error','err','sd_','std'))]
          coverage={k:sum(1 for r in rows if r.get(k) is not None)/len(rows) for k in uncertainty}
          examples={k:next((r.get(k) for r in rows if r.get(k) is not None),None) for k in uncertainty}
          out={
            'stage':'GMN_TARGET_EXCLUDED_EVENT_SCHEMA_AUDIT_V1',
            'scientific_role':'ENGINEERING_SCHEMA_ONLY_NO_TRUTH_USE',
            'row_count':len(rows),
            'all_keys':keys,
            'uncertainty_like_keys':uncertainty,
            'coverage_fraction':coverage,
            'example_values':examples,
            'blind_exclusion':[20.0,55.0],
            'labels_used':False,
            'target_information_access':False,
            'target_region_events_accessed':False,
            'sonotaco_2013_2014_access':False,
            'maarsy_scientific_access':False,
            'dms_scientific_access':False,
          }
          Path('output/GMN_EVENT_UNCERTAINTY_SCHEMA_AUDIT_V1.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-gmn-event-uncertainty-schema-audit-v1
          path: output/GMN_EVENT_UNCERTAINTY_SCHEMA_AUDIT_V1.json
          if-no-files-found: error
          retention-days: 30
