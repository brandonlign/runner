name: OrbitTrace P12 executable freeze audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p11-density-contrast-pretruth-reservation
    paths:
      - orbittrace_drift_conditioned_p12/**
      - .github/workflows/orbittrace_p12_drift_conditioned_development.yml
      - .github/workflows/orbittrace_p12_executable_freeze_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Audit exact executable freeze without data access
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/p11.py
          echo '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9  /tmp/p11.py' | sha256sum -c -
          python orbittrace_drift_conditioned_p12/apply_p12_patch.py /tmp/p11.py /tmp/p12.py
          echo '78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32  /tmp/p12.py' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          wrapper=Path('orbittrace_drift_conditioned_p12/run_header_compatible.py').read_text()
          workflow=Path('.github/workflows/orbittrace_p12_drift_conditioned_development.yml').read_text()
          protocol=Path('orbittrace_drift_conditioned_p12/PROTOCOL.md').read_text()
          for token in (
              "EXPECTED_P12_SOURCE = Path('/tmp/run_p12.py')",
              'import gmn_python_api.data_directory as mt',
              'for attempt in range(3)',
              'PASS_P12_HEADER_WHITESPACE_COMPAT_SELF_TEST',
              'PASS_P12_SAME_REQUEST_GMN_TRANSPORT_RESILIENCE_MAX3',
          ):
              assert token in wrapper,token
          for token in (
              'EXECUTE_P12_AFTER_AUTHORITATIVE_P11_SCIENTIFIC_NO_GO','31301133527','9034719798',
              '797de87a9e047fa153e3d567bd56deb050a738c71d5848f8c21e2f8e30f2e555',
              '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9',
              '78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32',
              'DRIFT_CONDITIONED_TWO_VIEW_MEMBERSHIP_P12_DEVELOPMENT.md',
              'p12_drift_pretruth_frozen_before_truth','p12_source_year_only_drift_fit',
              'orbittrace-drift-conditioned-two-view-membership-p12-development',
          ):
              assert token in workflow,token
          assert "scientific={" in workflow
          assert "if k not in scientific" in workflow
          for token in ('5230390070','5230391784'):
              assert token in protocol,token
          for token in ('OrbitTrace-April','target_coordinate'):
              assert token not in wrapper and token not in workflow,token
          print('PASS_P12_EXECUTABLE_FREEZE_AUDIT')
          PY
      - name: Assert no activation on freeze
        run: |
          set -euo pipefail
          test ! -e orbittrace_drift_conditioned_p12/RUN.md
          test ! -e target
          echo P12_FREEZE_HAS_NO_TRUTH_ACTIVATION
