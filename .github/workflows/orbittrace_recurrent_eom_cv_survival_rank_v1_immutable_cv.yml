name: OrbitTrace recurrent-EOM CV survival immutable label-free gate

on:
  push:
    branches:
      - agent/orbittrace-recurrent-eom-cv-survival-rank-v1
    paths:
      - '.github/workflows/orbittrace_recurrent_eom_cv_survival_rank_v1_immutable_cv.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  label-free-cv:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-recurrent-eom-cv-survival-rank-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pre-result frozen source
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_eom_cv_survival_rank_v1/PROTOCOL.md)" = '478d5ad8b4c744134bdeb397b7691d53b23c0c59'
          test "$(git hash-object orbittrace_recurrent_eom_cv_survival_rank_v1/PRE_RESULT_AMENDMENT.md)" = '80f9f294285d984e4fcaf22c359aa2915818b6eb'
          test "$(git hash-object orbittrace_recurrent_eom_cv_survival_rank_v1/run_immutable_label_free_cv.py)" = '3f5e8e0c988a386120e62b36b9298b61bcb8c221'
          python -m pip install 'numpy==2.1.3'
          python -m py_compile orbittrace_recurrent_eom_cv_survival_rank_v1/run_immutable_label_free_cv.py
          mkdir -p input/full input/folds output

      - name: Restore exact immutable 2,097-parent prelabel
        uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/full
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852836840

      - name: Restore exact ten pre-existing deletion-fold prelabels
        uses: actions/download-artifact@v4
        with:
          pattern: orbittrace-density-sync-gmn-train-cv-v1-fold-*
          path: input/folds
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31859724335

      - name: Verify immutable input identities before calculation
        run: |
          set -euo pipefail
          test "$(sha256sum input/full/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json | cut -d' ' -f1)" = 'efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          test "$(find input/folds -name 'DENSITY_SYNC_GMN_TRAIN_CV_V1_FOLD_*_PRELABEL.json' | wc -l)" -eq 10
          python - <<'PY'
          import json
          p=json.load(open('input/full/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json'))
          assert p['scientific_role']=='PRELABEL_FROZEN_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1'
          assert p['parent_candidate_count']==2097
          assert p['parent_ordered_membership_sha256']=='b903f2a4b653ef240043d2d6a2cfe6163b62ecf2d837bddf727249e92e467b01'
          assert p['sonotaco_2013_2014_access'] is False and p['amos_access'] is False
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          PY

      - name: Execute sole frozen label-free CV survival gate
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_eom_cv_survival_rank_v1/run_immutable_label_free_cv.py \
            --full-parent-prelabel input/full/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --fold-root input/folds \
            --output output

      - name: Enforce result and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('output/RECURRENT_EOM_CV_SURVIVAL_RANK_V1_IMMUTABLE_PRELABEL.json'))
          r=json.load(open('output/RECURRENT_EOM_CV_SURVIVAL_RANK_V1_LABEL_FREE_CV_RESULT.json'))
          assert p['schema']=='ORBITTRACE_RECURRENT_EOM_CV_SURVIVAL_RANK_V1_IMMUTABLE_PRELABEL'
          assert r['schema']=='ORBITTRACE_RECURRENT_EOM_CV_SURVIVAL_RANK_V1_LABEL_FREE_CV_RESULT'
          assert r['verdict'] in {'PASS_RECURRENT_EOM_CV_SURVIVAL_RANK_V1_LABEL_FREE_CV','FAIL_RECURRENT_EOM_CV_SURVIVAL_RANK_V1_LABEL_FREE_CV'}
          assert p['full_parent_candidate_count']==2097
          assert p['full_parent_prelabel_sha256']=='efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          assert len(p['fold_prelabel_sha256'])==10
          for x in (p,r):
              assert x['blind_exclusion']==[20.0,55.0]
              assert x['truth_accessed'] is False
              for k in ['target_information_access','target_region_events_accessed','sonotaco_2013_2014_access','amos_2023_2024_access','asfn_access','efn_access','maarsy_scientific_access','dms_scientific_access']:
                  assert x[k] is False, (k,x[k])
          assert r['post_result_parameter_search'] is False
          print(json.dumps({
              'verdict':r['verdict'],
              'mean_parent':r['mean_parent_topk_heldout_jaccard'],
              'mean_successor':r['mean_successor_topk_heldout_jaccard'],
              'mean_delta':r['mean_delta_topk_heldout_jaccard'],
              'top100_strict_fold_wins':r['top100_strict_fold_wins'],
              'gates':r['gates'],
          },indent=2,sort_keys=True))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum orbittrace_recurrent_eom_cv_survival_rank_v1/PROTOCOL.md orbittrace_recurrent_eom_cv_survival_rank_v1/PRE_RESULT_AMENDMENT.md orbittrace_recurrent_eom_cv_survival_rank_v1/run_immutable_label_free_cv.py > output/source_sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-cv-survival-rank-v1-immutable-label-free-cv
          path: output
          if-no-files-found: error
