name: OrbitTrace P15 matched pretruth checkpoints

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - orbittrace_support_safe_halo_p15/MATCHED_PRETRUTH_RUN.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-p15-matched-pretruth
  cancel-in-progress: false

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: ffe8351b9ee8df4418fb4926fab782d66180e276
          path: exact-lit
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Require one-file child, exact artifact-only P15 development PASS, and freeze both checkpoints only
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'orbittrace_support_safe_halo_p15/MATCHED_PRETRUTH_RUN.md'
          marker="$(git show "$HEAD_SHA":orbittrace_support_safe_halo_p15/MATCHED_PRETRUTH_RUN.md)"
          test "$(printf '%s\n' "$marker" | sed -n '1p')" = 'EXECUTE_P15_MATCHED_PRETRUTH_AFTER_ARTIFACT_ONLY_DEVELOPMENT_PASS'
          test "$(printf '%s\n' "$marker" | sed -n '2p')" = '31329529635'
          test "$(printf '%s\n' "$marker" | sed -n '3p')" = '9042508082'
          test "$(printf '%s\n' "$marker" | sed -n '4p')" = 'sha256:f6bee693dfd64f86fcbb7fa2b3760a9258d712d5df29c59e270233d87a6a160f'
          test "$(printf '%s\n' "$marker" | sed -n '5p')" = '0424308527eb5edb7ec21043f1b7721472ebe5aeaa2f5f7f604185b1e09d006e'
          test "$(printf '%s\n' "$marker" | sed -n '6p')" = '23d309f6702ed0aa6769381963ea64701ae59c97376a0bae536b527fbc978fe6'
          test "$(printf '%s\n' "$marker" | wc -l)" -eq 6
          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_support_safe_halo_p15/MATCHED_PRETRUTH_RUN.md

          # Sole admissible P15 development promotion evidence: immutable canonical P12/P13 artifact-only adjudication.
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/runs/31329529635" -o /tmp/p15-dev-run.json
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/artifacts/9042508082" -o /tmp/p15-dev-artifact.json
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/artifacts/9042508082/zip" -o /tmp/p15-dev.zip
          echo 'f6bee693dfd64f86fcbb7fa2b3760a9258d712d5df29c59e270233d87a6a160f  /tmp/p15-dev.zip' | sha256sum -c -
          rm -rf /tmp/p15-dev && mkdir -p /tmp/p15-dev
          unzip -q /tmp/p15-dev.zip -d /tmp/p15-dev
          python - <<'PY_DEV'
          import hashlib,json
          from pathlib import Path
          run=json.load(open('/tmp/p15-dev-run.json')); art=json.load(open('/tmp/p15-dev-artifact.json'))
          assert run['id']==31329529635 and run['status']=='completed' and run['conclusion']=='success',run
          assert run['head_branch']=='agent/orbittrace-p15-development-artifact-adjudication-run-v2',run
          assert art['id']==9042508082 and art['name']=='orbittrace-p15-support-safe-halo-development-artifact-adjudication',art
          assert art['digest']=='sha256:f6bee693dfd64f86fcbb7fa2b3760a9258d712d5df29c59e270233d87a6a160f' and not art['expired'],art
          assert art['workflow_run']['id']==31329529635,art
          hits=list(Path('/tmp/p15-dev').rglob('support_safe_secondary_halo_p15_development_artifact_adjudication.json'))
          assert len(hits)==1,hits
          raw=hits[0].read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='0424308527eb5edb7ec21043f1b7721472ebe5aeaa2f5f7f604185b1e09d006e'
          r=json.loads(raw)
          assert r['verdict']=='PASS_SUPPORT_SAFE_SECONDARY_HALO_P15_DEVELOPMENT',r
          assert r['adjudication_mode']=='artifact_only_from_immutable_canonical_P12_P13',r
          assert r['p15_development_source_sha256']=='22d34131e873825ca60aefbba0b92088f19f57f589fe629bfbd3b7041d160b4b',r
          assert r['fixed_min_direction_negatives']==128 and r['canonical_direction_count']==452,r
          assert r['canonical_minimum_negative_count']==2197,r
          assert r['p15_unavailable_direction_count']==0 and r['p15_unavailable_directions']==[],r
          assert r['p15_availability_sha256']=='4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945',r
          assert r['p15_fallback_vacuous_on_development'] is True,r
          assert r['p15_no_padding_resampling_or_relaxation'] is True and r['p15_secondary_characterization_only'] is True,r
          assert r['canonical_p12_result_sha256']=='96698c1a7ba700716a79e7bc8b7bc9acb2f9aec653095a5d7e33b14000b87a38',r
          assert r['canonical_p13_result_sha256']=='d298cebec624c991c4abda9dc809d92d8eea101baaf2b6edbb1862b7acc49739',r
          assert r['canonical_p13_core_pretruth_sha256']=='12e6635085c77c8c705fe225e67811c659e98bf7cd1047649ec2b8d593261b3c',r
          assert r['canonical_p13_halo_pretruth_sha256']=='f158ebfa3a9a3c8006a7c81cbf0b47f7307aa7f2537e8046621b08037230cca3',r
          assert r['new_truth_query'] is False and r['matched_truth_access'] is False and r['external_data_access'] is False and r['target_information_access'] is False,r
          print('PASS_P15_MATCHED_ARTIFACT_ONLY_DEVELOPMENT_GATE')
          PY_DEV

          # The post-result tolerance adjudication is explicitly forbidden as promotion evidence.
          test -f orbittrace_support_safe_halo_p15/P15_POSTHOC_TOLERANCE_ADJUDICATION_NO_GO.md
          test ! -e orbittrace_support_safe_halo_p15/adjudicate_development_semantic_v3.py
          test ! -e .github/workflows/orbittrace_p15_semantic_development_adjudication_v3.yml

          test "$(git hash-object orbittrace_core_halo_p13_literature/run_p13_matched_launcher_v3.sh)" = '1fb46484a51bb7d7edd60c865dcf5341550277a1'
          test "$(git hash-object orbittrace_support_safe_rank_p14/generate_matched_pretruth_direct_v3.py)" = 'af257d4b4902f9783acecd6df52f111415e5188c'
          test "$(git hash-object orbittrace_support_safe_halo_p15/generate_matched_pretruth_p15.py)" = '372f1a57d97e1b0f0ac8f1303ef84f242245bdde'
          test "$(git hash-object orbittrace_support_safe_halo_p15/finalize_pretruth_checkpoint_p15.py)" = '42fac298751179e5e629431060a1c9d803b1f19d'
          grep -F "MATCHED_P15_SHA256='23d309f6702ed0aa6769381963ea64701ae59c97376a0bae536b527fbc978fe6'" orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py

          python orbittrace_support_safe_halo_p15/generate_matched_pretruth_p15.py \
            orbittrace_core_halo_p13_literature/run_p13_matched_launcher_v3.sh /tmp/p15_matched_pretruth.sh
          bash -n /tmp/p15_matched_pretruth.sh
          for x in \
            'PASS_P15_MATCHED_SUPPORT_SAFE_HALO_SOURCE_ACTIVE' \
            'PASS_P14_BOTH_MATCHED_CHECKPOINTS_FROZEN_BEFORE_TRUTH_OR_CLUSTER_VALUES' \
            'p15_halo_availability_frozen_before_truth' \
            'exit 0'; do
            grep -F "$x" /tmp/p15_matched_pretruth.sh
          done
          if grep -Eq 'OPEN TRUTH \+ COMPETITOR CLUSTER VALUES EXACTLY ONCE|evaluate_frozen_blindsafe.py|finalize_p3_evaluator_result.py|OrbitTrace-April|target_coordinate' /tmp/p15_matched_pretruth.sh; then
            echo 'posttruth/target surface survived P15 pretruth generation' >&2
            exit 1
          fi
          chmod +x /tmp/p15_matched_pretruth.sh
          /tmp/p15_matched_pretruth.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-p15-matched-pretruth-checkpoints
          path: pretruth
          if-no-files-found: warn
          retention-days: 90
