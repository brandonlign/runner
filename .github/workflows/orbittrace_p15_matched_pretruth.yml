name: OrbitTrace P15 matched pretruth checkpoints

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - orbittrace_support_safe_halo_p15/MATCHED_PRETRUTH_RUN.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-p15-matched-pretruth
  cancel-in-progress: false

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: ffe8351b9ee8df4418fb4926fab782d66180e276
          path: exact-lit
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Require one-file child, exact P15 development PASS, and freeze both checkpoints only
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'orbittrace_support_safe_halo_p15/MATCHED_PRETRUTH_RUN.md'
          marker="$(git show "$HEAD_SHA":orbittrace_support_safe_halo_p15/MATCHED_PRETRUTH_RUN.md)"
          test "$(printf '%s\n' "$marker" | sed -n '1p')" = 'EXECUTE_P15_MATCHED_PRETRUTH_AFTER_DEVELOPMENT_PASS'
          test "$(printf '%s\n' "$marker" | sed -n '2p')" = '31328065110'
          test "$(printf '%s\n' "$marker" | sed -n '3p')" = '23d309f6702ed0aa6769381963ea64701ae59c97376a0bae536b527fbc978fe6'
          test "$(printf '%s\n' "$marker" | wc -l)" -eq 3
          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_support_safe_halo_p15/MATCHED_PRETRUTH_RUN.md

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/runs/31328065110" -o /tmp/p15-dev-run.json
          python - <<'PY_RUN'
          import json
          r=json.load(open('/tmp/p15-dev-run.json'))
          assert r['id']==31328065110
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']=='90dc77fafd7586e9743d28228030c7eb7c908ceb'
          assert r['head_branch']=='agent/orbittrace-p15-support-safe-halo-development-run-v2'
          print('PASS_P15_MATCHED_EXACT_DEVELOPMENT_RUN_SUCCESS')
          PY_RUN

          rm -rf /tmp/p15-dev-artifact && mkdir -p /tmp/p15-dev-artifact
          gh run download 31328065110 --repo "$REPO" --name orbittrace-p15-support-safe-halo-development-v2 --dir /tmp/p15-dev-artifact
          mapfile -t summaries < <(find /tmp/p15-dev-artifact -type f -name support_safe_secondary_halo_p15_development.json -print | sort)
          test "${#summaries[@]}" -eq 1
          python - "${summaries[0]}" <<'PY_DEV'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['verdict']=='PASS_SUPPORT_SAFE_SECONDARY_HALO_P15_DEVELOPMENT'
          assert r['p15_source_sha256']=='22d34131e873825ca60aefbba0b92088f19f57f589fe629bfbd3b7041d160b4b'
          assert r['p15_parent_p12_exact_json_identity'] is True
          assert r['p15_fallback_vacuous_on_development'] is True
          assert r['directions']==452 and r['unavailable_directions']==0
          assert r['matched_truth_access'] is False and r['external_data_access'] is False and r['target_information_access'] is False
          print('PASS_P15_MATCHED_DEVELOPMENT_ARTIFACT_GATE')
          PY_DEV

          test "$(git hash-object orbittrace_core_halo_p13_literature/run_p13_matched_launcher_v3.sh)" = '1fb46484a51bb7d7edd60c865dcf5341550277a1'
          test "$(git hash-object orbittrace_support_safe_rank_p14/generate_matched_pretruth_direct_v3.py)" = 'af257d4b4902f9783acecd6df52f111415e5188c'
          test "$(git hash-object orbittrace_support_safe_halo_p15/generate_matched_pretruth_p15.py)" = '372f1a57d97e1b0f0ac8f1303ef84f242245bdde'
          test "$(git hash-object orbittrace_support_safe_halo_p15/finalize_pretruth_checkpoint_p15.py)" = '6c3b774be6ab1497846513856f711bb99c850475'
          grep -F "MATCHED_P15_SHA256='23d309f6702ed0aa6769381963ea64701ae59c97376a0bae536b527fbc978fe6'" orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py

          python orbittrace_support_safe_halo_p15/generate_matched_pretruth_p15.py \
            orbittrace_core_halo_p13_literature/run_p13_matched_launcher_v3.sh /tmp/p15_matched_pretruth.sh
          bash -n /tmp/p15_matched_pretruth.sh
          for x in \
            'PASS_P15_MATCHED_SUPPORT_SAFE_HALO_SOURCE_ACTIVE' \
            'PASS_P14_BOTH_MATCHED_CHECKPOINTS_FROZEN_BEFORE_TRUTH_OR_CLUSTER_VALUES' \
            'p15_halo_availability_frozen_before_truth' \
            'exit 0'; do
            grep -F "$x" /tmp/p15_matched_pretruth.sh
          done
          if grep -Eq 'OPEN TRUTH \+ COMPETITOR CLUSTER VALUES EXACTLY ONCE|evaluate_frozen_blindsafe.py|finalize_p3_evaluator_result.py|OrbitTrace-April|target_coordinate' /tmp/p15_matched_pretruth.sh; then
            echo 'posttruth/target surface survived P15 pretruth generation' >&2
            exit 1
          fi
          chmod +x /tmp/p15_matched_pretruth.sh
          /tmp/p15_matched_pretruth.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-p15-matched-pretruth-checkpoints
          path: pretruth
          if-no-files-found: warn
          retention-days: 90
