name: OrbitTrace topomodal num-stat availability v1

on:
  push:
    branches:
      - agent/orbittrace-topomodal-numstat-availability-v1
    paths:
      - '.github/workflows/orbittrace_topomodal_numstat_availability_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  availability:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install compatible exact reader and audit frozen source
        run: |
          set -euo pipefail
          mkdir -p output
          python -m pip install --upgrade pip
          python -m pip install 'gmn-python-api==0.0.13'
          test "$(git hash-object orbittrace_topomodal_numstat_availability_v1/PROTOCOL.md)" = 'b636b0bde53f4b0f00424a1cdea4352f7b3d2ba0'
          test "$(git hash-object orbittrace_topomodal_numstat_availability_v1/ENGINEERING_REPAIR_1.md)" = 'ea9fcb8591ed1ada09ad649e1dceff5a6447462d'
          test "$(git hash-object orbittrace_topomodal_numstat_availability_v1/ENGINEERING_REPAIR_2.md)" = 'dd8b3c4b463a0c7fd1811b97b8cecf1f4b9956c7'
          test "$(git hash-object orbittrace_topomodal_numstat_availability_v1/audit.py)" = 'd2cd353e78624cf3cbf31babdcde14f0e7c1b0dc'
          test "$(git hash-object orbittrace_station_weighted_topomodal_scale_v1/PROTOCOL.md)" = 'ea5d862268fc2c69d37b8b4c10db187fe31cdd5a'
          test "$(git hash-object orbittrace_station_weighted_topomodal_scale_v1/run_diagnostic.py)" = '24b4970981dcff677d66fc230d5998e7e51ed5f2'
          python -m py_compile orbittrace_topomodal_numstat_availability_v1/audit.py orbittrace_station_weighted_topomodal_scale_v1/run_diagnostic.py

      - name: Run frozen target-excluded monthly availability audit
        run: |
          set -euo pipefail
          python -u orbittrace_topomodal_numstat_availability_v1/audit.py --output output

      - name: Enforce frozen audit contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          r=json.load(open('output/TOPOMODAL_NUMSTAT_AVAILABILITY_V1.json'))
          assert r['schema']=='ORBITTRACE_TOPOMODAL_NUMSTAT_AVAILABILITY_V1'
          assert r['verdict'] in {'PASS_TOPOMODAL_NUMSTAT_AVAILABILITY_V1','FAIL_TOPOMODAL_NUMSTAT_AVAILABILITY_V1'}
          assert r['years']==[2022,2023] and r['blind_exclusion']==[20.0,55.0]
          assert r['minimum_complete_fraction']==0.95
          assert r['expected_subset_counts']=={'d128_b0':5567,'d128_b1':5840,'d128_b2':5857,'d128_b3':5816,'d1024_b0':677,'d1024_b1':739,'d1024_b2':736,'d1024_b3':766}
          assert r['fields_parsed']==['unique_trajectory_identifier','sol_lon_deg','num_stat']
          for k in ('station_codes_parsed','station_geography_accessed','participating_station_field_parsed','shower_truth_parsed','meteor_geometry_parsed','target_information_access','target_region_station_count_emitted_or_used','sonotaco_scientific_access','asfn_event_level_access','efn_event_level_access','amos_scientific_access','maarsy_scientific_access','dms_scientific_access','scientific_ranking_computed','post_result_parameter_search'):
              assert r[k] is False, k
          raw=open('output/audited_union_numstat_mapping.json','rb').read()
          assert hashlib.sha256(raw).hexdigest()==r['audited_mapping_sha256']
          assert len(r['monthly_raw_sha256'])==24
          print(r['verdict'])
          print(json.dumps({'year_stats':r['year_stats'],'subset_stats':r['subset_stats'],'gates':r['gates']},indent=2,sort_keys=True))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum orbittrace_topomodal_numstat_availability_v1/PROTOCOL.md orbittrace_topomodal_numstat_availability_v1/ENGINEERING_REPAIR_1.md orbittrace_topomodal_numstat_availability_v1/ENGINEERING_REPAIR_2.md orbittrace_topomodal_numstat_availability_v1/audit.py orbittrace_station_weighted_topomodal_scale_v1/PROTOCOL.md orbittrace_station_weighted_topomodal_scale_v1/run_diagnostic.py output/TOPOMODAL_NUMSTAT_AVAILABILITY_V1.json output/audited_union_numstat_mapping.json > output/source_output_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-topomodal-numstat-availability-v1
          path: output
          if-no-files-found: error
          retention-days: 90
