name: ISEF IMAP SOLAR-1 multi-L1 schema probe
on:
  push:
    paths:
      - 'isef/imap_solar1_multil1_schema_probe.py'
      - '.github/workflows/isef-imap-solar1-multil1-schema-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: timeout 300s python isef/imap_solar1_multil1_schema_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-imap-solar1-multil1-schema-probe
          path: results/imap_solar1_multil1_schema_probe.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file results/imap_solar1_multil1_schema_probe.json || true
