name: OrbitTrace new-discovery association screen

on:
  push:
    branches:
      - research/orbittrace-new-discovery-screen-20260828
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen locked-RRF catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8973803775/zip" \
            --output locked_rrf.zip
          mkdir -p locked_rrf
          unzip -q locked_rrf.zip -d locked_rrf
          test -s locked_rrf/orbittrace_fixed4_locked_rrf_scan.json.gz
          echo "1c26dc06193eb2119a0e181d9a85c22c18b09da8316fe6679754cb554ca29d34  locked_rrf.zip" | sha256sum --check -

      - name: Download current IAU MDC shower database
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://ceresiaumdc.ta3.sk/downloads/lists_shw_data/streamfulldata.json" \
            --output streamfulldata.json
          python - <<'PY'
          import json
          d=json.load(open('streamfulldata.json'))
          print('MDC version:', d.get('version'), 'showers:', d.get('count'))
          assert d.get('data') and int(d.get('count', 0)) >= 1000
          PY

      - name: Run broad known-association screen
        run: |
          set -euo pipefail
          python orbittrace_new_discovery_screen/screen_candidates.py \
            --scan locked_rrf/orbittrace_fixed4_locked_rrf_scan.json.gz \
            --mdc streamfulldata.json \
            --out screen_output
          cat screen_output/KNOWN_ASSOCIATION_SCREEN.md

      - name: Upload screening output
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-new-discovery-known-association-screen
          path: screen_output/
          if-no-files-found: error
          retention-days: 30
