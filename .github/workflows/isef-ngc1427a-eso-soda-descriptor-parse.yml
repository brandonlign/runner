name: ISEF NGC1427A ESO SODA descriptor parse
on:
  push:
    paths:
      - 'isef/ngc1427a_eso_soda_descriptor_parse.py'
      - '.github/workflows/isef-ngc1427a-eso-soda-descriptor-parse.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: timeout 240s python isef/ngc1427a_eso_soda_descriptor_parse.py
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## NGC1427A ESO SODA descriptor'; echo '```json'; cat results/ngc1427a_eso_soda_descriptor_parse.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
