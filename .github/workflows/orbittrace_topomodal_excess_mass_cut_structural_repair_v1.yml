name: OrbitTrace topomodal excess-mass cut structural repair v1

on:
  push:
    branches:
      - agent/orbittrace-topomodal-excess-mass-cut-v1
    paths:
      - '.github/workflows/orbittrace_topomodal_excess_mass_cut_structural_repair_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  structural:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and audit frozen repaired sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0' 'requests==2.32.5' 'beautifulsoup4==4.12.3' 'pandas==2.2.3' 'click==8.0.4' 'future==1.0.0'
          python -m pip install --no-deps 'gmn-python-api==0.0.13'
          mkdir -p input/source input/manifest output
          test "$(git hash-object orbittrace_topomodal_excess_mass_cut_v1/PROTOCOL.md)" = 'e98d69db77045619b552237b96da91960d594514'
          test "$(git hash-object orbittrace_topomodal_excess_mass_cut_v1/run_structural.py)" = '49dccfa9716ec568f682c92cdf1bc2bfb22b5d0d'
          test "$(git hash-object orbittrace_topomodal_annual_confirmation_v1/generate_prelabel.py)" = 'df6bb74c063facbdda27197e15096c0443760e38'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_topomodal_excess_mass_cut_v1/evaluate_structural_prelabel.py)" = '1a6101cd8c0b4eb4c8512cedd3b93df4dce14b19'
          ! grep -Eq 'parse_catalogue|hidden_sealed|hidden_truth|eligible_labels|metrics\(' orbittrace_topomodal_excess_mass_cut_v1/run_structural.py
          python -m py_compile orbittrace_topomodal_excess_mass_cut_v1/run_structural.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-1284-prelabel-isolated-for-orbital-v1
          path: input/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31979041005
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-numstat-availability-v1
          path: input/manifest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31972929547
      - name: Verify immutable pretruth inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/source/TOPOMODAL_SPARSE_RECOVERY_V1_PRELABEL.json | cut -d' ' -f1)" = 'db608f84bf333d18d624199f2d31c27b4183ee3a75a3d930cef4b9766a19d4de'
          test "$(sha256sum input/manifest/EXACT_1284_SPARSE_UNIVERSE_MANIFEST_V1.json | cut -d' ' -f1)" = '3ed5c33216d7d1cf2cbc703da088b3a86132e50532fb996cfe475d7f6052d7f8'
          python - <<'PY'
          import json
          p=json.load(open('input/source/TOPOMODAL_SPARSE_RECOVERY_V1_PRELABEL.json')); m=json.load(open('input/manifest/EXACT_1284_SPARSE_UNIVERSE_MANIFEST_V1.json'))
          assert p['shower_truth_used'] is False and p['target_information_access'] is False and p['target_region_events_accessed'] is False and len(p['subsets'])==8
          assert m['shower_label_accessed'] is False and m['blind_exclusion']==[20.0,55.0] and len(m['audited_union_ids'])==23080
          print('PASS_EXCESS_MASS_REPAIR_PRETRUTH_INPUTS')
          PY
      - name: Run repaired zero-label excess-mass diagnostic
        run: |
          set -euo pipefail
          python -u orbittrace_topomodal_excess_mass_cut_v1/run_structural.py \
            --source-prelabel input/source/TOPOMODAL_SPARSE_RECOVERY_V1_PRELABEL.json \
            --universe-manifest input/manifest/EXACT_1284_SPARSE_UNIVERSE_MANIFEST_V1.json \
            --geometry-source orbittrace_topomodal_annual_confirmation_v1/generate_prelabel.py \
            --structural-runner orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --output output
      - name: Enforce structural result contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/TOPOMODAL_EXCESS_MASS_CUT_STRUCTURAL_V1.json'))
          assert r['schema']=='ORBITTRACE_TOPOMODAL_EXCESS_MASS_CUT_STRUCTURAL_V1'
          assert r['verdict'] in {'PASS_TOPOMODAL_EXCESS_MASS_CUT_STRUCTURAL_V1','FAIL_TOPOMODAL_EXCESS_MASS_CUT_STRUCTURAL_V1'}
          assert len(r['panels'])==8 and len(r['pairs'])==4 and len(r['summary']['gates'])==6
          assert r['shower_truth_used'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False
          print(r['verdict']); print(json.dumps(r['summary'],indent=2,sort_keys=True)); print(json.dumps([{'d':p['denominator'],'b':p['bucket'],'selected':len(p['selected_candidates']),'recurrent':p['recurrent_count'],'roots':p['selected_summary']['selected_root_count']} for p in r['panels']],indent=2,sort_keys=True))
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum orbittrace_topomodal_excess_mass_cut_v1/PROTOCOL.md orbittrace_topomodal_excess_mass_cut_v1/run_structural.py orbittrace_topomodal_excess_mass_cut_v1/evaluate_structural_prelabel.py input/source/TOPOMODAL_SPARSE_RECOVERY_V1_PRELABEL.json input/manifest/EXACT_1284_SPARSE_UNIVERSE_MANIFEST_V1.json output/TOPOMODAL_EXCESS_MASS_CUT_STRUCTURAL_V1.json > output/source_input_output_sha256.txt 2>/dev/null || true
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-topomodal-excess-mass-cut-structural-repair-v1
          path: output
          if-no-files-found: error
          retention-days: 90