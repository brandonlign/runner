name: OrbitTrace label-free v6 SAAMER 2020-2021 external validation

on:
  pull_request:
    branches:
      - agent/orbittrace-label-free-v6-saamer-2020-2021-external
    paths:
      - 'orbittrace_label_free_v6_saamer_external/RUN.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out frozen external-validation parent
        uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-label-free-v6-saamer-2020-2021-external

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Enforce frozen pre-SAAMER source and artifact guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v3 input/v6 input/freshness input/literature output

          test "$(git hash-object orbittrace_label_free_v6_saamer_external/PROTOCOL.md)" = "e98b55339d7f17bbc1ef36f1ac73139b6bcfacf0"
          test "$(git hash-object orbittrace_label_free_v6_saamer_external/run_external_validation.py)" = "16a4e832893cbc689ff084510f792349035e5ff7"
          test "$(git hash-object orbittrace_label_free_sparse_support_v6/PROTOCOL.md)" = "95feefca6670933795bcc65dd5d9a101a8c4e540"
          test "$(git hash-object orbittrace_label_free_sparse_support_v6/run_development.py)" = "7995fc6b75d1fd51eb4b304ace39db28a5a1e876"

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"

          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > input/literature/literature_comparators.py
          test "$(git hash-object input/literature/literature_comparators.py)" = "ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2"

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" \
            -o input/v6.zip
          echo "3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v6.zip" | sha256sum -c -
          unzip -q input/v6.zip -d input/v6

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9004812755/zip" \
            -o input/freshness.zip
          echo "a990b5c2939d6ab9b652c4c2a97a0607b5b1417aa66d1f929c5e2f0d5e15e178  input/freshness.zip" | sha256sum -c -
          unzip -q input/freshness.zip -d input/freshness

          python - <<'PY'
          import json
          from pathlib import Path
          v6=json.loads(Path('input/v6/label_free_sparse_support_v6_development.json').read_text())
          assert v6['verdict']=='PASS_LABEL_FREE_SPARSE_SUPPORT_V6_DEVELOPMENT'
          assert all(v6['integrity_gates'].values())
          assert all(v6['scientific_gates'].values())
          fresh=json.loads(Path('input/freshness/saamer_2020_2021_repo_freshness_audit_corrected.json').read_text())
          assert fresh['verdict']=='PASS_SAAMER_2020_2021_REPO_SCIENTIFIC_FRESHNESS_AUDIT'
          assert fresh['potential_exposure_hit_count']==0
          PY

          python -m py_compile \
            input/v3/multi_anchor_energy_v3.py \
            input/literature/literature_comparators.py \
            orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py \
            orbittrace_sparse_support_multiplicity_v5/run_holdout.py \
            orbittrace_label_free_sparse_support_v6/run_development.py \
            orbittrace_label_free_v6_saamer_external/run_external_validation.py

          rm -rf output/*
          echo PASS_SAAMER_V6_PREDATA_GUARDS

      - name: Run one-shot SAAMER external validation
        env:
          PYTHONPATH: input/v3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python orbittrace_label_free_v6_saamer_external/run_external_validation.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --v6-result-json input/v6/label_free_sparse_support_v6_development.json \
            --freshness-json input/freshness/saamer_2020_2021_repo_freshness_audit_corrected.json \
            --dsh-comparator input/literature/literature_comparators.py \
            --output output
          cat output/SAAMER_EXTERNAL_VALIDATION.md

      - name: Enforce frozen result integrity and claim boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/saamer_external_validation.json').read_text())
          assert r['verdict'] in {
            'PASS_LABEL_FREE_V6_SAAMER_EXTERNAL_VALIDATION',
            'FAIL_LABEL_FREE_V6_SAAMER_EXTERNAL_VALIDATION',
            'INCONCLUSIVE_LABEL_FREE_V6_SAAMER_EXTERNAL_POWER',
            'FAIL_LABEL_FREE_V6_SAAMER_EXTERNAL_INTEGRITY',
          }
          c=r['configuration']
          assert c['years']==[2020,2021]
          assert c['blind_exclusion']==[20.0,55.0]
          assert c['max_events_per_10deg_bin']==10000
          assert c['no_source_labels'] is True
          assert c['no_orbits_in_candidate_or_ranking'] is True
          assert c['no_threshold_search'] is True and c['no_density_search'] is True
          assert c['no_cap_search'] is True and c['no_weight_search'] is True
          assert r['orbit_read_audit']['orbital_elements_interpreted_only_after_rank_freeze'] is True
          assert 'No OrbitTrace target information' in r['claim_boundary']
          print('ORBITTRACE_SAAMER_EXTERNAL_RESULT_BEGIN')
          print(json.dumps(r,indent=2,sort_keys=True))
          print('ORBITTRACE_SAAMER_EXTERNAL_RESULT_END')
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/external_commit.txt
          sha256sum \
            orbittrace_label_free_v6_saamer_external/PROTOCOL.md \
            orbittrace_label_free_v6_saamer_external/run_external_validation.py \
            orbittrace_label_free_sparse_support_v6/run_development.py \
            orbittrace_sparse_support_multiplicity_v5/run_holdout.py \
            input/v3/multi_anchor_energy_v3.py \
            input/literature/literature_comparators.py \
            orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload external-validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-label-free-v6-saamer-2020-2021-external
          path: output
          if-no-files-found: error
          retention-days: 90
