name: OrbitTrace rectangular D_SH exact-equivalence audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p9-bidirectional-reliability-freeze
    paths:
      - orbittrace_dsh_rectangular_equivalence/**
      - .github/workflows/orbittrace_dsh_rectangular_equivalence.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install frozen numerical dependencies
        run: python -m pip install -r ghoststream_fixed4_application/requirements.txt
      - name: Fetch exact canonical D_SH source
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > /tmp/literature_comparators.py
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  /tmp/literature_comparators.py' | sha256sum -c -
      - name: Require bitwise equality on deterministic random and edge panels
        env:
          PYTHONPATH: orbittrace_dsh_rectangular_equivalence
        run: |
          set -euo pipefail
          python -m py_compile orbittrace_dsh_rectangular_equivalence/rectangular_dsh.py orbittrace_dsh_rectangular_equivalence/audit_equivalence.py
          python orbittrace_dsh_rectangular_equivalence/audit_equivalence.py --canonical /tmp/literature_comparators.py --output /tmp/dsh_rectangular_equivalence.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/dsh_rectangular_equivalence.json').read_text())
          assert r['classification']=='ENGINEERING_ONLY_EXACT_DSH_RECTANGULAR_EQUIVALENCE'
          assert r['canonical_sha256']=='85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a'
          assert r['scientific_parameters_changed'] is False
          assert r['target_data_accessed'] is False
          assert r['known_shower_truth_accessed'] is False
          assert r['all_bitwise_equal'] is True
          assert len(r['tests'])==7
          assert all(t['bitwise_equal'] and t['max_abs_difference']==0.0 for t in r['tests'])
          print('PASS_DSH_ENGINEERING_ONLY_NO_SCIENTIFIC_DATA')
          PY
      - name: Assert no scientific execution marker or target path
        run: |
          set -euo pipefail
          test ! -e orbittrace_dsh_rectangular_equivalence/RUN.md
          test ! -e target
          echo NO_SCIENTIFIC_EXECUTION_NO_TARGET_ACCESS
