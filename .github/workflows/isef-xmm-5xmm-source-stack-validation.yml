name: ISEF 5XMM source-stack validation
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_5xmm_source_stack_validation.py'
      - '.github/workflows/isef-xmm-5xmm-source-stack-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8'
      - name: Validate structural mapping
        id: v
        continue-on-error: true
        run: timeout 480s python isef/xmm_5xmm_source_stack_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-5xmm-source-stack-validation
          path: results/xmm_5xmm_source_stack_validation.json
          if-no-files-found: warn
      - name: Report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', OUTCOME: '${{ steps.v.outcome }}'}
        run: |
          python - <<'PY' >/tmp/r.md
          import json,os
          from pathlib import Path
          print('## 5XMM source-to-stack validation');print('Outcome:',f"`{os.environ.get('OUTCOME')}`")
          p=Path('results/xmm_5xmm_source_stack_validation.json')
          if p.exists():print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:50000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
