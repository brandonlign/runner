name: ISEF TESS binary TSSYS null freeze
on:
  push:
    branches: [main]
    paths:
      - 'isef/TESS_BINARY_TSSYS_NULL_FREEZE_TRIGGER'
  workflow_dispatch:
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata-only dependencies
        run: pip install requests beautifulsoup4
      - name: Verify syntax
        run: python -m py_compile isef/tess_binary_tssys_null_freeze.py
      - name: Freeze controls without opening light curves
        run: |
          cd isef
          python tess_binary_tssys_null_freeze.py
      - name: Preserve freeze artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-tess-binary-tssys-null-freeze
          path: isef/results/tess_binary_tssys_null_freeze/
          if-no-files-found: warn
