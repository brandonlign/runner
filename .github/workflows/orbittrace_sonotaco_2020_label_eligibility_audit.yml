name: OrbitTrace SonotaCo 2020 label eligibility audit

on:
  pull_request:
    branches:
      - agent/orbittrace-dual-channel-minimum-rescue-development
    paths:
      - .github/workflows/orbittrace_sonotaco_2020_label_eligibility_audit.yml
      - orbittrace_dual_channel_rescue/build_sonotaco_2020_confirmation_source.py
      - orbittrace_dual_channel_rescue/run_sonotaco_2020_label_eligibility_audit.py
      - orbittrace_literature_freeze/SONOTACO_2020_ARCHIVE_STRUCTURE_RESULT.json
      - orbittrace_literature_freeze/DUAL_CHANNEL_MINIMUM_RESCUE_DEVELOPMENT_RESULT.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  eligibility-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-dual-channel-2020-source-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt

      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt

      - name: Verify frozen inputs and score-free eligibility source
        run: |
          set -euo pipefail
          mkdir -p input/repaired input output
          test "$(git hash-object orbittrace_literature_freeze/DUAL_CHANNEL_MINIMUM_RESCUE_DEVELOPMENT_RESULT.json)" = "d90e3a9fe5b0dbcf3aaf475b1096529408750448"
          test "$(git hash-object orbittrace_literature_freeze/SONOTACO_2020_ARCHIVE_STRUCTURE_RESULT.json)" = "2192bc4f799a7da2b439a30a7001a3a3369bd52a"
          test "$(git hash-object orbittrace_dual_channel_rescue/build_sonotaco_2020_confirmation_source.py)" = "ad14adaed3258c076db47d83d69fa930ab0d3f61"
          test "$(git hash-object orbittrace_dual_channel_rescue/run_sonotaco_2020_label_eligibility_audit.py)" = "f35558a305bdbd1bf60ea2ec71135558c086c989"
          python -m py_compile \
            orbittrace_dual_channel_rescue/build_sonotaco_2020_confirmation_source.py \
            orbittrace_dual_channel_rescue/run_sonotaco_2020_label_eligibility_audit.py
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          development = json.loads(Path('orbittrace_literature_freeze/DUAL_CHANNEL_MINIMUM_RESCUE_DEVELOPMENT_RESULT.json').read_text())
          structure = json.loads(Path('orbittrace_literature_freeze/SONOTACO_2020_ARCHIVE_STRUCTURE_RESULT.json').read_text())
          assert development['verdict'] == 'PASS_DUAL_CHANNEL_MINIMUM_RESCUE_DEVELOPMENT'
          assert development['architecture']['ranking'] == 'brown2010_wavelet_episode_core'
          assert development['architecture']['rescue_alpha'] == 1.0 / 129.0
          assert structure['verdict'] == 'PASS_SONOTACO_2020_ARCHIVE_STRUCTURE_AUDIT'
          assert structure['workflow_run'] == 31110705760
          assert structure['artifact_id'] == 8971533830
          assert structure['artifact_sha256'] == '75f1429f208e7657c060a659186dd3737264538f8400ad2e506582047e15811f'
          assert structure['archive']['sha256'] == '429c3a4556236c037051ecba2d5ecbe921a0a6865cac47df6f47ba2d44f43abc'
          assert structure['annual_member']['sha256'] == 'fa13cfaf9e1f3ed9094a1b9b032b1214efb757c983891d34aaae60ce196e1e79'
          assert structure['annual_member']['total_nonblank_rows'] == 33446
          assert not any(structure['prohibited_access'].values())

          source = Path('orbittrace_dual_channel_rescue/run_sonotaco_2020_label_eligibility_audit.py').read_text()
          tree = ast.parse(source)
          calls = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id)
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr)
          forbidden_calls = {
              'fixed4_score','score_all','wavelet_episode_score','target_hybrid_statistic',
              'dual_detected','roc_auc_score','auc','rate'
          }
          assert not calls.intersection(forbidden_calls)
          assert 'parse_sonotaco_2020_events' in source
          assert 'RESCUE_ALPHA = 1.0 / (CALIBRATION_PER_BIN + 1.0)' in source
          assert 'CALIBRATION_PER_BIN = 128' in source
          print('PASS_SCORE_FREE_2020_ELIGIBILITY_SOURCE_GUARD')
          PY

      - name: Retrieve validated 2023 parser source and frozen mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30920687116 \
            --repo "$GITHUB_REPOSITORY" \
            --name sonotaco-2023-confirmation-source-repair-v2 \
            --dir input/repaired
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/repaired/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -

      - name: Build and audit deterministic 2020 parser before label access
        run: |
          set -euo pipefail
          python orbittrace_dual_channel_rescue/build_sonotaco_2020_confirmation_source.py \
            --source-2023 input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            --output /tmp/run_sonotaco_2020_confirmation.py \
            | tee output/parser_build.txt
          python -m py_compile /tmp/run_sonotaco_2020_confirmation.py
          sha256sum /tmp/run_sonotaco_2020_confirmation.py | tee output/parser_source_sha256.txt
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/run_sonotaco_2020_confirmation.py').read_text()
          assert 'YEAR = 2020' in source
          assert 'CORPUS = "sonotaco-2020-dual-channel-validation"' in source
          assert 'def parse_sonotaco_2020_events(' in source
          assert 'f"SNM2020:{row_index}"' in source
          assert '429c3a4556236c037051ecba2d5ecbe921a0a6865cac47df6f47ba2d44f43abc' in source
          assert 'fa13cfaf9e1f3ed9094a1b9b032b1214efb757c983891d34aaae60ce196e1e79' in source
          assert 'EXPECTED_ROWS = 33_446' in source
          assert 'required unique SonotaCo 2020 fields are unavailable' in source
          print('PASS_BUILT_2020_PARSER_SOURCE_AUDIT')
          PY

      - name: Download exact SonotaCo 2020 archive
        run: |
          curl --fail --location --retry 3 \
            --output input/020a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/020a.zip
          echo '429c3a4556236c037051ecba2d5ecbe921a0a6865cac47df6f47ba2d44f43abc  input/020a.zip' | sha256sum -c -

      - name: Execute label and episode eligibility audit without scoring
        run: |
          set -euo pipefail
          python orbittrace_dual_channel_rescue/run_sonotaco_2020_label_eligibility_audit.py \
            --archive input/020a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --confirmation-source /tmp/run_sonotaco_2020_confirmation.py \
            --output output

      - name: Enforce eligibility-only result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/sonotaco_2020_label_eligibility_audit.json').read_text())
          if result.get('verdict') != 'PASS_SONOTACO_2020_LABEL_ELIGIBILITY_AUDIT':
              raise SystemExit(f"unexpected verdict: {result.get('verdict')}")
          if any(result['prohibited_access'].values()):
              raise SystemExit('scientific scoring occurred during eligibility audit')
          constants = result['benchmark_constants']
          if constants['calibration_per_bin'] != 128 or constants['rescue_alpha'] != 1.0 / 129.0:
              raise SystemExit('frozen rescue calibration changed')
          if constants['decision_rule'] != '(p_wavelet <= 0.05) OR (p_fixed4 <= 1/129)':
              raise SystemExit('decision rule changed')
          print(json.dumps(result, indent=2))
          PY

      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            orbittrace_literature_freeze/DUAL_CHANNEL_MINIMUM_RESCUE_DEVELOPMENT_RESULT.json \
            orbittrace_literature_freeze/SONOTACO_2020_ARCHIVE_STRUCTURE_RESULT.json \
            orbittrace_dual_channel_rescue/build_sonotaco_2020_confirmation_source.py \
            orbittrace_dual_channel_rescue/run_sonotaco_2020_label_eligibility_audit.py \
            input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            input/audit.json input/020a.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          if [ -f /tmp/run_sonotaco_2020_confirmation.py ]; then
            sha256sum /tmp/run_sonotaco_2020_confirmation.py >> output/source_and_input_sha256.txt
          fi
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-sonotaco-2020-label-eligibility-audit
          path: output
          if-no-files-found: error
          retention-days: 90
