name: OrbitTrace window-owned persistence ranking evaluator repair v1

on:
  push:
    branches:
      - agent/orbittrace-window-owned-persistence-ranking-eval-repair-v1
    paths:
      - '.github/workflows/orbittrace_window_owned_persistence_ranking_eval_repair_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  evaluator-only-repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install historical evaluator runtime without Persistable
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/ranker input/v8 input/prelabel output

          test "$(git hash-object orbittrace_window_owned_persistence_ranking_eval_repair_v1/PROTOCOL.md)" = '02f633117ed1beb00e000f33a7f84a51330f6a01'
          test "$(git hash-object orbittrace_window_owned_persistence_ranking_eval_repair_v1/run_evaluator.py)" = '84eb051c134a7e0110a2c5f06c68cc0de209aabe'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_window_owned_persistence_ranking_eval_repair_v1/run_evaluator.py

          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'

          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

          python - <<'PY'
          import importlib.util
          import numpy
          assert numpy.__version__ == '2.1.3', numpy.__version__
          assert importlib.util.find_spec('persistable') is None, 'Persistable must not be installed in evaluator repair runtime'
          print('numpy', numpy.__version__)
          print('persistable_absent', True)
          PY

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-window-owned-persistence-ranking-v1
          path: input/prelabel
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31956064964

      - name: Verify immutable successor prelabel
        run: |
          set -euo pipefail
          test "$(sha256sum input/prelabel/WINDOW_OWNED_PERSISTENCE_RANKING_V1_PRELABEL.json | cut -d' ' -f1)" = 'beae39cc987100373d236a19e656415dd63f183cfbbb4202345e0cde7e3b6f11'
          python - <<'PY'
          import json
          p=json.load(open('input/prelabel/WINDOW_OWNED_PERSISTENCE_RANKING_V1_PRELABEL.json'))
          assert p['scientific_role']=='PRELABEL_WINDOW_OWNED_PERSISTENCE_RANKING_V1'
          assert p['events_total']==738682
          assert len(p['successor_candidates'])==1028
          assert p['successor_summary']['both_year_candidate_count']==1014
          assert [int(r['rank']) for r in p['successor_candidates']]==list(range(1,1029))
          assert p['blind_exclusion']==[20.0,55.0]
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          PY

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Run evaluator only on immutable prelabel
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import numpy
          assert numpy.__version__ == '2.1.3', numpy.__version__
          assert importlib.util.find_spec('persistable') is None
          PY
          python -u orbittrace_window_owned_persistence_ranking_eval_repair_v1/run_evaluator.py \
            --prelabel input/prelabel/WINDOW_OWNED_PERSISTENCE_RANKING_V1_PRELABEL.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce repaired scientific contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='output/WINDOW_OWNED_PERSISTENCE_RANKING_V1_GMN_DEVELOPMENT_EVAL_REPAIR.json'
          r=json.load(open(p))
          assert r['verdict'] in {'PASS_WINDOW_OWNED_PERSISTENCE_RANKING_V1_GMN_DEVELOPMENT','FAIL_WINDOW_OWNED_PERSISTENCE_RANKING_V1_GMN_DEVELOPMENT'}
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_DEVELOPMENT_ONLY'
          assert r['repair_role']=='EVALUATOR_ONLY_IMMUTABLE_PRELABEL_REPAIR_V1'
          assert r['source_run_id']==31956064964 and r['source_artifact_id']==9266239856
          assert r['prelabel_sha256']=='beae39cc987100373d236a19e656415dd63f183cfbbb4202345e0cde7e3b6f11'
          assert r['successor_candidate_count']==1028 and r['successor_both_year_candidate_count']==1014
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_2013_2014_access'] is False and r['asfn_event_level_access'] is False and r['efn_event_level_access'] is False
          assert r['amos_scientific_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          print(r['verdict'])
          print(json.dumps({'parent':r['parent_metrics'],'successor':r['successor_metrics'],'gates':r['annual_gates'],'strict100':r['strict_recovered_at_100_improvement_some_year']},indent=2,sort_keys=True))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_window_owned_persistence_ranking_eval_repair_v1/PROTOCOL.md \
            orbittrace_window_owned_persistence_ranking_eval_repair_v1/run_evaluator.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            input/prelabel/WINDOW_OWNED_PERSISTENCE_RANKING_V1_PRELABEL.json \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            output/WINDOW_OWNED_PERSISTENCE_RANKING_V1_GMN_DEVELOPMENT_EVAL_REPAIR.json \
            > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-window-owned-persistence-ranking-eval-repair-v1
          path: output
          if-no-files-found: error
          retention-days: 90
