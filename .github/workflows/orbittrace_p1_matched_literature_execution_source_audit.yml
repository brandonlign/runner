name: OrbitTrace P1 matched literature execution source audit

on:
  pull_request:
    branches: [agent/orbittrace-p1-matched-literature-freeze]
    paths:
      - .github/workflows/orbittrace_p1_matched_literature_execution.yml
      - .github/workflows/orbittrace_p1_matched_literature_execution_source_audit.yml
      - orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py
      - orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel_intermediate.py

permissions:
  contents: read
concurrency:
  group: orbittrace-p1-matched-literature-execution-source-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-p1-matched-literature-implementation-freeze
      - name: Prove guarded chronology, wrapper identity, and exact inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,hashlib
          from pathlib import Path
          w=Path('.github/workflows/orbittrace_p1_matched_literature_execution.yml').read_text()
          for token in (
              'agent/orbittrace-p1-matched-literature-implementation-freeze',
              'orbittrace_probabilistic_membership_p1_literature/RUN.md',
              'EXECUTE_P1_MATCHED_AFTER_EXACT_P1_PASS',
              "r['verdict']=='PASS_PROBABILISTIC_MEMBERSHIP_P1_DEVELOPMENT'",
              "r['configuration']['parameter_search'] is False",
              "r['configuration']['new_members_can_seed_growth'] is False",
              "assert all(r['gates'].values())",
              "e7847e067bab8d07038c998359ccbf0ca6e2ccf257f27f27f4aef999cc7a0508",
              "35f629b1dff4d04cdc13aa8224171ec1ab8e06b52836900d66ff978b5c235761",
              "8e7580c52e41e6994d6e46f289a7b916565a4efc512c5549ee83f249d0e81ee3",
              "2b9e86572f10af447071cb10c56f643c1ad8babfe0d9aa667994ba3639834389",
              "77844d700bb14bb9952307fad13eb66cbc62e6a1555e5edd9c8aa0d26968b06e",
              "9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430",
              "f4eb716a4b900658fcc658a633d918eca28946f59da75935f1fd5f6bc539bf52",
          ):
              assert token in w,token
          assert '|| true' not in w
          assert "matrix:\n        panel: [hdbscan, sugar]" in w
          assert 'needs: [authorize, manifest, pretruth]' in w
          assert w.index('prepare_strict_id_manifest.py') < w.index('run_pretruth_panel.py') < w.index('evaluate_frozen.py')
          assert '--hdbscan-pretruth' in w and '--sugar-pretruth' in w
          assert 'P1_MATCHED_INPUT_INELIGIBLE_EXACT_V8_SUPPORT' in w
          assert "if r['matched_input_ineligible']:" in w
          assert "assert not r['broad_catalogue_superiority'] and not r['sparse_stream_superiority']" in w

          wrapper=Path('orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py').read_text()
          tree=ast.parse(wrapper); vals={}
          for n in tree.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name):
                  try: vals[n.targets[0].id]=ast.literal_eval(n.value)
                  except Exception: pass
          assert vals['INTERMEDIATE_SHA256']=='af0c48e185793514ea98e90bdeb0fcf18be60751deeb7c818fac0c2d11b1cb1e'
          assert vals['RUNTIME_SHA256']=='127ff2af8cd2597736cedbb4eab19cecdf7985e89f65c5267eda46e97ed82dcb'
          assert vals['BEFORE']=="    support.CORPUS = 'p1-sonotaco-exact-row-pretruth'\n"
          assert vals['AFTER']=="    support.CORPUS = 'sonotaco-exact-row-literature-pairwise'\n"
          intermediate=Path('orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel_intermediate.py').read_bytes()
          assert hashlib.sha256(intermediate).hexdigest()==vals['INTERMEDIATE_SHA256']
          main=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='main')
          mainsrc=ast.get_source_segment(wrapper,main)
          assert 'patched = text.replace(BEFORE, AFTER, 1)' in mainsrc
          assert 'if sha256(payload) != RUNTIME_SHA256:' in mainsrc
          assert "runpy.run_path(str(RUNTIME), run_name='__main__')" in mainsrc
          # Corpus string appears only as immutable patch metadata, not as detector code in the wrapper.
          assert not any(isinstance(n,ast.Attribute) and n.attr=='CORPUS' and isinstance(getattr(n,'ctx',None),ast.Store) for n in ast.walk(tree))
          for forbidden in ('OAS','chi2','poisson_rate_upper','stream_intensity','evaluate_order','run_v8_panel'):
              assert forbidden not in wrapper,forbidden
          print('PASS_P1_MATCHED_EXECUTION_CHRONOLOGY_RUNTIME_AND_PROVENANCE')
          PY
      - name: Prove no activation on freeze branch
        run: |
          set -euo pipefail
          test ! -e orbittrace_probabilistic_membership_p1_literature/RUN.md
          echo NO_P1_MATCHED_EXECUTION_NO_SONOTACO_NO_TARGET_REGION
