name: ISEF Euclid v2 OGLE phase-control fast
on:
  push:
    branches: [main]
    paths:
      - 'isef/euclid_v2_ogle_phase_probe_fast.py'
      - '.github/workflows/isef-euclid-v2-ogle-phase-fast.yml'
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'photutils>=2.2'
      - name: Fast OGLE phase-control feasibility
        id: probe
        continue-on-error: true
        run: timeout 600s python isef/euclid_v2_ogle_phase_probe_fast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-euclid-v2-ogle-phase-fast
          path: results/euclid_v2_ogle_phase_probe_fast.json
          if-no-files-found: warn
      - name: Report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', OUTCOME: '${{ steps.probe.outcome }}'}
        run: |
          python - <<'PY' > /tmp/oglefast.md
          import json,os
          from pathlib import Path
          print('## Euclid v2 OGLE phase-control fast probe')
          print(f"outcome: `{os.environ.get('OUTCOME')}`")
          p=Path('results/euclid_v2_ogle_phase_probe_fast.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:60000]+'\n```')
          else: print('_artifact not produced_')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/oglefast.md
