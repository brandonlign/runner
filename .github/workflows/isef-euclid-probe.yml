name: ISEF Euclid Q2 probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'isef/**'
      - '.github/workflows/isef-euclid-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8'
      - name: Map 16-epoch dither geometry
        id: geometry
        continue-on-error: true
        run: python isef/euclid_geometry_manifest.py
      - name: Upload geometry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-euclid-geometry
          path: results/euclid_geometry_manifest.json
          if-no-files-found: warn
      - name: Report geometry to probe issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GEOM_OUTCOME: ${{ steps.geometry.outcome }}
        run: |
          python - <<'PY' > /tmp/euclid-comment.md
          import json, os
          from pathlib import Path
          p=Path('results/euclid_geometry_manifest.json')
          print('## Euclid Q2 geometry manifest')
          print(f"Outcome: `{os.environ.get('GEOM_OUTCOME')}`")
          if p.exists():
              print('```json');print(json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:50000]);print('```')
          else:print('_not produced_')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/euclid-comment.md
