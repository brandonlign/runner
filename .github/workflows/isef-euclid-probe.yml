name: ISEF Euclid Q2 probe

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [opened]

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.event.issue.title, 'ISEF EUCLID PROBE')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'fsspec>=2025.7' 'aiohttp>=3.12'
      - name: Run deterministic HTTP-range probe
        run: python isef/euclid_range_probe.py
      - name: Run Astropy/fsspec comparison probe
        if: success()
        run: python isef/euclid_remote_probe.py
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-euclid-remote-probes
          path: results/euclid_*probe.json
          if-no-files-found: warn
