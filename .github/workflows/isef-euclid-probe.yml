name: ISEF Euclid Q2 probe

on:
  push:
    branches: [main]
    paths:
      - 'isef/**'
      - '.github/workflows/isef-euclid-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'isef/**'
      - '.github/workflows/isef-euclid-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install science dependencies
        run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'photutils>=2.2'
      - name: Run exact-WCS 16-epoch feasibility test
        id: routed
        continue-on-error: true
        run: python isef/euclid_shiftwide_feasibility.py
      - name: Diagnose aperture and dither systematics
        if: steps.routed.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_stage0_diagnostics.py
      - name: Run candidate-independent quality diagnostic
        id: quality
        if: steps.routed.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_stage0_quality.py
      - name: Inspect morphology-clean large excursions
        id: survivors
        if: steps.routed.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_stage0_survivors.py
      - name: Run cross-aperture and temporal quality diagnostic
        id: qualityv2
        if: steps.routed.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_stage0_quality_v2.py
      - name: Run same-dither PSF validation
        id: psf
        if: steps.survivors.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_stage0_psf_validation.py
      - name: Inspect auxiliary FITS products
        id: aux
        if: steps.survivors.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_aux_manifest.py
      - name: Validate survivors with released FLAG and RMS maps
        id: flags
        if: steps.survivors.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_stage0_flag_validation.py
      - name: Upload feasibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-euclid-routed-stage0
          path: |
            results/euclid_routed_feasibility.json
            results/euclid_routed_stamps.npz
            results/euclid_stage0_diagnostics.json
            results/euclid_stage0_quality.json
            results/euclid_stage0_survivors.json
            results/euclid_stage0_quality_v2.json
            results/euclid_stage0_psf_validation.json
            results/euclid_aux_manifest.json
            results/euclid_stage0_flag_validation.json
          if-no-files-found: warn
      - name: Report result to probe issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTED_OUTCOME: ${{ steps.routed.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          SURVIVOR_OUTCOME: ${{ steps.survivors.outcome }}
          QUALITYV2_OUTCOME: ${{ steps.qualityv2.outcome }}
          PSF_OUTCOME: ${{ steps.psf.outcome }}
          AUX_OUTCOME: ${{ steps.aux.outcome }}
          FLAGS_OUTCOME: ${{ steps.flags.outcome }}
        run: |
          python - <<'PY' > /tmp/euclid-comment.md
          import json, os
          from pathlib import Path
          print('## Euclid Q2 Stage-0 PSF/auxiliary validation')
          print(f"Stage-0: `{os.environ.get('ROUTED_OUTCOME')}`; survivors: `{os.environ.get('SURVIVOR_OUTCOME')}`; quality-v2: `{os.environ.get('QUALITYV2_OUTCOME')}`; PSF: `{os.environ.get('PSF_OUTCOME')}`; aux: `{os.environ.get('AUX_OUTCOME')}`; flags: `{os.environ.get('FLAGS_OUTCOME')}`")
          for name in ['euclid_stage0_psf_validation.json','euclid_aux_manifest.json','euclid_stage0_flag_validation.json']:
              p=Path('results')/name; print(f'### {name}')
              if p.exists(): print('```json'); print(json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:50000]); print('```')
              else: print('_not produced_')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/euclid-comment.md
