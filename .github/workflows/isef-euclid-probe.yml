name: ISEF Euclid Q2 probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'isef/**'
      - '.github/workflows/isef-euclid-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bounded HTTP-range smoke test
        run: python isef/euclid_range_smoke.py
      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-euclid-range-smoke
          path: results/euclid_range_smoke.json
          if-no-files-found: warn
