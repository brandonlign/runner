name: ISEF Euclid Q2 probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'isef/**'
      - '.github/workflows/isef-euclid-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install science dependencies
        run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'photutils>=2.2'
      - name: Validate all 16 Field-1 science URLs
        run: python isef/euclid_16url_smoke.py
      - name: Run bounded HTTP-range smoke test
        run: python isef/euclid_range_smoke.py
      - name: Run 16-epoch repeatability feasibility test with bounded ranges
        run: python isef/euclid_16epoch_feasibility_safe.py
      - name: Upload feasibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-euclid-stage0
          path: |
            results/euclid_16url_smoke.json
            results/euclid_range_smoke.json
            results/euclid_16epoch_feasibility.json
            results/euclid_16epoch_stamps.npz
          if-no-files-found: warn
