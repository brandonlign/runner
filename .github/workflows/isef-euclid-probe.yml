name: ISEF Euclid Q2 probe

on:
  push:
    branches: [main]
    paths:
      - 'isef/**'
      - '.github/workflows/isef-euclid-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'isef/**'
      - '.github/workflows/isef-euclid-probe.yml'

concurrency:
  group: isef-euclid-q2-probe
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install science dependencies
        run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'photutils>=2.2'
      - name: Run exact-WCS 16-epoch feasibility test
        id: routed
        continue-on-error: true
        run: python isef/euclid_shiftwide_feasibility.py
      - name: Build empirical PSF morphology null and pixel injections
        id: psfcontrols
        if: steps.routed.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_stage0_psf_controls.py
      - name: Build morphology-gated same-dither PSF detector
        id: psfdetector
        if: steps.psfcontrols.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_stage0_psf_detector.py
      - name: Construct joint morphology and released-FLAG PSF null
        id: psfflag
        if: steps.psfdetector.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_stage0_psf_flag_gate.py
      - name: Test exact-routed PSF detector across broad development patches
        id: multipatch
        if: steps.psfcontrols.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_stage0_multi_patch.py
      - name: Run Gaia short-timescale positive controls
        id: positives
        if: steps.routed.outcome == 'success'
        continue-on-error: true
        run: timeout 70s python isef/euclid_gaia_positive_controls.py || true
      - name: Upload current validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-euclid-current-gate
          path: |
            results/euclid_routed_feasibility.json
            results/euclid_routed_stamps.npz
            results/euclid_stage0_psf_controls.json
            results/euclid_stage0_psf_detector.json
            results/euclid_stage0_psf_flag_gate.json
            results/euclid_stage0_multi_patch.json
            results/euclid_gaia_positive_controls.json
          if-no-files-found: warn
      - name: Report current gate to probe issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTED_OUTCOME: ${{ steps.routed.outcome }}
          PSFDETECTOR_OUTCOME: ${{ steps.psfdetector.outcome }}
          PSFFLAG_OUTCOME: ${{ steps.psfflag.outcome }}
          MULTIPATCH_OUTCOME: ${{ steps.multipatch.outcome }}
          POSITIVES_OUTCOME: ${{ steps.positives.outcome }}
        run: |
          python - <<'PY' > /tmp/euclid-comment.md
          import json, os
          from pathlib import Path
          print('## Euclid Q2 current PSF/FLAG/generalization gate')
          print(f"Stage-0: `{os.environ.get('ROUTED_OUTCOME')}`; PSF detector: `{os.environ.get('PSFDETECTOR_OUTCOME')}`; PSF+FLAG: `{os.environ.get('PSFFLAG_OUTCOME')}`; multi-patch: `{os.environ.get('MULTIPATCH_OUTCOME')}`; Gaia: `{os.environ.get('POSITIVES_OUTCOME')}`")
          for name in ['euclid_stage0_psf_detector.json','euclid_stage0_psf_flag_gate.json','euclid_stage0_multi_patch.json','euclid_gaia_positive_controls.json']:
              p=Path('results')/name; print(f'### {name}')
              if p.exists(): print('```json'); print(json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:50000]); print('```')
              else: print('_not produced_')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/euclid-comment.md
