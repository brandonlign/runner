name: ISEF Euclid Q2 probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'isef/**'
      - '.github/workflows/isef-euclid-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install science dependencies
        run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'photutils>=2.2'
      - name: Run exact-WCS 16-epoch feasibility test
        id: routed
        continue-on-error: true
        run: python isef/euclid_shiftwide_feasibility.py
      - name: Upload feasibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-euclid-routed-stage0
          path: |
            results/euclid_routed_feasibility.json
            results/euclid_routed_stamps.npz
          if-no-files-found: warn
      - name: Report result to probe issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTED_OUTCOME: ${{ steps.routed.outcome }}
        run: |
          python - <<'PY' > /tmp/euclid-comment.md
          import json, os
          from pathlib import Path
          p=Path('results/euclid_routed_feasibility.json')
          print('## Euclid Q2 exact-WCS Stage-0')
          print(f"Outcome: `{os.environ.get('ROUTED_OUTCOME')}`")
          if p.exists():
              print('```json');print(json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:50000]);print('```')
          else:print('_not produced_')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/euclid-comment.md
