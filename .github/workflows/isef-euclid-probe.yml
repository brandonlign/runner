name: ISEF Euclid Q2 probe

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'ISEF EUCLID PROBE')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install remote FITS dependencies
        run: python -m pip install 'astropy>=7.1,<8' 'fsspec>=2025.7' 'aiohttp>=3.12' 'numpy>=2.2'
      - name: Run range-read probe
        run: python isef/euclid_remote_probe.py
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-euclid-remote-probe
          path: results/euclid_remote_probe.json
          if-no-files-found: warn
