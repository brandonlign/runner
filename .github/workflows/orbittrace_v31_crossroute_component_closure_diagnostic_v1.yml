name: OrbitTrace v31 cross-route component-closure diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v31_crossroute_component_closure_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v31_crossroute_component_closure_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v31-crossroute-component-closure-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and pin runtime and diagnostic source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/truth output/pretruth output/diag
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          test "$(git hash-object orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py)" = '917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          test "$(git hash-object orbittrace_v31_crossroute_component_closure_diagnostic_v1/PROTOCOL.md)" = 'ce587b008971e77f170ad978ac9a1a462b5b416c'
          test "$(git hash-object orbittrace_v31_crossroute_component_closure_diagnostic_v1/diagnose.py)" = '7dc5a8328395657180b62ac8d9682f34cb101d12'
          python -m py_compile orbittrace_v31_crossroute_component_closure_diagnostic_v1/diagnose.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify immutable #839 ranker
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - name: Restore immutable #950 pretruth payload before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/v24.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/v24.zip' | sha256sum -c -
          unzip -q input/v24.zip -d input/payload
          test "$(sha256sum input/payload/result/V24_EXPOSED_TWOHEAD_OOF_RESULT.json | cut -d' ' -f1)" = 'c8d95bc02ad1436c9924ec14a25bcd36e0eacd960fda1fb33db3a91738fe30cf'
          python - <<'PY'
          import json
          for route in ('sugar','hdbscan'):
              m=json.load(open(f'input/payload/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              f=json.load(open(f'input/payload/{route}/family_memberships.json'))
              assert m['truth_accessed'] is False and m['feature_dimension']==71 and f['truth_accessed'] is False
          print('PASS_COMPONENT_CLOSURE_IMMUTABLE_PRETRUTH')
          PY
      - name: Freeze radius-1 graph and connected components before truth
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v31_crossroute_component_closure_diagnostic_v1/diagnose.py pretruth \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --output output/pretruth
          echo '2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25  output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json' | sha256sum -c -
          python - <<'PY'
          import json
          g=json.load(open('output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json'))
          c=json.load(open('output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json'))
          assert g['verdict']=='PASS_CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY' and g['truth_accessed'] is False
          assert g['radius']==1.0 and g['edge_count']==2334 and len(g['sugar_family_ids'])==267 and len(g['hdbscan_family_ids'])==229
          assert c['verdict']=='PASS_CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY' and c['truth_accessed'] is False
          assert c['graph_sha256']=='2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25'
          assert sum(x['member_count'] for x in c['components'])==496
          assert c['within_route_edges_added'] is False and c['graph_pruning'] is False and c['graph_expansion'] is False and c['component_size_threshold_selected'] is False
          assert g['target_information_access'] is False and g['target_region_events_accessed'] is False and g['maarsy_scientific_access'] is False and g['dms_scientific_access'] is False
          assert c['target_information_access'] is False and c['target_region_events_accessed'] is False and c['maarsy_scientific_access'] is False and c['dms_scientific_access'] is False
          assert g['blind_exclusion']==[20.0,55.0] and c['blind_exclusion']==[20.0,55.0]
          print('PASS_COMPONENT_CLOSURE_PRETRUTH_IDENTITY')
          PY
      - name: Load immutable exposed truth only after component identity freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
      - name: Reproduce exact v31 and diagnose component closure only
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v31_crossroute_component_closure_diagnostic_v1/diagnose.py diagnose \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --graph-file output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json \
            --component-file output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json \
            --output output/diag
      - name: Enforce diagnostic-only firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V31_CROSSROUTE_COMPONENT_CLOSURE_DIAGNOSTIC.json'))
          assert r['verdict']=='PASS_V31_CROSSROUTE_COMPONENT_CLOSURE_DIAGNOSTIC'
          assert r['scientific_role']=='POST_RESULT_DIAGNOSTIC_ONLY_NO_COMPONENT_RANK_OR_SELECTOR_EVALUATED'
          assert r['pretruth_graph_sha256']=='2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25'
          assert len(r['v31_reproduction'])==4 and set(r['annual_diagnostics'])=={'2013','2014'}
          assert r['annual_diagnostics']['2013']['hdb_budget']==11 and r['annual_diagnostics']['2013']['sugar_budget']==34
          assert r['annual_diagnostics']['2014']['hdb_budget']==9 and r['annual_diagnostics']['2014']['sugar_budget']==46
          for y in ('2013','2014'):
              a=r['annual_diagnostics'][y]
              assert a['annual_recoverable_hdb_groups']==18 and a['surfaced_recoverable_hdb_groups']==9 and a['missed_recoverable_hdb_groups']==9
              assert len(a['recoverable_group_rows'])==18
          for k in ('new_rank_or_score_evaluated','component_score_evaluated','component_selector_evaluated','hard_one_per_component_evaluated','representative_rule_evaluated','graph_propagation_evaluated','successor_selected','radius_search','metric_search','feature_search','within_route_edges_added','graph_pruning','graph_expansion','component_size_threshold_selected','component_rank_aggregation_search','component_support_bonus_search','transfer_coefficient_search','overlap_weight_search','jaccard_weight_search','distance_weight_search','budget_specific_successor','candidate_generation_changed','membership_changed','post_result_second_search','oracle_identity_hardcoded'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v31_crossroute_component_closure_diagnostic_v1/PROTOCOL.md orbittrace_v31_crossroute_component_closure_diagnostic_v1/diagnose.py orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py input/ranker/run_urc_union_ranker.py output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json > output/V31_CROSSROUTE_COMPONENT_CLOSURE_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-crossroute-component-closure-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
