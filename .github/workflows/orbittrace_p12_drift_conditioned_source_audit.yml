name: OrbitTrace P12 drift-conditioned source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p11-density-contrast-pretruth-reservation
    paths:
      - orbittrace_drift_conditioned_p12/**
      - .github/workflows/orbittrace_p12_drift_conditioned_source_audit.yml
      - .github/workflows/orbittrace_p12_drift_conditioned_development.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact audit dependencies
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2
      - name: Reconstruct exact P11 and exact P12 source
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2.py' | sha256sum -c -
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          echo 'f6c4c5a76b8b3f35d434aed4f1fb15035be05c40d0e0531c343ff620f3ba8185  /tmp/p3.py' | sha256sum -c -
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          echo '290c4f1b6401eaab6f182760eaeaa2f91cc994854febf465f58f7cacc5d73b2a  /tmp/p4.py' | sha256sum -c -
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          echo 'b48b3e6a45a7a371eb8e73c70ee217a33a96c596c61b51ebb7dc9c7b60100456  /tmp/p5.py' | sha256sum -c -
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          echo 'd32648136b58e2f777912d6403d9de3cbd091a8c23e16aedcda0b146f09f38c2  /tmp/p6.py' | sha256sum -c -
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          echo '89cf23c9d58692aedfaf12a9c2b7de4a08d641e6326794d82872f2e18608df54  /tmp/p7.py' | sha256sum -c -
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          echo 'd3bdcdaf18639e36cc02f5106b3a3c816f5e51eb19543f425717ba1c48a26470  /tmp/p8.py' | sha256sum -c -
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          echo '58330c61cf4039f07e80a9746d00eb7281b4e28e674a131d6333e6378695ae31  /tmp/p9.py' | sha256sum -c -
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          echo '638b4f41e51955436557a99f1142c3d3cea91e12a66e2f74925c6bfb79d5e50d  /tmp/p10.py' | sha256sum -c -
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/p11.py
          echo '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9  /tmp/p11.py' | sha256sum -c -
          python orbittrace_drift_conditioned_p12/apply_p12_patch.py /tmp/p11.py /tmp/p12.py
          expected="$(tr -d '[:space:]' < orbittrace_drift_conditioned_p12/SOURCE_SHA256)"
          test "$expected" = '78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32'
          echo "$expected  /tmp/p12.py" | sha256sum -c -
          PYTHONPATH=. python -m py_compile /tmp/p12.py

          PYTHONPATH=. python - <<'PY'
          import importlib.util
          import numpy as np
          from types import SimpleNamespace
          spec=importlib.util.spec_from_file_location('p12_source_audit','/tmp/p12.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          base=SimpleNamespace(wrap180=lambda x: ((float(x)+180.0)%360.0)-180.0)
          rows=[]
          for j,t in enumerate((-3,-2,-1,0,1,2,3,4)):
              sol=100.0+t
              rows.append({'id':f'2022{j:04d}','sol':sol,'sun_lon':210.0+0.6*t,'ecl_lat':5.0+0.25*t,'vg':40.0+0.4*t})
          center, model, audit=m.source_observation_model(rows,base)
          assert audit['source_seed_years']==[2022]
          assert audit['ols_design_rank']==2
          assert audit['ols_rule']=='unweighted_numpy_lstsq_rcond_none'
          assert audit['observation_dimension']==3
          assert any(abs(float(v))>0 for v in audit['drift_slope'])
          d=m.mahalanobis_distance(rows,center,model,base)
          assert d.shape==(8,) and np.all(np.isfinite(d))
          flat=[{'id':f'2022F{j:03d}','sol':100.0,'sun_lon':200.0+j,'ecl_lat':j*0.1,'vg':35.0+j*0.2} for j in range(5)]
          _c,_model,a2=m.source_observation_model(flat,base)
          assert a2['ols_design_rank']<2
          assert a2['ols_rule']=='rank_deficient_zero_slope_arithmetic_mean_intercept'
          assert np.array_equal(np.asarray(a2['drift_slope'],dtype=float),np.zeros(3))
          print('PASS_P12_DRIFT_SYNTHETIC_SELF_TEST')
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p12.py').read_text()
          protocol=Path('orbittrace_drift_conditioned_p12/PROTOCOL.md').read_text()
          required=(
              'np.linalg.lstsq(design, response, rcond=None)',
              'rank_deficient_zero_slope_arithmetic_mean_intercept',
              'drift_residual = response - (intercept[None, :] + t[:, None] * slope[None, :])',
              'OAS(assume_centered=False).fit(drift_residual)',
              '"observation_dimension": 3',
              '"feature_order": ["d_drift", "d_orb"]',
              'p12_drift_pretruth.json',
              'p12_drift_pretruth.sha256',
              'p12_source_year_only_drift_fit',
              'p12_exact_ols_rule_or_rank_fallback',
              'p12_three_dimensional_drift_covariance',
              'p12_drift_nonvacuous',
              'p9_bidirectional_reliability_rule_recomputed',
              'p10_floor_consistent_geometry_recomputed',
              'p11_exact_bidirectional_direction_universe',
              'PASS_DRIFT_CONDITIONED_TWO_VIEW_MEMBERSHIP_P12_DEVELOPMENT',
              'FAIL_DRIFT_CONDITIONED_TWO_VIEW_MEMBERSHIP_P12_NO_GO',
              '"p12_static_d_obs_retained": False',
              '"p12_parameter_search": False',
          )
          for token in required:
              assert token in p,token
          forbidden_static_counts=('== 218','== 50','== 436','2 * 218')
          for token in forbidden_static_counts:
              assert token not in p,token
          inherited=(
              'P3_FOLD_COUNT = 5','P3_NEGATIVE_TAIL_MAX = 0.10','RESPONSIBILITY_THRESHOLD = 0.5',
              'p4_two_view_seed_envelope','p10_floor_consistent_retained_seed_geometry','p9_bidirectional_reliability_rule',
              'p11_density_contrast','ranking_after_membership',
          )
          for token in inherited:
              assert token in p,token
          for token in ('5230390070','5230391784','qualified known-shower matches >=95','both Sugar and catalogue HDBSCAN in both years','20°–55°'):
              assert token in protocol,token
          for token in ('OrbitTrace-April','target_coordinate'):
              assert token not in p,token
          assert '"d_obs"' not in p
          print('PASS_P12_FULL_SOURCE_FREEZE_AUDIT')
          PY
          sha256sum /tmp/p11.py /tmp/p12.py orbittrace_drift_conditioned_p12/PROTOCOL.md orbittrace_drift_conditioned_p12/apply_p12_patch.py orbittrace_drift_conditioned_p12/PATCH_B64.txt orbittrace_drift_conditioned_p12/SOURCE_SHA256
      - name: Assert source-only firewall
        run: |
          set -euo pipefail
          test ! -e orbittrace_drift_conditioned_p12/RUN.md
          test ! -e target
          echo NO_P12_TRUTH_EXECUTION_NO_TARGET_ACCESS
