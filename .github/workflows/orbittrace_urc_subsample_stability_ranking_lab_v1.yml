name: OrbitTrace URC subsample-stability ranking lab v1

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - 'orbittrace_urc_subsample_stability_ranking_lab_v1/**'
      - '.github/workflows/orbittrace_urc_subsample_stability_ranking_lab_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 63dc5b552d5217601003f738996477fb019ff7c8
          path: ranklab
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact development dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Restore exact promoted-v8 runtime and decode stability lab
        run: |
          set -euo pipefail
          mkdir -p input/v3 output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py /tmp/run_stability.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py)
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          base64 -d orbittrace_urc_subsample_stability_ranking_lab_v1/run_lab.py.gz.b64 | gzip -dc > /tmp/run_stability.py
          test "$(sha256sum /tmp/run_stability.py | cut -d' ' -f1)" = '28cb5c7fbd1ecd3e279acb0c0e70964a78bf987126ec4bb7e02fe370db8e42f6'
          python -m py_compile /tmp/run_stability.py ranklab/orbittrace_unified_recurrent_catalogue_lab_v1/run_lab.py ranklab/orbittrace_unified_recurrent_catalogue_lab_v2/run_lab.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p20-recurrent-isolated-quartet-development
          path: input/p20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31341591263
      - uses: actions/download-artifact@v4
        with:
          pattern: orbittrace-urc-generator-stress-*
          path: input/stress
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31343277893
      - name: Verify exact fixed candidate and stress payloads
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
          test "$(sha256sum input/p20/p20_prelabel_payload.json | cut -d' ' -f1)" = '8ca358ae0f3ac96b188de9eac7bcfd6f870470873a2b7ee73b7ae76497c12734'
          for p in A10 B10 C20 D20; do test -f "input/stress/orbittrace-urc-generator-stress-$p/panel_prelabel_payload.json.gz"; done
      - name: Run strict-group stability feature ablation
        env:
          PYTHONPATH: ranklab:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u /tmp/run_stability.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --p20-prelabel-json input/p20/p20_prelabel_payload.json \
            --panel-a10 input/stress/orbittrace-urc-generator-stress-A10/panel_prelabel_payload.json.gz \
            --panel-b10 input/stress/orbittrace-urc-generator-stress-B10/panel_prelabel_payload.json.gz \
            --panel-c20 input/stress/orbittrace-urc-generator-stress-C20/panel_prelabel_payload.json.gz \
            --panel-d20 input/stress/orbittrace-urc-generator-stress-D20/panel_prelabel_payload.json.gz \
            --output output
          cat output/URC_SUBSAMPLE_STABILITY_RANKING_LAB_V1.md
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_urc_subsample_stability_ranking_lab_v1/run_lab.py.gz.b64 /tmp/run_stability.py > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-urc-subsample-stability-ranking-lab-v1
          path: output
          if-no-files-found: error
          retention-days: 90
