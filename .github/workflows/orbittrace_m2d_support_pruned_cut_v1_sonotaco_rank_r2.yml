name: OrbitTrace M2D support-pruned SonotaCo rank r2 audit repair

on:
  pull_request:
    branches: [agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1]
    paths:
      - '.github/workflows/orbittrace_m2d_support_pruned_cut_v1_sonotaco_rank_r2.yml'
      - 'orbittrace_m2d_support_pruned_cut_v1/SONOTACO_RANK_AUDIT_REPAIR_R2.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  rank-r2:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 5b9cf92ae598f72ffd8167ecbc26de0de4e709e7
          path: baseline-m2d
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Derive exact audit-only repair before data access
        run: |
          set -euo pipefail
          test ! -e input
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/rank_sonotaco_m2d.py)" = '5cdf7e8b7d202a6335d832b89a8f81c7ff781d57'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git -C baseline-m2d hash-object orbittrace_internal_mass_sonotaco_development_v1/run_binding.py)" = 'b44e0222e08ae4e85f0ea9a91c95f7b9141f3fb9'
          test "$(sha256sum baseline-m2d/orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp | cut -d' ' -f1)" = '4eef6f1b70b5baee5d1983d2480c02d73569b12af868ec23bbb6009d6ca1fa37'
          python - <<'PY'
          from pathlib import Path
          src=Path('orbittrace_m2d_support_pruned_cut_v1/rank_sonotaco_m2d.py').read_text()
          old='for ci in sorted(set([0, n // 4, n // 2, (3 * n) // 4, n - 1])):'
          new='for ci in (28, 55, 93, 165, 211):'
          if src.count(old) != 1:
              raise SystemExit(f'expected exactly one audit-loop occurrence, got {src.count(old)}')
          out=src.replace(old,new)
          Path('/tmp/rank_sonotaco_m2d_r2.py').write_text(out)
          PY
          python -m py_compile /tmp/rank_sonotaco_m2d_r2.py
          cp orbittrace_m2d_support_pruned_cut_v1/rank_sonotaco_m2d.py /tmp/original.py
          diff -u /tmp/original.py /tmp/rank_sonotaco_m2d_r2.py | tee /tmp/audit_only.diff || test ${PIPESTATUS[0]} -eq 1
          python - <<'PY'
          from pathlib import Path
          lines=[x for x in Path('/tmp/audit_only.diff').read_text().splitlines() if x.startswith(('+','-')) and not x.startswith(('+++','---'))]
          assert len(lines)==2, lines
          assert lines[0].strip()=='-        for ci in sorted(set([0, n // 4, n // 2, (3 * n) // 4, n - 1])):', lines
          assert lines[1].strip()=='+        for ci in (28, 55, 93, 165, 211):', lines
          PY
          mkdir -p output
          sha256sum orbittrace_m2d_support_pruned_cut_v1/rank_sonotaco_m2d.py /tmp/rank_sonotaco_m2d_r2.py > output/rank_source_sha256_predata.txt
          cp /tmp/audit_only.diff output/audit_only_source_diff.txt
          mkdir -p input/rows input/pretruth

      - name: Install exact numerical runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-sonotaco-label-free-preparation-v2
          path: input/rows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31354363306

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-sonotaco-pretruth
          path: input/pretruth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32287719630

      - name: Verify sealed support pretruth and audit indices with truth absent
        run: |
          set -euo pipefail
          test ! -e input/truth
          test "$(sha256sum input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_PRETRUTH.json | cut -d' ' -f1)" = '6ae27f985340eaa41870ab4c4f8cd15d6a1cd97e03ef828254f4c24d7896176a'
          python - <<'PY'
          import json
          r=json.load(open('input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_PRETRUTH.json'))
          assert r['candidate_count']==907
          assert r['truth_used'] is False and r['shower_labels_accessed'] is False
          assert r['post_result_parameter_search'] is False
          sizes=[len(r['candidates'][i]['event_ids']) for i in (28,55,93,165,211)]
          assert sizes == [40,13,9,6,7], sizes
          print('R2_AUDIT_INDICES_MEMBER_COUNTS',sizes)
          PY

      - name: Compute exact M2D ranking with repaired verification only
        run: |
          set -euo pipefail
          test ! -e input/truth
          python -u /tmp/rank_sonotaco_m2d_r2.py \
            --rows-root input/rows \
            --structural-source orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --support-pretruth input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_PRETRUTH.json \
            --baseline-runner baseline-m2d/orbittrace_internal_mass_sonotaco_development_v1/run_binding.py \
            --exact-cpp baseline-m2d/orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp \
            --output output

      - name: Seal repaired zero-truth ranking
        run: |
          set -euo pipefail
          test ! -e input/truth
          python - <<'PY'
          import hashlib,json
          p='output/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RANKED_PRETRUTH.json'
          raw=open(p,'rb').read(); r=json.loads(raw)
          assert r['scientific_role']=='ZERO_LABEL_EXACT_M2D_RANKING_OF_SEALED_SUPPORT_PRUNED_CANDIDATES'
          assert r['candidate_count']==907
          assert [int(x['internal_mass_rank']) for x in r['candidates']]==list(range(1,908))
          assert [x['candidate'] for x in r['accelerator_audit']]==[28,55,93,165,211]
          assert r['truth_artifact_downloaded'] is False and r['truth_used'] is False and r['shower_labels_accessed'] is False
          assert r['post_result_parameter_search'] is False
          h=hashlib.sha256(raw).hexdigest()
          open('output/RANKED_PRETRUTH_SHA256.txt','w').write(h+'  M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RANKED_PRETRUTH.json\n')
          print('RANKED_PRETRUTH_R2_SEALED',h)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-sonotaco-ranked-pretruth-r2
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Post repaired ranking seal
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s output/RANKED_PRETRUTH_SHA256.txt; then
            { echo 'M2D_SUPPORT_PRUNED_SONOTACO_RANKING_R2=SEALED_NO_TRUTH_AUDIT_ONLY_REPAIR'; cat output/RANKED_PRETRUTH_SHA256.txt; } > /tmp/c.md
          else
            echo 'M2D_SUPPORT_PRUNED_SONOTACO_RANKING_R2=TECHNICAL_NO_RESULT' > /tmp/c.md
          fi
          gh pr comment 1380 --repo "$GITHUB_REPOSITORY" --body-file /tmp/c.md || true
