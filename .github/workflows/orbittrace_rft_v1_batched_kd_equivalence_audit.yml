name: OrbitTrace RFT v1 batched KD equivalence audit

on:
  push:
    branches:
      - agent/orbittrace-rft-v1-batched-kd-equivalence-audit
    paths:
      - '.github/workflows/orbittrace_rft_v1_batched_kd_equivalence_audit.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-rft-v1-batched-kd-equivalence-audit
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 9abdc2c80679b648c25aee33e03b1e3557613fdc
          path: engineering-head
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Verify frozen audit and runtime sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/v8 input/ranker output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(git hash-object orbittrace_rft_v1_batched_kd_equivalence_audit/PROTOCOL.md)" = '8c272987ac0247cd4299bf74370f03b405ec595e'
          test "$(git hash-object orbittrace_rft_v1_batched_kd_equivalence_audit/audit.py)" = 'e610ea1bd2930dd035afdd60e4b69033b63f377e'
          test "$(git hash-object orbittrace_recurrent_flow_tube_v1/run_development.py)" = 'a5d5371f0c30a9c57ee4d8756ea41f454cd86301'
          test "$(git -C engineering-head hash-object orbittrace_recurrent_flow_tube_v1_engineering/run_development_cached_memo.py)" = '8b8a9d373f908dbb32ac9a6b43addeaeb19bb8fa'
          python -m py_compile orbittrace_rft_v1_batched_kd_equivalence_audit/audit.py engineering-head/orbittrace_recurrent_flow_tube_v1_engineering/run_development_cached_memo.py orbittrace_recurrent_flow_tube_v1/run_development.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify immutable runtime inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Compare frozen scalar and batched KD atomization on all accessible 2022 bins
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_rft_v1_batched_kd_equivalence_audit/audit.py \
            --frozen-source orbittrace_recurrent_flow_tube_v1/run_development.py \
            --engineering-wrapper engineering-head/orbittrace_recurrent_flow_tube_v1_engineering/run_development_cached_memo.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce zero-endpoint exact-equivalence verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/RFT_V1_BATCHED_KD_EQUIVALENCE.json'))
          assert r['verdict']=='PASS_RFT_V1_BATCHED_KD_ATOM_EQUIVALENCE'
          assert r['role']=='ENGINEERING_IDENTITY_AUDIT_ONLY'
          assert r['year']==2022 and r['source_month_count']==12
          assert r['all_kdtree_candidate_sets_exact'] is True and r['all_atom_fields_exact'] is True
          for k in ('scientific_endpoint_computed','tube_construction_computed','perturbation_persistence_computed','shower_recovery_metric_computed','candidate_score_computed','labels_used_in_computed_quantity','gmn_2023_access','sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'], 'events',r['events'],'bins',r['bin_count'],'atoms',r['atom_count'],'elapsed',r['elapsed_seconds'])
          PY

      - name: Preserve audit provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_rft_v1_batched_kd_equivalence_audit/PROTOCOL.md orbittrace_rft_v1_batched_kd_equivalence_audit/audit.py orbittrace_recurrent_flow_tube_v1/run_development.py engineering-head/orbittrace_recurrent_flow_tube_v1_engineering/run_development_cached_memo.py input/ranker/run_urc_union_ranker.py input/v8/pooled_year_centroid_v8_development.json output/RFT_V1_BATCHED_KD_EQUIVALENCE.json > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-rft-v1-batched-kd-equivalence-audit
          path: output
          if-no-files-found: error
          retention-days: 90
