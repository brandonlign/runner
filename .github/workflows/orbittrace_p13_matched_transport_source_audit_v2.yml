name: OrbitTrace P13 matched transport source audit v2

on:
  pull_request:
    branches:
      - agent/orbittrace-p13-core-halo-pretruth-reservation
    paths:
      - orbittrace_core_halo_p13_literature/**
      - .github/workflows/orbittrace_p13_matched_transport_source_audit_v2.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact source-audit dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2 pandas==2.2.3 requests==2.32.5 beautifulsoup4==4.12.3
      - name: Reconstruct exact P12 and audit corrected matched transport
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2.py' | sha256sum -c -
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          echo 'f6c4c5a76b8b3f35d434aed4f1fb15035be05c40d0e0531c343ff620f3ba8185  /tmp/p3.py' | sha256sum -c -
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/p11.py
          echo '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9  /tmp/p11.py' | sha256sum -c -
          python orbittrace_drift_conditioned_p12/apply_p12_patch.py /tmp/p11.py /tmp/p12.py
          echo '78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32  /tmp/p12.py' | sha256sum -c -
          python orbittrace_core_halo_p13_literature/apply_p12_matched_transport_patch_v2.py /tmp/p12.py /tmp/p12_panel.py
          python -m py_compile /tmp/p12_panel.py orbittrace_core_halo_p13_literature/apply_p12_matched_transport_patch.py orbittrace_core_halo_p13_literature/apply_p12_matched_transport_patch_v2.py
          echo "P13_P12_MATCHED_TRANSPORT_V2_SOURCE_SHA256=$(sha256sum /tmp/p12_panel.py | awk '{print $1}')"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p12_panel.py').read_text()
          required=(
            'YEARS = (2023, 2025)',
            'event_lookup_by_year = {year:{str(e["id"]):e for e in scan_by_year[year]} for year in YEARS}',
            'for source_year, target_year in ((2023, 2025), (2025, 2023)):',
            'str(eid) in event_lookup_by_year[year]',
            'P13 matched-literature pretruth core panel input',
            'competitor_cluster_values_accessed"] is False',
            'known_shower_truth_accessed"] is False',
            'P13 matched transport stops exactly at the existing P12 truth firewall',
            'P13_P12_HALO_PRETRUTH_FROZEN',
          )
          for token in required: assert token in p,token
          for inherited in (
            'P3_FOLD_COUNT = 5','P3_NEGATIVE_TAIL_MAX = 0.10','RESPONSIBILITY_THRESHOLD = 0.5',
            'source_observation_model(rows_by_year[source_year], base)',
            'positive_orb = min_exact_dsh_to_source','negative_orb = min_exact_dsh_to_source',
            'scoring_scaler, scoring_classifier = crossfit_runtime_models[scoring_fold]',
            'density_contrast_scores(','p10_allowed = membership_floor_allowed & jointly_supported','allowed = p10_allowed & density_allowed'):
              assert inherited in p,inherited
          assert 'p3_parse_truth_after_freeze(support, pretruth_ids)' not in p
          for forbidden in ('OrbitTrace-April','target_coordinate'): assert forbidden not in p
          print('PASS_P13_P12_MATCHED_TRANSPORT_V2_SOURCE_AUDIT')
          PY
      - name: Assert source-only firewall
        run: |
          set -euo pipefail
          test ! -e orbittrace_core_halo_p13_literature/RUN.md
          test ! -e target
          echo PASS_P13_TRANSPORT_V2_NO_TRUTH_NO_TARGET
