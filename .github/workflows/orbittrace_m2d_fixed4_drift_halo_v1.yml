name: OrbitTrace M2D fixed4-seeded drift halo v1

on:
  push:
    branches: [agent/orbittrace-m2d-fixed4-drift-halo-v1]
    paths:
      - '.github/workflows/orbittrace_m2d_fixed4_drift_halo_v1.yml'
      - 'orbittrace_m2d_fixed4_drift_halo_v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  execute:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-m2d-fixed4-drift-halo-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Source-only execution authorization
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_fixed4_drift_halo_v1/PROTOCOL.md)" = 'c11e82664d49f4d18ef974491b1696c3c8fd3454'
          test "$(git hash-object orbittrace_m2d_fixed4_drift_halo_v1/build_pretruth.py)" = '3d2d47c72f703a95713c4f17979f38a8aa3ac75c'
          test "$(git hash-object orbittrace_m2d_fixed4_drift_halo_v1/evaluate_truth.py)" = 'c80c71b9ec72e9fbb778cb2393a9c9a085779f61'
          test "$(git hash-object orbittrace_m2d_fixed4_drift_halo_v1/run_binding.sh)" = '751f3200594c7d981bcf3000d169185c8d3e6c46'
          test "$(cat orbittrace_m2d_fixed4_drift_halo_v1/ACTIVATE.md)" = 'RUN_M2D_FIXED4_DRIFT_HALO_V1'

      - name: Execute pretruth seal then binding paired-utility evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash orbittrace_m2d_fixed4_drift_halo_v1/run_binding.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-fixed4-drift-halo-v1-binding
          path: output/m2d-fixed4-drift-halo-v1
          if-no-files-found: error
          retention-days: 90

      - name: Post binding result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/result.md
          import hashlib,json
          pre='output/m2d-fixed4-drift-halo-v1/pretruth/M2D_FIXED4_DRIFT_HALO_V1_PRETRUTH.json'
          res='output/m2d-fixed4-drift-halo-v1/truth/M2D_FIXED4_DRIFT_HALO_V1_RESULT.json'
          q=json.load(open(pre)); r=json.load(open(res))
          print('## M2D fixed4-seeded drift halo v1 — binding GMN development')
          print()
          print('Verdict: **`%s`**' % r['verdict'])
          print('- pretruth SHA-256: `%s`' % hashlib.sha256(open(pre,'rb').read()).hexdigest())
          s=q['overall_summary']
          print('- structural membership: nonempty seed `%d/%d`; nonempty halo `%d/%d`; strict seed regrowth `%d`; mean members `%.3f envelope / %.3f seed / %.3f halo`' % (s['nonempty_seed_count'],s['candidate_count'],s['nonempty_halo_count'],s['candidate_count'],s['halo_strictly_regrows_seed_count'],s['mean_envelope_members'],s['mean_seed_members'],s['mean_halo_members']))
          for comp in ('sugar2017','hdbscan2025'):
              a=r['aggregates'][comp]['paired_same_discovery']
              print('- %s paired: n `%d`; nonempty `%.3f`; precision parent/seed/halo `%.6f / %.6f / %.6f`; F1 `%.6f / %.6f / %.6f`; halo precision nonregression `%.3f`' % (comp,a['count'],a['nonempty_fraction'],a['parent_mean_precision'],a['seed_mean_precision'],a['halo_mean_precision'],a['parent_mean_f1'],a['seed_mean_f1'],a['halo_mean_f1'],a['nonempty_precision_nonregression_fraction']))
          print('- result SHA-256: `%s`' % hashlib.sha256(open(res,'rb').read()).hexdigest())
          PY
          gh pr comment 1401 --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md || true

      - name: Record technical no-result
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1401 --repo "$GITHUB_REPOSITORY" --body "M2D fixed4-seeded drift halo v1 ended technically before a valid binding scientific result. No scientific rule or gate is changed by this no-result." || true
