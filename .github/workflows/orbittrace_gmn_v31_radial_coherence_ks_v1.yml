name: OrbitTrace GMN v31 radial-coherence KS v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-v31-radial-coherence-ks-v1
    paths:
      - '.github/workflows/orbittrace_gmn_v31_radial_coherence_ks_v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-gmn-v31-radial-coherence-ks-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: a77b714262778e468b88d287c87af9c569279946
          path: frozen-activity-ks
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and construct frozen radial implementation before data
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/ranker input/v8 input/p19 input/offline output implementation
          test "$(git hash-object orbittrace_gmn_v31_radial_coherence_ks_v1/PROTOCOL.md)" = '827e27923684023850f3dbc15cec537f717be98e'
          test "$(git -C frozen-activity-ks hash-object orbittrace_gmn_v31_activity_profile_ks_v1/run_development.py)" = '130114a16415a164f5df6b5a579a41872955778a'
          cp frozen-activity-ks/orbittrace_gmn_v31_activity_profile_ks_v1/run_development.py implementation/run_development.py
          python - <<'PY'
          from pathlib import Path
          p=Path('implementation/run_development.py')
          s=p.read_text()
          old="def signed_delta(a,b): return (float(a)-float(b)+180.0)%360.0-180.0\ndef ks2(a,b):"
          new="""def signed_delta(a,b): return (float(a)-float(b)+180.0)%360.0-180.0
def radial_distance(e,c):
    dlon=abs(signed_delta(e['sun_lon'],c['sun_lon']))/4.0
    dlat=abs(float(e['ecl_lat'])-float(c['ecl_lat']))/4.0
    ve=max(abs(float(e['vg'])),1e-6); vc=max(abs(float(c['vg'])),1e-6)
    dv=abs(math.log(ve/vc))/math.log(1.10)
    r=float(math.sqrt(dlon*dlon+dlat*dlat+dv*dv)); req(math.isfinite(r) and r>=0.0,'invalid radial distance'); return r
def ks2(a,b):"""
          assert s.count(old)==1
          s=s.replace(old,new)
          repl={
            "Frozen GMN v31 + one cross-year activity-profile KS coordinate.":"Frozen GMN v31 + one cross-year radiant/speed radial-coherence KS coordinate.",
            "orbittrace-gmn-v31-activity-profile-ks-v1":"orbittrace-gmn-v31-radial-coherence-ks-v1",
            "u.append(signed_delta(e['sol'],c['sol']))":"u.append(radial_distance(e,c))",
            "PASS_GMN_V31_ACTIVITY_PROFILE_KS_V1":"PASS_GMN_V31_RADIAL_COHERENCE_KS_V1",
            "FAIL_GMN_V31_ACTIVITY_PROFILE_KS_V1":"FAIL_GMN_V31_RADIAL_COHERENCE_KS_V1",
            "append exact cross-year two-sample KS statistic of annual-centroid-centered member solar-longitude offsets to exact v31 23D representation":"append exact cross-year two-sample KS statistic of annual-centroid-centered radiant/speed radial member distances to exact v31 23D representation",
            "activity_ks_sha256":"radial_coherence_ks_sha256",
            "activity_ks_local_only":"radial_coherence_ks_local_only",
            "activity_ks_equal_rank_fusion":"radial_coherence_ks_equal_rank_fusion",
            "activity_statistic_search":"distribution_statistic_search",
            "GMN_V31_ACTIVITY_PROFILE_KS_V1_RESULT.json":"GMN_V31_RADIAL_COHERENCE_KS_V1_RESULT.json",
          }
          for a,b in repl.items():
            assert s.count(a)>=1, a
            s=s.replace(a,b)
          p.write_text(s)
          PY
          python -m py_compile implementation/run_development.py
          sha256sum implementation/run_development.py | tee implementation/implementation_sha256.txt
          grep -F "u.append(radial_distance(e,c))" implementation/run_development.py
          grep -F "math.log(1.10)" implementation/run_development.py
          ! grep -F "u.append(signed_delta(e['sol'],c['sol']))" implementation/run_development.py
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-gmn-v31-offline-development-package-v1
          path: input/offline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31663453082

      - name: Verify immutable inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
          test "$(sha256sum input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json | cut -d' ' -f1)" = '16fb5ef3cd8dbbb3873e9bc23874fe7da3db68498772a5e992fbceed6cb980d7'

      - name: Run first binding target-excluded radial-coherence KS outcome
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u implementation/run_development.py \
            --ranker-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --offline-manifest input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json \
            --offline-x input/offline/package/GMN_V31_OFFLINE_X.npy \
            --offline-centroids input/offline/package/GMN_V31_OFFLINE_CENTROIDS.npy \
            --output output

      - name: Enforce binding result and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/GMN_V31_RADIAL_COHERENCE_KS_V1_RESULT.json'))
          assert r['verdict'] in {'PASS_GMN_V31_RADIAL_COHERENCE_KS_V1','FAIL_GMN_V31_RADIAL_COHERENCE_KS_V1'}
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_V31_SUCCESSOR_DEVELOPMENT_ONLY'
          assert r['candidate_count']==226 and r['feature_dimension_parent']==23 and r['feature_dimension_candidate']==24
          assert r['parent_feature_sha256']=='fea3b063772c75b675e37a227b53a4aa3c5b86fdcbfcef1487b1e1448689cdf5'
          assert r['centroid_sha256']=='a53b9862f1ec3d751745f80aec2625d7904128474c9263c55ea953cf60d0621f'
          assert r['parent_margin_sha256']=='f38c96e3fa4ea98f51217b36d639e96edbf3ebcb65123248f0f118d3298173bd'
          assert len(r['per_family'])==226
          for k in ('feature_search','distribution_statistic_search','histogram_or_bandwidth','ks_pvalue_used','metric_search','k_search','scaling_search','reference_change','diversity_search','fusion_search','post_result_second_search','sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
            assert r[k] is False
          assert r['blind_exclusion']==[20.0,55.0]
          if r['verdict'].startswith('PASS_'):
            assert all(r['pass_gates'].values()) and r['sonotaco_benchmark_authorized_by_this_result'] is True
          else:
            assert not all(r['pass_gates'].values()) and r['sonotaco_benchmark_authorized_by_this_result'] is False
          print(r['verdict'],r['radial_coherence_ks_equal_rank_fusion'],r['pass_gates'],r['ks_summary_all'])
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          cp implementation/run_development.py output/FROZEN_EXECUTION_IMPLEMENTATION.py
          cp implementation/implementation_sha256.txt output/implementation_sha256.txt
          sha256sum orbittrace_gmn_v31_radial_coherence_ks_v1/PROTOCOL.md frozen-activity-ks/orbittrace_gmn_v31_activity_profile_ks_v1/run_development.py implementation/run_development.py input/ranker/run_urc_union_ranker.py input/v8/pooled_year_centroid_v8_development.json input/p19/p19_prelabel_payload.json input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json output/GMN_V31_RADIAL_COHERENCE_KS_V1_RESULT.json > output/source_input_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-v31-radial-coherence-ks-v1
          path: output
          if-no-files-found: error
          retention-days: 90
