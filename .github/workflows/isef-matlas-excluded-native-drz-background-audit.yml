name: ISEF MATLAS excluded native DRZ background audit
on:
  push:
    branches: [main]
    paths: ['isef/MATLAS_EXCLUDED_NATIVE_DRZ_BACKGROUND_AUDIT_TRIGGER']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy astropy astroquery requests
      - run: |
          python -m py_compile isef/matlas_excluded_f814w_background_audit.py isef/matlas_excluded_native_drz_background_audit.py
          cd isef
          python matlas_excluded_native_drz_background_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-matlas-excluded-native-drz-background-audit
          path: isef/results/matlas_excluded_native_drz_background_audit/report.json
          if-no-files-found: error
