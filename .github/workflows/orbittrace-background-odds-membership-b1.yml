name: OrbitTrace B1 background-odds membership development

on:
  pull_request:
    branches:
      - agent/orbittrace-background-odds-membership-b1
    paths:
      - orbittrace_background_odds_membership_b1/RUN.md

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-background-odds-membership-b1-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce one-file execution request and frozen base
        run: |
          set -euo pipefail
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = "orbittrace_background_odds_membership_b1/RUN.md"
          test "$(cat orbittrace_background_odds_membership_b1/RUN.md)" = "EXECUTE_FROZEN_B1_AFTER_AUTHORIZED_SCIENTIFIC_BRANCH"
          git checkout --detach "$BASE_SHA"
          test ! -f orbittrace_background_odds_membership_b1/RUN.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Stage exact frozen ancestry before data access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1 \
            input/vmods/orbittrace_cross_year_conformal_density_expansion_v3 \
            input/vmods/orbittrace_cross_year_trajectory_conformal_expansion_v4 \
            input/dsh input/v3score input/v6 input/centroid output
          touch input/v1/orbittrace_cross_year_seed_support_expansion_v1/__init__.py
          touch input/vmods/orbittrace_cross_year_conformal_density_expansion_v3/__init__.py
          touch input/vmods/orbittrace_cross_year_trajectory_conformal_expansion_v4/__init__.py

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"

          git fetch --no-tags --depth=1 origin e87a61909f06b2c8f4e763a2f915d13b5c365620
          git show FETCH_HEAD:orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            > input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py
          test "$(git hash-object input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py)" = "2f48496362494d600652ae35d721e3b107c19a22"

          git fetch --no-tags --depth=1 origin c386f1570a82ce0ce9700e962bb650c3ba5af66e
          git show FETCH_HEAD:orbittrace_cross_year_conformal_density_expansion_v3/run_development.py \
            > input/vmods/orbittrace_cross_year_conformal_density_expansion_v3/run_development.py
          test "$(git hash-object input/vmods/orbittrace_cross_year_conformal_density_expansion_v3/run_development.py)" = "a80f6d7c7f0b85bf8225bf790ed54ca667ee37f0"

          git fetch --no-tags --depth=1 origin d178ad4bca2991356bbafcd1b92b233ad2a25f44
          git show FETCH_HEAD:orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py \
            > input/vmods/orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py
          test "$(git hash-object input/vmods/orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py)" = "1062645993ed6c568f883bae624e0f02e8e5fb54"

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3score/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3score/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"

          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > input/dsh/literature_comparators.py
          test "$(git hash-object input/dsh/literature_comparators.py)" = "ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2"
          echo "85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  input/dsh/literature_comparators.py" | sha256sum -c -

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" -o input/v6.zip
          echo "3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v6.zip" | sha256sum -c -
          unzip -q input/v6.zip -d input/v6

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009091129/zip" -o input/centroid.zip
          echo "a1faacf51e1f4ca2a3a92b20e27d1f07f00e1d32ab33993916379ff36acea062  input/centroid.zip" | sha256sum -c -
          unzip -q input/centroid.zip -d input/centroid

          echo "effe405fa332d441d6585b8b85306c21417a5a82813864899fb66d31d9438d7f  orbittrace_background_odds_membership_b1/run_development.py" | sha256sum -c -
          python -m py_compile \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            input/vmods/orbittrace_cross_year_conformal_density_expansion_v3/run_development.py \
            input/vmods/orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py \
            input/dsh/literature_comparators.py \
            orbittrace_background_odds_membership_b1/run_development.py
          rm -rf output/*
          echo PASS_B1_PREDATA_GUARDS

      - name: Execute frozen target-excluded B1
        env:
          PYTHONPATH: input/v1:input/vmods:input/v3score:input/dsh:orbittrace_wavelet_catalogue_v3:.
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python -u orbittrace_background_odds_membership_b1/run_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --source-audit-json output/wavelet_catalogue_v3_source_audit.json \
            --v6-result-json input/v6/label_free_sparse_support_v6_development.json \
            --centroid-audit-json input/centroid/component_centroid_source_audit.json \
            --output output
          cat output/BACKGROUND_ODDS_MEMBERSHIP_B1_DEVELOPMENT.md

      - name: Enforce frozen B1 result boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/background_odds_membership_b1_development.json').read_text())
          assert r['verdict'] in {'PASS_BACKGROUND_ODDS_MEMBERSHIP_B1_DEVELOPMENT','FAIL_BACKGROUND_ODDS_MEMBERSHIP_B1_DEVELOPMENT'}
          c=r['configuration']; d=r['expansion_diagnostics']
          assert c['blind_exclusion']==[20.0,55.0]
          assert c['posterior_log_odds_cutoff']==0.0
          assert c['activity_padding_deg']==6.0 and c['density_ceiling']==1.5 and c['trajectory_ceiling']==1.5
          assert c['parameter_search'] is False and c['posterior_cutoff_search'] is False
          assert c['feature_weight_search'] is False and c['covariance_model_search'] is False
          assert c['orbit_threshold_search'] is False and c['ranking_changed'] is False and c['recursive_growth'] is False
          assert d['orbit_event_count']==738682
          assert len(d['orbit_parse_audits'])==24
          assert all(a['label_column_accessed'] is False for a in d['orbit_parse_audits'])
          assert all(a['target_region_orbit_decoded'] is False for a in d['orbit_parse_audits'])
          assert all(r['integrity_gates'].values())
          print('ORBITTRACE_B1_RESULT_BEGIN')
          print(json.dumps({
            'verdict': r['verdict'],
            'baseline': r['baseline_metrics']['multiplicity'],
            'expanded': r['expanded_metrics']['multiplicity'],
            'annual_mean_f1_delta': r['annual_mean_f1_delta'],
            'scientific_gates': r['scientific_gates'],
            'expansion_diagnostics': {k:v for k,v in d.items() if k!='orbit_parse_audits'},
            'successor_rule': r['successor_rule'],
          }, indent=2, sort_keys=True))
          print('ORBITTRACE_B1_RESULT_END')
          PY

      - name: Record environment
        if: always()
        run: |
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum orbittrace_background_odds_membership_b1/run_development.py \
            orbittrace_background_odds_membership_b1/PROTOCOL.md \
            .github/workflows/orbittrace-background-odds-membership-b1.yml \
            > output/b1_source_sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-background-odds-membership-b1-development
          path: output
          if-no-files-found: error
          retention-days: 90
