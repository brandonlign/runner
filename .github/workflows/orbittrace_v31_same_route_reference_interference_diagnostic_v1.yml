name: OrbitTrace v31 same-route reference-interference diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v31_same_route_reference_interference_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v31_same_route_reference_interference_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v31-same-route-reference-interference-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen diagnostic sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/truth input/rankgap output/parent output/freeze output/diag
          test "$(git hash-object orbittrace_v31_same_route_reference_interference_diagnostic_v1/PROTOCOL.md)" = 'aa9ab825cd45f13db5f213068de26f28cf2c1966'
          test "$(git hash-object orbittrace_v31_same_route_reference_interference_diagnostic_v1/diagnose.py)" = '886285ccdea07f6aca90317f6fe52fda97aa46d3'
          test "$(git hash-object orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py)" = '917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v31_same_route_reference_interference_diagnostic_v1/diagnose.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Restore immutable #950 payload before #1046 status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          test ! -e input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json

      - name: Load immutable exposed v31 training truth before #1046 status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth

      - name: Reproduce exact v31 before #1046 status is available
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          test ! -e input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json
          python -u orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --output output/parent

      - name: Freeze 229-family mixed-vs-HDB-only reference vector before #1046 status
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          test ! -e input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json
          python -u orbittrace_v31_same_route_reference_interference_diagnostic_v1/diagnose.py freeze \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --parent-result output/parent/V31_LOCAL_GEOMETRY_OOF_RESULT.json \
            --output output/freeze
          python - <<'PY'
          import json
          v=json.load(open('output/freeze/V31_SAME_ROUTE_REFERENCE_COUNTERFACTUAL_VECTOR.json'))
          assert v['verdict']=='PASS_V31_SAME_ROUTE_REFERENCE_COUNTERFACTUAL_VECTOR_FREEZE'
          assert v['scientific_role']=='FULL_229_HDB_MIXED_VS_HDB_ONLY_REFERENCE_VECTOR_FROZEN_BEFORE_1046_STATUS_ATTACHMENT'
          assert v['family_count']==229 and len(v['families'])==229 and len(v['fold_diagnostics'])==5
          assert v['rankgap_1046_loaded_before_vector_freeze'] is False
          assert v['candidate_order_evaluated'] is False and v['literature_panel_evaluated'] is False
          assert v['successor_selected'] is False and v['post_result_second_search'] is False
          assert v['target_information_access'] is False and v['target_region_events_accessed'] is False
          assert v['maarsy_scientific_access'] is False and v['dms_scientific_access'] is False
          assert v['blind_exclusion']==[20.0,55.0]
          print('PASS_REFERENCE_VECTOR_FROZEN',v['canonical_family_vector_sha256'])
          PY

      - name: Restore authoritative #1046 status only after vector freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9086399760/zip' -o input/rankgap.zip
          echo 'a2c373df77ef7e0065c1d8aceb1f6e5826f1e30b6286f2331c362d959f1d7f69  input/rankgap.zip' | sha256sum -c -
          unzip -p input/rankgap.zip diag/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json > input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json
          echo 'e4e09546e17b9a5da7ce12ad9af4bb7129533fd9b5be846ebc859719f01a9758  input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json' | sha256sum -c -

      - name: Run sole same-route reference-interference diagnostic
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v31_same_route_reference_interference_diagnostic_v1/diagnose.py diagnose \
            --vector-file output/freeze/V31_SAME_ROUTE_REFERENCE_COUNTERFACTUAL_VECTOR.json \
            --rankgap-file input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json \
            --output output/diag

      - name: Enforce diagnostic-only firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V31_SAME_ROUTE_REFERENCE_INTERFERENCE_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V31_SAME_ROUTE_REFERENCE_INTERFERENCE_DIAGNOSTIC','FAIL_V31_SAME_ROUTE_REFERENCE_INTERFERENCE_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_V59_ROUTE_POOL_MECHANISM_DIAGNOSTIC_ONLY_NO_SAME_ROUTE_ORDER_OR_SUCCESSOR_EVALUATED'
          assert set(r['annual_diagnostics'])=={'2013','2014'}
          for k in ('same_route_candidate_order_evaluated','literature_panel_evaluated','route_weight_or_quota_search','partial_source_removal_search','separate_positive_negative_source_rule_search','route_specific_scaling_search','feature_search','metric_search','k_search','threshold_search','annual_combiner_search','diversity_search','fusion_search','alternate_representative_search','budget_specific_rule','year_specific_rule','oracle_identity_used_for_ranking','successor_selected','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['annual_diagnostics'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v31_same_route_reference_interference_diagnostic_v1/PROTOCOL.md \
            orbittrace_v31_same_route_reference_interference_diagnostic_v1/diagnose.py \
            orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py \
            input/ranker/run_urc_union_ranker.py output/parent/V31_LOCAL_GEOMETRY_OOF_RESULT.json \
            output/freeze/V31_SAME_ROUTE_REFERENCE_COUNTERFACTUAL_VECTOR.json \
            input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json \
            output/diag/V31_SAME_ROUTE_REFERENCE_INTERFERENCE_DIAGNOSTIC.json \
            > output/V31_SAME_ROUTE_REFERENCE_INTERFERENCE_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-same-route-reference-interference-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
