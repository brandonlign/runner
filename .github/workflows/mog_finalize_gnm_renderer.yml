name: Finalize Mog GNM renderer

on:
  push:
    branches:
      - agent/mog-reference-face-validation
    paths:
      - .github/workflows/mog_finalize_gnm_renderer.yml
      - mog_reference_face_validation/scripts/export_gnm_webp_assets.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mog-finalize-gnm-renderer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mog-reference-face-validation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Export exact validated WebP snapshots
        working-directory: mog_reference_face_validation
        run: python scripts/export_gnm_webp_assets.py

      - name: Commit immutable reference assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mog_reference_face_validation/public/reference/gnm-front.webp \
                  mog_reference_face_validation/public/reference/gnm-profile.webp
          if git diff --cached --quiet; then
            echo 'Reference assets already current.'
          else
            git commit -m 'Export validated GNM WebP assets'
            git pull --rebase origin agent/mog-reference-face-validation
            git push origin HEAD:agent/mog-reference-face-validation
          fi
