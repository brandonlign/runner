name: OrbitTrace P15 halo support source context audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p14-matched-literature-freeze
    paths:
      - orbittrace_support_safe_halo_p15/**
      - .github/workflows/orbittrace_p15_halo_source_context_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Reconstruct exact parents and prove P15 transform scope
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/p11.py
          echo '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9  /tmp/p11.py' | sha256sum -c -
          python orbittrace_drift_conditioned_p12/apply_p12_patch.py /tmp/p11.py /tmp/p12.py
          echo '78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32  /tmp/p12.py' | sha256sum -c -
          python orbittrace_core_halo_p13_literature/apply_p12_matched_transport_patch_v2.py /tmp/p12.py /tmp/p12_panel_v2.py
          echo 'f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae  /tmp/p12_panel_v2.py' | sha256sum -c -
          python orbittrace_support_safe_rank_p14/apply_p12_snm_id_transport_from_v2.py /tmp/p12_panel_v2.py /tmp/p12_panel_v3.py
          echo '55a1efed550498d51b859ffec555797ba8473d7d8b5f20ad6831c5f15b43b415  /tmp/p12_panel_v3.py' | sha256sum -c -
          python -m py_compile orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py
          python orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py /tmp/p12.py /tmp/p15_dev.py | tee /tmp/p15_dev_transform.txt
          python orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py /tmp/p12_panel_v3.py /tmp/p15_matched.py | tee /tmp/p15_matched_transform.txt
          echo '22d34131e873825ca60aefbba0b92088f19f57f589fe629bfbd3b7041d160b4b  /tmp/p15_dev.py' | sha256sum -c -
          echo '23d309f6702ed0aa6769381963ea64701ae59c97376a0bae536b527fbc978fe6  /tmp/p15_matched.py' | sha256sum -c -
          python -m py_compile /tmp/p15_dev.py /tmp/p15_matched.py
          python - <<'PY'
          from pathlib import Path
          import difflib

          init_old='    direction_audits: list[dict[str, Any]] = []\n'
          init_new=init_old+'    p15_unavailable_directions: list[dict[str, Any]] = []\n'
          guard_old='            require(len(negative_events) >= MIN_DIRECTION_NEGATIVES, f"P2 input-ineligible: <{MIN_DIRECTION_NEGATIVES} negatives for {family_id} {source_year}->{target_year}")\n'
          guard_new='''            if len(negative_events) < MIN_DIRECTION_NEGATIVES:
              p15_unavailable_directions.append({
                  "family_id": str(family_id),
                  "source_year": int(source_year),
                  "target_year": int(target_year),
                  "observed_negative_count": int(len(negative_events)),
                  "required_negative_count": int(MIN_DIRECTION_NEGATIVES),
                  "status": "CHARACTERIZATION_UNAVAILABLE_INSUFFICIENT_NEGATIVES",
              })
              continue
          '''.replace('              ','                ')
          expr='hashlib.sha256(json.dumps(p15_unavailable_directions, sort_keys=True, separators=(",", ":"), allow_nan=False).encode("utf-8")).hexdigest()'
          dev_old='''    result = {
              "verdict": verdict,
          '''.replace('              ','        ')
          dev_new=f'''    result = {{
              "verdict": verdict,
              "p15_architecture": "P15_SUPPORT_SAFE_SECONDARY_HALO_AVAILABILITY",
              "p15_parent_source_sha256": "78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32",
              "p15_min_direction_negatives_unchanged": int(MIN_DIRECTION_NEGATIVES),
              "p15_unavailable_directions": p15_unavailable_directions,
              "p15_unavailable_direction_count": int(len(p15_unavailable_directions)),
              "p15_availability_sha256": {expr},
              "p15_no_padding_resampling_or_relaxation": True,
              "p15_secondary_characterization_only": True,
          '''.replace('              ','        ')
          matched_old='''    halo_checkpoint = {
              "classification": "P13 exact-P12 matched-panel pretruth halo transport",
          '''.replace('              ','        ')
          matched_new=f'''    halo_checkpoint = {{
              "classification": "P13 exact-P12 matched-panel pretruth halo transport",
              "p15_architecture": "P15_SUPPORT_SAFE_SECONDARY_HALO_AVAILABILITY",
              "p15_parent_source_sha256": "55a1efed550498d51b859ffec555797ba8473d7d8b5f20ad6831c5f15b43b415",
              "p15_min_direction_negatives_unchanged": int(MIN_DIRECTION_NEGATIVES),
              "p15_unavailable_directions": p15_unavailable_directions,
              "p15_unavailable_direction_count": int(len(p15_unavailable_directions)),
              "p15_availability_sha256": {expr},
              "p15_no_padding_resampling_or_relaxation": True,
              "p15_secondary_characterization_only": True,
          '''.replace('              ','        ')

          for label,parent_path,child_path,meta_old,meta_new in (
              ('DEV',Path('/tmp/p12.py'),Path('/tmp/p15_dev.py'),dev_old,dev_new),
              ('MATCHED',Path('/tmp/p12_panel_v3.py'),Path('/tmp/p15_matched.py'),matched_old,matched_new),
          ):
              old=parent_path.read_text(); new=child_path.read_text()
              assert old.count(init_old)==1 and new.count(init_new)==1
              assert old.count(guard_old)==1 and new.count(guard_new)==1
              assert old.count(meta_old)==1 and new.count(meta_new)==1
              reverted=new.replace(init_new,init_old,1).replace(guard_new,guard_old,1).replace(meta_new,meta_old,1)
              assert reverted==old,f'{label} P15 source differs outside exactly three frozen surfaces'
              assert old.count('MIN_DIRECTION_NEGATIVES = 128')==new.count('MIN_DIRECTION_NEGATIVES = 128')==1
              assert new.count('p15_unavailable_directions.append')==1
              assert new.count('CHARACTERIZATION_UNAVAILABLE_INSUFFICIENT_NEGATIVES')==1
              delta=list(difflib.unified_diff(old.splitlines(),new.splitlines(),fromfile=f'{label}_PARENT',tofile=f'{label}_P15',lineterm=''))
              print('\n'.join(delta))
          print('PASS_P15_SOURCE_TRANSFORM_EXACT_REVERSE_EQUIVALENCE')
          PY
          grep -F "DEV_P15_SHA256='22d34131e873825ca60aefbba0b92088f19f57f589fe629bfbd3b7041d160b4b'" orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py
          grep -F "MATCHED_P15_SHA256='23d309f6702ed0aa6769381963ea64701ae59c97376a0bae536b527fbc978fe6'" orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py
          echo NO_COMPARATOR_ARTIFACT_NO_ARCHIVE_NO_TRUTH_NO_EXTERNAL_NO_TARGET_ACCESS
