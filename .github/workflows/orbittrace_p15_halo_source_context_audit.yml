name: OrbitTrace P15 halo support source context audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p14-matched-literature-freeze
    paths:
      - orbittrace_support_safe_halo_p15/**
      - .github/workflows/orbittrace_p15_halo_source_context_audit.yml
      - .github/workflows/orbittrace_p15_support_safe_halo_development.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Reconstruct exact parents and prove P15 transform scope
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/p11.py
          echo '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9  /tmp/p11.py' | sha256sum -c -
          python orbittrace_drift_conditioned_p12/apply_p12_patch.py /tmp/p11.py /tmp/p12.py
          echo '78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32  /tmp/p12.py' | sha256sum -c -
          python orbittrace_core_halo_p13_literature/apply_p12_matched_transport_patch_v2.py /tmp/p12.py /tmp/p12_panel_v2.py
          echo 'f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae  /tmp/p12_panel_v2.py' | sha256sum -c -
          python orbittrace_support_safe_rank_p14/apply_p12_snm_id_transport_from_v2.py /tmp/p12_panel_v2.py /tmp/p12_panel_v3.py
          echo '55a1efed550498d51b859ffec555797ba8473d7d8b5f20ad6831c5f15b43b415  /tmp/p12_panel_v3.py' | sha256sum -c -
          python -m py_compile orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py orbittrace_support_safe_halo_p15/audit_support_safe_halo_p15_source.py
          python orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py /tmp/p12.py /tmp/p15_dev.py
          python orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py /tmp/p12_panel_v3.py /tmp/p15_matched.py
          echo '22d34131e873825ca60aefbba0b92088f19f57f589fe629bfbd3b7041d160b4b  /tmp/p15_dev.py' | sha256sum -c -
          echo '23d309f6702ed0aa6769381963ea64701ae59c97376a0bae536b527fbc978fe6  /tmp/p15_matched.py' | sha256sum -c -
          python -m py_compile /tmp/p15_dev.py /tmp/p15_matched.py
          python orbittrace_support_safe_halo_p15/audit_support_safe_halo_p15_source.py /tmp/p12.py /tmp/p15_dev.py /tmp/p12_panel_v3.py /tmp/p15_matched.py
          grep -F "DEV_P15_SHA256='22d34131e873825ca60aefbba0b92088f19f57f589fe629bfbd3b7041d160b4b'" orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py
          grep -F "MATCHED_P15_SHA256='23d309f6702ed0aa6769381963ea64701ae59c97376a0bae536b527fbc978fe6'" orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py

          dev=.github/workflows/orbittrace_p15_support_safe_halo_development.yml
          grep -F 'EXECUTE_P15_DEVELOPMENT_COMPATIBILITY_ON_FROZEN_2022_2023' "$dev"
          grep -F "test \"\$(printf '%s\\n' \"\$marker\" | sed -n '2p')\" = '31327637103'" "$dev"
          grep -F "22d34131e873825ca60aefbba0b92088f19f57f589fe629bfbd3b7041d160b4b" "$dev"
          grep -F "p15_unavailable_direction_count']==0" "$dev"
          grep -F "len(r['direction_audits'])==452" "$dev"
          grep -F "f158ebfa3a9a3c8006a7c81cbf0b47f7307aa7f2537e8046621b08037230cca3" "$dev"
          grep -F "PASS_P15_SUPPORT_SAFE_HALO_DEVELOPMENT_COMPATIBILITY" "$dev"
          if grep -Eq '9041833656|8955917326|9012424187|evaluate_frozen_blindsafe|OrbitTrace-April|target_coordinate' "$dev"; then
            echo 'matched/target input leaked into P15 development workflow' >&2
            exit 1
          fi
          echo PASS_P15_DEVELOPMENT_LAUNCHER_SOURCE_FREEZE
          echo NO_COMPARATOR_ARTIFACT_NO_ARCHIVE_NO_TRUTH_NO_EXTERNAL_NO_TARGET_ACCESS
