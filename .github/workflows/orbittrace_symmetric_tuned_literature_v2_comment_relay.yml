name: OrbitTrace symmetric tuned literature v2 comment relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: orbittrace-symmetric-tuned-literature-v2-binding
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  BENCH_BRANCH: agent/orbittrace-symmetric-tuned-literature-benchmark-v2

jobs:
  benchmark:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 1361 &&
      github.event.comment.user.login == 'brandonlign' &&
      github.event.comment.body == 'RUN_ORBITTRACE_SYMMETRIC_TUNED_LITERATURE_V2_BINDING_R3'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Announce exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1361 --repo "${{ github.repository }}" --body "ORBITTRACE_SYMMETRIC_V2_RUN_STARTED=${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BENCH_BRANCH }}
          fetch-depth: 1

      - name: Bind frozen benchmark head and guard result
        id: guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '33787b7733efa7e52483e59af183966b846e50f7'
          if [ -f orbittrace_symmetric_tuned_literature_v2/RESULT.json ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo RESULT_ALREADY_PRESENT
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
          test "$(git hash-object orbittrace_symmetric_tuned_literature_v2/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_symmetric_tuned_literature_v2/literature_comparators.py)" = 'ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Install frozen numerical runtime
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'scipy==1.11.4' 'scikit-learn==1.4.2'
          python -m pip install --disable-pip-version-check --no-deps 'hdbscan==0.8.44'
          mkdir -p input/rows input/sources input/truth output
          python -m py_compile \
            orbittrace_symmetric_tuned_literature_v2/run_benchmark.py \
            orbittrace_symmetric_tuned_literature_v2/run_exact.py \
            orbittrace_symmetric_tuned_literature_v2/recurrent_eom.py \
            orbittrace_symmetric_tuned_literature_v2/literature_comparators.py

      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.run == 'true'
        with:
          name: orbittrace-final-sonotaco-label-free-preparation-v2
          path: input/rows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31354363306

      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.run == 'true'
        with:
          name: orbittrace-final-comparator-source-export-v1
          path: input/sources
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31346168826

      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.run == 'true'
        with:
          name: orbittrace-v15-exposed-matched-sonotaco-literature-result-v1
          path: input/truth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31405109267

      - name: Execute symmetric tuned benchmark
        if: steps.guard.outputs.run == 'true'
        working-directory: orbittrace_symmetric_tuned_literature_v2
        run: |
          set -euo pipefail
          python -u run_exact.py \
            --rows-root ../input/rows \
            --sources ../input/sources \
            --truth-root ../input/truth \
            --recurrent-kernel recurrent_eom.py \
            --output ../output
          cat ../output/SYMMETRIC_TUNED_RESULT.json

      - name: Commit immutable result to benchmark branch
        if: steps.guard.outputs.run == 'true' && success()
        run: |
          set -euo pipefail
          cp output/SYMMETRIC_TUNED_RESULT.json orbittrace_symmetric_tuned_literature_v2/RESULT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orbittrace_symmetric_tuned_literature_v2/RESULT.json
          git commit -m 'Record symmetric tuned literature benchmark v2 result'
          git push origin HEAD:"${BENCH_BRANCH}"

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.run == 'true' && always()
        with:
          name: orbittrace-symmetric-tuned-literature-v2-binding-${{ github.run_id }}
          path: output
          if-no-files-found: warn
          retention-days: 90

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1361 --repo "${{ github.repository }}" --body "ORBITTRACE_SYMMETRIC_V2_RUN_SUCCESS=${GITHUB_RUN_ID}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1361 --repo "${{ github.repository }}" --body "ORBITTRACE_SYMMETRIC_V2_RUN_FAILED=${GITHUB_RUN_ID}"
