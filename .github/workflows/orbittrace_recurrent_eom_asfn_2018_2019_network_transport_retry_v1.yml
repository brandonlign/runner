name: OrbitTrace recurrent-EOM NASA ASFN 2018-2019 network-transport retry v1

on:
  push:
    branches:
      - agent/orbittrace-asfn-network-transport-retry-v1
    paths:
      - 'orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/ACTIVATE_NETWORK_TRANSPORT_RETRY.md'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  binding-pristine-validation-network-retry:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact runtime and verify frozen scientific repair and transport bytes
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/audit output
          test "$(git hash-object orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/PROTOCOL.md)" = '0d90b3db461ff65da3780d507506e4618a2cbf52'
          test "$(git hash-object orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/run_validation.py)" = '8f5699326758dd11cc46f9a209049a8ed61dee3a'
          test "$(git hash-object orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/header_repair_wrapper.py)" = '0e5fce5b04959ec45c42bb22ed477e48bdc31bde'
          test "$(git hash-object orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/HEADER_REPAIR_AUDIT_PROTOCOL.md)" = 'ddc0199a338e50188c005acf9ec9cae2bee77852'
          test "$(git hash-object orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/header_repair_audit.py)" = '52b235930e6e243caaddff7c7e8884373ccc4313'
          test "$(git hash-object orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/RETRY_EXECUTION_FREEZE.md)" = '11bf96de9598a5dc6108d8c7d830041c4caf063b'
          test "$(git hash-object orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/NETWORK_TRANSPORT_RETRY_FREEZE.md)" = '1311cb226662cfeaadc2962766f154173fe463f1'
          test "$(git hash-object orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/README_RECEIPT_ARGUMENT_REPAIR.md)" = '78d8d1c08cd9369d0ac0f9edb31f0fa40644e48f'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          python -m py_compile \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/run_validation.py \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/header_repair_wrapper.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py
          printf '%s\n' 'PRE_SCIENCE_SOURCE_GUARDS_PASS' > output/execution_stage.txt

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-asfn-hash-header-repair-semantic-audit-v1
          path: input/audit
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31850078483

      - name: Verify binding zero-data header-repair audit before ASFN access
        run: |
          set -euo pipefail
          test "$(sha256sum input/audit/ASFN_HASH_HEADER_REPAIR_SEMANTIC_AUDIT.json | cut -d' ' -f1)" = '212a52b402187d0bc20c85dc50ba9d0b6b52cbe5126398d9ca7b6b87ffa49ff2'
          python - <<'PY'
          import json
          p=json.load(open('input/audit/ASFN_HASH_HEADER_REPAIR_SEMANTIC_AUDIT.json'))
          assert p['verdict']=='PASS_ASFN_HASH_HEADER_REPAIR_SEMANTIC_AUDIT'
          assert all(p['checks'].values())
          assert p['network_access'] is False
          assert p['asfn_archive_access'] is False
          assert p['asfn_event_value_access'] is False
          assert p['asfn_shw_access'] is False
          assert p['scientific_endpoint'] is False
          PY
          printf '%s\n' 'REPAIR_AUDIT_VERIFIED' >> output/execution_stage.txt

      - name: Acquire exact frozen ASFN archive with bounded same-source retries
        run: |
          set -euo pipefail
          url='https://fireballs.ndc.nasa.gov/public_data/nasfn_2013-2019.zip'
          expected='c091b0f3f87f10badbe5fa38e6c45ba818af99f1c27c2fd6a23be286074c89a4'
          success=0
          for attempt in 1 2 3; do
            rm -f ASFN_2013_2019.zip
            echo "ASFN transport attempt ${attempt}/3" >> output/execution_stage.txt
            set +e
            curl --fail --location --connect-timeout 45 --max-time 180 \
              --user-agent 'OrbitTrace-ASFN-Pristine-Validation-Network-Retry/1.0' \
              "$url" -o ASFN_2013_2019.zip
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              rm -f ASFN_2013_2019.zip
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
              continue
            fi
            got="$(sha256sum ASFN_2013_2019.zip | cut -d' ' -f1)"
            if [ "$got" != "$expected" ]; then
              echo "ASFN_ARCHIVE_HASH_MISMATCH $got" >> output/execution_stage.txt
              exit 42
            fi
            success=1
            echo 'ASFN_ARCHIVE_EXACT_HASH_VERIFIED' >> output/execution_stage.txt
            break
          done
          test "$success" = '1'

      - name: Materialize exact pinned README receipt without opening scientific member
        run: |
          set -euo pipefail
          mkdir -p input/readme
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          archive=Path('ASFN_2013_2019.zip')
          expected_archive='c091b0f3f87f10badbe5fa38e6c45ba818af99f1c27c2fd6a23be286074c89a4'
          expected_readme='74bacb50b225032461ba8b200eec0d5274799ef3c2700cb9a3465b4d5c02a2bf'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected_archive
          with zipfile.ZipFile(archive) as z:
              matches=[i for i in z.infolist() if Path(i.filename).name=='nasfn_2013-2019_readme.txt']
              assert len(matches)==1
              data=z.read(matches[0].filename)
          assert hashlib.sha256(data).hexdigest()==expected_readme
          Path('input/readme/nasfn_2013-2019_readme.txt').write_bytes(data)
          PY
          test "$(sha256sum input/readme/nasfn_2013-2019_readme.txt | cut -d' ' -f1)" = '74bacb50b225032461ba8b200eec0d5274799ef3c2700cb9a3465b4d5c02a2bf'
          printf '%s\n' 'README_RECEIPT_EXACT_HASH_VERIFIED' >> output/execution_stage.txt

      - name: Run first technically valid header-repaired ASFN endpoint
        env:
          PYTHONPATH: orbittrace_recurrent_eom_hdbscan_v1:.
        run: |
          set +e
          python -u orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/header_repair_wrapper.py \
            --frozen-source orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/run_validation.py \
            --archive ASFN_2013_2019.zip \
            --readme-receipt input/readme/nasfn_2013-2019_readme.txt \
            --output output
          rc=$?
          set -e
          echo "$rc" > output/scientific_runner_exit_code.txt
          test -f output/RECURRENT_EOM_ASFN_2018_2019_PRELABEL.json
          test -f output/RECURRENT_EOM_ASFN_2018_2019_VALIDATION.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('output/RECURRENT_EOM_ASFN_2018_2019_VALIDATION.json'))
          rc=int(Path('output/scientific_runner_exit_code.txt').read_text().strip())
          expected={
              'PASS_RECURRENT_EOM_HDBSCAN_V1_ASFN_2018_2019_PRISTINE_VALIDATION':0,
              'FAIL_RECURRENT_EOM_HDBSCAN_V1_ASFN_2018_2019_PRISTINE_VALIDATION':1,
          }
          assert r['verdict'] in expected
          assert rc==expected[r['verdict']]
          PY
          printf '%s\n' 'TECHNICALLY_VALID_SCIENTIFIC_ENDPOINT_WRITTEN' >> output/execution_stage.txt

      - name: Enforce binding role and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/RECURRENT_EOM_ASFN_2018_2019_VALIDATION.json'))
          p=json.load(open('output/RECURRENT_EOM_ASFN_2018_2019_PRELABEL.json'))
          assert r['scientific_role']=='PRISTINE_CROSS_SURVEY_ASFN_2018_2019_VALIDATION'
          assert r['verdict'] in {'PASS_RECURRENT_EOM_HDBSCAN_V1_ASFN_2018_2019_PRISTINE_VALIDATION','FAIL_RECURRENT_EOM_HDBSCAN_V1_ASFN_2018_2019_PRISTINE_VALIDATION'}
          assert r['validation_years']==[2018,2019]
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['nonvalidation_year_scientific_fields_decoded'] is False
          assert r['post_result_parameter_search'] is False
          assert p['shw_accessed'] is False
          for x in (r,p):
              assert x['target_information_access'] is False
              assert x['target_region_events_accessed'] is False
              assert x['sonotaco_2013_2014_access'] is False
              assert x['gmn_2020_2021_access'] is False
              assert x['maarsy_scientific_access'] is False
              assert x['dms_scientific_access'] is False
          print(r['verdict'])
          PY
          printf '%s\n' 'BINDING_FIREWALL_VERIFIED' >> output/execution_stage.txt

      - name: Preserve binding provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          sha256sum \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/PROTOCOL.md \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/run_validation.py \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/header_repair_wrapper.py \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/HEADER_REPAIR_AUDIT_PROTOCOL.md \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/header_repair_audit.py \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/RETRY_EXECUTION_FREEZE.md \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/NETWORK_TRANSPORT_RETRY_FREEZE.md \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/README_RECEIPT_ARGUMENT_REPAIR.md \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            input/audit/ASFN_HASH_HEADER_REPAIR_SEMANTIC_AUDIT.json \
            input/readme/nasfn_2013-2019_readme.txt \
            ASFN_2013_2019.zip \
            output/RECURRENT_EOM_ASFN_2018_2019_PRELABEL.json \
            output/RECURRENT_EOM_ASFN_2018_2019_VALIDATION.json \
            > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-asfn-2018-2019-network-transport-retry-v1
          path: output
          if-no-files-found: error
          retention-days: 90