# execution-registration touch; scientific source unchanged
name: OrbitTrace recurrent-TopoModal component union v1
on:
  push:
    branches: [agent/orbittrace-recurrent-topomodal-component-union-v1]
    paths: ['.github/workflows/orbittrace_recurrent_topomodal_component_union_v1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit frozen component-union source
        run: |
          set -euo pipefail
          mkdir -p input/source output/pretruth
          test "$(git hash-object orbittrace_recurrent_topomodal_component_union_v1/PROTOCOL.md)" = 'f9821aa3ee67f146a2c15e4b899d4811de890f83'
          test "$(git hash-object orbittrace_recurrent_topomodal_component_union_v1/build_prelabel.py)" = '34cf97e1551a2f6237ebf3a95ddbd7892a909970'
          test "$(git hash-object orbittrace_recurrent_topomodal_component_union_v1/evaluate_truth.py)" = 'f800ddf64da6256b6b810588826e0ea4280eaf3f'
          python -m py_compile orbittrace_recurrent_topomodal_component_union_v1/build_prelabel.py orbittrace_recurrent_topomodal_component_union_v1/evaluate_truth.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-topomodal-overlap-consensus-v1-pretruth
          path: input/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32072681272
      - name: Verify immutable zero-label source
        run: |
          set -euo pipefail
          test "$(sha256sum input/source/RECURRENT_TOPOMODAL_OVERLAP_CONSENSUS_V1_PRELABEL.json | cut -d' ' -f1)" = 'bd0d28410d23bef0c5c8847ecd8d54e91b74e148ce62e8533407787d265e468f'
          python - <<'PY'
          import json
          p=json.load(open('input/source/RECURRENT_TOPOMODAL_OVERLAP_CONSENSUS_V1_PRELABEL.json'))
          assert p['scientific_role']=='PRELABEL_RECURRENT_TOPOMODAL_OVERLAP_CONSENSUS_V1'
          assert p['shower_truth_used'] is False
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert p['sonotaco_2013_2014_access'] is False
          PY
      - name: Build and seal component-union prelabel
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_topomodal_component_union_v1/build_prelabel.py \
            --source-prelabel input/source/RECURRENT_TOPOMODAL_OVERLAP_CONSENSUS_V1_PRELABEL.json \
            --output output/pretruth
          python - <<'PY'
          import hashlib,json
          p='output/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRELABEL.json'
          r='output/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRETRUTH.json'
          pre=json.load(open(p)); audit=json.load(open(r))
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert audit['verdict']=='PASS_RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRETRUTH'
          assert audit['prelabel_sha256']==h
          assert len(audit['gates'])==12 and all(audit['gates'].values())
          assert audit['shower_truth_used'] is False
          assert audit['target_information_access'] is False and audit['target_region_events_accessed'] is False
          print(json.dumps({'verdict':audit['verdict'],'prelabel_sha256':h,'aggregate':audit['aggregate'],'panels':audit['panels']},indent=2,sort_keys=True))
          PY
          git rev-parse HEAD > output/pretruth/execution_commit.txt
          sha256sum orbittrace_recurrent_topomodal_component_union_v1/PROTOCOL.md orbittrace_recurrent_topomodal_component_union_v1/build_prelabel.py input/source/RECURRENT_TOPOMODAL_OVERLAP_CONSENSUS_V1_PRELABEL.json output/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRELABEL.json output/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRETRUTH.json > output/pretruth/source_input_output_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-recurrent-topomodal-component-union-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and audit frozen truth runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/ranker input/v8 input/pretruth input/v3 output/truth
          test "$(git hash-object orbittrace_recurrent_topomodal_component_union_v1/PROTOCOL.md)" = 'f9821aa3ee67f146a2c15e4b899d4811de890f83'
          test "$(git hash-object orbittrace_recurrent_topomodal_component_union_v1/build_prelabel.py)" = '34cf97e1551a2f6237ebf3a95ddbd7892a909970'
          test "$(git hash-object orbittrace_recurrent_topomodal_component_union_v1/evaluate_truth.py)" = 'f800ddf64da6256b6b810588826e0ea4280eaf3f'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-topomodal-component-union-v1-pretruth
          path: input/pretruth
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Verify immutable pretruth PASS before opening labels
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python - <<'PY'
          import hashlib,json
          p='input/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRELABEL.json'
          r='input/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRETRUTH.json'
          pre=json.load(open(p)); audit=json.load(open(r))
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert pre['scientific_role']=='PRELABEL_RECURRENT_TOPOMODAL_COMPONENT_UNION_V1'
          assert pre['shower_truth_used'] is False and pre['target_information_access'] is False and pre['target_region_events_accessed'] is False
          assert audit['verdict']=='PASS_RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRETRUTH'
          assert audit['prelabel_sha256']==h
          assert len(audit['gates'])==12 and all(audit['gates'].values())
          PY
      - name: Evaluate exact sealed component-union catalogue
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_topomodal_component_union_v1/evaluate_truth.py \
            --prelabel input/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRELABEL.json \
            --pretruth input/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRETRUTH.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth
      - name: Enforce binding scientific contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          r=json.load(open('output/truth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_TRUTH.json'))
          assert r['schema']=='ORBITTRACE_RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_TRUTH'
          assert r['verdict'] in {'PASS_RECURRENT_TOPOMODAL_COMPONENT_UNION_V1','FAIL_RECURRENT_TOPOMODAL_COMPONENT_UNION_V1'}
          assert len(r['gates'])==10 and len(r['panels'])==16
          assert r['ranking_metric_gate']=='zero_filled_eligible_query_mrr_panel_mean'
          assert r['historical_conditional_mrr_role']=='diagnostic_only'
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_2013_2014_access'] is False
          p='input/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRELABEL.json'
          assert r['prelabel_sha256']==hashlib.sha256(open(p,'rb').read()).hexdigest()
          print(r['verdict'])
          print(json.dumps({'scales':r['scale_aggregates'],'gates':r['gates']},indent=2,sort_keys=True))
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          cp input/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRELABEL.json output/truth/ 2>/dev/null || true
          cp input/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRETRUTH.json output/truth/ 2>/dev/null || true
          sha256sum orbittrace_recurrent_topomodal_component_union_v1/PROTOCOL.md orbittrace_recurrent_topomodal_component_union_v1/build_prelabel.py orbittrace_recurrent_topomodal_component_union_v1/evaluate_truth.py input/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRELABEL.json input/pretruth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_PRETRUTH.json output/truth/RECURRENT_TOPOMODAL_COMPONENT_UNION_V1_TRUTH.json > output/truth/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/truth/execution_commit.txt
          python -m pip freeze > output/truth/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-topomodal-component-union-v1-truth
          path: output/truth
          if-no-files-found: error
          retention-days: 90
