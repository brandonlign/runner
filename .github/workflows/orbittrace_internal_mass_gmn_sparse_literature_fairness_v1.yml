name: OrbitTrace internal-mass sparse GMN literature fairness v1

on:
  push:
    branches: [agent/orbittrace-internal-mass-gmn-sparse-literature-fairness-v1]
    paths: ['orbittrace_internal_mass_gmn_sparse_literature_fairness_v1/ACTIVATE.md']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-internal-mass-gmn-sparse-literature-fairness-v1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-recurrent-local-topomodal-trunk-v1
          path: local-trunk-src

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact runtime and audit frozen sources
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_internal_mass_gmn_sparse_literature_fairness_v1/PROTOCOL.md)" = '4cc4458394f0c7816fc99d3aa8f4479c5bc419f7'
          test "$(git hash-object orbittrace_internal_mass_gmn_sparse_literature_fairness_v1/build_pretruth.py)" = '28b79dc5d4a7b086e22065250506b713b967a4e6'
          test "$(git hash-object orbittrace_internal_mass_gmn_sparse_literature_fairness_v1/evaluate_truth.py)" = '7a69955d884d467d3e4ddf779dec63238957f545'
          test "$(git -C local-trunk-src hash-object orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py)" = '32abfb3e68520cfdc83585a88731fa3982900cde'
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/internal input/ranker input/v8 input/v3 output/geometry output/pretruth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-support-cut-bifiltration-internal-mass-v1
          path: input/internal
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32041661731

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Rebind immutable pretruth inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/internal/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json | cut -d' ' -f1)" = '7b1ddfcd32cd0b52321e3b3dfc614a88dd9b973f947c1d4d0de74fddf26b59cd'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python -m py_compile orbittrace_internal_mass_gmn_sparse_literature_fairness_v1/build_pretruth.py orbittrace_internal_mass_gmn_sparse_literature_fairness_v1/evaluate_truth.py

      - name: Export label-free exact GMN geometry
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          set -euo pipefail
          python -u local-trunk-src/orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/geometry/GMN_LABEL_FREE_GEOMETRY.json

      - name: Build and seal same-universe literature catalogues
        run: |
          set -euo pipefail
          python -u orbittrace_internal_mass_gmn_sparse_literature_fairness_v1/build_pretruth.py \
            --protocol orbittrace_internal_mass_gmn_sparse_literature_fairness_v1/PROTOCOL.md \
            --geometry output/geometry/GMN_LABEL_FREE_GEOMETRY.json \
            --internal-prelabel input/internal/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json \
            --output output/pretruth/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json
          sha256sum output/pretruth/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json > output/pretruth/PRETRUTH_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-internal-mass-gmn-sparse-literature-fairness-v1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen truth runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/internal input/ranker input/v8 input/v3 input/sealed output/truth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
          test "$(git hash-object orbittrace_internal_mass_gmn_sparse_literature_fairness_v1/evaluate_truth.py)" = '7a69955d884d467d3e4ddf779dec63238957f545'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-support-cut-bifiltration-internal-mass-v1
          path: input/internal
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32041661731

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth
          path: input/sealed

      - name: Rebind frozen truth inputs and sealed pretruth
        run: |
          set -euo pipefail
          test "$(sha256sum input/internal/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json | cut -d' ' -f1)" = '7b1ddfcd32cd0b52321e3b3dfc614a88dd9b973f947c1d4d0de74fddf26b59cd'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          expected=$(cut -d' ' -f1 input/sealed/PRETRUTH_SHA256.txt)
          got=$(sha256sum input/sealed/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json | cut -d' ' -f1)
          test "$expected" = "$got"

      - name: Run binding common-truth fairness evaluation
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          set -euo pipefail
          python -u orbittrace_internal_mass_gmn_sparse_literature_fairness_v1/evaluate_truth.py \
            --pretruth input/sealed/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json \
            --internal-prelabel input/internal/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_RESULT.json
          sha256sum output/truth/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_RESULT.json > output/truth/RESULT_SHA256.txt
          git rev-parse HEAD > output/truth/execution_commit.txt
          python --version > output/truth/python_version.txt
          python -m pip freeze > output/truth/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-binding
          path: output/truth
          if-no-files-found: error
          retention-days: 90
