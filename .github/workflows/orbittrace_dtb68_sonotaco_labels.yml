name: OrbitTrace DTb68 SonotaCo label audit

on:
  push:
    branches:
      - research/orbittrace-new-discovery-screen-20260828
    paths:
      - orbittrace_new_discovery_screen/dtb68_sonotaco_label_audit.py
      - .github/workflows/orbittrace_dtb68_sonotaco_labels.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 requests==2.32.5
      - run: python -m py_compile orbittrace_new_discovery_screen/dtb68_sonotaco_label_audit.py
      - run: python -m orbittrace_new_discovery_screen.dtb68_sonotaco_label_audit
      - uses: actions/upload-artifact@v4
        with:
          name: dtb68-sonotaco-label-audit
          path: sonotaco_label_output/
          if-no-files-found: error
          retention-days: 60
