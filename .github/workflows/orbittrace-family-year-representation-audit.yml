name: OrbitTrace family-year representation source-only audit

on:
  pull_request:
    branches:
      - agent/orbittrace-pooled-year-centroid-v8
    paths:
      - 'orbittrace_family_year_representation_audit/**'
      - '.github/workflows/orbittrace-family-year-representation-audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Enforce clean-room source boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v3 output
          test "$(git merge-base HEAD c9d6c44704013ba0c9430100e98a29a56b453304)" = "c9d6c44704013ba0c9430100e98a29a56b453304"
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"
          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"
          test "$(git hash-object orbittrace_label_free_sparse_support_v6/run_development.py)" = "7995fc6b75d1fd51eb4b304ace39db28a5a1e876"
          test "$(git hash-object orbittrace_pooled_year_centroid_v8/run_development.py)" = "f248df78e1258b132b41aecca6a985a5eb782654"
          python -m py_compile orbittrace_family_year_representation_audit/run_audit.py
          rm -rf output/*
          echo PASS_FAMILY_YEAR_REPRESENTATION_AUDIT_PREDATA_GUARDS

      - name: Run source-only geometry audit
        env:
          PYTHONPATH: input/v3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python orbittrace_family_year_representation_audit/run_audit.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --source-audit-json output/wavelet_catalogue_v3_source_audit.json \
            --output output

      - name: Enforce label-free result boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/family_year_representation_source_only_audit.json').read_text())
          assert r['verdict']=='PASS_FAMILY_YEAR_REPRESENTATION_SOURCE_ONLY_AUDIT'
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['family_count']==226
          assert r['duplicate_family_years']==118
          assert r['families_with_duplicate_same_year_components']==75
          assert all(r['integrity_gates'].values())
          assert 'No shower labels' in r['interpretation_boundary']
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/audit_commit.txt
          sha256sum orbittrace_family_year_representation_audit/PROTOCOL.md orbittrace_family_year_representation_audit/run_audit.py > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload source-only audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-family-year-representation-source-only-audit
          path: output
          if-no-files-found: error
          retention-days: 90
