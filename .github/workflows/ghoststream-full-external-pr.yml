name: GhostStream full external PR runner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ghoststream_external/run_full_external_replication.py
      - ghoststream_external/run_full_external_replication_v2.py
      - .github/workflows/ghoststream_full_external.yml

permissions:
  contents: write

concurrency:
  group: ghoststream-full-external-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy requests
      - name: Compile
        run: |
          python -m py_compile ghoststream_external/run_full_external_replication.py
          python -m py_compile ghoststream_external/run_full_external_replication_v2.py
      - name: Run frozen complete-catalog replication
        run: python ghoststream_external/run_full_external_replication_v2.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-full-external-replication-v2
          path: ghoststream_external/results
          if-no-files-found: error
          retention-days: 90
      - name: Preserve results on PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ghoststream_external/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Preserve schema-complete GhostStream external replication results'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
