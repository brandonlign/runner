name: OrbitTrace recurrent-core expansion R1 development schemafix

on:
  pull_request:
    branches:
      - agent/orbittrace-recurrent-core-expansion-r1
    paths:
      - 'orbittrace_recurrent_core_expansion_r1/RUN_HASHFIX.md'

permissions:
  contents: read
  actions: read

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out execution child
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce one-file execution child and frozen parent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "orbittrace_recurrent_core_expansion_r1/RUN_HASHFIX.md"
          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_recurrent_core_expansion_r1/RUN_HASHFIX.md
          test -f orbittrace_recurrent_core_expansion_r1/run_schemafixed_execution.sh
          test -f orbittrace_recurrent_core_expansion_r1/fix_schema_wrapper_regex.py
          echo "execution_base_sha=$BASE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Execute schema-repaired frozen R1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output
          python orbittrace_recurrent_core_expansion_r1/fix_schema_wrapper_regex.py
          bash orbittrace_recurrent_core_expansion_r1/run_schemafixed_execution.sh

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/development_base_commit.txt
          sha256sum \
            orbittrace_recurrent_core_expansion_r1/PROTOCOL.md \
            orbittrace_recurrent_core_expansion_r1/fix_schema_wrapper_regex.py \
            orbittrace_recurrent_core_expansion_r1/run_schemafixed_execution.sh \
            input/r1/run_development.py \
            input/dsh/literature_comparators.py \
            > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-core-expansion-r1-development-schemafix
          path: output
          if-no-files-found: error
          retention-days: 90
