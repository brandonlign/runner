name: OrbitTrace NCA OrbitTrace characterization v1

on:
  pull_request:
    branches: [agent/orbittrace-m2d-support-pruned-cut-v1]
    paths:
      - orbittrace_nca_orbittrace_characterization_v1/**
      - .github/workflows/orbittrace_nca_orbittrace_characterization_v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: orbittrace-nca-orbittrace-characterization-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      pretruth_sha: ${{ steps.seal.outputs.pretruth_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 8b8475dc98fb219f0a28d3b6d0673efd676265dc
          path: blind1378
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 019cc298e2a1ee761047e724ee33e62092f3bf7c
          path: annual-src
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 0960edd77ea29b29b70d05f389dce312d451f0d2
          path: bwm-src
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: a0f1ef2068685a5a0385609383d03e33c47fbc54
          path: cmr-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: blind1378/ghoststream_fixed4_application/requirements.txt

      - name: Install exact scientific runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r blind1378/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0' 'networkx==3.6.1'
          mkdir -p input/upstream output/pretruth

      - name: Verify frozen source identities before reconstruction
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_nca_orbittrace_characterization_v1/build_pretruth.py)" = '6214be3da3afdf2e629fd34be980c0405c1abeae'
          test "$(git hash-object orbittrace_nca_orbittrace_characterization_v1/reveal.py)" = '4f272ce06d1ef2565b6a23efd17c5eecf95a6d4f'
          test "$(git -C blind1378 hash-object orbittrace_m2d_blind_rediscovery_v1/run_scan.py)" = '3def559978444e9bde1eab9cf9c3d47b8cbb2944'
          test "$(git hash-object orbittrace_m2d_support_pruned_blind_replay_v1/run_replay.py)" = 'de1e28eeb69d199502c1158bc56f32695bb64b2c'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/support_pruned_cut.py)" = '3712a36033088f1bd486cefdc8dc474c194fc85c'
          test "$(git -C annual-src hash-object orbittrace_annual_density_bifiltration_scale_v1/run_diagnostic.py)" = 'd8486a55661bd71e92932b290e0b7550688f3b46'
          test "$(git -C bwm-src hash-object orbittrace_bif_witness_modularity_v1/build_pretruth.py)" = '703081742f004f8817da050fdf22cf9ecde44dfe'
          test "$(git -C cmr-src hash-object orbittrace_core_majority_regrowth_v1/build_pretruth.py)" = 'd7d0eacfb5fc3f86794fc29898e163d1343d0612'
          python -m py_compile orbittrace_nca_orbittrace_characterization_v1/build_pretruth.py orbittrace_nca_orbittrace_characterization_v1/reveal.py

      - name: Retrieve exact sealed support-pruned full-GMN replay
        uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-support-pruned-blind-replay-v1-pretruth
          path: input/upstream
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32287958931'

      - name: Verify upstream replay before any reconstruction
        run: |
          set -euo pipefail
          echo 'b1beb3dac03579b2ca2a0f85a2e65213e3a4826dfe0d8f038856f6b227319765  input/upstream/orbittrace_m2d_blind_ranked_pretruth.json.gz' | sha256sum -c -
          python - <<'PY'
          import gzip,hashlib,json
          p='input/upstream/orbittrace_m2d_blind_ranked_pretruth.json.gz'
          raw=gzip.decompress(open(p,'rb').read()); r=json.loads(raw)
          assert hashlib.sha256(raw).hexdigest()=='75dec41919072681a423d3c37d4565ca5ee19dccf86900b3b39ef5d30153ca0b'
          assert r['candidate_count']==8884 and r['orbittrace_canonical_members_access'] is False
          assert r['candidates'][81]['rank']==82 and r['candidates'][81]['member_count']==1708
          assert r['candidates'][81]['family_hash']=='936d785f4c50b5dae659'
          print('UPSTREAM_RANK82_PARENT_VERIFIED_WITHOUT_CANONICAL_IDS')
          PY

      - name: Build exact full-universe NCA structure with canonical IDs unavailable
        run: |
          set -euo pipefail
          /usr/bin/time -v python -u orbittrace_nca_orbittrace_characterization_v1/build_pretruth.py \
            --sealed-pretruth input/upstream/orbittrace_m2d_blind_ranked_pretruth.json.gz \
            --old-scan blind1378/orbittrace_m2d_blind_rediscovery_v1/run_scan.py \
            --support-replay orbittrace_m2d_support_pruned_blind_replay_v1/run_replay.py \
            --blind-source-parts blind1378/orbittrace_fixed4_blind_catalogue/source_parts \
            --candidate-payload blind1378/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload blind1378/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts blind1378/mondrian_clique_development/source_parts_v2 \
            --structural-source orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --support-source orbittrace_m2d_support_pruned_cut_v1/support_pruned_cut.py \
            --annual-source annual-src/orbittrace_annual_density_bifiltration_scale_v1/run_diagnostic.py \
            --bwm-source bwm-src/orbittrace_bif_witness_modularity_v1/build_pretruth.py \
            --cmr-source cmr-src/orbittrace_core_majority_regrowth_v1/build_pretruth.py \
            --output output/pretruth/NCA_ORBITTRACE_CHARACTERIZATION_V1_PRETRUTH.json \
            2>&1 | tee output/pretruth/build.log

      - name: Seal target-ID-unopened NCA characterization
        id: seal
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          p='output/pretruth/NCA_ORBITTRACE_CHARACTERIZATION_V1_PRETRUTH.json'
          raw=open(p,'rb').read(); h=hashlib.sha256(raw).hexdigest(); r=json.loads(raw)
          assert r['schema']=='ORBITTRACE_NCA_ORBITTRACE_CHARACTERIZATION_V1_PRETRUTH'
          assert r['canonical_target_ids_accessed'] is False
          assert r['target_overlap_used_for_construction'] is False
          assert r['configuration']['new_tuned_parameters']==[]
          assert r['contained_bifiltration_equivalence']['verdict']=='PASS_EXACT_CONTAINED_BIFILTRATION_EQUIVALENCE'
          assert r['edge_transport']=={'parent_vertices':1708,'internal_edges':28994,'positive_boundary_edges':69}
          assert r['parent']['rank']==82 and r['parent']['member_count']==1708 and r['parent']['family_hash']=='936d785f4c50b5dae659'
          assert len(r['nca_branches'])>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('pretruth_sha='+h+'\n')
          open('output/pretruth/PRETRUTH_SHA256.txt','w').write(h+'  NCA_ORBITTRACE_CHARACTERIZATION_V1_PRETRUTH.json\n')
          print('NCA_CHARACTERIZATION_PRETRUTH_SHA='+h)
          print(json.dumps({'witnesses':len(r['contained_bifiltration_witnesses']),'bwm_seeds':len(r['bwm_seeds']),'nca_branches':len(r['nca_branches']),'primary_members':r['primary_branch_member_count'],'edge_transport':r['edge_transport']},sort_keys=True))
          PY

      - name: Preserve pretruth provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/pretruth/execution_commit.txt
          python --version > output/pretruth/python_version.txt
          python -m pip freeze > output/pretruth/environment.txt
          sha256sum orbittrace_nca_orbittrace_characterization_v1/PROTOCOL.md orbittrace_nca_orbittrace_characterization_v1/build_pretruth.py orbittrace_nca_orbittrace_characterization_v1/reveal.py input/upstream/orbittrace_m2d_blind_ranked_pretruth.json.gz output/pretruth/NCA_ORBITTRACE_CHARACTERIZATION_V1_PRETRUTH.json > output/pretruth/provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-nca-orbittrace-characterization-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  reveal:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify reveal source only
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_nca_orbittrace_characterization_v1/reveal.py)" = '4f272ce06d1ef2565b6a23efd17c5eecf95a6d4f'
          python -m py_compile orbittrace_nca_orbittrace_characterization_v1/reveal.py
          mkdir -p input/pretruth input output/reveal
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-nca-orbittrace-characterization-v1-pretruth
          path: input/pretruth
      - name: Verify exact Stage-1 seal before canonical access
        run: |
          set -euo pipefail
          echo '${{ needs.pretruth.outputs.pretruth_sha }}  input/pretruth/NCA_ORBITTRACE_CHARACTERIZATION_V1_PRETRUTH.json' | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('input/pretruth/NCA_ORBITTRACE_CHARACTERIZATION_V1_PRETRUTH.json'))
          assert r['canonical_target_ids_accessed'] is False and r['target_overlap_used_for_construction'] is False
          assert r['configuration']['new_tuned_parameters']==[]
          print('STAGE1_SEAL_VERIFIED_BEFORE_CANONICAL_DOWNLOAD')
          PY
      - name: Retrieve exact canonical bundle used by PR1378 and PR1380
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANONICAL_ARTIFACT_ID: '8814798136'
          CANONICAL_ARTIFACT_SHA256: '716b70313465d5df4bfb092a85a81680e6f618606b71e25470c63c480b6449f5'
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANONICAL_ARTIFACT_ID}/zip" \
            -o input/canonical.zip
          echo "${CANONICAL_ARTIFACT_SHA256}  input/canonical.zip" | sha256sum -c -
      - name: Reveal exact-ID concentration only
        run: |
          set -euo pipefail
          python orbittrace_nca_orbittrace_characterization_v1/reveal.py \
            --pretruth input/pretruth/NCA_ORBITTRACE_CHARACTERIZATION_V1_PRETRUTH.json \
            --expected-pretruth-sha '${{ needs.pretruth.outputs.pretruth_sha }}' \
            --canonical-zip input/canonical.zip \
            --output output/reveal
          cat output/reveal/NCA_ORBITTRACE_CHARACTERIZATION_V1_REVEAL.md
      - name: Preserve reveal provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/reveal/execution_commit.txt
          sha256sum orbittrace_nca_orbittrace_characterization_v1/reveal.py input/pretruth/NCA_ORBITTRACE_CHARACTERIZATION_V1_PRETRUTH.json input/canonical.zip output/reveal/NCA_ORBITTRACE_CHARACTERIZATION_V1_REVEAL.json > output/reveal/provenance_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-nca-orbittrace-characterization-v1-reveal
          path: output/reveal
          if-no-files-found: error
          retention-days: 90
      - name: Post result to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s output/reveal/NCA_ORBITTRACE_CHARACTERIZATION_V1_REVEAL.md; then
            gh pr comment '${{ github.event.pull_request.number }}' --repo "$GITHUB_REPOSITORY" --body-file output/reveal/NCA_ORBITTRACE_CHARACTERIZATION_V1_REVEAL.md
          else
            gh pr comment '${{ github.event.pull_request.number }}' --repo "$GITHUB_REPOSITORY" --body "NCA OrbitTrace characterization ended without a valid reveal result. Treat as technical no-result unless a sealed reveal JSON exists. Workflow: $GITHUB_RUN_ID"
          fi
