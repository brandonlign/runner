name: OrbitTrace M2D support-pruned truth capacity repair

on:
  pull_request:
    branches: [agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1]
    paths: ['.github/workflows/orbittrace_m2d_support_pruned_cut_v1_truth_capacity_repair.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  SEALED_PRETRUTH_SHA256: '57a6fd0fa680fb56b3d6a8a984682213e0235baadf14b27f241927b2dbb4b50f'

jobs:
  truth-capacity-repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install evaluator runtime and verify repair-only source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/evaluate_gmn_capacity_repair.py)" = '10ee0a43f428a6239fe73bd6470f6154fcdfea54'
          grep -F 'PR1377_EXACT: comparator_capacity_k=len(published_clusters); method=method_candidates[:k]; shortfall allowed and recorded, never padded' orbittrace_m2d_support_pruned_cut_v1/evaluate_gmn_capacity_repair.py
          grep -F 'scientific_pretruth_reexecuted": False' orbittrace_m2d_support_pruned_cut_v1/evaluate_gmn_capacity_repair.py
          grep -F 'method_changed_after_truth": False' orbittrace_m2d_support_pruned_cut_v1/evaluate_gmn_capacity_repair.py
          python -m py_compile orbittrace_m2d_support_pruned_cut_v1/evaluate_gmn_capacity_repair.py
          mkdir -p input/pretruth input/fairness input/ranker input/v8 input/v3 output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-pretruth-r2
          path: input/pretruth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32285788062

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth
          path: input/fairness
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32268943692

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify exact sealed scientific inputs
        run: |
          set -euo pipefail
          echo "${SEALED_PRETRUTH_SHA256}  input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json" | sha256sum -c -
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python - <<'PY'
          import json
          r=json.load(open('input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json'))
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_SUPPORT_PRUNED_M2D_RANKING_FROZEN_BEFORE_TRUTH'
          assert r['shower_truth_used'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False
          assert r['configuration']['new_tuned_parameters']==[]
          f=json.load(open('input/fairness/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json'))
          assert f['scientific_role']=='TARGET_EXCLUDED_GMN_SPARSE_LITERATURE_COMPARATORS_FROZEN_BEFORE_TRUTH'
          assert f['internal_prelabel_sha256']=='7b1ddfcd32cd0b52321e3b3dfc614a88dd9b973f947c1d4d0de74fddf26b59cd'
          print('SEALED_PRETRUTH_AND_PUBLISHED_COMPARATORS_VERIFIED')
          PY

      - name: Evaluate exact sealed pretruth with PR1377 capacity semantics
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_support_pruned_cut_v1/evaluate_gmn_capacity_repair.py \
            --refined-pretruth input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json \
            --literature-pretruth input/fairness/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/M2D_SUPPORT_PRUNED_CUT_V1_GMN_CAPACITY_REPAIR_RESULT.json

      - name: Enforce repair-only binding result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/M2D_SUPPORT_PRUNED_CUT_V1_GMN_CAPACITY_REPAIR_RESULT.json'))
          assert r['verdict'] in {'PASS_M2D_SUPPORT_PRUNED_CUT_V1_GMN_DEVELOPMENT','FAIL_M2D_SUPPORT_PRUNED_CUT_V1_GMN_DEVELOPMENT'}
          assert r['refined_pretruth_sha256']=='57a6fd0fa680fb56b3d6a8a984682213e0235baadf14b27f241927b2dbb4b50f'
          assert r['scientific_pretruth_reexecuted'] is False and r['method_changed_after_truth'] is False
          assert r['capacity_semantics'].startswith('PR1377_EXACT:')
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False
          assert r['sonotaco_scientific_access'] is False and r['post_result_parameter_search'] is False
          print(r['verdict'])
          print(json.dumps({'routes':r['routes'],'scales':r['scales'],'size_summary':r['size_summary'],'gates':r['gates']},indent=2,sort_keys=True))
          PY

      - name: Preserve repair provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/evaluator_repair_execution_commit.txt
          sha256sum orbittrace_m2d_support_pruned_cut_v1/evaluate_gmn_capacity_repair.py input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json input/fairness/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json output/M2D_SUPPORT_PRUNED_CUT_V1_GMN_CAPACITY_REPAIR_RESULT.json > output/evaluator_repair_provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-truth-capacity-repair
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Post binding evaluator-repair result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s output/M2D_SUPPORT_PRUNED_CUT_V1_GMN_CAPACITY_REPAIR_RESULT.json; then
            python - <<'PY' > /tmp/result.md
          import json
          r=json.load(open('output/M2D_SUPPORT_PRUNED_CUT_V1_GMN_CAPACITY_REPAIR_RESULT.json'))
          print('## M2D support-pruned cut v1 — binding evaluator-capacity repair')
          print()
          print('Verdict: **`%s`**' % r['verdict'])
          print()
          print('Scientific pretruth reexecuted: **no**. Method changed after truth: **no**. Capacity handling now exactly follows PR #1377: method[:k], shortfall scored rather than rejected.')
          print()
          for comp in ('sugar2017','hdbscan2025'):
              x=r['routes'][comp]
              print('- %s: refined F1 `%.9f`, baseline M2D `%.9f`, literature `%.9f`; recovered>0.5 `%d / %d / %d`; shortfall panels refined/baseline `%d/%d`' % (comp,x['refined']['mean_macro_f1'],x['baseline_m2d']['mean_macro_f1'],x['literature']['mean_macro_f1'],x['refined']['total_recovered_f1_gt_05'],x['baseline_m2d']['total_recovered_f1_gt_05'],x['literature']['total_recovered_f1_gt_05'],x['capacity']['refined_shortfall_panels'],x['capacity']['baseline_shortfall_panels']))
          for d in ('128','1024'):
              x=r['scales'][d]
              print('- d=%s: refined F1 `%.9f` vs baseline `%.9f`; recovered>0.5 `%d vs %d`' % (d,x['refined']['mean_macro_f1'],x['baseline_m2d']['mean_macro_f1'],x['refined']['total_recovered_f1_gt_05'],x['baseline_m2d']['total_recovered_f1_gt_05']))
          s=r['size_summary']
          print('- top-budget mean members: `%.6f -> %.6f`; p90 `%.1f -> %.1f`; max `%d -> %d`' % (s['baseline_mean_top_budget_member_count'],s['refined_mean_top_budget_member_count'],s['baseline_p90_top_budget_member_count'],s['refined_p90_top_budget_member_count'],s['baseline_max_top_budget_member_count'],s['refined_max_top_budget_member_count']))
          PY
            gh pr comment 1380 --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md || true
          else
            gh pr comment 1380 --repo "$GITHUB_REPOSITORY" --body 'Evaluator-only capacity repair ended without a result. Sealed scientific pretruth remains unchanged.' || true
          fi
