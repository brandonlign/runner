name: OrbitTrace pair-Pareto v1 transport diagnostic

on:
  pull_request:
    branches: [agent/orbittrace-m2d-sacv-pair-pareto-catalogue-v1]
    paths:
      - 'orbittrace_m2d_sacv_pair_pareto_catalogue_v1/DIAGNOSE_TRANSPORT.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-m2d-sacv-pair-pareto-catalogue-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run reconstruction checkpoints
        id: diag
        continue-on-error: true
        run: |
          set +e
          : > /tmp/diag.txt
          check() {
            label="$1"; shift
            "$@"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "PASS $label" | tee -a /tmp/diag.txt
            else
              echo "FAIL $label rc=$rc" | tee -a /tmp/diag.txt
              exit "$rc"
            fi
          }
          check protocol_hash test "$(git hash-object orbittrace_m2d_sacv_pair_pareto_catalogue_v1/PROTOCOL.md)" = cfca4d2b219732b2a3b8eedcea8e7746ad4b9e3a
          check instrument_hash test "$(git hash-object orbittrace_m2d_sacv_pair_pareto_catalogue_v1/instrument_runtime.py)" = e4ff0108d6c5989a5e00bfc92b76154863e22e68
          check builder_hash test "$(git hash-object orbittrace_m2d_sacv_pair_pareto_catalogue_v1/build_pretruth.py)" = 35eced550f1e67652bd4f217a80b2dff435f9e89
          check evaluator_hash test "$(git hash-object orbittrace_m2d_sacv_pair_pareto_catalogue_v1/evaluate_truth.py)" = 77e94d894d1f02de0d90c2be3aff39244628d7d6
          check sacv_source_sha bash -lc "echo 'd75b76a36911c916620da5e029f82c7987718b1610eb6bd61922015b5ab50d4a  orbittrace_m2d_sacv_v1_source.tgz' | sha256sum -c -"
          check sacv_source_extract tar -xzf orbittrace_m2d_sacv_v1_source.tgz
          cat orbittrace_m2d_sacv_edge_consensus_v1/source_parts/part*.b64 > /tmp/ec.b64
          check edge_parts_size test "$(wc -c < /tmp/ec.b64)" = 16844
          check edge_decode base64 -d /tmp/ec.b64 -o /tmp/ec.tgz
          check edge_source_sha bash -lc "echo 'f7d9fc168fb5f8a589a5d965252979951ae9659ded4dc6662a562276c6273d28  /tmp/ec.tgz' | sha256sum -c -"
          check edge_source_extract tar -xzf /tmp/ec.tgz
          check fallback_patch_sha bash -lc "echo 'f6c5b2a89d70003b058e772b753c531cb5072b2c1eb52d77166d7a5cbd566ca7  orbittrace_m2d_sacv_fallback_recurrence_v1/patch_source.py' | sha256sum -c -"
          check fallback_patch python orbittrace_m2d_sacv_fallback_recurrence_v1/patch_source.py
          check transformed_build_sha bash -lc "echo '435db7a53d4a78547f910d5e1a836bc399a7bd77b227056b4a1c12665d10b13a  orbittrace_m2d_sacv_edge_consensus_v1/build_pretruth.py' | sha256sum -c -"
          cp orbittrace_m2d_sacv_edge_consensus_v1/build_pretruth.py orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py
          check instrument_runtime python orbittrace_m2d_sacv_pair_pareto_catalogue_v1/instrument_runtime.py
          check pycompile python -m py_compile orbittrace_m2d_sacv_pair_pareto_catalogue_v1/instrument_runtime.py orbittrace_m2d_sacv_pair_pareto_catalogue_v1/build_pretruth.py orbittrace_m2d_sacv_pair_pareto_catalogue_v1/evaluate_truth.py orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py
          echo 'PASS ALL_SOURCE_RECONSTRUCTION_CHECKPOINTS' | tee -a /tmp/diag.txt
      - name: Comment diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '## Pair-Pareto v1 transport diagnostic'
            echo
            echo '```'
            cat /tmp/diag.txt 2>/dev/null || echo 'diagnostic step did not create output'
            echo '```'
            echo
            echo 'No shower truth, OrbitTrace target information, or SonotaCo scientific data was accessed.'
          } > /tmp/comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Enforce diagnostic success
        if: always()
        run: grep -q '^PASS ALL_SOURCE_RECONSTRUCTION_CHECKPOINTS$' /tmp/diag.txt
