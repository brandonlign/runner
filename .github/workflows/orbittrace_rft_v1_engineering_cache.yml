name: OrbitTrace RFT v1 engineering cache GMN 2022

on:
  pull_request:
    branches:
      - agent/orbittrace-recurrent-flow-tube-v1
    paths:
      - 'orbittrace_recurrent_flow_tube_v1_engineering/**'
      - '.github/workflows/orbittrace_rft_v1_engineering_cache.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  engineering-2022-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify frozen science plus engineering wrappers
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/v8 input/ranker output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          test "$(git hash-object orbittrace_recurrent_flow_tube_v1/run_development.py)" = 'a5d5371f0c30a9c57ee4d8756ea41f454cd86301'
          test "$(git hash-object orbittrace_recurrent_flow_tube_v1_engineering/run_development_cached.py)" = '2a599c6e8247eb819a1090591d586526eda6c0c1'
          test "$(git hash-object orbittrace_recurrent_flow_tube_v1_engineering/run_development_cached_memo.py)" = '2c8e27b01da333e7c14960df677f685bbadc8c01'
          python -m py_compile orbittrace_recurrent_flow_tube_v1/run_development.py orbittrace_recurrent_flow_tube_v1_engineering/run_development_cached.py orbittrace_recurrent_flow_tube_v1_engineering/run_development_cached_memo.py /tmp/run_wavelet_catalogue_v3_development.py
          echo PASS_RFT_V1_ENGINEERING_SOURCE_PINS

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify frozen GMN runtime utility source
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify runtime-support artifact only
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Run engineering-cached target-excluded GMN 2022 only
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_flow_tube_v1_engineering/run_development_cached_memo.py \
            --frozen-source orbittrace_recurrent_flow_tube_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce engineering-only role and protected-data firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/RFT_V1_GMN2022_DEVELOPMENT.json'))
          e=json.load(open('output/ENGINEERING_CACHE_REPORT.json'))
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_DEVELOPMENT_ONLY'
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['gmn_2023_access'] is False
          assert r['sonotaco_2013_2014_access'] is False
          assert r['target_information_access'] is False
          assert r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False
          assert r['dms_scientific_access'] is False
          assert e['role']=='ENGINEERING_EQUIVALENCE_ONLY'
          assert e['scientific_changes'] is False
          assert e['gmn_2023_access'] is False
          assert e['sonotaco_access'] is False
          print('ENGINEERING_OUTPUT_NONAUTHORITATIVE_PENDING_ORIGINAL_EQUIVALENCE', r['verdict'])
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_recurrent_flow_tube_v1/run_development.py \
            orbittrace_recurrent_flow_tube_v1_engineering/run_development_cached.py \
            orbittrace_recurrent_flow_tube_v1_engineering/run_development_cached_memo.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            output/RFT_V1_GMN2022_DEVELOPMENT.json \
            output/rft_v1_gmn2022_candidates.json \
            output/ENGINEERING_CACHE_REPORT.json \
            > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/engineering_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-rft-v1-engineering-cache-gmn2022
          path: output
          if-no-files-found: error
          retention-days: 90
