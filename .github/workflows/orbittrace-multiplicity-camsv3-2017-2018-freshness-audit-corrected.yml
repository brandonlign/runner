name: OrbitTrace multiplicity CAMSv3 2017-2018 corrected repo freshness audit

on:
  pull_request:
    branches:
      - agent/orbittrace-multiplicity-camsv3-2017-2018-freshness-audit
    paths:
      - 'orbittrace_multiplicity_camsv3_2017_2018_freshness_audit/RUN2.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all remote branch refs
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Run corrected history-only audit
        run: |
          set -euo pipefail
          test ! -e input
          python orbittrace_multiplicity_camsv3_2017_2018_freshness_audit/audit_history_corrected.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/camsv3_2017_2018_repo_freshness_audit.json').read_text())
          assert r['verdict']=='PASS_CAMSV3_2017_2018_REPO_SCIENTIFIC_FRESHNESS_AUDIT'
          assert r['catalogue_access_this_audit'] is False
          assert r['scientific_value_access_this_audit'] is False
          assert r['label_access_this_audit'] is False
          assert r['target_information_access'] is False
          assert not r['targets']['2017']['potential_exposure_hits']
          assert not r['targets']['2018']['potential_exposure_hits']
          assert r['positive_controls']['2015_spent_detected'] is True
          assert r['positive_controls']['2016_spent_detected'] is True
          c17={h['classification'] for h in r['targets']['2017']['hits']}
          assert 'prior_freshness_audit_only' in c17
          assert 'range_excludes_target' in c17
          PY
      - name: Record correction provenance
        run: |
          set -euo pipefail
          git rev-parse HEAD > output/audit_commit.txt
          sha256sum \
            orbittrace_multiplicity_camsv3_2017_2018_freshness_audit/audit_history.py \
            orbittrace_multiplicity_camsv3_2017_2018_freshness_audit/audit_history_corrected.py \
            orbittrace_multiplicity_camsv3_2017_2018_freshness_audit/AUDIT_CORRECTION.md > output/audit_source_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-multiplicity-camsv3-2017-2018-freshness-audit-corrected
          path: output
          if-no-files-found: error
          retention-days: 90
