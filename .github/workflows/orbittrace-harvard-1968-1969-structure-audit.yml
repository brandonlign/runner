name: OrbitTrace Harvard 1968-1969 pre-scientific structure audit

on:
  pull_request:
    branches:
      - agent/orbittrace-harvard-1968-1969-structure-audit
    paths:
      - 'orbittrace_harvard_1968_1969_structure_audit/RUN.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out frozen Harvard structure parent
        uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-harvard-1968-1969-structure-audit
          fetch-depth: 1

      - name: Enforce frozen source
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_harvard_1968_1969_structure_audit/PROTOCOL.md)" = "65803b1b7d790108ab098217fdd031efcbc73f6f"
          test "$(git hash-object orbittrace_harvard_1968_1969_structure_audit/audit_structure.py)" = "d0048949c73984b852203747acc125a59fa3a465"
          python -m py_compile orbittrace_harvard_1968_1969_structure_audit/audit_structure.py

      - name: Fetch and verify Harvard freshness prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/freshness output
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9012163636/zip" \
            -o input/freshness.zip
          echo "7b4d3dcc4118af1a69089e083fb5cd0a55ed9d8d8bc901d9c7d27b665d9eb0f5  input/freshness.zip" | sha256sum -c -
          unzip -q input/freshness.zip -d input/freshness
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('input/freshness/harvard_1968_1969_repo_freshness_audit.json').read_text())
          assert r['verdict']=='PASS_HARVARD_1968_1969_REPO_SCIENTIFIC_FRESHNESS_AUDIT'
          assert r['potential_exposure_hit_count']==0
          assert r['positive_controls']['amor_external_history_detected'] is True
          assert r['positive_controls']['ukmon_external_history_detected'] is True
          assert r['catalogue_contacted'] is False
          assert r['scientific_record_access'] is False
          assert r['orbittrace_target_information_access'] is False
          PY

      - name: Run label-only Harvard structure audit
        run: |
          set -euo pipefail
          python orbittrace_harvard_1968_1969_structure_audit/audit_structure.py \
            --freshness-json input/freshness/harvard_1968_1969_repo_freshness_audit.json \
            --output output

      - name: Enforce pre-scientific boundary
        if: always()
        run: |
          set -euo pipefail
          test ! -e output/meteoroid.steel.orbits.zip
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/harvard_1968_1969_structure_audit.json')
          if p.exists():
              r=json.loads(p.read_text())
              assert r['target_member']['opened'] is False
              assert r['target_table_member_opened'] is False
              assert r['scientific_event_values_inspected'] is False
              assert r['scientific_event_values_persisted'] is False
              assert r['source_or_shower_labels_inspected'] is False
              assert r['method_evaluation_performed'] is False
              assert r['orbittrace_target_information_access'] is False
              assert all(not x.lower().endswith('/har6869.tab') and x.lower()!='har6869.tab' for x in r['opened_metadata_members'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/structure_audit_commit.txt
          sha256sum orbittrace_harvard_1968_1969_structure_audit/PROTOCOL.md orbittrace_harvard_1968_1969_structure_audit/audit_structure.py > output/source_sha256.txt
          sha256sum input/freshness.zip > output/freshness_artifact_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt

      - name: Upload structure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-harvard-1968-1969-structure-audit
          path: output
          if-no-files-found: error
          retention-days: 90
