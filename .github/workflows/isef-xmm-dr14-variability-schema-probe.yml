name: ISEF XMM DR14 variability schema probe
on:
  push:
    paths:
      - 'isef/xmm_dr14_variability_schema_probe.py'
      - '.github/workflows/isef-xmm-dr14-variability-schema-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'astropy>=7.1,<8'
      - run: timeout 300s python isef/xmm_dr14_variability_schema_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-xmm-dr14-variability-schema-probe
          path: results/xmm_dr14_variability_schema_probe.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY' >/tmp/r.md
          from pathlib import Path
          print('## DR14s variability schema probe')
          p=Path('results/xmm_dr14_variability_schema_probe.json')
          if p.exists(): print('```json\n'+p.read_text()[:50000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
