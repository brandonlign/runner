name: OrbitTrace P15 matched pretruth source reservation audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - orbittrace_support_safe_halo_p15/finalize_pretruth_checkpoint_p15.py
      - orbittrace_support_safe_halo_p15/generate_matched_pretruth_p15.py
      - orbittrace_support_safe_halo_p15/run_matched_pretruth_p15.sh
      - .github/workflows/orbittrace_p15_matched_pretruth.yml
      - .github/workflows/orbittrace_p15_matched_pretruth_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Reconstruct exact P15 matched source and audit generated pretruth shell without data
        run: |
          set -euo pipefail
          python -m py_compile orbittrace_support_safe_halo_p15/finalize_pretruth_checkpoint_p15.py orbittrace_support_safe_halo_p15/generate_matched_pretruth_p15.py
          bash -n orbittrace_support_safe_halo_p15/run_matched_pretruth_p15.sh
          test "$(git hash-object orbittrace_support_safe_halo_p15/run_matched_pretruth_p15.sh)" = '9f933631058c4dd5faf346857d9eaebeda3381a2'
          test "$(git hash-object .github/workflows/orbittrace_p15_matched_pretruth.yml)" = 'fc303f2f69d64ed3773a45a5645a3e2d02900023'

          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/p11.py
          echo '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9  /tmp/p11.py' | sha256sum -c -
          python orbittrace_drift_conditioned_p12/apply_p12_patch.py /tmp/p11.py /tmp/p12.py
          echo '78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32  /tmp/p12.py' | sha256sum -c -
          python orbittrace_core_halo_p13_literature/apply_p12_matched_transport_patch_v2.py /tmp/p12.py /tmp/p12_panel_v2.py
          echo 'f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae  /tmp/p12_panel_v2.py' | sha256sum -c -
          python orbittrace_support_safe_rank_p14/apply_p12_snm_id_transport_from_v2.py /tmp/p12_panel_v2.py /tmp/p12_panel_v3.py
          echo '55a1efed550498d51b859ffec555797ba8473d7d8b5f20ad6831c5f15b43b415  /tmp/p12_panel_v3.py' | sha256sum -c -
          python orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py /tmp/p12_panel_v3.py /tmp/p15_matched.py
          echo '23d309f6702ed0aa6769381963ea64701ae59c97376a0bae536b527fbc978fe6  /tmp/p15_matched.py' | sha256sum -c -
          python -m py_compile /tmp/p15_matched.py

          test "$(git hash-object orbittrace_core_halo_p13_literature/run_p13_matched_launcher_v3.sh)" = '1fb46484a51bb7d7edd60c865dcf5341550277a1'
          python orbittrace_support_safe_halo_p15/generate_matched_pretruth_p15.py orbittrace_core_halo_p13_literature/run_p13_matched_launcher_v3.sh /tmp/p15_pretruth.sh
          bash -n /tmp/p15_pretruth.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p15_pretruth.sh').read_text()
          required=(
            'PASS_P15_SUPPORT_SAFE_HALO_MATCHED_SOURCE_ACTIVE',
            '55a1efed550498d51b859ffec555797ba8473d7d8b5f20ad6831c5f15b43b415',
            '23d309f6702ed0aa6769381963ea64701ae59c97376a0bae536b527fbc978fe6',
            'apply_support_safe_halo_p15.py', '/tmp/finalize_p15_checkpoint.py',
            'p15_unavailable_direction_count', 'CHARACTERIZATION_UNAVAILABLE_INSUFFICIENT_NEGATIVES',
            'PASS_P15_BOTH_MATCHED_CHECKPOINTS_FROZEN_BEFORE_TRUTH_OR_CLUSTER_VALUES', 'exit 0',
          )
          for x in required: assert x in p,x
          for x in ('OPEN TRUTH + COMPETITOR CLUSTER VALUES EXACTLY ONCE','evaluate_frozen_blindsafe.py','finalize_p3_evaluator_result.py','OrbitTrace-April','target_coordinate'):
              assert x not in p,x
          assert p.count('python orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py /tmp/p12_panel_v3.py /tmp/p12_panel.py')==1
          assert p.count('python /tmp/finalize_p15_checkpoint.py')==1
          print('PASS_P15_MATCHED_PRETRUTH_GENERATED_SHELL_SOURCE_AUDIT')
          PY

          launch=orbittrace_support_safe_halo_p15/run_matched_pretruth_p15.sh
          wf=.github/workflows/orbittrace_p15_matched_pretruth.yml
          for x in \
            'EXECUTE_P15_MATCHED_PRETRUTH_AFTER_EXACT_DEVELOPMENT_PASS' \
            'PASS_SUPPORT_SAFE_SECONDARY_HALO_P15_DEVELOPMENT' \
            'p15_parent_p12_exact_json_identity' \
            'p15_fallback_vacuous_on_development' \
            'unavailable_directions' \
            'matched_truth_access' \
            'target_information_access' \
            '7e7cd5b26addb2bea8daef50ce6d86388521ea46' \
            'orbittrace-p15-support-safe-halo-development-v2'; do grep -F "$x" "$launch"; done
          grep -F 'orbittrace_support_safe_halo_p15/P15_MATCHED_PRETRUTH_RUN.md' "$wf"
          grep -F 'orbittrace-p15-matched-pretruth-checkpoints' "$wf"
          test ! -e orbittrace_support_safe_halo_p15/P15_MATCHED_PRETRUTH_RUN.md
          echo PASS_P15_MATCHED_PRETRUTH_ACTIVATION_SOURCE_FREEZE
          echo NO_COMPARATOR_DOWNLOAD_NO_ARCHIVE_NO_TRUTH_NO_EXTERNAL_NO_TARGET_ACCESS
