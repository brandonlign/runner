name: OrbitTrace M2D fixed4 drift halo final blind target v1

on:
  push:
    branches:
      - agent/orbittrace-m2d-fixed4-drift-halo-target-freeze-v1
    paths:
      - '.github/workflows/orbittrace_m2d_fixed4_drift_halo_final_target_v1.yml'
      - 'orbittrace_m2d_fixed4_drift_halo_v1/FINAL_BLIND_TARGET_PROTOCOL.md'
      - 'orbittrace_m2d_fixed4_drift_halo_v1/FINAL_TARGET_ACTIVATE.md'
      - 'orbittrace_m2d_fixed4_drift_halo_v1/build_final_target_pretruth.py'
      - 'orbittrace_m2d_fixed4_drift_halo_v1/reveal_final_target_exact_ids.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: orbittrace-m2d-fixed4-drift-halo-final-target-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-m2d-fixed4-drift-halo-target-freeze-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen source identities before any scientific input
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_fixed4_drift_halo_v1/FINAL_BLIND_TARGET_PROTOCOL.md)" = 'f435d306f118c32d718aa953952dabbcfc6619f2'
          test "$(git hash-object orbittrace_m2d_fixed4_drift_halo_v1/FINAL_TARGET_ACTIVATE.md)" = '29420b36c504602884f8ca2f6758485ca1842cbc'
          test "$(cat orbittrace_m2d_fixed4_drift_halo_v1/FINAL_TARGET_ACTIVATE.md)" = 'RUN_M2D_FIXED4_DRIFT_HALO_FINAL_TARGET_V1'
          test "$(git hash-object orbittrace_m2d_fixed4_drift_halo_v1/build_pretruth.py)" = '3d2d47c72f703a95713c4f17979f38a8aa3ac75c'
          test "$(git hash-object orbittrace_m2d_fixed4_drift_halo_v1/build_final_target_pretruth.py)" = 'a28cddb3900e285f85c7c8d02c291c53c4e93068'
          test "$(git hash-object orbittrace_m2d_fixed4_drift_halo_v1/reveal_final_target_exact_ids.py)" = '33925b5f32766779a8692511b67a216eceb983d0'
          test "$(git hash-object orbittrace_fixed4_blind_catalogue/source_parts/part00.b64)" = 'ed5c488fb4bf0ed5ae4b1c43f4cfb008501936e1'
          test "$(git hash-object orbittrace_fixed4_blind_catalogue/source_parts/part01.b64)" = '65b96befa5726581af74ad11d982fee18de0e4e7'
          test "$(git hash-object orbittrace_fixed4_blind_catalogue/source_parts/part02.b64)" = '04175711594c46d67cdb759cbee3a3e93819ce8d'
          test "$(git hash-object orbittrace_fixed4_blind_catalogue/source_parts/part03.b64)" = '2b890713e681f3b2372b29577cd66997dada8e07'
          python -m py_compile \
            orbittrace_m2d_fixed4_drift_halo_v1/build_pretruth.py \
            orbittrace_m2d_fixed4_drift_halo_v1/build_final_target_pretruth.py \
            orbittrace_m2d_fixed4_drift_halo_v1/reveal_final_target_exact_ids.py

      - name: Freeze this workflow-run identity before outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1403/comments" --paginate --jq '.[] | select(.body | contains("FINAL_TARGET_BINDING_RUN:")) | .body' | head -n 1 || true)"
          if test -z "$existing"; then
            cat > /tmp/binding.md <<EOF
          ### Binding final blind target execution identity frozen before outcome

          FINAL_TARGET_BINDING_RUN: \`${GITHUB_RUN_ID}\`

          This is the first activation of the fully frozen PR #1403 execution source on head \`${GITHUB_SHA}\`. If technically valid, its Stage-B PASS/PARTIAL/FAIL is binding. A technical no-result may authorize only provenance/transport repair under the unchanged protocol; later duplicates are confirmation-only.
          EOF
            gh pr comment 1403 --repo "$GITHUB_REPOSITORY" --body-file /tmp/binding.md
            echo 'FINAL_TARGET_BINDING_CANDIDATE=true' >> "$GITHUB_ENV"
          else
            echo "$existing"
            echo 'FINAL_TARGET_BINDING_CANDIDATE=false' >> "$GITHUB_ENV"
          fi

      - name: Install the exact frozen scientific runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip >/dev/null
          rm -rf frozen-v8 frozen-seed input output
          mkdir -p input/ranker input/v8 input/v3 input/gmn input/sonotaco input/baseline output/final-target/pretruth output/final-target/reveal

          git clone -q --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" frozen-v8
          git -C frozen-v8 fetch -q --no-tags --depth=1 origin c9d6c44704013ba0c9430100e98a29a56b453304
          git -C frozen-v8 checkout -q FETCH_HEAD
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'

          git clone -q --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" frozen-seed
          git -C frozen-seed fetch -q --no-tags --depth=1 origin agent/orbittrace-m2d-fixed4-consensus-core-v1
          git -C frozen-seed checkout -q FETCH_HEAD
          test "$(git -C frozen-seed hash-object orbittrace_m2d_fixed4_consensus_core_v1/build_pretruth.py)" = '140f21736ea6615fe111e02d91eaa99b19422da7'

          python -m pip install --disable-pip-version-check -r frozen-v8/ghoststream_fixed4_application/requirements.txt >/dev/null
          python -m pip install --disable-pip-version-check --no-deps gmn-python-api==0.0.13 >/dev/null
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0' >/dev/null

          git -C frozen-v8 fetch -q --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'

          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
          test -s /tmp/run_wavelet_catalogue_v3_development.py

      - name: Require exact binding GMN and SonotaCo PASS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 32315704010 --repo "$GITHUB_REPOSITORY" --name orbittrace-m2d-fixed4-drift-halo-v1-binding --dir input/gmn
          test "$(sha256sum input/gmn/pretruth/M2D_FIXED4_DRIFT_HALO_V1_PRETRUTH.json | cut -d' ' -f1)" = '3e0af5135a1c3562ccdc25be25f1ed89480b62f541c8c8d0de159dcb084ef9a8'
          test "$(sha256sum input/gmn/truth/M2D_FIXED4_DRIFT_HALO_V1_RESULT.json | cut -d' ' -f1)" = 'a3903c2c2d1a6e46ea8400d12ca24b7570bad302da67ef489ce1f9a5c76fff63'

          gh run download 32316491432 --repo "$GITHUB_REPOSITORY" --name orbittrace-m2d-fixed4-drift-halo-v1-sonotaco-transfer --dir input/sonotaco
          test "$(sha256sum input/sonotaco/pretruth/M2D_FIXED4_DRIFT_HALO_V1_SONOTACO_PRETRUTH.json | cut -d' ' -f1)" = 'f16838fc5d7750dff3f969c53a5b27074f5578d30a19c1b03ec5d1ae8359b913'
          test "$(sha256sum input/sonotaco/truth/M2D_FIXED4_DRIFT_HALO_V1_SONOTACO_RESULT.json | cut -d' ' -f1)" = '29cebf43d35077405587a66bf78b53cc9c0edbdfe9d8134191e8d6a15fde1ef7'

          python - <<'PY'
          import json
          g=json.load(open('input/gmn/truth/M2D_FIXED4_DRIFT_HALO_V1_RESULT.json'))
          s=json.load(open('input/sonotaco/truth/M2D_FIXED4_DRIFT_HALO_V1_SONOTACO_RESULT.json'))
          assert g['verdict']=='PASS_M2D_FIXED4_DRIFT_HALO_V1_GMN_DEVELOPMENT'
          assert all(g['gates'].values())
          assert s['verdict']=='PASS_M2D_FIXED4_DRIFT_HALO_V1_SONOTACO_TRANSFER'
          print('EXACT_GMN_AND_SONOTACO_PASS_AUTHORIZATION_VERIFIED')
          PY

      - name: Retrieve exact already-blind 8,469-candidate M2D ranking
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e input/canonical.zip
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9376585923/zip" \
            -o input/baseline/pretruth.zip
          echo '177f17af4d74d6f75a2cb29b80a05261d65eaa09e64dbdeacaaf17a5e2222a85  input/baseline/pretruth.zip' | sha256sum -c -
          python - <<'PY'
          import gzip,hashlib,zipfile
          from pathlib import Path
          with zipfile.ZipFile('input/baseline/pretruth.zip') as z:
              hits=[n for n in z.namelist() if Path(n).name=='orbittrace_m2d_blind_ranked_pretruth.json.gz']
              ledgers=[n for n in z.namelist() if Path(n).name=='ranked_payload_sha256.txt']
              assert len(hits)==1 and len(ledgers)==1,(hits,ledgers)
              gz=z.read(hits[0]); ledger=z.read(ledgers[0]).decode()
          assert hashlib.sha256(gz).hexdigest()=='6d72b0f9558b89228953dd73b3760c61df039b713f233473079ae4fac563a100'
          assert hashlib.sha256(gzip.decompress(gz)).hexdigest()=='7ff3b13bc45e19b4b886453b4d8cc3b4f18090bf8a2291e39850540fd69b5e53'
          assert '7ff3b13bc45e19b4b886453b4d8cc3b4f18090bf8a2291e39850540fd69b5e53' in ledger
          Path('input/baseline/orbittrace_m2d_blind_ranked_pretruth.json.gz').write_bytes(gz)
          Path('input/baseline/ranked_payload_sha256.txt').write_text(ledger)
          print('FROZEN_8469_BASELINE_VERIFIED')
          PY

      - name: Retrieve exact generic fixed4 runtime inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e input/canonical.zip
          gh run download 31344632499 --repo "$GITHUB_REPOSITORY" --name orbittrace-active-urc-ranker-source-export-v1 --dir input/ranker
          gh run download 31217916558 --repo "$GITHUB_REPOSITORY" --name orbittrace-pooled-year-centroid-v8-development --dir input/v8
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Stage A - build every frozen halo with target reference absent
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          set -euo pipefail
          test ! -e input/canonical.zip
          python -u orbittrace_m2d_fixed4_drift_halo_v1/build_final_target_pretruth.py \
            --baseline-pretruth input/baseline/orbittrace_m2d_blind_ranked_pretruth.json.gz \
            --blind-source-parts orbittrace_fixed4_blind_catalogue/source_parts \
            --method-source orbittrace_m2d_fixed4_drift_halo_v1/build_pretruth.py \
            --seed-source frozen-seed/orbittrace_m2d_fixed4_consensus_core_v1/build_pretruth.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --scratch-loader input/decoded_blind_catalogue_loader.py \
            --output output/final-target/pretruth/M2D_FIXED4_DRIFT_HALO_V1_FINAL_TARGET_PRETRUTH.json
          sha256sum output/final-target/pretruth/M2D_FIXED4_DRIFT_HALO_V1_FINAL_TARGET_PRETRUTH.json > output/final-target/pretruth/STAGE_A_SHA256.txt
          git rev-parse HEAD > output/final-target/pretruth/execution_commit.txt
          python - <<'PY'
          import json
          p='output/final-target/pretruth/M2D_FIXED4_DRIFT_HALO_V1_FINAL_TARGET_PRETRUTH.json'
          r=json.load(open(p))
          assert r['candidate_count']==len(r['halos'])==8469
          assert [x['rank'] for x in r['halos']]==list(range(1,8470))
          assert r['target_reference_access'] is False
          assert r['target_information_used'] is False
          assert r['target_coordinates_accessed'] is False
          assert r['canonical_target_ids_accessed'] is False
          assert r['prior_target_reveal_artifact_accessed'] is False
          assert r['target_aware_parent_selection'] is False
          assert r['reranking_used'] is False and r['family_merge_used'] is False
          assert r['post_result_parameter_search'] is False
          print('STAGE_A_COMPLETE_AND_SEALED')
          print(json.dumps(r['summary'],sort_keys=True))
          PY
          test ! -e input/canonical.zip

      - name: Upload immutable Stage-A pre-reveal seal
        id: stage_a_upload
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-m2d-fixed4-drift-halo-final-target-pretruth-v1
          path: output/final-target/pretruth
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Retrieve canonical target IDs only after Stage-A artifact exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s output/final-target/pretruth/STAGE_A_SHA256.txt
          test -n '${{ steps.stage_a_upload.outputs.artifact-id }}'
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8814798136/zip" \
            -o input/canonical.zip
          echo '716b70313465d5df4bfb092a85a81680e6f618606b71e25470c63c480b6449f5  input/canonical.zip' | sha256sum -c -

      - name: Stage B - exact trajectory-ID reveal only
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_fixed4_drift_halo_v1/reveal_final_target_exact_ids.py \
            --stage-a output/final-target/pretruth/M2D_FIXED4_DRIFT_HALO_V1_FINAL_TARGET_PRETRUTH.json \
            --stage-a-sha256 output/final-target/pretruth/STAGE_A_SHA256.txt \
            --canonical-zip input/canonical.zip \
            --output output/final-target/reveal/M2D_FIXED4_DRIFT_HALO_V1_FINAL_TARGET_REVEAL.json
          python - <<'PY'
          import json
          p='output/final-target/reveal/M2D_FIXED4_DRIFT_HALO_V1_FINAL_TARGET_REVEAL.json'
          r=json.load(open(p))
          assert r['verdict'] in {
              'CLEAN_M2D_FIXED4_DRIFT_HALO_ORBITTRACE_REDISCOVERY',
              'PARTIAL_M2D_FIXED4_DRIFT_HALO_ORBITTRACE_RECOVERY',
              'NO_M2D_FIXED4_DRIFT_HALO_ORBITTRACE_RECOVERY',
          }
          assert r['reveal_operation']=='exact trajectory-ID set intersection only against already-frozen parent/seed/halo memberships'
          assert r['membership_recomputed_after_reveal'] is False
          assert r['parent_switched_after_reveal'] is False
          assert r['family_merge_used'] is False
          assert r['reranking_used'] is False
          assert r['parameter_tuning_after_reveal'] is False
          assert r['second_reveal_authorized'] is False
          print('FINAL_BINDING_VERDICT',r['verdict'])
          print('SELECTED',r['selected_candidate'])
          PY

      - name: Preserve final provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/final-target/execution_commit.txt
          python --version > output/final-target/python_version.txt
          python -m pip freeze > output/final-target/environment.txt
          sha256sum \
            orbittrace_m2d_fixed4_drift_halo_v1/FINAL_BLIND_TARGET_PROTOCOL.md \
            orbittrace_m2d_fixed4_drift_halo_v1/build_pretruth.py \
            orbittrace_m2d_fixed4_drift_halo_v1/build_final_target_pretruth.py \
            orbittrace_m2d_fixed4_drift_halo_v1/reveal_final_target_exact_ids.py \
            input/baseline/orbittrace_m2d_blind_ranked_pretruth.json.gz \
            output/final-target/pretruth/M2D_FIXED4_DRIFT_HALO_V1_FINAL_TARGET_PRETRUTH.json \
            output/final-target/reveal/M2D_FIXED4_DRIFT_HALO_V1_FINAL_TARGET_REVEAL.json \
            > output/final-target/SHA256SUMS.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-fixed4-drift-halo-final-target-v1
          path: output/final-target
          if-no-files-found: error
          retention-days: 90

      - name: Post final binding target result to PR 1403
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### PR #1403 final blind target application"
            echo
            echo "Workflow run: \`${GITHUB_RUN_ID}\`; head: \`${GITHUB_SHA}\`."
            echo
            cat output/final-target/reveal/FINAL_BLIND_TARGET_REVEAL.md
          } > /tmp/final.md
          gh pr comment 1403 --repo "$GITHUB_REPOSITORY" --body-file /tmp/final.md

      - name: Record technical no-result without changing science
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1403 --repo "$GITHUB_REPOSITORY" --body "PR #1403 final blind target workflow \`${GITHUB_RUN_ID}\` ended technically before a valid Stage-B scientific verdict. The preregistered method, rank order, thresholds, target gate, and no-rescue rule remain unchanged." || true
