name: Conditional-flow sporadic-null screening

on:
  pull_request:
    branches:
      - main
    paths:
      - conditional_flow_null_stage0/**
      - .github/workflows/conditional_flow_null_screen.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: conditional-flow-null-stage0
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_ARTIFACT_ID: '8871850235'
      DATA_ARTIFACT_SHA256: '5f2501b3eee19b51a5dc81f8493dce67a810ef5c480045dac143de060369534d'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conditional-flow-null-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: conditional_flow_null_stage0/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r conditional_flow_null_stage0/requirements.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download exact authorized data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p conditional_flow_null_stage0/input conditional_flow_null_stage0/results
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DATA_ARTIFACT_ID}/zip" \
            -o conditional_flow_null_stage0/input/data.zip
          echo "${DATA_ARTIFACT_SHA256}  conditional_flow_null_stage0/input/data.zip" | sha256sum -c -
          unzip -q conditional_flow_null_stage0/input/data.zip -d conditional_flow_null_stage0/input/data
          test -s conditional_flow_null_stage0/input/data/selected_events.jsonl.gz
      - name: Compile verified launcher
        run: python -m py_compile conditional_flow_null_stage0/run_screen.py
      - name: Run frozen two-year screening
        run: |
          python conditional_flow_null_stage0/run_screen.py \
            --events conditional_flow_null_stage0/input/data/selected_events.jsonl.gz \
            --output conditional_flow_null_stage0/results
      - name: Record provenance
        run: |
          sha256sum \
            conditional_flow_null_stage0/run_screen.py \
            conditional_flow_null_stage0/run_screen.py.gz.b64 \
            conditional_flow_null_stage0/PROTOCOL.md \
            > conditional_flow_null_stage0/results/source_sha256.txt
          sha256sum conditional_flow_null_stage0/input/data/selected_events.jsonl.gz > conditional_flow_null_stage0/results/input_sha256.txt
          python --version > conditional_flow_null_stage0/results/python_version.txt
          python -m pip freeze > conditional_flow_null_stage0/results/environment.txt
      - name: Upload screening evidence
        uses: actions/upload-artifact@v4
        with:
          name: conditional-flow-null-screen
          path: conditional_flow_null_stage0/results
          if-no-files-found: error
          retention-days: 90
