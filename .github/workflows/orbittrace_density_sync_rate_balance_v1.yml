name: OrbitTrace density-sync rate-balance GMN v1

on:
  push:
    branches:
      - agent/orbittrace-density-sync-rate-balance-v1
    paths:
      - '.github/workflows/orbittrace_density_sync_rate_balance_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  development:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and pin sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/v8 input/ranker input/parent output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          cp frozen-v8/orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py input/v3/wavelet_episode_comparator.py
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_density_sync_rate_balance_v1/PROTOCOL.md)" = '3fa26d7eb2893f7a21d7172d45bb419c32792d24'
          test "$(git hash-object orbittrace_density_sync_rate_balance_v1/rate_balance.py)" = '56e9420506d5dc504a34babb43f28bdbbc62e758'
          test "$(git hash-object orbittrace_density_sync_rate_balance_v1/audit_synthetic.py)" = '4461acf7ccd8257ba87d9e0485a131115176ba42'
          test "$(git hash-object orbittrace_density_sync_rate_balance_v1/run_development.py)" = '588d88f25d545bf570fffbc970af86618af8943a'
          python -m py_compile input/v3/multi_anchor_energy_v3.py input/v3/wavelet_episode_comparator.py orbittrace_density_sync_rate_balance_v1/*.py orbittrace_recurrent_eom_hdbscan_v1/run_development.py

      - name: Run zero-truth rate-balance audit
        env:
          PYTHONPATH: orbittrace_density_sync_rate_balance_v1
        run: |
          set -euo pipefail
          python orbittrace_density_sync_rate_balance_v1/audit_synthetic.py | tee output/RATE_BALANCE_SYNTHETIC_AUDIT.json
          grep -q PASS_DENSITY_SYNC_RATE_BALANCE_V1_SYNTHETIC_AUDIT output/RATE_BALANCE_SYNTHETIC_AUDIT.json

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify GMN runtime utility
        run: test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Verify runtime-support artifact
        run: test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852836840
      - name: Verify exact #1263 binding evidence
        run: |
          set -euo pipefail
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json | cut -d' ' -f1)" = 'efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = 'ca6aeed2b82739003ea5d39b59e869df876de2962164344a938fe4935ea38711'

      - name: Run first binding rate-balance GMN outcome
        env:
          PYTHONPATH: input/ranker:input/v3:.:orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_sync_rate_balance_v1:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_density_sync_rate_balance_v1/run_development.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --parent-prelabel-json input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --parent-result-json input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce result/firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('output/DENSITY_SYNC_RATE_BALANCE_V1_PRELABEL.json'))
          r=json.load(open('output/DENSITY_SYNC_RATE_BALANCE_V1_GMN_DEVELOPMENT.json'))
          assert r['verdict'] in {'PASS_DENSITY_SYNC_RATE_BALANCE_V1_GMN_DEVELOPMENT','FAIL_DENSITY_SYNC_RATE_BALANCE_V1_GMN_DEVELOPMENT'}
          assert p['candidate_count']==r['candidate_count']==2094
          assert p['membership_universe_identical'] is True and r['membership_universe_identical'] is True
          assert r['required_total_recovered_at_100_gain']==2
          assert p['blind_exclusion']==r['blind_exclusion']==[20.0,55.0]
          for x in (p,r):
              assert x['target_information_access'] is False
              assert x['target_region_events_accessed'] is False
              assert x['sonotaco_2013_2014_access'] is False
              assert x['amos_access'] is False
              assert x['maarsy_scientific_access'] is False
              assert x['dms_scientific_access'] is False
          print(r['verdict'], 'gain=', r['total_recovered_at_100_gain'])
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_density_sync_rate_balance_v1/PROTOCOL.md orbittrace_density_sync_rate_balance_v1/rate_balance.py orbittrace_density_sync_rate_balance_v1/audit_synthetic.py orbittrace_density_sync_rate_balance_v1/run_development.py input/ranker/run_urc_union_ranker.py input/v8/pooled_year_centroid_v8_development.json input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json output/RATE_BALANCE_SYNTHETIC_AUDIT.json output/DENSITY_SYNC_RATE_BALANCE_V1_PRELABEL.json output/DENSITY_SYNC_RATE_BALANCE_V1_GMN_DEVELOPMENT.json > output/provenance_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-density-sync-rate-balance-v1-gmn-development
          path: output
          if-no-files-found: error
          retention-days: 90
