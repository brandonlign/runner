name: OrbitTrace v6 SonotaCo corrected transfer source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-sonotaco-2017-2019-transfer-freeze
    paths:
      - orbittrace_v6_sonotaco_2017_2019_transfer/AUDIT_CORRECTED.md

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Require one-file audit child
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          test "$files" = 'orbittrace_v6_sonotaco_2017_2019_transfer/AUDIT_CORRECTED.md'
          content="$(gh api "repos/$GITHUB_REPOSITORY/contents/orbittrace_v6_sonotaco_2017_2019_transfer/AUDIT_CORRECTED.md?ref=$HEAD_SHA" --jq .content | tr -d '\n' | base64 --decode)"
          test "$content" = 'AUDIT_PROTOCOL_EXACT_TRANSFER_SOURCES_ONLY'

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-sonotaco-2017-2019-transfer-freeze

      - name: Download exact parser sources only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source17 source19
          gh run download 31199214174 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2015-2017-parser-transport --dir source17
          gh run download 31203088669 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2019-parser-transport --dir source19
          echo 'ee81d66b318ed2fa473ddfcee4c1cea0ef8ba08cba33da47103fd7c53ee625dc  source17/run_sonotaco_2017_transport_parser.py' | sha256sum -c -
          echo '301a711e4de43566ba434f2d4a94fc38a85714a33dcee45e26cb19340101ea43  source19/run_sonotaco_2019_transport_parser.py' | sha256sum -c -

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6

      - name: Reconstruct exact repaired catalogue-v6 source
        run: |
          set -euo pipefail
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.frozen.py' | sha256sum -c -
          python - <<'PY'
          import hashlib
          from pathlib import Path
          text=Path('/tmp/v6.frozen.py').read_text()
          before='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    components = primary_components + rescue_components
'''
          after='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    primary_components = component_records_track_v6(old, year, primary_capped, event_lookup, base, "v3")
    rescue_components = component_records_track_v6(old, year, rescue_capped, event_lookup, base, "fixed4_rescue")
    components = primary_components + rescue_components
'''
          assert text.count(before)==1
          repaired=text.replace(before,after,1)
          assert repaired.replace(after,before,1)==text
          Path('/tmp/v6.repaired.py').write_text(repaired)
          assert hashlib.sha256(repaired.encode()).hexdigest()=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          PY
          python -m py_compile /tmp/v6.repaired.py

      - name: Run consolidated corrected audit
        run: |
          set -euo pipefail
          python -m py_compile \
            orbittrace_v6_sonotaco_2017_2019_transfer/parser_transport.py \
            orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer.py \
            orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer_portable.py \
            orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer_corrected.py \
            orbittrace_v6_sonotaco_2017_2019_transfer/parallel_exact_rescore.py \
            orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer_frozen.py \
            orbittrace_v6_sonotaco_2017_2019_transfer/audit_frozen_sources.py
          python orbittrace_v6_sonotaco_2017_2019_transfer/audit_frozen_sources.py \
            --parser-2017 source17/run_sonotaco_2017_transport_parser.py \
            --parser-2019 source19/run_sonotaco_2019_transport_parser.py \
            --repaired-v6 /tmp/v6.repaired.py \
            --corrected-runner orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer_corrected.py \
            --parallel-wrapper orbittrace_v6_sonotaco_2017_2019_transfer/parallel_exact_rescore.py \
            --entry orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer_frozen.py

      - name: Assert source-only firewall
        if: always()
        run: |
          test ! -e archive
          test ! -e input
          test ! -e output
          echo NO_SONOTACO_ARCHIVE_NO_LABEL_VALUE_NO_TARGET_REGION_NO_ORBITTRACE_TARGET
