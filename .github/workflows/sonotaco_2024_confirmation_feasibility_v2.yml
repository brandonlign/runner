name: SonotaCo 2024 confirmation feasibility v2

on:
  pull_request:
    branches:
      - agent/sonotaco-2025-mondrian-feasibility
    paths:
      - .github/workflows/sonotaco_2024_confirmation_feasibility_v2.yml
      - sonotaco_2024_confirmation_v2/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonotaco-2024-confirmation-feasibility-v2
  cancel-in-progress: true

jobs:
  parser-v2-data-only-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sonotaco-2024-confirmation-feasibility-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and hash frozen parser before download
        run: |
          set -euo pipefail
          python -m py_compile sonotaco_2024_confirmation_v2/audit_sonotaco_2024_v2.py
          echo 'd3f9c99bb64b6458a8637bc308bc84ba9d00d83258fa1383a1d73a0865dd072b  sonotaco_2024_confirmation_v2/audit_sonotaco_2024_v2.py' | sha256sum -c -
          sha256sum sonotaco_2024_confirmation_v2/FEASIBILITY_PROTOCOL.md
      - name: Download exact pinned official archive
        run: |
          set -euo pipefail
          mkdir -p input output
          curl --fail --location --retry 3 \
            --output input/024a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/024a.zip
          test -s input/024a.zip
          echo '409bb958c6f114e542d818e7c4fcf7a58d89b2fb33090a442c8087bdcaa1540f  input/024a.zip' | sha256sum -c -
      - name: Run frozen parser-v2 data-only audit
        run: |
          set -euo pipefail
          python sonotaco_2024_confirmation_v2/audit_sonotaco_2024_v2.py \
            --archive input/024a.zip \
            --output output
          cat output/SONOTACO_2024_FEASIBILITY_V2.md
      - name: Enforce frozen continuation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/sonotaco_2024_feasibility_v2.json').read_text())
          print(json.dumps({'gates': result['gates'], 'verdict': result['verdict']}, indent=2))
          if not all(result['gates'].values()):
              raise SystemExit('Frozen SonotaCo 2024 parser-v2 feasibility gate failed')
          PY
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            sonotaco_2024_confirmation_v2/FEASIBILITY_PROTOCOL.md \
            sonotaco_2024_confirmation_v2/audit_sonotaco_2024_v2.py \
            input/024a.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
      - name: Upload frozen feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonotaco-2024-confirmation-feasibility-v2
          path: output
          if-no-files-found: error
          retention-days: 90
