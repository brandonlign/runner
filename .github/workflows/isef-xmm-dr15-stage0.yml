name: ISEF 5XMM-DR15 Stage 0
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_dr15_stage0.py'
      - '.github/workflows/isef-xmm-dr15-stage0.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  stage0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8'
      - name: Run catalog-only probe
        id: probe
        continue-on-error: true
        run: python isef/xmm_dr15_stage0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-dr15-stage0
          path: results/xmm_dr15_stage0.json
          if-no-files-found: warn
      - name: Report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', OUTCOME: '${{ steps.probe.outcome }}'}
        run: |
          python - <<'PY' > /tmp/report.md
          import json,os
          from pathlib import Path
          print('## 5XMM-DR15 catalog-only Stage 0')
          print('Outcome:',f"`{os.environ.get('OUTCOME')}`")
          p=Path('results/xmm_dr15_stage0.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:60000]+'\n```')
          else: print('_result not produced_')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
