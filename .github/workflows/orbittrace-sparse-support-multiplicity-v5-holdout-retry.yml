name: OrbitTrace sparse-support multiplicity v5 holdout retry

on:
  pull_request:
    branches:
      - agent/orbittrace-sparse-support-multiplicity-v5
    paths:
      - 'orbittrace_sparse_support_multiplicity_v5/**'
      - '.github/workflows/orbittrace-sparse-support-multiplicity-v5-holdout-retry.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: orbittrace_wavelet_catalogue_v3:orbittrace_sparse_support_multiplicity_v5:input/v3

jobs:
  holdout:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out corrected frozen v5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-sparse-support-multiplicity-v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Enforce unchanged protocol/core and corrected loader before data access
        run: |
          set -euo pipefail
          mkdir -p input/v3 input/support_audit input/factorization output
          test "$(git hash-object orbittrace_sparse_support_multiplicity_v5/PROTOCOL.md)" = "4184e71fec172ded90866ff8689cf46416794a57"
          test "$(git hash-object orbittrace_sparse_support_multiplicity_v5/run_holdout.py)" = "0136cb1603c947070947d1754bc83910b76415b9"
          test "$(git hash-object orbittrace_sparse_support_multiplicity_v5/run_holdout_loader_corrected.py)" = "c6dadb21009a8859b9376b490590f26ff8df46a6"
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"
          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"
          test "$(git hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = "493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8"
          python -m py_compile \
            input/v3/multi_anchor_energy_v3.py \
            orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py \
            orbittrace_sparse_support_multiplicity_v5/run_holdout.py \
            orbittrace_sparse_support_multiplicity_v5/run_holdout_loader_corrected.py
          rm -rf output/*
          echo PASS_MULTIPLICITY_V5_UNCHANGED_PROTOCOL_CORE_AND_LOADER_CORRECTION

      - name: Fetch exact source-only loader audit before data access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 31195349735 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-multiplicity-v5-source-audit \
            --dir input/support_audit
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('input/support_audit/support_source_audit.json').read_text())
          assert result['verdict'] == 'PASS_MULTIPLICITY_V5_SUPPORT_SOURCE_AUDIT'
          assert result['catalogue_access'] is False
          assert result['target_information_access'] is False
          assert result['support_sha256'] == 'fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62'
          assert result['runtime_sha256'] == 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          c = result['constants']
          assert c['YEARS'] == [2022, 2023, 2024, 2025]
          assert c['CORPUS'] == 'gmn-known-shower-wrapper-development-2022-2025-excluding-sol20-55'
          assert c['RANKING_VARIANTS'] == [
              'persistence', 'mean_year_strength', 'sqrt_support_strength',
              'min_year_strength', 'size_penalized_strength'
          ]
          assert c['BLIND_LOW'] == 20.0 and c['BLIND_HIGH'] == 55.0
          assert c['CALIBRATION_PER_BIN'] == 128
          assert c['SHORTLIST_K'] == 64 and c['AUDIT_SHORTLIST_K'] == 128
          assert c['MIN_ANCHOR_COUNT'] == 2 and c['MAX_QUARTETS_PER_BIN'] == 512
          assert c['MIN_COMPONENT_EVENTS'] == 4 and c['MIN_COMPONENT_QUARTETS'] == 2
          assert c['MIN_FAMILY_YEARS'] == 2 and c['FAMILY_LINK_RADIUS'] == 1.5
          rc = result['runtime_constants']
          assert rc['YEARS'] == [2022, 2023]
          assert rc['CORPUS'] == 'gmn-wavelet-catalogue-v3-development-2022-2023-excluding-sol20-55'
          loader = Path('input/support_audit/runtime_load_support_module.py').read_text()
          assert 'module.CORPUS = CORPUS' in loader
          assert 'module.RANKING_VARIANTS = ("wavelet_recurrence",)' in loader
          print('PASS_MULTIPLICITY_V5_EXACT_SOURCE_ONLY_LOADER_AUDIT')
          PY

      - name: Fetch exact frozen factorization evidence before data access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 31193870638 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-v3-factorization-diagnostic \
            --dir input/factorization
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('input/factorization/v3_factorization_diagnostic.json').read_text())
          assert result['verdict'] == 'V3_NON_BROWN_TERM_RETAINS_EXPLORATORY_RANKING_SIGNAL'
          assert result['blindness']['catalogue_access'] is False
          assert result['blindness']['later_year_access'] is False
          assert result['blindness']['orbittrace_target_access'] is False
          assert result['evaluations']['multiplicity']['recovered_at_100'] == 60
          assert result['evaluations']['brown']['recovered_at_100'] == 54
          assert result['evaluations']['fixed4']['recovered_at_100'] == 61
          print('PASS_MULTIPLICITY_V5_FACTORIZATION_GUARD')
          PY

      - name: Run preregistered target-excluded 2020-2021 holdout
        run: |
          set -euo pipefail
          python orbittrace_sparse_support_multiplicity_v5/run_holdout_loader_corrected.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --source-audit-json input/support_audit/support_source_audit.json \
            --factorization-json input/factorization/v3_factorization_diagnostic.json \
            --output output
          cat output/MULTIPLICITY_V5_HOLDOUT.md

      - name: Enforce result integrity and claim boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/multiplicity_v5_holdout.json').read_text())
          assert result['verdict'] in {
              'PASS_MULTIPLICITY_V5_TARGET_EXCLUDED_HOLDOUT',
              'FAIL_MULTIPLICITY_V5_TARGET_EXCLUDED_HOLDOUT',
              'INCONCLUSIVE_MULTIPLICITY_V5_HOLDOUT_POWER',
              'FAIL_MULTIPLICITY_V5_HOLDOUT_INTEGRITY',
          }
          cfg = result['configuration']
          assert cfg['years'] == [2020, 2021]
          assert cfg['month_keys'] == [f'{y}-{m:02d}' for y in (2020, 2021) for m in range(1, 13)]
          assert cfg['blind_exclusion'] == [20.0, 55.0]
          assert cfg['no_multiplicity_pvalue'] is True
          assert cfg['no_rrf'] is True
          assert cfg['no_threshold_search'] is True
          assert cfg['no_weight_search'] is True
          assert 'No event with solar longitude 20-55 degrees' in result['claim_boundary']
          print('ORBITTRACE_MULTIPLICITY_V5_HOLDOUT_RESULT_BEGIN')
          print(json.dumps({
              'verdict': result['verdict'],
              'family_count': result['family_count'],
              'metrics': result['metrics'],
              'correlations': result['correlations'],
              'top100_overlaps': result['top100_overlaps'],
              'validity_gates': result['validity_gates'],
              'scientific_gates': result['scientific_gates'],
              'required_multiplicity_recovery_vs_fixed4': result['required_multiplicity_recovery_vs_fixed4'],
          }, indent=2, sort_keys=True))
          print('ORBITTRACE_MULTIPLICITY_V5_HOLDOUT_RESULT_END')
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/v5_retry_commit.txt
          sha256sum \
            orbittrace_sparse_support_multiplicity_v5/PROTOCOL.md \
            orbittrace_sparse_support_multiplicity_v5/IMPLEMENTATION_CORRECTION.md \
            orbittrace_sparse_support_multiplicity_v5/run_holdout.py \
            orbittrace_sparse_support_multiplicity_v5/run_holdout_loader_corrected.py \
            input/v3/multi_anchor_energy_v3.py \
            orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py \
            input/support_audit/support_source_audit.json \
            input/factorization/v3_factorization_diagnostic.json \
            > output/v5_retry_source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload v5 holdout artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-sparse-support-multiplicity-v5-holdout-retry
          path: output
          if-no-files-found: error
          retention-days: 90
