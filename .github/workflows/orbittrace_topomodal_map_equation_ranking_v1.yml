name: OrbitTrace topomodal map equation ranking v1

on:
  push:
    branches:
      - agent/orbittrace-topomodal-map-equation-ranking-v1
    paths:
      - '.github/workflows/orbittrace_topomodal_map_equation_ranking_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  map-equation-ranking:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/v3 input/v8 input/ranker input/structural output

          test "$(git hash-object orbittrace_topomodal_map_equation_ranking_v1/PROTOCOL.md)" = '11cd2401c9f159041b8e5f60cc4f12c32e85e349'
          test "$(git hash-object orbittrace_topomodal_map_equation_ranking_v1/generate_prelabel.py)" = 'b22d4dae399bd6fea1331f393fbaa5adb4d93214'
          test "$(git hash-object orbittrace_topomodal_map_equation_ranking_v1/evaluate_prelabel.py)" = '616ce1aaa7bbcfed23edaec7c42f471006184c49'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile \
            orbittrace_topomodal_map_equation_ranking_v1/generate_prelabel.py \
            orbittrace_topomodal_map_equation_ranking_v1/evaluate_prelabel.py

          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'

          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

          python - <<'PY'
          import importlib.metadata
          import numpy
          assert numpy.__version__ == '2.1.3', numpy.__version__
          assert importlib.metadata.version('gudhi') == '3.12.0'
          print('numpy', numpy.__version__)
          print('gudhi', importlib.metadata.version('gudhi'))
          PY

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify frozen GMN runtime utility
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify frozen GMN support artifact
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-hierarchy-scale-v1
          path: input/structural
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31955621864

      - name: Verify authoritative pretruth structural result
        run: |
          set -euo pipefail
          test "$(sha256sum input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json | cut -d' ' -f1)" = 'e8cf7d92e96db9a1c99578f6efc63baf1534b94ab975e94f789fa6bc4a718497'
          python - <<'PY'
          import json
          r=json.load(open('input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json'))
          assert r['scientific_role']=='ZERO_LABEL_STRUCTURAL_DIAGNOSTIC_ONLY'
          assert r['interpretation']=='SUPPORTS_FIXED_SCALE_TOPOMODAL_HIERARCHY_CROSS_SCALE_COHERENCE'
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['shower_truth_used'] is False
          PY

      - name: Generate and freeze map-equation prelabel
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_topomodal_map_equation_ranking_v1/generate_prelabel.py \
            --structural-runner orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --structural-result-json input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Verify immutable prelabel before truth
        run: |
          set -euo pipefail
          sha256sum output/TOPOMODAL_MAP_EQUATION_RANKING_V1_PRELABEL.json | cut -d' ' -f1 > output/prelabel_sha256.txt
          python - <<'PY'
          import hashlib, json, math
          path='output/TOPOMODAL_MAP_EQUATION_RANKING_V1_PRELABEL.json'
          raw=open(path,'rb').read()
          digest=hashlib.sha256(raw).hexdigest()
          recorded=open('output/prelabel_sha256.txt').read().strip()
          assert digest==recorded
          p=json.loads(raw)
          assert p['schema']=='ORBITTRACE_TOPOMODAL_MAP_EQUATION_RANKING_V1_PRELABEL'
          assert p['scientific_role']=='PRELABEL_TOPOMODAL_MAP_EQUATION_RANKING_V1'
          assert len(p['subsets'])==8
          assert {(int(x['denominator']),int(x['bucket'])) for x in p['subsets']}=={(d,b) for d in (128,1024) for b in range(4)}
          assert p['structural_source_run_id']==31955621864 and p['structural_source_artifact_id']==9265889512
          assert p['structural_result_sha256']=='e8cf7d92e96db9a1c99578f6efc63baf1534b94ab975e94f789fa6bc4a718497'
          c=p['configuration']
          assert c['score']=='binary_two_level_map_equation_compression_gain_L1_minus_L2'
          assert c['ranking']=='compression_gain_desc_then_family_hash_asc'
          assert c['teleportation'] is False
          assert p['blind_exclusion']==[20.0,55.0]
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert p['shower_truth_used'] is False
          assert p['sonotaco_2013_2014_access'] is False
          assert p['asfn_event_level_access'] is False and p['efn_event_level_access'] is False
          assert p['amos_scientific_access'] is False and p['maarsy_scientific_access'] is False and p['dms_scientific_access'] is False
          assert p['method_parameter_selection_from_result'] is False
          for s in p['subsets']:
              topo=s['topomodal_candidates']
              recurrent=s['recurrent_candidates']
              assert len(topo)>=len(recurrent)
              assert [int(r['rank']) for r in topo]==list(range(1,len(topo)+1))
              assert [int(r['rank']) for r in recurrent]==list(range(1,len(recurrent)+1))
              assert all(math.isfinite(float(r[k])) for r in topo for k in ('compression_gain','l1','l2','pi_c','q_c'))
              assert [r['family_id'] for r in topo]==[r['family_id'] for r in sorted(topo,key=lambda r:(-float(r['compression_gain']),str(r['family_hash'])))]
          print('immutable_prelabel_sha256',digest)
          PY

      - name: Evaluate immutable prelabel against shower truth
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_topomodal_map_equation_ranking_v1/evaluate_prelabel.py \
            --prelabel output/TOPOMODAL_MAP_EQUATION_RANKING_V1_PRELABEL.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce frozen scientific contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          pre='output/TOPOMODAL_MAP_EQUATION_RANKING_V1_PRELABEL.json'
          result='output/TOPOMODAL_MAP_EQUATION_RANKING_V1.json'
          digest=hashlib.sha256(open(pre,'rb').read()).hexdigest()
          assert digest==open('output/prelabel_sha256.txt').read().strip()
          r=json.load(open(result))
          assert r['verdict'] in {'PASS_TOPOMODAL_MAP_EQUATION_RANKING_V1','FAIL_TOPOMODAL_MAP_EQUATION_RANKING_V1'}
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_SPARSE_RECOVERY_DEVELOPMENT'
          assert r['prelabel_sha256']==digest
          assert r['structural_source_run_id']==31955621864 and r['structural_source_artifact_id']==9265889512
          assert r['structural_result_sha256']=='e8cf7d92e96db9a1c99578f6efc63baf1534b94ab975e94f789fa6bc4a718497'
          assert len(r['panels'])==16
          assert sum(int(p['denominator'])==128 for p in r['panels'])==8
          assert sum(int(p['denominator'])==1024 for p in r['panels'])==8
          assert set(r['scale_aggregates'])=={'128','1024'}
          assert len(r['gates'])==10 and all(isinstance(v,bool) for v in r['gates'].values())
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_2013_2014_access'] is False
          assert r['asfn_event_level_access'] is False and r['efn_event_level_access'] is False
          assert r['amos_scientific_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['method_parameter_selection_from_result'] is False
          print(r['verdict'])
          print('prelabel_sha256',digest)
          print(json.dumps({'scales':r['scale_aggregates'],'gates':r['gates']},indent=2,sort_keys=True))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_topomodal_map_equation_ranking_v1/PROTOCOL.md \
            orbittrace_topomodal_map_equation_ranking_v1/generate_prelabel.py \
            orbittrace_topomodal_map_equation_ranking_v1/evaluate_prelabel.py \
            orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json \
            output/TOPOMODAL_MAP_EQUATION_RANKING_V1_PRELABEL.json \
            output/TOPOMODAL_MAP_EQUATION_RANKING_V1.json \
            > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-topomodal-map-equation-ranking-v1
          path: output
          if-no-files-found: error
          retention-days: 90
