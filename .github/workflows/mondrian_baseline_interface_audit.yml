name: Mondrian baseline interface audit

on:
  pull_request:
    branches:
      - agent/mondrian-clique-coverage-normalized-development
    paths:
      - .github/workflows/mondrian_baseline_interface_audit.yml
      - mondrian_scorer_interface_audit/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mondrian-baseline-interface-audit
  cancel-in-progress: true

jobs:
  no-score-baseline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mondrian-scorer-interface-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode exact baseline and inspect interface
        run: |
          set -euo pipefail
          mkdir -p baseline_output
          python - <<'PY'
          import ast
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          payload = Path('real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64')
          encoded = ''.join(payload.read_text().split())
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = '7718ac5229475f4240305ad9c1e073c49702c771df36612d9be5baa877b46a50'
          if digest != expected:
              raise RuntimeError(f'baseline source mismatch: {digest}')
          source_path = Path('baseline_output/run_baseline_ceiling.py')
          source_path.write_bytes(source)

          tree = ast.parse(source.decode('utf-8'))
          classes = []
          functions = []
          constants = {}
          for node in tree.body:
              if isinstance(node, ast.ClassDef):
                  classes.append({
                      'name': node.name,
                      'lineno': node.lineno,
                      'methods': [item.name for item in node.body if isinstance(item, ast.FunctionDef)],
                  })
              elif isinstance(node, ast.FunctionDef):
                  functions.append({'name': node.name, 'signature': ast.unparse(node.args), 'lineno': node.lineno})
              elif isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  try:
                      constants[node.targets[0].id] = ast.literal_eval(node.value)
                  except Exception:
                      pass
          interface = {
              'source_sha256': digest,
              'source_bytes': len(source),
              'constants': constants,
              'classes': classes,
              'functions': functions,
          }
          Path('baseline_output/interface.json').write_text(json.dumps(interface, indent=2, sort_keys=True))
          Path('baseline_output/BASELINE_AUDIT.md').write_text(
              '# Baseline source audit\n\n'
              f'- SHA-256: `{digest}`\n'
              f'- bytes: **{len(source):,}**\n'
              f'- classes: **{len(classes)}**\n'
              f'- functions: **{len(functions)}**\n'
              '- scientific scores computed: **0**\n'
          )
          print(json.dumps(interface, indent=2, sort_keys=True))
          PY
          python -m py_compile baseline_output/run_baseline_ceiling.py
      - name: Record provenance
        run: |
          sha256sum \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            baseline_output/run_baseline_ceiling.py \
            > baseline_output/source_sha256.txt
          python --version > baseline_output/python_version.txt
      - name: Upload exact baseline audit
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-baseline-interface-audit
          path: baseline_output
          if-no-files-found: error
          retention-days: 90
