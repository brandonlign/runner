name: ISEF Oyashio GC anchor identification
on:
  push:
    branches: [main]
    paths: ['isef/OYASHIO_GC_ANCHOR_IDENTIFICATION_TRIGGER']
  workflow_dispatch:
jobs:
  identify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy astropy astroquery scikit-image requests
      - run: |
          python -m py_compile isef/matlas_oyashio_blind_detector_pilot.py isef/oyashio_gc_anchor_identification.py
          cd isef
          python oyashio_gc_anchor_identification.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-oyashio-gc-anchor-identification
          path: isef/results/oyashio_gc_anchor_identification/report.json
          if-no-files-found: error
