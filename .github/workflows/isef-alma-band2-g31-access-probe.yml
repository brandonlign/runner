name: ISEF ALMA Band 2 G31 access-only probe
on:
  push:
    paths:
      - 'isef/alma_band2_g31_access_probe.py'
      - '.github/workflows/isef-alma-band2-g31-access-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: timeout 240s python isef/alma_band2_g31_access_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-alma-band2-g31-access-probe
          path: results/alma_band2_g31_access_probe.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## ALMA Band 2 G31 access-only probe'; echo '```json'; cat results/alma_band2_g31_access_probe.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
