name: ISEF NGC1427A MUSE access probe fast
on:
  push:
    paths:
      - 'isef/ngc1427a_muse_access_probe_fast.py'
      - '.github/workflows/isef-ngc1427a-muse-access-probe-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: timeout 60s python isef/ngc1427a_muse_access_probe_fast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-ngc1427a-muse-access-probe-fast
          path: results/ngc1427a_muse_access_probe_fast.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## NGC1427A MUSE fast access probe'; echo '```json'; cat results/ngc1427a_muse_access_probe_fast.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
