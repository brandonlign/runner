name: OrbitTrace fresh 2014/2016 history audit source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - .github/workflows/orbittrace_fresh_2014_2016_history_exposure_audit.yml
      - .github/workflows/orbittrace_fresh_2014_2016_history_exposure_audit_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify history audit exhaustively enumerates metadata locally and cannot access reserved scientific data
        run: |
          set -euo pipefail
          w=.github/workflows/orbittrace_fresh_2014_2016_history_exposure_audit.yml
          for x in \
            'AUDIT_PRE_RESERVATION_SONOTACO_2014_2016_EXPOSURE' \
            "cutoff='2026-08-09T21:32:20Z'" \
            "'+refs/pull/*/head:refs/remotes/pull-heads/*'" \
            '014a\.zip' '016a\.zip' \
            'gh api --method GET --paginate --slurp "repos/$REPO/issues?state=all&per_page=100"' \
            'gh api --method GET --paginate --slurp "repos/$REPO/issues/comments?per_page=100&sort=created&direction=asc"' \
            'gh api --method GET --paginate --slurp "repos/$REPO/pulls/comments?per_page=100&sort=created&direction=asc"' \
            'gh api --method GET --paginate --slurp "repos/$REPO/pulls?state=all&per_page=100&sort=created&direction=asc"' \
            'gh api --method GET --paginate --slurp "repos/$REPO/pulls/$n/reviews?per_page=100"' \
            "if int(x['number'])<792" \
            "if n>=792: continue" \
            "if not m or int(m.group(1))>=792: continue" \
            "'issues_or_pr_bodies':0" \
            "'issue_comments':0" \
            "'inline_review_comments':0" \
            "'review_summaries':0" \
            'PASS_FRESH_SONOTACO_2014_2016_PREACCESS_HISTORY_AUDIT' \
            "'archive_accessed':False" \
            "'event_values_accessed':False" \
            "'known_shower_truth_accessed':False" \
            "'comparator_cluster_values_accessed':False" \
            "'target_information_access':False"; do
            grep -F "$x" "$w"
          done
          # The checkout action may create refs/remotes/pull/<n>/merge. PR heads must not use that parent namespace.
          if grep -Fq "'+refs/pull/*/head:refs/remotes/pull/*'" "$w"; then
            echo 'conflicting PR-head ref namespace survived in history audit' >&2
            exit 1
          fi
          # The flaky Search API is retired completely; all matching happens locally.
          if grep -Eq 'search/issues|api\.github\.com/search|gh search' "$w"; then
            echo 'GitHub Search API surface survived in v4 history audit' >&2
            exit 1
          fi
          # Network is limited to Git/GitHub repository metadata/history. No scientific archive or comparator artifact download surface.
          for forbidden in \
            'astro.sk/iaumdcDB/public/data' 'actions/artifacts/' \
            'evaluate_frozen' 'literature_comparators.py' \
            'gmn-python-api' 'data_directory' \
            'target_coordinate' 'OrbitTrace-April'; do
            if grep -Fq "$forbidden" "$w"; then echo "scientific-data/target surface in history audit: $forbidden" >&2; exit 1; fi
          done
          # No write permissions/commands; this is read-only provenance checking.
          if grep -Eq 'contents: write|issues: write|pull-requests: write|gh pr comment|gh issue comment' "$w"; then
            echo 'write surface leaked into history audit' >&2
            exit 1
          fi
          test ! -e orbittrace_post_p18_fresh_matched/HISTORY_AUDIT_RUN.md
          echo PASS_FRESH_2014_2016_HISTORY_AUDIT_REF_NAMESPACE_REPAIR_SOURCE_FREEZE
          echo GIT_GITHUB_METADATA_ONLY_NO_RESERVED_SCIENTIFIC_DATA_ACCESS
