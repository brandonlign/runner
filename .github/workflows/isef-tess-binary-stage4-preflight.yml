name: ISEF TESS binary Stage-4 frozen preflight
on:
  push:
    branches: [main]
    paths:
      - 'isef/TESS_BINARY_STAGE4_PREFLIGHT_TRIGGER'
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy scipy astropy requests
      - name: Verify frozen code
        run: |
          test "$(git hash-object isef/tess_binary_stage4_frozen.py)" = "93ea1c2a1ac0b9f93b1992c9241c629d7a0ce192"
          test "$(git hash-object isef/tess_binary_stage0_detector.py)" = "1552c535f592667ffc06e6171050c77944531ee3"
          python -m py_compile isef/tess_binary_stage0_detector.py isef/tess_binary_stage4_frozen.py isef/tess_binary_stage4_preflight.py
      - name: Run exact consumed-data preflight
        run: |
          cd isef
          python tess_binary_stage4_preflight.py
      - name: Preserve preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-tess-binary-stage4-preflight
          path: isef/results/tess_binary_stage4_preflight/
          if-no-files-found: warn
