name: ISEF 5XMM anonymous census
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_dr15_anonymous_census.py'
      - '.github/workflows/isef-xmm-dr15-anonymous-census.yml'
permissions:
  contents: read
  issues: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'astropy>=7.1,<8'
      - name: Anonymous server-side census
        id: census
        continue-on-error: true
        run: timeout 600s python isef/xmm_dr15_anonymous_census.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-dr15-anonymous-census
          path: results/xmm_dr15_anonymous_census.json
          if-no-files-found: warn
      - name: Report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', OUTCOME: '${{ steps.census.outcome }}'}
        run: |
          python - <<'PY' >/tmp/report.md
          import json,os
          from pathlib import Path
          print('## 5XMM old-era anonymous census')
          print('Outcome:',os.environ.get('OUTCOME'))
          p=Path('results/xmm_dr15_anonymous_census.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:50000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
