name: OrbitTrace recurrent-EOM support attribution v1

on:
  push:
    branches:
      - agent/orbittrace-recurrent-eom-support-attribution-v1
    paths:
      - '.github/workflows/orbittrace_recurrent_eom_support_attribution_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/v8 input/ranker input/scale output

          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'

          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_recurrent_eom_support_attribution_v1/PROTOCOL.md)" = '8d4f855376e2246f3354ff3fe7c24bb89db20492'
          test "$(git hash-object orbittrace_recurrent_eom_support_attribution_v1/run_diagnostic.py)" = '0618956aa4fca6421769f00c6fcd51d87b0f5ab8'

          python -m py_compile \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_recurrent_eom_support_attribution_v1/run_diagnostic.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify frozen GMN runtime utility
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify frozen GMN support artifact
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-eom-scale-stress-v1
          path: input/scale
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31929171717

      - name: Verify binding scale-stress result
        run: |
          set -euo pipefail
          test "$(sha256sum input/scale/RECURRENT_EOM_SCALE_STRESS_V1.json | cut -d' ' -f1)" = '0c6926aa84d9b88f19f5bb2817b2846b53d09579dbef6b5c4d9c9bb9fd252288'

      - name: Run first complete support-attribution diagnostic
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_eom_support_attribution_v1/run_diagnostic.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --scale-result-json input/scale/RECURRENT_EOM_SCALE_STRESS_V1.json \
            --output output

      - name: Enforce frozen attribution contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/RECURRENT_EOM_SUPPORT_ATTRIBUTION_V1.json'))
          assert r['scientific_role']=='ZERO_LABEL_STRUCTURAL_DIAGNOSTIC_ONLY'
          assert r['attribution'] in {
              'CONDENSATION_DOMINANT_INERTIA',
              'CORE_SMOOTHING_DOMINANT_INERTIA',
              'EITHER_SINGLE_ABLATION_SUFFICIENT',
              'JOINT_SUPPORT_BOTTLENECK',
              'MIXED_SUPPORT_ATTRIBUTION',
          }
          assert len(r['subsets'])==8
          assert len(r['configurations'])==4
          assert len(r['all_fits'])==32
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['target_information_access'] is False
          assert r['target_region_events_accessed'] is False
          assert r['shower_truth_used'] is False
          assert r['sonotaco_2013_2014_access'] is False
          assert r['asfn_event_level_access'] is False
          assert r['efn_event_level_access'] is False
          assert r['amos_scientific_access'] is False
          assert r['maarsy_scientific_access'] is False
          assert r['dms_scientific_access'] is False
          assert r['method_parameter_selection_from_result'] is False
          assert r['intermediate_support_values_tested'] is False
          print(r['attribution'])
          print(json.dumps(r['activation_summary'], indent=2, sort_keys=True))
          PY

      - name: Preserve exact provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_recurrent_eom_support_attribution_v1/PROTOCOL.md \
            orbittrace_recurrent_eom_support_attribution_v1/run_diagnostic.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            input/scale/RECURRENT_EOM_SCALE_STRESS_V1.json \
            output/RECURRENT_EOM_SUPPORT_ATTRIBUTION_V1.json \
            > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-support-attribution-v1
          path: output
          if-no-files-found: error
          retention-days: 90
