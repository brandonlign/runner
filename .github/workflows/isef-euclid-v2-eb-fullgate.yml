name: ISEF Euclid v2 OGLE EB full gate
on:
  push:
    branches: [main]
    paths:
      - 'isef/euclid_v2_ogle_eb_fullgate.py'
      - '.github/workflows/isef-euclid-v2-eb-fullgate.yml'
permissions:
  contents: read
  issues: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'photutils>=2.2'
      - name: Frozen OGLE EB positive-control gate
        id: gate
        continue-on-error: true
        run: timeout 780s python isef/euclid_v2_ogle_eb_fullgate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-euclid-v2-eb-fullgate
          path: results/euclid_v2_ogle_eb_fullgate.json
          if-no-files-found: warn
      - name: Report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', OUTCOME: '${{ steps.gate.outcome }}'}
        run: |
          python - <<'PY' > /tmp/v2ebgate.md
          import json,os
          from pathlib import Path
          print('## Euclid v2 frozen OGLE EB positive-control gate')
          print(f"outcome: `{os.environ.get('OUTCOME')}`")
          p=Path('results/euclid_v2_ogle_eb_fullgate.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:60000]+'\n```')
          else: print('_artifact not produced_')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v2ebgate.md
