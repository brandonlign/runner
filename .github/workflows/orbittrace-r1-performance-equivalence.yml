name: OrbitTrace R1 exact performance equivalence

on:
  pull_request:
    branches:
      - agent/orbittrace-recurrent-core-expansion-r1
    paths:
      - 'orbittrace_recurrent_core_expansion_r1/PERFORMANCE_EQUIVALENCE_TRIGGER.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-r1-performance-equivalence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  equivalence:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce frozen parent and diagnostic-only scope
        env:
          EXPECTED_BASE: 2bb52fed75133a3cb163e64d0d9937e60a7b5d76
          ACTUAL_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$ACTUAL_BASE" = "$EXPECTED_BASE"
          test -f orbittrace_recurrent_core_expansion_r1/optimize_exact_expansion.py
          test -f orbittrace_recurrent_core_expansion_r1/fix_performance_wrapper.py
          test -f orbittrace_recurrent_core_expansion_r1/fix_schema_wrapper_regex.py
          test -f orbittrace_recurrent_core_expansion_r1/run_schemafixed_execution.sh
          echo PASS_R1_PERFORMANCE_EQUIVALENCE_SCOPE_GUARD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Run bounded exact-equivalence proof only
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
          R1_EQUIVALENCE_ONLY: '1'
          R1_EQUIVALENCE_SAMPLE_FAMILIES: '8'
        run: |
          set -euo pipefail
          mkdir -p output
          python orbittrace_recurrent_core_expansion_r1/fix_schema_wrapper_regex.py
          python orbittrace_recurrent_core_expansion_r1/fix_performance_wrapper.py
          set +e
          bash orbittrace_recurrent_core_expansion_r1/run_schemafixed_execution.sh
          code=$?
          set -e
          test "$code" -eq 42
          test -f output/PASS_R1_BOUNDED_EXACT_EQUIVALENCE.txt
          cat output/PASS_R1_BOUNDED_EXACT_EQUIVALENCE.txt
          echo PASS_R1_PERFORMANCE_EQUIVALENCE_DIAGNOSTIC_ONLY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-r1-performance-equivalence
          path: output
          if-no-files-found: warn
          retention-days: 90
