name: OrbitTrace v8 MAARSY documentation-only member read

on:
  pull_request:
    branches:
      - agent/orbittrace-v8-maarsy-documentation-read
    paths:
      - 'orbittrace_v8_maarsy_2016_2023_preaccess/RUN_STAGE0D_DOCUMENTATION_READ.md'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out frozen Stage-0D parent
        uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v8-maarsy-documentation-read
          fetch-depth: 1

      - name: Enforce documentation-only protocol
        run: |
          set -euo pipefail
          test -f orbittrace_v8_maarsy_2016_2023_preaccess/STAGE0D_DOCUMENTATION_READ.md
          mkdir -p input output

      - name: Establish public anonymous RADAR session and download exact outer tar
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -A 'OrbitTrace-preaccess-documentation-audit/1.0' \
            -c input/cookies.txt \
            'https://www.radar-service.eu/radar/en/dataset/yk29t2gu0h4jhkjg' \
            -o input/landing.html
          grep -F 'RADAR_SESSION_ID' input/cookies.txt >/dev/null
          curl -L --fail --retry 3 -b input/cookies.txt \
            'https://www.radar-service.eu/radar-backend/archives/yk29t2gu0h4jhkjg/versions/1/content' \
            -o input/dataset.tar
          test "$(stat -c '%s' input/dataset.tar)" = '10686464'
          echo 'a064c43c1b82dae8a5a214a4a1faa271  input/dataset.tar' | md5sum -c -
          echo '64c18431aece658f0a0ebae5a3bdb58215b3a3abbadf114d1898c2768271d460  input/dataset.tar' | sha256sum -c -

      - name: Open only exact whitelisted documentation members
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,tarfile

          allowed={
            '10.22000-yk29t2gu0h4jhkjg/data/readme.txt':1689,
            '10.22000-yk29t2gu0h4jhkjg/data/technical-md/dataset.tech_md.xml':625,
            '10.22000-yk29t2gu0h4jhkjg/data/dataset/README_HuyghebaertAMT2025.txt':684,
            '10.22000-yk29t2gu0h4jhkjg/manifest-md5.txt':293,
            '10.22000-yk29t2gu0h4jhkjg/bag-info.txt':106,
          }
          forbidden='10.22000-yk29t2gu0h4jhkjg/data/dataset/HuyghebaertAMT2025.zip'
          docs={}
          opened=[]
          with tarfile.open('input/dataset.tar',mode='r:') as tf:
              members={m.name:m for m in tf.getmembers()}
              if forbidden not in members or members[forbidden].size!=10669057:
                  raise RuntimeError('nested dataset ZIP header changed')
              for name,size in allowed.items():
                  m=members.get(name)
                  if m is None or not m.isfile() or m.size!=size:
                      raise RuntimeError(f'whitelisted documentation member changed: {name}')
              for name in allowed:
                  f=tf.extractfile(members[name])
                  if f is None:
                      raise RuntimeError(f'cannot open documentary member: {name}')
                  raw=f.read()
                  if len(raw)!=allowed[name]:
                      raise RuntimeError(f'documentary member size changed while reading: {name}')
                  docs[name]={
                      'sha256':hashlib.sha256(raw).hexdigest(),
                      'text':raw.decode('utf-8',errors='replace')
                  }
                  opened.append(name)
          result={
            'schema':'orbittrace-v8-maarsy-stage0d-documentation-v1',
            'opened_members':opened,
            'documents':docs,
            'nested_dataset_zip_opened':False,
            'nested_dataset_zip_listed':False,
            'event_row_access':False,
            'scientific_value_access':False,
            'v8_scientific_evaluation_performed':False,
            'target_information_access':False,
          }
          Path('output/documentation.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
          rm -f input/dataset.tar input/cookies.txt input/landing.html

      - name: Enforce nested dataset remains unopened
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/documentation.json').read_text())
          assert r['nested_dataset_zip_opened'] is False
          assert r['nested_dataset_zip_listed'] is False
          assert r['event_row_access'] is False
          assert r['scientific_value_access'] is False
          assert r['target_information_access'] is False
          Path('output/result.json').write_text(json.dumps({
            'verdict':'PASS_MAARSY_DOCUMENTATION_ONLY_READ',
            'opened_document_count':len(r['opened_members']),
            'nested_dataset_zip_opened':False,
            'event_row_access':False,
            'scientific_value_access':False,
            'target_information_access':False,
            'next_step':'adjudicate author documentation and freeze any nested-ZIP structural/schema access before opening it'
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload documentation-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v8-maarsy-stage0d-documentation-only
          path: output
          if-no-files-found: error
          retention-days: 90
