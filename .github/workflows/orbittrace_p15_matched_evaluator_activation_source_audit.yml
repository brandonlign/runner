name: OrbitTrace P15 matched evaluator activation source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - orbittrace_support_safe_halo_p15/run_matched_evaluator_activation.py
      - .github/workflows/orbittrace_p15_matched_evaluator_activation.yml
      - .github/workflows/orbittrace_p15_matched_evaluator_activation_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit exact merged wrappers and one-time truth-opening order without data
        run: |
          set -euo pipefail
          python -m py_compile orbittrace_support_safe_halo_p15/run_matched_evaluator_activation.py
          test "$(git hash-object orbittrace_support_safe_halo_p15/run_matched_evaluator_activation.py)" = '4ad6041a9589bf30d07151dea8ed3f0fa447d63f'
          test "$(git hash-object .github/workflows/orbittrace_p15_matched_evaluator_activation.yml)" = '957d1a8c63010bf25baf39dfcb0a3f766ac14778'
          test "$(git hash-object orbittrace_support_safe_halo_p15/validate_p15_pretruth_checkpoints.py)" = 'd8653b898ca8c106d79df01c855783797294c30c'
          test "$(git hash-object orbittrace_support_safe_halo_p15/finalize_p15_matched_result.py)" = '17e446565aa324e3de374246abc5a0693fc8467b'
          test "$(git hash-object orbittrace_support_safe_rank_p14/prepare_transport_compatible_p13_finalizer.py)" = 'ee932b83ad63d10fb81c5b8c85bb151c4467f8f7'
          test "$(git hash-object orbittrace_support_safe_rank_p14/finalize_p14_matched_result_transport_v3.py)" = '1e9160c7beb5bc7651dc2b9f03db6211bc639ac6'
          test "$(git hash-object orbittrace_core_halo_p13_literature/finalize_p3_evaluator_result.py)" = 'a5d812b9956742b51e7e3995a71eb308afa7d095'
          test "$(git hash-object orbittrace_core_halo_p13_literature/finalize_p14_matched_result.py)" = 'd1ce98f443b2039d70421e76dadb6ada77d1b0d5'
          python - <<'PY'
          from pathlib import Path
          p=Path('orbittrace_support_safe_halo_p15/run_matched_evaluator_activation.py').read_text()
          required=(
            'EXECUTE_P15_MATCHED_EVALUATOR_AFTER_BOTH_PRETRUTH_CHECKPOINTS',
            'orbittrace-p15-support-safe-halo-development-v2',
            'orbittrace-p15-matched-pretruth-checkpoints',
            'PASS_SUPPORT_SAFE_SECONDARY_HALO_P15_DEVELOPMENT',
            'p15_parent_p12_exact_json_identity',
            'p15_fallback_vacuous_on_development',
            'validate_p15_pretruth_checkpoints.py',
            'PASS_P15_MATCHED_EVALUATOR_PREREQUISITES_FROZEN_BEFORE_TRUTH',
            'OPEN_MATCHED_TRUTH_AND_COMPETITOR_CLUSTER_VALUES_EXACTLY_ONCE',
            'evaluate_frozen_blindsafe.py',
            'prepare_transport_compatible_p13_finalizer.py',
            'finalize_p14_matched_result_transport_v3.py',
            'finalize_p15_matched_result.py',
            'PASS_P15_MATCHED_SPARSE_SUPERIORITY_BOTH_COMPARATORS_BOTH_YEARS',
            'FAIL_P15_MATCHED_SPARSE_SUPERIORITY_NO_GO',
            "result['target_access_authorized'] is False",
            'p15_matched_execution_provenance.json',
          )
          for x in required: assert x in p,x
          assert p.count("print('OPEN_MATCHED_TRUTH_AND_COMPETITOR_CLUSTER_VALUES_EXACTLY_ONCE'")==1
          assert p.count("'input/evaluator/evaluate_frozen_blindsafe.py'")==1
          assert p.index('PASS_P15_MATCHED_EVALUATOR_PREREQUISITES_FROZEN_BEFORE_TRUTH') < p.index('OPEN_MATCHED_TRUTH_AND_COMPETITOR_CLUSTER_VALUES_EXACTLY_ONCE')
          assert p.index("'validate_p15_pretruth_checkpoints.py'") < p.index('OPEN_MATCHED_TRUTH_AND_COMPETITOR_CLUSTER_VALUES_EXACTLY_ONCE')
          for x in ('OrbitTrace-April','target_coordinate'):
              assert x not in p,x
          # All comparator artifacts and archives are exact-ID/hash pinned before the one evaluator call.
          for x in ('9012424187','8955917326','8957940764','8957263372','9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430','f4eb716a4b900658fcc658a633d918eca28946f59da75935f1fd5f6bc539bf52'):
              assert x in p,x
          print('PASS_P15_MATCHED_EVALUATOR_ACTIVATION_SOURCE_ORDER')
          PY
          grep -F 'orbittrace_support_safe_halo_p15/P15_MATCHED_EVALUATOR_RUN.md' .github/workflows/orbittrace_p15_matched_evaluator_activation.yml
          grep -F 'orbittrace-p15-matched-literature-result' .github/workflows/orbittrace_p15_matched_evaluator_activation.yml
          test ! -e orbittrace_support_safe_halo_p15/P15_MATCHED_EVALUATOR_RUN.md
          echo PASS_P15_MATCHED_EVALUATOR_ACTIVATION_SOURCE_AUDIT
          echo NO_COMPARATOR_ARTIFACT_NO_TRUTH_NO_EXTERNAL_NO_TARGET_ACCESS
