name: ISEF Rubin MPC prospective TNO extreme screen

on:
  push:
    branches: [main]
    paths:
      - 'isef/RUBIN_MPC_TNO_EXTREME_SCREEN_TRIGGER'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MPC query dependency
        run: pip install requests
      - name: Compile and run frozen public-orbit screen
        run: |
          python -m py_compile isef/rubin_mpc_tno_extreme_screen.py
          cd isef
          python rubin_mpc_tno_extreme_screen.py
      - name: Preserve complete screen result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-rubin-mpc-tno-extreme-screen
          path: isef/results/rubin_mpc_tno_extreme_screen/report.json
          if-no-files-found: error
