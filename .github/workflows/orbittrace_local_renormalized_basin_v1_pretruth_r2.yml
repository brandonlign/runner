name: OrbitTrace local renormalized basin v1 pretruth r2

on:
  pull_request:
    branches: [agent/orbittrace-m2d-support-pruned-cut-v1]
    paths:
      - orbittrace_local_renormalized_basin_v1/**
      - .github/workflows/orbittrace_local_renormalized_basin_v1_pretruth_r2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-lrb-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install runtime and verify frozen scientific sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          test "$(git hash-object orbittrace_local_renormalized_basin_v1/PROTOCOL.md)" = '8f483b49b0b21160cb27a3b6c0808adce7aa84f9'
          test "$(git hash-object orbittrace_local_renormalized_basin_v1/local_renormalized_basin.py)" = '7304190f56b09d3f8fc4c5a87a65a497950378f8'
          test "$(git hash-object orbittrace_local_renormalized_basin_v1/generate_prelabel.py)" = 'e480e56dfdec7bfc71a99882cd8b0a7575530207'
          test "$(git hash-object orbittrace_local_renormalized_basin_v1/rank_m2d.py)" = 'd4a9cd93fbaf37dbb4081fa9c3f2ca5b51f75088'
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/support_pruned_cut.py)" = '3712a36033088f1bd486cefdc8dc474c194fc85c'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_local_renormalized_basin_v1/local_renormalized_basin.py orbittrace_local_renormalized_basin_v1/generate_prelabel.py orbittrace_local_renormalized_basin_v1/rank_m2d.py
          mkdir -p input/v3 input/v8 input/ranker input/bif input/support-pruned output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '31344632499'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '31217916558'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-annual-density-bifiltration-gmn-ranking-v1-prelabel
          path: input/bif
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32037435314'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-pretruth-r2
          path: input/support-pruned
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32285788062'

      - name: Verify immutable label-free inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json | cut -d' ' -f1)" = '95f8a57718a30b2c7e85016d505276d72cccb9e4ac1d6eb29f13067efc73dd0c'
          test "$(sha256sum input/support-pruned/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json | cut -d' ' -f1)" = '57a6fd0fa680fb56b3d6a8a984682213e0235baadf14b27f241927b2dbb4b50f'

      - name: Generate target-excluded local refinement
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_local_renormalized_basin_v1/generate_prelabel.py \
            --structural-runner orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --support-pruned-pretruth input/support-pruned/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json \
            --output output

      - name: Rank with unchanged M2D
        run: |
          set -euo pipefail
          python -u orbittrace_local_renormalized_basin_v1/rank_m2d.py \
            --lrb-prelabel output/LOCAL_RENORMALIZED_BASIN_V1_PRELABEL.json \
            --bif-prelabel input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json \
            --support-pruned-pretruth input/support-pruned/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json \
            --output output/LOCAL_RENORMALIZED_BASIN_V1_PRETRUTH.json

      - name: Seal before truth
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='output/LOCAL_RENORMALIZED_BASIN_V1_PRETRUTH.json'; raw=open(p,'rb').read(); h=hashlib.sha256(raw).hexdigest(); r=json.loads(raw)
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_LRB_V1_M2D_RANKING_FROZEN_BEFORE_TRUTH'
          assert r['shower_truth_used'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False and r['sonotaco_scientific_access'] is False
          assert r['configuration']['new_tuned_parameters']==[] and r['configuration']['local_passes']==1
          assert len(r['subsets'])==8 and r['mechanism_summary']['replaced_parent_count']>0
          open('output/PRETRUTH_SHA256.txt','w').write(h+'  LOCAL_RENORMALIZED_BASIN_V1_PRETRUTH.json\n')
          print('LRB_V1_PRETRUTH_SHA256='+h)
          print(json.dumps(r['mechanism_summary'],sort_keys=True))
          print(json.dumps(r['size_summary'],sort_keys=True))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/pretruth_execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum orbittrace_local_renormalized_basin_v1/PROTOCOL.md orbittrace_local_renormalized_basin_v1/local_renormalized_basin.py orbittrace_local_renormalized_basin_v1/generate_prelabel.py orbittrace_local_renormalized_basin_v1/rank_m2d.py output/LOCAL_RENORMALIZED_BASIN_V1_PRELABEL.json output/LOCAL_RENORMALIZED_BASIN_V1_PRETRUTH.json > output/pretruth_provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-local-renormalized-basin-v1-pretruth-r2
          path: output
          if-no-files-found: error
          retention-days: 90
