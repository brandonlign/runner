name: OrbitTrace v52 consensus-bottleneck minimax development v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v52_consensus_bottleneck_minimax_v1/**'
      - '.github/workflows/orbittrace_v52_consensus_bottleneck_minimax_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v52-consensus-bottleneck-minimax-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen v52 sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/v51 input/truth output/freeze output/result
          test "$(git hash-object orbittrace_v52_consensus_bottleneck_minimax_v1/PROTOCOL.md)" = 'fc1be0830488858b1ff95e218b9b2236557f759f'
          test "$(git hash-object orbittrace_v52_consensus_bottleneck_minimax_v1/train_evaluate.py)" = 'b8b29055c36069632554c5afb214c9b95fc0a52b'
          test "$(git hash-object orbittrace_v52_consensus_bottleneck_minimax_v1/execution_wrapper.py)" = '178f05a493eee191d2dbd3f4754d22a2ef29588d'
          test "$(git hash-object orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py)" = '917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v52_consensus_bottleneck_minimax_v1/train_evaluate.py orbittrace_v52_consensus_bottleneck_minimax_v1/execution_wrapper.py orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py
          echo PASS_V52_FROZEN_SOURCE_PINS

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify immutable #839 ranker before truth
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          echo PASS_V52_IMMUTABLE_RANKER

      - name: Restore immutable #950 pretruth payload before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          for route,n in (('sugar',267),('hdbscan',229)):
              m=json.load(open(f'input/payload/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              f=json.load(open(f'input/payload/{route}/family_memberships.json'))
              assert m['truth_accessed'] is False and f['truth_accessed'] is False
              assert m['feature_dimension']==71 and len(m['family_ids'])==n and len(f['families'])==n
              assert [str(x['family_id']) for x in f['families']]==list(map(str,m['family_ids']))
              assert m['target_information_access'] is False
              assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_V52_IMMUTABLE_PRETRUTH_PAYLOAD')
          PY

      - name: Restore and pin authoritative v51 authorizer before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9101972590/zip' -o input/v51.zip
          echo '56258a0be52d83c0d6dbfcffdb9fd9a2c6b73587ba8d92d7bdccdef9729868c9  input/v51.zip' | sha256sum -c -
          unzip -q input/v51.zip -d input/v51
          echo '5f20a8bedb6e7b8d6c06d66e45d5037057a9853ded35a2b360333d6ea5e2c4cc  input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json' | sha256sum -c -
          echo 'fef1d2c5bb83748de5c5511615915e76ce6fcd0801afbddb0e01bab09b9ab76d  input/v51/diag/V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC.json' | sha256sum -c -
          test "$(tr -d '\r\n' < input/v51/execution_commit.txt)" = '3da2587e569a7487db51df2ad1e2624b75e88c61'
          python - <<'PY'
          import json
          v=json.load(open('input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json'))
          r=json.load(open('input/v51/diag/V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC.json'))
          assert v['verdict']=='PASS_V51_V31_CONSENSUS_BOTTLENECK_VECTOR_CAPTURE'
          assert v['scientific_role']=='EXACT_V31_FUSION_INPUT_RANKS_CAPTURED_BEFORE_DIAGNOSTIC_RECOVERABILITY_ATTACHMENT'
          assert v['family_count']==229 and len(v['families'])==229
          assert v['local_order_sha256']=='9898a2ad69f251595b0de4ce5763ffb6641ad27141b6e54f839ebe240eb94595'
          assert v['fused_order_sha256']=='85ac3f29a443c35b3812cf28c99ef13474fc3e0455458e20b41cec64d942073d'
          assert v['diagnostic_recoverability_attached'] is False and v['annual_own_family_f1_attached'] is False
          assert r['verdict']=='PASS_V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC'
          assert r['scientific_role']=='POST_V50_V31_FUSION_MECHANISM_DIAGNOSTIC_ONLY_NO_NEW_ORDER_OR_PANEL_EVALUATED'
          assert r['family_count']==229 and r['direction_supported_both_years'] is True
          for y in ('2013','2014'):
              assert r['annual_diagnostics'][y]['direction_pass'] is True
          for k in ('new_candidate_order_evaluated','literature_panel_evaluated','selector_evaluated','replacement_rule_evaluated','successor_selected','minimax_successor_evaluated','threshold_search','top_k_search','rank_window_search','literature_budget_analysis','fusion_weight_search','rank_algebra_search','pareto_order_evaluated','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print('PASS_V52_AUTHORITATIVE_V51_PIN_BEFORE_TRUTH')
          PY

      - name: Freeze complete v52 HDB minimax order before current outcome truth
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v52_consensus_bottleneck_minimax_v1/execution_wrapper.py freeze-order \
            --vector-file input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json \
            --diagnostic-file input/v51/diag/V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC.json \
            --output output/freeze
          python - <<'PY'
          import json
          r=json.load(open('output/freeze/V52_CONSENSUS_BOTTLENECK_MINIMAX_ORDER_FREEZE.json'))
          assert r['verdict']=='PASS_V52_CONSENSUS_BOTTLENECK_MINIMAX_ORDER_FREEZE'
          assert r['scientific_role']=='COMPLETE_V52_HDB_MINIMAX_ORDER_FROZEN_BEFORE_CURRENT_OUTCOME_EVALUATION'
          assert r['family_count']==229
          assert r['local_order_sha256']=='9898a2ad69f251595b0de4ce5763ffb6641ad27141b6e54f839ebe240eb94595'
          assert r['v31_hdb_order_sha256']=='85ac3f29a443c35b3812cf28c99ef13474fc3e0455458e20b41cec64d942073d'
          assert r['v52_hdb_order_sha256']=='75fb44015e348c6b1bf0367e74db8e273e29862e132b5ef3305b2ddb409d8cc7'
          assert r['moved_candidate_count']==217 and r['moved_up_count']==117 and r['moved_down_count']==100 and r['unchanged_count']==12
          assert r['maximum_upward_displacement']==55 and r['maximum_downward_displacement']==71
          assert r['current_outcome_truth_used_to_define_order'] is False and r['literature_budget_used_to_define_order'] is False
          for k in ('threshold_selected','top_k_selected','rank_window_selected','alternate_tiebreak_evaluated','fusion_weight_selected','pareto_rule_used','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_V52_COMPLETE_MINIMAX_ORDER_FREEZE_BEFORE_TRUTH',r['canonical_sha256_without_self_field'])
          PY

      - name: Load immutable exposed SonotaCo truth only after complete v52 order freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
          echo PASS_V52_EXPOSED_TRUTH_LOADED_AFTER_ORDER_FREEZE

      - name: Reproduce exact v31 and evaluate sole frozen v52 minimax order
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v52_consensus_bottleneck_minimax_v1/execution_wrapper.py evaluate \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --vector-file input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json \
            --diagnostic-file input/v51/diag/V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC.json \
            --freeze-file output/freeze/V52_CONSENSUS_BOTTLENECK_MINIMAX_ORDER_FREEZE.json \
            --output output/result

      - name: Enforce binding v52 scientific/result firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/result/V52_CONSENSUS_BOTTLENECK_MINIMAX_RESULT.json'))
          f=json.load(open('output/freeze/V52_CONSENSUS_BOTTLENECK_MINIMAX_ORDER_FREEZE.json'))
          assert r['verdict'] in {'PASS_V52_CONSENSUS_BOTTLENECK_MINIMAX_ALL_PANEL_LITERATURE_SUPERIORITY_DEVELOPMENT','FAIL_V52_CONSENSUS_BOTTLENECK_MINIMAX_ALL_PANEL_LITERATURE_SUPERIORITY_DEVELOPMENT'}
          assert r['pre_result_frozen_protocol_blob']=='fc1be0830488858b1ff95e218b9b2236557f759f'
          assert r['parent_source_blob']=='917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          assert r['authorizing_v51_run']==31493423814 and r['authorizing_v51_artifact']==9101972590
          assert r['authorizing_v51_vector_sha256']=='5f20a8bedb6e7b8d6c06d66e45d5037057a9853ded35a2b360333d6ea5e2c4cc'
          assert r['authorizing_v51_diagnostic_sha256']=='fef1d2c5bb83748de5c5511615915e76ce6fcd0801afbddb0e01bab09b9ab76d'
          assert r['parent_v31_reproduction_pass'] is True and len(r['parent_v31_controls'])==4
          assert r['hdb_local_order_sha256']=='9898a2ad69f251595b0de4ce5763ffb6641ad27141b6e54f839ebe240eb94595'
          assert r['v31_hdb_order_sha256']==f['v31_hdb_order_sha256'] and r['v52_hdb_order_sha256']==f['v52_hdb_order_sha256']
          assert r['sugar_rule']=='exact v31 unchanged' and len(r['panels'])==4
          assert r['moved_candidate_count']==217 and r['moved_up_count']==117 and r['moved_down_count']==100 and r['unchanged_count']==12
          for k in ('threshold_search','quantile_search','top_k_selected','rank_window_selected','fusion_weight_search','alternate_max_min_search','pareto_rule_evaluated','alternate_tiebreak_search','budget_specific_rule','year_specific_rule','diversity_search','feature_search','model_search','k_search','metric_search','scaling_search','component_quality_signal_used','source_quota_selected','oracle_identity_used_for_ranking','boundary_rescue_list_created','post_result_second_search'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['panel_wins'],r['panels'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v52_consensus_bottleneck_minimax_v1/PROTOCOL.md \
            orbittrace_v52_consensus_bottleneck_minimax_v1/train_evaluate.py \
            orbittrace_v52_consensus_bottleneck_minimax_v1/execution_wrapper.py \
            orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py \
            input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json \
            input/v51/diag/V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC.json \
            output/freeze/V52_CONSENSUS_BOTTLENECK_MINIMAX_ORDER_FREEZE.json \
            > output/V52_CONSENSUS_BOTTLENECK_MINIMAX_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v52-consensus-bottleneck-minimax-v1
          path: output
          if-no-files-found: error
          retention-days: 90
