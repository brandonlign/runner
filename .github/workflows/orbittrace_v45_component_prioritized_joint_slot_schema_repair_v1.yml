name: OrbitTrace v45 joint-slot schema-repair execution v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v45_component_prioritized_joint_slot_v1/**'
      - '.github/workflows/orbittrace_v45_component_prioritized_joint_slot_schema_repair_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v45-component-prioritized-joint-slot-v1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 36ae58c80d4e4c751fd02064aa79305aeb818e7d
          path: frozen-v43

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 31704c312c09be2765ad3f65a0685d1acfd2b055
          path: frozen-v40

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin repaired execution sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/auth input/truth output/pretruth output/result
          test "$(git hash-object orbittrace_v45_component_prioritized_joint_slot_v1/PROTOCOL.md)" = '27cca27b52103cf13652008fe9277468a498ccd2'
          test "$(git hash-object orbittrace_v45_component_prioritized_joint_slot_v1/train_evaluate.py)" = '3e9df8ae5be7a5e93b2935eaaa86233e20f880aa'
          test "$(git hash-object orbittrace_v45_component_prioritized_joint_slot_v1/authorization_schema_repair.py)" = '81486e2865c6dee42d3d462f5f3751a9bb40e809'
          test "$(git -C frozen-v43 rev-parse HEAD)" = '36ae58c80d4e4c751fd02064aa79305aeb818e7d'
          test "$(git -C frozen-v43 hash-object orbittrace_v43_conservative_conjunctive_rank_transfer_v1/train_evaluate.py)" = 'cb0e1d7fbc139e4dac459cbc7fc2023238e71435'
          test "$(git -C frozen-v40 rev-parse HEAD)" = '31704c312c09be2765ad3f65a0685d1acfd2b055'
          test "$(git -C frozen-v40 hash-object orbittrace_v40_component_best_evidence_representative_v1/train_evaluate.py)" = '710944a43111e72ed286b3a5c06010db619c807f'
          python -m py_compile orbittrace_v45_component_prioritized_joint_slot_v1/train_evaluate.py orbittrace_v45_component_prioritized_joint_slot_v1/authorization_schema_repair.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify immutable #839 ranker
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - name: Restore immutable #950 pretruth payload before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/v24.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/v24.zip' | sha256sum -c -
          unzip -q input/v24.zip -d input/payload
          python - <<'PY'
          import json
          for route in ('sugar','hdbscan'):
              m=json.load(open(f'input/payload/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              f=json.load(open(f'input/payload/{route}/family_memberships.json'))
              assert m['truth_accessed'] is False and m['feature_dimension']==71 and f['truth_accessed'] is False
          h=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          assert len(h['family_ids'])==229 and len(h['quality_order'])==229
          assert h['target_information_access'] is False and h['maarsy_scientific_access'] is False and h['dms_scientific_access'] is False
          print('PASS_V45_SCHEMA_REPAIR_IMMUTABLE_PRETRUTH')
          PY

      - name: Reproduce exact frozen graph and components before truth
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:frozen-v43:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v45_component_prioritized_joint_slot_v1/train_evaluate.py pretruth \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --output output/pretruth
          echo '2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25  output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json' | sha256sum -c -
          echo 'c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd  output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json' | sha256sum -c -

      - name: Restore and verify authoritative #1113 before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088994714/zip' -o input/auth.zip
          echo '5bddfbe4abda60006757561d4c6477102317e02f5fb9555330e0b62eaf3353df  input/auth.zip' | sha256sum -c -
          unzip -q input/auth.zip -d input/auth
          echo '939f4288a5f0d2de84ef566bb93713da664230deb65777c422795c93fba10c6d  input/auth/diag/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json' | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('input/auth/diag/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json'))
          assert r['verdict']=='PASS_V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC'
          assert r['scientific_role']=='POST_V42_DIAGNOSTIC_ONLY_CONDITIONAL_COMPONENT_PLACEMENT_NO_SUCCESSOR_EVALUATED'
          assert r['joint_family_count']==60
          assert r['placement_statistic']=='component_best_v31_percentile'
          assert r['placement_direction_supported_both_years_both_levels'] is True
          assert r['source_1098_run']==31457923695 and r['source_1098_artifact']==9088724826
          assert r['source_signal_sha256']=='a3bcea66b72003a38cc492ea3b182d92cd20f3d1b94a43acbc8a0cbdd465ed07'
          assert r['graph_sha256']=='2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25'
          assert r['component_sha256']=='c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd'
          assert r['new_rank_or_score_evaluated'] is False and r['selector_evaluated'] is False
          assert r['replacement_rule_evaluated'] is False and r['successor_selected'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_V45_SCHEMA_REPAIR_AUTHORIZATION')
          PY

      - name: Load immutable exposed truth only after pretruth and authorization pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth

      - name: Evaluate unchanged v45 joint-slot science via provenance wrapper
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:frozen-v43:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v45_component_prioritized_joint_slot_v1/authorization_schema_repair.py evaluate \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --graph-file output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json \
            --component-file output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json \
            --placement-diagnostic input/auth/diag/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json \
            --output output/result

      - name: Enforce unchanged v45 scientific/result firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/result/V45_COMPONENT_PRIORITIZED_JOINT_SLOT_RESULT.json'))
          assert r['verdict'] in {'PASS_V45_COMPONENT_PRIORITIZED_JOINT_SLOT_ALL_PANEL_LITERATURE_SUPERIORITY_DEVELOPMENT','FAIL_V45_COMPONENT_PRIORITIZED_JOINT_SLOT_ALL_PANEL_LITERATURE_SUPERIORITY_DEVELOPMENT'}
          assert r['parent_v31_reproduction_pass'] is True and len(r['parent_v31_controls'])==4
          assert r['pretruth_graph_sha256']=='2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25'
          assert r['pretruth_component_sha256']=='c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd'
          assert r['pre_result_frozen_protocol_blob']=='83c6b82259cb184e312aac51f74b525582eabc69'
          assert r['authorizing_diagnostic_run']==31458734952 and r['authorizing_diagnostic_artifact']==9088994714
          assert r['authorizing_diagnostic_sha256']=='939f4288a5f0d2de84ef566bb93713da664230deb65777c422795c93fba10c6d'
          assert r['sugar_rule']=='exact v31 unchanged'
          assert r['joint_positive_candidate_count']==60 and r['nonjoint_candidate_count']==169
          assert r['nonjoint_positions_unchanged'] is True and r['joint_slot_set_unchanged'] is True and r['joint_slot_count']==60
          assert r['hdb_joint_priority']=='(component_best_v31_percentile, exact_v31_rank, family_id)'
          assert r['order_diagnostics']['sugar']['exact_v31_unchanged'] is True
          assert r['order_diagnostics']['hdbscan']['nonjoint_positions_unchanged'] is True
          assert r['order_diagnostics']['hdbscan']['joint_slot_set_unchanged'] is True
          assert len(r['hdb_candidate_rows'])==229 and len(r['panels'])==4
          for k in ('component_percentile_threshold_search','quality_suppression_magnitude_rule','third_sign_filter_used','equal_ranksum_used','weighted_fusion_used','top_k_selected','oracle_correction_count_used','rank_window_selected','promotion_coefficient_search','promotion_interpolation_search','promotion_bonus_search','promotion_cap_search','slot_expansion','budget_specific_rule','year_specific_rule','sugar_modified','alternate_quality_order_search','radius_search','metric_search','graph_pruning','graph_expansion','component_definition_search','candidate_generation_changed','candidate_membership_changed','feature_search','model_search','k_search','scaling_search','annual_combiner_search','diversity_search','fusion_search','source_quota_selected','oracle_identity_used_for_ranking','truth_aware_group_identity_used_for_ranking','post_result_second_search'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['panel_wins'],r['prefix_diagnostics'])
          PY

      - name: Record repaired provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v45_component_prioritized_joint_slot_v1/PROTOCOL.md orbittrace_v45_component_prioritized_joint_slot_v1/train_evaluate.py orbittrace_v45_component_prioritized_joint_slot_v1/authorization_schema_repair.py \
            input/auth/diag/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json \
            > output/V45_COMPONENT_PRIORITIZED_JOINT_SLOT_SCHEMA_REPAIR_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v45-component-prioritized-joint-slot-schema-repair-v1
          path: output
          if-no-files-found: error
          retention-days: 90
