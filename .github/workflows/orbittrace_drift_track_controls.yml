name: OrbitTrace raw drift-track control benchmark

on:
  push:
    branches:
      - research/orbittrace-new-discovery-screen-20260828
    paths:
      - orbittrace_new_discovery_screen/__init__.py
      - orbittrace_new_discovery_screen/corrected_allseason_month.py
      - orbittrace_new_discovery_screen/drift_track_controls.py
      - .github/workflows/orbittrace_drift_track_controls.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROTOCOL_ID: 'orbittrace-raw/DRIFT_TRACK_CONTROL_BENCHMARK@f1886bfe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 \
            requests==2.32.5 beautifulsoup4==4.12.3 click==8.0.4 future==1.0.0
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Compile benchmark mirror
        run: |
          set -euo pipefail
          python -m py_compile orbittrace_new_discovery_screen/drift_track_controls.py
      - name: Execute frozen positive-control benchmark
        run: |
          set -euo pipefail
          echo "Executing ${PROTOCOL_ID}"
          python -m orbittrace_new_discovery_screen.drift_track_controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-raw-drift-track-controls
          path: drift_track_control_results/
          if-no-files-found: warn
          retention-days: 60
