name: Mondrian clique July 2026 confirmation

on:
  pull_request:
    branches:
      - agent/empirical-window-null-evenyear-stage0
    paths:
      - .github/workflows/mondrian_clique_july_source_extract.yml
      - mondrian_clique_july2026/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mondrian-clique-july-confirmation
  cancel-in-progress: true

jobs:
  july-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATA_RUN_ID: '30876028073'
      DATA_ARTIFACT: 'mondrian-clique-july2026-data'
      EVENTS_SHA256: '657bc671df2edfe2e4e9f1516f538988e3aa31eb039792ae4ee6c1f12bd50adb'
      AUDIT_SHA256: '1feebfe723b6b3a683f3841255d80c4d5b2a05e1cdf054951085375e09c56edf'
      RAW_SOURCE_SHA256: '2eec48a52c186c9f2679e7b0eade710a3450b063c9300a67354e1fc82a08b575'
      RAW_SOURCE_BYTES: '85325788'
      POWER_SOURCE_SHA256: '8559424a4453ce4938654de37be7c164f3ca100ddd6c7d943c38df33cf3c2044'
      BASELINE_PAYLOAD_SHA256: '2cb82a8c12913a6176ddd7c6333b57a4d672334934c0d2ca4b572e878590cfa2'
      BASELINE_SOURCE_SHA256: '7718ac5229475f4240305ad9c1e073c49702c771df36612d9be5baa877b46a50'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mondrian-clique-july2026-confirmation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - name: Retrieve exact passed July data artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output
          gh run download "${DATA_RUN_ID}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${DATA_ARTIFACT}" \
            --dir input
          echo "${EVENTS_SHA256}  input/selected_events.jsonl.gz" | sha256sum -c -
          echo "${AUDIT_SHA256}  input/audit.json" | sha256sum -c -
      - name: Verify frozen data authorization and source snapshot
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path('input/audit.json').read_text())
          expected_url = 'https://globalmeteornetwork.org/data/traj_summary_data/monthly/traj_summary_monthly_202607.txt'
          checks = {
              'verdict': result.get('verdict') == 'PROCEED_TO_JULY_MONDRIAN_POWER',
              'all_data_gates': all(bool(value) for value in result.get('gates', {}).values()),
              'year': int(result.get('configuration', {}).get('year', -1)) == 2026,
              'month': int(result.get('configuration', {}).get('month', -1)) == 7,
              'source_url': result.get('source', {}).get('url') == expected_url,
              'source_sha256': result.get('source', {}).get('sha256') == os.environ['RAW_SOURCE_SHA256'],
              'source_bytes': int(result.get('source', {}).get('bytes', -1)) == int(os.environ['RAW_SOURCE_BYTES']),
              'supported_bins': result.get('supported_bins') == [9, 10, 11, 12],
              'eligible_showers': int(result.get('counts', {}).get('eligible_showers', -1)) == 38,
          }
          print(json.dumps({'checks': checks, 'counts': result.get('counts'), 'source': result.get('source')}, indent=2))
          if not all(checks.values()):
              raise SystemExit('Frozen July data authorization mismatch')
          PYCODE
      - name: Decode and verify frozen July power implementation
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path('mondrian_clique_july2026/power_source_parts_v2')
          expected_names = [f'part{i:02d}.b64' for i in range(6)]
          parts = sorted(root.glob('part*.b64'))
          names = [part.name for part in parts]
          if names != expected_names:
              raise RuntimeError(f'unexpected July power source parts: {names}')
          encoded = ''.join(''.join(part.read_text().split()) for part in parts)
          if len(encoded) != 9200:
              raise RuntimeError(f'July power encoded length mismatch: {len(encoded)}')
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          actual = hashlib.sha256(source).hexdigest()
          expected = '${{ env.POWER_SOURCE_SHA256 }}'
          if actual != expected:
              raise RuntimeError(f'July power source mismatch: {actual}')
          Path('/tmp/run_july2026_confirmation_frozen.py').write_bytes(source)

          payload = Path('real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64')
          payload_hash = hashlib.sha256(payload.read_bytes()).hexdigest()
          if payload_hash != '${{ env.BASELINE_PAYLOAD_SHA256 }}':
              raise RuntimeError(f'baseline payload mismatch: {payload_hash}')
          baseline_encoded = ''.join(payload.read_text().split())
          baseline_source = gzip.decompress(base64.b64decode(baseline_encoded, validate=True))
          baseline_hash = hashlib.sha256(baseline_source).hexdigest()
          if baseline_hash != '${{ env.BASELINE_SOURCE_SHA256 }}':
              raise RuntimeError(f'baseline source mismatch: {baseline_hash}')
          print('July power source bytes / SHA-256:', len(source), actual)
          print('baseline source SHA-256:', baseline_hash)
          PYCODE
          python -m py_compile /tmp/run_july2026_confirmation_frozen.py
      - name: Run one-shot untouched July confirmation
        run: |
          python /tmp/run_july2026_confirmation_frozen.py \
            --events input/selected_events.jsonl.gz \
            --audit input/audit.json \
            --workers 4 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --output output
          cat output/JULY_2026_MONDRIAN_CONFIRMATION.md
      - name: Enforce frozen July confirmation gates
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path

          result = json.loads(Path('output/july2026_mondrian_confirmation.json').read_text())
          summary = {
              'counts': result['counts'],
              'candidate_weak_auc': result['candidate_weak_auc'],
              'comparators': result['fixed_comparator_weak_auc'],
              'false_positive': result['false_positive'],
              'worst_reporting_sector_0.05': result['worst_reporting_sector_0.05'],
              'recall': result['recall'],
              'fold_results': result['fold_results'],
              'gates': result['gates'],
              'verdict': result['verdict'],
          }
          print(json.dumps(summary, indent=2))
          if not all(result['gates'].values()):
              raise SystemExit('Frozen July confirmation gate failed')
          if result['verdict'] != 'PASS_JULY_2026_MONDRIAN_CONFIRMATION':
              raise SystemExit(f"Unexpected verdict: {result['verdict']}")
          PYCODE
      - name: Record frozen confirmation provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            mondrian_clique_july2026/PROTOCOL.md \
            mondrian_clique_july2026/power_source_parts_v2/part00.b64 \
            mondrian_clique_july2026/power_source_parts_v2/part01.b64 \
            mondrian_clique_july2026/power_source_parts_v2/part02.b64 \
            mondrian_clique_july2026/power_source_parts_v2/part03.b64 \
            mondrian_clique_july2026/power_source_parts_v2/part04.b64 \
            mondrian_clique_july2026/power_source_parts_v2/part05.b64 \
            input/selected_events.jsonl.gz \
            input/audit.json \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            > output/source_and_input_sha256.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload one-shot July confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-clique-july2026-confirmation
          path: output
          if-no-files-found: error
          retention-days: 90
