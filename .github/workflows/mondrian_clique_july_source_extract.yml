name: Mondrian clique July source extraction

on:
  pull_request:
    branches:
      - agent/empirical-window-null-evenyear-stage0
    paths:
      - .github/workflows/mondrian_clique_july_source_extract.yml
      - mondrian_clique_july2026/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mondrian-clique-july-source-extract
  cancel-in-progress: true

jobs:
  extract-authoritative-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mondrian-clique-july2026-confirmation
          fetch-depth: 0
      - name: Fetch authoritative H1 branch
        run: |
          git fetch --no-tags origin \
            agent/partition-invariant-clique-2026h1:refs/remotes/origin/agent/partition-invariant-clique-2026h1
      - name: Decode and verify exact H1 data source and passed scorer
        run: |
          set -euo pipefail
          mkdir -p extracted
          git show \
            origin/agent/partition-invariant-clique-2026h1:partition_invariant_clique_2026h1/build_2026_h1_data.py.gz.b64 \
            > /tmp/build_2026_h1_data.py.gz.b64
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          encoded = ''.join(Path('/tmp/build_2026_h1_data.py.gz.b64').read_text().split())
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = '93f400bc92eda40a42f0cc5684a374972c3c083320844bdb7c5004a6539cd26d'
          actual = hashlib.sha256(source).hexdigest()
          if actual != expected:
              raise RuntimeError(f'H1 data source mismatch: {actual}')
          Path('extracted/build_2026_h1_data_authoritative.py').write_bytes(source)

          parts = sorted(Path('mondrian_clique_development/source_parts_v2').glob('part*.b64'))
          if [part.name for part in parts] != ['part00.b64', 'part01.b64', 'part02.b64', 'part03.b64']:
              raise RuntimeError(f'unexpected scorer parts: {[part.name for part in parts]}')
          scorer_encoded = ''.join(''.join(part.read_text().split()) for part in parts)
          if len(scorer_encoded) != 9000:
              raise RuntimeError(f'unexpected scorer payload length: {len(scorer_encoded)}')
          scorer = gzip.decompress(base64.b64decode(scorer_encoded, validate=True))
          scorer_expected = 'f1c121e97a660a3820a11814c4325eb3ab33d34a031e83bdfb03b4b392e259b8'
          scorer_actual = hashlib.sha256(scorer).hexdigest()
          if scorer_actual != scorer_expected:
              raise RuntimeError(f'Mondrian scorer mismatch: {scorer_actual}')
          Path('extracted/run_mondrian_clique_passed.py').write_bytes(scorer)

          Path('extracted/SOURCE_HASHES.txt').write_text(
              f'{actual}  build_2026_h1_data_authoritative.py\n'
              f'{scorer_actual}  run_mondrian_clique_passed.py\n'
          )
          print('data source bytes / sha256:', len(source), actual)
          print('scorer bytes / sha256:', len(scorer), scorer_actual)
          PY
          python -m py_compile \
            extracted/build_2026_h1_data_authoritative.py \
            extracted/run_mondrian_clique_passed.py
      - name: Upload authoritative sources
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-clique-july-authoritative-source
          path: extracted
          if-no-files-found: error
          retention-days: 14
