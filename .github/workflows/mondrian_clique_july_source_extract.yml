name: Mondrian clique July source extraction

on:
  pull_request:
    branches:
      - agent/empirical-window-null-evenyear-stage0
    paths:
      - .github/workflows/mondrian_clique_july_source_extract.yml
      - mondrian_clique_july2026/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mondrian-clique-july-source-extract
  cancel-in-progress: true

jobs:
  extract-authoritative-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mondrian-clique-july2026-confirmation
          fetch-depth: 0
      - name: Fetch authoritative H1 branch
        run: |
          git fetch --no-tags origin \
            agent/partition-invariant-clique-2026h1:refs/remotes/origin/agent/partition-invariant-clique-2026h1
      - name: Decode and verify authoritative and frozen sources
        run: |
          set -euo pipefail
          mkdir -p extracted
          git show \
            origin/agent/partition-invariant-clique-2026h1:partition_invariant_clique_2026h1/build_2026_h1_data.py.gz.b64 \
            > /tmp/build_2026_h1_data.py.gz.b64
          python - <<'PYCODE'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          def decode_single(path: Path, expected: str, output: Path) -> tuple[int, str]:
              encoded = ''.join(path.read_text().split())
              source = gzip.decompress(base64.b64decode(encoded, validate=True))
              actual = hashlib.sha256(source).hexdigest()
              if actual != expected:
                  raise RuntimeError(f'{path} source mismatch: {actual}')
              output.write_bytes(source)
              return len(source), actual

          def decode_parts(
              root: Path,
              names: list[str],
              expected_encoded: int,
              expected_source: str,
              output: Path,
          ) -> tuple[int, int, str]:
              parts = sorted(root.glob('part*.b64'))
              actual_names = [part.name for part in parts]
              if actual_names != names:
                  raise RuntimeError(f'unexpected parts in {root}: {actual_names}')
              encoded = ''.join(''.join(part.read_text().split()) for part in parts)
              if len(encoded) != expected_encoded:
                  raise RuntimeError(f'{root} encoded length mismatch: {len(encoded)}')
              source = gzip.decompress(base64.b64decode(encoded, validate=True))
              actual = hashlib.sha256(source).hexdigest()
              if actual != expected_source:
                  raise RuntimeError(f'{root} source mismatch: {actual}')
              output.write_bytes(source)
              return len(encoded), len(source), actual

          h1_bytes, h1_hash = decode_single(
              Path('/tmp/build_2026_h1_data.py.gz.b64'),
              '93f400bc92eda40a42f0cc5684a374972c3c083320844bdb7c5004a6539cd26d',
              Path('extracted/build_2026_h1_data_authoritative.py'),
          )
          retrospective_encoded, retrospective_bytes, retrospective_hash = decode_parts(
              Path('mondrian_clique_development/source_parts_v2'),
              ['part00.b64', 'part01.b64', 'part02.b64', 'part03.b64'],
              9000,
              'f1c121e97a660a3820a11814c4325eb3ab33d34a031e83bdfb03b4b392e259b8',
              Path('extracted/run_mondrian_clique_passed.py'),
          )
          july_data_encoded, july_data_bytes, july_data_hash = decode_parts(
              Path('mondrian_clique_july2026/data_source_parts'),
              ['part00.b64', 'part01.b64', 'part02.b64'],
              4728,
              'a9bd2f3ff033c7e4f524e214b28096c14e7a5cdddf56a043c20069a2b3d6d94e',
              Path('extracted/build_july2026_data_frozen.py'),
          )
          july_power_encoded, july_power_bytes, july_power_hash = decode_parts(
              Path('mondrian_clique_july2026/power_source_parts_v2'),
              ['part00.b64', 'part01.b64', 'part02.b64', 'part03.b64', 'part04.b64', 'part05.b64'],
              9200,
              '8559424a4453ce4938654de37be7c164f3ca100ddd6c7d943c38df33cf3c2044',
              Path('extracted/run_july2026_confirmation_frozen.py'),
          )
          Path('extracted/SOURCE_HASHES.txt').write_text(
              f'{h1_hash}  build_2026_h1_data_authoritative.py\n'
              f'{retrospective_hash}  run_mondrian_clique_passed.py\n'
              f'{july_data_hash}  build_july2026_data_frozen.py\n'
              f'{july_power_hash}  run_july2026_confirmation_frozen.py\n'
          )
          print('H1 authoritative:', h1_bytes, h1_hash)
          print('retrospective scorer:', retrospective_encoded, retrospective_bytes, retrospective_hash)
          print('July data source:', july_data_encoded, july_data_bytes, july_data_hash)
          print('July power source:', july_power_encoded, july_power_bytes, july_power_hash)
          PYCODE
          python -m py_compile \
            extracted/build_2026_h1_data_authoritative.py \
            extracted/run_mondrian_clique_passed.py \
            extracted/build_july2026_data_frozen.py \
            extracted/run_july2026_confirmation_frozen.py
      - name: Upload authoritative and frozen sources
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-clique-july-authoritative-source
          path: extracted
          if-no-files-found: error
          retention-days: 14

  july-data-gate:
    needs: extract-authoritative-source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mondrian-clique-july2026-confirmation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - name: Decode frozen July data implementation
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PYCODE'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path('mondrian_clique_july2026/data_source_parts')
          names = ['part00.b64', 'part01.b64', 'part02.b64']
          parts = sorted(root.glob('part*.b64'))
          if [part.name for part in parts] != names:
              raise RuntimeError(f'unexpected July data source parts: {[part.name for part in parts]}')
          encoded = ''.join(''.join(part.read_text().split()) for part in parts)
          if len(encoded) != 4728:
              raise RuntimeError(f'July data encoded length mismatch: {len(encoded)}')
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          actual = hashlib.sha256(source).hexdigest()
          expected = 'a9bd2f3ff033c7e4f524e214b28096c14e7a5cdddf56a043c20069a2b3d6d94e'
          if actual != expected:
              raise RuntimeError(f'July data source mismatch: {actual}')
          Path('/tmp/build_july2026_data_frozen.py').write_bytes(source)
          Path('output/FROZEN_DATA_SOURCE_SHA256.txt').write_text(
              f'{actual}  build_july2026_data_frozen.py\n'
          )
          print('July data source bytes / SHA-256:', len(source), actual)
          PYCODE
          python -m py_compile /tmp/build_july2026_data_frozen.py
      - name: Run frozen July data-only gate
        run: |
          python /tmp/build_july2026_data_frozen.py --output output
          cat output/JULY_2026_DATA_GATE.md
      - name: Enforce frozen July data gates
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path

          result = json.loads(Path('output/audit.json').read_text())
          print(json.dumps({
              'counts': result['counts'],
              'supported_bins': result['supported_bins'],
              'gates': result['gates'],
              'verdict': result['verdict'],
          }, indent=2))
          if result['verdict'] != 'PROCEED_TO_JULY_MONDRIAN_POWER':
              raise SystemExit('Frozen July data gate failed')
          if not all(result['gates'].values()):
              raise SystemExit('Frozen July data gate contains a failed gate')
          PYCODE
      - name: Record July data provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            mondrian_clique_july2026/PROTOCOL.md \
            mondrian_clique_july2026/data_source_parts/part00.b64 \
            mondrian_clique_july2026/data_source_parts/part01.b64 \
            mondrian_clique_july2026/data_source_parts/part02.b64 \
            > output/committed_source_sha256.txt
          for file in output/selected_events.jsonl.gz output/audit.json output/JULY_2026_DATA_GATE.md; do
            if [ -f "$file" ]; then sha256sum "$file"; fi
          done > output/generated_artifact_sha256.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload frozen July data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-clique-july2026-data
          path: output
          if-no-files-found: error
          retention-days: 90
