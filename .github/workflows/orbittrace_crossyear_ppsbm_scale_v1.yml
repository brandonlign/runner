name: OrbitTrace cross-year PP-SBM scale v1 Stage 1

on:
  push:
    branches: [agent/orbittrace-crossyear-ppsbm-scale-v1-activate]
    paths:
      - '.github/workflows/orbittrace_crossyear_ppsbm_scale_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  GRAPH_TOOL_IMAGE: tiagopeixoto/graph-tool@sha256:4e613c0da8cfb85c05661c124da0ef2d167ec4a5a3347ae10a8f5030bab0a375

jobs:
  stage1-pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 312b1b718ae105813de242355142a74e7d377d65
          path: sparse-src

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Audit frozen science and install exact host runtime
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_crossyear_ppsbm_scale_v1/PROTOCOL.md)" = '939c529ca1db732d23fd6e8b4f0b6957176a5042'
          test "$(git hash-object orbittrace_crossyear_ppsbm_scale_v1/build_graph_freeze.py)" = 'd43af9a95c0d273a6c2bfe2be44a7cb5b434c51b'
          test "$(git hash-object orbittrace_crossyear_ppsbm_scale_v1/run_ppsbm.py)" = '18de1020ccc8cfc159e03be6c25a3f26f0c31516'
          test "$(git hash-object orbittrace_crossyear_ppsbm_scale_v1/evaluate_pretruth.py)" = '4f1ebda9894f8134831c98631222f25dad242e7a'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git -C sparse-src hash-object orbittrace_topomodal_sparse_recovery_v1/run_development.py)" = '752df8212ce601227f6e9170b0fe994ba06b515d'
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/v3 input/v8 input/ranker input/prelabel output/graph output/ppsbm output/pretruth

          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-annual-density-bifiltration-gmn-ranking-v1-prelabel
          path: input/prelabel
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32037435314

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Rebind immutable zero-label inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/prelabel/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json | cut -d' ' -f1)" = '95f8a57718a30b2c7e85016d505276d72cccb9e4ac1d6eb29f13067efc73dd0c'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python - <<'PY'
          import json
          p=json.load(open('input/prelabel/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json'))
          assert p['schema']=='ORBITTRACE_ANNUAL_DENSITY_BIFILTRATION_GMN_RANKING_V1_PRELABEL'
          assert p['scientific_role']=='PRELABEL_TARGET_EXCLUDED_GMN_RANKING_RECOVERY'
          assert p['shower_truth_used'] is False
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert p['sonotaco_2013_2014_access'] is False
          assert [(s['denominator'],s['bucket'],s['equal_budget_k']) for s in p['subsets']] == [
              (128,0,29),(128,1,35),(128,2,38),(128,3,33),
              (1024,0,8),(1024,1,5),(1024,2,6),(1024,3,9),
          ]
          PY

      - name: Build immutable target-excluded cross-year graph freeze
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:sparse-src
        run: |
          set -euo pipefail
          python -u orbittrace_crossyear_ppsbm_scale_v1/build_graph_freeze.py \
            --endpoint-prelabel input/prelabel/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json \
            --protocol orbittrace_crossyear_ppsbm_scale_v1/PROTOCOL.md \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/graph

      - name: Pull immutable graph-tool runtime
        run: |
          set -euo pipefail
          docker pull "$GRAPH_TOOL_IMAGE"
          resolved="$(docker image inspect "$GRAPH_TOOL_IMAGE" --format '{{index .RepoDigests 0}}')"
          test "$resolved" = "$GRAPH_TOOL_IMAGE"
          echo "$resolved" > output/graph_tool_image_digest.txt

      - name: Run frozen degree-corrected PP-SBM twice per panel
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "$GRAPH_TOOL_IMAGE" \
            python3 -u orbittrace_crossyear_ppsbm_scale_v1/run_ppsbm.py \
              --graph-freeze output/graph/PPSBM_GRAPH_FREEZE_V1.json \
              --graph-dir output/graph \
              --output output/ppsbm

      - name: Evaluate frozen Stage-1 structural gates only
        run: |
          set -euo pipefail
          python -u orbittrace_crossyear_ppsbm_scale_v1/evaluate_pretruth.py \
            --graph-freeze output/graph/PPSBM_GRAPH_FREEZE_V1.json \
            --graph-dir output/graph \
            --partitions output/ppsbm/PPSBM_PARTITIONS_V1.json \
            --output output/pretruth

      - name: Enforce Stage-1 firewall and binding verdict shape
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/pretruth/CROSSYEAR_PPSBM_SCALE_V1_PRETRUTH.json'))
          assert r['scientific_role']=='ZERO_LABEL_TARGET_EXCLUDED_GMN_STRUCTURAL_AUTHORIZATION'
          assert r['verdict'] in {'PASS_CROSSYEAR_PPSBM_SCALE_V1_PRETRUTH','FAIL_CROSSYEAR_PPSBM_SCALE_V1_PRETRUTH'}
          assert len(r['gates'])==12
          assert r['shower_truth_used'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_2013_2014_access'] is False
          assert r['asfn_efn_event_level_access'] is False
          assert r['amos_scientific_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['orbital_information_access'] is False and r['station_metadata_access'] is False and r['uncertainty_metadata_access'] is False
          assert r['post_result_parameter_search'] is False
          print(r['verdict'])
          print(json.dumps({'aggregate':r['aggregate'],'cross_scale':r['cross_scale'],'gates':r['gates']},indent=2,sort_keys=True))
          PY

      - name: Preserve Stage-1 provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          git hash-object orbittrace_crossyear_ppsbm_scale_v1/PROTOCOL.md > output/protocol_blob.txt
          git hash-object orbittrace_crossyear_ppsbm_scale_v1/build_graph_freeze.py > output/build_graph_freeze_blob.txt
          git hash-object orbittrace_crossyear_ppsbm_scale_v1/run_ppsbm.py > output/run_ppsbm_blob.txt
          git hash-object orbittrace_crossyear_ppsbm_scale_v1/evaluate_pretruth.py > output/evaluate_pretruth_blob.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/host_environment.txt
          docker image inspect "$GRAPH_TOOL_IMAGE" --format '{{index .RepoDigests 0}}' > output/graph_tool_image_digest_final.txt 2>/dev/null || true
          sha256sum \
            orbittrace_crossyear_ppsbm_scale_v1/PROTOCOL.md \
            orbittrace_crossyear_ppsbm_scale_v1/build_graph_freeze.py \
            orbittrace_crossyear_ppsbm_scale_v1/run_ppsbm.py \
            orbittrace_crossyear_ppsbm_scale_v1/evaluate_pretruth.py \
            input/prelabel/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json \
            input/v8/pooled_year_centroid_v8_development.json \
            output/graph/PPSBM_GRAPH_FREEZE_V1.json \
            output/ppsbm/PPSBM_PARTITIONS_V1.json \
            output/pretruth/CROSSYEAR_PPSBM_SCALE_V1_PRETRUTH.json \
            > output/stage1_provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-crossyear-ppsbm-scale-v1-stage1
          path: output
          if-no-files-found: error
          retention-days: 90
