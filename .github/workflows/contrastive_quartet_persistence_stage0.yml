name: Contrastive quartet persistence screen

on:
  pull_request:
    branches:
      - agent/empirical-window-null-evenyear-stage0
    paths:
      - .github/workflows/contrastive_quartet_persistence_stage0.yml
      - contrastive_quartet_persistence_stage0/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: contrastive-quartet-persistence-stage0
  cancel-in-progress: true

jobs:
  development-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SOURCE_SHA256: 'b5ca098781ae505d9cd091ceb2036ffcacb1e0a7269a6aaed6c3b816b4e13baa'
      EVENTS_SHA256: '63e1389e2666d10b05138044f428609266b367cabab2542295c154a510e40f01'
      AUDIT_SHA256: 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778'
      BASELINE_PAYLOAD_SHA256: '2cb82a8c12913a6176ddd7c6333b57a4d672334934c0d2ca4b572e878590cfa2'
      BASELINE_SOURCE_SHA256: '7718ac5229475f4240305ad9c1e073c49702c771df36612d9be5baa877b46a50'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contrastive-quartet-persistence-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - name: Retrieve exact odd-year development artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo "${EVENTS_SHA256}  input/selected_events.jsonl.gz" | sha256sum -c -
          echo "${AUDIT_SHA256}  input/audit.json" | sha256sum -c -
          echo "${BASELINE_PAYLOAD_SHA256}  real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64" | sha256sum -c -
      - name: Decode and verify frozen candidate source
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          parts = sorted(Path('contrastive_quartet_persistence_stage0/source_chunks').glob('chunk*.b64'))
          expected = [f'chunk{index:02d}.b64' for index in range(10)]
          if [part.name for part in parts] != expected:
              raise RuntimeError(f'unexpected source chunks: {[part.name for part in parts]}')
          encoded = ''.join(''.join(part.read_text().split()) for part in parts)
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          source_hash = hashlib.sha256(source).hexdigest()
          if source_hash != '${{ env.SOURCE_SHA256 }}':
              raise RuntimeError(f'candidate source mismatch: {source_hash}')
          Path('/tmp/run_contrastive_quartet_persistence.py').write_bytes(source)

          baseline_encoded = ''.join(
              Path('real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64').read_text().split()
          )
          baseline_source = gzip.decompress(base64.b64decode(baseline_encoded, validate=True))
          baseline_hash = hashlib.sha256(baseline_source).hexdigest()
          if baseline_hash != '${{ env.BASELINE_SOURCE_SHA256 }}':
              raise RuntimeError(f'baseline source mismatch: {baseline_hash}')
          print('candidate source bytes:', len(source))
          print('candidate source SHA-256:', source_hash)
          print('baseline source SHA-256:', baseline_hash)
          PY
          python -m py_compile /tmp/run_contrastive_quartet_persistence.py
      - name: Run frozen development screen
        run: |
          python /tmp/run_contrastive_quartet_persistence.py \
            --events input/selected_events.jsonl.gz \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --output output
          cat output/CONTRASTIVE_QUARTET_PERSISTENCE_REPORT.md
      - name: Enforce frozen continuation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('output/contrastive_quartet_persistence.json').read_text())
          print(json.dumps({
              'weak_auc': result['weak_auc'],
              'false_positive': result['false_positive'],
              'worst_group_fpr_005': result['worst_group_fpr_005'],
              'recall': result['recall'],
              'unique_k4_rescue_fraction_005': result['unique_k4_rescue_fraction_005'],
              'gates': result['gates'],
              'verdict': result['verdict'],
          }, indent=2))
          if not all(result['gates'].values()):
              raise SystemExit('Frozen contrastive quartet persistence gate failed')
          PY
      - name: Record provenance
        if: always()
        run: |
          sha256sum \
            contrastive_quartet_persistence_stage0/PROTOCOL.md \
            contrastive_quartet_persistence_stage0/source_chunks/chunk*.b64 \
            input/selected_events.jsonl.gz \
            input/audit.json \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            > output/source_and_input_sha256.txt
          printf '%s\n' "${SOURCE_SHA256}" > output/decoded_source_sha256.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload frozen development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrastive-quartet-persistence-stage0
          path: output
          if-no-files-found: error
          retention-days: 90
