name: OrbitTrace P1 frozen-source check

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - 'orbittrace_probabilistic_membership_p1/**'
      - '.github/workflows/orbittrace_probabilistic_membership_p1_development.yml'
      - '.github/workflows/orbittrace_probabilistic_membership_p1_source_check.yml'

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and compile exact P1 source
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          root=Path('orbittrace_probabilistic_membership_p1/source_parts')
          parts=sorted(root.glob('part*.b64'))
          assert [p.name for p in parts]==['part00.b64','part01.b64']
          encoded=''.join(''.join(p.read_text().split()) for p in parts)
          src=gzip.decompress(base64.b64decode(encoded,validate=True))
          digest=hashlib.sha256(src).hexdigest()
          assert digest=='e7847e067bab8d07038c998359ccbf0ca6e2ccf257f27f27f4aef999cc7a0508',digest
          Path('/tmp/run_probabilistic_membership_p1.py').write_bytes(src)
          print('P1_SOURCE_SHA256',digest)
          PY
          python -m py_compile /tmp/run_probabilistic_membership_p1.py
      - name: Check frozen architecture, exact-v8 reconstruction, and activation provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          t=Path('/tmp/run_probabilistic_membership_p1.py').read_text()
          for marker in [
            'V8_SOURCE_COMMIT = "c9d6c44704013ba0c9430100e98a29a56b453304"',
            'V8_RESULT_SHA256 = "fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b"',
            'v8.pooled_centroid(rows, support)',
            'v8.mult.score_families',
            'v8.mult.rank_scored(scored_v8, "multiplicity")',
            'v8.mult.evaluate_order(hidden_labels, expanded, v8_order)',
            'INNER_PROB = 0.99',
            'OUTER_PROB = 0.9999',
            'BACKGROUND_UPPER_CONFIDENCE = 0.95',
            'MAP_THRESHOLD = 0.5',
            'MACRO_F1_GAIN_GATE = 0.08',
            'OAS(assume_centered=False)',
            'membership_pretruth_sha256',
            'qualified_matches_no_regression',
            'recovery_at_100_no_regression',
            'top100_dominant_precision_at_least_065',
          ]:
            assert marker in t,marker
          tree=ast.parse(t)
          assert not any(isinstance(n,ast.FunctionDef) and n.name=='evaluate' for n in ast.walk(tree))

          w=Path('.github/workflows/orbittrace_probabilistic_membership_p1_development.yml').read_text()
          assert "EXECUTE_P1_AFTER_BOTH_V6_DEVELOPMENT_NO_GO" in w
          assert "orbittrace-v6-semantic-replay-development" in w
          assert "orbittrace-v6-lf-all-event-null-development-v2" in w
          assert "orbittrace-v6-lf-strict-semantic-development" in w
          assert 'test "${#lf_candidates[@]}" -eq 1' in w
          assert "FAIL_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT" in w
          assert "FAIL_V6_LABEL_FREE_ALL_EVENT_NULL_NO_GO" in w
          assert "all(lf['gates'][key] is True for key in integrity)" in w
          assert "not all(lf['gates'][key] is True for key in scientific)" in w
          assert "git checkout --detach \"$BASE_SHA\"" in w
          print('PASS_P1_FROZEN_SOURCE_AND_DUAL_NOGO_ACTIVATION_CHECK')
          PY