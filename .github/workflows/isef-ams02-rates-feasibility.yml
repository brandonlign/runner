name: ISEF AMS02 rates feasibility
on:
  push:
    paths:
      - 'isef/ams02_rates_feasibility_probe.py'
      - '.github/workflows/isef-ams02-rates-feasibility.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install astropy numpy
      - run: python isef/ams02_rates_feasibility_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-ams02-rates-feasibility
          path: results/ams02_rates_feasibility_probe.json
