name: OrbitTrace GMN v31 positive-support v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-v31-positive-support-v1
    paths:
      - 'orbittrace_gmn_v31_positive_support_v1/**'
      - '.github/workflows/orbittrace_gmn_v31_positive_support_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and pin frozen successor
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/ranker input/offline output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          test "$(git hash-object orbittrace_gmn_v31_positive_support_v1/PROTOCOL.md)" = 'f5b1e54ee16d7daf66975d9eeb67ef7637be99fc'
          test "$(git hash-object orbittrace_gmn_v31_positive_support_v1/run_offline.py)" = '9055a1bdf2a4196902f80b0bbcf9717f1db97dec'
          python -m py_compile orbittrace_gmn_v31_positive_support_v1/run_offline.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify exact diversity/evaluator source
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          PYTHONPATH=input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8 python -m py_compile \
            input/ranker/run_urc_union_ranker.py orbittrace_gmn_v31_positive_support_v1/run_offline.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-gmn-v31-offline-development-package-v1
          path: input/offline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31663453082

      - name: Verify authoritative offline package before science
        run: |
          set -euo pipefail
          test "$(sha256sum input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json | cut -d' ' -f1)" = '16fb5ef3cd8dbbb3873e9bc23874fe7da3db68498772a5e992fbceed6cb980d7'
          python - <<'PY'
          import json, hashlib, numpy as np
          p='input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json'
          m=json.load(open(p)); X=np.load('input/offline/package/GMN_V31_OFFLINE_X.npy',allow_pickle=False); C=np.load('input/offline/package/GMN_V31_OFFLINE_CENTROIDS.npy',allow_pickle=False)
          def ah(a):
            h=hashlib.sha256(); h.update(str(a.dtype).encode()); h.update(str(tuple(a.shape)).encode()); h.update(np.ascontiguousarray(a).tobytes()); return h.hexdigest()
          assert m['verdict']=='PASS_GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1'
          assert m['scientific_role']=='ENGINEERING_PROVENANCE_ONLY_NO_SUCCESSOR_EVALUATED'
          assert m['development_role']=='GMN_2022_2023_TARGET_EXCLUDED_ONLY'
          assert X.shape==(226,23) and C.shape==(226,8)
          assert ah(X)==m['feature_matrix_sha256']=='fea3b063772c75b675e37a227b53a4aa3c5b86fdcbfcef1487b1e1448689cdf5'
          assert ah(C)==m['centroid_matrix_sha256']=='a53b9862f1ec3d751745f80aec2625d7904128474c9263c55ea953cf60d0621f'
          assert m['parent_prelabel_sha256']=='b45c4ce1a45bff515e411e211bc51dee879229ee97f7fcb7d8e7e05bfc106d09'
          assert m['parent_margin_sha256']=='f38c96e3fa4ea98f51217b36d639e96edbf3ebcb65123248f0f118d3298173bd'
          assert len(m['rows'])==226 and sum(bool(r['truth']['positive']) for r in m['rows'])==111
          for k in ('raw_event_rows_exported','raw_event_ids_exported','raw_hidden_label_mapping_exported','new_feature_or_score_created','new_rank_evaluated','successor_selected','sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
            assert m[k] is False
          assert m['blind_exclusion']==[20.0,55.0]
          print('PASS_AUTHORITATIVE_OFFLINE_PACKAGE_BEFORE_POSITIVE_SUPPORT')
          PY

      - name: Run first binding offline GMN v31 positive-support outcome
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_v31_positive_support_v1/run_offline.py \
            --package-manifest input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json \
            --features input/offline/package/GMN_V31_OFFLINE_X.npy \
            --centroids input/offline/package/GMN_V31_OFFLINE_CENTROIDS.npy \
            --output output

      - name: Enforce binding result and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/GMN_V31_POSITIVE_SUPPORT_V1_RESULT.json'))
          e=json.load(open('output/GMN_V31_POSITIVE_SUPPORT_EVIDENCE.json'))
          assert r['verdict'] in {'PASS_GMN_V31_POSITIVE_SUPPORT_V1','FAIL_GMN_V31_POSITIVE_SUPPORT_V1'}
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_V31_SUCCESSOR_DEVELOPMENT_ONLY'
          assert r['first_valid_outcome_binding'] is True
          assert r['candidate_count']==226 and r['feature_dimension']==23
          assert r['feature_matrix_sha256']=='fea3b063772c75b675e37a227b53a4aa3c5b86fdcbfcef1487b1e1448689cdf5'
          assert r['centroid_matrix_sha256']=='a53b9862f1ec3d751745f80aec2625d7904128474c9263c55ea953cf60d0621f'
          assert r['package_manifest_sha256']=='16fb5ef3cd8dbbb3873e9bc23874fe7da3db68498772a5e992fbceed6cb980d7'
          assert r['parent_prelabel_sha256']=='b45c4ce1a45bff515e411e211bc51dee879229ee97f7fcb7d8e7e05bfc106d09'
          assert r['parent_margin_sha256']=='f38c96e3fa4ea98f51217b36d639e96edbf3ebcb65123248f0f118d3298173bd'
          assert r['hard_control']=={'recovered_at_25':21,'recovered_at_50':38,'recovered_at_100':59,'top100_dominant_precision':0.6884631112636006,'mrr':0.046734076055452344,'qualified_matches':95}
          assert r['parent_control']=={'recovered_at_25':23,'recovered_at_50':41,'recovered_at_100':66,'top100_dominant_precision':0.7229521515453452,'mrr':0.050244164168646674,'qualified_matches':95}
          assert r['hard_reproduced_metrics']['recovered_at_25']==21 and r['hard_reproduced_metrics']['recovered_at_50']==38 and r['hard_reproduced_metrics']['recovered_at_100']==59
          assert r['hard_reproduced_metrics']['qualified_matches']==95
          assert r['strict_whole_shower_oof'] is True and r['fold_count']==5 and r['nearest_k']==1
          assert r['distance']=='ordinary Euclidean after fold-training z-score'
          assert r['local_score']=='negative nearest-positive distance'
          assert r['nonpositive_reference_geometry_used'] is False
          assert r['diversity']=={'lambda':0.8,'scale':1.0}
          assert r['fusion']=='equal rank-sum with immutable P19 hard order'
          assert len(r['fold_diagnostics'])==5 and len(e['rows'])==226
          for fd in r['fold_diagnostics']:
            assert fd['positive_references']>0 and fd['nonpositive_references_used_by_local_leg']==0
          for k in ('k_search','threshold_search','radius_search','density_normalization_search','positive_reference_filtering','positive_reference_weighting','negative_reference_editing','feature_search','metric_search','scaling_search','fold_search','diversity_search','fusion_search','candidate_generation_recomputed','membership_changed','post_result_second_search','raw_event_rows_accessed','raw_event_ids_accessed','raw_hidden_label_mapping_accessed','sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
            assert r[k] is False
          for k in ('raw_event_rows_accessed','raw_event_ids_accessed','raw_hidden_label_mapping_accessed','sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
            assert e[k] is False
          assert r['blind_exclusion']==[20.0,55.0] and e['blind_exclusion']==[20.0,55.0]
          if r['verdict'].startswith('PASS_'):
            assert all(r['pass_gates'].values()) and r['sonotaco_benchmark_authorized_by_this_result'] is True
          else:
            assert not all(r['pass_gates'].values()) and r['sonotaco_benchmark_authorized_by_this_result'] is False
          print(r['verdict'], r['parent_control'], r['positive_support_equal_rank_fusion'], r['pass_gates'])
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_gmn_v31_positive_support_v1/PROTOCOL.md \
            orbittrace_gmn_v31_positive_support_v1/run_offline.py \
            input/ranker/run_urc_union_ranker.py \
            input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json \
            input/offline/package/GMN_V31_OFFLINE_X.npy \
            input/offline/package/GMN_V31_OFFLINE_CENTROIDS.npy \
            output/GMN_V31_POSITIVE_SUPPORT_V1_RESULT.json \
            output/GMN_V31_POSITIVE_SUPPORT_EVIDENCE.json \
            > output/source_input_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/development_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-v31-positive-support-v1
          path: output
          if-no-files-found: error
          retention-days: 90
