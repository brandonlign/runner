name: OrbitTrace P4 cross-fit local-FDR v3 source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p3-crossfit-seed-floor-freeze
    paths:
      - orbittrace_crossfit_local_fdr_membership_p4/PROTOCOL.md
      - orbittrace_crossfit_local_fdr_membership_p4/apply_p4_patch.py
      - orbittrace_crossfit_local_fdr_membership_p4/apply_p4_patch_v2.py
      - orbittrace_crossfit_local_fdr_membership_p4/apply_p4_truth_firewall.py
      - .github/workflows/orbittrace_p4_crossfit_local_fdr_v3_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact numerical/runtime dependencies
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2'
      - name: Reconstruct and compile exact P4 source
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_crossfit_local_fdr_membership_p4/apply_p4_patch.py)" = '3a54b148c970b6664a004e2df8bad7325f8823cc'
          test "$(git hash-object orbittrace_crossfit_local_fdr_membership_p4/apply_p4_patch_v2.py)" = '0641dc943fb3f531fbc0c4a955a5912119e79509'
          test "$(git hash-object orbittrace_crossfit_local_fdr_membership_p4/apply_p4_truth_firewall.py)" = '33e68e285b287cb485c4b7739aa2bb743770d527'
          echo '7637b6fb310ee3f24f1de8479a34d10c594dc55471eee55b8854e1c28787e8dd  orbittrace_crossyear_two_view_membership_p2/run_development.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2_v1.py
          echo '169ed0a276cdcae628cd830130cfb03d6511a972df50d4dc10ffddfc1c8e05da  /tmp/p2_v1.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2_v1.py /tmp/p2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2.py' | sha256sum -c -
          python orbittrace_crossfit_local_fdr_membership_p4/apply_p4_patch_v2.py /tmp/p2.py /tmp/p4_stage1.py
          python orbittrace_crossfit_local_fdr_membership_p4/apply_p4_truth_firewall.py /tmp/p4_stage1.py /tmp/p4.py
          echo 'c986c9af46684060350290c7613c03eb2df6e813bb9b84a34076750cf4ce3a8c  /tmp/p4.py' | sha256sum -c -
          python -m py_compile /tmp/p4.py
      - name: Reconfirm source architecture and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p4.py').read_text()
          for token in (
              'P4_FOLD_COUNT = 5','P4_LOCAL_FDR_Q = 0.05','P4_PSEUDOCOUNT = 1.0','P4_MIN_SPLIT_SIZE = 64',
              'fdrhat = ((P4_PSEUDOCOUNT + B) / len(calibration)) * len(proposal) / max(1, R)',
              'return min(valid, key=lambda row: float(row["threshold"]))','direction_reliable = all(side[-1] is not None for side in sides)',
              '"no_final_all_family_model": True','if len(family_ids) != 1:',
              'PASS_CROSSFIT_LOCAL_FDR_MEMBERSHIP_P4_DEVELOPMENT','FAIL_CROSSFIT_LOCAL_FDR_MEMBERSHIP_P4_NO_GO',
              'p4_label_values_unread_until_membership_freeze','FIRST known-shower label-value access',
          ): assert token in p,token
          assert 'classifier = LogisticRegression' not in p
          assert 'responsibility = float' not in p
          assert 'support.parse_catalogue(base)' not in p
          truth=p.index('# FIRST known-shower label-value access')
          for marker in ('p4_crossfit_models_pretruth.sha256','p4_local_fdr_pretruth.sha256','p4_decisions_pretruth.sha256','p4_membership_pretruth.sha256'):
              assert p.index(marker)<truth
          print('PASS_P4_V3_ARCHITECTURE_FIREWALL_RECHECK')
          PY
      - name: Synthetic reciprocal split, FDR and conflict semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import __future__,ast,hashlib,math
          from pathlib import Path
          import numpy as np
          tree=ast.parse(Path('/tmp/p4.py').read_text())
          funcs=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in {'p4_split_indices','p4_select_threshold'}]
          ns={'np':np,'hashlib':hashlib,'math':math,'P4_MIN_SPLIT_SIZE':64,'P4_PSEUDOCOUNT':1.0,'P4_LOCAL_FDR_Q':0.05}
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          ns['require']=require
          mod=ast.Module(body=funcs,type_ignores=[]);ast.fix_missing_locations(mod)
          exec(compile(mod,'<p4helpers>','exec',flags=__future__.annotations.compiler_flag,dont_inherit=True),ns)
          split,select=ns['p4_split_indices'],ns['p4_select_threshold']
          ids=[f'e{i:03d}' for i in range(129)]
          a0,a1=split('F',2022,2023,ids); b0,b1=split('F',2022,2023,ids)
          assert a0==b0 and a1==b1 and len(a0)==65 and len(a1)==64 and not(set(a0)&set(a1))
          row=select(np.array([0.9]*64),np.array([0.1]*64),0.95)
          assert row is not None and row['threshold']==0.9 and row['R']==64 and row['B']==0 and row['fdrhat']<=0.05
          assert select(np.array([0.9]*64),np.array([0.9]*64),0.95) is None
          assert select(np.array([0.9]*64),np.array([0.1]*64),0.8) is None
          proposals={'u':[{'family_id':'A'}],'c':[{'family_id':'A'},{'family_id':'B'}]}
          assigned={eid:ps[0] for eid,ps in proposals.items() if len({p['family_id'] for p in ps})==1 and len(ps)==1}
          assert set(assigned)=={'u'} and 'c' not in assigned
          print('PASS_P4_V3_RECIPROCAL_LOCAL_FDR_SYNTHETIC')
          PY
      - name: Assert protocol and no-data boundary
        run: |
          set -euo pipefail
          grep -Fq 'q = 0.05' orbittrace_crossfit_local_fdr_membership_p4/PROTOCOL.md
          grep -Fq 'both reciprocal sides' orbittrace_crossfit_local_fdr_membership_p4/PROTOCOL.md
          grep -Fq 'leave it unassigned' orbittrace_crossfit_local_fdr_membership_p4/PROTOCOL.md
          test ! -e orbittrace_crossfit_local_fdr_membership_p4/RUN.md
          test ! -e input
          test ! -e output
          test ! -e data
          echo NO_P4_SCIENTIFIC_EXECUTION_NO_TARGET_ACCESS
