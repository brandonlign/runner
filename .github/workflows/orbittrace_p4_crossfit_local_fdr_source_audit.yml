name: OrbitTrace P4 cross-fit local-FDR source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p3-crossfit-seed-floor-freeze
    paths:
      - orbittrace_crossfit_local_fdr_membership_p4/PROTOCOL.md
      - orbittrace_crossfit_local_fdr_membership_p4/apply_p4_patch.py
      - orbittrace_crossfit_local_fdr_membership_p4/apply_p4_truth_firewall.py
      - .github/workflows/orbittrace_p4_crossfit_local_fdr_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact numerical/runtime dependencies
        run: |
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2'
      - name: Reconstruct canonical P2 and deterministic P4 source
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_crossfit_local_fdr_membership_p4/apply_p4_patch.py)" = '3a54b148c970b6664a004e2df8bad7325f8823cc'
          test "$(git hash-object orbittrace_crossfit_local_fdr_membership_p4/apply_p4_truth_firewall.py)" = '33e68e285b287cb485c4b7739aa2bb743770d527'
          python -m py_compile orbittrace_crossfit_local_fdr_membership_p4/apply_p4_patch.py orbittrace_crossfit_local_fdr_membership_p4/apply_p4_truth_firewall.py
          echo '7637b6fb310ee3f24f1de8479a34d10c594dc55471eee55b8854e1c28787e8dd  orbittrace_crossyear_two_view_membership_p2/run_development.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2_v1.py
          echo '169ed0a276cdcae628cd830130cfb03d6511a972df50d4dc10ffddfc1c8e05da  /tmp/p2_v1.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2_v1.py /tmp/p2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2.py' | sha256sum -c -
          python orbittrace_crossfit_local_fdr_membership_p4/apply_p4_patch.py /tmp/p2.py /tmp/p4_stage1.py
          python orbittrace_crossfit_local_fdr_membership_p4/apply_p4_truth_firewall.py /tmp/p4_stage1.py /tmp/p4.py
          python -m py_compile /tmp/p4.py
          sha256sum /tmp/p4.py
      - name: Prove exact architecture and truth ordering
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('/tmp/p4.py').read_text()
          protocol=Path('orbittrace_crossfit_local_fdr_membership_p4/PROTOCOL.md').read_text()
          required=(
              'P4_FOLD_COUNT = 5',
              'P4_LOCAL_FDR_Q = 0.05',
              'P4_PSEUDOCOUNT = 1.0',
              'P4_MIN_SPLIT_SIZE = 64',
              'P4-SPLIT|',
              'fdrhat = ((P4_PSEUDOCOUNT + B) / len(calibration)) * len(proposal) / max(1, R)',
              'threshold > float(seed_median)',
              'return min(valid, key=lambda row: float(row["threshold"]))',
              'direction_reliable = all(side[-1] is not None for side in sides)',
              'no_final_all_family_model',
              'if len(family_ids) != 1:',
              'p4_decisions_pretruth.sha256',
              'p4_local_fdr_pretruth.sha256',
              'p4_membership_pretruth.sha256',
              'PASS_CROSSFIT_LOCAL_FDR_MEMBERSHIP_P4_DEVELOPMENT',
              'FAIL_CROSSFIT_LOCAL_FDR_MEMBERSHIP_P4_NO_GO',
              'qualified_matches_no_regression',
              'recovery_at_100_no_regression',
              'top100_dominant_precision_at_least_065',
              'macro_f1_gain_at_least_008',
              'large_shower_mean_recall_at_least_15x_v8',
              'large_shower_mean_precision_at_least_085',
              'p4_parse_geometry_only',
              'hidden_labels = None',
              'FIRST known-shower label-value access',
              'p4_label_values_unread_until_membership_freeze',
          )
          for token in required: assert token in p,token
          assert 'classifier = LogisticRegression' not in p
          assert 'responsibility = float' not in p
          assert 'support.parse_catalogue(base)' not in p
          geom=p[p.index('def p4_parse_geometry_only'):p.index('def p4_parse_truth_after_freeze')]
          assert 'frame.iloc' not in geom and 'normalize_label' not in geom
          truth_index=p.index('# FIRST known-shower label-value access')
          for marker in ('p4_crossfit_models_pretruth.sha256','p4_local_fdr_pretruth.sha256','p4_decisions_pretruth.sha256','p4_membership_pretruth.sha256'):
              assert p.index(marker) < truth_index,(marker,p.index(marker),truth_index)
          assert 'P4 deliberately removes P2/P3' in protocol
          assert 'q = 0.05' in protocol
          assert 'both reciprocal sides' in protocol
          assert 'leave it unassigned' in protocol
          tree=ast.parse(p)
          names={n.id for n in ast.walk(tree) if isinstance(n,ast.Name)}
          assert {'model_sha','calibration_sha','decision_sha','membership_sha','family_fold','proposals_by_event'} <= names
          print('PASS_P4_SOURCE_ARCHITECTURE_AND_FIREWALL_AUDIT')
          PY
      - name: Synthetic reciprocal split, FDR threshold and abstention semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,hashlib,math,typing
          from pathlib import Path
          import numpy as np
          source=Path('/tmp/p4.py').read_text()
          tree=ast.parse(source)
          wanted={'p4_split_indices','p4_select_threshold'}
          funcs=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in wanted]
          ns={'np':np,'hashlib':hashlib,'math':math,'P4_MIN_SPLIT_SIZE':64,'P4_PSEUDOCOUNT':1.0,'P4_LOCAL_FDR_Q':0.05}
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          ns['require']=require
          mod=ast.Module(body=funcs,type_ignores=[]);ast.fix_missing_locations(mod)
          exec(compile(mod,'<p4helpers>','exec'),ns)
          split=ns['p4_split_indices']; select=ns['p4_select_threshold']
          ids=[f'e{i:03d}' for i in range(129)]
          a0,a1=split('F',2022,2023,ids)
          b0,b1=split('F',2022,2023,list(ids))
          assert a0==b0 and a1==b1 and len(a0)==65 and len(a1)==64 and not(set(a0)&set(a1))
          # With many high proposal scores and zero calibration exceedances, q can pass.
          proposal=np.array([0.9]*64,dtype=float); calibration=np.array([0.1]*64,dtype=float)
          row=select(proposal,calibration,0.95)
          assert row is not None and row['threshold']==0.9 and row['R']==64 and row['B']==0
          assert row['fdrhat'] <= 0.05
          # Same-score background makes the bound fail at every threshold.
          assert select(np.array([0.9]*64),np.array([0.9]*64),0.95) is None
          # Seed median constraint forbids thresholds above held-out seed median.
          assert select(np.array([0.9]*64),np.array([0.1]*64),0.8) is None
          # Conflict rule is exact-family abstention: unique family assigns; 2 families do not.
          proposals={'u':[{'family_id':'A'}],'c':[{'family_id':'A'},{'family_id':'B'}]}
          assigned={eid:ps[0] for eid,ps in proposals.items() if len({p['family_id'] for p in ps})==1 and len(ps)==1}
          assert set(assigned)=={'u'} and 'c' not in assigned
          print('PASS_P4_RECIPROCAL_LOCAL_FDR_SYNTHETIC')
          PY
      - name: Assert no-data/no-target boundary
        run: |
          set -euo pipefail
          test ! -e orbittrace_crossfit_local_fdr_membership_p4/RUN.md
          test ! -e input
          test ! -e output
          test ! -e data
          echo NO_P4_SCIENTIFIC_EXECUTION_NO_TARGET_ACCESS
