name: OrbitTrace cross-year-core HDBSCAN v1 dense reference audit

on:
  push:
    branches:
      - agent/orbittrace-crossyear-core-hdbscan-v1
    paths:
      - 'orbittrace_crossyear_core_hdbscan_v1/AUDIT_ACTIVATE.md'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: 'orbittrace_crossyear_core_hdbscan_v1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  dense-reference-synthetic-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-crossyear-core-hdbscan-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inherited runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          test "$(git hash-object orbittrace_crossyear_core_hdbscan_v1/PROTOCOL.md)" = '980d2f26d6477ff80d1b57606ee86ae96bebe972'
          test "$(git hash-object orbittrace_crossyear_core_hdbscan_v1/reference.py)" = '5380dd68a01c0f35c3e212972b840ae7b9dea7aa'
          test "$(git hash-object orbittrace_crossyear_core_hdbscan_v1/reference_selftest.py)" = 'b0b7b693ef2543d9d5a03d8f44c293cf751450f1'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          python -m py_compile \
            orbittrace_crossyear_core_hdbscan_v1/reference.py \
            orbittrace_crossyear_core_hdbscan_v1/reference_selftest.py
          echo PASS_CROSSYEAR_CORE_REFERENCE_FROZEN_SOURCE_PINS
      - name: Run dense reference synthetic audit only
        run: |
          set -euo pipefail
          rm -f crossyear_core_reference_audit.json
          python -u orbittrace_crossyear_core_hdbscan_v1/reference_selftest.py
          python - <<'PY'
          import json
          r=json.load(open('crossyear_core_reference_audit.json'))
          assert r['verdict']=='PASS_CROSSYEAR_CORE_DENSE_REFERENCE_SYNTHETIC_AUDIT'
          assert r['k']==10
          assert len(r['fixtures'])==5
          assert {x['name'] for x in r['fixtures']} == {
              'recurrent_clusters_plus_noise',
              'one_year_only_dense',
              'unequal_year_sizes',
              'exact_distance_ties',
              'nested_density',
          }
          solo=next(x for x in r['fixtures'] if x['name']=='one_year_only_dense')
          assert solo['one_year_core_ratio'] > 3.0
          assert r['scientific_data_access'] is False
          assert r['gmn_access'] is False
          assert r['sonotaco_access'] is False
          assert r['amos_access'] is False
          assert r['target_access'] is False
          print(r['verdict'])
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p orbittrace_crossyear_core_hdbscan_v1/output
          cp crossyear_core_reference_audit.json orbittrace_crossyear_core_hdbscan_v1/output/ 2>/dev/null || true
          sha256sum \
            orbittrace_crossyear_core_hdbscan_v1/PROTOCOL.md \
            orbittrace_crossyear_core_hdbscan_v1/reference.py \
            orbittrace_crossyear_core_hdbscan_v1/reference_selftest.py \
            orbittrace_crossyear_core_hdbscan_v1/output/crossyear_core_reference_audit.json \
            > orbittrace_crossyear_core_hdbscan_v1/output/source_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > orbittrace_crossyear_core_hdbscan_v1/output/execution_commit.txt
          python --version > orbittrace_crossyear_core_hdbscan_v1/output/python_version.txt
          python -m pip freeze > orbittrace_crossyear_core_hdbscan_v1/output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-crossyear-core-reference-audit-v1
          path: orbittrace_crossyear_core_hdbscan_v1/output
          if-no-files-found: error
          retention-days: 90
