name: ISEF TESS 3I HLSP schema probe
on:
  push:
    paths:
      - 'isef/tess3i_hlsp_schema_probe.py'
      - '.github/workflows/isef-tess3i-hlsp-schema-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install astropy
      - run: timeout 300s python isef/tess3i_hlsp_schema_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-tess3i-hlsp-schema-probe
          path: results/tess3i_hlsp_schema_probe.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file results/tess3i_hlsp_schema_probe.json || true
