name: Complex-held-out real-shower set model

on:
  pull_request:
    branches:
      - main
    paths:
      - real_shower_set_model_stage0/**
      - .github/workflows/real_shower_set_model.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: real-shower-set-model-stage0
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATA_ARTIFACT_ID: '8871850235'
      DATA_ARTIFACT_SHA256: '5f2501b3eee19b51a5dc81f8493dce67a810ef5c480045dac143de060369534d'
      BASELINE_ARTIFACT_ID: '8871912750'
      BASELINE_ARTIFACT_SHA256: 'd5f7f50262b2cd2f64901db913cd2babb0fccb897391d46b2af25f0f6d4723c4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-shower-set-model-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_set_model_stage0/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r real_shower_set_model_stage0/requirements.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download exact authorized artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p real_shower_set_model_stage0/input/data real_shower_set_model_stage0/input/baseline real_shower_set_model_stage0/results
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DATA_ARTIFACT_ID}/zip" \
            -o real_shower_set_model_stage0/input/data.zip
          echo "${DATA_ARTIFACT_SHA256}  real_shower_set_model_stage0/input/data.zip" | sha256sum -c -
          unzip -q real_shower_set_model_stage0/input/data.zip -d real_shower_set_model_stage0/input/data
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" \
            -o real_shower_set_model_stage0/input/baseline.zip
          echo "${BASELINE_ARTIFACT_SHA256}  real_shower_set_model_stage0/input/baseline.zip" | sha256sum -c -
          unzip -q real_shower_set_model_stage0/input/baseline.zip -d real_shower_set_model_stage0/input/baseline
          test -s real_shower_set_model_stage0/input/data/selected_events.jsonl.gz
          test -s real_shower_set_model_stage0/input/data/audit.json
          test -s real_shower_set_model_stage0/input/baseline/baseline_ceiling.json
      - name: Compile verified launcher
        run: python -m py_compile real_shower_set_model_stage0/run_complex_set_model.py
      - name: Run frozen five-fold benchmark and ablation
        run: |
          python real_shower_set_model_stage0/run_complex_set_model.py \
            --events real_shower_set_model_stage0/input/data/selected_events.jsonl.gz \
            --audit real_shower_set_model_stage0/input/data/audit.json \
            --baseline real_shower_set_model_stage0/input/baseline/baseline_ceiling.json \
            --output real_shower_set_model_stage0/results
      - name: Record provenance
        run: |
          sha256sum \
            real_shower_set_model_stage0/run_complex_set_model.py \
            real_shower_set_model_stage0/run_complex_set_model.py.gz.b64 \
            real_shower_set_model_stage0/SET_MODEL_GATE.md \
            > real_shower_set_model_stage0/results/source_sha256.txt
          sha256sum \
            real_shower_set_model_stage0/input/data/selected_events.jsonl.gz \
            real_shower_set_model_stage0/input/data/audit.json \
            real_shower_set_model_stage0/input/baseline/baseline_ceiling.json \
            > real_shower_set_model_stage0/results/input_sha256.txt
          python --version > real_shower_set_model_stage0/results/python_version.txt
          python -m pip freeze > real_shower_set_model_stage0/results/environment.txt
      - name: Upload model evidence
        uses: actions/upload-artifact@v4
        with:
          name: complex-heldout-real-shower-set-model
          path: real_shower_set_model_stage0/results
          if-no-files-found: error
          retention-days: 90
