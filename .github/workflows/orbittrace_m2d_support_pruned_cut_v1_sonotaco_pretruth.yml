name: OrbitTrace M2D support-pruned SonotaCo pretruth

on:
  pull_request:
    branches: [agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1]
    paths: ['.github/workflows/orbittrace_m2d_support_pruned_cut_v1_sonotaco_pretruth.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  sonotaco-pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-symmetric-tuned-literature-benchmark-v2
          path: symmetric

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install structural runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/SONOTACO_PROTOCOL.md)" = 'a4b58dcbb23048cca477e8a43295fc868baf7a52'
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/support_pruned_cut.py)" = '3712a36033088f1bd486cefdc8dc474c194fc85c'
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/prepare_sonotaco_pretruth.py)" = '37ef122ccbbd2a7f62654ee9a07e071dada70aa9'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git -C symmetric hash-object orbittrace_symmetric_tuned_literature_v2/run_benchmark.py)" = 'd9b2af130580b74ca97e549d474860869e01a502'
          python -m py_compile orbittrace_m2d_support_pruned_cut_v1/support_pruned_cut.py orbittrace_m2d_support_pruned_cut_v1/prepare_sonotaco_pretruth.py
          mkdir -p input/rows input/baseline output

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-sonotaco-label-free-preparation-v2
          path: input/rows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31354363306

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-sonotaco-development-v1-prep-32229888368
          path: input/baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32229888368

      - name: Verify label-free common rows and baseline support artifact
        run: |
          set -euo pipefail
          test "$(sha256sum input/baseline/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_PRETRUTH_SUPPORT.json | cut -d' ' -f1)" = '19828089363280d37aed17aacc9561e60c185abda61b2b7c0dead0226d2740b9'
          python - <<'PY'
          import json
          b=json.load(open('input/baseline/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_PRETRUTH_SUPPORT.json'))
          assert b['truth_used'] is False and b['shower_labels_accessed'] is False and b['candidate_count']==888
          assert b['universe']['common_counts']=={'2013':15988,'2014':13258}
          for y in (2013,2014):
              assert len(json.load(open(f'input/rows/sugar_{y}.json'))) > 0
              assert len(json.load(open(f'input/rows/hdbscan_{y}.json'))) > 0
          print('LABEL_FREE_INPUTS_VERIFIED')
          PY

      - name: Build frozen support-pruned candidate catalogue with no truth access
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_support_pruned_cut_v1/prepare_sonotaco_pretruth.py \
            --rows-root input/rows \
            --benchmark-module symmetric/orbittrace_symmetric_tuned_literature_v2/run_benchmark.py \
            --structural-source orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --refined-cut-source orbittrace_m2d_support_pruned_cut_v1/support_pruned_cut.py \
            --baseline-support input/baseline/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_PRETRUTH_SUPPORT.json \
            --output output

      - name: Seal and enforce label-free structural gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='output/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_PRETRUTH.json'; raw=open(p,'rb').read(); r=json.loads(raw)
          assert r['scientific_role']=='ZERO_LABEL_SUPPORT_PRUNED_SONOTACO_COMMON_UNIVERSE_PRETRUTH'
          assert r['truth_used'] is False and r['shower_labels_accessed'] is False and r['orbittrace_member_ids_accessed'] is False
          assert r['post_result_parameter_search'] is False and r['configuration']['new_tuned_parameters']==[]
          assert r['universe']['common_counts']=={'2013':15988,'2014':13258}
          assert r['cut_summary']['pairwise_disjoint'] is True and r['cut_summary']['selected_plus_noise_partition'] is True
          assert r['cut_summary']['discarded_subsupport_event_count'] > 0
          s=r['size_summary']; b=s['baseline_support_resolved']; x=s['support_pruned']
          # Size gates are frozen before truth. Failure here is a structural no-promotion result.
          assert x['mean_member_count'] < b['mean_member_count']
          assert x['p90_member_count'] <= b['p90_member_count']
          assert x['max_member_count'] < b['max_member_count']
          h=hashlib.sha256(raw).hexdigest(); open('output/SONOTACO_PRETRUTH_SHA256.txt','w').write(h+'  M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_PRETRUTH.json\n')
          print('SONOTACO_PRETRUTH_SEALED',h)
          print(json.dumps({'candidate_count':r['candidate_count'],'covered':r['covered_event_count'],'discarded':r['cut_summary']['discarded_subsupport_event_count'],'sizes':s},indent=2,sort_keys=True))
          PY

      - name: Preserve pretruth provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum orbittrace_m2d_support_pruned_cut_v1/SONOTACO_PROTOCOL.md orbittrace_m2d_support_pruned_cut_v1/support_pruned_cut.py orbittrace_m2d_support_pruned_cut_v1/prepare_sonotaco_pretruth.py input/baseline/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_PRETRUTH_SUPPORT.json output/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_PRETRUTH.json > output/provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-sonotaco-pretruth
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Post sealed pretruth status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s output/SONOTACO_PRETRUTH_SHA256.txt; then
            { echo 'M2D_SUPPORT_PRUNED_SONOTACO_PRETRUTH=SEALED'; cat output/SONOTACO_PRETRUTH_SHA256.txt; } > /tmp/c.md
          else
            echo 'M2D_SUPPORT_PRUNED_SONOTACO_PRETRUTH=TECHNICAL_OR_STRUCTURAL_NO_RESULT; no SonotaCo truth accessed' > /tmp/c.md
          fi
          gh pr comment 1380 --repo "$GITHUB_REPOSITORY" --body-file /tmp/c.md || true
