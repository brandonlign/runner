name: OrbitTrace M2D support-pruned cut v1 pretruth r2

on:
  pull_request:
    branches: [agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1]
    paths: ['.github/workflows/orbittrace_m2d_support_pruned_cut_v1_pretruth_r2.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth-r2:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify frozen scientific rule
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/PROTOCOL.md)" = '1ad3c8bc8da516614c4773c9295d3cfe98b02579'
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/support_pruned_cut.py)" = '3712a36033088f1bd486cefdc8dc474c194fc85c'
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/generate_support_prelabel.py)" = 'f6b80d0c07a7e0ba30122de4d5075125a30e7b8a'
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/rank_internal_mass.py)" = 'dcde0ce8a0006e10d2a931c694599fd51c722ff9'
          test "$(git hash-object orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py)" = '4988997c023d9df2b504372b4290dcab379a6dcc'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_m2d_support_pruned_cut_v1/support_pruned_cut.py orbittrace_m2d_support_pruned_cut_v1/generate_support_prelabel.py orbittrace_m2d_support_pruned_cut_v1/rank_internal_mass.py
          mkdir -p input/v3 input/v8 input/ranker input/structural input/bif input/baseline output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-hierarchy-scale-v1
          path: input/structural
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31955621864

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-annual-density-bifiltration-gmn-ranking-v1-prelabel
          path: input/bif
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32037435314

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-support-cut-bifiltration-internal-mass-v1
          path: input/baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32041661731

      - name: Verify immutable label-free inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json | cut -d' ' -f1)" = 'e8cf7d92e96db9a1c99578f6efc63baf1534b94ab975e94f789fa6bc4a718497'
          test "$(sha256sum input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json | cut -d' ' -f1)" = '95f8a57718a30b2c7e85016d505276d72cccb9e4ac1d6eb29f13067efc73dd0c'
          test "$(sha256sum input/baseline/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json | cut -d' ' -f1)" = '7b1ddfcd32cd0b52321e3b3dfc614a88dd9b973f947c1d4d0de74fddf26b59cd'

      - name: Generate target-excluded support-pruned catalogue against exact baseline universes
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_support_pruned_cut_v1/generate_support_prelabel.py \
            --structural-runner orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --structural-result-json input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --baseline-m2d-prelabel input/baseline/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json \
            --output output

      - name: Rank refined candidates with unchanged M2D
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_support_pruned_cut_v1/rank_internal_mass.py \
            --support-prelabel output/M2D_SUPPORT_PRUNED_CUT_V1_SUPPORT_PRELABEL.json \
            --bif-prelabel input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json \
            --baseline-m2d-prelabel input/baseline/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json \
            --output output/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json

      - name: Seal pretruth before any shower labels
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='output/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json'; raw=open(p,'rb').read(); h=hashlib.sha256(raw).hexdigest(); r=json.loads(raw)
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_SUPPORT_PRUNED_M2D_RANKING_FROZEN_BEFORE_TRUTH'
          assert r['shower_truth_used'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False
          assert r['configuration']['new_tuned_parameters']==[]
          assert len(r['subsets'])==8
          assert all(len(s['refined_candidates'])>=int(s['equal_budget_k']) for s in r['subsets'])
          open('output/PRETRUTH_SHA256.txt','w').write(h+'  M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json\n')
          print('pretruth_sha256',h)
          print(json.dumps(r['size_summary'],indent=2,sort_keys=True))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/pretruth_execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum orbittrace_m2d_support_pruned_cut_v1/PROTOCOL.md orbittrace_m2d_support_pruned_cut_v1/support_pruned_cut.py orbittrace_m2d_support_pruned_cut_v1/generate_support_prelabel.py orbittrace_m2d_support_pruned_cut_v1/rank_internal_mass.py output/M2D_SUPPORT_PRUNED_CUT_V1_SUPPORT_PRELABEL.json output/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json > output/pretruth_provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-pretruth-r2
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Post pretruth status to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s output/PRETRUTH_SHA256.txt; then
            {
              echo 'M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH_R2=SEALED'
              cat output/PRETRUTH_SHA256.txt
              python - <<'PY'
          import json
          r=json.load(open('output/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json'))
          s=r['size_summary']
          print('discarded_subsupport_events=%d' % s['discarded_subsupport_events_across_sparse_fits'])
          print('mean_top_budget_members=%.6f->%.6f' % (s['baseline_mean_top_budget_member_count'],s['refined_mean_top_budget_member_count']))
          print('p90_top_budget_members=%.6f->%.6f' % (s['baseline_p90_top_budget_member_count'],s['refined_p90_top_budget_member_count']))
          PY
            } > /tmp/comment.md
          else
            echo 'M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH_R2=TECHNICAL_NO_RESULT; no truth accessed' > /tmp/comment.md
          fi
          gh pr comment 1380 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md || true
