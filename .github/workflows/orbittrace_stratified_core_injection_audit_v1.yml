name: OrbitTrace stratified-core HDBSCAN v1 injection audit

on:
  push:
    branches:
      - agent/orbittrace-stratified-core-hdbscan-v1
    paths:
      - 'orbittrace_stratified_core_hdbscan_v1/AUDIT_ACTIVATE.md'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  synthetic-zero-truth:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-stratified-core-hdbscan-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          test "$(git hash-object orbittrace_stratified_core_hdbscan_v1/PROTOCOL.md)" = '3e01aa6e24b8b85cd10b24c3aef05312c78e3aa6'
          test "$(git hash-object orbittrace_stratified_core_hdbscan_v1/INJECTION_INITIALIZATION_REPAIR.md)" = '6be86c7956d205144d20136fbb18605af899592a'
          test "$(git hash-object orbittrace_stratified_core_hdbscan_v1/stratified_core.py)" = 'ce22a6c762829b03184e136cd43cc0b821763e0c'
          test "$(git hash-object orbittrace_stratified_core_hdbscan_v1/audit_injection.py)" = 'b2856bcc93ab6249a1fc43bf8dde39a2072daed8'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          python -m py_compile \
            orbittrace_stratified_core_hdbscan_v1/stratified_core.py \
            orbittrace_stratified_core_hdbscan_v1/audit_injection.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py
          python - <<'PY'
          p='orbittrace_stratified_core_hdbscan_v1/stratified_core.py'
          s=open(p).read()
          assert 'K_YEAR = 5' in s and 'MIN_SAMPLES = 10' in s
          assert 'LEAF_SIZE = 40' in s and 'BORUVKA_LEAF_SIZE = LEAF_SIZE // 3' in s
          assert '        0,\n        metric="euclidean"' in s
          assert 'approx_min_span_tree=True' in s and 'alpha=1.0' in s and 'n_jobs=1' in s
          assert 'np.square(core' in s
          assert '_seed_hdbscan_first_pass' in s
          assert 'candidate_point[n] = n' in s and 'candidate_distance[n] = injected_rdist[n]' in s
          assert 'bounds[:] = 0.0' in s
          print('PASS_STRATIFIED_CORE_FROZEN_ENGINEERING_SOURCE_PINS')
          PY
      - name: Run synthetic injection/core audit only
        run: |
          set -euo pipefail
          rm -rf orbittrace_stratified_core_hdbscan_v1/output
          python -u orbittrace_stratified_core_hdbscan_v1/audit_injection.py
          python - <<'PY'
          import json
          p='orbittrace_stratified_core_hdbscan_v1/output/STRATIFIED_CORE_ZERO_TRUTH_INJECTION_AUDIT.json'
          r=json.load(open(p))
          assert r['verdict']=='PASS_STRATIFIED_CORE_HDBSCAN_V1_ZERO_TRUTH_INJECTION_AUDIT'
          assert r['synthetic_only'] is True
          assert r['balanced_k_year']==5 and r['total_parent_min_samples']==10
          assert r['stratified_core_is_max_of_year_fifth_other_distances'] is True
          assert r['standard_core_injection_reproduces_standard_hdbscan_partition'] is True
          assert r['core_mechanics']['duplicate_coordinate_other_event_counted'] is True
          assert r['core_mechanics']['exact_identity_self_excluded'] is True
          assert r['core_mechanics']['matches_bruteforce_bitwise'] is True
          assert len(r['injection_cases'])==3
          for c in r['injection_cases']:
              assert c['standard_partition_sha256']==c['injected_partition_sha256']
          assert r['gmn_catalogue_accessed'] is False and r['scientific_labels_accessed'] is False
          assert r['sonotaco_accessed'] is False and r['efn_accessed'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          print(r['verdict'])
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p orbittrace_stratified_core_hdbscan_v1/output
          sha256sum \
            orbittrace_stratified_core_hdbscan_v1/PROTOCOL.md \
            orbittrace_stratified_core_hdbscan_v1/INJECTION_INITIALIZATION_REPAIR.md \
            orbittrace_stratified_core_hdbscan_v1/stratified_core.py \
            orbittrace_stratified_core_hdbscan_v1/audit_injection.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_stratified_core_hdbscan_v1/output/STRATIFIED_CORE_ZERO_TRUTH_INJECTION_AUDIT.json \
            > orbittrace_stratified_core_hdbscan_v1/output/source_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > orbittrace_stratified_core_hdbscan_v1/output/execution_commit.txt
          python --version > orbittrace_stratified_core_hdbscan_v1/output/python_version.txt
          python -m pip freeze > orbittrace_stratified_core_hdbscan_v1/output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-stratified-core-injection-audit-v1
          path: orbittrace_stratified_core_hdbscan_v1/output
          if-no-files-found: error
          retention-days: 90
