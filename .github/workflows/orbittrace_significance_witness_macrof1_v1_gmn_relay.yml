name: OrbitTrace significance-witness macro-F1 v1 GMN relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: orbittrace-significance-witness-macrof1-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  BENCH_BRANCH: agent/orbittrace-significance-witness-macrof1-v1
  FROZEN_HEAD: 76e273e106d00ac1fb2c740fb34b8cb154d44cca

jobs:
  evaluate:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 1370 &&
      github.event.comment.user.login == 'brandonlign' &&
      github.event.comment.body == 'RUN_ORBITTRACE_SIGNIFICANCE_WITNESS_MACROF1_V1_GMN'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Announce exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1370 --repo "${{ github.repository }}" --body "ORBITTRACE_SIGNIFICANCE_WITNESS_GMN_STARTED=${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BENCH_BRANCH }}
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Bind immutable successor and install runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FROZEN_HEAD}"
          test ! -e orbittrace_significance_witness_macrof1_v1/RESULT.json
          test "$(git hash-object orbittrace_significance_witness_macrof1_v1/PROTOCOL.md)" = '2bf554e9d1798e119433e385a3858847b681f6fa'
          test "$(git hash-object orbittrace_significance_witness_macrof1_v1/build_prelabel.py)" = '7a81aa882960aa87d1d0a06c65f699bdb941cf81'
          test "$(git hash-object orbittrace_significance_witness_macrof1_v1/evaluate_macrof1.py)" = 'f27d74f239c43bdb97f2f6cfd46333b91b540e38'
          test "$(git hash-object orbittrace_significance_witness_macrof1_v1/SIGNIFICANCE_WITNESS_MACROF1_V1_PRELABEL.json)" = '92dc576dc824ca859377142ff736d9cde83d7ee8'
          test "$(sha256sum orbittrace_significance_witness_macrof1_v1/SIGNIFICANCE_WITNESS_MACROF1_V1_PRELABEL.json | awk '{print $1}')" = '6894fc4875253b0957dacdea52e48899e65464139f07707388521b7983eccd1f'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/v3 input/v8 input/ranker output
          python -m py_compile orbittrace_significance_witness_macrof1_v1/evaluate_macrof1.py orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py orbittrace_recurrent_eom_hdbscan_v1/run_development.py

      - name: Materialize frozen GMN source before truth evaluator
        run: |
          set -euo pipefail
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify immutable runtime inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Run sole paper-aligned GMN macro-F1 endpoint
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:orbittrace_recurrent_eom_hdbscan_v1
        run: |
          set -euo pipefail
          python -u orbittrace_significance_witness_macrof1_v1/evaluate_macrof1.py \
            --intrinsic-runner orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --prelabel orbittrace_significance_witness_macrof1_v1/SIGNIFICANCE_WITNESS_MACROF1_V1_PRELABEL.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output
          test -f output/RESULT.json
          sha256sum output/RESULT.json | tee output/RESULT_SHA256.txt
          cat output/RESULT.json

      - name: Validate firewall and commit binding result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/RESULT.json'))
          assert r['verdict'] in {'PASS_SIGNIFICANCE_WITNESS_MACROF1_V1_GMN','FAIL_SIGNIFICANCE_WITNESS_MACROF1_V1_GMN'}
          assert r['scientific_role']=='PAPER_ALIGNED_HUNGARIAN_MACRO_F1_TARGET_EXCLUDED_GMN_SPARSE_DEVELOPMENT'
          assert r['prelabel_sha256']=='6894fc4875253b0957dacdea52e48899e65464139f07707388521b7983eccd1f'
          for k in ['target_information_access','target_region_events_accessed','sonotaco_2013_2014_access','asfn_event_level_access','efn_event_level_access','amos_scientific_access','maarsy_scientific_access','dms_scientific_access','post_result_method_change_authorized']:
              assert r[k] is False, (k,r[k])
          print(json.dumps({'verdict':r['verdict'],'scales':r['scales'],'gates':r['gates']},indent=2,sort_keys=True))
          PY
          cp output/RESULT.json orbittrace_significance_witness_macrof1_v1/RESULT.json
          cp output/RESULT_SHA256.txt orbittrace_significance_witness_macrof1_v1/RESULT_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orbittrace_significance_witness_macrof1_v1/RESULT.json orbittrace_significance_witness_macrof1_v1/RESULT_SHA256.txt
          git commit -m 'Record significance-witness macro-F1 GMN result'
          git push origin HEAD:"${BENCH_BRANCH}"

      - name: Upload binding artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-significance-witness-macrof1-v1-gmn-${{ github.run_id }}
          path: output
          if-no-files-found: warn
          retention-days: 90

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1370 --repo "${{ github.repository }}" --body "ORBITTRACE_SIGNIFICANCE_WITNESS_GMN_SUCCESS=${GITHUB_RUN_ID}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1370 --repo "${{ github.repository }}" --body "ORBITTRACE_SIGNIFICANCE_WITNESS_GMN_FAILED=${GITHUB_RUN_ID}"
