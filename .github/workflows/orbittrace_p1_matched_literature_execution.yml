name: OrbitTrace P1 matched Sugar-HDBSCAN execution

on:
  pull_request:
    branches: [agent/orbittrace-p1-matched-literature-implementation-freeze]
    paths:
      - orbittrace_probabilistic_membership_p1_literature/RUN.md

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-p1-matched-literature-execution
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONPATH: .:exact-v8:exact:input/v3:orbittrace_wavelet_catalogue_v3:/tmp

jobs:
  authorize:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 2
      - name: Require one-file activation and exact P1 development PASS
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'orbittrace_probabilistic_membership_p1_literature/RUN.md'
          content="$(git show "$HEAD_SHA":orbittrace_probabilistic_membership_p1_literature/RUN.md)"
          first="$(printf '%s\n' "$content" | sed -n '1p')"
          p1_run="$(printf '%s\n' "$content" | sed -n '2p')"
          test "$first" = 'EXECUTE_P1_MATCHED_AFTER_EXACT_P1_PASS'
          [[ "$p1_run" =~ ^[0-9]+$ ]]
          test "$(printf '%s\n' "$content" | wc -l)" -eq 2
          rm -rf /tmp/p1-pass && mkdir -p /tmp/p1-pass
          gh run download "$p1_run" --repo "$GITHUB_REPOSITORY" --name orbittrace-probabilistic-membership-p1-development --dir /tmp/p1-pass
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/p1-pass/probabilistic_membership_p1_development.json').read_text())
          assert r['verdict']=='PASS_PROBABILISTIC_MEMBERSHIP_P1_DEVELOPMENT',r['verdict']
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['parameter_search'] is False
          assert r['configuration']['new_members_can_seed_growth'] is False
          assert r['configuration']['v8_source_commit']=='c9d6c44704013ba0c9430100e98a29a56b453304'
          assert r['baseline_v8']['qualified_matches']==95
          assert r['baseline_v8']['recovered_at_100']==58
          assert abs(r['baseline_v8']['top100_dominant_precision']-0.6884631112636006)<1e-12
          assert all(r['gates'].values())
          assert len(r['membership_pretruth_sha256'])==64
          assert float(r['p1']['macro_f1'])-float(r['baseline_v8']['macro_f1'])>=0.08
          print('PASS_P1_MATCHED_EXACT_DEVELOPMENT_AUTHORIZATION')
          PY
          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_probabilistic_membership_p1_literature/RUN.md

      - name: Reconstruct exact frozen P1 source
        run: |
          set -euo pipefail
          mkdir -p runtime
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          parts=sorted(Path('orbittrace_probabilistic_membership_p1/source_parts').glob('part*.b64'))
          assert [p.name for p in parts]==['part00.b64','part01.b64']
          src=gzip.decompress(base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts),validate=True))
          assert hashlib.sha256(src).hexdigest()=='e7847e067bab8d07038c998359ccbf0ca6e2ccf257f27f27f4aef999cc7a0508'
          Path('runtime/run_probabilistic_membership_p1.py').write_bytes(src)
          PY
          python -m py_compile runtime/run_probabilistic_membership_p1.py \
            orbittrace_probabilistic_membership_p1_literature/prepare_strict_id_manifest.py \
            orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py \
            orbittrace_probabilistic_membership_p1_literature/evaluate_frozen.py
          sha256sum runtime/run_probabilistic_membership_p1.py \
            orbittrace_probabilistic_membership_p1_literature/prepare_strict_id_manifest.py \
            orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py \
            orbittrace_probabilistic_membership_p1_literature/evaluate_frozen.py > runtime/source_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-p1-matched-frozen-runtime
          path: runtime
          if-no-files-found: error
          retention-days: 90

  manifest:
    needs: authorize
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Download exact competitor artifacts for ID-only extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/{hdbscan2023,hdbscan2025,sugar2023,sugar2025} output
          gh run download 31226945294 --repo "$GITHUB_REPOSITORY" --name orbittrace-hdbscan-2023-blind-safe-benchmark --dir input/hdbscan2023
          gh run download 31071589912 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2025-hdbscan-catalogue --dir input/hdbscan2025
          gh run download 31076789635 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2023-sugar-uncertainty-transfer --dir input/sugar2023
          gh run download 31075178517 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2025-sugar-uncertainty-catalogue --dir input/sugar2025
          echo '35f629b1dff4d04cdc13aa8224171ec1ab8e06b52836900d66ff978b5c235761  input/hdbscan2023/full_catalogue_assignments.jsonl.gz' | sha256sum -c -
          echo '8e7580c52e41e6994d6e46f289a7b916565a4efc512c5549ee83f249d0e81ee3  input/hdbscan2025/full_catalogue_assignments.jsonl.gz' | sha256sum -c -
          echo '2b9e86572f10af447071cb10c56f643c1ad8babfe0d9aa667994ba3639834389  input/sugar2023/sugar_uncertainty_assignments.json.gz' | sha256sum -c -
          echo '77844d700bb14bb9952307fad13eb66cbc62e6a1555e5edd9c8aa0d26968b06e  input/sugar2025/sugar_uncertainty_assignments.json.gz' | sha256sum -c -
          python orbittrace_probabilistic_membership_p1_literature/prepare_strict_id_manifest.py \
            --hdbscan-2023 input/hdbscan2023/full_catalogue_assignments.jsonl.gz \
            --hdbscan-2025 input/hdbscan2025/full_catalogue_assignments.jsonl.gz \
            --sugar-2023 input/sugar2023/sugar_uncertainty_assignments.json.gz \
            --sugar-2025 input/sugar2025/sugar_uncertainty_assignments.json.gz \
            --output output/strict_id_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-p1-matched-strict-id-manifest
          path: output
          if-no-files-found: error
          retention-days: 90

  pretruth:
    needs: [authorize, manifest]
    strategy:
      fail-fast: false
      matrix:
        panel: [hdbscan, sugar]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: ffe8351b9ee8df4418fb4926fab782d66180e276
          path: exact
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: exact-v8
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p1-matched-frozen-runtime
          path: runtime
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p1-matched-strict-id-manifest
          path: input/manifest
      - name: Reconstruct exact blind-safe row runner and base runtime
        run: |
          set -euo pipefail
          sha256sum -c runtime/source_sha256.txt
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          test "$(git -C exact hash-object orbittrace_literature_matched_v8/run_exact_row_benchmark.py)" = '09beb3e22b661ed88b35c89fa96c716f42215c80'
          test "$(git -C exact hash-object orbittrace_literature_matched_v8/run_exact_row_final.py)" = '3b2e34493be0f1353c65c817cbb2ffd532b9a1fb'
          python - <<'PY'
          from pathlib import Path
          old='7dbb920532f7dc429a6cd5961d80d480c5ff53c0122cf6e9ec04638c0730ed60'
          new='35f629b1dff4d04cdc13aa8224171ec1ab8e06b52836900d66ff978b5c235761'
          source=Path('exact/orbittrace_literature_matched_v8/run_exact_row_benchmark.py').read_text()
          wrapper=Path('exact/orbittrace_literature_matched_v8/run_exact_row_final.py').read_text()
          assert source.count(old)==1 and source.count(new)==0
          assert f'benchmark.ASSIGNMENT_SHA256["hdbscan"][2023] = "{new}"' in wrapper
          patched=source.replace(old,new,1)
          assert patched.replace(new,old,1)==source
          Path('/tmp/run_exact_row_blind_safe.py').write_text(patched)
          PY
          python -m py_compile /tmp/run_exact_row_blind_safe.py
          mkdir -p input/archives output
          curl --fail --location --retry 3 --output input/archives/023a.zip https://www.astro.sk/iaumdcDB/public/data/SNMv3/023a.zip
          curl --fail --location --retry 3 --output input/archives/025a.zip https://www.astro.sk/iaumdcDB/public/data/SNMv3/025a.zip
          echo '9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430  input/archives/023a.zip' | sha256sum -c -
          echo 'f4eb716a4b900658fcc658a633d918eca28946f59da75935f1fd5f6bc539bf52  input/archives/025a.zip' | sha256sum -c -
      - name: Execute exact-v8-first P1 pretruth panel
        env:
          PYTHONPATH: exact-v8:exact:orbittrace_wavelet_catalogue_v3:orbittrace_multi_anchor_energy_v3:.
        run: |
          set -euo pipefail
          python -u orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py \
            --panel '${{ matrix.panel }}' \
            --strict-id-manifest input/manifest/strict_id_manifest.json \
            --exact-row-runner /tmp/run_exact_row_blind_safe.py \
            --p1-source runtime/run_probabilistic_membership_p1.py \
            --archive-2023 input/archives/023a.zip \
            --archive-2025 input/archives/025a.zip \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --output output/${{ matrix.panel }}_pretruth.pkl
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-p1-matched-pretruth-${{ matrix.panel }}
          path: output
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: [authorize, manifest, pretruth]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: ffe8351b9ee8df4418fb4926fab782d66180e276
          path: exact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p1-matched-pretruth-hdbscan
          path: input/pretruth/hdbscan
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p1-matched-pretruth-sugar
          path: input/pretruth/sugar
      - name: Restore exact post-truth inputs only after pretruth artifacts exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/{archives,hdbscan2023,hdbscan2025,sugar2023,sugar2025,parser,mapping} output
          gh run download 31226945294 --repo "$GITHUB_REPOSITORY" --name orbittrace-hdbscan-2023-blind-safe-benchmark --dir input/hdbscan2023
          gh run download 31071589912 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2025-hdbscan-catalogue --dir input/hdbscan2025
          gh run download 31076789635 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2023-sugar-uncertainty-transfer --dir input/sugar2023
          gh run download 31075178517 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2025-sugar-uncertainty-catalogue --dir input/sugar2025
          gh run download 30920687116 --repo "$GITHUB_REPOSITORY" --name sonotaco-2023-confirmation-source-repair-v2 --dir input/parser
          gh run download 30855193522 --repo "$GITHUB_REPOSITORY" --name real-shower-meta-data-audit --dir input/mapping
          echo '35f629b1dff4d04cdc13aa8224171ec1ab8e06b52836900d66ff978b5c235761  input/hdbscan2023/full_catalogue_assignments.jsonl.gz' | sha256sum -c -
          echo '8e7580c52e41e6994d6e46f289a7b916565a4efc512c5549ee83f249d0e81ee3  input/hdbscan2025/full_catalogue_assignments.jsonl.gz' | sha256sum -c -
          echo '2b9e86572f10af447071cb10c56f643c1ad8babfe0d9aa667994ba3639834389  input/sugar2023/sugar_uncertainty_assignments.json.gz' | sha256sum -c -
          echo '77844d700bb14bb9952307fad13eb66cbc62e6a1555e5edd9c8aa0d26968b06e  input/sugar2025/sugar_uncertainty_assignments.json.gz' | sha256sum -c -
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/parser/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/mapping/audit.json' | sha256sum -c -
          curl --fail --location --retry 3 --output input/archives/023a.zip https://www.astro.sk/iaumdcDB/public/data/SNMv3/023a.zip
          curl --fail --location --retry 3 --output input/archives/025a.zip https://www.astro.sk/iaumdcDB/public/data/SNMv3/025a.zip
          echo '9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430  input/archives/023a.zip' | sha256sum -c -
          echo 'f4eb716a4b900658fcc658a633d918eca28946f59da75935f1fd5f6bc539bf52  input/archives/025a.zip' | sha256sum -c -
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python - <<'PY'
          from pathlib import Path
          old='7dbb920532f7dc429a6cd5961d80d480c5ff53c0122cf6e9ec04638c0730ed60'; new='35f629b1dff4d04cdc13aa8224171ec1ab8e06b52836900d66ff978b5c235761'
          source=Path('exact/orbittrace_literature_matched_v8/run_exact_row_benchmark.py').read_text(); Path('/tmp/run_exact_row_blind_safe.py').write_text(source.replace(old,new,1))
          assert source.replace(old,new,1).replace(new,old,1)==source
          PY
      - name: Evaluate only after pretruth hashes are verified
        run: |
          set -euo pipefail
          python orbittrace_probabilistic_membership_p1_literature/evaluate_frozen.py \
            --hdbscan-pretruth input/pretruth/hdbscan/hdbscan_pretruth.pkl \
            --sugar-pretruth input/pretruth/sugar/sugar_pretruth.pkl \
            --exact-row-runner /tmp/run_exact_row_blind_safe.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --parser-2023 input/parser/run_sonotaco_2023_fixed4_confirmation.py \
            --parser-2025 exact/orbittrace_literature_matched_v8/sonotaco_2025_native_adapter_wrapper.py \
            --mapping-audit input/mapping/audit.json \
            --archive-2023 input/archives/023a.zip \
            --archive-2025 input/archives/025a.zip \
            --hdbscan-2023 input/hdbscan2023/full_catalogue_assignments.jsonl.gz \
            --hdbscan-2025 input/hdbscan2025/full_catalogue_assignments.jsonl.gz \
            --sugar-2023 input/sugar2023/sugar_uncertainty_assignments.json.gz \
            --sugar-2025 input/sugar2025/sugar_uncertainty_assignments.json.gz \
            --output output/p1_matched_literature.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/p1_matched_literature.json').read_text())
          assert r['classification'] in {'BROAD_CATALOGUE_SUPERIORITY','SPARSE_STREAM_SUPERIORITY','NO_LITERATURE_SUPERIORITY','P1_MATCHED_INPUT_INELIGIBLE_EXACT_V8_SUPPORT'}
          assert r['years']==[2023,2025] and r['blind_exclusion']==[20.0,55.0]
          assert r['pairwise_only_no_cross_denominator_comparison'] is True
          if r['matched_input_ineligible']:
              assert not r['broad_catalogue_superiority'] and not r['sparse_stream_superiority']
          print('ORBITTRACE_P1_MATCHED_FROZEN_RESULT',json.dumps({'classification':r['classification'],'broad':r['broad_catalogue_superiority'],'sparse':r['sparse_stream_superiority'],'statuses':{p:r['panels'][p]['status'] for p in r['panels']}},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-p1-matched-literature-result
          path: output
          if-no-files-found: error
          retention-days: 90
