name: Local-contrast recurrence protocol conformance

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/local_contrast_recurrence_protocol_conformance.yml
      - local_contrast_recurrence_dev/PROTOCOL_CONFORMANCE.md
      - local_contrast_recurrence_dev/derive_protocol_conformance.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-contrast-recurrence-protocol-conformance
  cancel-in-progress: true

jobs:
  conformance-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-contrast-recurrence-protocol-conformance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: replicastream_stage0/requirements.txt
      - run: python -m pip install --upgrade pip -r replicastream_stage0/requirements.txt
      - name: Reconstruct exact pinned worst-family source
        run: |
          set -euo pipefail
          mkdir -p local_contrast_recurrence_dev/conformance_results
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          parts=sorted(Path('worst_family_recurrence_stage0/source_parts').glob('part*.b64'))
          expected=['part00.b64','part01.b64','part02.b64','part03.b64']
          if [p.name for p in parts] != expected:
              raise RuntimeError(f'Unexpected source parts: {[p.name for p in parts]}')
          raw=gzip.decompress(base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts),validate=True))
          digest=hashlib.sha256(raw).hexdigest()
          if digest != '4384dd0352174e57ca1f93a2c3bd070002f026cef8acace035ba4ec05e577dac':
              raise RuntimeError(f'Worst-family source mismatch: {digest}')
          Path('/tmp/worst_family_source.py').write_bytes(raw)
          print('base source sha256:',digest)
          PY
      - name: Derive original and sole repaired candidate
        run: |
          set -euo pipefail
          python local_contrast_recurrence_dev/derive_candidate.py \
            /tmp/worst_family_source.py /tmp/run_local_contrast_original.py
          python local_contrast_recurrence_dev/derive_protocol_conformance.py \
            /tmp/worst_family_source.py \
            local_contrast_recurrence_dev/derive_candidate.py \
            /tmp/run_local_contrast_conformance.py
          python -m py_compile /tmp/run_local_contrast_original.py /tmp/run_local_contrast_conformance.py
          python - <<'PY'
          from pathlib import Path
          import difflib
          old=Path('/tmp/run_local_contrast_original.py').read_text().splitlines()
          new=Path('/tmp/run_local_contrast_conformance.py').read_text().splitlines()
          diff=list(difflib.unified_diff(old,new,lineterm=''))
          added=[line for line in diff if line.startswith('+') and not line.startswith('+++')]
          removed=[line for line in diff if line.startswith('-') and not line.startswith('---')]
          if len(added) != 2 or len(removed) != 2:
              raise RuntimeError(f'Unexpected conformance diff: {diff}')
          text='\n'.join(diff)
          required=(
              'ideal_null_fwer_at_most_0_15', 'ideal_null_fwer_at_most_0_20',
              'shared_structure_null_fwer_at_most_0_15', 'shared_structure_null_fwer_at_most_0_20',
              '<= 0.15 + tol', '<= 0.20 + tol',
          )
          if not all(token in text for token in required):
              raise RuntimeError(f'Unexpected conformance diff: {text}')
          Path('local_contrast_recurrence_dev/conformance_results/source_diff.txt').write_text(text+'\n')
          print(text)
          PY
          sha256sum \
            /tmp/worst_family_source.py \
            /tmp/run_local_contrast_original.py \
            /tmp/run_local_contrast_conformance.py \
            local_contrast_recurrence_dev/derive_candidate.py \
            local_contrast_recurrence_dev/derive_protocol_conformance.py \
            local_contrast_recurrence_dev/DEVELOPMENT_PROTOCOL.md \
            local_contrast_recurrence_dev/PROTOCOL_CONFORMANCE.md \
            > local_contrast_recurrence_dev/conformance_results/source_sha256.txt
      - name: Run exact protocol-conformance benchmark
        run: |
          python /tmp/run_local_contrast_conformance.py \
            --calibration-trials 20 \
            --null-trials 20 \
            --injection-trials 30 \
            --results local_contrast_recurrence_dev/conformance_results
          cat local_contrast_recurrence_dev/conformance_results/STAGE0_REPORT.md
      - name: Enforce prospectively documented gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('local_contrast_recurrence_dev/conformance_results/stage0_result.json').read_text())
          print(json.dumps({'gates':result['gates'],'verdict':result['verdict']},indent=2))
          expected={'ideal_null_fwer_at_most_0_20','shared_structure_null_fwer_at_most_0_20'}
          if not expected.issubset(result['gates']):
              raise SystemExit(f'Missing repaired protocol gates: {result["gates"]}')
          if not all(result['gates'].values()):
              raise SystemExit('Frozen protocol-conformance gate failed')
          if result['verdict'] != 'CONTINUE_LOCAL_CONTRAST_FULL_STAGE0':
              raise SystemExit(f'Unexpected verdict: {result["verdict"]}')
          PY
      - name: Record environment
        if: always()
        run: |
          mkdir -p local_contrast_recurrence_dev/conformance_results
          python --version > local_contrast_recurrence_dev/conformance_results/python_version.txt
          python -m pip freeze > local_contrast_recurrence_dev/conformance_results/environment.txt
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-contrast-recurrence-protocol-conformance
          path: |
            local_contrast_recurrence_dev/conformance_results
            local_contrast_recurrence_dev/DEVELOPMENT_PROTOCOL.md
            local_contrast_recurrence_dev/PROTOCOL_CONFORMANCE.md
          if-no-files-found: error
          retention-days: 90
