name: OrbitTrace M2D blind rediscovery scan v1

on:
  push:
    branches:
      - agent/orbittrace-m2d-blind-rediscovery-v1
    paths:
      - '.github/workflows/orbittrace_m2d_blind_rediscovery_scan_v1.yml'
      - 'orbittrace_m2d_blind_rediscovery_v1/run_scan.py'
      - 'orbittrace_m2d_blind_rediscovery_v1/PROTOCOL.md'
  pull_request:
    branches:
      - agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1
    paths:
      - '.github/workflows/orbittrace_m2d_blind_rediscovery_scan_v1.yml'
      - 'orbittrace_m2d_blind_rediscovery_v1/run_scan.py'
      - 'orbittrace_m2d_blind_rediscovery_v1/PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: orbittrace-m2d-blind-rediscovery-scan-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-internal-mass-sonotaco-development-v1
          path: m2d-reference

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install frozen scientific runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          python -m pip freeze > /tmp/environment.txt

      - name: Verify frozen method/source identities before data access
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py)" = '4988997c023d9df2b504372b4290dcab379a6dcc'
          test "$(sha256sum m2d-reference/orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp | cut -d' ' -f1)" = '4eef6f1b70b5baee5d1983d2480c02d73569b12af868ec23bbb6009d6ca1fa37'
          python -m py_compile orbittrace_m2d_blind_rediscovery_v1/run_scan.py
          mkdir -p output
          sha256sum orbittrace_m2d_blind_rediscovery_v1/PROTOCOL.md orbittrace_m2d_blind_rediscovery_v1/run_scan.py > output/preexecution_source_sha256.txt

      - name: Run target-free M2D full-catalogue scan
        env:
          PYTHONPATH: .:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_blind_rediscovery_v1/run_scan.py \
            --blind-source-parts orbittrace_fixed4_blind_catalogue/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --structural-source orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --support-source orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py \
            --exact-cpp m2d-reference/orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp \
            --output output
          cat output/M2D_BLIND_SCAN.md

      - name: Enforce pre-reveal firewall and frozen ranking
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          p=Path('output/orbittrace_m2d_blind_ranked_pretruth.json.gz')
          raw=gzip.decompress(p.read_bytes())
          r=json.loads(raw)
          assert r['verdict']=='BLIND_M2D_SCAN_FROZEN_AWAITING_SEPARATE_REVEAL'
          assert r['shower_truth_used'] is False
          assert r['orbittrace_target_information_access'] is False
          assert r['orbittrace_canonical_members_access'] is False
          assert r['prior_orbittrace_reveal_access'] is False
          assert r['post_result_parameter_search'] is False
          assert r['configuration']['target_interval_exclusion'] is None
          assert r['configuration']['years']==[2022,2023]
          assert r['candidate_count']==len(r['candidates']) and r['candidate_count']>0
          assert [x['rank'] for x in r['candidates']]==list(range(1,r['candidate_count']+1))
          print('INNER_SHA256='+hashlib.sha256(raw).hexdigest())
          print('GZIP_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('CANDIDATES='+str(r['candidate_count']))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          git -C m2d-reference rev-parse HEAD > output/m2d_reference_commit.txt
          cp /tmp/environment.txt output/environment.txt 2>/dev/null || true
          sha256sum \
            orbittrace_m2d_blind_rediscovery_v1/PROTOCOL.md \
            orbittrace_m2d_blind_rediscovery_v1/run_scan.py \
            orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py \
            m2d-reference/orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp \
            output/orbittrace_m2d_blind_ranked_pretruth.json.gz \
            > output/source_output_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-blind-rediscovery-scan-v1
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Comment PR with frozen scan result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '### M2D blind rediscovery scan frozen'
            echo
            cat output/M2D_BLIND_SCAN.md
          } > /tmp/comment.md
          gh pr comment 1378 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
