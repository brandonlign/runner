name: OrbitTrace log-density synchronous v1 synthetic audit

on:
  push:
    branches:
      - agent/orbittrace-log-density-sync-v1
    paths:
      - 'orbittrace_log_density_sync_v1/AUDIT_ACTIVATE.md'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  synthetic-zero-data:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact numerical runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          test "$(git hash-object orbittrace_log_density_sync_v1/PROTOCOL.md)" = '2adebded3915b1f4c52663bda909915114178125'
          test "$(git hash-object orbittrace_log_density_sync_v1/log_density_sync.py)" = '4c49ccb893ef34ef94d4f875dd1f91e27efd658a'
          test "$(git hash-object orbittrace_log_density_sync_v1/audit_synthetic.py)" = '12ab3af2827c497c05682bbaa5aabab3ce43f72d'
          test "$(git hash-object orbittrace_log_density_sync_v1/run_development.py)" = '48d1f7a7b2ffcf36bb46a15581c1bde15325bee9'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          python -m py_compile \
            orbittrace_log_density_sync_v1/log_density_sync.py \
            orbittrace_log_density_sync_v1/audit_synthetic.py \
            orbittrace_log_density_sync_v1/run_development.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py

      - name: Run zero-data synthetic audit
        env:
          PYTHONPATH: orbittrace_log_density_sync_v1:orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:.
        run: |
          set -euo pipefail
          rm -rf output
          python -u orbittrace_log_density_sync_v1/audit_synthetic.py
          python - <<'PY'
          import json
          r=json.load(open('output/LOG_DENSITY_SYNCHRONOUS_EOM_V1_SYNTHETIC_AUDIT.json'))
          assert r['verdict']=='PASS_LOG_DENSITY_SYNCHRONOUS_EOM_V1_SYNTHETIC_AUDIT'
          for k in ['scientific_data_access','gmn_access','sonotaco_access','asfn_access','efn_access','amos_access','maarsy_scientific_access','dms_scientific_access','target_information_access','target_region_events_accessed']:
              assert r[k] is False, (k,r[k])
          assert all(r['tests'].values())
          print(r['verdict'])
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum \
            orbittrace_log_density_sync_v1/PROTOCOL.md \
            orbittrace_log_density_sync_v1/log_density_sync.py \
            orbittrace_log_density_sync_v1/audit_synthetic.py \
            orbittrace_log_density_sync_v1/run_development.py \
            output/LOG_DENSITY_SYNCHRONOUS_EOM_V1_SYNTHETIC_AUDIT.json \
            > output/provenance_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-log-density-sync-v1-synthetic-audit
          path: output
          if-no-files-found: error
          retention-days: 90
