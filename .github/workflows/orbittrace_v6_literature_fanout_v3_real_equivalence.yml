name: OrbitTrace v6 matched-literature fanout v3 real equivalence

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-literature-fanout-v3
    paths:
      - orbittrace_v6_literature_fanout_v3/RUN_EQUIVALENCE.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-v6-literature-fanout-v3-real-equivalence
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: .:exact:exact/orbittrace_multi_anchor_energy_v3:orbittrace_wavelet_catalogue_v3:orbittrace_multi_anchor_energy_v3:/tmp
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  equivalence:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Require one-file child, canonical v6 PASS, and v6-LF scientific no-go
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          test "$files" = 'orbittrace_v6_literature_fanout_v3/RUN_EQUIVALENCE.md'
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          content="$(git show "$HEAD_SHA":orbittrace_v6_literature_fanout_v3/RUN_EQUIVALENCE.md)"
          mode="$(printf '%s\n' "$content" | sed -n '1p')"
          v6_run="$(printf '%s\n' "$content" | sed -n '2p')"
          lf_run="$(printf '%s\n' "$content" | sed -n '3p')"
          test "$mode" = 'EXECUTE_ORDINARY_V6_LITERATURE_EQUIVALENCE_AFTER_LF_NO_GO'
          [[ "$v6_run" =~ ^[0-9]+$ ]]
          [[ "$lf_run" =~ ^[0-9]+$ ]]
          test "$(printf '%s\n' "$content" | wc -l)" -eq 3
          test ! -e orbittrace_v6_literature_fanout_v3/RUN_EQUIVALENCE.md
          rm -rf /tmp/v6dev /tmp/lfdev && mkdir -p /tmp/v6dev /tmp/lfdev
          gh run download "$v6_run" \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-v6-semantic-replay-development \
            --dir /tmp/v6dev
          gh run download "$lf_run" \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-v6-lf-all-event-null-development-v2 \
            --dir /tmp/lfdev
          python - <<'PY'
          import json
          from pathlib import Path

          v6=json.loads(Path('/tmp/v6dev/v3_primary_catalogue_v6_development.json').read_text())
          assert v6['verdict']=='PASS_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT',v6['verdict']
          assert v6['configuration']['years']==[2022,2023]
          assert v6['configuration']['blind_exclusion']==[20.0,55.0]
          assert all(v6['gates'].values()),v6['gates']

          lf=json.loads(Path('/tmp/lfdev/v6_label_free_all_event_null_development.json').read_text())
          assert lf['verdict']=='FAIL_V6_LABEL_FREE_ALL_EVENT_NULL_NO_GO',lf['verdict']
          assert lf['configuration']['years']==[2022,2023]
          assert lf['configuration']['blind_exclusion']==[20.0,55.0]
          assert lf['configuration']['calibration_reservoir']=='all geometrically valid target-excluded scan events; no shower-label selection'
          integrity=[
              'exact_repaired_v6_source','blind_interval_exact','geometry_parser_never_accessed_label_values',
              'all_event_calibration_exact','at_least_30_supported_bins_each_year','proposal_budget_exact',
              'pretruth_family_payload_frozen_before_truth','truth_event_universe_exact',
          ]
          scientific=[
              'at_least_50_v3_families','qualified_at_least_v8','recovery100_at_least_v8',
              'mrr_at_least_v8','top100_precision_at_least_065','macro_f1_at_least_v8',
          ]
          assert all(lf['gates'][key] is True for key in integrity),lf['gates']
          assert not all(lf['gates'][key] is True for key in scientific),lf['gates']
          print('PASS_ORDINARY_V6_LITERATURE_EQUIVALENCE_SELECTION_PREREQUISITE')
          PY

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: ffe8351b9ee8df4418fb4926fab782d66180e276
          path: exact
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct exact runtime and pretruth matched-row manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash orbittrace_v6_literature_adapter/bootstrap_optimized_runtime.sh
          bash orbittrace_v6_literature_adapter/prepare_optimized_manifest.sh
          test -f input/archives/023a.zip
          test -f output_manifest/id_manifest.json
          test -f output_manifest/id_manifest.json.sha256

      - name: Capture exact pretruth HDBSCAN-2023 fanout boundary
        run: |
          set -euo pipefail
          mkdir -p preexact
          python -u orbittrace_v6_literature_fanout_v3/capture_preexact_panel.py \
            --panel hdbscan \
            --year 2023 \
            --v6-source runtime/run_v3_primary_catalogue_v6.repaired.py \
            --base-runner runtime/run_wavelet_catalogue_v3_development.py \
            --exact-row-runner runtime/run_exact_row_blind_safe.py \
            --id-manifest output_manifest/id_manifest.json \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --archive input/archives/023a.zip \
            --output preexact

      - name: Compare full-center and production split exact outputs
        run: |
          set -euo pipefail
          mkdir -p equivalence
          python -u orbittrace_v6_literature_fanout_v3/audit_real_exact_equivalence.py \
            --panel hdbscan \
            --year 2023 \
            --split-records 512 \
            --workers 4 \
            --preexact preexact/preexact_hdbscan_2023.pkl \
            --v6-source runtime/run_v3_primary_catalogue_v6.repaired.py \
            --base-runner runtime/run_wavelet_catalogue_v3_development.py \
            --exact-row-runner runtime/run_exact_row_blind_safe.py \
            --id-manifest output_manifest/id_manifest.json \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --archive input/archives/023a.zip \
            | tee equivalence/real_exact_equivalence.txt
          grep -q '^PASS_V6_LITERATURE_REAL_EXACT_EQUIVALENCE$' equivalence/real_exact_equivalence.txt

      - name: Assert pretruth firewall
        run: |
          set -euo pipefail
          test ! -e input/mapping
          grep -q '"truth_accessed": false' equivalence/real_exact_equivalence.txt
          grep -q '"competitor_cluster_labels_accessed": false' equivalence/real_exact_equivalence.txt
          grep -q '"target_interval_remains_excluded": true' equivalence/real_exact_equivalence.txt
          echo NO_TRUTH_MAPPING_NO_TARGET_REGION

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v6-literature-fanout-v3-real-equivalence
          path: equivalence
          if-no-files-found: error
          retention-days: 90
