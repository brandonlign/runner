name: OrbitTrace v6-LF MAARSY 2018/2019 external execution

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-lf-maarsy-2018-2019-execution-freeze
    paths:
      - orbittrace_v6_lf_maarsy_2018_2019_external/RUN.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-v6-lf-maarsy-2018-2019-external
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  authorize:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      development_run: ${{ steps.auth.outputs.development_run }}
      literature_run: ${{ steps.auth.outputs.literature_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Require one-file child, upstream PASS, and pristine-panel freshness
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          test "$files" = 'orbittrace_v6_lf_maarsy_2018_2019_external/RUN.md'
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          content="$(git show "$HEAD_SHA":orbittrace_v6_lf_maarsy_2018_2019_external/RUN.md)"
          mode="$(printf '%s\n' "$content" | sed -n '1p')"
          dev_run="$(printf '%s\n' "$content" | sed -n '2p')"
          lit_run="$(printf '%s\n' "$content" | sed -n '3p')"
          test "$mode" = 'EXECUTE_V6_LF_MAARSY_2018_2019_AFTER_DEVELOPMENT_AND_LITERATURE_PASS'
          [[ "$dev_run" =~ ^[0-9]+$ && "$lit_run" =~ ^[0-9]+$ ]]
          test "$(printf '%s\n' "$content" | wc -l)" -eq 3
          test ! -e orbittrace_v6_lf_maarsy_2018_2019_external/RUN.md
          test "$(gh run view "$dev_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$lit_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success

          mapfile -t dev_names < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$dev_run/artifacts" --jq '.artifacts[].name')
          dev_candidates=()
          for name in orbittrace-v6-lf-all-event-null-development-v2 orbittrace-v6-lf-strict-semantic-development; do
            if printf '%s\n' "${dev_names[@]}" | grep -qx "$name"; then dev_candidates+=("$name"); fi
          done
          test "${#dev_candidates[@]}" -eq 1
          mapfile -t lit_names < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$lit_run/artifacts" --jq '.artifacts[].name')
          printf '%s\n' "${lit_names[@]}" | grep -qx 'orbittrace-v6-lf-matched-literature-fanout-v1-result'
          rm -rf /tmp/authorize && mkdir -p /tmp/authorize/{dev,lit}
          gh run download "$dev_run" --repo "$GITHUB_REPOSITORY" --name "${dev_candidates[0]}" --dir /tmp/authorize/dev
          gh run download "$lit_run" --repo "$GITHUB_REPOSITORY" --name orbittrace-v6-lf-matched-literature-fanout-v1-result --dir /tmp/authorize/lit
          python - <<'PY'
          import json
          from pathlib import Path
          dev=json.loads(Path('/tmp/authorize/dev/v6_label_free_all_event_null_development.json').read_text())
          assert dev['verdict']=='PASS_V6_LABEL_FREE_ALL_EVENT_NULL_DEVELOPMENT',dev['verdict']
          assert dev['configuration']['years']==[2022,2023]
          assert dev['configuration']['blind_exclusion']==[20.0,55.0]
          assert dev['configuration']['calibration_reservoir']=='all geometrically valid target-excluded scan events; no shower-label selection'
          assert dev['configuration']['parameter_search'] is False and dev['configuration']['null_trimming'] is False
          assert all(dev['gates'].values()),dev['gates']
          lit=json.loads(Path('/tmp/authorize/lit/v6_lf_matched_literature.json').read_text())
          assert lit['classification'] in {'BROAD_CATALOGUE_SUPERIORITY','SPARSE_STREAM_SUPERIORITY'},lit['classification']
          assert lit['years']==[2023,2025] and lit['blind_exclusion']==[20.0,55.0]
          assert lit['pairwise_only_no_cross_denominator_comparison'] is True
          assert lit['panels']['hdbscan']['exact_event_rows']=={'2023':26460,'2025':19658}
          assert lit['panels']['sugar']['exact_event_rows']=={'2023':30414,'2025':23200}
          PY
          rm -rf /tmp/authorize

          # Full execution-time repository freshness. Only previously audited protocol/firewall
          # records may mention the panel; any new PR mention blocks first scientific-value access.
          gh search prs '"MAARSY 2018/2019"' --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,body > /tmp/open.json
          gh search prs '"MAARSY 2018/2019"' --repo "$GITHUB_REPOSITORY" --state closed --limit 100 --json number,title,body > /tmp/closed.json
          CURRENT_PR="$PR_NUMBER" python - <<'PY'
          import json,os
          allowed={540,542,548,573,575,587,589,590,int(os.environ['CURRENT_PR'])}
          rows=json.load(open('/tmp/open.json'))+json.load(open('/tmp/closed.json'))
          unexpected=[(r['number'],r['title']) for r in rows if int(r['number']) not in allowed]
          assert not unexpected,unexpected
          for r in rows:
              if int(r['number']) in {542,589,590}:
                  body=(r.get('body') or '').lower()
                  assert 'no maarsy 2018/2019' in body or 'before any maarsy 2018/2019' in body or 'before maarsy 2018/2019' in body
          print('PASS_MAARSY_2018_2019_PR_FRESHNESS')
          PY
          if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts" --jq '.artifacts[].name' | grep -Eiq 'maarsy.*2018.*2019.*(geometry|external|orbit)'; then
            echo 'Existing MAARSY 2018/2019 scientific artifact detected; pristine execution blocked' >&2
            exit 1
          fi
          echo "development_run=$dev_run" >> "$GITHUB_OUTPUT"
          echo "literature_run=$lit_run" >> "$GITHUB_OUTPUT"
          echo PASS_V6_LF_MAARSY_2018_2019_AUTHORIZATION_BEFORE_VALUES

  geometry:
    needs: authorize
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      geometry_verdict: ${{ steps.result.outputs.geometry_verdict }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.base.sha }}', path: external}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: agent/orbittrace-v6-lf-fanout-v1, path: execution}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: agent/orbittrace-v3-primary-catalogue-v6, path: frozen-v6}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: execution/ghoststream_fixed4_application/requirements.txt
      - name: Install exact frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r execution/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'h5py==3.11.0'
          test "$(git -C execution hash-object orbittrace_pooled_year_centroid_v8/run_development.py)" = 'f248df78e1258b132b41aecca6a985a5eb782654'
          test "$(git -C execution hash-object orbittrace_label_free_sparse_support_v6/run_development.py)" = '7995fc6b75d1fd51eb4b304ace39db28a5a1e876'
          python -m py_compile external/orbittrace_v6_lf_maarsy_2018_2019_external/maarsy_transport.py external/orbittrace_v6_lf_maarsy_2018_2019_external/run_geometry_freeze.py
      - name: Reconstruct exact v6-LF runtime
        run: bash execution/orbittrace_v6_label_free_all_event_null_fanout/bootstrap_runtime.sh
      - name: Execute frozen geometry/ranking stage with zero orbit access
        env:
          PYTHONPATH: external:execution:/tmp
        run: |
          set -euo pipefail
          mkdir -p geometry
          python -u external/orbittrace_v6_lf_maarsy_2018_2019_external/run_geometry_freeze.py \
            --repaired-v6-source /tmp/v6.repaired.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts execution/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload execution/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload execution/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts execution/mondrian_clique_development/source_parts_v2 \
            --output geometry
      - name: Freeze geometry verdict
        id: result
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('geometry/maarsy_2018_2019_geometry_freeze.json'))
          assert r['verdict'] in {'PASS_V6_LF_MAARSY_2018_2019_EXTERNAL_GEOMETRY_FREEZE','INCONCLUSIVE_V6_LF_MAARSY_2018_2019_EXTERNAL_GEOMETRY_POWER','FAIL_V6_LF_MAARSY_2018_2019_EXTERNAL_INTEGRITY'}
          assert r['orbit_access'] is False and r['label_access'] is False and r['target_information_access'] is False
          print('geometry_verdict='+r['verdict'])
          PY
      - uses: actions/upload-artifact@v4
        with: {name: orbittrace-v6-lf-maarsy-2018-2019-geometry-freeze, path: geometry, if-no-files-found: error, retention-days: 90}

  geometry_terminal:
    needs: geometry
    if: needs.geometry.outputs.geometry_verdict != 'PASS_V6_LF_MAARSY_2018_2019_EXTERNAL_GEOMETRY_FREEZE'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-v6-lf-maarsy-2018-2019-geometry-freeze, path: geometry}
      - name: Preserve no-orbit terminal classification
        run: |
          mkdir -p output
          cp geometry/maarsy_2018_2019_geometry_freeze.json output/v6_lf_maarsy_2018_2019_external_validation.json
          cp geometry/maarsy_2018_2019_geometry_freeze.sha256 output/preorbit.sha256
          echo NO_ORBIT_ACCESS_GEOMETRY_TERMINAL > output/CLAIM_BOUNDARY.txt
      - uses: actions/upload-artifact@v4
        with: {name: orbittrace-v6-lf-maarsy-2018-2019-external, path: output, if-no-files-found: error, retention-days: 90}

  orbital:
    needs: geometry
    if: needs.geometry.outputs.geometry_verdict == 'PASS_V6_LF_MAARSY_2018_2019_EXTERNAL_GEOMETRY_FREEZE'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.base.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact orbit-stage dependencies
        run: python -m pip install 'numpy==2.1.3' 'requests==2.32.3' 'h5py==3.11.0'
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-v6-lf-maarsy-2018-2019-geometry-freeze, path: geometry}
      - name: Fetch exact frozen D_SH comparator source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen output
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2" > /tmp/blob.json
          python - <<'PY'
          import base64,json
          obj=json.load(open('/tmp/blob.json')); assert obj['encoding']=='base64'
          open('frozen/literature_comparator_shared.py','wb').write(base64.b64decode(obj['content']))
          PY
          test "$(git hash-object frozen/literature_comparator_shared.py)" = 'ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2'
          python -m py_compile orbittrace_v6_lf_maarsy_2018_2019_external/maarsy_transport.py orbittrace_v6_lf_maarsy_2018_2019_external/run_orbital_validation.py frozen/literature_comparator_shared.py
      - name: Execute frozen post-ranking native-orbit validation
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -u orbittrace_v6_lf_maarsy_2018_2019_external/run_orbital_validation.py \
            --geometry-freeze geometry/maarsy_2018_2019_geometry_freeze.json \
            --geometry-sha geometry/maarsy_2018_2019_geometry_freeze.sha256 \
            --dsh-comparator frozen/literature_comparator_shared.py \
            --output output
          python - <<'PY'
          import json
          r=json.load(open('output/v6_lf_maarsy_2018_2019_external_validation.json'))
          assert r['verdict'] in {'FAIL_V6_LF_MAARSY_2018_2019_EXTERNAL_INTEGRITY','INCONCLUSIVE_V6_LF_MAARSY_2018_2019_EXTERNAL_POWER','PASS_V6_LF_MAARSY_2018_2019_EXTERNAL_VALIDATION','FAIL_V6_LF_MAARSY_2018_2019_EXTERNAL_VALIDATION'}
          assert r['target_information_access'] is False
          assert r['configuration']['parameter_search'] is False and r['configuration']['alternate_year_or_subset_search'] is False
          print('ORBITTRACE_V6_LF_MAARSY_2018_2019_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'v6lf':r['v6lf']['metrics'],'v8':r['v8']['metrics'],'power_gates':r['power_gates'],'scientific_gates':r['scientific_gates']},indent=2,sort_keys=True))
          print('ORBITTRACE_V6_LF_MAARSY_2018_2019_RESULT_END')
          PY
      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v6_lf_maarsy_2018_2019_external/*.py frozen/literature_comparator_shared.py geometry/* > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: orbittrace-v6-lf-maarsy-2018-2019-external, path: output, if-no-files-found: error, retention-days: 90}
