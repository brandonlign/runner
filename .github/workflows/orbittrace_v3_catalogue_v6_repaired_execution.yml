name: OrbitTrace v3 catalogue v6 repaired execution

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - .github/workflows/orbittrace_v3_catalogue_v6_repaired_execution.yml
      - orbittrace_v3_catalogue_v6_execution/run_repaired.sh

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-v3-catalogue-v6-repaired-execution
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-catalogue-v6-repaired-execution
          path: execution

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v6/ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v6/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Execute source-audited repaired v6
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash execution/orbittrace_v3_catalogue_v6_execution/run_repaired.sh

      - name: Record immutable environment
        if: always()
        run: |
          set -euo pipefail
          mkdir -p frozen-v6/output
          python --version > frozen-v6/output/python_version.txt
          python -m pip freeze > frozen-v6/output/environment.txt
          sha256sum \
            execution/.github/workflows/orbittrace_v3_catalogue_v6_repaired_execution.yml \
            execution/orbittrace_v3_catalogue_v6_execution/run_repaired.sh \
            >> frozen-v6/output/v6_execution_source_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v3-catalogue-v6-repaired-execution
          path: frozen-v6/output
          if-no-files-found: error
          retention-days: 90
