name: ISEF NGC1427A MUSE FITS structure probe v3
on:
  push:
    paths:
      - 'isef/ngc1427a_muse_fits_structure_probe_v3.py'
      - '.github/workflows/isef-ngc1427a-muse-fits-structure-probe-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: timeout 600s python isef/ngc1427a_muse_fits_structure_probe_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-ngc1427a-muse-fits-structure-probe-v3
          path: results/ngc1427a_muse_fits_structure_probe_v3.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## NGC1427A MUSE FITS structure probe v3'; echo '```json'; cat results/ngc1427a_muse_fits_structure_probe_v3.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
