name: OrbitTrace annual-density bifiltration GMN ranking v1 repair1

on:
  push:
    branches: [agent/orbittrace-annual-density-bifiltration-gmn-ranking-v1-repair1]
    paths:
      - 'orbittrace_annual_density_bifiltration_gmn_ranking_v1/ENGINEERING_REPAIR_1.md'
      - 'orbittrace_annual_density_bifiltration_gmn_ranking_v1/repair_family_id_adapter.py'
      - '.github/workflows/orbittrace_annual_density_bifiltration_gmn_ranking_v1_repair1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  evaluate-repair1:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 312b1b718ae105813de242355142a74e7d377d65
          path: sparse-src

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify frozen science plus repair
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/v3 input/v8 input/ranker input/prelabel output
          test "$(git hash-object orbittrace_annual_density_bifiltration_gmn_ranking_v1/PROTOCOL.md)" = '05d29d197ec77a9571deb1df2d6adbb7944e6dc3'
          test "$(git hash-object orbittrace_annual_density_bifiltration_gmn_ranking_v1/evaluate_after_freeze.py)" = '31cce36ba7b43f09451f1a556ef46f52277cab16'
          test "$(git hash-object orbittrace_annual_density_bifiltration_gmn_ranking_v1/repair_family_id_adapter.py)" = '4032dd3a0c9634af5a583ba7fc472b536f7960cd'
          test "$(git -C sparse-src hash-object orbittrace_topomodal_sparse_recovery_v1/run_development.py)" = '752df8212ce601227f6e9170b0fe994ba06b515d'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_annual_density_bifiltration_gmn_ranking_v1/repair_family_id_adapter.py orbittrace_annual_density_bifiltration_gmn_ranking_v1/evaluate_after_freeze.py
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

      - name: Download original successful prelabel only
        uses: actions/download-artifact@v4
        with:
          name: orbittrace-annual-density-bifiltration-gmn-ranking-v1-prelabel
          path: input/prelabel
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32037435314

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify and adapt frozen prelabel without truth
        run: |
          set -euo pipefail
          test "$(sha256sum input/prelabel/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json | cut -d' ' -f1)" = '95f8a57718a30b2c7e85016d505276d72cccb9e4ac1d6eb29f13067efc73dd0c'
          python orbittrace_annual_density_bifiltration_gmn_ranking_v1/repair_family_id_adapter.py \
            --input input/prelabel/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json \
            --output input/prelabel/BIFILTRATION_GMN_RANKING_V1_PRELABEL_REPAIR1.json \
            --report output/ENGINEERING_REPAIR1_REPORT.json
          test "$(sha256sum input/prelabel/BIFILTRATION_GMN_RANKING_V1_PRELABEL_REPAIR1.json | cut -d' ' -f1)" = 'd410b75c29d5262d8526873c61fbac4005547383f38d673bcb95771761c0850c'

      - name: Evaluate unchanged frozen catalogue and ten gates
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:sparse-src
        run: |
          set -euo pipefail
          python -u orbittrace_annual_density_bifiltration_gmn_ranking_v1/evaluate_after_freeze.py \
            --prelabel input/prelabel/BIFILTRATION_GMN_RANKING_V1_PRELABEL_REPAIR1.json \
            --sparse-source sparse-src/orbittrace_topomodal_sparse_recovery_v1/run_development.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce binding verdict and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/BIFILTRATION_GMN_RANKING_V1_RESULT.json'))
          assert r['verdict'] in {'PASS_ANNUAL_DENSITY_BIFILTRATION_V1_GMN_RANKING_RECOVERY','FAIL_ANNUAL_DENSITY_BIFILTRATION_V1_GMN_RANKING_RECOVERY'}
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_SPARSE_RANKING_RECOVERY_DEVELOPMENT'
          assert len(r['panels'])==16 and set(r['scale_aggregates'])=={'128','1024'} and len(r['gates'])==10
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_2013_2014_access'] is False
          assert r['amos_scientific_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['post_result_parameter_search'] is False
          print(r['verdict'])
          print(json.dumps({'scales':r['scale_aggregates'],'gates':r['gates']},indent=2,sort_keys=True))
          PY

      - name: Preserve result provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum \
            orbittrace_annual_density_bifiltration_gmn_ranking_v1/PROTOCOL.md \
            orbittrace_annual_density_bifiltration_gmn_ranking_v1/ENGINEERING_REPAIR_1.md \
            orbittrace_annual_density_bifiltration_gmn_ranking_v1/repair_family_id_adapter.py \
            orbittrace_annual_density_bifiltration_gmn_ranking_v1/evaluate_after_freeze.py \
            input/prelabel/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json \
            input/prelabel/BIFILTRATION_GMN_RANKING_V1_PRELABEL_REPAIR1.json \
            output/BIFILTRATION_GMN_RANKING_V1_RESULT.json \
            > output/result_provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-annual-density-bifiltration-gmn-ranking-v1-repair1-result
          path: output
          if-no-files-found: error
          retention-days: 90
