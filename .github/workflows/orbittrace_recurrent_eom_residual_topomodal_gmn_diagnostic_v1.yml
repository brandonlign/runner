name: OrbitTrace Recurrent-EOM residual TopoModal GMN diagnostic v1
on:
  push:
    branches: [agent/orbittrace-recurrent-eom-residual-topomodal-gmn-diagnostic-v1]
    paths:
      - '.github/workflows/orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1.yml'
      - 'orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install and audit frozen sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/v3 input/v8 input/ranker input/structural output/pretruth
          test "$(git hash-object orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/PROTOCOL.md)" = 'e46920d13d3cf10c40b8a00faa91cd1883c08f7a'
          test "$(git hash-object orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/generate_pretruth.py)" = 'dc707fab638b97e8d6963a7fd32f99c2a82410e2'
          test "$(git hash-object orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/evaluate_after_freeze.py)" = 'c1f86bc789643b4936073537f2e35e28ec6b524e'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/generate_pretruth.py orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/evaluate_after_freeze.py
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-hierarchy-scale-v1
          path: input/structural
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31955621864
      - name: Verify immutable upstream inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py|cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json|cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json|cut -d' ' -f1)" = 'e8cf7d92e96db9a1c99578f6efc63baf1534b94ab975e94f789fa6bc4a718497'
      - name: Generate and seal residual candidates without shower truth
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/generate_pretruth.py \
            --hierarchy-runner orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --structural-result-json input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json \
            --protocol orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/PROTOCOL.md \
            --output output/pretruth
      - name: Enforce pretruth activation before labels
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/pretruth/PRETRUTH.json'))
          print(r['verdict'])
          for p in r['panels']:
              print('d',p['denominator'],'b',p['bucket'],'reom',p['recurrent_candidate_count'],'A',p['accepted_event_count'],'R',p['residual_event_count'],'tm',p['residual_topomodal_candidate_count'],p['structural_activation_pass'])
          assert r['verdict']=='PASS_PRETRUTH_RESIDUAL_CONSTRUCTION'
          assert r['shower_truth_used'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_2013_2014_access'] is False and r['amos_scientific_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          PY
      - name: Preserve pretruth provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/pretruth/execution_commit.txt
          python -m pip freeze > output/pretruth/environment.txt
          sha256sum orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/PROTOCOL.md orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/generate_pretruth.py output/pretruth/PRETRUTH.json > output/pretruth/source_input_output_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-residual-topomodal-gmn-diagnostic-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact evaluation runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/v3 input/v8 input/ranker output/result
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-eom-residual-topomodal-gmn-diagnostic-v1-pretruth
          path: input/pretruth
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Binding target-excluded GMN candidate-existence diagnostic
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/evaluate_after_freeze.py \
            --pretruth input/pretruth/PRETRUTH.json \
            --hierarchy-runner orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --protocol orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/PROTOCOL.md \
            --output output/result
      - name: Enforce binding result contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/result/RESULT.json'))
          print(r['verdict'])
          for x in r['scale_year_aggregates']:
              print('d',x['denominator'],'year',x['year'],'cgf',x['candidate_generation_failures'],'recovered',x['complementary_recoveries'],'gate',x['transfer_gate'])
          assert r['verdict'] in {'PASS_RECURRENT_EOM_RESIDUAL_TOPOMODAL_GMN_DIAGNOSTIC_V1','FAIL_RECURRENT_EOM_RESIDUAL_TOPOMODAL_GMN_DIAGNOSTIC_V1'}
          assert len(r['gates'])==4
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_2013_2014_access'] is False and r['amos_scientific_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['ranking_or_catalogue_promotion_performed'] is False and r['post_result_parameter_search'] is False
          PY
      - name: Preserve result provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/result/execution_commit.txt
          python -m pip freeze > output/result/environment.txt
          sha256sum orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/PROTOCOL.md orbittrace_recurrent_eom_residual_topomodal_gmn_diagnostic_v1/evaluate_after_freeze.py input/pretruth/PRETRUTH.json output/result/RESULT.json > output/result/source_input_output_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-residual-topomodal-gmn-diagnostic-v1-result
          path: output/result
          if-no-files-found: error
          retention-days: 90
