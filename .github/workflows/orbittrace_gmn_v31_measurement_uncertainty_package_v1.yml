name: OrbitTrace v31 uncertainty member package
on: [workflow_dispatch, push]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/v8 input/p19 input/v3 output
          gh run download 31344632499 -n orbittrace-active-urc-ranker-source-export-v1 -D input/ranker
          gh run download 31217916558 -n orbittrace-pooled-year-centroid-v8-development -D input/v8
          gh run download 31340446086 -n orbittrace-p19-subthreshold-reciprocal-recurrence-development -D input/p19
          git -C frozen-v8 fetch --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py)
      - name: Build package
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:orbittrace_gmn_v31_measurement_uncertainty_schema_v1:orbittrace_gmn_v31_measurement_uncertainty_package_v1
        run: |
          python orbittrace_gmn_v31_measurement_uncertainty_package_v1/guard.py input/ranker/run_urc_union_ranker.py input/v8/pooled_year_centroid_v8_development.json input/p19/p19_prelabel_payload.json
          python -u orbittrace_gmn_v31_measurement_uncertainty_package_v1/build.py --p19-prelabel-json input/p19/p19_prelabel_payload.json --quality-source input/ranker/run_urc_union_ranker.py --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 --v8-result-json input/v8/pooled_year_centroid_v8_development.json --output output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-v31-measurement-uncertainty-package-v1
          path: output
