name: Matched-analogue predictive evidence Stage-0

on:
  push:
    branches:
      - agent/stream-fdr-stage0
    paths:
      - stream_fdr_stage0/matched_analog_eprocess.py
      - stream_fdr_stage0/predictive_eprocess_pilot.py
      - stream_fdr_stage0/MATCHED_ANALOG_EPROCESS_PROTOCOL.md
      - .github/workflows/matched_analog_eprocess.yml
  pull_request:
    branches:
      - main
    paths:
      - stream_fdr_stage0/matched_analog_eprocess.py
      - stream_fdr_stage0/MATCHED_ANALOG_EPROCESS_PROTOCOL.md
      - .github/workflows/matched_analog_eprocess.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matched-analog-eprocess-stage0
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stream-fdr-stage0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stream_fdr_stage0/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r stream_fdr_stage0/requirements.txt
      - name: Compile frozen matched-analogue test
        run: |
          python -m py_compile stream_fdr_stage0/audit_multinetwork.py
          python -m py_compile stream_fdr_stage0/shared_scan_pilot.py
          python -m py_compile stream_fdr_stage0/predictive_eprocess_pilot.py
          python -m py_compile stream_fdr_stage0/matched_analog_eprocess.py
      - name: Run matched-analogue kill test
        run: python stream_fdr_stage0/matched_analog_eprocess.py
      - name: Record provenance
        run: |
          mkdir -p stream_fdr_stage0/results/matched_analog_eprocess
          sha256sum stream_fdr_stage0/matched_analog_eprocess.py stream_fdr_stage0/predictive_eprocess_pilot.py stream_fdr_stage0/MATCHED_ANALOG_EPROCESS_PROTOCOL.md > stream_fdr_stage0/results/matched_analog_eprocess/source_sha256.txt
          find stream_fdr_stage0/data/multinetwork -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > stream_fdr_stage0/results/matched_analog_eprocess/input_sha256.txt
          python --version > stream_fdr_stage0/results/matched_analog_eprocess/python_version.txt
          python -m pip freeze > stream_fdr_stage0/results/matched_analog_eprocess/environment.txt
      - name: Upload matched-analogue evidence
        uses: actions/upload-artifact@v4
        with:
          name: matched-analog-eprocess-stage0
          path: stream_fdr_stage0/results/matched_analog_eprocess
          if-no-files-found: error
          retention-days: 90
      - name: Preserve results on runner branch
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stream_fdr_stage0/results/matched_analog_eprocess
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Preserve matched-analogue e-process results'
            git pull --rebase origin agent/stream-fdr-stage0
            git push origin HEAD:agent/stream-fdr-stage0
          fi
