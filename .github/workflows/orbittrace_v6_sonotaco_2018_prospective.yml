name: OrbitTrace v6 SonotaCo 2018 prospective validation

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-2018-prospective-base
    paths:
      - orbittrace_corroborated_rescue_v6/SONOTACO_2018_PROSPECTIVE_PROTOCOL.md
      - orbittrace_corroborated_rescue_v6/run_sonotaco_2018_v6_prospective.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-v6-sonotaco-2018-prospective-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-2018-prospective

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt

      - name: Freeze and audit prospective source before 2018 scientific access
        env:
          PYTHONPATH: ${{ github.workspace }}/orbittrace_literature_comparison:${{ github.workspace }}/orbittrace_multi_anchor_energy_v3:${{ github.workspace }}/orbittrace_corroborated_rescue_v6
        run: |
          set -euo pipefail
          mkdir -p input/eligibility input/repaired output
          test "$(git hash-object orbittrace_literature_comparison/wavelet_episode_comparator.py)" = "493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8"
          test "$(git hash-object orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"
          python -m py_compile \
            orbittrace_literature_comparison/wavelet_episode_comparator.py \
            orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py \
            orbittrace_corroborated_rescue_v6/decision_v6.py \
            orbittrace_corroborated_rescue_v6/build_sonotaco_2018_confirmation_source.py \
            orbittrace_corroborated_rescue_v6/run_sonotaco_2018_v6_prospective.py
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'orbittrace_literature_comparison')
          sys.path.insert(0, 'orbittrace_multi_anchor_energy_v3')
          sys.path.insert(0, 'orbittrace_corroborated_rescue_v6')
          import wavelet_episode_comparator as wavelet
          import multi_anchor_energy_v3 as v3
          import decision_v6 as decision
          assert all(wavelet.self_test().values()), wavelet.self_test()
          assert all(v3.self_test().values()), v3.self_test()
          assert all(decision.self_test().values()), decision.self_test()
          freeze = json.load(open('orbittrace_corroborated_rescue_v6/SONOTACO_2018_ELIGIBILITY_FREEZE.json'))
          assert freeze['verdict'] == 'PASS_SONOTACO_2018_V6_ELIGIBILITY_AUDIT'
          assert freeze['scientific_scores_computed'] is False
          assert freeze['workflow_run'] == 31155087628
          assert freeze['artifact_id'] == 8984819293
          assert freeze['counts']['supported_bin_count'] == 33
          assert freeze['counts']['eligible_shower_count'] == 33
          assert freeze['counts']['calibration_episodes'] == 16896
          assert freeze['counts']['negative_episodes'] == 2112
          assert freeze['counts']['positive_episodes'] == 528
          assert freeze['benchmark_constants']['calibration_per_bin'] == 512
          assert freeze['benchmark_constants']['calibration_denominator'] == 513
          assert freeze['benchmark_constants']['primary_v3_max_rank'] == 17
          assert freeze['benchmark_constants']['fixed4_max_rank'] == 15
          assert freeze['benchmark_constants']['corroboration_v3_max_rank'] == 122
          protocol = open('orbittrace_corroborated_rescue_v6/SONOTACO_2018_PROSPECTIVE_PROTOCOL.md').read()
          required = (
              'one scientific execution',
              'first 128 calibration nulls',
              '17/513', '15/513', '122/513',
              'pooled FPR <= 0.055',
              'worst-sector FPR <= 0.08',
              'k=4 recall', 'k=6/8/12',
              'No 2018 result may alter',
          )
          for phrase in required:
              assert phrase in protocol, phrase
          print('PASS_PRE_2018_PROSPECTIVE_SOURCE_FREEZE')
          PY
          sha256sum \
            orbittrace_corroborated_rescue_v6/SONOTACO_2018_PROSPECTIVE_PROTOCOL.md \
            orbittrace_corroborated_rescue_v6/run_sonotaco_2018_v6_prospective.py \
            orbittrace_corroborated_rescue_v6/SONOTACO_2018_ELIGIBILITY_FREEZE.json \
            orbittrace_corroborated_rescue_v6/decision_v6.py \
            orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py \
            orbittrace_literature_comparison/wavelet_episode_comparator.py \
            > output/prospective_source_sha256.txt
          git rev-parse HEAD | tee output/prospective_source_commit.txt
          git diff --exit-code
          git diff --cached --exit-code

      - name: Retrieve and guard exact 2018 eligibility evidence and validated parser ancestor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 31155087628 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-v6-sonotaco-2018-eligibility-audit \
            --dir input/eligibility
          python - <<'PY'
          import json
          committed = json.load(open('orbittrace_corroborated_rescue_v6/SONOTACO_2018_ELIGIBILITY_FREEZE.json'))
          observed = json.load(open('input/eligibility/sonotaco_2018_v6_eligibility_audit.json'))
          assert observed['verdict'] == committed['verdict']
          assert observed['confirmation_source_sha256'] == committed['parser']['sonotaco_2018_confirmation_source_sha256']
          assert observed['counts'] == committed['counts']
          assert observed['benchmark_constants'] == committed['benchmark_constants']
          assert all(observed['gates'].values())
          assert not any(observed['prohibited_access'].values())
          print('PASS_EXACT_2018_ELIGIBILITY_FREEZE_GUARD')
          PY
          gh run download 30920687116 \
            --repo "$GITHUB_REPOSITORY" \
            --name sonotaco-2023-confirmation-source-repair-v2 \
            --dir input/repaired
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/repaired/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -

      - name: Reconstruct exact frozen 2018 parser before archive access
        run: |
          set -euo pipefail
          python orbittrace_corroborated_rescue_v6/build_sonotaco_2018_confirmation_source.py \
            --source-2023 input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            --output /tmp/run_sonotaco_2018_confirmation.py
          echo '7293fe0191f98c8b87fcb56347a0c44a634d95face0477b60c299a06bb5cb92f  /tmp/run_sonotaco_2018_confirmation.py' | sha256sum -c -
          python -m py_compile /tmp/run_sonotaco_2018_confirmation.py
          echo 'PASS_EXACT_2018_PARSER_GUARD'

      - name: Retrieve exact GMN-MDC mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -

      - name: Download exact audited SonotaCo 2018 archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output input/018a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/018a.zip
          echo 'ace35a8842c7af730b08da5cf491377b02d3f962c8185fe2f542c68d28e4ab55  input/018a.zip' | sha256sum -c -

      - name: Execute the single frozen SonotaCo 2018 prospective validation
        env:
          PYTHONPATH: ${{ github.workspace }}/orbittrace_literature_comparison:${{ github.workspace }}/orbittrace_multi_anchor_energy_v3:${{ github.workspace }}/orbittrace_corroborated_rescue_v6
        run: |
          set -euo pipefail
          python orbittrace_corroborated_rescue_v6/run_sonotaco_2018_v6_prospective.py \
            --archive input/018a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --confirmation-source /tmp/run_sonotaco_2018_confirmation.py \
            --eligibility-freeze orbittrace_corroborated_rescue_v6/SONOTACO_2018_ELIGIBILITY_FREEZE.json \
            --workers 4 \
            --output output
          cat output/SONOTACO_2018_V6_PROSPECTIVE_RESULT.md

      - name: Record immutable prospective provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output
          sha256sum \
            input/eligibility/sonotaco_2018_v6_eligibility_audit.json \
            input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            /tmp/run_sonotaco_2018_confirmation.py \
            input/audit.json input/018a.zip \
            >> output/prospective_source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v6-sonotaco-2018-prospective
          path: output
          if-no-files-found: error
          retention-days: 90
