name: ISEF TESS binary post-prime known geometry inventory
on:
  push:
    branches: [main]
    paths:
      - 'isef/TESS_BINARY_POSTPRIME_KNOWN_GEOMETRY_TRIGGER'
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata-only dependencies
        run: pip install 'numpy<2' astropy requests tesswcs
      - name: Verify syntax
        run: python -m py_compile isef/tess_binary_postprime_known_geometry_inventory.py
      - name: Screen historical Sectors 14-96 without photometry
        run: |
          cd isef
          python tess_binary_postprime_known_geometry_inventory.py
      - name: Preserve metadata inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-tess-binary-postprime-known-geometry
          path: isef/results/tess_binary_postprime_known_geometry_inventory/
          if-no-files-found: warn
