name: OrbitTrace SonotaCo 2022 fixed4-wavelet hybrid validation

on:
  pull_request:
    branches:
      - agent/orbittrace-hybrid-2022-source-audit
    paths:
      - .github/workflows/orbittrace_sonotaco_2022_fixed4_wavelet_hybrid_validation.yml
      - orbittrace_literature_comparison/run_sonotaco_2022_fixed4_wavelet_hybrid_validation.py
      - orbittrace_literature_comparison/FIXED4_WAVELET_HYBRID_PROTOCOL.json
      - orbittrace_literature_comparison/fixed4_wavelet_hybrid.py
      - orbittrace_literature_comparison/wavelet_episode_comparator.py
      - orbittrace_literature_freeze/SONOTACO_2022_LABEL_ELIGIBILITY_RESULT.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-sonotaco-2022-fixed4-wavelet-hybrid-validation
  cancel-in-progress: true

jobs:
  prospective-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-hybrid-2022-validation

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt

      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt

      - name: Verify exact prospective source and freezes before 2022 score access
        env:
          PYTHONPATH: orbittrace_literature_comparison
        run: |
          set -euo pipefail
          mkdir -p input output
          test "$(git hash-object orbittrace_literature_comparison/run_sonotaco_2022_fixed4_wavelet_hybrid_validation.py)" = "be516f563e453c5d4967af2e679a6392a4423f0e"
          test "$(git hash-object orbittrace_literature_comparison/FIXED4_WAVELET_HYBRID_PROTOCOL.json)" = "2a8d154ccda12ac4c5612cfc13448b6609c389f8"
          test "$(git hash-object orbittrace_literature_comparison/fixed4_wavelet_hybrid.py)" = "504ca0ceef347fe3fdde3274738d03cc9b51bd52"
          test "$(git hash-object orbittrace_literature_comparison/wavelet_episode_comparator.py)" = "493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8"
          test "$(git hash-object orbittrace_literature_freeze/SONOTACO_2022_LABEL_ELIGIBILITY_RESULT.json)" = "812b9d1d00002744a08bb69fdeb3a2590dea408a"
          echo 'bee07d7baa95b5e4bdba2e295a8ffd4ee47d127480283add0623a2af18e77613  orbittrace_literature_comparison/run_sonotaco_2022_fixed4_wavelet_hybrid_validation.py' | sha256sum -c -
          python -m py_compile \
            orbittrace_literature_comparison/run_sonotaco_2022_fixed4_wavelet_hybrid_validation.py \
            orbittrace_literature_comparison/fixed4_wavelet_hybrid.py \
            orbittrace_literature_comparison/wavelet_episode_comparator.py
          python - <<'PY'
          import json
          from pathlib import Path
          import fixed4_wavelet_hybrid as hybrid
          import wavelet_episode_comparator as wavelet
          protocol = json.loads(Path('orbittrace_literature_comparison/FIXED4_WAVELET_HYBRID_PROTOCOL.json').read_text())
          eligibility = json.loads(Path('orbittrace_literature_freeze/SONOTACO_2022_LABEL_ELIGIBILITY_RESULT.json').read_text())
          assert protocol['status'] == 'frozen_before_any_hybrid_score_on_2025_2023_or_2022'
          assert protocol['evaluation']['fresh_independent_corpus'] == 'SonotaCo 2022 one-shot'
          assert protocol['combination_rule']['alternative_combiners_tested'] == 0
          assert protocol['decision_rules']['no_post_result_relaxation'] is True
          assert eligibility['verdict'] == 'PASS_SONOTACO_2022_LABEL_ELIGIBILITY_AUDIT'
          assert eligibility['pre_score_gates']['no_detector_score_computed'] is True
          assert all(wavelet.self_test().values())
          assert all(hybrid.self_test().values())
          print('PASS_FINAL_PRE_2022_SCORE_GATE')
          PY

      - name: Retrieve exact validated parser source and mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30920687116 --repo "$GITHUB_REPOSITORY" --name sonotaco-2023-confirmation-source-repair-v2 --dir input/repaired
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/repaired/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          gh run download 30855193522 --repo "$GITHUB_REPOSITORY" --name real-shower-meta-data-audit --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -
          python orbittrace_literature_comparison/build_sonotaco_2022_confirmation_source.py \
            --source-2023 input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            --output /tmp/run_sonotaco_2022_confirmation.py
          echo '653e17d2b4e0c70ff0d64164541dd5dd11cf25a3f063b21d863a5e0d15e50756  /tmp/run_sonotaco_2022_confirmation.py' | sha256sum -c -

      - name: Download exact prospective SonotaCo 2022 archive
        run: |
          curl --fail --location --retry 3 --output input/022a.zip https://www.astro.sk/iaumdcDB/public/data/SNMv3/022a.zip
          echo '94537246035322b466df8dc17e19ef08212433e2bda0a8fe3d53dc45ba7c747d  input/022a.zip' | sha256sum -c -

      - name: Execute single prospective validation
        env:
          PYTHONPATH: orbittrace_literature_comparison
        run: |
          set -euo pipefail
          python orbittrace_literature_comparison/run_sonotaco_2022_fixed4_wavelet_hybrid_validation.py \
            --archive input/022a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --confirmation-source /tmp/run_sonotaco_2022_confirmation.py \
            --protocol orbittrace_literature_comparison/FIXED4_WAVELET_HYBRID_PROTOCOL.json \
            --eligibility-freeze orbittrace_literature_freeze/SONOTACO_2022_LABEL_ELIGIBILITY_RESULT.json \
            --workers 4 \
            --output output
          cat output/SONOTACO_2022_FIXED4_WAVELET_HYBRID_VALIDATION.md

      - name: Record immutable provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output
          sha256sum \
            orbittrace_literature_comparison/run_sonotaco_2022_fixed4_wavelet_hybrid_validation.py \
            orbittrace_literature_comparison/FIXED4_WAVELET_HYBRID_PROTOCOL.json \
            orbittrace_literature_comparison/fixed4_wavelet_hybrid.py \
            orbittrace_literature_comparison/wavelet_episode_comparator.py \
            orbittrace_literature_freeze/SONOTACO_2022_LABEL_ELIGIBILITY_RESULT.json \
            /tmp/run_sonotaco_2022_confirmation.py \
            input/audit.json input/022a.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload prospective evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-sonotaco-2022-fixed4-wavelet-hybrid-validation
          path: output
          if-no-files-found: error
          retention-days: 90
