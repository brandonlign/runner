name: OrbitTrace v6-LF literature fanout v1 source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-lf-literature-freeze
    paths:
      - orbittrace_v6_lf_literature_fanout_v1/**
      - .github/workflows/orbittrace_v6_lf_literature_fanout_v1_source_audit.yml

permissions:
  contents: read

concurrency:
  group: orbittrace-v6-lf-literature-fanout-v1-source-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-lf-literature-fanout-v1
      - name: Compile and prove label-free execution boundary
        run: |
          set -euo pipefail
          python -m py_compile orbittrace_v6_lf_literature_fanout_v1/*.py
          PYTHONPATH=. python - <<'PY'
          import ast
          from pathlib import Path
          from orbittrace_v6_lf_literature_fanout_v1.scheduler import build_slices

          root=Path('orbittrace_v6_lf_literature_fanout_v1')
          common=(root/'common.py').read_text(); capture=(root/'capture_preexact.py').read_text(); runner=(root/'run_exact_slice.py').read_text(); replay=(root/'replay_pretruth.py').read_text(); protocol=(root/'PROTOCOL.md').read_text()

          assert 'calibration = [dict(event, complex_key="SPORADIC") for event in scan_events]' in common
          assert 'native_ids' in common and 'native_ids <= scan_ids' in common
          assert 'for event in scan_events' in common
          assert 'native_background_membership_used_for_calibration' not in common
          for forbidden in ('evaluate_frozen','load_truth','mapping_path','normalize_label'):
              assert forbidden not in common
          assert 'v6.exact_rescore_window_v6=capture' in capture
          assert 'return []' in capture
          assert 'truth_accessed":False' in capture and 'competitor_cluster_labels_accessed":False' in capture
          assert 'native_background_membership_used_for_calibration":False' in capture
          assert runner.count('v6.exact_rescore_window_v6(')==1
          assert 'window=[lookup[event_id] for event_id in ids]' in runner
          assert 'install(v6,workers=args.workers,min_parallel_records=256)' in runner
          assert 'native_background_membership_used_for_calibration":False' in runner

          tree=ast.parse(replay); defs={n.name:n for n in ast.walk(tree) if isinstance(n,ast.FunctionDef)}
          semantic=ast.get_source_segment(replay,defs['semantic_equal'])
          assert 'set(a)==set(b)' in semantic
          assert 'len(a)==len(b)' in semantic
          assert 'type(a) is type(b) and a==b' in semantic
          assert 'math.isclose(af,bf,rel_tol=REL_TOL,abs_tol=ABS_TOL)' in semantic
          assert 'REL_TOL=1e-12' in replay and 'ABS_TOL=1e-12' in replay
          replay_fn=ast.get_source_segment(replay,defs['replay'])
          assert 'semantic_equal(captured,records,center)' in replay_fn
          assert '[str(r["proposal_anchor_id"]) for r in records]==[str(r["proposal_anchor_id"]) for r in captured]' in replay_fn
          assert 'canonical_sha(ids)==spec["window_event_ids_sha256"]' in replay_fn
          assert 'native_background_membership_used_for_calibration":False' in replay
          assert 'calibration_reservoir":"all exact matched scan rows"' in replay

          pre={
              'ordered_centers':[10.0,20.0,30.0],
              'centers':{
                  10.0:{'records':[{}]*1300,'window_event_ids':['a']*1000},
                  20.0:{'records':[{}]*420,'window_event_ids':['b']*700},
                  30.0:{'records':[{}]*180,'window_event_ids':['c']*200},
              },
          }
          bins1,loads1=build_slices(pre,4); bins2,loads2=build_slices(pre,4)
          assert bins1==bins2 and loads1==loads2
          assert sum(loads1)==1300*1000+420*700+180*200
          assert len({i for i,values in enumerate(bins1) if any(float(p['center'])==10.0 for p in values)})>=2
          assert max(loads1)<sum(loads1)

          assert 'every exact matched scan row' in protocol
          assert 'relative and absolute tolerance `1e-12`' in protocol
          assert 'Native-background IDs' in protocol
          print('PASS_V6_LF_LITERATURE_FANOUT_V1_SOURCE_AUDIT')
          print('synthetic_loads',loads1)
          PY
      - name: Assert source-only firewall
        run: |
          test ! -e input
          test ! -e output
          echo NO_BENCHMARK_ARCHIVE_NO_TRUTH_MAPPING_NO_TARGET_ACCESS
