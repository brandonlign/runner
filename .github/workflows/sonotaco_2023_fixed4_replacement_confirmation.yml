name: SonotaCo 2023 fixed4 replacement confirmation

on:
  pull_request:
    branches:
      - agent/sonotaco-2023-confirmation-source-repair-v2
    paths:
      - .github/workflows/sonotaco_2023_fixed4_replacement_confirmation.yml
      - sonotaco_2023_fixed4_replacement_confirmation/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sonotaco-2023-fixed4-replacement-confirmation
  cancel-in-progress: true

jobs:
  one-shot-replacement-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sonotaco-2023-fixed4-replacement-confirmation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - name: Retrieve and verify exact repaired 2023 sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/repaired output
          gh run download 30920687116 \
            --repo "$GITHUB_REPOSITORY" \
            --name sonotaco-2023-confirmation-source-repair-v2 \
            --dir input/repaired
          echo '9619dfc0b339b39d287833778769f12a643e2b0157fdcd6115cd9c40be528322  input/repaired/audit_sonotaco_2023_v2.py' | sha256sum -c -
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/repaired/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          echo '2b09fafcb8a2d7886cb2e0b1b90f2447580b308d755269addd500535f2f4da0f  input/repaired/sonotaco_2023_confirmation_v2.py.gz.b64' | sha256sum -c -
          echo '882c21f2ac48689ab7a0d7a990496f7e055ab571b10c6f00bb63d8a18f8f7b3f  input/repaired/sonotaco_2023_confirmation_source_repair_v2.json' | sha256sum -c -
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          repair = json.loads(Path('input/repaired/sonotaco_2023_confirmation_source_repair_v2.json').read_text())
          if repair['verdict'] != 'PASS_SONOTACO_2023_CONFIRMATION_SOURCE_REPAIR_V2' or not all(repair['gates'].values()):
              raise RuntimeError('source-repair artifact did not pass every frozen gate')
          if repair['opaque_structure']['expected_data_rows'] != 47087:
              raise RuntimeError(f"unexpected frozen row count: {repair['opaque_structure']['expected_data_rows']}")
          encoded = ''.join(Path('input/repaired/sonotaco_2023_confirmation_v2.py.gz.b64').read_text(encoding='ascii').split())
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6'
          if digest != expected:
              raise RuntimeError(f'confirmation source mismatch: {digest}')
          if source != Path('input/repaired/run_sonotaco_2023_fixed4_confirmation.py').read_bytes():
              raise RuntimeError('decoded payload differs from preserved source file')
          Path('/tmp/run_sonotaco_2023_fixed4_confirmation.py').write_bytes(source)
          print('confirmation source bytes:', len(source))
          print('confirmation source SHA-256:', digest)
          PY
          python -m py_compile /tmp/run_sonotaco_2023_fixed4_confirmation.py
          python -m py_compile input/repaired/audit_sonotaco_2023_v2.py
      - name: Verify inherited frozen detector sources before archive access
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          checks = []
          baseline_encoded = ''.join(Path('real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64').read_text().split())
          checks.append(('baseline', gzip.decompress(base64.b64decode(baseline_encoded, validate=True)), '7718ac5229475f4240305ad9c1e073c49702c771df36612d9be5baa877b46a50'))
          scorer_parts = [Path(f'mondrian_clique_development/source_parts_v2/part{i:02d}.b64') for i in range(4)]
          scorer_encoded = ''.join(''.join(path.read_text().split()) for path in scorer_parts)
          checks.append(('scorer', gzip.decompress(base64.b64decode(scorer_encoded, validate=True)), 'f1c121e97a660a3820a11814c4325eb3ab33d34a031e83bdfb03b4b392e259b8'))
          phase_encoded = ''.join(Path('sonotaco_k4_phase_scale_diagnostic/source_parts/part00.b64').read_text().split())
          checks.append(('phase-scale', gzip.decompress(base64.b64decode(phase_encoded, validate=True)), 'e5cdb6eb8d07fdbcc5c29a4d02139fff86386e8aebde83717fdc7485acda265d'))
          for name, source, expected in checks:
              digest = hashlib.sha256(source).hexdigest()
              if digest != expected:
                  raise RuntimeError(f'{name} source mismatch: {digest}')
              compile(source, f'frozen_{name}.py', 'exec')
              print(name, len(source), digest)
          PY
      - name: Retrieve exact GMN-MDC mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -
      - name: Download exact SonotaCo 2023 replacement archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output input/023a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/023a.zip
          echo '9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430  input/023a.zip' | sha256sum -c -
      - name: Execute frozen one-shot replacement independent replication
        run: |
          set -euo pipefail
          python /tmp/run_sonotaco_2023_fixed4_confirmation.py \
            --archive input/023a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --phase-source-parts sonotaco_k4_phase_scale_diagnostic/source_parts \
            --parser-v2-source input/repaired/audit_sonotaco_2023_v2.py \
            --workers 4 \
            --output output
          cat output/SONOTACO_2023_FIXED4_CONFIRMATION.md
      - name: Record immutable provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            sonotaco_2023_fixed4_replacement_confirmation/PROTOCOL.md \
            input/repaired/audit_sonotaco_2023_v2.py \
            input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            input/repaired/sonotaco_2023_confirmation_v2.py.gz.b64 \
            input/repaired/sonotaco_2023_confirmation_source_repair_v2.json \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            sonotaco_k4_phase_scale_diagnostic/source_parts/part00.b64 \
            input/audit.json input/023a.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload one-shot replacement-replication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonotaco-2023-fixed4-replacement-confirmation
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Enforce every frozen confirmation gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('output/sonotaco_2023_fixed4_confirmation.json').read_text())
          print(json.dumps({
              'counts': result['counts'],
              'candidate_weak_auc': result['candidate_weak_auc'],
              'fixed_comparator_weak_auc': result['fixed_comparator_weak_auc'],
              'false_positive': result['false_positive'],
              'worst_reporting_sector_0.05': result['worst_reporting_sector_0.05'],
              'recall': result['recall'],
              'gates': result['gates'],
              'verdict': result['verdict'],
          }, indent=2))
          if not all(result['gates'].values()):
              raise SystemExit('Frozen SonotaCo 2023 replacement replication gate failed')
          PY
