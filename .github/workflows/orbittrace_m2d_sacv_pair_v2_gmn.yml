name: OrbitTrace M2D SACV recurrence-pair v2 GMN

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/orbittrace-m2d-sacv-v1-gmn-development
    paths:
      - 'orbittrace_m2d_sacv_pair_v2/**'
      - '.github/workflows/orbittrace_m2d_sacv_pair_v2_gmn.yml'

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: orbittrace-m2d-sacv-pair-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute frozen target-excluded recurrence-pair v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash orbittrace_m2d_sacv_pair_v2/run_binding.sh | tee /tmp/pair-v2.log
      - name: Publish binding result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -f output/m2d-sacv-pair-v2-gmn/truth/M2D_SACV_PAIR_V2_GMN_RESULT.json ]; then
            python - <<'PY' > /tmp/comment.md
          import json,hashlib
          p='output/m2d-sacv-pair-v2-gmn/truth/M2D_SACV_PAIR_V2_GMN_RESULT.json';r=json.load(open(p))
          print('## SACV recurrence-pair v2 — binding target-excluded GMN development')
          print();print(f"Verdict: **`{r['verdict']}`**");print(f"- result SHA-256: `{hashlib.sha256(open(p,'rb').read()).hexdigest()}`")
          for c in ('sugar2017','hdbscan2025'):
              s=r['aggregates'][c]['paired_same_discovery'];b=r['aggregates'][c]['sacv_v1_baseline']
              print(f"- {c}: precision `{s['extraction_mean_precision']:.6f}` vs SACV `{b['precision']:.6f}`; F1 `{s['extraction_mean_f1']:.6f}` vs SACV `{b['f1']:.6f}`; refined `{s['strict_refined_assignment_count']}`")
          print('- OrbitTrace target information accessed: `false`')
          PY
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Pair-v2 ended technically before a valid scientific result; no scientific rule or gate changed."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-sacv-pair-v2-gmn-development
          path: output/m2d-sacv-pair-v2-gmn
          if-no-files-found: warn
          retention-days: 90
