name: OrbitTrace UKMON 2020-2021 zero-data freshness adjudication

on:
  pull_request:
    branches:
      - agent/orbittrace-ukmon-2020-2021-freshness-adjudication
    paths:
      - 'orbittrace_ukmon_2020_2021_freshness_adjudication/RUN.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  adjudicate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out frozen adjudication parent
        uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-ukmon-2020-2021-freshness-adjudication
          fetch-depth: 1

      - name: Enforce adjudication source and fetch exact evidence ref
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_ukmon_2020_2021_freshness_adjudication/adjudicate.py)" = "6db2ce7a0153aba8e7b9ba87ae5448385b722e58"
          python -m py_compile orbittrace_ukmon_2020_2021_freshness_adjudication/adjudicate.py
          git fetch --no-tags origin \
            '+refs/heads/agent/orbittrace-label-free-v6-ukmon-2024-2025-external:refs/remotes/origin/agent/orbittrace-label-free-v6-ukmon-2024-2025-external'

      - name: Fetch and verify immutable corrected-audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input_audit
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9011892667/zip" \
            -o input_audit.zip
          echo "e1bc2687a08c0812b123f5741beb429134940baff76cbb7f172c9a9836aef0b9  input_audit.zip" | sha256sum -c -
          unzip -q input_audit.zip -d input_audit
          test -f input_audit/ukmon_2020_2021_repo_freshness_audit.json

      - name: Adjudicate sole hit from source context only
        run: |
          set -euo pipefail
          python orbittrace_ukmon_2020_2021_freshness_adjudication/adjudicate.py

      - name: Enforce zero-data boundary
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/ukmon_2020_2021_freshness_adjudication.json')
          if p.exists():
              r=json.loads(p.read_text())
              assert r['raw_audit_verdict_preserved'].startswith('FAIL_')
              assert r['raw_hit_count'] == 1
              assert r['additional_hits_forgiven'] == 0
              assert r['catalogue_access_this_adjudication'] is False
              assert r['meteor_api_contacted'] is False
              assert r['scientific_value_access_this_adjudication'] is False
              assert r['label_access_this_adjudication'] is False
              assert r['target_information_access'] is False
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/adjudication_commit.txt
          sha256sum orbittrace_ukmon_2020_2021_freshness_adjudication/adjudicate.py > output/source_sha256.txt
          sha256sum input_audit.zip > output/input_artifact_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt

      - name: Upload adjudication artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-ukmon-2020-2021-freshness-adjudication
          path: output
          if-no-files-found: error
          retention-days: 90
