name: OrbitTrace geometric joint EOM v1 GMN relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: orbittrace-geometric-joint-eom-v1-gmn
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  BENCH_BRANCH: agent/orbittrace-geometric-joint-eom-v1
  FROZEN_HEAD: a065f7ca7b6a6abcd8ed108b07c422708ea0c1bb

jobs:
  development:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 1366 &&
      github.event.comment.user.login == 'brandonlign' &&
      github.event.comment.body == 'RUN_ORBITTRACE_GEOMETRIC_JOINT_EOM_V1_GMN'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Announce exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1366 --repo "${{ github.repository }}" --body "ORBITTRACE_GEOMETRIC_JOINT_EOM_V1_GMN_STARTED=${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BENCH_BRANCH }}
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and bind frozen method
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FROZEN_HEAD}"
          test "$(git hash-object orbittrace_geometric_joint_eom_v1/PROTOCOL.md)" = 'f0e3acfafb1373371f081702526430423abc1df2'
          test "$(git hash-object orbittrace_geometric_joint_eom_v1/geometric_joint_eom.py)" = '0371bbc8f5e1a0234c499295c487d4d188dcaf2d'
          test "$(git hash-object orbittrace_geometric_joint_eom_v1/synthetic_audit.py)" = '7fdb71f269b4a3e2ccf63500f0400e1fa1a200d9'
          test "$(git hash-object orbittrace_geometric_joint_eom_v1/run_development.py)" = 'acb685d98ceb273c1c70d6cd8e9f4d3168546e3d'
          test "$(git hash-object orbittrace_geometric_joint_eom_v1/EXECUTION_FREEZE.json)" = 'd95cd291b331a2f3c21c571851da772c837ad236'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'

          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/v8 input/ranker output
          python -m py_compile \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            orbittrace_geometric_joint_eom_v1/geometric_joint_eom.py \
            orbittrace_geometric_joint_eom_v1/synthetic_audit.py \
            orbittrace_geometric_joint_eom_v1/run_development.py

      - name: Run frozen synthetic audit before GMN access
        env:
          PYTHONPATH: orbittrace_recurrent_eom_hdbscan_v1:orbittrace_geometric_joint_eom_v1:.
        run: |
          set -euo pipefail
          cd orbittrace_geometric_joint_eom_v1
          python -u synthetic_audit.py
          python - <<'PY'
          import json
          r=json.load(open('GEOMETRIC_JOINT_EOM_V1_SYNTHETIC_AUDIT.json'))
          assert r['verdict']=='PASS_GEOMETRIC_JOINT_EOM_V1_SYNTHETIC_AUDIT'
          assert all(r['tests'].values())
          assert r['scientific_data_access'] is False
          assert r['gmn_access'] is False
          assert r['sonotaco_access'] is False
          PY
          mv GEOMETRIC_JOINT_EOM_V1_SYNTHETIC_AUDIT.json ../output/

      - name: Materialize frozen GMN support source
        run: |
          set -euo pipefail
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify immutable GMN inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Run sole binding GMN development endpoint
        env:
          PYTHONPATH: orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:orbittrace_geometric_joint_eom_v1:input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_geometric_joint_eom_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce endpoint schema/firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/GEOMETRIC_JOINT_EOM_V1_GMN_DEVELOPMENT.json'))
          p=json.load(open('output/GEOMETRIC_JOINT_EOM_V1_PRELABEL.json'))
          assert r['verdict'] in {'PASS_GEOMETRIC_JOINT_EOM_V1_GMN_DEVELOPMENT','FAIL_GEOMETRIC_JOINT_EOM_V1_GMN_DEVELOPMENT'}
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_DEVELOPMENT_ONLY'
          assert r['events_by_year']=={'2022':315024,'2023':423658}
          assert p['events_by_year']=={'2022':315024,'2023':423658}
          assert r['density_sync_champion_candidate_count']==2094
          assert r['sole_successor_objective']=='sqrt(ordinary_eom_stability * recurrent_eom_stability)'
          assert r['blind_exclusion']==[20.0,55.0]
          for x in (r,p):
              for k in ['target_information_access','target_region_events_accessed','sonotaco_2013_2014_access','amos_access','maarsy_scientific_access','dms_scientific_access']:
                  assert x[k] is False, (k,x[k])
          print(json.dumps({
              'verdict':r['verdict'],
              'mechanism_active':r['mechanism_active'],
              'strict_100':r['strict_recovered_at_100_improvement_some_year'],
              'champion':{y:{k:v for k,v in m.items() if k!='first_rank_by_label'} for y,m in r['champion_metrics'].items()},
              'successor':{y:{k:v for k,v in m.items() if k!='first_rank_by_label'} for y,m in r['successor_metrics'].items()},
              'annual_gates':r['annual_gates'],
          },indent=2,sort_keys=True))
          PY

      - name: Commit binding GMN result
        run: |
          set -euo pipefail
          cp output/GEOMETRIC_JOINT_EOM_V1_GMN_DEVELOPMENT.json orbittrace_geometric_joint_eom_v1/GMN_RESULT.json
          cp output/GEOMETRIC_JOINT_EOM_V1_PRELABEL.json orbittrace_geometric_joint_eom_v1/GMN_PRELABEL.json
          sha256sum orbittrace_geometric_joint_eom_v1/GMN_RESULT.json > orbittrace_geometric_joint_eom_v1/GMN_RESULT_SHA256.txt
          sha256sum orbittrace_geometric_joint_eom_v1/GMN_PRELABEL.json > orbittrace_geometric_joint_eom_v1/GMN_PRELABEL_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orbittrace_geometric_joint_eom_v1/GMN_RESULT.json orbittrace_geometric_joint_eom_v1/GMN_PRELABEL.json orbittrace_geometric_joint_eom_v1/GMN_RESULT_SHA256.txt orbittrace_geometric_joint_eom_v1/GMN_PRELABEL_SHA256.txt
          git commit -m 'Record geometric joint EOM v1 GMN result'
          git push origin HEAD:"${BENCH_BRANCH}"

      - name: Upload binding artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-geometric-joint-eom-v1-gmn-${{ github.run_id }}
          path: output
          if-no-files-found: warn
          retention-days: 90

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1366 --repo "${{ github.repository }}" --body "ORBITTRACE_GEOMETRIC_JOINT_EOM_V1_GMN_SUCCESS=${GITHUB_RUN_ID}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1366 --repo "${{ github.repository }}" --body "ORBITTRACE_GEOMETRIC_JOINT_EOM_V1_GMN_FAILED=${GITHUB_RUN_ID}"
