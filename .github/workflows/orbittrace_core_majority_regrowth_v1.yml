name: OrbitTrace core-majority regrowth v1

on:
  pull_request:
    branches: [agent/orbittrace-m2d-support-pruned-cut-v1]
    paths:
      - orbittrace_core_majority_regrowth_v1/**
      - .github/workflows/orbittrace_core_majority_regrowth_v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      pretruth_sha: ${{ steps.seal.outputs.pretruth_sha }}
      structural_pass: ${{ steps.seal.outputs.structural_pass }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact pretruth runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3'
          test "$(git hash-object orbittrace_core_majority_regrowth_v1/build_pretruth.py)" = 'd7d0eacfb5fc3f86794fc29898e163d1343d0612'
          test "$(git hash-object orbittrace_core_majority_regrowth_v1/evaluate_gmn.py)" = '216a505feeb4a67a0fe42dd16f7206d4b0c14c7f'
          python -m py_compile orbittrace_core_majority_regrowth_v1/build_pretruth.py orbittrace_core_majority_regrowth_v1/evaluate_gmn.py
          mkdir -p input/bwm input/bif output/pretruth
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-bif-witness-modularity-v1-pretruth
          path: input/bwm
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32292151719'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-annual-density-bifiltration-gmn-ranking-v1-prelabel
          path: input/bif
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32037435314'
      - name: Verify immutable zero-label inputs
        run: |
          set -euo pipefail
          echo '2e6eca03f03702c78b36624026e20feb4f081b5d9f9507e0ea3436cc33bb199a  input/bwm/BIF_WITNESS_MODULARITY_V1_PRETRUTH.json' | sha256sum -c -
          echo '95f8a57718a30b2c7e85016d505276d72cccb9e4ac1d6eb29f13067efc73dd0c  input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json' | sha256sum -c -
      - name: Build CMR ranking without shower truth
        run: |
          set -euo pipefail
          python -u orbittrace_core_majority_regrowth_v1/build_pretruth.py \
            --bwm-pretruth input/bwm/BIF_WITNESS_MODULARITY_V1_PRETRUTH.json \
            --bif-endpoint-prelabel input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json \
            --output output/pretruth/CORE_MAJORITY_REGROWTH_V1_PRETRUTH.json
      - name: Seal pretruth and structural decision before labels
        id: seal
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          p='output/pretruth/CORE_MAJORITY_REGROWTH_V1_PRETRUTH.json'
          raw=open(p,'rb').read(); h=hashlib.sha256(raw).hexdigest(); r=json.loads(raw)
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_CMR_V1_RANKING_FROZEN_BEFORE_SHOWER_TRUTH'
          assert r['shower_truth_used'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False and r['sonotaco_scientific_access'] is False
          assert r['configuration']['new_tuned_parameters']==[] and r['configuration']['one_shot'] is True and r['configuration']['newly_admitted_members_can_recruit'] is False
          sp='true' if r['structural_pass'] else 'false'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('pretruth_sha='+h+'\n'); f.write('structural_pass='+sp+'\n')
          open('output/pretruth/PRETRUTH_SHA256.txt','w').write(h+'  CORE_MAJORITY_REGROWTH_V1_PRETRUTH.json\n')
          print('CMR_PRETRUTH_SHA='+h)
          print('STRUCTURAL_PASS='+sp)
          print(json.dumps(r['mechanism_summary'],sort_keys=True))
          print(json.dumps(r['size_summary'],sort_keys=True))
          print(json.dumps(r['structural_gates'],sort_keys=True))
          PY
      - name: Preserve pretruth provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/pretruth/execution_commit.txt
          python --version > output/pretruth/python_version.txt
          python -m pip freeze > output/pretruth/environment.txt
          sha256sum orbittrace_core_majority_regrowth_v1/PROTOCOL.md orbittrace_core_majority_regrowth_v1/build_pretruth.py orbittrace_core_majority_regrowth_v1/evaluate_gmn.py input/bwm/BIF_WITNESS_MODULARITY_V1_PRETRUTH.json input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json output/pretruth/CORE_MAJORITY_REGROWTH_V1_PRETRUTH.json > output/pretruth/provenance_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-core-majority-regrowth-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: pretruth
    if: needs.pretruth.outputs.structural_pass == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 0960edd77ea29b29b70d05f389dce312d451f0d2
          path: frozen-bwm
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install hidden-label runtime and verify frozen evaluator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          test "$(git hash-object orbittrace_core_majority_regrowth_v1/build_pretruth.py)" = 'd7d0eacfb5fc3f86794fc29898e163d1343d0612'
          test "$(git hash-object orbittrace_core_majority_regrowth_v1/evaluate_gmn.py)" = '216a505feeb4a67a0fe42dd16f7206d4b0c14c7f'
          echo '1578f5eb28fc7e66a2c73f3ef66a6697e20b53b992a7fc979276720047e534d6  frozen-bwm/orbittrace_bif_witness_modularity_v1/evaluate_gmn.py' | sha256sum -c -
          python -m py_compile orbittrace_core_majority_regrowth_v1/evaluate_gmn.py frozen-bwm/orbittrace_bif_witness_modularity_v1/evaluate_gmn.py
          mkdir -p input/pretruth input/fairness input/ranker input/v8 input/v3 output/truth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-core-majority-regrowth-v1-pretruth
          path: input/pretruth
      - name: Verify exact sealed CMR ranking before opening truth
        run: |
          set -euo pipefail
          echo '${{ needs.pretruth.outputs.pretruth_sha }}  input/pretruth/CORE_MAJORITY_REGROWTH_V1_PRETRUTH.json' | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('input/pretruth/CORE_MAJORITY_REGROWTH_V1_PRETRUTH.json'))
          assert r['structural_pass'] is True
          assert r['shower_truth_used'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False and r['sonotaco_scientific_access'] is False
          print('SEALED_CMR_PRETRUTH_VERIFIED_BEFORE_TRUTH')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth
          path: input/fairness
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32268943692'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '31344632499'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '31217916558'
      - name: Evaluate frozen CMR against hidden target-excluded GMN shower truth
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_core_majority_regrowth_v1/evaluate_gmn.py \
            --cmr-pretruth input/pretruth/CORE_MAJORITY_REGROWTH_V1_PRETRUTH.json \
            --expected-pretruth-sha '${{ needs.pretruth.outputs.pretruth_sha }}' \
            --frozen-bwm-evaluator frozen-bwm/orbittrace_bif_witness_modularity_v1/evaluate_gmn.py \
            --literature-pretruth input/fairness/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth/CORE_MAJORITY_REGROWTH_V1_GMN_RESULT.json
      - name: Verify and print binding verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/truth/CORE_MAJORITY_REGROWTH_V1_GMN_RESULT.json'))
          assert r['verdict'] in {'PASS_CORE_MAJORITY_REGROWTH_V1_GMN_DEVELOPMENT','FAIL_CORE_MAJORITY_REGROWTH_V1_GMN_DEVELOPMENT'}
          assert r['cmr_pretruth_sha256']=='${{ needs.pretruth.outputs.pretruth_sha }}'
          assert r['method_changed_after_pretruth'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False and r['sonotaco_scientific_access'] is False and r['post_result_parameter_search'] is False
          print(r['verdict'])
          print(json.dumps({'routes':r['routes'],'scales':r['scales'],'gates':r['gates'],'size_summary':r['size_summary']},indent=2,sort_keys=True))
          PY
      - name: Preserve truth provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/truth/execution_commit.txt
          python --version > output/truth/python_version.txt
          python -m pip freeze > output/truth/environment.txt
          sha256sum orbittrace_core_majority_regrowth_v1/PROTOCOL.md orbittrace_core_majority_regrowth_v1/build_pretruth.py orbittrace_core_majority_regrowth_v1/evaluate_gmn.py frozen-bwm/orbittrace_bif_witness_modularity_v1/evaluate_gmn.py input/pretruth/CORE_MAJORITY_REGROWTH_V1_PRETRUTH.json input/fairness/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json output/truth/CORE_MAJORITY_REGROWTH_V1_GMN_RESULT.json > output/truth/provenance_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-core-majority-regrowth-v1-gmn-result
          path: output/truth
          if-no-files-found: error
          retention-days: 90
