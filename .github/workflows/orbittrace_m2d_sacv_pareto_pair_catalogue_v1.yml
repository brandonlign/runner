name: OrbitTrace M2D SACV Pareto-pair catalogue v1

on:
  pull_request:
    branches: [agent/orbittrace-m2d-sacv-pareto-pair-catalogue-v1]
    paths:
      - 'orbittrace_m2d_sacv_pareto_pair_catalogue_v1/ACTIVATE.md'

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-m2d-sacv-pareto-pair-catalogue-v1
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: agent/orbittrace-recurrent-local-topomodal-trunk-v1
          path: geom-src
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen scientific source
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/PROTOCOL.md)" = '67dcab7a002f945170124a5355c62ffb21c896ed'
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py)" = '733bc8a7d8dcbbea601647b643edf722d6f7bdbd'
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py)" = 'bf0e832f5c694879e688da4098fa80186e20854d'
          test "$(git hash-object orbittrace_m2d_sacv_pair_v2/build_pretruth.py)" = '1cd766ad29d1f78a26f92365bb8a588f3e794d36'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git -C geom-src hash-object orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py)" = '32abfb3e68520cfdc83585a88731fa3982900cde'
          python -m py_compile orbittrace_m2d_sacv_pair_v2/build_pretruth.py orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py

      - name: Install frozen runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip >/dev/null
          python -m pip install --disable-pip-version-check -r frozen-v8/ghoststream_fixed4_application/requirements.txt >/dev/null
          python -m pip install --disable-pip-version-check --no-deps gmn-python-api==0.0.13 >/dev/null
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0' >/dev/null
          mkdir -p input/fair input/sacv input/ranker input/v8 input/v3 output/pretruth

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth
          path: input/fair
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32268943692
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-sacv-v1-gmn-development
          path: input/sacv
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32324386269
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify immutable zero-label inputs and prepare runtime
        run: |
          set -euo pipefail
          test "$(sha256sum input/fair/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json | cut -d' ' -f1)" = '8b0f4629659c1bfd750747303ad04ff67355adf66d4dbe474ce7fba788f5bae5'
          test "$(sha256sum input/sacv/pretruth/M2D_SACV_V1_GMN_PRETRUTH.json | cut -d' ' -f1)" = '77528fbec227bf8d8d311b9054c46db43668d7f12e9460b85db680c4a6ce927b'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          git -C frozen-v8 fetch -q --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')

      - name: Export exact target-excluded label-free geometry
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          set -euo pipefail
          python -u geom-src/orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/pretruth/GMN_LABEL_FREE_GEOMETRY.json
          test "$(sha256sum output/pretruth/GMN_LABEL_FREE_GEOMETRY.json | cut -d' ' -f1)" = '1fd5cd0577d88784845e0d367ef35491d6afb7caa78bb06fa05d72048daec384'

      - name: Freeze complete Pareto-pair catalogue before truth
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py \
            --fair-pretruth input/fair/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json \
            --geometry output/pretruth/GMN_LABEL_FREE_GEOMETRY.json \
            --sacv-v1-pretruth input/sacv/pretruth/M2D_SACV_V1_GMN_PRETRUTH.json \
            --output output/pretruth
          rm -f output/pretruth/GMN_LABEL_FREE_GEOMETRY.json
          sha256sum orbittrace_m2d_sacv_pareto_pair_catalogue_v1/PROTOCOL.md orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py \
            output/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRELABEL.json output/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json > output/pretruth/source_input_output_sha256.txt
          git rev-parse HEAD > output/pretruth/execution_commit.txt

      - name: Authorize hidden truth only on frozen pretruth PASS
        id: gate
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open('output/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json'))
          allowed={'PASS_M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH','POWER_INCONCLUSIVE_M2D_SACV_PARETO_PAIR_CATALOGUE_V1_GMN_DEVELOPMENT'}
          assert p['verdict'] in allowed
          authorized=p['verdict']=='PASS_M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"authorized={'true' if authorized else 'false'}\n")
              f.write(f"verdict={p['verdict']}\n")
          print(json.dumps({'verdict':p['verdict'],'authorized':authorized,'summary':p['summary'],'gates':p['gates']},indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-m2d-sacv-pareto-pair-catalogue-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: pretruth
    if: needs.pretruth.outputs.authorized == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-m2d-sacv-pareto-pair-catalogue-v1
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and verify frozen truth runtime
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/PROTOCOL.md)" = '67dcab7a002f945170124a5355c62ffb21c896ed'
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py)" = '733bc8a7d8dcbbea601647b643edf722d6f7bdbd'
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py)" = 'bf0e832f5c694879e688da4098fa80186e20854d'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py
          python -m pip install --disable-pip-version-check --upgrade pip >/dev/null
          python -m pip install --disable-pip-version-check -r frozen-v8/ghoststream_fixed4_application/requirements.txt >/dev/null
          python -m pip install --disable-pip-version-check --no-deps gmn-python-api==0.0.13 >/dev/null
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0' >/dev/null
          mkdir -p input/pretruth input/ranker input/v8 input/v3 output/truth
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-sacv-pareto-pair-catalogue-v1-pretruth
          path: input/pretruth
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Verify pretruth PASS before opening hidden labels
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python - <<'PY'
          import hashlib,json
          pre='input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRELABEL.json'
          aud='input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json'
          p=json.load(open(pre)); a=json.load(open(aud))
          assert a['verdict']=='PASS_M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH'
          assert a['prelabel_sha256']==hashlib.sha256(open(pre,'rb').read()).hexdigest()
          assert len(a['gates'])==10 and all(a['gates'].values())
          assert p['shower_truth_used'] is False and p['target_information_access'] is False and p['target_region_events_accessed'] is False
          PY
          git -C frozen-v8 fetch -q --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')

      - name: Execute binding target-excluded GMN truth evaluation
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py \
            --prelabel input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRELABEL.json \
            --pretruth input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth
          cp input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json output/truth/
          git rev-parse HEAD > output/truth/execution_commit.txt
          python -m pip freeze > output/truth/environment.txt
          sha256sum orbittrace_m2d_sacv_pareto_pair_catalogue_v1/PROTOCOL.md orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py \
            input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRELABEL.json input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json output/truth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_GMN_RESULT.json > output/truth/source_input_output_sha256.txt

      - name: Publish binding result
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY' > /tmp/result.md
          import hashlib,json
          p='output/truth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_GMN_RESULT.json'; r=json.load(open(p))
          print('## M2D SACV Pareto-pair catalogue v1 — binding target-excluded GMN development')
          print(); print(f"Verdict: **`{r['verdict']}`**")
          print(f"- result SHA-256: `{hashlib.sha256(open(p,'rb').read()).hexdigest()}`")
          for d in ('128','1024'):
              b=r['scale_aggregates'][d]['sacv_v1_equal_budget']; s=r['scale_aggregates'][d]['successor_equal_budget']
              print(f"- d={d}: qualified `{b['qualified_total']} -> {s['qualified_total']}`; zero-filled MRR `{b['zero_filled_mrr_mean']:.6f} -> {s['zero_filled_mrr_mean']:.6f}`; precision `{b['precision_mean']:.6f} -> {s['precision_mean']:.6f}`; fragmentation `{b['fragmentation_mean']:.6f} -> {s['fragmentation_mean']:.6f}`")
          print('- OrbitTrace target information accessed: `false`')
          print('- SonotaCo scientific access: `false`')
          PY
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-sacv-pareto-pair-catalogue-v1-gmn-development
          path: output/truth
          if-no-files-found: error
          retention-days: 90

  power-inconclusive:
    needs: pretruth
    if: always() && needs.pretruth.result == 'success' && needs.pretruth.outputs.authorized != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-sacv-pareto-pair-catalogue-v1-pretruth
          path: input/pretruth
      - name: Freeze capacity-only binding endpoint without opening truth
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p output/truth
          python - <<'PY'
          import hashlib,json
          a=json.load(open('input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json'))
          assert a['verdict']=='POWER_INCONCLUSIVE_M2D_SACV_PARETO_PAIR_CATALOGUE_V1_GMN_DEVELOPMENT'
          out={'schema':'ORBITTRACE_M2D_SACV_PARETO_PAIR_CATALOGUE_V1_GMN_TRUTH','verdict':a['verdict'],
               'prelabel_sha256':a['prelabel_sha256'],'pretruth_gates':a['gates'],'summary':a['summary'],
               'shower_truth_used':False,'target_information_access':False,'target_region_events_accessed':False,'sonotaco_scientific_access':False}
          p='output/truth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_GMN_RESULT.json'
          open(p,'w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          open('/tmp/result.md','w').write('## M2D SACV Pareto-pair catalogue v1 — binding pretruth endpoint\n\n'
              f"Verdict: **`{out['verdict']}`**\n- result SHA-256: `{hashlib.sha256(open(p,'rb').read()).hexdigest()}`\n"
              '- Hidden GMN shower truth opened: `false`\n- OrbitTrace target information accessed: `false`\n')
          PY
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-m2d-sacv-pareto-pair-catalogue-v1-gmn-development
          path: output/truth
          if-no-files-found: error
          retention-days: 90
