name: OrbitTrace M2D SACV Pareto-pair catalogue v1

on:
  pull_request:
    branches: [agent/orbittrace-m2d-sacv-pareto-pair-catalogue-v1]
    paths: ['orbittrace_m2d_sacv_pareto_pair_catalogue_v1/ACTIVATE.md']

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-m2d-sacv-pareto-pair-catalogue-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit frozen scientific source before any data
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/PROTOCOL.md)" = '67dcab7a002f945170124a5355c62ffb21c896ed'
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py)" = '733bc8a7d8dcbbea601647b643edf722d6f7bdbd'
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py)" = '86d0cbaaa3a8245a5a7afdf5b838d90fe988d362'
          test "$(git hash-object orbittrace_m2d_sacv_pair_v2/build_pretruth.py)" = '1cd766ad29d1f78a26f92365bb8a588f3e794d36'
          python -m py_compile orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py orbittrace_m2d_sacv_pair_v2/build_pretruth.py
      - name: Install exact frozen GMN runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip >/dev/null
          git clone -q --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" frozen-v8
          git -C frozen-v8 fetch -q --no-tags --depth=1 origin c9d6c44704013ba0c9430100e98a29a56b453304
          git -C frozen-v8 checkout -q FETCH_HEAD
          python -m pip install --disable-pip-version-check -r frozen-v8/ghoststream_fixed4_application/requirements.txt >/dev/null
          python -m pip install --disable-pip-version-check --no-deps gmn-python-api==0.0.13 >/dev/null
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0' >/dev/null
          git clone -q --depth 1 --branch agent/orbittrace-recurrent-local-topomodal-trunk-v1 "https://github.com/${GITHUB_REPOSITORY}.git" local-trunk-src
          test "$(git -C local-trunk-src hash-object orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py)" = '32abfb3e68520cfdc83585a88731fa3982900cde'
          mkdir -p input/fair input/ranker input/v8 input/v3 input/sacvbase input/sacvsource output/pretruth
          git -C frozen-v8 fetch -q --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth
          path: input/fair
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32268943692
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-sacv-v1-gmn-development
          path: input/sacvbase
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32324386269
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-sacv-frozen-source-text
          path: input/sacvsource
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32329571638
      - name: Verify immutable inputs and original SACV selector source
        run: |
          set -euo pipefail
          test "$(sha256sum input/fair/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json | cut -d' ' -f1)" = '8b0f4629659c1bfd750747303ad04ff67355adf66d4dbe474ce7fba788f5bae5'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/sacvbase/pretruth/M2D_SACV_V1_GMN_PRETRUTH.json | cut -d' ' -f1)" = '77528fbec227bf8d8d311b9054c46db43668d7f12e9460b85db680c4a6ce927b'
          test "$(sha256sum input/sacvsource/build_pretruth.py | cut -d' ' -f1)" = 'cd5a7505c1d095e03de683f78dce8af5cb465ba32ca1dfa3e8b9eb3e78d0fd64'
          python - <<'PY'
          import ast
          s=open('input/sacvsource/build_pretruth.py').read()
          assert "key=(float(excess[k]),int(ps[k]),-float(contam[k]),-r)" in s
          assert "key>best['key']" in s
          assert "eid<best['id']" in s
          ast.parse(s)
          print('PASS_EXACT_PRETARGET_SACV_SELECTOR_AUDIT')
          PY
      - name: Export exact label-free target-excluded geometry
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          set -euo pipefail
          python -u local-trunk-src/orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/pretruth/GMN_LABEL_FREE_GEOMETRY.json
          test "$(sha256sum output/pretruth/GMN_LABEL_FREE_GEOMETRY.json | cut -d' ' -f1)" = '1fd5cd0577d88784845e0d367ef35491d6afb7caa78bb06fa05d72048daec384'
      - name: Build and seal complete Pareto-pair catalogue before truth
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py \
            --fair-pretruth input/fair/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json \
            --geometry output/pretruth/GMN_LABEL_FREE_GEOMETRY.json \
            --sacv-v1-pretruth input/sacvbase/pretruth/M2D_SACV_V1_GMN_PRETRUTH.json \
            --output output/pretruth
          python - <<'PY'
          import hashlib,json
          p='output/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRELABEL.json'
          a='output/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json'
          pre=json.load(open(p)); audit=json.load(open(a)); h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert audit['verdict']=='PASS_M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH'
          assert audit['prelabel_sha256']==h
          assert len(audit['gates'])==10 and all(audit['gates'].values())
          assert pre['summary']['validated_pair_candidates']>0 and pre['summary']['all_panel_capacity_ok'] is True
          assert audit['shower_truth_used'] is False and audit['target_information_access'] is False and audit['sonotaco_scientific_access'] is False
          print(json.dumps({'verdict':audit['verdict'],'sha256':h,'summary':audit['summary']},indent=2,sort_keys=True))
          PY
          rm -f output/pretruth/GMN_LABEL_FREE_GEOMETRY.json
          git rev-parse HEAD > output/pretruth/execution_commit.txt
          sha256sum orbittrace_m2d_sacv_pareto_pair_catalogue_v1/PROTOCOL.md orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py output/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRELABEL.json output/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json > output/pretruth/source_output_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-m2d-sacv-pareto-pair-catalogue-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-m2d-sacv-pareto-pair-catalogue-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and audit exact hidden-truth runtime
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/PROTOCOL.md)" = '67dcab7a002f945170124a5355c62ffb21c896ed'
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py)" = '733bc8a7d8dcbbea601647b643edf722d6f7bdbd'
          test "$(git hash-object orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py)" = '86d0cbaaa3a8245a5a7afdf5b838d90fe988d362'
          git clone -q --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" frozen-v8
          git -C frozen-v8 fetch -q --no-tags --depth=1 origin c9d6c44704013ba0c9430100e98a29a56b453304
          git -C frozen-v8 checkout -q FETCH_HEAD
          python -m pip install --disable-pip-version-check --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt >/dev/null
          python -m pip install --disable-pip-version-check --no-deps gmn-python-api==0.0.13 >/dev/null
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0' >/dev/null
          mkdir -p input/ranker input/v8 input/v3 output/truth
          git -C frozen-v8 fetch -q --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-sacv-pareto-pair-catalogue-v1-pretruth
          path: input/pretruth
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Verify sealed pretruth PASS before opening labels
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python - <<'PY'
          import hashlib,json
          p='input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRELABEL.json'; a='input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json'
          pre=json.load(open(p)); audit=json.load(open(a)); h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert audit['verdict']=='PASS_M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH'
          assert audit['prelabel_sha256']==h and len(audit['gates'])==10 and all(audit['gates'].values())
          assert pre['shower_truth_used'] is False and pre['target_information_access'] is False and pre['sonotaco_scientific_access'] is False
          PY
      - name: Evaluate exact sealed equal-budget catalogue
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py \
            --prelabel input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRELABEL.json \
            --pretruth input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth
      - name: Publish binding result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          P=output/truth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_GMN_RESULT.json
          if [ -f "$P" ]; then
            python - <<'PY' > /tmp/result.md
          import hashlib,json
          p='output/truth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_GMN_RESULT.json'; r=json.load(open(p))
          print('## M2D + SACV Pareto-pair catalogue v1 — binding target-excluded GMN')
          print(); print(f"Verdict: **`{r['verdict']}`**")
          print(f"- result SHA-256: `{hashlib.sha256(open(p,'rb').read()).hexdigest()}`")
          for d in ('1024','128'):
              a=r['scale_aggregates'][d]; b=a['sacv_v1_equal_budget']; s=a['successor_equal_budget']
              print(f"- d={d}: qualified `{b['qualified_total']} -> {s['qualified_total']}`; zero-MRR `{b['zero_filled_mrr_mean']:.6f} -> {s['zero_filled_mrr_mean']:.6f}`; precision `{b['precision_mean']:.6f} -> {s['precision_mean']:.6f}`; fragmentation `{b['fragmentation_mean']:.6f} -> {s['fragmentation_mean']:.6f}`; nonlower panels `{a['qualified_nonlower_panels']}/8`")
          print('- OrbitTrace target information accessed: `false`')
          print('- SonotaCo scientific access: `false`')
          PY
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Pareto-pair catalogue execution ended technically before a valid binding scientific result; frozen science remains unchanged."
          fi
      - name: Preserve binding provenance
        if: always()
        run: |
          set +e
          cp input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRELABEL.json output/truth/ 2>/dev/null || true
          cp input/pretruth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_PRETRUTH.json output/truth/ 2>/dev/null || true
          printf '%s\n' "$GITHUB_RUN_ID" > output/truth/execution_run_id.txt
          git rev-parse HEAD > output/truth/execution_commit.txt
          python -m pip freeze > output/truth/environment.txt
          sha256sum orbittrace_m2d_sacv_pareto_pair_catalogue_v1/PROTOCOL.md orbittrace_m2d_sacv_pareto_pair_catalogue_v1/build_prelabel.py orbittrace_m2d_sacv_pareto_pair_catalogue_v1/evaluate_truth.py output/truth/M2D_SACV_PARETO_PAIR_CATALOGUE_V1_GMN_RESULT.json > output/truth/source_output_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-sacv-pareto-pair-catalogue-v1-truth
          path: output/truth
          if-no-files-found: warn
          retention-days: 90
