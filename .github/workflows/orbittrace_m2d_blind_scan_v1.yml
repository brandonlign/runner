name: OrbitTrace M2D pooled blind rediscovery v1

on:
  pull_request:
    branches:
      - agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1
    paths:
      - orbittrace_m2d_blind_rediscovery_v1/run_scan.py
      - orbittrace_m2d_blind_rediscovery_v1/reveal_exact_ids.py
      - orbittrace_m2d_blind_rediscovery_v1/PROTOCOL.md
      - .github/workflows/orbittrace_m2d_blind_scan_v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: orbittrace-m2d-pooled-blind-rediscovery-v1-pr
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: a5dd599ac94ce3c2597755be6c40c945f95929f8
          path: m2d-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          g++ --version

      - name: Verify frozen method identities before any GMN access
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_blind_rediscovery_v1/run_scan.py)" = '3def559978444e9bde1eab9cf9c3d47b8cbb2944'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py)" = '4988997c023d9df2b504372b4290dcab379a6dcc'
          test "$(sha256sum m2d-src/orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp | cut -d' ' -f1)" = '4eef6f1b70b5baee5d1983d2480c02d73569b12af868ec23bbb6009d6ca1fa37'
          python -m py_compile orbittrace_m2d_blind_rediscovery_v1/run_scan.py orbittrace_m2d_blind_rediscovery_v1/reveal_exact_ids.py
          mkdir -p output

      - name: Run frozen target-free pooled M2D scan
        run: |
          set -euo pipefail
          /usr/bin/time -v python -u orbittrace_m2d_blind_rediscovery_v1/run_scan.py \
            --blind-source-parts orbittrace_fixed4_blind_catalogue/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --structural-source orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --support-source orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py \
            --exact-cpp m2d-src/orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp \
            --output output \
            2>&1 | tee output/scan.log

      - name: Enforce pre-reveal firewall and freeze
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          p=Path('output/orbittrace_m2d_blind_ranked_pretruth.json.gz')
          raw=gzip.decompress(p.read_bytes())
          r=json.loads(raw)
          assert r['schema']=='ORBITTRACE_M2D_BLIND_REDISCOVERY_V1_PRETRUTH'
          assert r['scientific_role']=='TARGET_FREE_COMPLETE_M2D_RANKING_BEFORE_ORBITTRACE_REVEAL'
          assert r['verdict']=='BLIND_M2D_SCAN_FROZEN_AWAITING_SEPARATE_REVEAL'
          assert r['configuration']['target_interval_exclusion'] is None
          assert r['shower_truth_used'] is False
          assert r['orbittrace_target_information_access'] is False
          assert r['orbittrace_canonical_members_access'] is False
          assert r['prior_orbittrace_reveal_access'] is False
          assert r['post_result_parameter_search'] is False
          assert r['implementation_equivalence']['verdict']=='PASS_EXACT_SYNTHETIC_SUPPORT_CUT_EQUIVALENCE'
          assert r['candidate_count']==len(r['candidates']) and r['candidate_count']>0
          assert [x['rank'] for x in r['candidates']]==list(range(1,r['candidate_count']+1))
          print('gzip_sha256',hashlib.sha256(p.read_bytes()).hexdigest())
          print('inner_sha256',hashlib.sha256(raw).hexdigest())
          print('candidate_count',r['candidate_count'])
          print('event_count',r['event_count'])
          PY
          cat output/M2D_BLIND_SCAN.md

      - name: Record pretruth provenance
        run: |
          set -euo pipefail
          sha256sum \
            orbittrace_m2d_blind_rediscovery_v1/PROTOCOL.md \
            orbittrace_m2d_blind_rediscovery_v1/run_scan.py \
            orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py \
            m2d-src/orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp \
            output/orbittrace_m2d_blind_ranked_pretruth.json.gz \
            output/ranked_payload_sha256.txt \
            > output/source_and_output_sha256.txt
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-m2d-pooled-blind-pretruth-v1
          path: output
          if-no-files-found: error
          retention-days: 90

  reveal:
    needs: scan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Retrieve frozen pretruth from completed scan job
        uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-pooled-blind-pretruth-v1
          path: input/pretruth

      - name: Verify pretruth exists before canonical access
        run: |
          set -euo pipefail
          test -s input/pretruth/orbittrace_m2d_blind_ranked_pretruth.json.gz
          test -s input/pretruth/ranked_payload_sha256.txt
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          p=Path('input/pretruth/orbittrace_m2d_blind_ranked_pretruth.json.gz')
          r=json.loads(gzip.decompress(p.read_bytes()))
          assert r['verdict']=='BLIND_M2D_SCAN_FROZEN_AWAITING_SEPARATE_REVEAL'
          assert r['orbittrace_canonical_members_access'] is False
          assert r['orbittrace_target_information_access'] is False
          print('frozen_candidates',r['candidate_count'])
          PY

      - name: Retrieve canonical OrbitTrace IDs only after pretruth freeze
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANONICAL_ARTIFACT_ID: '8814798136'
          CANONICAL_ARTIFACT_SHA256: '716b70313465d5df4bfb092a85a81680e6f618606b71e25470c63c480b6449f5'
        run: |
          set -euo pipefail
          mkdir -p input output
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANONICAL_ARTIFACT_ID}/zip" \
            -o input/canonical.zip
          echo "${CANONICAL_ARTIFACT_SHA256}  input/canonical.zip" | sha256sum -c -

      - name: Perform exact-ID-only reveal
        run: |
          set -euo pipefail
          python orbittrace_m2d_blind_rediscovery_v1/reveal_exact_ids.py \
            --pretruth input/pretruth/orbittrace_m2d_blind_ranked_pretruth.json.gz \
            --canonical-zip input/canonical.zip \
            --output output
          cat output/M2D_BLIND_REVEAL.md

      - name: Record reveal provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            orbittrace_m2d_blind_rediscovery_v1/reveal_exact_ids.py \
            input/pretruth/orbittrace_m2d_blind_ranked_pretruth.json.gz \
            input/canonical.zip \
            output/M2D_BLIND_REVEAL.json \
            > output/reveal_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/reveal_execution_commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-pooled-blind-reveal-v1
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Post binding result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s output/M2D_BLIND_REVEAL.md; then
            gh pr comment 1378 --repo "$GITHUB_REPOSITORY" --body-file output/M2D_BLIND_REVEAL.md
          else
            gh pr comment 1378 --repo "$GITHUB_REPOSITORY" --body "Authoritative pooled M2D rediscovery workflow ended without a valid exact-ID reveal. This is a technical no-result, not a scientific failure. Workflow: $GITHUB_RUN_ID"
          fi
