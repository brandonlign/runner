name: OrbitTrace v6 literature exact-row interface audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - .github/workflows/orbittrace_v6_literature_interface_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-literature-interface-audit
          path: audit

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: v6

      - name: Reconstruct and pin exact repaired v6 source hash only
        run: |
          set -euo pipefail
          test ! -e input
          cat v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress \
            > /tmp/frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/frozen.py' | sha256sum -c -
          python - <<'PY'
          import hashlib
          from pathlib import Path
          original=Path('/tmp/frozen.py').read_text()
          before='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    components = primary_components + rescue_components
'''
          after='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    primary_components = component_records_track_v6(old, year, primary_capped, event_lookup, base, "v3")
    rescue_components = component_records_track_v6(old, year, rescue_capped, event_lookup, base, "fixed4_rescue")
    components = primary_components + rescue_components
'''
          assert original.count(before)==1
          repaired=original.replace(before,after,1)
          assert repaired.replace(after,before,1)==original
          digest=hashlib.sha256(repaired.encode()).hexdigest()
          print('FROZEN_V6_SHA256=a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9')
          print('REPAIRED_V6_SHA256='+digest)
          print('PASS_V6_REPAIRED_SOURCE_HASH_PIN')
          PY

      - name: Assert source-only boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          echo 'NO_CATALOGUE_ACCESS_NO_LABEL_ACCESS_NO_TARGET_ACCESS'
