name: OrbitTrace v6 literature exact-row interface audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - .github/workflows/orbittrace_v6_literature_interface_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-literature-interface-audit
          path: audit

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: v6

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v8-literature-matched-sonotaco
          path: lit

      - name: Reconstruct exact v6 source and inspect interfaces only
        run: |
          set -euo pipefail
          test ! -e input
          cat v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 \
            | tr -d '\n\r' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/run_v3_primary_catalogue_v6.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/run_v3_primary_catalogue_v6.py' | sha256sum -c -

          python - <<'PY'
          import ast
          from pathlib import Path
          text=Path('/tmp/run_v3_primary_catalogue_v6.py').read_text()
          lines=text.splitlines()
          tree=ast.parse(text)
          defs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          for name in ['calibrate_year_v6','scan_year_v6','main']:
              fn=defs[name]
              print(f'V6_FUNCTION {name} lines={fn.lineno}-{fn.end_lineno} args={[a.arg for a in fn.args.args]}')
              if name == 'calibrate_year_v6':
                  lo,hi=fn.lineno,fn.end_lineno
              elif name == 'main':
                  lo,hi=max(fn.lineno,680),min(fn.end_lineno,720)
              else:
                  lo,hi=fn.lineno,min(fn.end_lineno,290)
              for i in range(lo,hi+1): print(f'{i:04d}: {lines[i-1]}')
              print('---')

          ex=Path('lit/orbittrace_literature_matched_v8/run_exact_row_benchmark.py').read_text()
          exlines=ex.splitlines()
          extree=ast.parse(ex)
          exdefs={n.name:n for n in extree.body if isinstance(n,ast.FunctionDef)}
          for name in ['read_exact_geometry','parse_common_truth','run_v8_panel','main']:
              fn=exdefs[name]
              print(f'EXACT_FUNCTION {name} lines={fn.lineno}-{fn.end_lineno} args={[a.arg for a in fn.args.args]}')
              if name == 'main':
                  lo,hi=max(fn.lineno,360),min(fn.end_lineno,430)
              else:
                  lo,hi=fn.lineno,fn.end_lineno
              for i in range(lo,hi+1):
                  if name != 'main' or any(t in exlines[i-1].lower() for t in ['assignment','scan_panel','read_exact','truth','run_v8','archive','parser','year']):
                      print(f'{i:04d}: {exlines[i-1]}')
              print('---')
          print('PASS_V6_LITERATURE_ADAPTER_BOUNDARY_AUDIT')
          PY

      - name: Assert source-only boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          echo 'NO_CATALOGUE_ACCESS_NO_LABEL_ACCESS_NO_TARGET_ACCESS'
