name: SonotaCo 2023 confirmation hash repair audit

on:
  pull_request:
    branches:
      - agent/sonotaco-2023-schema-source-audit
    paths:
      - .github/workflows/sonotaco_2023_confirmation_hash_repair_audit.yml
      - sonotaco_2023_confirmation_hash_repair/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sonotaco-2023-confirmation-hash-repair-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sonotaco-2023-confirmation-hash-repair-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact PR144 schema/source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output
          gh run download 30920089789 \
            --repo "$GITHUB_REPOSITORY" \
            --name sonotaco-2023-schema-source-audit \
            --dir input
          echo '9619dfc0b339b39d287833778769f12a643e2b0157fdcd6115cd9c40be528322  input/audit_sonotaco_2023_v2.py' | sha256sum -c -
          echo '1c119e0dfc154f34da06097da6c4a4cb2f7c6b11b7a1e6a9a9330baf25f1567e  input/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          echo '6057e584ad23409996cd04ff595222c76cddff1d05f2da4a3e8c10bed973ca67  input/sonotaco_2023_confirmation.py.gz.b64' | sha256sum -c -
      - name: Apply and prove exact source-only repair
        run: |
          set -euo pipefail
          python sonotaco_2023_confirmation_hash_repair/audit_repair.py
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            sonotaco_2023_confirmation_hash_repair/PROTOCOL.md \
            sonotaco_2023_confirmation_hash_repair/audit_repair.py \
            .github/workflows/sonotaco_2023_confirmation_hash_repair_audit.yml \
            input/audit_sonotaco_2023_v2.py \
            input/run_sonotaco_2023_fixed4_confirmation.py \
            input/sonotaco_2023_confirmation.py.gz.b64 \
            > output/source_files_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
      - name: Upload exact repaired confirmation sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonotaco-2023-confirmation-hash-repair-audit
          path: output
          if-no-files-found: error
          retention-days: 90
