name: OrbitTrace GMN v31 negative intrusion depth diagnostic v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-v31-negative-intrusion-depth-diagnostic-v1
    paths:
      - 'orbittrace_gmn_v31_negative_intrusion_depth_diagnostic_v1/**'
      - '.github/workflows/orbittrace_gmn_v31_negative_intrusion_depth_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install pinned runtime and compile frozen diagnostic
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/ranker input/offline output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          python -m py_compile orbittrace_gmn_v31_negative_intrusion_depth_diagnostic_v1/diagnose_offline.py
          sha256sum orbittrace_gmn_v31_negative_intrusion_depth_diagnostic_v1/PROTOCOL.md orbittrace_gmn_v31_negative_intrusion_depth_diagnostic_v1/diagnose_offline.py > output/frozen_source_sha256.txt
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify exact diversity evaluator source
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-gmn-v31-offline-development-package-v1
          path: input/offline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31663453082
      - name: Verify authoritative offline package before diagnostic
        run: |
          set -euo pipefail
          test "$(sha256sum input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json | cut -d' ' -f1)" = '16fb5ef3cd8dbbb3873e9bc23874fe7da3db68498772a5e992fbceed6cb980d7'
          echo PASS_AUTHORITATIVE_OFFLINE_PACKAGE_BEFORE_NEGATIVE_INTRUSION_DEPTH
      - name: Run sole frozen GMN negative-intrusion-depth parent diagnostic
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_v31_negative_intrusion_depth_diagnostic_v1/diagnose_offline.py \
            --manifest input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json \
            --features input/offline/package/GMN_V31_OFFLINE_X.npy \
            --centroids input/offline/package/GMN_V31_OFFLINE_CENTROIDS.npy \
            --output output
      - name: Enforce diagnostic-only role and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/GMN_V31_NEGATIVE_INTRUSION_DEPTH_DIAGNOSTIC_V1.json'))
          assert r['verdict']=='PASS_GMN_V31_NEGATIVE_INTRUSION_DEPTH_DIAGNOSTIC_V1'
          assert r['scientific_role']=='GMN_TARGET_EXCLUDED_PARENT_DIAGNOSTIC_ONLY'
          assert r['diagnostic_outcome_top100_constituent_absent'] in {'SINGLE_INTRUDER_DOMINANT','MULTIPLE_INTRUDERS_DOMINANT','MIXED_INTRUSION_DEPTH'}
          assert r['candidate_count']==226 and r['qualified_labels']==95
          assert r['parent_margin_sha256']=='f38c96e3fa4ea98f51217b36d639e96edbf3ebcb65123248f0f118d3298173bd'
          assert r['feature_matrix_sha256']=='fea3b063772c75b675e37a227b53a4aa3c5b86fdcbfcef1487b1e1448689cdf5'
          assert r['centroid_matrix_sha256']=='a53b9862f1ec3d751745f80aec2625d7904128474c9263c55ea953cf60d0621f'
          assert r['hard_metrics']['recovered_at_25']==21 and r['hard_metrics']['recovered_at_50']==38 and r['hard_metrics']['recovered_at_100']==59
          assert r['fused_metrics']['recovered_at_25']==23 and r['fused_metrics']['recovered_at_50']==41 and r['fused_metrics']['recovered_at_100']==66
          assert r['top100_fused_misses']['label_count']==29
          assert r['top100_no_positive_support']['label_count']==25
          assert r['top100_constituent_absent_sign_rejected']['label_count']==21
          for k in ('new_score_created','new_rank_evaluated','successor_selected','alternate_budget','threshold_search','feature_search','metric_search','scaling_search','k_search','reference_change','diversity_variant','fusion_variant','truth_search','target_information_access','target_region_events_accessed','sonotaco_2013_2014_access','maarsy_scientific_access','dms_scientific_access','raw_event_rows_accessed','raw_event_ids_accessed','raw_hidden_label_mapping_accessed'):
            assert r[k] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print(r['diagnostic_outcome_top100_constituent_absent'],r['top100_constituent_absent_sign_rejected'],r['top100_no_positive_support'])
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_gmn_v31_negative_intrusion_depth_diagnostic_v1/PROTOCOL.md \
            orbittrace_gmn_v31_negative_intrusion_depth_diagnostic_v1/diagnose_offline.py \
            input/ranker/run_urc_union_ranker.py \
            input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json \
            input/offline/package/GMN_V31_OFFLINE_X.npy \
            input/offline/package/GMN_V31_OFFLINE_CENTROIDS.npy \
            output/GMN_V31_NEGATIVE_INTRUSION_DEPTH_DIAGNOSTIC_V1.json \
            > output/source_input_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-v31-negative-intrusion-depth-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
