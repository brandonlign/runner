name: OrbitTrace M2D cross-year recurrence core v1

on:
  push:
    branches: [agent/orbittrace-m2d-crossyear-recurrence-core-v1]
    paths:
      - '.github/workflows/orbittrace_m2d_crossyear_recurrence_core_v1.yml'
      - 'orbittrace_m2d_crossyear_recurrence_core_v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-m2d-crossyear-recurrence-core-v1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-recurrent-local-topomodal-trunk-v1
          path: local-trunk-src

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit frozen sources before data access
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_crossyear_recurrence_core_v1/PROTOCOL.md)" = '067b2868d898438a0b320b29d1c4c622115b7320'
          test "$(git hash-object orbittrace_m2d_crossyear_recurrence_core_v1/build_pretruth.py)" = 'd3dde3ac8b0a1168a8b6d4632f5169ce631f7810'
          test "$(git hash-object orbittrace_m2d_crossyear_recurrence_core_v1/evaluate_truth.py)" = '7b102ce826428cccdc860f455653dc7180530c2a'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git -C local-trunk-src hash-object orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py)" = '32abfb3e68520cfdc83585a88731fa3982900cde'
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          python -m py_compile orbittrace_m2d_crossyear_recurrence_core_v1/build_pretruth.py orbittrace_m2d_crossyear_recurrence_core_v1/evaluate_truth.py
          mkdir -p input/fair input/ranker input/v8 input/v3 output/geometry output/pretruth

      - name: Install exact inherited runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth
          path: input/fair
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32268943692

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Rebind immutable target-excluded parent before geometry
        run: |
          set -euo pipefail
          test "$(sha256sum input/fair/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json | cut -d' ' -f1)" = '8b0f4629659c1bfd750747303ad04ff67355adf66d4dbe474ce7fba788f5bae5'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Export exact label-free target-excluded GMN geometry
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          set -euo pipefail
          python -u local-trunk-src/orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/geometry/GMN_LABEL_FREE_GEOMETRY.json
          sha256sum output/geometry/GMN_LABEL_FREE_GEOMETRY.json > output/geometry/GEOMETRY_SHA256.txt

      - name: Build and seal all recurrence cores before truth
        run: |
          set -euo pipefail
          test ! -e input/truth
          python -u orbittrace_m2d_crossyear_recurrence_core_v1/build_pretruth.py \
            --fair-pretruth input/fair/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json \
            --geometry output/geometry/GMN_LABEL_FREE_GEOMETRY.json \
            --structural-source orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --output output/pretruth/M2D_CROSSYEAR_RECURRENCE_CORE_V1_PRETRUTH.json
          sha256sum output/pretruth/M2D_CROSSYEAR_RECURRENCE_CORE_V1_PRETRUTH.json > output/pretruth/PRETRUTH_SHA256.txt
          git rev-parse HEAD > output/pretruth/execution_commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-m2d-crossyear-recurrence-core-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

      - name: Report sealed pretruth
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/pretruth.md
          import json,hashlib
          p='output/pretruth/M2D_CROSSYEAR_RECURRENCE_CORE_V1_PRETRUTH.json'; r=json.load(open(p))
          s=r['overall_summary']
          print('M2D_CROSSYEAR_RECURRENCE_CORE_V1_PRETRUTH=SEALED_NO_TRUTH')
          print('- pretruth SHA-256: `%s`' % hashlib.sha256(open(p,'rb').read()).hexdigest())
          print('- candidates across panels: `%d`' % s['candidate_count'])
          print('- nonempty cores: `%d`' % s['nonempty_core_count'])
          print('- mean members: `%.3f -> %.3f`' % (s['envelope_mean_member_count'],s['core_mean_member_count']))
          print('- max members: `%d -> %d`' % (s['envelope_max_member_count'],s['core_max_member_count']))
          PY
          gh pr comment 1397 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pretruth.md || true

  truth:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-m2d-crossyear-recurrence-core-v1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen truth runtime and audit source identities
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_crossyear_recurrence_core_v1/PROTOCOL.md)" = '067b2868d898438a0b320b29d1c4c622115b7320'
          test "$(git hash-object orbittrace_m2d_crossyear_recurrence_core_v1/evaluate_truth.py)" = '7b102ce826428cccdc860f455653dc7180530c2a'
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/fair input/core input/internal input/ranker input/v8 input/v3 output/truth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth
          path: input/fair
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32268943692

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-crossyear-recurrence-core-v1-pretruth
          path: input/core

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-support-cut-bifiltration-internal-mass-v1
          path: input/internal
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32041661731

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Rebind complete pretruth before known-shower truth access
        run: |
          set -euo pipefail
          test "$(sha256sum input/fair/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json | cut -d' ' -f1)" = '8b0f4629659c1bfd750747303ad04ff67355adf66d4dbe474ce7fba788f5bae5'
          test "$(sha256sum input/internal/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json | cut -d' ' -f1)" = '7b1ddfcd32cd0b52321e3b3dfc614a88dd9b973f947c1d4d0de74fddf26b59cd'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          expected="$(cut -d' ' -f1 input/core/PRETRUTH_SHA256.txt)"
          got="$(sha256sum input/core/M2D_CROSSYEAR_RECURRENCE_CORE_V1_PRETRUTH.json | cut -d' ' -f1)"
          test "$expected" = "$got"
          python - <<'PY'
          import json
          r=json.load(open('input/core/M2D_CROSSYEAR_RECURRENCE_CORE_V1_PRETRUTH.json'))
          assert r['shower_truth_used'] is False
          assert r['target_information_access'] is False
          assert r['target_region_events_accessed'] is False
          assert r['sonotaco_scientific_access'] is False
          assert r['external_survey_scientific_access'] is False
          assert r['post_result_parameter_search'] is False
          print('CORE_PRETRUTH_REBOUND_BEFORE_TRUTH')
          PY

      - name: Run one binding target-excluded known-shower evaluation
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_crossyear_recurrence_core_v1/evaluate_truth.py \
            --fair-pretruth input/fair/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json \
            --core-pretruth input/core/M2D_CROSSYEAR_RECURRENCE_CORE_V1_PRETRUTH.json \
            --internal-prelabel input/internal/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth/M2D_CROSSYEAR_RECURRENCE_CORE_V1_RESULT.json
          sha256sum output/truth/M2D_CROSSYEAR_RECURRENCE_CORE_V1_RESULT.json > output/truth/RESULT_SHA256.txt
          git rev-parse HEAD > output/truth/execution_commit.txt
          python --version > output/truth/python_version.txt
          python -m pip freeze > output/truth/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-crossyear-recurrence-core-v1-binding
          path: output/truth
          if-no-files-found: error
          retention-days: 90

      - name: Post binding result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/result.md
          import json,hashlib
          p='output/truth/M2D_CROSSYEAR_RECURRENCE_CORE_V1_RESULT.json'; r=json.load(open(p))
          print('## M2D cross-year recurrence core v1 — binding GMN development')
          print()
          print('Verdict: **`%s`**' % r['verdict'])
          for comp in ('sugar2017','hdbscan2025'):
              a=r['aggregates'][comp]
              print('- %s: macro-F1 `%.9f -> %.9f`, precision `%.9f -> %.9f`, recovered>0.5 `%d -> %d`, paired F1 `%.9f -> %.9f`' % (
                  comp,a['envelope']['mean_macro_f1'],a['core']['mean_macro_f1'],a['envelope']['mean_macro_precision'],a['core']['mean_macro_precision'],a['envelope']['total_recovered_f1_gt_05'],a['core']['total_recovered_f1_gt_05'],a['paired']['parent_mean_f1'],a['paired']['core_mean_f1']))
          print('- result SHA-256: `%s`' % hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          gh pr comment 1397 --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md || true

      - name: Report technical no-result only
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1397 --repo "$GITHUB_REPOSITORY" --body "M2D cross-year recurrence core v1 workflow ended technically before a valid binding scientific result. No method/gate change is authorized from a technical no-result." || true
