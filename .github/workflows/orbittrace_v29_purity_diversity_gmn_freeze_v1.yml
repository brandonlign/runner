name: OrbitTrace v29 purity-diversity GMN model freeze v1

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - 'orbittrace_v29_purity_diversity_gmn_freeze_v1/**'
      - '.github/workflows/orbittrace_v29_purity_diversity_gmn_freeze_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  freeze:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v29-purity-diversity-gmn-freeze-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact runtime and reconstruct frozen sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/v8 input/p19 input/p20 input/pr971 output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py /tmp/purity_source.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          git fetch --no-tags --depth=1 origin d7f1b310905265403d493814c5117f09fc57319c
          git show FETCH_HEAD:orbittrace_urc_union_ranking_lab_v2/run_lab.py > /tmp/purity_source.py
          test "$(git hash-object /tmp/purity_source.py)" = '976ae788ec76a2da7035735ea62118c7289adc5e'
          PYTHONPATH=.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8 python -m py_compile /tmp/purity_source.py orbittrace_v29_purity_diversity_gmn_freeze_v1/fit_freeze.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-gmn-quality-purity-dualhead-fusion-v1
          path: input/pr971
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31435769113
      - name: Verify immutable #971 architecture-selection result
        run: |
          set -euo pipefail
          test -f input/pr971/GMN_QUALITY_PURITY_DUALHEAD_FUSION_V1.json
          python - <<'PY'
          import json
          r=json.load(open('input/pr971/GMN_QUALITY_PURITY_DUALHEAD_FUSION_V1.json'))
          assert r['verdict']=='FAIL_GMN_QUALITY_PURITY_DUALHEAD_FUSION_V1'
          d=next(x for x in r['variants'] if x['variant']=='purity_diversity')
          assert d['viable'] is True
          assert d['metrics']['recovered_at_25']==24
          assert d['metrics']['recovered_at_50']==47
          assert d['metrics']['recovered_at_100']==81
          assert d['metrics']['recovered_at_500']==166
          assert abs(d['metrics']['top100_dominant_precision']-0.8534939929790234)<1e-12
          assert abs(d['metrics']['mrr']-0.02094738537699626)<1e-12
          assert d['metrics']['qualified_matches']==256
          PY
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p20-recurrent-isolated-quartet-development
          path: input/p20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31341591263
      - name: Verify immutable GMN candidate universe
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/p19/p19_subthreshold_reciprocal_recurrence_development.json | cut -d' ' -f1)" = '6f1ad0626b8a8bda03f18e7f3435f0651af8bebf65cfd1d970a6b61a8ba52319'
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
          test "$(sha256sum input/p20/p20_recurrent_isolated_quartet_development.json | cut -d' ' -f1)" = '9ec53f29281b11002a9e22b1086d12e054392e466ea74fe82ead0187289ba303'
          test "$(sha256sum input/p20/p20_prelabel_payload.json | cut -d' ' -f1)" = '8ca358ae0f3ac96b188de9eac7bcfd6f870470873a2b7ee73b7ae76497c12734'
      - name: Fit and freeze exact v29 full GMN purity model
        env:
          PYTHONPATH: .:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_v29_purity_diversity_gmn_freeze_v1/fit_freeze.py \
            --purity-source /tmp/purity_source.py \
            --pr971-result input/pr971/GMN_QUALITY_PURITY_DUALHEAD_FUSION_V1.json \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p19-result-json input/p19/p19_subthreshold_reciprocal_recurrence_development.json \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --p20-result-json input/p20/p20_recurrent_isolated_quartet_development.json \
            --p20-prelabel-json input/p20/p20_prelabel_payload.json \
            --output output
      - name: Enforce model-freeze firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/V29_GMN_PURITY_DIVERSITY_MODEL_FREEZE.json'))
          assert r['verdict']=='PASS_V29_GMN_PURITY_DIVERSITY_MODEL_FREEZE'
          assert r['candidate_counts']=={'hard':226,'p19':1075,'p20':3203,'union':4504}
          assert r['deployment_diversity']=={'lambda':0.8,'scale':1.0,'family_deletion':False,'complete_backfill':True}
          assert r['quality_fusion'] is False and r['event_jaccard_suppression'] is False and r['parameter_search'] is False
          assert r['sonotaco_2013_2014_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v29_purity_diversity_gmn_freeze_v1/PROTOCOL.md orbittrace_v29_purity_diversity_gmn_freeze_v1/fit_freeze.py /tmp/purity_source.py input/pr971/GMN_QUALITY_PURITY_DUALHEAD_FUSION_V1.json > output/source_input_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/freeze_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v29-purity-diversity-gmn-model-freeze-v1
          path: output
          if-no-files-found: error
          retention-days: 90
