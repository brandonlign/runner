name: OrbitTrace v24 HDB graph-coherence diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v24-twohead-contingency-freeze-v1
    paths:
      - 'orbittrace_v24_hdb_graph_coherence_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v24_hdb_graph_coherence_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v24-hdb-graph-coherence-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and pin runtime and diagnostic source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/ranker input/model input/prepare input/v24 input/truth output/regen_hdb output/diag
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          ( cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py )
          test "$(cat frozen-v8/output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/prepare_pretruth.py)" = '046795db6913c6831a0643abf30ce20055ef3024'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          test "$(git hash-object orbittrace_v24_hdb_graph_coherence_diagnostic_v1/PROTOCOL.md)" = '2bc99cfb2c837c37aa6c5a5c56c070c1aa162d01'
          test "$(git hash-object orbittrace_v24_hdb_graph_coherence_diagnostic_v1/capture_graph_pretruth.py)" = 'd2d63910b031204c18eab94a01acf5fa53ab70fe'
          test "$(git hash-object orbittrace_v24_hdb_graph_coherence_diagnostic_v1/diagnose.py)" = 'ed27cd7b5fbc08d955f9505f08179717c78d49dc'
          python -m py_compile orbittrace_v24_hdb_graph_coherence_diagnostic_v1/capture_graph_pretruth.py orbittrace_v24_hdb_graph_coherence_diagnostic_v1/diagnose.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-urc-final-full-gmn-ranker-v1
          path: input/model
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344776617
      - name: Verify immutable ranker identities
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/model/urc_final_ranker.joblib | cut -d' ' -f1)" = 'ac48355e8c51de2a9cfa12f23b2a847f5e946fc03336a941f80d98224ee5c909'
      - name: Restore immutable label-free inputs and v24 payload before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9050107352/zip' -o input/prepare.zip
          echo '1296d757b5ea1dd94f9c9077fd769fdc8f00ec06d0881d8548fd1df4608344cc  input/prepare.zip' | sha256sum -c -
          unzip -q input/prepare.zip -d input/prepare
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/v24.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/v24.zip' | sha256sum -c -
          unzip -q input/v24.zip -d input/v24
          test "$(sha256sum input/v24/result/V24_EXPOSED_TWOHEAD_OOF_RESULT.json | cut -d' ' -f1)" = 'c8d95bc02ad1436c9924ec14a25bcd36e0eacd960fda1fb33db3a91738fe30cf'
          python - <<'PY'
          import json
          m=json.load(open('input/prepare/label_free_preparation_manifest.json'))
          assert m['verdict']=='PASS_FINAL_SONOTACO_LABEL_FREE_PREPARATION' and m['shower_truth_accessed'] is False and m['target_information_access'] is False
          for r in ('sugar','hdbscan'):
              x=json.load(open(f'input/v24/{r}/V22_PRETRUTH_FEATURE_MANIFEST.json')); f=json.load(open(f'input/v24/{r}/family_memberships.json'))
              assert x['truth_accessed'] is False and x['feature_dimension']==71 and f['truth_accessed'] is False
          PY
      - name: Regenerate HDB pretruth while passively capturing exact frozen graph
        env:
          PYTHONPATH: .:input/ranker:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_v24_hdb_graph_coherence_diagnostic_v1/capture_graph_pretruth.py \
            --rows-2013 input/prepare/hdbscan_2013.json --rows-2014 input/prepare/hdbscan_2014.json \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --ranker-source input/ranker/run_urc_union_ranker.py --original-model input/model/urc_final_ranker.joblib \
            --output output/regen_hdb --graph-output output/HDB_RADIUS1_GRAPH_PRETRUTH.json
      - name: Require exact HDB pretruth identity before truth
        run: |
          set -euo pipefail
          echo '619d13b46fb286e46135fb1984264ed2323efa36da2be516c0832962825f4452  output/regen_hdb/centroids.npy' | sha256sum -c -
          echo '99640747e935df2f4a7c7983bdde843ea59e1814388b8418e040dc04628aee13  output/regen_hdb/family_memberships.json' | sha256sum -c -
          python - <<'PY'
          import hashlib,json,numpy as np
          def h(x):
              a=np.ascontiguousarray(np.round(np.asarray(x,dtype=np.float64),12)); z=hashlib.sha256(); z.update(str(a.dtype).encode()); z.update(json.dumps(list(a.shape),separators=(',',':')).encode()); z.update(a.tobytes(order='C')); return z.hexdigest()
          assert h(np.load('output/regen_hdb/features.npy',allow_pickle=False))=='2a0e3a06a70601d8045a2d33eadd70c17a65078a7473f51a577bfcf34aa66577'
          m=json.load(open('output/regen_hdb/V22_PRETRUTH_FEATURE_MANIFEST.json')); g=json.load(open('output/HDB_RADIUS1_GRAPH_PRETRUTH.json'))
          assert m['v19_family_sha256']=='7137a5c0892e5d316db38915ff164f2a8fb6e8fbe8e0ed2cfa063097968a1895'
          assert g['truth_accessed'] is False and g['radius']==1.0 and g['feature_sha256']==m['feature_sha256'] and g['edge_count']==m['consensus_diagnostics']['edge_count']
          print('PASS_V24_HDB_GRAPH_PRETRUTH_IDENTITY')
          PY
      - name: Load immutable exposed truth only after graph and payload freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
      - name: Reproduce v24 and measure graph coherence only
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v24_hdb_graph_coherence_diagnostic_v1/diagnose.py \
            --sugar-root input/v24/sugar --hdbscan-root input/v24/hdbscan --truth-root input/truth \
            --ranker-source input/ranker/run_urc_union_ranker.py --graph-json output/HDB_RADIUS1_GRAPH_PRETRUTH.json --output output/diag
      - name: Enforce diagnostic-only firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V24_HDB_GRAPH_COHERENCE_DIAGNOSTIC.json'))
          assert r['verdict']=='PASS_V24_HDB_GRAPH_COHERENCE_DIAGNOSTIC'
          assert r['graph_rank_or_transform_evaluated'] is False and r['successor_selected'] is False
          assert r['radius_search'] is False and r['feature_search'] is False and r['parameter_search'] is False and r['post_result_second_search'] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['blind_exclusion']==[20.0,55.0]
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v24_hdb_graph_coherence_diagnostic_v1/PROTOCOL.md orbittrace_v24_hdb_graph_coherence_diagnostic_v1/capture_graph_pretruth.py orbittrace_v24_hdb_graph_coherence_diagnostic_v1/diagnose.py > output/V24_HDB_GRAPH_COHERENCE_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v24-hdb-graph-coherence-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
