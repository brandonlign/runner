name: OrbitTrace RFT v1 fast ordered pair_d equivalence

on:
  push:
    branches: [agent/orbittrace-rft-v1-shard3-repair]
    paths: ['.github/workflows/orbittrace_rft_v1_fast_pair_equivalence.yml']

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1'
      - uses: actions/download-artifact@v4
        with:
          name: rft-sharded-input
          path: prep
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31816118410
      - name: Verify frozen engineering identity sources
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_flow_tube_v1_engineering/FAST_PAIR_D_PROTOCOL.md)" = 'f1447d13804fe373a54026dab4708dac1ad922f2'
          test "$(git hash-object orbittrace_recurrent_flow_tube_v1_engineering/fast_pair_exact.py)" = '5c6e914849a24bc2683c7e7e86e5f34f80834df4'
          test "$(git hash-object orbittrace_recurrent_flow_tube_v1_engineering/fast_pair_equivalence_audit.py)" = 'd4f7ee17725cae892e996bc1b3cff8e28d259ed1'
          test "$(git hash-object orbittrace_recurrent_flow_tube_v1/run_development.py)" = 'a5d5371f0c30a9c57ee4d8756ea41f454cd86301'
          mkdir -p output
      - name: Compare frozen and fast ordered pair_d bit-for-bit across every accessible bin
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_flow_tube_v1_engineering/fast_pair_equivalence_audit.py \
            --frozen-source orbittrace_recurrent_flow_tube_v1/run_development.py \
            --fast-pair-source orbittrace_recurrent_flow_tube_v1_engineering/fast_pair_exact.py \
            --events prep/events.json.gz --output output
      - name: Enforce zero-endpoint identity verdict
        run: |
          python - <<'PY'
          import json
          r=json.load(open('output/RFT_V1_FAST_PAIR_D_EQUIVALENCE.json'))
          assert r['verdict']=='PASS_RFT_V1_FAST_ORDERED_PAIR_D_EQUIVALENCE_AUDIT'
          assert r['events']==315024 and r['bin_count']==163
          assert r['all_compared_floats_bitwise_equal'] is True and r['reverse_pair_reuse_authorized'] is False
          for k in ('scientific_endpoint_computed','atoms_computed','tubes_computed','labels_used','gmn_2023_access','sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['ordered_pairs_compared'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-rft-v1-fast-pair-equivalence
          path: output
          if-no-files-found: error
          retention-days: 90
