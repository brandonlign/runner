name: OrbitTrace v24 HDB feature-block attribution diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v24-hdb-feature-support-diagnostic-v1
    paths:
      - 'orbittrace_v24_hdb_feature_block_attribution_v1/**'
      - '.github/workflows/orbittrace_v24_hdb_feature_block_attribution_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v24-hdb-feature-block-attribution-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and pin runtime and diagnostic source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2'
          mkdir -p input/ranker input/payload input/truth output/diag
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          test "$(git hash-object orbittrace_v24_hdb_feature_block_attribution_v1/PROTOCOL.md)" = '0f51c318a1929e3a2ddd5e4555aff2954eb4776a'
          test "$(git hash-object orbittrace_v24_hdb_feature_block_attribution_v1/diagnose.py)" = '69d00d4035422be7e706fe9ba2d1f450128ade11'
          python -m py_compile orbittrace_v24_hdb_feature_block_attribution_v1/diagnose.py orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify immutable #839 ranker
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - name: Restore immutable v24 pretruth payload before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/v24.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/v24.zip' | sha256sum -c -
          unzip -q input/v24.zip -d input/payload
          test "$(sha256sum input/payload/result/V24_EXPOSED_TWOHEAD_OOF_RESULT.json | cut -d' ' -f1)" = 'c8d95bc02ad1436c9924ec14a25bcd36e0eacd960fda1fb33db3a91738fe30cf'
          python - <<'PY'
          import json
          expected={'raw_839':34,'relative_noncat_839':30,'rank_percentiles':3,'consensus_graph':4}
          for route in ('sugar','hdbscan'):
              m=json.load(open(f'input/payload/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              f=json.load(open(f'input/payload/{route}/family_memberships.json'))
              assert m['truth_accessed'] is False and m['feature_dimension']==71 and m['feature_blocks']==expected and f['truth_accessed'] is False
          print('PASS_FEATURE_BLOCK_ATTRIBUTION_IMMUTABLE_V24_PRETRUTH')
          PY
      - name: Load immutable exposed truth only after payload freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
      - name: Reproduce v24 and attribute full-space positive support gap by frozen feature block
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v24_hdb_feature_block_attribution_v1/diagnose.py \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --output output/diag
      - name: Enforce diagnostic-only firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V24_HDB_FEATURE_BLOCK_ATTRIBUTION_DIAGNOSTIC.json'))
          assert r['verdict']=='PASS_V24_HDB_FEATURE_BLOCK_ATTRIBUTION_DIAGNOSTIC'
          assert r['scientific_role']=='POST_RESULT_DIAGNOSTIC_ONLY_NO_SUCCESSOR_SELECTED'
          assert r['parent_1021_geometry_reproduced'] is True
          assert r['feature_blocks']=={
              'raw_839':{'start':0,'stop':34,'dimension':34},
              'relative_noncat_839':{'start':34,'stop':64,'dimension':30},
              'rank_percentiles':{'start':64,'stop':67,'dimension':3},
              'consensus_graph':{'start':67,'stop':71,'dimension':4},
          }
          assert r['successor_selected'] is False and r['feature_subset_selected'] is False and r['block_weight_selected'] is False and r['new_rank_or_score_evaluated'] is False
          assert r['feature_search'] is False and r['metric_search'] is False and r['parameter_search'] is False and r['post_result_second_search'] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v24_hdb_feature_block_attribution_v1/PROTOCOL.md orbittrace_v24_hdb_feature_block_attribution_v1/diagnose.py orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py input/ranker/run_urc_union_ranker.py > output/V24_HDB_FEATURE_BLOCK_ATTRIBUTION_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v24-hdb-feature-block-attribution-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
