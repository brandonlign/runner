name: OrbitTrace M2D SACV pair Pareto catalogue v1 GMN fairness

on:
  push:
    branches: [agent/orbittrace-m2d-sacv-pair-pareto-catalogue-v1]
    paths: ['orbittrace_m2d_sacv_pair_pareto_catalogue_v1/ACTIVATE.md']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  binding:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/orbittrace-m2d-sacv-pair-pareto-catalogue-v1, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: agent/orbittrace-recurrent-local-topomodal-trunk-v1, path: local-trunk-src}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: c9d6c44704013ba0c9430100e98a29a56b453304, path: frozen-v8}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Zero-data source audit and exact runtime reconstruction
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_sacv_pair_pareto_catalogue_v1/PROTOCOL.md)" = cfca4d2b219732b2a3b8eedcea8e7746ad4b9e3a
          test "$(git hash-object orbittrace_m2d_sacv_pair_pareto_catalogue_v1/instrument_runtime.py)" = e4ff0108d6c5989a5e00bfc92b76154863e22e68
          test "$(git hash-object orbittrace_m2d_sacv_pair_pareto_catalogue_v1/build_pretruth.py)" = 35eced550f1e67652bd4f217a80b2dff435f9e89
          test "$(git hash-object orbittrace_m2d_sacv_pair_pareto_catalogue_v1/evaluate_truth.py)" = 77e94d894d1f02de0d90c2be3aff39244628d7d6
          echo 'd75b76a36911c916620da5e029f82c7987718b1610eb6bd61922015b5ab50d4a  orbittrace_m2d_sacv_v1_source.tgz' | sha256sum -c -
          tar -xzf orbittrace_m2d_sacv_v1_source.tgz
          cat orbittrace_m2d_sacv_edge_consensus_v1/source_parts/part*.b64 > /tmp/ec.b64
          test "$(wc -c < /tmp/ec.b64)" = 16844
          base64 -d /tmp/ec.b64 > /tmp/ec.tgz
          echo 'f7d9fc168fb5f8a589a5d965252979951ae9659ded4dc6662a562276c6273d28  /tmp/ec.tgz' | sha256sum -c -
          tar -xzf /tmp/ec.tgz
          echo 'f6c5b2a89d70003b058e772b753c531cb5072b2c1eb52d77166d7a5cbd566ca7  orbittrace_m2d_sacv_fallback_recurrence_v1/patch_source.py' | sha256sum -c -
          python orbittrace_m2d_sacv_fallback_recurrence_v1/patch_source.py
          echo '435db7a53d4a78547f910d5e1a836bc399a7bd77b227056b4a1c12665d10b13a  orbittrace_m2d_sacv_edge_consensus_v1/build_pretruth.py' | sha256sum -c -
          cp orbittrace_m2d_sacv_edge_consensus_v1/build_pretruth.py orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py
          python orbittrace_m2d_sacv_pair_pareto_catalogue_v1/instrument_runtime.py
          python -m py_compile orbittrace_m2d_sacv_pair_pareto_catalogue_v1/*.py orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py
          python - <<'PY'
          import random
          from orbittrace_m2d_sacv_pair_pareto_catalogue_v1.build_pretruth import pareto_depth
          def brute(rows):
              rem=set(range(len(rows)));d=[0]*len(rows);layer=1
              while rem:
                  front=[]
                  for i in rem:
                      a=rows[i]
                      if not any(j!=i and rows[j]['parent_rank']<=a['parent_rank'] and rows[j]['r22']<=a['r22'] and rows[j]['r23']<=a['r23'] and (rows[j]['parent_rank']<a['parent_rank'] or rows[j]['r22']<a['r22'] or rows[j]['r23']<a['r23']) for j in rem):front.append(i)
                  assert front
                  for i in front:d[i]=layer;rem.remove(i)
                  layer+=1
              return d
          random.seed(1409)
          for _ in range(500):
              rows=[]
              for p in range(1,random.randint(2,8)):
                  seen=set()
                  for _j in range(random.randint(1,10)):
                      q=(random.randint(1,8),random.randint(1,8))
                      if q in seen:continue
                      seen.add(q);rows.append({'parent_rank':p,'r22':q[0],'r23':q[1],'pair_hash':f'{p}:{q}'})
              ref=brute(rows);test=[dict(x) for x in rows];pareto_depth(test);assert [x['pareto_depth'] for x in test]==ref
          print('PASS_EXACT_3D_PARETO_DEPTH_EQUIVALENCE')
          PY

      - name: Install frozen runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/internal input/ranker input/v8 input/v3 input/fair input/sacv output/geometry output/pretruth output/truth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = 2ba4835db23f8f623cdd28d0a4e6113b7954ecb2
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51)

      - uses: actions/download-artifact@v4
        with: {name: orbittrace-support-cut-bifiltration-internal-mass-v1, path: input/internal, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 32041661731}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-active-urc-ranker-source-export-v1, path: input/ranker, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31344632499}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-pooled-year-centroid-v8-development, path: input/v8, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31217916558}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth, path: input/fair, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 32268943692}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-m2d-sacv-v1-gmn-development, path: input/sacv, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 32325172601}

      - name: Verify immutable inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/internal/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json | cut -d' ' -f1)" = 7b1ddfcd32cd0b52321e3b3dfc614a88dd9b973f947c1d4d0de74fddf26b59cd
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b
          test "$(sha256sum input/fair/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json | cut -d' ' -f1)" = 8b0f4629659c1bfd750747303ad04ff67355adf66d4dbe474ce7fba788f5bae5
          test "$(sha256sum input/sacv/pretruth/M2D_SACV_V1_GMN_PRETRUTH.json | cut -d' ' -f1)" = 77528fbec227bf8d8d311b9054c46db43668d7f12e9460b85db680c4a6ce927b

      - name: Export target-excluded label-free geometry
        env: {PYTHONPATH: 'input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3'}
        run: |
          set -euo pipefail
          python -u local-trunk-src/orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py --quality-source input/ranker/run_urc_union_ranker.py --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 --v8-result-json input/v8/pooled_year_centroid_v8_development.json --output output/geometry/GMN_LABEL_FREE_GEOMETRY.json
          test "$(sha256sum output/geometry/GMN_LABEL_FREE_GEOMETRY.json | cut -d' ' -f1)" = 1fd5cd0577d88784845e0d367ef35491d6afb7caa78bb06fa05d72048daec384

      - name: Build and seal pair catalogue before truth
        env: {PYTHONPATH: '.'}
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_sacv_pair_pareto_catalogue_v1/build_pretruth.py --fair-pretruth input/fair/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json --geometry output/geometry/GMN_LABEL_FREE_GEOMETRY.json --sacv-v1-pretruth input/sacv/pretruth/M2D_SACV_V1_GMN_PRETRUTH.json --output output/pretruth/M2D_SACV_PAIR_PARETO_CATALOGUE_V1_GMN_PRETRUTH.json
          sha256sum output/pretruth/M2D_SACV_PAIR_PARETO_CATALOGUE_V1_GMN_PRETRUTH.json | tee output/pretruth/PRETRUTH_SHA256.txt
          python - <<'PY'
          import json
          r=json.load(open('output/pretruth/M2D_SACV_PAIR_PARETO_CATALOGUE_V1_GMN_PRETRUTH.json'))
          assert r['shower_truth_used'] is False and r['target_information_access'] is False and r['sonotaco_scientific_access'] is False
          assert all(all(v==0 for v in s['capacity_shortfall'].values()) for s in r['subsets']), 'POWER_INCONCLUSIVE_CAPACITY_SHORTFALL'
          print('PRETRUTH_SEALED',r['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with: {name: orbittrace-m2d-sacv-pair-pareto-catalogue-v1-pretruth, path: output/pretruth, if-no-files-found: error, retention-days: 90}

      - name: Open hidden GMN truth after seal and evaluate
        env: {PYTHONPATH: 'input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3'}
        run: |
          set -euo pipefail
          test "$(cut -d' ' -f1 output/pretruth/PRETRUTH_SHA256.txt)" = "$(sha256sum output/pretruth/M2D_SACV_PAIR_PARETO_CATALOGUE_V1_GMN_PRETRUTH.json | cut -d' ' -f1)"
          python -u orbittrace_m2d_sacv_pair_pareto_catalogue_v1/evaluate_truth.py --candidate-pretruth output/pretruth/M2D_SACV_PAIR_PARETO_CATALOGUE_V1_GMN_PRETRUTH.json --fair-pretruth input/fair/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json --internal-prelabel input/internal/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py --quality-source input/ranker/run_urc_union_ranker.py --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 --v8-result-json input/v8/pooled_year_centroid_v8_development.json --output output/truth/M2D_SACV_PAIR_PARETO_CATALOGUE_V1_GMN_RESULT.json
          sha256sum output/truth/M2D_SACV_PAIR_PARETO_CATALOGUE_V1_GMN_RESULT.json | tee output/truth/RESULT_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: orbittrace-m2d-sacv-pair-pareto-catalogue-v1-gmn-fairness, path: output, if-no-files-found: warn, retention-days: 90}
      - name: Comment binding result
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          P=output/truth/M2D_SACV_PAIR_PARETO_CATALOGUE_V1_GMN_RESULT.json
          if [ -f "$P" ]; then
            python - <<'PY' > /tmp/r.md
          import hashlib,json
          from pathlib import Path
          p=Path('output/truth/M2D_SACV_PAIR_PARETO_CATALOGUE_V1_GMN_RESULT.json');r=json.loads(p.read_text())
          print('## Pair-Pareto catalogue v1 — binding target-excluded GMN fairness\n');print(f"Verdict: **`{r['verdict']}`**");print(f"- result SHA-256: `{hashlib.sha256(p.read_bytes()).hexdigest()}`")
          for c in ('sugar2017','hdbscan2025'):
              g=r['gates'][c];z=r['aggregates'][c]['panel_relations'];print(f"- {c}: macro-F1 `{g['successor_mean_macro_f1']:.6f}` vs `{g['comparator_mean_macro_f1']:.6f}`; recovered `{g['successor_total_recovered_f1_gt_05']}` vs `{g['comparator_total_recovered_f1_gt_05']}`; gate `{g['passed']}`; W/T/L `{z['wins']}/{z['ties']}/{z['losses']}`")
          print('- OrbitTrace target access: `false`; SonotaCo scientific access: `false`')
          PY
            gh pr comment 1420 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
          else
            gh pr comment 1420 --repo "$GITHUB_REPOSITORY" --body 'Pair-Pareto v1 ended before a binding truth result; technical/pretruth no-result only.'
          fi
