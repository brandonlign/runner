name: OrbitTrace P15 matched evaluator from unique pretruth

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - orbittrace_support_safe_halo_p15/MATCHED_EVALUATOR_RUN.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-p15-matched-evaluator-unique-pretruth
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: ffe8351b9ee8df4418fb4926fab782d66180e276
          path: exact-lit
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact frozen evaluator dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r exact-lit/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Discover unique frozen pretruth artifact and open matched truth exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp orbittrace_support_safe_halo_p15/run_matched_evaluator_from_unique_pretruth.sh /tmp/run_p15_evaluator.sh
          chmod +x /tmp/run_p15_evaluator.sh
          /tmp/run_p15_evaluator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-p15-matched-literature-result
          path: output
          if-no-files-found: warn
          retention-days: 90
