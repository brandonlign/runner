name: OrbitTrace NASA ASFN Orbit Table HEAD audit v1

on:
  push:
    branches:
      - agent/orbittrace-nasa-asfn-orbit-table-head-audit-v1
    paths:
      - '.github/workflows/orbittrace_nasa_asfn_orbit_table_head_audit_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HEAD-audit runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install 'requests==2.32.5'
          test "$(git hash-object orbittrace_nasa_asfn_orbit_table_head_audit_v1/PROTOCOL.md)" = 'b3a1a08df68527d6462ec0ca1dc120376979d53a'
          test "$(git hash-object orbittrace_nasa_asfn_orbit_table_head_audit_v1/head_audit.py)" = 'c28d717eba30c2f29a240416179aac3244d2519d'
          python -m py_compile orbittrace_nasa_asfn_orbit_table_head_audit_v1/head_audit.py
      - name: Run sole Orbit Table HEAD request
        run: |
          set -euo pipefail
          python orbittrace_nasa_asfn_orbit_table_head_audit_v1/head_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-nasa-asfn-orbit-table-head-audit-v1
          path: output
          if-no-files-found: error
          retention-days: 90
