name: OrbitTrace P15 matched evaluator source reservation audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - orbittrace_support_safe_halo_p15/prepare_transport_compatible_p13_finalizer_p15.py
      - orbittrace_support_safe_halo_p15/validate_p15_matched_pretruth_checkpoint.py
      - orbittrace_support_safe_halo_p15/finalize_p15_matched_result.py
      - orbittrace_support_safe_halo_p15/run_matched_evaluator_p15.sh
      - .github/workflows/orbittrace_p15_matched_evaluator.yml
      - .github/workflows/orbittrace_p15_matched_evaluator_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit inherited gates, authoritative P15 checkpoint schema, truth-opening order, and authorization boundary
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_core_halo_p13_literature/finalize_p3_evaluator_result.py)" = 'a5d812b9956742b51e7e3995a71eb308afa7d095'
          test "$(git hash-object orbittrace_core_halo_p13_literature/finalize_p14_matched_result.py)" = 'd1ce98f443b2039d70421e76dadb6ada77d1b0d5'
          test "$(git hash-object orbittrace_support_safe_halo_p15/run_matched_evaluator_p15.sh)" = '481897f5d8b477393ea1f5bcc054621693ce99d0'
          test "$(git hash-object .github/workflows/orbittrace_p15_matched_evaluator.yml)" = '1d488b5f94c5166c18ee41aad53fcfe4a7b5aab9'
          bash -n orbittrace_support_safe_halo_p15/run_matched_evaluator_p15.sh
          python -m py_compile orbittrace_support_safe_halo_p15/prepare_transport_compatible_p13_finalizer_p15.py orbittrace_support_safe_halo_p15/validate_p15_matched_pretruth_checkpoint.py orbittrace_support_safe_halo_p15/finalize_p15_matched_result.py
          python orbittrace_support_safe_halo_p15/prepare_transport_compatible_p13_finalizer_p15.py orbittrace_core_halo_p13_literature/finalize_p3_evaluator_result.py /tmp/finalize_p13_p15.py
          python -m py_compile /tmp/finalize_p13_p15.py
          python - <<'PY'
          from pathlib import Path
          base=Path('orbittrace_core_halo_p13_literature/finalize_p3_evaluator_result.py').read_text()
          patched=Path('/tmp/finalize_p13_p15.py').read_text()
          old="P13_TRANSPORT_SOURCE_SHA256='f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae'\n"
          new="P13_TRANSPORT_SOURCE_SHA256='55a1efed550498d51b859ffec555797ba8473d7d8b5f20ad6831c5f15b43b415'\n"
          assert base.count(old)==1 and patched.count(new)==1 and patched.replace(new,old,1)==base
          gates=('four_to_nine_gain_ge_0_10','four_to_twentyfour_gain_ge_0_10','macro_f1_not_more_than_0_10_lower','retain_at_least_80pct_f1_gt_0_5_count')
          assert all(base.count(x)==patched.count(x)>0 for x in gates)
          validator=Path('orbittrace_support_safe_halo_p15/validate_p15_matched_pretruth_checkpoint.py').read_text()
          final=Path('orbittrace_support_safe_halo_p15/finalize_p15_matched_result.py').read_text()
          for x in (
            '23d309f6702ed0aa6769381963ea64701ae59c97376a0bae536b527fbc978fe6',
            'P15_SUPPORT_SAFE_SECONDARY_HALO_AVAILABILITY',
            'p15_generated_matched_source_sha256',
            'p15_unavailable_direction_count',
            'CHARACTERIZATION_UNAVAILABLE_INSUFFICIENT_NEGATIVES',
            'p15_halo_availability_frozen_before_truth',
            'PASS_P15_BOTH_PRETRUTH_CHECKPOINTS_VALIDATED_BEFORE_TRUTH',
          ): assert x in validator,x
          assert 'p15_halo_source_sha256' not in validator
          assert 'p15_matched_pretruth_frozen_before_truth' not in validator
          for x in (
            'PASS_SUPPORT_SAFE_SECONDARY_HALO_P15_DEVELOPMENT',
            'PASS_P14_MATCHED_SPARSE_SUPERIORITY_BOTH_COMPARATORS_BOTH_YEARS',
            'FAIL_P14_MATCHED_SPARSE_SUPERIORITY_NO_GO',
            'PASS_P15_MATCHED_SPARSE_SUPERIORITY_BOTH_COMPARATORS_BOTH_YEARS',
            'FAIL_P15_MATCHED_SPARSE_SUPERIORITY_NO_GO',
            'p15_generated_matched_source_sha256',
            'p15_halo_availability_frozen_before_truth',
            'sparse_superiority_required_against_both_comparators_in_both_years',
            'broad_only_does_not_authorize_external',
            "out['target_access_authorized']=False",
          ): assert x in final,x
          assert 'p15_halo_source_sha256' not in final
          for x in ('OrbitTrace-April','target_coordinate'):
              assert x not in patched+validator+final,x

          run=Path('orbittrace_support_safe_halo_p15/run_matched_evaluator_p15.sh').read_text()
          required=(
              'EXECUTE_P15_MATCHED_EVALUATOR_AFTER_BOTH_PRETRUTH_CHECKPOINTS',
              'orbittrace-p15-support-safe-halo-development-v2',
              'orbittrace-p15-matched-pretruth-checkpoints',
              'PASS_SUPPORT_SAFE_SECONDARY_HALO_P15_DEVELOPMENT',
              'validate_p15_matched_pretruth_checkpoint.py',
              'PASS_P15_MATCHED_EVALUATOR_PREREQUISITES_FROZEN_BEFORE_TRUTH',
              "progress 'STAGE EXACT POSTFREEZE SOURCES — STILL NO TRUTH INDEXING'",
              "progress 'OPEN MATCHED TRUTH + COMPETITOR CLUSTER VALUES EXACTLY ONCE'",
              'evaluate_frozen_blindsafe.py',
              '/tmp/finalize_p13_p15.py',
              'finalize_p15_matched_result.py',
              'PASS_P15_MATCHED_SPARSE_SUPERIORITY_BOTH_COMPARATORS_BOTH_YEARS',
              'FAIL_P15_MATCHED_SPARSE_SUPERIORITY_NO_GO',
          )
          for x in required: assert x in run,x
          assert run.count("progress 'OPEN MATCHED TRUTH + COMPETITOR CLUSTER VALUES EXACTLY ONCE'")==1
          assert run.count('python -u input/evaluator/evaluate_frozen_blindsafe.py')==1
          assert run.index('PASS_P15_MATCHED_EVALUATOR_PREREQUISITES_FROZEN_BEFORE_TRUTH') < run.index("progress 'OPEN MATCHED TRUTH + COMPETITOR CLUSTER VALUES EXACTLY ONCE'")
          assert run.index('validate_p15_matched_pretruth_checkpoint.py') < run.index("progress 'OPEN MATCHED TRUTH + COMPETITOR CLUSTER VALUES EXACTLY ONCE'")
          assert "assert r['target_access_authorized'] is False" in run
          assert 'OrbitTrace-April' not in run and 'target_coordinate' not in run
          print('PASS_P15_MATCHED_EVALUATOR_ACTIVATION_ORDER_SOURCE_FREEZE')
          PY
          grep -F 'orbittrace_support_safe_halo_p15/P15_MATCHED_EVALUATOR_RUN.md' .github/workflows/orbittrace_p15_matched_evaluator.yml
          grep -F 'orbittrace-p15-matched-literature-result' .github/workflows/orbittrace_p15_matched_evaluator.yml
          test ! -e orbittrace_support_safe_halo_p15/P15_MATCHED_EVALUATOR_RUN.md
          echo PASS_P15_MATCHED_EVALUATOR_SOURCE_FREEZE
          echo NO_COMPARATOR_TRUTH_NO_EXTERNAL_NO_TARGET_ACCESS
