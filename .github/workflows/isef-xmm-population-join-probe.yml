name: ISEF XMM population join probe
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_population_join_probe.py'
      - '.github/workflows/isef-xmm-population-join-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install astropy
      - run: python isef/xmm_population_join_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-population-join-probe
          path: results/xmm_population_join_probe.json
          if-no-files-found: error
