name: OrbitTrace DAG corroboration-mass rank v1

on:
  pull_request:
    branches:
      - agent/orbittrace-dag-corroboration-mass-rank-v1
    paths:
      - 'orbittrace_dag_corroboration_mass_rank_v1/ACTIVATE.md'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-dag-corroboration-mass-rank-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit frozen successor source
        run: |
          set -euo pipefail
          mkdir -p input/dag output/pretruth
          test "$(git hash-object orbittrace_dag_corroboration_mass_rank_v1/PROTOCOL.md)" = '6d8e94b6d61f3301df01892f2796c94a0a70e5b7'
          test "$(git hash-object orbittrace_dag_corroboration_mass_rank_v1/build_pretruth.py)" = '7eeb6ea1e7bf30d18d9b7572c033dbadff014f61'
          test "$(git hash-object orbittrace_dag_corroboration_mass_rank_v1/evaluate_truth.py)" = 'c9db0e3bdb58bc0e226b0e6edeef93dc60422429'
          python -m py_compile orbittrace_dag_corroboration_mass_rank_v1/build_pretruth.py orbittrace_dag_corroboration_mass_rank_v1/evaluate_truth.py
          python - <<'PY'
          import json
          x=json.load(open('orbittrace_dag_corroboration_mass_rank_v1/EXECUTION_FREEZE.json'))
          assert x['scientific_role']=='TARGET_EXCLUDED_GMN_SPARSE_RANKING_DEVELOPMENT'
          assert x['protocol_blob']=='6d8e94b6d61f3301df01892f2796c94a0a70e5b7'
          assert x['builder_blob']=='7eeb6ea1e7bf30d18d9b7572c033dbadff014f61'
          assert x['truth_evaluator_blob']=='c9db0e3bdb58bc0e226b0e6edeef93dc60422429'
          assert x['truth_requires_pretruth_pass'] is True
          assert x['protected_interval']==[20.0,55.0]
          PY
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-crosshierarchy-refinement-dag-v1-repair02
          path: input/dag
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 32185851992
      - name: Verify immutable supported DAG source
        run: |
          set -euo pipefail
          test "$(sha256sum input/dag/CROSSHIERARCHY_REFINEMENT_DAG_V1_PRELABEL.json | cut -d' ' -f1)" = '65ead5f26026dbed74a098cc1df17d000c28705cd8fcd3af5134fd98151a0573'
          test "$(sha256sum input/dag/CROSSHIERARCHY_REFINEMENT_DAG_V1_RESULT.json | cut -d' ' -f1)" = 'b7b4a4355a488108f4107e86e98bfc872f67c176d63eac1e56772a78f0708721'
          python - <<'PY'
          import json
          p=json.load(open('input/dag/CROSSHIERARCHY_REFINEMENT_DAG_V1_PRELABEL.json'))
          r=json.load(open('input/dag/CROSSHIERARCHY_REFINEMENT_DAG_V1_RESULT.json'))
          assert p['schema']=='ORBITTRACE_CROSSHIERARCHY_REFINEMENT_DAG_V1_PRELABEL'
          assert p['scientific_role']=='ZERO_LABEL_CROSS_HIERARCHY_COMMON_REFINEMENT'
          assert p['shower_truth_used'] is False
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert r['verdict']=='SUPPORTS_CROSSHIERARCHY_REFINEMENT_DAG_V1'
          assert r['prelabel_sha256']=='65ead5f26026dbed74a098cc1df17d000c28705cd8fcd3af5134fd98151a0573'
          assert len(r['gates'])==9 and all(r['gates'].values())
          assert r['shower_truth_used'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['external_scientific_access'] is False
          PY
      - name: Build and seal zero-label corroboration-mass ranking
        run: |
          set -euo pipefail
          python -u orbittrace_dag_corroboration_mass_rank_v1/build_pretruth.py \
            --dag-prelabel input/dag/CROSSHIERARCHY_REFINEMENT_DAG_V1_PRELABEL.json \
            --dag-result input/dag/CROSSHIERARCHY_REFINEMENT_DAG_V1_RESULT.json \
            --output output/pretruth
          python - <<'PY'
          import hashlib,json
          p='output/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRELABEL.json'
          r='output/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRETRUTH.json'
          pre=json.load(open(p)); audit=json.load(open(r)); h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert pre['scientific_role']=='PRELABEL_DAG_CORROBORATION_MASS_RANK_V1'
          assert pre['shower_truth_used'] is False
          assert pre['target_information_access'] is False and pre['target_region_events_accessed'] is False
          assert audit['verdict']=='PASS_DAG_CORROBORATION_MASS_RANK_V1_PRETRUTH'
          assert audit['prelabel_sha256']==h
          assert len(audit['gates'])==13 and all(audit['gates'].values())
          assert audit['shower_truth_used'] is False
          assert audit['target_information_access'] is False and audit['target_region_events_accessed'] is False
          print(json.dumps({'verdict':audit['verdict'],'prelabel_sha256':h,'gates':audit['gates'],'panels':audit['panels']},indent=2,sort_keys=True))
          PY
          printf '%s\n' "$GITHUB_RUN_ID" > output/pretruth/execution_run_id.txt
          git rev-parse HEAD > output/pretruth/execution_commit.txt
          sha256sum \
            orbittrace_dag_corroboration_mass_rank_v1/PROTOCOL.md \
            orbittrace_dag_corroboration_mass_rank_v1/build_pretruth.py \
            orbittrace_dag_corroboration_mass_rank_v1/evaluate_truth.py \
            orbittrace_dag_corroboration_mass_rank_v1/EXECUTION_FREEZE.json \
            input/dag/CROSSHIERARCHY_REFINEMENT_DAG_V1_PRELABEL.json \
            input/dag/CROSSHIERARCHY_REFINEMENT_DAG_V1_RESULT.json \
            output/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRELABEL.json \
            output/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRETRUTH.json \
            > output/pretruth/source_input_output_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-dag-corroboration-mass-rank-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-dag-corroboration-mass-rank-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and audit frozen GMN truth runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/{ranker,v8,pretruth,v3} output/truth
          test "$(git hash-object orbittrace_dag_corroboration_mass_rank_v1/PROTOCOL.md)" = '6d8e94b6d61f3301df01892f2796c94a0a70e5b7'
          test "$(git hash-object orbittrace_dag_corroboration_mass_rank_v1/build_pretruth.py)" = '7eeb6ea1e7bf30d18d9b7572c033dbadff014f61'
          test "$(git hash-object orbittrace_dag_corroboration_mass_rank_v1/evaluate_truth.py)" = 'c9db0e3bdb58bc0e226b0e6edeef93dc60422429'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          python - <<'PY'
          import json
          x=json.load(open('orbittrace_dag_corroboration_mass_rank_v1/EXECUTION_FREEZE.json'))
          assert x['truth_requires_pretruth_pass'] is True
          assert x['target_information_authorized'] is False
          assert x['external_scientific_access_authorized'] is False
          assert x['post_result_rescue_authorized'] is False
          PY
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-dag-corroboration-mass-rank-v1-pretruth
          path: input/pretruth
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 31217916558
      - name: Verify immutable pretruth PASS before opening labels
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python - <<'PY'
          import hashlib,json
          p='input/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRELABEL.json'
          r='input/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRETRUTH.json'
          pre=json.load(open(p)); audit=json.load(open(r)); h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert pre['scientific_role']=='PRELABEL_DAG_CORROBORATION_MASS_RANK_V1'
          assert pre['shower_truth_used'] is False
          assert pre['target_information_access'] is False and pre['target_region_events_accessed'] is False
          assert audit['verdict']=='PASS_DAG_CORROBORATION_MASS_RANK_V1_PRETRUTH'
          assert audit['prelabel_sha256']==h
          assert len(audit['gates'])==13 and all(audit['gates'].values())
          assert audit['shower_truth_used'] is False
          assert audit['target_information_access'] is False and audit['target_region_events_accessed'] is False
          PY
      - name: Evaluate exact sealed corroboration-mass catalogue
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_dag_corroboration_mass_rank_v1/evaluate_truth.py \
            --prelabel input/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRELABEL.json \
            --pretruth input/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRETRUTH.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth
      - name: Enforce binding scientific contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          r=json.load(open('output/truth/DAG_CORROBORATION_MASS_RANK_V1_TRUTH.json'))
          assert r['schema']=='ORBITTRACE_DAG_CORROBORATION_MASS_RANK_V1_TRUTH'
          assert r['verdict'] in {'PASS_DAG_CORROBORATION_MASS_RANK_V1','FAIL_DAG_CORROBORATION_MASS_RANK_V1'}
          assert len(r['gates'])==12 and len(r['panels'])==16
          assert r['ranking_metric_gate']=='zero_filled_eligible_query_mrr_panel_mean'
          assert r['historical_conditional_mrr_role']=='diagnostic_only'
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_scientific_access'] is False
          assert r['asfn_event_level_access'] is False and r['efn_event_level_access'] is False
          assert r['amos_scientific_access'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['method_parameter_selection_from_result'] is False and r['post_result_rescue'] is False
          p='input/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRELABEL.json'
          assert r['prelabel_sha256']==hashlib.sha256(open(p,'rb').read()).hexdigest()
          print(r['verdict'])
          print(json.dumps({'scales':r['scale_aggregates'],'gates':r['gates']},indent=2,sort_keys=True))
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          cp input/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRELABEL.json output/truth/ 2>/dev/null || true
          cp input/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRETRUTH.json output/truth/ 2>/dev/null || true
          printf '%s\n' "$GITHUB_RUN_ID" > output/truth/execution_run_id.txt
          git rev-parse HEAD > output/truth/execution_commit.txt
          python -m pip freeze > output/truth/environment.txt
          sha256sum \
            orbittrace_dag_corroboration_mass_rank_v1/PROTOCOL.md \
            orbittrace_dag_corroboration_mass_rank_v1/build_pretruth.py \
            orbittrace_dag_corroboration_mass_rank_v1/evaluate_truth.py \
            orbittrace_dag_corroboration_mass_rank_v1/EXECUTION_FREEZE.json \
            input/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRELABEL.json \
            input/pretruth/DAG_CORROBORATION_MASS_RANK_V1_PRETRUTH.json \
            output/truth/DAG_CORROBORATION_MASS_RANK_V1_TRUTH.json \
            > output/truth/source_input_output_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-dag-corroboration-mass-rank-v1-truth
          path: output/truth
          if-no-files-found: error
          retention-days: 90
