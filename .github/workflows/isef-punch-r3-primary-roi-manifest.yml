name: ISEF PUNCH R3 primary ROI manifest
on:
  push:
    branches: [main]
    paths:
      - 'isef/punch_r3_primary_roi_manifest.py'
      - '.github/workflows/isef-punch-r3-primary-roi-manifest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy astropy astroquery 'fsspec[http]'
      - name: Generate frozen header-only primary ROI manifest
        run: python isef/punch_r3_primary_roi_manifest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-punch-r3-primary-roi-manifest
          path: results/punch_r3_primary_roi_manifest/
          if-no-files-found: error
