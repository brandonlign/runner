name: ISEF TESS binary Stage-5 pseudo-period null manifest

on:
  push:
    paths:
      - '.github/workflows/isef-tess-binary-stage5-null-manifest.yml'
  workflow_dispatch:

jobs:
  freeze-null-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata stack
        run: pip install 'tess-asteroids==1.5.1' beautifulsoup4 requests
      - uses: actions/cache@v4
        id: spice-cache
        with:
          path: ~/.lkspacecraft/cache
          key: lkspacecraft-1.3.1-tess-spice-2026-09-01
      - name: Bootstrap TESS SPICE cache only if absent
        if: steps.spice-cache.outputs.cache-hit != 'true'
        run: python -c "from lkspacecraft import TESSSpacecraft; TESSSpacecraft(); print('SPICE bootstrap complete')"
      - name: Freeze metadata-only null identities
        run: |
          python -m py_compile isef/tess_binary_stage5_null_manifest.py
          python isef/tess_binary_stage5_null_manifest.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tess-binary-stage5-null-manifest
          path: isef/results/tess_binary_stage5_null_manifest/manifest.json
          if-no-files-found: warn
