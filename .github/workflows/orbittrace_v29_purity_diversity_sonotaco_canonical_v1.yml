name: OrbitTrace v29 canonical SonotaCo exposed development v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v29-purity-diversity-gmn-freeze-v1
    paths:
      - 'orbittrace_v29_purity_diversity_sonotaco_canonical_v1/**'
      - '.github/workflows/orbittrace_v29_purity_diversity_sonotaco_canonical_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v29-purity-diversity-sonotaco-canonical-dev-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 677d111986a72af0df7bc1e6f787fc745cc8ca3a
          path: frozen-v17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact runtime and audit frozen science
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/ranker input/model input/prepare input/truth output/pretruth output/final
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py /tmp/purity_source.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(git hash-object orbittrace_v29_purity_diversity_sonotaco_canonical_v1/PROTOCOL.md)" = '6bea703f7c003beef949209d43756fc0d41fb5af'
          test "$(git hash-object orbittrace_v29_purity_diversity_sonotaco_canonical_v1/run_candidate_pretruth.py)" = 'd110d247ecd7dde0202dcfcd3615330a8c73ac39'
          test "$(git hash-object orbittrace_v29_purity_diversity_sonotaco_canonical_v1/evaluate_exposed.py)" = 'dc163d8762bc5a3f8095b4f517d5600438774437'
          test "$(git -C frozen-v17 hash-object orbittrace_v16_v15_joint_conformal_membership_v1/expand_candidate.py)" = '2c4230c05acf3e63b3b3aee204f2025b62f83aeb'
          test "$(git hash-object orbittrace_p19_subthreshold_recurrence/run_development.py)" = 'f230fc775b38df1e9d447bba33419abd5f6f6ef1'
          test "$(git hash-object orbittrace_p20_recurrent_isolated_quartet/run_development.py)" = '6c5c8e02ac7a377ca8253f1e1fc0ad6e60e5e69f'
          test "$(git hash-object frozen-v8/orbittrace_pooled_year_centroid_v8/run_development.py)" = 'f248df78e1258b132b41aecca6a985a5eb782654'
          test "$(git hash-object orbittrace_v15_canonical_application_v1/application.py)" = '5b3244dfbcc7bc931925aea42866edc8205113a8'
          git fetch --no-tags --depth=1 origin d7f1b310905265403d493814c5117f09fc57319c
          git show FETCH_HEAD:orbittrace_urc_union_ranking_lab_v2/run_lab.py > /tmp/purity_source.py
          test "$(git hash-object /tmp/purity_source.py)" = '976ae788ec76a2da7035735ea62118c7289adc5e'
          test "$(sha256sum /tmp/purity_source.py | cut -d' ' -f1)" = '7bbaa13b90ba10eb41f708b5aec6ebebd83e9c7c34018aa3f973b4aec086b96a'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify exact #839 diversity source
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v29-purity-diversity-gmn-model-freeze-v1
          path: input/model
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31436385652
      - name: Verify immutable v29 model freeze
        run: |
          set -euo pipefail
          test "$(sha256sum input/model/orbittrace_v29_gmn_purity_hgb31.joblib | cut -d' ' -f1)" = 'b10f8e307f1ef632e41b16f02997a8bd3d01ecc2fa84ea018974eef98b390978'
          test "$(sha256sum input/model/V29_GMN_PURITY_DIVERSITY_MODEL_FREEZE.json | cut -d' ' -f1)" = '5c38915826a58626dda39a512f410e7380e829853a035f94356c19a07ccbb427'
          python - <<'PY'
          import json
          r=json.load(open('input/model/V29_GMN_PURITY_DIVERSITY_MODEL_FREEZE.json'))
          assert r['verdict']=='PASS_V29_GMN_PURITY_DIVERSITY_MODEL_FREEZE'
          assert r['model_sha256']=='b10f8e307f1ef632e41b16f02997a8bd3d01ecc2fa84ea018974eef98b390978'
          assert r['feature_dimension']==28
          assert r['deployment_diversity']=={'lambda':0.8,'scale':1.0,'family_deletion':False,'complete_backfill':True}
          assert r['sonotaco_2013_2014_access'] is False
          PY
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-sonotaco-label-free-preparation-v2
          path: input/prepare
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31354363306
      - name: Verify canonical label-free SonotaCo input only
        run: |
          set -euo pipefail
          test "$(sha256sum input/prepare/base_2013.json | cut -d' ' -f1)" = 'f84e6db4166be065a73c7d030d66fdf796c1c6c2b5ee692f1e3299e8ae7c05ce'
          test "$(sha256sum input/prepare/base_2014.json | cut -d' ' -f1)" = '1fab29c7368b63cc9c9d172dcadec5918d6514bfbb09f0f71e54eebb9bf32f00'
          python - <<'PY'
          import json
          m=json.load(open('input/prepare/label_free_preparation_manifest.json'))
          assert m['verdict']=='PASS_FINAL_SONOTACO_LABEL_FREE_PREPARATION'
          assert m['shower_truth_accessed'] is False and m['target_information_access'] is False and m['maarsy_scientific_access'] is False
          assert len(json.load(open('input/prepare/base_2013.json')))==24899
          assert len(json.load(open('input/prepare/base_2014.json')))==20575
          PY
      - name: Generate and freeze single canonical v29 catalogue before truth
        env:
          PYTHONPATH: .:input/ranker:frozen-v17:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -m py_compile orbittrace_v29_purity_diversity_sonotaco_canonical_v1/run_candidate_pretruth.py orbittrace_v29_purity_diversity_sonotaco_canonical_v1/evaluate_exposed.py
          python -u orbittrace_v29_purity_diversity_sonotaco_canonical_v1/run_candidate_pretruth.py \
            --prepared input/prepare \
            --purity-source /tmp/purity_source.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --model-joblib input/model/orbittrace_v29_gmn_purity_hgb31.joblib \
            --model-manifest input/model/V29_GMN_PURITY_DIVERSITY_MODEL_FREEZE.json \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --output output/pretruth
      - name: Lock pretruth catalogue and firewall before truth download
        run: |
          set -euo pipefail
          test -f output/pretruth/V29_CANONICAL_PRETRUTH_CATALOGUE.json
          test -f output/pretruth/V29_CANONICAL_PRETRUTH_SUMMARY.json
          sha256sum output/pretruth/V29_CANONICAL_PRETRUTH_CATALOGUE.json > output/V29_PRETRUTH_CATALOGUE_SHA256.txt
          python - <<'PY'
          import json,hashlib
          s=json.load(open('output/pretruth/V29_CANONICAL_PRETRUTH_SUMMARY.json'))
          c=json.load(open('output/pretruth/V29_CANONICAL_PRETRUTH_CATALOGUE.json'))
          h=hashlib.sha256(open('output/pretruth/V29_CANONICAL_PRETRUTH_CATALOGUE.json','rb').read()).hexdigest()
          assert s['verdict']=='PASS_V29_CANONICAL_SONOTACO_PRETRUTH_CATALOGUE_FREEZE'
          assert h==s['primary_output_sha256']
          assert s['truth_accessed'] is False and s['matched_comparator_rows_accessed'] is False
          assert s['target_information_access'] is False and s['maarsy_scientific_access'] is False and s['dms_scientific_access'] is False
          assert c['input_role'].startswith('single canonical SonotaCo base pair')
          assert c['truth_accessed'] is False and c['matched_comparator_rows_accessed'] is False
          print('PASS_V29_PRETRUTH_LOCK_BEFORE_TRUTH')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v15-exposed-matched-sonotaco-literature-result-v1
          path: input/truth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31405109267
      - name: Verify immutable exposed truth/comparator package
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('input/truth/V15_FINAL_LITERATURE_RESULT.json'))
          assert r['verdict']=='FAIL_FINAL_LITERATURE_SUPERIORITY'
          PY
      - name: Evaluate same frozen canonical catalogue on all four literature panels
        run: |
          set -euo pipefail
          python -u orbittrace_v29_purity_diversity_sonotaco_canonical_v1/evaluate_exposed.py \
            --catalogue output/pretruth/V29_CANONICAL_PRETRUTH_CATALOGUE.json \
            --summary output/pretruth/V29_CANONICAL_PRETRUTH_SUMMARY.json \
            --truth-root input/truth \
            --output output/final
      - name: Enforce v29 exposed-development boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/final/V29_CANONICAL_SONOTACO_EXPOSED_RESULT.json'))
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
          assert r['single_canonical_detector_catalogue'] is True
          assert r['panel_specific_candidate_generation'] is False and r['panel_specific_ranking'] is False
          assert r['matched_comparator_rows_used_as_detector_input'] is False
          assert r['model_retrained_on_sonotaco'] is False
          assert r['parameter_search'] is False and r['post_result_second_search'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False and r['target_information_access'] is False
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v29_purity_diversity_sonotaco_canonical_v1/PROTOCOL.md orbittrace_v29_purity_diversity_sonotaco_canonical_v1/run_candidate_pretruth.py orbittrace_v29_purity_diversity_sonotaco_canonical_v1/evaluate_exposed.py input/model/V29_GMN_PURITY_DIVERSITY_MODEL_FREEZE.json input/model/orbittrace_v29_gmn_purity_hgb31.joblib input/prepare/base_2013.json input/prepare/base_2014.json > output/V29_SOURCE_INPUT_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v29-canonical-sonotaco-exposed-development-v1
          path: output
          if-no-files-found: error
          retention-days: 90
