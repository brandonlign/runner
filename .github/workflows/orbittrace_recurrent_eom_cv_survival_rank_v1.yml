name: OrbitTrace recurrent-EOM CV survival rank v1

on:
  push:
    branches:
      - agent/orbittrace-recurrent-eom-cv-survival-rank-v1
    paths:
      - '.github/workflows/orbittrace_recurrent_eom_cv_survival_rank_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-recurrent-eom-cv-survival-rank-v1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify frozen science
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/v8 input/ranker input/folds output

          test "$(git hash-object orbittrace_recurrent_eom_cv_survival_rank_v1/PROTOCOL.md)" = '478d5ad8b4c744134bdeb397b7691d53b23c0c59'
          test "$(git hash-object orbittrace_recurrent_eom_cv_survival_rank_v1/run_development.py)" = '6c69cf8839dc71438a8cc4ef61ead6c3e7707c36'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_recurrent_eom_cv_survival_rank_v1/run_development.py orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py orbittrace_recurrent_eom_hdbscan_v1/run_development.py

          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Restore exact pre-existing deletion-fold prelabels
        uses: actions/download-artifact@v4
        with:
          pattern: orbittrace-density-sync-gmn-train-cv-v1-fold-*
          path: input/folds
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31859724335

      - name: Verify immutable GMN runtime-support inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(find input/folds -name 'DENSITY_SYNC_GMN_TRAIN_CV_V1_FOLD_*_PRELABEL.json' | wc -l)" -eq 10

      - name: Run sole frozen GMN CV-survival ranking development
        env:
          PYTHONPATH: orbittrace_recurrent_eom_hdbscan_v1:input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_eom_cv_survival_rank_v1/run_development.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --fold-root input/folds \
            --output output

      - name: Enforce binding result and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('output/RECURRENT_EOM_CV_SURVIVAL_RANK_V1_PRELABEL.json'))
          r=json.load(open('output/RECURRENT_EOM_CV_SURVIVAL_RANK_V1_RESULT.json'))
          assert p['schema']=='ORBITTRACE_RECURRENT_EOM_CV_SURVIVAL_RANK_V1_PRELABEL'
          assert r['schema']=='ORBITTRACE_RECURRENT_EOM_CV_SURVIVAL_RANK_V1_RESULT'
          assert r['verdict'] in {'PASS_RECURRENT_EOM_CV_SURVIVAL_RANK_V1_GMN_DEVELOPMENT','FAIL_RECURRENT_EOM_CV_SURVIVAL_RANK_V1_GMN_DEVELOPMENT'}
          assert p['parent_candidate_count']==2097 and p['successor_candidate_count']==2097
          assert p['parent_membership_sha256']==p['successor_membership_sha256']
          assert p['mechanism_active'] is True
          assert p['fold_source_run']==31859724335 and len(p['fold_prelabel_sha256'])==10
          for x in (p,r):
              assert x['blind_exclusion']==[20.0,55.0]
              for k in ['target_information_access','target_region_events_accessed','sonotaco_2013_2014_access','amos_2023_2024_access','asfn_access','efn_access','maarsy_scientific_access','dms_scientific_access']:
                  assert x[k] is False, (k,x[k])
          assert r['post_result_parameter_search'] is False
          print(json.dumps({'verdict':r['verdict'],'parent_metrics':r['parent_metrics'],'successor_metrics':r['successor_metrics'],'gates':r['gates']},indent=2,sort_keys=True))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum orbittrace_recurrent_eom_cv_survival_rank_v1/PROTOCOL.md orbittrace_recurrent_eom_cv_survival_rank_v1/run_development.py orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py orbittrace_recurrent_eom_hdbscan_v1/run_development.py > output/source_sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-cv-survival-rank-v1
          path: output
          if-no-files-found: error
