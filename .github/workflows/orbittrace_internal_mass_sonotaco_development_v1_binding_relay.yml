name: OrbitTrace internal-mass SonotaCo development v1 binding relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: orbittrace-internal-mass-sonotaco-development-v1-binding
  cancel-in-progress: false

env:
  BENCH_BRANCH: agent/orbittrace-internal-mass-sonotaco-development-v1

jobs:
  benchmark:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 1372 &&
      github.event.comment.user.login == 'brandonlign' &&
      github.event.comment.body == 'RUN_ORBITTRACE_INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_BINDING_R2'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Announce exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1372 --repo "${{ github.repository }}" --body "ORBITTRACE_INTERNAL_MASS_SONOTACO_BINDING_R2_STARTED=${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BENCH_BRANCH }}
          fetch-depth: 1

      - name: Bind frozen benchmark head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '5b9cf92ae598f72ffd8167ecbc26de0de4e709e7'
          test "$(git hash-object orbittrace_internal_mass_sonotaco_development_v1/PROTOCOL.md)" = 'b64e02193a1c93f562bc7a3306c7b3b8d222809c'
          python -m py_compile orbittrace_internal_mass_sonotaco_development_v1/run_binding.py

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-topomodal-hierarchy-scale-v1
          path: fixed-topology
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-symmetric-tuned-literature-benchmark-v2
          path: benchmark
          fetch-depth: 1

      - name: Verify exact frozen method and benchmark sources
        run: |
          set -euo pipefail
          echo "STRUCTURAL_BLOB=$(git -C fixed-topology hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)"
          echo "BENCHMARK_RESULT_BLOB=$(git -C benchmark hash-object orbittrace_symmetric_tuned_literature_v2/RESULT.json)"
          echo "CPP_SHA256=$(sha256sum orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp | cut -d' ' -f1)"
          test "$(git -C fixed-topology hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git -C benchmark hash-object orbittrace_symmetric_tuned_literature_v2/RESULT.json)" = 'f58d796d8c2da1b1e2b825e67d808379986e31bd'
          test "$(sha256sum orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp | cut -d' ' -f1)" = '4eef6f1b70b5baee5d1983d2480c02d73569b12af868ec23bbb6009d6ca1fa37'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact numerical runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/rows input/pretruth input/truth output

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-sonotaco-label-free-preparation-v2
          path: input/rows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31354363306

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-sonotaco-development-v1-prep-32229888368
          path: input/pretruth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32229888368

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v15-exposed-matched-sonotaco-literature-result-v1
          path: input/truth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31405109267

      - name: Verify immutable pretruth support
        run: |
          set -euo pipefail
          test "$(sha256sum input/pretruth/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_PRETRUTH_SUPPORT.json | cut -d' ' -f1)" = '19828089363280d37aed17aacc9561e60c185abda61b2b7c0dead0226d2740b9'
          python - <<'PY'
          import json
          r=json.load(open('input/pretruth/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_PRETRUTH_SUPPORT.json'))
          assert r['candidate_count']==888
          assert r['truth_used'] is False and r['shower_labels_accessed'] is False
          assert r['post_result_parameter_search'] is False
          PY

      - name: Execute binding internal-mass development benchmark
        run: |
          set -euo pipefail
          python -u orbittrace_internal_mass_sonotaco_development_v1/run_binding.py \
            --rows-root input/rows \
            --truth-root input/truth \
            --structural-source fixed-topology/orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --pretruth-support input/pretruth/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_PRETRUTH_SUPPORT.json \
            --baseline-result benchmark/orbittrace_symmetric_tuned_literature_v2/RESULT.json \
            --exact-cpp orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp \
            --output output

      - name: Enforce binding result structure
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_RESULT.json'))
          assert r['verdict'] in {'PASS_INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1','FAIL_INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1'}
          assert r['scientific_role']=='EXPOSED_SONOTACO_DEVELOPMENT_BENCHMARK'
          assert len(r['accelerator_audit'])==5
          assert r['post_result_parameter_search'] is False
          print(r['verdict'])
          print(json.dumps(r['aggregate'],indent=2,sort_keys=True))
          print(json.dumps(r['gates'],indent=2,sort_keys=True))
          PY

      - name: Commit immutable binding outputs
        run: |
          set -euo pipefail
          cp output/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_RESULT.json orbittrace_internal_mass_sonotaco_development_v1/RESULT.json
          cp output/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_RANKED_PRETRUTH.json orbittrace_internal_mass_sonotaco_development_v1/RANKED_PRETRUTH.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orbittrace_internal_mass_sonotaco_development_v1/RESULT.json orbittrace_internal_mass_sonotaco_development_v1/RANKED_PRETRUTH.json
          git commit -m 'Record internal-mass SonotaCo development v1 result'
          git push origin HEAD:"${BENCH_BRANCH}"

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit_after_result.txt
          python --version > output/python_version.txt
          g++ --version | head -1 > output/compiler_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum \
            orbittrace_internal_mass_sonotaco_development_v1/PROTOCOL.md \
            orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp \
            orbittrace_internal_mass_sonotaco_development_v1/run_binding.py \
            input/pretruth/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_PRETRUTH_SUPPORT.json \
            output/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_RANKED_PRETRUTH.json \
            output/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_RESULT.json > output/provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-internal-mass-sonotaco-development-v1-binding-${{ github.run_id }}
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1372 --repo "${{ github.repository }}" --body "ORBITTRACE_INTERNAL_MASS_SONOTACO_BINDING_R2_SUCCESS=${GITHUB_RUN_ID}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1372 --repo "${{ github.repository }}" --body "ORBITTRACE_INTERNAL_MASS_SONOTACO_BINDING_R2_FAILED=${GITHUB_RUN_ID}"
