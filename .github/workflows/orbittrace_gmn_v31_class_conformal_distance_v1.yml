name: OrbitTrace GMN v31 class-conditional nearest-distance calibration v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-v31-class-conformal-distance-v1
    paths:
      - 'orbittrace_gmn_v31_class_conformal_distance_v1/PROTOCOL.md'
      - 'orbittrace_gmn_v31_class_conformal_distance_v1/run_development.py'
      - 'orbittrace_gmn_v31_class_conformal_distance_v1/run_binding.py'
      - '.github/workflows/orbittrace_gmn_v31_class_conformal_distance_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify frozen scientific/engineering sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/v8 input/p19 input/ranker output/parent output/candidate
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(git hash-object orbittrace_gmn_v31_principle_local_geometry_oof_v1/run_development.py)" = 'b4e2d72e532e47aa95ed335f690748423d11ea59'
          test "$(git hash-object orbittrace_gmn_v31_class_conformal_distance_v1/PROTOCOL.md)" = '4c06eb32a76ec8d714fbbc7b2c05e268db9c6850'
          test "$(git hash-object orbittrace_gmn_v31_class_conformal_distance_v1/run_development.py)" = 'f17c3c17d1dee57535c4e1a6070fe34813df8ebf'
          test "$(git hash-object orbittrace_gmn_v31_class_conformal_distance_v1/run_binding.py)" = 'b313007cd34ff24e3e955d289691e8ab69c6edd5'
          PYTHONPATH=orbittrace_gmn_v31_class_conformal_distance_v1 python -m py_compile \
            orbittrace_gmn_v31_class_conformal_distance_v1/run_development.py \
            orbittrace_gmn_v31_class_conformal_distance_v1/run_binding.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify exact active GMN ranking support source
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          PYTHONPATH=input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8 python -m py_compile \
            input/ranker/run_urc_union_ranker.py \
            orbittrace_gmn_v31_principle_local_geometry_oof_v1/run_development.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086

      - name: Verify immutable target-excluded GMN inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'

      - name: Reproduce exact GMN v31 parent before candidate
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_v31_principle_local_geometry_oof_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --output output/parent
          python - <<'PY'
          import json
          r=json.load(open('output/parent/GMN_V31_PRINCIPLE_LOCAL_GEOMETRY_OOF_RESULT.json'))
          assert r['verdict']=='PASS_GMN_V31_PRINCIPLE_LOCAL_GEOMETRY_OOF'
          assert r['candidate_count']==226 and r['feature_dimension']==23
          assert r['prelabel_sha256']=='b45c4ce1a45bff515e411e211bc51dee879229ee97f7fcb7d8e7e05bfc106d09'
          assert r['feature_matrix_sha256']=='fea3b063772c75b675e37a227b53a4aa3c5b86fdcbfcef1487b1e1448689cdf5'
          assert r['margin_sha256']=='f38c96e3fa4ea98f51217b36d639e96edbf3ebcb65123248f0f118d3298173bd'
          m=r['equal_rank_fusion']
          assert m['recovered_at_25']==23 and m['recovered_at_50']==41 and m['recovered_at_100']==66
          assert m['qualified_matches']==95
          assert abs(m['top100_dominant_precision']-0.7229521515453452)<1e-15
          assert abs(m['mrr']-0.050244164168646674)<1e-15
          assert r['sonotaco_2013_2014_access'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_EXACT_PARENT_BEFORE_CLASS_CONDITIONAL')
          PY

      - name: Run first binding GMN v31 class-conditional nearest-distance outcome
        env:
          PYTHONPATH: orbittrace_gmn_v31_class_conformal_distance_v1:input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_v31_class_conformal_distance_v1/run_binding.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --parent-result-json output/parent/GMN_V31_PRINCIPLE_LOCAL_GEOMETRY_OOF_RESULT.json \
            --output output/candidate

      - name: Enforce binding result and protected-data boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/candidate/GMN_V31_CLASS_CONDITIONAL_DISTANCE_V1_RESULT.json'))
          e=json.load(open('output/candidate/GMN_V31_CLASS_CONDITIONAL_DISTANCE_EVIDENCE.json'))
          assert r['verdict'] in {'PASS_GMN_V31_CLASS_CONDITIONAL_DISTANCE_V1','FAIL_GMN_V31_CLASS_CONDITIONAL_DISTANCE_V1'}
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_V31_SUCCESSOR_DEVELOPMENT_ONLY'
          assert r['first_valid_outcome_binding'] is True
          assert r['candidate_count']==226 and r['feature_dimension']==23
          assert r['prelabel_sha256']=='b45c4ce1a45bff515e411e211bc51dee879229ee97f7fcb7d8e7e05bfc106d09'
          assert r['feature_matrix_sha256']=='fea3b063772c75b675e37a227b53a4aa3c5b86fdcbfcef1487b1e1448689cdf5'
          assert r['parent_control']=={
            'recovered_at_25':23,'recovered_at_50':41,'recovered_at_100':66,
            'top100_dominant_precision':0.7229521515453452,'mrr':0.050244164168646674,
            'qualified_matches':95}
          assert r['strict_whole_shower_oof'] is True and r['fold_count']==5 and r['nearest_k']==1
          assert r['distance']=='ordinary Euclidean after fold-training z-score'
          assert r['training_calibration']=='within each outer training fold, nearest same-class reference excluding entire strict group'
          assert r['local_score']=='p_positive-p_nonpositive'
          assert r['diversity']=={'lambda':0.8,'scale':1.0}
          assert r['fusion']=='equal rank-sum with immutable P19 hard order'
          assert len(r['fold_diagnostics'])==5 and e['candidate_count']==226 and len(e['rows'])==226
          for k in ('pvalue_threshold_search','pvalue_transform_search','pseudocount_search','calibration_pool_search','class_prior_correction','class_weight_search','k_search','metric_search','feature_search','scaling_search','fold_search','reference_definition_search','diversity_search','fusion_search','candidate_generation_recomputed','membership_changed','post_result_second_search','sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
            assert r[k] is False
          for k in ('sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
            assert e[k] is False
          assert r['blind_exclusion']==[20.0,55.0] and e['blind_exclusion']==[20.0,55.0]
          if r['verdict'].startswith('PASS_'):
            assert all(r['pass_gates'].values())
            assert r['sonotaco_benchmark_authorized_by_this_result'] is True
          else:
            assert not all(r['pass_gates'].values())
            assert r['sonotaco_benchmark_authorized_by_this_result'] is False
          print(r['verdict'], r['parent_control'], r['class_conditional_equal_rank_fusion'], r['pass_gates'])
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_gmn_v31_class_conformal_distance_v1/PROTOCOL.md \
            orbittrace_gmn_v31_class_conformal_distance_v1/run_development.py \
            orbittrace_gmn_v31_class_conformal_distance_v1/run_binding.py \
            orbittrace_gmn_v31_principle_local_geometry_oof_v1/run_development.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            input/p19/p19_prelabel_payload.json \
            output/parent/GMN_V31_PRINCIPLE_LOCAL_GEOMETRY_OOF_RESULT.json \
            output/candidate/GMN_V31_CLASS_CONDITIONAL_DISTANCE_V1_RESULT.json \
            output/candidate/GMN_V31_CLASS_CONDITIONAL_DISTANCE_EVIDENCE.json \
            > output/source_input_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/development_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-v31-class-conformal-distance-v1
          path: output
          if-no-files-found: error
          retention-days: 90
