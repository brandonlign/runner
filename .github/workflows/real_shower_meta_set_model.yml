name: Real-shower set-model Stage-0

on:
  pull_request:
    branches:
      - main
    paths:
      - real_shower_meta_stage0/**
      - .github/workflows/real_shower_meta_set_model.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: real-shower-set-model-stage0
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATA_ARTIFACT_ID: '8871480252'
      BASELINE_ARTIFACT_ID: '8871912750'
      SELECTED_EVENTS_SHA256: 'cbec0d01ae7b157cc6d0ca149aeea5b3eb8e53bcffdab2f1f8d8f2fb9da2a068'
      DATA_AUDIT_JSON_SHA256: 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778'
      BASELINE_JSON_SHA256: 'f3d36e231722891a3f6c4c5d81e0b645e7ee4212a417cbd66e606111d94a95ba'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-shower-meta-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/set_model_requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r real_shower_meta_stage0/set_model_requirements.txt
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download exact data and baseline artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p real_shower_meta_stage0/input/data_audit real_shower_meta_stage0/input/baseline real_shower_meta_stage0/results/set_model
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DATA_ARTIFACT_ID}/zip" \
            -o real_shower_meta_stage0/input/data_audit.zip
          unzip -q real_shower_meta_stage0/input/data_audit.zip -d real_shower_meta_stage0/input/data_audit

          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" \
            -o real_shower_meta_stage0/input/baseline.zip
          unzip -q real_shower_meta_stage0/input/baseline.zip -d real_shower_meta_stage0/input/baseline

          echo "${SELECTED_EVENTS_SHA256}  real_shower_meta_stage0/input/data_audit/selected_events.jsonl.gz" | sha256sum -c -
          echo "${DATA_AUDIT_JSON_SHA256}  real_shower_meta_stage0/input/data_audit/audit.json" | sha256sum -c -
          echo "${BASELINE_JSON_SHA256}  real_shower_meta_stage0/input/baseline/baseline_ceiling.json" | sha256sum -c -
      - name: Compile verified launcher
        run: python -m py_compile real_shower_meta_stage0/run_set_model_pilot.py
      - name: Run five-fold real-shower set-model benchmark
        run: |
          python real_shower_meta_stage0/run_set_model_pilot.py \
            --events real_shower_meta_stage0/input/data_audit/selected_events.jsonl.gz \
            --audit real_shower_meta_stage0/input/data_audit/audit.json \
            --baseline real_shower_meta_stage0/input/baseline/baseline_ceiling.json \
            --output real_shower_meta_stage0/results/set_model
      - name: Record provenance
        run: |
          sha256sum \
            real_shower_meta_stage0/run_set_model_pilot.py \
            real_shower_meta_stage0/run_set_model_pilot.py.gz.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            real_shower_meta_stage0/PROTOCOL.md \
            real_shower_meta_stage0/BASELINE_CEILING_GATE.md \
            > real_shower_meta_stage0/results/set_model/source_sha256.txt
          sha256sum \
            real_shower_meta_stage0/input/data_audit/selected_events.jsonl.gz \
            real_shower_meta_stage0/input/data_audit/audit.json \
            real_shower_meta_stage0/input/baseline/baseline_ceiling.json \
            > real_shower_meta_stage0/results/set_model/input_sha256.txt
          python --version > real_shower_meta_stage0/results/set_model/python_version.txt
          python -m pip freeze > real_shower_meta_stage0/results/set_model/environment.txt
      - name: Upload set-model evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-shower-set-model-stage0
          path: real_shower_meta_stage0/results/set_model
          if-no-files-found: error
          retention-days: 90
