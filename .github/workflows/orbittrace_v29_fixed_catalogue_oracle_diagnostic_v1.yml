name: OrbitTrace v29 fixed-catalogue oracle diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v29-purity-diversity-sonotaco-canonical-dev-v1
    paths:
      - 'orbittrace_v29_fixed_catalogue_oracle_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v29_fixed_catalogue_oracle_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v29-fixed-catalogue-oracle-diagnostic-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact diagnostic runtime
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1'
          mkdir -p input/v29 input/truth output
          python -m py_compile orbittrace_v29_fixed_catalogue_oracle_diagnostic_v1/run_diagnostic.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v29-canonical-sonotaco-exposed-development-v1
          path: input/v29
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31437739544
      - name: Verify immutable failed v29 catalogue/result
        run: |
          set -euo pipefail
          test "$(sha256sum input/v29/pretruth/V29_CANONICAL_PRETRUTH_CATALOGUE.json | cut -d' ' -f1)" = 'dd751abd4330f58b4056eb8da473ee4d19ae756211f0538c41b252ffc9fb352b'
          test "$(sha256sum input/v29/final/V29_CANONICAL_SONOTACO_EXPOSED_RESULT.json | cut -d' ' -f1)" = '1692bef9f8eece32d5b61754879c354a46fa86494b8b1677e1cacb8cc0d4b3d6'
          python - <<'PY'
          import json
          c=json.load(open('input/v29/pretruth/V29_CANONICAL_PRETRUTH_CATALOGUE.json'))
          r=json.load(open('input/v29/final/V29_CANONICAL_SONOTACO_EXPOSED_RESULT.json'))
          assert c['family_count']==334 and c['truth_accessed'] is False
          assert r['verdict']=='FAIL_V29_CANONICAL_SONOTACO_ALL_PANEL_LITERATURE_SUPERIORITY_DEVELOPMENT'
          assert r['panel_wins']==0
          assert r['candidate_catalogue_sha256']=='dd751abd4330f58b4056eb8da473ee4d19ae756211f0538c41b252ffc9fb352b'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v15-exposed-matched-sonotaco-literature-result-v1
          path: input/truth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31405109267
      - name: Verify immutable exposed truth package
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('input/truth/V15_FINAL_LITERATURE_RESULT.json'))
          assert r['verdict']=='FAIL_FINAL_LITERATURE_SUPERIORITY'
          PY
      - name: Run exact fixed-catalogue joint oracle diagnostic
        run: |
          set -euo pipefail
          python -u orbittrace_v29_fixed_catalogue_oracle_diagnostic_v1/run_diagnostic.py \
            --catalogue input/v29/pretruth/V29_CANONICAL_PRETRUTH_CATALOGUE.json \
            --v29-result input/v29/final/V29_CANONICAL_SONOTACO_EXPOSED_RESULT.json \
            --truth-root input/truth \
            --output output
      - name: Enforce diagnostic-only boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/V29_FIXED_CATALOGUE_JOINT_ORACLE_DIAGNOSTIC_V1.json'))
          assert r['diagnostic_only'] is True and r['deployable_reorder_defined'] is False
          assert r['oracle_all_panel_pass'] is True and r['nested_selection_pass'] is True
          assert r['conclusion']=='RANKING_TRANSFER_FAILURE_NOT_CANDIDATE_MEMBERSHIP_CEILING'
          assert r['truth_aware_oracle_may_not_be_used_as_deployable_rank'] is True
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False and r['target_information_access'] is False
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v29_fixed_catalogue_oracle_diagnostic_v1/PROTOCOL.md orbittrace_v29_fixed_catalogue_oracle_diagnostic_v1/run_diagnostic.py input/v29/pretruth/V29_CANONICAL_PRETRUTH_CATALOGUE.json input/v29/final/V29_CANONICAL_SONOTACO_EXPOSED_RESULT.json > output/source_input_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/diagnostic_commit.txt
          python --version > output/python_version.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v29-fixed-catalogue-joint-oracle-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
