name: OrbitTrace bicore scale observer v1

# observer child v2: metadata query only
on:
  pull_request:
    branches: [agent/orbittrace-bipartite-bicore-recurrence-scale-v1]
    paths:
      - '.github/workflows/orbittrace_bicore_scale_observer_v1.yml'

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-22.04
    steps:
      - name: Query existing bicore push runs only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo OBSERVER_ONLY_NO_SCIENTIFIC_EXECUTION
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$REPO/actions/workflows/orbittrace_bipartite_bicore_recurrence_scale_v1.yml/runs?branch=agent%2Forbittrace-bipartite-bicore-recurrence-scale-v1&per_page=10" \
            --jq '.workflow_runs[] | "BICORE_RUN_ID=\(.id) STATUS=\(.status) CONCLUSION=\(.conclusion // "null") HEAD_SHA=\(.head_sha) EVENT=\(.event) CREATED=\(.created_at)"'
