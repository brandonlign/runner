name: OrbitTrace v6-LF all-event null fanout development

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-lf-fanout-v1
    paths:
      - orbittrace_v6_label_free_all_event_null_fanout/RUN.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-v6-lf-fanout-development
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  authorize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Require one-file execution child and exact marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BASE_REF" = 'agent/orbittrace-v6-lf-fanout-v1'
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          test "$files" = 'orbittrace_v6_label_free_all_event_null_fanout/RUN.md'
          content="$(gh api "repos/$GITHUB_REPOSITORY/contents/orbittrace_v6_label_free_all_event_null_fanout/RUN.md?ref=$HEAD_SHA" --jq .content | tr -d '\n' | base64 --decode)"
          test "$content" = 'EXECUTE_FROZEN_V6_LF_ALL_EVENT_NULL_FANOUT'
          echo PASS_V6_LF_FANOUT_AUTHORIZATION

  preexact:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        year: [2022, 2023]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: execution
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: execution/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r execution/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Reconstruct exact repaired v6 source
        run: |
          set -euo pipefail
          cd execution
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          cd ..
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.frozen.py' | sha256sum -c -
          PYTHONPATH=execution python - <<'PY'
          from pathlib import Path
          original=Path('/tmp/v6.frozen.py').read_text()
          before='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    components = primary_components + rescue_components
'''
          after='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    primary_components = component_records_track_v6(old, year, primary_capped, event_lookup, base, "v3")
    rescue_components = component_records_track_v6(old, year, rescue_capped, event_lookup, base, "fixed4_rescue")
    components = primary_components + rescue_components
'''
          assert original.count(before)==1
          patched=original.replace(before,after,1)
          assert patched.replace(after,before,1)==original
          Path('/tmp/v6.repaired.py').write_text(patched)
          import hashlib
          assert hashlib.sha256(patched.encode()).hexdigest()=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          PY
          echo '6bda25e9bba2b95812a46283083e3294c209c897e66e99ba71b52f6091137cf6  execution/orbittrace_v6_label_free_all_event_null/run_development.py' | sha256sum -c -
      - name: Capture label-free preexact inputs
        env:
          PYTHONPATH: execution:execution/orbittrace_wavelet_catalogue_v3:/tmp
        run: |
          set -euo pipefail
          mkdir -p preexact
          python -u execution/orbittrace_v6_label_free_all_event_null_fanout/capture_preexact_year.py \
            --year '${{ matrix.year }}' \
            --repaired-v6-source /tmp/v6.repaired.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts execution/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload execution/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload execution/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts execution/mondrian_clique_development/source_parts_v2 \
            --output preexact
      - uses: actions/upload-artifact@v4
        with:
          name: v6-lf-preexact-${{ matrix.year }}
          path: preexact
          if-no-files-found: error
          retention-days: 90

  exact:
    needs: preexact
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {year: 2022, shard: 0}
          - {year: 2022, shard: 1}
          - {year: 2022, shard: 2}
          - {year: 2022, shard: 3}
          - {year: 2022, shard: 4}
          - {year: 2022, shard: 5}
          - {year: 2023, shard: 0}
          - {year: 2023, shard: 1}
          - {year: 2023, shard: 2}
          - {year: 2023, shard: 3}
          - {year: 2023, shard: 4}
          - {year: 2023, shard: 5}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: execution
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: execution/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r execution/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - uses: actions/download-artifact@v4
        with:
          name: v6-lf-preexact-${{ matrix.year }}
          path: preexact
      - name: Reconstruct exact repaired v6 source
        run: |
          set -euo pipefail
          cd execution
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          cd ..
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          PYTHONPATH=execution python - <<'PY'
          from pathlib import Path
          original=Path('/tmp/v6.frozen.py').read_text()
          before='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    components = primary_components + rescue_components
'''
          after='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    primary_components = component_records_track_v6(old, year, primary_capped, event_lookup, base, "v3")
    rescue_components = component_records_track_v6(old, year, rescue_capped, event_lookup, base, "fixed4_rescue")
    components = primary_components + rescue_components
'''
          assert original.count(before)==1
          patched=original.replace(before,after,1); Path('/tmp/v6.repaired.py').write_text(patched)
          import hashlib; assert hashlib.sha256(patched.encode()).hexdigest()=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          PY
      - name: Execute balanced exact shard
        env:
          PYTHONPATH: execution:execution/orbittrace_wavelet_catalogue_v3:/tmp
        run: |
          set -euo pipefail
          mkdir -p exact
          python -u execution/orbittrace_v6_label_free_all_event_null_fanout/run_exact_center_shard.py \
            --year '${{ matrix.year }}' --shard-index '${{ matrix.shard }}' --shard-count 6 --workers 4 \
            --preexact-checkpoint preexact/v6_lf_preexact_${{ matrix.year }}.pkl \
            --repaired-v6-source /tmp/v6.repaired.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts execution/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload execution/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload execution/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts execution/mondrian_clique_development/source_parts_v2 \
            --output exact
      - uses: actions/upload-artifact@v4
        with:
          name: v6-lf-exact-${{ matrix.year }}-${{ matrix.shard }}
          path: exact
          if-no-files-found: error
          retention-days: 90

  replay:
    needs: exact
    strategy:
      fail-fast: false
      matrix:
        year: [2022, 2023]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: execution
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: execution/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r execution/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - uses: actions/download-artifact@v4
        with:
          name: v6-lf-preexact-${{ matrix.year }}
          path: preexact
      - uses: actions/download-artifact@v4
        with:
          pattern: v6-lf-exact-${{ matrix.year }}-*
          path: exact
          merge-multiple: true
      - name: Reconstruct exact repaired v6 source
        run: |
          set -euo pipefail
          cd execution && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && cd ..
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          PYTHONPATH=execution python - <<'PY'
          from pathlib import Path
          original=Path('/tmp/v6.frozen.py').read_text()
          before='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    components = primary_components + rescue_components
'''
          after='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    primary_components = component_records_track_v6(old, year, primary_capped, event_lookup, base, "v3")
    rescue_components = component_records_track_v6(old, year, rescue_capped, event_lookup, base, "fixed4_rescue")
    components = primary_components + rescue_components
'''
          patched=original.replace(before,after,1); Path('/tmp/v6.repaired.py').write_text(patched)
          import hashlib; assert hashlib.sha256(patched.encode()).hexdigest()=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          PY
      - name: Replay exact shards through frozen year scan
        env:
          PYTHONPATH: execution:execution/orbittrace_wavelet_catalogue_v3:/tmp
        run: |
          mkdir -p year
          python -u execution/orbittrace_v6_label_free_all_event_null_fanout/replay_exact_year.py \
            --year '${{ matrix.year }}' \
            --preexact-checkpoint preexact/v6_lf_preexact_${{ matrix.year }}.pkl \
            --exact-shards-dir exact \
            --repaired-v6-source /tmp/v6.repaired.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts execution/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload execution/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload execution/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts execution/mondrian_clique_development/source_parts_v2 \
            --output year
      - uses: actions/upload-artifact@v4
        with:
          name: v6-lf-year-${{ matrix.year }}
          path: year
          if-no-files-found: error
          retention-days: 90

  combine:
    needs: replay
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: execution
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: execution/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r execution/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - uses: actions/download-artifact@v4
        with:
          name: v6-lf-year-2022
          path: years
      - uses: actions/download-artifact@v4
        with:
          name: v6-lf-year-2023
          path: years
      - name: Reconstruct exact repaired v6 source
        run: |
          set -euo pipefail
          cd execution && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && cd ..
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          PYTHONPATH=execution python - <<'PY'
          from pathlib import Path
          original=Path('/tmp/v6.frozen.py').read_text()
          before='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    components = primary_components + rescue_components
'''
          after='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    primary_components = component_records_track_v6(old, year, primary_capped, event_lookup, base, "v3")
    rescue_components = component_records_track_v6(old, year, rescue_capped, event_lookup, base, "fixed4_rescue")
    components = primary_components + rescue_components
'''
          patched=original.replace(before,after,1); Path('/tmp/v6.repaired.py').write_text(patched)
          import hashlib; assert hashlib.sha256(patched.encode()).hexdigest()=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          PY
      - name: Freeze combined families then evaluate truth
        env:
          PYTHONPATH: execution:execution/orbittrace_wavelet_catalogue_v3:/tmp
        run: |
          set -euo pipefail
          mkdir -p output
          python -u execution/orbittrace_v6_label_free_all_event_null_fanout/combine_and_evaluate.py \
            --year-2022 years/v6_lf_year_2022.pkl \
            --year-2023 years/v6_lf_year_2023.pkl \
            --repaired-v6-source /tmp/v6.repaired.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts execution/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload execution/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload execution/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts execution/mondrian_clique_development/source_parts_v2 \
            --output output
          cat output/V6_LABEL_FREE_ALL_EVENT_NULL_DEVELOPMENT.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/v6_label_free_all_event_null_development.json').read_text())
          assert r['verdict'] in {'PASS_V6_LABEL_FREE_ALL_EVENT_NULL_DEVELOPMENT','FAIL_V6_LABEL_FREE_ALL_EVENT_NULL_NO_GO'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['calibration_reservoir']=='all geometrically valid target-excluded scan events; no shower-label selection'
          assert r['configuration']['parameter_search'] is False and r['configuration']['null_trimming'] is False
          assert r['configuration']['exact_fanout'] is True and r['configuration']['exact_shards_per_year']==6
          assert all(r['gates'].values()) if r['verdict'].startswith('PASS_') else not all(r['gates'].values())
          print('ORBITTRACE_V6_LF_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'evaluation':{k:v for k,v in r['evaluation'].items() if k!='per_label'},'gates':r['gates'],'scan_counts':r['scan_counts'],'calibration_counts':r['calibration_counts']},indent=2))
          print('ORBITTRACE_V6_LF_RESULT_END')
          PY
      - name: Record immutable environment
        if: always()
        run: |
          set +e
          mkdir -p output
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum execution/orbittrace_v6_label_free_all_event_null/*.py execution/orbittrace_v6_label_free_all_event_null_fanout/*.py execution/.github/workflows/orbittrace_v6_lf_fanout_execution.yml > output/source_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v6-lf-all-event-null-development
          path: output
          if-no-files-found: error
          retention-days: 90
