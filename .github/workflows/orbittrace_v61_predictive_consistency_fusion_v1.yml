name: OrbitTrace v61 predictive-consistency fusion exposed development v1

on:
  push:
    branches:
      - agent/orbittrace-v61-predictive-consistency-fusion-v1
    paths:
      - 'orbittrace_v61_predictive_consistency_fusion_v1/**'
      - '.github/workflows/orbittrace_v61_predictive_consistency_fusion_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v61-predictive-consistency-fusion-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact runtime and pin frozen scientific sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/prepare input/truth output/pretruth output/result
          test "$(git hash-object orbittrace_v61_predictive_consistency_fusion_v1/PROTOCOL.md)" = '19d1563ced60577fc1598dc5fb59af35f43690ae'
          test "$(git hash-object orbittrace_v61_predictive_consistency_fusion_v1/prepare_pretruth.py)" = '8afb8becc80e69071ece97c954b5ace5e4ae47aa'
          test "$(git hash-object orbittrace_v61_predictive_consistency_fusion_v1/evaluate.py)" = '4205f1e2e5329bde6b037fab270ebfdac495c516'
          test "$(git hash-object orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py)" = '917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v61_predictive_consistency_fusion_v1/prepare_pretruth.py orbittrace_v61_predictive_consistency_fusion_v1/evaluate.py orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify immutable #839 ranker source
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - name: Restore immutable v24/v31 pretruth family payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/v24.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/v24.zip' | sha256sum -c -
          unzip -q input/v24.zip -d input/payload
          test "$(sha256sum input/payload/sugar/family_memberships.json | cut -d' ' -f1)" = 'be5f559f27c1a18dcda28c20b6197278473cdb458ddfd29ec61bc468e33c352a'
          test "$(sha256sum input/payload/hdbscan/family_memberships.json | cut -d' ' -f1)" = '99640747e935df2f4a7c7983bdde843ea59e1814388b8418e040dc04628aee13'
          test "$(sha256sum input/payload/sugar/V22_PRETRUTH_FEATURE_MANIFEST.json | cut -d' ' -f1)" = '5946c946e22b0d9807802cee6c69d202c515a291716545d97bfca5533f9c5aad'
          test "$(sha256sum input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json | cut -d' ' -f1)" = 'dbb9acc3adbfb15b42f633e36e400bf7e0082765077cbf0f51a0ddcb81af1ea0'
          python - <<'PY'
          import json
          for route,count in [('sugar',267),('hdbscan',229)]:
              m=json.load(open(f'input/payload/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              f=json.load(open(f'input/payload/{route}/family_memberships.json'))
              assert m['truth_accessed'] is False and f['truth_accessed'] is False
              assert len(m['family_ids'])==len(f['families'])==count
          print('PASS_V61_IMMUTABLE_V31_PRETRUTH_PAYLOAD')
          PY
      - name: Restore frozen label-free SonotaCo rows before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9050107352/zip' -o input/prepare.zip
          echo '1296d757b5ea1dd94f9c9077fd769fdc8f00ec06d0881d8548fd1df4608344cc  input/prepare.zip' | sha256sum -c -
          unzip -q input/prepare.zip -d input/prepare
          python - <<'PY'
          import json
          m=json.load(open('input/prepare/label_free_preparation_manifest.json'))
          assert m['verdict']=='PASS_FINAL_SONOTACO_LABEL_FREE_PREPARATION'
          assert m['shower_truth_accessed'] is False and m['target_information_access'] is False and m['maarsy_scientific_access'] is False
          print('PASS_V61_LABEL_FREE_ROWS_ONLY')
          PY
      - name: Build Sugar predictive-consistency order before truth
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -u orbittrace_v61_predictive_consistency_fusion_v1/prepare_pretruth.py \
            --route sugar \
            --rows-2013 input/prepare/sugar_2013.json --rows-2014 input/prepare/sugar_2014.json \
            --membership-json input/payload/sugar/family_memberships.json \
            --manifest-json input/payload/sugar/V22_PRETRUTH_FEATURE_MANIFEST.json \
            --output output/pretruth
      - name: Build HDBSCAN predictive-consistency order before truth
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -u orbittrace_v61_predictive_consistency_fusion_v1/prepare_pretruth.py \
            --route hdbscan \
            --rows-2013 input/prepare/hdbscan_2013.json --rows-2014 input/prepare/hdbscan_2014.json \
            --membership-json input/payload/hdbscan/family_memberships.json \
            --manifest-json input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json \
            --output output/pretruth
      - name: Freeze predictive orders before truth
        run: |
          set -euo pipefail
          sha256sum output/pretruth/V61_SUGAR_PREDICTIVE_PRETRUTH.json output/pretruth/V61_HDBSCAN_PREDICTIVE_PRETRUTH.json > output/V61_PRETRUTH_SHA256.txt
          cp output/V61_PRETRUTH_SHA256.txt input/V61_PRETRUTH_SHA256.lock
          python - <<'PY'
          import json
          for route,count in [('SUGAR',267),('HDBSCAN',229)]:
              r=json.load(open(f'output/pretruth/V61_{route}_PREDICTIVE_PRETRUTH.json'))
              assert r['truth_accessed'] is False and r['candidate_count']==count
              assert r['parameter_search'] is False and r['membership_changed'] is False
              assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
              assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
              assert r['blind_exclusion']==[20.0,55.0]
          print(open('output/V61_PRETRUTH_SHA256.txt').read())
          print('PASS_V61_PREDICTIVE_ORDERS_FROZEN_PRETRUTH')
          PY
      - name: Restore immutable exposed SonotaCo truth only after predictive freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
          sha256sum -c input/V61_PRETRUTH_SHA256.lock
      - name: Run sole frozen v61 exposed-development outcome
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          sha256sum -c input/V61_PRETRUTH_SHA256.lock
          python -u orbittrace_v61_predictive_consistency_fusion_v1/evaluate.py \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --predictive-sugar-json output/pretruth/V61_SUGAR_PREDICTIVE_PRETRUTH.json \
            --predictive-hdbscan-json output/pretruth/V61_HDBSCAN_PREDICTIVE_PRETRUTH.json \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --output output/result
      - name: Enforce v61 scientific and protected-data boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/result/V61_PREDICTIVE_CONSISTENCY_FUSION_RESULT.json'))
          assert r['panel_wins'] in {0,1,2,3,4} and len(r['panels'])==4 and len(r['v31_historical_control'])==4
          assert r['candidate_membership_changed'] is False and r['pretruth_71d_features_changed'] is False
          assert r['predictive_order_truth_accessed'] is False and r['predictive_parameter_search'] is False
          assert r['fusion_weight_search'] is False and r['rank_product_search'] is False and r['post_fusion_diversity'] is False
          assert r['budget_specific_rule'] is False and r['source_quota_selected'] is False and r['post_result_rescue_authorized'] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_V61_RESULT_FIREWALL')
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v61_predictive_consistency_fusion_v1/PROTOCOL.md orbittrace_v61_predictive_consistency_fusion_v1/prepare_pretruth.py orbittrace_v61_predictive_consistency_fusion_v1/evaluate.py orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py input/ranker/run_urc_union_ranker.py > output/V61_SOURCE_INPUT_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v61-predictive-consistency-fusion-development-v1
          path: output
          if-no-files-found: error
          retention-days: 90
