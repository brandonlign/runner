name: LUNARSHIFT Gambart C AFTER exact-source camera gate
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/isef4-isis10-after-camera.yml"
      - "scripts/isef4_isis_camera_triage.py"
      - "scripts/test_isef4_camera_download.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isef4-isis10-after-camera
  cancel-in-progress: true
jobs:
  after-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and exact-range transfer integrity offline
        run: |
          python -m py_compile scripts/isef4_isis_camera_triage.py scripts/test_isef4_camera_download.py
          python scripts/test_isef4_camera_download.py
      - name: Install ISIS 10 and USGS line-scanner CSM
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lunar-isis10
          create-args: >-
            -c usgs-astrogeology
            -c conda-forge
            python=3.13
            isis=10.0.0
            usgscsm
          init-shell: bash
          post-cleanup: all
      - name: Geolocate published Gambart C AFTER EDR; never touch holdout targets
        shell: bash -el {0}
        run: |
          set -euo pipefail
          export ISISROOT="$CONDA_PREFIX"
          export ISISDATA="$GITHUB_WORKSPACE/isisdata"
          mkdir -p "$ISISDATA/base/kernels/lsk"
          curl --fail --location --retry 3 --silent --show-error \
            "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls" \
            --output "$ISISDATA/base/kernels/lsk/naif0012.tls"
          grep -q 'KPL/LSK' "$ISISDATA/base/kernels/lsk/naif0012.tls"
          python -m pip install --quiet 'setuptools<81'
          export ISEF4_PRODUCT_ROLE=after
          export ISEF4_DIAGNOSTIC_SUFFIX=isis10_after
          python scripts/isef4_isis_camera_triage.py
      - name: Preserve explicit success or failure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f=diagnostics/isef4_gambart_camera_status_isis10_after.json
          if [[ -f "$f" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$f"
            if ! git diff --cached --quiet; then
              git commit -m "Record exact AFTER Gambart C camera location and geometry"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Keep camera logs but do not publish EDR image pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gambart-after-isis10-camera-geometry
          path: |
            output/triage_isis10_after/*.log
            diagnostics/isef4_gambart_camera_status_isis10_after.json
          retention-days: 30
          if-no-files-found: warn
