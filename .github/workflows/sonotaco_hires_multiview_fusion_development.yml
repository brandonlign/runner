name: SonotaCo high-resolution multiview fusion development

on:
  pull_request:
    branches:
      - agent/sonotaco-multiview-fusion-development
    paths:
      - .github/workflows/sonotaco_hires_multiview_fusion_development.yml
      - sonotaco_hires_multiview_fusion/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sonotaco-hires-multiview-fusion-development
  cancel-in-progress: true

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sonotaco-hires-multiview-fusion-development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - name: Decode and verify frozen high-resolution candidate
        run: |
          set -euo pipefail
          mkdir -p input output
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          parts = sorted(Path('sonotaco_hires_multiview_fusion/source_parts').glob('part*.b64'))
          expected_parts = [f'part{i:02d}.b64' for i in range(8)]
          if [part.name for part in parts] != expected_parts:
              raise RuntimeError(f'unexpected source parts: {[part.name for part in parts]}')
          encoded = ''.join(''.join(part.read_text().split()) for part in parts)
          if len(encoded) != 6364:
              raise RuntimeError(f'encoded length mismatch: {len(encoded)}')
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = '7ab556184e0965ce066d24a75f2067b9256465d1899c805afa0061f717d34382'
          if digest != expected:
              raise RuntimeError(f'candidate source mismatch: {digest}')
          Path('/tmp/run_sonotaco_hires_multiview_fusion.py').write_bytes(source)
          print('candidate bytes:', len(source))
          print('candidate SHA-256:', digest)
          PY
          python -m py_compile /tmp/run_sonotaco_hires_multiview_fusion.py
      - name: Retrieve exact GMN-MDC mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -
      - name: Download exact SonotaCo 2025 development archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output input/025a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/025a.zip
          echo 'f4eb716a4b900658fcc658a633d918eca28946f59da75935f1fd5f6bc539bf52  input/025a.zip' | sha256sum -c -
      - name: Run frozen high-resolution split-conformal fusion
        run: |
          set -euo pipefail
          python /tmp/run_sonotaco_hires_multiview_fusion.py \
            --archive input/025a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --adapter-parts sonotaco_mondrian_development/source_parts \
            --phase-source-parts sonotaco_phase_gated_3d/source_parts \
            --workers 4 \
            --output output
          cat output/SONOTACO_HIRES_MULTIVIEW_FUSION_DEVELOPMENT.md
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            sonotaco_hires_multiview_fusion/PROTOCOL.md \
            sonotaco_hires_multiview_fusion/source_parts/part00.b64 \
            sonotaco_hires_multiview_fusion/source_parts/part01.b64 \
            sonotaco_hires_multiview_fusion/source_parts/part02.b64 \
            sonotaco_hires_multiview_fusion/source_parts/part03.b64 \
            sonotaco_hires_multiview_fusion/source_parts/part04.b64 \
            sonotaco_hires_multiview_fusion/source_parts/part05.b64 \
            sonotaco_hires_multiview_fusion/source_parts/part06.b64 \
            sonotaco_hires_multiview_fusion/source_parts/part07.b64 \
            sonotaco_phase_gated_3d/source_parts/part00.b64 \
            sonotaco_mondrian_development/source_parts/part00.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            input/025a.zip input/audit.json \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload frozen high-resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonotaco-hires-multiview-fusion-development
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Enforce frozen continuation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/sonotaco_hires_multiview_fusion_development.json').read_text())
          print(json.dumps({
              'candidate': result['candidate'],
              'original': result['original'],
              'phase3_component': result['phase3_component'],
              'fixed_comparator_weak_auc': result['fixed_comparator_weak_auc'],
              'gates': result['gates'],
              'verdict': result['verdict'],
          }, indent=2))
          if not all(result['gates'].values()):
              raise SystemExit('Frozen high-resolution fusion development gate failed')
          PY
