name: OrbitTrace P2 candidate-universe compliance audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py
      - .github/workflows/orbittrace_crossyear_two_view_p2_compliance_patch_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-crossyear-two-view-membership-p2-freeze
      - name: Apply exact reversible compliance patch and audit semantics
        run: |
          set -euo pipefail
          test "$(sha256sum orbittrace_crossyear_two_view_membership_p2/run_development.py | cut -d' ' -f1)" = '7637b6fb310ee3f24f1de8479a34d10c594dc55471eee55b8854e1c28787e8dd'
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py \
            orbittrace_crossyear_two_view_membership_p2/run_development.py \
            /tmp/run_p2_protocol_compliant.py | tee /tmp/patch.log
          python -m py_compile /tmp/run_p2_protocol_compliant.py
          python - <<'PY'
          import ast, hashlib
          from pathlib import Path
          text=Path('/tmp/run_p2_protocol_compliant.py').read_text()
          tree=ast.parse(text)
          digest=hashlib.sha256(text.encode()).hexdigest()
          main=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='main')
          src=ast.get_source_segment(text,main)
          assert 'valid_events_by_year' not in src
          assert 'valid_nonseed_by_year' not in src
          assert 'nonseed_by_year = {' in src
          assert '[e for e in scan_by_year[year] if str(e["id"]) not in global_seed_ids]' in src
          assert 'target_nonseed_events = nonseed_by_year[target_year]' in src
          assert 'missing_orbit_ids = [str(event["id"]) for event in negative_events if str(event["id"]) not in orbit_by_id]' in src
          assert 'P2 input-ineligible: required target-window nonseed lacks valid orbit' in src
          assert src.index('negative_events = [event for event, keep') < src.index('missing_orbit_ids =')
          assert src.index('missing_orbit_ids =') < src.index('negative_obs = mahalanobis_distance')
          # Scientific constants and model are untouched by this implementation-only patch.
          for token in (
              'WINDOW_HALF_WIDTH_DEG = 5.0',
              'MIN_DIRECTION_NEGATIVES = 128',
              'LOGISTIC_C = 1.0',
              'RESPONSIBILITY_THRESHOLD = 0.5',
              'MACRO_F1_GAIN_GATE = 0.08',
              'LARGE_PRECISION_FLOOR = 0.85',
          ):
              assert token in text, token
          assert text.count('dsh.pairwise_dsh(')==1
          assert 'solver="lbfgs"' in src and 'class_weight=None' in src
          print('PASS_P2_REQUIRED_NONSEED_UNIVERSE_COMPLIANCE')
          print('P2_PROTOCOL_COMPLIANT_SOURCE_SHA256='+digest)
          PY
      - name: Assert source-only firewall
        if: always()
        run: |
          test ! -e input
          test ! -e output
          echo NO_CATALOGUE_NO_LABEL_VALUES_NO_TARGET_REGION_NO_ORBITTRACE_TARGET
