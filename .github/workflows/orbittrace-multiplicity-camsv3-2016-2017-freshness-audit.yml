name: OrbitTrace multiplicity CAMSv3 2016-2017 repo freshness audit

on:
  pull_request:
    branches:
      - agent/orbittrace-multiplicity-camsv3-2016-2017-freshness-audit
    paths:
      - 'orbittrace_multiplicity_camsv3_2016_2017_freshness_audit/RUN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out full repository history only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all remote branch refs
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Audit CAMSv3 2016-2017 scientific freshness without data access
        run: |
          set -euo pipefail
          test ! -e input
          python orbittrace_multiplicity_camsv3_2016_2017_freshness_audit/audit_history.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/camsv3_2016_2017_repo_freshness_audit.json').read_text())
          assert r['verdict']=='PASS_CAMSV3_2016_2017_REPO_SCIENTIFIC_FRESHNESS_AUDIT'
          assert r['catalogue_access_this_audit'] is False
          assert r['scientific_value_access_this_audit'] is False
          assert r['label_access_this_audit'] is False
          assert r['target_information_access'] is False
          assert not r['years']['2016']['suspicious_hits']
          assert not r['years']['2017']['suspicious_hits']
          assert r['positive_control_2015_actual_development_hit'] is True
          PY
      - name: Record provenance
        run: |
          set -euo pipefail
          git rev-parse HEAD > output/audit_commit.txt
          sha256sum orbittrace_multiplicity_camsv3_2016_2017_freshness_audit/audit_history.py > output/audit_source_sha256.txt
      - name: Upload freshness audit
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-multiplicity-camsv3-2016-2017-freshness-audit
          path: output
          if-no-files-found: error
          retention-days: 90
