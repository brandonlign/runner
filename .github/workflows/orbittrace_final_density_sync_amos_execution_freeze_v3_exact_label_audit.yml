name: OrbitTrace final density-sync AMOS exact-label execution freeze audit v3

on:
  push:
    branches:
      - agent/orbittrace-final-density-sync-amos-2023-2024-predata-v1
    paths:
      - 'orbittrace_final_density_sync_amos_2023_2024_external_v1/EXECUTION_FREEZE_V3_EXACT_LABEL_AUDIT_ACTIVATE.md'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  freeze-v3-integrity:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-final-density-sync-amos-2023-2024-predata-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact authoritative source and freeze identities
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/EXECUTION_FREEZE_V3_EXACT_LABEL.json)" = 'beed71cac547973b198b6ed16e319ebe42051583'
          test "$(sha256sum orbittrace_final_density_sync_amos_2023_2024_external_v1/EXECUTION_FREEZE_V3_EXACT_LABEL.json | cut -d' ' -f1)" = 'cfa94e7bfad096693f1370142a7f28a65a0ee5e311806a3f634203a45ae111d3'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/EXECUTION_FREEZE.json)" = '84e85d69b2fcbf1dcdeeeaf0568c026c50548bd7'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/EXECUTION_FREEZE_HARDENED.json)" = '804d37a0cc86b1cfd848ee9ea68192bc3a3b4ef7'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/PROTOCOL.md)" = '1ddb4bae33a1ae8a6224cbc4abcba5dda70cf993'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/EVALUATOR_HARDENING_FREEZE.md)" = '62a6474933cecc1871449d89d59055b18ad3e802'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/EVALUATOR_HARDENING_V3_FREEZE.md)" = '78d8ab5d657b1348f449e7af73a944c3f9acc9b1'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/DATA_REQUEST_READY_FINAL_NOT_SENT.md)" = '4f17e3e5a22b791fd3b4a33d338c5964dbc1a29a'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/generate_pretruth.py)" = 'b76d7c53ab238cd45f12027947f2098a770ba7b6'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/evaluate_labels.py)" = 'c45e4739ea68639945b13de54f6e24dc9d870ba3'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/audit_source_zero_data_v3_ast.py)" = '734cc257347d6f68ce0d67f5adf874ae89e6d6d7'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/audit_evaluator_hardening_v3.py)" = '31daaf1101bd100968829a3797b39dc856ae2a7c'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/audit_label_transport_exactness_v3.py)" = 'b16778cd10cbbb7704a4ee007a14030b97e07500'
          test "$(git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/full_pipeline_selftest.py)" = '2f9dc0495d80e1fa0c577fcbb4fec2b4dd33aecf'
          test "$(git hash-object .github/workflows/orbittrace_final_density_sync_amos_predata_audit_v3.yml)" = '0fe45c38e3f15c94c688326a969c7cb3a4975f55'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/run_development.py)" = '157813ca331165180a6d20aa71bfc78d5984396f'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-density-sync-amos-predata-hardened-audit-v3
          path: input/clean-v3
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31866127514

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-density-sync-amos-comparator-isolation-audit-v1
          path: input/comparator
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31865012724

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-density-sync-amos-transport-reuse-audit-v1
          path: input/transport
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31865140271

      - name: Rehydrate and verify authoritative exact-label freeze
        run: |
          set -euo pipefail
          mkdir -p output/freeze-v3-audit
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          freeze_path=Path('orbittrace_final_density_sync_amos_2023_2024_external_v1/EXECUTION_FREEZE_V3_EXACT_LABEL.json')
          f=json.loads(freeze_path.read_text())
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def req(ok,msg):
              if not ok: raise RuntimeError(msg)

          req(f['schema']=='FINAL_DENSITY_SYNC_AMOS_EXECUTION_FREEZE_V3_EXACT_LABEL','schema')
          req(f['status']=='FROZEN_ZERO_DATA_READY_NOT_SENT','status')
          req(f['scientific_role']=='PRISTINE_FINAL_EXTERNAL_AMOS_2023_2024_TEST_ONLY','scientific role')
          req(f['selected_final_method']=='density_synchronous_recurrent_eom_hdbscan_v1_pr1263','final method')
          req(f['years']==[2023,2024] and f['blind_exclusion']==[20.0,55.0],'years/blind')
          req(f['method_selection_closure_pr']==1267 and f['final_predata_pr']==1268,'governance PRs')
          req(f['supersession']['supersedes_for_future_execution']==['EXECUTION_FREEZE.json','EXECUTION_FREEZE_HARDENED.json'],'freeze supersession')
          req(f['supersession']['preserve_old_freezes_as_provenance'] is True,'old freeze preservation')
          req(f['supersession']['stale_hardened_freeze_git_blob']=='804d37a0cc86b1cfd848ee9ea68192bc3a3b4ef7','stale freeze identity')

          req(f['binding_clean_v3_zero_data_audit']['workflow_run']==31866127514,'clean v3 run')
          req(f['binding_clean_v3_zero_data_audit']['execution_head']=='98ac9b430e511f2b05951470984bc485ee2cfb04','clean v3 execution head')
          req(f['binding_clean_v3_zero_data_audit']['artifact']==9242054017,'clean v3 artifact')
          req(f['binding_clean_v3_zero_data_audit']['artifact_digest']=='sha256:e05d8948f1aada319ce251dc649fad9aca7e13df1c6ef084df12fda898e6b742','clean v3 artifact digest')
          req(f['binding_clean_v3_zero_data_audit']['scientific_outcome'] is False,'clean v3 not science')

          paths={
            'source':'input/clean-v3/source-audit-v3/FINAL_DENSITY_SYNC_AMOS_PREDATA_SOURCE_AUDIT_V3.json',
            'pipeline':'input/clean-v3/pipeline-audit-v3/FINAL_DENSITY_SYNC_AMOS_FULL_PIPELINE_SYNTHETIC_AUDIT.json',
            'hardening':'input/clean-v3/hardening-audit-v3/FINAL_DENSITY_SYNC_AMOS_EVALUATOR_HARDENING_AUDIT_V3.json',
            'label':'input/clean-v3/label-audit-v3/FINAL_DENSITY_SYNC_AMOS_LABEL_TRANSPORT_EXACTNESS_AUDIT_V3.json',
            'comparator':'input/comparator/comparator-isolation/FINAL_DENSITY_SYNC_AMOS_COMPARATOR_ISOLATION_AUDIT.json',
            'transport':'input/transport/transport-reuse/FINAL_DENSITY_SYNC_AMOS_TRANSPORT_REUSE_AUDIT.json',
          }
          expected={
            'source':f['binding_clean_v3_zero_data_audit']['source_audit_result_sha256'],
            'pipeline':f['binding_clean_v3_zero_data_audit']['pipeline_audit_result_sha256'],
            'hardening':f['binding_clean_v3_zero_data_audit']['evaluator_hardening_result_sha256'],
            'label':f['binding_clean_v3_zero_data_audit']['label_transport_result_sha256'],
            'comparator':f['binding_comparator_isolation_audit']['result_sha256'],
            'transport':f['binding_transport_reuse_audit']['result_sha256'],
          }
          for k,p in paths.items(): req(sha(p)==expected[k],f'{k} result SHA mismatch')

          s=json.load(open(paths['source']))
          p=json.load(open(paths['pipeline']))
          h=json.load(open(paths['hardening']))
          l=json.load(open(paths['label']))
          c=json.load(open(paths['comparator']))
          t=json.load(open(paths['transport']))

          req(s['verdict']=='PASS_FINAL_DENSITY_SYNC_AMOS_PREDATA_SOURCE_AUDIT_V3','source verdict')
          req(p['verdict']=='PASS_FINAL_DENSITY_SYNC_AMOS_FULL_PIPELINE_SYNTHETIC_AUDIT_V1','pipeline verdict')
          req(h['verdict']=='PASS_FINAL_DENSITY_SYNC_AMOS_EVALUATOR_HARDENING_AUDIT_V3','hardening verdict')
          req(l['verdict']=='PASS_FINAL_DENSITY_SYNC_AMOS_LABEL_TRANSPORT_EXACTNESS_AUDIT_V3','label verdict')
          req(c['verdict']=='PASS_FINAL_DENSITY_SYNC_AMOS_COMPARATOR_ISOLATION_AUDIT_V1','comparator verdict')
          req(t['verdict']=='PASS_FINAL_DENSITY_SYNC_AMOS_TRANSPORT_REUSE_AUDIT_V1','transport verdict')

          req(s['forbidden_detection']=='AST_EXACT_IMPORTS_AND_CALL_TARGETS','AST source audit')
          req(s['pretruth_validation_before_label_open'] is True,'pretruth validation order')
          req(s['empty_candidate_lists_structurally_allowed'] is True,'empty catalogue structural allowance')
          req(h['pretruth_tamper_test_count']==12 and h['all_pretruth_tampers_rejected_before_labels'] is True,'tamper suite')
          req(h['assertion_count']==15 and all(h['assertions'].values()),'hardening assertions')
          req(h['empty_catalogue_result_sha256']==f['binding_clean_v3_zero_data_audit']['empty_catalogue_result_sha256'],'empty result identity')
          req(l['exact_sporadic_accepted'] is True,'exact SPORADIC')
          req(l['exact_nonbackground_shower_code_preserved'] is True,'exact nonbackground label preservation')
          req(l['exact_nonbackground_shower_code']=='MiXeD-Code_42','exact label fixture')
          req(l['ambiguous_aliases_all_rejected'] is True,'ambiguous alias rejection')
          req(l['surrounding_whitespace_rejected_not_normalized'] is True,'whitespace rejection')
          req(l['valid_code_result_sha256']==f['binding_clean_v3_zero_data_audit']['exact_label_code_result_sha256'],'exact-label result identity')
          req(all(p['tests'].values()),'synthetic full pipeline')
          req(p['pretruth_sha256']==f['binding_clean_v3_zero_data_audit']['synthetic_pretruth_sha256'],'synthetic pretruth identity')
          req(p['result_sha256']==f['binding_clean_v3_zero_data_audit']['synthetic_result_sha256'],'synthetic result identity')

          req(t['boundary_20_excluded'] is True and t['boundary_55_excluded'] is True,'protected boundary exclusion')
          req(t['geo6_exact_array_identity'] is True and t['protected_geometry_fail_closed'] is True,'transport mapping')
          req(c['primary_generator_accepts_comparator_supplement'] is False,'primary comparator input isolation')
          req(c['comparator_only_fields_enter_primary_generator'] is False,'comparator field isolation')

          req(f['pretruth_contract']['empty_selected_catalogue_is_valid_endpoint'] is True,'freeze empty endpoint')
          req(f['pretruth_contract']['pretruth_integrity_verified_before_labels'] is True,'freeze pretruth integrity')
          req(f['label_contract']['background_sentinel']=='SPORADIC','freeze sentinel')
          req(f['label_contract']['background_sentinel_exact_case_required'] is True,'freeze sentinel case')
          req(f['label_contract']['ambiguous_no_association_aliases_fail_closed'] is True,'freeze aliases')
          req(f['label_contract']['surrounding_whitespace_fails_closed'] is True,'freeze whitespace')
          req(f['label_contract']['valid_nonbackground_labels_preserved_exactly'] is True,'freeze exact labels')

          for obj in (s,p,h,l,c,t):
              for k in ('scientific_data_accessed','gmn_accessed','sonotaco_accessed','amos_accessed','asfn_accessed','efn_accessed','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
                  if k in obj: req(obj[k] is False,f'{k} in {obj.get("schema")}')

          for k in ('provider_request_sent','amos_transfer_received','amos_event_rows_accessed','amos_geometry_accessed','amos_shower_associations_accessed','amos_scientific_execution_started','scientific_data_accessed','sonotaco_access','asfn_access','efn_access','target_information_access','target_region_events_accessed','orbittrace_target_access','maarsy_scientific_access','dms_scientific_access','replacement_external_panel_authorized','post_result_rescue_authorized'):
              req(f[k] is False,'freeze false declaration '+k)
          req(f['provider_request_status']=='READY_NOT_SENT','provider status')

          # Verify the artifact itself says it ran on the exact clean-retry head.
          execution_commit=Path('input/clean-v3/provenance-v3/execution_commit.txt').read_text().strip()
          req(execution_commit==f['binding_clean_v3_zero_data_audit']['execution_head'],'artifact execution head')

          out={
            'schema':'FINAL_DENSITY_SYNC_AMOS_EXECUTION_FREEZE_V3_EXACT_LABEL_AUDIT',
            'verdict':'PASS_FINAL_DENSITY_SYNC_AMOS_EXECUTION_FREEZE_V3_EXACT_LABEL_AUDIT',
            'execution_freeze_git_blob':'beed71cac547973b198b6ed16e319ebe42051583',
            'execution_freeze_sha256':sha(freeze_path),
            'clean_v3_artifact_rehydrated':True,
            'comparator_artifact_rehydrated':True,
            'transport_artifact_rehydrated':True,
            'all_binding_result_hashes_verified':True,
            'exact_label_transport_verified':True,
            'stale_hardened_freeze_superseded':True,
            'selected_final_method_locked':True,
            'provider_request_sent':False,
            'amos_scientific_data_accessed':False,
            'scientific_outcome':False,
            'target_information_access':False,
            'target_region_events_accessed':False,
            'maarsy_scientific_access':False,
            'dms_scientific_access':False,
          }
          Path('output/freeze-v3-audit/FINAL_DENSITY_SYNC_AMOS_EXECUTION_FREEZE_V3_EXACT_LABEL_AUDIT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Preserve exact-label freeze audit provenance
        if: always()
        run: |
          set +e
          mkdir -p output/provenance
          git rev-parse HEAD > output/provenance/execution_commit.txt
          git hash-object orbittrace_final_density_sync_amos_2023_2024_external_v1/EXECUTION_FREEZE_V3_EXACT_LABEL.json > output/provenance/execution_freeze_git_blob.txt
          sha256sum orbittrace_final_density_sync_amos_2023_2024_external_v1/EXECUTION_FREEZE_V3_EXACT_LABEL.json > output/provenance/execution_freeze_sha256.txt
          sha256sum \
            input/clean-v3/source-audit-v3/FINAL_DENSITY_SYNC_AMOS_PREDATA_SOURCE_AUDIT_V3.json \
            input/clean-v3/pipeline-audit-v3/FINAL_DENSITY_SYNC_AMOS_FULL_PIPELINE_SYNTHETIC_AUDIT.json \
            input/clean-v3/hardening-audit-v3/FINAL_DENSITY_SYNC_AMOS_EVALUATOR_HARDENING_AUDIT_V3.json \
            input/clean-v3/label-audit-v3/FINAL_DENSITY_SYNC_AMOS_LABEL_TRANSPORT_EXACTNESS_AUDIT_V3.json \
            input/comparator/comparator-isolation/FINAL_DENSITY_SYNC_AMOS_COMPARATOR_ISOLATION_AUDIT.json \
            input/transport/transport-reuse/FINAL_DENSITY_SYNC_AMOS_TRANSPORT_REUSE_AUDIT.json \
            > output/provenance/rehydrated_result_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-final-density-sync-amos-execution-freeze-v3-exact-label-audit
          path: output
          if-no-files-found: error
          retention-days: 90
