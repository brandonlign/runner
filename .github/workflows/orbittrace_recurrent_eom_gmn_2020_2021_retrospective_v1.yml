name: OrbitTrace recurrent-EOM GMN 2020-2021 retrospective transfer v1

on:
  push:
    branches:
      - agent/orbittrace-recurrent-eom-gmn-2020-2021-retrospective-v1
    paths:
      - '.github/workflows/orbittrace_recurrent_eom_gmn_2020_2021_retrospective_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  retrospective-transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and reconstruct frozen transfer runner
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/v8 input/ranker output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_recurrent_eom_gmn_2020_2021_retrospective_v1/PROTOCOL.md)" = '9b61a065678c070c141df74fa48277892841fffa'
          test "$(git hash-object orbittrace_recurrent_eom_gmn_2020_2021_retrospective_v1/make_transfer.py)" = '5c40725851372cb096a15b45985a9dbaf2321b3d'
          python orbittrace_recurrent_eom_gmn_2020_2021_retrospective_v1/make_transfer.py \
            --source orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --output /tmp/run_recurrent_eom_2020_2021.py
          test "$(git hash-object /tmp/run_recurrent_eom_2020_2021.py)" = '0a34d0cc5cf1d374158201d0c559a870cfb488de'
          test "$(sha256sum /tmp/run_recurrent_eom_2020_2021.py | cut -d' ' -f1)" = '92a19b4b7881519bd9b883e1a84d31ee3c5e81c6fd5640824db315ec24e2942a'
          python -m py_compile orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py /tmp/run_recurrent_eom_2020_2021.py
          echo 'AUTHORIZED_SOURCE_AUDIT_RUN=31830042638'
          echo 'AUTHORIZED_SOURCE_AUDIT_ARTIFACT=9230300205'
          echo 'AUTHORIZED_SOURCE_AUDIT_DIGEST=sha256:7fc9a2bb9dc42f517b2d5049c0fa137861ec73fac58d33dbc4b90f537ab59db5'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify frozen GMN runtime utility
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify frozen runtime-support artifact
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Run sole frozen GMN 2020-2021 archival transfer outcome
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u /tmp/run_recurrent_eom_2020_2021.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce retrospective role and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json'))
          p=json.load(open('output/RECURRENT_EOM_HDBSCAN_V1_PRELABEL.json'))
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2020_2021_RETROSPECTIVE_TRANSFER_ONLY'
          assert sorted(map(int,r['events_by_year']))==[2020,2021]
          assert r['post_result_parameter_search'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          assert p['blind_exclusion']==[20.0,55.0]
          for x in (r,p):
              assert x['target_information_access'] is False
              assert x['target_region_events_accessed'] is False
              assert x['sonotaco_2013_2014_access'] is False
              assert x['maarsy_scientific_access'] is False
              assert x['dms_scientific_access'] is False
          assert r['verdict'] in {
            'PASS_RECURRENT_EOM_HDBSCAN_V1_GMN_2020_2021_RETROSPECTIVE_TRANSFER',
            'FAIL_RECURRENT_EOM_HDBSCAN_V1_GMN_2020_2021_RETROSPECTIVE_TRANSFER',
          }
          print(r['verdict'])
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          cp /tmp/run_recurrent_eom_2020_2021.py output/FROZEN_TRANSFER_RUNNER.py 2>/dev/null || true
          sha256sum \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_recurrent_eom_gmn_2020_2021_retrospective_v1/PROTOCOL.md \
            orbittrace_recurrent_eom_gmn_2020_2021_retrospective_v1/make_transfer.py \
            output/FROZEN_TRANSFER_RUNNER.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            output/RECURRENT_EOM_HDBSCAN_V1_PRELABEL.json \
            output/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json \
            > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-gmn-2020-2021-retrospective-v1
          path: output
          if-no-files-found: error
          retention-days: 90
