name: OrbitTrace GMN local-background contrast diagnostic v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-local-background-contrast-diagnostic-v1
    paths:
      - 'orbittrace_gmn_local_background_contrast_diagnostic_v1/**'
      - '.github/workflows/orbittrace_gmn_local_background_contrast_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact runtime and verify frozen diagnostic source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/v8 input/p19 input/ranker output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(git hash-object orbittrace_gmn_local_background_contrast_diagnostic_v1/PROTOCOL.md)" = '8ce782ff1217a0ccaafe5cb0da42b31a12cb2161'
          test "$(git hash-object orbittrace_gmn_local_background_contrast_diagnostic_v1/run_development.py)" = '57b817e9013c6f3de0f48b91950ba42615716b7d'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify exact active GMN ranking support source
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          PYTHONPATH=input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8 python -m py_compile \
            input/ranker/run_urc_union_ranker.py \
            orbittrace_gmn_local_background_contrast_diagnostic_v1/run_development.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - name: Verify immutable target-excluded GMN inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
      - name: Run binding local-background contrast mechanism diagnostic
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_local_background_contrast_diagnostic_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --output output
      - name: Enforce diagnostic and protected-data boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/GMN_LOCAL_BACKGROUND_CONTRAST_DIAGNOSTIC_V1.json'))
          p=json.load(open('output/GMN_LOCAL_BACKGROUND_CONTRAST_PRELABEL.json'))
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_MECHANISM_DIAGNOSTIC_ONLY'
          assert r['candidate_count']==226 and r['blind_exclusion']==[20.0,55.0]
          assert r['local_window_width_deg']==4.0 and p['local_window_width_deg']==4.0
          assert r['parameter_search'] is False and r['background_window_search'] is False
          assert r['threshold_search'] is False and r['weight_search'] is False
          assert r['family_deletion'] is False and r['membership_changed'] is False
          assert r['candidate_generation_recomputed'] is False
          for x in (r,p):
            assert x['sonotaco_2013_2014_access'] is False
            assert x['target_information_access'] is False
            assert x['target_region_events_accessed'] is False
            assert x['maarsy_scientific_access'] is False
            assert x['dms_scientific_access'] is False
          print('PASS_GMN_LOCAL_BACKGROUND_CONTRAST_FIREWALL', r['verdict'])
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_gmn_local_background_contrast_diagnostic_v1/PROTOCOL.md orbittrace_gmn_local_background_contrast_diagnostic_v1/run_development.py input/ranker/run_urc_union_ranker.py > output/source_input_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/development_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-local-background-contrast-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
