name: SonotaCo Mondrian scorer harness audit

on:
  pull_request:
    branches:
      - agent/mondrian-clique-coverage-normalized-development
    paths:
      - .github/workflows/sonotaco_mondrian_harness_audit.yml
      - sonotaco_mondrian_harness_audit/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonotaco-mondrian-harness-audit
  cancel-in-progress: true

jobs:
  no-data-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sonotaco-mondrian-harness-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audits before source decode
        run: |
          python -m py_compile sonotaco_mondrian_harness_audit/introspect_pr38.py
          python -m py_compile sonotaco_mondrian_harness_audit/introspect_baseline.py
      - name: Decode and statically inspect exact scorer and baseline
        run: |
          python sonotaco_mondrian_harness_audit/introspect_pr38.py
          python sonotaco_mondrian_harness_audit/introspect_baseline.py
          python -m py_compile output/pr38_mondrian_scorer.py output/pr14_baseline.py
          cat output/PR38_HARNESS_AUDIT.md
          cat output/PR14_BASELINE_AUDIT.md
      - name: Record provenance
        if: always()
        run: |
          sha256sum \
            sonotaco_mondrian_harness_audit/PROTOCOL.md \
            sonotaco_mondrian_harness_audit/introspect_pr38.py \
            sonotaco_mondrian_harness_audit/introspect_baseline.py \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            > output/source_sha256.txt
          python --version > output/python_version.txt
      - name: Upload exact scorer, baseline, and interface audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonotaco-mondrian-harness-audit
          path: output
          if-no-files-found: error
          retention-days: 30
