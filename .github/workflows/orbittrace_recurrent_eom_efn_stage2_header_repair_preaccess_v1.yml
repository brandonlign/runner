name: OrbitTrace recurrent-EOM EFN Stage-2 header repair preaccess v1

on:
  push:
    branches:
      - agent/orbittrace-recurrent-eom-efn-2017-2018-preaccess-v1
    paths:
      - '.github/workflows/orbittrace_recurrent_eom_efn_stage2_header_repair_preaccess_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  synthetic-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify header-repair-only source pins
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_eom_efn_2017_2018_external_v1/STAGE1_BINDING_FREEZE.json)" = '8d736feb464584c6e8302d9efdbf62784a296163'
          test "$(git hash-object orbittrace_recurrent_eom_efn_2017_2018_external_v1/STAGE2_ALLOWLIST_ACCESS_CORRECTION.md)" = 'b4505da0656b3514f8a2aa9e92faef19d3f42009'
          test "$(git hash-object orbittrace_recurrent_eom_efn_2017_2018_external_v1/STAGE2_RETURNED_HEADER_REPAIR.md)" = '753012ca61f1c6eb4a4a2e569d36230592594e30'
          test "$(git hash-object orbittrace_recurrent_eom_efn_2017_2018_external_v1/stage2_geometry.py)" = '5003c7e641b6ae3e2b63bc5439d1f5dc68f31e4f'
          test "$(git hash-object orbittrace_recurrent_eom_efn_2017_2018_external_v1/stage2_selftest.py)" = 'b7e2caa1204638bc16c0e735f09d0abe88b50c93'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          python -m py_compile \
            orbittrace_recurrent_eom_efn_2017_2018_external_v1/stage2_geometry.py \
            orbittrace_recurrent_eom_efn_2017_2018_external_v1/stage2_selftest.py
          python - <<'PY'
          import ast
          p='orbittrace_recurrent_eom_efn_2017_2018_external_v1/stage2_geometry.py'
          src=open(p).read(); tree=ast.parse(src); ns={}; exec(compile(tree,p,'exec'),ns)
          assert ns['QUERY_COLUMNS']==['Code','Obs.date','Lsun','Lgeo-Lsun','Bgeo','Vgeo']
          assert ns['RETURNED_COLUMNS']==['Code','Obs_date','Lsun','Lgeo-Lsun','Bgeo','Vgeo']
          assert "row[\"Lgeo-Lsun\"]" in src
          assert "row[\"Lgeo_Lsun\"]" not in src
          q=ns['build_query'](['A','B'])
          assert "Code IN ('A','B')" in q
          assert 'Lsun <' not in q and 'Lsun >' not in q
          assert 'Shower' not in ns['SELECT_COLUMNS'] and 'Object' not in ns['SELECT_COLUMNS']
          print('PASS_EFN_STAGE2_HEADER_REPAIR_SOURCE_BOUNDARY')
          PY

      - name: Run zero-EFN-data literal-hyphen header audit
        run: |
          set -euo pipefail
          mkdir -p orbittrace_recurrent_eom_efn_2017_2018_external_v1/output
          rm -f orbittrace_recurrent_eom_efn_2017_2018_external_v1/output/STAGE2_HEADER_REPAIR_SYNTHETIC_AUDIT.json
          python -u orbittrace_recurrent_eom_efn_2017_2018_external_v1/stage2_selftest.py
          python - <<'PY'
          import json
          p='orbittrace_recurrent_eom_efn_2017_2018_external_v1/output/STAGE2_HEADER_REPAIR_SYNTHETIC_AUDIT.json'
          r=json.load(open(p))
          assert r['verdict']=='PASS_RECURRENT_EOM_EFN_STAGE2_LITERAL_HYPHEN_HEADER_REPAIR_SYNTHETIC_AUDIT'
          assert r['synthetic_only'] is True
          assert r['returned_columns']==['Code','Obs_date','Lsun','Lgeo-Lsun','Bgeo','Vgeo']
          assert r['literal_hyphen_lgeo_header_exercised'] is True
          assert r['server_side_access_restriction']=='frozen Stage-1 retained-ID allowlist only'
          assert r['raw_longitude_server_filter_removed'] is True
          assert r['csv_schema_boundary_exercised'] is True and r['per_batch_id_boundary_exercised'] is True
          assert r['protected_canonical_row_fails_closed'] is True
          assert r['extra_column_fails_closed'] is True
          assert r['missing_retained_id_fails_closed'] is True
          assert r['nonpositive_velocity_fails_closed'] is True
          assert r['efn_event_rows_accessed'] is False and r['efn_geometry_accessed'] is False and r['efn_shower_labels_accessed'] is False
          assert r['target_information_access'] is False and r['target_region_physical_values_accessed'] is False
          print(r['verdict'])
          PY

      - name: Preserve repair audit provenance
        if: always()
        run: |
          set +e
          root='orbittrace_recurrent_eom_efn_2017_2018_external_v1/output'
          mkdir -p "$root"
          sha256sum \
            orbittrace_recurrent_eom_efn_2017_2018_external_v1/STAGE1_BINDING_FREEZE.json \
            orbittrace_recurrent_eom_efn_2017_2018_external_v1/STAGE2_ALLOWLIST_ACCESS_CORRECTION.md \
            orbittrace_recurrent_eom_efn_2017_2018_external_v1/STAGE2_RETURNED_HEADER_REPAIR.md \
            orbittrace_recurrent_eom_efn_2017_2018_external_v1/stage2_geometry.py \
            orbittrace_recurrent_eom_efn_2017_2018_external_v1/stage2_selftest.py \
            "$root/STAGE2_HEADER_REPAIR_SYNTHETIC_AUDIT.json" \
            > "$root/stage2_header_repair_source_output_sha256.txt" 2>/dev/null || true
          git rev-parse HEAD > "$root/stage2_header_repair_execution_commit.txt"
          python --version > "$root/stage2_header_repair_python_version.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-efn-stage2-header-repair-preaccess-v1
          path: |
            orbittrace_recurrent_eom_efn_2017_2018_external_v1/output/STAGE2_HEADER_REPAIR_SYNTHETIC_AUDIT.json
            orbittrace_recurrent_eom_efn_2017_2018_external_v1/output/stage2_header_repair_source_output_sha256.txt
            orbittrace_recurrent_eom_efn_2017_2018_external_v1/output/stage2_header_repair_execution_commit.txt
            orbittrace_recurrent_eom_efn_2017_2018_external_v1/output/stage2_header_repair_python_version.txt
          if-no-files-found: error
          retention-days: 90
