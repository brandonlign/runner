name: OrbitTrace v53 local-v19 Pareto-dominator diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v53_local_v19_pareto_dominator_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v53_local_v19_pareto_dominator_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v53-local-v19-pareto-dominator-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen v53 scientific sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v51 input/payload input/truth output/freeze output/diag
          test "$(git hash-object orbittrace_v53_local_v19_pareto_dominator_diagnostic_v1/PROTOCOL.md)" = '1ebd22a98fc82d4b4d377385f9786baa61662ff9'
          test "$(git hash-object orbittrace_v53_local_v19_pareto_dominator_diagnostic_v1/diagnose.py)" = 'e6fc3974fef09c8a455dd99aee68ec0583d162be'
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v53_local_v19_pareto_dominator_diagnostic_v1/diagnose.py
          echo PASS_V53_FROZEN_SOURCE_PINS

      - name: Restore and verify binding v51 rank-plane source before v53 diagnostic truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9101972590/zip' -o input/v51.zip
          echo '56258a0be52d83c0d6dbfcffdb9fd9a2c6b73587ba8d92d7bdccdef9729868c9  input/v51.zip' | sha256sum -c -
          unzip -q input/v51.zip -d input/v51
          echo '5f20a8bedb6e7b8d6c06d66e45d5037057a9853ded35a2b360333d6ea5e2c4cc  input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json' | sha256sum -c -
          echo 'fef1d2c5bb83748de5c5511615915e76ce6fcd0801afbddb0e01bab09b9ab76d  input/v51/diag/V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC.json' | sha256sum -c -
          python - <<'PY'
          import json
          v=json.load(open('input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json'))
          r=json.load(open('input/v51/diag/V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC.json'))
          assert v['family_count']==229 and len(v['families'])==229
          assert v['diagnostic_recoverability_attached'] is False and v['annual_own_family_f1_attached'] is False
          assert r['verdict']=='PASS_V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC' and r['direction_supported_both_years'] is True
          assert r['new_candidate_order_evaluated'] is False and r['minimax_successor_evaluated'] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          print('PASS_V53_V51_SOURCE_PINS')
          PY

      - name: Freeze complete 229-family Pareto-dominator vector before v53 recoverability truth
        run: |
          set -euo pipefail
          python -u orbittrace_v53_local_v19_pareto_dominator_diagnostic_v1/diagnose.py freeze \
            --vector-file input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json \
            --result-file input/v51/diag/V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC.json \
            --output output/freeze
          python - <<'PY'
          import hashlib,json
          p='output/freeze/V53_LOCAL_V19_PARETO_DOMINATOR_VECTOR.json'
          r=json.load(open(p))
          assert r['verdict']=='PASS_V53_LOCAL_V19_PARETO_DOMINATOR_VECTOR_FREEZE'
          assert r['scientific_role']=='COMPLETE_229_FAMILY_LOCAL_V19_PARETO_DOMINATOR_VECTOR_FROZEN_BEFORE_V53_RECOVERABILITY_ATTACHMENT'
          assert r['family_count']==229 and len(r['families'])==229
          assert r['min_pareto_dominator_count']==0 and r['max_pareto_dominator_count']==188 and r['distinct_pareto_dominator_count_values']==133
          assert r['current_v53_recoverability_attached'] is False and r['annual_own_family_f1_attached'] is False
          for k in ('literature_budget_used','boundary_identity_used','v52_substituted_identity_used','component_quality_topology_signal_used','new_candidate_order_evaluated','pareto_frontier_order_evaluated','pareto_layer_order_evaluated','selector_evaluated','successor_selected','threshold_selected','top_k_selected','rank_window_selected','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print('PASS_V53_DOMINATOR_VECTOR_FREEZE',hashlib.sha256(open(p,'rb').read()).hexdigest(),r['canonical_sha256_without_self_field'])
          PY

      - name: Restore immutable #950 HDB memberships after vector freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          m=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          f=json.load(open('input/payload/hdbscan/family_memberships.json'))
          assert m['truth_accessed'] is False and f['truth_accessed'] is False
          assert m['feature_dimension']==71 and len(m['family_ids'])==229 and len(f['families'])==229
          assert [str(x['family_id']) for x in f['families']]==list(map(str,m['family_ids']))
          assert m['target_information_access'] is False
          assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_V53_IMMUTABLE_PRETRUTH_PAYLOAD')
          PY

      - name: Load immutable exposed SonotaCo truth only after v53 vector freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
          echo PASS_V53_EXPOSED_TRUTH_LOADED_AFTER_VECTOR_FREEZE

      - name: Run sole frozen Pareto-dominator diagnostic
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.
        run: |
          set -euo pipefail
          python -u orbittrace_v53_local_v19_pareto_dominator_diagnostic_v1/diagnose.py diagnose \
            --vector-file output/freeze/V53_LOCAL_V19_PARETO_DOMINATOR_VECTOR.json \
            --hdb-root input/payload/hdbscan --truth-root input/truth --output output/diag

      - name: Enforce diagnostic-only scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V53_LOCAL_V19_PARETO_DOMINATOR_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V53_LOCAL_V19_PARETO_DOMINATOR_DIAGNOSTIC','FAIL_V53_LOCAL_V19_PARETO_DOMINATOR_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_V52_LOCAL_V19_PARETO_DOMINATOR_MECHANISM_DIAGNOSTIC_ONLY_NO_SUCCESSOR_ORDER_OR_PANEL_EVALUATED'
          assert r['source_v51_run']==31493423814 and r['source_v51_artifact']==9101972590
          assert r['source_v51_vector_sha256']=='5f20a8bedb6e7b8d6c06d66e45d5037057a9853ded35a2b360333d6ea5e2c4cc'
          assert r['source_v51_result_sha256']=='fef1d2c5bb83748de5c5511615915e76ce6fcd0801afbddb0e01bab09b9ab76d'
          assert r['family_count']==229 and set(r['annual_diagnostics'])=={'2013','2014'}
          for y in ('2013','2014'):
              assert set(r['annual_diagnostics'][y])=={'recoverable','nonrecoverable','median_difference_recoverable_minus_nonrecoverable','direction_pass'}
          for k in ('new_candidate_order_evaluated','literature_panel_evaluated','selector_evaluated','replacement_rule_evaluated','successor_selected','dominator_count_successor_evaluated','pareto_frontier_test_evaluated','pareto_layer_test_evaluated','representative_group_aggregation_evaluated','auc_evaluated','correlation_evaluated','regression_evaluated','p_value_evaluated','alternate_dominance_convention_evaluated','threshold_search','quantile_search','top_k_search','rank_window_search','literature_budget_analysis','fusion_weight_search','rank_algebra_search','component_quality_topology_rescue','v52_identity_rescue','boundary_identity_used','oracle_identity_used_for_ranking','feature_search','model_search','k_search','metric_search','scaling_search','diversity_search','source_quota_selected','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['annual_diagnostics'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v53_local_v19_pareto_dominator_diagnostic_v1/PROTOCOL.md \
            orbittrace_v53_local_v19_pareto_dominator_diagnostic_v1/diagnose.py \
            input/v51.zip input/v51/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json input/v51/diag/V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC.json \
            output/freeze/V53_LOCAL_V19_PARETO_DOMINATOR_VECTOR.json input/payload.zip input/truth.zip \
            > output/V53_PARETO_DOMINATOR_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v53-local-v19-pareto-dominator-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
