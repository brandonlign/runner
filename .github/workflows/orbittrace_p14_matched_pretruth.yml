name: OrbitTrace P14 matched pretruth checkpoint construction

on:
  pull_request:
    branches:
      - agent/orbittrace-p14-matched-literature-freeze
    paths:
      - orbittrace_core_halo_p13_literature/LAUNCH_V7.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-p14-matched-pretruth
  cancel-in-progress: false

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: ffe8351b9ee8df4418fb4926fab782d66180e276
          path: exact-lit
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build both P14 checkpoints and stop before truth
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cp orbittrace_support_safe_rank_p14/run_matched_pretruth_v2.sh /tmp/run_p14_matched_pretruth_v2.sh
          chmod +x /tmp/run_p14_matched_pretruth_v2.sh
          /tmp/run_p14_matched_pretruth_v2.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-p14-matched-pretruth-checkpoints
          path: pretruth
          if-no-files-found: warn
          retention-days: 90
