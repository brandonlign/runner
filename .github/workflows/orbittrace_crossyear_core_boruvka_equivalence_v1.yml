name: OrbitTrace cross-year-core HDBSCAN v1 Boruvka equivalence

on:
  push:
    branches:
      - agent/orbittrace-crossyear-core-hdbscan-v1
    paths:
      - 'orbittrace_crossyear_core_hdbscan_v1/BORUVKA_AUDIT_ACTIVATE.md'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.:orbittrace_crossyear_core_hdbscan_v1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  exact-boruvka-vs-dense-synthetic-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-crossyear-core-hdbscan-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inherited runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          test "$(git hash-object orbittrace_crossyear_core_hdbscan_v1/PROTOCOL.md)" = '980d2f26d6477ff80d1b57606ee86ae96bebe972'
          test "$(git hash-object orbittrace_crossyear_core_hdbscan_v1/reference.py)" = '5380dd68a01c0f35c3e212972b840ae7b9dea7aa'
          test "$(git hash-object orbittrace_crossyear_core_hdbscan_v1/reference_selftest.py)" = 'b0b7b693ef2543d9d5a03d8f44c293cf751450f1'
          test "$(git hash-object orbittrace_crossyear_core_hdbscan_v1/boruvka_adapter.py)" = 'a7fec249d82fef23158ae52897ae28f9d0126153'
          test "$(git hash-object orbittrace_crossyear_core_hdbscan_v1/boruvka_equivalence_selftest.py)" = 'b6d1d95405e16bf7337e6256ca71e0d059ca8759'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          python -m py_compile \
            orbittrace_crossyear_core_hdbscan_v1/reference.py \
            orbittrace_crossyear_core_hdbscan_v1/reference_selftest.py \
            orbittrace_crossyear_core_hdbscan_v1/boruvka_adapter.py \
            orbittrace_crossyear_core_hdbscan_v1/boruvka_equivalence_selftest.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py
          echo PASS_CROSSYEAR_CORE_BORUVKA_FROZEN_SOURCE_PINS
      - name: Run exact Boruvka equivalence audit only
        run: |
          set -euo pipefail
          rm -f crossyear_core_boruvka_equivalence.json
          python -u orbittrace_crossyear_core_hdbscan_v1/boruvka_equivalence_selftest.py
          python - <<'PY'
          import json
          r=json.load(open('crossyear_core_boruvka_equivalence.json'))
          assert r['verdict']=='PASS_CROSSYEAR_CORE_BORUVKA_DENSE_EQUIVALENCE_V1'
          assert r['absolute_tolerance']==1e-12
          assert len(r['cases'])==5
          assert r['boruvka_exact_mst'] is True
          assert r['approx_min_span_tree'] is False
          assert r['boruvka_n_jobs']==1
          for c in r['cases']:
              assert c['max_core_abs_error'] <= 1e-12
              assert c['mst_max_weight_abs_error'] <= 1e-12
              assert c['recurrent_partition_identity'] is True
              assert c['connectivity_filtration_identity'] is True
              assert c['condensed_child_size_multiset_identity'] is True
              assert c['condensed_lambda_multiset_identity'] is True
          assert r['scientific_data_access'] is False
          assert r['gmn_access'] is False
          assert r['sonotaco_access'] is False
          assert r['amos_access'] is False
          assert r['target_access'] is False
          print(r['verdict'])
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p orbittrace_crossyear_core_hdbscan_v1/output_boruvka
          cp crossyear_core_boruvka_equivalence.json orbittrace_crossyear_core_hdbscan_v1/output_boruvka/ 2>/dev/null || true
          sha256sum \
            orbittrace_crossyear_core_hdbscan_v1/PROTOCOL.md \
            orbittrace_crossyear_core_hdbscan_v1/reference.py \
            orbittrace_crossyear_core_hdbscan_v1/reference_selftest.py \
            orbittrace_crossyear_core_hdbscan_v1/boruvka_adapter.py \
            orbittrace_crossyear_core_hdbscan_v1/boruvka_equivalence_selftest.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_crossyear_core_hdbscan_v1/output_boruvka/crossyear_core_boruvka_equivalence.json \
            > orbittrace_crossyear_core_hdbscan_v1/output_boruvka/source_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > orbittrace_crossyear_core_hdbscan_v1/output_boruvka/execution_commit.txt
          python --version > orbittrace_crossyear_core_hdbscan_v1/output_boruvka/python_version.txt
          python -m pip freeze > orbittrace_crossyear_core_hdbscan_v1/output_boruvka/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-crossyear-core-boruvka-equivalence-v1
          path: orbittrace_crossyear_core_hdbscan_v1/output_boruvka
          if-no-files-found: error
          retention-days: 90
