name: OrbitTrace v6 direct-finalize recovery registered

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-direct-finalize-registered-base
    paths:
      - orbittrace_v6_direct_finalize_recovery/RUN_REGISTERED.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-v6-direct-finalize-registered
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Require one-file recovery child
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init /tmp/guard >/dev/null
          cd /tmp/guard
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = 'orbittrace_v6_direct_finalize_recovery/RUN_REGISTERED.md'
          test "$(git show "$HEAD_SHA":orbittrace_v6_direct_finalize_recovery/RUN_REGISTERED.md)" = 'EXECUTE_DIRECT_FINALIZE_REGISTERED_FROM_FANOUT_31282128101'
          echo PASS_DIRECT_FINALIZE_REGISTERED_AUTHORIZATION

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: execution

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v6/ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v6/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct exact repaired v6 source
        run: |
          set -euo pipefail
          cd frozen-v6
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          cat orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.frozen.py' | sha256sum -c -
          cd ..
          PYTHONPATH=execution python - <<'PY'
          from pathlib import Path
          from orbittrace_v6_checkpointed_fallback.common import apply_exact_two_line_repair
          d=apply_exact_two_line_repair(Path('/tmp/v6.frozen.py'),Path('/tmp/v6.repaired.py'))
          assert d=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24',d
          print('PASS_EXACT_REPAIRED_V6',d)
          PY

      - name: Restore authoritative fanout artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p pre2022 pre2023 exact2022 exact2023 fixed4 year2022 year2023 frozen-v6/output_direct_finalize
          gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name orbittrace-v6-fanout-preexact-2022 --dir pre2022
          gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name orbittrace-v6-fanout-preexact-2023 --dir pre2023
          for i in 0 1 2 3 4 5; do
            gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name "orbittrace-v6-fanout-exact-2022-$i" --dir exact2022
            gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name "orbittrace-v6-fanout-exact-2023-$i" --dir exact2023
          done
          gh run download 31106001133 --repo "$GITHUB_REPOSITORY" --name orbittrace-fixed4-support-normalized-wrapper-development --dir fixed4
          test -f pre2022/v6_preexact_2022.pkl
          test -f pre2023/v6_preexact_2023.pkl
          test "$(find exact2022 -name 'v6_exact_2022_shard_*.pkl' | wc -l)" -eq 6
          test "$(find exact2023 -name 'v6_exact_2023_shard_*.pkl' | wc -l)" -eq 6
          test -f fixed4/orbittrace_fixed4_support_wrapper_development.json

      - name: Direct-finalize both exact years without proposal regeneration
        env:
          PYTHONPATH: execution:frozen-v6/orbittrace_wavelet_catalogue_v3:frozen-v6/orbittrace_multi_anchor_energy_v3:/tmp
        run: |
          set -euo pipefail
          python -u execution/orbittrace_v6_direct_finalize_recovery/finalize_year.py \
            --year 2022 --preexact pre2022/v6_preexact_2022.pkl --exact-dir exact2022 \
            --repaired-source /tmp/v6.repaired.py --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 --output year2022
          python -u execution/orbittrace_v6_direct_finalize_recovery/finalize_year.py \
            --year 2023 --preexact pre2023/v6_preexact_2023.pkl --exact-dir exact2023 \
            --repaired-source /tmp/v6.repaired.py --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 --output year2023
          cat year2022/v6_year_2022.json
          cat year2023/v6_year_2023.json

      - name: Evaluate through unchanged repaired main
        env:
          PYTHONPATH: execution:frozen-v6/orbittrace_wavelet_catalogue_v3:frozen-v6/orbittrace_multi_anchor_energy_v3:/tmp
        run: |
          set -euo pipefail
          python -u execution/orbittrace_v6_checkpointed_fallback/combine_with_checkpoints.py \
            --repaired-source /tmp/v6.repaired.py \
            --checkpoint-2022 year2022/v6_year_2022.pkl \
            --checkpoint-2023 year2023/v6_year_2023.pkl \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 \
            --fixed4-baseline-json fixed4/orbittrace_fixed4_support_wrapper_development.json \
            --output frozen-v6/output_direct_finalize
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('frozen-v6/output_direct_finalize/v3_primary_catalogue_v6_development.json').read_text())
          assert r['verdict'] in {'PASS_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT','FAIL_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['primary_alpha']==0.05
          assert all(a['proposal_cap_per_window']==512 for a in r['year_audits'])
          assert all(a['max_primary_proposals_per_year']==36864 for a in r['year_audits'])
          print('ORBITTRACE_V6_DIRECT_FINALIZE_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'evaluation':{k:v for k,v in r['evaluation'].items() if k!='per_label'},'gates':r['gates'],'year_audits':r['year_audits']},indent=2))
          print('ORBITTRACE_V6_DIRECT_FINALIZE_RESULT_END')
          PY

      - name: Record recovery provenance
        if: always()
        run: |
          set +e
          mkdir -p frozen-v6/output_direct_finalize
          python --version > frozen-v6/output_direct_finalize/python_version.txt
          python -m pip freeze > frozen-v6/output_direct_finalize/environment.txt
          sha256sum execution/orbittrace_v6_direct_finalize_recovery/finalize_year.py execution/orbittrace_v6_checkpointed_fallback/*.py > frozen-v6/output_direct_finalize/recovery_source_sha256.txt 2>/dev/null || true
          printf '%s\n' '31282128101' > frozen-v6/output_direct_finalize/source_fanout_run_id.txt
          printf '%s\n' 'Recovery uses original captured proposal records and completed exact outputs; it performs no proposal regeneration and verifies every stored Brown/fixed4 proposal p-value against fresh deterministic calibration before frozen post-rescore finalization.' > frozen-v6/output_direct_finalize/RECOVERY_NOTE.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v6-direct-finalize-development
          path: frozen-v6/output_direct_finalize
          if-no-files-found: error
          retention-days: 90
