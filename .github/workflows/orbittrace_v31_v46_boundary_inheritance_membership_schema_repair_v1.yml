name: OrbitTrace post-v46 boundary inheritance membership-schema repair v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v31_v46_boundary_inheritance_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v31_v46_boundary_inheritance_membership_schema_repair_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v31-v46-boundary-inheritance-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 31704c312c09be2765ad3f65a0685d1acfd2b055
          path: frozen-v40
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen science plus schema-only wrapper
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/signal input/frontier input/payload input/truth output/freeze output/diag
          test "$(git hash-object orbittrace_v31_v46_boundary_inheritance_diagnostic_v1/PROTOCOL.md)" = '34ab85808be7f6b76ce90d78559c20e0c14b2d6d'
          test "$(git hash-object orbittrace_v31_v46_boundary_inheritance_diagnostic_v1/diagnose.py)" = 'b6de7bdf3ade109467bff9c3802d0a3bf84e4d1c'
          test "$(git hash-object orbittrace_v31_v46_boundary_inheritance_diagnostic_v1/membership_schema_repair.py)" = '8933506e0d2cd1001d49afb1c0608dc80dc20c9f'
          test "$(git -C frozen-v40 rev-parse HEAD)" = '31704c312c09be2765ad3f65a0685d1acfd2b055'
          test "$(git -C frozen-v40 hash-object orbittrace_v40_component_best_evidence_representative_v1/train_evaluate.py)" = '710944a43111e72ed286b3a5c06010db619c807f'
          test "$(git -C frozen-v40 hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git -C frozen-v40 hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v31_v46_boundary_inheritance_diagnostic_v1/diagnose.py orbittrace_v31_v46_boundary_inheritance_diagnostic_v1/membership_schema_repair.py

      - name: Restore #1098 truth-blind signal and components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088724826/zip' -o input/signal.zip
          echo '11498b73237304f4175f37910596700ed78284bc6106d0c21dcaab66f97b7978  input/signal.zip' | sha256sum -c -
          unzip -p input/signal.zip diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json > input/signal/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json
          unzip -p input/signal.zip pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json > input/signal/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json
          echo 'a3bcea66b72003a38cc492ea3b182d92cd20f3d1b94a43acbc8a0cbdd465ed07  input/signal/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json' | sha256sum -c -
          echo 'c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd  input/signal/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json' | sha256sum -c -

      - name: Restore #1126 truth-blind Pareto frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9089357860/zip' -o input/frontier.zip
          echo 'ce055dc38f5f56d82e6330590fa30becaf6896ab4323de7e1d4abf4644e97a9a  input/frontier.zip' | sha256sum -c -
          unzip -p input/frontier.zip freeze/V31_JOINT_COMPONENT_PARETO_FRONTIER_VECTOR.json > input/frontier/V31_JOINT_COMPONENT_PARETO_FRONTIER_VECTOR.json
          echo '5ca5cab6f6a47c05d013237190ad21b247a13e22fa06988ee36dc0832a37fc02  input/frontier/V31_JOINT_COMPONENT_PARETO_FRONTIER_VECTOR.json' | sha256sum -c -

      - name: Restore and verify immutable #950 memberships before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          echo '99640747e935df2f4a7c7983bdde843ea59e1814388b8418e040dc04628aee13  input/payload/hdbscan/family_memberships.json' | sha256sum -c -
          python - <<'PY'
          import json
          m=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          f=json.load(open('input/payload/hdbscan/family_memberships.json'))
          assert m['truth_accessed'] is False and f['truth_accessed'] is False
          assert len(m['family_ids'])==229 and len(f['families'])==229
          assert set(f)=={'families','truth_accessed'}
          assert m['target_information_access'] is False
          assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_V46_BOUNDARY_AUTHORITATIVE_950_SCHEMA')
          PY

      - name: Freeze exact v31-v46 boundary identities before truth
        run: |
          set -euo pipefail
          python -u orbittrace_v31_v46_boundary_inheritance_diagnostic_v1/diagnose.py freeze \
            --signal-file input/signal/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json \
            --frontier-file input/frontier/V31_JOINT_COMPONENT_PARETO_FRONTIER_VECTOR.json \
            --component-file input/signal/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json \
            --output output/freeze
          echo '39534c85d2fca765451c0766452c4e4106dacccbb27c064c6f4a87be8cdd7949  output/freeze/V46_BOUNDARY_INHERITANCE_FREEZE.json' | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('output/freeze/V46_BOUNDARY_INHERITANCE_FREEZE.json'))
          assert r['verdict']=='PASS_V46_BOUNDARY_INHERITANCE_FREEZE'
          assert r['scientific_role']=='FIXED_V31_V46_HDB_BOUNDARY_SUBSTITUTIONS_FROZEN_BEFORE_OUTCOME_TRUTH'
          assert r['canonical_sha256_without_self_field']=='706916d7d101903b982d481df8807d54d59af0ea7905aadb305205193aa3013d'
          assert r['truth_accessed'] is False and len(r['fixed_hdb_literature_panels'])==2
          assert [(x['year'],x['budget']) for x in r['fixed_hdb_literature_panels']]==[(2013,11),(2014,9)]
          for x in r['fixed_hdb_literature_panels']:
              assert len(x['incoming_family_ids'])==1 and len(x['outgoing_family_ids'])==1
              assert x['incoming'][0]['inherited_evidence_gap']>0
              assert x['incoming'][0]['v31_rank']>x['budget']
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_V46_BOUNDARY_IDENTITY_FREEZE')
          PY

      - name: Load immutable exposed SonotaCo truth only after boundary freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth

      - name: Evaluate unchanged frozen boundary mechanism through schema wrapper
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:.
        run: |
          set -euo pipefail
          python -u orbittrace_v31_v46_boundary_inheritance_diagnostic_v1/membership_schema_repair.py \
            --freeze-file output/freeze/V46_BOUNDARY_INHERITANCE_FREEZE.json \
            --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth \
            --output output/diag

      - name: Enforce diagnostic-only result firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V46_BOUNDARY_INHERITED_EVIDENCE_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V46_BOUNDARY_INHERITED_EVIDENCE_SUBSTITUTION_HARM_DIAGNOSTIC','FAIL_V46_BOUNDARY_INHERITED_EVIDENCE_SUBSTITUTION_HARM_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_V46_MECHANISM_DIAGNOSTIC_ONLY_NO_SUCCESSOR_OR_ORDER_EVALUATED'
          assert r['boundary_freeze_sha256']=='39534c85d2fca765451c0766452c4e4106dacccbb27c064c6f4a87be8cdd7949'
          assert len(r['panels'])==2 and [(x['year'],x['budget']) for x in r['panels']]==[(2013,11),(2014,9)]
          for k in ('new_rank_or_score_evaluated','counterfactual_order_evaluated','replacement_rule_evaluated','selector_evaluated','successor_selected','threshold_search','top_k_search','rank_window_search','alternate_budget_search','component_gap_threshold_search','component_size_rule_search','frontier_redefinition','second_pareto_layer_evaluated','relaxed_dominance_evaluated','epsilon_dominance_evaluated','identity_rescue_list_created','oracle_identity_used_for_ranking','truth_aware_group_identity_used_for_ranking','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['panels'])
          PY

      - name: Record repaired provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v31_v46_boundary_inheritance_diagnostic_v1/PROTOCOL.md \
            orbittrace_v31_v46_boundary_inheritance_diagnostic_v1/diagnose.py \
            orbittrace_v31_v46_boundary_inheritance_diagnostic_v1/membership_schema_repair.py \
            input/payload/hdbscan/family_memberships.json \
            output/freeze/V46_BOUNDARY_INHERITANCE_FREEZE.json \
            > output/V46_BOUNDARY_INHERITANCE_SCHEMA_REPAIR_SOURCE_SHA256.txt 2>/dev/null || true
          git -C frozen-v40 rev-parse HEAD > output/frozen_v40_execution_commit.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-v46-boundary-inheritance-membership-schema-repair-v1
          path: output
          if-no-files-found: error
          retention-days: 90
