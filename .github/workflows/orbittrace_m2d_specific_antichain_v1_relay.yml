name: OrbitTrace specific-M2D antichain relay
on:
  pull_request:
    branches: [agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1]
    paths: ['.github/workflows/orbittrace_m2d_specific_antichain_v1_relay.yml']
permissions:
  actions: write
  contents: read
  pull-requests: write
  issues: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch frozen pretruth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run orbittrace_m2d_specific_antichain_v1_pretruth.yml --repo "$GITHUB_REPOSITORY" --ref agent/orbittrace-m2d-specific-antichain-v1
          sleep 3
          gh run list --repo "$GITHUB_REPOSITORY" --workflow orbittrace_m2d_specific_antichain_v1_pretruth.yml --branch agent/orbittrace-m2d-specific-antichain-v1 --limit 5 --json databaseId,event,status,headSha,createdAt > /tmp/runs.json
          cat /tmp/runs.json
          python - <<'PY' > /tmp/c.md
          import json
          r=[x for x in json.load(open('/tmp/runs.json')) if x.get('event')=='workflow_dispatch'][0]
          print('M2D_SPECIFIC_ANTICHAIN_V1_PRETRUTH_DISPATCHED=%s' % r['databaseId'])
          print('head_sha=%s' % r['headSha'])
          PY
          gh pr comment 1384 --repo "$GITHUB_REPOSITORY" --body-file /tmp/c.md
