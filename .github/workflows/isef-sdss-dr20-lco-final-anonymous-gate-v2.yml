name: ISEF SDSS DR20 final anonymous LCO unbound gate v2
on:
  push:
    paths:
      - '.github/workflows/isef-sdss-dr20-lco-final-anonymous-gate-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  final-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'scipy>=1.16' 'astropy>=7.1,<8' 'galpy>=1.12,<2'
      - run: timeout 1800s python isef/sdss_dr20_lco_final_anonymous_gate_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-sdss-dr20-lco-final-anonymous-gate-v2
          path: results/sdss_dr20_lco_final_anonymous_gate.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## SDSS DR20 frozen final anonymous LCO gate v2'; echo '```json'; cat results/sdss_dr20_lco_final_anonymous_gate.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
