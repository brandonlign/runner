name: OrbitTrace P15 artifact-only development adjudication source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - orbittrace_support_safe_halo_p15/adjudicate_development_artifact_only.py
      - orbittrace_support_safe_halo_p15/run_development_artifact_adjudication.sh
      - .github/workflows/orbittrace_p15_development_artifact_adjudication.yml
      - .github/workflows/orbittrace_p15_development_artifact_adjudication_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Reconstruct exact P15 development source and audit canonical-only activation gate
        run: |
          set -euo pipefail
          python -m py_compile orbittrace_support_safe_halo_p15/adjudicate_development_artifact_only.py orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py
          bash -n orbittrace_support_safe_halo_p15/run_development_artifact_adjudication.sh
          test "$(git hash-object orbittrace_support_safe_halo_p15/adjudicate_development_artifact_only.py)" = '84cda1e10fedc750fff03c29b3d91c356483b4f7'
          test "$(git hash-object orbittrace_support_safe_halo_p15/run_development_artifact_adjudication.sh)" = '517ac8f4331100377bd7cabe543156d5878ef550'
          test "$(git hash-object .github/workflows/orbittrace_p15_development_artifact_adjudication.yml)" = 'd88ac704afa46a17a63943f3917121a8bd84bc37'

          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/p11.py
          echo '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9  /tmp/p11.py' | sha256sum -c -
          python orbittrace_drift_conditioned_p12/apply_p12_patch.py /tmp/p11.py /tmp/p12.py
          echo '78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32  /tmp/p12.py' | sha256sum -c -
          python orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py /tmp/p12.py /tmp/p15_dev.py
          echo '22d34131e873825ca60aefbba0b92088f19f57f589fe629bfbd3b7041d160b4b  /tmp/p15_dev.py' | sha256sum -c -
          python -m py_compile /tmp/p15_dev.py

          python - <<'PY'
          from pathlib import Path
          adj=Path('orbittrace_support_safe_halo_p15/adjudicate_development_artifact_only.py').read_text()
          run=Path('orbittrace_support_safe_halo_p15/run_development_artifact_adjudication.sh').read_text()
          wf=Path('.github/workflows/orbittrace_p15_development_artifact_adjudication.yml').read_text()
          required_adj=(
            "P15_DEV_SOURCE_SHA='22d34131e873825ca60aefbba0b92088f19f57f589fe629bfbd3b7041d160b4b'",
            "P12_RESULT_SHA256='96698c1a7ba700716a79e7bc8b7bc9acb2f9aec653095a5d7e33b14000b87a38'",
            "P13_RESULT_SHA256='d298cebec624c991c4abda9dc809d92d8eea101baaf2b6edbb1862b7acc49739'",
            "p12['configuration']['negative_minimum_per_direction']==128",
            "len(dirs)==452",
            "unavailable==[]",
            "minimum>=required",
            "p13['configuration']['p13_primary_discovery_metrics_use_core_only'] is True",
            "p13['configuration']['p13_membership_metrics_use_halo_only'] is True",
            "p13['no_new_truth_query'] is True and p13['target_information_access'] is False",
            "'adjudication_mode':'artifact_only_from_immutable_canonical_P12_P13'",
            "'p15_fallback_vacuous_on_development':True",
            "'new_truth_query':False",
            "'matched_truth_access':False",
            "'external_data_access':False",
            "'target_information_access':False",
          )
          for x in required_adj: assert x in adj,x
          required_run=(
            'EXECUTE_P15_DEVELOPMENT_ARTIFACT_ONLY_ADJUDICATION',
            'P12_9035003746_P13_9035081147',
            '9035003746','31302353678','sha256:4b13435ede6f95bf33c016642cc20f932bf45db58e10a5576f316234c29d8cd7',
            '96698c1a7ba700716a79e7bc8b7bc9acb2f9aec653095a5d7e33b14000b87a38',
            '9035081147','31303078223','sha256:efd9c047fb195800d88da3409fb3765e265becb6d0483367e46b8f232658956a',
            'd298cebec624c991c4abda9dc809d92d8eea101baaf2b6edbb1862b7acc49739',
            'PASS_P15_ARTIFACT_ONLY_CANONICAL_INPUTS_PINNED',
            'PASS_P15_ARTIFACT_ONLY_DEVELOPMENT_FINAL_GATE',
          )
          for x in required_run: assert x in run,x
          assert run.count('curl -L --fail --retry 3')==2
          assert 'run_header_compatible.py' not in run
          assert 'apply_support_safe_halo_p15.py' not in run
          assert 'evaluate_frozen_blindsafe' not in run
          assert 'P15_DEVELOPMENT_ARTIFACT_ADJUDICATION_RUN.md' in wf
          assert 'orbittrace-p15-support-safe-halo-development-artifact-adjudication' in wf
          forbidden=(
            '9042324169','31328065110','dbe621e66d7b6fcd7539a083789ca4b1be94425d468f04878e73d413c652d914',
            'math.isclose','np.isclose','allclose','tolerance','epsilon','1e-13','1e-12',
            '8955917326','9012424187','8957940764','8957263372','MAARSY','OrbitTrace-April','target_coordinate',
          )
          for x in forbidden: assert x not in adj+run+wf,x
          print('PASS_P15_ARTIFACT_ONLY_DEVELOPMENT_ADJUDICATION_SOURCE_AND_ACTIVATION_AUDIT')
          PY
          test ! -e orbittrace_support_safe_halo_p15/P15_DEVELOPMENT_ARTIFACT_ADJUDICATION_RUN.md
          echo NO_CANONICAL_ARTIFACT_DOWNLOAD_NO_NEW_TRUTH_NO_MATCHED_NO_EXTERNAL_NO_TARGET_ACCESS
