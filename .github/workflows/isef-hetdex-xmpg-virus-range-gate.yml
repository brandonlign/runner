name: ISEF HETDEX XMPG VIRUS exact-range gate
on:
  push:
    paths:
      - 'isef/hetdex_xmpg_virus_range_gate.py'
      - '.github/workflows/isef-hetdex-xmpg-virus-range-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'scipy>=1.16' 'astropy>=7.1,<8'
      - run: timeout 600s python isef/hetdex_xmpg_virus_range_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-hetdex-xmpg-virus-range-gate
          path: results/hetdex_xmpg_virus_range_gate.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## HETDEX XMPG frozen VIRUS exact-range gate'; echo '```json'; cat results/hetdex_xmpg_virus_range_gate.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
