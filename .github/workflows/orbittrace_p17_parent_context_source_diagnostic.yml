name: OrbitTrace P17 parent reciprocal context diagnostic

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - .github/workflows/orbittrace_p17_parent_context_source_diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Reconstruct exact P15 parents and print reciprocal source context only
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/p11.py
          python orbittrace_drift_conditioned_p12/apply_p12_patch.py /tmp/p11.py /tmp/p12.py
          python orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py /tmp/p12.py /tmp/p15_dev.py
          python orbittrace_core_halo_p13_literature/apply_p12_matched_transport_patch_v2.py /tmp/p12.py /tmp/p12_v2.py
          python orbittrace_support_safe_rank_p14/apply_p12_snm_id_transport_from_v2.py /tmp/p12_v2.py /tmp/p12_v3.py
          python orbittrace_support_safe_halo_p15/apply_support_safe_halo_p15.py /tmp/p12_v3.py /tmp/p15_matched.py
          python - <<'PY'
          from pathlib import Path
          for label,path in [('dev',Path('/tmp/p15_dev.py')),('matched',Path('/tmp/p15_matched.py'))]:
              lines=path.read_text().splitlines()
              print(f'===== P17_PARENT_CONTEXT_{label.upper()} =====')
              hits=[]
              keys=('reciprocal','p9_reliable','crossfit_audits','candidate_audits','direction_records','P3 family direction count changed')
              for i,line in enumerate(lines):
                  if any(k in line for k in keys): hits.append(i)
              keep=set()
              for i in hits:
                  keep.update(range(max(0,i-4),min(len(lines),i+7)))
              last=-2
              for i in sorted(keep):
                  if i>last+1: print('---')
                  print(f'{i+1:04d}: {lines[i]}')
                  last=i
              print(f'HIT_COUNT={len(hits)}')
          print('NO_DATA_NO_COMPARATOR_NO_TRUTH_NO_EXTERNAL_NO_TARGET_ACCESS')
          PY
