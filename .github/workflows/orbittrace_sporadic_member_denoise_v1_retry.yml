name: OrbitTrace sporadic member-denoise v1 import-safe retry

on:
  push:
    branches:
      - agent/orbittrace-sporadic-analogue-eom-v1
    paths:
      - 'orbittrace_sporadic_member_denoise_v1/RETRY.md'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  binding-gmn-retry:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-sporadic-analogue-eom-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen runtime and verify unchanged science
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'charset-normalizer==3.5.0'
          mkdir -p input/v3 input/v8 input/ranker input/winner input/weights output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          cp frozen-v8/orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py input/v3/wavelet_episode_comparator.py
          test "$(git hash-object orbittrace_sporadic_member_denoise_v1/PROTOCOL.md)" = '3c8d0a237eae91f8748ac5928bf7e095ab02901f'
          test "$(git hash-object orbittrace_sporadic_member_denoise_v1/run_development.py)" = 'bf0031ad3174181a1cc7078c970325faeb4cac6e'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/winner
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852836840
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-sporadic-analogue-eom-v1-exact-runtime-retry
          path: input/weights
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31912528972
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Verify frozen inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/winner/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json | cut -d' ' -f1)" = 'efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          test "$(sha256sum input/winner/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = 'ca6aeed2b82739003ea5d39b59e869df876de2962164344a938fe4935ea38711'
          test "$(sha256sum input/weights/SPORADIC_ANALOGUE_WEIGHTS.npy | cut -d' ' -f1)" = '648b88efc09192738dcce8eb2af15e215676dd62451a88cd9230337d80fd5347'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
      - name: Run exact frozen rule with import-safe module launch
        env:
          PYTHONPATH: orbittrace_recurrent_eom_hdbscan_v1:input/ranker:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:.
        run: |
          set -euo pipefail
          python -u -m orbittrace_sporadic_member_denoise_v1.run_development \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --winner-prelabel-json input/winner/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --winner-result-json input/winner/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            --weights-npy input/weights/SPORADIC_ANALOGUE_WEIGHTS.npy \
            --output output
      - name: Enforce fixed gate and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('output/SPORADIC_MEMBER_DENOISE_V1_PRELABEL.json'))
          r=json.load(open('output/SPORADIC_MEMBER_DENOISE_V1_GMN_DEVELOPMENT.json'))
          assert p['parent_candidate_count']==2094
          assert p['parent_ordered_membership_sha256']=='e8f374ad03e7072463118ee6440a54d96d11e3aab17202cfe336f866530224f2'
          assert p['weights_sha256']=='648b88efc09192738dcce8eb2af15e215676dd62451a88cd9230337d80fd5347'
          assert p['weight_threshold']==r['weight_threshold']==1.0
          assert p['ranking_changed'] is False and r['ranking_changed'] is False
          assert p['hdbscan_recomputed'] is False and r['hdbscan_recomputed'] is False
          assert r['parent_total_recovered_at_100']==179 and r['required_gain']==5
          assert r['verdict'] in {'PASS_SPORADIC_MEMBER_DENOISE_V1_GMN_DEVELOPMENT','FAIL_SPORADIC_MEMBER_DENOISE_V1_GMN_DEVELOPMENT'}
          for x in (p,r):
              for k in ['target_information_access','target_region_events_accessed','sonotaco_2013_2014_access','asfn_access','efn_access','amos_access','maarsy_scientific_access','dms_scientific_access']:
                  assert x[k] is False
          if r['verdict'].startswith('PASS_'):
              assert r['successor_total_recovered_at_100'] >= 184
              assert r['recovered_at_100_gain'] >= 5
              assert all(all(g.values()) for g in r['annual_gates'].values())
          print(r['verdict'], 'total=',r['successor_total_recovered_at_100'], 'gain=',r['recovered_at_100_gain'])
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum orbittrace_sporadic_member_denoise_v1/PROTOCOL.md orbittrace_sporadic_member_denoise_v1/run_development.py output/SPORADIC_MEMBER_DENOISE_V1_PRELABEL.json output/SPORADIC_MEMBER_DENOISE_V1_GMN_DEVELOPMENT.json > output/provenance_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-sporadic-member-denoise-v1-import-safe-retry
          path: output
          if-no-files-found: error
          retention-days: 90
