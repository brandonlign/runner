name: OrbitTrace v6-LF-core probabilistic membership C1 development

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-lf-core-probabilistic-membership-c1-freeze
    paths:
      - orbittrace_v6_lf_core_probabilistic_membership_c1/RUN.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-v6-lf-core-c1-development
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce one-file child, v6-LF development PASS, and literature no-go
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'orbittrace_v6_lf_core_probabilistic_membership_c1/RUN.md'
          content="$(git show "$HEAD_SHA":orbittrace_v6_lf_core_probabilistic_membership_c1/RUN.md)"
          mode="$(printf '%s\n' "$content" | sed -n '1p')"
          dev_run="$(printf '%s\n' "$content" | sed -n '2p')"
          literature_run="$(printf '%s\n' "$content" | sed -n '3p')"
          test "$mode" = 'EXECUTE_C1_LF_AFTER_V6_LF_PASS_AND_NO_LITERATURE_SUPERIORITY'
          [[ "$dev_run" =~ ^[0-9]+$ ]]
          [[ "$literature_run" =~ ^[0-9]+$ ]]
          test "$(printf '%s\n' "$content" | wc -l)" -eq 3
          test "$(gh run view "$dev_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$literature_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success

          mapfile -t dev_names < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$dev_run/artifacts" --jq '.artifacts[].name')
          dev_candidates=()
          for name in orbittrace-v6-lf-all-event-null-development-v2 orbittrace-v6-lf-strict-semantic-development; do
            if printf '%s\n' "${dev_names[@]}" | grep -qx "$name"; then dev_candidates+=("$name"); fi
          done
          test "${#dev_candidates[@]}" -eq 1
          if [ "${dev_candidates[0]}" = 'orbittrace-v6-lf-all-event-null-development-v2' ]; then
            year2022='v6-lf-v2-year-2022'; year2023='v6-lf-v2-year-2023'
          else
            year2022='v6-lf-strict-year-2022'; year2023='v6-lf-strict-year-2023'
          fi
          printf '%s\n' "${dev_names[@]}" | grep -qx "$year2022"
          printf '%s\n' "${dev_names[@]}" | grep -qx "$year2023"

          mapfile -t lit_names < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$literature_run/artifacts" --jq '.artifacts[].name')
          lit_candidates=()
          for name in orbittrace-v6-lf-matched-literature-result orbittrace-v6-lf-matched-literature-fanout-v1-result; do
            if printf '%s\n' "${lit_names[@]}" | grep -qx "$name"; then lit_candidates+=("$name"); fi
          done
          test "${#lit_candidates[@]}" -eq 1

          rm -rf /tmp/c1lf-prereq && mkdir -p /tmp/c1lf-prereq/{dev,lit}
          gh run download "$dev_run" --repo "$GITHUB_REPOSITORY" --name "${dev_candidates[0]}" --dir /tmp/c1lf-prereq/dev
          gh run download "$literature_run" --repo "$GITHUB_REPOSITORY" --name "${lit_candidates[0]}" --dir /tmp/c1lf-prereq/lit
          python - <<'PY'
          import json
          from pathlib import Path
          dev=json.loads(Path('/tmp/c1lf-prereq/dev/v6_label_free_all_event_null_development.json').read_text())
          assert dev['verdict']=='PASS_V6_LABEL_FREE_ALL_EVENT_NULL_DEVELOPMENT',dev['verdict']
          assert dev['configuration']['years']==[2022,2023]
          assert dev['configuration']['blind_exclusion']==[20.0,55.0]
          assert dev['configuration']['calibration_reservoir']=='all geometrically valid target-excluded scan events; no shower-label selection'
          assert dev['configuration']['parameter_search'] is False
          assert dev['configuration']['null_trimming'] is False
          assert all(dev['gates'].values()),dev['gates']
          assert len(dev['pretruth_sha256'])==64

          lit=json.loads(Path('/tmp/c1lf-prereq/lit/v6_lf_matched_literature.json').read_text())
          assert lit['classification']=='NO_LITERATURE_SUPERIORITY',lit['classification']
          assert lit['years']==[2023,2025]
          assert lit['blind_exclusion']==[20.0,55.0]
          assert lit['pairwise_only_no_cross_denominator_comparison'] is True
          assert lit['broad_catalogue_superiority'] is False
          assert lit['sparse_stream_superiority'] is False
          assert lit['panels']['hdbscan']['exact_event_rows']=={'2023':26460,'2025':19658}
          assert lit['panels']['sugar']['exact_event_rows']=={'2023':30414,'2025':23200}
          print('PASS_C1_LF_ACTIVATION_PREREQUISITES')
          PY

          echo "dev_run=$dev_run" >> "$GITHUB_OUTPUT"
          echo "dev_artifact=${dev_candidates[0]}" >> "$GITHUB_OUTPUT"
          echo "year2022=$year2022" >> "$GITHUB_OUTPUT"
          echo "year2023=$year2023" >> "$GITHUB_OUTPUT"
          echo "literature_run=$literature_run" >> "$GITHUB_OUTPUT"
          echo "literature_artifact=${lit_candidates[0]}" >> "$GITHUB_OUTPUT"

          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_v6_lf_core_probabilistic_membership_c1/RUN.md

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-v6-lf-fanout-v1
          path: lf-freeze
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-probabilistic-membership-p1-freeze-v2
          path: p1-freeze
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 785554905113626bebffecdd441616238eb76b04
          path: p1-transfer
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: exact-v8
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v6/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r frozen-v6/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct exact scientific runtimes and download selected LF checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RUN: ${{ steps.auth.outputs.dev_run }}
          DEV_ARTIFACT: ${{ steps.auth.outputs.dev_artifact }}
          YEAR2022_ARTIFACT: ${{ steps.auth.outputs.year2022 }}
          YEAR2023_ARTIFACT: ${{ steps.auth.outputs.year2023 }}
        run: |
          set -euo pipefail
          mkdir -p input/{lf-result,year2022,year2023} output
          test "$(git hash-object orbittrace_v6_lf_core_probabilistic_membership_c1/run_development.py)" = '4c29e414373a2d14ead743cb3888dbe9afe9d6b3'
          test "$(git -C lf-freeze hash-object orbittrace_v6_label_free_all_event_null/run_development.py)" = 'd91a1bb22361536c770a8c3786e598586d89b70e'

          cd frozen-v6
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          cat orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.frozen.py' | sha256sum -c -
          cd ..
          python - <<'PY'
          import hashlib
          from pathlib import Path
          original=Path('/tmp/v6.frozen.py').read_text()
          before='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    components = primary_components + rescue_components
'''
          after='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    primary_components = component_records_track_v6(old, year, primary_capped, event_lookup, base, "v3")
    rescue_components = component_records_track_v6(old, year, rescue_capped, event_lookup, base, "fixed4_rescue")
    components = primary_components + rescue_components
'''
          assert original.count(before)==1
          patched=original.replace(before,after,1)
          assert patched.replace(after,before,1)==original
          assert hashlib.sha256(patched.encode()).hexdigest()=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          Path('/tmp/v6.repaired.py').write_text(patched)
          PY
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          parts=sorted(Path('p1-freeze/orbittrace_probabilistic_membership_p1/source_parts').glob('part*.b64'))
          assert [p.name for p in parts]==['part00.b64','part01.b64']
          src=gzip.decompress(base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts),validate=True))
          assert hashlib.sha256(src).hexdigest()=='e7847e067bab8d07038c998359ccbf0ca6e2ccf257f27f27f4aef999cc7a0508'
          Path('/tmp/p1.frozen.py').write_bytes(src)
          PY
          test "$(git -C p1-transfer hash-object orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py)" = '498daf762bc82a664679998ea751feecff8033de'
          test "$(git -C exact-v8 rev-parse HEAD)" = 'c9d6c44704013ba0c9430100e98a29a56b453304'
          test "$(git -C exact-v8 hash-object orbittrace_pooled_year_centroid_v8/run_development.py)" = 'f248df78e1258b132b41aecca6a985a5eb782654'

          gh run download "$DEV_RUN" --repo "$GITHUB_REPOSITORY" --name "$DEV_ARTIFACT" --dir input/lf-result
          gh run download "$DEV_RUN" --repo "$GITHUB_REPOSITORY" --name "$YEAR2022_ARTIFACT" --dir input/year2022
          gh run download "$DEV_RUN" --repo "$GITHUB_REPOSITORY" --name "$YEAR2023_ARTIFACT" --dir input/year2023
          python -m py_compile orbittrace_v6_lf_core_probabilistic_membership_c1/run_development.py lf-freeze/orbittrace_v6_label_free_all_event_null/run_development.py /tmp/v6.repaired.py /tmp/p1.frozen.py
          echo PASS_C1_LF_EXACT_RUNTIME_IDENTITIES

      - name: Execute one-shot target-excluded C1-LF development
        env:
          PYTHONPATH: exact-v8:frozen-v6/orbittrace_wavelet_catalogue_v3:frozen-v6/orbittrace_multi_anchor_energy_v3:lf-freeze:.
        run: |
          set -euo pipefail
          python -u orbittrace_v6_lf_core_probabilistic_membership_c1/run_development.py \
            --lf-result-json input/lf-result/v6_label_free_all_event_null_development.json \
            --checkpoint-2022 input/year2022/v6_lf_year_2022.pkl \
            --checkpoint-2023 input/year2023/v6_lf_year_2023.pkl \
            --lf-source lf-freeze/orbittrace_v6_label_free_all_event_null/run_development.py \
            --v6-source /tmp/v6.repaired.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --p1-source /tmp/p1.frozen.py \
            --p1-transfer-runner p1-transfer/orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py \
            --v8-runner exact-v8/orbittrace_pooled_year_centroid_v8/run_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 \
            --output output
          cat output/V6_LF_CORE_PROBABILISTIC_MEMBERSHIP_C1_DEVELOPMENT.md

      - name: Enforce frozen C1-LF result boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/v6_lf_core_probabilistic_membership_c1_development.json').read_text())
          assert r['verdict'] in {'PASS_V6_LF_CORE_PROBABILISTIC_MEMBERSHIP_C1_DEVELOPMENT','FAIL_V6_LF_CORE_PROBABILISTIC_MEMBERSHIP_C1_NO_GO'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['v6_source_sha256']=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          assert r['configuration']['lf_source_git_blob']=='d91a1bb22361536c770a8c3786e598586d89b70e'
          assert r['configuration']['p1_source_sha256']=='e7847e067bab8d07038c998359ccbf0ca6e2ccf257f27f27f4aef999cc7a0508'
          assert r['configuration']['p1_transfer_commit']=='785554905113626bebffecdd441616238eb76b04'
          assert r['configuration']['p1_transfer_git_blob']=='498daf762bc82a664679998ea751feecff8033de'
          assert r['configuration']['fixed4_rescue_can_seed_c1_lf'] is False
          assert r['configuration']['parameter_search'] is False
          assert r['configuration']['new_members_can_seed_growth'] is False
          assert r['configuration']['calibration_reservoir']=='all geometrically valid target-excluded scan events; no shower-label selection'
          assert r['gates']['lf_pretruth_family_payload_reproduced'] is True
          assert r['gates']['lf_baseline_reproduced'] is True
          assert r['gates']['geometry_parser_never_accessed_label_values'] is True
          assert len(r['v6_lf_rank_pretruth_sha256'])==64
          assert len(r['v6_lf_seed_families_pretruth_sha256'])==64
          assert len(r['membership_pretruth_sha256'])==64
          print('ORBITTRACE_C1_LF_FROZEN_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'baseline_v6_lf':r['baseline_v6_lf'],'c1_lf':r['c1_lf'],'gates':r['gates'],'diagnostics':{k:v for k,v in r['diagnostics'].items() if k!='family_year_audits'}},indent=2))
          print('ORBITTRACE_C1_LF_FROZEN_RESULT_END')
          PY
      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum orbittrace_v6_lf_core_probabilistic_membership_c1/run_development.py lf-freeze/orbittrace_v6_label_free_all_event_null/run_development.py /tmp/v6.repaired.py /tmp/p1.frozen.py p1-transfer/orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py > output/source_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v6-lf-core-c1-development
          path: output
          if-no-files-found: error
          retention-days: 90
