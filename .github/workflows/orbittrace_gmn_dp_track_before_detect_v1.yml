name: OrbitTrace GMN DP track-before-detect v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-dp-track-before-detect-v1
    paths:
      - 'orbittrace_gmn_dp_track_before_detect_v1/**'
      - '.github/workflows/orbittrace_gmn_dp_track_before_detect_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact runtime and verify frozen DP-TBD source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/v8 input/ranker output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py)
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          test "$(git hash-object orbittrace_gmn_dp_track_before_detect_v1/PROTOCOL.md)" = '8b18c19af9df4bb0efe005af1a754ac524a0c58d'
          test "$(git hash-object orbittrace_gmn_dp_track_before_detect_v1/run_development.py)" = 'fd25455d90720e81bc3ee4cb74bed9975533f808'
          python -m py_compile orbittrace_gmn_dp_track_before_detect_v1/run_development.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify exact active GMN runtime utility
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Verify immutable target-excluded GMN runtime support
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
      - name: Run first binding GMN 2022+2023 DP-TBD v1 outcome
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_dp_track_before_detect_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output
      - name: Enforce frozen result and protected-data firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/DP_TBD_V1_RESULT.json'))
          p=json.load(open('output/DP_TBD_V1_PRELABEL.json'))
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_DEVELOPMENT_ONLY'
          assert r['first_valid_outcome_binding'] is True
          assert p['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_DP_TBD_PRELABEL'
          assert p['truth_used_in_detection'] is False
          assert p['hdbscan_candidates_used'] is False and r['hdbscan_candidates_used'] is False
          assert r['control_839']=={
            'recovered_at_25':22,'recovered_at_50':40,'recovered_at_100':75,'recovered_at_500':159,
            'top100_dominant_precision':0.7645689180574315,'mrr':0.019037817654898162,'qualified_matches':256}
          assert r['frozen_constants']=={
            'bin_width_deg':2.0,'radiant_scale_deg':3.0,'speed_scale_ratio':1.08,'pseudocount':0.5,
            'predecessor_k':8,'allowed_gaps':[1,2],'min_path_states':3,'max_seeds':5000,
            'member_residual_max':1.0,'min_members':4,'dedup_jaccard':0.5}
          assert r['parameter_search'] is False and r['threshold_search'] is False and r['score_weight_search'] is False
          assert r['candidate_generation_recomputed_after_truth'] is False
          assert r['blind_exclusion']==[20.0,55.0] and p['blind_exclusion']==[20.0,55.0]
          for x in (r,p):
            assert x['sonotaco_2013_2014_access'] is False
            assert x['target_information_access'] is False
            assert x['target_region_events_accessed'] is False
            assert x['maarsy_scientific_access'] is False
            assert x['dms_scientific_access'] is False
          print('PASS_DP_TBD_V1_FIREWALL',r['verdict'],r['beats_839_full'])
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_gmn_dp_track_before_detect_v1/PROTOCOL.md orbittrace_gmn_dp_track_before_detect_v1/run_development.py input/ranker/run_urc_union_ranker.py > output/source_input_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/development_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-dp-track-before-detect-v1
          path: output
          if-no-files-found: error
          retention-days: 90
