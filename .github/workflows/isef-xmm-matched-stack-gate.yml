name: ISEF XMM matched-stack gate
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_matched_stack_gate.py'
      - '.github/workflows/isef-xmm-matched-stack-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8'
      - name: Compare exact stack inputs
        id: gate
        continue-on-error: true
        run: timeout 360s python isef/xmm_matched_stack_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-matched-stack-gate
          path: results/xmm_matched_stack_gate.json
          if-no-files-found: warn
      - name: Report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', OUTCOME: '${{ steps.gate.outcome }}'}
        run: |
          python - <<'PY' >/tmp/r.md
          import json,os
          from pathlib import Path
          print('## XMM exact matched-stack gate');print('Outcome:',f"`{os.environ.get('OUTCOME')}`")
          p=Path('results/xmm_matched_stack_gate.json')
          if p.exists():print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:60000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
