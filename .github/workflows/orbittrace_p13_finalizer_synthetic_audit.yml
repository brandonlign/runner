name: OrbitTrace P13 no-recompute finalizer synthetic audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p12-drift-conditioned-freeze
    paths:
      - orbittrace_core_halo_p13/finalize_from_p12.py
      - orbittrace_core_halo_p13/FINALIZER_GIT_BLOB_SHA
      - orbittrace_core_halo_p13/PROTOCOL.md
      - .github/workflows/orbittrace_p13_finalizer_synthetic_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Require pretruth-pinned finalizer identity
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < orbittrace_core_halo_p13/FINALIZER_GIT_BLOB_SHA)"
          test "$expected" = '04ff0422e9f2aaf374e051b1a67f25e23bead129'
          test "$(git hash-object orbittrace_core_halo_p13/finalize_from_p12.py)" = "$expected"
          echo PASS_P13_PRETRUTH_FINALIZER_BLOB_IDENTITY
      - name: Exercise deterministic PASS and FAIL without catalogue or truth access
        run: |
          set -euo pipefail
          rm -rf /tmp/p13-synth && mkdir -p /tmp/p13-synth
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          root=Path('/tmp/p13-synth')
          families=[{'family_id':f'f{i:03d}','event_ids':[f'2022{i:03d}a',f'2023{i:03d}b']} for i in range(226)]
          with gzip.open(root/'cores.json.gz','wt',encoding='utf-8') as f: json.dump(families,f)
          baseline={
              'eligible_labels':355,'qualified_matches':95,'recovered_at_100':58,'recovered_at_500':95,
              'macro_f1':0.1736657194465356,'top100_dominant_precision':0.6884631112636006,
              'mrr':0.045531138942766655,
          }
          def payload(halo_recall):
              return {
                  'verdict':'FAIL_DRIFT_CONDITIONED_TWO_VIEW_MEMBERSHIP_P12_NO_GO',
                  'configuration':{'years':[2022,2023],'blind_exclusion':[20.0,55.0],'family_count':226,'p12_static_d_obs_retained':False,'p12_parameter_search':False},
                  'baseline_v8':baseline,
                  'p12':{'qualified_matches':90,'recovered_at_100':57,'recovered_at_500':90,'macro_f1':0.30,'top100_dominant_precision':0.70},
                  'baseline_large_shower':{'mean_recall':0.06738386922850433},
                  'p12_large_shower':{'mean_recall':halo_recall,'mean_precision':0.90,'mean_f1':0.30},
                  'gates':{
                      'qualified_matches_no_regression':False,'recovery_at_100_no_regression':False,
                      'top100_dominant_precision_at_least_065':True,'macro_f1_gain_at_least_008':True,
                      'large_shower_mean_recall_at_least_15x_v8':halo_recall >= 1.5*0.06738386922850433,
                      'large_shower_mean_precision_at_least_085':True,
                      'integrity_source_only':True,'truth_firewall':True,'expansion_nonvacuous':True,
                  },
                  'membership_pretruth_sha256':'a'*64,'drift_pretruth_sha256':'b'*64,
                  'density_pretruth_sha256':'c'*64,'decisions_pretruth_sha256':'d'*64,
              }
          (root/'pass.json').write_text(json.dumps(payload(0.20)))
          (root/'fail.json').write_text(json.dumps(payload(0.05)))
          PY
          python orbittrace_core_halo_p13/finalize_from_p12.py --p12-result-json /tmp/p13-synth/pass.json --core-families-json-gz /tmp/p13-synth/cores.json.gz --output /tmp/p13-synth/pass-out
          python orbittrace_core_halo_p13/finalize_from_p12.py --p12-result-json /tmp/p13-synth/fail.json --core-families-json-gz /tmp/p13-synth/cores.json.gz --output /tmp/p13-synth/fail-out
          python - <<'PY'
          import json
          from pathlib import Path
          good=json.loads(Path('/tmp/p13-synth/pass-out/dual_output_core_halo_p13_development.json').read_text())
          bad=json.loads(Path('/tmp/p13-synth/fail-out/dual_output_core_halo_p13_development.json').read_text())
          assert good['verdict']=='PASS_DUAL_OUTPUT_CORE_HALO_P13_DEVELOPMENT'
          assert bad['verdict']=='FAIL_DUAL_OUTPUT_CORE_HALO_P13_NO_GO'
          assert good['configuration']['p13_detector_recomputed'] is False
          assert good['no_new_truth_query'] is True and bad['no_new_truth_query'] is True
          assert good['core_discovery']['qualified_matches']==95 and good['core_discovery']['recovered_at_100']==58
          assert good['gates']['p13_halo_large_shower_mean_recall_at_least_15x_v8'] is True
          assert bad['gates']['p13_halo_large_shower_mean_recall_at_least_15x_v8'] is False
          assert good['halo_pretruth_sha256']=='a'*64 and bad['halo_pretruth_sha256']=='a'*64
          assert good['core_pretruth_sha256']==bad['core_pretruth_sha256']
          print('PASS_P13_NO_RECOMPUTE_FINALIZER_SYNTHETIC_AUDIT')
          PY
      - name: Assert finalizer has no network or label-loading dependency
        run: |
          set -euo pipefail
          ! grep -E 'requests|gmn_python_api|parse_catalogue|hidden_labels|known_shower' orbittrace_core_halo_p13/finalize_from_p12.py
          test ! -e orbittrace_core_halo_p13/RUN.md
          echo P13_FINALIZER_NO_NETWORK_NO_NEW_TRUTH_QUERY
