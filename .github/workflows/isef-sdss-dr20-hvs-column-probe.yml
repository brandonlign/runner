name: ISEF SDSS DR20 HVS column probe
on:
  push:
    paths:
      - 'isef/sdss_dr20_hvs_column_probe.py'
      - '.github/workflows/isef-sdss-dr20-hvs-column-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python isef/sdss_dr20_hvs_column_probe.py
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## SDSS DR20 orbit column probe'; echo '```json'; cat results/sdss_dr20_hvs_column_probe.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
