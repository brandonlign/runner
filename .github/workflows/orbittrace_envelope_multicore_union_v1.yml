name: OrbitTrace envelope multicore union v1

on:
  pull_request:
    branches: [agent/orbittrace-m2d-support-pruned-cut-v1]
    paths:
      - orbittrace_envelope_multicore_union_v1/**
      - .github/workflows/orbittrace_envelope_multicore_union_v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      pretruth_sha: ${{ steps.seal.outputs.pretruth_sha }}
      structural_pass: ${{ steps.seal.outputs.structural_pass }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and verify unchanged EMCU scientific sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3'
          test "$(git hash-object orbittrace_envelope_multicore_union_v1/build_pretruth.py)" = '360682cf6777b3bf855363c69c6fe92a19affbf7'
          test "$(git hash-object orbittrace_envelope_multicore_union_v1/evaluate_gmn.py)" = '9eacf4e83490ade52f031f2b34abd31bf3944ef9'
          python -m py_compile orbittrace_envelope_multicore_union_v1/build_pretruth.py orbittrace_envelope_multicore_union_v1/evaluate_gmn.py
          mkdir -p input/cmr output/pretruth
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-core-majority-regrowth-v1-pretruth
          path: input/cmr
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32301521305'
      - name: Verify frozen CMR source and rebuild exact pretruth
        run: |
          set -euo pipefail
          echo '8b77e80f305c6f47fc70b359bf03ebadcd6263b5d5ee6a6b9c30efda658bffcb  input/cmr/CORE_MAJORITY_REGROWTH_V1_PRETRUTH.json' | sha256sum -c -
          python -u orbittrace_envelope_multicore_union_v1/build_pretruth.py --cmr-pretruth input/cmr/CORE_MAJORITY_REGROWTH_V1_PRETRUTH.json --output output/pretruth/ENVELOPE_MULTICORE_UNION_V1_PRETRUTH.json
      - name: Seal exact EMCU hierarchy before labels
        id: seal
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          p='output/pretruth/ENVELOPE_MULTICORE_UNION_V1_PRETRUTH.json'
          raw=open(p,'rb').read(); h=hashlib.sha256(raw).hexdigest(); r=json.loads(raw)
          assert h=='225bc3c17d33fcb5956c329bab2cb1b5876953ee92d9be9841493a79fd723cac'
          assert r['structural_pass'] is True
          assert r['configuration']['extraction_rule']=='set_union_of_all_frozen_CMR_regrown_branches_for_parent'
          assert r['configuration']['branch_selection']=='none_all_branches_included'
          assert r['configuration']['core_replaces_envelope'] is False and r['configuration']['core_changes_envelope_rank'] is False
          assert r['configuration']['new_tuned_parameters']==[]
          assert r['shower_truth_used'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False and r['sonotaco_scientific_access'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('pretruth_sha='+h+'\n'); f.write('structural_pass=true\n')
          open('output/pretruth/PRETRUTH_SHA256.txt','w').write(h+'  ENVELOPE_MULTICORE_UNION_V1_PRETRUTH.json\n')
          print('EMCU_PRETRUTH_SHA='+h)
          print(json.dumps(r['mechanism_summary'],sort_keys=True)); print(json.dumps(r['size_summary'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-envelope-multicore-union-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: pretruth
    if: needs.pretruth.outputs.structural_pass == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: a2902cf879422bdbaf16ce288b0e1e5a3b88ec37
          path: frozen-ect
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 0960edd77ea29b29b70d05f389dce312d451f0d2
          path: frozen-bwm
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install hidden-label runtime and verify exact sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          test "$(git hash-object orbittrace_envelope_multicore_union_v1/build_pretruth.py)" = '360682cf6777b3bf855363c69c6fe92a19affbf7'
          test "$(git hash-object orbittrace_envelope_multicore_union_v1/evaluate_gmn.py)" = '9eacf4e83490ade52f031f2b34abd31bf3944ef9'
          test "$(git hash-object frozen-ect/orbittrace_envelope_core_topomodal_v1/evaluate_gmn.py)" = '7a0000ca6fcade22e82cd028f74de1bc7d0329cd'
          echo '43669902a0f891316bdff0650be36d3d7e8e5c32e44417574088d3d0fd1e00a0  frozen-ect/orbittrace_envelope_core_topomodal_v1/evaluate_gmn.py' | sha256sum -c -
          echo '1578f5eb28fc7e66a2c73f3ef66a6697e20b53b992a7fc979276720047e534d6  frozen-bwm/orbittrace_bif_witness_modularity_v1/evaluate_gmn.py' | sha256sum -c -
          mkdir -p input/pretruth input/fairness input/ranker input/v8 input/v3 output/truth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-envelope-multicore-union-v1-pretruth
          path: input/pretruth
      - name: Verify unchanged sealed EMCU pretruth
        run: echo '${{ needs.pretruth.outputs.pretruth_sha }}  input/pretruth/ENVELOPE_MULTICORE_UNION_V1_PRETRUTH.json' | sha256sum -c -
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth
          path: input/fairness
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32268943692'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '31344632499'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '31217916558'
      - name: Score unchanged envelopes and frozen multicore union
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_envelope_multicore_union_v1/evaluate_gmn.py \
            --emcu-pretruth input/pretruth/ENVELOPE_MULTICORE_UNION_V1_PRETRUTH.json \
            --expected-pretruth-sha '${{ needs.pretruth.outputs.pretruth_sha }}' \
            --frozen-ect-evaluator frozen-ect/orbittrace_envelope_core_topomodal_v1/evaluate_gmn.py \
            --frozen-bwm-evaluator frozen-bwm/orbittrace_bif_witness_modularity_v1/evaluate_gmn.py \
            --literature-pretruth input/fairness/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth/ENVELOPE_MULTICORE_UNION_V1_GMN_RESULT.json
      - name: Verify binding result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          p='output/truth/ENVELOPE_MULTICORE_UNION_V1_GMN_RESULT.json'; r=json.load(open(p))
          assert r['verdict'] in {'PASS_ENVELOPE_MULTICORE_UNION_V1_GMN_DEVELOPMENT','FAIL_ENVELOPE_MULTICORE_UNION_V1_GMN_DEVELOPMENT'}
          assert r['emcu_pretruth_sha256']=='225bc3c17d33fcb5956c329bab2cb1b5876953ee92d9be9841493a79fd723cac'
          assert r['flat_envelope_exactly_support_pruned'] is True and all(r['flat_envelope_gates'].values())
          print(r['verdict']); print('RESULT_SHA256='+hashlib.sha256(open(p,'rb').read()).hexdigest())
          print(json.dumps({'core_routes':r['core_routes'],'core_scales':r['core_scales'],'core_gates':r['core_gates'],'size_summary':r['size_summary']},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-envelope-multicore-union-v1-gmn-result
          path: output/truth
          if-no-files-found: error
          retention-days: 90
