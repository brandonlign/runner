name: OrbitTrace v50 no-diversity local-geometry development v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v50_no_diversity_local_geometry_v1/**'
      - '.github/workflows/orbittrace_v50_no_diversity_local_geometry_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v50-no-diversity-local-geometry-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen scientific sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/truth output/result
          test "$(git hash-object orbittrace_v50_no_diversity_local_geometry_v1/PROTOCOL.md)" = '5ea5277a448e648d50b483902af683d9ac007812'
          test "$(git hash-object orbittrace_v50_no_diversity_local_geometry_v1/train_evaluate.py)" = '538b5c3fa3fcc1d52aa55768f480c547fba753d5'
          test "$(git hash-object orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py)" = '917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v50_no_diversity_local_geometry_v1/train_evaluate.py orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py
          echo PASS_V50_FROZEN_SOURCE_PINS

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify immutable #839 ranker before truth
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          python - <<'PY'
          from pathlib import Path
          s=Path('input/ranker/run_urc_union_ranker.py').read_text()
          assert 'def diversity_order(' in s
          print('PASS_V50_IMMUTABLE_RANKER')
          PY

      - name: Restore immutable #950 pretruth payload before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          for route,n in (('sugar',267),('hdbscan',229)):
              m=json.load(open(f'input/payload/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              f=json.load(open(f'input/payload/{route}/family_memberships.json'))
              assert m['truth_accessed'] is False and f['truth_accessed'] is False
              assert m['feature_dimension']==71 and len(m['family_ids'])==n and len(f['families'])==n
              assert [str(x['family_id']) for x in f['families']]==list(map(str,m['family_ids']))
              assert m['target_information_access'] is False
              assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_V50_IMMUTABLE_PRETRUTH_PAYLOAD')
          PY

      - name: Load immutable exposed SonotaCo truth only after all source and payload pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth

      - name: Reproduce exact v31 and evaluate sole v50 no-diversity endpoint
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v50_no_diversity_local_geometry_v1/train_evaluate.py \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --output output/result

      - name: Enforce v50 scientific and protected-data firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/result/V50_NO_DIVERSITY_LOCAL_GEOMETRY_RESULT.json'))
          assert r['verdict'] in {'PASS_V50_NO_DIVERSITY_LOCAL_GEOMETRY_ALL_PANEL_LITERATURE_SUPERIORITY_DEVELOPMENT','FAIL_V50_NO_DIVERSITY_LOCAL_GEOMETRY_ALL_PANEL_LITERATURE_SUPERIORITY_DEVELOPMENT'}
          assert r['parent']=='v31 local-geometry-margin OOF' and r['parent_source_blob']=='917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          assert r['parent_reproduction_pass'] is True and len(r['parent_controls'])==4
          exp={('sugar',2013):(0.2719801488280529,16),('sugar',2014):(0.31529041952487225,17),('hdbscan',2013):(0.14888037368183737,9),('hdbscan',2014):(0.15198123772301594,9)}
          for x in r['parent_controls']:
              e=exp[(x['comparator'],x['year'])]
              assert abs(x['macro_f1']-e[0])<1e-12 and x['recovered_f1_gt_0_5']==e[1]
          assert r['ranker_source_sha256']=='dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          assert r['feature_dimension']==71 and r['nearest_k']==1 and r['strict_whole_shower_oof'] is True
          assert r['distance']=='ordinary Euclidean across all 71 fold-training standardized dimensions'
          assert r['annual_margin']=='d_nonpositive-d_positive' and r['annual_combiner']=='min(margin_2013,margin_2014)'
          assert r['diversity_parent_lambda']==0.8 and r['diversity_effective_lambda']==0.0 and r['diversity_scale']==1.0
          assert r['diversity_penalty_removed'] is True and len(r['diversity_patch_calls'])==2
          assert all(x=={'requested_lambda':0.8,'effective_lambda':0.0,'scale':1.0} for x in r['diversity_patch_calls'])
          assert r['tie_semantics_changed'] is False and r['centroid_metric_changed'] is False and r['local_score_changed'] is False and r['v19_fusion_changed'] is False
          assert len(r['panels'])==4 and r['panel_wins']==sum(bool(x['superiority_pair_pass']) for x in r['panels'])
          for k in ('candidate_membership_changed','pretruth_feature_changed','diversity_coefficient_search','diversity_scale_search','route_year_diversity_rule','second_diversity_pass','k_search','metric_search','scaling_search','feature_search','threshold_search','annual_combiner_search','fusion_search','fusion_weight_search','rank_algebra_search','top_k_selected','rank_window_selected','budget_specific_rule','quality_component_rescue','oracle_identity_used_for_ranking','post_result_second_search','maarsy_scientific_access','dms_scientific_access','target_information_access','target_region_events_accessed'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['panel_wins'],r['panels'],r['order_diagnostics'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v50_no_diversity_local_geometry_v1/PROTOCOL.md \
            orbittrace_v50_no_diversity_local_geometry_v1/train_evaluate.py \
            orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py \
            input/ranker/run_urc_union_ranker.py input/payload.zip input/truth.zip \
            > output/V50_NO_DIVERSITY_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v50-no-diversity-local-geometry-v1
          path: output
          if-no-files-found: error
          retention-days: 90
