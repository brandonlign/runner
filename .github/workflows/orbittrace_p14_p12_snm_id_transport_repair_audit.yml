name: OrbitTrace P14 P12 SNM ID transport repair audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p14-matched-literature-freeze
    paths:
      - orbittrace_support_safe_rank_p14/apply_p12_snm_id_transport_patch_v3.py
      - orbittrace_support_safe_rank_p14/apply_p12_snm_id_transport_from_v2.py
      - orbittrace_support_safe_rank_p14/audit_p12_snm_id_transport_repair.py
      - orbittrace_support_safe_rank_p14/finalize_pretruth_checkpoint_p14_transport_v3.py
      - orbittrace_support_safe_rank_p14/generate_matched_pretruth_direct_v3.py
      - orbittrace_support_safe_rank_p14/run_matched_pretruth_direct_v1.sh
      - .github/workflows/orbittrace_p14_p12_snm_id_transport_repair_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove repair and direct-launch integration are source-equivalent
        run: |
          set -euo pipefail
          python -m py_compile orbittrace_support_safe_rank_p14/apply_p12_snm_id_transport_patch_v3.py orbittrace_support_safe_rank_p14/apply_p12_snm_id_transport_from_v2.py orbittrace_support_safe_rank_p14/audit_p12_snm_id_transport_repair.py orbittrace_support_safe_rank_p14/finalize_pretruth_checkpoint_p14_transport_v3.py orbittrace_support_safe_rank_p14/generate_matched_pretruth_direct_v3.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/p11.py
          echo '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9  /tmp/p11.py' | sha256sum -c -
          python orbittrace_drift_conditioned_p12/apply_p12_patch.py /tmp/p11.py /tmp/p12.py
          echo '78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32  /tmp/p12.py' | sha256sum -c -
          python orbittrace_core_halo_p13_literature/apply_p12_matched_transport_patch_v2.py /tmp/p12.py /tmp/p12_panel_v2.py
          echo 'f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae  /tmp/p12_panel_v2.py' | sha256sum -c -
          python orbittrace_support_safe_rank_p14/apply_p12_snm_id_transport_patch_v3.py /tmp/p12.py /tmp/p12_panel_v3.py
          python orbittrace_support_safe_rank_p14/apply_p12_snm_id_transport_from_v2.py /tmp/p12_panel_v2.py /tmp/p12_panel_runtime.py
          cmp /tmp/p12_panel_v3.py /tmp/p12_panel_runtime.py
          echo '55a1efed550498d51b859ffec555797ba8473d7d8b5f20ad6831c5f15b43b415  /tmp/p12_panel_runtime.py' | sha256sum -c -
          python orbittrace_support_safe_rank_p14/audit_p12_snm_id_transport_repair.py /tmp/p12_panel_v2.py /tmp/p12_panel_v3.py
          grep -F "PARENT_TRANSPORT_SHA256 = \"f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae\"" orbittrace_support_safe_rank_p14/finalize_pretruth_checkpoint_p14_transport_v3.py
          grep -F "TECHNICAL_TRANSPORT_SHA256 = \"55a1efed550498d51b859ffec555797ba8473d7d8b5f20ad6831c5f15b43b415\"" orbittrace_support_safe_rank_p14/finalize_pretruth_checkpoint_p14_transport_v3.py
          grep -F "p14_p12_snm_id_transport_scientific_delta\"] = False" orbittrace_support_safe_rank_p14/finalize_pretruth_checkpoint_p14_transport_v3.py
          test "$(git hash-object orbittrace_core_halo_p13_literature/run_p13_matched_launcher_v3.sh)" = '1fb46484a51bb7d7edd60c865dcf5341550277a1'
          python orbittrace_support_safe_rank_p14/generate_matched_pretruth_direct_v3.py orbittrace_core_halo_p13_literature/run_p13_matched_launcher_v3.sh /tmp/p14_direct_v3.sh
          bash -n /tmp/p14_direct_v3.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p14_direct_v3.sh').read_text()
          required=(
              'PASS_P14_DIRECT_AUDITED_SNM_ID_TRANSPORT_ACTIVE',
              'f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae',
              '55a1efed550498d51b859ffec555797ba8473d7d8b5f20ad6831c5f15b43b415',
              'apply_p12_snm_id_transport_from_v2.py',
              '--base-p14-finalizer /tmp/finalize_p14_checkpoint_base.py',
              "p14_p12_snm_id_transport_scientific_delta'] is False",
              'PASS_P14_BOTH_MATCHED_CHECKPOINTS_FROZEN_BEFORE_TRUTH_OR_CLUSTER_VALUES',
              'exit 0',
          )
          for x in required: assert x in p,x
          for x in ('OPEN TRUTH + COMPETITOR CLUSTER VALUES EXACTLY ONCE','evaluate_frozen_blindsafe.py','finalize_p3_evaluator_result.py','OrbitTrace-April','target_coordinate'):
              assert x not in p,x
          exact_exec='python orbittrace_support_safe_rank_p14/apply_p12_snm_id_transport_from_v2.py /tmp/p12_panel_v2.py /tmp/p12_panel.py'
          assert p.count(exact_exec)==1
          assert p.count("progress 'P14 HARD TWO-PANEL PRETRUTH BARRIER — STOP BEFORE TRUTH'")==1
          print('PASS_P14_DIRECT_V3_TRANSPORT_INTEGRATION_SOURCE_AUDIT')
          PY
          bash -n orbittrace_support_safe_rank_p14/run_matched_pretruth_direct_v1.sh
          echo PASS_P14_MATCHED_V3_RUNTIME_AND_LAUNCHER_SOURCE_FREEZE
          echo NO_COMPARATOR_ARTIFACT_NO_ARCHIVE_NO_TRUTH_NO_EXTERNAL_NO_TARGET_ACCESS
