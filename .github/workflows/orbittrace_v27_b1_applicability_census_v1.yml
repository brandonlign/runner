name: OrbitTrace v27 exact B1 applicability census
on:
  pull_request:
    branches: [agent/orbittrace-v27-background-odds-evidence-oof-ranker-dev-v1]
    paths:
      - 'orbittrace_v27_b1_applicability_census_v1/**'
      - '.github/workflows/orbittrace_v27_b1_applicability_census_v1.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
env: {PYTHONUNBUFFERED: '1', OMP_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1', MKL_NUM_THREADS: '1', NUMEXPR_NUM_THREADS: '1'}
jobs:
  census:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/orbittrace-v27-b1-applicability-census-v1}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: c9d6c44704013ba0c9430100e98a29a56b453304, path: frozen-v8}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact runtime and reconstruct B1
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/ranker input/model input/prepare input/b1deps/orbittrace_cross_year_seed_support_expansion_v1 input/b1deps/orbittrace_cross_year_conformal_density_expansion_v3 input/b1deps/orbittrace_cross_year_trajectory_conformal_expansion_v4 output/v22-sugar output/v22-hdbscan output/census-sugar output/census-hdbscan
          touch input/b1deps/orbittrace_cross_year_seed_support_expansion_v1/__init__.py input/b1deps/orbittrace_cross_year_conformal_density_expansion_v3/__init__.py input/b1deps/orbittrace_cross_year_trajectory_conformal_expansion_v4/__init__.py
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py)
          test "$(cat frozen-v8/output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          git fetch --no-tags --depth=1 origin b9d945bce95a02ed5bb4499f541d5a010df898c1
          git show FETCH_HEAD:orbittrace_background_odds_membership_b1/run_development.py > input/b1deps/b1_runtime.py
          echo '8b848cad728ad2370d1bf538b3ccc7f71d1b65c1f8d483838374aa6e12bbbb0d  input/b1deps/b1_runtime.py' | sha256sum -c -
          git fetch --no-tags --depth=1 origin e87a61909f06b2c8f4e763a2f915d13b5c365620
          git show FETCH_HEAD:orbittrace_cross_year_seed_support_expansion_v1/run_development.py > input/b1deps/orbittrace_cross_year_seed_support_expansion_v1/run_development.py
          git fetch --no-tags --depth=1 origin c386f1570a82ce0ce9700e962bb650c3ba5af66e
          git show FETCH_HEAD:orbittrace_cross_year_conformal_density_expansion_v3/run_development.py > input/b1deps/orbittrace_cross_year_conformal_density_expansion_v3/run_development.py
          git fetch --no-tags --depth=1 origin d178ad4bca2991356bbafcd1b92b233ad2a25f44
          git show FETCH_HEAD:orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py > input/b1deps/orbittrace_cross_year_trajectory_conformal_density_expansion_v4.tmp || true
          git show FETCH_HEAD:orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py > input/b1deps/orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py
          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > input/b1deps/literature_comparators.py
          test "$(git hash-object input/b1deps/orbittrace_cross_year_seed_support_expansion_v1/run_development.py)" = '2f48496362494d600652ae35d721e3b107c19a22'
          test "$(git hash-object input/b1deps/orbittrace_cross_year_conformal_density_expansion_v3/run_development.py)" = 'a80f6d7c7f0b85bf8225bf790ed54ca667ee37f0'
          test "$(git hash-object input/b1deps/orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py)" = '1062645993ed6c568f883bae624e0f02e8e5fb54'
          test "$(git hash-object input/b1deps/literature_comparators.py)" = 'ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2'
          python -m py_compile orbittrace_v27_b1_applicability_census_v1/run_census.py
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-active-urc-ranker-source-export-v1, path: input/ranker, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31344632499}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-urc-final-full-gmn-ranker-v1, path: input/model, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31344776617}
      - name: Restore label-free rows
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9050107352/zip' -o input/prepare.zip
          echo '1296d757b5ea1dd94f9c9077fd769fdc8f00ec06d0881d8548fd1df4608344cc  input/prepare.zip' | sha256sum -c -
          unzip -q input/prepare.zip -d input/prepare
      - name: Regenerate fixed route payloads
        env: {PYTHONPATH: '.:input/ranker:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8'}
        run: |
          set -euo pipefail
          for route in sugar hdbscan; do
            python -u orbittrace_v22_sonotaco_grouped_oof_ranker_v1/prepare_pretruth.py --comparator "$route" --rows-2013 "input/prepare/${route}_2013.json" --rows-2014 "input/prepare/${route}_2014.json" --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 --ranker-source input/ranker/run_urc_union_ranker.py --original-model input/model/urc_final_ranker.joblib --output "output/v22-${route}"
          done
          echo 'be5f559f27c1a18dcda28c20b6197278473cdb458ddfd29ec61bc468e33c352a  output/v22-sugar/family_memberships.json' | sha256sum -c -
          echo '99640747e935df2f4a7c7983bdde843ea59e1814388b8418e040dc04628aee13  output/v22-hdbscan/family_memberships.json' | sha256sum -c -
      - name: Run exact truth-free B1 census
        env: {PYTHONPATH: 'input/b1deps:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8'}
        run: |
          set -euo pipefail
          for route in sugar hdbscan; do
            python -u orbittrace_v27_b1_applicability_census_v1/run_census.py --comparator "$route" --rows-2013 "input/prepare/${route}_2013.json" --rows-2014 "input/prepare/${route}_2014.json" --v22-root "output/v22-${route}" --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 --output "output/census-${route}"
          done
      - name: Record no-truth firewall
        if: always()
        run: |
          echo 'NO_TRUTH_OR_EVALUATION_STEP_EXISTS' > output/V27_B1_CENSUS_FIREWALL.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: orbittrace-v27-b1-applicability-census-v1, path: output, if-no-files-found: error, retention-days: 90}
