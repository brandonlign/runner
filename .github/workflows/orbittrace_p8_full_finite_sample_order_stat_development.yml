name: OrbitTrace P8 full finite-sample order-stat development

on:
  pull_request:
    branches:
      - agent/orbittrace-p8-full-finite-sample-order-stat-freeze
    paths:
      - orbittrace_full_finite_sample_order_stat_p8/RUN.md

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-p8-full-finite-sample-order-stat-development
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require one-file child and authoritative P7 scientific no-go
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'orbittrace_full_finite_sample_order_stat_p8/RUN.md'
          content="$(git show "$HEAD_SHA":orbittrace_full_finite_sample_order_stat_p8/RUN.md)"
          test "$(printf '%s\n' "$content" | sed -n '1p')" = 'EXECUTE_P8_AFTER_AUTHORITATIVE_P7_SCIENTIFIC_NO_GO'
          test "$(printf '%s\n' "$content" | sed -n '2p')" = '31295871142'
          test "$(printf '%s\n' "$content" | wc -l)" -eq 2

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9033122516" -o /tmp/p7-artifact-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/p7-artifact-metadata.json').read_text())
          assert m['id']==9033122516,m
          assert m['name']=='orbittrace-finite-sample-robust-floor-membership-p7-development',m
          assert m['workflow_run']['id']==31295871142,m
          assert m['digest']=='sha256:705b53bfca6a743af73d16852da3e880c28a650008c646982ff8af7560394f81',m
          assert not m['expired'],m
          print('PASS_P8_P7_ARTIFACT_METADATA')
          PY

          rm -rf /tmp/p7-prereq && mkdir -p /tmp/p7-prereq
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9033122516/zip" -o /tmp/p7-prereq.zip
          echo '705b53bfca6a743af73d16852da3e880c28a650008c646982ff8af7560394f81  /tmp/p7-prereq.zip' | sha256sum -c -
          unzip -q /tmp/p7-prereq.zip -d /tmp/p7-prereq
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/p7-prereq/finite_sample_robust_floor_membership_p7_development.json').read_text())
          assert r['verdict']=='FAIL_FINITE_SAMPLE_ROBUST_FLOOR_MEMBERSHIP_P7_NO_GO',r['verdict']
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['family_count']==226
          assert r['configuration']['parameter_search'] is False
          assert r['configuration']['p4_parameter_search'] is False
          assert r['configuration']['p5_parameter_search'] is False
          assert r['configuration']['p6_parameter_search'] is False
          assert r['configuration']['p7_parameter_search'] is False
          assert r['configuration']['p7_order_statistic_tuning'] is False
          assert r['configuration']['p7_robust_floor_min_seeds']==19
          assert r['configuration']['p6_final_all_family_model_used_for_decisions'] is False
          assert r['baseline_v8']['qualified_matches']==95
          assert r['baseline_v8']['recovered_at_100']==58
          assert abs(r['baseline_v8']['macro_f1']-0.1736657194465356)<1e-12
          assert abs(r['baseline_v8']['top100_dominant_precision']-0.6884631112636006)<1e-12
          assert abs(r['baseline_v8']['mrr']-0.045531138942766655)<1e-15
          assert r['p7']['qualified_matches']==92
          assert r['p7']['recovered_at_100']==58
          assert abs(r['p7']['macro_f1']-0.4095287141152058)<1e-12
          assert abs(r['p7']['top100_dominant_precision']-0.6928914189509618)<1e-12
          assert abs(r['p7_large_shower']['mean_recall']-0.2727007940342044)<1e-12
          assert abs(r['p7_large_shower']['mean_precision']-0.8855828524298333)<1e-12
          assert r['diagnostics']['assigned_nonseed_events']==24847
          assert r['diagnostics']['proposal_events']==24902
          assert r['diagnostics']['p7_second_order_statistic_reliable_directions']==50
          assert r['gates']['qualified_matches_no_regression'] is False
          assert r['gates']['recovery_at_100_no_regression'] is True
          assert r['gates']['top100_dominant_precision_at_least_065'] is True
          assert r['gates']['macro_f1_gain_at_least_008'] is True
          assert r['gates']['large_shower_mean_recall_at_least_15x_v8'] is True
          assert r['gates']['large_shower_mean_precision_at_least_085'] is True
          assert r['crossfit_pretruth_sha256']=='b8296067b65c88ab19f0aa9b70c6098fbe2d1622e624082a51ff1b00197df3ba'
          assert r['model_pretruth_sha256']=='8ac8b13ab025a636884d44a2b19d478c9de5c138c3da190f3dfe3d73490257eb'
          assert r['membership_pretruth_sha256']=='483d2dbbfb45bb254b50046f0367e766d8de09d2a5a233bf99a555ee86df9024'
          assert r['decisions_pretruth_sha256']=='eddfd7b51e92da2648ea8892630c748c4122c158fef9aee254e1daab7989e307'
          print('PASS_P8_AUTHORITATIVE_P7_SCIENTIFIC_NO_GO_PREREQUISITE')
          PY
          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_full_finite_sample_order_stat_p8/RUN.md

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: exact-v8
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct exact audited P8 and frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/{v3,v6,v8,dsh} output
          echo '7637b6fb310ee3f24f1de8479a34d10c594dc55471eee55b8854e1c28787e8dd  orbittrace_crossyear_two_view_membership_p2/run_development.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2_v1.py
          echo '169ed0a276cdcae628cd830130cfb03d6511a972df50d4dc10ffddfc1c8e05da  /tmp/p2_v1.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2_v1.py /tmp/p2_canonical_v2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2_canonical_v2.py' | sha256sum -c -
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2_canonical_v2.py /tmp/run_p3.py
          echo 'f6c4c5a76b8b3f35d434aed4f1fb15035be05c40d0e0531c343ff620f3ba8185  /tmp/run_p3.py' | sha256sum -c -
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/run_p3.py /tmp/run_p4.py
          echo '290c4f1b6401eaab6f182760eaeaa2f91cc994854febf465f58f7cacc5d73b2a  /tmp/run_p4.py' | sha256sum -c -
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/run_p4.py /tmp/run_p5.py
          echo 'b48b3e6a45a7a371eb8e73c70ee217a33a96c596c61b51ebb7dc9c7b60100456  /tmp/run_p5.py' | sha256sum -c -
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/run_p5.py /tmp/run_p6.py
          echo 'd32648136b58e2f777912d6403d9de3cbd091a8c23e16aedcda0b146f09f38c2  /tmp/run_p6.py' | sha256sum -c -
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/run_p6.py /tmp/run_p7.py
          echo '89cf23c9d58692aedfaf12a9c2b7de4a08d641e6326794d82872f2e18608df54  /tmp/run_p7.py' | sha256sum -c -
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/run_p7.py /tmp/run_p8.py
          expected_p8="$(tr -d '[:space:]' < orbittrace_full_finite_sample_order_stat_p8/SOURCE_SHA256)"
          test "$expected_p8" = 'd3bdcdaf18639e36cc02f5106b3a3c816f5e51eb19543f425717ba1c48a26470'
          echo "$expected_p8  /tmp/run_p8.py" | sha256sum -c -
          python -m py_compile /tmp/run_p8.py orbittrace_full_finite_sample_order_stat_p8/run_header_compatible.py

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          test "$(git -C exact-v8 rev-parse HEAD)" = 'c9d6c44704013ba0c9430100e98a29a56b453304'
          test "$(git -C exact-v8 hash-object orbittrace_pooled_year_centroid_v8/run_development.py)" = 'f248df78e1258b132b41aecca6a985a5eb782654'
          test "$(git -C exact-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          cp exact-v8/orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py input/v3/wavelet_episode_comparator.py
          test "$(git hash-object input/v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          PYTHONPATH="input/v3" python - <<'PY'
          import multi_anchor_energy_v3 as v3
          import wavelet_episode_comparator as brown
          assert callable(getattr(brown,'radiant_unit_vectors',None))
          assert callable(getattr(brown,'wavelet_episode_score',None))
          assert callable(getattr(v3,'episode_score_details',None))
          print('PASS_P8_EXACT_V8_EPISODE_RUNTIME_BINDING')
          PY

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" -o input/v6.zip
          echo '3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v6.zip' | sha256sum -c -
          unzip -q input/v6.zip -d input/v6
          echo 'f76b8448f299ccf078fc5978c0890b9a084f131080db8d2136b5e6dba77edc7b  input/v6/label_free_sparse_support_v6_families.json.gz' | sha256sum -c -

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009728299/zip" -o input/v8.zip
          echo '88d2d607e05d027015c338f7e23b64a6195e55ae24f1b2ac745f5e9bc6df599e  input/v8.zip' | sha256sum -c -
          unzip -q input/v8.zip -d input/v8
          echo 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b  input/v8/pooled_year_centroid_v8_development.json' | sha256sum -c -

          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > input/dsh/literature_comparators.py
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  input/dsh/literature_comparators.py' | sha256sum -c -
          python -m py_compile input/dsh/literature_comparators.py
          echo PASS_P8_EXACT_INPUT_IDENTITIES

      - name: Execute one-shot target-excluded P8 development
        env:
          PYTHONPATH: exact-v8:input/v3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python -u orbittrace_full_finite_sample_order_stat_p8/run_header_compatible.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --v6-structural-families-json-gz input/v6/label_free_sparse_support_v6_families.json.gz \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --v8-runner exact-v8/orbittrace_pooled_year_centroid_v8/run_development.py \
            --dsh-comparator input/dsh/literature_comparators.py \
            --output output
          cat output/FINITE_SAMPLE_10PCT_ORDER_STAT_MEMBERSHIP_P8_DEVELOPMENT.md

      - name: Enforce frozen P8 result and truth firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/finite_sample_10pct_order_stat_membership_p8_development.json').read_text())
          assert r['verdict'] in {'PASS_FINITE_SAMPLE_10PCT_ORDER_STAT_MEMBERSHIP_P8_DEVELOPMENT','FAIL_FINITE_SAMPLE_10PCT_ORDER_STAT_MEMBERSHIP_P8_NO_GO'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['family_count']==226
          assert r['configuration']['window_half_width_deg']==5.0
          assert r['configuration']['negative_minimum_per_direction']==128
          assert r['configuration']['responsibility_threshold']==0.5
          assert r['configuration']['parameter_search'] is False
          assert r['configuration']['p4_parameter_search'] is False
          assert r['configuration']['p5_parameter_search'] is False
          assert r['configuration']['p6_parameter_search'] is False
          assert r['configuration']['p8_parameter_search'] is False
          assert r['configuration']['p8_order_statistic_tuning'] is False
          assert r['configuration']['p8_order_statistic_alpha_source']=='P3_NEGATIVE_TAIL_MAX'
          assert abs(r['configuration']['p8_order_statistic_alpha']-0.10)<1e-15
          assert r['configuration']['p6_final_all_family_model_used_for_decisions'] is False
          assert r['configuration']['new_members_can_seed_growth'] is False
          assert r['configuration']['p3_fold_count']==5
          assert r['configuration']['p3_negative_tail_max']==0.10
          assert r['baseline_v8']['qualified_matches']==95
          assert r['baseline_v8']['recovered_at_100']==58
          assert abs(r['baseline_v8']['macro_f1']-0.1736657194465356)<1e-12
          assert abs(r['baseline_v8']['mrr']-0.045531138942766655)<1e-15
          assert abs(r['baseline_v8']['top100_dominant_precision']-0.6884631112636006)<1e-12
          integrity=(
              'v8_baseline_reproduced','exact_dsh_source_identity','p3_exact_five_crossfit_folds',
              'p3_crossfit_frozen_before_truth','p3_decisions_frozen_before_truth','p3_label_values_unread_until_membership_freeze',
              'p3_every_surviving_proposal_meets_seed_floor','p4_coordinate_envelope_frozen_before_truth',
              'p4_heldout_seeds_inside_own_envelope','p4_every_surviving_proposal_inside_two_view_seed_envelope',
              'p5_joint_seed_support_frozen_before_truth','p5_heldout_seeds_supported_by_frontier',
              'p5_every_surviving_proposal_jointly_supported_by_one_heldout_seed',
              'p6_all_five_runtime_crossfit_models_present','p6_same_crossfit_model_sets_floor_and_scores_candidate',
              'p6_final_all_family_model_not_used_for_proposal_scoring',
              'p8_exact_finite_sample_order_statistic_rank','p8_order_statistic_rank_within_seed_vector',
              'p8_order_statistic_exclusion_budget_not_exceeded','p8_rank_one_directions_keep_inherited_minimum_floor',
              'p8_every_surviving_proposal_meets_membership_floor','p8_no_p7_unreliable_direction_can_propose',
          )
          assert all(r['gates'][k] is True for k in integrity)
          assert len(r['crossfit_pretruth_sha256'])==64
          assert len(r['model_pretruth_sha256'])==64
          assert len(r['membership_pretruth_sha256'])==64
          assert len(r['decisions_pretruth_sha256'])==64
          assert r['diagnostics']['p6_candidate_scoring_runtime_folds']==[0,1,2,3,4]
          assert r['diagnostics']['p6_candidate_scoring_uses_final_all_family_model'] is False
          assert abs(r['diagnostics']['p8_order_statistic_alpha']-0.10)<1e-15
          assert r['diagnostics']['p8_rank_gt1_reliable_directions']==50
          assert r['diagnostics']['p8_rank_gt2_reliable_directions']==27
          assert r['diagnostics']['p8_max_membership_floor_rank'] >= 3
          assert all(a['label_value_accessed'] is False for a in r['geometry_audits'])
          assert all(a['label_value_accessed_only_after_blind_and_dedup'] is True for a in r['truth_audits'])
          print('ORBITTRACE_P8_RESULT_BEGIN')
          print(json.dumps({
              'verdict':r['verdict'],'baseline_v8':r['baseline_v8'],'p8':r['p8'],
              'baseline_large_shower':r['baseline_large_shower'],'p8_large_shower':r['p8_large_shower'],
              'gates':r['gates'],
              'diagnostics':{k:v for k,v in r['diagnostics'].items() if k not in {'direction_audits'}},
              'hashes':{'crossfit':r['crossfit_pretruth_sha256'],'model':r['model_pretruth_sha256'],'membership':r['membership_pretruth_sha256'],'decisions':r['decisions_pretruth_sha256']},
          },indent=2,sort_keys=True))
          print('ORBITTRACE_P8_RESULT_END')
          PY

      - name: Record immutable environment
        if: always()
        run: |
          set +e
          mkdir -p output
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum /tmp/run_p8.py orbittrace_full_finite_sample_order_stat_p8/PROTOCOL.md orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py orbittrace_full_finite_sample_order_stat_p8/run_header_compatible.py orbittrace_full_finite_sample_order_stat_p8/SOURCE_SHA256 input/dsh/literature_comparators.py > output/source_sha256.txt 2>/dev/null || true
          git -C exact-v8 rev-parse HEAD > output/exact_v8_commit.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-finite-sample-10pct-order-stat-membership-p8-development
          path: output
          if-no-files-found: error
          retention-days: 90
