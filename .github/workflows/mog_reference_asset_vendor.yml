name: Vendor Mog reference assets
on:
  pull_request:
    branches: [main]
    paths:
      - mog_reference_face_validation/scripts/extract_gnm_head.py
      - mog_reference_face_validation/scripts/render_gnm_reference_assets.py
      - cams_v2_single_line_schema_audit/**
      - .github/workflows/mog_reference_asset_vendor.yml
permissions: {contents: write}
concurrency:
  group: runner-registered-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  vendor:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mog-reference-face-finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: echo 'Mog route preserved; not selected on this branch.'
  cams-v2-single-line-schema:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/cams-v2-single-line-schema-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'requests==2.32.5' 'pypdf==6.5.0'
      - run: python -m py_compile cams_v2_single_line_schema_audit/run_schema_audit.py
      - name: Run frozen source-schema gate
        run: |
          mkdir -p output
          python cams_v2_single_line_schema_audit/run_schema_audit.py --output output
          cat output/RESULT.md
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum cams_v2_single_line_schema_audit/PROTOCOL.md cams_v2_single_line_schema_audit/run_schema_audit.py > output/source_sha256.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: historical-cams-v2-single-line-schema, path: output, if-no-files-found: error, retention-days: 90}
