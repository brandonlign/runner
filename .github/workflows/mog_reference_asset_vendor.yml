name: Vendor Mog reference assets

on:
  pull_request:
    branches:
      - main
    paths:
      - mog_reference_face_validation/scripts/extract_gnm_head.py
      - mog_reference_face_validation/scripts/render_gnm_reference_assets.py
      - cams_v2_tabular_link_manifest/**
      - .github/workflows/mog_reference_asset_vendor.yml

permissions:
  contents: write

concurrency:
  group: runner-registered-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mog-reference-face-finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic render dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib pillow
      - name: Extract and render licensed GNM assets
        run: |
          python mog_reference_face_validation/scripts/extract_gnm_head.py
          python mog_reference_face_validation/scripts/render_gnm_reference_assets.py
      - name: Validate generated files
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('mog_reference_face_validation/generated')
          report=json.loads((root/'gnm_reference_assets.json').read_text())
          assert report['sourceLicense']=='Apache-2.0'
          assert report['surfaceGroup']=='skin_exterior'
          assert 10_000 <= report['vertexCount'] <= 13_000
          assert 20_000 <= report['triangleCount'] <= 26_000
          for view in ('front','profile'):
              item=report['assets'][view]; path=root/item['file']
              assert path.exists() and path.stat().st_size==item['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256']
              assert 40_000 <= item['bytes'] <= 180_000
          PY
      - name: Commit assets to validation branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mog_reference_face_validation/generated/gnm_reference_front.webp mog_reference_face_validation/generated/gnm_reference_profile.webp mog_reference_face_validation/generated/gnm_reference_assets.json mog_reference_face_validation/generated/gnm_head_skin_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Vendor final GNM reference assets for Mog'
            git pull --rebase origin "${{ github.head_ref }}"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

  cams-v2-tabular-link-manifest:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/cams-v2-tabular-link-manifest'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependency
        run: python -m pip install 'requests==2.32.5'
      - name: Compile frozen page manifest
        run: python -m py_compile cams_v2_tabular_link_manifest/run_manifest.py
      - name: Run page-only manifest
        run: |
          mkdir -p output
          python cams_v2_tabular_link_manifest/run_manifest.py --output output
          cat output/RESULT.md
      - name: Verify authoritative result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('output/tabular_link_manifest.json').read_text())
          assert result['verdict']=='PASS_CAMSV2_TABULAR_LINK_MANIFEST'
          assert all(result['gates'].values())
          assert result['discovered_resources_requested'] is False
          assert result['meteor_values_read'] is False
          assert result['label_values_read'] is False
          assert result['reserved_panels_read'] is False
          PY
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum cams_v2_tabular_link_manifest/PROTOCOL.md cams_v2_tabular_link_manifest/run_manifest.py > output/source_sha256.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cams-v2-tabular-link-manifest
          path: output
          if-no-files-found: error
          retention-days: 90
