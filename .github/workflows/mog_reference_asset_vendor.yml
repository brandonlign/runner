name: Vendor Mog reference assets

on:
  pull_request:
    branches: [main]
    paths:
      - mog_reference_face_validation/scripts/extract_gnm_head.py
      - mog_reference_face_validation/scripts/render_gnm_reference_assets.py
      - cams_v2_tabular_feasibility_v2/**
      - .github/workflows/mog_reference_asset_vendor.yml

permissions:
  contents: write

concurrency:
  group: runner-registered-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mog-reference-face-finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy matplotlib pillow
      - run: |
          python mog_reference_face_validation/scripts/extract_gnm_head.py
          python mog_reference_face_validation/scripts/render_gnm_reference_assets.py
      - run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('mog_reference_face_validation/generated'); x=json.loads((r/'gnm_reference_assets.json').read_text())
          assert x['sourceLicense']=='Apache-2.0' and x['surfaceGroup']=='skin_exterior'
          assert 10000<=x['vertexCount']<=13000 and 20000<=x['triangleCount']<=26000
          for v in ('front','profile'):
              i=x['assets'][v]; p=r/i['file']; assert p.stat().st_size==i['bytes']; assert hashlib.sha256(p.read_bytes()).hexdigest()==i['sha256']
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mog_reference_face_validation/generated/
          if ! git diff --cached --quiet; then git commit -m 'Vendor final GNM reference assets for Mog'; git pull --rebase origin "${{ github.head_ref }}"; git push origin "HEAD:${{ github.head_ref }}"; fi

  cams-v2-tabular-structural-v2:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/cams-v2-tabular-feasibility-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen dependency
        run: python -m pip install 'requests==2.32.5'
      - name: Compile frozen parser v2
        run: python -m py_compile cams_v2_tabular_feasibility_v2/run_structural_audit_v2.py
      - name: Run structural parser v2
        run: |
          mkdir -p output
          python cams_v2_tabular_feasibility_v2/run_structural_audit_v2.py --output output
          cat output/RESULT.md
      - name: Verify result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/tabular_structural_feasibility_v2.json').read_text())
          assert r['verdict']=='PASS_HISTORICAL_CAMSV2_TABULAR_STRUCTURAL_FEASIBILITY_V2' and all(r['gates'].values())
          for k in ('workbook_member_content_opened','single_line_text_decoded','single_line_records_read','documentation_pdf_parsed','meteor_values_read','label_values_read','later_california_records_read','benelux_meteor_values_read','sonotaco_2024_read','camsv3_2016_values_read'): assert r[k] is False
          PY
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum cams_v2_tabular_feasibility_v2/PROTOCOL.md cams_v2_tabular_feasibility_v2/run_structural_audit_v2.py > output/source_sha256.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: historical-cams-v2-tabular-structural-v2, path: output, if-no-files-found: error, retention-days: 90}
