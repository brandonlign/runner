name: Vendor Mog reference assets

on:
  pull_request:
    branches:
      - main
    paths:
      - mog_reference_face_validation/scripts/extract_gnm_head.py
      - mog_reference_face_validation/scripts/render_gnm_reference_assets.py
      - .github/workflows/mog_reference_asset_vendor.yml

permissions:
  contents: write

concurrency:
  group: mog-reference-assets-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mog-reference-face-finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic render dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib pillow

      - name: Extract and render licensed GNM assets
        run: |
          python mog_reference_face_validation/scripts/extract_gnm_head.py
          python mog_reference_face_validation/scripts/render_gnm_reference_assets.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('mog_reference_face_validation/generated')
          report = json.loads((root / 'gnm_reference_assets.json').read_text())
          assert report['sourceLicense'] == 'Apache-2.0'
          assert report['vertexCount'] == 12466
          assert report['triangleCount'] == 24820
          for view in ('front', 'profile'):
              item = report['assets'][view]
              path = root / item['file']
              assert path.exists()
              assert path.stat().st_size == item['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
              assert 40_000 <= item['bytes'] <= 180_000
          print(json.dumps(report, indent=2))
          PY

      - name: Commit assets to validation branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            mog_reference_face_validation/generated/gnm_reference_front.webp \
            mog_reference_face_validation/generated/gnm_reference_profile.webp \
            mog_reference_face_validation/generated/gnm_reference_assets.json \
            mog_reference_face_validation/generated/gnm_head_skin_report.json
          if git diff --cached --quiet; then
            echo 'GNM reference assets already current.'
          else
            git commit -m 'Vendor final GNM reference assets for Mog'
            git pull --rebase origin "${{ github.head_ref }}"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
