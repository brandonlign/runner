name: OrbitTrace recurrent local TopoModal trunk v1 exact-row binding

on:
  pull_request:
    branches: [agent/orbittrace-recurrent-local-topomodal-trunk-v1-exact-row-transport]
    paths: ['orbittrace_recurrent_local_topomodal_trunk_v1/EXACT_ROW_BINDING_ACTIVATE.md']

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: 312b1b718ae105813de242355142a74e7d377d65, path: sparse-src}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: c9d6c44704013ba0c9430100e98a29a56b453304, path: frozen-v8}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit unchanged science and validated exact transport
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/PROTOCOL.md)" = 'de8d040a1f9d3b0825ce56532efd5950acefc689'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py)" = '32abfb3e68520cfdc83585a88731fa3982900cde'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/build_prelabel.py)" = 'cd3fb15263fd4b2e38e4b413ece9b347b64816d5'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/evaluate_truth.py)" = '749a527b7a9ee3c5f1a70832669d83fa1af592d7'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/technical_lazy_local_trunk.py)" = '79cc2e51929fd60f8e17faec4c1b04c19e43010e'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/technical_exact_full_row_transport.py)" = '81e4833ac24bb90fe810b0444da534906b10e798'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/technical_build_prelabel_exact_full_row.py)" = '2fbcbbab3a70cb4ef1971206ecbe570b9752d34a'
          python -m py_compile orbittrace_recurrent_local_topomodal_trunk_v1/{export_geometry.py,build_prelabel.py,evaluate_truth.py,technical_lazy_local_trunk.py,technical_exact_full_row_transport.py,technical_build_prelabel_exact_full_row.py}
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/{v3,ranker,v8,parent,audit} output/{geometry,prelabel}
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null)
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-active-urc-ranker-source-export-v1, path: input/ranker, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31344632499}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-pooled-year-centroid-v8-development, path: input/v8, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31217916558}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry, path: input/parent, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31852836840}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-local-trunk-exact-full-row-transport-audit-v1, path: input/audit, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 32191528958}
      - name: Rebind immutable parent and transport audit
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json | cut -d' ' -f1)" = 'efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = 'ca6aeed2b82739003ea5d39b59e869df876de2962164344a938fe4935ea38711'
          test "$(sha256sum input/audit/EXACT_FULL_ROW_TRANSPORT_AUDIT.json | cut -d' ' -f1)" = '6a64f8a3b733bdb50986027d837ae82c6598c364b8dbddea1deea3f5ca7c0692'
          python - <<'PY'
          import json
          a=json.load(open('input/audit/EXACT_FULL_ROW_TRANSPORT_AUDIT.json'));p=json.load(open('input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json'));r=json.load(open('input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json'))
          assert a['verdict']=='PASS_LOCAL_TRUNK_EXACT_ROW_TRANSPORT_AUDIT' and a['all_exact'] is True and a['selection']['audited_unique_parent_count']==2028
          assert a['shower_truth_used'] is False and a['target_information_access'] is False and a['target_region_events_accessed'] is False and a['external_scientific_access'] is False
          assert p['successor_candidate_count']==2094 and p['successor_ordered_membership_sha256']=='e8f374ad03e7072463118ee6440a54d96d11e3aab17202cfe336f866530224f2'
          assert r['verdict']=='PASS_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT'
          PY
      - name: Export exact label-free target-excluded geometry
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:sparse-src
        run: |
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json
      - name: Build and seal frozen prelabel through exact full-row transport
        env:
          PYTHONPATH: .:orbittrace_recurrent_local_topomodal_trunk_v1
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/technical_build_prelabel_exact_full_row.py \
            --protocol orbittrace_recurrent_local_topomodal_trunk_v1/PROTOCOL.md \
            --geometry output/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json \
            --parent-prelabel input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --parent-result input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            --output output/prelabel/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json
          sha256sum output/prelabel/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json | tee output/prelabel/PRELABEL_SHA256.txt
          python - <<'PY'
          import json
          p=json.load(open('output/prelabel/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json'))
          assert p['scientific_role']=='PRELABEL_TARGET_EXCLUDED_FIXED_RANK_MEMBERSHIP_REPRESENTATION'
          assert p['shower_truth_used'] is False and p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert p['parent_candidate_count']==p['successor_candidate_count']==2094
          assert p['catalogue_slot_order_unchanged'] and p['every_successor_subset_of_same_rank_parent'] and p['successor_slots_pairwise_event_disjoint']
          print({'changed_slot_count':p['changed_slot_count'],'mechanism_active':p['mechanism_active'],'successor_ordered_membership_sha256':p['successor_ordered_membership_sha256']})
          PY
          printf '%s\n' "$GITHUB_SHA" > output/prelabel/execution_commit.txt
          printf '%s\n' "$GITHUB_RUN_ID" > output/prelabel/execution_run_id.txt
          printf '%s\n' 'VALIDATED_EXACT_FULL_ROW_TRANSPORT' > output/prelabel/execution_transport.txt
      - uses: actions/upload-artifact@v4
        with: {name: orbittrace-recurrent-local-topomodal-trunk-v1-prelabel-exact-row, path: output/prelabel, if-no-files-found: error, retention-days: 90}

  truth:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: 312b1b718ae105813de242355142a74e7d377d65, path: sparse-src}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: c9d6c44704013ba0c9430100e98a29a56b453304, path: frozen-v8}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit unchanged frozen truth evaluator and install exact runtime
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/PROTOCOL.md)" = 'de8d040a1f9d3b0825ce56532efd5950acefc689'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/evaluate_truth.py)" = '749a527b7a9ee3c5f1a70832669d83fa1af592d7'
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/{v3,ranker,v8,parent,sealed} output/truth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null)
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-active-urc-ranker-source-export-v1, path: input/ranker, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31344632499}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-pooled-year-centroid-v8-development, path: input/v8, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31217916558}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry, path: input/parent, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31852836840}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-recurrent-local-topomodal-trunk-v1-prelabel-exact-row, path: input/sealed}
      - name: Rebind sealed prelabel
        run: |
          set -euo pipefail
          test "$(cut -d' ' -f1 input/sealed/PRELABEL_SHA256.txt)" = "$(sha256sum input/sealed/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json | cut -d' ' -f1)"
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python - <<'PY'
          import json
          p=json.load(open('input/sealed/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json'))
          assert p['shower_truth_used'] is False and p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert p['parent_candidate_count']==p['successor_candidate_count']==2094 and p['catalogue_slot_order_unchanged'] and p['every_successor_subset_of_same_rank_parent'] and p['successor_slots_pairwise_event_disjoint']
          PY
      - name: Run first complete binding truth evaluation
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:sparse-src
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/evaluate_truth.py \
            --prelabel input/sealed/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_PRELABEL.json \
            --parent-prelabel input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --parent-result input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_BINDING_RESULT.json
          sha256sum output/truth/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_BINDING_RESULT.json > output/truth/RESULT_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > output/truth/execution_commit.txt
          printf '%s\n' "$GITHUB_RUN_ID" > output/truth/execution_run_id.txt
      - name: Enforce binding result and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/truth/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_BINDING_RESULT.json'))
          assert r['verdict'] in {'PASS_RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1','FAIL_RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1'}
          assert r['total_gate_count']==16 and len(r['gates'])==16
          assert r['binding_retrieval_metric']=='zero_filled_eligible_query_mrr' and r['historical_conditional_mrr_is_diagnostic_only'] is True
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_2013_2014_access'] is False and r['asfn_event_level_access'] is False and r['efn_event_level_access'] is False and r['amos_scientific_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False and r['post_result_parameter_search'] is False
          print(r['verdict']);print(json.dumps({'passed_gate_count':r['passed_gate_count'],'changed_slot_count':r['changed_slot_count'],'annual_gates':r['annual_gates'],'global_gates':r['global_gates'],'parent_metrics':{y:{k:v for k,v in m.items() if k!='first_rank_by_label'} for y,m in r['parent_metrics'].items()},'successor_metrics':{y:{k:v for k,v in m.items() if k!='first_rank_by_label'} for y,m in r['successor_metrics'].items()}},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: orbittrace-recurrent-local-topomodal-trunk-v1-binding-exact-row, path: output/truth, if-no-files-found: error, retention-days: 90}
