name: OrbitTrace v6 direct-finalize recovery

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-direct-finalize-recovery
    paths:
      - orbittrace_v6_direct_finalize_recovery/RUN.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-v6-direct-finalize-recovery
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  authorize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Require one-file recovery child and completed exact artifact set
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init /tmp/guard >/dev/null
          cd /tmp/guard
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = 'orbittrace_v6_direct_finalize_recovery/RUN.md'
          test "$(git show "$HEAD_SHA":orbittrace_v6_direct_finalize_recovery/RUN.md)" = 'EXECUTE_DIRECT_FINALIZE_FROM_FANOUT_31282128101'
          # All expensive science inputs must already exist from the original fanout.
          for year in 2022 2023; do
            gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name "orbittrace-v6-fanout-preexact-$year" --dir "/tmp/pre$year"
            for i in 0 1 2 3 4 5; do
              gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name "orbittrace-v6-fanout-exact-$year-$i" --dir "/tmp/exact$year"
            done
          done
          test -f /tmp/pre2022/v6_preexact_2022.pkl
          test -f /tmp/pre2023/v6_preexact_2023.pkl
          test "$(find /tmp/exact2022 -name 'v6_exact_2022_shard_*.pkl' | wc -l)" -eq 6
          test "$(find /tmp/exact2023 -name 'v6_exact_2023_shard_*.pkl' | wc -l)" -eq 6
          echo PASS_DIRECT_FINALIZE_RECOVERY_AUTHORIZATION

  finalize-year:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        year: [2022, 2023]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-direct-finalize-recovery
          path: execution
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v6/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r frozen-v6/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Restore exact repaired v6 runtime
        run: |
          set -euo pipefail
          cd frozen-v6
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          cat orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.frozen.py' | sha256sum -c -
          cd ..
          PYTHONPATH=execution python - <<'PY'
          from pathlib import Path
          from orbittrace_v6_checkpointed_fallback.common import apply_exact_two_line_repair
          d=apply_exact_two_line_repair(Path('/tmp/v6.frozen.py'),Path('/tmp/v6.repaired.py'))
          assert d=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24',d
          print('PASS_EXACT_REPAIRED_V6',d)
          PY
      - name: Restore authoritative preexact and exact artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p preexact exact output
          gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name 'orbittrace-v6-fanout-preexact-${{ matrix.year }}' --dir preexact
          for i in 0 1 2 3 4 5; do
            gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name "orbittrace-v6-fanout-exact-${{ matrix.year }}-$i" --dir exact
          done
      - name: Recalibrate, prove stored proposal identity, and finalize exact outputs
        env:
          PYTHONPATH: execution:frozen-v6/orbittrace_wavelet_catalogue_v3:frozen-v6/orbittrace_multi_anchor_energy_v3:/tmp
        run: |
          set -euo pipefail
          python -u execution/orbittrace_v6_direct_finalize_recovery/finalize_year.py \
            --year '${{ matrix.year }}' \
            --preexact preexact/v6_preexact_${{ matrix.year }}.pkl \
            --exact-dir exact \
            --repaired-source /tmp/v6.repaired.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 \
            --output output
          cat output/v6_year_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v6-direct-finalize-year-${{ matrix.year }}
          path: output
          if-no-files-found: error
          retention-days: 90

  combine:
    needs: finalize-year
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-direct-finalize-recovery
          path: execution
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v6/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r frozen-v6/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v6-direct-finalize-year-2022
          path: checkpoints/2022
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v6-direct-finalize-year-2023
          path: checkpoints/2023
      - name: Restore exact repaired v6 runtime and fixed4 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd frozen-v6
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          cat orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          cd ..
          PYTHONPATH=execution python - <<'PY'
          from pathlib import Path
          from orbittrace_v6_checkpointed_fallback.common import apply_exact_two_line_repair
          d=apply_exact_two_line_repair(Path('/tmp/v6.frozen.py'),Path('/tmp/v6.repaired.py'))
          assert d=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          PY
          mkdir -p fixed4 frozen-v6/output_direct_finalize
          gh run download 31106001133 --repo "$GITHUB_REPOSITORY" --name orbittrace-fixed4-support-normalized-wrapper-development --dir fixed4
          test -f fixed4/orbittrace_fixed4_support_wrapper_development.json
      - name: Replay recovered checkpoints through unchanged repaired main
        env:
          PYTHONPATH: execution:frozen-v6/orbittrace_wavelet_catalogue_v3:frozen-v6/orbittrace_multi_anchor_energy_v3:/tmp
        run: |
          set -euo pipefail
          python -u execution/orbittrace_v6_checkpointed_fallback/combine_with_checkpoints.py \
            --repaired-source /tmp/v6.repaired.py \
            --checkpoint-2022 checkpoints/2022/v6_year_2022.pkl \
            --checkpoint-2023 checkpoints/2023/v6_year_2023.pkl \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 \
            --fixed4-baseline-json fixed4/orbittrace_fixed4_support_wrapper_development.json \
            --output frozen-v6/output_direct_finalize
          cat frozen-v6/output_direct_finalize/V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('frozen-v6/output_direct_finalize/v3_primary_catalogue_v6_development.json').read_text())
          assert r['verdict'] in {'PASS_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT','FAIL_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['primary_alpha']==0.05
          assert all(a['proposal_cap_per_window']==512 for a in r['year_audits'])
          assert all(a['max_primary_proposals_per_year']==36864 for a in r['year_audits'])
          print('ORBITTRACE_V6_DIRECT_FINALIZE_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'evaluation':{k:v for k,v in r['evaluation'].items() if k!='per_label'},'gates':r['gates'],'year_audits':r['year_audits']},indent=2))
          print('ORBITTRACE_V6_DIRECT_FINALIZE_RESULT_END')
          PY
      - name: Record immutable recovery provenance
        if: always()
        run: |
          set +e
          mkdir -p frozen-v6/output_direct_finalize
          python --version > frozen-v6/output_direct_finalize/python_version.txt
          python -m pip freeze > frozen-v6/output_direct_finalize/environment.txt
          sha256sum execution/orbittrace_v6_direct_finalize_recovery/finalize_year.py execution/orbittrace_v6_checkpointed_fallback/*.py > frozen-v6/output_direct_finalize/recovery_source_sha256.txt 2>/dev/null || true
          printf '%s\n' '31282128101' > frozen-v6/output_direct_finalize/source_fanout_run_id.txt
          printf '%s\n' 'Original replay failed because regenerated nearest-neighbor proposal identities differed at center 0.0. Recovery uses original captured proposal records and exact outputs, with all stored Brown/fixed4 proposal p-values reverified against fresh deterministic calibration before direct frozen post-rescore finalization.' > frozen-v6/output_direct_finalize/RECOVERY_NOTE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v6-direct-finalize-development
          path: frozen-v6/output_direct_finalize
          if-no-files-found: error
          retention-days: 90
