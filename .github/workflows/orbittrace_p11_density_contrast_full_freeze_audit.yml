name: OrbitTrace P11 density-contrast full freeze audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p10-floor-consistent-geometry-freeze
    paths:
      - orbittrace_density_contrast_p11/**
      - .github/workflows/orbittrace_p11_density_contrast_full_freeze_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct and verify exact frozen P11 source
        run: |
          set -euo pipefail
          test "$(cat orbittrace_density_contrast_p11/SOURCE_SHA256)" = '67a66da31c1987c6cea634d4e3fbdee77544ce7c2c604947ae1523b5c6622a95'
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2.py' | sha256sum -c -
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          echo 'f6c4c5a76b8b3f35d434aed4f1fb15035be05c40d0e0531c343ff620f3ba8185  /tmp/p3.py' | sha256sum -c -
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          echo '290c4f1b6401eaab6f182760eaeaa2f91cc994854febf465f58f7cacc5d73b2a  /tmp/p4.py' | sha256sum -c -
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          echo 'b48b3e6a45a7a371eb8e73c70ee217a33a96c596c61b51ebb7dc9c7b60100456  /tmp/p5.py' | sha256sum -c -
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          echo 'd32648136b58e2f777912d6403d9de3cbd091a8c23e16aedcda0b146f09f38c2  /tmp/p6.py' | sha256sum -c -
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          echo '89cf23c9d58692aedfaf12a9c2b7de4a08d641e6326794d82872f2e18608df54  /tmp/p7.py' | sha256sum -c -
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          echo 'd3bdcdaf18639e36cc02f5106b3a3c816f5e51eb19543f425717ba1c48a26470  /tmp/p8.py' | sha256sum -c -
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          echo '58330c61cf4039f07e80a9746d00eb7281b4e28e674a131d6333e6378695ae31  /tmp/p9.py' | sha256sum -c -
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          echo '638b4f41e51955436557a99f1142c3d3cea91e12a66e2f74925c6bfb79d5e50d  /tmp/p10.py' | sha256sum -c -
          python orbittrace_density_contrast_p11/apply_p11_patch_v2.py /tmp/p10.py /tmp/run_p11.py
          echo '67a66da31c1987c6cea634d4e3fbdee77544ce7c2c604947ae1523b5c6622a95  /tmp/run_p11.py' | sha256sum -c -
          python -m py_compile /tmp/run_p11.py orbittrace_density_contrast_p11/apply_p11_patch.py orbittrace_density_contrast_p11/apply_p11_patch_v2.py orbittrace_density_contrast_p11/run_header_compatible.py
          echo PASS_P11_EXACT_FROZEN_SOURCE_IDENTITY

      - name: Audit wrapper and frozen protocol
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          wrapper=Path('orbittrace_density_contrast_p11/run_header_compatible.py').read_text()
          protocol=Path('orbittrace_density_contrast_p11/PROTOCOL.md').read_text()
          for token in (
              "EXPECTED_P11_SOURCE = Path('/tmp/run_p11.py')",
              'import gmn_python_api.data_directory as mt',
              'get_monthly_file_content_by_date',
              'for attempt in range(3):',
              'requests.exceptions.ConnectionError, requests.exceptions.Timeout',
              'module.exact_header_positions = compatible_exact_header_positions',
              'PASS_P11_HEADER_WHITESPACE_COMPAT_SELF_TEST',
              'PASS_P11_SAME_REQUEST_GMN_TRANSPORT_RESILIENCE_MAX3',
          ):
              assert token in wrapper,token
          assert 'meteor_trajectory' not in wrapper
          assert 'for attempt in range(4):' not in wrapper and 'for attempt in range(6):' not in wrapper
          for token in ('5230285375','5230292345','5230298947','5230302320','No gate may be weakened after execution'):
              assert token in protocol,token
          for forbidden in ('OrbitTrace-April','target_coordinate'):
              assert forbidden not in wrapper and forbidden not in protocol,forbidden
          print('PASS_P11_WRAPPER_AND_PROTOCOL_FULL_FREEZE_AUDIT')
          PY

      - name: Assert no execution marker or target path
        run: |
          set -euo pipefail
          test ! -e orbittrace_density_contrast_p11/RUN.md
          test ! -e target
          echo NO_P11_TRUTH_EXECUTION_NO_TARGET_ACCESS
