name: OrbitTrace local TopoModal trunk v1 batched technical probe

on:
  push:
    branches: [agent/orbittrace-recurrent-local-topomodal-trunk-v1-activate]
    paths:
      - '.github/workflows/orbittrace_recurrent_local_topomodal_trunk_v1_batched_probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  geometry:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 312b1b718ae105813de242355142a74e7d377d65
          path: sparse-src
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit frozen science and install geometry runtime
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/PROTOCOL.md)" = 'de8d040a1f9d3b0825ce56532efd5950acefc689'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py)" = '32abfb3e68520cfdc83585a88731fa3982900cde'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/build_prelabel.py)" = 'cd3fb15263fd4b2e38e4b413ece9b347b64816d5'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/evaluate_truth.py)" = '749a527b7a9ee3c5f1a70832669d83fa1af592d7'
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/ranker input/v8 output/geometry
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Export exact frozen label-free geometry
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:sparse-src
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json
          python - <<'PY'
          import json
          g=json.load(open('output/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json'))
          assert g['events_total']==738682 and g['events_by_year']=={'2022':315024,'2023':423658}
          assert g['event_universe_sha256']=='c97f735e7264918d040ee19a54f3f139c9e8910039d089a5753039bfb247038b'
          assert g['shower_truth_exported'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-local-trunk-v1-exact-geometry-cache
          path: output/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json
          if-no-files-found: error
          retention-days: 7

  equivalence:
    needs: geometry
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rank: [50, 100, 500]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit exact frozen and technical sources
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/build_prelabel.py)" = 'cd3fb15263fd4b2e38e4b413ece9b347b64816d5'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/technical_batched_local_trunk.py)" = '3d52b5da681cac4b4e5063c3558f824600bb4161'
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'gudhi==3.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-local-trunk-v1-exact-geometry-cache
          path: input/geometry
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852836840
      - name: Require exact batched/original equivalence
        env:
          PYTHONPATH: orbittrace_recurrent_local_topomodal_trunk_v1
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/technical_batched_local_trunk.py \
            --geometry input/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json \
            --parent-prelabel input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --rank ${{ matrix.rank }} --compare-original > equivalence-${{ matrix.rank }}.json
          grep -q '"exact_original_equivalence":true' equivalence-${{ matrix.rank }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-local-trunk-v1-equivalence-rank-${{ matrix.rank }}
          path: equivalence-${{ matrix.rank }}.json
          if-no-files-found: error
          retention-days: 30

  rank1:
    needs: geometry
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit exact frozen and technical sources
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/build_prelabel.py)" = 'cd3fb15263fd4b2e38e4b413ece9b347b64816d5'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/technical_batched_local_trunk.py)" = '3d52b5da681cac4b4e5063c3558f824600bb4161'
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'gudhi==3.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-local-trunk-v1-exact-geometry-cache
          path: input/geometry
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852836840
      - name: Probe exact batched implementation on blocking rank 1 only
        env:
          PYTHONPATH: orbittrace_recurrent_local_topomodal_trunk_v1
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/technical_batched_local_trunk.py \
            --geometry input/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json \
            --parent-prelabel input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --rank 1 > rank1-batched.json
          python - <<'PY'
          import json
          r=json.load(open('rank1-batched.json'))
          assert r['rank']==1 and r['parent_n']==32458
          print({'rank':r['rank'],'parent_n':r['parent_n'],'final_n':len(r['final_ids']),'decision':r['summary']['decision'],'degree_max':r['summary']['radius_degree_max']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-local-trunk-v1-rank1-batched-probe
          path: rank1-batched.json
          if-no-files-found: error
          retention-days: 30
