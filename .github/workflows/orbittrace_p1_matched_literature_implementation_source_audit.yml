name: OrbitTrace P1 matched literature implementation source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p1-matched-literature-freeze
    paths:
      - orbittrace_probabilistic_membership_p1_literature/prepare_strict_id_manifest.py
      - orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py
      - .github/workflows/orbittrace_p1_matched_literature_implementation_source_audit.yml

permissions:
  contents: read

concurrency:
  group: orbittrace-p1-matched-literature-implementation-source-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-p1-matched-literature-implementation-freeze

      - name: Reconstruct exact frozen P1 source and compile transfer sources
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          parts=sorted(Path('orbittrace_probabilistic_membership_p1/source_parts').glob('part*.b64'))
          assert [p.name for p in parts]==['part00.b64','part01.b64']
          src=gzip.decompress(base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts),validate=True))
          got=hashlib.sha256(src).hexdigest()
          assert got=='e7847e067bab8d07038c998359ccbf0ca6e2ccf257f27f27f4aef999cc7a0508',got
          Path('/tmp/p1_frozen.py').write_bytes(src)
          PY
          python -m py_compile \
            /tmp/p1_frozen.py \
            orbittrace_probabilistic_membership_p1_literature/prepare_strict_id_manifest.py \
            orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py

      - name: Prove strict pretruth ID-only manifest boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('orbittrace_probabilistic_membership_p1_literature/prepare_strict_id_manifest.py')
          text=p.read_text(); tree=ast.parse(text)
          # Artifact identities and row counts are fixed before any P1 result.
          for token in (
              "2023: '35f629b1dff4d04cdc13aa8224171ec1ab8e06b52836900d66ff978b5c235761'",
              "2025: '8e7580c52e41e6994d6e46f289a7b916565a4efc512c5549ee83f249d0e81ee3'",
              "2023: '2b9e86572f10af447071cb10c56f643c1ad8babfe0d9aa667994ba3639834389'",
              "2025: '77844d700bb14bb9952307fad13eb66cbc62e6a1555e5edd9c8aa0d26968b06e'",
              "'hdbscan': {2023: 26460, 2025: 19658}",
              "'sugar': {2023: 30414, 2025: 23200}",
          ):
              assert token in text,token
          defs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          h=ast.get_source_segment(text,defs['hdbscan_ids_only'])
          s=ast.get_source_segment(text,defs['sugar_ids_only'])
          assert 'json.loads' not in h and 'json.load' not in h
          assert 'hdbscan_cluster' not in h and 'cluster' not in h
          assert 'pattern.findall(line)' in h
          assert "extract_json_array_for_key_without_parsing_rest(text, 'event_ids')" in s
          assert 'retained_labels' not in s
          helper=ast.get_source_segment(text,defs['extract_json_array_for_key_without_parsing_rest'])
          assert 'json.JSONDecoder().raw_decode(text, start)' in helper
          assert "competitor_cluster_values_parsed': False" in text
          assert "known_shower_truth_values_parsed': False" in text
          assert "native_shower_tokens_parsed': False" in text
          assert 'shower_col' not in text and 'native_background' not in text
          print('PASS_P1_STRICT_ID_ONLY_MANIFEST_SOURCE_BOUNDARY')
          PY

      - name: Prove P1 transfer reuses exact frozen membership semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          frozen=Path('/tmp/p1_frozen.py').read_text()
          p=Path('orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py')
          text=p.read_text(); tree=ast.parse(text)
          defs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          apply=ast.get_source_segment(text,defs['apply_exact_p1_membership'])
          cov=ast.get_source_segment(text,defs['p1_covariance_for_panel_family'])

          # Exact P1 constants and imported primitives, not a retuned SonotaCo variant.
          for token in (
              "float(p1.INNER_PROB) == 0.99",
              "float(p1.OUTER_PROB) == 0.9999",
              "float(p1.BACKGROUND_UPPER_CONFIDENCE) == 0.95",
              "float(p1.MAP_THRESHOLD) == 0.5",
              "p1.OAS(assume_centered=False).fit(x)",
              "p1.residual_matrix(rows, center, base)",
              "p1.chi2.ppf(p1.INNER_PROB, 4)",
              "p1.chi2.ppf(p1.OUTER_PROB, 4)",
              "p1.poisson_rate_upper(n_shell, p1.BACKGROUND_UPPER_CONFIDENCE)",
              "nonseed_excess = max(0.0, float(n_inner) - float(expected_bg_inner))",
              "stream_total = (float(current_seed_count) + nonseed_excess) / p1.INNER_PROB",
              "posterior = float(best['stream_intensity'] / denom)",
              "if posterior <= p1.MAP_THRESHOLD:",
          ):
              assert token in text,token
              # corresponding primitive/constant must also exist in frozen P1 source
          for token in ('INNER_PROB = 0.99','OUTER_PROB = 0.9999','BACKGROUND_UPPER_CONFIDENCE = 0.95','MAP_THRESHOLD = 0.5','OAS','poisson_rate_upper','residual_matrix'):
              assert token in frozen,token

          # The exact frozen tie/conflict ordering is retained.
          frozen_tie="key=lambda p: (-p['stream_intensity'], p['d2'], p['family_index'], p['family_id'])"
          assert frozen_tie in frozen and frozen_tie in apply

          # No truth/comparator values can enter pretruth construction.
          forbidden=('hidden_labels','complex_key','hdbscan_cluster','retained_labels','competitor_assignments','known_shower')
          for name in forbidden:
              assert name not in apply and name not in cov,(name,'membership/covariance')
          print('PASS_P1_TRANSFER_EXACT_MEMBERSHIP_SEMANTICS')
          PY

      - name: Prove exact-v8-first and narrow support-ineligibility semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,re
          from pathlib import Path
          text=Path('orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel.py').read_text()
          tree=ast.parse(text); defs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          main=ast.get_source_segment(text,defs['main'])
          assert "v8_panel = exact.run_v8_panel(args.panel, scan_by_year, support, runtime, base)" in main
          assert main.index('exact.run_v8_panel') < main.index('apply_exact_p1_membership')
          assert "SUPPORT_INELIGIBLE_RE = re.compile(r'^family ([A-Za-z0-9_.:-]+) year (2023|2025) has only ([0-9]+) events in local window$')" in text
          # Catch is narrow: nonmatching RuntimeError is re-raised.
          assert 'except RuntimeError as exc:' in main
          assert 'match = SUPPORT_INELIGIBLE_RE.fullmatch(str(exc))' in main
          assert 'if match is None:\n            raise' in main
          assert "'required_episode_events': 128" in main
          assert "'no_support_relaxation': True" in main
          assert "'p1_membership_executed': False" in main

          # Eligible path freezes rank and membership before any possible post-truth stage.
          assert "'p1_membership_pretruth_sha256': family_sha" in main
          assert "'v8_order_pretruth_sha256': order_sha" in main
          assert "'competitor_cluster_values_accessed': False" in main
          assert "'known_shower_truth_accessed': False" in main
          assert "'membership_and_rank_frozen_before_truth': True" in main
          print('PASS_P1_EXACT_V8_FIRST_SUPPORT_INELIGIBILITY_BOUNDARY')
          PY

      - name: Assert source-only firewall
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          test ! -e output_pretruth
          echo NO_SONOTACO_ARCHIVE_NO_ASSIGNMENT_VALUE_NO_TRUTH_VALUE_NO_TARGET_REGION_NO_P1_SCIENCE
