name: OrbitTrace support-cut recurrent witness projection v1

on:
  push:
    branches: [agent/orbittrace-support-cut-recurrent-witness-projection-v1]
    paths: ['.github/workflows/orbittrace_support_cut_recurrent_witness_projection_v1.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  structural:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen source
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_support_cut_recurrent_witness_projection_v1/PROTOCOL.md)" = '2bb28ce1fd356481042900de2f12729ba31ddb56'
          test "$(git hash-object orbittrace_support_cut_recurrent_witness_projection_v1/run_structural.py)" = '96109d534b407fe9e90d149ab69a328791b44eb8'
          python -m py_compile orbittrace_support_cut_recurrent_witness_projection_v1/run_structural.py
          mkdir -p input/support input/universe output

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-support-resolved-cut-v1
          path: input/support
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31961908008

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-annual-density-bifiltration-gmn-ranking-v1-prelabel
          path: input/universe
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32037435314

      - name: Verify immutable label-free inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/support/TOPOMODAL_SUPPORT_RESOLVED_CUT_V1_PRELABEL.json | cut -d' ' -f1)" = '4529eadd9ff93aae057f0a6fd5e0dd923f2300b7c6e01b74a0b7638e22da6de6'
          test "$(sha256sum input/universe/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json | cut -d' ' -f1)" = '95f8a57718a30b2c7e85016d505276d72cccb9e4ac1d6eb29f13067efc73dd0c'

      - name: Run zero-label witness-projection gate and seal order
        run: |
          set -euo pipefail
          python -u orbittrace_support_cut_recurrent_witness_projection_v1/run_structural.py \
            --support-prelabel input/support/TOPOMODAL_SUPPORT_RESOLVED_CUT_V1_PRELABEL.json \
            --bif-prelabel input/universe/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json \
            --output output

      - name: Enforce firewall and binding structural verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='output/SUPPORT_CUT_RECURRENT_WITNESS_PROJECTION_V1_PRELABEL.json'
          r='output/SUPPORT_CUT_RECURRENT_WITNESS_PROJECTION_V1_STRUCTURAL.json'
          ph=hashlib.sha256(open(p,'rb').read()).hexdigest()
          q=json.load(open(p)); d=json.load(open(r))
          assert d['prelabel_sha256']==ph
          assert d['scientific_role']=='ZERO_LABEL_STRUCTURAL_GATE'
          assert d['verdict'] in {'PASS_SUPPORT_CUT_RECURRENT_WITNESS_PROJECTION_V1_STRUCTURAL','FAIL_SUPPORT_CUT_RECURRENT_WITNESS_PROJECTION_V1_STRUCTURAL'}
          assert q['scientific_role']=='PRELABEL_SUPPORT_CUT_RECURRENT_WITNESS_PROJECTION_V1'
          assert len(q['subsets'])==8
          for x in (q,d):
            assert x['shower_truth_used'] is False
            assert x['target_information_access'] is False and x['target_region_events_accessed'] is False
            assert x['sonotaco_2013_2014_access'] is False
            assert x['amos_scientific_access'] is False and x['maarsy_scientific_access'] is False and x['dms_scientific_access'] is False
            assert x['method_parameter_selection_from_result'] is False
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          sha256sum orbittrace_support_cut_recurrent_witness_projection_v1/PROTOCOL.md orbittrace_support_cut_recurrent_witness_projection_v1/run_structural.py input/support/TOPOMODAL_SUPPORT_RESOLVED_CUT_V1_PRELABEL.json input/universe/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json output/SUPPORT_CUT_RECURRENT_WITNESS_PROJECTION_V1_PRELABEL.json output/SUPPORT_CUT_RECURRENT_WITNESS_PROJECTION_V1_STRUCTURAL.json > output/provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-support-cut-recurrent-witness-projection-v1
          path: output
          if-no-files-found: error
          retention-days: 90
