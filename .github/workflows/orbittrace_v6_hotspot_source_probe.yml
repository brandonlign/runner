name: OrbitTrace v6 hotspot source probe

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-development-checkpointed-fallback
    paths:
      - .github/workflows/orbittrace_v6_hotspot_source_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-performance-optimization-v1
          path: probe

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6

      - name: Reconstruct exact frozen source and print hotspot structure
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress \
            > /tmp/v6.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.py' | sha256sum -c -
          python - <<'PY'
          import ast
          from pathlib import Path
          text=Path('/tmp/v6.py').read_text()
          tree=ast.parse(text)
          lines=text.splitlines()
          for name in ['calibrate_year_v6','exact_rescore_window_v6','scan_year_v6']:
              fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name==name)
              print(f'===== {name} {fn.lineno}-{fn.end_lineno} =====')
              print('\n'.join(f'{i:04d}: {lines[i-1]}' for i in range(fn.lineno,fn.end_lineno+1)))
              print(f'ARGS {name}: {[a.arg for a in fn.args.args]}')
              calls=[]
              loops=[]
              for n in ast.walk(fn):
                  if isinstance(n,ast.Call):
                      f=n.func
                      nm=f.id if isinstance(f,ast.Name) else (f.attr if isinstance(f,ast.Attribute) else '<dynamic>')
                      calls.append((n.lineno,nm))
                  if isinstance(n,(ast.For,ast.While)):
                      loops.append((n.lineno,type(n).__name__,ast.get_source_segment(text,n.target) if isinstance(n,ast.For) else ''))
              print('CALLS',calls)
              print('LOOPS',loops)
          print('PASS_V6_HOTSPOT_SOURCE_PROBE')
          PY

      - name: Assert source-only boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          echo NO_CATALOGUE_NO_LABEL_NO_TARGET_ACCESS
