name: OrbitTrace v6 hotspot source probe

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-development-checkpointed-fallback
    paths:
      - .github/workflows/orbittrace_v6_hotspot_source_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-performance-optimization-v1
          path: probe

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6

      - name: Reconstruct exact frozen sources and print calibration boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.py' | sha256sum -c -
          cat frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts/part*.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/support.py
          echo 'fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62  /tmp/support.py' | sha256sum -c -
          python - <<'PY'
          import ast
          from pathlib import Path

          def defs_and_text(path):
              text=Path(path).read_text(); tree=ast.parse(text)
              defs={n.name:n for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
              return text,defs

          def dump(path,names):
              text,defs=defs_and_text(path); lines=text.splitlines()
              for name in names:
                  fn=defs.get(name)
                  if fn is None:
                      print(f'MISSING {path} {name}')
                      continue
                  print(f'===== {path}::{name} {fn.lineno}-{fn.end_lineno} =====')
                  print('\n'.join(f'{i:04d}: {lines[i-1]}' for i in range(fn.lineno,fn.end_lineno+1)))

          support_text,support_defs=defs_and_text('/tmp/support.py')
          print('SUPPORT_TOP_LEVEL_DEFS', sorted(support_defs))
          for needle in ['calibration','sporadic','complex_key','iau','label','shower']:
              print(f'===== SUPPORT LINES CONTAINING {needle!r} =====')
              for i,line in enumerate(support_text.splitlines(),1):
                  if needle.lower() in line.lower():
                      print(f'{i:04d}: {line}')

          likely=[name for name in support_defs if any(k in name.lower() for k in ('parse','catalog','calibr','event','load'))]
          dump('/tmp/support.py',likely)
          dump('/tmp/v6.py',['calibrate_year_v6','scan_year_v6','main'])
          print('PASS_V6_CALIBRATION_SOURCE_PROBE')
          PY

      - name: Assert source-only boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          echo NO_CATALOGUE_NO_LABEL_VALUE_NO_TARGET_ACCESS
