name: OrbitTrace v6 hotspot source probe

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-development-checkpointed-fallback
    paths:
      - .github/workflows/orbittrace_v6_hotspot_source_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-performance-optimization-v1
          path: probe

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6

      - name: Reconstruct exact frozen sources and print hotspot structure
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.py' | sha256sum -c -
          cat frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts/part*.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/support.py
          echo 'fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62  /tmp/support.py' | sha256sum -c -
          python - <<'PY'
          import ast
          from pathlib import Path

          def dump(path, names):
              text=Path(path).read_text(); tree=ast.parse(text); lines=text.splitlines()
              defs={n.name:n for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
              for name in names:
                  fn=defs.get(name)
                  if fn is None:
                      print(f'MISSING {path} {name}')
                      continue
                  print(f'===== {path}::{name} {fn.lineno}-{fn.end_lineno} =====')
                  print('\n'.join(f'{i:04d}: {lines[i-1]}' for i in range(fn.lineno,fn.end_lineno+1)))
                  print(f'ARGS {name}: {[a.arg for a in fn.args.args]}')
                  calls=[]; loops=[]
                  for n in ast.walk(fn):
                      if isinstance(n,ast.Call):
                          f=n.func
                          nm=f.id if isinstance(f,ast.Name) else (f.attr if isinstance(f,ast.Attribute) else '<dynamic>')
                          calls.append((n.lineno,nm))
                      if isinstance(n,(ast.For,ast.While)):
                          loops.append((n.lineno,type(n).__name__,ast.get_source_segment(text,n.target) if isinstance(n,ast.For) else ''))
                  print('CALLS',calls); print('LOOPS',loops)

          dump('/tmp/v6.py',['v3_details','calibrate_year_v6','exact_rescore_window_v6','scan_year_v6'])
          dump('/tmp/support.py',['exact_anchor_distances','quartet_score'])
          print('PASS_V6_HOTSPOT_HELPER_SOURCE_PROBE')
          PY

      - name: Assert source-only boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          echo NO_CATALOGUE_NO_LABEL_NO_TARGET_ACCESS
