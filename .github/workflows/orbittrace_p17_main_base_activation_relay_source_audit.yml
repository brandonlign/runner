name: OrbitTrace P17 main-base activation relay source audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/orbittrace_p17_main_base_activation_relay.yml
      - .github/workflows/orbittrace_p17_main_base_activation_relay_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove zero-write relay permits negative guard literals but forbids posttruth execution
        run: |
          set -euo pipefail
          wf=.github/workflows/orbittrace_p17_main_base_activation_relay.yml
          for x in \
            'pull_request:' \
            'pull_request_target:' \
            "github.event.pull_request.head.ref == 'agent/orbittrace-p17-main-activation-run-v1'" \
            'orbittrace_reciprocal_support_closure_p17/MAIN_RELAY_ACTIVATE.md' \
            'EXECUTE_P17_MAIN_RELAY_V1' \
            'PR=760' \
            '62fb6c2eda5a11ed06af5025c413269edb1fbb09' \
            '0e70de7dc40be3437751933258d469fc8c65ca6c' \
            'agent/orbittrace-p17-matched-pretruth-run-v6-target-relay' \
            '31332157812' '9043232586' \
            'cac4c68e329ad06a802fbdc5ab12b7526f64720065000d5b3c094c49d57eb5dd' \
            'c0c39d1bd660efbe5e5353b5a33185428a6f60f4a3759be3acd16a15a063012a' \
            '# P17_CHILD_ACTIVATION_NONCE=SELF_TRIGGER_V1' \
            'cmp -s /tmp/p17_base_workflow.yml /tmp/p17_child_without_nonce.yml' \
            'P17_MAIN_RELAY_AUTHENTICATED RUN_ID=$GITHUB_RUN_ID EVENT=$GITHUB_EVENT_NAME METHOD_PR=760' \
            "for token in ('evaluate_frozen_blindsafe.py','finalize_p3_evaluator_result.py')" \
            "line.lstrip().startswith(('python ','python -u '))" \
            "for token in ('OrbitTrace-April','target_coordinate')" \
            "all('grep -E' in line for line in occurrences)" \
            'PASS_P17_MAIN_RELAY_EXTRACTED_EXACT_BASE_RUN_BLOCK_EXECUTION_AWARE_FIREWALL' \
            '/tmp/p17_exact_base_run.sh' \
            'orbittrace-p17-matched-pretruth-checkpoints-main-relay'; do
            grep -F "$x" "$wf"
          done
          test "$(grep -Fc 'branches: [main]' "$wf")" -eq 2
          test "$(grep -Fc 'uses: actions/checkout@v4' "$wf")" -eq 2
          test "$(grep -Fc 'git show 62fb6c2eda5a11ed06af5025c413269edb1fbb09:' "$wf")" -ge 1
          test "$(grep -Fc 'git show 0e70de7dc40be3437751933258d469fc8c65ca6c:' "$wf")" -ge 1
          if grep -Fq 'ref: ${{ github.event.pull_request.head.sha }}' "$wf"; then
            echo 'relay checks out untrusted activation PR head' >&2
            exit 1
          fi
          grep -F 'contents: read' "$wf"
          grep -F 'actions: read' "$wf"
          grep -F 'pull-requests: read' "$wf"
          if grep -Eq 'issues: write|contents: write|actions: write|pull-requests: write|gh pr comment|issues/.*/comments' "$wf"; then
            echo 'write surface survived in zero-write relay' >&2
            exit 1
          fi
          # The old over-broad `assert x not in out` posttruth-token loop must be gone.
          if grep -Fq "for x in ('OPEN TRUTH + COMPETITOR CLUSTER VALUES EXACTLY ONCE','evaluate_frozen_blindsafe.py'" "$wf"; then
            echo 'over-broad literal firewall survived' >&2
            exit 1
          fi
          # Negative guard literals remain visible in the authenticated methodology source,
          # but relay logic now distinguishes them from executable Python invocations.
          for sentinel in 'evaluate_frozen_blindsafe.py' 'finalize_p3_evaluator_result.py' 'OrbitTrace-April' 'target_coordinate'; do
            grep -F "$sentinel" "$wf"
          done
          test ! -e orbittrace_reciprocal_support_closure_p17/MAIN_RELAY_ACTIVATE.md
          echo PASS_P17_MAIN_BASE_EXECUTION_AWARE_ZERO_WRITE_RELAY_SOURCE_AUDIT
          echo SAFETY_ASSERTION_REPAIR_ONLY_NO_COMPARATOR_TRUTH_NO_EXTERNAL_NO_TARGET_ACCESS
