name: OrbitTrace CMN public-interface structure audit v1

on:
  pull_request:
    branches:
      - agent/orbittrace-gmn-sonotaco-domainshift-diagnostic-v1
    paths:
      - 'orbittrace_cmn_interface_structure_audit_v1/**'
      - '.github/workflows/orbittrace_cmn_interface_structure_audit_v1.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-cmn-interface-structure-audit-v1
      - name: Audit frozen source and prerequisite
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_cmn_interface_structure_audit_v1/PROTOCOL.md)" = '84e7cbff19e72377c2118139ca2ccbb9bfc9975f'
          test "$(git hash-object orbittrace_cmn_interface_structure_audit_v1/audit_interface.py)" = '1b27182edded42c03623fe0d85f4edc917bd9ad3'
          grep -q 'PASS_CMN_ZERO_DATA_REPO_FRESHNESS_AUDIT' orbittrace_cmn_zero_data_freshness_audit_v1/RESULT.md
          python -m py_compile orbittrace_cmn_interface_structure_audit_v1/audit_interface.py
          test "$(grep -o 'https://[^\"[:space:]]*' orbittrace_cmn_interface_structure_audit_v1/audit_interface.py | sort -u)" = 'https://ceres.ta3.sk/'
      - name: Run single-request structure-only audit
        run: |
          set -euo pipefail
          python -u orbittrace_cmn_interface_structure_audit_v1/audit_interface.py
      - name: Enforce interface-only firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/CMN_PUBLIC_INTERFACE_STRUCTURE_AUDIT_V1.json'))
          assert r['verdict']=='PASS_CMN_PUBLIC_INTERFACE_STRUCTURE_AUDIT'
          assert r['network_fetch_count']==1 and r['links_followed'] is False and r['forms_submitted'] is False
          assert r['raw_html_emitted'] is False and r['scientific_row_values_emitted'] is False
          assert r['cmn_source_label_present'] is True and r['structural_query_or_data_control_present'] is True
          for k in ('cmn_scientific_value_access','cmn_event_identifier_access','cmn_shower_label_access','target_information_access','target_region_events_accessed','sonotaco_scientific_access','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          sha256sum orbittrace_cmn_interface_structure_audit_v1/PROTOCOL.md orbittrace_cmn_interface_structure_audit_v1/audit_interface.py > output/source_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/audit_commit.txt
          python --version > output/python_version.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-cmn-interface-structure-audit-v1
          path: output
          if-no-files-found: error
          retention-days: 90
