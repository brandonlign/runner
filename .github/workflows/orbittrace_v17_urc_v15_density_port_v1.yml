name: OrbitTrace v17 broad URC density-port exposed development

on:
  pull_request:
    branches:
      - agent/orbittrace-v16-v15-joint-conformal-membership-sonotaco-dev-v1
    paths:
      - 'orbittrace_v17_urc_v15_density_port_v1/**'
      - '.github/workflows/orbittrace_v17_urc_v15_density_port_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v17-urc-v15-density-port-sonotaco-dev-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen scientific runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          python - <<'PY'
          import numpy, scipy, sklearn, joblib
          assert numpy.__version__=='2.1.3'
          assert scipy.__version__=='1.14.1'
          assert sklearn.__version__=='1.5.2'
          assert joblib.__version__=='1.5.3'
          PY
          mkdir -p input/v3 input/ranker input/model input/prepare output/sugar output/hdbscan
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          ( cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py )
          test "$(cat frozen-v8/output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          test "$(git hash-object orbittrace_p19_subthreshold_recurrence/run_development.py)" = 'f230fc775b38df1e9d447bba33419abd5f6f6ef1'
          test "$(git hash-object orbittrace_p20_recurrent_isolated_quartet/run_development.py)" = '6c5c8e02ac7a377ca8253f1e1fc0ad6e60e5e69f'
          test "$(git hash-object frozen-v8/orbittrace_pooled_year_centroid_v8/run_development.py)" = 'f248df78e1258b132b41aecca6a985a5eb782654'
          test "$(git hash-object orbittrace_v15_canonical_application_v1/application.py)" = '5b3244dfbcc7bc931925aea42866edc8205113a8'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-urc-final-full-gmn-ranker-v1
          path: input/model
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344776617
      - name: Pin frozen #839 ranker identities
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/model/urc_final_ranker.joblib | cut -d' ' -f1)" = 'ac48355e8c51de2a9cfa12f23b2a847f5e946fc03336a941f80d98224ee5c909'
      - name: Restore already-exposed label-free SonotaCo rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9050107352/zip' -o input/prepare.zip
          echo '1296d757b5ea1dd94f9c9077fd769fdc8f00ec06d0881d8548fd1df4608344cc  input/prepare.zip' | sha256sum -c -
          unzip -q input/prepare.zip -d input/prepare
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('input/prepare/label_free_preparation_manifest.json').read_text())
          assert m['verdict']=='PASS_FINAL_SONOTACO_LABEL_FREE_PREPARATION'
          assert m['shower_truth_accessed'] is False and m['target_information_access'] is False and m['maarsy_scientific_access'] is False
          PY
      - name: Generate and freeze v17 Sugar-route catalogue before exposed truth
        env:
          PYTHONPATH: .:input/ranker:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_v17_urc_v15_density_port_v1/run_candidate_pretruth.py \
            --comparator sugar \
            --rows-2013 input/prepare/sugar_2013.json --rows-2014 input/prepare/sugar_2014.json \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --active-ranker-source input/ranker/run_urc_union_ranker.py \
            --model-joblib input/model/urc_final_ranker.joblib \
            --output output/sugar
      - name: Generate and freeze v17 HDBSCAN-route catalogue before exposed truth
        env:
          PYTHONPATH: .:input/ranker:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_v17_urc_v15_density_port_v1/run_candidate_pretruth.py \
            --comparator hdbscan \
            --rows-2013 input/prepare/hdbscan_2013.json --rows-2014 input/prepare/hdbscan_2014.json \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --active-ranker-source input/ranker/run_urc_union_ranker.py \
            --model-joblib input/model/urc_final_ranker.joblib \
            --output output/hdbscan
      - name: Freeze v17 outputs before exposed truth load
        run: |
          set -euo pipefail
          sha256sum output/sugar/candidate_primary_output.json output/hdbscan/candidate_primary_output.json > output/V17_PRETRUTH_OUTPUT_SHA256.txt
          python - <<'PY'
          import json
          from pathlib import Path
          for c in ['sugar','hdbscan']:
              s=json.loads(Path(f'output/{c}/candidate_pretruth_summary.json').read_text())
              assert s['verdict']=='PASS_V17_EXPOSED_DEVELOPMENT_PRETRUTH_OUTPUT_FREEZE'
              assert s['truth_accessed'] is False and s['target_information_access'] is False and s['maarsy_scientific_access'] is False and s['dms_scientific_access'] is False
              assert s['candidate_counts']['union'] > s['candidate_counts']['hard']
          print(Path('output/V17_PRETRUTH_OUTPUT_SHA256.txt').read_text())
          PY
      - name: Load immutable already-exposed truth and frozen literature results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v15-result
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/v15-result.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/v15-result.zip' | sha256sum -c -
          unzip -q input/v15-result.zip -d input/v15-result
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('input/v15-result/V15_FINAL_LITERATURE_RESULT.json').read_text())
          assert r['verdict']=='FAIL_FINAL_LITERATURE_SUPERIORITY'
          PY
      - name: Evaluate v17 under exact frozen #854 pair semantics
        run: |
          set -euo pipefail
          for comparator in sugar hdbscan; do
            for year in 2013 2014; do
              python orbittrace_v16_v15_joint_conformal_membership_v1/evaluate_exposed.py \
                --candidate output/$comparator/candidate_primary_output.json \
                --truth input/v15-result/truth_${comparator}_${year}.json \
                --frozen-evaluation input/v15-result/evaluation_${comparator}_${year}.json \
                --comparator $comparator --year $year \
                --output output/evaluation_${comparator}_${year}.json
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          v16_macro={('sugar',2013):0.134001175628775,('sugar',2014):0.1638911289853221,('hdbscan',2013):0.08296530847583714,('hdbscan',2014):0.09701223261569918}
          v16_rec={('sugar',2013):6,('sugar',2014):10,('hdbscan',2013):3,('hdbscan',2014):5}
          pairs=[]
          for c in ['sugar','hdbscan']:
            for y in [2013,2014]:
              p=json.loads(Path(f'output/evaluation_{c}_{y}.json').read_text())
              p['v16_reference']={'macro_f1':v16_macro[(c,y)],'recovered_f1_gt_0_5':v16_rec[(c,y)]}
              p['delta_v17_minus_v16_macro_f1']=p['v16']['macro_f1']-v16_macro[(c,y)]
              p['v17_recovery_minus_v16']=p['v16']['recovered_f1_gt_0_5']-v16_rec[(c,y)]
              pairs.append(p)
          all_better_v16=all(p['delta_v17_minus_v16_macro_f1']>0 and p['v17_recovery_minus_v16']>=0 for p in pairs)
          all_lit=all(p['literature_macro_f1_beaten'] and p['literature_recovery_beaten_or_tied'] for p in pairs)
          result={
            'scientific_stage':'V17_EXPOSED_SONOTACO_SUCCESSOR_DEVELOPMENT',
            'pairs':[{k:v for k,v in p.items() if k!='per_shower'} for p in pairs],
            'beats_v16_all_four':all_better_v16,
            'beats_literature_all_four':all_lit,
            'verdict':('PASS_V17_EXPOSED_ALL_PAIR_LITERATURE_SUPERIORITY_DEVELOPMENT' if all_lit else ('PASS_V17_OVER_V16_BUT_FAIL_ALL_PAIR_LITERATURE_SUPERIORITY_DEVELOPMENT' if all_better_v16 else 'FAIL_V17_SUCCESSOR_DEVELOPMENT')),
            'sonotaco_role':'EXPOSED_DEVELOPMENT_ONLY','post_result_parameter_tuning':False,
            'maarsy_scientific_access':False,'dms_scientific_access':False,'target_information_access':False,
          }
          Path('output/V17_EXPOSED_DEVELOPMENT_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v17_urc_v15_density_port_v1/run_candidate_pretruth.py orbittrace_v17_urc_v15_density_port_v1/PROTOCOL.md input/ranker/run_urc_union_ranker.py input/model/urc_final_ranker.joblib > output/V17_SOURCE_MODEL_SHA256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v17-broad-urc-density-port-exposed-development-v1
          path: output
          if-no-files-found: error
          retention-days: 90
