name: Real-shower hard-negative relation clique

on:
  pull_request:
    branches:
      - agent/real-shower-meta-stage0
    paths:
      - real_shower_relation_clique_stage1/**
      - .github/workflows/real_shower_relation_clique.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: real-shower-relation-clique-stage1
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATA_ARTIFACT_ID: '8871850235'
      BASELINE_ARTIFACT_ID: '8871912750'
      SELECTED_EVENTS_SHA256: 'cbec0d01ae7b157cc6d0ca149aeea5b3eb8e53bcffdab2f1f8d8f2fb9da2a068'
      DATA_AUDIT_JSON_SHA256: 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778'
      BASELINE_JSON_SHA256: 'f3d36e231722891a3f6c4c5d81e0b645e7ee4212a417cbd66e606111d94a95ba'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-shower-relation-clique-stage1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_relation_clique_stage1/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_relation_clique_stage1/requirements.txt
      - name: Download exact frozen inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p real_shower_relation_clique_stage1/input/data real_shower_relation_clique_stage1/input/baseline real_shower_relation_clique_stage1/results
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DATA_ARTIFACT_ID}/zip" \
            -o real_shower_relation_clique_stage1/input/data.zip
          unzip -q real_shower_relation_clique_stage1/input/data.zip -d real_shower_relation_clique_stage1/input/data

          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" \
            -o real_shower_relation_clique_stage1/input/baseline.zip
          unzip -q real_shower_relation_clique_stage1/input/baseline.zip -d real_shower_relation_clique_stage1/input/baseline

          echo "${SELECTED_EVENTS_SHA256}  real_shower_relation_clique_stage1/input/data/selected_events.jsonl.gz" | sha256sum -c -
          echo "${DATA_AUDIT_JSON_SHA256}  real_shower_relation_clique_stage1/input/data/audit.json" | sha256sum -c -
          echo "${BASELINE_JSON_SHA256}  real_shower_relation_clique_stage1/input/baseline/baseline_ceiling.json" | sha256sum -c -
      - name: Compile frozen benchmark
        run: python -m py_compile real_shower_relation_clique_stage1/run_relation_clique.py
      - name: Run five-fold relation-clique benchmark
        run: |
          python real_shower_relation_clique_stage1/run_relation_clique.py \
            --events real_shower_relation_clique_stage1/input/data/selected_events.jsonl.gz \
            --audit real_shower_relation_clique_stage1/input/data/audit.json \
            --baseline real_shower_relation_clique_stage1/input/baseline/baseline_ceiling.json \
            --output real_shower_relation_clique_stage1/results
      - name: Record provenance
        run: |
          sha256sum \
            real_shower_relation_clique_stage1/run_relation_clique.py \
            real_shower_relation_clique_stage1/run_relation_clique.py.gz.b64 \
            real_shower_relation_clique_stage1/PROTOCOL.md \
            real_shower_relation_clique_stage1/requirements.txt \
            > real_shower_relation_clique_stage1/results/source_sha256.txt
          sha256sum \
            real_shower_relation_clique_stage1/input/data/selected_events.jsonl.gz \
            real_shower_relation_clique_stage1/input/data/audit.json \
            real_shower_relation_clique_stage1/input/baseline/baseline_ceiling.json \
            > real_shower_relation_clique_stage1/results/input_sha256.txt
          python --version > real_shower_relation_clique_stage1/results/python_version.txt
          python -m pip freeze > real_shower_relation_clique_stage1/results/environment.txt
      - name: Upload authoritative evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-shower-relation-clique-stage1
          path: real_shower_relation_clique_stage1/results
          if-no-files-found: error
          retention-days: 90
