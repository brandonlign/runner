name: Isolated exoplanet denoising metadata-shift gate

on:
  push:
    branches:
      - agent/exoplanet-denoising-research-runner
    paths:
      - .github/workflows/exoplanet-denoising-metadata-shift.yml

permissions:
  contents: read

concurrency:
  group: exoplanet-denoising-metadata-shift
  cancel-in-progress: false

jobs:
  metadata-shift:
    if: github.ref == 'refs/heads/agent/exoplanet-denoising-research-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_REF: agent/research-upgrade-wavelength-preserving
      SOURCE_TOKEN: ${{ secrets.EXOPLANET_REPO_TOKEN || secrets.GH_PAT || secrets.GH_TOKEN || secrets.PAT || secrets.REPO_TOKEN }}
    steps:
      - name: Checkout isolated runner branch
        uses: actions/checkout@v4
        with:
          ref: agent/exoplanet-denoising-research-runner
          persist-credentials: false

      - name: Check private-source credential
        id: auth
        shell: bash
        run: |
          if [ -n "$SOURCE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Private-source credential found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No compatible cross-repository token secret is configured; safely skipping."
          fi

      - name: Checkout private research branch
        if: steps.auth.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: brandonlign/exoplanet-transit-denoising
          ref: agent/research-upgrade-wavelength-preserving
          token: ${{ env.SOURCE_TOKEN }}
          path: project
          fetch-depth: 0

      - name: Set up Python
        if: steps.auth.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: project/pyproject.toml

      - name: Install private project
        if: steps.auth.outputs.available == 'true'
        working-directory: project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run predeclared metadata-tail shifts
        if: steps.auth.outputs.available == 'true'
        id: shift
        working-directory: project
        shell: bash
        run: |
          mkdir -p research_results
          set +e
          python scripts/run_metadata_shift_ridge.py > research_results/metadata_shift_ridge.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Metadata-shift gate finished with status $status; numerical details stay private."

      - name: Save result only to private research branch
        if: steps.auth.outputs.available == 'true' && always()
        working-directory: project
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- research_results/metadata_shift_ridge.log
          if [ -f research_results/metadata_shift_ridge.json ]; then
            git add -- research_results/metadata_shift_ridge.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record predeclared metadata-shift gate'
            git pull --rebase origin "$SOURCE_REF"
            git push origin "HEAD:$SOURCE_REF"
          fi

      - name: Fail only if experiment execution failed
        if: steps.auth.outputs.available == 'true' && steps.shift.outputs.status != '0'
        run: exit 1
