name: OrbitTrace P1 matched literature evaluator source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p1-matched-literature-freeze
    paths:
      - orbittrace_probabilistic_membership_p1_literature/evaluate_frozen.py
      - .github/workflows/orbittrace_p1_matched_literature_evaluator_source_audit.yml

permissions:
  contents: read

concurrency:
  group: orbittrace-p1-matched-literature-evaluator-source-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-p1-matched-literature-implementation-freeze
          path: p1
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-literature-adapter-freeze
          path: v6lit
      - name: Compile and pin the predecessor adjudicator
        run: |
          set -euo pipefail
          python -m py_compile p1/orbittrace_probabilistic_membership_p1_literature/evaluate_frozen.py v6lit/orbittrace_v6_literature_adapter/evaluate_frozen.py
          test "$(git -C v6lit hash-object orbittrace_v6_literature_adapter/evaluate_frozen.py)" = '77c3be6f30e4a861d4dfb1bdb23568530e325e34'

      - name: Prove identical broad/sparse numerical standards
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,importlib.util
          from pathlib import Path

          def load(path,name):
              s=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          p1=load(Path('p1/orbittrace_probabilistic_membership_p1_literature/evaluate_frozen.py'),'p1_eval')
          v6=load(Path('v6lit/orbittrace_v6_literature_adapter/evaluate_frozen.py'),'v6_eval')
          assert p1.BINS==v6.BINS

          # Same denominators and a mix of positive/negative strata; compare every gate boolean.
          def summary(all_mean, vals, gt):
              out={'all':{'showers':sum(n for n,_ in vals.values()),'mean_f1':all_mean,'f1_gt_0_5':gt}}
              for b in p1.BINS:
                  n,m=vals.get(b,(0,None)); out[b]={'showers':n,'mean_f1':m,'f1_gt_0_5':0}
              return out
          bins={
              '4-9':(2,0.60),'10-24':(2,0.50),'25-49':(1,0.40),'50-99':(1,0.30),'100+':(1,0.70),
          }
          cbins={
              '4-9':(2,0.45),'10-24':(2,0.37),'25-49':(1,0.42),'50-99':(1,0.31),'100+':(1,0.55),
          }
          prows=[
              {'label':'a','size_bin':'4-9','f1':0.6},{'label':'b','size_bin':'4-9','f1':0.6},
              {'label':'c','size_bin':'10-24','f1':0.5},{'label':'d','size_bin':'10-24','f1':0.5},
              {'label':'e','size_bin':'25-49','f1':0.4},{'label':'f','size_bin':'50-99','f1':0.3},{'label':'g','size_bin':'100+','f1':0.7},
          ]
          crows=[
              {'label':'a','size_bin':'4-9','f1':0.45},{'label':'b','size_bin':'4-9','f1':0.45},
              {'label':'c','size_bin':'10-24','f1':0.37},{'label':'d','size_bin':'10-24','f1':0.37},
              {'label':'e','size_bin':'25-49','f1':0.42},{'label':'f','size_bin':'50-99','f1':0.31},{'label':'g','size_bin':'100+','f1':0.55},
          ]
          ps=summary(sum(x['f1'] for x in prows)/len(prows),bins,4)
          cs=summary(sum(x['f1'] for x in crows)/len(crows),cbins,3)
          a=p1.annual_pairwise_gates(prows,ps,crows,cs)
          b=v6.annual_pairwise_gates(prows,ps,crows,cs)
          assert a['broad_gates']==b['broad_gates'],(a,b)
          assert a['sparse_gates']==b['sparse_gates'],(a,b)
          assert a['broad_pass']==b['broad_pass'] and a['sparse_pass']==b['sparse_pass']
          assert abs(a['macro_f1_delta_p1_minus_comparator']-b['macro_f1_delta_v6_minus_comparator'])<1e-15
          assert a['size_bin_delta_p1_minus_comparator']==b['size_bin_delta_v6_minus_comparator']
          assert a['combined_4_24']['delta']==b['combined_4_24']['delta']

          text=Path('p1/orbittrace_probabilistic_membership_p1_literature/evaluate_frozen.py').read_text()
          for token in ('all_delta >= 0.05','min(nonempty) >= -0.05','sum(d >= 0.10 for d in nonempty) >= 2',"float(bin_delta['4-9']) >= 0.10",'delta_4_24 >= 0.10','all_delta >= -0.10','>= 0.80 * int(comp_summary'):
              assert token in text,token
          print('PASS_P1_LITERATURE_SAME_V6_SUPERIORITY_BARS')
          PY

      - name: Prove post-freeze access order and ineligible non-access
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          text=Path('p1/orbittrace_probabilistic_membership_p1_literature/evaluate_frozen.py').read_text()
          tree=ast.parse(text); defs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          main=ast.get_source_segment(text,defs['main'])
          panel=ast.get_source_segment(text,defs['evaluate_eligible_panel'])
          load=ast.get_source_segment(text,defs['load_checkpoint'])

          # Both checkpoint hashes and their pretruth boundary flags are verified first.
          assert "checkpoints={" in main
          assert main.index("load_checkpoint(args.hdbscan_pretruth") < main.index("exact=load_module")
          assert "competitor_cluster_values_accessed'] is False" in load
          assert "known_shower_truth_accessed'] is False" in load
          assert "membership_and_rank_frozen_before_truth'] is True" in load
          assert "actual_membership_sha == obj['p1_membership_pretruth_sha256']" in load
          assert "actual_order_sha == obj['v8_order_pretruth_sha256']" in load

          # Cluster/truth loading exists only inside evaluate_eligible_panel.
          assert 'exact.load_hdbscan' in panel and 'exact.load_sugar' in panel
          assert 'exact.parse_common_truth' in panel
          before_call=main[:main.index("results[panel]=evaluate_eligible_panel")]
          assert 'load_hdbscan' not in before_call and 'load_sugar' not in before_call and 'parse_common_truth' not in before_call
          # Ineligible branch continues without ever calling the eligible evaluator.
          assert "if checkpoint['classification']==INELIGIBLE_CLASS:" in main
          ineligible_start=main.index("if checkpoint['classification']==INELIGIBLE_CLASS:")
          call_start=main.index("results[panel]=evaluate_eligible_panel")
          segment=main[ineligible_start:call_start]
          assert "'competitor_cluster_values_accessed': False" in segment
          assert "'known_shower_truth_accessed': False" in segment
          assert 'continue' in segment

          # Exact-v8 support ineligibility can never produce superiority.
          assert "broad=(not any_ineligible)" in main and "sparse=(not any_ineligible)" in main
          assert "classification=INELIGIBLE_CLASS" in main
          assert "pairwise_only_no_cross_denominator_comparison':True" in main
          print('PASS_P1_LITERATURE_POSTFREEZE_ACCESS_ORDER')
          PY

      - name: Prove internal v8 baseline is seed-only and diagnostic
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          text=Path('p1/orbittrace_probabilistic_membership_p1_literature/evaluate_frozen.py').read_text()
          tree=ast.parse(text); defs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          rebuild=ast.get_source_segment(text,defs['reconstruct_v8_memberships'])
          internal=ast.get_source_segment(text,defs['internal_v8_report'])
          assert "additions = set(map(str, row.get('p1_added_event_ids', [])))" in rebuild
          assert "seeds = sorted(members - additions)" in rebuild
          assert "row.pop('p1_added_event_ids', None)" in rebuild
          assert "row.pop('p1_added_event_count', None)" in rebuild
          assert 'exact.v8_annual_with_richer_summary(p1_families' in internal
          assert 'exact.v8_annual_with_richer_summary(v8_families' in internal
          print('PASS_P1_INTERNAL_V8_NONREGRESSION_REPORT')
          PY

      - name: Assert source-only firewall
        run: |
          test ! -e input
          test ! -e output
          echo NO_ASSIGNMENT_VALUE_NO_TRUTH_VALUE_NO_SONOTACO_EXECUTION_NO_TARGET_REGION
