name: OrbitTrace representative-share compatibility pretruth portability probe v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_gmn_representative_share_sonotaco_compat_v1/pretruth_portability_probe.py'
      - '.github/workflows/orbittrace_representative_share_compat_pretruth_portability_probe_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-representative-share-compat-pretruth-portability-probe-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact deployment runtime
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/gmn input/ranker input/payload output
          test "$(git hash-object orbittrace_gmn_representative_share_sonotaco_compat_v1/PROTOCOL.md)" = 'fa6dfba88cefdabbbbec3b1e55328a90be4aa698'
          test "$(git hash-object orbittrace_gmn_representative_share_sonotaco_compat_v1/run_benchmark.py)" = '2a19d8cc09b683d12663e21663dd2fcb4c7ff8c6'
          python -m py_compile orbittrace_gmn_representative_share_sonotaco_compat_v1/pretruth_portability_probe.py
          python - <<'PY'
          import sklearn,numpy,joblib,json
          json.dump({'sklearn':sklearn.__version__,'numpy':numpy.__version__,'joblib':joblib.__version__},open('output/runtime.json','w'),sort_keys=True)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-gmn-representative-share-ranking-v1
          path: input/gmn
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31506465267
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify frozen model and ranker
        run: |
          set -euo pipefail
          test "$(sha256sum input/gmn/orbittrace_gmn_representative_share_extratrees.joblib | cut -d' ' -f1)" = 'acae7fa4b4702e8d3f823defb5f2b3a3e2922b12c3bb07269b6e354316a558cb'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - name: Restore only #950 pretruth route payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip 'sugar/*' 'hdbscan/*' -d input/payload
          test ! -e input/payload/result
      - name: Compute deployment-runtime pretruth hashes only
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_representative_share_sonotaco_compat_v1/pretruth_portability_probe.py \
            --model input/gmn/orbittrace_gmn_representative_share_extratrees.joblib \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --payload-root input/payload \
            --output output
          python - <<'PY'
          import json
          r=json.load(open('output/PRETRUTH_PORTABILITY_PROBE.json'))
          assert r['truth_accessed'] is False and r['sonotaco_truth_artifact_accessed'] is False
          assert r['target_information_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          print('PASS_PRETRUTH_PORTABILITY_PROBE',r['routes']['sugar']['score_sha256'],r['routes']['sugar']['order_sha256'],r['routes']['hdbscan']['score_sha256'],r['routes']['hdbscan']['order_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-representative-share-compat-pretruth-portability-probe-v1
          path: output
          if-no-files-found: error
          retention-days: 90
