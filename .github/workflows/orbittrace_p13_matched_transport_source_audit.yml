name: OrbitTrace P13 matched transport source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p13-core-halo-pretruth-reservation
    paths:
      - orbittrace_core_halo_p13_literature/**
      - .github/workflows/orbittrace_p13_matched_transport_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact source-audit dependencies
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2 pandas==2.2.3 requests==2.32.5 beautifulsoup4==4.12.3
      - name: Reconstruct exact P12 and audit matched pretruth transport
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2.py' | sha256sum -c -
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          echo 'f6c4c5a76b8b3f35d434aed4f1fb15035be05c40d0e0531c343ff620f3ba8185  /tmp/p3.py' | sha256sum -c -
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          echo '290c4f1b6401eaab6f182760eaeaa2f91cc994854febf465f58f7cacc5d73b2a  /tmp/p4.py' | sha256sum -c -
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          echo 'b48b3e6a45a7a371eb8e73c70ee217a33a96c596c61b51ebb7dc9c7b60100456  /tmp/p5.py' | sha256sum -c -
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          echo 'd32648136b58e2f777912d6403d9de3cbd091a8c23e16aedcda0b146f09f38c2  /tmp/p6.py' | sha256sum -c -
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          echo '89cf23c9d58692aedfaf12a9c2b7de4a08d641e6326794d82872f2e18608df54  /tmp/p7.py' | sha256sum -c -
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          echo 'd3bdcdaf18639e36cc02f5106b3a3c816f5e51eb19543f425717ba1c48a26470  /tmp/p8.py' | sha256sum -c -
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          echo '58330c61cf4039f07e80a9746d00eb7281b4e28e674a131d6333e6378695ae31  /tmp/p9.py' | sha256sum -c -
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          echo '638b4f41e51955436557a99f1142c3d3cea91e12a66e2f74925c6bfb79d5e50d  /tmp/p10.py' | sha256sum -c -
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/p11.py
          echo '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9  /tmp/p11.py' | sha256sum -c -
          python orbittrace_drift_conditioned_p12/apply_p12_patch.py /tmp/p11.py /tmp/p12.py
          echo '78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32  /tmp/p12.py' | sha256sum -c -
          python orbittrace_core_halo_p13_literature/apply_p12_matched_transport_patch.py /tmp/p12.py /tmp/p12_panel.py
          python -m py_compile /tmp/p12_panel.py orbittrace_core_halo_p13_literature/apply_p12_matched_transport_patch.py
          echo "P13_P12_MATCHED_TRANSPORT_SOURCE_SHA256=$(sha256sum /tmp/p12_panel.py | awk '{print $1}')"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p12_panel.py').read_text()
          required=(
              'YEARS = (2023, 2025)',
              'for source_year, target_year in ((2023, 2025), (2025, 2023)):',
              'P13 matched-literature pretruth core panel input',
              'competitor_cluster_values_accessed"] is False',
              'known_shower_truth_accessed"] is False',
              'str(eid) in event_lookup_by_year[year]',
              'P13 core identity changed before halo transport',
              'p12_drift_pretruth.json',
              'p3_crossfit_pretruth.json',
              'p2_model_pretruth.json',
              'p11_density_pretruth.json',
              'p12_membership_pretruth.sha256',
              'p12_decisions_pretruth.sha256',
              'P13 matched transport stops exactly at the existing P12 truth firewall',
              'P13_P12_HALO_PRETRUTH_FROZEN',
              '"known_shower_truth_accessed": False',
              '"competitor_cluster_values_accessed": False',
              '"target_accessed": False',
          )
          for token in required: assert token in p,token
          inherited=(
              'P3_FOLD_COUNT = 5','P3_NEGATIVE_TAIL_MAX = 0.10','P3_SEED_FLOOR_MIN = 0.5','RESPONSIBILITY_THRESHOLD = 0.5',
              'source_observation_model(rows_by_year[source_year], base)',
              'positive_orb = min_exact_dsh_to_source',
              'negative_orb = min_exact_dsh_to_source',
              'membership_floor_rank = max(',
              'scoring_scaler, scoring_classifier = crossfit_runtime_models[scoring_fold]',
              'if not (bool(gate["reliable"]) and bool(reciprocal_gate["reliable"])):',
              'density_contrast_scores(',
              'p10_allowed = membership_floor_allowed & jointly_supported',
              'allowed = p10_allowed & density_allowed',
              'responsibility <= RESPONSIBILITY_THRESHOLD',
          )
          for token in inherited: assert token in p,token
          assert 'p3_parse_truth_after_freeze(support, pretruth_ids)' not in p
          assert 'evaluate_order(hidden_labels' not in p.split('P13 matched transport stops exactly at the existing P12 truth firewall')[0]
          for forbidden in ('OrbitTrace-April','target_coordinate'):
              assert forbidden not in p,forbidden
          print('PASS_P13_EXACT_P12_MATCHED_TRANSPORT_SOURCE_AUDIT')
          PY
          echo CORRUPTED_LEGACY_PANEL_PATCH_NOT_USED
      - name: Audit no-result boundary
        run: |
          set -euo pipefail
          test ! -e target
          test ! -e orbittrace_core_halo_p13_literature/RUN.md
          echo PASS_P13_MATCHED_TRANSPORT_SOURCE_ONLY_NO_COMPARATOR_VALUES_NO_TRUTH
