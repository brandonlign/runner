name: OrbitTrace raw held-out local-source null

on:
  push:
    branches:
      - research/orbittrace-new-discovery-screen-20260828
    paths:
      - orbittrace_new_discovery_screen/heldout_local_null.py
      - .github/workflows/orbittrace_heldout_local_null.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  heldout-null:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOCKED_RRF_ARTIFACT_ID: '8973803775'
      LOCKED_RRF_ZIP_SHA256: '1c26dc06193eb2119a0e181d9a85c22c18b09da8316fe6679754cb554ca29d34'
      PROTOCOL_ID: 'orbittrace-raw/HELDOUT_LOCAL_NULL_PROTOCOL@0831757'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GMN reader
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 requests==2.32.5 beautifulsoup4==4.12.3 click==8.0.4 future==1.0.0
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Download frozen locked-RRF scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Executing ${PROTOCOL_ID}"
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCKED_RRF_ARTIFACT_ID}/zip" \
            --output locked_rrf.zip
          echo "${LOCKED_RRF_ZIP_SHA256}  locked_rrf.zip" | sha256sum --check -
          mkdir locked_rrf
          unzip -q locked_rrf.zip -d locked_rrf
      - name: Download current IAU MDC
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://ceresiaumdc.ta3.sk/downloads/lists_shw_data/streamfulldata.json" \
            --output streamfulldata.json
      - name: Execute frozen held-out null
        run: |
          set -euo pipefail
          python orbittrace_new_discovery_screen/heldout_local_null.py \
            --scan locked_rrf/orbittrace_fixed4_locked_rrf_scan.json.gz \
            --mdc streamfulldata.json \
            --ranks 95 105 \
            --out heldout_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-raw-heldout-local-null
          path: heldout_output/
          if-no-files-found: warn
          retention-days: 60
