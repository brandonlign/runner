name: ISEF XMM prior stacked-catalog exclusion
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_prior_stacked_exclusion.py'
      - '.github/workflows/isef-xmm-prior-stacked-exclusion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install astropy numpy scipy
      - run: python isef/xmm_prior_stacked_exclusion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-prior-stacked-exclusion
          path: results/xmm_prior_stacked_exclusion.json
          if-no-files-found: error
