name: OrbitTrace support-cut recurrent orphan completion truth v1
on:
  push:
    branches: [agent/orbittrace-support-cut-recurrent-orphan-completion-truth-v1]
    paths: ['.github/workflows/orbittrace_support_cut_recurrent_orphan_completion_truth_v1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  truth:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and audit frozen evaluator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/ranker input/v8 input/orphan input/v3 output
          test "$(git hash-object orbittrace_support_cut_recurrent_orphan_completion_v1/PROTOCOL.md)" = '62746b013891147f8df99de3e2d8400b81b01353'
          test "$(git hash-object orbittrace_support_cut_recurrent_orphan_completion_v1/TRUTH_FREEZE.md)" = 'c0285177db7bc35cf43106dad1ae962a55a742b4'
          test "$(git hash-object orbittrace_support_cut_recurrent_orphan_completion_v1/evaluate_truth.py)" = '814be9480f59aea40ea6e8483409bde1ebcec232'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_support_cut_recurrent_orphan_completion_v1/evaluate_truth.py
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-support-cut-recurrent-orphan-completion-v1
          path: input/orphan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32043362123
      - name: Verify immutable Stage-1 PASS before opening truth
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py|cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json|cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/orphan/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_PRELABEL.json|cut -d' ' -f1)" = '278d659542668e52033a5369f9afdf685e010a2c14c7ff5211b0b60dd73f2d4a'
          test "$(sha256sum input/orphan/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_STRUCTURAL.json|cut -d' ' -f1)" = '38b68cf74dc3d69128beb484abd2af3a266c40987266d2941f4855a53a0ed374'
          python - <<'PY'
          import json
          p=json.load(open('input/orphan/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_PRELABEL.json'))
          s=json.load(open('input/orphan/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_STRUCTURAL.json'))
          assert p['scientific_role']=='PRELABEL_SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1'
          assert p['shower_truth_used'] is False and p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert s['scientific_role']=='ZERO_LABEL_STRUCTURAL_GATE' and s['shower_truth_used'] is False
          assert s['verdict']=='PASS_SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_STRUCTURAL'
          assert len(s['gates'])==8 and all(s['gates'].values())
          assert s['prelabel_sha256']=='278d659542668e52033a5369f9afdf685e010a2c14c7ff5211b0b60dd73f2d4a'
          PY
      - name: Evaluate exact sealed catalogue order
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_support_cut_recurrent_orphan_completion_v1/evaluate_truth.py \
            --prelabel input/orphan/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_PRELABEL.json \
            --structural-result input/orphan/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_STRUCTURAL.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output
      - name: Enforce binding truth contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_TRUTH.json'))
          assert r['schema']=='ORBITTRACE_SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_TRUTH'
          assert r['verdict'] in {'PASS_SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1','FAIL_SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1'}
          assert len(r['gates'])==10 and len(r['panels'])==16
          assert r['prelabel_sha256']=='278d659542668e52033a5369f9afdf685e010a2c14c7ff5211b0b60dd73f2d4a'
          assert r['structural_result_sha256']=='38b68cf74dc3d69128beb484abd2af3a266c40987266d2941f4855a53a0ed374'
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          print(r['verdict'])
          print(json.dumps({'scales':r['scale_aggregates'],'gates':r['gates']},indent=2,sort_keys=True))
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          cp input/orphan/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_PRELABEL.json output/ 2>/dev/null || true
          cp input/orphan/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_STRUCTURAL.json output/ 2>/dev/null || true
          sha256sum orbittrace_support_cut_recurrent_orphan_completion_v1/PROTOCOL.md orbittrace_support_cut_recurrent_orphan_completion_v1/TRUTH_FREEZE.md orbittrace_support_cut_recurrent_orphan_completion_v1/evaluate_truth.py input/orphan/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_PRELABEL.json input/orphan/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_STRUCTURAL.json output/SUPPORT_CUT_RECURRENT_ORPHAN_COMPLETION_V1_TRUTH.json > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-support-cut-recurrent-orphan-completion-truth-v1
          path: output
          if-no-files-found: error
          retention-days: 90
