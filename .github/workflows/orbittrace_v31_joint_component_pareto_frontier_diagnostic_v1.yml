name: OrbitTrace v31 joint-component Pareto-frontier diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v31_joint_component_pareto_frontier_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v31_joint_component_pareto_frontier_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v31-joint-component-pareto-frontier-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 31704c312c09be2765ad3f65a0685d1acfd2b055
          path: frozen-v40
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen diagnostic source
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/source input/auth input/payload input/truth output/freeze output/diag
          test "$(git hash-object orbittrace_v31_joint_component_pareto_frontier_diagnostic_v1/PROTOCOL.md)" = '419d55f1a9b266157757a0467f90a491785466cd'
          test "$(git hash-object orbittrace_v31_joint_component_pareto_frontier_diagnostic_v1/diagnose.py)" = '6cc8ca500ac29661226c19f339d4cde18290a5d8'
          test "$(git -C frozen-v40 rev-parse HEAD)" = '31704c312c09be2765ad3f65a0685d1acfd2b055'
          test "$(git -C frozen-v40 hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git -C frozen-v40 hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v31_joint_component_pareto_frontier_diagnostic_v1/diagnose.py

      - name: Restore exact #1098 truth-free signal before any outcome information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088724826/zip' -o input/source.zip
          echo '11498b73237304f4175f37910596700ed78284bc6106d0c21dcaab66f97b7978  input/source.zip' | sha256sum -c -
          unzip -p input/source.zip diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json > input/source/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json
          rm -f input/source.zip
          echo 'a3bcea66b72003a38cc492ea3b182d92cd20f3d1b94a43acbc8a0cbdd465ed07  input/source/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json' | sha256sum -c -

      - name: Freeze 60-family Pareto frontier before #1113 or truth
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:.
        run: |
          set -euo pipefail
          python -u orbittrace_v31_joint_component_pareto_frontier_diagnostic_v1/diagnose.py freeze \
            --source-signal input/source/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json \
            --output output/freeze
          python - <<'PY'
          import json
          r=json.load(open('output/freeze/V31_JOINT_COMPONENT_PARETO_FRONTIER_VECTOR.json'))
          assert r['verdict']=='PASS_V31_JOINT_COMPONENT_PARETO_FRONTIER_VECTOR_FREEZE'
          assert r['scientific_role']=='FIXED_60_JOINT_FAMILY_PARETO_FRONTIER_FROZEN_BEFORE_OUTCOME_TRUTH_OR_1113_AUTHORIZATION'
          assert r['family_count']==229 and r['joint_family_count']==60 and len(r['families'])==60
          assert r['frontier_family_count']>=1 and r['frontier_family_count']+r['dominated_family_count']==60
          for k in ('threshold_selected','quantile_selected','top_k_selected','rank_window_selected','literature_budget_used','second_pareto_layer_evaluated','relaxed_dominance_evaluated','epsilon_dominance_evaluated','weighted_score_evaluated','candidate_total_order_evaluated','promotion_position_evaluated','oracle_identity_hardcoded','truth_aware_group_identity_used_for_frontier','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_PARETO_FRONTIER_VECTOR_FREEZE',r['frontier_family_count'],r['canonical_sha256_without_self_field'])
          PY

      - name: Restore #1113 authorization only after frontier freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088994714/zip' -o input/auth.zip
          echo '5bddfbe4abda60006757561d4c6477102317e02f5fb9555330e0b62eaf3353df  input/auth.zip' | sha256sum -c -
          unzip -p input/auth.zip diag/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json > input/auth/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json
          rm -f input/auth.zip
          echo '939f4288a5f0d2de84ef566bb93713da664230deb65777c422795c93fba10c6d  input/auth/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json' | sha256sum -c -

      - name: Restore immutable #950 HDB payload after frontier freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          m=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          f=json.load(open('input/payload/hdbscan/family_memberships.json'))
          assert m['truth_accessed'] is False and f['truth_accessed'] is False
          assert len(m['family_ids'])==229 and len(f['families'])==229
          assert m['target_information_access'] is False and m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_PARETO_IMMUTABLE_HDB_PAYLOAD')
          PY

      - name: Restore immutable exposed truth only after frontier freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth

      - name: Audit threshold-free frontier priority only
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:.
        run: |
          set -euo pipefail
          python -u orbittrace_v31_joint_component_pareto_frontier_diagnostic_v1/diagnose.py audit \
            --vector output/freeze/V31_JOINT_COMPONENT_PARETO_FRONTIER_VECTOR.json \
            --authorization input/auth/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json \
            --hdb-root input/payload/hdbscan \
            --truth-root input/truth \
            --output output/diag

      - name: Enforce diagnostic-only firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V31_JOINT_COMPONENT_PARETO_FRONTIER_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V31_JOINT_COMPONENT_PARETO_FRONTIER_DIAGNOSTIC','FAIL_V31_JOINT_COMPONENT_PARETO_FRONTIER_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_RESULT_THRESHOLD_FREE_PRIORITY_STRUCTURE_DIAGNOSTIC_NO_ORDER_OR_SUCCESSOR_EVALUATED'
          assert r['source_run']==31457923695 and r['source_artifact']==9088724826
          assert r['source_signal_sha256']=='a3bcea66b72003a38cc492ea3b182d92cd20f3d1b94a43acbc8a0cbdd465ed07'
          assert r['authorization_run']==31458734952 and r['authorization_artifact']==9088994714
          assert r['authorization_result_sha256']=='939f4288a5f0d2de84ef566bb93713da664230deb65777c422795c93fba10c6d'
          assert r['family_count']==229 and r['joint_family_count']==60
          assert r['frontier_family_count']+r['dominated_family_count']==60
          assert set(r['annual_diagnostics'])=={'2013','2014'}
          for k in ('new_rank_or_score_evaluated','candidate_total_order_evaluated','selector_order_evaluated','promotion_position_evaluated','replacement_rule_evaluated','literature_panel_evaluated','successor_selected','threshold_search','quantile_search','effect_size_threshold_selected','top_k_search','rank_window_search','budget_specific_rule','year_specific_rule','second_pareto_layer_evaluated','relaxed_dominance_evaluated','epsilon_dominance_evaluated','weighted_score_evaluated','alternate_component_statistic_search','component_size_search','q_calibration_search','graph_or_component_redefinition','feature_search','model_search','fusion_search','source_quota_selected','oracle_identity_hardcoded','truth_aware_group_identity_used_for_ranking','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['frontier_family_count'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v31_joint_component_pareto_frontier_diagnostic_v1/PROTOCOL.md \
            orbittrace_v31_joint_component_pareto_frontier_diagnostic_v1/diagnose.py \
            input/source/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json \
            output/freeze/V31_JOINT_COMPONENT_PARETO_FRONTIER_VECTOR.json \
            input/auth/V42_JOINT_COMPONENT_PLACEMENT_DIAGNOSTIC.json \
            input/payload.zip input/truth.zip \
            > output/V31_JOINT_COMPONENT_PARETO_FRONTIER_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-joint-component-pareto-frontier-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
