name: ISEF PUNCH R3 WCS geometry probe
on:
  push:
    branches: [main]
    paths:
      - 'isef/punch_r3_wcs_geometry_probe.py'
      - '.github/workflows/isef-punch-r3-wcs-geometry-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wcsprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install astropy astroquery 'fsspec[http]'
      - run: python isef/punch_r3_wcs_geometry_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-punch-r3-wcs-geometry-probe
          path: results/punch_r3_wcs_geometry_probe/
          if-no-files-found: error
