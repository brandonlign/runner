name: ISEF XMM embedded ObsID parent validation
on:
  push:
    paths:
      - 'isef/xmm_embedded_obsid_parent_validation.py'
      - '.github/workflows/isef-xmm-embedded-obsid-parent-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8'
      - run: timeout 600s python isef/xmm_embedded_obsid_parent_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-xmm-embedded-obsid-parent-validation
          path: results/xmm_embedded_obsid_parent_validation.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY' >/tmp/r.md
          import json
          from pathlib import Path
          print('## XMM embedded-ObsID parent validation')
          p=Path('results/xmm_embedded_obsid_parent_validation.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:50000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
