name: GhostStream external zero-speed-slope sensitivity

on:
  push:
    branches:
      - agent/ghoststream-external-zero-slope-sensitivity
    paths:
      - ghoststream_external/run_full_external_replication.py
      - .github/workflows/ghoststream_external_zero_slope.yml
  pull_request:
    branches:
      - main
    paths:
      - ghoststream_external/run_full_external_replication.py
      - .github/workflows/ghoststream_external_zero_slope.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-external-zero-slope-sensitivity

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy requests

      - name: Build zero-speed-slope sensitivity runner
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('ghoststream_external/run_full_external_replication.py')
          target = Path('ghoststream_external/run_full_external_zero_slope.py')
          text = source.read_text()
          old = 'SUNLON_SLOPE=-0.1029483; BETA_SLOPE=-0.0230546; VG_SLOPE=-0.0293492'
          new = 'SUNLON_SLOPE=-0.1029483; BETA_SLOPE=-0.0230546; VG_SLOPE=0.0'
          if text.count(old) != 1:
              raise RuntimeError('Expected exactly one frozen speed-slope definition')
          target.write_text(text.replace(old, new))
          print(f'Wrote {target} with VG_SLOPE=0.0')
          PY

      - name: Compile
        run: python -m py_compile ghoststream_external/run_full_external_zero_slope.py

      - name: Run complete-catalog zero-slope sensitivity
        run: python ghoststream_external/run_full_external_zero_slope.py

      - name: Record sensitivity protocol
        run: |
          cat > ghoststream_external/results/ZERO_SPEED_SLOPE_PROTOCOL.md <<'EOF'
          # GhostStream complete-catalog zero-speed-slope sensitivity

          This run is source-equivalent to `run_full_external_replication.py` except that
          the unresolved geocentric-speed drift term is fixed from
          `-0.0293492 km s^-1 deg^-1` to `0.0`.

          No radiant centre, radiant drift, width, activity interval, orbital threshold,
          significance threshold, archive range, or pass/fail gate is changed.
          EOF
          sha256sum \
            ghoststream_external/run_full_external_replication.py \
            ghoststream_external/run_full_external_zero_slope.py \
            .github/workflows/ghoststream_external_zero_slope.yml \
            ghoststream_external/results/* \
            > ghoststream_external/results/ZERO_SPEED_SLOPE_SHA256.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-external-zero-speed-slope
          path: ghoststream_external/results
          if-no-files-found: error
          retention-days: 90

      - name: Preserve results on branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ghoststream_external/results ghoststream_external/run_full_external_zero_slope.py
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Preserve zero-speed-slope external sensitivity results'
            git push origin HEAD:agent/ghoststream-external-zero-slope-sensitivity
          fi
