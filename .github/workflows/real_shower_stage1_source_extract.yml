name: Real-shower Stage-1 source extraction

on:
  pull_request:
    branches:
      - agent/real-shower-meta-stage0
    paths:
      - .github/workflows/real_shower_stage1_source_extract.yml
      - real_shower_meta_stage0/run_set_model_pilot.py.gz.b64
      - real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-shower-stage1-source-extract
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-shower-relation-clique-stage1
      - name: Decode frozen Stage-0 sources
        run: |
          mkdir -p source_extract
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          entries = [
              ('real_shower_meta_stage0/run_set_model_pilot.py.gz.b64', 'source_extract/run_set_model_pilot_source.py'),
              ('real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64', 'source_extract/run_baseline_ceiling_source.py'),
          ]
          hashes = []
          for encoded_path, output_path in entries:
              src = Path(encoded_path)
              raw = gzip.decompress(base64.b64decode(''.join(src.read_text().split()), validate=True))
              Path(output_path).write_bytes(raw)
              digest = hashlib.sha256(raw).hexdigest()
              hashes.append(f'{digest}  {Path(output_path).name}')
              print(Path(output_path).name, 'bytes:', len(raw), 'sha256:', digest)
          Path('source_extract/source_sha256.txt').write_text('\n'.join(hashes) + '\n')
          PY
      - name: Upload exact frozen sources
        uses: actions/upload-artifact@v4
        with:
          name: real-shower-stage0-decoded-sources
          path: source_extract
          if-no-files-found: error
          retention-days: 7
