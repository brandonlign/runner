name: OrbitTrace discovery orbit adjudication

on:
  push:
    branches:
      - research/orbittrace-new-discovery-screen-20260828
    paths:
      - orbittrace_new_discovery_screen/adjudicate_orbits.py
      - .github/workflows/orbittrace_discovery_orbit_adjudication.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOCKED_RRF_ARTIFACT_ID: '8973803775'
      LOCKED_RRF_ZIP_SHA256: '1c26dc06193eb2119a0e181d9a85c22c18b09da8316fe6679754cb554ca29d34'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GMN reader
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 \
            requests==2.32.5 beautifulsoup4==4.12.3 click==8.0.4 future==1.0.0
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Download exact frozen locked-RRF catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCKED_RRF_ARTIFACT_ID}/zip" \
            --output locked_rrf.zip
          echo "${LOCKED_RRF_ZIP_SHA256}  locked_rrf.zip" | sha256sum --check -
          mkdir -p locked_rrf
          unzip -q locked_rrf.zip -d locked_rrf
          test -s locked_rrf/orbittrace_fixed4_locked_rrf_scan.json.gz

      - name: Download current official IAU MDC database
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://ceresiaumdc.ta3.sk/downloads/lists_shw_data/streamfulldata.json" \
            --output streamfulldata.json
          python - <<'PY'
          import json
          d=json.load(open('streamfulldata.json'))
          print('MDC version:', d.get('version'), 'showers:', d.get('count'))
          assert d.get('data') and int(d.get('count', 0)) >= 1000
          PY

      - name: Adjudicate ranks 96 and 294
        run: |
          set -euo pipefail
          python orbittrace_new_discovery_screen/adjudicate_orbits.py \
            --scan locked_rrf/orbittrace_fixed4_locked_rrf_scan.json.gz \
            --mdc streamfulldata.json \
            --ranks 96 294 \
            --scan-zip-sha256 "${LOCKED_RRF_ZIP_SHA256}" \
            --out orbit_output

      - name: Upload orbit adjudication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-discovery-orbit-adjudication
          path: orbit_output/
          if-no-files-found: warn
          retention-days: 30
