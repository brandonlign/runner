name: OrbitTrace v6 exact sub-center fanout v3 real equivalence

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-exact-fanout-v2
    paths:
      - 'orbittrace_v6_exact_fanout_v3/**'
      - '.github/workflows/orbittrace_v6_exact_subcenter_fanout_v3_real_equivalence.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-v6-subcenter-real-equivalence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  exact-equivalence:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: execution

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v6/ghoststream_fixed4_application/requirements.txt

      - name: Install exact frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v6/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Download immutable target-excluded 2023 pre-exact input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p preexact
          gh run download 31282128101 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-v6-fanout-preexact-2023 \
            --dir preexact
          test -f preexact/v6_preexact_2023.pkl
          test -f preexact/v6_preexact_2023.sha256
          echo PASS_V6_SUBCENTER_EQUIVALENCE_PREEXACT_IDENTITY

      - name: Reconstruct immutable repaired v6 source
        run: |
          set -euo pipefail
          cd frozen-v6
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          cat orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.frozen.py' | sha256sum -c -
          cd ..
          PYTHONPATH=execution python - <<'PY'
          from pathlib import Path
          from orbittrace_v6_checkpointed_fallback.common import apply_exact_two_line_repair
          digest = apply_exact_two_line_repair(Path('/tmp/v6.frozen.py'), Path('/tmp/v6.repaired.py'))
          assert digest == '257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          print('PASS_V6_SUBCENTER_EQUIVALENCE_REPAIRED_SOURCE')
          PY

      - name: Compare full-center and contiguous-unit exact outputs on bounded real data
        env:
          PYTHONPATH: execution:frozen-v6/orbittrace_wavelet_catalogue_v3:frozen-v6/orbittrace_multi_anchor_energy_v3:/tmp
        run: |
          set -euo pipefail
          python -u execution/orbittrace_v6_exact_fanout_v3/audit_real_exact_equivalence.py \
            --year 2023 \
            --split-records 512 \
            --preexact-checkpoint preexact/v6_preexact_2023.pkl \
            --repaired-source /tmp/v6.repaired.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2
