name: OrbitTrace GMN v31 offline development package v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-v31-offline-development-package-v1
    paths:
      - 'orbittrace_gmn_v31_offline_development_package_v1/**'
      - '.github/workflows/orbittrace_gmn_v31_offline_development_package_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and pin exporter
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/v8 input/p19 input/ranker output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(git hash-object orbittrace_gmn_v31_principle_local_geometry_oof_v1/run_development.py)" = 'b4e2d72e532e47aa95ed335f690748423d11ea59'
          test "$(git hash-object orbittrace_gmn_v31_offline_development_package_v1/PACKAGE_SPEC.md)" = 'ce6811c02069740d187d8e97e2a5b88bc28d442c'
          test "$(git hash-object orbittrace_gmn_v31_offline_development_package_v1/export_package.py)" = 'dd1cef05587d1b21f5f12145d5d01af5451ec8fd'
          python -m py_compile orbittrace_gmn_v31_offline_development_package_v1/export_package.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086

      - name: Verify immutable target-excluded inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'

      - name: Export exact parent package with transient-network retries
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4; do
            rm -rf output
            mkdir -p output
            echo "PACKAGE_ATTEMPT=$attempt"
            if python -u orbittrace_gmn_v31_offline_development_package_v1/export_package.py \
              --parent-source orbittrace_gmn_v31_principle_local_geometry_oof_v1/run_development.py \
              --quality-source input/ranker/run_urc_union_ranker.py \
              --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
              --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
              --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
              --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
              --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
              --p19-prelabel-json input/p19/p19_prelabel_payload.json \
              --output output; then
              ok=1
              break
            fi
            rm -rf output
            mkdir -p output
            sleep 5
          done
          test "$ok" = 1

      - name: Enforce package schema and scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, numpy as np
          p='output/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json'
          m=json.load(open(p))
          X=np.load('output/package/GMN_V31_OFFLINE_X.npy',allow_pickle=False)
          C=np.load('output/package/GMN_V31_OFFLINE_CENTROIDS.npy',allow_pickle=False)
          assert m['verdict']=='PASS_GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1'
          assert m['scientific_role']=='ENGINEERING_PROVENANCE_ONLY_NO_SUCCESSOR_EVALUATED'
          assert m['parent_source_git_blob']=='b4e2d72e532e47aa95ed335f690748423d11ea59'
          assert m['candidate_count']==226 and m['feature_dimension']==23 and m['centroid_dimension']==8
          assert X.shape==(226,23) and C.shape==(226,8)
          def ah(a):
            h=hashlib.sha256(); h.update(str(a.dtype).encode()); h.update(str(tuple(a.shape)).encode()); h.update(np.ascontiguousarray(a).tobytes()); return h.hexdigest()
          assert ah(X)==m['feature_matrix_sha256']=='fea3b063772c75b675e37a227b53a4aa3c5b86fdcbfcef1487b1e1448689cdf5'
          assert ah(C)==m['centroid_matrix_sha256']
          assert m['parent_prelabel_sha256']=='b45c4ce1a45bff515e411e211bc51dee879229ee97f7fcb7d8e7e05bfc106d09'
          assert m['parent_margin_sha256']=='f38c96e3fa4ea98f51217b36d639e96edbf3ebcb65123248f0f118d3298173bd'
          assert len(m['hard_order'])==226 and len(set(m['hard_order']))==226
          assert len(m['family_input_order'])==226 and len(set(m['family_input_order']))==226
          assert set(m['hard_order'])==set(m['family_input_order'])
          assert len(m['rows'])==226 and {r['fold'] for r in m['rows']}==set(range(5))
          assert set(r['family_id'] for r in m['rows'])==set(m['family_input_order'])
          assert m['parent_fused_metrics']['recovered_at_25']==23
          assert m['parent_fused_metrics']['recovered_at_50']==41
          assert m['parent_fused_metrics']['recovered_at_100']==66
          assert m['parent_fused_metrics']['qualified_matches']==95
          assert abs(m['parent_fused_metrics']['top100_dominant_precision']-0.7229521515453452)<1e-15
          assert abs(m['parent_fused_metrics']['mrr']-0.050244164168646674)<1e-15
          for k in ('raw_event_rows_exported','raw_event_ids_exported','raw_hidden_label_mapping_exported','new_feature_or_score_created','new_rank_evaluated','successor_selected','sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
            assert m[k] is False
          assert m['blind_exclusion']==[20.0,55.0]
          s=open(p).read()
          assert '"event_ids"' not in s and '"hidden_labels"' not in s and '"event_rows"' not in s
          print('PASS_OFFLINE_V31_PACKAGE_FIREWALL',len(m['eligible_labels']),sum(bool(r['truth']['positive']) for r in m['rows']))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_gmn_v31_offline_development_package_v1/PACKAGE_SPEC.md \
            orbittrace_gmn_v31_offline_development_package_v1/export_package.py \
            orbittrace_gmn_v31_principle_local_geometry_oof_v1/run_development.py \
            input/ranker/run_urc_union_ranker.py input/v8/pooled_year_centroid_v8_development.json \
            input/p19/p19_prelabel_payload.json output/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json \
            output/package/GMN_V31_OFFLINE_X.npy output/package/GMN_V31_OFFLINE_CENTROIDS.npy \
            > output/source_input_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/development_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-v31-offline-development-package-v1
          path: output
          if-no-files-found: error
          retention-days: 90
