name: OrbitTrace GMN v31 complete-graph OPF v1

on:
  push:
    branches:
      - agent/orbittrace-gmn-v31-opf-complete-graph-v1
    paths:
      - 'orbittrace_gmn_v31_opf_complete_graph_v1/**'
      - '.github/workflows/orbittrace_gmn_v31_opf_complete_graph_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact runtime and compile frozen source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/ranker input/offline output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          python -m py_compile orbittrace_gmn_v31_opf_complete_graph_v1/run_offline.py
          sha256sum orbittrace_gmn_v31_opf_complete_graph_v1/PROTOCOL.md orbittrace_gmn_v31_opf_complete_graph_v1/run_offline.py > output/frozen_source_sha256.txt
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify exact diversity evaluator source
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - name: Pass analytic canonical OPF self-tests before GMN science
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_v31_opf_complete_graph_v1/run_offline.py --self-test | tee output/opf_self_test.txt
          grep -q PASS_COMPLETE_GRAPH_OPF_ENGINEERING_SELF_TESTS output/opf_self_test.txt
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-gmn-v31-offline-development-package-v1
          path: input/offline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31663453082
      - name: Verify authoritative offline package before science
        run: |
          set -euo pipefail
          test "$(sha256sum input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json | cut -d' ' -f1)" = '16fb5ef3cd8dbbb3873e9bc23874fe7da3db68498772a5e992fbceed6cb980d7'
          echo PASS_AUTHORITATIVE_OFFLINE_PACKAGE_BEFORE_COMPLETE_GRAPH_OPF
      - name: Run first binding offline GMN complete-graph OPF outcome
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_v31_opf_complete_graph_v1/run_offline.py \
            --manifest input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json \
            --features input/offline/package/GMN_V31_OFFLINE_X.npy \
            --centroids input/offline/package/GMN_V31_OFFLINE_CENTROIDS.npy \
            --output output
      - name: Enforce binding result and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/GMN_V31_COMPLETE_GRAPH_OPF_V1_RESULT.json'))
          e=json.load(open('output/GMN_V31_COMPLETE_GRAPH_OPF_EVIDENCE.json'))
          assert r['verdict'] in {'PASS_GMN_V31_COMPLETE_GRAPH_OPF_V1','FAIL_GMN_V31_COMPLETE_GRAPH_OPF_V1'}
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_V31_SUCCESSOR_DEVELOPMENT_ONLY'
          assert r['first_valid_outcome_binding'] is True
          assert r['candidate_count']==226 and r['feature_dimension']==23
          assert r['feature_matrix_sha256']=='fea3b063772c75b675e37a227b53a4aa3c5b86fdcbfcef1487b1e1448689cdf5'
          assert r['centroid_matrix_sha256']=='a53b9862f1ec3d751745f80aec2625d7904128474c9263c55ea953cf60d0621f'
          assert r['package_manifest_sha256']=='16fb5ef3cd8dbbb3873e9bc23874fe7da3db68498772a5e992fbceed6cb980d7'
          assert r['parent_margin_sha256']==r['recomputed_parent_margin_sha256']=='f38c96e3fa4ea98f51217b36d639e96edbf3ebcb65123248f0f118d3298173bd'
          assert r['parent_control']=={'recovered_at_25':23,'recovered_at_50':41,'recovered_at_100':66,'top100_dominant_precision':0.7229521515453452,'mrr':0.050244164168646674,'qualified_matches':95}
          assert r['parent_reproduced_metrics']['recovered_at_25']==23 and r['parent_reproduced_metrics']['recovered_at_50']==41 and r['parent_reproduced_metrics']['recovered_at_100']==66
          assert r['strict_whole_shower_oof'] is True and r['fold_count']==5
          assert r['opf_graph']=='complete' and r['opf_path_cost']=='minimax fmax'
          assert r['diversity']=={'lambda':0.8,'scale':1.0}
          assert r['fusion']=='equal rank-sum with immutable P19 hard order'
          assert len(r['fold_diagnostics'])==5 and len(e['rows'])==226 and r['unit_factor']>0
          for k in ('validation_learning','pruning','knn_sparse_graph','alternative_path_cost','prototype_search','class_weighting','metric_search','feature_search','scaling_search','score_calibration','threshold_search','parent_opf_blend','graph_density_augmentation','diversity_search','fusion_search','post_result_second_search','raw_event_rows_accessed','raw_event_ids_accessed','raw_hidden_label_mapping_accessed','sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
            assert r[k] is False
          assert r['blind_exclusion']==[20.0,55.0] and e['blind_exclusion']==[20.0,55.0]
          if r['verdict'].startswith('PASS_'):
            assert all(r['pass_gates'].values()) and r['sonotaco_benchmark_authorized_by_this_result'] is True
          else:
            assert not all(r['pass_gates'].values()) and r['sonotaco_benchmark_authorized_by_this_result'] is False
          print(r['verdict'],r['parent_control'],r['opf_equal_rank_fusion'],r['pass_gates'])
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_gmn_v31_opf_complete_graph_v1/PROTOCOL.md orbittrace_gmn_v31_opf_complete_graph_v1/run_offline.py input/ranker/run_urc_union_ranker.py input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json input/offline/package/GMN_V31_OFFLINE_X.npy input/offline/package/GMN_V31_OFFLINE_CENTROIDS.npy output/GMN_V31_COMPLETE_GRAPH_OPF_V1_RESULT.json output/GMN_V31_COMPLETE_GRAPH_OPF_EVIDENCE.json > output/source_input_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-gmn-v31-complete-graph-opf-v1
          path: output
          if-no-files-found: error
          retention-days: 90
