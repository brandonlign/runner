name: OrbitTrace cross-year two-view membership P2 canonical v2 development

on:
  pull_request:
    branches:
      - agent/orbittrace-crossyear-two-view-membership-p2-freeze
    paths:
      - orbittrace_crossyear_two_view_membership_p2/RUN_V2.md

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-crossyear-two-view-p2-canonical-v2-development
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce one-file child and exact P1 scientific no-go prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'orbittrace_crossyear_two_view_membership_p2/RUN_V2.md'
          content="$(git show "$HEAD_SHA":orbittrace_crossyear_two_view_membership_p2/RUN_V2.md)"
          first="$(printf '%s\n' "$content" | sed -n '1p')"
          p1_run="$(printf '%s\n' "$content" | sed -n '2p')"
          test "$first" = 'EXECUTE_CANONICAL_P2_V2_AFTER_EXACT_P1_NO_GO'
          [[ "$p1_run" =~ ^[0-9]+$ ]]
          test "$(printf '%s\n' "$content" | wc -l)" -eq 2

          rm -rf /tmp/p1-prereq && mkdir -p /tmp/p1-prereq
          gh run download "$p1_run" --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-probabilistic-membership-p1-development --dir /tmp/p1-prereq
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/p1-prereq/probabilistic_membership_p1_development.json').read_text())
          assert r['verdict']=='FAIL_PROBABILISTIC_MEMBERSHIP_P1_NO_GO',r['verdict']
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['parameter_search'] is False
          assert r['configuration']['new_members_can_seed_growth'] is False
          assert r['configuration']['v8_source_commit']=='c9d6c44704013ba0c9430100e98a29a56b453304'
          assert r['baseline_v8']['qualified_matches']==95
          assert r['baseline_v8']['recovered_at_100']==58
          assert r['gates']['v8_baseline_reproduced'] is True
          assert len(r['membership_pretruth_sha256'])==64
          assert not all(r['gates'].values())
          print('PASS_CANONICAL_P2_EXACT_P1_NO_GO_PREREQUISITE')
          PY
          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_crossyear_two_view_membership_p2/RUN_V2.md

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: exact-v8
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct canonical P2 v2 runtime and frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/{v3,v6,v8,dsh} output
          echo '7637b6fb310ee3f24f1de8479a34d10c594dc55471eee55b8854e1c28787e8dd  orbittrace_crossyear_two_view_membership_p2/run_development.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py \
            orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2_v1.py
          echo '169ed0a276cdcae628cd830130cfb03d6511a972df50d4dc10ffddfc1c8e05da  /tmp/p2_v1.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py \
            /tmp/p2_v1.py /tmp/run_p2_canonical_v2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/run_p2_canonical_v2.py' | sha256sum -c -
          python -m py_compile /tmp/run_p2_canonical_v2.py

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          test "$(git -C exact-v8 rev-parse HEAD)" = 'c9d6c44704013ba0c9430100e98a29a56b453304'
          test "$(git -C exact-v8 hash-object orbittrace_pooled_year_centroid_v8/run_development.py)" = 'f248df78e1258b132b41aecca6a985a5eb782654'
          test "$(git -C exact-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          cp exact-v8/orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py input/v3/wavelet_episode_comparator.py
          test "$(git hash-object input/v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          PYTHONPATH="input/v3" python - <<'PY'
          import multi_anchor_energy_v3 as v3
          import wavelet_episode_comparator as brown
          assert callable(getattr(brown,'radiant_unit_vectors',None))
          assert callable(getattr(brown,'wavelet_episode_score',None))
          assert callable(getattr(v3,'episode_score_details',None))
          print('PASS_P2_EXACT_V8_EPISODE_RUNTIME_BINDING')
          PY

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" -o input/v6.zip
          echo '3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v6.zip' | sha256sum -c -
          unzip -q input/v6.zip -d input/v6
          echo 'f76b8448f299ccf078fc5978c0890b9a084f131080db8d2136b5e6dba77edc7b  input/v6/label_free_sparse_support_v6_families.json.gz' | sha256sum -c -

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009728299/zip" -o input/v8.zip
          echo '88d2d607e05d027015c338f7e23b64a6195e55ae24f1b2ac745f5e9bc6df599e  input/v8.zip' | sha256sum -c -
          unzip -q input/v8.zip -d input/v8
          echo 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b  input/v8/pooled_year_centroid_v8_development.json' | sha256sum -c -

          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > input/dsh/literature_comparators.py
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  input/dsh/literature_comparators.py' | sha256sum -c -
          python -m py_compile input/dsh/literature_comparators.py
          echo PASS_CANONICAL_P2_V2_EXACT_INPUT_IDENTITIES

      - name: Execute one-shot target-excluded canonical P2 v2 development
        env:
          PYTHONPATH: exact-v8:input/v3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python -u /tmp/run_p2_canonical_v2.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --v6-structural-families-json-gz input/v6/label_free_sparse_support_v6_families.json.gz \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --v8-runner exact-v8/orbittrace_pooled_year_centroid_v8/run_development.py \
            --dsh-comparator input/dsh/literature_comparators.py \
            --output output
          cat output/CROSSYEAR_TWO_VIEW_MEMBERSHIP_P2_DEVELOPMENT.md

      - name: Enforce frozen P2 v2 result and claim boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/crossyear_two_view_membership_p2_development.json').read_text())
          assert r['verdict'] in {'PASS_CROSSYEAR_TWO_VIEW_MEMBERSHIP_P2_DEVELOPMENT','FAIL_CROSSYEAR_TWO_VIEW_MEMBERSHIP_P2_NO_GO'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['family_count']==226
          assert r['configuration']['window_half_width_deg']==5.0
          assert r['configuration']['negative_minimum_per_direction']==128
          assert r['configuration']['responsibility_threshold']==0.5
          assert r['configuration']['parameter_search'] is False
          assert r['configuration']['new_members_can_seed_growth'] is False
          assert r['baseline_v8']['qualified_matches']==95
          assert r['baseline_v8']['recovered_at_100']==58
          assert abs(r['baseline_v8']['mrr']-0.045531138942766655)<1e-15
          assert abs(r['baseline_v8']['top100_dominant_precision']-0.6884631112636006)<1e-12
          assert r['gates']['v8_baseline_reproduced'] is True
          assert r['gates']['exact_dsh_source_identity'] is True
          assert len(r['model_pretruth_sha256'])==64
          assert len(r['membership_pretruth_sha256'])==64
          print('ORBITTRACE_P2_CANONICAL_V2_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'baseline_v8':r['baseline_v8'],'p2':r['p2'],'baseline_large_shower':r['baseline_large_shower'],'p2_large_shower':r['p2_large_shower'],'gates':r['gates'],'diagnostics':r['diagnostics']},indent=2))
          print('ORBITTRACE_P2_CANONICAL_V2_RESULT_END')
          PY

      - name: Record immutable environment
        if: always()
        run: |
          set +e
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum /tmp/run_p2_canonical_v2.py orbittrace_crossyear_two_view_membership_p2/PROTOCOL.md orbittrace_crossyear_two_view_membership_p2/CANONICAL_RUNTIME.md input/dsh/literature_comparators.py > output/source_sha256.txt 2>/dev/null || true
          git -C exact-v8 rev-parse HEAD > output/exact_v8_commit.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-crossyear-two-view-membership-p2-v2-development
          path: output
          if-no-files-found: error
          retention-days: 90
