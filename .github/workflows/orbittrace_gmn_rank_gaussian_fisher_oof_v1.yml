name: OrbitTrace GMN rank-Gaussian Fisher OOF v1 binding

on:
  push:
    branches:
      - agent/orbittrace-gmn-rank-gaussian-fisher-oof-v1
    paths:
      - .github/workflows/orbittrace_gmn_rank_gaussian_fisher_oof_v1.yml

permissions:
  contents: read
  actions: read

jobs:
  binding-development:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FROZEN_IMPLEMENTATION_SHA: 7cb868b71dd3c34f390f471a82ea684c5b2f4ac5
      FIXTURE_RUN_ID: '31566749364'
      RANKER_RUN_ID: '31344632499'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/input/ranker
    steps:
      - name: Check out binding branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Assert workflow-only post-freeze change
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${FROZEN_IMPLEMENTATION_SHA}^{commit}"
          changed="$(git diff --name-only "${FROZEN_IMPLEMENTATION_SHA}" HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = ".github/workflows/orbittrace_gmn_rank_gaussian_fisher_oof_v1.yml"
          git diff --exit-code "${FROZEN_IMPLEMENTATION_SHA}" HEAD -- \
            orbittrace_gmn_rank_gaussian_fisher_oof_v1 \
            orbittrace_gmn_v31_principle_local_geometry_oof_v1

      - name: Set up frozen Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install recorded scientific dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 \
            scipy==1.14.1 \
            scikit-learn==1.5.2

      - name: Download exact target-excluded GMN development fixture
        uses: actions/download-artifact@v4
        with:
          name: orbittrace-gmn-development-fixture-v1
          path: input/fixture
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FIXTURE_RUN_ID }}

      - name: Download exact frozen ranker source
        uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RANKER_RUN_ID }}

      - name: Assert immutable inputs and firewall manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | awk '{print $1}')" = "dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('input/fixture/GMN_DEVELOPMENT_FIXTURE_V1.json').read_text())
          assert m['verdict']=='PASS_GMN_DEVELOPMENT_FIXTURE_V1'
          assert m['scientific_change'] is False
          assert m['blind_exclusion']==[20.0,55.0]
          for k in ('sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert m[k] is False, (k,m[k])
          assert m['feature_matrix_sha256']=='fea3b063772c75b675e37a227b53a4aa3c5b86fdcbfcef1487b1e1448689cdf5'
          assert m['hard_order_sha256']=='2dcaaffaefca68e877fea82ff46a68bbd4c7960dedfdd00a114311d41605b65e'
          assert m['parent_margin_sha256']=='f38c96e3fa4ea98f51217b36d639e96edbf3ebcb65123248f0f118d3298173bd'
          assert m['fisher_scaled_sha256']=='9957292fbe41efa407b9bc5b1f4160cdc0899632135a10b56d2f91f04d54c46e'
          PY

      - name: Execute first valid frozen rank-Gaussian Fisher OOF outcome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python orbittrace_gmn_rank_gaussian_fisher_oof_v1/run_development.py \
            --fixture-root input/fixture \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --output output | tee output/binding_stdout.json

      - name: Upload binding result regardless of scientific verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-gmn-rank-gaussian-fisher-oof-v1-binding
          path: output/
          if-no-files-found: error
          retention-days: 90
