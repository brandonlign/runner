name: OrbitTrace frozen 2026 drift-track discovery

on:
  push:
    branches:
      - research/orbittrace-new-discovery-screen-20260828
    paths:
      - orbittrace_new_discovery_screen/drift_track_2026_discovery_v2.py
      - .github/workflows/orbittrace_drift_track_2026_discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-month:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        month: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROTOCOL_ID: 'orbittrace-raw/DRIFT_TRACK_2026_DISCOVERY_PROTOCOL@adc5f71e'
      SELECTED_VARIANT: 'A_EOM_5_3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 \
            requests==2.32.5 beautifulsoup4==4.12.3 click==8.0.4 future==1.0.0
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Compile corrected frozen discovery entry point
        run: |
          set -euo pipefail
          python -m py_compile \
            orbittrace_new_discovery_screen/drift_track_2026_discovery.py \
            orbittrace_new_discovery_screen/drift_track_2026_discovery_v2.py
      - name: Execute frozen selected-variant discovery month
        run: |
          set -euo pipefail
          echo "Executing ${PROTOCOL_ID}, selected=${SELECTED_VARIANT}, month=${{ matrix.month }}"
          python -m orbittrace_new_discovery_screen.drift_track_2026_discovery_v2 \
            --month '${{ matrix.month }}' \
            --variant "${SELECTED_VARIANT}" \
            --out drift_discovery_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-track-2026-month-${{ matrix.month }}
          path: drift_discovery_output/
          if-no-files-found: warn
          retention-days: 60
