name: Event-centered robust-background confirmation

on:
  pull_request:
    branches:
      - main
    paths:
      - stream_fdr_stage0/event_centered_background_stage0.py
      - stream_fdr_stage0/EVENT_CENTERED_BACKGROUND_PROTOCOL.md
      - .github/workflows/event_centered_background_stage0.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-centered-background-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stream-fdr-stage0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stream_fdr_stage0/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r stream_fdr_stage0/requirements.txt
      - name: Compile frozen confirmation
        run: |
          python -m py_compile stream_fdr_stage0/audit_multinetwork.py
          python -m py_compile stream_fdr_stage0/shared_scan_pilot.py
          python -m py_compile stream_fdr_stage0/predictive_eprocess_pilot.py
          python -m py_compile stream_fdr_stage0/matched_analog_eprocess.py
          python -m py_compile stream_fdr_stage0/tensor_background_stage0.py
          python -m py_compile stream_fdr_stage0/event_centered_background_stage0.py
      - name: Run event-centered kill test
        run: python stream_fdr_stage0/event_centered_background_stage0.py
      - name: Record provenance
        run: |
          mkdir -p stream_fdr_stage0/results/event_centered_background_stage0
          sha256sum stream_fdr_stage0/event_centered_background_stage0.py stream_fdr_stage0/EVENT_CENTERED_BACKGROUND_PROTOCOL.md stream_fdr_stage0/tensor_background_stage0.py > stream_fdr_stage0/results/event_centered_background_stage0/source_sha256.txt
          find stream_fdr_stage0/data/multinetwork -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > stream_fdr_stage0/results/event_centered_background_stage0/input_sha256.txt
          python --version > stream_fdr_stage0/results/event_centered_background_stage0/python_version.txt
          python -m pip freeze > stream_fdr_stage0/results/event_centered_background_stage0/environment.txt
      - name: Upload confirmation evidence
        uses: actions/upload-artifact@v4
        with:
          name: event-centered-background-stage0
          path: stream_fdr_stage0/results/event_centered_background_stage0
          if-no-files-found: error
          retention-days: 90
