name: OrbitTrace GMN v31 event schema audit v1

on:
  push:
    branches: [agent/orbittrace-gmn-v31-event-schema-audit-v1]
    paths: ['.github/workflows/orbittrace_gmn_v31_event_schema_audit_v1.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-gmn-v31-event-schema-audit-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Verify audit source and install exact runtime
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_gmn_v31_event_schema_audit_v1/audit.py)" = '1520702ebc06aa71c57dc66d97b41cb823f872d9'
          python -m py_compile orbittrace_gmn_v31_event_schema_audit_v1/audit.py
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/ranker input/v8 output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify immutable runtime inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Audit field names and completeness only
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_gmn_v31_event_schema_audit_v1/audit.py \
            --ranker-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce zero-endpoint firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/GMN_V31_EVENT_SCHEMA_AUDIT_V1.json'))
          assert r['verdict']=='PASS_GMN_V31_EVENT_SCHEMA_AUDIT'
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['scientific_endpoint_computed'] is False
          assert r['candidate_ranking_computed'] is False
          assert r['truth_metric_computed'] is False
          for k in ('sonotaco_2013_2014_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
            assert r[k] is False
          assert all(v['protected_interval_rows']==0 for v in r['by_year'].values())
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-gmn-v31-event-schema-audit-v1
          path: output
          if-no-files-found: error
          retention-days: 90
