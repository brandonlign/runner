name: SonotaCo phase-span selector source audit

on:
  pull_request:
    branches:
      - agent/sonotaco-hires-multiview-fusion-development
    paths:
      - .github/workflows/sonotaco_phase_span_selector_source_audit.yml
      - sonotaco_phase_span_selector_source_audit/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonotaco-phase-span-selector-source-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sonotaco-phase-span-selector-source-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode, verify, compile, and audit frozen source
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import ast, base64, gzip, hashlib, json
          from pathlib import Path

          parts = sorted(Path('sonotaco_phase_span_selector_source_audit/source_parts').glob('part*.b64'))
          expected_parts = [f'part{i:02d}.b64' for i in range(8)]
          if [part.name for part in parts] != expected_parts:
              raise RuntimeError(f'unexpected source parts: {[part.name for part in parts]}')
          encoded = ''.join(''.join(part.read_text().split()) for part in parts)
          if len(encoded) != 8024:
              raise RuntimeError(f'encoded length mismatch: {len(encoded)}')
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = 'aab855db949bd520aa142a51a140c6e181918be0428bdee082b427fd1240a569'
          if digest != expected:
              raise RuntimeError(f'candidate source mismatch: {digest}')
          text = source.decode('utf-8')
          tree = ast.parse(text)

          constants = {}
          functions = set()
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  functions.add(node.name)
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  try:
                      constants[node.targets[0].id] = ast.literal_eval(node.value)
                  except Exception:
                      pass

          required_functions = {
              'selector_fields', 'selection_tuple', 'component_fields', 'worker', 'main',
          }
          gates = {
              'source_sha256_exact': digest == expected,
              'thresholds_exact': constants.get('THRESHOLDS') == (2.5, 5.0, 7.5),
              'original_calibration_128': constants.get('ORIGINAL_CALIBRATION_NEGATIVES_PER_BIN') == 128,
              'reference_512': constants.get('REFERENCE_NEGATIVES_PER_BIN') == 512,
              'selector_calibration_512': constants.get('SELECTOR_CALIBRATION_NEGATIVES_PER_BIN') == 512,
              'required_functions_present': required_functions <= functions,
              'conditional_selector_present': 'selected_view = "original" if phase3_span <= threshold + 1e-12 else "phase3"' in text,
              'complex_held_out_selection_present': 'for held_out_fold in range(base.N_FOLDS)' in text and 'record["fold"] != held_out_fold' in text,
              'deterministic_pseudofold_present': 'phase-span-selector-pseudofold' in text,
              'sonotaco_2024_absent': '024a.zip' not in text and 'SonotaCo 2024' not in text,
              'ghoststream_values_absent': 'GhostStream' not in text and 'ghoststream' not in text,
          }
          verdict = 'PASS_SONOTACO_PHASE_SPAN_SELECTOR_SOURCE_AUDIT' if all(gates.values()) else 'KILL_SONOTACO_PHASE_SPAN_SELECTOR_SOURCE_AUDIT'
          Path('output/candidate_source.py').write_bytes(source)
          Path('output/source_audit.json').write_text(json.dumps({
              'source_bytes': len(source),
              'source_sha256': digest,
              'encoded_length': len(encoded),
              'constants': {key: constants.get(key) for key in [
                  'THRESHOLDS', 'ORIGINAL_CALIBRATION_NEGATIVES_PER_BIN',
                  'REFERENCE_NEGATIVES_PER_BIN', 'SELECTOR_CALIBRATION_NEGATIVES_PER_BIN',
              ]},
              'functions': sorted(functions),
              'gates': gates,
              'verdict': verdict,
          }, indent=2), encoding='utf-8')
          lines = ['# SonotaCo phase-span selector source audit', '', f'Verdict: **{verdict}**', '']
          lines += [f"- {'PASS' if passed else 'FAIL'} — `{name}`" for name, passed in gates.items()]
          Path('output/SOURCE_AUDIT_RESULT.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          if not all(gates.values()):
              raise SystemExit('Frozen source audit failed')
          PY
          python -m py_compile output/candidate_source.py
      - name: Record provenance
        if: always()
        run: |
          sha256sum sonotaco_phase_span_selector_source_audit/PROTOCOL.md sonotaco_phase_span_selector_source_audit/source_parts/*.b64 > output/source_files_sha256.txt
          python --version > output/python_version.txt
      - name: Upload source-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonotaco-phase-span-selector-source-audit
          path: output
          if-no-files-found: error
          retention-days: 90
