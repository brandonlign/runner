name: OrbitTrace P18 P17-halo membership source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - orbittrace_p18_p17_halo_membership/**
      - .github/workflows/orbittrace_p18_p17_halo_membership_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Prove P18 is an exact pretruth output composition with frozen external and reveal gates
        run: |
          set -euo pipefail
          proto=orbittrace_p18_p17_halo_membership/P18_PROTOCOL.md
          ext=orbittrace_p18_p17_halo_membership/P18_MAARSY_2020_2021_EXTERNAL_ADDENDUM.md
          blind=orbittrace_p18_p17_halo_membership/P18_FINAL_BLIND_AUTHORIZATION.md
          adapter=orbittrace_p18_p17_halo_membership/promote_p17_halo_membership_checkpoint.py

          python -m py_compile "$adapter"
          test "$(git hash-object "$adapter")" = '8c31daa65178255569888ec747f78a24656cd12b'

          # Canonical development ingredients are fixed independently before matched truth.
          for x in \
            '31329487091' '9042496657' \
            'sha256:1d470dcd2034e8b693d80117380f544f43cf6c6d581574a356dc11a04bb91040' \
            '226 one-to-one core/halo families' '17,238 already-frozen halo additions' \
            '12e6635085c77c8c705fe225e67811c659e98bf7cd1047649ec2b8d593261b3c' \
            'f158ebfa3a9a3c8006a7c81cbf0b47f7307aa7f2537e8046621b08037230cca3'; do grep -F "$x" "$proto"; done
          for x in \
            'P17_FAIL_CLOSED_RECIPROCAL_SUPPORT_CLOSURE' \
            "cp.get('p17_bidirectional_reliability_threshold_changed') is False" \
            "cp.get('p17_missing_reciprocal_creates_positive_evidence') is False" \
            "x['p9_reliable'] is False and int(x['proposal_count'])==0" \
            "cids and cids<=hids" \
            "stored==set(added)" \
            "cp['p3_expanded_families']=reported" \
            "cp['p18_no_new_detector_score_threshold_or_proposal']=True" \
            "cp['p18_new_members_can_seed_growth']=False" \
            "cp['p18_core_order_unchanged']=True" \
            "cp['p18_membership_frozen_before_truth']=True" \
            "cp['parameter_search']=False"; do grep -F "$x" "$adapter"; done

          # Matched superiority math remains the already-frozen four-gate standard.
          for x in \
            '4–9-member mean F1 >= comparator +0.10' \
            'combined 4–24-member mean F1 >= comparator +0.10' \
            'overall macro F1 no more than 0.10 below comparator' \
            'retain >=80% of comparator count of showers with F1>0.5'; do grep -F "$x" "$proto"; done

          # External panel, transport, power floor, and effect-size gates are preregistered.
          for x in \
            'exactly MAARSY 2020 and 2021' \
            'f563ca63e169e6ddfe846219d8f00384f3451797' \
            'bbf71f190ca128e3e24f71900fefbd1472cdacb6' \
            '31325401462' \
            '3e0bcc3db805f60310ec9b01d6d48f76b29544780119c05e71fc225c04e3fe48' \
            'fixed 10°-bin identity cap 10,000 events/bin' \
            'at least 5 truth labels with >=4 usable events in each year and at least 5 recurrent cores' \
            'POWER_INCONCLUSIVE_MAARSY_2020_2021' \
            'macro-F1 must exceed immutable core macro-F1 by >=0.08' \
            'reported-halo recall must be >=1.5x immutable core recall' \
            'reported-halo precision must be >=0.85' \
            'PASS_P18_MATCHED_SPARSE_SUPERIORITY_BOTH_COMPARATORS_BOTH_YEARS' \
            'PASS_P18_MAARSY_2020_2021_NO_RETUNING_EXTERNAL'; do grep -F "$x" "$ext"; done

          # Final reveal remains exact-ID-only and cannot be activated by matched PASS alone.
          for x in \
            'Only after exact P18 matched sparse-superiority PASS and exact `PASS_P18_MAARSY_2020_2021_NO_RETUNING_EXTERNAL` may Stage A' \
            'no access to the withheld OrbitTrace exact-ID reference' \
            'at least 4 exact withheld target IDs in each of 2022 and 2023 and at least 8 exact target IDs total' \
            'FULL_BLIND_RECOVERY' 'rank <=25' \
            'PARTIAL_BLIND_RECOVERY' 'rank <=100' \
            'otherwise `NO_BLIND_RECOVERY`' \
            'This protocol authorizes no target access by itself.'; do grep -F "$x" "$blind"; done

          # Executable P18 source is a checkpoint transform only: no evaluator, comparator
          # assignment artifact, external fetch/transport, or target/reveal operation exists.
          for forbidden in \
            'evaluate_frozen_blindsafe' '9012424187' '8955917326' '8957940764' '8957263372' \
            'MAARSY' 'OrbitTrace-April' 'target_coordinate' 'withheld target' 'FULL_BLIND_RECOVERY'; do
            if grep -Fq "$forbidden" "$adapter"; then
              echo "forbidden data/evaluator/target surface in P18 transform: $forbidden" >&2
              exit 1
            fi
          done
          echo PASS_P18_P17_HALO_MEMBERSHIP_SOURCE_AND_PROTOCOL_FREEZE
          echo NO_MATCHED_TRUTH_NO_EXTERNAL_EVENT_VALUES_NO_TARGET_ACCESS
