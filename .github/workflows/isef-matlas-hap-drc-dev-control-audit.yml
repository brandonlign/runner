name: ISEF MATLAS HAP DRC development-control audit
on:
  push:
    branches: [main]
    paths: ['isef/MATLAS_HAP_DRC_DEV_CONTROL_AUDIT_TRIGGER']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy astropy astroquery requests
      - run: |
          python -m py_compile isef/matlas_hap_drc_dev_control_audit.py
          cd isef
          python matlas_hap_drc_dev_control_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-matlas-hap-drc-dev-control-audit
          path: isef/results/matlas_hap_drc_dev_control_audit/report.json
          if-no-files-found: error
