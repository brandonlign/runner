name: OrbitTrace SonotaCo 2023 HDBSCAN transfer

on:
  pull_request:
    branches:
      - agent/orbittrace-hdbscan-catalogue-development
    paths:
      - .github/workflows/orbittrace_sonotaco_2023_hdbscan_transfer.yml
      - orbittrace_hdbscan_freeze/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-sonotaco-2023-hdbscan-transfer
  cancel-in-progress: true

jobs:
  one-shot-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-hdbscan-2023-transfer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
          python -m pip install hdbscan==0.8.44

      - name: Verify 2025 result freeze and corrected one-shot runner before 2023 data access
        run: |
          set -euo pipefail
          mkdir -p input/repaired output
          echo 'f168774138bac3aa9af67b82b798c1a27364ad10edbcb2a9d6001a386f0f6237  orbittrace_hdbscan_freeze/SONOTACO_2025_HDBSCAN_FREEZE.json' | sha256sum -c -
          echo 'de5f754e3c4c0172906578ff5325b42f17f1e52ba3aeabd5349d02e0538fa56e  orbittrace_hdbscan_freeze/sonotaco_2023_runner_parts/part00.b64' | sha256sum -c -
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          freeze = json.loads(Path('orbittrace_hdbscan_freeze/SONOTACO_2025_HDBSCAN_FREEZE.json').read_text())
          assert freeze['verdict'] == 'PASS_SONOTACO_2025_HDBSCAN_CATALOGUE_TRANSFER'
          assert freeze['workflow_run'] == 31071589912
          assert freeze['artifact_id'] == 8955917326
          assert freeze['artifact_digest'] == 'sha256:82e95052eb75349031341ea600aebf8f74d6842f03c0e47edf7cdea6de471a89'
          assert freeze['result_sha256'] == 'd8cd3c6acf9ecf48bb06a1055e7197f60d315c062276bdbe654abd562e904db8'
          assert freeze['frozen_before_sonotaco_2023_execution'] is True
          config = freeze['configuration']
          assert config['hdbscan_version'] == '0.8.44'
          assert config['feature_vector'] == 'unstandardized Sugar/Pena-Asensio GEO six-vector'
          assert config['minimum_cluster_size'] == 100
          assert config['minimum_samples'] is None
          assert config['cluster_selection_method'] == 'eom'
          assert config['metric'] == 'euclidean'
          assert config['silhouette_seed'] == 20250806
          assert config['silhouette_maximum_sample'] == 10000

          encoded = ''.join(Path('orbittrace_hdbscan_freeze/sonotaco_2023_runner_parts/part00.b64').read_text().split())
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = 'dd6fbfb37ba58337bb787f59ca96fb0b71d8cdbd9b432083a51ec5291a14db3a'
          if digest != expected:
              raise RuntimeError(f'2023 HDBSCAN runner source mismatch: {digest}')
          Path('/tmp/run_sonotaco_2023_hdbscan_transfer.py').write_bytes(source)
          compile(source, 'run_sonotaco_2023_hdbscan_transfer.py', 'exec')
          print('PASS_PRE_2023_HDBSCAN_FREEZE', digest)
          PY

      - name: Retrieve exact repaired 2023 parser and frozen mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30920687116 \
            --repo "$GITHUB_REPOSITORY" \
            --name sonotaco-2023-confirmation-source-repair-v2 \
            --dir input/repaired
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/repaired/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          echo '882c21f2ac48689ab7a0d7a990496f7e055ab571b10c6f00bb63d8a18f8f7b3f  input/repaired/sonotaco_2023_confirmation_source_repair_v2.json' | sha256sum -c -
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -

      - name: Download exact SonotaCo 2023 replacement archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output input/023a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/023a.zip
          echo '9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430  input/023a.zip' | sha256sum -c -

      - name: Execute frozen one-shot catalogue transfer
        run: |
          set -euo pipefail
          python /tmp/run_sonotaco_2023_hdbscan_transfer.py \
            --archive input/023a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --confirmation-source input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            --freeze orbittrace_hdbscan_freeze/SONOTACO_2025_HDBSCAN_FREEZE.json \
            --core-dist-jobs 4 \
            --output output
          cat output/SONOTACO_2023_HDBSCAN_TRANSFER.md

      - name: Record immutable provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output
          sha256sum \
            orbittrace_hdbscan_freeze/SONOTACO_2025_HDBSCAN_FREEZE.json \
            orbittrace_hdbscan_freeze/sonotaco_2023_runner_parts/part00.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            input/repaired/sonotaco_2023_confirmation_source_repair_v2.json \
            input/audit.json input/023a.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload one-shot transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-sonotaco-2023-hdbscan-transfer
          path: output
          if-no-files-found: error
          retention-days: 90
