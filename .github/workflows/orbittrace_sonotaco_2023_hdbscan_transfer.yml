name: OrbitTrace SonotaCo 2023 HDBSCAN one-shot transfer

on:
  pull_request:
    branches:
      - agent/orbittrace-hdbscan-catalogue-development
    paths:
      - .github/workflows/orbittrace_sonotaco_2023_hdbscan_transfer.yml
      - orbittrace_literature_freeze/SONOTACO_2025_HDBSCAN_CATALOGUE_FREEZE.json
      - orbittrace_literature_freeze/hdbscan_2023_runner_parts/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-sonotaco-2023-hdbscan-transfer
  cancel-in-progress: true

jobs:
  one-shot-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-hdbscan-catalogue-2023-transfer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
          python -m pip install hdbscan==0.8.44

      - name: Verify frozen 2025 result and 2023 runner before data access
        run: |
          set -euo pipefail
          mkdir -p input/repaired output
          echo '42c6e28291c9ad7b73bad8bad775e03826259a2d0ff25fbb403139c1e2a9b164  orbittrace_literature_freeze/hdbscan_2023_runner_parts/part00.b64' | sha256sum -c -
          echo '452ac4d6b2e9f107d6e68b323cee931d3d12219eb44dd4b2fd4fc8e197efd405  orbittrace_literature_freeze/hdbscan_2023_runner_parts/part01.b64' | sha256sum -c -
          echo 'f3f793b509f7aa96e36e7b9ba60e0743132997273397f7369bb125942669a1ed  orbittrace_literature_freeze/hdbscan_2023_runner_parts/part02.b64' | sha256sum -c -
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  orbittrace_literature_comparison/literature_comparators.py' | sha256sum -c -
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from importlib.metadata import version
          from pathlib import Path

          freeze = json.loads(Path('orbittrace_literature_freeze/SONOTACO_2025_HDBSCAN_CATALOGUE_FREEZE.json').read_text())
          assert freeze['verdict'] == 'PASS_SONOTACO_2025_HDBSCAN_CATALOGUE_TRANSFER'
          assert freeze['source_commit'] == '15e63a8acf6303a4bf62e119c3dc8a121a488d1c'
          assert freeze['workflow_run'] == 31071589912
          assert freeze['artifact_id'] == 8955917326
          assert freeze['artifact_digest'] == 'sha256:82e95052eb75349031341ea600aebf8f74d6842f03c0e47edf7cdea6de471a89'
          assert freeze['runner_source_sha256'] == 'a8b638f56dad2597973178523e8ad15e177a4f57e7fe6159fedc84d754afd3d2'
          assert freeze['result_sha256'] == 'd8cd3c6acf9ecf48bb06a1055e7197f60d315c062276bdbe654abd562e904db8'
          assert freeze['frozen_before_sonotaco_2023_execution'] is True
          configuration = freeze['configuration']
          assert configuration['hdbscan_version'] == '0.8.44'
          assert configuration['minimum_cluster_size'] == 100
          assert configuration['minimum_samples'] is None
          assert configuration['cluster_selection_method'] == 'eom'
          assert configuration['metric'] == 'euclidean'
          assert version('hdbscan') == '0.8.44'
          assert version('scikit-learn') == '1.9.0'

          root = Path('orbittrace_literature_freeze/hdbscan_2023_runner_parts')
          encoded = ''.join(''.join((root / f'part{index:02d}.b64').read_text().split()) for index in range(3))
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = 'aa267c1125b09982970cf016fc3e141134101a6535d84f4c9ff8dae45d6b6af8'
          if digest != expected:
              raise RuntimeError(f'2023 HDBSCAN runner source mismatch: {digest}')
          Path('/tmp/run_sonotaco_2023_hdbscan_catalogue.py').write_bytes(source)
          compile(source, 'run_sonotaco_2023_hdbscan_catalogue.py', 'exec')
          print('PASS_PRE_2023_HDBSCAN_FREEZE', digest)
          PY

      - name: Retrieve exact repaired 2023 parser source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30920687116 \
            --repo "$GITHUB_REPOSITORY" \
            --name sonotaco-2023-confirmation-source-repair-v2 \
            --dir input/repaired
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/repaired/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          echo '882c21f2ac48689ab7a0d7a990496f7e055ab571b10c6f00bb63d8a18f8f7b3f  input/repaired/sonotaco_2023_confirmation_source_repair_v2.json' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          repair = json.loads(Path('input/repaired/sonotaco_2023_confirmation_source_repair_v2.json').read_text())
          assert repair['verdict'] == 'PASS_SONOTACO_2023_CONFIRMATION_SOURCE_REPAIR_V2'
          assert all(repair['gates'].values())
          assert repair['opaque_structure']['expected_data_rows'] == 47087
          PY

      - name: Retrieve exact GMN-MDC mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -

      - name: Download exact SonotaCo 2023 archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output input/023a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/023a.zip
          echo '9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430  input/023a.zip' | sha256sum -c -

      - name: Execute one-shot frozen HDBSCAN transfer
        env:
          PYTHONPATH: orbittrace_literature_comparison
        run: |
          set -euo pipefail
          python /tmp/run_sonotaco_2023_hdbscan_catalogue.py \
            --archive input/023a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --confirmation-source input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            --freeze orbittrace_literature_freeze/SONOTACO_2025_HDBSCAN_CATALOGUE_FREEZE.json \
            --core-dist-jobs 4 \
            --output output
          cat output/SONOTACO_2023_HDBSCAN_CATALOGUE_TRANSFER.md

      - name: Record immutable provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output
          sha256sum \
            orbittrace_literature_freeze/SONOTACO_2025_HDBSCAN_CATALOGUE_FREEZE.json \
            orbittrace_literature_freeze/hdbscan_2023_runner_parts/part00.b64 \
            orbittrace_literature_freeze/hdbscan_2023_runner_parts/part01.b64 \
            orbittrace_literature_freeze/hdbscan_2023_runner_parts/part02.b64 \
            orbittrace_literature_comparison/literature_comparators.py \
            input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            input/audit.json input/023a.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload one-shot HDBSCAN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-sonotaco-2023-hdbscan-transfer
          path: output
          if-no-files-found: error
          retention-days: 90
