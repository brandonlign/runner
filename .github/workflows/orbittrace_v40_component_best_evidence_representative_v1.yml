name: OrbitTrace v40 component best-evidence representative development v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v40_component_best_evidence_representative_v1/**'
      - '.github/workflows/orbittrace_v40_component_best_evidence_representative_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v40-component-best-evidence-representative-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and pin runtime and scientific source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/truth output/pretruth output/result
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          test "$(git hash-object orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py)" = '917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          test "$(git hash-object orbittrace_v40_component_best_evidence_representative_v1/PROTOCOL.md)" = '5d2196ff8672a783488d8a23533dda765ad2e2b4'
          test "$(git hash-object orbittrace_v40_component_best_evidence_representative_v1/train_evaluate.py)" = '710944a43111e72ed286b3a5c06010db619c807f'
          python -m py_compile orbittrace_v40_component_best_evidence_representative_v1/train_evaluate.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify immutable #839 ranker
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - name: Restore immutable #950 pretruth payload before any truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/v24.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/v24.zip' | sha256sum -c -
          unzip -q input/v24.zip -d input/payload
          test "$(sha256sum input/payload/result/V24_EXPOSED_TWOHEAD_OOF_RESULT.json | cut -d' ' -f1)" = 'c8d95bc02ad1436c9924ec14a25bcd36e0eacd960fda1fb33db3a91738fe30cf'
          python - <<'PY'
          import json
          for route in ('sugar','hdbscan'):
              m=json.load(open(f'input/payload/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              f=json.load(open(f'input/payload/{route}/family_memberships.json'))
              assert m['truth_accessed'] is False and m['feature_dimension']==71 and f['truth_accessed'] is False
          print('PASS_V40_IMMUTABLE_PRETRUTH_PAYLOAD')
          PY
      - name: Reproduce exact #1064 graph and #1072 components before truth
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v40_component_best_evidence_representative_v1/train_evaluate.py pretruth \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --output output/pretruth
          echo '2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25  output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json' | sha256sum -c -
          echo 'c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd  output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json' | sha256sum -c -
          python - <<'PY'
          import json
          g=json.load(open('output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json'))
          c=json.load(open('output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json'))
          assert g['truth_accessed'] is False and g['edge_count']==2334 and g['radius']==1.0
          assert c['truth_accessed'] is False and c['component_count']==196 and c['non_singleton_component_count']==113 and c['singleton_component_count']==83
          assert c['graph_sha256']=='2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25'
          assert c['within_route_edges_added'] is False and c['graph_pruning'] is False and c['graph_expansion'] is False and c['component_size_threshold_selected'] is False
          assert g['target_information_access'] is False and g['target_region_events_accessed'] is False and g['maarsy_scientific_access'] is False and g['dms_scientific_access'] is False
          assert c['target_information_access'] is False and c['target_region_events_accessed'] is False and c['maarsy_scientific_access'] is False and c['dms_scientific_access'] is False
          assert g['blind_exclusion']==[20.0,55.0] and c['blind_exclusion']==[20.0,55.0]
          print('PASS_V40_PRETRUTH_COMPONENT_IDENTITY')
          PY
      - name: Load immutable exposed truth only after component identity freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
      - name: Reproduce exact v31 and evaluate sole v40 component selector
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v40_component_best_evidence_representative_v1/train_evaluate.py evaluate \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --graph-file output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json \
            --component-file output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json \
            --output output/result
      - name: Enforce scientific/result firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/result/V40_COMPONENT_BEST_EVIDENCE_REPRESENTATIVE_RESULT.json'))
          assert r['parent_v31_reproduction_pass'] is True and len(r['parent_v31_controls'])==4
          assert r['pretruth_graph_sha256']=='2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25'
          assert r['pretruth_component_sha256']=='c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd'
          assert r['component_count']==196 and r['non_singleton_component_count']==113 and r['singleton_component_count']==83
          assert r['feature_dimension']==71 and r['nearest_k']==1 and r['recovery_f1_threshold']==0.5
          assert r['component_evidence']=='minimum normalized exact-v31 rank percentile over all members of frozen component'
          assert r['component_representative']=='own-route member with smallest exact-v31 fused rank'
          assert r['component_rule_symmetric_across_routes'] is True and r['component_rule_budget_dependent'] is False and r['component_rule_year_dependent'] is False and r['component_score_coefficient'] is None
          assert r['strict_whole_shower_oof'] is True and r['candidate_membership_changed'] is False and r['candidate_generation_changed'] is False and r['pretruth_feature_changed'] is False
          for k in ('radius_search','metric_search','feature_search','within_route_edges_added','graph_pruning','graph_expansion','component_size_threshold_search','component_definition_search','component_evidence_aggregation_search','component_best_k_search','component_mean_median_harmonic_search','representative_family_search','route_specific_rule','budget_specific_rule','year_specific_rule','transfer_coefficient_search','transfer_threshold_search','overlap_weight_search','jaccard_weight_search','distance_weight_search','graph_propagation_search','secondary_insertion_search','k_search','scaling_search','annual_combiner_search','diversity_search','fusion_search','source_quota_selected','oracle_identity_used_for_ranking','post_result_second_search'):
              assert r[k] is False
          assert set(r['order_diagnostics'])=={'sugar','hdbscan'} and len(r['panels'])==4
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v40_component_best_evidence_representative_v1/PROTOCOL.md orbittrace_v40_component_best_evidence_representative_v1/train_evaluate.py orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py input/ranker/run_urc_union_ranker.py output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_GRAPH_IDENTITY.json output/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json > output/V40_COMPONENT_BEST_EVIDENCE_REPRESENTATIVE_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v40-component-best-evidence-representative-development-v1
          path: output
          if-no-files-found: error
          retention-days: 90
