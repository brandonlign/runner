name: ISEF MATLAS Oyashio response sweep v2
on:
  push:
    branches: [main]
    paths: ['isef/MATLAS_OYASHIO_RESPONSE_SWEEP_V2_TRIGGER']
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy astropy astroquery scikit-image requests
      - run: |
          python -m py_compile isef/matlas_oyashio_blind_detector_pilot.py isef/matlas_oyashio_response_sweep.py isef/matlas_oyashio_response_sweep_v2.py
          cd isef
          python matlas_oyashio_response_sweep_v2.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-matlas-oyashio-response-sweep-v2
          path: isef/results/matlas_oyashio_response_sweep_v2/report.json
          if-no-files-found: error
