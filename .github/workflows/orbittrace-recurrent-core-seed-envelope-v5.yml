name: OrbitTrace recurrent-core seed-envelope v5 development

on:
  pull_request:
    branches:
      - agent/orbittrace-pooled-year-centroid-v8
    paths:
      - 'orbittrace_recurrent_core_seed_envelope_v5/**'
      - '.github/workflows/orbittrace-recurrent-core-seed-envelope-v5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-recurrent-core-seed-envelope-v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Enforce pre-data provenance and v4 mechanism prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1 \
            input/v4/orbittrace_recurrent_core_local_envelope_v4 \
            input/v4_result input/v3 input/v6 input/centroid output
          touch input/v1/orbittrace_cross_year_seed_support_expansion_v1/__init__.py
          touch input/v4/orbittrace_recurrent_core_local_envelope_v4/__init__.py

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"

          git fetch --no-tags --depth=1 origin e87a61909f06b2c8f4e763a2f915d13b5c365620
          git show FETCH_HEAD:orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            > input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py
          test "$(git hash-object input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py)" = "2f48496362494d600652ae35d721e3b107c19a22"

          git fetch --no-tags --depth=1 origin 7758c8ba8d9ffad4d25ba2a6d900f790027a10e9
          git show FETCH_HEAD:orbittrace_recurrent_core_local_envelope_v4/run_development.py \
            > input/v4/orbittrace_recurrent_core_local_envelope_v4/run_development.py
          test "$(git hash-object input/v4/orbittrace_recurrent_core_local_envelope_v4/run_development.py)" = "1d7316e87c8986bf6ff4942fed9cc9d29fa4254e"

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9016160109/zip" -o input/v4_result.zip
          echo "ddf8b89aa4e012487d71077ee745d3ce18cbad4eca699fb36423ee0c6ede31af  input/v4_result.zip" | sha256sum -c -
          unzip -q input/v4_result.zip -d input/v4_result
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('input/v4_result/recurrent_core_local_envelope_v4_development.json').read_text())
          assert r['verdict']=='FAIL_RECURRENT_CORE_LOCAL_ENVELOPE_V4_DEVELOPMENT'
          assert r['family_count']==226
          assert r['expansion_diagnostics']['total_new_members']==3761
          b=r['baseline_metrics']['multiplicity']; e=r['expanded_metrics']['multiplicity']
          assert b['qualified_matches']==95 and e['qualified_matches']==95
          assert b['recovered_at_100']==58 and e['recovered_at_100']==58
          assert abs(b['top100_dominant_precision']-0.6884631112636006)<1e-12
          assert abs(e['top100_dominant_precision']-0.6925656171389626)<1e-12
          assert abs(b['macro_f1']-0.1736657194465356)<1e-12
          assert abs(e['macro_f1']-0.22071149845118612)<1e-12
          assert r['scientific_gates']['expanded_recovery_at_100_nonregression'] is True
          assert r['scientific_gates']['expanded_qualified_nonregression'] is True
          assert r['scientific_gates']['expanded_top100_precision_at_least_065'] is True
          assert r['scientific_gates']['expanded_macro_f1_gain_at_least_005'] is False
          assert r['scientific_gates']['annual_all_mean_f1_gain_at_least_010_both_years'] is False
          PY

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" -o input/v6.zip
          echo "3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v6.zip" | sha256sum -c -
          unzip -q input/v6.zip -d input/v6

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009091129/zip" -o input/centroid.zip
          echo "a1faacf51e1f4ca2a3a92b20e27d1f07f00e1d32ab33993916379ff36acea062  input/centroid.zip" | sha256sum -c -
          unzip -q input/centroid.zip -d input/centroid

          python -m py_compile \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            input/v4/orbittrace_recurrent_core_local_envelope_v4/run_development.py \
            orbittrace_recurrent_core_seed_envelope_v5/run_development.py
          rm -rf output/*

      - name: Run frozen target-excluded v5 development
        env:
          PYTHONPATH: input/v4:input/v1:input/v3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python orbittrace_recurrent_core_seed_envelope_v5/run_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --source-audit-json output/wavelet_catalogue_v3_source_audit.json \
            --v6-result-json input/v6/label_free_sparse_support_v6_development.json \
            --centroid-audit-json input/centroid/component_centroid_source_audit.json \
            --output output
          cat output/RECURRENT_CORE_SEED_ENVELOPE_V5_DEVELOPMENT.md

      - name: Enforce frozen v5 blindness and verdict schema
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/recurrent_core_seed_envelope_v5_development.json').read_text())
          assert r['verdict'] in {
            'PASS_RECURRENT_CORE_SEED_ENVELOPE_V5_DEVELOPMENT',
            'FAIL_RECURRENT_CORE_SEED_ENVELOPE_V5_DEVELOPMENT',
          }
          c=r['configuration']
          assert c['blind_exclusion']==[20.0,55.0]
          assert c['support_unit']=='same-year original frozen component seed events'
          assert c['component_radius_rule']=='max original seed-event distance to frozen component centroid'
          assert c['global_membership_radius'] is None
          assert c['global_membership_radius_search'] is False
          assert c['radius_multiplier'] is None and c['radius_quantile'] is None
          assert c['same_year_support'] is True
          assert c['cross_year_recurrence_preserved_by_frozen_v8_family'] is True
          assert c['recursive_growth'] is False
          assert c['ranking_changed'] is False
          assert c['v4_predecessor_run']==31237514755
          assert c['v4_predecessor_artifact']==9016160109
          assert c['v4_predecessor_artifact_digest']=='sha256:ddf8b89aa4e012487d71077ee745d3ce18cbad4eca699fb36423ee0c6ede31af'
          assert r['family_count']==226
          assert r['integrity_gates']['original_seed_centers_only'] is True
          assert r['integrity_gates']['v4_component_radius_reused_exactly'] is True
          assert len(r['prelabel_payload_sha256'])==64
          assert 'No OrbitTrace target information' in r['claim_boundary']
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/development_commit.txt
          sha256sum \
            orbittrace_recurrent_core_seed_envelope_v5/PROTOCOL.md \
            orbittrace_recurrent_core_seed_envelope_v5/run_development.py \
            input/v4/orbittrace_recurrent_core_local_envelope_v4/run_development.py \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-core-seed-envelope-v5-development
          path: output
          if-no-files-found: error
          retention-days: 90
