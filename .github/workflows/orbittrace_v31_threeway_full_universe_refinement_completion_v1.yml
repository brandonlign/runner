name: OrbitTrace v31 three-way full-universe refinement completion v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v31_threeway_full_universe_refinement_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v31_threeway_full_universe_refinement_completion_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  complete:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v31-threeway-full-universe-refinement-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 31704c312c09be2765ad3f65a0685d1acfd2b055
          path: frozen-v40
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin fail-closed audit sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/vector input/cross input/payload input/truth output/diag
          test "$(git hash-object orbittrace_v31_threeway_full_universe_refinement_diagnostic_v1/PROTOCOL.md)" = '88e13ee67db71081238f8c6458c50564de235c7c'
          test "$(git hash-object orbittrace_v31_threeway_full_universe_refinement_diagnostic_v1/diagnose.py)" = '739059718a8c1e03f3b9b70f96e74835c5e1d5f2'
          test "$(git hash-object orbittrace_v31_threeway_full_universe_refinement_diagnostic_v1/failclosed_audit.py)" = 'e69d104d13c6c9398b94ac4b0db201ba5c638a44'
          test "$(git -C frozen-v40 rev-parse HEAD)" = '31704c312c09be2765ad3f65a0685d1acfd2b055'
          test "$(git -C frozen-v40 hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git -C frozen-v40 hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v31_threeway_full_universe_refinement_diagnostic_v1/diagnose.py orbittrace_v31_threeway_full_universe_refinement_diagnostic_v1/failclosed_audit.py

      - name: Restore immutable vector from first run before any validation or truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9089120475/zip' -o input/vector.zip
          echo '471269e213fd0e83324d46209f21409c2881ace7ef207b042db064cc72187c18  input/vector.zip' | sha256sum -c -
          unzip -p input/vector.zip freeze/V31_THREEWAY_FULL_UNIVERSE_VECTOR.json > input/vector/V31_THREEWAY_FULL_UNIVERSE_VECTOR.json
          rm -f input/vector.zip
          echo '0b2124db9b2251fcb71fb2cebd4be313fbd19e513934620e64e55f474f29b096  input/vector/V31_THREEWAY_FULL_UNIVERSE_VECTOR.json' | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('input/vector/V31_THREEWAY_FULL_UNIVERSE_VECTOR.json'))
          assert r['verdict']=='PASS_V31_THREEWAY_FULL_UNIVERSE_VECTOR_FREEZE'
          assert r['scientific_role']=='FULL_FIXED_229_HDB_THREEWAY_VECTOR_FROZEN_BEFORE_VALIDATION_OR_OUTCOME_AUDIT'
          assert r['family_count']==229 and len(r['families'])==229
          assert r['joint_family_count']==60 and r['threeway_family_count']==58
          assert r['canonical_sha256_without_self_field']=='54940f5f09e02dfd3fb653775ef45e1e8801dd8227ae2d0ce5d09359507abea6'
          assert r['threeway_definition']=='joint_signal AND crossroute_positive'
          for k in ('threshold_selected','top_k_selected','rank_window_selected','neighbor_aggregation_search','alternate_crossroute_statistic_search','boolean_combination_search','new_rank_or_score_evaluated','selector_order_evaluated','replacement_rule_evaluated','promotion_position_evaluated','literature_panel_evaluated','oracle_identity_hardcoded','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_IMMUTABLE_FIRST_RUN_THREEWAY_VECTOR')
          PY

      - name: Restore #1093 validation result after vector identity is fixed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088482597/zip' -o input/cross.zip
          echo 'c709ca3f5aaef103a1cf7668fce7241cb52a4c43b36c0263d5b6b34b8208e6c4  input/cross.zip' | sha256sum -c -
          unzip -p input/cross.zip diag/V31_CONCORDANT_INDEPENDENT_SUPPRESSION_DIAGNOSTIC.json > input/cross/V31_CONCORDANT_INDEPENDENT_SUPPRESSION_DIAGNOSTIC.json
          rm -f input/cross.zip
          echo '62ed82eeb4f10b4371ec2072af7de527482ab070866693a2230be564ebf6af35  input/cross/V31_CONCORDANT_INDEPENDENT_SUPPRESSION_DIAGNOSTIC.json' | sha256sum -c -

      - name: Restore immutable #950 HDB payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          m=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          f=json.load(open('input/payload/hdbscan/family_memberships.json'))
          assert m['truth_accessed'] is False and f['truth_accessed'] is False
          assert len(m['family_ids'])==229 and len(f['families'])==229
          assert m['target_information_access'] is False and m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          PY

      - name: Restore immutable exposed truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth

      - name: Complete preregistered audit fail-closed
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:.
        run: |
          set -euo pipefail
          python -u orbittrace_v31_threeway_full_universe_refinement_diagnostic_v1/failclosed_audit.py \
            --vector input/vector/V31_THREEWAY_FULL_UNIVERSE_VECTOR.json \
            --cross-result input/cross/V31_CONCORDANT_INDEPENDENT_SUPPRESSION_DIAGNOSTIC.json \
            --hdb-root input/payload/hdbscan \
            --truth-root input/truth \
            --output output/diag

      - name: Enforce diagnostic-only result firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V31_THREEWAY_FULL_UNIVERSE_REFINEMENT_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V31_THREEWAY_FULL_UNIVERSE_REFINEMENT_DIAGNOSTIC','FAIL_V31_THREEWAY_FULL_UNIVERSE_REFINEMENT_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_RESULT_INCREMENTAL_FULL_UNIVERSE_SELECTOR_REFINEMENT_DIAGNOSTIC_NO_ORDER_EVALUATED'
          assert r['vector_sha256']=='54940f5f09e02dfd3fb653775ef45e1e8801dd8227ae2d0ce5d09359507abea6'
          assert r['family_count']==229 and r['joint_family_count']==60 and r['threeway_family_count']==58
          assert set(r['annual_diagnostics'])=={'2013','2014'}
          for k in ('new_rank_or_score_evaluated','selector_order_evaluated','replacement_rule_evaluated','promotion_position_evaluated','literature_panel_evaluated','successor_selected','signal_magnitude_used','rank_gap_threshold_search','threshold_search','top_k_search','rank_window_search','neighbor_aggregation_search','alternate_crossroute_statistic_search','boolean_combination_search','or_logic_search','component_size_search','route_specific_rule','year_specific_rule','budget_specific_rule','feature_search','model_search','fusion_search','source_quota_selected','candidate_membership_changed','candidate_generation_changed','oracle_identity_used_for_statistic','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'])
          PY

      - name: Record completion provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v31_threeway_full_universe_refinement_diagnostic_v1/PROTOCOL.md orbittrace_v31_threeway_full_universe_refinement_diagnostic_v1/diagnose.py orbittrace_v31_threeway_full_universe_refinement_diagnostic_v1/failclosed_audit.py input/vector/V31_THREEWAY_FULL_UNIVERSE_VECTOR.json input/cross/V31_CONCORDANT_INDEPENDENT_SUPPRESSION_DIAGNOSTIC.json input/payload.zip input/truth.zip > output/V31_THREEWAY_FULL_UNIVERSE_COMPLETION_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-threeway-full-universe-refinement-completion-v1
          path: output
          if-no-files-found: error
          retention-days: 90
