name: OrbitTrace final SonotaCo normalizer freeze v1

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - 'orbittrace_final_sonotaco_normalizer_v1/**'
      - '.github/workflows/orbittrace_final_sonotaco_normalizer_freeze_v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic firewall/schema test and source audit
        run: |
          set -euo pipefail
          python orbittrace_final_sonotaco_normalizer_v1/normalizer.py
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('orbittrace_final_sonotaco_normalizer_v1/normalizer.py')
          src=p.read_text()
          protocol=Path('orbittrace_final_sonotaco_normalizer_v1/PROTOCOL.md').read_text()
          tree=ast.parse(src)
          # No network/data-source imports or reserved archive identifiers.
          imported={n.names[0].name for n in ast.walk(tree) if isinstance(n,ast.Import)}
          imported|={n.module for n in ast.walk(tree) if isinstance(n,ast.ImportFrom) and n.module}
          assert not ({'requests','urllib','gmn_python_api'} & imported)
          forbidden=('013a.zip','014a.zip','_U2_20130101_S.csv','_U2_20140101_S.csv','OrbitTrace-April','247.17','-14.34','37.62','target_coordinate')
          lower=(src+'\n'+protocol).lower()
          for token in forbidden:
              assert token.lower() not in lower, token
          # Scientific cuts and target firewall are explicit and immutable.
          for literal in ('BLIND_LOW = 20.0','BLIND_HIGH = 55.0','VG_LOW = 5.0','VG_HIGH = 75.0','MIN_NCAM = 2.0'):
              assert literal in src
          assert 'row[index["shower"]]' not in src
          assert "row[index['shower']]" not in src
          blind=src.index('if BLIND_LOW <= sol <= BLIND_HIGH:')
          geometry=src.index('ra = parse_float(row[index["radeg"]])')
          assert blind < geometry
          print('PASS_FINAL_SONOTACO_NORMALIZER_SOURCE_FIREWALL')
          PY
          python -m py_compile orbittrace_final_sonotaco_normalizer_v1/normalizer.py
          sha256sum orbittrace_final_sonotaco_normalizer_v1/normalizer.py orbittrace_final_sonotaco_normalizer_v1/PROTOCOL.md
