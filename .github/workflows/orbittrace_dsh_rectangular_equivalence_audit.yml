name: OrbitTrace rectangular DSH equivalence audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p8-full-finite-sample-order-stat-freeze
    paths:
      - orbittrace_dsh_rectangular_equivalence/**
      - .github/workflows/orbittrace_dsh_rectangular_equivalence_audit.yml

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  exact-equivalence:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct frozen P2, base runtime, and DSH source
        run: |
          set -euo pipefail
          mkdir -p input output
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py \
            orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2_v1.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py \
            /tmp/p2_v1.py /tmp/p2_canonical_v2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2_canonical_v2.py' | sha256sum -c -

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -

          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > input/literature_comparators.py
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  input/literature_comparators.py' | sha256sum -c -

          python -m py_compile /tmp/p2_canonical_v2.py /tmp/run_wavelet_catalogue_v3_development.py input/literature_comparators.py orbittrace_dsh_rectangular_equivalence/rectangular_dsh.py orbittrace_dsh_rectangular_equivalence/audit_real_target_excluded.py

      - name: Audit exact equality on real target-excluded development orbits
        env:
          PYTHONPATH: orbittrace_dsh_rectangular_equivalence:.
        run: |
          set -euo pipefail
          python -u orbittrace_dsh_rectangular_equivalence/audit_real_target_excluded.py \
            --p2-source /tmp/p2_canonical_v2.py \
            --dsh-comparator input/literature_comparators.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --output output/rectangular_dsh_equivalence.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/rectangular_dsh_equivalence.json').read_text())
          assert r['classification']=='RECTANGULAR_DSH_EXACT_EQUIVALENCE_TARGET_EXCLUDED_AUDIT'
          assert r['years']==[2022,2023]
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['panels_tested']==160
          assert r['all_bitwise_equal'] is True
          assert r['maximum_absolute_difference']==0.0
          assert r['known_shower_label_values_used'] is False
          assert r['target_region_orbits_used'] is False
          assert r['scientific_parameter_changed'] is False
          assert all(a['target_region_orbit_decoded'] is False for a in r['orbit_parse_audits'])
          assert all(a['label_column_accessed'] is False for a in r['orbit_parse_audits'])
          print('PASS_RECTANGULAR_DSH_REAL_TARGET_EXCLUDED_EQUIVALENCE_GATE')
          PY

      - name: Record implementation identities
        if: always()
        run: |
          set +e
          mkdir -p output
          sha256sum orbittrace_dsh_rectangular_equivalence/rectangular_dsh.py orbittrace_dsh_rectangular_equivalence/audit_real_target_excluded.py /tmp/p2_canonical_v2.py input/literature_comparators.py > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-rectangular-dsh-exact-equivalence-audit
          path: output
          if-no-files-found: error
          retention-days: 90
