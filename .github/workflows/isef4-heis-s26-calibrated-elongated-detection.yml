name: LUNARSHIFT Heis original calibrated elongated paper-defined recovery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/isef4-heis-s26-calibrated-elongated-detection.yml"
      - "scripts/isef4_heis_source_change_validation.py"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: isef4-heis-s26-frozen-feature-calibrated
  cancel-in-progress: false
jobs:
  published-real-nasa-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify code
        run: python -m py_compile scripts/isef4_heis_source_change_validation.py
      - name: Restore two authenticated original Heis calibrated source cutouts
        uses: actions/download-artifact@v4
        with:
          name: isef4-heis-S26-exact-official-calibrated-original-rois
          run-id: 35487310753
          github-token: ${{ github.token }}
          path: work/source
      - name: Evaluate frozen elongated figure region on calibrated NASA source pair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy opencv-python-headless
          python scripts/isef4_heis_source_change_validation.py \
            --source-folder work/source/output/heis_s26_verified_calibrated_pixels \
            --source-manifest diagnostics/isef4_heis_s26_calibrated_original_source_rois.json \
            --registration diagnostics/isef4_heis_s26_original_cdr_registration.json \
            --paper-temporal diagnostics/isef4_heis_s26_true_figure_morphology.json \
            --crosswalk diagnostics/isef4_heis_s26_paper_to_CDR_source_crosswalk.json \
            --out diagnostics/isef4_heis_s26_calibrated_elongated_temporal_check.json
      - name: Preserve all four trials on published known positive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef4-heis-S26-actual-original-calibrated-slope-temporal-test
          path: diagnostics/isef4_heis_s26_calibrated_elongated_temporal_check.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit only small observed results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f=diagnostics/isef4_heis_s26_calibrated_elongated_temporal_check.json
          if [[ -f "$f" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$f"
            if ! git diff --cached --quiet; then
              git commit -m 'Record Heis published elongation on original calibrated NASA images'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
