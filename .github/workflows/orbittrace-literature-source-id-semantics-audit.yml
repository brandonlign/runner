name: OrbitTrace literature source ID semantics audit

on:
  pull_request:
    branches: [agent/orbittrace-pooled-year-centroid-v8]
    paths:
      - '.github/workflows/orbittrace-literature-source-id-semantics-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v8-literature-matched-sonotaco
          fetch-depth: 1

      - name: Decode exact successful runner payloads and audit source semantics only
        run: |
          set -euo pipefail
          mkdir -p decoded audit
          git fetch --no-tags --depth=1 origin \
            15e63a8acf6303a4bf62e119c3dc8a121a488d1c \
            001a5827df2f397207646941fb764b2df41736ec \
            6594cc992841cf8d37572f9877c35580009095bd \
            871c2fc2e7307f5ae1e5532b9d04274cccf0b59b
          python - <<'PY'
          import base64, gzip, hashlib, json, re, subprocess
          from pathlib import Path

          def show(commit, path):
              return subprocess.check_output(['git','show',f'{commit}:{path}'])
          def decode(commit, paths, out):
              encoded=b''.join(b''.join(show(commit,p).split()) for p in paths)
              source=gzip.decompress(base64.b64decode(encoded,validate=True))
              Path(out).write_bytes(source)
              return hashlib.sha256(source).hexdigest()

          h25=[f'orbittrace_literature_comparison/hdbscan_catalogue_runner_parts/part{i:02d}.b64' for i in range(5)]
          h23root='orbittrace_hdbscan_freeze/sonotaco_2023_runner_parts/'
          h23=[h23root+x for x in [
              'part00_sub00.b64','part00_sub01a.b64','part00_sub01b.b64','part00_sub01c.b64',
              'part00_sub01d0.b64','part00_sub01d1.b64','part00_sub01d2.b64','part00_sub01d3.b64',
              'part00_sub02.b64','part00_sub03.b64','part00_sub04.b64','part00_sub05.b64']]
          s25=[f'orbittrace_literature_comparison/sugar_uncertainty_2025_runner_parts/part{i:02d}.b64' for i in range(4)]
          s23=[f'orbittrace_literature_freeze/sugar_uncertainty_2023_runner_parts/part{i:02d}.b64' for i in range(4)]
          specs={
              'hdbscan_2025.py':('15e63a8acf6303a4bf62e119c3dc8a121a488d1c',h25),
              'hdbscan_2023.py':('001a5827df2f397207646941fb764b2df41736ec',h23),
              'sugar_2025.py':('6594cc992841cf8d37572f9877c35580009095bd',s25),
              'sugar_2023.py':('871c2fc2e7307f5ae1e5532b9d04274cccf0b59b',s23),
          }
          expected={
              'hdbscan_2025.py':'a8b638f56dad2597973178523e8ad15e177a4f57e7fe6159fedc84d754afd3d2',
              'hdbscan_2023.py':'2e770252f68f40c7ebab8f072aef18b88246091e40a98673db69d09f7bb1d41b',
              'sugar_2025.py':'adbeb8a8737079f8cd63568d8684733dce09f724305ef9605f22423a57fda936',
              'sugar_2023.py':'2013ffc91cc299da1635ddd0cc728b460aebf030671ea0a83b7ddce4632a39a8',
          }
          hashes={}
          for name,(commit,paths) in specs.items():
              sha=decode(commit,paths,'decoded/'+name)
              if sha!=expected[name]:
                  raise RuntimeError(f'{name} source mismatch {sha}')
              hashes[name]=sha

          patterns=re.compile(r'(BLIND|blind|20\.0|55\.0|event_id|SNM|enumerate\(|row_index|row_idx|source_labels|shower.*token|token.*shower|sol.*<=|<=.*sol)')
          report={}
          for path in sorted(Path('decoded').glob('*.py')):
              text=path.read_text()
              lines=text.splitlines()
              contexts=[]; used=set()
              for i,line in enumerate(lines,1):
                  if not patterns.search(line): continue
                  lo=max(1,i-2); hi=min(len(lines),i+2)
                  if (lo,hi) in used: continue
                  used.add((lo,hi))
                  contexts.append([f'{j}: {lines[j-1]}' for j in range(lo,hi+1)])
              report[path.name]={
                  'sha256':hashes[path.name],
                  'has_20_55_literals':('20.0' in text and '55.0' in text),
                  'has_blind_word':bool(re.search('blind',text,re.I)),
                  'contexts':contexts,
              }
          Path('audit/id_semantics.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Upload source-only audit
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-literature-source-id-semantics-audit
          path: audit
          retention-days: 90
