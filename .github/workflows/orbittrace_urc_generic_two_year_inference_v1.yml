name: OrbitTrace generic two-year URC inference v1

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - 'orbittrace_urc_final_transport_v1/**'
      - '.github/workflows/orbittrace_urc_generic_two_year_inference_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  equivalence:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 63dc5b552d5217601003f738996477fb019ff7c8
          path: active-ranker
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 8401a0db4fdd8255de9ef3b48388d0743009fc84
          path: unseen-ranker
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact dependencies and reconstruct runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          mkdir -p input/v3 output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py /tmp/run_urc_union.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum active-ranker/orbittrace_urc_union_ranking_lab_v1/run_lab.py.gz.b64 | cut -d' ' -f1)" = '9704c91336c71a468c5e7da1aecf16919936eb159ab4c7bb594909e3751af51a'
          base64 -d active-ranker/orbittrace_urc_union_ranking_lab_v1/run_lab.py.gz.b64 | gzip -dc > /tmp/run_urc_union.py
          test "$(sha256sum /tmp/run_urc_union.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(git -C unseen-ranker hash-object orbittrace_urc_unseen_ranker_v1/application.py)" = '1949415fa1d40c0ad4ebedbf5f0fe916886c71d0'
          python -m py_compile \
            orbittrace_urc_final_transport_v1/generic_two_year_inference.py \
            orbittrace_urc_final_transport_v1/generic_two_year_inference_explicit_year.py \
            orbittrace_urc_final_transport_v1/verify_gmn_equivalence_explicit_year.py \
            unseen-ranker/orbittrace_urc_unseen_ranker_v1/application.py \
            /tmp/run_urc_union.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p20-recurrent-isolated-quartet-development
          path: input/p20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31341591263
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-urc-final-full-gmn-ranker-v1
          path: input/final-ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344776617
      - name: Verify immutable source/result/model identities
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
          test "$(sha256sum input/p20/p20_prelabel_payload.json | cut -d' ' -f1)" = '8ca358ae0f3ac96b188de9eac7bcfd6f870470873a2b7ee73b7ae76497c12734'
          test "$(sha256sum input/final-ranker/urc_final_ranker.joblib | cut -d' ' -f1)" = 'ac48355e8c51de2a9cfa12f23b2a847f5e946fc03336a941f80d98224ee5c909'
          python - <<'PY'
          import json
          r=json.load(open('input/final-ranker/urc_final_ranker_fit.json'))
          assert r['verdict']=='FROZEN_FULL_GMN_URC_RANKER_FIT'
          assert r['feature_matrix_sha256']=='5d215c5562c0ccce967d81ff0a087ca83b1afda95a269888d2219ef669d198d1'
          assert r['training_prediction_sha256']=='493d39cd57f272ee088b1c1c80240c2af99595a5e8a3c91defe693cd460041ac'
          assert r['model_joblib_sha256']=='ac48355e8c51de2a9cfa12f23b2a847f5e946fc03336a941f80d98224ee5c909'
          print('PASS_FROZEN_FULL_GMN_RANKER_IDENTITY')
          PY
      - name: Replay explicit-year generic adapter on GMN and require exact implementation equivalence
        env:
          PYTHONPATH: .:active-ranker:unseen-ranker:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_urc_final_transport_v1/verify_gmn_equivalence_explicit_year.py \
            --active-ranker-source /tmp/run_urc_union.py \
            --unseen-application unseen-ranker/orbittrace_urc_unseen_ranker_v1/application.py \
            --model input/final-ranker/urc_final_ranker.joblib \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --p20-prelabel-json input/p20/p20_prelabel_payload.json \
            --output output
          cat output/generic_two_year_urc_explicit_year_gmn_equivalence.json
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_urc_final_transport_v1/generic_two_year_inference.py \
            orbittrace_urc_final_transport_v1/generic_two_year_inference_explicit_year.py \
            orbittrace_urc_final_transport_v1/verify_gmn_equivalence_explicit_year.py \
            unseen-ranker/orbittrace_urc_unseen_ranker_v1/application.py \
            /tmp/run_urc_union.py > output/transport_source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-urc-generic-two-year-inference-v1
          path: output
          if-no-files-found: error
          retention-days: 90
