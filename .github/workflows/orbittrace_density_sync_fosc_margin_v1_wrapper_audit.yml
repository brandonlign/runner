name: OrbitTrace density-sync global FOSC margin v1 zero-data wrapper audit

on:
  push:
    branches:
      - agent/orbittrace-density-sync-fosc-margin-v1
    paths:
      - 'orbittrace_density_sync_fosc_margin_v1/WRAPPER_AUDIT_ACTIVATE.md'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  zero-data-wrapper-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-density-sync-fosc-margin-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact zero-data runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          test "$(git hash-object orbittrace_density_sync_fosc_margin_v1/THEORY_REPAIR_FREEZE.md)" = '41bb237fdbb195cdb7dc159f91b348bb91d41457'
          test "$(git hash-object orbittrace_density_sync_fosc_margin_v1/PROTOCOL.md)" = '88409670230013c58b293b8e0fcf12feca66abbe'
          test "$(git hash-object orbittrace_density_sync_fosc_margin_v1/fosc_margin.py)" = 'd4639b70124eecae33b61bee7c05f9ae54cbab48'
          test "$(git hash-object orbittrace_density_sync_fosc_margin_v1/run_gmn.py)" = 'b123ce8082428ea1565e564c01bb5a9246eb3f93'
          test "$(git hash-object orbittrace_density_sync_fosc_margin_v1/audit_wrapper_zero_data.py)" = 'd5904c0105d90ccca0ab4a3625933e7fccfc95be'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/run_development.py)" = '157813ca331165180a6d20aa71bfc78d5984396f'
          python -m py_compile \
            orbittrace_density_sync_fosc_margin_v1/fosc_margin.py \
            orbittrace_density_sync_fosc_margin_v1/run_gmn.py \
            orbittrace_density_sync_fosc_margin_v1/audit_wrapper_zero_data.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            orbittrace_density_synchronous_recurrent_eom_v1/run_development.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-sync-global-fosc-exclusion-margin-v1-synthetic-audit
          path: input/theorem-audit
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31863083687

      - name: Authorize wrapper audit from repaired theorem PASS
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('input/theorem-audit/DENSITY_SYNC_FOSC_MARGIN_V1_SYNTHETIC_AUDIT.json'))
          assert r['verdict']=='PASS_DENSITY_SYNC_FOSC_MARGIN_V1_SYNTHETIC_AUDIT'
          assert r['synthetic_only'] is True
          assert r['repair_of_run']==31862832013
          assert all(r['tests'].values())
          assert r['global_exclusion_margins']==r['bruteforce_global_losses']=={'11':1.0,'15':1.0,'16':1.0}
          for k in ('target_information_access','target_region_events_accessed','gmn_catalogue_accessed','scientific_labels_accessed','sonotaco_accessed','amos_accessed','asfn_accessed','efn_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False, (k,r[k])
          PY

      - name: Run exact-parent zero-data wrapper audit
        env:
          PYTHONPATH: orbittrace_density_sync_fosc_margin_v1:orbittrace_density_synchronous_recurrent_eom_v1:orbittrace_recurrent_eom_hdbscan_v1:.
        run: |
          set -euo pipefail
          rm -rf output
          python -u orbittrace_density_sync_fosc_margin_v1/audit_wrapper_zero_data.py
          python - <<'PY'
          import json
          r=json.load(open('output/DENSITY_SYNC_FOSC_MARGIN_V1_ZERO_DATA_WRAPPER_AUDIT.json'))
          assert r['verdict']=='PASS_DENSITY_SYNC_FOSC_MARGIN_V1_ZERO_DATA_WRAPPER_AUDIT'
          assert r['exact_parent_module_bound'] is True
          assert r['exact_density_sync_kernel_bound'] is True
          assert r['exact_candidate_builder_bound'] is True
          assert r['exact_evaluator_bound'] is True
          assert r['binding_tree_pin_present'] is True
          assert r['binding_order_pin_present'] is True
          assert r['candidate_universe_pin_present'] is True
          assert r['global_exclusion_kernel_only'] is True
          assert r['network_imports_absent'] is True
          assert r['scientific_runner_main_called'] is False
          assert r['catalogue_parser_called'] is False
          assert r['hdbscan_fit_called'] is False
          assert r['scientific_metrics_called'] is False
          for k in ('target_information_access','target_region_events_accessed','gmn_catalogue_accessed','scientific_labels_accessed','sonotaco_accessed','amos_accessed','asfn_accessed','efn_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False, (k,r[k])
          PY

      - name: Preserve zero-data wrapper-audit provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum \
            orbittrace_density_sync_fosc_margin_v1/THEORY_REPAIR_FREEZE.md \
            orbittrace_density_sync_fosc_margin_v1/PROTOCOL.md \
            orbittrace_density_sync_fosc_margin_v1/fosc_margin.py \
            orbittrace_density_sync_fosc_margin_v1/run_gmn.py \
            orbittrace_density_sync_fosc_margin_v1/audit_wrapper_zero_data.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            orbittrace_density_synchronous_recurrent_eom_v1/run_development.py \
            input/theorem-audit/DENSITY_SYNC_FOSC_MARGIN_V1_SYNTHETIC_AUDIT.json \
            output/DENSITY_SYNC_FOSC_MARGIN_V1_ZERO_DATA_WRAPPER_AUDIT.json \
            > output/source_output_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-density-sync-global-fosc-margin-v1-zero-data-wrapper-audit
          path: output
          if-no-files-found: error
          retention-days: 90
