name: ISEF Euclid v2 coherent development calibration
on:
  push:
    branches: [main]
    paths:
      - 'isef/euclid_v2_coherent_dev_calibration.py'
      - '.github/workflows/isef-euclid-v2-coherent-dev.yml'
permissions:
  contents: read
  issues: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'photutils>=2.2'
      - name: Field-1 coherent target-decoy calibration
        id: cal
        continue-on-error: true
        run: timeout 960s python isef/euclid_v2_coherent_dev_calibration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-euclid-v2-coherent-dev
          path: results/euclid_v2_coherent_dev_calibration.json
          if-no-files-found: warn
      - name: Report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', OUTCOME: '${{ steps.cal.outcome }}'}
        run: |
          python - <<'PY' > /tmp/coh.md
          import json,os
          from pathlib import Path
          print('## Euclid v2 coherent Field-1 development calibration')
          print(f"outcome: `{os.environ.get('OUTCOME')}`")
          p=Path('results/euclid_v2_coherent_dev_calibration.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:60000]+'\n```')
          else: print('_artifact not produced_')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/coh.md
