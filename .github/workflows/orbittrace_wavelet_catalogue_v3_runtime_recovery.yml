name: OrbitTrace wavelet catalogue v3 runtime recovery

on:
  pull_request:
    branches:
      - agent/orbittrace-fixed4-support-normalized-wrapper-development
    paths:
      - orbittrace_wavelet_catalogue_v3/**
      - .github/workflows/orbittrace_wavelet_catalogue_v3_runtime_recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-wavelet-catalogue-v3-runtime-recovery
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PYTHONPATH: orbittrace_wavelet_catalogue_v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Run target-free source and implementation audits
        run: |
          set -euo pipefail
          mkdir -p input/fixed4 output
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python -m py_compile \
            /tmp/run_wavelet_catalogue_v3_development.py \
            orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py
          python - <<'PY'
          import importlib.util
          import sys
          sys.path.insert(0, 'orbittrace_wavelet_catalogue_v3')
          import wavelet_episode_comparator as wavelet
          wavelet_checks = wavelet.self_test()
          print({'wavelet': wavelet_checks})
          if not all(wavelet_checks.values()):
              raise SystemExit('wavelet self-test failed')
          spec = importlib.util.spec_from_file_location(
              'wavelet_catalogue_v3_development',
              '/tmp/run_wavelet_catalogue_v3_development.py',
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          exact_checks = module.exact_rescore_implementation_self_test()
          print({'exact_rescore_implementation': exact_checks})
          if not all(exact_checks.values()):
              raise SystemExit('exact-rescore implementation equivalence failed')
          PY

      - name: Retrieve exact frozen fixed4 development baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 31106001133 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-fixed4-support-normalized-wrapper-development \
            --dir input/fixed4
          test -f input/fixed4/orbittrace_fixed4_support_wrapper_development.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('input/fixed4/orbittrace_fixed4_support_wrapper_development.json').read_text())
          assert result['verdict'] == 'FAIL_SUPPORT_NORMALIZED_WRAPPER_DEVELOPMENT'
          baseline = result['development']['panel_evaluations']['development']['metrics']['persistence']
          assert baseline['recovered_at_100'] == 61
          assert baseline['qualified_matches'] == 90
          assert abs(baseline['top100_dominant_precision'] - 0.6809376504699393) < 1e-15
          print('PASS_FIXED4_DEVELOPMENT_BASELINE_GUARD')
          PY

      - name: Run target-excluded wavelet catalogue development
        run: |
          set -euo pipefail
          python /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --fixed4-baseline-json input/fixed4/orbittrace_fixed4_support_wrapper_development.json \
            --output output
          cat output/WAVELET_CATALOGUE_V3_DEVELOPMENT.md

      - name: Enforce development result integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/wavelet_catalogue_v3_development.json').read_text())
          allowed = {
              'PASS_WAVELET_CATALOGUE_V3_DEVELOPMENT',
              'FAIL_WAVELET_CATALOGUE_V3_DEVELOPMENT',
          }
          if result.get('verdict') not in allowed:
              raise SystemExit(f"invalid verdict: {result.get('verdict')}")
          config = result['configuration']
          assert config['years'] == [2022, 2023]
          assert config['blind_exclusion'] == [20.0, 55.0]
          assert config['rescue_alpha'] == 1.0 / 129.0
          assert config['rescue_queue'] == 'fixed4 p <= 1/129; never inserted into wavelet ranking'
          print(json.dumps({
              'verdict': result['verdict'],
              'evaluation': {key: value for key, value in result['evaluation'].items() if key != 'per_label'},
              'fixed4_baseline': result['fixed4_development_baseline'],
              'gates': result['gates'],
          }, indent=2))
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            .github/workflows/orbittrace_wavelet_catalogue_v3_runtime_recovery.yml \
            orbittrace_wavelet_catalogue_v3/PROTOCOL.md \
            orbittrace_wavelet_catalogue_v3/DUAL_CHANNEL_EPISODE_PROMOTION_RESULT.json \
            orbittrace_wavelet_catalogue_v3/audit_development_source.py \
            orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py \
            orbittrace_wavelet_catalogue_v3/source_parts/part00.b64 \
            orbittrace_wavelet_catalogue_v3/source_parts/part01.b64 \
            orbittrace_wavelet_catalogue_v3/source_parts/part02.b64 \
            orbittrace_wavelet_catalogue_v3/source_parts/part03.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part00.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part01.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part02.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part03.b64 \
            sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            input/fixed4/orbittrace_fixed4_support_wrapper_development.json \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-wavelet-catalogue-v3-runtime-recovery
          path: output
          if-no-files-found: error
          retention-days: 90
