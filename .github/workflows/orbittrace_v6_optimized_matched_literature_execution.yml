name: OrbitTrace optimized v6 matched literature execution

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-literature-performance-v1
    paths:
      - orbittrace_v6_literature_adapter/RUN_OPTIMIZED.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-v6-optimized-matched-literature
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: .:exact:exact/orbittrace_multi_anchor_energy_v3:orbittrace_wavelet_catalogue_v3:orbittrace_multi_anchor_energy_v3:/tmp
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  authorize:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Require one-file child and optimized v6 PASS
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          test "$files" = 'orbittrace_v6_literature_adapter/RUN_OPTIMIZED.md'
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          test "$(git show "$HEAD_SHA":orbittrace_v6_literature_adapter/RUN_OPTIMIZED.md)" = 'EXECUTE_AFTER_OPTIMIZED_V6_PASS'
          test ! -e orbittrace_v6_literature_adapter/RUN_OPTIMIZED.md

          rm -rf /tmp/v6dev && mkdir -p /tmp/v6dev
          gh run download 31281504254 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-v6-optimized-development \
            --dir /tmp/v6dev
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/v6dev/v3_primary_catalogue_v6_development.json')
          assert p.exists(), 'optimized v6 development result missing'
          r=json.loads(p.read_text())
          assert r['verdict']=='PASS_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT', r['verdict']
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['primary_alpha']==0.05
          assert r['configuration']['rescue_queue']=='fixed4 p <= 1/129; never inserted into v3 primary ranking'
          assert all(r['gates'].values()), r['gates']
          assert all(a['proposal_cap_per_window']==512 for a in r['year_audits'])
          assert all(a['max_primary_proposals_per_year']==36864 for a in r['year_audits'])
          print('PASS_OPTIMIZED_V6_DEVELOPMENT_AUTHORIZATION')
          PY

  scan:
    needs: authorize
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        panel: [hdbscan, sugar]
        year: [2023, 2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: ffe8351b9ee8df4418fb4926fab782d66180e276
          path: exact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Reconstruct pinned runtime
        run: bash orbittrace_v6_literature_adapter/bootstrap_optimized_runtime.sh
      - name: Reconstruct exact pre-truth ID manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash orbittrace_v6_literature_adapter/prepare_optimized_manifest.sh
      - name: Execute accelerated frozen pre-truth scan
        run: |
          set -euo pipefail
          mkdir -p output_scan
          if [ '${{ matrix.year }}' = '2023' ]; then archive='input/archives/023a.zip'; else archive='input/archives/025a.zip'; fi
          python -u orbittrace_v6_literature_adapter/run_pretruth_year.py \
            --panel '${{ matrix.panel }}' \
            --year '${{ matrix.year }}' \
            --v6-source runtime/run_v3_primary_catalogue_v6.repaired.py \
            --base-runner runtime/run_wavelet_catalogue_v3_development.py \
            --exact-row-runner runtime/run_exact_row_blind_safe.py \
            --id-manifest output_manifest/id_manifest.json \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --archive "$archive" \
            --parallel-exact-workers 4 \
            --output output_scan/checkpoint.pkl
          python - <<'PY'
          import pickle
          from pathlib import Path
          r=pickle.loads(Path('output_scan/checkpoint.pkl').read_bytes())
          assert r['truth_accessed'] is False
          assert r['mapping_accessed'] is False
          assert r['competitor_cluster_labels_accessed'] is False
          assert r['execution']['parallel_exact_enabled'] is True
          assert 1 <= int(r['execution']['parallel_exact_workers']) <= 4
          print('PASS_OPTIMIZED_PRETRUTH_CHECKPOINT')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-v6-checkpoint-${{ matrix.panel }}-${{ matrix.year }}
          path: output_scan
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: [authorize, scan]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: ffe8351b9ee8df4418fb4926fab782d66180e276
          path: exact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Reconstruct pinned runtime and exact ID manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash orbittrace_v6_literature_adapter/bootstrap_optimized_runtime.sh
          bash orbittrace_v6_literature_adapter/prepare_optimized_manifest.sh
      - uses: actions/download-artifact@v4
        with:
          name: optimized-v6-checkpoint-hdbscan-2023
          path: input/checkpoints/hdbscan2023
      - uses: actions/download-artifact@v4
        with:
          name: optimized-v6-checkpoint-hdbscan-2025
          path: input/checkpoints/hdbscan2025
      - uses: actions/download-artifact@v4
        with:
          name: optimized-v6-checkpoint-sugar-2023
          path: input/checkpoints/sugar2023
      - uses: actions/download-artifact@v4
        with:
          name: optimized-v6-checkpoint-sugar-2025
          path: input/checkpoints/sugar2025
      - name: Freeze recurrent rankings before truth
        run: |
          set -euo pipefail
          mkdir -p output_pretruth
          python orbittrace_v6_literature_adapter/combine_pretruth.py \
            --v6-source runtime/run_v3_primary_catalogue_v6.repaired.py \
            --base-runner runtime/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --id-manifest output_manifest/id_manifest.json \
            --hdbscan-2023-checkpoint input/checkpoints/hdbscan2023/checkpoint.pkl \
            --hdbscan-2025-checkpoint input/checkpoints/hdbscan2025/checkpoint.pkl \
            --sugar-2023-checkpoint input/checkpoints/sugar2023/checkpoint.pkl \
            --sugar-2025-checkpoint input/checkpoints/sugar2025/checkpoint.pkl \
            --output output_pretruth/pretruth.json
          test -f output_pretruth/pretruth.json
      - name: Download post-freeze truth metadata only after ranking freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/{parser,mapping} output_literature
          gh run download 30920687116 --repo "$GITHUB_REPOSITORY" --name sonotaco-2023-confirmation-source-repair-v2 --dir input/parser
          gh run download 30855193522 --repo "$GITHUB_REPOSITORY" --name real-shower-meta-data-audit --dir input/mapping
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/parser/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/mapping/audit.json' | sha256sum -c -
      - name: Evaluate frozen matched comparison
        run: |
          set -euo pipefail
          python orbittrace_v6_literature_adapter/evaluate_frozen.py \
            --pretruth output_pretruth/pretruth.json \
            --exact-row-runner runtime/run_exact_row_blind_safe.py \
            --base-runner runtime/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --parser-2023 input/parser/run_sonotaco_2023_fixed4_confirmation.py \
            --parser-2025 exact/orbittrace_literature_matched_v8/sonotaco_2025_native_adapter_wrapper.py \
            --mapping-audit input/mapping/audit.json \
            --archive-2023 input/archives/023a.zip \
            --archive-2025 input/archives/025a.zip \
            --hdbscan-2023 input/hdbscan2023/full_catalogue_assignments.jsonl.gz \
            --hdbscan-2025 input/hdbscan2025/full_catalogue_assignments.jsonl.gz \
            --sugar-2023 input/sugar2023/sugar_uncertainty_assignments.json.gz \
            --sugar-2025 input/sugar2025/sugar_uncertainty_assignments.json.gz \
            --output output_literature/v3_primary_matched_literature.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output_literature/v3_primary_matched_literature.json').read_text())
          assert r['classification'] in {'BROAD_CATALOGUE_SUPERIORITY','SPARSE_STREAM_SUPERIORITY','NO_LITERATURE_SUPERIORITY'}
          assert r['years']==[2023,2025]
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['pairwise_only_no_cross_denominator_comparison'] is True
          assert r['panels']['hdbscan']['exact_event_rows']=={'2023':26460,'2025':19658}
          assert r['panels']['sugar']['exact_event_rows']=={'2023':30414,'2025':23200}
          print('ORBITTRACE_OPTIMIZED_MATCHED_RESULT_BEGIN')
          print(json.dumps({
            'classification':r['classification'],
            'broad_catalogue_superiority':r['broad_catalogue_superiority'],
            'sparse_stream_superiority':r['sparse_stream_superiority'],
            'panel_passes':{p:{'broad':r['panels'][p]['broad_pairwise_pass'],'sparse':r['panels'][p]['sparse_pairwise_pass']} for p in ('hdbscan','sugar')},
          },indent=2,sort_keys=True))
          print('ORBITTRACE_OPTIMIZED_MATCHED_RESULT_END')
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          mkdir -p output_literature
          sha256sum orbittrace_v6_literature_adapter/* .github/workflows/orbittrace_v6_optimized_matched_literature_execution.yml runtime/*.py > output_literature/source_sha256.txt 2>/dev/null || true
          python --version > output_literature/python_version.txt
          python -m pip freeze > output_literature/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v6-optimized-matched-literature-result
          path: output_literature
          if-no-files-found: error
          retention-days: 90
