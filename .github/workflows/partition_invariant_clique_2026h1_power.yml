name: Partition-invariant clique 2026 H1 power

on:
  pull_request:
    branches:
      - agent/empirical-window-null-evenyear-stage0
    paths:
      - .github/workflows/partition_invariant_clique_2026h1_power.yml
      - partition_invariant_clique_2026h1/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: partition-invariant-clique-2026h1-power
  cancel-in-progress: true

jobs:
  fresh-2026h1-power:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SOURCE_SHA256: '22b9ddeab4b628a8991d255c740ba709ffe7977c209fd21a2ad9083c2c726e2f'
      EVENTS_SHA256: '59e48ee6a0b653a2b4530f8a2221e2e93e6af3e6a9f11281c6f17fc428a85ddf'
      AUDIT_SHA256: '45a367043ff91f4b44be4934d56d5b923ac4aea555ddf41fdd7cebfa7bc5d28e'
      BASELINE_PAYLOAD_SHA256: '2cb82a8c12913a6176ddd7c6333b57a4d672334934c0d2ca4b572e878590cfa2'
      BASELINE_SOURCE_SHA256: '7718ac5229475f4240305ad9c1e073c49702c771df36612d9be5baa877b46a50'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partition-invariant-clique-2026h1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - name: Retrieve exact fresh 2026 H1 data artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output
          gh run download 30873092919 \
            --repo "$GITHUB_REPOSITORY" \
            --name partition-invariant-clique-2026h1-data \
            --dir input
          echo "${EVENTS_SHA256}  input/selected_events.jsonl.gz" | sha256sum -c -
          echo "${AUDIT_SHA256}  input/audit.json" | sha256sum -c -
          echo "${BASELINE_PAYLOAD_SHA256}  real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64" | sha256sum -c -
      - name: Decode and verify frozen power source
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          encoded = ''.join(
              Path('partition_invariant_clique_2026h1/run_partition_invariant_clique_2026h1.py.gz.b64')
              .read_text()
              .split()
          )
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          source_hash = hashlib.sha256(source).hexdigest()
          if source_hash != '${{ env.SOURCE_SHA256 }}':
              raise RuntimeError(f'power source hash mismatch: {source_hash}')
          Path('/tmp/run_partition_invariant_clique_2026h1.py').write_bytes(source)

          baseline_encoded = ''.join(
              Path('real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64').read_text().split()
          )
          baseline_source = gzip.decompress(base64.b64decode(baseline_encoded, validate=True))
          baseline_hash = hashlib.sha256(baseline_source).hexdigest()
          if baseline_hash != '${{ env.BASELINE_SOURCE_SHA256 }}':
              raise RuntimeError(f'baseline source hash mismatch: {baseline_hash}')
          print('power source bytes:', len(source))
          print('power source sha256:', source_hash)
          print('baseline source sha256:', baseline_hash)
          PY
          python -m py_compile /tmp/run_partition_invariant_clique_2026h1.py
      - name: Run frozen fresh-holdout power benchmark
        run: |
          python /tmp/run_partition_invariant_clique_2026h1.py \
            --events input/selected_events.jsonl.gz \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --output output
          cat output/PARTITION_INVARIANT_CLIQUE_2026H1_REPORT.md
      - name: Enforce frozen continuation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('output/partition_invariant_clique_2026h1_power.json').read_text()
          )
          print(json.dumps({
              'candidate_weak_auc': result['candidate_weak_auc'],
              'comparators': result['fixed_comparator_weak_auc'],
              'false_positive': result['false_positive'],
              'worst_sector': result['worst_sector'],
              'recall': result['recall'],
              'k4_gain_over_split': result['k4_gain_over_split'],
              'gates': result['gates'],
              'verdict': result['verdict'],
          }, indent=2))
          if not all(result['gates'].values()):
              raise SystemExit('Frozen partition-invariant clique 2026 H1 gate failed')
          if result['verdict'] != 'PROCEED_TO_CROSS_SURVEY_AND_MULTIPLICITY_GATE':
              raise SystemExit(f"Unexpected verdict: {result['verdict']}")
          PY
      - name: Record provenance
        if: always()
        run: |
          sha256sum \
            partition_invariant_clique_2026h1/PROTOCOL.md \
            partition_invariant_clique_2026h1/build_2026_h1_data.py.gz.b64 \
            partition_invariant_clique_2026h1/run_partition_invariant_clique_2026h1.py.gz.b64 \
            input/selected_events.jsonl.gz \
            input/audit.json \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            > output/source_and_input_sha256.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload frozen 2026 H1 power evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partition-invariant-clique-2026h1-power
          path: output
          if-no-files-found: error
          retention-days: 90
