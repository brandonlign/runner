name: OrbitTrace P11 executable freeze audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p10-floor-consistent-geometry-freeze
    paths:
      - orbittrace_density_contrast_p11/**
      - .github/workflows/orbittrace_p11_density_contrast_development.yml
      - .github/workflows/orbittrace_p11_executable_freeze_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 requests==2.32.5
      - name: Reconstruct exact P11 and audit executable freeze
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          echo '638b4f41e51955436557a99f1142c3d3cea91e12a66e2f74925c6bfb79d5e50d  /tmp/p10.py' | sha256sum -c -
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/run_p11.py
          echo '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9  /tmp/run_p11.py' | sha256sum -c -
          PYTHONPATH=. python -m py_compile /tmp/run_p11.py orbittrace_density_contrast_p11/density_helper.py orbittrace_density_contrast_p11/run_header_compatible.py
          python orbittrace_density_contrast_p11/density_helper.py
          python - <<'PY'
          from pathlib import Path
          wrapper=Path('orbittrace_density_contrast_p11/run_header_compatible.py').read_text()
          workflow=Path('.github/workflows/orbittrace_p11_density_contrast_development.yml').read_text()
          protocol=Path('orbittrace_density_contrast_p11/PROTOCOL.md').read_text()
          for token in (
              "EXPECTED_P11_SOURCE = Path('/tmp/run_p11.py')",
              'import gmn_python_api.data_directory as mt',
              'get_monthly_file_content_by_date',
              'for attempt in range(3)',
              'requests.exceptions.ConnectionError',
              'requests.exceptions.Timeout',
              "spec_from_file_location('orbittrace_p11_runtime', EXPECTED_P11_SOURCE)",
              'module.exact_header_positions = compatible_exact_header_positions',
              'PASS_P11_HEADER_WHITESPACE_COMPAT_SELF_TEST',
              'PASS_P11_SAME_REQUEST_GMN_TRANSPORT_RESILIENCE_MAX3',
          ):
              assert token in wrapper,token
          for token in (
              'EXECUTE_P11_AFTER_AUTHORITATIVE_P10_SCIENTIFIC_NO_GO',
              '31300225235','9034442543','cd82efbcb880dc19b8ec8ceb25fe4442c7f7e3e3425db8f01b11adfa37f184a5',
              '638b4f41e51955436557a99f1142c3d3cea91e12a66e2f74925c6bfb79d5e50d',
              '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9',
              'orbittrace_density_contrast_p11/run_header_compatible.py',
              'DENSITY_CONTRAST_ORDER_STAT_MEMBERSHIP_P11_DEVELOPMENT.md',
              'p11_density_eligible_directions',
              'p11_density_veto_nonvacuous',
              'orbittrace-density-contrast-order-stat-membership-p11-development',
          ):
              assert token in workflow,token
          for token in ('5230285375','5230292345','5230298947','5230302320','5230139141'):
              assert token in protocol,token
          for token in ('OrbitTrace-April','target_coordinate'):
              assert token not in wrapper and token not in workflow,token
          print('PASS_P11_EXECUTABLE_FREEZE_AUDIT')
          PY
      - name: Assert no execution marker on freeze
        run: |
          set -euo pipefail
          test ! -e orbittrace_density_contrast_p11/RUN.md
          test ! -e target
          echo P11_FREEZE_HAS_NO_TRUTH_ACTIVATION
