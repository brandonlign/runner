name: OrbitTrace PP-SBM runtime probe v1

on:
  push:
    branches: [agent/orbittrace-ppsbm-runtime-probe-v1]
    paths:
      - '.github/workflows/orbittrace_ppsbm_runtime_probe_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Install distro graph-tool only
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-graph-tool

      - name: Verify PPBlockState API on synthetic graph
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import numpy as np
          import graph_tool.all as gt

          gt.openmp_set_num_threads(1)
          gt.seed_rng(20260817)
          np.random.seed(20260817)

          # Toy graph only: two mixed-side assortative communities.
          edges=[]
          for a0,b0 in [(0,8),(4,12)]:
              for i in range(a0,a0+4):
                  for j in range(b0,b0+4):
                      edges.append((i,j))
          edges += [(0,12),(4,8)]
          g=gt.Graph(edges, directed=False)
          state=gt.minimize_blockmodel_dl(g, state=gt.PPBlockState)
          blocks=np.asarray(state.get_blocks().a, dtype=int)
          out={
              'graph_tool_version': getattr(gt, '__version__', 'unknown'),
              'vertices': int(g.num_vertices()),
              'edges': int(g.num_edges()),
              'blocks': int(state.get_B()),
              'entropy': float(state.entropy()),
              'membership': blocks.tolist(),
              'openmp_threads': int(gt.openmp_get_num_threads()),
          }
          print(json.dumps(out, sort_keys=True))
          assert len(blocks)==g.num_vertices()
          assert state.get_B() >= 1
          assert gt.openmp_get_num_threads()==1
          PY
