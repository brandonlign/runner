name: Affine stream-tube quartet preflight v4 manifest repair

on:
  pull_request:
    branches:
      - agent/affine-stream-tube-preflight-v4
    paths:
      - .github/workflows/affine_stream_tube_preflight_v4.yml
      - affine_stream_tube_preflight_v4/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: affine-stream-tube-preflight-v4-manifest-repair
  cancel-in-progress: true

jobs:
  development-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SOURCE_SHA256: '7ec195a34fa286129f01d181b7a8365623a0266d76c153a155d98d220cc833f3'
      PART00_SHA256: '066b53a58d6b211132ce12e6856415f278d3b068aa0463e5616b217b30130d45'
      PART01_SHA256: '47eada13f294fccdb7c6b8e0a7381534f6292dad51f1b5e2cb30600bc479918b'
      EVENTS_SHA256: '63e1389e2666d10b05138044f428609266b367cabab2542295c154a510e40f01'
      AUDIT_SHA256: 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778'
      BASELINE_PAYLOAD_SHA256: '2cb82a8c12913a6176ddd7c6333b57a4d672334934c0d2ca4b572e878590cfa2'
      BASELINE_SOURCE_SHA256: '7718ac5229475f4240305ad9c1e073c49702c771df36612d9be5baa877b46a50'
      SCORER_SOURCE_SHA256: 'f1c121e97a660a3820a11814c4325eb3ab33d34a031e83bdfb03b4b392e259b8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/affine-stream-tube-preflight-v4-manifest-repair
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - name: Retrieve exact retired development artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo "${EVENTS_SHA256}  input/selected_events.jsonl.gz" | sha256sum -c -
          echo "${AUDIT_SHA256}  input/audit.json" | sha256sum -c -
          echo "${BASELINE_PAYLOAD_SHA256}  real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64" | sha256sum -c -
      - name: Decode and verify exact candidate and inherited sources
        run: |
          set -euo pipefail
          echo "${PART00_SHA256}  affine_stream_tube_preflight_v4/source_parts/part00.b64" | sha256sum -c -
          echo "${PART01_SHA256}  affine_stream_tube_preflight_v4/source_parts/part01.b64" | sha256sum -c -
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          parts = sorted(Path('affine_stream_tube_preflight_v4/source_parts').glob('part*.b64'))
          expected = ['part00.b64', 'part01.b64']
          if [part.name for part in parts] != expected:
              raise RuntimeError(f'unexpected candidate parts: {[part.name for part in parts]}')
          encoded = ''.join(''.join(part.read_text().split()) for part in parts)
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          source_hash = hashlib.sha256(source).hexdigest()
          if source_hash != '${{ env.SOURCE_SHA256 }}':
              raise RuntimeError(f'candidate source mismatch: {source_hash}')
          Path('/tmp/run_affine_tube_preflight_v4.py').write_bytes(source)
          Path('output/run_affine_tube_preflight_v4.py').write_bytes(source)

          scorer_parts = sorted(Path('mondrian_clique_development/source_parts_v2').glob('part*.b64'))
          scorer = gzip.decompress(base64.b64decode(
              ''.join(''.join(part.read_text().split()) for part in scorer_parts), validate=True
          ))
          scorer_hash = hashlib.sha256(scorer).hexdigest()
          if scorer_hash != '${{ env.SCORER_SOURCE_SHA256 }}':
              raise RuntimeError(f'scorer source mismatch: {scorer_hash}')

          baseline_encoded = ''.join(Path(
              'real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64'
          ).read_text().split())
          baseline = gzip.decompress(base64.b64decode(baseline_encoded, validate=True))
          baseline_hash = hashlib.sha256(baseline).hexdigest()
          if baseline_hash != '${{ env.BASELINE_SOURCE_SHA256 }}':
              raise RuntimeError(f'baseline source mismatch: {baseline_hash}')

          print('candidate source sha256:', source_hash)
          print('candidate source bytes:', len(source))
          print('scorer source sha256:', scorer_hash)
          print('baseline source sha256:', baseline_hash)
          PY
          python -m py_compile /tmp/run_affine_tube_preflight_v4.py
      - name: Run frozen interface-complete preflight
        run: |
          python /tmp/run_affine_tube_preflight_v4.py \
            --events input/selected_events.jsonl.gz \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --output output \
            --workers 4
          cat output/AFFINE_TUBE_PREFLIGHT.md
      - name: Enforce frozen continuation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('output/affine_tube_preflight.json').read_text())
          print(json.dumps({
              'counts': result['counts'],
              'supported_bin_years': result['supported_bin_years'],
              'weak_auc': result['weak_auc'],
              'false_positive': result['false_positive'],
              'worst_bin_fpr_005': result['worst_bin_fpr_005'],
              'recall': result['recall'],
              'fold_auc': result['fold_auc'],
              'gates': result['gates'],
              'verdict': result['verdict'],
          }, indent=2))
          if not all(result['gates'].values()):
              raise SystemExit('Frozen affine stream-tube preflight failed')
          if result['verdict'] != 'PROCEED_TO_FULL_AFFINE_TUBE_BENCHMARK':
              raise SystemExit(f"Unexpected verdict: {result['verdict']}")
          PY
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            affine_stream_tube_preflight_v4/PROTOCOL.md \
            affine_stream_tube_preflight_v4/MANIFEST_REPAIR.md \
            affine_stream_tube_preflight_v4/source_parts/*.b64 \
            input/selected_events.jsonl.gz \
            input/audit.json \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/*.b64 \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload frozen preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affine-stream-tube-preflight-v4-manifest-repair
          path: output
          if-no-files-found: error
          retention-days: 90
