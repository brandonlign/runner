name: OrbitTrace phase-neutral loader repair audit v1

on:
  push:
    branches:
      - agent/orbittrace-phase-neutral-density-sync-v1
    paths:
      - 'orbittrace_phase_neutral_density_sync_v1/audit_snapshot_loader_repair.py'
      - 'orbittrace_phase_neutral_density_sync_v1/run_paired_development_snapshot_repair.py'
      - 'orbittrace_phase_neutral_density_sync_v1/PAIRED_LOADER_REPAIR.md'
      - '.github/workflows/orbittrace_phase_neutral_loader_repair_audit_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: 'orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:orbittrace_phase_neutral_density_sync_v1:.'

jobs:
  zero-data-loader-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-phase-neutral-density-sync-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin frozen science and repair-only sources
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_phase_neutral_density_sync_v1/PROTOCOL.md)" = '4f64703ce84168bb4fbe1b8c3b85c4eb06fec935'
          test "$(git hash-object orbittrace_phase_neutral_density_sync_v1/run_paired_development.py)" = '6795fbc411ba5cf6dfd964cdf125623f96e1a28b'
          test "$(git hash-object orbittrace_phase_neutral_density_sync_v1/PAIRED_LOADER_REPAIR.md)" = '28a2641ab20e8159907ed6e15b690139614816a8'
          test "$(git hash-object orbittrace_phase_neutral_density_sync_v1/run_paired_development_snapshot_repair.py)" = '504f99873528e0ed3e875fd28b886e3f1d052b5d'
          test "$(git hash-object orbittrace_phase_neutral_density_sync_v1/audit_snapshot_loader_repair.py)" = 'f6cd4eb41589daeac852571096817ed72af94b6a'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile \
            orbittrace_phase_neutral_density_sync_v1/run_paired_development_snapshot_repair.py \
            orbittrace_phase_neutral_density_sync_v1/audit_snapshot_loader_repair.py

      - name: Install frozen runtime imports
        run: |
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'

      - name: Execute zero-real-data compatibility audit
        run: |
          set -euo pipefail
          mkdir -p output
          python -u orbittrace_phase_neutral_density_sync_v1/audit_snapshot_loader_repair.py | tee output/PHASE_NEUTRAL_SNAPSHOT_LOADER_REPAIR_AUDIT_V1.json
          python - <<'PY'
          import json
          r=json.load(open('output/PHASE_NEUTRAL_SNAPSHOT_LOADER_REPAIR_AUDIT_V1.json'))
          assert r['schema']=='ORBITTRACE_PHASE_NEUTRAL_SNAPSHOT_LOADER_REPAIR_AUDIT_V1'
          assert r['verdict']=='PASS_PHASE_NEUTRAL_SNAPSHOT_LOADER_REPAIR_AUDIT_V1'
          assert all(r['tests'].values())
          assert r['synthetic_rows_only'] is True
          assert r['real_gmn_rows_accessed'] is False
          assert r['sealed_truth_accessed'] is False
          assert r['hdbscan_fit_executed'] is False
          assert r['method_evaluation_executed'] is False
          for k in ['target_information_access','target_region_events_accessed','sonotaco_access','amos_access','maarsy_scientific_access','dms_scientific_access']:
              assert r[k] is False,(k,r[k])
          print(r['verdict'])
          PY
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum \
            orbittrace_phase_neutral_density_sync_v1/PROTOCOL.md \
            orbittrace_phase_neutral_density_sync_v1/run_paired_development.py \
            orbittrace_phase_neutral_density_sync_v1/PAIRED_LOADER_REPAIR.md \
            orbittrace_phase_neutral_density_sync_v1/run_paired_development_snapshot_repair.py \
            orbittrace_phase_neutral_density_sync_v1/audit_snapshot_loader_repair.py \
            output/PHASE_NEUTRAL_SNAPSHOT_LOADER_REPAIR_AUDIT_V1.json \
            > output/source_output_sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-phase-neutral-snapshot-loader-repair-audit-v1
          path: output
          if-no-files-found: error
          retention-days: 90
