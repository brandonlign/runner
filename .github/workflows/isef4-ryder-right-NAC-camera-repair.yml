name: LUNARSHIFT Ryder right NAC-R original camera bugfix replay
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/isef4-ryder-right-NAC-camera-repair.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isef4-ryder-original-NAC-R-verified-distortion-csm
  cancel-in-progress: false
jobs:
  original-2022-right-2024-left:
    runs-on: ubuntu-latest
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4
      - name: Prove scalar distortion fix preserves original NAC-L and NAC-R instrument kernels
        run: |
          python -m py_compile scripts/isef4_isis_camera_triage.py scripts/isef4_ryder_camera_distortion_regression.py
          python scripts/isef4_ryder_camera_distortion_regression.py
      - name: Install official USGS ISIS 10 NAC camera
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lunar-isis10
          create-args: >-
            -c usgs-astrogeology
            -c conda-forge
            python=3.13
            isis=10.0.0
            usgscsm
          init-shell: bash
          post-cleanup: all
      - name: Verify original 2022 NAC-R and 2024 NAC-L ground camera marker
        shell: bash -el {0}
        run: |
          set -euo pipefail
          export ISISROOT="$CONDA_PREFIX"
          export ISISDATA="$GITHUB_WORKSPACE/isisdata"
          mkdir -p "$ISISDATA/base/kernels/lsk"
          curl --fail --location --retry 3 --silent --show-error \
            "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls" \
            --output "$ISISDATA/base/kernels/lsk/naif0012.tls"
          grep -q 'KPL/LSK' "$ISISDATA/base/kernels/lsk/naif0012.tls"
          python -m pip install --quiet 'setuptools<81'
          export ISEF4_DEVELOPMENT_EVENT=ryder_2022_2024
          export ISEF4_PRODUCT_ROLE=before
          export ISEF4_DIAGNOSTIC_SUFFIX=isis10_r22
          python scripts/isef4_isis_camera_triage.py
          export ISEF4_PRODUCT_ROLE=after
          export ISEF4_DIAGNOSTIC_SUFFIX=isis10_r24
          python scripts/isef4_isis_camera_triage.py
      - name: Preserve exact camera outputs regardless of sensor-model outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef4-ryder_2022_2024-exact-Ryder-CSM-cameras-FIXED
          path: |
            diagnostics/isef4_ryder_2022_2024_camera_status_isis10_r22.json
            diagnostics/isef4_ryder_2022_2024_camera_status_isis10_r24.json
            output/triage_isis10_r22/csm_event_campt.pvl
            output/triage_isis10_r24/csm_event_campt.pvl
          retention-days: 30
          if-no-files-found: warn
      - name: Commit both complete original camera diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f diagnostics/isef4_ryder_2022_2024_camera_status_isis10_r*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Correct original NASA right camera scalar distortion and record Ryder source result'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
