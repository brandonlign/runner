name: OrbitTrace dual-year reciprocal HDBSCAN synthetic audit v1

on:
  push:
    branches:
      - agent/orbittrace-dual-year-reciprocal-hdbscan-v1
    paths:
      - '.github/workflows/orbittrace_dual_year_reciprocal_hdbscan_v1_synthetic_audit.yml'
      - 'orbittrace_dual_year_reciprocal_hdbscan_v1/audit_synthetic.py'
      - 'orbittrace_dual_year_reciprocal_hdbscan_v1/run_development.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned HDBSCAN runtime and verify source blobs
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          test "$(git hash-object orbittrace_dual_year_reciprocal_hdbscan_v1/PROTOCOL.md)" = 'cf5fb559ceaf850ed8bca59713ab75575549f304'
          test "$(git hash-object orbittrace_dual_year_reciprocal_hdbscan_v1/run_development.py)" = '9759f7189b230b5d47c2e026172f21accff005e4'
          test "$(git hash-object orbittrace_dual_year_reciprocal_hdbscan_v1/audit_synthetic.py)" = 'a44ae0212ad1cd22ad6df26ef0948740e82fe038'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          python -m py_compile orbittrace_dual_year_reciprocal_hdbscan_v1/run_development.py orbittrace_dual_year_reciprocal_hdbscan_v1/audit_synthetic.py orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py
      - name: Run synthetic zero-truth audit
        env:
          PYTHONPATH: ../orbittrace_recurrent_eom_hdbscan_v1:.
        working-directory: orbittrace_dual_year_reciprocal_hdbscan_v1
        run: python audit_synthetic.py
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-dual-year-reciprocal-hdbscan-v1-synthetic-audit
          path: orbittrace_dual_year_reciprocal_hdbscan_v1/synthetic_audit.json
          if-no-files-found: error
          retention-days: 90
