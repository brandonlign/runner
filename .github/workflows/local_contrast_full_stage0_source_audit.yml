name: Local-contrast full Stage-0 source audit

on:
  pull_request:
    branches:
      - agent/local-contrast-gate-adjudication
    paths:
      - .github/workflows/local_contrast_full_stage0_source_audit.yml
      - local_contrast_full_stage0_source_audit/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-contrast-full-stage0-source-audit
  cancel-in-progress: true

jobs:
  no-score-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-contrast-full-stage0-source-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and derive exact candidate source
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          parts = sorted(Path('worst_family_recurrence_stage0/source_parts').glob('part*.b64'))
          if [p.name for p in parts] != ['part00.b64','part01.b64','part02.b64','part03.b64']:
              raise RuntimeError(f'unexpected source parts: {[p.name for p in parts]}')
          raw = gzip.decompress(base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts), validate=True))
          digest = hashlib.sha256(raw).hexdigest()
          if digest != '4384dd0352174e57ca1f93a2c3bd070002f026cef8acace035ba4ec05e577dac':
              raise RuntimeError(f'base source mismatch: {digest}')
          Path('/tmp/worst_family_source.py').write_bytes(raw)
          PY
          python local_contrast_recurrence_dev/derive_candidate.py \
            /tmp/worst_family_source.py \
            output/run_local_contrast.py
          python -m py_compile output/run_local_contrast.py
          echo 'b7589d8d140a37596f19d4993be1e2fdd99a18b8eaa087a02e3c4ce585000071  output/run_local_contrast.py' | sha256sum -c -
      - name: Inspect static CLI and interfaces only
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          path = Path('output/run_local_contrast.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          constants = {}
          functions = []
          argument_calls = []
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  try:
                      constants[node.targets[0].id] = ast.literal_eval(node.value)
                  except Exception:
                      pass
              elif isinstance(node, ast.FunctionDef):
                  functions.append({'name': node.name, 'lineno': node.lineno, 'signature': ast.unparse(node.args)})
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr == 'add_argument':
                  try:
                      argument_calls.append({'lineno': node.lineno, 'call': ast.unparse(node)})
                  except Exception:
                      pass
          audit = {
              'candidate_sha256': 'b7589d8d140a37596f19d4993be1e2fdd99a18b8eaa087a02e3c4ce585000071',
              'source_bytes': path.stat().st_size,
              'constants': constants,
              'functions': functions,
              'argparse_calls': argument_calls,
          }
          Path('output/interface.json').write_text(json.dumps(audit, indent=2, sort_keys=True))
          Path('output/static_cli.txt').write_text('\n'.join(item['call'] for item in argument_calls) + '\n')
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY
          cat output/static_cli.txt
      - name: Record provenance
        run: |
          sha256sum \
            local_contrast_full_stage0_source_audit/PROTOCOL.md \
            local_contrast_recurrence_dev/derive_candidate.py \
            /tmp/worst_family_source.py \
            output/run_local_contrast.py \
            > output/source_sha256.txt
          python --version > output/python_version.txt
      - name: Upload source interface audit
        uses: actions/upload-artifact@v4
        with:
          name: local-contrast-full-stage0-source-audit
          path: output
          if-no-files-found: error
          retention-days: 90
