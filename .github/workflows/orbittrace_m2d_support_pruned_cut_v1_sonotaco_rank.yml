name: OrbitTrace M2D support-pruned SonotaCo rank

on:
  pull_request:
    branches: [agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1]
    paths: ['.github/workflows/orbittrace_m2d_support_pruned_cut_v1_sonotaco_rank.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  rank:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-internal-mass-sonotaco-development-v1
          path: baseline-m2d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact runtime and verify sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/rank_sonotaco_m2d.py)" = '5cdf7e8b7d202a6335d832b89a8f81c7ff781d57'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git -C baseline-m2d hash-object orbittrace_internal_mass_sonotaco_development_v1/run_binding.py)" = 'b44e0222e08ae4e85f0ea9a91c95f7b9141f3fb9'
          test "$(sha256sum baseline-m2d/orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp | cut -d' ' -f1)" = '4eef6f1b70b5baee5d1983d2480c02d73569b12af868ec23bbb6009d6ca1fa37'
          python -m py_compile orbittrace_m2d_support_pruned_cut_v1/rank_sonotaco_m2d.py
          mkdir -p input/rows input/pretruth output
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-sonotaco-label-free-preparation-v2
          path: input/rows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31354363306
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-sonotaco-pretruth
          path: input/pretruth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32287719630
      - name: Verify sealed support pretruth; truth artifact is absent
        run: |
          set -euo pipefail
          test "$(sha256sum input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_PRETRUTH.json | cut -d' ' -f1)" = '6ae27f985340eaa41870ab4c4f8cd15d6a1cd97e03ef828254f4c24d7896176a'
          test ! -e input/truth
      - name: Compute exact M2D ranking without truth
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_support_pruned_cut_v1/rank_sonotaco_m2d.py \
            --rows-root input/rows \
            --structural-source orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --support-pretruth input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_PRETRUTH.json \
            --baseline-runner baseline-m2d/orbittrace_internal_mass_sonotaco_development_v1/run_binding.py \
            --exact-cpp baseline-m2d/orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp \
            --output output
      - name: Seal ranking firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='output/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RANKED_PRETRUTH.json'; raw=open(p,'rb').read(); r=json.loads(raw)
          assert r['truth_artifact_downloaded'] is False and r['truth_used'] is False and r['shower_labels_accessed'] is False
          assert r['candidate_count']==907 and r['support_pretruth_sha256']=='6ae27f985340eaa41870ab4c4f8cd15d6a1cd97e03ef828254f4c24d7896176a'
          h=hashlib.sha256(raw).hexdigest(); open('output/RANKED_PRETRUTH_SHA256.txt','w').write(h+'  M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RANKED_PRETRUTH.json\n'); print('RANKED_PRETRUTH_SEALED',h)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-sonotaco-ranked-pretruth
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Post ranking seal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'M2D_SUPPORT_PRUNED_SONOTACO_RANKING=SEALED_NO_TRUTH'; cat output/RANKED_PRETRUTH_SHA256.txt; } > /tmp/c.md
          gh pr comment 1380 --repo "$GITHUB_REPOSITORY" --body-file /tmp/c.md || true
