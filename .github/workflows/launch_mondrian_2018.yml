name: Run frozen Mondrian 2018 confirmation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/launch_mondrian_2018.yml

permissions:
  contents: read

concurrency:
  group: frozen-mondrian-2018-confirmation
  cancel-in-progress: true

jobs:
  confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out exact frozen confirmation branch
        uses: actions/checkout@v4
        with:
          ref: agent/mondrian-clique-2018-confirmation-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - name: Run data gate, then unchanged score if authorized
        run: bash mondrian_clique_2018/run_frozen_confirmation.sh
      - name: Upload untouched-2018 data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-clique-2018-data
          path: mondrian_clique_2018/results/data_audit
          if-no-files-found: warn
          retention-days: 90
      - name: Upload untouched-2018 confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-clique-2018-confirmation
          path: mondrian_clique_2018/results/confirmation
          if-no-files-found: warn
          retention-days: 90
