name: Launch frozen Mondrian 2018 confirmation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/launch_mondrian_2018.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch registered frozen confirmation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/326676150/dispatches" \
            -d '{"ref":"agent/mondrian-clique-coverage-normalized-development"}')"
          test -z "${response}"
          echo "Frozen workflow dispatch accepted."
