name: OrbitTrace v6 semantic replay recovery

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-replay-semantic-equivalence-v1
    paths:
      - orbittrace_v6_exact_fanout_v2/RECOVER.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-v6-semantic-replay-recovery
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  authorize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require one-file recovery child
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'orbittrace_v6_exact_fanout_v2/RECOVER.md'
          test "$(git show "$HEAD_SHA":orbittrace_v6_exact_fanout_v2/RECOVER.md)" = 'RECOVER_FROM_FANOUT_RUN_31282128101_AFTER_REPLAY_EQUIVALENCE_GUARD'
          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_v6_exact_fanout_v2/RECOVER.md
          python -m py_compile orbittrace_v6_exact_fanout_v2/replay_exact_year.py
          echo PASS_SEMANTIC_REPLAY_RECOVERY_AUTHORIZATION

  replay:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        year: [2022, 2023]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: execution
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v6/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r frozen-v6/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v6-fanout-preexact-${{ matrix.year }}
          path: preexact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31282128101
      - uses: actions/download-artifact@v4
        with:
          pattern: orbittrace-v6-fanout-exact-${{ matrix.year }}-*
          path: exact
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31282128101
      - name: Reconstruct exact repaired source
        run: |
          set -euo pipefail
          cd frozen-v6
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          cat orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.frozen.py' | sha256sum -c -
          cd ..
          PYTHONPATH=execution python - <<'PY'
          from pathlib import Path
          from orbittrace_v6_checkpointed_fallback.common import apply_exact_two_line_repair
          d=apply_exact_two_line_repair(Path('/tmp/v6.frozen.py'),Path('/tmp/v6.repaired.py'))
          assert d=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          PY
      - name: Replay with strict semantic-equivalence fallback
        env:
          PYTHONPATH: execution:frozen-v6/orbittrace_wavelet_catalogue_v3:frozen-v6/orbittrace_multi_anchor_energy_v3:/tmp
        run: |
          set -euo pipefail
          mkdir -p year
          python -u execution/orbittrace_v6_exact_fanout_v2/replay_exact_year.py \
            --year '${{ matrix.year }}' \
            --preexact-checkpoint preexact/v6_preexact_${{ matrix.year }}.pkl \
            --exact-shards-dir exact \
            --repaired-source /tmp/v6.repaired.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 \
            --output year
          cat year/v6_year_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v6-semantic-replay-year-${{ matrix.year }}
          path: year
          if-no-files-found: error
          retention-days: 90

  combine:
    needs: replay
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: execution
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v6/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r frozen-v6/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - uses: actions/download-artifact@v4
        with:
          pattern: orbittrace-v6-semantic-replay-year-*
          path: checkpoints
          merge-multiple: true
      - name: Verify replay equivalence audits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for year in (2022,2023):
              r=json.loads(Path(f'checkpoints/v6_year_{year}.json').read_text())
              assert r['year']==year
              assert r['exact_shard_count']==6
              assert r['max_abs_float_delta'] <= 1e-12 or r['max_rel_float_delta'] <= 1e-12
              print('SEMANTIC_REPLAY_YEAR',year,r)
          PY
      - name: Reconstruct exact repaired sources and fixed4 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd frozen-v6
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          cat orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.frozen.py' | sha256sum -c -
          cd ..
          PYTHONPATH=execution python - <<'PY'
          from pathlib import Path
          from orbittrace_v6_checkpointed_fallback.common import apply_exact_two_line_repair
          d=apply_exact_two_line_repair(Path('/tmp/v6.frozen.py'),Path('/tmp/v6.repaired.py'))
          assert d=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          PY
          mkdir -p frozen-v6/input/fixed4 frozen-v6/output_semantic_replay
          gh run download 31106001133 --repo "$GITHUB_REPOSITORY" --name orbittrace-fixed4-support-normalized-wrapper-development --dir frozen-v6/input/fixed4
      - name: Evaluate unchanged repaired v6 from recovered year checkpoints
        env:
          PYTHONPATH: execution:frozen-v6/orbittrace_wavelet_catalogue_v3:frozen-v6/orbittrace_multi_anchor_energy_v3:/tmp
        run: |
          set -euo pipefail
          python -u execution/orbittrace_v6_checkpointed_fallback/combine_with_checkpoints.py \
            --repaired-source /tmp/v6.repaired.py \
            --checkpoint-2022 checkpoints/v6_year_2022.pkl \
            --checkpoint-2023 checkpoints/v6_year_2023.pkl \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 \
            --fixed4-baseline-json frozen-v6/input/fixed4/orbittrace_fixed4_support_wrapper_development.json \
            --output frozen-v6/output_semantic_replay
          cat frozen-v6/output_semantic_replay/V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('frozen-v6/output_semantic_replay/v3_primary_catalogue_v6_development.json').read_text())
          assert r['verdict'] in {'PASS_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT','FAIL_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert all(a['proposal_cap_per_window']==512 for a in r['year_audits'])
          assert all(a['max_primary_proposals_per_year']==36864 for a in r['year_audits'])
          print('ORBITTRACE_V6_SEMANTIC_REPLAY_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'evaluation':{k:v for k,v in r['evaluation'].items() if k!='per_label'},'gates':r['gates'],'year_audits':r['year_audits']},indent=2))
          print('ORBITTRACE_V6_SEMANTIC_REPLAY_RESULT_END')
          PY
      - name: Record recovery provenance
        if: always()
        run: |
          set +e
          mkdir -p frozen-v6/output_semantic_replay
          printf '%s\n' 'source_fanout_run=31282128101' > frozen-v6/output_semantic_replay/semantic_replay_provenance.txt
          printf '%s\n' 'recovery=exact shards reused; no exact rescore recomputed' >> frozen-v6/output_semantic_replay/semantic_replay_provenance.txt
          sha256sum execution/orbittrace_v6_exact_fanout_v2/replay_exact_year.py .github/workflows/orbittrace_v6_replay_semantic_recovery.yml >> frozen-v6/output_semantic_replay/semantic_replay_provenance.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v6-semantic-replay-development
          path: frozen-v6/output_semantic_replay
          if-no-files-found: error
          retention-days: 90
