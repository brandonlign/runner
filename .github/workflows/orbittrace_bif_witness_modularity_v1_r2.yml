name: OrbitTrace bifiltration witness modularity v1 r2

on:
  pull_request:
    branches: [agent/orbittrace-m2d-support-pruned-cut-v1]
    paths:
      - orbittrace_bif_witness_modularity_v1/**
      - .github/workflows/orbittrace_bif_witness_modularity_v1_r2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      pretruth_sha: ${{ steps.seal.outputs.pretruth_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact representation runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'networkx==3.6.1'
          test "$(git hash-object orbittrace_bif_witness_modularity_v1/PROTOCOL.md)" = '08b088cf83b8552286a0a36e1e985c3d4048d094'
          test "$(git hash-object orbittrace_bif_witness_modularity_v1/build_pretruth.py)" = '703081742f004f8817da050fdf22cf9ecde44dfe'
          test "$(git hash-object orbittrace_bif_witness_modularity_v1/evaluate_gmn.py)" = 'f8ce26f63245dc827c494578b09b95a0b18f0e54'
          python -m py_compile orbittrace_bif_witness_modularity_v1/build_pretruth.py orbittrace_bif_witness_modularity_v1/evaluate_gmn.py
          mkdir -p input/support input/bif output/pretruth
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-pretruth-r2
          path: input/support
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32285788062'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-annual-density-bifiltration-gmn-ranking-v1-prelabel
          path: input/bif
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32037435314'
      - name: Verify immutable zero-label inputs
        run: |
          set -euo pipefail
          echo '57a6fd0fa680fb56b3d6a8a984682213e0235baadf14b27f241927b2dbb4b50f  input/support/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json' | sha256sum -c -
          echo '95f8a57718a30b2c7e85016d505276d72cccb9e4ac1d6eb29f13067efc73dd0c  input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json' | sha256sum -c -
      - name: Build complete BWM ranking without shower truth
        run: |
          set -euo pipefail
          python -u orbittrace_bif_witness_modularity_v1/build_pretruth.py \
            --support-pruned-pretruth input/support/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json \
            --bif-endpoint-prelabel input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json \
            --output output/pretruth/BIF_WITNESS_MODULARITY_V1_PRETRUTH.json
      - name: Seal pretruth before any GMN shower labels
        id: seal
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          p='output/pretruth/BIF_WITNESS_MODULARITY_V1_PRETRUTH.json'; raw=open(p,'rb').read(); h=hashlib.sha256(raw).hexdigest(); r=json.loads(raw)
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_BWM_V1_RANKING_FROZEN_BEFORE_SHOWER_TRUTH'
          assert r['shower_truth_used'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False and r['sonotaco_scientific_access'] is False
          assert r['configuration']['new_tuned_parameters']==[] and r['configuration']['networkx_version']=='3.6.1' and r['configuration']['modularity_resolution']==1.0 and r['configuration']['community_passes']==1
          assert len(r['subsets'])==8 and all(len(s['bwm_candidates'])>0 for s in r['subsets'])
          print('BWM_V1_PRETRUTH_SHA256='+h)
          print(json.dumps(r['mechanism_summary'],sort_keys=True))
          print(json.dumps(r['size_summary'],sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('pretruth_sha='+h+'\n')
          open('output/pretruth/PRETRUTH_SHA256.txt','w').write(h+'  BIF_WITNESS_MODULARITY_V1_PRETRUTH.json\n')
          PY
      - name: Preserve pretruth provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/pretruth/execution_commit.txt
          python --version > output/pretruth/python_version.txt
          python -m pip freeze > output/pretruth/environment.txt
          sha256sum orbittrace_bif_witness_modularity_v1/PROTOCOL.md orbittrace_bif_witness_modularity_v1/build_pretruth.py orbittrace_bif_witness_modularity_v1/evaluate_gmn.py input/support/M2D_SUPPORT_PRUNED_CUT_V1_PRETRUTH.json input/bif/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json output/pretruth/BIF_WITNESS_MODULARITY_V1_PRETRUTH.json > output/pretruth/provenance_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-bif-witness-modularity-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact hidden-label runtime and verify frozen evaluator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          test "$(git hash-object orbittrace_bif_witness_modularity_v1/PROTOCOL.md)" = '08b088cf83b8552286a0a36e1e985c3d4048d094'
          test "$(git hash-object orbittrace_bif_witness_modularity_v1/build_pretruth.py)" = '703081742f004f8817da050fdf22cf9ecde44dfe'
          test "$(git hash-object orbittrace_bif_witness_modularity_v1/evaluate_gmn.py)" = 'f8ce26f63245dc827c494578b09b95a0b18f0e54'
          python -m py_compile orbittrace_bif_witness_modularity_v1/evaluate_gmn.py
          mkdir -p input/pretruth input/fairness input/ranker input/v8 input/v3 output/truth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-bif-witness-modularity-v1-pretruth
          path: input/pretruth
      - name: Verify exact sealed BWM ranking before opening truth
        run: |
          set -euo pipefail
          echo '${{ needs.pretruth.outputs.pretruth_sha }}  input/pretruth/BIF_WITNESS_MODULARITY_V1_PRETRUTH.json' | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('input/pretruth/BIF_WITNESS_MODULARITY_V1_PRETRUTH.json'))
          assert r['shower_truth_used'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False and r['sonotaco_scientific_access'] is False
          print('SEALED_BWM_PRETRUTH_VERIFIED_BEFORE_TRUTH')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth
          path: input/fairness
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32268943692'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '31344632499'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '31217916558'
      - name: Evaluate frozen BWM against hidden target-excluded GMN shower truth
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_bif_witness_modularity_v1/evaluate_gmn.py \
            --bwm-pretruth input/pretruth/BIF_WITNESS_MODULARITY_V1_PRETRUTH.json \
            --expected-pretruth-sha '${{ needs.pretruth.outputs.pretruth_sha }}' \
            --literature-pretruth input/fairness/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth/BIF_WITNESS_MODULARITY_V1_GMN_RESULT.json
      - name: Enforce binding verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/truth/BIF_WITNESS_MODULARITY_V1_GMN_RESULT.json'))
          assert r['verdict'] in {'PASS_BIF_WITNESS_MODULARITY_V1_GMN_DEVELOPMENT','FAIL_BIF_WITNESS_MODULARITY_V1_GMN_DEVELOPMENT'}
          assert r['bwm_pretruth_sha256']=='${{ needs.pretruth.outputs.pretruth_sha }}'
          assert r['method_changed_after_pretruth'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False and r['sonotaco_scientific_access'] is False and r['post_result_parameter_search'] is False
          print(r['verdict'])
          print(json.dumps({'routes':r['routes'],'scales':r['scales'],'gates':r['gates'],'size_summary':r['size_summary']},indent=2,sort_keys=True))
          PY
      - name: Preserve truth provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/truth/execution_commit.txt
          python --version > output/truth/python_version.txt
          python -m pip freeze > output/truth/environment.txt
          sha256sum orbittrace_bif_witness_modularity_v1/PROTOCOL.md orbittrace_bif_witness_modularity_v1/evaluate_gmn.py input/pretruth/BIF_WITNESS_MODULARITY_V1_PRETRUTH.json input/fairness/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json output/truth/BIF_WITNESS_MODULARITY_V1_GMN_RESULT.json > output/truth/provenance_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-bif-witness-modularity-v1-gmn-result
          path: output/truth
          if-no-files-found: error
          retention-days: 90
