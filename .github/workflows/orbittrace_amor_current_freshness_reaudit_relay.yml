name: OrbitTrace AMOR current freshness reaudit

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  audit:
    if: >-
      github.event.issue.number == 1376 &&
      github.event.comment.user.login == 'brandonlign' &&
      github.event.comment.body == 'RUN_ORBITTRACE_AMOR_CURRENT_FRESHNESS_REAUDIT_V1'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Announce exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1376 --repo "${{ github.repository }}" --body "ORBITTRACE_AMOR_FRESHNESS_REAUDIT_STARTED=${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-amor-1990-1999-freshness-audit
          fetch-depth: 1

      - name: Bind exact metadata-only auditor
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_amor_1990_1999_freshness_audit/audit_history.py)" = '3649c2ab45d4274baf802761a9f4ddd6aaf41b2b'
          python -m py_compile orbittrace_amor_1990_1999_freshness_audit/audit_history.py

      - name: Fetch current repository refs only
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Run current history-only freshness audit
        run: |
          set +e
          mkdir -p output
          python -u orbittrace_amor_1990_1999_freshness_audit/audit_history.py > output/stdout.json 2> output/stderr.txt
          code=$?
          cp output/amor_1990_1999_repo_freshness_audit.json output/result.json
          exit 0

      - name: Enforce no AMOR catalogue access by audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/result.json'))
          assert r['catalogue_access_this_audit'] is False
          assert r['scientific_value_access_this_audit'] is False
          assert r['label_access_this_audit'] is False
          assert r['target_information_access'] is False
          assert r['candidate_years']==list(range(1990,2000))
          print(json.dumps({'verdict':r['verdict'],'refs_scanned':r['refs_scanned'],'potential_exposure_hit_count':r['potential_exposure_hit_count'],'potential_exposure_hits':r['potential_exposure_hits']},indent=2,sort_keys=True))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/auditor_commit.txt
          sha256sum orbittrace_amor_1990_1999_freshness_audit/audit_history.py output/result.json > output/provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-amor-current-freshness-reaudit-v1-${{ github.run_id }}
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1376 --repo "${{ github.repository }}" --body "ORBITTRACE_AMOR_FRESHNESS_REAUDIT_COMPLETE=${GITHUB_RUN_ID}"
