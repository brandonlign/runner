name: OrbitTrace v42 joint equal-ranksum priority diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v42_joint_equal_ranksum_priority_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v42_joint_equal_ranksum_priority_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v42-joint-equal-ranksum-priority-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 31704c312c09be2765ad3f65a0685d1acfd2b055
          path: frozen-v40
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and pin runtime and diagnostic source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/source input/payload input/truth output/freeze output/diag
          test "$(git hash-object orbittrace_v42_joint_equal_ranksum_priority_diagnostic_v1/PROTOCOL.md)" = '9ff89145bd4da9e70d59d8cbf15184fac38dda6f'
          test "$(git hash-object orbittrace_v42_joint_equal_ranksum_priority_diagnostic_v1/diagnose.py)" = '191c8e6520117d3f3e492fbb21b2dda43980e85a'
          test "$(git -C frozen-v40 rev-parse HEAD)" = '31704c312c09be2765ad3f65a0685d1acfd2b055'
          test "$(git -C frozen-v40 hash-object orbittrace_v40_component_best_evidence_representative_v1/train_evaluate.py)" = '710944a43111e72ed286b3a5c06010db619c807f'
          test "$(git -C frozen-v8 rev-parse HEAD)" = 'c9d6c44704013ba0c9430100e98a29a56b453304'
          python -m py_compile orbittrace_v42_joint_equal_ranksum_priority_diagnostic_v1/diagnose.py
      - name: Restore only authoritative #1098 frozen signal before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088683367/zip' -o input/source.zip
          echo '1ad3513e021136b402e8aa121faa37675e2982d57aa2a14f1bc5e28d81b61b11  input/source.zip' | sha256sum -c -
          unzip -p input/source.zip diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json > input/source/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json
          test -s input/source/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json
          rm -f input/source.zip
          python - <<'PY'
          import json
          s=json.load(open('input/source/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json'))
          assert s['verdict']=='PASS_V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL_FREEZE'
          assert s['scientific_role']=='FULL_FIXED_HDB_FAMILY_SIGNAL_VECTOR_NO_OUTCOME_USED_FOR_DEFINITION'
          assert s['family_count']==229 and sum(bool(x['joint_signal']) for x in s['families'])==60
          assert s['canonical_sha256_without_self_field']=='47966ec3e5b29f56c5bb536ed19f24a99ff41f11bc2d20778240b16c5e44fd47'
          assert s['target_information_access'] is False and s['target_region_events_accessed'] is False
          assert s['maarsy_scientific_access'] is False and s['dms_scientific_access'] is False
          assert s['blind_exclusion']==[20.0,55.0]
          print('PASS_EQUAL_RANKSUM_SOURCE_SIGNAL_ONLY')
          PY
      - name: Restore immutable #950 HDB memberships before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          m=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          f=json.load(open('input/payload/hdbscan/family_memberships.json'))
          assert m['truth_accessed'] is False and f['truth_accessed'] is False
          assert len(m['family_ids'])==229 and len(f['families'])==229
          assert m['target_information_access'] is False and m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_EQUAL_RANKSUM_IMMUTABLE_HDB_PAYLOAD')
          PY
      - name: Freeze exact equal-ranksum priority vector before truth
        run: |
          set -euo pipefail
          python -u orbittrace_v42_joint_equal_ranksum_priority_diagnostic_v1/diagnose.py freeze \
            --signal-file input/source/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json \
            --output output/freeze
          python - <<'PY'
          import json
          r=json.load(open('output/freeze/V42_JOINT_EQUAL_RANKSUM_PRIORITY_FREEZE.json'))
          assert r['verdict']=='PASS_V42_JOINT_EQUAL_RANKSUM_PRIORITY_FREEZE'
          assert r['scientific_role']=='FROZEN_JOINT_POSITIVE_PRIORITY_VECTOR_BEFORE_OUTCOME_TRUTH'
          assert r['truth_accessed'] is False and r['joint_positive_count']==60 and len(r['rows'])==60
          assert r['priority_definition']=='equal_ranksum_priority=(quality_percentile+component_best_v31_percentile)/2'
          assert r['candidate_total_order_evaluated'] is False and r['literature_panel_evaluated'] is False
          assert r['alternative_aggregation_search'] is False and r['weight_search'] is False and r['threshold_search'] is False and r['top_k_search'] is False and r['rank_window_search'] is False
          assert r['oracle_identity_hardcoded'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_EQUAL_RANKSUM_PRIORITY_FROZEN_BEFORE_TRUTH')
          PY
      - name: Load immutable exposed truth only after priority freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
      - name: Diagnose priority AUC only
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:frozen-v8:.
        run: |
          set -euo pipefail
          python -u orbittrace_v42_joint_equal_ranksum_priority_diagnostic_v1/diagnose.py diagnose \
            --freeze-file output/freeze/V42_JOINT_EQUAL_RANKSUM_PRIORITY_FREEZE.json \
            --hdb-root input/payload/hdbscan \
            --truth-root input/truth \
            --output output/diag
      - name: Enforce diagnostic-only firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V42_JOINT_EQUAL_RANKSUM_PRIORITY_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V42_JOINT_EQUAL_RANKSUM_PRIORITY_DIAGNOSTIC','FAIL_V42_JOINT_EQUAL_RANKSUM_PRIORITY_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_RESULT_PRIORITY_DIAGNOSTIC_ONLY_NO_CANDIDATE_TOTAL_ORDER_OR_PANEL_EVALUATED'
          assert r['source_run']==31457788803 and r['source_artifact']==9088683367
          assert r['source_signal_sha256']=='47966ec3e5b29f56c5bb536ed19f24a99ff41f11bc2d20778240b16c5e44fd47'
          assert r['joint_positive_count']==60 and set(r['annual_diagnostics'])=={'2013','2014'}
          for y in ('2013','2014'):
              assert r['annual_diagnostics'][y]['family_level']['joint_family_count']==60
          for k in ('candidate_total_order_evaluated','literature_panel_evaluated','selector_evaluated','replacement_rule_evaluated','successor_selected','alternative_aggregation_search','min_max_geometric_product_search','weight_search','threshold_search','top_k_search','rank_window_search','v31_added_to_priority_search','boolean_combination_search','component_size_rule_search','graph_or_component_redefinition','feature_search','model_search','k_search','scaling_search','diversity_search','fusion_search','source_quota_selected','oracle_identity_hardcoded','post_result_second_search'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v42_joint_equal_ranksum_priority_diagnostic_v1/PROTOCOL.md orbittrace_v42_joint_equal_ranksum_priority_diagnostic_v1/diagnose.py input/source/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json output/freeze/V42_JOINT_EQUAL_RANKSUM_PRIORITY_FREEZE.json > output/V42_JOINT_EQUAL_RANKSUM_PRIORITY_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v42-joint-equal-ranksum-priority-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
