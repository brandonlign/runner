name: ISEF 5XMM-DR15 fast reprocessing probe
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_dr15_reprocessing_fast.py'
      - '.github/workflows/isef-xmm-dr15-reprocessing-fast.yml'
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'scipy>=1.13'
      - name: Run fast blinded comparison
        id: probe
        continue-on-error: true
        run: timeout 1000s python isef/xmm_dr15_reprocessing_fast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-dr15-reprocessing-fast
          path: results/xmm_dr15_reprocessing_probe.json
          if-no-files-found: warn
      - name: Report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', OUTCOME: '${{ steps.probe.outcome }}'}
        run: |
          python - <<'PY' >/tmp/report.md
          import json,os
          from pathlib import Path
          print('## 5XMM fast reprocessing-only probe')
          print('Outcome:',os.environ.get('OUTCOME'))
          p=Path('results/xmm_dr15_reprocessing_probe.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:60000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
