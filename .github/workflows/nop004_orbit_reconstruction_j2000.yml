name: NOP solution 004 J2000 orbit reconstruction

on:
  pull_request:
    branches:
      - agent/nop004-orbit-reconstruction-stage1
    paths:
      - nop004_orbit_reconstruction_stage1b/**
      - .github/workflows/nop004_orbit_reconstruction_j2000.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nop004-orbit-reconstruction-j2000-stage1b
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_ARTIFACT_ID: '8874489453'
      SOURCE_ARTIFACT_SHA256: '85ab59ef342afc2723ad1642426433d2dedf020abe17caf36815c096b098c6be'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nop004-orbit-reconstruction-j2000-stage1b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nop004_orbit_reconstruction_stage1/requirements.txt
      - name: Install unchanged Stage-1 dependencies
        run: python -m pip install --upgrade pip -r nop004_orbit_reconstruction_stage1/requirements.txt
      - name: Download exact solution-004 audit artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p nop004_orbit_reconstruction_stage1b/input nop004_orbit_reconstruction_stage1b/results
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o nop004_orbit_reconstruction_stage1b/input/source_artifact.zip
          echo "${SOURCE_ARTIFACT_SHA256}  nop004_orbit_reconstruction_stage1b/input/source_artifact.zip" | sha256sum -c -
          unzip -q nop004_orbit_reconstruction_stage1b/input/source_artifact.zip \
            -d nop004_orbit_reconstruction_stage1b/input/source_artifact
          test -s nop004_orbit_reconstruction_stage1b/input/source_artifact/results/0149NOP_004.csv
      - name: Compile unchanged source and corrected launcher
        run: |
          python -m py_compile \
            nop004_orbit_reconstruction_stage1/reconstruct_nominal_orbits.py \
            nop004_orbit_reconstruction_stage1b/reconstruct_nominal_orbits_j2000.py
      - name: Run frozen J2000 convention gate
        run: |
          python nop004_orbit_reconstruction_stage1b/reconstruct_nominal_orbits_j2000.py \
            --lookup nop004_orbit_reconstruction_stage1b/input/source_artifact/results/0149NOP_004.csv \
            --output nop004_orbit_reconstruction_stage1b/results
      - name: Record provenance
        if: always()
        run: |
          mkdir -p nop004_orbit_reconstruction_stage1b/results
          sha256sum \
            nop004_orbit_reconstruction_stage1/reconstruct_nominal_orbits.py \
            nop004_orbit_reconstruction_stage1/PROTOCOL.md \
            nop004_orbit_reconstruction_stage1/requirements.txt \
            nop004_orbit_reconstruction_stage1b/reconstruct_nominal_orbits_j2000.py \
            nop004_orbit_reconstruction_stage1b/PROTOCOL.md \
            > nop004_orbit_reconstruction_stage1b/results/source_sha256.txt
          sha256sum \
            nop004_orbit_reconstruction_stage1b/input/source_artifact.zip \
            nop004_orbit_reconstruction_stage1b/input/source_artifact/results/0149NOP_004.csv \
            > nop004_orbit_reconstruction_stage1b/results/input_sha256.txt
          python --version > nop004_orbit_reconstruction_stage1b/results/python_version.txt
          python -m pip freeze > nop004_orbit_reconstruction_stage1b/results/environment.txt
      - name: Upload J2000 reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nop004-nominal-orbit-reconstruction-j2000
          path: nop004_orbit_reconstruction_stage1b/results
          if-no-files-found: error
          retention-days: 90
