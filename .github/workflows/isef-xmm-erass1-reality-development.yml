name: ISEF XMM eRASS1 development reality
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_erass1_reality_development.py'
      - '.github/workflows/isef-xmm-erass1-reality-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install astropy numpy scipy
      - run: python isef/xmm_erass1_reality_development.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-erass1-reality-development
          path: results/xmm_erass1_reality_development.json
          if-no-files-found: error
