name: ISEF HETDEX XMPG VIRUS spectrum gate
on:
  push:
    paths:
      - 'isef/hetdex_xmpg_virus_spectrum_gate.py'
      - '.github/workflows/isef-hetdex-xmpg-virus-spectrum-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'scipy>=1.16' 'astropy>=7.1,<8' 'fsspec>=2025.1' 'aiohttp>=3.10'
      - run: timeout 1200s python isef/hetdex_xmpg_virus_spectrum_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-hetdex-xmpg-virus-spectrum-gate
          path: results/hetdex_xmpg_virus_spectrum_gate.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY' >/tmp/r.md
          import json
          from pathlib import Path
          print('## HETDEX XMPG frozen native-VIRUS spectrum gate')
          p=Path('results/hetdex_xmpg_virus_spectrum_gate.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:60000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
