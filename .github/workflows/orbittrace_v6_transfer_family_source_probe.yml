name: OrbitTrace v6 transfer family source probe

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-sonotaco-2017-2019-transfer-implementation
    paths:
      - orbittrace_v6_sonotaco_2017_2019_transfer/SOURCE_PROBE.md

permissions:
  contents: read

concurrency:
  group: orbittrace-v6-transfer-family-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Require one-file source-only child
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init /tmp/guard >/dev/null
          cd /tmp/guard
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = 'orbittrace_v6_sonotaco_2017_2019_transfer/SOURCE_PROBE.md'
          marker="$(git show "$HEAD_SHA":orbittrace_v6_sonotaco_2017_2019_transfer/SOURCE_PROBE.md)"
          case "$marker" in
            SOURCE_ONLY_EXACT_V6_SCAN_REPLAY_PROBE|SOURCE_ONLY_EXACT_V6_SOURCE_EXPORT) ;;
            *) echo "unexpected source-only probe marker: $marker" >&2; exit 1 ;;
          esac
          echo "$marker" > /tmp/probe_marker
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - name: Reconstruct exact v6 source only
        run: |
          set -euo pipefail
          mkdir -p source_export
          test ! -e input
          test ! -e output
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress > source_export/run_v3_primary_catalogue_v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  source_export/run_v3_primary_catalogue_v6.frozen.py' | sha256sum -c -
          sha256sum source_export/run_v3_primary_catalogue_v6.frozen.py > source_export/SHA256SUMS.txt
      - name: Inspect scan/replay API when requested
        if: ${{ hashFiles('/tmp/probe_marker') != '' }}
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/probe_marker)" != 'SOURCE_ONLY_EXACT_V6_SCAN_REPLAY_PROBE' ]; then exit 0; fi
          python - <<'PY'
          import ast
          from pathlib import Path
          text=Path('source_export/run_v3_primary_catalogue_v6.frozen.py').read_text(); tree=ast.parse(text); lines=text.splitlines()
          funcs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          targets=['scan_year_v6','exact_rescore_window_v6','component_records_track_v6','cap_anchor_track','calibrate_v3_by_bin','v3_proposals_window','fixed4_rescue_proposals_window']
          for name in targets:
              if name in funcs:
                  n=funcs[name]
                  print(f'===== {name} {n.lineno}-{n.end_lineno} =====')
                  print('\n'.join(f'{i:04d}: {lines[i-1]}' for i in range(n.lineno,n.end_lineno+1)))
          print('PASS_V6_SCAN_REPLAY_SOURCE_PROBE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v6-exact-frozen-source-export
          path: source_export
          if-no-files-found: error
          retention-days: 7
      - name: Assert no-data boundary
        if: always()
        run: |
          test ! -e input
          test ! -e output
          echo NO_CATALOGUE_NO_LABELS_NO_TARGET_ACCESS
