name: OrbitTrace density-sync stratified-core v1 GMN development

on:
  push:
    branches:
      - agent/orbittrace-density-sync-stratified-core-v1
    paths:
      - 'orbittrace_density_sync_stratified_core_v1/GMN_ACTIVATE.md'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  binding-gmn-development:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-density-sync-stratified-core-v1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact parent runtime and verify frozen scientific sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/v8 input/ranker input/audits/injection input/audits/composition output

          test "$(git hash-object orbittrace_density_sync_stratified_core_v1/PROTOCOL.md)" = 'ab856dc94108906de7c6d47110b2f7e068aafc16'
          test "$(git hash-object orbittrace_density_sync_stratified_core_v1/stratified_core.py)" = 'ce22a6c762829b03184e136cd43cc0b821763e0c'
          test "$(git hash-object orbittrace_density_sync_stratified_core_v1/run_development.py)" = '5f227584ea597f1195d0cd548e495de5b76dcee5'
          test "$(git hash-object orbittrace_density_sync_stratified_core_v1/audit_composition.py)" = '92b7e2a868110577c6833a1ccdbe1dfb3ad80a13'
          test "$(git hash-object orbittrace_density_sync_stratified_core_v1/EXECUTION_FREEZE.json)" = '9c37028a107ced63b56ca62e0dd56c6f056f5fe2'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile \
            orbittrace_density_sync_stratified_core_v1/stratified_core.py \
            orbittrace_density_sync_stratified_core_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py

          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-stratified-core-injection-audit-v1
          path: input/audits/injection
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31861223877

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-sync-stratified-core-v1-zero-truth-audit
          path: input/audits/composition
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31861596404

      - name: Authorize one binding GMN endpoint from frozen audits
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          freeze=json.load(open('orbittrace_density_sync_stratified_core_v1/EXECUTION_FREEZE.json'))
          assert freeze['schema']=='DENSITY_SYNC_STRATIFIED_CORE_V1_EXECUTION_FREEZE'
          assert freeze['scientific_status']=='PRE_FIRST_TECHNICALLY_VALID_GMN_OUTCOME'
          assert freeze['direct_parent']['binding_head']=='182f07ade6bb5d4be2c80b88df9216bb2d6eee2d'
          assert freeze['direct_parent']['candidate_count']==2094
          assert freeze['successor']['protocol_blob']=='ab856dc94108906de7c6d47110b2f7e068aafc16'
          assert freeze['successor']['stratified_core_blob']=='ce22a6c762829b03184e136cd43cc0b821763e0c'
          assert freeze['successor']['development_runner_blob']=='5f227584ea597f1195d0cd548e495de5b76dcee5'
          assert freeze['successor']['k_year']==5
          assert freeze['governance']['no_parameter_rescue'] is True
          assert freeze['governance']['gmn_failure_permanently_closes_this_version'] is True
          assert freeze['governance']['sonotaco_authorized_before_gmn_pass'] is False
          assert freeze['governance']['amos_authorized'] is False

          inj=json.load(open('input/audits/injection/STRATIFIED_CORE_ZERO_TRUTH_INJECTION_AUDIT.json'))
          assert inj['verdict']=='PASS_STRATIFIED_CORE_HDBSCAN_V1_ZERO_TRUTH_INJECTION_AUDIT'
          assert inj['synthetic_only'] is True
          assert inj['balanced_k_year']==5 and inj['total_parent_min_samples']==10
          assert inj['standard_core_injection_reproduces_standard_hdbscan_partition'] is True
          assert inj['core_mechanics']['matches_bruteforce_bitwise'] is True

          comp=json.load(open('input/audits/composition/DENSITY_SYNC_STRATIFIED_CORE_V1_ZERO_TRUTH_COMPOSITION_AUDIT.json'))
          assert comp['verdict']=='PASS_DENSITY_SYNC_STRATIFIED_CORE_V1_ZERO_TRUTH_COMPOSITION_AUDIT'
          assert comp['synthetic_only'] is True
          assert comp['balanced_k_year']==5
          assert comp['hierarchy_constructed'] is True
          assert comp['density_synchronous_scoring_constructed'] is True
          assert comp['prior_injection_equivalence_pass_run']==31861223877

          for obj in (inj,comp):
              for k in ('target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
                  assert obj[k] is False, (k,obj[k])
          for k in ('sonotaco_accessed','efn_accessed','asfn_accessed','amos_accessed'):
              assert comp[k] is False, (k,comp[k])
          assert inj['gmn_catalogue_accessed'] is False and inj['scientific_labels_accessed'] is False
          assert comp['gmn_catalogue_accessed'] is False and comp['scientific_labels_accessed'] is False
          print('PASS_DENSITY_SYNC_STRATIFIED_CORE_V1_PRE_GMN_AUTHORIZATION')
          PY

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify immutable GMN runtime-support inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Run first and binding target-excluded GMN endpoint
        env:
          PYTHONPATH: orbittrace_density_sync_stratified_core_v1:orbittrace_density_synchronous_recurrent_eom_v1:orbittrace_recurrent_eom_hdbscan_v1:input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          rm -rf output/*
          python -u orbittrace_density_sync_stratified_core_v1/run_development.py \
            --base-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce binding result schema and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/DENSITY_SYNC_STRATIFIED_CORE_V1_GMN_DEVELOPMENT.json'))
          p=json.load(open('output/DENSITY_SYNC_STRATIFIED_CORE_V1_PRELABEL.json'))
          assert r['verdict'] in {
              'PASS_DENSITY_SYNC_STRATIFIED_CORE_V1_GMN_DEVELOPMENT',
              'FAIL_DENSITY_SYNC_STRATIFIED_CORE_V1_GMN_DEVELOPMENT'
          }
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_DEVELOPMENT_ONLY'
          assert r['events_by_year']=={'2022':315024,'2023':423658}
          assert p['events_by_year']=={'2022':315024,'2023':423658}
          assert r['parent_candidate_count']==2094
          assert p['parent_candidate_count']==2094
          assert r['k_year']==5
          assert r['sole_successor_change']=='balanced_annual_5_plus_5_stratified_core_before_unchanged_density_synchronous_extraction'
          assert r['blind_exclusion']==[20.0,55.0]
          assert p['blind_exclusion']==[20.0,55.0]
          for x in (r,p):
              for k in ('target_information_access','target_region_events_accessed','sonotaco_2013_2014_access','efn_access','asfn_access','amos_access','maarsy_scientific_access','dms_scientific_access'):
                  assert x[k] is False, (k,x[k])
          print(json.dumps({
              'verdict':r['verdict'],
              'mechanism_active':r['mechanism_active'],
              'strict_100':r['strict_recovered_at_100_improvement_some_year'],
              'parent_candidate_count':r['parent_candidate_count'],
              'successor_candidate_count':r['successor_candidate_count'],
              'parent':{y:{k:v for k,v in m.items() if k!='first_rank_by_label'} for y,m in r['parent_metrics'].items()},
              'successor':{y:{k:v for k,v in m.items() if k!='first_rank_by_label'} for y,m in r['successor_metrics'].items()},
              'annual_gates':r['annual_gates'],
          },indent=2,sort_keys=True))
          PY

      - name: Preserve binding provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum \
            orbittrace_density_sync_stratified_core_v1/PROTOCOL.md \
            orbittrace_density_sync_stratified_core_v1/stratified_core.py \
            orbittrace_density_sync_stratified_core_v1/run_development.py \
            orbittrace_density_sync_stratified_core_v1/EXECUTION_FREEZE.json \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            output/DENSITY_SYNC_STRATIFIED_CORE_V1_PRELABEL.json \
            output/DENSITY_SYNC_STRATIFIED_CORE_V1_GMN_DEVELOPMENT.json \
            > output/source_output_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-density-sync-stratified-core-v1-gmn-development
          path: output
          if-no-files-found: error
          retention-days: 90
