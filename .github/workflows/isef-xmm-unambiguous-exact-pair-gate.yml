name: ISEF XMM unambiguous exact pair gate
on:
  push:
    paths:
      - 'isef/xmm_unambiguous_exact_pair_gate.py'
      - '.github/workflows/isef-xmm-unambiguous-exact-pair-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8'
      - run: timeout 420s python isef/xmm_unambiguous_exact_pair_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-xmm-unambiguous-exact-pair-gate
          path: results/xmm_unambiguous_exact_pair_gate.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY' >/tmp/r.md
          import json
          from pathlib import Path
          print('## XMM unambiguous exact-input gate')
          p=Path('results/xmm_unambiguous_exact_pair_gate.json')
          if p.exists():
            d=json.loads(p.read_text()); d.pop('pairs',None)
            print('```json\n'+json.dumps(d,indent=2,sort_keys=True)[:50000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
