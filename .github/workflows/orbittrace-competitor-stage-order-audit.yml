name: OrbitTrace competitor stage-order source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-pooled-year-centroid-v8
    paths:
      - 'orbittrace_literature_matched_v8/audit_competitor_stage_order.py'
      - '.github/workflows/orbittrace-competitor-stage-order-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v8-literature-matched-sonotaco
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve exact frozen comparator sources without data access
        run: |
          set -euo pipefail
          mkdir -p orbittrace_literature_comparison/hdbscan_catalogue_runner_parts
          mkdir -p orbittrace_literature_comparison/sugar_uncertainty_core_parts
          mkdir -p orbittrace_literature_comparison/sugar_uncertainty_2025_runner_parts

          git fetch --no-tags --depth=1 origin 15e63a8acf6303a4bf62e119c3dc8a121a488d1c
          for i in 00 01 02 03 04; do
            git show 15e63a8acf6303a4bf62e119c3dc8a121a488d1c:orbittrace_literature_comparison/hdbscan_catalogue_runner_parts/part${i}.b64 \
              > orbittrace_literature_comparison/hdbscan_catalogue_runner_parts/part${i}.b64
          done

          git fetch --no-tags --depth=1 origin 6594cc992841cf8d37572f9877c35580009095bd
          for i in 00 01 02; do
            git show 6594cc992841cf8d37572f9877c35580009095bd:orbittrace_literature_comparison/sugar_uncertainty_core_parts/part${i}.b64 \
              > orbittrace_literature_comparison/sugar_uncertainty_core_parts/part${i}.b64
          done
          for i in 00 01 02 03; do
            git show 6594cc992841cf8d37572f9877c35580009095bd:orbittrace_literature_comparison/sugar_uncertainty_2025_runner_parts/part${i}.b64 \
              > orbittrace_literature_comparison/sugar_uncertainty_2025_runner_parts/part${i}.b64
          done
      - name: Run source-only audit
        run: |
          set -euo pipefail
          python -m py_compile orbittrace_literature_matched_v8/audit_competitor_stage_order.py
          python orbittrace_literature_matched_v8/audit_competitor_stage_order.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output_stage_order/competitor_stage_order_audit.json').read_text())
          assert r['verdict']=='PASS_SOURCE_ONLY_COMPETITOR_STAGE_ORDER_AUDIT'
          assert r['data_accessed'] is False
          assert r['orbittrace_target_accessed'] is False
          assert r['excluded_interval_contents_accessed'] is False
          print('PASS_COMPETITOR_STAGE_ORDER_SOURCE_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-competitor-stage-order-source-audit
          path: output_stage_order
          if-no-files-found: error
          retention-days: 90
