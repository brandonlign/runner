name: OrbitTrace component centroid source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-family-centroid-source-audit
    paths:
      - 'orbittrace_family_centroid_source_audit/RUN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out frozen source-audit parent
        uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-family-centroid-source-audit

      - name: Enforce immutable source-only audit
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_family_centroid_source_audit/audit_component_centroid.py)" = "22745a4f47fd3ad0e308287b1449646b13ca089d"
          test "$(python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          root=Path('orbittrace_fixed4_support_wrapper_development/source_parts')
          encoded=''.join(''.join(p.read_text(encoding='ascii').split()) for p in sorted(root.glob('part*.b64')))
          print(hashlib.sha256(gzip.decompress(base64.b64decode(encoded,validate=True))).hexdigest())
          PY
          )" = "fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62"
          python -m py_compile orbittrace_family_centroid_source_audit/audit_component_centroid.py

      - name: Audit component centroid construction only
        run: |
          set -euo pipefail
          python orbittrace_family_centroid_source_audit/audit_component_centroid.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/component_centroid_source_audit.json').read_text())
          assert r['verdict']=='PASS_COMPONENT_CENTROID_SOURCE_AUDIT'
          assert r['support_source_sha256']=='fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62'
          assert r['catalogue_access'] is False
          assert r['scientific_value_access'] is False
          assert r['target_information_access'] is False
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/audit_commit.txt
          sha256sum orbittrace_family_centroid_source_audit/audit_component_centroid.py > output/audit_source_sha256.txt

      - name: Upload source-audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-component-centroid-source-audit
          path: output
          if-no-files-found: error
          retention-days: 90
