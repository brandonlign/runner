name: OrbitTrace sparse floor-4 density-sync v1

on:
  push:
    branches:
      - agent/orbittrace-sparse-floor4-density-sync-v1
    paths:
      - 'orbittrace_sparse_floor4_density_sync_v1/ACTIVATE.md'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  binding-gmn:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-sparse-floor4-density-sync-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact runtime and verify frozen experiment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'charset-normalizer==3.5.0'
          mkdir -p input/v3 input/v8 input/ranker input/winner output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          cp frozen-v8/orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py input/v3/wavelet_episode_comparator.py
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          test "$(git hash-object orbittrace_sparse_floor4_density_sync_v1/PROTOCOL.md)" = '7ceebda2ad7f11edc602423ff49034d33fa3dbb9'
          test "$(git hash-object orbittrace_sparse_floor4_density_sync_v1/run_development.py)" = '18346f0f821b5b08f0160b302246d104d89c4bda'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          python -m py_compile orbittrace_sparse_floor4_density_sync_v1/run_development.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/winner
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852836840
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Verify exact frozen evidence
        run: |
          set -euo pipefail
          test "$(sha256sum input/winner/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json | cut -d' ' -f1)" = 'efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          test "$(sha256sum input/winner/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = 'ca6aeed2b82739003ea5d39b59e869df876de2962164344a938fe4935ea38711'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
      - name: Run one binding sparse floor-4 endpoint
        env:
          PYTHONPATH: orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:input/ranker:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:.
        run: |
          set -euo pipefail
          python -u -m orbittrace_sparse_floor4_density_sync_v1.run_development \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --winner-prelabel-json input/winner/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --winner-result-json input/winner/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            --output output
      - name: Enforce fixed +5 gate and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('output/SPARSE_FLOOR4_DENSITY_SYNC_V1_PRELABEL.json'))
          r=json.load(open('output/SPARSE_FLOOR4_DENSITY_SYNC_V1_GMN_DEVELOPMENT.json'))
          assert p['sole_change']==r['sole_change']=='hdbscan_min_cluster_size_10_to_4'
          assert p['hdbscan']['min_cluster_size']==r['hdbscan']['min_cluster_size']==4
          assert p['hdbscan']['min_samples']==r['hdbscan']['min_samples']==10
          assert p['known_shower_labels_indexed'] is False
          assert p['events_total']==738682
          assert r['baseline_total_recovered_at_100']==179
          assert r['required_total_recovered_at_100']==184 and r['required_gain']==5
          assert r['verdict'] in {'PASS_SPARSE_FLOOR4_DENSITY_SYNC_V1_GMN_DEVELOPMENT','FAIL_SPARSE_FLOOR4_DENSITY_SYNC_V1_GMN_DEVELOPMENT'}
          for x in (p,r):
              for k in ['target_information_access','target_region_events_accessed','sonotaco_2013_2014_access','asfn_access','efn_access','amos_access','maarsy_scientific_access','dms_scientific_access']:
                  assert x[k] is False, (k,x[k])
          if r['verdict'].startswith('PASS_'):
              assert r['successor_total_recovered_at_100'] >= 184
              assert all(r['structural_gates'].values())
              assert all(all(g.values()) for g in r['annual_gates'].values())
          print(r['verdict'], 'total=',r['successor_total_recovered_at_100'], 'gain=',r['recovered_at_100_gain'], 'sparse=',r['families_size_4_to_9'])
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum orbittrace_sparse_floor4_density_sync_v1/PROTOCOL.md orbittrace_sparse_floor4_density_sync_v1/run_development.py input/winner/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json output/SPARSE_FLOOR4_DENSITY_SYNC_V1_PRELABEL.json output/SPARSE_FLOOR4_DENSITY_SYNC_V1_GMN_DEVELOPMENT.json > output/provenance_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-sparse-floor4-density-sync-v1-gmn
          path: output
          if-no-files-found: error
          retention-days: 90
