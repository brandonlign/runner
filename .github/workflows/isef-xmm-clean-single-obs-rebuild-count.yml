name: ISEF XMM clean single-observation rebuild R1
on:
  push:
    paths:
      - 'isef/xmm_clean_single_obs_rebuild_count.py'
      - '.github/workflows/isef-xmm-clean-single-obs-rebuild-count.yml'
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install astropy numpy
      - run: python isef/xmm_clean_single_obs_rebuild_count.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-clean-single-obs-rebuild-count
          path: results/xmm_clean_single_obs_rebuild_count.json
