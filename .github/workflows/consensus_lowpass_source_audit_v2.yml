name: Consensus-lowpass recurrence source audit v2

on:
  pull_request:
    branches:
      - agent/majority-conditioned-recurrence-source-audit
    paths:
      - .github/workflows/consensus_lowpass_source_audit_v2.yml
      - consensus_lowpass_recurrence_stage0/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consensus-lowpass-recurrence-source-audit-v2
  cancel-in-progress: true

jobs:
  no-score-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consensus-lowpass-recurrence-source-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct exact majority-conditioned parent
        run: |
          set -euo pipefail
          mkdir -p /tmp/source output
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          parts = sorted(Path('worst_family_recurrence_stage0/source_parts').glob('part*.b64'))
          expected = ['part00.b64', 'part01.b64', 'part02.b64', 'part03.b64']
          if [part.name for part in parts] != expected:
              raise RuntimeError(f'unexpected parent parts: {[part.name for part in parts]}')
          encoded = ''.join(''.join(part.read_text().split()) for part in parts)
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          if digest != '4384dd0352174e57ca1f93a2c3bd070002f026cef8acace035ba4ec05e577dac':
              raise RuntimeError(f'worst-family source mismatch: {digest}')
          Path('/tmp/source/worst_family.py').write_bytes(source)
          PY
          python majority_conditioned_recurrence_stage0/derive_candidate.py \
            /tmp/source/worst_family.py \
            /tmp/source/majority_conditioned.py
          python -m py_compile /tmp/source/majority_conditioned.py
          echo '3d60e3622d7ec406bb03cd4ab43faec84be1eff4d0dd70afa6ed79b8fd777281  /tmp/source/majority_conditioned.py' | sha256sum -c -
      - name: Run exact AST-based candidate audit
        run: |
          set -euo pipefail
          python -m py_compile consensus_lowpass_recurrence_stage0/audit_candidate.py
          python consensus_lowpass_recurrence_stage0/audit_candidate.py \
            --parts consensus_lowpass_recurrence_stage0/source_parts \
            --majority-source /tmp/source/majority_conditioned.py \
            --output output
          python -m py_compile output/run_consensus_lowpass.py
          cat output/RESULT.md
      - name: Record provenance
        run: |
          sha256sum \
            consensus_lowpass_recurrence_stage0/SOURCE_AUDIT_PROTOCOL.md \
            consensus_lowpass_recurrence_stage0/TRANSFORMATION.md \
            consensus_lowpass_recurrence_stage0/audit_candidate.py \
            consensus_lowpass_recurrence_stage0/source_parts/*.b64 \
            majority_conditioned_recurrence_stage0/derive_candidate.py \
            /tmp/source/worst_family.py \
            /tmp/source/majority_conditioned.py \
            output/run_consensus_lowpass.py \
            > output/source_sha256.txt
          python --version > output/python_version.txt
      - name: Upload exact source audit
        uses: actions/upload-artifact@v4
        with:
          name: consensus-lowpass-recurrence-source-audit-v2
          path: output
          if-no-files-found: error
          retention-days: 90
