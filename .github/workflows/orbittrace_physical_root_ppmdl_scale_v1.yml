name: OrbitTrace physical-root planted-partition MDL scale v1

on:
  push:
    branches:
      - agent/orbittrace-physical-root-ppmdl-scale-v1
    paths:
      - '.github/workflows/orbittrace_physical_root_ppmdl_scale_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  GRAPH_TOOL_IMAGE: 'tiagopeixoto/graph-tool@sha256:e12ed85b23e1068eec883bbffeafc7cc36ce461f88ee26e0b3ef20bfcd5508f7'

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact host runtime and audit frozen sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/v3 input/v8 input/ranker output

          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'

          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_physical_root_ppmdl_scale_v1/PROTOCOL.md)" = '4c44850699f29a173ba5aeead90884e4794a1ba5'
          test "$(git hash-object orbittrace_physical_root_ppmdl_scale_v1/ENGINEERING_REPAIR_1.md)" = '43f05490ae1be7d96dc5db0e3b6720814ff83454'
          test "$(git hash-object orbittrace_physical_root_ppmdl_scale_v1/pp_partition.py)" = '9975dcfcac47d22d4f4288f0135b2d155adcc22e'
          test "$(git hash-object orbittrace_physical_root_ppmdl_scale_v1/run_diagnostic.py)" = 'afd57080d1ee79f9d7bd39ec3b85b3472e69a133'
          python -m py_compile orbittrace_physical_root_ppmdl_scale_v1/pp_partition.py orbittrace_physical_root_ppmdl_scale_v1/run_diagnostic.py

      - name: Freeze exact graph-tool image bytes before data
        run: |
          set -euo pipefail
          docker pull "$GRAPH_TOOL_IMAGE"
          got="$(docker image inspect "$GRAPH_TOOL_IMAGE" --format '{{index .RepoDigests 0}}')"
          test "$got" = 'tiagopeixoto/graph-tool@sha256:e12ed85b23e1068eec883bbffeafc7cc36ce461f88ee26e0b3ef20bfcd5508f7'
          printf '%s\n' "$got" | tee output/graph_tool_image_digest.txt
          docker run --rm -i "$GRAPH_TOOL_IMAGE" python3 - <<'PY' | tee output/graph_tool_version.txt
          import graph_tool
          v=str(graph_tool.__version__)
          print(v)
          assert v.startswith('2.99dev (commit c049a734'), v
          PY
          grep -q '^2.99dev (commit c049a734' output/graph_tool_version.txt

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify frozen GMN runtime utility
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify frozen GMN support artifact
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Run first technically valid zero-label planted-partition diagnostic
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_physical_root_ppmdl_scale_v1/run_diagnostic.py \
            --base-runner orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --partition-script orbittrace_physical_root_ppmdl_scale_v1/pp_partition.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce frozen diagnostic contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('output/PHYSICAL_ROOT_PPMDL_SCALE_V1.json'))
          assert r['schema']=='ORBITTRACE_PHYSICAL_ROOT_PPMDL_SCALE_V1'
          assert r['scientific_role']=='ZERO_LABEL_STRUCTURAL_DIAGNOSTIC_ONLY'
          assert r['interpretation'] in {'SUPPORTS_PHYSICAL_ROOT_PPMDL_CROSS_SCALE_COHERENCE','REFUTES_PHYSICAL_ROOT_PPMDL_CROSS_SCALE_COHERENCE'}
          c=r['configuration']
          assert c['physical_embedding']=='exact_1284_5deg_solar_4deg_radiant_10pct_logspeed'
          assert c['graph']=='exact_simple_undirected_radius_1_physical_graph'
          assert c['model']=='graph_tool_release_2_98_image_digest_PPBlockState_minimize_blockmodel_dl_defaults'
          assert c['graph_tool_release_image_digest']=='sha256:e12ed85b23e1068eec883bbffeafc7cc36ce461f88ee26e0b3ef20bfcd5508f7'
          assert c['graph_tool_reported_build_prefix']=='2.99dev (commit c049a734'
          assert c['engineering_repair']=='repair1_release_2_98_image_reports_2_99dev_c049a734'
          assert c['degree_corrected'] is True and c['min_candidate_support']==4
          assert len(r['fits'])==8 and len(r['nested_pairs'])==4
          parts=sorted(Path('output/ppmdl_partitions').glob('partition_d*_b*.json'))
          assert len(parts)==8
          for p in parts:
            d=json.load(open(p))
            assert d['graph_tool_release_image_digest']=='sha256:e12ed85b23e1068eec883bbffeafc7cc36ce461f88ee26e0b3ef20bfcd5508f7'
            assert str(d['graph_tool_version']).startswith('2.99dev (commit c049a734')
            assert d['truth_access'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['shower_truth_used'] is False and r['sonotaco_2013_2014_access'] is False
          assert r['asfn_event_level_access'] is False and r['efn_event_level_access'] is False
          assert r['amos_scientific_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['method_parameter_selection_from_result'] is False
          print(r['interpretation'])
          print(json.dumps(r['summary'],indent=2,sort_keys=True))
          PY

      - name: Preserve exact provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_physical_root_ppmdl_scale_v1/PROTOCOL.md \
            orbittrace_physical_root_ppmdl_scale_v1/ENGINEERING_REPAIR_1.md \
            orbittrace_physical_root_ppmdl_scale_v1/pp_partition.py \
            orbittrace_physical_root_ppmdl_scale_v1/run_diagnostic.py \
            orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            output/PHYSICAL_ROOT_PPMDL_SCALE_V1.json \
            > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          docker image inspect "$GRAPH_TOOL_IMAGE" --format '{{index .RepoDigests 0}}' > output/graph_tool_image_digest_final.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-physical-root-ppmdl-scale-v1
          path: output
          if-no-files-found: error
          retention-days: 90
