name: OrbitTrace recurrent-EOM AMOS 2023-2024 pre-data audit v1

on:
  push:
    branches:
      - agent/orbittrace-recurrent-eom-amos-2023-2024-predata-v1
    paths:
      - 'orbittrace_recurrent_eom_amos_2023_2024_external_v1/**'
      - '.github/workflows/orbittrace_recurrent_eom_amos_2023_2024_predata_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  zero-data-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact recurrent-EOM engineering runtime
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'

      - name: Verify pre-data scientific and adapter pins
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_eom_amos_2023_2024_external_v1/PROTOCOL.md)" = '6cc45ef9e0b7b7cf1bf71f22361b64d537977f4f'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_recurrent_eom_amos_2023_2024_external_v1/adapter/transform.py)" = '612ad23af6e11ac2155282258e3d1429fbe00d67'
          test "$(git hash-object orbittrace_recurrent_eom_amos_2023_2024_external_v1/adapter/adapt.py)" = '9a0fb05f94d6a28cd95f97d864e76400056273b0'
          test "$(git hash-object orbittrace_recurrent_eom_amos_2023_2024_external_v1/selftest.py)" = 'd0ff80a520bf1861f935dd83afaa313fe56a9986'
          python -m py_compile \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_recurrent_eom_amos_2023_2024_external_v1/adapter/transform.py \
            orbittrace_recurrent_eom_amos_2023_2024_external_v1/adapter/adapt.py \
            orbittrace_recurrent_eom_amos_2023_2024_external_v1/selftest.py
          echo PASS_RECURRENT_EOM_AMOS_PRE_DATA_SOURCE_PINS

      - name: Prove exact zero-data AMOS-to-GEO6 mapping and blind fail-closed behavior
        env:
          PYTHONPATH: .:orbittrace_recurrent_eom_hdbscan_v1:orbittrace_recurrent_eom_amos_2023_2024_external_v1/adapter
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_eom_amos_2023_2024_external_v1/selftest.py
          python - <<'PY'
          import json
          p='orbittrace_recurrent_eom_amos_2023_2024_external_v1/output/PRE_DATA_MAPPING_AUDIT.json'
          r=json.load(open(p))
          assert r['verdict']=='PASS_RECURRENT_EOM_AMOS_2023_2024_PRE_DATA_MAPPING_AUDIT'
          assert r['synthetic_only'] is True
          assert r['amos_event_rows_accessed'] is False
          assert r['amos_labels_accessed'] is False
          assert r['amos_orbit_elements_accessed'] is False
          assert r['geo6_exact_array_identity'] is True
          assert r['protected_geometry_fail_closed'] is True
          assert r['years_frozen']==[2023,2024]
          assert r['blind_exclusion']==[20.0,55.0]
          for k in ('target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access','orbittrace_target_access'):
              assert r[k] is False
          print(r['verdict'])
          PY

      - name: Preserve zero-data provenance
        if: always()
        run: |
          set +e
          mkdir -p orbittrace_recurrent_eom_amos_2023_2024_external_v1/output
          sha256sum \
            orbittrace_recurrent_eom_amos_2023_2024_external_v1/PROTOCOL.md \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_recurrent_eom_amos_2023_2024_external_v1/adapter/transform.py \
            orbittrace_recurrent_eom_amos_2023_2024_external_v1/adapter/adapt.py \
            orbittrace_recurrent_eom_amos_2023_2024_external_v1/selftest.py \
            orbittrace_recurrent_eom_amos_2023_2024_external_v1/output/PRE_DATA_MAPPING_AUDIT.json \
            > orbittrace_recurrent_eom_amos_2023_2024_external_v1/output/source_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > orbittrace_recurrent_eom_amos_2023_2024_external_v1/output/execution_commit.txt
          python --version > orbittrace_recurrent_eom_amos_2023_2024_external_v1/output/python_version.txt
          python -m pip freeze > orbittrace_recurrent_eom_amos_2023_2024_external_v1/output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-amos-2023-2024-predata-v1
          path: orbittrace_recurrent_eom_amos_2023_2024_external_v1/output
          if-no-files-found: error
          retention-days: 90
