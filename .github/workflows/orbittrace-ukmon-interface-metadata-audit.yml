name: OrbitTrace UKMON documentation-only interface audit

on:
  pull_request:
    branches:
      - agent/orbittrace-ukmon-interface-metadata-audit
    paths:
      - 'orbittrace_ukmon_interface_metadata_audit/RUN.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out frozen metadata-audit parent
        uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-ukmon-interface-metadata-audit
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Fetch exact freshness artifact and public data dictionary only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/freshness output
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9007677623/zip" -o input/freshness.zip
          echo "fb2f8122066fa63e7128610256ea91a692de089c7a1f4539a560fd1b4bd86617  input/freshness.zip" | sha256sum -c -
          unzip -q input/freshness.zip -d input/freshness
          curl -L --fail --retry 3 "https://archive.ukmeteors.co.uk/browse/datadictionary.xlsx" -o input/datadictionary.xlsx
          test -s input/datadictionary.xlsx
      - name: Run documentation-only field audit
        run: |
          set -euo pipefail
          python orbittrace_ukmon_interface_metadata_audit/audit_dictionary.py \
            --dictionary input/datadictionary.xlsx \
            --freshness-json input/freshness/ukmon_2024_2025_repo_freshness_audit.json \
            --output output
      - name: Enforce no-meteor boundary
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/ukmon_documentation_interface_audit.json')
          if p.exists():
              r=json.loads(p.read_text())
              assert r['meteor_api_contacted'] is False
              assert r['meteor_record_access'] is False
              assert r['reserved_2024_2025_access'] is False
              assert r['target_information_access'] is False
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/audit_commit.txt
          sha256sum orbittrace_ukmon_interface_metadata_audit/audit_dictionary.py input/datadictionary.xlsx > output/source_and_dictionary_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
      - name: Upload metadata audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-ukmon-documentation-interface-audit
          path: output
          if-no-files-found: error
          retention-days: 90
