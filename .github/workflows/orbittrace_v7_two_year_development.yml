name: OrbitTrace v7 two-year sparse-tail development

on:
  pull_request:
    branches:
      - agent/orbittrace-v7-sparse-tail-base
    paths:
      - orbittrace_v3_sparse_tail_v7/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-v7-two-year-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-sparse-tail-v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve exact frozen benchmark implementations
        run: |
          set -euo pipefail
          git fetch --no-tags origin 99957b021a4c816d423f0bb6a5780fb9e7a54bfe --depth=1
          git fetch --no-tags origin 9ccefb50063f7f9e760beb5d8a5e362e0e2d2279 --depth=1
          rm -rf /tmp/frozen2025 /tmp/w2023
          git worktree add --detach /tmp/frozen2025 99957b021a4c816d423f0bb6a5780fb9e7a54bfe
          git worktree add --detach /tmp/w2023 9ccefb50063f7f9e760beb5d8a5e362e0e2d2279
          test "$(git -C /tmp/frozen2025 rev-parse HEAD)" = "99957b021a4c816d423f0bb6a5780fb9e7a54bfe"
          test "$(git -C /tmp/w2023 rev-parse HEAD)" = "9ccefb50063f7f9e760beb5d8a5e362e0e2d2279"
          test "$(git -C /tmp/frozen2025 hash-object orbittrace_literature_comparison/wavelet_episode_comparator.py)" = "493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8"
          test "$(git -C /tmp/w2023 hash-object orbittrace_literature_comparison/build_wavelet_2023_runner.py)" = "169c4d03ffcb179951197a0f93c4bc5d63354748"

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/frozen2025/real_shower_meta_stage0/requirements.txt

      - name: Audit v7 source before catalogue access
        env:
          PYTHONPATH: ${{ github.workspace }}/orbittrace_multi_anchor_energy_v3:${{ github.workspace }}/orbittrace_v3_sparse_tail_v7
        run: |
          set -euo pipefail
          mkdir -p input/repaired output/2025 output/2023
          python -m py_compile \
            orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py \
            orbittrace_v3_sparse_tail_v7/v3_sparse_tail_v7.py \
            orbittrace_v3_sparse_tail_v7/build_v7_runner.py \
            orbittrace_v3_sparse_tail_v7/evaluate_year.py
          python - <<'PY'
          import multi_anchor_energy_v3 as v3
          import v3_sparse_tail_v7 as v7
          assert all(v3.self_test().values())
          assert all(v7.self_test().values())
          assert v7.MARGIN == 0.25
          assert v7.PRIMARY == 'orbittrace_multi_anchor_wavelet_energy_v3'
          assert v7.SPARSE == 'orbittrace_fixed4'
          assert v7.REPORTING_ALPHA == 0.05
          print('PASS_V7_SOURCE_AUDIT')
          PY
          sha256sum \
            orbittrace_v3_sparse_tail_v7/PROTOCOL.md \
            orbittrace_v3_sparse_tail_v7/v3_sparse_tail_v7.py \
            orbittrace_v3_sparse_tail_v7/build_v7_runner.py \
            orbittrace_v3_sparse_tail_v7/evaluate_year.py \
            orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py \
            > output/v7_source_sha256.txt
          git rev-parse HEAD > output/v7_commit.txt
          git diff --exit-code
          git diff --cached --exit-code

      - name: Build exact 2025 v7 runner
        env:
          PYTHONPATH: /tmp/frozen2025/orbittrace_literature_comparison:${{ github.workspace }}/orbittrace_multi_anchor_energy_v3:${{ github.workspace }}/orbittrace_v3_sparse_tail_v7
        run: |
          set -euo pipefail
          python /tmp/frozen2025/orbittrace_literature_comparison/build_wavelet_episode_runner.py \
            --base /tmp/frozen2025/orbittrace_literature_comparison/run_sonotaco_2025_literature_comparison.py \
            --output /tmp/run_2025_wavelet.py
          python orbittrace_multi_anchor_energy_v3/build_multi_anchor_runner.py \
            --base /tmp/run_2025_wavelet.py --output /tmp/run_2025_v3.py
          python orbittrace_v3_sparse_tail_v7/build_v7_runner.py \
            --base /tmp/run_2025_v3.py --output /tmp/run_2025_v7.py
          python -m py_compile /tmp/run_2025_v7.py
          sha256sum /tmp/run_2025_wavelet.py /tmp/run_2025_v3.py /tmp/run_2025_v7.py > output/2025/runner_sha256.txt

      - name: Build exact 2023 v7 runner
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: /tmp:/tmp/w2023/orbittrace_literature_comparison:${{ github.workspace }}/orbittrace_multi_anchor_energy_v3:${{ github.workspace }}/orbittrace_v3_sparse_tail_v7
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/orbittrace_literature_comparison/literature_comparators.py?ref=eddcf9bb432b92e4f9707d0b2ce58ca21b4faf34" --jq .content | tr -d '\n' | base64 -d > /tmp/literature_comparators.py
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  /tmp/literature_comparators.py' | sha256sum -c -
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          root=Path('/tmp/w2023/orbittrace_literature_freeze/sonotaco_2023_runner_parts')
          names=('part00.b64','part01_sub00.b64','part01_sub01.b64','part01_sub02.b64','part01_sub03.b64','part02.b64')
          enc=''.join(''.join((root/n).read_text().split()) for n in names)
          src=gzip.decompress(base64.b64decode(enc,validate=True)); digest=hashlib.sha256(src).hexdigest()
          assert digest=='582c2bc4c9d947d3d0b86aaf201e30b57eb85d24fd587dbbcd49b483065fc747',digest
          Path('/tmp/run_2023_base.py').write_bytes(src); compile(src,'run_2023_base.py','exec')
          print('PASS_EXACT_2023_BASE_RUNNER',digest)
          PY
          python /tmp/w2023/orbittrace_literature_comparison/build_wavelet_2023_runner.py \
            --base /tmp/run_2023_base.py --output /tmp/run_2023_wavelet.py
          python orbittrace_fpr_budgeted_v4/build_v3_2023_runner.py \
            --base /tmp/run_2023_wavelet.py --output /tmp/run_2023_v3.py
          python orbittrace_v3_sparse_tail_v7/build_v7_runner.py \
            --base /tmp/run_2023_v3.py --output /tmp/run_2023_v7.py
          python -m py_compile /tmp/run_2023_v7.py
          sha256sum /tmp/run_2023_wavelet.py /tmp/run_2023_v3.py /tmp/run_2023_v7.py > output/2023/runner_sha256.txt

      - name: Retrieve exact common and 2023 transport inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30855193522 --repo "$GITHUB_REPOSITORY" --name real-shower-meta-data-audit --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -
          gh run download 30920687116 --repo "$GITHUB_REPOSITORY" --name sonotaco-2023-confirmation-source-repair-v2 --dir input/repaired
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/repaired/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -

      - name: Download exact exposed development archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output input/025a.zip https://www.astro.sk/iaumdcDB/public/data/SNMv3/025a.zip
          curl --fail --location --retry 3 --output input/023a.zip https://www.astro.sk/iaumdcDB/public/data/SNMv3/023a.zip
          echo 'f4eb716a4b900658fcc658a633d918eca28946f59da75935f1fd5f6bc539bf52  input/025a.zip' | sha256sum -c -
          echo '9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430  input/023a.zip' | sha256sum -c -

      - name: Execute v7 on 2025
        env:
          PYTHONPATH: /tmp/frozen2025/orbittrace_literature_comparison:${{ github.workspace }}/orbittrace_multi_anchor_energy_v3:${{ github.workspace }}/orbittrace_v3_sparse_tail_v7
        run: |
          set -euo pipefail
          python /tmp/run_2025_v7.py \
            --archive input/025a.zip --audit input/audit.json \
            --baseline-payload /tmp/frozen2025/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts /tmp/frozen2025/mondrian_clique_development/source_parts_v2 \
            --adapter-parts /tmp/frozen2025/sonotaco_mondrian_development/source_parts \
            --candidate-payload /tmp/frozen2025/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --workers 4 --output output/2025
          python orbittrace_v3_sparse_tail_v7/evaluate_year.py \
            --input output/2025/sonotaco_2025_literature_comparison.json --year 2025 --output output/2025
          cat output/2025/V7_2025_DEVELOPMENT.md

      - name: Execute v7 on 2023
        env:
          PYTHONPATH: /tmp:/tmp/w2023/orbittrace_literature_comparison:${{ github.workspace }}/orbittrace_multi_anchor_energy_v3:${{ github.workspace }}/orbittrace_v3_sparse_tail_v7
        run: |
          set -euo pipefail
          python /tmp/run_2023_v7.py \
            --archive input/023a.zip --audit input/audit.json \
            --baseline-payload /tmp/w2023/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts /tmp/w2023/mondrian_clique_development/source_parts_v2 \
            --confirmation-source input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            --freeze /tmp/w2023/orbittrace_literature_freeze/SONOTACO_2025_WAVELET_EPISODE_FREEZE.json \
            --workers 4 --output output/2023
          python orbittrace_v3_sparse_tail_v7/evaluate_year.py \
            --input output/2023/sonotaco_2023_literature_transfer.json --year 2023 --output output/2023
          cat output/2023/V7_2023_DEVELOPMENT.md

      - name: Enforce complete two-year development pass
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r25=json.loads(Path('output/2025/V7_2025_DEVELOPMENT.json').read_text())
          r23=json.loads(Path('output/2023/V7_2023_DEVELOPMENT.json').read_text())
          assert r25['verdict']=='PASS_V7_2025_DEVELOPMENT',r25
          assert r23['verdict']=='PASS_V7_2023_DEVELOPMENT',r23
          Path('output/V7_TWO_YEAR_DECISION.json').write_text(json.dumps({'verdict':'PASS_V7_TWO_YEAR_DEVELOPMENT','years':{'2025':r25,'2023':r23}},indent=2)+'\n')
          print('PASS_V7_TWO_YEAR_DEVELOPMENT')
          PY

      - name: Record environment and immutable inputs
        if: always()
        run: |
          set -euo pipefail
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum input/audit.json input/025a.zip input/023a.zip input/repaired/* >> output/v7_source_sha256.txt 2>/dev/null || true

      - name: Upload v7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v7-two-year-development
          path: output
          if-no-files-found: error
          retention-days: 90
