name: OrbitTrace v8 Sugar exact-row benchmark

on:
  pull_request:
    branches: [agent/orbittrace-pooled-year-centroid-v8]
    paths:
      - 'orbittrace_literature_matched_v8/SUGAR_EXACT_ROW_CONTINUATION.md'
      - 'orbittrace_literature_matched_v8/run_sugar_exact_row.py'
      - '.github/workflows/orbittrace-v8-sugar-exact-row.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: orbittrace_wavelet_catalogue_v3:orbittrace_sparse_support_multiplicity_v5:input/v3:.

jobs:
  sugar-exact-row:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v8-literature-matched-sonotaco

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen v8 dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Enforce Sugar-only preregistration and exact v8 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v3 input/parser input/mapping input/archives input/sugar/{2023,2025} output_sugar_exact
          python -m py_compile orbittrace_literature_matched_v8/run_sugar_exact_row.py
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"
          test "$(git hash-object orbittrace_pooled_year_centroid_v8/run_development.py)" = "f248df78e1258b132b41aecca6a985a5eb782654"
          test "$(git hash-object orbittrace_label_free_sparse_support_v6/run_development.py)" = "7995fc6b75d1fd51eb4b304ace39db28a5a1e876"
          python - <<'PY'
          from pathlib import Path
          p=Path('orbittrace_literature_matched_v8/SUGAR_EXACT_ROW_CONTINUATION.md').read_text()
          assert '31227235454' in p
          assert 'exact 128-event local episode' in p
          assert 'delta >= 0.10' in p
          assert 'No OrbitTrace target coordinate' in p
          print('PASS_SUGAR_EXACT_ROW_PREDATA_FREEZE')
          PY
          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"
          gh run download 30920687116 --repo "$GITHUB_REPOSITORY" --name sonotaco-2023-confirmation-source-repair-v2 --dir input/parser
          gh run download 30855193522 --repo "$GITHUB_REPOSITORY" --name real-shower-meta-data-audit --dir input/mapping
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/parser/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/mapping/audit.json' | sha256sum -c -
          rm -rf output

      - name: Download exact frozen Sugar assignments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 31076789635 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2023-sugar-uncertainty-transfer --dir input/sugar/2023
          gh run download 31075178517 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2025-sugar-uncertainty-catalogue --dir input/sugar/2025
          echo '2b9e86572f10af447071cb10c56f643c1ad8babfe0d9aa667994ba3639834389  input/sugar/2023/sugar_uncertainty_assignments.json.gz' | sha256sum -c -
          echo '77844d700bb14bb9952307fad13eb66cbc62e6a1555e5edd9c8aa0d26968b06e  input/sugar/2025/sugar_uncertainty_assignments.json.gz' | sha256sum -c -

      - name: Download exact already-exposed SonotaCo archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output input/archives/023a.zip https://www.astro.sk/iaumdcDB/public/data/SNMv3/023a.zip
          curl --fail --location --retry 3 --output input/archives/025a.zip https://www.astro.sk/iaumdcDB/public/data/SNMv3/025a.zip
          echo '9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430  input/archives/023a.zip' | sha256sum -c -
          echo 'f4eb716a4b900658fcc658a633d918eca28946f59da75935f1fd5f6bc539bf52  input/archives/025a.zip' | sha256sum -c -

      - name: Execute frozen v8 vs full Sugar on identical rows
        run: |
          set -euo pipefail
          python orbittrace_literature_matched_v8/run_sugar_exact_row.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --parser-2023 input/parser/run_sonotaco_2023_fixed4_confirmation.py \
            --parser-2025 orbittrace_literature_matched_v8/sonotaco_2025_native_adapter_wrapper.py \
            --mapping-audit input/mapping/audit.json \
            --archive-2023 input/archives/023a.zip \
            --archive-2025 input/archives/025a.zip \
            --sugar-2023 input/sugar/2023/sugar_uncertainty_assignments.json.gz \
            --sugar-2025 input/sugar/2025/sugar_uncertainty_assignments.json.gz \
            --output output_sugar_exact
          cat output_sugar_exact/V8_SUGAR_EXACT_ROW.md

      - name: Enforce result integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output_sugar_exact/v8_sugar_exact_row.json').read_text())
          assert r['verdict']=='PASS_V8_SUGAR_EXACT_ROW_PAIRWISE'
          assert r['configuration']['v8_source_commit']=='c9d6c44704013ba0c9430100e98a29a56b453304'
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['episode_size']==128
          assert r['configuration']['no_v8_parameter_change'] is True
          assert r['configuration']['labels_loaded_only_after_v8_ranking_frozen'] is True
          assert r['exact_event_rows']=={'2023':30414,'2025':23200}
          assert all(r['integrity_gates'].values())
          assert 'No OrbitTrace target information' in r['claim_boundary']
          print('ORBITTRACE_SUGAR_EXACT_ROW_RESULT_BEGIN')
          print(json.dumps(r,indent=2,sort_keys=True))
          print('ORBITTRACE_SUGAR_EXACT_ROW_RESULT_END')
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          mkdir -p output_sugar_exact
          git rev-parse HEAD > output_sugar_exact/benchmark_commit.txt
          sha256sum \
            orbittrace_literature_matched_v8/SUGAR_EXACT_ROW_CONTINUATION.md \
            orbittrace_literature_matched_v8/run_sugar_exact_row.py \
            orbittrace_literature_matched_v8/run_exact_row_benchmark.py \
            orbittrace_pooled_year_centroid_v8/run_development.py \
            input/sugar/2023/sugar_uncertainty_assignments.json.gz \
            input/sugar/2025/sugar_uncertainty_assignments.json.gz \
            input/archives/023a.zip input/archives/025a.zip \
            > output_sugar_exact/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output_sugar_exact/python_version.txt
          python -m pip freeze > output_sugar_exact/environment.txt

      - name: Upload Sugar exact-row evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v8-sugar-exact-row
          path: output_sugar_exact
          if-no-files-found: error
          retention-days: 90
