name: OrbitTrace local TopoModal trunk lazy equivalence audit

on:
  pull_request:
    branches: [agent/orbittrace-recurrent-local-topomodal-trunk-v1-lazy-audit]
    paths: ['orbittrace_recurrent_local_topomodal_trunk_v1/LAZY_AUDIT_ACTIVATE.md']

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 312b1b718ae105813de242355142a74e7d377d65
          path: sparse-src
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit frozen engineering sources and install exact runtime
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/PROTOCOL.md)" = 'de8d040a1f9d3b0825ce56532efd5950acefc689'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/build_prelabel.py)" = 'cd3fb15263fd4b2e38e4b413ece9b347b64816d5'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py)" = '32abfb3e68520cfdc83585a88731fa3982900cde'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/technical_lazy_local_trunk.py)" = '79cc2e51929fd60f8e17faec4c1b04c19e43010e'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/LAZY_EQUIVALENCE_AUDIT_PROTOCOL.md)" = '5c5cf2cae6c68397f01cf7092809f62a660ed961'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/audit_lazy_equivalence.py)" = '2953e13b8a8fc523901f2d51379ba7f09868c673'
          python -m py_compile orbittrace_recurrent_local_topomodal_trunk_v1/{export_geometry.py,build_prelabel.py,technical_lazy_local_trunk.py,audit_lazy_equivalence.py}
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/{v3,ranker,v8,parent} output/{geometry,audit}
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/parent
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 31852836840
      - name: Rebind immutable parent and label-free source inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json | cut -d' ' -f1)" = 'efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = 'ca6aeed2b82739003ea5d39b59e869df876de2962164344a938fe4935ea38711'
      - name: Export exact label-free target-excluded geometry
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:sparse-src
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json
      - name: Compare original and lazy implementations exactly
        env:
          PYTHONPATH: .:orbittrace_recurrent_local_topomodal_trunk_v1
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/audit_lazy_equivalence.py \
            --protocol orbittrace_recurrent_local_topomodal_trunk_v1/PROTOCOL.md \
            --frozen-builder orbittrace_recurrent_local_topomodal_trunk_v1/build_prelabel.py \
            --lazy-helper orbittrace_recurrent_local_topomodal_trunk_v1/technical_lazy_local_trunk.py \
            --geometry output/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json \
            --parent-prelabel input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --output output/audit/LOCAL_TRUNK_LAZY_EQUIVALENCE_AUDIT.json
          python - <<'PY'
          import json
          x=json.load(open('output/audit/LOCAL_TRUNK_LAZY_EQUIVALENCE_AUDIT.json'))
          assert x['verdict']=='PASS_LOCAL_TRUNK_LAZY_EQUIVALENCE_AUDIT'
          assert x['all_exact'] is True
          assert x['selection']['small_parent_count']==2027
          assert x['selection']['audited_unique_parent_count']==2033
          assert x['shower_truth_used'] is False and x['target_information_access'] is False and x['target_region_events_accessed'] is False and x['external_scientific_access'] is False
          print(json.dumps({'verdict':x['verdict'],'selection':x['selection']},indent=2,sort_keys=True))
          PY
          sha256sum output/audit/LOCAL_TRUNK_LAZY_EQUIVALENCE_AUDIT.json > output/audit/RESULT_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > output/audit/execution_commit.txt
          printf '%s\n' "$GITHUB_RUN_ID" > output/audit/execution_run_id.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-local-trunk-lazy-equivalence-audit-v1
          path: output/audit
          if-no-files-found: error
          retention-days: 90
