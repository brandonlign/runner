name: OrbitTrace P13 matched literature full freeze audit v3

on:
  pull_request:
    branches:
      - agent/orbittrace-p13-core-halo-pretruth-reservation
    paths:
      - orbittrace_core_halo_p13_literature/**
      - .github/workflows/orbittrace_p13_matched_full_freeze_audit_v3.yml

permissions: {contents: read}

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2 pandas==2.2.3 requests==2.32.5 beautifulsoup4==4.12.3
      - name: Verify final P13 matched freeze
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('orbittrace_core_halo_p13_literature/MATCHED_FREEZE.json').read_text())
          assert f['years']==[2023,2025] and f['blind_exclusion']==[20.0,55.0]
          assert f['p13_development']['workflow_run_id']==31303078223 and f['p13_development']['artifact_id']==9035081147
          assert f['p13_development']['artifact_digest']=='sha256:efd9c047fb195800d88da3409fb3765e265becb6d0483367e46b8f232658956a'
          assert f['p12_matched_transport']['generated_source_sha256']=='f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae'
          assert f['p12_matched_transport']['source_audit_workflow_run_id']==31305397873
          assert f['p12_matched_transport']['event_lookup_recovery_is_transport_only'] is True
          assert Path('orbittrace_core_halo_p13_literature/P12_MATCHED_TRANSPORT_SOURCE_SHA256').read_text().strip()=='f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae'
          lit=f['literature_implementation']; assert lit['p3_evaluator_source_commit']=='b1fa693471be78d1634632de942b6f95222c8a92'
          assert lit['p3_blindsafe_evaluator_git_blob']=='2fdc051dd6e4f5d42d3f20e8c35390a57a26fb34' and lit['p3_base_evaluator_git_blob']=='23275e4a59e1a5dab3934ea63c4f73381c627912'
          assert f['assignments']['hdbscan']['2023']['sha256']=='35f629b1dff4d04cdc13aa8224171ec1ab8e06b52836900d66ff978b5c235761' and f['assignments']['hdbscan']['2023']['count']==26460
          assert f['assignments']['hdbscan']['2025']['sha256']=='8e7580c52e41e6996d6e46f289a7b916565a4efc512c5549ee83f249d0e81ee3' and f['assignments']['hdbscan']['2025']['count']==19658
          assert f['assignments']['sugar']['2023']['sha256']=='2b9e86572f10af447071cb10c56f643c1ad8babfe0d9aa667994ba3639834389' and f['assignments']['sugar']['2023']['count']==30414
          assert f['assignments']['sugar']['2025']['sha256']=='77844d700bb14bb9952307fad13eb66cbc62e6a1555e5edd9c8aa0d26968b06e' and f['assignments']['sugar']['2025']['count']==23200
          assert f['exact_row_archives']['2023']['zip_sha256']=='9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430' and f['exact_row_archives']['2025']['zip_sha256']=='f4eb716a4b900658fcc658a633d918eca28946f59da75935f1fd5f6bc539bf52'
          g=f['mandatory_sparse_gate']; assert g['separate_for_each_panel_and_year'] is True and g['four_to_nine_mean_f1_gain_min']==0.10 and g['four_to_twentyfour_mean_f1_gain_min']==0.10 and g['macro_f1_max_deficit']==0.10 and g['competitor_f1_gt_0_5_retention_min']==0.80
          assert f['primary_discovery_output']=='immutable P13 recurrent core only' and f['secondary_characterization_output']=='exact transported P12 halo; cannot affect superiority'
          assert f['broad_only_does_not_authorize_external'] is True and f['target_access_authorized'] is False and f['parameter_search'] is False
          print('PASS_P13_FINAL_MATCHED_MACHINE_FREEZE')
          PY
      - name: Reconstruct and pin corrected P12 transport
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          python orbittrace_floor_consistent_geometry_p10/apply_p10_patch.py /tmp/p9.py /tmp/p10.py
          python orbittrace_density_contrast_p11/apply_p11_patch.py /tmp/p10.py /tmp/p11.py
          echo '914913d0462ea6793af3836cef945f14a03cca205ac0755ed6cdadb63b8752f9  /tmp/p11.py' | sha256sum -c -
          python orbittrace_drift_conditioned_p12/apply_p12_patch.py /tmp/p11.py /tmp/p12.py
          echo '78e93b5af19a441bc58b00428d2b356218b33f7a4a891a640dd59cb5d4599c32  /tmp/p12.py' | sha256sum -c -
          python orbittrace_core_halo_p13_literature/apply_p12_matched_transport_patch_v2.py /tmp/p12.py /tmp/p12_panel.py
          echo 'f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae  /tmp/p12_panel.py' | sha256sum -c -
          python -m py_compile /tmp/p12_panel.py orbittrace_core_halo_p13_literature/*.py
          grep -F 'event_lookup_by_year = {year:{str(e["id"]):e for e in scan_by_year[year]} for year in YEARS}' /tmp/p12_panel.py
          grep -F 'P13 matched transport stops exactly at the existing P12 truth firewall' /tmp/p12_panel.py
          ! grep -F 'p3_parse_truth_after_freeze(support, pretruth_ids)' /tmp/p12_panel.py
          echo PASS_P13_FINAL_P12_TRANSPORT_PIN
      - name: Verify evaluator Git objects and claim boundary
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin b1fa693471be78d1634632de942b6f95222c8a92
          git show FETCH_HEAD:orbittrace_crossfit_seed_floor_membership_p3_literature/evaluate_frozen_blindsafe.py > /tmp/w.py
          git show FETCH_HEAD:orbittrace_crossfit_seed_floor_membership_p3_literature/evaluate_frozen.py > /tmp/e.py
          test "$(git hash-object /tmp/w.py)" = '2fdc051dd6e4f5d42d3f20e8c35390a57a26fb34'
          test "$(git hash-object /tmp/e.py)" = '23275e4a59e1a5dab3934ea63c4f73381c627912'
          python - <<'PY'
          from pathlib import Path
          e=Path('/tmp/e.py').read_text(); own='\n'.join(Path(x).read_text() for x in ('orbittrace_core_halo_p13_literature/finalize_pretruth_checkpoint.py','orbittrace_core_halo_p13_literature/finalize_p3_evaluator_result.py'))
          for t in ('four_to_nine_gain_ge_0_10','four_to_twentyfour_gain_ge_0_10','macro_f1_not_more_than_0_10_lower','retain_at_least_80pct_f1_gt_0_5_count','pairwise_only_no_cross_denominator_comparison','broad_only_does_not_authorize_external'): assert t in e
          for t in ('f511a012693b7db05495985e32793177c9844196bf82e6f7fe868070ffed34ae','primary_candidate_is_core_only','halo_can_affect_primary_evaluation','external_validation_authorized','target_access_authorized'): assert t in own
          for bad in ('OrbitTrace-April','target_coordinate'): assert bad not in e and bad not in own
          print('PASS_P13_FINAL_EVALUATOR_AND_BOUNDARY')
          PY
          test ! -e orbittrace_core_halo_p13_literature/RUN.md
          test ! -e target
          echo PASS_P13_FINAL_MATCHED_FREEZE_NO_TRUTH_NO_TARGET
