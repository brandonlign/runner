name: OrbitTrace P6 bidirectional reliability source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p5-joint-seed-support-freeze
    paths:
      - orbittrace_bidirectional_reliability_p6/**
      - .github/workflows/orbittrace_p6_bidirectional_reliability_source_audit.yml
      - .github/workflows/orbittrace_p6_bidirectional_reliability_development.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reproduce exact pretruth P6 transform from canonical P5 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m py_compile orbittrace_bidirectional_reliability_p6/transform_frozen_p5.py orbittrace_bidirectional_reliability_p6/evaluate_frozen_p6.py
          rm -rf /tmp/p5 /tmp/p6 && mkdir -p /tmp/p5 /tmp/p6
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9032407268/zip" -o /tmp/p5.zip
          echo '39ba9b6f40c0a07f326ae61f9f1dc06d9d3ed3d11c4400f41a75dfb4473c3ea6  /tmp/p5.zip' | sha256sum -c -
          unzip -q /tmp/p5.zip -d /tmp/p5
          python orbittrace_bidirectional_reliability_p6/transform_frozen_p5.py \
            --p5-expanded-families /tmp/p5/p5_expanded_families.json.gz \
            --p5-membership-sha /tmp/p5/p5_membership_pretruth.sha256 \
            --p5-decisions /tmp/p5/p5_decisions_pretruth.json.gz \
            --p5-decisions-sha /tmp/p5/p5_decisions_pretruth.sha256 \
            --crossfit-json /tmp/p5/p3_crossfit_pretruth.json \
            --crossfit-sha /tmp/p5/p3_crossfit_pretruth.sha256 \
            --model-sha /tmp/p5/p2_model_pretruth.sha256 \
            --output /tmp/p6
          test "$(cat /tmp/p6/p6_membership_pretruth.sha256)" = '40b0b720ef37427bc2d89aeb71c145683cbc69eff9b56ac5516e87fc34348ff6'
          test "$(cat /tmp/p6/p6_decisions_pretruth.sha256)" = '5e76bbf2fd75acdf1d1bc770dc3c60de338a6388524c956544afe4c1aabc8490'
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/p6/p6_pretruth_transform.json').read_text())
          assert r['family_count']==226
          assert r['bidirectionally_reliable_families']==218
          assert r['ineligible_families']==8
          assert r['dropped_assignments']==3320
          assert r['retained_assignments']==21626
          assert r['families_gaining_members']==214
          assert r['known_shower_truth_accessed'] is False
          assert r['target_information_accessed'] is False
          assert r['membership_pretruth_sha256']=='40b0b720ef37427bc2d89aeb71c145683cbc69eff9b56ac5516e87fc34348ff6'
          assert r['decisions_pretruth_sha256']=='5e76bbf2fd75acdf1d1bc770dc3c60de338a6388524c956544afe4c1aabc8490'
          print('PASS_P6_EXACT_PRETRUTH_TRANSFORM_IDENTITY')
          PY

      - name: Assert P6 protocol and source-only firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          protocol=Path('orbittrace_bidirectional_reliability_p6/PROTOCOL.md').read_text()
          transform=Path('orbittrace_bidirectional_reliability_p6/transform_frozen_p5.py').read_text()
          evaluator=Path('orbittrace_bidirectional_reliability_p6/evaluate_frozen_p6.py').read_text()
          for token in (
              'both 2022→2023 and 2023→2022 directions are P3-reliable',
              'dropped P5 assignments: 3,320',
              'retained P6 additions: 21,626',
              '40b0b720ef37427bc2d89aeb71c145683cbc69eff9b56ac5516e87fc34348ff6',
              '5e76bbf2fd75acdf1d1bc770dc3c60de338a6388524c956544afe4c1aabc8490',
              'qualified known-shower matches >=95',
              'large-shower mean precision >=0.85',
              'There is exactly one primary P6 configuration',
          ):
              assert token in protocol, token
          for token in ('EXPECTED_P6_ASSIGNMENTS=21626','EXPECTED_ELIGIBLE_FAMILIES=218','EXPECTED_INELIGIBLE_FAMILIES=8','EXPECTED_DROPPED_ASSIGNMENTS=3320'):
              assert token in transform, token
          for token in ('PASS_BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P6_DEVELOPMENT','FAIL_BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P6_NO_GO','parameter_search'):
              assert token in evaluator, token
          forbidden=('OrbitTrace-April','target_coordinate')
          assert all(t not in transform for t in forbidden)
          assert all(t not in evaluator for t in forbidden)
          print('PASS_P6_BIDIRECTIONAL_RELIABILITY_SOURCE_AUDIT')
          PY
          test ! -e orbittrace_bidirectional_reliability_p6/RUN.md
          test ! -e target
          echo NO_P6_TRUTH_EXECUTION_NO_TARGET_ACCESS
