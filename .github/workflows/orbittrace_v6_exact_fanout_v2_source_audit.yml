name: OrbitTrace v6 exact fanout v2 source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-performance-optimization-v1
    paths:
      - orbittrace_v6_exact_fanout_v2/**
      - .github/workflows/orbittrace_v6_exact_fanout_v2_source_audit.yml

permissions:
  contents: read

concurrency:
  group: orbittrace-v6-exact-fanout-v2-source-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-probabilistic-membership-p1-freeze-v2
          path: frozen-p1
      - name: Reconstruct exact source-only C1 prerequisites
        run: |
          set -euo pipefail
          mkdir -p source_extract
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > source_extract/v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  source_extract/v6.frozen.py' | sha256sum -c -
          python - <<'PY'
          import hashlib
          from pathlib import Path
          frozen=Path('source_extract/v6.frozen.py'); repaired=Path('source_extract/v6.repaired.py')
          original=frozen.read_text()
          before='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    components = primary_components + rescue_components
'''
          after='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    primary_components = component_records_track_v6(old, year, primary_capped, event_lookup, base, "v3")
    rescue_components = component_records_track_v6(old, year, rescue_capped, event_lookup, base, "fixed4_rescue")
    components = primary_components + rescue_components
'''
          assert original.count(before)==1
          patched=original.replace(before,after,1)
          assert patched.replace(after,before,1)==original
          assert hashlib.sha256(patched.encode()).hexdigest()=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          repaired.write_text(patched)
          PY
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          parts=sorted(Path('frozen-p1/orbittrace_probabilistic_membership_p1/source_parts').glob('part*.b64'))
          assert [p.name for p in parts]==['part00.b64','part01.b64']
          src=gzip.decompress(base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts),validate=True))
          assert hashlib.sha256(src).hexdigest()=='e7847e067bab8d07038c998359ccbf0ca6e2ccf257f27f27f4aef999cc7a0508'
          Path('source_extract/p1.frozen.py').write_bytes(src)
          PY
          python -m py_compile source_extract/v6.repaired.py source_extract/p1.frozen.py
      - name: Inventory exact family ranking evaluation APIs
        run: |
          python - <<'PY'
          import ast,json
          from pathlib import Path
          out={}
          for name in ('v6.repaired.py','p1.frozen.py'):
              text=Path('source_extract',name).read_text(); tree=ast.parse(text)
              funcs=[]
              for n in tree.body:
                  if isinstance(n,ast.FunctionDef):
                      funcs.append({'name':n.name,'args':[a.arg for a in n.args.args],'lineno':n.lineno,'end_lineno':n.end_lineno})
              strings=sorted({n.value for n in ast.walk(tree) if isinstance(n,ast.Constant) and isinstance(n.value,str) and any(k in n.value.lower() for k in ('family','rank','evaluat','qualified','recover','primary','rescue','verdict','output'))})
              out[name]={'functions':funcs,'relevant_strings':strings}
          Path('source_extract/api_inventory.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Assert source-only boundary
        run: |
          test ! -e input
          test ! -e output
          echo NO_CATALOGUE_NO_LABEL_NO_TARGET_ACCESS_NO_C1_SCIENCE
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-c1-frozen-v6-p1-source-api
          path: source_extract
          if-no-files-found: error
          retention-days: 7
