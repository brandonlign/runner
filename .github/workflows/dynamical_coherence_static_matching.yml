name: Dynamical-coherence static matching gate

on:
  push:
    branches:
      - agent/dynamical-coherence-stage0
    paths:
      - dynamical_matching_stage0/**
      - .github/workflows/dynamical_coherence_static_matching.yml
  pull_request:
    branches:
      - main
    paths:
      - dynamical_matching_stage0/**
      - .github/workflows/dynamical_coherence_static_matching.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dynamical-coherence-static-matching
  cancel-in-progress: true

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_ARTIFACT_ID: '8869994126'
      SOURCE_ARTIFACT_SHA256: 'bc6df6971b5d306af9836b2df71aebbacd6c3f4045ea1b8c1d5268caedc2c322'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dynamical-coherence-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dynamical_matching_stage0/requirements.txt
      - name: Install frozen dependency
        run: python -m pip install --upgrade pip -r dynamical_matching_stage0/requirements.txt
      - name: Download exact labeled data-gate artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dynamical_matching_stage0/input dynamical_matching_stage0/results
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o dynamical_matching_stage0/input/data_gate.zip
          echo "${SOURCE_ARTIFACT_SHA256}  dynamical_matching_stage0/input/data_gate.zip" | sha256sum -c -
          unzip -q dynamical_matching_stage0/input/data_gate.zip -d dynamical_matching_stage0/input/data_gate
          test -s dynamical_matching_stage0/input/data_gate/selected_events.jsonl.gz
          test -s dynamical_matching_stage0/input/data_gate/data_gate.json
      - name: Compile frozen matching gate
        run: |
          python -m py_compile dynamical_matching_stage0/run_static_matching.py
          python -m py_compile dynamical_matching_stage0/run_static_matching_corrected.py
      - name: Run clone-ready static matched-null gate
        run: |
          python dynamical_matching_stage0/run_static_matching_corrected.py \
            --events dynamical_matching_stage0/input/data_gate/selected_events.jsonl.gz \
            --data-gate dynamical_matching_stage0/input/data_gate/data_gate.json \
            --output dynamical_matching_stage0/results
      - name: Record provenance
        run: |
          sha256sum \
            dynamical_matching_stage0/run_static_matching.py \
            dynamical_matching_stage0/run_static_matching_corrected.py \
            dynamical_matching_stage0/PROTOCOL.md \
            dynamical_matching_stage0/FEASIBILITY_CORRECTION.md \
            > dynamical_matching_stage0/results/source_sha256.txt
          sha256sum \
            dynamical_matching_stage0/input/data_gate/selected_events.jsonl.gz \
            dynamical_matching_stage0/input/data_gate/data_gate.json \
            > dynamical_matching_stage0/results/input_sha256.txt
          python --version > dynamical_matching_stage0/results/python_version.txt
          python -m pip freeze > dynamical_matching_stage0/results/environment.txt
      - name: Upload static-matching evidence
        uses: actions/upload-artifact@v4
        with:
          name: dynamical-coherence-static-matching
          path: dynamical_matching_stage0/results
          if-no-files-found: error
          retention-days: 90
