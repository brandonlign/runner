name: ISEF Euclid positive control

on:
  push:
    branches: [main]
    paths:
      - 'isef/euclid_gaia_positive_controls.py'
      - 'isef/euclid_gaia_control_fullgate.py'
      - '.github/workflows/isef-euclid-positive.yml'

permissions:
  contents: read
  issues: write

jobs:
  positive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'photutils>=2.2'
      - name: Gaia strongest known-variable control through full Stage-0B gate
        id: fullgate
        continue-on-error: true
        run: timeout 120s python isef/euclid_gaia_control_fullgate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-euclid-positive-fullgate
          path: results/euclid_gaia_control_fullgate.json
          if-no-files-found: warn
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FULLGATE: ${{ steps.fullgate.outcome }}
        run: |
          python - <<'PY' > /tmp/positive.md
          import json, os
          from pathlib import Path
          print('## Euclid known-variable full-gate validation')
          print(f"full-gate: `{os.environ.get('FULLGATE')}`")
          p=Path('results/euclid_gaia_control_fullgate.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)+'\n```')
          else: print('_artifact not produced_')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/positive.md
