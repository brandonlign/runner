name: Exoplanet denoising isolated PR probe

on:
  pull_request:
    branches:
      - main
    paths:
      - experiments/exoplanet-denoising/**
      - .github/workflows/exoplanet-denoising-*.yml

permissions:
  contents: read

concurrency:
  group: exoplanet-denoising-pr-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    if: >-
      github.head_ref == 'agent/exoplanet-denoising-research-runner' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_REF: agent/research-upgrade-wavelength-preserving
      SOURCE_TOKEN: ${{ secrets.EXOPLANET_REPO_TOKEN || secrets.GH_PAT || secrets.GH_TOKEN || secrets.PAT || secrets.REPO_TOKEN }}
    steps:
      - name: Checkout isolated runner branch
        uses: actions/checkout@v4
        with:
          ref: agent/exoplanet-denoising-research-runner
          persist-credentials: false

      - name: Detect private-source credential
        id: auth
        shell: bash
        run: |
          if [ -n "$SOURCE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Private-source credential is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No compatible cross-repository credential; no private source is accessed."
          fi

      - name: Checkout private research branch
        if: steps.auth.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: brandonlign/exoplanet-transit-denoising
          ref: agent/research-upgrade-wavelength-preserving
          token: ${{ env.SOURCE_TOKEN }}
          path: project
          fetch-depth: 0

      - name: Set up Python
        if: steps.auth.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: project/pyproject.toml

      - name: Install private project
        if: steps.auth.outputs.available == 'true'
        working-directory: project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run research utility tests privately
        if: steps.auth.outputs.available == 'true'
        id: tests
        working-directory: project
        shell: bash
        run: |
          mkdir -p research_results
          set +e
          python -m unittest tests.test_research_eval tests.test_research_splits > research_results/research_utility_tests.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Research utility tests finished with status $status; log stays private."

      - name: Materialize blinded confirmation manifest
        if: steps.auth.outputs.available == 'true' && steps.tests.outputs.status == '0'
        id: split
        working-directory: project
        shell: bash
        run: |
          set +e
          python scripts/materialize_research_confirmation_split.py > research_results/confirmation_split_materialization.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Confirmation membership materialization finished with status $status; no confirmation values or metrics were loaded."

      - name: Run fair same-information baseline gate
        if: steps.auth.outputs.available == 'true' && steps.tests.outputs.status == '0' && steps.split.outputs.status == '0'
        id: fair
        working-directory: project
        shell: bash
        run: |
          set +e
          python scripts/run_fair_same_input_baselines.py > research_results/fair_same_input_baselines.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Fair baseline gate finished with status $status; numerical output stays private."

      - name: Commit probe outputs only to private research branch
        if: steps.auth.outputs.available == 'true' && always()
        working-directory: project
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- research_results/research_utility_tests.log || true
          git add -- research_results/confirmation_split_materialization.log || true
          git add -- research_results/fair_same_input_baselines.log || true
          if [ -f research_results/fair_same_input_baselines.json ]; then
            git add -- research_results/fair_same_input_baselines.json
          fi
          if [ -f research_protocols/frozen_confirmation_split_v1.json ]; then
            git add -- research_protocols/frozen_confirmation_split_v1.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record isolated research probe outputs'
            git pull --rebase origin "$SOURCE_REF"
            git push origin "HEAD:$SOURCE_REF"
          fi

      - name: Fail on a real private experiment/test failure
        if: >-
          steps.auth.outputs.available == 'true' &&
          (steps.tests.outputs.status != '0' || steps.split.outputs.status != '0' || steps.fair.outputs.status != '0')
        run: exit 1
