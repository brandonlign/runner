name: OrbitTrace SonotaCo 2023 literature transfer

on:
  pull_request:
    branches:
      - agent/orbittrace-literature-comparison-development
    paths:
      - .github/workflows/orbittrace_sonotaco_2023_literature_transfer.yml
      - orbittrace_literature_freeze/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-sonotaco-2023-literature-transfer
  cancel-in-progress: true

jobs:
  one-shot-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-literature-comparison-2023-replication

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt

      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt

      - name: Verify the pre-2023 comparator freeze and runner
        run: |
          set -euo pipefail
          mkdir -p input/repaired output
          echo '22c368f93775aa47dc032ad2be5d9a03bfd4d69437fd7220570eb9ce4bee5286  orbittrace_literature_freeze/run_sonotaco_2023_literature_comparison.py.gz.b64' | sha256sum -c -
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  orbittrace_literature_comparison/literature_comparators.py' | sha256sum -c -
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          freeze = json.loads(Path('orbittrace_literature_freeze/SONOTACO_2025_EPISODE_COMPARATOR_FREEZE.json').read_text())
          assert freeze['verdict'] == 'PASS_SONOTACO_2025_LITERATURE_COMPARISON'
          assert freeze['source_commit'] == '5a8fb2c5a92f5762c48166f4fb60e57d9522ecf6'
          assert freeze['workflow_run'] == 31068866741
          assert freeze['artifact_id'] == 8954882633
          assert freeze['frozen_before_sonotaco_2023_comparator_execution'] is True
          encoded = ''.join(Path('orbittrace_literature_freeze/run_sonotaco_2023_literature_comparison.py.gz.b64').read_text().split())
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = 'fedbfe29c2330b133b67c48ee4238476522e40846669c8117eafa45594b04850'
          if digest != expected:
              raise RuntimeError(f'2023 runner source mismatch: {digest}')
          Path('/tmp/run_sonotaco_2023_literature_comparison.py').write_bytes(source)
          compile(source, 'run_sonotaco_2023_literature_comparison.py', 'exec')
          print('PASS_PRE_2023_COMPARATOR_FREEZE', digest)
          PY

      - name: Retrieve exact repaired 2023 parser and confirmation source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30920687116 \
            --repo "$GITHUB_REPOSITORY" \
            --name sonotaco-2023-confirmation-source-repair-v2 \
            --dir input/repaired
          echo '9619dfc0b339b39d287833778769f12a643e2b0157fdcd6115cd9c40be528322  input/repaired/audit_sonotaco_2023_v2.py' | sha256sum -c -
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/repaired/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          echo '2b09fafcb8a2d7886cb2e0b1b90f2447580b308d755269addd500535f2f4da0f  input/repaired/sonotaco_2023_confirmation_v2.py.gz.b64' | sha256sum -c -
          echo '882c21f2ac48689ab7a0d7a990496f7e055ab571b10c6f00bb63d8a18f8f7b3f  input/repaired/sonotaco_2023_confirmation_source_repair_v2.json' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          repair = json.loads(Path('input/repaired/sonotaco_2023_confirmation_source_repair_v2.json').read_text())
          if repair['verdict'] != 'PASS_SONOTACO_2023_CONFIRMATION_SOURCE_REPAIR_V2' or not all(repair['gates'].values()):
              raise RuntimeError('2023 source-repair artifact did not pass')
          if repair['opaque_structure']['expected_data_rows'] != 47087:
              raise RuntimeError('unexpected 2023 row count')
          PY

      - name: Retrieve exact GMN-MDC mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -

      - name: Download exact SonotaCo 2023 replacement archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output input/023a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/023a.zip
          echo '9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430  input/023a.zip' | sha256sum -c -

      - name: Execute the one-shot frozen comparator transfer
        env:
          PYTHONPATH: orbittrace_literature_comparison
        run: |
          set -euo pipefail
          python /tmp/run_sonotaco_2023_literature_comparison.py \
            --archive input/023a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --confirmation-source input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            --freeze orbittrace_literature_freeze/SONOTACO_2025_EPISODE_COMPARATOR_FREEZE.json \
            --workers 4 \
            --output output
          cat output/SONOTACO_2023_LITERATURE_TRANSFER.md

      - name: Record immutable provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            orbittrace_literature_freeze/SONOTACO_2025_EPISODE_COMPARATOR_FREEZE.json \
            orbittrace_literature_freeze/run_sonotaco_2023_literature_comparison.py.gz.b64 \
            orbittrace_literature_comparison/literature_comparators.py \
            input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            input/audit.json input/023a.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload one-shot transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-sonotaco-2023-literature-transfer
          path: output
          if-no-files-found: error
          retention-days: 90
