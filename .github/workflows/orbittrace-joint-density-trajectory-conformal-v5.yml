name: OrbitTrace joint density trajectory conformal v5 development

on:
  pull_request:
    branches:
      - agent/orbittrace-pooled-year-centroid-v8
    paths:
      - 'orbittrace_joint_density_trajectory_conformal_v5/**'
      - '.github/workflows/orbittrace-joint-density-trajectory-conformal-v5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-joint-density-trajectory-conformal-v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Enforce final pre-data provenance and complementary predecessor mechanisms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1 \
            input/vmods/orbittrace_cross_year_conformal_density_expansion_v3 \
            input/vmods/orbittrace_cross_year_trajectory_conformal_expansion_v4 \
            input/v3_result input/v4_result input/v3score input/v6 input/centroid output
          touch input/v1/orbittrace_cross_year_seed_support_expansion_v1/__init__.py
          touch input/vmods/orbittrace_cross_year_conformal_density_expansion_v3/__init__.py
          touch input/vmods/orbittrace_cross_year_trajectory_conformal_expansion_v4/__init__.py

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"

          # Exact v1 plumbing used by both predecessor implementations.
          git fetch --no-tags --depth=1 origin e87a61909f06b2c8f4e763a2f915d13b5c365620
          git show FETCH_HEAD:orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            > input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py
          test "$(git hash-object input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py)" = "2f48496362494d600652ae35d721e3b107c19a22"

          # Exact v3 density implementation.
          git fetch --no-tags --depth=1 origin c386f1570a82ce0ce9700e962bb650c3ba5af66e
          git show FETCH_HEAD:orbittrace_cross_year_conformal_density_expansion_v3/run_development.py \
            > input/vmods/orbittrace_cross_year_conformal_density_expansion_v3/run_development.py
          test "$(git hash-object input/vmods/orbittrace_cross_year_conformal_density_expansion_v3/run_development.py)" = "a80f6d7c7f0b85bf8225bf790ed54ca667ee37f0"

          # Exact v4 trajectory implementation.
          git fetch --no-tags --depth=1 origin d178ad4bca2991356bbafcd1b92b233ad2a25f44
          git show FETCH_HEAD:orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py \
            > input/vmods/orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py
          test "$(git hash-object input/vmods/orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py)" = "1062645993ed6c568f883bae624e0f02e8e5fb54"

          # Immutable v3 no-go prerequisite.
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9015557724/zip" -o input/v3_result.zip
          echo "f702124b40452624ffc7210e52978e6d9622e60f0a000af3299abda81e3fa7d7  input/v3_result.zip" | sha256sum -c -
          unzip -q input/v3_result.zip -d input/v3_result

          # Immutable v4 no-go prerequisite.
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9015902170/zip" -o input/v4_result.zip
          echo "394a03e4ba9ef2013adb4e22e3708f7d330fdd80b4ab603a102829afda50287c  input/v4_result.zip" | sha256sum -c -
          unzip -q input/v4_result.zip -d input/v4_result

          python - <<'PY'
          import json
          from pathlib import Path
          v3=json.loads(Path('input/v3_result/cross_year_conformal_density_expansion_v3_development.json').read_text())
          assert v3['verdict']=='FAIL_CROSS_YEAR_CONFORMAL_DENSITY_EXPANSION_V3_DEVELOPMENT'
          assert v3['family_count']==226
          assert v3['expansion_diagnostics']['total_new_members']==47904
          assert abs(v3['expanded_metrics']['multiplicity']['top100_dominant_precision']-0.662041206871218)<1e-12
          assert v3['expanded_metrics']['multiplicity']['qualified_matches']==90
          assert v3['expanded_metrics']['multiplicity']['recovered_at_100']==56
          assert abs(v3['annual_mean_f1_delta']['2022']['all']-0.08201437516259504)<1e-12
          assert abs(v3['annual_mean_f1_delta']['2023']['all']-0.09354804480011503)<1e-12
          assert v3['scientific_gates']['expanded_top100_precision_at_least_065'] is True
          assert v3['scientific_gates']['annual_all_mean_f1_gain_at_least_010_both_years'] is False

          v4=json.loads(Path('input/v4_result/cross_year_trajectory_conformal_expansion_v4_development.json').read_text())
          assert v4['verdict']=='FAIL_CROSS_YEAR_TRAJECTORY_CONFORMAL_EXPANSION_V4_DEVELOPMENT'
          assert v4['family_count']==226
          assert v4['expansion_diagnostics']['total_new_members']==136424
          assert abs(v4['expanded_metrics']['multiplicity']['top100_dominant_precision']-0.6374085405836665)<1e-12
          assert v4['expanded_metrics']['multiplicity']['qualified_matches']==88
          assert v4['expanded_metrics']['multiplicity']['recovered_at_100']==56
          assert abs(v4['annual_mean_f1_delta']['2022']['all']-0.10193983796354751)<1e-12
          assert abs(v4['annual_mean_f1_delta']['2023']['all']-0.11285180639737893)<1e-12
          assert v4['scientific_gates']['annual_all_mean_f1_gain_at_least_010_both_years'] is True
          assert v4['scientific_gates']['expanded_top100_precision_at_least_065'] is False
          PY

          # Exact scorer/support prerequisites inherited from promoted v8.
          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3score/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3score/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" -o input/v6.zip
          echo "3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v6.zip" | sha256sum -c -
          unzip -q input/v6.zip -d input/v6

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009091129/zip" -o input/centroid.zip
          echo "a1faacf51e1f4ca2a3a92b20e27d1f07f00e1d32ab33993916379ff36acea062  input/centroid.zip" | sha256sum -c -
          unzip -q input/centroid.zip -d input/centroid

          python -m py_compile \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            input/vmods/orbittrace_cross_year_conformal_density_expansion_v3/run_development.py \
            input/vmods/orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py \
            orbittrace_joint_density_trajectory_conformal_v5/run_development.py
          rm -rf output/*
          echo PASS_JOINT_V5_PREDATA_GUARDS

      - name: Run final frozen target-excluded v5 development
        env:
          PYTHONPATH: input/v1:input/vmods:input/v3score:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python orbittrace_joint_density_trajectory_conformal_v5/run_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --source-audit-json output/wavelet_catalogue_v3_source_audit.json \
            --v6-result-json input/v6/label_free_sparse_support_v6_development.json \
            --centroid-audit-json input/centroid/component_centroid_source_audit.json \
            --output output
          cat output/JOINT_DENSITY_TRAJECTORY_CONFORMAL_V5_DEVELOPMENT.md

      - name: Enforce final v5 blindness, formulas, and terminal chain decision
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/joint_density_trajectory_conformal_v5_development.json').read_text())
          assert r['verdict'] in {
            'PASS_JOINT_DENSITY_TRAJECTORY_CONFORMAL_V5_DEVELOPMENT',
            'FAIL_JOINT_DENSITY_TRAJECTORY_CONFORMAL_V5_DEVELOPMENT',
          }
          assert r['development_chain_decision'] in {
            'FREEZE_AND_REQUIRE_FRESH_PROSPECTIVE_VALIDATION',
            'CLOSE_POST_DISCOVERY_MEMBERSHIP_DEVELOPMENT_CHAIN',
          }
          c=r['configuration']
          assert c['blind_exclusion']==[20.0,55.0]
          assert c['conformal_alpha']==0.05
          assert c['neighbor_order']==2 and c['trajectory_model_order']==1
          assert c['activity_padding_deg']==6.0
          assert c['density_ceiling']==1.5 and c['trajectory_ceiling']==1.5
          assert c['joint_combiner']=='equal-weight Fisher nonconformity empirically recalibrated on source seeds'
          assert c['fisher_weights']==[1.0,1.0]
          assert c['joint_rule_search'] is False and c['weight_search'] is False
          assert c['alpha_search'] is False and c['neighbor_or_model_order_search'] is False
          assert c['ceiling_or_padding_search'] is False
          assert c['ranking_changed'] is False and c['recursive_growth'] is False
          assert c['threshold_search'] is False and c['variant_search'] is False
          assert c['development_pass_requires_fresh_prospective_validation_before_any_promotion_claim'] is True
          assert c['v3_predecessor_artifact_digest']=='sha256:f702124b40452624ffc7210e52978e6d9622e60f0a000af3299abda81e3fa7d7'
          assert c['v4_predecessor_artifact_digest']=='sha256:394a03e4ba9ef2013adb4e22e3708f7d330fdd80b4ab603a102829afda50287c'
          assert r['family_count']==226
          for gate in (
            'exact_joint_alpha_005',
            'exact_v3_neighbor_order_2',
            'exact_v4_model_order_1',
            'exact_inherited_activity_padding_6deg',
            'exact_inherited_density_ceiling_1_5',
            'exact_inherited_trajectory_ceiling_1_5',
            'exact_equal_fisher_weights',
            'joint_statistic_empirically_recalibrated',
            'no_joint_parameter_search',
          ):
            assert r['integrity_gates'][gate] is True, gate
          assert len(r['prelabel_payload_sha256'])==64
          assert 'No OrbitTrace target information' in r['claim_boundary']
          if r['verdict'].startswith('PASS_'):
            assert all(r['integrity_gates'].values()) and all(r['scientific_gates'].values())
            assert r['development_chain_decision']=='FREEZE_AND_REQUIRE_FRESH_PROSPECTIVE_VALIDATION'
          else:
            assert r['development_chain_decision']=='CLOSE_POST_DISCOVERY_MEMBERSHIP_DEVELOPMENT_CHAIN'
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/development_commit.txt
          sha256sum \
            orbittrace_joint_density_trajectory_conformal_v5/PROTOCOL.md \
            orbittrace_joint_density_trajectory_conformal_v5/run_development.py \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            input/vmods/orbittrace_cross_year_conformal_density_expansion_v3/run_development.py \
            input/vmods/orbittrace_cross_year_trajectory_conformal_expansion_v4/run_development.py \
            > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-joint-density-trajectory-conformal-v5-development
          path: output
          if-no-files-found: error
          retention-days: 90
