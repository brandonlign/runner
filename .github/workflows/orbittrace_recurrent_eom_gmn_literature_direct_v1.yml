name: OrbitTrace recurrent-EOM direct GMN literature benchmark v1
on:
  push:
    branches: [agent/orbittrace-recurrent-eom-gmn-literature-direct-v1]
    paths: ['orbittrace_recurrent_eom_gmn_literature_direct_v1/ACTIVATE.md']
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-recurrent-eom-gmn-literature-direct-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-recurrent-local-topomodal-trunk-v1
          path: local-trunk-src
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and audit frozen sources
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_eom_gmn_literature_direct_v1/PROTOCOL.md)" = 'dd88ced3e13e371d7d1976f4cbe6c8ba67ad4964'
          test "$(git hash-object orbittrace_recurrent_eom_gmn_literature_direct_v1/build_pretruth.py)" = 'be9ce377cfca8889bf98846e716e65eb24575097'
          test "$(git hash-object orbittrace_recurrent_eom_gmn_literature_direct_v1/evaluate_truth.py)" = 'bb4dec3a40429db7d017bafcb442c536c4c7e6d6'
          test "$(git -C local-trunk-src hash-object orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py)" = '32abfb3e68520cfdc83585a88731fa3982900cde'
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/ranker input/v8 input/recurrent input/v3 output/geometry output/pretruth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-eom-hdbscan-v1-gmn-development
          path: input/recurrent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31827903547
      - name: Rebind recurrent artifacts
        run: |
          set -euo pipefail
          test "$(sha256sum input/recurrent/RECURRENT_EOM_HDBSCAN_V1_PRELABEL.json | cut -d' ' -f1)" = 'e304f6660697ed27a7e2e546ba2b9f2ecdb43f923745cb7424a3781ad55b9ad1'
          test "$(sha256sum input/recurrent/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = '433c641f57122b244b9476f5cbcb5e6f82956d9467270a9f24945600a32d2106'
      - name: Export label-free exact GMN geometry
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          python -u local-trunk-src/orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/geometry/GMN_LABEL_FREE_GEOMETRY.json
      - name: Build and seal literature comparator catalogues
        run: |
          python -u orbittrace_recurrent_eom_gmn_literature_direct_v1/build_pretruth.py \
            --protocol orbittrace_recurrent_eom_gmn_literature_direct_v1/PROTOCOL.md \
            --geometry output/geometry/GMN_LABEL_FREE_GEOMETRY.json \
            --recurrent-prelabel input/recurrent/RECURRENT_EOM_HDBSCAN_V1_PRELABEL.json \
            --recurrent-result input/recurrent/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json \
            --output output/pretruth/GMN_LITERATURE_DIRECT_V1_PRETRUTH.json
          sha256sum output/pretruth/GMN_LITERATURE_DIRECT_V1_PRETRUTH.json > output/pretruth/PRELABEL_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-recurrent-eom-gmn-literature-direct-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90
  truth:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-recurrent-eom-gmn-literature-direct-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen truth runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/ranker input/v8 input/recurrent input/v3 input/sealed output/truth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null)
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-eom-hdbscan-v1-gmn-development
          path: input/recurrent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31827903547
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-eom-gmn-literature-direct-v1-pretruth
          path: input/sealed
      - name: Rebind sealed pretruth
        run: |
          expected=$(cut -d' ' -f1 input/sealed/PRELABEL_SHA256.txt)
          got=$(sha256sum input/sealed/GMN_LITERATURE_DIRECT_V1_PRETRUTH.json | cut -d' ' -f1)
          test "$expected" = "$got"
      - name: Run binding common-truth evaluation
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          python -u orbittrace_recurrent_eom_gmn_literature_direct_v1/evaluate_truth.py \
            --pretruth input/sealed/GMN_LITERATURE_DIRECT_V1_PRETRUTH.json \
            --recurrent-prelabel input/recurrent/RECURRENT_EOM_HDBSCAN_V1_PRELABEL.json \
            --recurrent-result input/recurrent/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth/GMN_LITERATURE_DIRECT_V1_RESULT.json
          sha256sum output/truth/GMN_LITERATURE_DIRECT_V1_RESULT.json > output/truth/RESULT_SHA256.txt
          git rev-parse HEAD > output/truth/execution_commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-gmn-literature-direct-v1-binding
          path: output/truth
          if-no-files-found: error
          retention-days: 90
