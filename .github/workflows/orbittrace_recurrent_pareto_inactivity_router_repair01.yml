name: OrbitTrace recurrent-Pareto inactivity router v1 repair01
on:
  pull_request:
    branches: [agent/orbittrace-recurrent-pareto-inactivity-router-v1]
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  SCIENCE_SHA: e662a516c9996b2cdd73d5ab295202feff51a69a
jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: '${{ env.SCIENCE_SHA }}'}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: agent/orbittrace-topomodal-support-resolved-cut-v1, path: support-cut-src}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: agent/orbittrace-topomodal-hierarchy-scale-v1, path: structural-src}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: agent/orbittrace-recurrent-topomodal-pareto-prominence-v1, path: pareto-src}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: c9d6c44704013ba0c9430100e98a29a56b453304, path: frozen-v8}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install and audit exact frozen science
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCIENCE_SHA"
          test "$(git hash-object orbittrace_recurrent_pareto_inactivity_router_v1/PROTOCOL.md)" = '7f71e013df1ae9c4afc09b5a2852f49720872086'
          test "$(git hash-object orbittrace_recurrent_pareto_inactivity_router_v1/build_pretruth.py)" = 'bd91eece4da711fb68649c57f0cbe5611ea08180'
          test "$(git hash-object orbittrace_recurrent_pareto_inactivity_router_v1/evaluate_truth.py)" = '236b5eeef7d74bdfa132153f3b0fde5ccc7716bf'
          test "$(git -C support-cut-src hash-object orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py)" = '4988997c023d9df2b504372b4290dcab379a6dcc'
          test "$(git -C structural-src hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git -C pareto-src hash-object orbittrace_recurrent_topomodal_pareto_prominence_v1/build_prelabel.py)" = '8add0107ca4376fa9e62b35713971456a5d6cfe1'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/{ranker,v8,v3,scale,pareto} output/pretruth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-active-urc-ranker-source-export-v1, path: input/ranker, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31344632499}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-pooled-year-centroid-v8-development, path: input/v8, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31217916558}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-recurrent-eom-scale-stress-v1, path: input/scale, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31929171717}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-recurrent-topomodal-pareto-prominence-v1-pretruth, path: input/pareto, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 32077260440}
      - name: Rebind prerequisites and apply identity-serialization adapter only
        run: |
          set -euo pipefail
          test "$(sha256sum input/scale/RECURRENT_EOM_SCALE_STRESS_V1.json | cut -d' ' -f1)" = '0c6926aa84d9b88f19f5bb2817b2846b53d09579dbef6b5c4d9c9bb9fd252288'
          test "$(sha256sum input/pareto/RECURRENT_TOPOMODAL_PARETO_PROMINENCE_V1_PRELABEL.json | cut -d' ' -f1)" = '5752ef8b36a5d317455e649723c26692fe2636262dc6d74befbe2ffb95945310'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python - <<'PY'
          from pathlib import Path
          src=Path('orbittrace_recurrent_pareto_inactivity_router_v1/build_pretruth.py'); t=src.read_text()
          old="def canon_hashes(rows:list[dict[str,Any]])->list[str]:return sorted(mh(mem(x)) for x in rows)"
          new="def canon_hashes(rows:list[dict[str,Any]])->list[str]:return sorted(hashlib.sha256('|'.join(sorted(mem(x))).encode()).hexdigest() for x in rows)"
          assert t.count(old)==1
          out=Path('/tmp/build_pretruth_repair01.py'); out.write_text(t.replace(old,new))
          Path('output/pretruth/IDENTITY_ADAPTER.txt').write_text('Only scale-stress membership-hash serialization changed from truncated family hash to full sha256 pipe-joined membership; route science unchanged.\n')
          PY
      - name: Build and seal repaired pretruth
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          set -euo pipefail
          python -u /tmp/build_pretruth_repair01.py --protocol orbittrace_recurrent_pareto_inactivity_router_v1/PROTOCOL.md --scale-stress-result input/scale/RECURRENT_EOM_SCALE_STRESS_V1.json --pareto-prelabel input/pareto/RECURRENT_TOPOMODAL_PARETO_PROMINENCE_V1_PRELABEL.json --support-cut-generator support-cut-src/orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py --structural-runner structural-src/orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py --pareto-builder pareto-src/orbittrace_recurrent_topomodal_pareto_prominence_v1/build_prelabel.py --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py --quality-source input/ranker/run_urc_union_ranker.py --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 --v8-result-json input/v8/pooled_year_centroid_v8_development.json --output output/pretruth
          python - <<'PY'
          import hashlib,json
          p='output/pretruth/RECURRENT_PARETO_INACTIVITY_ROUTER_V1_PRELABEL.json';r='output/pretruth/RECURRENT_PARETO_INACTIVITY_ROUTER_V1_PRETRUTH.json';h=hashlib.sha256(open(p,'rb').read()).hexdigest();a=json.load(open(r));assert a['verdict']=='PASS_RECURRENT_PARETO_INACTIVITY_ROUTER_V1_PRETRUTH' and a['prelabel_sha256']==h and all(a['gates'].values());print(json.dumps({'verdict':a['verdict'],'prelabel_sha256':h,'panel_audit':a['panel_audit']},indent=2,sort_keys=True))
          PY
          sha256sum output/pretruth/RECURRENT_PARETO_INACTIVITY_ROUTER_V1_PRELABEL.json > output/pretruth/PRELABEL_SHA256.txt
          printf '%s\n' "$SCIENCE_SHA" > output/pretruth/science_commit.txt
      - uses: actions/upload-artifact@v4
        with: {name: orbittrace-recurrent-pareto-inactivity-router-v1-pretruth-repair01, path: output/pretruth, if-no-files-found: error, retention-days: 90}
  truth:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: '${{ env.SCIENCE_SHA }}'}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: c9d6c44704013ba0c9430100e98a29a56b453304, path: frozen-v8}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact truth runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/{ranker,v8,v3,sealed} output/truth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null)
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-active-urc-ranker-source-export-v1, path: input/ranker, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31344632499}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-pooled-year-centroid-v8-development, path: input/v8, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31217916558}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-recurrent-pareto-inactivity-router-v1-pretruth-repair01, path: input/sealed}
      - name: Rebind sealed pretruth
        run: |
          set -euo pipefail
          test "$(cut -d' ' -f1 input/sealed/PRELABEL_SHA256.txt)" = "$(sha256sum input/sealed/RECURRENT_PARETO_INACTIVITY_ROUTER_V1_PRELABEL.json | cut -d' ' -f1)"
          python - <<'PY'
          import hashlib,json
          p='input/sealed/RECURRENT_PARETO_INACTIVITY_ROUTER_V1_PRELABEL.json';r='input/sealed/RECURRENT_PARETO_INACTIVITY_ROUTER_V1_PRETRUTH.json';h=hashlib.sha256(open(p,'rb').read()).hexdigest();a=json.load(open(r));pre=json.load(open(p));assert a['verdict']=='PASS_RECURRENT_PARETO_INACTIVITY_ROUTER_V1_PRETRUTH' and a['prelabel_sha256']==h and all(a['gates'].values());assert pre['shower_truth_used'] is False and pre['target_information_access'] is False and pre['target_region_events_accessed'] is False
          PY
      - name: Run first binding truth evaluation
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3
        run: |
          python -u orbittrace_recurrent_pareto_inactivity_router_v1/evaluate_truth.py --prelabel input/sealed/RECURRENT_PARETO_INACTIVITY_ROUTER_V1_PRELABEL.json --pretruth input/sealed/RECURRENT_PARETO_INACTIVITY_ROUTER_V1_PRETRUTH.json --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py --quality-source input/ranker/run_urc_union_ranker.py --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 --v8-result-json input/v8/pooled_year_centroid_v8_development.json --output output/truth
          sha256sum output/truth/RECURRENT_PARETO_INACTIVITY_ROUTER_V1_TRUTH.json > output/truth/RESULT_SHA256.txt
          printf '%s\n' "$SCIENCE_SHA" > output/truth/science_commit.txt
          printf '%s\n' "$GITHUB_RUN_ID" > output/truth/execution_run_id.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: orbittrace-recurrent-pareto-inactivity-router-v1-binding-repair01, path: output/truth, if-no-files-found: error, retention-days: 90}
