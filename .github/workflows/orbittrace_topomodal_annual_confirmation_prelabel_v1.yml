name: OrbitTrace topomodal annual confirmation prelabel v1

on:
  push:
    branches:
      - agent/orbittrace-topomodal-annual-confirmation-v1
    paths:
      - '.github/workflows/orbittrace_topomodal_annual_confirmation_prelabel_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  prelabel:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 312b1b718ae105813de242355142a74e7d377d65
          path: frozen-intrinsic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and audit pretruth sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0' 'requests==2.32.5' 'beautifulsoup4==4.12.3' 'pandas==2.2.3' 'click==8.0.4' 'future==1.0.0'
          python -m pip install --no-deps 'gmn-python-api==0.0.13'
          mkdir -p input/source input/manifest output
          test "$(git hash-object orbittrace_topomodal_annual_confirmation_v1/PROTOCOL.md)" = '66b7efb6480b41b2857723df0bd1567a2e65270e'
          test "$(git hash-object orbittrace_topomodal_annual_confirmation_v1/generate_prelabel.py)" = 'df6bb74c063facbdda27197e15096c0443760e38'
          test "$(git -C frozen-intrinsic hash-object orbittrace_topomodal_sparse_recovery_v1/run_development.py)" = '752df8212ce601227f6e9170b0fe994ba06b515d'
          ! grep -Eq 'parse_catalogue|hidden_sealed|hidden_truth|eligible_labels|metrics\(' orbittrace_topomodal_annual_confirmation_v1/generate_prelabel.py
          python -m py_compile orbittrace_topomodal_annual_confirmation_v1/generate_prelabel.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-1284-prelabel-isolated-for-orbital-v1
          path: input/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31979041005
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-numstat-availability-v1
          path: input/manifest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31972929547
      - name: Verify immutable inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/source/TOPOMODAL_SPARSE_RECOVERY_V1_PRELABEL.json | cut -d' ' -f1)" = 'db608f84bf333d18d624199f2d31c27b4183ee3a75a3d930cef4b9766a19d4de'
          test "$(sha256sum input/manifest/EXACT_1284_SPARSE_UNIVERSE_MANIFEST_V1.json | cut -d' ' -f1)" = '3ed5c33216d7d1cf2cbc703da088b3a86132e50532fb996cfe475d7f6052d7f8'
          python - <<'PY'
          import json
          p=json.load(open('input/source/TOPOMODAL_SPARSE_RECOVERY_V1_PRELABEL.json'))
          m=json.load(open('input/manifest/EXACT_1284_SPARSE_UNIVERSE_MANIFEST_V1.json'))
          assert p['schema']=='ORBITTRACE_TOPOMODAL_SPARSE_RECOVERY_V1_PRELABEL' and p['shower_truth_used'] is False
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False and len(p['subsets'])==8
          assert m['schema']=='ORBITTRACE_EXACT_1284_SPARSE_UNIVERSE_MANIFEST_V1' and m['shower_label_accessed'] is False
          assert m['blind_exclusion']==[20.0,55.0] and len(m['audited_union_ids'])==23080
          print('PASS_ANNUAL_CONFIRMATION_PRETRUTH_INPUTS')
          PY
      - name: Reproduce pooled 1284 and compute annual confirmation
        run: |
          set -euo pipefail
          python -u orbittrace_topomodal_annual_confirmation_v1/generate_prelabel.py \
            --source-prelabel input/source/TOPOMODAL_SPARSE_RECOVERY_V1_PRELABEL.json \
            --universe-manifest input/manifest/EXACT_1284_SPARSE_UNIVERSE_MANIFEST_V1.json \
            --intrinsic-runner frozen-intrinsic/orbittrace_topomodal_sparse_recovery_v1/run_development.py \
            --output output
      - name: Seal candidate order before truth
        run: |
          set -euo pipefail
          sha256sum output/TOPOMODAL_ANNUAL_CONFIRMATION_V1_PRELABEL.json | cut -d' ' -f1 > output/prelabel_sha256.txt
          python - <<'PY'
          import hashlib,json
          raw=open('output/TOPOMODAL_ANNUAL_CONFIRMATION_V1_PRELABEL.json','rb').read(); d=hashlib.sha256(raw).hexdigest(); p=json.loads(raw)
          assert d==open('output/prelabel_sha256.txt').read().strip()
          assert p['schema']=='ORBITTRACE_TOPOMODAL_ANNUAL_CONFIRMATION_V1_PRELABEL'
          assert p['source_1284_prelabel_sha256']=='db608f84bf333d18d624199f2d31c27b4183ee3a75a3d930cef4b9766a19d4de'
          assert p['candidate_budget_shortage_any_panel'] is False and len(p['subsets'])==8
          assert p['configuration']['confirmation']=='min(best_jaccard_2022,best_jaccard_2023)'
          assert p['configuration']['root_priority'] is False
          assert p['shower_truth_used'] is False and p['shower_truth_parsed'] is False
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          print('IMMUTABLE_ANNUAL_CONFIRMATION_PRELABEL_SHA256',d)
          print(json.dumps({'candidate_counts':[{'d':r['denominator'],'b':r['bucket'],'successor':len(r['successor_candidates']),'parent':len(r['recurrent_candidates']),'annual22':r['annual_topology_summary']['2022']['candidate_count'],'annual23':r['annual_topology_summary']['2023']['candidate_count']} for r in p['subsets']]},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-topomodal-annual-confirmation-v1-prelabel
          path: |
            output/TOPOMODAL_ANNUAL_CONFIRMATION_V1_PRELABEL.json
            output/prelabel_sha256.txt
          if-no-files-found: error
          retention-days: 90