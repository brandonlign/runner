name: OrbitTrace cross-year observed-support envelope v4 development

on:
  pull_request:
    branches:
      - agent/orbittrace-pooled-year-centroid-v8
    paths:
      - 'orbittrace_cross_year_observed_support_envelope_v4/**'
      - '.github/workflows/orbittrace-cross-year-observed-support-envelope-v4.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-cross-year-observed-support-envelope-v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Enforce pre-data provenance, v3 no-go, and pre-existing v9 radius source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1 \
            input/v9/orbittrace_support_overlap_family_v9 \
            input/v3_result input/mav3 input/v6 input/centroid output
          touch input/v1/orbittrace_cross_year_seed_support_expansion_v1/__init__.py
          touch input/v9/orbittrace_support_overlap_family_v9/__init__.py

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"

          # Exact v1 scaffold predates v4 and keeps all v1-v3 evaluation gates unchanged.
          git fetch --no-tags --depth=1 origin e87a61909f06b2c8f4e763a2f915d13b5c365620
          git show FETCH_HEAD:orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            > input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py
          test "$(git hash-object input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py)" = "2f48496362494d600652ae35d721e3b107c19a22"

          # Exact v9 source predates v1-v4 and supplies only the preregistered observed-radius definition.
          git fetch --no-tags --depth=1 origin ae15e7f28c6ccbcdcff57cc2efd44cb9aa01b0b3
          git show FETCH_HEAD:orbittrace_support_overlap_family_v9/run_development.py \
            > input/v9/orbittrace_support_overlap_family_v9/run_development.py
          test "$(git hash-object input/v9/orbittrace_support_overlap_family_v9/run_development.py)" = "ae098dfea19c0affba8af67c286f3f4153a91136"

          # Bind the exact v3 failure mechanism before v4 development-data access.
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9015567085/zip" -o input/v3_result.zip
          echo "80c5590a5702f3d641315321c5d8ef1387c61a6fcf6a57057b2a7ebe7b7ecfcb  input/v3_result.zip" | sha256sum -c -
          unzip -q input/v3_result.zip -d input/v3_result
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('input/v3_result/cross_year_component_centroid_expansion_v3_development.json').read_text())
          assert r['verdict']=='FAIL_CROSS_YEAR_COMPONENT_CENTROID_EXPANSION_V3_DEVELOPMENT'
          assert r['family_count']==226
          assert r['configuration']['family_link_radius_reused_as_membership_radius']==1.5
          assert r['configuration']['support_unit']=='frozen source-year component centroid'
          assert r['expansion_diagnostics']['total_new_members']==162646
          assert r['expanded_metrics']['multiplicity']['qualified_matches']==89
          assert r['expanded_metrics']['multiplicity']['recovered_at_100']==54
          assert abs(r['expanded_metrics']['multiplicity']['top100_dominant_precision']-0.6480775740811336)<1e-12
          assert r['scientific_gates']['expanded_qualified_nonregression'] is False
          assert r['scientific_gates']['expanded_recovery_at_100_nonregression'] is False
          assert r['scientific_gates']['expanded_top100_precision_at_least_065'] is False
          assert all(r['integrity_gates'].values())
          PY

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/mav3/multi_anchor_energy_v3.py
          test "$(git hash-object input/mav3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" -o input/v6.zip
          echo "3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v6.zip" | sha256sum -c -
          unzip -q input/v6.zip -d input/v6

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009091129/zip" -o input/centroid.zip
          echo "a1faacf51e1f4ca2a3a92b20e27d1f07f00e1d32ab33993916379ff36acea062  input/centroid.zip" | sha256sum -c -
          unzip -q input/centroid.zip -d input/centroid

          python -m py_compile \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            input/v9/orbittrace_support_overlap_family_v9/run_development.py \
            orbittrace_cross_year_observed_support_envelope_v4/run_development.py
          rm -rf output/*
          echo PASS_OBSERVED_SUPPORT_ENVELOPE_V4_PREDATA_GUARDS

      - name: Run frozen target-excluded v4 development
        env:
          PYTHONPATH: input/v1:input/v9:input/mav3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python orbittrace_cross_year_observed_support_envelope_v4/run_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --source-audit-json output/wavelet_catalogue_v3_source_audit.json \
            --v6-result-json input/v6/label_free_sparse_support_v6_development.json \
            --centroid-audit-json input/centroid/component_centroid_source_audit.json \
            --output output
          cat output/CROSS_YEAR_OBSERVED_SUPPORT_ENVELOPE_V4_DEVELOPMENT.md

      - name: Enforce frozen v4 blindness and verdict schema
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/cross_year_observed_support_envelope_v4_development.json').read_text())
          assert r['verdict'] in {
            'PASS_CROSS_YEAR_OBSERVED_SUPPORT_ENVELOPE_V4_DEVELOPMENT',
            'FAIL_CROSS_YEAR_OBSERVED_SUPPORT_ENVELOPE_V4_DEVELOPMENT',
          }
          c=r['configuration']
          assert c['blind_exclusion']==[20.0,55.0]
          assert c['family_link_radius_reused_as_membership_radius']==1.5
          assert c['support_unit']=='frozen source-year component centroid'
          assert c['observed_radius_definition']=='exact v9 max frozen centroid_distance over all unique original component member events'
          assert c['effective_radius_rule']=='min(1.5, observed radius)'
          assert c['component_centroids_refit'] is False
          assert c['component_radii_refit_after_expansion'] is False
          assert c['radius_search'] is False
          assert c['radius_multiplier'] is None and c['radius_quantile'] is None
          assert c['ranking_changed'] is False and c['recursive_growth'] is False
          assert c['threshold_search'] is False and c['variant_search'] is False
          assert c['v3_predecessor_run']==31235669516
          assert c['v3_predecessor_artifact']==9015567085
          assert c['v3_predecessor_artifact_digest']=='sha256:80c5590a5702f3d641315321c5d8ef1387c61a6fcf6a57057b2a7ebe7b7ecfcb'
          assert c['v9_radius_source_commit']=='ae15e7f28c6ccbcdcff57cc2efd44cb9aa01b0b3'
          assert c['v9_radius_source_blob']=='ae098dfea19c0affba8af67c286f3f4153a91136'
          assert r['family_count']==226
          assert r['integrity_gates']['exact_preexisting_v9_observed_radius_definition'] is True
          assert r['integrity_gates']['effective_radius_exact_min_1p5_observed'] is True
          assert r['integrity_gates']['component_centroids_and_radii_not_refit_after_expansion'] is True
          assert r['integrity_gates']['no_radius_multiplier_or_quantile_search'] is True
          assert len(r['prelabel_payload_sha256'])==64
          assert 'No OrbitTrace target information' in r['claim_boundary']
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/development_commit.txt
          sha256sum \
            orbittrace_cross_year_observed_support_envelope_v4/PROTOCOL.md \
            orbittrace_cross_year_observed_support_envelope_v4/run_development.py \
            input/v1/orbittrace_cross_year_seed_support_expansion_v1/run_development.py \
            input/v9/orbittrace_support_overlap_family_v9/run_development.py \
            > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-cross-year-observed-support-envelope-v4-development
          path: output
          if-no-files-found: error
          retention-days: 90
