name: OrbitTrace log-density synchronous v1 GMN

on:
  push:
    branches:
      - agent/orbittrace-log-density-sync-v1
    paths:
      - 'orbittrace_log_density_sync_v1/GMN_ACTIVATE.md'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  development:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify frozen science
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/v8 input/ranker output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          cp frozen-v8/orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py input/v3/wavelet_episode_comparator.py
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

          test "$(git hash-object orbittrace_log_density_sync_v1/PROTOCOL.md)" = '2adebded3915b1f4c52663bda909915114178125'
          test "$(git hash-object orbittrace_log_density_sync_v1/log_density_sync.py)" = '4c49ccb893ef34ef94d4f875dd1f91e27efd658a'
          test "$(git hash-object orbittrace_log_density_sync_v1/audit_synthetic.py)" = '12ab3af2827c497c05682bbaa5aabab3ce43f72d'
          test "$(git hash-object orbittrace_log_density_sync_v1/run_development.py)" = '48d1f7a7b2ffcf36bb46a15581c1bde15325bee9'
          test "$(git hash-object orbittrace_log_density_sync_v1/EXECUTION_FREEZE.json)" = 'f4479ee26e69ac0777253ef21a24eaab34d82889'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          python -m py_compile \
            orbittrace_log_density_sync_v1/*.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            input/v3/multi_anchor_energy_v3.py input/v3/wavelet_episode_comparator.py
          python - <<'PY'
          import json
          f=json.load(open('orbittrace_log_density_sync_v1/EXECUTION_FREEZE.json'))
          assert f['method']=='LOG_DENSITY_SYNCHRONOUS_EOM_V1'
          assert f['zero_data_audit_run']==31905081416
          assert f['zero_data_audit_artifact']==9252114653
          assert f['zero_data_audit_artifact_digest']=='sha256:721805fd4479efd20cad3e593186fa14b01db84269e83075fb06e2c4e3a2b891'
          assert f['zero_data_audit_verdict']=='PASS_LOG_DENSITY_SYNCHRONOUS_EOM_V1_SYNTHETIC_AUDIT'
          assert f['required_total_recovered_at_100_gain']==5
          assert f['parent_total_recovered_at_100']==179
          assert f['post_result_rescue_authorized'] is False
          assert f['amos_access'] is False and f['target_information_access'] is False
          print('PASS_LOG_DENSITY_EXECUTION_FREEZE')
          PY

      - name: Re-run frozen zero-data synthetic audit before scientific access
        env:
          PYTHONPATH: orbittrace_log_density_sync_v1:orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:.
        run: |
          set -euo pipefail
          python -u orbittrace_log_density_sync_v1/audit_synthetic.py | tee output/LOG_DENSITY_SYNTHETIC_AUDIT_RECHECK.log
          grep -q PASS_LOG_DENSITY_SYNCHRONOUS_EOM_V1_SYNTHETIC_AUDIT output/LOG_DENSITY_SYNTHETIC_AUDIT_RECHECK.log

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify frozen GMN runtime utility
        run: test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify frozen runtime-support artifact
        run: test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Run first binding log-density GMN outcome
        env:
          PYTHONPATH: input/ranker:input/v3:orbittrace_log_density_sync_v1:orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:.
        run: |
          set -euo pipefail
          python -u orbittrace_log_density_sync_v1/run_development.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce binding gate and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('output/LOG_DENSITY_SYNCHRONOUS_EOM_V1_PRELABEL.json'))
          r=json.load(open('output/LOG_DENSITY_SYNCHRONOUS_EOM_V1_GMN_DEVELOPMENT.json'))
          assert r['verdict'] in {'PASS_LOG_DENSITY_SYNCHRONOUS_EOM_V1_GMN_DEVELOPMENT','FAIL_LOG_DENSITY_SYNCHRONOUS_EOM_V1_GMN_DEVELOPMENT'}
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_DEVELOPMENT_ONLY'
          assert r['events_total']==738682 and r['events_by_year']=={'2022':315024,'2023':423658}
          assert p['events_total']==738682 and p['events_by_year']=={'2022':315024,'2023':423658}
          assert p['truth_evaluated_when_written'] is False
          assert p['parent_candidate_count']==r['parent_candidate_count']==2094
          assert r['parent_total_recovered_at_100']==179
          assert r['required_total_recovered_at_100_gain']==5
          assert r['post_result_parameter_search'] is False
          assert p['blind_exclusion']==r['blind_exclusion']==[20.0,55.0]
          for x in (p,r):
              assert x['target_information_access'] is False
              assert x['target_region_events_accessed'] is False
              assert x['sonotaco_2013_2014_access'] is False
              assert x['asfn_access'] is False
              assert x['efn_access'] is False
              assert x['amos_access'] is False
              assert x['maarsy_scientific_access'] is False
              assert x['dms_scientific_access'] is False
          if r['verdict'].startswith('PASS_'):
              assert r['total_recovered_at_100_gain'] >= 5
              assert r['successor_total_recovered_at_100'] >= 184
              assert all(all(g.values()) for g in r['annual_gates'].values())
          print(r['verdict'], 'gain=', r['total_recovered_at_100_gain'])
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          sha256sum \
            orbittrace_log_density_sync_v1/PROTOCOL.md \
            orbittrace_log_density_sync_v1/log_density_sync.py \
            orbittrace_log_density_sync_v1/audit_synthetic.py \
            orbittrace_log_density_sync_v1/run_development.py \
            orbittrace_log_density_sync_v1/EXECUTION_FREEZE.json \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            output/LOG_DENSITY_SYNCHRONOUS_EOM_V1_PRELABEL.json \
            output/LOG_DENSITY_SYNCHRONOUS_EOM_V1_GMN_DEVELOPMENT.json \
            > output/provenance_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-log-density-sync-v1-gmn-development
          path: output
          if-no-files-found: error
          retention-days: 90
