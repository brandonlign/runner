name: OrbitTrace reciprocal-transfer HDBSCAN v1 GMN development

on:
  push:
    branches:
      - agent/orbittrace-reciprocal-transfer-hdbscan-v1
    paths:
      - 'orbittrace_reciprocal_transfer_hdbscan_v1/ACTIVATE_GMN.md'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  binding-development:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-reciprocal-transfer-hdbscan-v1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify frozen scientific bytes
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/v8 input/ranker input/parent input/synthetic input/source-audit output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          test "$(git hash-object orbittrace_reciprocal_transfer_hdbscan_v1/PROTOCOL.md)" = '6181ba8e4dfa34f869249389bda2eae46ca2c690'
          test "$(git hash-object orbittrace_reciprocal_transfer_hdbscan_v1/reciprocal_transfer.py)" = 'f3a7c8d5ea53bf856fb8d0225d5d578c4248e5ce'
          test "$(git hash-object orbittrace_reciprocal_transfer_hdbscan_v1/run_development.py)" = '624b9d9855fa87e0e8331128af32eb88225d93cc'
          test "$(git hash-object orbittrace_reciprocal_transfer_hdbscan_v1/EXECUTION_FREEZE.json)" = '4953e85e908f17843ec01337b832a14808a46c04'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile \
            orbittrace_reciprocal_transfer_hdbscan_v1/reciprocal_transfer.py \
            orbittrace_reciprocal_transfer_hdbscan_v1/run_development.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            /tmp/run_wavelet_catalogue_v3_development.py
          python - <<'PY'
          import json
          f=json.load(open('orbittrace_reciprocal_transfer_hdbscan_v1/EXECUTION_FREEZE.json'))
          assert f['status']=='FROZEN_BEFORE_FIRST_TECHNICALLY_VALID_GMN_ENDPOINT'
          assert f['first_technically_valid_gmn_endpoint_is_binding'] is True
          assert f['post_result_parameter_search'] is False
          assert f['scientific_changes_authorized_after_outcome'] is False
          assert f['synthetic_audit']['run']==31849167489
          assert f['source_audit']['run']==31849390666
          assert f['recurrent_parent']['binding_run']==31827903547
          assert f['blind_exclusion']==[20.0,55.0]
          PY

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-reciprocal-transfer-hdbscan-v1-synthetic-audit
          path: input/synthetic
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31849167489

      - name: Verify synthetic audit receipt before GMN access
        run: |
          set -euo pipefail
          test "$(sha256sum input/synthetic/RECIPROCAL_TRANSFER_HDBSCAN_V1_SYNTHETIC_AUDIT.json | cut -d' ' -f1)" = '8c39cb44258df6b8fbc3160dd2c2d2d98bc58de6910bda017cf6f726182cbea1'
          python - <<'PY'
          import json
          p=json.load(open('input/synthetic/RECIPROCAL_TRANSFER_HDBSCAN_V1_SYNTHETIC_AUDIT.json'))
          assert p['verdict']=='PASS_RECIPROCAL_TRANSFER_HDBSCAN_V1_SYNTHETIC_AUDIT'
          assert p['prediction_data_native_identity_2022'] is True
          assert p['prediction_data_native_identity_2023'] is True
          assert p['strict_majority_50_percent_rejected'] is True
          assert p['strict_majority_75_percent_accepted'] is True
          assert p['deterministic_repeated_execution'] is True
          assert p['gmn_accessed'] is False and p['truth_accessed'] is False
          PY

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-reciprocal-transfer-hdbscan-v1-source-audit
          path: input/source-audit
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31849390666

      - name: Verify source/firewall audit receipt before GMN access
        run: |
          set -euo pipefail
          test "$(sha256sum input/source-audit/RECIPROCAL_TRANSFER_HDBSCAN_V1_SOURCE_AUDIT.json | cut -d' ' -f1)" = '930659eabef994d6977b5b38a92efab5b36ade64f22fa23e4d399376bb1aeeed'
          python - <<'PY'
          import json
          p=json.load(open('input/source-audit/RECIPROCAL_TRANSFER_HDBSCAN_V1_SOURCE_AUDIT.json'))
          assert p['verdict']=='PASS_RECIPROCAL_TRANSFER_HDBSCAN_V1_SOURCE_AUDIT'
          assert p['successor_build_line'] < p['prelabel_freeze_line'] < p['first_parent_output_read_line']
          assert p['prelabel_freeze_line'] < p['truth_unseal_line']
          assert p['prediction_probabilities_enter_matching'] is False
          assert p['prediction_probabilities_enter_ranking'] is False
          assert p['majority_fractions_enter_ranking'] is False
          assert p['kernel_truth_surface'] is False
          assert p['gmn_accessed'] is False and p['truth_accessed'] is False
          PY

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify frozen GMN runtime utility
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify frozen runtime-support artifact
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-eom-hdbscan-v1-gmn-development
          path: input/parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31827903547

      - name: Verify promoted recurrent-EOM parent artifacts
        run: |
          set -euo pipefail
          test "$(sha256sum input/parent/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = '433c641f57122b244b9476f5cbcb5e6f82956d9467270a9f24945600a32d2106'
          test "$(sha256sum input/parent/RECURRENT_EOM_HDBSCAN_V1_PRELABEL.json | cut -d' ' -f1)" = 'e304f6660697ed27a7e2e546ba2b9f2ecdb43f923745cb7424a3781ad55b9ad1'
          python - <<'PY'
          import json
          r=json.load(open('input/parent/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json'))
          assert r['verdict']=='PASS_RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT'
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_DEVELOPMENT_ONLY'
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['target_information_access'] is False
          assert r['target_region_events_accessed'] is False
          PY

      - name: Run first technically valid binding reciprocal-transfer GMN endpoint
        env:
          PYTHONPATH: input/ranker:.:orbittrace_reciprocal_transfer_hdbscan_v1:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u -m orbittrace_reciprocal_transfer_hdbscan_v1.run_development \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --parent-result-json input/parent/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json \
            --parent-prelabel-json input/parent/RECURRENT_EOM_HDBSCAN_V1_PRELABEL.json \
            --synthetic-audit-json input/synthetic/RECIPROCAL_TRANSFER_HDBSCAN_V1_SYNTHETIC_AUDIT.json \
            --output output

      - name: Enforce binding scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/RECIPROCAL_TRANSFER_HDBSCAN_V1_GMN_DEVELOPMENT.json'))
          p=json.load(open('output/RECIPROCAL_TRANSFER_HDBSCAN_V1_PRELABEL.json'))
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_DEVELOPMENT_ONLY'
          assert r['blind_exclusion']==[20.0,55.0]
          assert p['blind_exclusion']==[20.0,55.0]
          assert r['parent_result_sha256']=='433c641f57122b244b9476f5cbcb5e6f82956d9467270a9f24945600a32d2106'
          assert r['parent_prelabel_sha256']=='e304f6660697ed27a7e2e546ba2b9f2ecdb43f923745cb7424a3781ad55b9ad1'
          assert r['parent_metrics_exactly_reproduced'] is True
          assert r['synthetic_audit_run']==31849167489
          assert r['synthetic_audit_artifact']==9236929569
          assert r['synthetic_audit_result_sha256']=='8c39cb44258df6b8fbc3160dd2c2d2d98bc58de6910bda017cf6f726182cbea1'
          assert r['prediction_probabilities_used_for_matching'] is False
          assert r['prediction_probabilities_used_for_ranking'] is False
          assert r['majority_fractions_used_for_ranking'] is False
          for x in (r,p):
              assert x['target_information_access'] is False
              assert x['target_region_events_accessed'] is False
              assert x['sonotaco_2013_2014_access'] is False
              assert x['amos_scientific_access'] is False
              assert x['efn_scientific_access'] is False
              assert x['maarsy_scientific_access'] is False
              assert x['dms_scientific_access'] is False
          assert r['post_result_parameter_search'] is False
          print(r['verdict'])
          PY

      - name: Preserve binding provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          sha256sum \
            orbittrace_reciprocal_transfer_hdbscan_v1/PROTOCOL.md \
            orbittrace_reciprocal_transfer_hdbscan_v1/reciprocal_transfer.py \
            orbittrace_reciprocal_transfer_hdbscan_v1/run_development.py \
            orbittrace_reciprocal_transfer_hdbscan_v1/EXECUTION_FREEZE.json \
            input/synthetic/RECIPROCAL_TRANSFER_HDBSCAN_V1_SYNTHETIC_AUDIT.json \
            input/source-audit/RECIPROCAL_TRANSFER_HDBSCAN_V1_SOURCE_AUDIT.json \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            input/parent/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json \
            input/parent/RECURRENT_EOM_HDBSCAN_V1_PRELABEL.json \
            output/RECIPROCAL_TRANSFER_HDBSCAN_V1_PRELABEL.json \
            output/RECIPROCAL_TRANSFER_HDBSCAN_V1_GMN_DEVELOPMENT.json \
            > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-reciprocal-transfer-hdbscan-v1-gmn-development
          path: output
          if-no-files-found: error
          retention-days: 90
