name: ISEF MATLAS 74 native DRZ metadata gate
on:
  push:
    branches: [main]
    paths: ['isef/MATLAS_74_NATIVE_DRZ_METADATA_GATE_TRIGGER']
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy astroquery
      - run: |
          python -m py_compile isef/matlas_74_native_drz_metadata_gate.py
          cd isef
          python matlas_74_native_drz_metadata_gate.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-matlas-74-native-drz-metadata-gate
          path: isef/results/matlas_74_native_drz_metadata_gate/report.json
          if-no-files-found: error
