name: OrbitTrace v27 Sugar extractor debug from immutable bases

on:
  pull_request:
    branches: [agent/orbittrace-v26-relative-representative-quality-sonotaco-dev-v1]
    paths:
      - '.github/workflows/orbittrace_v27_postmembership_debug_v6.yml'
      - 'orbittrace_v27_postmembership_feature_freeze_repair_v6/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v27-postmembership-feature-freeze-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/ranker input/model input/prepare input/v5 output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          ( cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py )
          test "$(cat frozen-v8/output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          python -m py_compile orbittrace_v27_postmembership_feature_freeze_repair_v5/extract_id_bound.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-urc-final-full-gmn-ranker-v1
          path: input/model
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344776617
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v27-postmembership-feature-pretruth-freeze-id-bound-v5
          path: input/v5
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31424616547
      - name: Verify immutable failed-v5 base artifact
        run: |
          set -euo pipefail
          test -f input/v5/base-sugar/V22_PRETRUTH_FEATURE_MANIFEST.json
          test -f input/v5/base-hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json
          python - <<'PY'
          import json
          for route in ['sugar','hdbscan']:
              m=json.load(open(f'input/v5/base-{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              assert m['feature_dimension']==71
              assert m['truth_accessed'] is False and m['target_information_access'] is False and m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_IMMUTABLE_V5_BASES')
          PY
      - name: Restore exposed label-free SonotaCo rows only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9050107352/zip' -o input/prepare.zip
          echo '1296d757b5ea1dd94f9c9077fd769fdc8f00ec06d0881d8548fd1df4608344cc  input/prepare.zip' | sha256sum -c -
          unzip -q input/prepare.zip -d input/prepare
          python - <<'PY'
          import json
          m=json.load(open('input/prepare/label_free_preparation_manifest.json'))
          assert m['verdict']=='PASS_FINAL_SONOTACO_LABEL_FREE_PREPARATION'
          assert m['shower_truth_accessed'] is False and m['target_information_access'] is False and m['maarsy_scientific_access'] is False
          PY
      - name: Capture exact Sugar extractor failure
        env:
          PYTHONPATH: .:input/ranker:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set +e
          python -u orbittrace_v27_postmembership_feature_freeze_repair_v5/extract_id_bound.py \
            --comparator sugar --base-root input/v5/base-sugar \
            --rows-2013 input/prepare/sugar_2013.json --rows-2014 input/prepare/sugar_2014.json \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --ranker-source input/ranker/run_urc_union_ranker.py --original-model input/model/urc_final_ranker.joblib \
            --output output/sugar-debug > output/sugar_extractor_debug.log 2>&1
          code=$?
          cat output/sugar_extractor_debug.log
          echo "$code" > output/sugar_extractor_exit_code.txt
          exit "$code"
      - name: Record debug provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v27_postmembership_feature_freeze_repair_v5/extract_id_bound.py input/v5/base-sugar/V22_PRETRUTH_FEATURE_MANIFEST.json input/v5/base-sugar/family_memberships.json > output/DEBUG_SOURCE_INPUT_SHA256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v27-sugar-extractor-debug-v6
          path: output
          if-no-files-found: error
          retention-days: 30
