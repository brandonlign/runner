name: OrbitTrace recurrent-EOM latent hierarchy diagnostic v1 membership repair

on:
  push:
    branches:
      - agent/orbittrace-recurrent-eom-latent-hierarchy-diagnostic-v1
    paths:
      - '.github/workflows/orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1_membership_repair.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-recurrent-eom-latent-hierarchy-diagnostic-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact runtime and verify frozen science plus engineering-only repair
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/rows input/parent input/truth input/residual output
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/PROTOCOL.md)" = '3682568fdae81a16ed29dbf123afedd2fb9b3272'
          test "$(git hash-object orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/run_diagnostic.py)" = 'b3743b986cd16916ced5edef88e21fac55954ea7'
          test "$(git hash-object orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/PRETRUTH_ENGINEERING_REPAIR.md)" = 'a7fb91e5412b5b407651927f7647ea13fe432d2f'
          test "$(git hash-object orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/run_diagnostic_membership_repair.py)" = '817176ef1a70737ecca1c1d1867bff471338e1ca'
          python -m py_compile orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/run_diagnostic.py orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/run_diagnostic_membership_repair.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-sonotaco-label-free-preparation-v2
          path: input/rows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31354363306

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-eom-sonotaco-v31-benchmark-v1
          path: input/parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31829200215

      - name: Verify pretruth-only inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/parent/RECURRENT_EOM_SONOTACO_V1_PRETRUTH.json | cut -d' ' -f1)" = 'c6afbc0c3443b6c34e3f90b0f63453a0a35bfae3f3c84ffe8a479f8f50cffeef'
          test "$(sha256sum input/rows/label_free_preparation_manifest.json | cut -d' ' -f1)" = '0a24077f352ddba91c5fea2a102f996d6bea154b1bc769235a4dd916850dba2b'
          python - <<'PY'
          import json
          p=json.load(open('input/parent/RECURRENT_EOM_SONOTACO_V1_PRETRUTH.json'))
          assert p['truth_accessed'] is False and p['blind_exclusion']==[20.0,55.0]
          assert p['routes']['sugar']['candidate_count']==144 and p['routes']['hdbscan']['candidate_count']==123
          m=json.load(open('input/rows/label_free_preparation_manifest.json'))
          assert m['shower_truth_accessed'] is False and m['target_region_retained'] is False
          PY

      - name: Freeze complete latent hierarchy; exact membership identity remains mandatory
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/run_diagnostic_membership_repair.py pretruth \
            --rows-root input/rows \
            --parent-pretruth input/parent/RECURRENT_EOM_SONOTACO_V1_PRETRUTH.json \
            --output output
          sha256sum output/RECURRENT_EOM_LATENT_HIERARCHY_DIAGNOSTIC_V1_PRETRUTH.json > output/PRETRUTH_SHA256.txt
          python - <<'PY'
          import json
          p=json.load(open('output/RECURRENT_EOM_LATENT_HIERARCHY_DIAGNOSTIC_V1_PRETRUTH.json'))
          assert p['truth_accessed'] is False and p['residual_classification_accessed'] is False
          assert p['blind_exclusion']==[20.0,55.0]
          assert p['routes']['sugar']['selected_candidate_count']==144
          assert p['routes']['hdbscan']['selected_candidate_count']==123
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert p['amos_access'] is False and p['maarsy_scientific_access'] is False and p['dms_scientific_access'] is False
          print({r:(p['routes'][r]['selected_membership_sha256'],p['routes'][r]['latent_node_count']) for r in ('sugar','hdbscan')})
          PY

      # Truth-informed files cannot be restored until the exact membership check and latent freeze above pass.
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v15-exposed-matched-sonotaco-literature-result-v1
          path: input/truth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31405109267

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-eom-residual-analysis-v1
          path: input/residual
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31994209058

      - name: Refine exact frozen candidate-generation failures
        run: |
          set -euo pipefail
          test "$(sha256sum input/residual/RECURRENT_EOM_RESIDUAL_ANALYSIS_V1.json | cut -d' ' -f1)" = '19a50655a5612e6ef00e40e0eba7c1793f5bfe298c68c082baf8b35af4856078'
          PRETRUTH_SHA="$(sha256sum output/RECURRENT_EOM_LATENT_HIERARCHY_DIAGNOSTIC_V1_PRETRUTH.json | cut -d' ' -f1)"
          python -u orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/run_diagnostic_membership_repair.py evaluate \
            --pretruth output/RECURRENT_EOM_LATENT_HIERARCHY_DIAGNOSTIC_V1_PRETRUTH.json \
            --expected-pretruth-sha "$PRETRUTH_SHA" \
            --residual-result input/residual/RECURRENT_EOM_RESIDUAL_ANALYSIS_V1.json \
            --truth-root input/truth \
            --output output

      - name: Enforce diagnostic result and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/RECURRENT_EOM_LATENT_HIERARCHY_DIAGNOSTIC_V1_RESULT.json'))
          assert r['candidate_generation_failures']==58
          assert r['latent_tree_extraction_failures']+r['hierarchy_representation_failures']==58
          assert r['predeclared_guidance'] in {'TARGET_EXISTING_HIERARCHY_EXTRACTION_PRUNING','TARGET_NEW_HIERARCHY_CANDIDATE_CONSTRUCTION'}
          assert r['post_result_parameter_search'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['amos_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          print(json.dumps({k:r[k] for k in ['candidate_generation_failures','latent_tree_extraction_failures','hierarchy_representation_failures','latent_tree_fraction','predeclared_guidance','panel_summaries']},indent=2,sort_keys=True))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/PROTOCOL.md orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/run_diagnostic.py orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/PRETRUTH_ENGINEERING_REPAIR.md orbittrace_recurrent_eom_latent_hierarchy_diagnostic_v1/run_diagnostic_membership_repair.py output/RECURRENT_EOM_LATENT_HIERARCHY_DIAGNOSTIC_V1_PRETRUTH.json input/residual/RECURRENT_EOM_RESIDUAL_ANALYSIS_V1.json output/RECURRENT_EOM_LATENT_HIERARCHY_DIAGNOSTIC_V1_RESULT.json > output/source_input_output_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-latent-hierarchy-diagnostic-v1-membership-repair
          path: output
          if-no-files-found: error
          retention-days: 90
