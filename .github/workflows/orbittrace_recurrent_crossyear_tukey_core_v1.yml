name: OrbitTrace recurrent cross-year Tukey core v1
on:
  push:
    branches: [agent/orbittrace-recurrent-crossyear-tukey-core-v1]
    paths: ['orbittrace_recurrent_crossyear_tukey_core_v1/ACTIVATE.md']
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-recurrent-crossyear-tukey-core-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit frozen science and install runtime
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_crossyear_tukey_core_v1/PROTOCOL.md)" = 'c903e91acd3b916e646dec5fa3bf2c2c25cb8da5'
          test "$(git hash-object orbittrace_recurrent_crossyear_tukey_core_v1/build_prelabel.py)" = '97285b122285f2821640b4b5659056cbd6bf7e8c'
          test "$(git hash-object orbittrace_recurrent_crossyear_tukey_core_v1/evaluate_truth.py)" = 'c329d1112e7f26da7ae92743b66591baea96ad1a'
          test "$(git hash-object orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py)" = '32abfb3e68520cfdc83585a88731fa3982900cde'
          python -m py_compile orbittrace_recurrent_crossyear_tukey_core_v1/build_prelabel.py orbittrace_recurrent_crossyear_tukey_core_v1/evaluate_truth.py orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/ranker input/v8 input/parent input/v3 output/geometry output/pretruth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852836840
      - name: Rebind immutable parent and source inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json | cut -d' ' -f1)" = 'efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = 'ca6aeed2b82739003ea5d39b59e869df876de2962164344a938fe4935ea38711'
      - name: Export exact label-free target-excluded geometry
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_local_topomodal_trunk_v1/export_geometry.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json
      - name: Build and seal cross-year Tukey prelabel
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_crossyear_tukey_core_v1/build_prelabel.py \
            --protocol orbittrace_recurrent_crossyear_tukey_core_v1/PROTOCOL.md \
            --geometry output/geometry/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_GEOMETRY.json \
            --parent-prelabel input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --parent-result input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            --output output/pretruth/RECURRENT_CROSSYEAR_TUKEY_CORE_V1_PRELABEL.json
          sha256sum output/pretruth/RECURRENT_CROSSYEAR_TUKEY_CORE_V1_PRELABEL.json > output/pretruth/PRELABEL_SHA256.txt
          printf '%s\n' "$GITHUB_RUN_ID" > output/pretruth/execution_run_id.txt
          git rev-parse HEAD > output/pretruth/execution_commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-recurrent-crossyear-tukey-core-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-recurrent-crossyear-tukey-core-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen truth runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/ranker input/v8 input/parent input/v3 input/sealed output/truth
          test "$(git hash-object orbittrace_recurrent_crossyear_tukey_core_v1/PROTOCOL.md)" = 'c903e91acd3b916e646dec5fa3bf2c2c25cb8da5'
          test "$(git hash-object orbittrace_recurrent_crossyear_tukey_core_v1/evaluate_truth.py)" = 'c329d1112e7f26da7ae92743b66591baea96ad1a'
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852836840
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-crossyear-tukey-core-v1-pretruth
          path: input/sealed
      - name: Rebind sealed prelabel before truth
        run: |
          set -euo pipefail
          expected=$(cut -d' ' -f1 input/sealed/PRELABEL_SHA256.txt)
          got=$(sha256sum input/sealed/RECURRENT_CROSSYEAR_TUKEY_CORE_V1_PRELABEL.json | cut -d' ' -f1)
          test "$expected" = "$got"
          python - <<'PY'
          import json
          p=json.load(open('input/sealed/RECURRENT_CROSSYEAR_TUKEY_CORE_V1_PRELABEL.json'))
          assert p['shower_truth_used'] is False
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert p['mechanism_active'] is True and p['changed_slot_count']>0 and p['total_removed_events']>0
          assert p['parent_candidate_count']==p['successor_candidate_count']==2094
          PY
      - name: Run first binding truth evaluation
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_crossyear_tukey_core_v1/evaluate_truth.py \
            --prelabel input/sealed/RECURRENT_CROSSYEAR_TUKEY_CORE_V1_PRELABEL.json \
            --parent-prelabel input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --parent-result input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth/RECURRENT_CROSSYEAR_TUKEY_CORE_V1_BINDING_RESULT.json
          printf '%s\n' "$GITHUB_RUN_ID" > output/truth/execution_run_id.txt
          git rev-parse HEAD > output/truth/execution_commit.txt
          sha256sum orbittrace_recurrent_crossyear_tukey_core_v1/PROTOCOL.md orbittrace_recurrent_crossyear_tukey_core_v1/build_prelabel.py orbittrace_recurrent_crossyear_tukey_core_v1/evaluate_truth.py input/sealed/RECURRENT_CROSSYEAR_TUKEY_CORE_V1_PRELABEL.json output/truth/RECURRENT_CROSSYEAR_TUKEY_CORE_V1_BINDING_RESULT.json > output/truth/source_input_output_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-crossyear-tukey-core-v1-binding
          path: output/truth
          if-no-files-found: error
          retention-days: 90
