name: OrbitTrace M2D support-pruned SonotaCo sealed-ranking evaluation

on:
  pull_request:
    branches: [agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1]
    paths:
      - '.github/workflows/orbittrace_m2d_support_pruned_cut_v1_sonotaco_eval.yml'
      - 'orbittrace_m2d_support_pruned_cut_v1/SONOTACO_RANKED_EVALUATION_PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  RANK_RUN_ID: '32288839233'

jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 5b9cf92ae598f72ffd8167ecbc26de0de4e709e7
          path: baseline-m2d
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen evaluation sources
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_support_pruned_cut_v1/evaluate_sonotaco_ranked.py)" = '0572a001624b951dda6231d6046508f14ccc0e36'
          test "$(git -C baseline-m2d hash-object orbittrace_internal_mass_sonotaco_development_v1/run_binding.py)" = 'b44e0222e08ae4e85f0ea9a91c95f7b9141f3fb9'
          python -m py_compile orbittrace_m2d_support_pruned_cut_v1/evaluate_sonotaco_ranked.py
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1'
          mkdir -p input/rows input/pretruth input/ranked output
          test ! -e input/truth

      - name: Wait only for the predeclared zero-truth ranking run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RANK_RUN_ID}" --jq '.head_sha')"
          test "$head_sha" = '6d36a9fb2eca1d3d9b8d11866e8910b287e449ba'
          for i in $(seq 1 180); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RANK_RUN_ID}" --jq '.status')"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RANK_RUN_ID}" --jq '.conclusion // ""')"
            echo "rank prerequisite: status=${status} conclusion=${conclusion} poll=${i}"
            if test "$status" = completed; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 20
          done
          echo 'ranking prerequisite did not finish within execution window' >&2
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-sonotaco-label-free-preparation-v2
          path: input/rows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31354363306

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-sonotaco-pretruth
          path: input/pretruth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32287719630

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-sonotaco-ranked-pretruth
          path: input/ranked
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32288839233

      - name: Verify complete ranking seal before truth exists
        run: |
          set -euo pipefail
          test ! -e input/truth
          test "$(sha256sum input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_PRETRUTH.json | cut -d' ' -f1)" = '6ae27f985340eaa41870ab4c4f8cd15d6a1cd97e03ef828254f4c24d7896176a'
          RANKED_SHA="$(awk 'NR==1 {print $1}' input/ranked/RANKED_PRETRUTH_SHA256.txt)"
          test -n "$RANKED_SHA"
          test "$(sha256sum input/ranked/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RANKED_PRETRUTH.json | cut -d' ' -f1)" = "$RANKED_SHA"
          python - <<'PY'
          import json
          p='input/ranked/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RANKED_PRETRUTH.json'
          r=json.load(open(p))
          assert r['scientific_role']=='ZERO_LABEL_EXACT_M2D_RANKING_OF_SEALED_SUPPORT_PRUNED_CANDIDATES'
          assert r['support_pretruth_sha256']=='6ae27f985340eaa41870ab4c4f8cd15d6a1cd97e03ef828254f4c24d7896176a'
          assert r['candidate_count']==907 and len(r['candidates'])==907
          assert [int(x['internal_mass_rank']) for x in r['candidates']]==list(range(1,908))
          assert r['truth_artifact_downloaded'] is False
          assert r['truth_used'] is False and r['shower_labels_accessed'] is False
          assert r['post_result_parameter_search'] is False
          print('SEALED_RANKING_VERIFIED_WITH_TRUTH_ABSENT')
          PY
          echo "RANKED_SHA=$RANKED_SHA" >> "$GITHUB_ENV"

      - name: Verify immutable truth artifact identity without opening values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9069505548)"
          test "$(printf '%s' "$meta" | jq -r '.workflow_run.id')" = '31405109267'
          test "$(printf '%s' "$meta" | jq -r '.name')" = 'orbittrace-v15-exposed-matched-sonotaco-literature-result-v1'
          test "$(printf '%s' "$meta" | jq -r '.digest')" = 'sha256:cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797'
          test ! -e input/truth

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v15-exposed-matched-sonotaco-literature-result-v1
          path: input/truth
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31405109267

      - name: Execute the frozen ranked-only transfer evaluator once
        run: |
          set -euo pipefail
          python -u orbittrace_m2d_support_pruned_cut_v1/evaluate_sonotaco_ranked.py \
            --rows-root input/rows \
            --truth-root input/truth \
            --support-pretruth input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_PRETRUTH.json \
            --ranked-pretruth input/ranked/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RANKED_PRETRUTH.json \
            --expected-ranked-sha "$RANKED_SHA" \
            --baseline-runner baseline-m2d/orbittrace_internal_mass_sonotaco_development_v1/run_binding.py \
            --output output

      - name: Enforce binding scientific result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          p='output/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RESULT.json'
          r=json.load(open(p))
          assert r['verdict'] in {'PASS_M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_TRANSFER','FAIL_M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_TRANSFER'}
          assert r['support_pretruth_sha256']=='6ae27f985340eaa41870ab4c4f8cd15d6a1cd97e03ef828254f4c24d7896176a'
          assert r['candidate_count']==907
          assert r['ranked_pretruth_reexecuted'] is False
          assert r['method_changed_after_truth'] is False and r['post_result_parameter_search'] is False
          print(r['verdict'])
          print(json.dumps(r['aggregate'],indent=2,sort_keys=True))
          print(json.dumps(r['gates'],indent=2,sort_keys=True))
          print('RESULT_SHA256',hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY

      - name: Preserve exact provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/evaluation_wrapper_commit.txt
          printf '%s\n' "$RANK_RUN_ID" > output/ranking_run_id.txt
          sha256sum \
            orbittrace_m2d_support_pruned_cut_v1/evaluate_sonotaco_ranked.py \
            orbittrace_m2d_support_pruned_cut_v1/SONOTACO_RANKED_EVALUATION_PROTOCOL.md \
            baseline-m2d/orbittrace_internal_mass_sonotaco_development_v1/run_binding.py \
            input/pretruth/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_PRETRUTH.json \
            input/ranked/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RANKED_PRETRUTH.json \
            output/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RESULT.json \
            > output/provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-support-pruned-cut-v1-sonotaco-result
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Post binding result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s output/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RESULT.json; then
            python - <<'PY' > /tmp/result.md
          import json,hashlib
          p='output/M2D_SUPPORT_PRUNED_CUT_V1_SONOTACO_RESULT.json'; r=json.load(open(p))
          print('## Support-pruned M2D — sealed-ranking SonotaCo transfer')
          print()
          print('Verdict: **`%s`**' % r['verdict'])
          a=r['aggregate']
          print('- mean AUC macro-F1: `%.9f`' % a['mean_test_auc_macro_f1'])
          print('- mean macro-F1 @40: `%.9f`' % a['mean_test_macro_f1_at_40'])
          print('- total recovered @40: `%d`' % a['total_test_recovered_at_40'])
          print('- mean native macro-F1: `%.9f`' % a['mean_native_macro_f1'])
          print('- ranked pretruth SHA-256: `%s`' % r['ranked_pretruth_sha256'])
          print('- result SHA-256: `%s`' % hashlib.sha256(open(p,'rb').read()).hexdigest())
          print()
          print('No ranking or method was recomputed after truth access; frozen gates are reported in the result artifact.')
          PY
            gh pr comment 1380 --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md || true
          else
            gh pr comment 1380 --repo "$GITHUB_REPOSITORY" --body "Sealed-ranking SonotaCo evaluator ended without a scientific result. No method/ranking/gate change is authorized; inspect technical failure only." || true
          fi
