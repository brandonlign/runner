name: InvariantStreamNet frozen-model diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - invariant_streamnet_diagnostic/**
      - .github/workflows/invariant_streamnet_diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invariant-streamnet-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/invariant-streamnet-diagnostic
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: invariant_streamnet_stage0/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r invariant_streamnet_stage0/requirements.txt
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify diagnostic syntax
        run: python -m py_compile invariant_streamnet_diagnostic/diagnose.py
      - name: Diagnose frozen model on real ESV and scanned nulls
        run: python invariant_streamnet_diagnostic/diagnose.py
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: invariant-streamnet-frozen-diagnostic
          path: invariant_streamnet_diagnostic/results
          if-no-files-found: error
          retention-days: 90
      - name: Preserve diagnostic result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add invariant_streamnet_diagnostic/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Preserve InvariantStreamNet diagnostic'
            git pull --rebase origin agent/invariant-streamnet-diagnostic
            git push origin HEAD:agent/invariant-streamnet-diagnostic
          fi
