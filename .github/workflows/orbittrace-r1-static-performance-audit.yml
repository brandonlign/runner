name: OrbitTrace R1 static performance audit

on:
  pull_request:
    branches:
      - agent/orbittrace-recurrent-core-expansion-r1
    paths:
      - 'orbittrace_recurrent_core_expansion_r1/PERFORMANCE_AUDIT_TRIGGER.md'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen parent and audit scope
        env:
          EXPECTED_BASE: 2bb52fed75133a3cb163e64d0d9937e60a7b5d76
          ACTUAL_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$ACTUAL_BASE" = "$EXPECTED_BASE"
          test -f orbittrace_recurrent_core_expansion_r1/source_parts/part00.b64
          test -f orbittrace_recurrent_core_expansion_r1/performance_audit.py
          echo PASS_R1_PERFORMANCE_AUDIT_SCOPE_GUARD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static-only source performance audit
        run: |
          set -euo pipefail
          python orbittrace_recurrent_core_expansion_r1/performance_audit.py

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-r1-static-performance-audit
          path: output/r1_static_performance_audit.json
          if-no-files-found: error
          retention-days: 90
