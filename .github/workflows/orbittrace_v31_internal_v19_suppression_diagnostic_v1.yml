name: OrbitTrace v31 internal v19-suppression diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v31_internal_v19_suppression_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v31_internal_v19_suppression_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v31-internal-v19-suppression-diagnostic-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen diagnostic source
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3'
          mkdir -p input/source output/diag
          test "$(git hash-object orbittrace_v31_internal_v19_suppression_diagnostic_v1/PROTOCOL.md)" = 'a529d89197c051c9eaf4eabf0262d5308c51e24e'
          test "$(git hash-object orbittrace_v31_internal_v19_suppression_diagnostic_v1/diagnose.py)" = '5f7e599244ca9bf9d8a636508b7ba57392e4ff08'
          python -m py_compile orbittrace_v31_internal_v19_suppression_diagnostic_v1/diagnose.py

      - name: Restore authoritative frozen #1046 diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9086399760/zip' -o input/source.zip
          echo 'a2c373df77ef7e0065c1d8aceb1f6e5826f1e30b6286f2331c362d959f1d7f69  input/source.zip' | sha256sum -c -
          unzip -q input/source.zip -d input/source
          echo 'e4e09546e17b9a5da7ce12ad9af4bb7129533fd9b5be846ebc859719f01a9758  input/source/diag/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json' | sha256sum -c -
          test "$(tr -d '\r\n' < input/source/execution_commit.txt)" = '2dd05e8d42a9620a015ea7ca880cc436c32a49d6'
          python - <<'PY'
          import json
          r=json.load(open('input/source/diag/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json'))
          assert r['verdict']=='PASS_V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC'
          assert r['scientific_role']=='POST_RESULT_DIAGNOSTIC_ONLY_NO_SUCCESSOR_SELECTED'
          assert r['orders_described']==['raw local-margin','exact #839 diversity','immutable v19','final v31 v19 rank-sum']
          assert r['v31_reproduction']['2013']=={'budget':11,'macro_f1':0.14888037368183737,'recovered_f1_gt_0_5':9}
          assert r['v31_reproduction']['2014']=={'budget':9,'macro_f1':0.15198123772301594,'recovered_f1_gt_0_5':9}
          assert r['new_rank_evaluated'] is False and r['successor_selected'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_V19_SUPPRESSION_SOURCE_1046_PIN')
          PY

      - name: Run sole frozen internal constituent-disagreement diagnostic
        run: |
          set -euo pipefail
          python -u orbittrace_v31_internal_v19_suppression_diagnostic_v1/diagnose.py \
            --source-result input/source/diag/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json \
            --source-execution-commit input/source/execution_commit.txt \
            --output output/diag

      - name: Enforce diagnostic-only scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V31_INTERNAL_V19_SUPPRESSION_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V31_INTERNAL_V19_SUPPRESSION_DIAGNOSTIC','FAIL_V31_INTERNAL_V19_SUPPRESSION_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_V31_INTERNAL_CONSTITUENT_DISAGREEMENT_DIAGNOSTIC_ONLY_NO_SUCCESSOR_EVALUATED'
          assert r['source_run']==31451236076 and r['source_artifact']==9086399760
          assert r['source_result_sha256']=='e4e09546e17b9a5da7ce12ad9af4bb7129533fd9b5be846ebc859719f01a9758'
          assert set(r['annual_diagnostics'])=={'2013','2014'}
          for y in ('2013','2014'):
              a=r['annual_diagnostics'][y]
              assert set(a)=={'surfaced_recoverable','recoverable_but_missed','median_difference_missed_minus_surfaced','direction_pass','surfaced_rows','missed_rows'}
          for k in ('new_rank_or_score_used_for_ranking','selector_evaluated','replacement_rule_evaluated','literature_panel_evaluated','successor_selected','rank_gap_threshold_search','top_k_search','rank_window_search','effect_size_cutoff_search','alternate_constituent_pair_search','absolute_gap_search','ratio_search','log_transform_search','raw_local_substitution_search','fused_rank_difference_search','fusion_weight_search','feature_search','model_search','k_search','metric_search','scaling_search','diversity_search','source_quota_selected','oracle_identity_hardcoded','boundary_rescue_list_created','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['annual_diagnostics'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v31_internal_v19_suppression_diagnostic_v1/PROTOCOL.md \
            orbittrace_v31_internal_v19_suppression_diagnostic_v1/diagnose.py \
            input/source/diag/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json \
            > output/V31_INTERNAL_V19_SUPPRESSION_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-internal-v19-suppression-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
