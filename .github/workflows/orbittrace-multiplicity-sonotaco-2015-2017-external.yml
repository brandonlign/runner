name: OrbitTrace multiplicity fresh SonotaCo 2015-2017 external validation

on:
  pull_request:
    branches:
      - agent/orbittrace-multiplicity-sonotaco-2015-2017-external
    paths:
      - 'orbittrace_multiplicity_sonotaco_2015_2017_external/**'
      - '.github/workflows/orbittrace-multiplicity-sonotaco-2015-2017-external.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: orbittrace_wavelet_catalogue_v3:orbittrace_sparse_support_multiplicity_v5:input/v3

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out frozen external-validation branch
        uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-multiplicity-sonotaco-2015-2017-external

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Enforce frozen protocol, implementation, and fixed source before fresh data access
        run: |
          set -euo pipefail
          mkdir -p input/v3 input/freshness input/parser_audit input/parser_transport input/mapping input/archives output
          test "$(git hash-object orbittrace_multiplicity_sonotaco_2015_2017_external/PROTOCOL.md)" = "12de3db7d8aad0f9ad7facb67fb2e6f5b30f09d7"
          test "$(git hash-object orbittrace_multiplicity_sonotaco_2015_2017_external/run_external_validation.py)" = "a4128e0620dcf1242fe90bb6758c96d46caf0119"
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('output/wavelet_catalogue_v3_source_audit.json').read_text())
          assert audit['support_source_sha256'] == 'fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62'
          assert audit['held_out_catalogues_loaded'] is False
          PY
          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"
          test "$(git hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = "493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8"
          python -m py_compile \
            input/v3/multi_anchor_energy_v3.py \
            orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py \
            orbittrace_sparse_support_multiplicity_v5/run_holdout.py \
            orbittrace_multiplicity_sonotaco_2015_2017_external/run_external_validation.py
          rm -rf output/*
          echo PASS_EXTERNAL_FROZEN_SOURCE_GUARDS

      - name: Fetch and enforce exact freshness, parser, and mapping evidence before fresh data access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 31198545147 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-corrected-sonotaco-2015-2017-freshness-audit \
            --dir input/freshness
          gh run download 31198923927 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-sonotaco-parser-source-audit \
            --dir input/parser_audit
          gh run download 31199214174 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-sonotaco-2015-2017-parser-transport \
            --dir input/parser_transport
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name gmn-mapping-audit-20260804 \
            --dir input/mapping

          test -f input/freshness/corrected_sonotaco_2015_2017_freshness_audit.json
          test -f input/parser_audit/sonotaco_2023_parser_source_audit.json
          test -f input/parser_transport/sonotaco_2015_2017_parser_transport.json
          test -f input/parser_transport/run_sonotaco_2015_transport_parser.py
          test -f input/parser_transport/run_sonotaco_2017_transport_parser.py
          test -f input/mapping/audit.json

          echo '88bd76001df755ee110d2ce34b7cf3d7d5049840deadbdae397822521aae98b3  input/parser_transport/run_sonotaco_2015_transport_parser.py' | sha256sum -c -
          echo 'bed8abe56d647bcb0dd8c5f1177495228ff9c692e26124e9627541e6baabdb3  input/parser_transport/run_sonotaco_2017_transport_parser.py' | sha256sum -c -
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/mapping/audit.json' | sha256sum -c -

          python - <<'PY'
          import json
          from pathlib import Path

          freshness = json.loads(Path('input/freshness/corrected_sonotaco_2015_2017_freshness_audit.json').read_text())
          assert freshness['verdict'] == 'PASS_CORRECTED_SONOTACO_2015_2017_REPO_FRESHNESS_AUDIT'
          assert freshness['candidate_years'] == [2015, 2017]
          assert freshness['positive_control_year'] == 2016
          assert freshness['positive_control_detected'] is True
          assert freshness['years']['2015']['prior_actual_access_found'] is False
          assert freshness['years']['2017']['prior_actual_access_found'] is False
          assert freshness['catalogue_access'] is False
          assert freshness['scientific_score_access'] is False
          assert freshness['shower_label_access'] is False
          assert freshness['excluded_interval_access'] is False
          assert freshness['target_information_access'] is False

          parser_audit = json.loads(Path('input/parser_audit/sonotaco_2023_parser_source_audit.json').read_text())
          assert parser_audit['verdict'] == 'PASS_SONOTACO_2023_PARSER_SOURCE_AUDIT'
          assert parser_audit['source_sha256'] == 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6'
          assert parser_audit['constants']['BLIND_SOLAR_MIN'] == 20.0
          assert parser_audit['constants']['BLIND_SOLAR_MAX'] == 55.0
          assert parser_audit['catalogue_access'] is False
          assert parser_audit['scientific_score_access'] is False
          assert parser_audit['shower_label_data_access'] is False
          assert parser_audit['target_information_access'] is False

          transport = json.loads(Path('input/parser_transport/sonotaco_2015_2017_parser_transport.json').read_text())
          assert transport['verdict'] == 'PASS_SONOTACO_2015_2017_SOURCE_ONLY_PARSER_TRANSPORT'
          assert transport['years']['2015']['source_sha256'] == '88bd76001df755ee110d2ce34b7cf3d7d5049840deadbdae397822521aae98b3'
          assert transport['years']['2017']['source_sha256'] == 'bed8abe56d647bcb0dd8c5f1177495228ff9c692e26124e9627541e6baabdb3'
          assert transport['years']['2015']['member'] == '015a/_U2_20150101_S.csv'
          assert transport['years']['2017']['member'] == '017a/_U2_20170101_S.csv'
          assert all(transport['years']['2015']['gates'].values())
          assert all(transport['years']['2017']['gates'].values())
          assert not any(transport['prohibited_access'].values())
          print('PASS_EXTERNAL_FRESHNESS_PARSER_MAPPING_GUARDS')
          PY

      - name: Run first fresh target-excluded SonotaCo 2015-2017 catalogue validation
        run: |
          set -euo pipefail
          python orbittrace_multiplicity_sonotaco_2015_2017_external/run_external_validation.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --parser-2015 input/parser_transport/run_sonotaco_2015_transport_parser.py \
            --parser-2017 input/parser_transport/run_sonotaco_2017_transport_parser.py \
            --mapping-audit input/mapping/audit.json \
            --archive-dir input/archives \
            --output output
          cat output/MULTIPLICITY_SONOTACO_EXTERNAL.md

      - name: Enforce frozen result integrity and target-blind claim boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('output/multiplicity_sonotaco_external.json').read_text())
          allowed = {
              'PASS_MULTIPLICITY_SONOTACO_EXTERNAL_VALIDATION',
              'FAIL_MULTIPLICITY_SONOTACO_EXTERNAL_VALIDATION',
              'INCONCLUSIVE_MULTIPLICITY_SONOTACO_EXTERNAL_POWER',
              'FAIL_MULTIPLICITY_SONOTACO_EXTERNAL_INTEGRITY',
          }
          assert r['verdict'] in allowed
          if r.get('scientific_ranking_result_available') is False:
              assert r['verdict'] == 'FAIL_MULTIPLICITY_SONOTACO_EXTERNAL_INTEGRITY'
              assert r['orbittrace_target_access'] is False
          else:
              cfg = r['configuration']
              assert cfg['years'] == [2015, 2017]
              assert cfg['corpus'] == 'sonotaco-2015-2017-sparse-support-multiplicity-external'
              assert cfg['blind_exclusion'] == [20.0, 55.0]
              assert cfg['development_family_count'] == 197
              assert cfg['development_top_k'] == 100
              assert cfg['scaled_k_formula'] == 'ceil(100*N/197)'
              assert cfg['k'] == (100*cfg['family_count'] + 196)//197
              assert cfg['no_multiplicity_pvalue'] is True
              assert cfg['no_rrf'] is True
              assert cfg['no_threshold_search'] is True
              assert cfg['no_weight_search'] is True
              assert cfg['no_endpoint_search'] is True
              assert [x['url'] for x in r['archive_sources']] == [
                  'https://sonotaco.jp/doc/SNMv3/015a.zip',
                  'https://sonotaco.jp/doc/SNMv3/017a.zip',
              ]
              assert 'No OrbitTrace target coordinates' in r['claim_boundary']
              assert '20-55 degree interval was excluded before shower-label access' in r['claim_boundary']
          print('ORBITTRACE_MULTIPLICITY_SONOTACO_EXTERNAL_RESULT_BEGIN')
          print(json.dumps(r, indent=2, sort_keys=True))
          print('ORBITTRACE_MULTIPLICITY_SONOTACO_EXTERNAL_RESULT_END')
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/external_validation_commit.txt
          sha256sum \
            orbittrace_multiplicity_sonotaco_2015_2017_external/PROTOCOL.md \
            orbittrace_multiplicity_sonotaco_2015_2017_external/run_external_validation.py \
            input/v3/multi_anchor_energy_v3.py \
            orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py \
            input/freshness/corrected_sonotaco_2015_2017_freshness_audit.json \
            input/parser_audit/sonotaco_2023_parser_source_audit.json \
            input/parser_transport/sonotaco_2015_2017_parser_transport.json \
            input/parser_transport/run_sonotaco_2015_transport_parser.py \
            input/parser_transport/run_sonotaco_2017_transport_parser.py \
            input/mapping/audit.json \
            input/archives/sonotaco_2015.zip \
            input/archives/sonotaco_2017.zip \
            > output/external_source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload external-validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-multiplicity-sonotaco-2015-2017-external
          path: output
          if-no-files-found: error
          retention-days: 90
