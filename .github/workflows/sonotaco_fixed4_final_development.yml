name: SonotaCo fixed4 final development

on:
  pull_request:
    branches:
      - agent/sonotaco-fixed4-final-development-source-audit
    paths:
      - .github/workflows/sonotaco_fixed4_final_development.yml
      - sonotaco_fixed4_final_development/EXECUTION_PROTOCOL.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sonotaco-fixed4-final-development
  cancel-in-progress: true

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sonotaco-fixed4-final-development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - name: Decode and verify standalone final candidate
        run: |
          set -euo pipefail
          mkdir -p input output
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          payload = Path('sonotaco_fixed4_final_development/candidate.py.gz.b64')
          encoded = ''.join(payload.read_text(encoding='ascii').split())
          if len(encoded) != 7616:
              raise RuntimeError(f'encoded length mismatch: {len(encoded)}')
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          if len(source) != 19652:
              raise RuntimeError(f'source byte mismatch: {len(source)}')
          digest = hashlib.sha256(source).hexdigest()
          expected = '747b2b1471f3ba193d68a39dd82ad3ac8506be63b651d45f84ffabb8d1acd301'
          if digest != expected:
              raise RuntimeError(f'candidate source mismatch: {digest}')
          text = source.decode('utf-8')
          if 'SOLAR_SCALES = (2.0, 4.0)' not in text or 'CANDIDATE_SCALE = 4.0' not in text:
              raise RuntimeError('fixed model constants missing')
          if 'selected_scales' in text or 'consensus_key' in text:
              raise RuntimeError('scale-selection state remains')
          Path('/tmp/run_sonotaco_fixed4_final_development.py').write_bytes(source)
          print('candidate bytes:', len(source))
          print('candidate SHA-256:', digest)
          PY
          python -m py_compile /tmp/run_sonotaco_fixed4_final_development.py
      - name: Retrieve exact GMN-MDC mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -
      - name: Download exact SonotaCo 2025 development archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output input/025a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/025a.zip
          echo 'f4eb716a4b900658fcc658a633d918eca28946f59da75935f1fd5f6bc539bf52  input/025a.zip' | sha256sum -c -
      - name: Run frozen standalone fixed4 development benchmark
        run: |
          set -euo pipefail
          python /tmp/run_sonotaco_fixed4_final_development.py \
            --archive input/025a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --adapter-parts sonotaco_mondrian_development/source_parts \
            --workers 4 \
            --output output
          cat output/SONOTACO_FIXED4_FINAL_DEVELOPMENT.md
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            sonotaco_fixed4_final_development/PROTOCOL.md \
            sonotaco_fixed4_final_development/EXECUTION_PROTOCOL.md \
            sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            sonotaco_k4_phase_scale_diagnostic/source_parts/part00.b64 \
            sonotaco_mondrian_development/source_parts/part00.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            input/025a.zip input/audit.json \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload frozen final development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonotaco-fixed4-final-development
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Enforce complete final-development gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/sonotaco_fixed4_final_development.json').read_text())
          print(json.dumps({
              'configuration': result['configuration'],
              'candidate': result['candidate'],
              'original': result['original'],
              'fixed_comparator_weak_auc': result['fixed_comparator_weak_auc'],
              'gates': result['gates'],
              'verdict': result['verdict'],
          }, indent=2))
          if not all(result['gates'].values()):
              raise SystemExit('Frozen fixed4 final-development gate failed')
          PY
