name: OrbitTrace M2D SACV TopoModal trunk core source audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/orbittrace-m2d-sacv-dual-output-core-v1]
    paths:
      - 'orbittrace_m2d_sacv_topomodal_trunk_core_v1/**'
      - '.github/workflows/orbittrace_m2d_sacv_topomodal_trunk_core_source_audit.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    if: github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct exact frozen fallback recurrence runtime
        run: |
          set -euo pipefail
          echo 'd75b76a36911c916620da5e029f82c7987718b1610eb6bd61922015b5ab50d4a  orbittrace_m2d_sacv_v1_source.tgz' | sha256sum -c -
          tar -xzf orbittrace_m2d_sacv_v1_source.tgz
          cat orbittrace_m2d_sacv_edge_consensus_v1/source_parts/part*.b64 > /tmp/ec.b64
          test "$(wc -c < /tmp/ec.b64)" = '16844'
          base64 -d /tmp/ec.b64 > /tmp/ec.tgz
          echo 'f7d9fc168fb5f8a589a5d965252979951ae9659ded4dc6662a562276c6273d28  /tmp/ec.tgz' | sha256sum -c -
          tar -xzf /tmp/ec.tgz
          echo 'f6c5b2a89d70003b058e772b753c531cb5072b2c1eb52d77166d7a5cbd566ca7  orbittrace_m2d_sacv_fallback_recurrence_v1/patch_source.py' | sha256sum -c -
          python orbittrace_m2d_sacv_fallback_recurrence_v1/patch_source.py >/tmp/fallback-hashes.txt
          cp orbittrace_m2d_sacv_edge_consensus_v1/build_pretruth.py orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py
          cp orbittrace_m2d_sacv_edge_consensus_v1/evaluate_truth.py orbittrace_m2d_sacv_fallback_recurrence_v1/evaluate_truth.py
          cp orbittrace_m2d_sacv_edge_consensus_v1/run_binding.sh orbittrace_m2d_sacv_fallback_recurrence_v1/run_binding.sh
          cp orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py /tmp/fallback-before-instrument.py
          sha256sum /tmp/fallback-before-instrument.py
      - name: Audit prospective source identities and instrumentation-only delta
        run: |
          set -euo pipefail
          echo '474a9b082376365834c1d59020f0e6b35e4e2dcdb455a82e535a093a3b562cd1  orbittrace_m2d_sacv_topomodal_trunk_core_v1/PROTOCOL.md' | sha256sum -c -
          echo 'e00cab798ba3a0224afedf81dedd191bb55bc35398c3d10f1b36237421636213  orbittrace_m2d_sacv_topomodal_trunk_core_v1/instrument_runtime.py' | sha256sum -c -
          echo 'eaa146b1b04f2a30bbe86ffc4393a9b2e10580f7ed09ef7a22dd1dc8f280069c  orbittrace_m2d_sacv_topomodal_trunk_core_v1/build_pretruth.py' | sha256sum -c -
          echo '050c6a7aa4acdb868f73667a427fdc5f9e2e3f3a7c9e15e0f1b5ee03c2368a87  orbittrace_m2d_sacv_topomodal_trunk_core_v1/evaluate_truth.py' | sha256sum -c -
          python orbittrace_m2d_sacv_topomodal_trunk_core_v1/instrument_runtime.py | tee /tmp/instrument-hash.txt
          python -m py_compile orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py orbittrace_m2d_sacv_topomodal_trunk_core_v1/build_pretruth.py orbittrace_m2d_sacv_topomodal_trunk_core_v1/evaluate_truth.py
          python - <<'PY'
          from pathlib import Path
          before=Path('/tmp/fallback-before-instrument.py').read_text()
          after=Path('orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py').read_text()
          assert before != after
          for literal in [
              "top_ref=bool(top22 and top23 and any(e['a']==top22['id'] and e['b']==top23['id'] for e in edges))",
              "o=sorted(set(top22['members'])|set(top23['members']));ref=True;route='sacv_v1_success';win=None",
              "win=comps[0];o=list(win['member_ids']);ref=True;route='recurrence_fallback'",
              "win=None;o=ids;ref=False;route='parent_fallback'",
              "comps.sort(key=lambda z:(-z['edge_count'],-z['node_count'],-z['min_cross_support'],z['member_n'],z['membership_hash']))",
          ]:
              assert literal in before and literal in after, literal
          assert after.count("'selected_graph_nodes':selected_graph_nodes") == 1
          assert after.count("'selected_graph_edges':selected_graph_edges") == 1
          assert after.count('selected_graph_nodes=[];selected_graph_edges=[]') == 1
          print('PASS_INSTRUMENTATION_PRESERVES_FROZEN_ROUTE_LITERALS')
          PY
      - name: Audit TopoModal rule and inherited evaluator contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          b=Path('orbittrace_m2d_sacv_topomodal_trunk_core_v1/build_pretruth.py').read_text()
          e=Path('orbittrace_m2d_sacv_topomodal_trunk_core_v1/evaluate_truth.py').read_text()
          ast.parse(b);ast.parse(e)
          required=[
            "Tomato(graph_type='manual', density_type='manual')",
            "rho = np.asarray([len(a) / float(len(node_ids)) for a in neighbors]",
            "strict_hypothesis",
            "strict_event",
            "MIN_ANNUAL_SUPPORT = 4",
            "best_n = max(x[0] for x in reportable)",
            "primary_ids == oracle_ids",
          ]
          for x in required: assert x in b, x
          assert 'base.core_gates' not in e
          assert 'base.main()' in e and 'VERDICT_MAP' in e
          print('PASS_TOPOMODAL_SOURCE_CONTRACT')
          PY
      - name: Audit complete generated binding runner
        run: |
          set -euo pipefail
          echo 'ac7960c944b881b02e47572e767e97eaafde1074831446be3a410f9a87e0ae0a  orbittrace_m2d_sacv_dual_output_core_v1/make_runner.py' | sha256sum -c -
          python orbittrace_m2d_sacv_dual_output_core_v1/make_runner.py
          echo '9e0d533ddfd89bfa9a53fbbedafcb11a62bf4e33e69d7c31a9500633f8c5d8c0  orbittrace_m2d_sacv_dual_output_core_v1/run_binding.generated.sh' | sha256sum -c -
          echo '9ef6b20bda4acb27a317ef440db25fbd8c2137d01d5847ef6d80cd931985079d  orbittrace_m2d_sacv_topomodal_trunk_core_v1/make_runner.py' | sha256sum -c -
          python -m py_compile orbittrace_m2d_sacv_topomodal_trunk_core_v1/make_runner.py
          python orbittrace_m2d_sacv_topomodal_trunk_core_v1/make_runner.py | tee /tmp/generated-runner-hash.txt
          bash -n orbittrace_m2d_sacv_topomodal_trunk_core_v1/run_binding.generated.sh
          grep -F 'PASS_AUDITED_INSTRUMENTED_FALLBACK_RUNTIME' orbittrace_m2d_sacv_topomodal_trunk_core_v1/run_binding.generated.sh
          grep -F 'TARGET_EXCLUDED_SACV_PRIMARY_PLUS_TOPOMODAL_TRUNK_RECURRENT_CORE_FROZEN_BEFORE_SHOWER_TRUTH' orbittrace_m2d_sacv_topomodal_trunk_core_v1/run_binding.generated.sh
          echo PASS_TOPOMODAL_GENERATED_RUNNER_AUDIT
      - name: Record zero-data audit boundary
        run: |
          echo 'ZERO_DATA_AUDIT_ONLY=true'
          echo 'GMN_CATALOGUE_ACCESSED=false'
          echo 'SHOWER_TRUTH_ACCESSED=false'
          echo 'ORBITTRACE_TARGET_INFORMATION_ACCESSED=false'
          echo 'SONOTACO_ACCESSED=false'
