name: NOP solution 004 provenance audit

on:
  pull_request:
    branches:
      - main
    paths:
      - nop_solution004_audit/**
      - .github/workflows/nop_solution004_audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nop-solution004-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-classification-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verified audit launcher
        run: |
          python -m py_compile \
            nop_solution004_audit/run_nop_solution004_audit.py \
            nop_solution004_audit/audit_nop_solution004_source.py
      - name: Run frozen provenance and coherence gate
        id: audit_run
        continue-on-error: true
        run: |
          mkdir -p nop_solution004_audit/cache nop_solution004_audit/results
          python nop_solution004_audit/run_nop_solution004_audit.py \
            --cache nop_solution004_audit/cache \
            --output nop_solution004_audit/results
      - name: Record provenance
        if: always()
        run: |
          mkdir -p nop_solution004_audit/results
          sha256sum \
            nop_solution004_audit/run_nop_solution004_audit.py \
            nop_solution004_audit/audit_nop_solution004_source.py \
            nop_solution004_audit/AUDIT_GATE.md \
            > nop_solution004_audit/results/source_sha256.txt
          find nop_solution004_audit/cache -type f -print0 | sort -z | xargs -0 -r sha256sum \
            > nop_solution004_audit/results/downloaded_source_sha256.txt
          find nop_solution004_audit/cache -type f -printf '%P\t%s bytes\n' | sort \
            > nop_solution004_audit/results/downloaded_source_inventory.txt
          python --version > nop_solution004_audit/results/python_version.txt
          printf '%s\n' '${{ steps.audit_run.outcome }}' > nop_solution004_audit/results/audit_step_outcome.txt
      - name: Upload solution 004 audit evidence and exact downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nop-solution004-provenance-audit
          path: |
            nop_solution004_audit/results
            nop_solution004_audit/cache
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failed gate status
        if: steps.audit_run.outcome == 'failure'
        run: exit 1
