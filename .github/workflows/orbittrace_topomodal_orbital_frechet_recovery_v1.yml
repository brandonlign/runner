name: OrbitTrace topomodal orbital Frechet recovery v1

on:
  push:
    branches:
      - agent/orbittrace-topomodal-orbital-frechet-recovery-v1
    paths:
      - '.github/workflows/orbittrace_topomodal_orbital_frechet_recovery_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  prelabel:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 312b1b718ae105813de242355142a74e7d377d65
          path: frozen-intrinsic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and audit pretruth sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0' 'requests==2.32.5' 'beautifulsoup4==4.12.3' 'pandas==2.2.3' 'click==8.0.4' 'future==1.0.0'
          python -m pip install --no-deps 'gmn-python-api==0.0.13'
          mkdir -p input/structural input/orbit input/manifest output
          test "$(git hash-object orbittrace_topomodal_orbital_frechet_v1/PROTOCOL.md)" = '08bd4640d4f10360a69cb5fc9be0a1804b4b72f6'
          test "$(git hash-object orbittrace_topomodal_orbital_frechet_v1/generate_prelabel.py)" = '2b5cd3d70881bd3ed674081988be07dcfeaaa362'
          test "$(git hash-object orbittrace_topomodal_orbital_frechet_v1/evaluate_prelabel.py)" = 'b7748d112d036b8c429fd866c24f71d983da6502'
          test "$(git -C frozen-intrinsic hash-object orbittrace_topomodal_sparse_recovery_v1/run_development.py)" = '752df8212ce601227f6e9170b0fe994ba06b515d'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          ! grep -Eq 'parse_catalogue|hidden_sealed|hidden_truth|eligible_labels|metrics\(' orbittrace_topomodal_orbital_frechet_v1/generate_prelabel.py
          python -m py_compile orbittrace_topomodal_orbital_frechet_v1/generate_prelabel.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-hierarchy-scale-v1
          path: input/structural
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31955621864
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-orbit-availability-v1
          path: input/orbit
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31978330061
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-numstat-availability-v1
          path: input/manifest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31972929547
      - name: Verify immutable prerequisites without truth
        run: |
          set -euo pipefail
          test "$(sha256sum input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json | cut -d' ' -f1)" = 'e8cf7d92e96db9a1c99578f6efc63baf1534b94ab975e94f789fa6bc4a718497'
          test "$(sha256sum input/manifest/EXACT_1284_SPARSE_UNIVERSE_MANIFEST_V1.json | cut -d' ' -f1)" = '3ed5c33216d7d1cf2cbc703da088b3a86132e50532fb996cfe475d7f6052d7f8'
          test "$(sha256sum input/orbit/audited_union_orbit_mapping.json | cut -d' ' -f1)" = 'a99fdc71beb8ea78b957c0951191c66bf8c04e6ce04773952ac0c43695619f44'
          python - <<'PY'
          import json
          r=json.load(open('input/orbit/TOPOMODAL_ORBIT_AVAILABILITY_V1.json'))
          assert r['verdict']=='PASS_TOPOMODAL_ORBIT_AVAILABILITY_V1'
          assert r['orbit_mapping_sha256']=='a99fdc71beb8ea78b957c0951191c66bf8c04e6ce04773952ac0c43695619f44'
          assert all(v['all_events_usable'] is True for v in r['subset_stats'].values())
          assert r['shower_truth_parsed'] is False and r['d_sh_computed'] is False and r['target_information_access'] is False
          print('PASS_ORBITAL_FRECHET_PRETRUTH_PREREQUISITES')
          PY
      - name: Generate frozen label-inaccessible prelabel
        env:
          PYTHONPATH: .:orbittrace_recurrent_eom_hdbscan_v1
        run: |
          set -euo pipefail
          python -u orbittrace_topomodal_orbital_frechet_v1/generate_prelabel.py \
            --intrinsic-runner frozen-intrinsic/orbittrace_topomodal_sparse_recovery_v1/run_development.py \
            --structural-runner orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --structural-result-json input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json \
            --orbit-mapping input/orbit/audited_union_orbit_mapping.json \
            --availability-result input/orbit/TOPOMODAL_ORBIT_AVAILABILITY_V1.json \
            --universe-manifest input/manifest/EXACT_1284_SPARSE_UNIVERSE_MANIFEST_V1.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --output output
      - name: Seal prelabel before any truth job exists
        run: |
          set -euo pipefail
          sha256sum output/TOPOMODAL_ORBITAL_FRECHET_V1_PRELABEL.json | cut -d' ' -f1 > output/prelabel_sha256.txt
          python - <<'PY'
          import hashlib,json
          raw=open('output/TOPOMODAL_ORBITAL_FRECHET_V1_PRELABEL.json','rb').read(); d=hashlib.sha256(raw).hexdigest(); p=json.loads(raw)
          assert d==open('output/prelabel_sha256.txt').read().strip()
          assert p['schema']=='ORBITTRACE_TOPOMODAL_ORBITAL_FRECHET_V1_PRELABEL'
          assert p['scientific_role']=='PRELABEL_TOPOMODAL_ORBITAL_FRECHET_V1'
          assert p['orbit_mapping_sha256']=='a99fdc71beb8ea78b957c0951191c66bf8c04e6ce04773952ac0c43695619f44'
          assert p['candidate_budget_shortage_any_panel'] is False and len(p['subsets'])==8
          assert p['shower_truth_used'] is False and p['shower_truth_parsed'] is False
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          print('IMMUTABLE_ORBITAL_FRECHET_PRELABEL_SHA256',d)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-topomodal-orbital-frechet-v1-prelabel
          path: |
            output/TOPOMODAL_ORBITAL_FRECHET_V1_PRELABEL.json
            output/prelabel_sha256.txt
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: prelabel
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 312b1b718ae105813de242355142a74e7d377d65
          path: frozen-intrinsic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and audit frozen evaluator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/v3 input/v8 input/ranker prelabel output
          test "$(git hash-object orbittrace_topomodal_orbital_frechet_v1/PROTOCOL.md)" = '08bd4640d4f10360a69cb5fc9be0a1804b4b72f6'
          test "$(git hash-object orbittrace_topomodal_orbital_frechet_v1/evaluate_prelabel.py)" = 'b7748d112d036b8c429fd866c24f71d983da6502'
          test "$(git -C frozen-intrinsic hash-object orbittrace_topomodal_sparse_recovery_v1/run_development.py)" = '752df8212ce601227f6e9170b0fe994ba06b515d'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_topomodal_orbital_frechet_v1/evaluate_prelabel.py
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py)
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-orbital-frechet-v1-prelabel
          path: prelabel
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Bind immutable prelabel before truth
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          ACTUAL="$(sha256sum prelabel/TOPOMODAL_ORBITAL_FRECHET_V1_PRELABEL.json | cut -d' ' -f1)"
          test "$ACTUAL" = "$(cat prelabel/prelabel_sha256.txt)"
          echo "BOUND_ORBITAL_FRECHET_PRELABEL_SHA256=$ACTUAL"
          python - <<'PY'
          import json
          p=json.load(open('prelabel/TOPOMODAL_ORBITAL_FRECHET_V1_PRELABEL.json'))
          assert p['shower_truth_used'] is False and p['shower_truth_parsed'] is False
          assert p['candidate_budget_shortage_any_panel'] is False and len(p['subsets'])==8
          assert p['blind_exclusion']==[20.0,55.0] and p['target_information_access'] is False
          print('PASS_SEALED_PRELABEL_TRUTH_BOUNDARY')
          PY
      - name: Evaluate sealed prelabel exactly once
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_topomodal_orbital_frechet_v1/evaluate_prelabel.py \
            --intrinsic-runner frozen-intrinsic/orbittrace_topomodal_sparse_recovery_v1/run_development.py \
            --prelabel prelabel/TOPOMODAL_ORBITAL_FRECHET_V1_PRELABEL.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output
      - name: Enforce binding truth result
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='prelabel/TOPOMODAL_ORBITAL_FRECHET_V1_PRELABEL.json'; r=json.load(open('output/TOPOMODAL_ORBITAL_FRECHET_V1.json'))
          assert r['schema']=='ORBITTRACE_TOPOMODAL_ORBITAL_FRECHET_V1'
          assert r['verdict'] in {'PASS_TOPOMODAL_ORBITAL_FRECHET_V1','FAIL_TOPOMODAL_ORBITAL_FRECHET_V1'}
          assert r['prelabel_sha256']==hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert len(r['gates'])==10 and len(r['panels'])==16
          assert r['blind_exclusion']==[20.0,55.0] and r['target_information_access'] is False and r['target_region_events_accessed'] is False
          print(r['verdict']); print(json.dumps({'scales':r['scale_aggregates'],'gates':r['gates']},indent=2,sort_keys=True))
          PY
      - name: Preserve truth provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum orbittrace_topomodal_orbital_frechet_v1/PROTOCOL.md orbittrace_topomodal_orbital_frechet_v1/evaluate_prelabel.py prelabel/TOPOMODAL_ORBITAL_FRECHET_V1_PRELABEL.json output/TOPOMODAL_ORBITAL_FRECHET_V1.json > output/source_input_output_sha256.txt 2>/dev/null || true
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-topomodal-orbital-frechet-v1-result
          path: output
          if-no-files-found: error
          retention-days: 90
