name: ISEF IMAP IDEX metadata event-count probe

on:
  push:
    branches: [main]
    paths:
      - 'isef/IMAP_IDEX_RECORD_COUNT_TRIGGER'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata probe dependencies
        run: pip install requests cdflib
      - name: Count CDF records without science values
        run: |
          python -m py_compile isef/imap_idex_record_count_probe.py
          cd isef
          python imap_idex_record_count_probe.py
      - name: Preserve metadata-only event count
        uses: actions/upload-artifact@v4
        with:
          name: isef-imap-idex-record-count-probe
          path: isef/results/imap_idex_record_count_probe/report.json
          if-no-files-found: error
