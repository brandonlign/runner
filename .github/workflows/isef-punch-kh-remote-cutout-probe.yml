name: ISEF PUNCH KH remote cutout probe
on:
  push:
    branches: [main]
    paths:
      - 'isef/punch_kh_remote_cutout_probe.py'
      - '.github/workflows/isef-punch-kh-remote-cutout-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy astropy requests 'fsspec[http]'
      - run: python isef/punch_kh_remote_cutout_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-punch-kh-remote-cutout-probe
          path: results/punch_kh_remote_cutout_probe/
          if-no-files-found: error
