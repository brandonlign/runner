name: ISEF HETDEX XMPG VizieR control probe
on:
  push:
    paths:
      - 'isef/hetdex_xmpg_vizier_control_probe.py'
      - '.github/workflows/isef-hetdex-xmpg-vizier-control-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'astroquery>=0.4.11'
      - run: timeout 600s python isef/hetdex_xmpg_vizier_control_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-hetdex-xmpg-vizier-controls
          path: results/hetdex_xmpg_vizier_control_probe.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY' >/tmp/r.md
          import json
          from pathlib import Path
          print('## HETDEX XMPG VizieR HPSC1 control probe')
          p=Path('results/hetdex_xmpg_vizier_control_probe.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:60000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
