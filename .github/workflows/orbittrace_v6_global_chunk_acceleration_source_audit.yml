name: OrbitTrace v6 global chunk acceleration source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-exact-sharded-acceleration
    paths:
      - 'orbittrace_v6_global_chunk_acceleration/**'
      - '.github/workflows/orbittrace_v6_global_chunk_acceleration_source_audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-global-chunk-acceleration
          path: audit
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - name: Audit global chunk plan and exact-function boundary
        run: |
          set -euo pipefail
          test ! -e input
          export FROZEN_V6_DIR="$PWD/frozen-v6" EXECUTION_DIR="$PWD/audit"
          bash audit/orbittrace_v6_exact_sharded_acceleration/reconstruct_exact_sources.sh
          PYTHONPATH=audit python - <<'PY'
          import ast, hashlib
          from pathlib import Path
          from orbittrace_v6_global_chunk_acceleration.common import CHUNK_SIZE, GLOBAL_SHARD_COUNT, build_plan, validate_center_chunks

          root=Path('audit/orbittrace_v6_global_chunk_acceleration')
          for path in [root/'common.py',root/'run_exact_global_shard.py',root/'assemble_global_chunks.py']:
              compile(path.read_text(),str(path),'exec')
              print(path.name+'_SHA256='+hashlib.sha256(path.read_bytes()).hexdigest())
          assert CHUNK_SIZE==512 and GLOBAL_SHARD_COUNT==16

          run=(root/'run_exact_global_shard.py').read_text()
          assert run.count('v6.exact_rescore_window_v6(')==1
          assert 'records = [dict(row) for row in full_records[start:stop]]' in run
          assert 'proposal_anchor_ids(output) == proposal_anchor_ids(records)' in run
          for forbidden in ('np.arccos','exact_anchor_distances(','v3_details(','quartet_score(','build_family_track_v6','evaluate_families_v6'):
              assert forbidden not in run, forbidden

          assemble=(root/'assemble_global_chunks.py').read_text()
          assert 'combined.extend(task["exact_rows"])' in assemble
          assert 'proposal_anchor_ids(combined) == proposal_anchor_ids(original)' in assemble
          assert 'format": "orbittrace-v6-exact-shard-result-v1"' in assemble
          assert 'assembled_from_verified_contiguous_chunks' in assemble
          for forbidden in ('scan_year_v6(','build_family_track_v6','evaluate_families_v6'):
              assert forbidden not in assemble, forbidden

          # The reconstructed exact function must still expose the audited scalar
          # per-record loop. Accept direct `records` iteration or wrappers such as
          # `enumerate(records)`; both are still one scalar record stream.
          text=Path('/tmp/run_v3_primary_catalogue_v6.repaired.py').read_text()
          tree=ast.parse(text)
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='exact_rescore_window_v6')
          loops=[
              n for n in ast.walk(fn)
              if isinstance(n,ast.For)
              and any(isinstance(x,ast.Name) and x.id=='records' and isinstance(x.ctx,ast.Load) for x in ast.walk(n.iter))
          ]
          assert len(loops)==1, len(loops)
          assert any(isinstance(n,ast.Return) for n in ast.walk(fn))

          def prep(year, counts):
              rb={f'{i*5:.1f}':[{'proposal_anchor_id':f'{year}-{i}-{j}'} for j in range(c)] for i,c in enumerate(counts)}
              return {'records_by_center':rb,'window_event_count_by_center':{k:1000+i*100 for i,k in enumerate(rb)}}
          preparations={2022:prep(2022,[1,512,513,2048]),2023:prep(2023,[17,1025,3000])}
          plan1=build_plan(preparations); plan2=build_plan(preparations)
          assert plan1==plan2
          assert plan1['shard_count']==16 and plan1['chunk_size']==512
          original=sum(len(v) for p in preparations.values() for v in p['records_by_center'].values())
          assert plan1['proposal_count']==original
          all_tasks=[t for shard in plan1['shards'] for t in shard['tasks']]
          for year,p in preparations.items():
              for center,rows in p['records_by_center'].items():
                  validate_center_chunks(all_tasks,len(rows),year,center)
          assert sum(s['proposal_count'] for s in plan1['shards'])==original
          print('PASS_V6_GLOBAL_CHUNK_ACCELERATION_SOURCE_AUDIT')
          PY
      - name: Assert source-only and dormant boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          test ! -e audit/orbittrace_v6_global_chunk_acceleration/RUN.md
          echo 'NO_CATALOGUE_NO_LABEL_VALUE_NO_TARGET_ACCESS_NO_SCIENTIFIC_EXECUTION'
