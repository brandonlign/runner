name: OrbitTrace wavelet 2023 runner source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-wavelet-episode-development
    paths:
      - .github/workflows/orbittrace_wavelet_2023_runner_source_audit.yml
      - orbittrace_literature_freeze/sonotaco_2023_runner_parts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-wavelet-episode-2023-transfer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode and preserve the immutable 2023 runner without catalogue access
        run: |
          set -euo pipefail
          mkdir -p output
          echo '0e3af3c5f2b8f2265f5f67cbbd3e43616e3ccc7ca7cd3b5ebfe01f920fbb18ca  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part00.b64' | sha256sum -c -
          echo 'ccfbed79a2c50f0e9768badb58700696ce6401961d1e85f412d3962211d2b8f1  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part01_sub00.b64' | sha256sum -c -
          echo '2904c359c237671e4a20d3d18606f7a4ca91b472d1298c8c5d8c5c6d4753c5aa  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part01_sub01.b64' | sha256sum -c -
          echo '721719076fd28015b2ff7ff0d299b69b77e3bd774fc9adf1705cbfce52702a3c  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part01_sub02.b64' | sha256sum -c -
          echo '8bfbfd7e5deb22d64c1687767b9c7a10ecb28573c6b4dac01548e7d9102a54d1  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part01_sub03.b64' | sha256sum -c -
          echo 'a1c0da4f5a52ff9495b578e6becd4e58bb902b3b38251ffd04cb1fbc31f463e0  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part02.b64' | sha256sum -c -
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path('orbittrace_literature_freeze/sonotaco_2023_runner_parts')
          names = (
              'part00.b64',
              'part01_sub00.b64', 'part01_sub01.b64', 'part01_sub02.b64', 'part01_sub03.b64',
              'part02.b64',
          )
          encoded = ''.join(''.join((root / name).read_text().split()) for name in names)
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = '582c2bc4c9d947d3d0b86aaf201e30b57eb85d24fd587dbbcd49b483065fc747'
          if digest != expected:
              raise RuntimeError(f'2023 runner source mismatch: {digest}')
          compile(source, 'run_sonotaco_2023_literature_comparison.py', 'exec')
          Path('output/run_sonotaco_2023_literature_comparison.py').write_bytes(source)
          Path('output/source_audit.json').write_text(json.dumps({
              'verdict': 'PASS_WAVELET_2023_RUNNER_SOURCE_AUDIT',
              'source_sha256': digest,
              'catalogue_access': False,
              'score_access': False,
              'purpose': 'inspect exact frozen transfer interfaces before adding the wavelet episode score'
          }, indent=2) + '\n')
          print('PASS_WAVELET_2023_RUNNER_SOURCE_AUDIT', digest)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-wavelet-2023-runner-source-audit
          path: output
          if-no-files-found: error
          retention-days: 90
