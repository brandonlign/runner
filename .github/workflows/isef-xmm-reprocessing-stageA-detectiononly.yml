name: ISEF XMM reprocessing Stage A detection-only
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_reprocessing_population_stageA_detectiononly.py'
      - '.github/workflows/isef-xmm-reprocessing-stageA-detectiononly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install astropy numpy scipy
      - run: python isef/xmm_reprocessing_population_stageA_detectiononly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-reprocessing-stageA-detectiononly
          path: results/xmm_reprocessing_population_stageA_detectiononly.json
          if-no-files-found: error
