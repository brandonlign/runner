name: OrbitTrace v6 literature adapter source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - orbittrace_v6_literature_adapter/**
      - .github/workflows/orbittrace_v6_literature_adapter_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-literature-adapter-freeze

      - name: Compile and inspect adapter
        run: |
          set -euo pipefail
          test ! -e input
          python -m py_compile orbittrace_v6_literature_adapter/adapter.py
          python - <<'PY'
          import ast, hashlib, importlib.util
          from pathlib import Path

          path=Path('orbittrace_v6_literature_adapter/adapter.py')
          text=path.read_text()
          tree=ast.parse(text)
          print('ADAPTER_SHA256='+hashlib.sha256(path.read_bytes()).hexdigest())
          defs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          required={
              'configure_transfer_modules',
              'calibration_events_from_native_sporadic',
              'run_v6_panel',
              'native_sporadic_ids_from_parser_outputs',
          }
          assert required <= set(defs), sorted(set(defs))

          # Source boundary: pre-ranking helper may retain IDs only; no label,
          # complex_key or per-shower value is read from labeled events.
          fn=defs['native_sporadic_ids_from_parser_outputs']
          src=ast.get_source_segment(text,fn)
          assert 'event["id"]' in src
          assert 'event["complex_key"]' not in src
          assert 'event["label"]' not in src

          # Rescue must never be fed into the primary builder/payload.
          run_src=ast.get_source_segment(text,defs['run_v6_panel'])
          assert 'build_family_track_v6(old, all_components, base, "v3")' in run_src
          assert 'build_family_track_v6(old, all_components, base, "fixed4_rescue")' in run_src
          assert 'primary_families + rescue_families' not in run_src
          assert 'primary_ranking_sha256_before_truth' in run_src

          spec=importlib.util.spec_from_file_location('adapter',path)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          assert mod.YEARS==(2023,2025)
          assert mod.CORPUS=='sonotaco-v6-exact-row-literature'
          assert mod.BLIND_LOW==20.0 and mod.BLIND_HIGH==55.0
          assert mod.FROZEN_V6_SHA256=='a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9'
          assert mod.SUPPORT_SOURCE_SHA256=='fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62'

          # Bounded synthetic test of calibration semantics only.
          scan={
              2023:[{'id':f'SNM2023:{i}','sol':0.0,'complex_key':'HIDDEN'} for i in range(1200)],
              2025:[{'id':f'SNM2025:{i}','sol':0.0,'complex_key':'HIDDEN'} for i in range(1200)],
          }
          sporadic={2023:{f'SNM2023:{i}' for i in range(1100)},2025:{f'SNM2025:{i}' for i in range(1100)}}
          cal=mod.calibration_events_from_native_sporadic(scan,sporadic)
          assert len(cal[2023])==1100 and len(cal[2025])==1100
          assert all(e['complex_key']=='SPORADIC' for y in mod.YEARS for e in cal[y])
          assert {e['id'] for e in cal[2023]}==sporadic[2023]
          print('PASS_V6_LITERATURE_ADAPTER_SOURCE_AUDIT')
          PY

      - name: Assert no-data boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          echo 'NO_SONOTACO_ARCHIVE_NO_ASSIGNMENT_ARTIFACT_NO_LABEL_VALUE_NO_TARGET_ACCESS'
