name: OrbitTrace v6 literature adapter source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - orbittrace_v6_literature_adapter/**
      - .github/workflows/orbittrace_v6_literature_adapter_source_audit.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-literature-adapter-freeze

      - name: Audit native background-token semantics only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e input
          mkdir -p /tmp/parser2023
          gh run download 30920687116 \
            --repo "$GITHUB_REPOSITORY" \
            --name sonotaco-2023-confirmation-source-repair-v2 \
            --dir /tmp/parser2023
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  /tmp/parser2023/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          cat sonotaco_mondrian_development/source_parts/part*.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress \
            > /tmp/sonotaco_2025_native.py
          echo '5e6d7a6545d83902362cc06c2fae5d285ae92eb2e8e1d7d42fd9769862ebf518  /tmp/sonotaco_2025_native.py' | sha256sum -c -
          python - <<'PY'
          import ast
          from pathlib import Path
          def fn_ast(path,name):
              text=Path(path).read_text(); tree=ast.parse(text)
              fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name==name)
              print(f'{path}:{name}='+ast.get_source_segment(text,fn))
              return ast.dump(fn,include_attributes=False)
          assert fn_ast('/tmp/parser2023/run_sonotaco_2023_fixed4_confirmation.py','background_token') == fn_ast('/tmp/sonotaco_2025_native.py','background_token')
          print('PASS_IDENTICAL_SONOTACO_2023_2025_NATIVE_BACKGROUND_TOKEN_RULE')
          PY

      - name: Compile and inspect all adapter stages
        run: |
          set -euo pipefail
          test ! -e input
          python -m py_compile \
            orbittrace_v6_literature_adapter/adapter.py \
            orbittrace_v6_literature_adapter/prepare_id_manifest.py \
            orbittrace_v6_literature_adapter/run_pretruth.py \
            orbittrace_v6_literature_adapter/run_pretruth_year.py \
            orbittrace_v6_literature_adapter/combine_pretruth.py \
            orbittrace_v6_literature_adapter/evaluate_frozen.py
          python - <<'PY'
          import ast, hashlib, importlib.util, pickle
          from pathlib import Path

          root=Path('orbittrace_v6_literature_adapter')
          names=('adapter.py','prepare_id_manifest.py','run_pretruth.py','run_pretruth_year.py','combine_pretruth.py','evaluate_frozen.py','PROTOCOL.md')
          for name in names:
              print(name+'_SHA256='+hashlib.sha256(root.joinpath(name).read_bytes()).hexdigest())

          def arg_flags(path):
              tree=ast.parse(Path(path).read_text()); out=[]
              for node in ast.walk(tree):
                  if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr=='add_argument' and node.args and isinstance(node.args[0],ast.Constant):
                      out.append(node.args[0].value)
              return set(out)

          path=root/'adapter.py'; text=path.read_text(); tree=ast.parse(text)
          defs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          required={'configure_transfer_modules','native_background_token','native_background_ids_from_tokens','calibration_events_from_native_sporadic','run_v6_panel'}
          assert required <= set(defs)
          assert 'native_sporadic_ids_from_parser_outputs' not in defs
          bg_src=ast.get_source_segment(text,defs['native_background_token'])
          assert 'token.startswith("SPO")' in bg_src and 'ASCII_LETTER.search(token) is None' in bg_src
          ids_fn=defs['native_background_ids_from_tokens']
          assert not any(isinstance(n,ast.Subscript) and isinstance(n.slice,ast.Constant) and n.slice.value in {'complex_key','iau','code','label'} for n in ast.walk(ids_fn))
          run_src=ast.get_source_segment(text,defs['run_v6_panel'])
          assert 'build_family_track_v6(old, all_components, base, "v3")' in run_src
          assert 'build_family_track_v6(old, all_components, base, "fixed4_rescue")' in run_src
          assert 'primary_families + rescue_families' not in run_src
          assert 'primary_ranking_sha256_before_truth' in run_src

          spec=importlib.util.spec_from_file_location('adapter',path)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          assert mod.YEARS==(2023,2025) and mod.CORPUS=='sonotaco-v6-exact-row-literature'
          assert mod.BLIND_LOW==20.0 and mod.BLIND_HIGH==55.0
          assert mod.FROZEN_V6_SHA256=='a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9'
          assert mod.SUPPORT_SOURCE_SHA256=='fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62'
          for token,expected in {'':True,'SPO':True,'SPO_JA':True,'123':True,'PER_JA':False,'XYZ_JA':False,'UNMAPPED_SHOWER':False}.items():
              assert mod.native_background_token(token) is expected

          manifest_text=(root/'prepare_id_manifest.py').read_text()
          assert '"native_tokens"' not in manifest_text and '"shower_tokens"' not in manifest_text
          assert '"native_background_ids": sorted(background_ids' in manifest_text

          forbidden={'--parser-2023','--parser-2025','--mapping-audit','--hdbscan-2023','--hdbscan-2025','--sugar-2023','--sugar-2025'}
          for pre_name in ('run_pretruth.py','run_pretruth_year.py','combine_pretruth.py'):
              flags=arg_flags(root/pre_name)
              assert forbidden.isdisjoint(flags),(pre_name,sorted(flags&forbidden))
              src=(root/pre_name).read_text()
              if pre_name != 'combine_pretruth.py':
                  assert '--exact-row-runner' in flags
              assert 'parser_2023' not in src and 'mapping_audit' not in src

          year_src=(root/'run_pretruth_year.py').read_text()
          assert 'scan_year_v6(' in year_src
          assert 'V6_PANEL_YEAR_START' in year_src and 'V6_PANEL_YEAR_DONE' in year_src
          assert 'pickle.dumps(checkpoint' in year_src
          assert 'primary_families' not in year_src, 'year stage must stop before recurrent family construction'

          comb_src=(root/'combine_pretruth.py').read_text()
          assert 'scan_year_v6(' not in comb_src, 'combiner must not rescan data'
          assert 'build_family_track_v6(old, all_components, base, "v3")' in comb_src
          assert 'build_family_track_v6(old, all_components, base, "fixed4_rescue")' in comb_src
          assert 'primary_ranking_sha256_before_truth' in comb_src
          assert 'pickle.loads(raw)' in comb_src and 'checkpoint SHA mismatch' in comb_src
          assert 'truth_accessed": False' in comb_src and 'competitor_cluster_labels_accessed": False' in comb_src

          # Checkpoint serialization preserves representative nested Python values exactly.
          synthetic={'audit':{'supported_bins':[1,2,3],'x':0.12345678901234568},'anchors':[{'a':1,'b':[2.0,3]}],'components':[{'event_ids':['x','y']}], 'flags':(True,None)}
          raw=pickle.dumps(synthetic,protocol=pickle.HIGHEST_PROTOCOL)
          assert pickle.loads(raw)==synthetic
          assert hashlib.sha256(raw).hexdigest()==hashlib.sha256(raw).hexdigest()

          ev=(root/'evaluate_frozen.py').read_text()
          assert 'parse_common_truth' in ev
          assert 'BROAD_CATALOGUE_SUPERIORITY' in ev and 'SPARSE_STREAM_SUPERIORITY' in ev
          assert 'pairwise_only_no_cross_denominator_comparison' in ev
          assert 'macro_f1_gain_ge_0_05' in ev
          assert 'four_to_nine_gain_ge_0_10' in ev and 'four_to_twentyfour_gain_ge_0_10' in ev
          print('PASS_V6_CHECKPOINTED_LITERATURE_PIPELINE_SOURCE_AUDIT')
          PY

      - name: Assert no-data boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          echo 'NO_SONOTACO_ARCHIVE_NO_ASSIGNMENT_ARTIFACT_NO_LABEL_VALUE_NO_TARGET_ACCESS'
