name: OrbitTrace M2D pooled reproduce + reveal v1

on:
  push:
    branches:
      - agent/orbittrace-m2d-blind-rediscovery-v1
    paths:
      - '.github/workflows/orbittrace_m2d_pooled_reproduce_reveal_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: orbittrace-m2d-pooled-reproduce-reveal-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  EXPECTED_PRETRUTH_INNER_SHA256: '7ff3b13bc45e19b4b886453b4d8cc3b4f18090bf8a2291e39850540fd69b5e53'
  CANONICAL_ARTIFACT_ID: '8814798136'
  CANONICAL_ARTIFACT_SHA256: '716b70313465d5df4bfb092a85a81680e6f618606b71e25470c63c480b6449f5'

jobs:
  reproduce-reveal:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact scientific runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p output input

      - name: Verify frozen method and reveal sources before any catalogue access
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_m2d_blind_rediscovery_v1/run_scan.py)" = '3def559978444e9bde1eab9cf9c3d47b8cbb2944'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py)" = '4988997c023d9df2b504372b4290dcab379a6dcc'
          test "$(sha256sum orbittrace_m2d_blind_rediscovery_v1/internal_mass_exact.cpp | cut -d' ' -f1)" = '4eef6f1b70b5baee5d1983d2480c02d73569b12af868ec23bbb6009d6ca1fa37'
          python -m py_compile orbittrace_m2d_blind_rediscovery_v1/run_scan.py orbittrace_m2d_blind_rediscovery_v1/reveal_pooled_exact_ids.py
          sha256sum orbittrace_m2d_blind_rediscovery_v1/run_scan.py orbittrace_m2d_blind_rediscovery_v1/reveal_pooled_exact_ids.py > output/frozen_source_sha256.txt

      - name: Reproduce target-free complete pooled M2D ranking
        run: |
          set -euo pipefail
          /usr/bin/time -v python -u orbittrace_m2d_blind_rediscovery_v1/run_scan.py \
            --blind-source-parts orbittrace_fixed4_blind_catalogue/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --structural-source orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --support-source orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py \
            --exact-cpp orbittrace_m2d_blind_rediscovery_v1/internal_mass_exact.cpp \
            --output output \
            2>&1 | tee output/reproduction.log

      - name: Require exact historical pretruth reproduction before canonical access
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json, os
          from pathlib import Path
          p=Path('output/orbittrace_m2d_blind_ranked_pretruth.json.gz')
          raw=gzip.decompress(p.read_bytes())
          h=hashlib.sha256(raw).hexdigest()
          expected=os.environ['EXPECTED_PRETRUTH_INNER_SHA256']
          if h != expected:
              raise RuntimeError(f'pooled pretruth did not reproduce: {h} != {expected}')
          r=json.loads(raw)
          assert r['schema']=='ORBITTRACE_M2D_BLIND_REDISCOVERY_V1_PRETRUTH'
          assert r['scientific_role']=='TARGET_FREE_COMPLETE_M2D_RANKING_BEFORE_ORBITTRACE_REVEAL'
          assert r['configuration']['target_interval_exclusion'] is None
          assert r['event_count']==549636
          assert r['candidate_count']==8469
          assert r['support_summary']['covered_event_count']==495659
          assert r['shower_truth_used'] is False
          assert r['orbittrace_target_information_access'] is False
          assert r['orbittrace_canonical_members_access'] is False
          assert r['prior_orbittrace_reveal_access'] is False
          assert r['post_result_parameter_search'] is False
          assert r['implementation_equivalence']['verdict']=='PASS_EXACT_SYNTHETIC_SUPPORT_CUT_EQUIVALENCE'
          print('EXACT_PRETRUTH_REPRODUCTION',h)
          PY
          cp output/ranked_payload_sha256.txt output/PRE_CANONICAL_FREEZE_SHA256.txt

      - name: Retrieve canonical OrbitTrace IDs only after exact pretruth reproduction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q "${EXPECTED_PRETRUTH_INNER_SHA256}" output/PRE_CANONICAL_FREEZE_SHA256.txt
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANONICAL_ARTIFACT_ID}/zip" \
            -o input/canonical.zip
          echo "${CANONICAL_ARTIFACT_SHA256}  input/canonical.zip" | sha256sum -c -

      - name: Exact-ID-only frozen reveal
        run: |
          set -euo pipefail
          python orbittrace_m2d_blind_rediscovery_v1/reveal_pooled_exact_ids.py \
            --pretruth output/orbittrace_m2d_blind_ranked_pretruth.json.gz \
            --canonical-zip input/canonical.zip \
            --output output
          cat output/M2D_POOLED_BLIND_REVEAL.md

      - name: Enforce reveal boundary and verdict schema
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/M2D_POOLED_BLIND_REVEAL.json'))
          assert r['pretruth_inner_sha256']=='7ff3b13bc45e19b4b886453b4d8cc3b4f18090bf8a2291e39850540fd69b5e53'
          assert r['candidate_count']==8469
          assert r['reveal_operation']=='exact event-ID set intersection only'
          assert r['coordinates_used'] is False
          assert r['activity_interval_used'] is False
          assert r['orbit_matching_used'] is False
          assert r['member_expansion_used'] is False
          assert r['reranking_used'] is False
          assert r['verdict'] in {'FULL_M2D_BLIND_ORBITTRACE_REDISCOVERY','PARTIAL_M2D_BLIND_ORBITTRACE_REDISCOVERY','NO_M2D_BLIND_ORBITTRACE_REDISCOVERY'}
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Preserve binding reproduction and reveal provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum \
            orbittrace_m2d_blind_rediscovery_v1/PROTOCOL.md \
            orbittrace_m2d_blind_rediscovery_v1/run_scan.py \
            orbittrace_m2d_blind_rediscovery_v1/reveal_pooled_exact_ids.py \
            orbittrace_m2d_blind_rediscovery_v1/internal_mass_exact.cpp \
            output/orbittrace_m2d_blind_ranked_pretruth.json.gz \
            input/canonical.zip \
            output/M2D_POOLED_BLIND_REVEAL.json \
            > output/BINDING_SHA256SUMS.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-pooled-reproduce-reveal-v1
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Post binding result to PR 1378
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s output/M2D_POOLED_BLIND_REVEAL.md; then
            gh pr comment 1378 --repo "$GITHUB_REPOSITORY" --body-file output/M2D_POOLED_BLIND_REVEAL.md
          elif test -s output/M2D_BLIND_SCAN.md; then
            gh pr comment 1378 --repo "$GITHUB_REPOSITORY" --body "Exact pooled M2D reproduction ran but did not reach a reveal. No new scientific verdict. Workflow $GITHUB_RUN_ID."
          else
            gh pr comment 1378 --repo "$GITHUB_REPOSITORY" --body "Exact pooled M2D reproduction failed before a pretruth ranking was reproduced. No new scientific verdict. Workflow $GITHUB_RUN_ID."
          fi
