name: OrbitTrace SACV v1 component-union postmortem
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/orbittrace-m2d-sacv-v1-final-target]
    paths:
      - 'sacv_postmortem/diagnose_component_union.py'
      - '.github/workflows/orbittrace_sacv_v1_component_union.yml'
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore frozen runtime and sealed final result
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          echo 'd75b76a36911c916620da5e029f82c7987718b1610eb6bd61922015b5ab50d4a  orbittrace_m2d_sacv_v1_source.tgz' | sha256sum -c -
          tar -xzf orbittrace_m2d_sacv_v1_source.tgz
          mkdir -p input/final input/v3
          gh run download 32325604933 --repo "$GITHUB_REPOSITORY" --name orbittrace-m2d-sacv-v1-final-target-result --dir input/final
          test "$(sha256sum input/final/pretruth/M2D_SACV_V1_FINAL_TARGET_PRETRUTH.json | cut -d' ' -f1)" = 'ab5387bbf03e625e70b67f46518438e9526e2eee5d2d8869ff55fc31a53b10fd'
          test "$(sha256sum input/final/reveal/M2D_SACV_V1_FINAL_TARGET_RESULT.json | cut -d' ' -f1)" = '407ce4c79fcacbdfe016ce81fa32250cd0e9f47f63422ac81392c4b9a19ca902'
      - name: Reconstruct exact blind catalogue geometry
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip >/dev/null
          git clone -q --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" frozen-v8
          git -C frozen-v8 fetch -q --no-tags --depth=1 origin c9d6c44704013ba0c9430100e98a29a56b453304
          git -C frozen-v8 checkout -q FETCH_HEAD
          python -m pip install --disable-pip-version-check -r frozen-v8/ghoststream_fixed4_application/requirements.txt >/dev/null
          python -m pip install --disable-pip-version-check --no-deps gmn-python-api==0.0.13 >/dev/null
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0' >/dev/null
          git -C frozen-v8 fetch -q --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null)
          PYTHONPATH=.:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3 python - <<'PY'
          import json,types
          from pathlib import Path
          import sacv_target.build_target_pretruth as bt
          blind=bt.decode_loader(Path('orbittrace_fixed4_blind_catalogue/source_parts'),Path('/tmp/blind_loader.py'))
          blind.YEARS=bt.YEARS; blind.MONTH_KEYS=bt.MONTH_KEYS
          ns=types.SimpleNamespace(candidate_payload=Path('frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64'),baseline_payload=Path('frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64'),scorer_parts=Path('frozen-v8/mondrian_clique_development/source_parts_v2'))
          _c,b,_s=blind.load_sources(ns); byyear,_=blind.parse_catalogue(b)
          events=[]
          for y in bt.YEARS: events.extend(bt.normalize(x) for x in byyear[y])
          assert len(events)==549636 and len({e['id'] for e in events})==549636
          Path('input/events.json').write_text(json.dumps({'events':events},separators=(',',':')))
          print('PASS_EXACT_STAGE_A_GEOMETRY',len(events))
          PY
      - name: Diagnose recurrence-component unions
        run: |
          set -euo pipefail
          mkdir -p output
          python -u sacv_postmortem/diagnose_component_union.py \
            --sacv-source orbittrace_m2d_sacv_v1/build_pretruth.py \
            --diag-source sacv_postmortem/diagnose_rank84.py \
            --events input/events.json \
            --stage-a input/final/pretruth/M2D_SACV_V1_FINAL_TARGET_PRETRUTH.json \
            --result input/final/reveal/M2D_SACV_V1_FINAL_TARGET_RESULT.json \
            --output output/SACV_V1_COMPONENT_UNION_POSTMORTEM.json | tee /tmp/component.txt
      - uses: actions/upload-artifact@v4
        with: {name: orbittrace-sacv-v1-component-union-postmortem, path: output/SACV_V1_COMPONENT_UNION_POSTMORTEM.json, retention-days: 90}
      - name: Post forensic summary
        env: {GH_TOKEN: '${{ github.token }}', PR: '${{ github.event.pull_request.number }}'}
        run: |
          python - <<'PY' > /tmp/post.md
          import json
          r=json.load(open('output/SACV_V1_COMPONENT_UNION_POSTMORTEM.json'))
          print('## SACV v1 recurrence-component union postmortem — diagnostic only')
          print(); print('This is target-aware forensic diagnosis only; it does not define or authorize a successor method.')
          print(f"- validated pairs: `{r['validated_pair_count']}`; components: `{r['component_count']}`")
          for i,c in enumerate(r['components']):
              print(f"- component {i}: nodes `{c['node_count']}`, edges `{c['edge_count']}`, union members `{c['member_union_n']}`, target centers `{c['target_center_nodes']}`, exact target overlap `{c['target_overlap']}/18`, precision/recall/F1 `{c['target_precision']:.6f}/{c['target_recall']:.6f}/{c['target_f1']:.6f}`, target-free ranks edge/node/density/compact `{c['rank_edge_count']}/{c['rank_node_count']}/{c['rank_edge_density']}/{c['rank_compactness']}`")
          PY
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/post.md
