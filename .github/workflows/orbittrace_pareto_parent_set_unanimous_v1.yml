name: OrbitTrace Pareto parent-set unanimous v1
on:
  push:
    branches: [agent/orbittrace-pareto-parent-set-unanimous-v1]
    paths: ['orbittrace_pareto_parent_set_unanimous_v1/ACTIVATE.md']
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-pareto-parent-set-unanimous-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-topomodal-support-resolved-cut-v1
          path: support-cut-src
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-topomodal-hierarchy-scale-v1
          path: structural-src
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and audit frozen science
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/ranker input/v8 input/v3 input/positive output/pretruth
          test "$(git hash-object orbittrace_pareto_parent_set_unanimous_v1/PROTOCOL.md)" = '82b8f9bf19de1322e0c4676f8eadef11b28e3df7'
          test "$(git hash-object orbittrace_pareto_parent_set_unanimous_v1/build_prelabel.py)" = 'e98cccd91899f19416276a170c5fb683570e54f5'
          test "$(git hash-object orbittrace_pareto_parent_set_unanimous_v1/evaluate_truth.py)" = '4c0ce34e2fc57969aeb1ab910f9ec0e7f2f0c21f'
          test "$(git -C support-cut-src hash-object orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py)" = '4988997c023d9df2b504372b4290dcab379a6dcc'
          test "$(git -C structural-src hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_pareto_parent_set_unanimous_v1/build_prelabel.py orbittrace_pareto_parent_set_unanimous_v1/evaluate_truth.py
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-topomodal-pareto-prominence-v1-pretruth
          path: input/positive
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32077197154
      - name: Verify immutable runtime inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test -f input/positive/RECURRENT_TOPOMODAL_PARETO_PROMINENCE_V1_PRELABEL.json
      - name: Build and seal truth-blind parent-set prelabel
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_pareto_parent_set_unanimous_v1/build_prelabel.py \
            --support-cut-generator support-cut-src/orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py \
            --structural-runner structural-src/orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --positive-pareto-prelabel input/positive/RECURRENT_TOPOMODAL_PARETO_PROMINENCE_V1_PRELABEL.json \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/pretruth
          python - <<'PY'
          import hashlib,json
          p='output/pretruth/PARETO_PARENT_SET_UNANIMOUS_V1_PRELABEL.json';r='output/pretruth/PARETO_PARENT_SET_UNANIMOUS_V1_PRETRUTH.json'
          h=hashlib.sha256(open(p,'rb').read()).hexdigest();a=json.load(open(r))
          assert a['verdict']=='PASS_PARETO_PARENT_SET_UNANIMOUS_V1_PRETRUTH'
          assert a['prelabel_sha256']==h and len(a['gates'])==12 and all(a['gates'].values())
          print(json.dumps({'verdict':a['verdict'],'prelabel_sha256':h,'multi_parent_total':a['multi_parent_total'],'panels':a['panels']},indent=2,sort_keys=True))
          PY
          printf '%s\n' "$GITHUB_RUN_ID" > output/pretruth/execution_run_id.txt
          git rev-parse HEAD > output/pretruth/execution_commit.txt
          sha256sum orbittrace_pareto_parent_set_unanimous_v1/PROTOCOL.md orbittrace_pareto_parent_set_unanimous_v1/build_prelabel.py orbittrace_pareto_parent_set_unanimous_v1/evaluate_truth.py output/pretruth/PARETO_PARENT_SET_UNANIMOUS_V1_PRELABEL.json output/pretruth/PARETO_PARENT_SET_UNANIMOUS_V1_PRETRUTH.json > output/pretruth/source_input_output_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-pareto-parent-set-unanimous-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: pretruth
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-pareto-parent-set-unanimous-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and audit frozen truth runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/ranker input/v8 input/v3 input/sealed output/truth
          test "$(git hash-object orbittrace_pareto_parent_set_unanimous_v1/PROTOCOL.md)" = '82b8f9bf19de1322e0c4676f8eadef11b28e3df7'
          test "$(git hash-object orbittrace_pareto_parent_set_unanimous_v1/evaluate_truth.py)" = '4c0ce34e2fc57969aeb1ab910f9ec0e7f2f0c21f'
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pareto-parent-set-unanimous-v1-pretruth
          path: input/sealed
      - name: Rebind sealed pretruth before labels
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='input/sealed/PARETO_PARENT_SET_UNANIMOUS_V1_PRELABEL.json';r='input/sealed/PARETO_PARENT_SET_UNANIMOUS_V1_PRETRUTH.json'
          pre=json.load(open(p));a=json.load(open(r));h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert pre['shower_truth_used'] is False and pre['target_information_access'] is False and pre['target_region_events_accessed'] is False
          assert a['verdict']=='PASS_PARETO_PARENT_SET_UNANIMOUS_V1_PRETRUTH' and a['prelabel_sha256']==h
          assert len(a['gates'])==12 and all(a['gates'].values())
          PY
      - name: Run first binding parent-set truth evaluation
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_pareto_parent_set_unanimous_v1/evaluate_truth.py \
            --prelabel input/sealed/PARETO_PARENT_SET_UNANIMOUS_V1_PRELABEL.json \
            --pretruth input/sealed/PARETO_PARENT_SET_UNANIMOUS_V1_PRETRUTH.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth
      - name: Preserve binding provenance
        if: always()
        run: |
          set +e
          cp input/sealed/PARETO_PARENT_SET_UNANIMOUS_V1_PRELABEL.json output/truth/ 2>/dev/null || true
          cp input/sealed/PARETO_PARENT_SET_UNANIMOUS_V1_PRETRUTH.json output/truth/ 2>/dev/null || true
          printf '%s\n' "$GITHUB_RUN_ID" > output/truth/execution_run_id.txt
          git rev-parse HEAD > output/truth/execution_commit.txt
          python -m pip freeze > output/truth/environment.txt
          sha256sum orbittrace_pareto_parent_set_unanimous_v1/PROTOCOL.md orbittrace_pareto_parent_set_unanimous_v1/build_prelabel.py orbittrace_pareto_parent_set_unanimous_v1/evaluate_truth.py input/sealed/PARETO_PARENT_SET_UNANIMOUS_V1_PRELABEL.json input/sealed/PARETO_PARENT_SET_UNANIMOUS_V1_PRETRUTH.json output/truth/PARETO_PARENT_SET_UNANIMOUS_V1_TRUTH.json > output/truth/source_input_output_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-pareto-parent-set-unanimous-v1-truth
          path: output/truth
          if-no-files-found: error
          retention-days: 90
