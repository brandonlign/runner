name: OrbitTrace P7 year seed-budget development

on:
  pull_request:
    branches:
      - agent/orbittrace-p7-year-seed-budget-freeze
    paths:
      - orbittrace_year_seed_budget_p7/RUN.md

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require one-file child and authoritative P6 scientific no-go
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'orbittrace_year_seed_budget_p7/RUN.md'
          content="$(git show "$HEAD_SHA":orbittrace_year_seed_budget_p7/RUN.md)"
          test "$(printf '%s\n' "$content" | sed -n '1p')" = 'EXECUTE_P7_AFTER_AUTHORITATIVE_P6_SCIENTIFIC_NO_GO'
          test "$(printf '%s\n' "$content" | sed -n '2p')" = '31294731265'
          test "$(printf '%s\n' "$content" | sed -n '3p')" = '9032590228'
          test "$(printf '%s\n' "$content" | wc -l)" -eq 3

          rm -rf input/p6 input/p7 && mkdir -p input/p6 input/p7
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9032590228/zip" -o input/p6.zip
          echo '3b55fa59d3a92802f2ee7802101e6ca67eac8b6f4a026d4d3aedf1f1a68ebffa  input/p6.zip' | sha256sum -c -
          unzip -q input/p6.zip -d input/p6
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          r=json.loads(Path('input/p6/bidirectional_reliability_membership_p6_development.json').read_text())
          assert r['verdict']=='FAIL_BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P6_NO_GO',r['verdict']
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['family_count']==226
          assert r['configuration']['parameter_search'] is False
          assert r['baseline_v8']['qualified_matches']==95
          assert r['baseline_v8']['recovered_at_100']==58
          assert r['p6']['qualified_matches']==92
          assert r['p6']['recovered_at_100']==58
          assert abs(r['p6']['macro_f1']-0.406080535191866)<1e-12
          assert abs(r['p6']['top100_dominant_precision']-0.6899730392593009)<1e-12
          assert abs(r['p6_large_shower']['mean_recall']-0.2699949771688301)<1e-12
          assert abs(r['p6_large_shower']['mean_precision']-0.8818497573322707)<1e-12
          assert r['gates']['qualified_matches_no_regression'] is False
          assert r['gates']['recovery_at_100_no_regression'] is True
          assert r['gates']['top100_dominant_precision_at_least_065'] is True
          assert r['gates']['macro_f1_gain_at_least_008'] is True
          assert r['gates']['large_shower_mean_recall_at_least_15x_v8'] is True
          assert r['gates']['large_shower_mean_precision_at_least_085'] is True
          assert r['diagnostics']['assigned_nonseed_events']==21626
          assert r['hashes']['p6_membership_pretruth_sha256']=='40b0b720ef37427bc2d89aeb71c145683cbc69eff9b56ac5516e87fc34348ff6'
          assert r['hashes']['p6_decisions_pretruth_sha256']=='5e76bbf2fd75acdf1d1bc770dc3c60de338a6388524c956544afe4c1aabc8490'
          raw=gzip.decompress(Path('input/p6/p6_expanded_families.json.gz').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='40b0b720ef37427bc2d89aeb71c145683cbc69eff9b56ac5516e87fc34348ff6'
          assert Path('input/p6/p6_membership_pretruth.sha256').read_text().strip()=='40b0b720ef37427bc2d89aeb71c145683cbc69eff9b56ac5516e87fc34348ff6'
          assert Path('input/p6/p6_decisions_pretruth.sha256').read_text().strip()=='5e76bbf2fd75acdf1d1bc770dc3c60de338a6388524c956544afe4c1aabc8490'
          print('PASS_P7_AUTHORITATIVE_P6_SCIENTIFIC_NO_GO_PREREQUISITE')
          PY

          # Freeze exact P7 membership before any known-shower truth is reopened.
          python orbittrace_year_seed_budget_p7/transform_frozen_p6.py \
            --p6-expanded-families input/p6/p6_expanded_families.json.gz \
            --p6-membership-sha input/p6/p6_membership_pretruth.sha256 \
            --p6-decisions input/p6/p6_decisions_pretruth.json.gz \
            --p6-decisions-sha input/p6/p6_decisions_pretruth.sha256 \
            --output input/p7
          test "$(cat input/p7/p7_membership_pretruth.sha256)" = 'c68dcf21761cdad3048508902a7382039ea543df5b58a6b95a094c7c17f2db7a'
          test "$(cat input/p7/p7_decisions_pretruth.sha256)" = '4ffb9a4a4735788322825aaa24a1adee50ac7f5d13d0aba61c579d4b7b206ba5'
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('input/p7/p7_pretruth_transform.json').read_text())
          assert r['family_count']==226
          assert r['p6_assignments']==21626
          assert r['retained_assignments']==4463
          assert r['dropped_assignments']==17163
          assert r['families_gaining_members']==214
          assert r['budget_binding_family_year_cells']==283
          assert r['budget_binding_families']==174
          assert r['known_shower_truth_accessed'] is False
          assert r['target_information_accessed'] is False
          print('PASS_P7_PRETRUTH_MEMBERSHIP_FROZEN_BEFORE_TRUTH')
          PY

          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_year_seed_budget_p7/RUN.md

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: exact-v8
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct exact frozen evaluator identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/{v3,v8,dsh} output
          echo '7637b6fb310ee3f24f1de8479a34d10c594dc55471eee55b8854e1c28787e8dd  orbittrace_crossyear_two_view_membership_p2/run_development.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2_v1.py
          echo '169ed0a276cdcae628cd830130cfb03d6511a972df50d4dc10ffddfc1c8e05da  /tmp/p2_v1.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2_v1.py /tmp/run_p2_canonical_v2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/run_p2_canonical_v2.py' | sha256sum -c -
          python -m py_compile /tmp/run_p2_canonical_v2.py orbittrace_year_seed_budget_p7/evaluate_frozen_p7.py
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          test "$(git -C exact-v8 rev-parse HEAD)" = 'c9d6c44704013ba0c9430100e98a29a56b453304'

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          python -m py_compile input/v3/multi_anchor_energy_v3.py

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009728299/zip" -o input/v8.zip
          echo '88d2d607e05d027015c338f7e23b64a6195e55ae24f1b2ac745f5e9bc6df599e  input/v8.zip' | sha256sum -c -
          unzip -q input/v8.zip -d input/v8
          echo 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b  input/v8/pooled_year_centroid_v8_development.json' | sha256sum -c -

          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > input/dsh/literature_comparators.py
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  input/dsh/literature_comparators.py' | sha256sum -c -
          python -m py_compile input/dsh/literature_comparators.py
          echo PASS_P7_EXACT_EVALUATOR_IDENTITIES

      - name: Evaluate exact frozen P7 membership against unchanged target-excluded truth
        env:
          PYTHONPATH: input/v3:exact-v8:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python -u orbittrace_year_seed_budget_p7/evaluate_frozen_p7.py \
            --p2-source /tmp/run_p2_canonical_v2.py \
            --p7-expanded-families input/p7/p7_expanded_families.json.gz \
            --p7-membership-sha input/p7/p7_membership_pretruth.sha256 \
            --p7-decisions input/p7/p7_decisions_pretruth.json.gz \
            --p7-decisions-sha input/p7/p7_decisions_pretruth.sha256 \
            --p7-transform-json input/p7/p7_pretruth_transform.json \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --v8-runner exact-v8/orbittrace_pooled_year_centroid_v8/run_development.py \
            --dsh-comparator input/dsh/literature_comparators.py \
            --output output
          cat output/YEAR_SEED_BUDGET_MEMBERSHIP_P7_DEVELOPMENT.md

      - name: Enforce exact frozen P7 result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/year_seed_budget_membership_p7_development.json').read_text())
          assert r['verdict'] in {'PASS_YEAR_SEED_BUDGET_MEMBERSHIP_P7_DEVELOPMENT','FAIL_YEAR_SEED_BUDGET_MEMBERSHIP_P7_NO_GO'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['family_count']==226
          assert r['configuration']['source_p6_run']==31294731265
          assert r['configuration']['source_p6_artifact_id']==9032590228
          assert r['configuration']['parameter_search'] is False
          assert r['baseline_v8']['qualified_matches']==95
          assert r['baseline_v8']['recovered_at_100']==58
          assert r['hashes']['p7_membership_pretruth_sha256']=='c68dcf21761cdad3048508902a7382039ea543df5b58a6b95a094c7c17f2db7a'
          assert r['hashes']['p7_decisions_pretruth_sha256']=='4ffb9a4a4735788322825aaa24a1adee50ac7f5d13d0aba61c579d4b7b206ba5'
          for key in ('exact_v8_226_family_order','exact_v8_seed_members_preserved','v8_baseline_reproduced','exact_dsh_source_identity','p7_membership_frozen_before_truth','p7_decisions_frozen_before_truth','p7_exact_year_seed_budget_identity','p7_every_family_year_addition_count_le_seed_count','p7_strict_subset_of_p6','expansion_nonvacuous'):
              assert r['gates'][key] is True,key
          assert r['diagnostics']['assigned_nonseed_events']==4463
          assert r['diagnostics']['dropped_p6_assignments']==17163
          assert r['diagnostics']['budget_binding_family_year_cells']==283
          print('ORBITTRACE_P7_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'baseline_v8':r['baseline_v8'],'p7':r['p7'],'baseline_large_shower':r['baseline_large_shower'],'p7_large_shower':r['p7_large_shower'],'gates':r['gates'],'diagnostics':r['diagnostics'],'hashes':r['hashes']},indent=2,sort_keys=True))
          print('ORBITTRACE_P7_RESULT_END')
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          cp input/p7/p7_pretruth_transform.json output/ 2>/dev/null || true
          cp input/p7/p7_membership_pretruth.sha256 output/ 2>/dev/null || true
          cp input/p7/p7_decisions_pretruth.sha256 output/ 2>/dev/null || true
          cp input/p7/p7_expanded_families.json.gz output/ 2>/dev/null || true
          cp input/p7/p7_decisions_pretruth.json.gz output/ 2>/dev/null || true
          sha256sum orbittrace_year_seed_budget_p7/transform_frozen_p6.py orbittrace_year_seed_budget_p7/evaluate_frozen_p7.py /tmp/run_p2_canonical_v2.py input/p6/p6_expanded_families.json.gz input/p6/p6_decisions_pretruth.json.gz > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-year-seed-budget-membership-p7-development
          path: output
          if-no-files-found: error
          retention-days: 90
