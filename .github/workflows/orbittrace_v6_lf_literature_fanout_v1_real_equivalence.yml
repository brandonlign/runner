name: OrbitTrace v6-LF literature fanout v1 real equivalence

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-lf-literature-fanout-v1
    paths:
      - orbittrace_v6_lf_literature_fanout_v1/RUN_EQUIVALENCE.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-v6-lf-literature-fanout-v1-real-equivalence
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: .:exact:exact/orbittrace_multi_anchor_energy_v3:orbittrace_wavelet_catalogue_v3:orbittrace_multi_anchor_energy_v3:/tmp
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  equivalence:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Require one-file child and exact v6-LF development PASS
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          test "$files" = 'orbittrace_v6_lf_literature_fanout_v1/RUN_EQUIVALENCE.md'
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          content="$(git show "$HEAD_SHA":orbittrace_v6_lf_literature_fanout_v1/RUN_EQUIVALENCE.md)"
          mode="$(printf '%s\n' "$content" | sed -n '1p')"
          lf_run="$(printf '%s\n' "$content" | sed -n '2p')"
          test "$mode" = 'EXECUTE_V6_LF_LITERATURE_FANOUT_EQUIVALENCE_AFTER_DEVELOPMENT_PASS'
          [[ "$lf_run" =~ ^[0-9]+$ ]]
          test "$(printf '%s\n' "$content" | wc -l)" -eq 2
          test ! -e orbittrace_v6_lf_literature_fanout_v1/RUN_EQUIVALENCE.md

          mapfile -t names < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$lf_run/artifacts" --jq '.artifacts[].name')
          candidates=()
          for name in orbittrace-v6-lf-all-event-null-development-v2 orbittrace-v6-lf-strict-semantic-development; do
            if printf '%s\n' "${names[@]}" | grep -qx "$name"; then candidates+=("$name"); fi
          done
          test "${#candidates[@]}" -eq 1
          rm -rf /tmp/lfdev && mkdir -p /tmp/lfdev
          gh run download "$lf_run" --repo "$GITHUB_REPOSITORY" --name "${candidates[0]}" --dir /tmp/lfdev
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/lfdev/v6_label_free_all_event_null_development.json')
          assert p.exists(), 'v6-LF development result missing'
          r=json.loads(p.read_text())
          assert r['verdict']=='PASS_V6_LABEL_FREE_ALL_EVENT_NULL_DEVELOPMENT',r['verdict']
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['calibration_reservoir']=='all geometrically valid target-excluded scan events; no shower-label selection'
          assert r['configuration']['parameter_search'] is False
          assert r['configuration']['null_trimming'] is False
          assert all(r['gates'].values()),r['gates']
          print('PASS_V6_LF_LITERATURE_FANOUT_EQUIVALENCE_PREREQUISITE')
          PY

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: ffe8351b9ee8df4418fb4926fab782d66180e276
          path: exact
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct exact matched runtime and ID-only manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash orbittrace_v6_literature_adapter/bootstrap_optimized_runtime.sh
          bash orbittrace_v6_literature_adapter/prepare_optimized_manifest.sh
          test -f input/archives/023a.zip
          test -f output_manifest/id_manifest.json
          test -f output_manifest/id_manifest.json.sha256

      - name: Capture v6-LF HDBSCAN-2023 pretruth exact boundary
        run: |
          set -euo pipefail
          mkdir -p preexact
          python -u orbittrace_v6_lf_literature_fanout_v1/capture_preexact.py \
            --panel hdbscan --year 2023 \
            --v6-source runtime/run_v3_primary_catalogue_v6.repaired.py \
            --base-runner runtime/run_wavelet_catalogue_v3_development.py \
            --exact-row-runner runtime/run_exact_row_blind_safe.py \
            --id-manifest output_manifest/id_manifest.json \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --archive input/archives/023a.zip \
            --output preexact

      - name: Compare complete-center and production split exact outputs
        run: |
          set -euo pipefail
          mkdir -p equivalence
          python -u orbittrace_v6_lf_literature_fanout_v1/audit_real_equivalence.py \
            --panel hdbscan --year 2023 --split-records 512 --workers 4 \
            --preexact preexact/preexact_hdbscan_2023.pkl \
            --v6-source runtime/run_v3_primary_catalogue_v6.repaired.py \
            --base-runner runtime/run_wavelet_catalogue_v3_development.py \
            --exact-row-runner runtime/run_exact_row_blind_safe.py \
            --id-manifest output_manifest/id_manifest.json \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --archive input/archives/023a.zip \
            | tee equivalence/real_exact_equivalence.txt
          grep -q '^PASS_V6_LF_LITERATURE_REAL_EXACT_EQUIVALENCE$' equivalence/real_exact_equivalence.txt
          grep -q '"truth_accessed": false' equivalence/real_exact_equivalence.txt
          grep -q '"mapping_accessed": false' equivalence/real_exact_equivalence.txt
          grep -q '"competitor_cluster_labels_accessed": false' equivalence/real_exact_equivalence.txt
          grep -q '"native_background_membership_used_for_calibration": false' equivalence/real_exact_equivalence.txt
          grep -q '"target_interval_remains_excluded": true' equivalence/real_exact_equivalence.txt

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v6-lf-literature-fanout-v1-real-equivalence
          path: equivalence
          if-no-files-found: error
          retention-days: 90
