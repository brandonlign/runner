name: OrbitTrace v31 four-observer single-payload run
on: [push, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-gmn-v31-offline-development-package-v1
          path: input/offline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31663453082
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v31-observer-count-file-v1
          path: input/availability
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31754845814
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact evaluator and dependencies
        run: |
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          p=Path('orbittrace_v31_four_observer_file_v1/runner_single.py.gz.b64')
          raw=gzip.decompress(base64.b64decode(''.join(p.read_text().split()),validate=True))
          assert len(raw)==8809
          assert hashlib.sha256(raw).hexdigest()=='458e8706dcd46dc638790a49873de28070fe6b7c5e7d4d907c3289dd000d8339'
          Path('/tmp/run.py').write_bytes(raw);compile(raw,'/tmp/run.py','exec')
          PY
      - name: Execute binding candidate
        env:
          PYTHONPATH: input/ranker:.:input/v3:frozen-v8:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8/orbittrace_sparse_support_multiplicity_v5:orbittrace_v31_four_observer_file_v1
        run: python -u /tmp/run.py --p19 input/p19/p19_prelabel_payload.json --x input/offline/package/GMN_V31_OFFLINE_X.npy --centroids input/offline/package/GMN_V31_OFFLINE_CENTROIDS.npy --manifest input/offline/package/GMN_V31_OFFLINE_DEVELOPMENT_PACKAGE_V1.json --quality-source input/ranker/run_urc_union_ranker.py --availability input/availability/GMN_V31_OBSERVER_COUNT_FILE_AVAILABILITY_RESULT.json --output output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-four-observer-single-payload
          path: output
          if-no-files-found: warn
          retention-days: 90
