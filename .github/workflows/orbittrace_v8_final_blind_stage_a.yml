name: OrbitTrace v8 final blind discovery Stage A

on:
  pull_request_target:
    branches:
      - agent/orbittrace-v8-final-blind-discovery-freeze
    paths:
      - orbittrace_v8_final_blind_discovery/STAGE_A_EXECUTION_REQUEST.json

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-v8-final-blind-stage-a
  cancel-in-progress: false

jobs:
  blind-discovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out exact frozen base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Verify execution-only child and parse request
        id: request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags --depth=2 origin "$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          test "$changed" = "orbittrace_v8_final_blind_discovery/STAGE_A_EXECUTION_REQUEST.json"
          mkdir -p input
          git show "$HEAD_SHA:orbittrace_v8_final_blind_discovery/STAGE_A_EXECUTION_REQUEST.json" > input/stage_a_execution_request.json
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          r=json.loads(Path('input/stage_a_execution_request.json').read_text())
          expected={'schema','freeze_commit','authorization_artifact_id','authorization_artifact_sha256'}
          assert set(r)==expected, set(r)
          assert r['schema']=='orbittrace-v8-stage-a-execution-request-v1'
          assert re.fullmatch(r'[0-9a-f]{40}',str(r['freeze_commit']))
          assert re.fullmatch(r'[0-9]+',str(r['authorization_artifact_id']))
          assert re.fullmatch(r'[0-9a-f]{64}',str(r['authorization_artifact_sha256']))
          current=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['freeze_commit']==current, (r['freeze_commit'],current)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f"auth_id={r['authorization_artifact_id']}\n")
              fh.write(f"auth_sha={r['authorization_artifact_sha256']}\n")
              fh.write(f"freeze_commit={r['freeze_commit']}\n")
          print('PASS_STAGE_A_EXECUTION_ONLY_CHILD_REQUEST')
          PY

      - name: Install exact frozen scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Source-only audit and freeze manifest
        run: |
          set -euo pipefail
          mkdir -p output input/v3 stage_a_output
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python orbittrace_v8_final_blind_discovery/audit_sources.py
          test "$(python -c 'import json; print(json.load(open("output/FREEZE_MANIFEST.json"))["freeze_commit"])')" = "${{ steps.request.outputs.freeze_commit }}"
          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          echo 'f80676974804768cb1994ef1b8de3ad551028c934c8759d247db915a3925fe91  input/v3/multi_anchor_energy_v3.py' | sha256sum -c -
          python -m py_compile \
            orbittrace_v8_final_blind_discovery/run_stage_a.py \
            orbittrace_v8_final_blind_discovery/run_stage_b.py \
            orbittrace_v8_final_blind_discovery/authorize_stage_a.py \
            orbittrace_v8_final_blind_discovery/seal_stage_a.py \
            orbittrace_v8_final_blind_discovery/audit_sources.py \
            input/v3/multi_anchor_energy_v3.py \
            /tmp/run_wavelet_catalogue_v3_development.py

      - name: Retrieve external-validation authorization only
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_ID: ${{ steps.request.outputs.auth_id }}
          AUTH_SHA: ${{ steps.request.outputs.auth_sha }}
        run: |
          set -euo pipefail
          test -n "$AUTH_ID" && test -n "$AUTH_SHA"
          curl --fail-with-body -L --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_ID/zip" \
            -o input/external-authorization.zip
          echo "$AUTH_SHA  input/external-authorization.zip" | sha256sum -c -
          python orbittrace_v8_final_blind_discovery/authorize_stage_a.py \
            --artifact input/external-authorization.zip \
            --freeze-manifest output/FREEZE_MANIFEST.json \
            --output output

      - name: Run frozen target-containing reference-free Stage A
        env:
          PYTHONPATH: input/v3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python orbittrace_v8_final_blind_discovery/run_stage_a.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --source-audit-json output/v8_final_blind_source_audit.json \
            --freeze-manifest output/FREEZE_MANIFEST.json \
            --output stage_a_output
          cat stage_a_output/STAGE_A_BLIND_DISCOVERY.md

      - name: Attach authorization provenance after ranking freeze
        run: |
          set -euo pipefail
          python orbittrace_v8_final_blind_discovery/seal_stage_a.py \
            --stage-a-freeze stage_a_output/stage_a_freeze.json \
            --authorization-json output/stage_a_authorization.json \
            --freeze-manifest output/FREEZE_MANIFEST.json

      - name: Record immutable execution provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > stage_a_output/execution_commit.txt
          sha256sum input/stage_a_execution_request.json output/FREEZE_MANIFEST.json output/v8_final_blind_source_audit.json output/stage_a_authorization.json > stage_a_output/predata_sha256.txt 2>/dev/null
          python --version > stage_a_output/python_version.txt
          python -m pip freeze > stage_a_output/environment.txt

      - name: Upload immutable Stage A blind evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v8-final-blind-stage-a
          path: |
            stage_a_output
            input/stage_a_execution_request.json
            output/FREEZE_MANIFEST.json
            output/v8_final_blind_source_audit.json
            output/stage_a_authorization.json
          if-no-files-found: error
          retention-days: 90
