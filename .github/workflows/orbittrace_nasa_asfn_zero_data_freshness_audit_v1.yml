name: OrbitTrace NASA ASFN zero-data freshness audit v1

on:
  push:
    branches:
      - agent/orbittrace-nasa-asfn-zero-data-freshness-audit-v1
    paths:
      - '.github/workflows/orbittrace_nasa_asfn_zero_data_freshness_audit_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch complete reachable history
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --prune
      - name: Verify frozen audit sources
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_nasa_asfn_zero_data_freshness_audit_v1/PROTOCOL.md)" = 'ea2b3a7f6d6520563c85cfd16218638f64c7d599'
          test "$(git hash-object orbittrace_nasa_asfn_zero_data_freshness_audit_v1/audit_history.py)" = '5dc890bb77c8db7a571e423a1c0555d3380bcc74'
          python -m py_compile orbittrace_nasa_asfn_zero_data_freshness_audit_v1/audit_history.py
      - name: Run zero-network history audit
        run: |
          set -euo pipefail
          python orbittrace_nasa_asfn_zero_data_freshness_audit_v1/audit_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-nasa-asfn-zero-data-freshness-audit-v1
          path: output
          if-no-files-found: error
          retention-days: 90
