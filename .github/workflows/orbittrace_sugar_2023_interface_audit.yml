name: OrbitTrace Sugar 2023 interface audit

on:
  pull_request:
    branches:
      - agent/orbittrace-sugar-uncertainty-catalogue-development
    paths:
      - .github/workflows/orbittrace_sugar_2023_interface_audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-sugar-2023-interface-audit
      - name: Decode exact successful sources without data access
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import ast, base64, gzip, hashlib, json
          from pathlib import Path

          def decode(directory, count):
              root = Path(directory)
              encoded = ''.join(''.join((root / f'part{i:02d}.b64').read_text().split()) for i in range(count))
              return gzip.decompress(base64.b64decode(encoded, validate=True))

          core = decode('orbittrace_literature_comparison/sugar_uncertainty_core_parts', 3)
          runner = decode('orbittrace_literature_comparison/sugar_uncertainty_2025_runner_parts', 4)
          core_sha = hashlib.sha256(core).hexdigest()
          runner_sha = hashlib.sha256(runner).hexdigest()
          assert core_sha == '5b7699a2cf07b9b9ac6dee006c66a9b509af73ee3763093fa333d13e1deca0cb'
          assert runner_sha == 'adbeb8a8737079f8cd63568d8684733dce09f724305ef9605f22423a57fda936'
          Path('output/sugar_uncertainty_catalogue.py').write_bytes(core)
          Path('output/run_sonotaco_2025_sugar_uncertainty_catalogue.py').write_bytes(runner)

          def inspect(source):
              tree = ast.parse(source)
              functions = []
              constants = {}
              for node in tree.body:
                  if isinstance(node, ast.FunctionDef):
                      functions.append({
                          'name': node.name,
                          'args': [arg.arg for arg in node.args.posonlyargs + node.args.args],
                          'kwonly': [arg.arg for arg in node.args.kwonlyargs],
                      })
                  elif isinstance(node, ast.Assign):
                      try:
                          value = ast.literal_eval(node.value)
                      except Exception:
                          continue
                      for target in node.targets:
                          if isinstance(target, ast.Name) and isinstance(value, (str, int, float, bool, type(None), tuple, list, dict)):
                              constants[target.id] = value
              return {'functions': functions, 'literal_globals': constants}

          audit = {
              'verdict': 'PASS_SUGAR_2023_INTERFACE_AUDIT',
              'data_accessed': False,
              'core_sha256': core_sha,
              'runner_sha256': runner_sha,
              'core': inspect(core),
              'runner': inspect(runner),
          }
          Path('output/sugar_2023_interface_audit.json').write_text(json.dumps(audit, indent=2) + '\n')
          print(audit['verdict'])
          print('core functions:', [item['name'] for item in audit['core']['functions']])
          print('runner functions:', [item['name'] for item in audit['runner']['functions']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-sugar-2023-interface-audit
          path: output
          if-no-files-found: error
          retention-days: 90
