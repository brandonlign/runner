name: OrbitTrace M2D SACV fallback-recurrence v1 GMN development

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/orbittrace-m2d-sacv-edge-consensus-v1]
    paths:
      - 'orbittrace_m2d_sacv_fallback_recurrence_v1/**'
      - '.github/workflows/orbittrace_m2d_sacv_fallback_recurrence_v1_gmn.yml'

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: orbittrace-m2d-sacv-fallback-recurrence-v1-gmn-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and verify exact frozen scientific source
        run: |
          set -euo pipefail
          echo 'd75b76a36911c916620da5e029f82c7987718b1610eb6bd61922015b5ab50d4a  orbittrace_m2d_sacv_v1_source.tgz' | sha256sum -c -
          cat orbittrace_m2d_sacv_edge_consensus_v1/source_parts/part*.b64 > /tmp/ec.b64
          test "$(wc -c < /tmp/ec.b64)" = '16844'
          base64 -d /tmp/ec.b64 > /tmp/ec.tgz
          echo 'f7d9fc168fb5f8a589a5d965252979951ae9659ded4dc6662a562276c6273d28  /tmp/ec.tgz' | sha256sum -c -
          tar -xzf /tmp/ec.tgz
          echo 'a51ce33ea660ad03605e0aa2a79f6a8be09c61648ace69332d35a4ed4298878e  orbittrace_m2d_sacv_fallback_recurrence_v1/patch_source.py' | sha256sum -c -
          echo '1f84952cdd92760991108a891700589fa847f503f62af9dfcbc8d6038720c196  orbittrace_m2d_sacv_fallback_recurrence_v1/PROTOCOL.md' | sha256sum -c -
          python orbittrace_m2d_sacv_fallback_recurrence_v1/patch_source.py
          echo '81219214e2f04b4471ef8ad74870ccdb29861e6ce627dbed395f76c8de3d4fe8  orbittrace_m2d_sacv_edge_consensus_v1/build_pretruth.py' | sha256sum -c -
          echo '5aabea29f1ed90494bacffba20a4873d0e8c62af3c324047e113743c7d2dc2d2  orbittrace_m2d_sacv_edge_consensus_v1/evaluate_truth.py' | sha256sum -c -
          echo '525784ddbeadd4288349a7889db56439319f985be16fe92251279db556a49b8e  orbittrace_m2d_sacv_edge_consensus_v1/run_binding.sh' | sha256sum -c -
          cp orbittrace_m2d_sacv_edge_consensus_v1/build_pretruth.py orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py
          cp orbittrace_m2d_sacv_edge_consensus_v1/evaluate_truth.py orbittrace_m2d_sacv_fallback_recurrence_v1/evaluate_truth.py
          cp orbittrace_m2d_sacv_edge_consensus_v1/run_binding.sh orbittrace_m2d_sacv_fallback_recurrence_v1/run_binding.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('orbittrace_m2d_sacv_fallback_recurrence_v1/run_binding.sh');s=p.read_text()
          repl={
            'd1a29d1403194557019ba69fc1e1acb6314cd97cd81e88a8a66c9872fb72cab1':'1f84952cdd92760991108a891700589fa847f503f62af9dfcbc8d6038720c196',
            'd4634839cc35dffa0cf8965923b21b048125844900c7a911515a389063067948':'81219214e2f04b4471ef8ad74870ccdb29861e6ce627dbed395f76c8de3d4fe8',
            'b082a003030309ec55ea16add7195829b876b680e1c449224c89d33c192465e6':'5aabea29f1ed90494bacffba20a4873d0e8c62af3c324047e113743c7d2dc2d2',
          }
          for old,new in repl.items():
              assert s.count(old)==1,(old,s.count(old));s=s.replace(old,new,1)
          p.write_text(s)
          print('RUNNER_TRANSPORT_SELF_CHECK_REPLACEMENTS',len(repl))
          PY
          python -m py_compile orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py orbittrace_m2d_sacv_fallback_recurrence_v1/evaluate_truth.py
          bash -n orbittrace_m2d_sacv_fallback_recurrence_v1/run_binding.sh
          echo PASS_FROZEN_FALLBACK_RECURRENCE_SOURCE
      - name: Execute one-shot target-excluded GMN fallback-recurrence v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash orbittrace_m2d_sacv_fallback_recurrence_v1/run_binding.sh | tee /tmp/run.log
      - name: Publish binding scientific result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          P=output/m2d-sacv-fallback-recurrence-v1-gmn/truth/M2D_SACV_FALLBACK_RECURRENCE_V1_GMN_RESULT.json
          if [ -f "$P" ]; then
            python - <<'PY' > /tmp/result.md
          import hashlib,json
          from pathlib import Path
          p=Path('output/m2d-sacv-fallback-recurrence-v1-gmn/truth/M2D_SACV_FALLBACK_RECURRENCE_V1_GMN_RESULT.json');r=json.loads(p.read_text())
          print('## M2D SACV fallback-recurrence v1 — binding target-excluded GMN development')
          print();print(f"Verdict: **`{r['verdict']}`**");print(f"- result SHA-256: `{hashlib.sha256(p.read_bytes()).hexdigest()}`")
          for comp in ('sugar2017','hdbscan2025'):
              s=r['aggregates'][comp]['paired_same_discovery'];g=r['aggregates'][comp]['gates']
              print(f"- {comp}: paired n `{s['count']}`; precision parent/FR `{s['parent_mean_precision']:.6f} / {s['extraction_mean_precision']:.6f}`; F1 `{s['parent_mean_f1']:.6f} / {s['extraction_mean_f1']:.6f}`; refined `{s['strict_refined_assignment_count']}`; SACV-v1 precision nonregression `{g['precision_nonregression_vs_frozen_sacv_v1']}`; F1 nonregression `{g['f1_nonregression_vs_frozen_sacv_v1']}`")
          print('- OrbitTrace target information accessed: `false`')
          print('- SonotaCo scientific access: `false`')
          PY
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Fallback-recurrence v1 ended before a valid scientific result. Treat as technical no-result only; frozen science remains unchanged."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-sacv-fallback-recurrence-v1-gmn-development
          path: output/m2d-sacv-fallback-recurrence-v1-gmn
          if-no-files-found: warn
          retention-days: 90
