name: OrbitTrace fixed4 locked RRF validation

on:
  pull_request:
    branches:
      - agent/orbittrace-fixed4-rrf-diagnosis
    paths:
      - orbittrace_fixed4_locked_rrf_validation/**
      - .github/workflows/orbittrace_fixed4_locked_rrf_validation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-fixed4-locked-rrf-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      V2_SOURCE_SHA256: 'fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62'
      PATCH_SHA256: '91f6f8fb66acce31defaf90f5f4c66620381fa551f6e06f0ad11c400281a559b'
      FINAL_SOURCE_SHA256: '05668065ff629160cb6078638e8e30561d86d453aa8d9e5df568bcc4bb1257f4'
      FINAL_SOURCE_BYTES: '35149'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-fixed4-locked-rrf-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Reconstruct and audit locked source
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import ast, base64, gzip, hashlib, os, subprocess
          from pathlib import Path

          parts = sorted(Path('orbittrace_fixed4_support_wrapper_development/source_parts').glob('part*.b64'))
          expected = [f'part{i:02d}.b64' for i in range(4)]
          if [p.name for p in parts] != expected:
              raise RuntimeError(f'wrong v2 parts: {[p.name for p in parts]}')
          encoded = ''.join(''.join(p.read_text(encoding='ascii').split()) for p in parts)
          v2 = gzip.decompress(base64.b64decode(encoded, validate=True))
          v2_digest = hashlib.sha256(v2).hexdigest()
          if v2_digest != os.environ['V2_SOURCE_SHA256']:
              raise RuntimeError(f'v2 source hash mismatch: {v2_digest}')
          Path('/tmp/v2.py').write_bytes(v2)

          patch_encoded = ''.join(Path('orbittrace_fixed4_locked_rrf_validation/source_patch.gz.b64').read_text(encoding='ascii').split())
          patch = gzip.decompress(base64.b64decode(patch_encoded, validate=True))
          patch_digest = hashlib.sha256(patch).hexdigest()
          if patch_digest != os.environ['PATCH_SHA256']:
              raise RuntimeError(f'patch hash mismatch: {patch_digest}')
          Path('/tmp/locked.patch').write_bytes(patch)
          subprocess.run(['patch', '--batch', '--silent', '/tmp/v2.py'], stdin=open('/tmp/locked.patch', 'rb'), check=True)
          source = Path('/tmp/v2.py').read_bytes()
          digest = hashlib.sha256(source).hexdigest()
          if digest != os.environ['FINAL_SOURCE_SHA256'] or len(source) != int(os.environ['FINAL_SOURCE_BYTES']):
              raise RuntimeError(f'final source mismatch: {digest} / {len(source)}')
          text = source.decode('utf-8')
          original = v2.decode('utf-8')

          forbidden = ['247.17', '-14.34', '37.62', 'F0059', '8958194010', '8814798136', 'april_candidate_members.csv']
          found = [value for value in forbidden if value in text]
          if found:
              raise RuntimeError(f'OrbitTrace information present: {found}')

          def functions(value):
              return {n.name: ast.dump(n, include_attributes=False) for n in ast.parse(value).body if isinstance(n, ast.FunctionDef)}
          before, after = functions(original), functions(text)
          changed = {name for name in before.keys() & after.keys() if before[name] != after[name]}
          if changed != {'rank_families', 'evaluate_panel', 'main'}:
              raise RuntimeError(f'unexpected changed functions: {sorted(changed)}')
          unchanged = {'read_gmn_frame','column_map','normalize_label','load_sources','parse_catalogue','feature_matrix','exact_anchor_distances','quartet_score','circular_mean_deg','component_records','centroid_distance','family_scores','build_families','scan_year'}
          bad = [name for name in unchanged if before.get(name) != after.get(name)]
          if bad:
              raise RuntimeError(f'core equivalence failed: {bad}')
          required = ['YEARS = (2019, 2020, 2021)','RRF_PERSISTENCE_WEIGHT = 0.66','RRF_SECONDARY_WEIGHT = 0.34','RRF_CONSTANT = 60.0','PASS_LOCKED_RRF_TEMPORAL_VALIDATION','FAIL_LOCKED_RRF_TEMPORAL_VALIDATION']
          missing = [value for value in required if value not in text]
          if missing:
              raise RuntimeError(f'missing locked literals: {missing}')
          parse_block = text[text.index('def parse_catalogue'):text.index('def circular_mean_deg')]
          if parse_block.index('between(BLIND_LOW, BLIND_HIGH') >= parse_block.index('map(normalize_label)'):
              raise RuntimeError('blind interval not removed before labels')
          Path('/tmp/run_fixed4_locked_rrf_validation.py').write_bytes(source)
          Path('output/source_sha256.txt').write_text(digest + '\n', encoding='ascii')
          print('v2 SHA-256:', v2_digest)
          print('patch SHA-256:', patch_digest)
          print('locked source SHA-256:', digest)
          print('changed functions:', sorted(changed))
          PY
          python -m py_compile /tmp/run_fixed4_locked_rrf_validation.py
      - name: Run one-shot 2019-2021 validation
        run: |
          set -euo pipefail
          python /tmp/run_fixed4_locked_rrf_validation.py \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --output output
          cat output/ORBITTRACE_FIXED4_LOCKED_RRF_VALIDATION.md
      - name: Enforce verdict integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/orbittrace_fixed4_locked_rrf_validation.json').read_text())
          allowed = {'PASS_LOCKED_RRF_TEMPORAL_VALIDATION','FAIL_LOCKED_RRF_TEMPORAL_VALIDATION'}
          if result.get('verdict') not in allowed:
              raise SystemExit(f"invalid verdict: {result.get('verdict')}")
          if result['configuration']['years'] != [2019, 2020, 2021]:
              raise SystemExit('test years changed')
          print(json.dumps({'verdict': result['verdict'], 'deltas': result['validation']['deltas']}, indent=2))
          PY
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum orbittrace_fixed4_locked_rrf_validation/PROTOCOL.md orbittrace_fixed4_locked_rrf_validation/source_patch.gz.b64 > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-fixed4-locked-rrf-validation
          path: output
          if-no-files-found: error
          retention-days: 90
