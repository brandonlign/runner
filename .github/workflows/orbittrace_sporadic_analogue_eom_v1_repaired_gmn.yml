name: OrbitTrace sporadic-analogue EOM v1 repaired GMN endpoint

on:
  push:
    branches:
      - agent/orbittrace-sporadic-analogue-eom-v1
    paths:
      - 'orbittrace_sporadic_analogue_eom_v1/REPAIRED_GMN_ACTIVATE.md'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  binding-endpoint:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-sporadic-analogue-eom-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact runtime and verify sealed repaired science
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'charset-normalizer==3.5.0'
          test "$(python - <<'PY'
          import importlib.metadata
          print(importlib.metadata.version('charset-normalizer'))
          PY
          )" = '3.5.0'
          mkdir -p input/v3 input/v8 input/ranker output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          cp frozen-v8/orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py input/v3/wavelet_episode_comparator.py
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          test "$(git hash-object orbittrace_sporadic_analogue_eom_v1/PROTOCOL.md)" = '0087c417e36b77c93daf869921219c7487f770ac'
          test "$(git hash-object orbittrace_sporadic_analogue_eom_v1/sporadic_analogue_eom.py)" = '7584899f16761fd45e2e59bfe6fbea24bf3fbcd0'
          test "$(git hash-object orbittrace_sporadic_analogue_eom_v1/audit_synthetic.py)" = '8f98588446ab3f89e024c884b55f3a528f124af6'
          test "$(git hash-object orbittrace_sporadic_analogue_eom_v1/run_development.py)" = '4fc3f4eb7c5c85951e49d813be4f598ef137667d'
          test "$(git hash-object orbittrace_sporadic_analogue_eom_v1/ACCOUNTING_TOLERANCE_REPAIR_FREEZE.json)" = 'd8c968704f97348bbc73e9a5afc7671821e3582c'
          test "$(git hash-object orbittrace_sporadic_analogue_eom_v1/ACCOUNTING_REPAIR_EXECUTION_SEAL.json)" = '401e2b6f49a778509ab56d764c00319f95992a35'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          python -m py_compile orbittrace_sporadic_analogue_eom_v1/*.py orbittrace_recurrent_eom_hdbscan_v1/*.py orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py input/v3/multi_anchor_energy_v3.py input/v3/wavelet_episode_comparator.py
          python - <<'PY'
          import json
          s=json.load(open('orbittrace_sporadic_analogue_eom_v1/ACCOUNTING_REPAIR_EXECUTION_SEAL.json'))
          assert s['scientific_method']=='SPORADIC_ANALOGUE_EOM_V1'
          assert s['scientific_method_changed_by_repair'] is False
          assert s['repair_zero_data_audit']['run']==31913309456
          assert s['repair_zero_data_audit']['artifact']==9254258706
          assert s['repair_zero_data_audit']['artifact_digest']=='sha256:1409adca05a987390609597c51f88f2df4bc172a967a091464898612b3eab235'
          assert s['accounting_diagnostic']['verdict']=='PASS_WEIGHTED_ACCOUNTING_NUMERICAL_RESIDUAL_ONLY'
          assert s['parent_candidate_count_required']==2094
          assert s['parent_total_recovered_at_100']==179
          assert s['required_total_recovered_at_100_gain']==5
          assert s['required_successor_total_recovered_at_100']==184
          assert s['first_technically_valid_endpoint_binding'] is True
          assert s['post_result_parameter_search'] is False
          assert s['post_result_scientific_rescue_authorized'] is False
          print('PASS_REPAIRED_ENDPOINT_SEAL')
          PY
      - name: Re-run sealed zero-data repair audit before GMN access
        env:
          PYTHONPATH: orbittrace_sporadic_analogue_eom_v1:orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:.
        run: |
          set -euo pipefail
          python -u orbittrace_sporadic_analogue_eom_v1/audit_synthetic.py | tee output/SPORADIC_ANALOGUE_REPAIRED_SYNTHETIC_RECHECK.log
          grep -q PASS_SPORADIC_ANALOGUE_EOM_V1_SYNTHETIC_AUDIT output/SPORADIC_ANALOGUE_REPAIRED_SYNTHETIC_RECHECK.log
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Verify immutable GMN inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
      - name: Run first technically valid binding GMN endpoint
        env:
          PYTHONPATH: input/ranker:input/v3:orbittrace_sporadic_analogue_eom_v1:orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:.
        run: |
          set -euo pipefail
          python -u orbittrace_sporadic_analogue_eom_v1/run_development.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output
      - name: Enforce binding result, reproducibility, gate, and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p=json.load(open('output/SPORADIC_ANALOGUE_EOM_V1_PRELABEL.json'))
          r=json.load(open('output/SPORADIC_ANALOGUE_EOM_V1_GMN_DEVELOPMENT.json'))
          wsha=hashlib.sha256(open('output/SPORADIC_ANALOGUE_WEIGHTS.npy','rb').read()).hexdigest()
          assert wsha==p['weights_npy_sha256']==r['weights_npy_sha256']=='648b88efc09192738dcce8eb2af15e215676dd62451a88cd9230337d80fd5347'
          assert r['verdict'] in {'PASS_SPORADIC_ANALOGUE_EOM_V1_GMN_DEVELOPMENT','FAIL_SPORADIC_ANALOGUE_EOM_V1_GMN_DEVELOPMENT'}
          assert p['truth_evaluated_when_written'] is False
          assert p['parent_candidate_count']==r['parent_candidate_count']==2094
          assert r['parent_total_recovered_at_100']==179
          assert r['required_total_recovered_at_100_gain']==5
          assert r['analogue_offsets_deg']==list(range(60,301,10))
          assert r['knn_k']==10
          assert p['blind_exclusion']==r['blind_exclusion']==[20.0,55.0]
          assert r['post_result_parameter_search'] is False
          assert r['post_result_rescue_authorized'] is False
          for x in (p,r):
              for k in ['target_information_access','target_region_events_accessed','sonotaco_2013_2014_access','asfn_access','efn_access','amos_access','maarsy_scientific_access','dms_scientific_access']:
                  assert x[k] is False, (k,x[k])
          if r['verdict'].startswith('PASS_'):
              assert r['successor_total_recovered_at_100'] >= 184
              assert r['total_recovered_at_100_gain'] >= 5
              assert all(all(g.values()) for g in r['annual_gates'].values())
          print(r['verdict'], 'gain=',r['total_recovered_at_100_gain'], 'successor_total=',r['successor_total_recovered_at_100'])
          PY
      - name: Preserve binding provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum orbittrace_sporadic_analogue_eom_v1/PROTOCOL.md orbittrace_sporadic_analogue_eom_v1/sporadic_analogue_eom.py orbittrace_sporadic_analogue_eom_v1/audit_synthetic.py orbittrace_sporadic_analogue_eom_v1/run_development.py orbittrace_sporadic_analogue_eom_v1/ACCOUNTING_TOLERANCE_REPAIR_FREEZE.json orbittrace_sporadic_analogue_eom_v1/ACCOUNTING_REPAIR_EXECUTION_SEAL.json output/SPORADIC_ANALOGUE_WEIGHTS.npy output/SPORADIC_ANALOGUE_EOM_V1_PRELABEL.json output/SPORADIC_ANALOGUE_EOM_V1_GMN_DEVELOPMENT.json > output/provenance_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-sporadic-analogue-eom-v1-repaired-binding-gmn
          path: output
          if-no-files-found: error
          retention-days: 90
