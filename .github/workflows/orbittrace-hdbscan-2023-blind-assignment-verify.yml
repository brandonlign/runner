name: OrbitTrace HDBSCAN 2023 blind assignment verify

on:
  pull_request:
    branches: [agent/orbittrace-pooled-year-centroid-v8]
    paths:
      - 'orbittrace_literature_matched_v8/HDBSCAN_2023_BLIND_RESULT_INTERPRETATION.md'
      - '.github/workflows/orbittrace-hdbscan-2023-blind-assignment-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v8-literature-matched-sonotaco

      - name: Download immutable blind-safe assignment artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/artifact input/archive output_verify
          gh run download 31226945294 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-hdbscan-2023-blind-safe-benchmark \
            --dir input/artifact
          echo '35f629b1dff4d04cdc13aa8224171ec1ab8e06b52836900d66ff978b5c235761  input/artifact/full_catalogue_assignments.jsonl.gz' | sha256sum -c -
          echo '098b7230c73a51c44c8de72dfe184fb4829ffb44e5b3744f7e522e7ea7e8edd4  input/artifact/sonotaco_2023_hdbscan_transfer.json' | sha256sum -c -

      - name: Download exact SonotaCo 2023 archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output input/archive/023a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/023a.zip
          echo '9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430  input/archive/023a.zip' | sha256sum -c -

      - name: Verify only assignment membership and solar-longitude exclusion
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,io,json,zipfile
          from pathlib import Path

          interpretation=Path('orbittrace_literature_matched_v8/HDBSCAN_2023_BLIND_RESULT_INTERPRETATION.md').read_text()
          assert '31226945294' in interpretation
          assert '35f629b1dff4d04cdc13aa8224171ec1ab8e06b52836900d66ff978b5c235761' in interpretation
          assert 'delta >= 0.10' in interpretation

          result=json.loads(Path('input/artifact/sonotaco_2023_hdbscan_transfer.json').read_text())
          assert result['configuration']['hdbscan_version']=='0.8.44'
          assert result['configuration']['minimum_cluster_size']==100
          assert result['configuration']['minimum_samples'] is None
          assert result['configuration']['cluster_selection_method']=='eom'
          assert result['configuration']['metric']=='euclidean'
          assert result['gates']['exact_archive_hash'] is True
          assert result['gates']['frozen_hdbscan_version'] is True
          assert result['gates']['frozen_parameters_unchanged'] is True
          assert result['gates']['primary_clustering_completed'] is True
          assert result['gates']['full_clustering_completed'] is True
          false_gates=sorted(k for k,v in result['gates'].items() if not v)
          assert false_gates==['all_rows_parsed','exact_row_count'], false_gates

          ids=set()
          with gzip.open('input/artifact/full_catalogue_assignments.jsonl.gz','rt',encoding='utf-8') as fh:
              for line in fh:
                  row=json.loads(line)
                  event_id=str(row.get('event_id',row.get('id')))
                  assert event_id.startswith('SNM2023:')
                  assert event_id not in ids
                  ids.add(event_id)
          assert len(ids)==26460
          wanted={int(x.split(':',1)[1]) for x in ids}
          seen=set()
          forbidden=0
          with zipfile.ZipFile('input/archive/023a.zip') as zf:
              members=[n for n in zf.namelist() if n.endswith('_S.csv')]
              assert len(members)==1
              with zf.open(members[0]) as raw:
                  reader=csv.DictReader(io.TextIOWrapper(raw,encoding='utf-8-sig',newline=''))
                  for idx,row in enumerate(reader):
                      if idx not in wanted:
                          continue
                      seen.add(idx)
                      sol=float(row['sol(deg)'])%360.0
                      if 20.0 <= sol <= 55.0:
                          forbidden += 1
          assert seen==wanted
          assert forbidden==0
          audit={
              'verdict':'PASS_HDBSCAN_2023_BLIND_ASSIGNMENT_VERIFY',
              'source_run':31226945294,
              'assignment_sha256':'35f629b1dff4d04cdc13aa8224171ec1ab8e06b52836900d66ff978b5c235761',
              'assignment_rows':len(ids),
              'all_ids_resolved':True,
              'forbidden_interval_rows':forbidden,
              'labels_accessed_by_verifier':False,
              'eligible_for_exact_row_pairwise_benchmark':True,
          }
          Path('output_verify/hdbscan_2023_blind_assignment_verify.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps(audit,indent=2,sort_keys=True))
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-hdbscan-2023-blind-assignment-verify
          path: output_verify
          if-no-files-found: error
          retention-days: 90
