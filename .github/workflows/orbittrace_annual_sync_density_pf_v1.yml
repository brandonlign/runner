name: OrbitTrace annual sync-density PF v1 pretruth

on:
  push:
    branches: [agent/orbittrace-annual-sync-density-pf-v1]
    paths:
      - '.github/workflows/orbittrace_annual_sync_density_pf_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/checkout@v4
        with:
          repository: LuisScoccola/persistable
          ref: 7eb75b2e8d2fe5a18e49248aa7d1c97f829415be
          path: persistable-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and audit frozen sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          python -m pip install ./persistable-src
          mkdir -p input/v3 input/v8 input/ranker input/endpoint output/pretruth
          test "$(git hash-object orbittrace_annual_sync_density_pf_v1/PROTOCOL.md)" = 'e1aabff3a5d45521b10715195f73993fda6bafc2'
          test "$(git hash-object orbittrace_annual_sync_density_pf_v1/build_pretruth.py)" = '70bc81c9744a4180f45e9281d64a5195713316b2'
          test "$(git hash-object persistable-src/persistable/persistable.py)" = 'f88f64d663862b4577bb40e5796c6dc47391094b'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_annual_sync_density_pf_v1/build_pretruth.py
          python - <<'PY'
          from persistable import FilteredGraph
          assert callable(FilteredGraph)
          PY

          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-annual-density-bifiltration-gmn-ranking-v1-prelabel
          path: input/endpoint
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32037435314

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Bind exact original endpoint package before construction
        run: |
          set -euo pipefail
          test "$(sha256sum input/endpoint/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json | cut -d' ' -f1)" = '95f8a57718a30b2c7e85016d505276d72cccb9e4ac1d6eb29f13067efc73dd0c'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python - <<'PY'
          import json
          p=json.load(open('input/endpoint/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json'))
          assert p['shower_truth_used'] is False
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert [(x['denominator'],x['bucket'],x['equal_budget_k']) for x in p['subsets']] == [
              (128,0,29),(128,1,35),(128,2,38),(128,3,33),
              (1024,0,8),(1024,1,5),(1024,2,6),(1024,3,9),
          ]
          PY

      - name: Build and seal zero-label sync-density PF catalogue
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_annual_sync_density_pf_v1/build_pretruth.py \
            --endpoint-prelabel input/endpoint/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --persistable-source persistable-src/persistable/persistable.py \
            --output output/pretruth

      - name: Enforce zero-label contract without opening truth
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('output/pretruth/ANNUAL_SYNC_DENSITY_PF_V1_PRELABEL.json'))
          assert p['schema']=='ORBITTRACE_ANNUAL_SYNC_DENSITY_PF_V1_PRELABEL'
          assert p['scientific_role']=='ZERO_LABEL_TARGET_EXCLUDED_GMN_STRUCTURAL_AUTHORIZATION'
          assert p['verdict'] in {'PASS_ANNUAL_SYNC_DENSITY_PF_V1_PRETRUTH','FAIL_ANNUAL_SYNC_DENSITY_PF_V1_PRETRUTH'}
          assert len(p['panels'])==8 and len(p['gates'])==12
          assert p['source_endpoint_prelabel_sha256']=='95f8a57718a30b2c7e85016d505276d72cccb9e4ac1d6eb29f13067efc73dd0c'
          assert p['shower_truth_used'] is False
          assert p['target_information_access'] is False and p['target_region_events_accessed'] is False
          assert p['sonotaco_2013_2014_access'] is False
          if p['verdict']=='PASS_ANNUAL_SYNC_DENSITY_PF_V1_PRETRUTH':
              assert all(p['gates'].values())
          else:
              assert not all(p['gates'].values())
          print(p['verdict'])
          print(json.dumps({'aggregate':p['aggregate'],'gates':p['gates'],'cross_scale':p['cross_scale']},indent=2,sort_keys=True))
          PY
          git rev-parse HEAD > output/pretruth/execution_commit.txt
          python --version > output/pretruth/python_version.txt
          python -m pip freeze > output/pretruth/environment.txt
          sha256sum orbittrace_annual_sync_density_pf_v1/PROTOCOL.md orbittrace_annual_sync_density_pf_v1/build_pretruth.py persistable-src/persistable/persistable.py input/endpoint/BIFILTRATION_GMN_RANKING_V1_PRELABEL.json output/pretruth/ANNUAL_SYNC_DENSITY_PF_V1_PRELABEL.json > output/pretruth/source_input_output_sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-annual-sync-density-pf-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90
