name: ISEF SPHEREx Vesta flag quality probe
on:
  push:
    paths:
      - 'isef/spherex_vesta_flag_quality_probe.py'
      - '.github/workflows/isef-spherex-vesta-flag-quality-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'astroquery>=0.4.10' 'astropy>=7.2.0' numpy
      - run: python isef/spherex_vesta_flag_quality_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-spherex-vesta-flag-quality-probe
          path: results/spherex_vesta_flag_quality_probe.json
