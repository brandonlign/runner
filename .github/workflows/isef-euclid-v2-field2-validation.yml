name: ISEF Euclid v2 Field 2 validation
on:
  push:
    branches: [main]
    paths:
      - 'isef/euclid_v2_field2_validation.py'
      - '.github/workflows/isef-euclid-v2-field2-validation.yml'
permissions:
  contents: read
  issues: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'photutils>=2.2'
      - name: Frozen Field-2 validation
        id: validate
        continue-on-error: true
        run: timeout 1320s python isef/euclid_v2_field2_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-euclid-v2-field2-validation
          path: results/euclid_v2_field2_validation.json
          if-no-files-found: warn
      - name: Report aggregate validation result
        if: always()
        env:
          GH_TOKEN: '${{ github.token }}'
          OUTCOME: '${{ steps.validate.outcome }}'
        run: |
          python - <<'PY' > /tmp/f2val.md
          import json, os
          from pathlib import Path
          print('## Euclid v2 frozen Field-2 validation')
          print(f"workflow outcome: `{os.environ.get('OUTCOME')}`")
          p=Path('results/euclid_v2_field2_validation.json')
          if p.exists():
              z=json.loads(p.read_text())
              print('```json')
              print(json.dumps(z, indent=2, sort_keys=True))
              print('```')
          else:
              print('_artifact not produced_')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/f2val.md
