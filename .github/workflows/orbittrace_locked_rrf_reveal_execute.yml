name: OrbitTrace locked RRF frozen reveal execution

on:
  pull_request:
    branches:
      - agent/orbittrace-fixed4-locked-rrf-reveal-source-audit
    paths:
      - ORBITTRACE_LOCKED_RRF_REVEAL_EXECUTION_REQUEST.md
      - ORBITTRACE_LOCKED_RRF_REVEAL_ARTIFACT_PIN.json
      - .github/workflows/orbittrace_locked_rrf_reveal_execute.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-fixed4-locked-rrf-reveal-execution

      - name: Verify frozen reveal source and load immutable pins
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          pin = json.loads(Path('ORBITTRACE_LOCKED_RRF_REVEAL_ARTIFACT_PIN.json').read_text())
          required = {
              'scan_artifact_id', 'scan_artifact_sha256', 'scan_payload_sha256',
              'canonical_artifact_id', 'canonical_artifact_sha256',
              'reveal_source_sha256', 'reveal_source_blob',
          }
          missing = sorted(required - set(pin))
          if missing:
              raise RuntimeError(f'missing immutable reveal pins: {missing}')

          source_path = Path('orbittrace_fixed4_locked_rrf_reveal/reveal_locked_rrf.py')
          source = source_path.read_bytes()
          got = hashlib.sha256(source).hexdigest()
          if got != pin['reveal_source_sha256']:
              raise RuntimeError(f'reveal source hash mismatch: {got}')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f"SCAN_ARTIFACT_ID={pin['scan_artifact_id']}\n")
              env.write(f"SCAN_ARTIFACT_SHA256={pin['scan_artifact_sha256']}\n")
              env.write(f"SCAN_PAYLOAD_SHA256={pin['scan_payload_sha256']}\n")
              env.write(f"CANONICAL_ARTIFACT_ID={pin['canonical_artifact_id']}\n")
              env.write(f"CANONICAL_ARTIFACT_SHA256={pin['canonical_artifact_sha256']}\n")

          print('frozen reveal source verified:', got)
          print('scan artifact:', pin['scan_artifact_id'])
          print('canonical artifact:', pin['canonical_artifact_id'])
          PY

      - name: Retrieve exact frozen scan and canonical evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SCAN_ARTIFACT_ID}/zip" \
            -o input/scan.zip
          echo "${SCAN_ARTIFACT_SHA256}  input/scan.zip" | sha256sum -c -

          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANONICAL_ARTIFACT_ID}/zip" \
            -o input/canonical.zip
          echo "${CANONICAL_ARTIFACT_SHA256}  input/canonical.zip" | sha256sum -c -

      - name: Execute exact frozen reveal
        run: |
          set -euo pipefail
          python orbittrace_fixed4_locked_rrf_reveal/reveal_locked_rrf.py \
            --scan-artifact input/scan.zip \
            --canonical-artifact input/canonical.zip \
            --expected-scan-payload-sha256 "${SCAN_PAYLOAD_SHA256}" \
            --output output
          cat output/ORBITTRACE_FIXED4_LOCKED_RRF_REVEAL.md
          sha256sum \
            output/orbittrace_fixed4_locked_rrf_reveal.json \
            output/orbittrace_fixed4_locked_rrf_overlap.csv \
            output/ORBITTRACE_FIXED4_LOCKED_RRF_REVEAL.md \
            > output/reveal_output_sha256.txt

      - name: Upload frozen reveal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-fixed4-locked-rrf-reveal
          path: output
          if-no-files-found: error
          retention-days: 90
