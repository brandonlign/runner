name: CAMSv3 2011-2015 aggregate audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/camsv3_aggregate_audit.yml
      - camsv3_aggregate_audit/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camsv3-2011-2015-aggregate-audit
  cancel-in-progress: true

jobs:
  aggregate-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/camsv3-2011-2015-aggregate-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependency
        run: python -m pip install requests
      - name: Compile and hash source before archive access
        run: |
          set -euo pipefail
          python -m py_compile camsv3_aggregate_audit/run_aggregate_audit.py
          echo '2331a2df893cda15d74dc2fefc3d94ed7759c18636986ce3acd37e47fca6eb63  camsv3_aggregate_audit/run_aggregate_audit.py' | sha256sum -c -
          sha256sum camsv3_aggregate_audit/PROTOCOL.md
      - name: Run frozen development aggregate audit
        run: |
          set -euo pipefail
          mkdir -p output
          python camsv3_aggregate_audit/run_aggregate_audit.py --output output
          cat output/RESULT.md
      - name: Enforce no-value-retention and continuation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/camsv3_aggregate_audit.json').read_text())
          print(json.dumps({
              'development_years': result['development_years'],
              'reserved_year': result['reserved_year'],
              'counts': result['counts'],
              'fractions': result['fractions'],
              'token_class_counts': result['token_class_counts'],
              'uncertainty_quantiles': result['uncertainty_quantiles'],
              'gates': result['gates'],
              'verdict': result['verdict'],
          }, indent=2, sort_keys=True))
          if result['verdict'] != 'PASS_CAMSV3_2011_2015_AGGREGATE_AUDIT':
              raise SystemExit('Frozen CAMSv3 aggregate audit failed')
          if result['event_rows_retained'] or result['detector_scores_computed']:
              raise RuntimeError('aggregate-only boundary violated')
          if result['reserved_2016_values_read'] or result['ghoststream_values_used']:
              raise RuntimeError('blind boundary violated')
          PY
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            camsv3_aggregate_audit/PROTOCOL.md \
            camsv3_aggregate_audit/run_aggregate_audit.py \
            > output/source_sha256.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload frozen aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camsv3-2011-2015-aggregate-audit
          path: output
          if-no-files-found: error
          retention-days: 90
