name: OrbitTrace group-dense pairwise recovery SonotaCo OOF development v1

on:
  pull_request:
    branches:
      - agent/orbittrace-sonotaco-group-recoverability-oof-v1
    paths:
      - 'orbittrace_sonotaco_groupdense_pairwise_recovery_oof_v1/**'
      - '.github/workflows/orbittrace_sonotaco_groupdense_pairwise_recovery_oof_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-sonotaco-groupdense-pairwise-recovery-oof-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and pin frozen runtime and scientific source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/v3 input/ranker input/model input/prepare output/sugar output/hdbscan output/result
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          ( cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py )
          test "$(cat frozen-v8/output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/prepare_pretruth.py)" = '046795db6913c6831a0643abf30ce20055ef3024'
          test "$(git hash-object orbittrace_v23_worst_year_oof_ranker_v1/train_evaluate.py)" = '67ce5e68106e5ce34f3ea4ad2afc9f49824698c5'
          test "$(git hash-object orbittrace_sonotaco_groupdense_pairwise_recovery_oof_v1/PROTOCOL.md)" = 'ead439190b95d3e7b0e02c00d3f8ed7be90223a2'
          test "$(git hash-object orbittrace_sonotaco_groupdense_pairwise_recovery_oof_v1/train_evaluate.py)" = '958f12de23496b0e77ae8cfe6ac4000f1860ff36'
          python -m py_compile \
            orbittrace_v22_sonotaco_grouped_oof_ranker_v1/prepare_pretruth.py \
            orbittrace_v23_worst_year_oof_ranker_v1/train_evaluate.py \
            orbittrace_sonotaco_groupdense_pairwise_recovery_oof_v1/train_evaluate.py \
            orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs/orbittrace_unified_recurrent_catalogue_lab_v1/run_lab.py \
            orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs/orbittrace_v19_quality_consensus_fusion_v1/run_variants_pretruth.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-urc-final-full-gmn-ranker-v1
          path: input/model
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344776617
      - name: Verify immutable ranker identities
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/model/urc_final_ranker.joblib | cut -d' ' -f1)" = 'ac48355e8c51de2a9cfa12f23b2a847f5e946fc03336a941f80d98224ee5c909'
      - name: Restore exposed label-free SonotaCo rows without truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9050107352/zip' -o input/prepare.zip
          echo '1296d757b5ea1dd94f9c9077fd769fdc8f00ec06d0881d8548fd1df4608344cc  input/prepare.zip' | sha256sum -c -
          unzip -q input/prepare.zip -d input/prepare
          python - <<'PY'
          import json
          m=json.load(open('input/prepare/label_free_preparation_manifest.json'))
          assert m['verdict']=='PASS_FINAL_SONOTACO_LABEL_FREE_PREPARATION'
          assert m['shower_truth_accessed'] is False and m['target_information_access'] is False and m['maarsy_scientific_access'] is False
          PY
      - name: Regenerate Sugar-route fixed pretruth payload
        env:
          PYTHONPATH: .:input/ranker:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_v22_sonotaco_grouped_oof_ranker_v1/prepare_pretruth.py \
            --comparator sugar --rows-2013 input/prepare/sugar_2013.json --rows-2014 input/prepare/sugar_2014.json \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --ranker-source input/ranker/run_urc_union_ranker.py --original-model input/model/urc_final_ranker.joblib \
            --output output/sugar
      - name: Regenerate HDBSCAN-route fixed pretruth payload
        env:
          PYTHONPATH: .:input/ranker:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_v22_sonotaco_grouped_oof_ranker_v1/prepare_pretruth.py \
            --comparator hdbscan --rows-2013 input/prepare/hdbscan_2013.json --rows-2014 input/prepare/hdbscan_2014.json \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --ranker-source input/ranker/run_urc_union_ranker.py --original-model input/model/urc_final_ranker.joblib \
            --output output/hdbscan
      - name: Require fixed scientific pretruth identity before truth
        run: |
          set -euo pipefail
          echo 'afe777b62b32dc2c18b6036939b64f1f1390b0383507c157b4682c386a2c94f5  output/sugar/centroids.npy' | sha256sum -c -
          echo 'be5f559f27c1a18dcda28c20b6197278473cdb458ddfd29ec61bc468e33c352a  output/sugar/family_memberships.json' | sha256sum -c -
          echo '619d13b46fb286e46135fb1984264ed2323efa36da2be516c0832962825f4452  output/hdbscan/centroids.npy' | sha256sum -c -
          echo '99640747e935df2f4a7c7983bdde843ea59e1814388b8418e040dc04628aee13  output/hdbscan/family_memberships.json' | sha256sum -c -
          python - <<'PY'
          import hashlib,json,numpy as np
          expected={'sugar':'64a846220928aa9d8cde77462796f8b38c0c00ce605b1a4711fbad2205d08c03','hdbscan':'2a0e3a06a70601d8045a2d33eadd70c17a65078a7473f51a577bfcf34aa66577'}
          family={'sugar':'911bbc1d763f79ee661863a6d5c2cc98d97d0debd276e64461d45a5447c7bfeb','hdbscan':'7137a5c0892e5d316db38915ff164f2a8fb6e8fbe8e0ed2cfa063097968a1895'}
          def h(x):
              a=np.ascontiguousarray(np.round(np.asarray(x,dtype=np.float64),12)); z=hashlib.sha256(); z.update(str(a.dtype).encode()); z.update(json.dumps(list(a.shape),separators=(',',':')).encode()); z.update(a.tobytes(order='C')); return z.hexdigest()
          for route,want in expected.items():
              assert h(np.load(f'output/{route}/features.npy',allow_pickle=False))==want
              m=json.load(open(f'output/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              assert m['truth_accessed'] is False and m['feature_dimension']==71 and m['v19_family_sha256']==family[route]
          print('PASS_GROUPDENSE_PAIRWISE_FIXED_SCIENTIFIC_PRETRUTH_IDENTITY')
          PY
          sha256sum output/sugar/features.npy output/sugar/centroids.npy output/sugar/family_memberships.json output/hdbscan/features.npy output/hdbscan/centroids.npy output/hdbscan/family_memberships.json > output/GROUPDENSE_PAIRWISE_REGENERATED_PRETRUTH_SHA256.txt
      - name: Load immutable exposed SonotaCo truth only after pretruth identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v15-result
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/v15-result.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/v15-result.zip' | sha256sum -c -
          unzip -q input/v15-result.zip -d input/v15-result
          python - <<'PY'
          import json
          r=json.load(open('input/v15-result/V15_FINAL_LITERATURE_RESULT.json'))
          assert r['verdict']=='FAIL_FINAL_LITERATURE_SUPERIORITY'
          PY
      - name: Train and evaluate sole group-dense pairwise recovery OOF ranker
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_sonotaco_groupdense_pairwise_recovery_oof_v1/train_evaluate.py \
            --sugar-root output/sugar --hdbscan-root output/hdbscan \
            --truth-root input/v15-result --ranker-source input/ranker/run_urc_union_ranker.py \
            --output output/result
      - name: Enforce scientific/result firewall
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/result/SONOTACO_GROUPDENSE_PAIRWISE_RECOVERY_OOF_RESULT.json'))
          assert r['feature_dimension']==71 and r['recovery_f1_threshold']==0.5 and r['threshold_selected_from_result'] is False
          assert r['candidate_membership_changed'] is False and r['pretruth_feature_changed'] is False
          assert r['strict_whole_shower_oof'] is True and r['shared_model_across_routes'] is True and r['group_target_shared_across_routes'] is True
          assert r['class_weight_used'] is False and r['resampling_used'] is False and r['probability_calibration_used'] is False and r['pair_subsampling_used'] is False
          assert r['feature_search'] is False and r['target_search'] is False and r['model_search'] is False and r['hyperparameter_search'] is False
          assert r['pair_weight_search'] is False and r['pair_threshold_search'] is False and r['reference_search'] is False
          assert r['class_weight_search'] is False and r['resampling_search'] is False and r['calibration_search'] is False and r['fusion_search'] is False and r['diversity_search'] is False
          assert r['source_quota_selected'] is False and r['post_result_second_search'] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY'
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_sonotaco_groupdense_pairwise_recovery_oof_v1/PROTOCOL.md \
            orbittrace_sonotaco_groupdense_pairwise_recovery_oof_v1/train_evaluate.py \
            orbittrace_v23_worst_year_oof_ranker_v1/train_evaluate.py \
            orbittrace_v22_sonotaco_grouped_oof_ranker_v1/prepare_pretruth.py \
            input/ranker/run_urc_union_ranker.py > output/GROUPDENSE_PAIRWISE_RECOVERY_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-sonotaco-groupdense-pairwise-recovery-oof-development-v1
          path: output
          if-no-files-found: error
          retention-days: 90
