name: OrbitTrace DAG-atom Pareto-prominence v1 repair01

on:
  pull_request:
    branches: [agent/orbittrace-dag-atom-pareto-prominence-v1]
    paths: ['orbittrace_dag_atom_pareto_prominence_v1/REPAIR01_ACTIVATE.md']

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  binding_repair01:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit unchanged frozen science and Repair 01 only
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_dag_atom_pareto_prominence_v1/PROTOCOL.md)" = '7e586325118e28536581f6b4ceaff40324635b10'
          test "$(git hash-object orbittrace_dag_atom_pareto_prominence_v1/build_prelabel.py)" = '441bec6a51b7629c12b5323e3e2e7305b2f7575b'
          test "$(git hash-object orbittrace_dag_atom_pareto_prominence_v1/evaluate_truth.py)" = 'b2a07da83c9fc5ba7410992ee760b9f551c92023'
          test "$(git hash-object orbittrace_dag_atom_pareto_prominence_v1/metrics_family_id_adapter.py)" = '62bba4fc23fa88c1e5a5148c3ec398190c2eacae'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_dag_atom_pareto_prominence_v1/evaluate_truth.py orbittrace_dag_atom_pareto_prominence_v1/metrics_family_id_adapter.py
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/{ranker,v8,v3,sealed,old-pareto} output/truth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py >/dev/null && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-dag-atom-pareto-prominence-v1-pretruth
          path: input/sealed
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 32188889835
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-topomodal-pareto-prominence-v1-truth
          path: input/old-pareto
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: 32077260440
      - name: Rebind immutable sealed pretruth and historical comparator
        run: |
          set -euo pipefail
          test "$(sha256sum input/sealed/DAG_ATOM_PARETO_PROMINENCE_V1_PRELABEL.json | cut -d' ' -f1)" = '8621c48ec179cc808b64bcd1b4a19f2af12dd38ef01ab9ae32cdc4c38dc67d7f'
          test "$(sha256sum input/sealed/DAG_ATOM_PARETO_PROMINENCE_V1_PRETRUTH.json | cut -d' ' -f1)" = 'e17ace61a139598dec69243f2489fc9f8c48831c90bb2c86c1c224628fb6c169'
          test "$(sha256sum input/old-pareto/RECURRENT_TOPOMODAL_PARETO_PROMINENCE_V1_TRUTH.json | cut -d' ' -f1)" = '697118cf053154d009fad5a323c92e40bdea6d187c054a58d81b9d6abb8f4b6f'
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          python - <<'PY'
          import json
          x=json.load(open('input/sealed/DAG_ATOM_PARETO_PROMINENCE_V1_PRETRUTH.json'));p=json.load(open('input/sealed/DAG_ATOM_PARETO_PROMINENCE_V1_PRELABEL.json'))
          assert x['verdict']=='PASS_DAG_ATOM_PARETO_PROMINENCE_V1_PRETRUTH' and len(x['gates'])==12 and all(x['gates'].values()) and x['sparse_comparator_rebind_exact'] is True
          assert p['shower_truth_used'] is False and p['target_information_access'] is False and p['target_region_events_accessed'] is False
          PY
      - name: Run clean binding truth retry through family-id-only adapter
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_dag_atom_pareto_prominence_v1/evaluate_truth.py \
            --prelabel input/sealed/DAG_ATOM_PARETO_PROMINENCE_V1_PRELABEL.json \
            --pretruth input/sealed/DAG_ATOM_PARETO_PROMINENCE_V1_PRETRUTH.json \
            --old-pareto-truth input/old-pareto/RECURRENT_TOPOMODAL_PARETO_PROMINENCE_V1_TRUTH.json \
            --parent-runner orbittrace_dag_atom_pareto_prominence_v1/metrics_family_id_adapter.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth
          printf '%s\n' "$GITHUB_SHA" > output/truth/execution_commit.txt
          printf '%s\n' "$GITHUB_RUN_ID" > output/truth/execution_run_id.txt
          printf '%s\n' 'TECHNICAL_REPAIR_01_FAMILY_ID_ONLY' > output/truth/execution_repair.txt
          printf '%s\n' 'input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8' > output/truth/execution_pythonpath.txt
      - name: Enforce binding result and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('output/truth/DAG_ATOM_PARETO_PROMINENCE_V1_TRUTH.json'))
          assert x['verdict'] in {'PASS_DAG_ATOM_PARETO_PROMINENCE_V1','FAIL_DAG_ATOM_PARETO_PROMINENCE_V1'}
          assert len(x['gates'])==17 and x['old_pareto_comparator_reproduced_exactly'] is True
          assert x['target_information_access'] is False and x['target_region_events_accessed'] is False and x['sonotaco_scientific_access'] is False
          assert x['asfn_event_level_access'] is False and x['efn_event_level_access'] is False and x['amos_scientific_access'] is False and x['maarsy_scientific_access'] is False and x['dms_scientific_access'] is False
          assert x['method_parameter_selection_from_result'] is False and x['post_result_parameter_search'] is False
          print(json.dumps({'verdict':x['verdict'],'scale_aggregates':x['scale_aggregates'],'gates':x['gates']},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-dag-atom-pareto-prominence-v1-binding-repair01
          path: output/truth
          if-no-files-found: error
          retention-days: 90
