name: OrbitTrace label-free v6 SAAMER 2022-2023 final fresh external validation

on:
  pull_request:
    branches:
      - agent/orbittrace-label-free-v6-saamer-2022-2023-external
    paths:
      - 'orbittrace_label_free_v6_saamer_2022_2023_external/RUN.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out frozen final external parent
        uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-label-free-v6-saamer-2022-2023-external

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Enforce all pre-scientific source and artifact guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v3 input/v6 input/freshness input/coverage input/literature output

          test "$(git hash-object orbittrace_label_free_v6_saamer_2022_2023_external/PROTOCOL.md)" = "40fec5cbc6c70a5110f2e4db880c97056a92682e"
          test "$(git hash-object orbittrace_label_free_v6_saamer_2022_2023_external/run_external_validation.py)" = "6de023bd6fac32de8d80642f1b6bde3a41a9c98e"
          test "$(git hash-object orbittrace_label_free_v6_saamer_external/run_external_validation.py)" = "16a4e832893cbc689ff084510f792349035e5ff7"
          test "$(git hash-object orbittrace_label_free_sparse_support_v6/run_development.py)" = "7995fc6b75d1fd51eb4b304ace39db28a5a1e876"
          test "$(git hash-object orbittrace_label_free_sparse_support_v6/PROTOCOL.md)" = "95feefca6670933795bcc65dd5d9a101a8c4e540"

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"

          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > input/literature/literature_comparators.py
          test "$(git hash-object input/literature/literature_comparators.py)" = "ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2"

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" -o input/v6.zip
          echo "3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v6.zip" | sha256sum -c -
          unzip -q input/v6.zip -d input/v6

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9006805714/zip" -o input/freshness.zip
          echo "07483caffb678c808f514f25a3350364d1282c4232897d68ad4f959e20db46a0  input/freshness.zip" | sha256sum -c -
          unzip -q input/freshness.zip -d input/freshness

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9007013042/zip" -o input/coverage.zip
          echo "d12ae6071639fc7c73d588bf1ef9eb4a19c1c6527167ec0a81b0cf1232810480  input/coverage.zip" | sha256sum -c -
          unzip -q input/coverage.zip -d input/coverage

          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('input/v6/label_free_sparse_support_v6_development.json').read_text())
          assert v['verdict']=='PASS_LABEL_FREE_SPARSE_SUPPORT_V6_DEVELOPMENT'
          assert all(v['integrity_gates'].values()) and all(v['scientific_gates'].values())
          f=json.loads(Path('input/freshness/saamer_2022_2023_repo_freshness_audit.json').read_text())
          assert f['verdict']=='PASS_SAAMER_2022_2023_REPO_SCIENTIFIC_FRESHNESS_AUDIT'
          assert f['potential_exposure_hit_count']==0
          c=json.loads(Path('input/coverage/saamer_2022_2023_common_coverage_adjudication.json').read_text())
          assert c['verdict']=='PASS_SAAMER_2022_2023_COMMON_COVERAGE_ADJUDICATION'
          assert c['frozen_common_nominal_months']==list(range(1,11))
          assert c['meteor_value_access_this_adjudication'] is False
          PY

          python -m py_compile \
            input/v3/multi_anchor_energy_v3.py \
            input/literature/literature_comparators.py \
            orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py \
            orbittrace_sparse_support_multiplicity_v5/run_holdout.py \
            orbittrace_label_free_sparse_support_v6/run_development.py \
            orbittrace_label_free_v6_saamer_external/run_external_validation.py \
            orbittrace_label_free_v6_saamer_2022_2023_external/run_external_validation.py

          rm -rf output/*
          echo PASS_SAAMER_2022_2023_FINAL_PREDATA_GUARDS

      - name: Run final fresh SAAMER 2022-2023 validation
        env:
          PYTHONPATH: input/v3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python orbittrace_label_free_v6_saamer_2022_2023_external/run_external_validation.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --v6-result-json input/v6/label_free_sparse_support_v6_development.json \
            --freshness-json input/freshness/saamer_2022_2023_repo_freshness_audit.json \
            --coverage-json input/coverage/saamer_2022_2023_common_coverage_adjudication.json \
            --dsh-comparator input/literature/literature_comparators.py \
            --output output
          cat output/SAAMER_2022_2023_EXTERNAL_VALIDATION.md

      - name: Enforce frozen terminal result integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/saamer_2022_2023_external_validation.json').read_text())
          assert r['verdict'] in {
            'PASS_LABEL_FREE_V6_SAAMER_2022_2023_EXTERNAL_VALIDATION',
            'FAIL_LABEL_FREE_V6_SAAMER_2022_2023_EXTERNAL_VALIDATION',
            'INCONCLUSIVE_LABEL_FREE_V6_SAAMER_2022_2023_EXTERNAL_POWER',
            'FAIL_LABEL_FREE_V6_SAAMER_2022_2023_EXTERNAL_INTEGRITY',
          }
          c=r['configuration']
          assert c['years']==[2022,2023]
          assert c['scientific_months']==list(range(1,11))
          assert c['blind_exclusion']==[20.0,55.0]
          assert c['max_events_per_10deg_bin']==10000
          assert c['no_source_labels'] is True and c['no_orbits_in_candidate_or_ranking'] is True
          assert c['scientific_gates_identical_to_2020_2021'] is True
          assert c['no_threshold_search'] and c['no_density_search'] and c['no_cap_search'] and c['no_weight_search']
          assert r['terminal_external_panel'] is True
          assert r['orbit_read_audit']['orbital_elements_interpreted_only_after_rank_freeze'] is True
          assert 'No OrbitTrace target information' in r['claim_boundary']
          print('ORBITTRACE_SAAMER_2022_2023_FINAL_RESULT_BEGIN')
          print(json.dumps(r,indent=2,sort_keys=True))
          print('ORBITTRACE_SAAMER_2022_2023_FINAL_RESULT_END')
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/external_commit.txt
          sha256sum \
            orbittrace_label_free_v6_saamer_2022_2023_external/PROTOCOL.md \
            orbittrace_label_free_v6_saamer_2022_2023_external/run_external_validation.py \
            orbittrace_label_free_v6_saamer_external/run_external_validation.py \
            orbittrace_label_free_sparse_support_v6/run_development.py \
            orbittrace_sparse_support_multiplicity_v5/run_holdout.py \
            input/v3/multi_anchor_energy_v3.py \
            input/literature/literature_comparators.py > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload final external-validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-label-free-v6-saamer-2022-2023-final-external
          path: output
          if-no-files-found: error
          retention-days: 90
