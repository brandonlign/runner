name: NOP solution 004 exact GMN orbit recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - nop_solution004_gmn_recovery/**
      - .github/workflows/nop_solution004_gmn_recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nop-solution004-gmn-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_ARTIFACT_ID: '8874517049'
      SOURCE_ARTIFACT_SHA256: '2707a7be1152967960703245e62049e74f4eb778c84098f27c2486385acd512c'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-classification-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nop_solution004_gmn_recovery/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r nop_solution004_gmn_recovery/requirements.txt
      - name: Download exact solution-004 lookup artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p nop_solution004_gmn_recovery/input \
                   nop_solution004_gmn_recovery/cache \
                   nop_solution004_gmn_recovery/results
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o nop_solution004_gmn_recovery/input/source_artifact.zip
          echo "${SOURCE_ARTIFACT_SHA256}  nop_solution004_gmn_recovery/input/source_artifact.zip" | sha256sum -c -
          unzip -q nop_solution004_gmn_recovery/input/source_artifact.zip \
            -d nop_solution004_gmn_recovery/input/source_artifact
          lookup="$(find nop_solution004_gmn_recovery/input/source_artifact -name '0149NOP_004.csv' -print -quit)"
          test -n "${lookup}"
          cp "${lookup}" nop_solution004_gmn_recovery/input/0149NOP_004.csv
          echo "9ec720202966f1eda18c99c8decaa338d9be0bae913be4c2ff6ed34f2661282e  nop_solution004_gmn_recovery/input/0149NOP_004.csv" | sha256sum -c -
      - name: Compile recovery audit
        run: python -m py_compile nop_solution004_gmn_recovery/recover_exact_gmn_orbits.py
      - name: Run frozen exact-GMN recovery gate
        run: |
          python nop_solution004_gmn_recovery/recover_exact_gmn_orbits.py \
            --lookup nop_solution004_gmn_recovery/input/0149NOP_004.csv \
            --cache nop_solution004_gmn_recovery/cache \
            --output nop_solution004_gmn_recovery/results
      - name: Record provenance
        run: |
          sha256sum \
            nop_solution004_gmn_recovery/recover_exact_gmn_orbits.py \
            nop_solution004_gmn_recovery/RECOVERY_GATE.md \
            nop_solution004_gmn_recovery/requirements.txt \
            > nop_solution004_gmn_recovery/results/source_sha256.txt
          sha256sum \
            nop_solution004_gmn_recovery/input/source_artifact.zip \
            nop_solution004_gmn_recovery/input/0149NOP_004.csv \
            > nop_solution004_gmn_recovery/results/input_sha256.txt
          find nop_solution004_gmn_recovery/cache -type f -print0 | sort -z | xargs -0 sha256sum \
            > nop_solution004_gmn_recovery/results/gmn_source_sha256.txt
          python --version > nop_solution004_gmn_recovery/results/python_version.txt
          python -m pip freeze > nop_solution004_gmn_recovery/results/environment.txt
      - name: Upload exact-GMN recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: nop-solution004-exact-gmn-orbit-recovery
          path: nop_solution004_gmn_recovery/results
          if-no-files-found: error
          retention-days: 90
