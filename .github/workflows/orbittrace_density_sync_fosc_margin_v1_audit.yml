name: OrbitTrace density-sync global FOSC exclusion margin v1 synthetic audit

on:
  push:
    branches:
      - agent/orbittrace-density-sync-fosc-margin-v1
    paths:
      - 'orbittrace_density_sync_fosc_margin_v1/AUDIT_REPAIR_ACTIVATE.md'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  synthetic-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-density-sync-fosc-margin-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact repaired audit runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          test "$(git hash-object orbittrace_density_sync_fosc_margin_v1/THEORY_REPAIR_FREEZE.md)" = '41bb237fdbb195cdb7dc159f91b348bb91d41457'
          test "$(git hash-object orbittrace_density_sync_fosc_margin_v1/PROTOCOL.md)" = '88409670230013c58b293b8e0fcf12feca66abbe'
          test "$(git hash-object orbittrace_density_sync_fosc_margin_v1/fosc_margin.py)" = 'd4639b70124eecae33b61bee7c05f9ae54cbab48'
          test "$(git hash-object orbittrace_density_sync_fosc_margin_v1/audit_synthetic.py)" = 'ba68acb28c172d015ee27e5ce4dabe4d8532f244'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          python -m py_compile \
            orbittrace_density_sync_fosc_margin_v1/fosc_margin.py \
            orbittrace_density_sync_fosc_margin_v1/audit_synthetic.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py

      - name: Run repaired zero-data exhaustive theorem audit
        env:
          PYTHONPATH: orbittrace_density_sync_fosc_margin_v1:orbittrace_recurrent_eom_hdbscan_v1:.
        run: |
          set -euo pipefail
          rm -rf output
          python -u orbittrace_density_sync_fosc_margin_v1/audit_synthetic.py
          python - <<'PY'
          import json
          r=json.load(open('output/DENSITY_SYNC_FOSC_MARGIN_V1_SYNTHETIC_AUDIT.json'))
          assert r['verdict']=='PASS_DENSITY_SYNC_FOSC_MARGIN_V1_SYNTHETIC_AUDIT'
          assert r['synthetic_only'] is True
          assert r['repair_of_run']==31862832013
          assert all(r['tests'].values())
          assert r['global_exclusion_margins']=={'11':1.0,'15':1.0,'16':1.0}
          assert r['bruteforce_global_losses']==r['global_exclusion_margins']
          assert r['bruteforce_forced_cuts']['15']==[11,12]
          for k in ('target_information_access','target_region_events_accessed','gmn_catalogue_accessed','scientific_labels_accessed','sonotaco_accessed','amos_accessed','asfn_accessed','efn_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False, (k,r[k])
          PY

      - name: Preserve repaired audit provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum \
            orbittrace_density_sync_fosc_margin_v1/THEORY_REPAIR_FREEZE.md \
            orbittrace_density_sync_fosc_margin_v1/PROTOCOL.md \
            orbittrace_density_sync_fosc_margin_v1/fosc_margin.py \
            orbittrace_density_sync_fosc_margin_v1/audit_synthetic.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            output/DENSITY_SYNC_FOSC_MARGIN_V1_SYNTHETIC_AUDIT.json \
            > output/source_output_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-density-sync-global-fosc-exclusion-margin-v1-synthetic-audit
          path: output
          if-no-files-found: error
          retention-days: 90
