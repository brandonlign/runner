name: OrbitTrace TopoModal flagship matched literature v1

on:
  push:
    branches:
      - agent/orbittrace-topomodal-flagship-final-v1
    paths:
      - '.github/workflows/orbittrace_topomodal_flagship_matched_literature_v1.yml'
      - 'orbittrace_topomodal_flagship/LITERATURE_BENCHMARK_PROTOCOL.md'
      - 'orbittrace_topomodal_flagship/literature_benchmark/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 174d659b87cef2f7bcff8145a74e46e979462f38
          path: infra
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen normalizer runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          test "$(git -C infra hash-object orbittrace_final_sonotaco_normalizer_v1/normalizer.py)" = '0264546418d0b50fa53514a6ba170f7c3e33d4d3'
          test "$(git -C infra hash-object orbittrace_final_sonotaco_one_shot_v1/prepare_label_free_rows.py)" = '91a362a04b2a08514d688b611750ff88fe3ab2a5'
          mkdir -p input/v3 input/archives input/csv output/prepare
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py)
      - name: Fetch the already-exposed SonotaCo 2013/2014 source archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 -o input/archives/013a.zip 'https://www.astro.sk/iaumdcDB/PDA/SNMv3/013a.zip'
          curl --fail --location --retry 3 --retry-delay 2 -o input/archives/014a.zip 'https://www.astro.sk/iaumdcDB/PDA/SNMv3/014a.zip'
          python - <<'PY'
          import csv,hashlib,io,json,zipfile
          from pathlib import Path,PurePosixPath
          specs={2013:('input/archives/013a.zip','_U2_20130101_S.csv',26855),2014:('input/archives/014a.zip','_U2_20140101_S.csv',22079)}
          out={'authorization_state':'AUTHORIZED_FINAL_SONOTACO_2013_2014_EXECUTION','benchmark_role':'EXPOSED_POST_SELECTION_LITERATURE_BENCHMARK','maarsy_access_authorized':False,'target_access_authorized':False,'years':{}}
          for year,(zpath,basename,published_count) in specs.items():
              raw=Path(zpath).read_bytes(); archive_sha=hashlib.sha256(raw).hexdigest()
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  matches=[n for n in z.namelist() if not n.endswith('/') and PurePosixPath(n).name==basename]
                  assert len(matches)==1,(year,matches)
                  member=matches[0]; data=z.read(member)
              Path(f'input/csv/{year}.csv').write_bytes(data)
              rows=list(csv.reader(io.StringIO(data.decode('utf-8-sig'),newline=''),delimiter=','))
              physical=max(0,len(rows)-1)
              assert physical==published_count,(year,physical,published_count)
              out['years'][str(year)]={'archive_sha256':archive_sha,'member_path':member,'member_sha256':hashlib.sha256(data).hexdigest(),'member_bytes':len(data),'physical_data_rows':physical,'published_orbit_count':published_count,'published_count_match':True}
          Path('output/prepare/source_integrity.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Reproduce exact existing label-free Sugar/HDBSCAN universes
        env:
          PYTHONPATH: infra:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u infra/orbittrace_final_sonotaco_one_shot_v1/prepare_label_free_rows.py \
            --csv-2013 input/csv/2013.csv --csv-2014 input/csv/2014.csv \
            --p19-source infra/orbittrace_p19_subthreshold_recurrence/run_development.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --source-integrity output/prepare/source_integrity.json --output output/prepare
          python -u orbittrace_topomodal_flagship/literature_benchmark/prepare_extra_rows.py \
            --prepare-dir output/prepare --output output/prepare
          rm -rf input/archives input/csv
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-topomodal-flagship-literature-rows-v1
          path: output/prepare
          if-no-files-found: error
          retention-days: 90

  source_bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: b9bcb48da5b96df4dcd5f09d7ec97b8e6e38f7fd
          path: sugar-source
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: a15737166cc9e1917f2e3d1b63cc42096008ae2e
          path: hdbscan-source
      - name: Decode and pin exact published comparator sources
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          def decode(paths,out):
              encoded=''.join(''.join(Path(p).read_text().split()) for p in paths)
              raw=gzip.decompress(base64.b64decode(encoded,validate=True)); Path(out).write_bytes(raw); return hashlib.sha256(raw).hexdigest()
          s=decode([f'sugar-source/orbittrace_literature_comparison/sugar_uncertainty_core_parts/part{i:02d}.b64' for i in range(3)],'output/sugar_uncertainty_core.py')
          h=decode([f'hdbscan-source/orbittrace_literature_comparison/hdbscan_catalogue_runner_parts/part{i:02d}.b64' for i in range(5)],'output/hdbscan_catalogue_runner.py')
          assert s=='5b7699a2cf07b9b9ac6dee006c66a9b509af73ee3763093fa333d13e1deca0cb',s
          assert h=='a8b638f56dad2597973178523e8ad15e177a4f57e7fe6159fedc84d754afd3d2',h
          PY
          cp sugar-source/orbittrace_literature_comparison/literature_comparators.py output/literature_comparators.py
          test "$(git -C sugar-source hash-object orbittrace_literature_comparison/literature_comparators.py)" = 'ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2'
          python -m py_compile output/*.py
          sha256sum output/* > output/SOURCE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-topomodal-flagship-literature-sources-v1
          path: output
          if-no-files-found: error
          retention-days: 90

  topomodal:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        pair: [sugar, hdbscan, dsh]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: d2ef1ac2ecaa2f63725b50a33286409a69159212
          path: flagship-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact flagship numerical runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          test "$(git -C flagship-source hash-object orbittrace_topomodal_sparse_recovery_v1/run_development.py)" = '752df8212ce601227f6e9170b0fe994ba06b515d'
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-literature-rows-v1, path: input/prepare}
      - name: Freeze exact flagship output before truth
        run: |
          set -euo pipefail
          python -u orbittrace_topomodal_flagship/literature_benchmark/run_topomodal_pretruth.py \
            --comparator '${{ matrix.pair }}' \
            --rows-2013 'input/prepare/${{ matrix.pair }}_2013.json' \
            --rows-2014 'input/prepare/${{ matrix.pair }}_2014.json' \
            --flagship-source flagship-source/orbittrace_topomodal_sparse_recovery_v1/run_development.py \
            --source-git-blob 752df8212ce601227f6e9170b0fe994ba06b515d --output output
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-topomodal-flagship-pretruth-${{ matrix.pair }}-v1
          path: output
          if-no-files-found: error
          retention-days: 90

  comparator:
    needs: [prepare, source_bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pair: sugar, year: 2013}
          - {pair: sugar, year: 2014}
          - {pair: hdbscan, year: 2013}
          - {pair: hdbscan, year: 2014}
          - {pair: dsh, year: 2013}
          - {pair: dsh, year: 2014}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 174d659b87cef2f7bcff8145a74e46e979462f38
          path: infra
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact literature runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'scipy==1.11.4' 'scikit-learn==1.4.2' 'hdbscan==0.8.44'
          test "$(git -C infra hash-object orbittrace_final_sonotaco_comparators_v1/pretruth_comparators.py)" = '00578445ed0957fb3708bb84fda1df6ef7b5b004'
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-literature-rows-v1, path: input/prepare}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-literature-sources-v1, path: input/sources}
      - name: Freeze exact literature output before truth
        env:
          PYTHONPATH: infra
        run: |
          set -euo pipefail
          if [ '${{ matrix.pair }}' = 'sugar' ]; then
            python -u infra/orbittrace_final_sonotaco_one_shot_v1/run_comparator_pretruth.py \
              --comparator sugar --year '${{ matrix.year }}' --rows 'input/prepare/sugar_${{ matrix.year }}.json' \
              --source input/sources/sugar_uncertainty_core.py --output output
          elif [ '${{ matrix.pair }}' = 'hdbscan' ]; then
            python -u infra/orbittrace_final_sonotaco_one_shot_v1/run_comparator_pretruth.py \
              --comparator hdbscan --year '${{ matrix.year }}' --rows 'input/prepare/hdbscan_${{ matrix.year }}.json' \
              --source input/sources/hdbscan_catalogue_runner.py --output output
          else
            python -u orbittrace_topomodal_flagship/literature_benchmark/run_dsh_pretruth.py \
              --year '${{ matrix.year }}' --rows 'input/prepare/dsh_${{ matrix.year }}.json' \
              --reference-source input/sources/literature_comparators.py \
              --source-git-blob ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2 --output output
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-topomodal-literature-${{ matrix.pair }}-${{ matrix.year }}-v1
          path: output
          if-no-files-found: error
          retention-days: 90

  freeze:
    needs: [topomodal, comparator]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-literature-rows-v1, path: input/prepare}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-pretruth-sugar-v1, path: input/candidate-sugar}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-pretruth-hdbscan-v1, path: input/candidate-hdbscan}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-pretruth-dsh-v1, path: input/candidate-dsh}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-sugar-2013-v1, path: input/sugar-2013}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-sugar-2014-v1, path: input/sugar-2014}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-hdbscan-2013-v1, path: input/hdbscan-2013}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-hdbscan-2014-v1, path: input/hdbscan-2014}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-dsh-2013-v1, path: input/dsh-2013}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-dsh-2014-v1, path: input/dsh-2014}
      - name: Hash-freeze all six panels before truth
        run: |
          set -euo pipefail
          python -u orbittrace_topomodal_flagship/literature_benchmark/freeze_pretruth.py \
            --prepare-dir input/prepare \
            --candidate-sugar-dir input/candidate-sugar --candidate-hdbscan-dir input/candidate-hdbscan --candidate-dsh-dir input/candidate-dsh \
            --comparator-sugar-2013-dir input/sugar-2013 --comparator-sugar-2014-dir input/sugar-2014 \
            --comparator-hdbscan-2013-dir input/hdbscan-2013 --comparator-hdbscan-2014-dir input/hdbscan-2014 \
            --comparator-dsh-2013-dir input/dsh-2013 --comparator-dsh-2014-dir input/dsh-2014 --output output
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-topomodal-flagship-literature-pretruth-freeze-v1
          path: output
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: freeze
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 174d659b87cef2f7bcff8145a74e46e979462f38
          path: infra
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact evaluator runtime
        run: python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'scipy==1.11.4'
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-literature-rows-v1, path: input/prepare}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-literature-pretruth-freeze-v1, path: input/freeze}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-pretruth-sugar-v1, path: input/candidate-sugar}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-pretruth-hdbscan-v1, path: input/candidate-hdbscan}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-flagship-pretruth-dsh-v1, path: input/candidate-dsh}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-sugar-2013-v1, path: input/sugar-2013}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-sugar-2014-v1, path: input/sugar-2014}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-hdbscan-2013-v1, path: input/hdbscan-2013}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-hdbscan-2014-v1, path: input/hdbscan-2014}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-dsh-2013-v1, path: input/dsh-2013}
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-topomodal-literature-dsh-2014-v1, path: input/dsh-2014}
      - uses: actions/download-artifact@v4
        with:
          name: real-shower-meta-data-audit
          path: input/mapping
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30855193522
      - name: Restore exact frozen matched evaluator
        run: |
          set -euo pipefail
          mkdir -p input/csv input/archives input/evaluator
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(''.join(Path('infra/orbittrace_final_matched_evaluator_v1/evaluator.py.gz.b64').read_text().split()),validate=True))
          Path('input/evaluator/evaluator.py').write_bytes(raw)
          assert hashlib.sha256(raw).hexdigest()=='cefcc8900a7b3d083f81148427e9f80e2c7192bb25dd9bb635e6677aa23a555c'
          assert hashlib.sha256(Path('input/mapping/audit.json').read_bytes()).hexdigest()=='f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778'
          PY
      - name: Reacquire identical archive bytes for post-freeze truth only
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 -o input/archives/013a.zip 'https://www.astro.sk/iaumdcDB/PDA/SNMv3/013a.zip'
          curl --fail --location --retry 3 --retry-delay 2 -o input/archives/014a.zip 'https://www.astro.sk/iaumdcDB/PDA/SNMv3/014a.zip'
          python - <<'PY'
          import hashlib,io,json,zipfile
          from pathlib import Path,PurePosixPath
          integrity=json.load(open('input/prepare/source_integrity.json'))
          specs={2013:('input/archives/013a.zip','_U2_20130101_S.csv'),2014:('input/archives/014a.zip','_U2_20140101_S.csv')}
          for year,(zpath,basename) in specs.items():
              raw=Path(zpath).read_bytes(); assert hashlib.sha256(raw).hexdigest()==integrity['years'][str(year)]['archive_sha256']
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  m=[n for n in z.namelist() if not n.endswith('/') and PurePosixPath(n).name==basename]; assert len(m)==1
                  data=z.read(m[0])
              assert hashlib.sha256(data).hexdigest()==integrity['years'][str(year)]['member_sha256']
              Path(f'input/csv/{year}.csv').write_bytes(data)
          PY
      - name: Open only frozen row truth and evaluate all six panels
        env:
          PYTHONPATH: infra
        run: |
          set -euo pipefail
          python -u orbittrace_topomodal_flagship/literature_benchmark/evaluate_after_freeze.py \
            --csv-2013 input/csv/2013.csv --csv-2014 input/csv/2014.csv \
            --mapping-audit input/mapping/audit.json --evaluator-source input/evaluator/evaluator.py \
            --prepare-dir input/prepare --freeze-file input/freeze/PRETRUTH_FREEZE.json \
            --candidate-sugar-dir input/candidate-sugar --candidate-hdbscan-dir input/candidate-hdbscan --candidate-dsh-dir input/candidate-dsh \
            --comparator-sugar-2013-dir input/sugar-2013 --comparator-sugar-2014-dir input/sugar-2014 \
            --comparator-hdbscan-2013-dir input/hdbscan-2013 --comparator-hdbscan-2014-dir input/hdbscan-2014 \
            --comparator-dsh-2013-dir input/dsh-2013 --comparator-dsh-2014-dir input/dsh-2014 --output output
          rm -rf input/csv input/archives
      - name: Enforce frozen reporting contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/TOPOMODAL_FLAGSHIP_MATCHED_LITERATURE_RESULT_V1.json'))
          assert r['verdict'] in {'PASS_TOPOMODAL_FLAGSHIP_MATCHED_LITERATURE_V1','FAIL_TOPOMODAL_FLAGSHIP_MATCHED_LITERATURE_V1'}
          assert len(r['panels'])==6 and r['panel_count']==6
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['truth_access_before_pretruth'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['post_result_parameter_search'] is False
          print(r['verdict'])
          for p in r['panels']:
              print(p['pair'],p['year'],'WIN' if p['topomodal_win'] else 'LOSS',p['topomodal']['macro_f1'],p['literature']['macro_f1'],p['topomodal']['recovered_f1_gt_0_5'],p['literature']['recovered_f1_gt_0_5'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-topomodal-flagship-matched-literature-result-v1
          path: output
          if-no-files-found: error
          retention-days: 90
