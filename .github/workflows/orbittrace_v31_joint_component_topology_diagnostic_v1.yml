name: OrbitTrace v31 joint component-topology diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v31_joint_component_topology_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v31_joint_component_topology_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v31-joint-component-topology-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 31704c312c09be2765ad3f65a0685d1acfd2b055
          path: frozen-v40
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen diagnostic sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/source input/payload input/truth output/freeze output/diag
          test "$(git hash-object orbittrace_v31_joint_component_topology_diagnostic_v1/PROTOCOL.md)" = '11a593dc986801df29245f4686e29de3c1b866f5'
          test "$(git hash-object orbittrace_v31_joint_component_topology_diagnostic_v1/diagnose.py)" = 'f6207b247e9bce868644fa2c08b9c34299d025ab'
          test "$(git -C frozen-v40 rev-parse HEAD)" = '31704c312c09be2765ad3f65a0685d1acfd2b055'
          test "$(git -C frozen-v40 hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git -C frozen-v40 hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v31_joint_component_topology_diagnostic_v1/diagnose.py

      - name: Restore authoritative #1098 truth-blind signal and components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088724826/zip' -o input/source.zip
          echo '11498b73237304f4175f37910596700ed78284bc6106d0c21dcaab66f97b7978  input/source.zip' | sha256sum -c -
          unzip -q input/source.zip -d input/source
          echo 'a3bcea66b72003a38cc492ea3b182d92cd20f3d1b94a43acbc8a0cbdd465ed07  input/source/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json' | sha256sum -c -
          echo 'c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd  input/source/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json' | sha256sum -c -
          python - <<'PY'
          import json
          s=json.load(open('input/source/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json'))
          c=json.load(open('input/source/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json'))
          assert s['verdict']=='PASS_V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL_FREEZE'
          assert s['family_count']==229 and len(s['families'])==229 and sum(bool(x['joint_signal']) for x in s['families'])==60
          assert s['graph_sha256']=='2f25aa7d9af1df0a350c034b2280a790c3869a7775bf6d7063d0d1e4cc802b25'
          assert s['component_sha256']=='c1b80484502907ad19e0d51d8d48d364f3bf7a27e17576e073fe86ae44f499cd'
          assert c['verdict']=='PASS_CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY'
          assert c['scientific_role']=='PRETRUTH_CONNECTED_COMPONENT_IDENTITY_ONLY'
          assert c['truth_accessed'] is False and c['component_count']==196
          assert s['target_information_access'] is False and s['target_region_events_accessed'] is False
          assert c['target_information_access'] is False and c['target_region_events_accessed'] is False
          assert s['maarsy_scientific_access'] is False and s['dms_scientific_access'] is False
          assert c['maarsy_scientific_access'] is False and c['dms_scientific_access'] is False
          print('PASS_TOPOLOGY_1098_PRETRUTH_INPUTS')
          PY

      - name: Freeze exact 60-family topology vector before truth
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:.
        run: |
          set -euo pipefail
          python -u orbittrace_v31_joint_component_topology_diagnostic_v1/diagnose.py freeze \
            --signal-file input/source/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json \
            --component-file input/source/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json \
            --output output/freeze
          python - <<'PY'
          import json
          r=json.load(open('output/freeze/V31_JOINT_COMPONENT_TOPOLOGY_VECTOR.json'))
          assert r['verdict']=='PASS_V31_JOINT_COMPONENT_TOPOLOGY_VECTOR_FREEZE'
          assert r['scientific_role']=='EXACT_60_JOINT_FAMILY_COMPONENT_TOPOLOGY_FROZEN_BEFORE_OUTCOME_TRUTH'
          assert r['joint_family_count']==60 and len(r['families'])==60
          assert r['one_to_one_family_count']==41 and r['ambiguous_family_count']==19
          assert sum(x['topology_class']=='ONE_TO_ONE' for x in r['families'])==41
          assert sum(x['topology_class']=='AMBIGUOUS' for x in r['families'])==19
          assert r['truth_accessed'] is False and r['literature_panel_evaluated'] is False and r['candidate_total_order_evaluated'] is False
          assert r['selector_evaluated'] is False and r['successor_selected'] is False
          assert r['component_size_threshold_selected'] is False and r['alternate_topology_search'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False and r['blind_exclusion']==[20.0,55.0]
          print('PASS_TOPOLOGY_VECTOR_FREEZE_BEFORE_TRUTH',r['canonical_sha256_without_self_field'])
          PY

      - name: Restore immutable #950 HDB pretruth payload before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          m=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          f=json.load(open('input/payload/hdbscan/family_memberships.json'))
          assert m['truth_accessed'] is False and f['truth_accessed'] is False
          assert m['feature_dimension']==71 and len(m['family_ids'])==229 and len(f['families'])==229
          assert [str(x['family_id']) for x in f['families']]==list(map(str,m['family_ids']))
          assert m['target_information_access'] is False
          assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_TOPOLOGY_950_PRETRUTH_PAYLOAD')
          PY

      - name: Load immutable exposed SonotaCo truth only after topology freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
          echo PASS_TOPOLOGY_TRUTH_LOADED_AFTER_VECTOR_FREEZE

      - name: Run sole frozen component-topology diagnostic
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:.
        run: |
          set -euo pipefail
          python -u orbittrace_v31_joint_component_topology_diagnostic_v1/diagnose.py diagnose \
            --vector-file output/freeze/V31_JOINT_COMPONENT_TOPOLOGY_VECTOR.json \
            --hdb-root input/payload/hdbscan --truth-root input/truth --output output/diag

      - name: Enforce diagnostic-only scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V31_JOINT_COMPONENT_TOPOLOGY_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V31_JOINT_COMPONENT_TOPOLOGY_DIAGNOSTIC','FAIL_V31_JOINT_COMPONENT_TOPOLOGY_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_V49_COMPONENT_TOPOLOGY_DIAGNOSTIC_ONLY_NO_SELECTOR_ORDER_OR_PANEL_EVALUATED'
          assert r['source_1098_run']==31457923695 and r['source_1098_artifact']==9088724826
          assert r['source_signal_sha256']=='a3bcea66b72003a38cc492ea3b182d92cd20f3d1b94a43acbc8a0cbdd465ed07'
          assert r['joint_family_count']==60 and r['one_to_one_family_count']==41 and r['ambiguous_family_count']==19
          assert set(r['annual_diagnostics'])=={'2013','2014'}
          for y in ('2013','2014'):
              assert set(r['annual_diagnostics'][y])=={'family_level','representative_group_level'}
          for k in ('candidate_total_order_evaluated','literature_panel_evaluated','selector_evaluated','replacement_rule_evaluated','successor_selected','component_size_threshold_search','component_size_transform_search','alternate_topology_search','route_count_ratio_search','component_density_search','component_entropy_search','graph_or_component_redefinition','quality_component_fusion_search','coefficient_search','top_k_search','rank_window_search','budget_specific_rule','year_specific_rule','oracle_identity_hardcoded','boundary_rescue_list_created','feature_search','model_search','k_search','scaling_search','diversity_search','fusion_search','source_quota_selected','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['annual_diagnostics'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v31_joint_component_topology_diagnostic_v1/PROTOCOL.md \
            orbittrace_v31_joint_component_topology_diagnostic_v1/diagnose.py \
            input/source/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json \
            input/source/pretruth/CROSSROUTE_RADIUS1_PRETRUTH_COMPONENT_CLOSURE_IDENTITY.json \
            output/freeze/V31_JOINT_COMPONENT_TOPOLOGY_VECTOR.json input/payload.zip input/truth.zip \
            > output/V31_JOINT_COMPONENT_TOPOLOGY_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-joint-component-topology-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
