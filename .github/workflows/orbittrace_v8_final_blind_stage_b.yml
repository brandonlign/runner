name: OrbitTrace v8 final blind discovery Stage B

on:
  pull_request_target:
    branches:
      - agent/orbittrace-v8-final-blind-discovery-freeze
    paths:
      - orbittrace_v8_final_blind_discovery/STAGE_B_EXECUTION_REQUEST.json

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-v8-final-blind-stage-b
  cancel-in-progress: false

jobs:
  reveal:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out exact frozen base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify execution-only child and parse request
        id: request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags --depth=2 origin "$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          test "$changed" = "orbittrace_v8_final_blind_discovery/STAGE_B_EXECUTION_REQUEST.json"
          mkdir -p input
          git show "$HEAD_SHA:orbittrace_v8_final_blind_discovery/STAGE_B_EXECUTION_REQUEST.json" > input/stage_b_execution_request.json
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          r=json.loads(Path('input/stage_b_execution_request.json').read_text())
          expected={
              'schema','freeze_commit','stage_a_artifact_id','stage_a_artifact_sha256',
              'withheld_reference_artifact_id','withheld_reference_artifact_sha256'
          }
          assert set(r)==expected, set(r)
          assert r['schema']=='orbittrace-v8-stage-b-execution-request-v1'
          assert re.fullmatch(r'[0-9a-f]{40}',str(r['freeze_commit']))
          for key in ('stage_a_artifact_id','withheld_reference_artifact_id'):
              assert re.fullmatch(r'[0-9]+',str(r[key]))
          for key in ('stage_a_artifact_sha256','withheld_reference_artifact_sha256'):
              assert re.fullmatch(r'[0-9a-f]{64}',str(r[key]))
          current=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['freeze_commit']==current, (r['freeze_commit'],current)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              for key in sorted(expected-{'schema'}):
                  fh.write(f"{key}={r[key]}\n")
          print('PASS_STAGE_B_EXECUTION_ONLY_CHILD_REQUEST')
          PY

      - name: Reproduce source-only freeze manifest
        run: |
          set -euo pipefail
          mkdir -p output
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          python orbittrace_v8_final_blind_discovery/audit_sources.py
          test "$(python -c 'import json; print(json.load(open("output/FREEZE_MANIFEST.json"))["freeze_commit"])')" = "${{ steps.request.outputs.freeze_commit }}"
          python -m py_compile orbittrace_v8_final_blind_discovery/run_stage_b.py

      - name: Retrieve and verify immutable Stage A only
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_A_ID: ${{ steps.request.outputs.stage_a_artifact_id }}
          STAGE_A_SHA: ${{ steps.request.outputs.stage_a_artifact_sha256 }}
          REQUESTED_REF_SHA: ${{ steps.request.outputs.withheld_reference_artifact_sha256 }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$STAGE_A_ID/zip" \
            -o input/stage-a.zip
          echo "$STAGE_A_SHA  input/stage-a.zip" | sha256sum -c -
          python orbittrace_v8_final_blind_discovery/run_stage_b.py preflight \
            --stage-a-artifact input/stage-a.zip \
            --output output
          python - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          with zipfile.ZipFile('input/stage-a.zip') as zf:
              names=[n for n in zf.namelist() if n.endswith('stage_a_freeze.json')]
              assert len(names)==1, names
              frozen=json.loads(zf.read(names[0]))
          current_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          current_manifest=hashlib.sha256(Path('output/FREEZE_MANIFEST.json').read_bytes()).hexdigest()
          assert current_commit==frozen['freeze_commit'], (current_commit,frozen['freeze_commit'])
          assert current_manifest==frozen['freeze_manifest_sha256'], (current_manifest,frozen['freeze_manifest_sha256'])
          assert os.environ['REQUESTED_REF_SHA']==frozen['sealed_withheld_reference_artifact_sha256']
          assert frozen['authorization_attached_after_blind_ranking_freeze'] is True
          assert frozen['withheld_reference_loaded'] is False
          print('PASS_EXACT_FREEZE_AND_SEALED_REFERENCE_PREFLIGHT')
          PY
          cat output/stage_b_preflight.json

      - name: Retrieve withheld reference only after Stage A preflight passed
        env:
          GH_TOKEN: ${{ github.token }}
          REF_ID: ${{ steps.request.outputs.withheld_reference_artifact_id }}
          REF_SHA: ${{ steps.request.outputs.withheld_reference_artifact_sha256 }}
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("output/stage_b_preflight.json"))["verdict"])')" = "PASS_STAGE_B_PREFLIGHT_BEFORE_REFERENCE_ACCESS"
          curl --fail-with-body -L --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$REF_ID/zip" \
            -o input/withheld-reference.zip
          echo "$REF_SHA  input/withheld-reference.zip" | sha256sum -c -

      - name: Run one-shot exact-ID reveal
        run: |
          set -euo pipefail
          python orbittrace_v8_final_blind_discovery/run_stage_b.py reveal \
            --stage-a-artifact input/stage-a.zip \
            --preflight-json output/stage_b_preflight.json \
            --reference-artifact input/withheld-reference.zip \
            --output output
          cat output/STAGE_B_REVEAL.md

      - name: Record reveal provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/reveal_commit.txt
          sha256sum input/stage_b_execution_request.json input/stage-a.zip input/withheld-reference.zip output/FREEZE_MANIFEST.json > output/reveal_input_sha256.txt 2>/dev/null
          python --version > output/python_version.txt

      - name: Upload immutable Stage B reveal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v8-final-blind-stage-b
          path: output
          if-no-files-found: error
          retention-days: 90
