name: OrbitTrace P1 MAARSY 2018/2019 external execution

on:
  pull_request:
    branches:
      - agent/orbittrace-p1-maarsy-2018-2019-execution-freeze
    paths:
      - orbittrace_probabilistic_membership_p1/RUN_MAARSY_2018_2019.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-p1-maarsy-2018-2019-external
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  authorize:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Require one-file child, exact P1 PASS, literature superiority, and pristine history
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          test "$files" = 'orbittrace_probabilistic_membership_p1/RUN_MAARSY_2018_2019.md'
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          content="$(git show "$HEAD_SHA":orbittrace_probabilistic_membership_p1/RUN_MAARSY_2018_2019.md)"
          mode="$(printf '%s\n' "$content" | sed -n '1p')"
          p1_run="$(printf '%s\n' "$content" | sed -n '2p')"
          lit_run="$(printf '%s\n' "$content" | sed -n '3p')"
          test "$mode" = 'EXECUTE_P1_MAARSY_2018_2019_AFTER_DEVELOPMENT_AND_LITERATURE_PASS'
          [[ "$p1_run" =~ ^[0-9]+$ && "$lit_run" =~ ^[0-9]+$ ]]
          test "$(printf '%s\n' "$content" | wc -l)" -eq 3
          test ! -e orbittrace_probabilistic_membership_p1/RUN_MAARSY_2018_2019.md
          test "$(gh run view "$p1_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$lit_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          rm -rf /tmp/auth && mkdir -p /tmp/auth/{p1,lit}
          gh run download "$p1_run" --repo "$GITHUB_REPOSITORY" --name orbittrace-probabilistic-membership-p1-development --dir /tmp/auth/p1
          gh run download "$lit_run" --repo "$GITHUB_REPOSITORY" --name orbittrace-p1-matched-literature-result --dir /tmp/auth/lit
          python - <<'PY'
          import json
          p1=json.load(open('/tmp/auth/p1/probabilistic_membership_p1_development.json'))
          assert p1['verdict']=='PASS_PROBABILISTIC_MEMBERSHIP_P1_DEVELOPMENT'
          assert p1['configuration']['years']==[2022,2023] and p1['configuration']['blind_exclusion']==[20.0,55.0]
          assert p1['configuration']['parameter_search'] is False and p1['configuration']['new_members_can_seed_growth'] is False
          assert p1['configuration']['v8_source_commit']=='c9d6c44704013ba0c9430100e98a29a56b453304'
          assert p1['baseline_v8']['qualified_matches']==95 and p1['baseline_v8']['recovered_at_100']==58
          assert all(p1['gates'].values())
          lit=json.load(open('/tmp/auth/lit/p1_matched_literature.json'))
          assert lit['classification'] in {'BROAD_CATALOGUE_SUPERIORITY','SPARSE_STREAM_SUPERIORITY'},lit['classification']
          assert lit['years']==[2023,2025] and lit['blind_exclusion']==[20.0,55.0]
          assert lit['pairwise_only_no_cross_denominator_comparison'] is True
          assert not lit['matched_input_ineligible']
          PY
          rm -rf /tmp/auth

          # Execution-time pristine-panel re-audit. Known protocol/source-only records are allowed;
          # any unrecognized 2018/2019 scientific route blocks before dataset values.
          gh search prs '"MAARSY 2018/2019"' --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,body > /tmp/open.json
          gh search prs '"MAARSY 2018/2019"' --repo "$GITHUB_REPOSITORY" --state closed --limit 100 --json number,title,body > /tmp/closed.json
          CURRENT_PR="$PR_NUMBER" python - <<'PY'
          import json,os
          allowed={420,441,447,542,546,573,583,585,587,589,590,592,int(os.environ['CURRENT_PR'])}
          rows=json.load(open('/tmp/open.json'))+json.load(open('/tmp/closed.json'))
          unexpected=[(r['number'],r['title']) for r in rows if int(r['number']) not in allowed]
          assert not unexpected,unexpected
          scientific_exposure=[]
          for r in rows:
              n=int(r['number']); text=((r.get('title') or '')+' '+(r.get('body') or '')).lower()
              if n in {589,590,592,583}:
                  assert ('without execution' in text or 'never' in text or 'unreachable' in text or 'unopened' in text), (n,text[:200])
          print('PASS_P1_MAARSY_2018_2019_PRISTINE_HISTORY')
          PY
          if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts" --jq '.artifacts[].name' | grep -Eiq '^orbittrace-p1-maarsy-2018-2019-(preorbit|external)$'; then
            echo 'Existing P1 MAARSY 2018/2019 scientific artifact found; execution blocked' >&2
            exit 1
          fi
          echo PASS_P1_MAARSY_2018_2019_AUTHORIZATION_BEFORE_VALUES

  preorbit:
    needs: authorize
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      verdict: ${{ steps.classify.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.base.sha }}'}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: agent/orbittrace-p1-matched-literature-implementation-freeze, path: p1matched}
      - uses: actions/checkout@v4
        with: {repository: brandonlign/runner, ref: c9d6c44704013ba0c9430100e98a29a56b453304, path: exact-v8}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install exact frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'h5py==3.11.0'
          test "$(git -C p1matched hash-object orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel_intermediate.py)" = '498daf762bc82a664679998ea751feecff8033de'
          test "$(git -C exact-v8 rev-parse HEAD)" = 'c9d6c44704013ba0c9430100e98a29a56b453304'
          test "$(git -C exact-v8 hash-object orbittrace_pooled_year_centroid_v8/run_development.py)" = 'f248df78e1258b132b41aecca6a985a5eb782654'
          python -m py_compile orbittrace_probabilistic_membership_p1/maarsy_2018_2019_transport.py orbittrace_probabilistic_membership_p1/run_maarsy_2018_2019_geometry_membership_freeze.py
      - name: Reconstruct exact frozen P1 source
        run: |
          set -euo pipefail
          mkdir -p runtime preorbit
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          parts=sorted(Path('orbittrace_probabilistic_membership_p1/source_parts').glob('part*.b64'))
          assert [p.name for p in parts]==['part00.b64','part01.b64']
          source=gzip.decompress(base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts),validate=True))
          assert hashlib.sha256(source).hexdigest()=='e7847e067bab8d07038c998359ccbf0ca6e2ccf257f27f27f4aef999cc7a0508'
          Path('runtime/run_probabilistic_membership_p1.py').write_bytes(source)
          PY
          python -m py_compile runtime/run_probabilistic_membership_p1.py
      - name: Execute geometry-only promoted-v8 plus exact P1 membership freeze
        env:
          PYTHONPATH: .:exact-v8:p1matched
        run: |
          set -euo pipefail
          python -u orbittrace_probabilistic_membership_p1/run_maarsy_2018_2019_geometry_membership_freeze.py \
            --p1-source runtime/run_probabilistic_membership_p1.py \
            --p1-transfer-source p1matched/orbittrace_probabilistic_membership_p1_literature/run_pretruth_panel_intermediate.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --output preorbit
      - name: Freeze preorbit verdict
        id: classify
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('preorbit/p1_maarsy_2018_2019_preorbit_freeze.json'))
          assert r['verdict'] in {'PASS_P1_MAARSY_2018_2019_GEOMETRY_MEMBERSHIP_FREEZE','INCONCLUSIVE_P1_MAARSY_2018_2019_EXTERNAL_POWER','FAIL_P1_MAARSY_2018_2019_EXTERNAL_INTEGRITY'}
          assert r['orbit_access'] is False and r['label_access'] is False and r['target_information_access'] is False
          assert r['parameter_search'] is False and r['new_members_can_seed_growth'] is False
          print('verdict='+r['verdict'])
          PY
      - uses: actions/upload-artifact@v4
        with: {name: orbittrace-p1-maarsy-2018-2019-preorbit, path: preorbit, if-no-files-found: error, retention-days: 90}

  preorbit_terminal:
    needs: preorbit
    if: needs.preorbit.outputs.verdict != 'PASS_P1_MAARSY_2018_2019_GEOMETRY_MEMBERSHIP_FREEZE'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-p1-maarsy-2018-2019-preorbit, path: preorbit}
      - name: Preserve no-orbit terminal result
        run: |
          mkdir -p output
          cp preorbit/p1_maarsy_2018_2019_preorbit_freeze.json output/p1_maarsy_2018_2019_external_validation.json
          cp preorbit/p1_maarsy_2018_2019_preorbit_freeze.sha256 output/preorbit.sha256
          echo NO_ORBIT_ACCESS_PREORBIT_TERMINAL > output/CLAIM_BOUNDARY.txt
      - uses: actions/upload-artifact@v4
        with: {name: orbittrace-p1-maarsy-2018-2019-external, path: output, if-no-files-found: error, retention-days: 90}

  orbital:
    needs: preorbit
    if: needs.preorbit.outputs.verdict == 'PASS_P1_MAARSY_2018_2019_GEOMETRY_MEMBERSHIP_FREEZE'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.base.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install orbit-stage dependencies
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'requests==2.32.3' 'h5py==3.11.0'
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-p1-maarsy-2018-2019-preorbit, path: preorbit}
      - name: Restore exact frozen D_SH comparator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen output
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2" > /tmp/blob.json
          python - <<'PY'
          import base64,json
          obj=json.load(open('/tmp/blob.json')); assert obj['encoding']=='base64'
          open('frozen/literature_comparator_shared.py','wb').write(base64.b64decode(obj['content']))
          PY
          test "$(git hash-object frozen/literature_comparator_shared.py)" = 'ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2'
          python -m py_compile orbittrace_probabilistic_membership_p1/maarsy_2018_2019_transport.py orbittrace_probabilistic_membership_p1/run_maarsy_2018_2019_orbital_validation.py frozen/literature_comparator_shared.py
      - name: Execute frozen post-membership physical validation
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -u orbittrace_probabilistic_membership_p1/run_maarsy_2018_2019_orbital_validation.py \
            --preorbit preorbit/p1_maarsy_2018_2019_preorbit_freeze.json \
            --preorbit-sha preorbit/p1_maarsy_2018_2019_preorbit_freeze.sha256 \
            --dsh-comparator frozen/literature_comparator_shared.py \
            --output output
          python - <<'PY'
          import json
          r=json.load(open('output/p1_maarsy_2018_2019_external_validation.json'))
          assert r['verdict'] in {'FAIL_P1_MAARSY_2018_2019_EXTERNAL_INTEGRITY','INCONCLUSIVE_P1_MAARSY_2018_2019_EXTERNAL_POWER','PASS_P1_MAARSY_2018_2019_EXTERNAL_VALIDATION','FAIL_P1_MAARSY_2018_2019_EXTERNAL_VALIDATION'}
          assert r['configuration']['parameter_search'] is False and r['configuration']['alternate_control_resampling'] is False and r['configuration']['alternate_year_or_subset_search'] is False
          assert r['target_information_access'] is False
          print('ORBITTRACE_P1_MAARSY_2018_2019_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'Q_seed':r['Q_seed'],'Q_P1':r['Q_P1'],'valid_additions':r['valid_addition_pairs'],'addition_families':r['addition_families'],'precision_A':r['precision_A'],'valid_controls':r['valid_control_pairs'],'precision_C':r['precision_C'],'fisher_p':r['fisher_one_sided_p'],'coherent_seed_members':r['coherent_seed_members'],'coherent_P1_members':r['coherent_P1_members'],'power_gates':r['power_gates'],'scientific_gates':r['scientific_gates']},indent=2,sort_keys=True))
          print('ORBITTRACE_P1_MAARSY_2018_2019_RESULT_END')
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_probabilistic_membership_p1/maarsy_2018_2019_transport.py orbittrace_probabilistic_membership_p1/run_maarsy_2018_2019_orbital_validation.py frozen/literature_comparator_shared.py preorbit/* > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: orbittrace-p1-maarsy-2018-2019-external, path: output, if-no-files-found: error, retention-days: 90}
