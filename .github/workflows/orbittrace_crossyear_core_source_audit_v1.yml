name: OrbitTrace cross-year-core HDBSCAN v1 source audit

on:
  push:
    branches:
      - agent/orbittrace-crossyear-core-hdbscan-v1
    paths:
      - 'orbittrace_crossyear_core_hdbscan_v1/SOURCE_AUDIT_ACTIVATE.md'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.:orbittrace_crossyear_core_hdbscan_v1:orbittrace_recurrent_eom_hdbscan_v1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  source-only-zero-data:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-crossyear-core-hdbscan-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inherited runtime and verify execution pins
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          test "$(git hash-object orbittrace_crossyear_core_hdbscan_v1/PROTOCOL.md)" = '980d2f26d6477ff80d1b57606ee86ae96bebe972'
          test "$(git hash-object orbittrace_crossyear_core_hdbscan_v1/boruvka_adapter.py)" = 'a7fec249d82fef23158ae52897ae28f9d0126153'
          test "$(git hash-object orbittrace_crossyear_core_hdbscan_v1/run_development.py)" = '5a65877ba86e0a7b6f943966b0370a4b0ba11b4f'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile \
            orbittrace_crossyear_core_hdbscan_v1/boruvka_adapter.py \
            orbittrace_crossyear_core_hdbscan_v1/run_development.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py
          python orbittrace_crossyear_core_hdbscan_v1/run_development.py --help >/tmp/xycore_help.txt
          grep -q -- '--parent-result-json' /tmp/xycore_help.txt
          echo PASS_CROSSYEAR_CORE_BINDING_SOURCE_AUDIT_V1
      - name: Emit source-only audit receipt
        run: |
          set -euo pipefail
          mkdir -p orbittrace_crossyear_core_hdbscan_v1/output_source_audit
          cat > orbittrace_crossyear_core_hdbscan_v1/output_source_audit/source_audit.json <<'JSON'
          {
            "verdict": "PASS_CROSSYEAR_CORE_BINDING_SOURCE_AUDIT_V1",
            "scientific_data_access": false,
            "gmn_access": false,
            "sonotaco_access": false,
            "amos_access": false,
            "target_access": false,
            "boruvka_equivalence_run": 31846997065,
            "boruvka_equivalence_artifact": 9236242893,
            "boruvka_equivalence_digest": "sha256:084483583f08452a455462dd655a4092895332f3d89561686d3556944e10aa19"
          }
          JSON
          sha256sum \
            orbittrace_crossyear_core_hdbscan_v1/PROTOCOL.md \
            orbittrace_crossyear_core_hdbscan_v1/boruvka_adapter.py \
            orbittrace_crossyear_core_hdbscan_v1/run_development.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_crossyear_core_hdbscan_v1/output_source_audit/source_audit.json \
            > orbittrace_crossyear_core_hdbscan_v1/output_source_audit/source_sha256.txt
          git rev-parse HEAD > orbittrace_crossyear_core_hdbscan_v1/output_source_audit/execution_commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-crossyear-core-source-audit-v1
          path: orbittrace_crossyear_core_hdbscan_v1/output_source_audit
          if-no-files-found: error
          retention-days: 90
