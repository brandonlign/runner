name: StreamTube Stage-0

on:
  push:
    branches:
      - agent/stream-tube-stage0
    paths:
      - stream_tube_stage0/**
      - .github/workflows/stream_tube_stage0.yml
  pull_request:
    branches:
      - main
    paths:
      - stream_tube_stage0/**
      - .github/workflows/stream_tube_stage0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stream-tube-stage0
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stream-tube-stage0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stream_tube_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r stream_tube_stage0/requirements.txt
      - name: Verify launcher and frozen source
        run: |
          python -m py_compile stream_tube_stage0/run_stage0.py
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payload = Path('stream_tube_stage0/run_stage0.py.gz.b64')
          source = gzip.decompress(base64.b64decode(''.join(payload.read_text().split()), validate=True))
          expected = '52a7acbcefd19a745bd53a0d362688cabdd4e9d1dadef62716da2d4b2c89daab'
          actual = hashlib.sha256(source).hexdigest()
          print(f'bytes={len(source)} sha256={actual}')
          assert len(source) == 27519
          assert actual == expected
          compile(source, '<frozen-stream-tube-stage0>', 'exec')
          PY
      - name: Run frozen real-background kill test
        run: python stream_tube_stage0/run_stage0.py --calibration-trials 25 --null-trials 20 --injection-trials 20
      - name: Record execution provenance
        run: |
          mkdir -p stream_tube_stage0/results
          sha256sum stream_tube_stage0/run_stage0.py.gz.b64 stream_tube_stage0/run_stage0.py > stream_tube_stage0/results/source_files_sha256.txt
          python --version > stream_tube_stage0/results/python_version.txt
          python -m pip freeze > stream_tube_stage0/results/environment.txt
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: stream-tube-stage0
          path: |
            stream_tube_stage0/results
            stream_tube_stage0/PROTOCOL.md
            stream_tube_stage0/PRIOR_ART_BOUNDARY.md
            stream_tube_stage0/run_stage0.py
            stream_tube_stage0/run_stage0.py.gz.b64
          if-no-files-found: error
          retention-days: 90
      - name: Preserve benchmark result on runner branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stream_tube_stage0/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Preserve StreamTube Stage-0 result'
            git pull --rebase origin agent/stream-tube-stage0
            git push origin HEAD:agent/stream-tube-stage0
          fi
