name: OrbitTrace v6 shard0 exact-equivalent rescue

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-fanout-shard0-rescue
    paths:
      - orbittrace_v6_shard0_rescue/RUN_RESCUE.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-v6-shard0-rescue
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  authorize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Require one-file rescue child
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init /tmp/guard >/dev/null
          cd /tmp/guard
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = 'orbittrace_v6_shard0_rescue/RUN_RESCUE.md'
          test "$(git show "$HEAD_SHA":orbittrace_v6_shard0_rescue/RUN_RESCUE.md)" = 'EXECUTE_SHARD0_EXACT_EQUIVALENT_RESCUE'
          echo PASS_SHARD0_RESCUE_AUTHORIZATION

  rescue-slice:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        rescue: [0, 1, 2, 3]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-fanout-shard0-rescue
          path: execution
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v6/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r frozen-v6/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Restore original preexact 2023 and exact runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p preexact output
          gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name orbittrace-v6-fanout-preexact-2023 --dir preexact
          PYTHONPATH=execution bash execution/orbittrace_v6_shard0_rescue/bootstrap.sh
      - name: Execute exact contiguous rescue slices
        env:
          PYTHONPATH: execution:frozen-v6/orbittrace_wavelet_catalogue_v3:frozen-v6/orbittrace_multi_anchor_energy_v3:/tmp
        run: |
          set -euo pipefail
          python -u execution/orbittrace_v6_shard0_rescue/run_slice.py \
            --rescue-index '${{ matrix.rescue }}' --rescue-count 4 --workers 4 \
            --preexact-checkpoint preexact/v6_preexact_2023.pkl \
            --repaired-source /tmp/v6.repaired.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 \
            --output output
      - uses: actions/upload-artifact@v4
        with:
          name: shard0-rescue-slice-${{ matrix.rescue }}
          path: output
          if-no-files-found: error
          retention-days: 90

  assemble:
    needs: rescue-slice
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-fanout-shard0-rescue
          path: execution
      - name: Restore preexact checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p preexact slices replacement
          gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name orbittrace-v6-fanout-preexact-2023 --dir preexact
      - uses: actions/download-artifact@v4
        with:
          pattern: shard0-rescue-slice-*
          path: slices
          merge-multiple: true
      - name: Reassemble exact v2-compatible shard0
        env:
          PYTHONPATH: execution
        run: |
          python -u execution/orbittrace_v6_shard0_rescue/assemble.py \
            --preexact-checkpoint preexact/v6_preexact_2023.pkl \
            --slices-dir slices \
            --output replacement
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-v6-fanout-exact-2023-0-rescue
          path: replacement
          if-no-files-found: error
          retention-days: 90

  finalize:
    needs: assemble
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-fanout-shard0-rescue
          path: execution
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v6/ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip -r frozen-v6/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Restore all preserved original artifacts and exact runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p preexact2022 preexact2023 exact2022 exact2023 year fixed4 frozen-v6/output_rescue
          gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name orbittrace-v6-fanout-preexact-2022 --dir preexact2022
          gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name orbittrace-v6-fanout-preexact-2023 --dir preexact2023
          for i in 0 1 2 3 4 5; do gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name "orbittrace-v6-fanout-exact-2022-$i" --dir exact2022; done
          for i in 1 2 3 4 5; do gh run download 31282128101 --repo "$GITHUB_REPOSITORY" --name "orbittrace-v6-fanout-exact-2023-$i" --dir exact2023; done
          gh run download 31106001133 --repo "$GITHUB_REPOSITORY" --name orbittrace-fixed4-support-normalized-wrapper-development --dir fixed4
          PYTHONPATH=execution bash execution/orbittrace_v6_shard0_rescue/bootstrap.sh
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-v6-fanout-exact-2023-0-rescue
          path: exact2023
      - name: Replay both years from exact artifacts
        env:
          PYTHONPATH: execution:frozen-v6/orbittrace_wavelet_catalogue_v3:frozen-v6/orbittrace_multi_anchor_energy_v3:/tmp
        run: |
          set -euo pipefail
          python -u execution/orbittrace_v6_exact_fanout_v2/replay_exact_year.py \
            --year 2022 --preexact-checkpoint preexact2022/v6_preexact_2022.pkl --exact-shards-dir exact2022 \
            --repaired-source /tmp/v6.repaired.py --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 --output year
          python -u execution/orbittrace_v6_exact_fanout_v2/replay_exact_year.py \
            --year 2023 --preexact-checkpoint preexact2023/v6_preexact_2023.pkl --exact-shards-dir exact2023 \
            --repaired-source /tmp/v6.repaired.py --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 --output year
      - name: Replay exact year checkpoints through unchanged repaired main
        env:
          PYTHONPATH: execution:frozen-v6/orbittrace_wavelet_catalogue_v3:frozen-v6/orbittrace_multi_anchor_energy_v3:/tmp
        run: |
          set -euo pipefail
          python -u execution/orbittrace_v6_checkpointed_fallback/combine_with_checkpoints.py \
            --repaired-source /tmp/v6.repaired.py \
            --checkpoint-2022 year/v6_year_2022.pkl --checkpoint-2023 year/v6_year_2023.pkl \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts frozen-v6/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v6/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v6/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v6/mondrian_clique_development/source_parts_v2 \
            --fixed4-baseline-json fixed4/orbittrace_fixed4_support_wrapper_development.json \
            --output frozen-v6/output_rescue
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('frozen-v6/output_rescue/v3_primary_catalogue_v6_development.json').read_text())
          assert r['verdict'] in {'PASS_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT','FAIL_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert all(a['proposal_cap_per_window']==512 for a in r['year_audits'])
          assert all(a['max_primary_proposals_per_year']==36864 for a in r['year_audits'])
          print('ORBITTRACE_SHARD0_RESCUE_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'evaluation':{k:v for k,v in r['evaluation'].items() if k!='per_label'},'gates':r['gates']},indent=2))
          print('ORBITTRACE_SHARD0_RESCUE_RESULT_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v6-shard0-rescue-development
          path: frozen-v6/output_rescue
          if-no-files-found: error
          retention-days: 90
