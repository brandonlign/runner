name: ISEF NGC1427A PHANGS PN classification control
on:
  push:
    paths:
      - 'isef/ngc1427a_phangs_classification_control.py'
      - '.github/workflows/isef-ngc1427a-phangs-classification-control.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: timeout 240s python isef/ngc1427a_phangs_classification_control.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-ngc1427a-phangs-classification-control
          path: results/ngc1427a_phangs_classification_control.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## NGC1427A PHANGS classification positive control'; echo '```json'; cat results/ngc1427a_phangs_classification_control.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
