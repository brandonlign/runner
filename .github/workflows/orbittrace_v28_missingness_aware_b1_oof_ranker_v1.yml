name: OrbitTrace v28 missingness-aware B1 SonotaCo development
on:
  pull_request:
    branches: [agent/orbittrace-v27-b1-applicability-census-v1]
    paths:
      - 'orbittrace_v28_missingness_aware_b1_oof_ranker_v1/**'
      - '.github/workflows/orbittrace_v28_missingness_aware_b1_oof_ranker_v1.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
env: {PYTHONUNBUFFERED: '1', OMP_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1', MKL_NUM_THREADS: '1', NUMEXPR_NUM_THREADS: '1'}
jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/orbittrace-v28-missingness-aware-b1-oof-ranker-dev-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed evaluation runtime
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/v22 input/census input/truth output/sugar output/hdbscan output/result
          test "$(git hash-object orbittrace_v23_worst_year_oof_ranker_v1/train_evaluate.py)" = '67ce5e68106e5ce34f3ea4ad2afc9f49824698c5'
          python -m py_compile orbittrace_v28_missingness_aware_b1_oof_ranker_v1/build_pretruth.py orbittrace_v28_missingness_aware_b1_oof_ranker_v1/train_evaluate.py
      - uses: actions/download-artifact@v4
        with: {name: orbittrace-active-urc-ranker-source-export-v1, path: input/ranker, github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 31344632499}
      - name: Verify exact ranker source
        run: |
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - name: Restore immutable valid-v22 pretruth artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074344777/zip' -o input/v22.zip
          echo 'd070ce8e17c56d6a17b0e74377ef19d15b9422ca67a704f0b05c54b0715b1ae1  input/v22.zip' | sha256sum -c -
          unzip -q input/v22.zip -d input/v22
          python - <<'PY'
          import json
          for r in ['sugar','hdbscan']:
              m=json.load(open(f'input/v22/{r}/V22_PRETRUTH_FEATURE_MANIFEST.json')); f=json.load(open(f'input/v22/{r}/family_memberships.json'))
              assert m['truth_accessed'] is False and f['truth_accessed'] is False and m['feature_dimension']==71
          PY
      - name: Restore immutable truth-free B1 census
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9076629789/zip' -o input/census.zip
          echo 'da1bfcb566ce4b20150e06fb2a0d58d4a4ce15dc78088830f072e724fa9e7d42  input/census.zip' | sha256sum -c -
          unzip -q input/census.zip -d input/census
          python - <<'PY'
          import json
          for r in ['sugar','hdbscan']:
              d=json.load(open(f'input/census/census-{r}/V27_B1_APPLICABILITY_CENSUS_{r.upper()}.json'))
              assert d['truth_accessed'] is False and d['scientific_performance_evaluated'] is False and d['target_information_access'] is False
              assert set(d['annual_status_counts']) <= {'PASS','LT4_SCREENED_LOCAL_FIELD','LT4_SOURCE_SEEDS'}
          PY
      - name: Freeze v28 Sugar features before truth
        run: |
          python -u orbittrace_v28_missingness_aware_b1_oof_ranker_v1/build_pretruth.py --route sugar --v22-root input/v22/sugar --census-json input/census/census-sugar/V27_B1_APPLICABILITY_CENSUS_SUGAR.json --output output/sugar
      - name: Freeze v28 HDBSCAN features before truth
        run: |
          python -u orbittrace_v28_missingness_aware_b1_oof_ranker_v1/build_pretruth.py --route hdbscan --v22-root input/v22/hdbscan --census-json input/census/census-hdbscan/V27_B1_APPLICABILITY_CENSUS_HDBSCAN.json --output output/hdbscan
      - name: Freeze both v28 pretruth outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          for r in ['sugar','hdbscan']:
              m=json.load(open(f'output/{r}/V28_PRETRUTH_MANIFEST.json'))
              assert m['stage']=='V28_MISSINGNESS_AWARE_B1_PRETRUTH_FREEZE' and m['truth_accessed'] is False and m['feature_dimension']==77 and m['feature_search'] is False
              assert set(m['status_counts'])=={'PASS','LT4_SCREENED_LOCAL_FIELD','LT4_SOURCE_SEEDS'}
          PY
          sha256sum output/sugar/features_v28.npy output/sugar/b1_missingness_features.npy output/sugar/V28_PRETRUTH_MANIFEST.json output/hdbscan/features_v28.npy output/hdbscan/b1_missingness_features.npy output/hdbscan/V28_PRETRUTH_MANIFEST.json > output/V28_ALL_PRETRUTH_SHA256.txt
      - name: Load immutable exposed truth only after v28 feature freeze
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
          python - <<'PY'
          import json
          assert json.load(open('input/truth/V15_FINAL_LITERATURE_RESULT.json'))['verdict']=='FAIL_FINAL_LITERATURE_SUPERIORITY'
          PY
      - name: Evaluate frozen v28 strict-group OOF ranking
        env: {PYTHONPATH: 'orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker'}
        run: |
          set -euo pipefail
          python -u orbittrace_v28_missingness_aware_b1_oof_ranker_v1/train_evaluate.py --sugar-v22 input/v22/sugar --hdb-v22 input/v22/hdbscan --sugar-v28 output/sugar --hdb-v28 output/hdbscan --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py --output output/result
      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v28_missingness_aware_b1_oof_ranker_v1/PROTOCOL.md orbittrace_v28_missingness_aware_b1_oof_ranker_v1/build_pretruth.py orbittrace_v28_missingness_aware_b1_oof_ranker_v1/train_evaluate.py input/ranker/run_urc_union_ranker.py > output/V28_SOURCE_SHA256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: orbittrace-v28-missingness-aware-b1-oof-ranking-development-v1, path: output, if-no-files-found: error, retention-days: 90}
