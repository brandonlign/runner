name: Affine stream-tube pinned source audit

on:
  pull_request:
    branches:
      - agent/affine-stream-tube-preflight
    paths:
      - .github/workflows/affine_stream_tube_source_audit.yml
      - affine_stream_tube_pinned_source_audit/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affine-stream-tube-pinned-source-audit
  cancel-in-progress: true

jobs:
  no-score-pinned-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/affine-stream-tube-pinned-source-audit
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact original failed source by commit
        run: |
          set -euo pipefail
          mkdir -p output /tmp/original_parts
          git fetch --depth=1 origin 2e4fbda1c2f93df3036b3634aa7fa5704c390614
          git show FETCH_HEAD:affine_stream_tube_preflight/source_parts/part00.b64 > /tmp/original_parts/part00.b64
          git show FETCH_HEAD:affine_stream_tube_preflight/source_parts/part01.b64 > /tmp/original_parts/part01.b64
          python - <<'PY'
          import ast
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          parts = sorted(Path('/tmp/original_parts').glob('part*.b64'))
          if [part.name for part in parts] != ['part00.b64', 'part01.b64']:
              raise RuntimeError(f'unexpected source parts: {[part.name for part in parts]}')
          encoded = ''.join(''.join(part.read_text().split()) for part in parts)
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = 'e82eef021326cb5b570521064a6c78001cc5d0cac53fdb2e1e966362f3d4c1bb'
          if digest != expected:
              raise RuntimeError(f'original source mismatch: {digest}')
          source_path = Path('output/run_affine_tube_preflight.py')
          source_path.write_bytes(source)
          tree = ast.parse(source.decode('utf-8'))
          functions = [
              {'name': node.name, 'lineno': node.lineno, 'signature': ast.unparse(node.args)}
              for node in tree.body if isinstance(node, ast.FunctionDef)
          ]
          calls = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  try:
                      calls.append({'lineno': node.lineno, 'call': ast.unparse(node.func)})
                  except Exception:
                      pass
          interface = {
              'pinned_commit': '2e4fbda1c2f93df3036b3634aa7fa5704c390614',
              'source_sha256': digest,
              'source_bytes': len(source),
              'functions': functions,
              'calls': calls,
          }
          Path('output/interface.json').write_text(json.dumps(interface, indent=2, sort_keys=True))
          Path('output/source_sha256.txt').write_text(digest + '\n')
          print(json.dumps(interface, indent=2, sort_keys=True))
          PY
          python -m py_compile output/run_affine_tube_preflight.py
          sed -n '118,160p' output/run_affine_tube_preflight.py > output/error_context.txt
          cat output/error_context.txt
      - name: Record provenance
        run: |
          sha256sum \
            affine_stream_tube_pinned_source_audit/PROTOCOL.md \
            /tmp/original_parts/part00.b64 \
            /tmp/original_parts/part01.b64 \
            output/run_affine_tube_preflight.py \
            > output/source_and_payload_sha256.txt
          python --version > output/python_version.txt
      - name: Upload exact source audit
        uses: actions/upload-artifact@v4
        with:
          name: affine-stream-tube-pinned-source-audit
          path: output
          if-no-files-found: error
          retention-days: 90
