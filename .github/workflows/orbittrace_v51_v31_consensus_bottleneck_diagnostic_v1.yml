name: OrbitTrace v51 v31 consensus-bottleneck diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v51_v31_consensus_bottleneck_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v51_v31_consensus_bottleneck_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v51-v31-consensus-bottleneck-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen diagnostic sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/truth output/capture output/diag
          test "$(git hash-object orbittrace_v51_v31_consensus_bottleneck_diagnostic_v1/PROTOCOL.md)" = '74902a55736c856dbbf2137fe1068eb458360ce3'
          test "$(git hash-object orbittrace_v51_v31_consensus_bottleneck_diagnostic_v1/diagnose.py)" = '2aeff842ec4bd6ddc4830cc6ce3f652bce3a87e6'
          test "$(git hash-object orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py)" = '917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v51_v31_consensus_bottleneck_diagnostic_v1/diagnose.py orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py
          echo PASS_V51_FROZEN_SOURCE_PINS

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify immutable #839 ranker before truth
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          echo PASS_V51_IMMUTABLE_RANKER

      - name: Restore immutable #950 pretruth payload before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          for route,n in (('sugar',267),('hdbscan',229)):
              m=json.load(open(f'input/payload/{route}/V22_PRETRUTH_FEATURE_MANIFEST.json'))
              f=json.load(open(f'input/payload/{route}/family_memberships.json'))
              assert m['truth_accessed'] is False and f['truth_accessed'] is False
              assert m['feature_dimension']==71 and len(m['family_ids'])==n and len(f['families'])==n
              assert [str(x['family_id']) for x in f['families']]==list(map(str,m['family_ids']))
              assert m['target_information_access'] is False
              assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          h=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          assert len(h['v19_order'])==229 and set(map(str,h['v19_order']))==set(map(str,h['family_ids']))
          print('PASS_V51_IMMUTABLE_PRETRUTH_PAYLOAD')
          PY

      - name: Load immutable exposed SonotaCo truth after scientific definition and immutable inputs are pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
          echo PASS_V51_EXPOSED_TRUTH_LOADED_AFTER_DEFINITION_PINS

      - name: Reproduce exact v31 and capture complete fusion-input bottleneck vector
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v51_v31_consensus_bottleneck_diagnostic_v1/diagnose.py capture \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --output output/capture

      - name: Enforce exact-parent capture and diagnostic-outcome-free vector
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='output/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json'
          r=json.load(open(p))
          assert r['verdict']=='PASS_V51_V31_CONSENSUS_BOTTLENECK_VECTOR_CAPTURE'
          assert r['scientific_role']=='EXACT_V31_FUSION_INPUT_RANKS_CAPTURED_BEFORE_DIAGNOSTIC_RECOVERABILITY_ATTACHMENT'
          assert r['parent']=='v31 local-geometry-margin OOF' and r['parent_source_blob']=='917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          assert r['ranker_source_sha256']=='dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          assert r['family_count']==229 and len(r['families'])==229 and len({x['family_id'] for x in r['families']})==229
          assert r['local_order_sha256']=='9898a2ad69f251595b0de4ce5763ffb6641ad27141b6e54f839ebe240eb94595'
          assert r['fused_order_sha256']=='85ac3f29a443c35b3812cf28c99ef13474fc3e0455458e20b41cec64d942073d'
          exp={('sugar',2013):(0.2719801488280529,16),('sugar',2014):(0.31529041952487225,17),('hdbscan',2013):(0.14888037368183737,9),('hdbscan',2014):(0.15198123772301594,9)}
          assert len(r['parent_controls'])==4
          for x in r['parent_controls']:
              e=exp[(x['comparator'],x['year'])]
              assert abs(x['macro_f1']-e[0])<1e-12 and x['recovered_f1_gt_0_5']==e[1]
          assert r['exact_v31_exposed_oof_parent_reproduced'] is True
          assert r['diagnostic_recoverability_attached'] is False and r['annual_own_family_f1_attached'] is False
          for k in ('literature_budget_used_in_statistic','boundary_identity_used','component_quality_topology_signal_used','new_candidate_order_evaluated','selector_evaluated','successor_selected','threshold_selected','top_k_selected','rank_window_selected','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print('PASS_V51_BOTTLENECK_VECTOR',hashlib.sha256(open(p,'rb').read()).hexdigest(),r['canonical_sha256_without_self_field'],r['v19_order_sha256'])
          PY

      - name: Run sole frozen consensus-bottleneck diagnostic
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v51_v31_consensus_bottleneck_diagnostic_v1/diagnose.py diagnose \
            --vector-file output/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json \
            --hdb-root input/payload/hdbscan --truth-root input/truth --output output/diag

      - name: Enforce diagnostic-only scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC','FAIL_V51_V31_CONSENSUS_BOTTLENECK_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_V50_V31_FUSION_MECHANISM_DIAGNOSTIC_ONLY_NO_NEW_ORDER_OR_PANEL_EVALUATED'
          assert r['parent']=='v31 local-geometry-margin OOF' and r['parent_source_blob']=='917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          assert r['ranker_source_sha256']=='dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          assert r['family_count']==229 and set(r['annual_diagnostics'])=={'2013','2014'}
          for y in ('2013','2014'):
              assert set(r['annual_diagnostics'][y])=={'recoverable','nonrecoverable','median_difference_recoverable_minus_nonrecoverable','direction_pass'}
          for k in ('new_candidate_order_evaluated','literature_panel_evaluated','selector_evaluated','replacement_rule_evaluated','successor_selected','minimax_successor_evaluated','representative_group_aggregation_evaluated','auc_evaluated','correlation_evaluated','regression_evaluated','p_value_evaluated','alternate_rank_statistic_search','rank_disagreement_test','threshold_search','quantile_search','top_k_search','rank_window_search','literature_budget_analysis','fusion_weight_search','rank_algebra_search','pareto_order_evaluated','component_quality_topology_rescue','boundary_identity_used','oracle_identity_used_for_ranking','feature_search','model_search','k_search','metric_search','scaling_search','diversity_search','source_quota_selected','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['annual_diagnostics'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v51_v31_consensus_bottleneck_diagnostic_v1/PROTOCOL.md \
            orbittrace_v51_v31_consensus_bottleneck_diagnostic_v1/diagnose.py \
            orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py \
            input/ranker/run_urc_union_ranker.py input/payload.zip input/truth.zip \
            output/capture/V51_V31_CONSENSUS_BOTTLENECK_VECTOR.json \
            > output/V51_CONSENSUS_BOTTLENECK_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v51-v31-consensus-bottleneck-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
