name: ISEF NGC1427A MUSE FITS header probe
on:
  push:
    paths:
      - 'isef/ngc1427a_muse_fits_header_probe.py'
      - '.github/workflows/isef-ngc1427a-muse-fits-header-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: timeout 180s python isef/ngc1427a_muse_fits_header_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-ngc1427a-muse-fits-header-probe
          path: results/ngc1427a_muse_fits_header_probe.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## NGC1427A MUSE FITS header probe'; echo '```json'; cat results/ngc1427a_muse_fits_header_probe.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
