name: OrbitTrace station-weighted topomodal recovery v1

on:
  push:
    branches:
      - agent/orbittrace-station-weighted-topomodal-recovery-v1
    paths:
      - '.github/workflows/orbittrace_station_weighted_topomodal_recovery_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 312b1b718ae105813de242355142a74e7d377d65
          path: frozen-intrinsic
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 4c174ccc017938c91ca6eacdf732f819f10618fc
          path: frozen-rdtm
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: f00fa0b643f8cb6bccc57ce396d85e6f3b3e74f7
          path: frozen-local

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and audit frozen scientific sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/v3 input/v8 input/ranker input/structural input/station input/numstat output
          test "$(git hash-object orbittrace_station_weighted_topomodal_recovery_v1/PROTOCOL.md)" = '4521f76928617cef538f126560d0507a80b6a51d'
          test "$(git hash-object orbittrace_station_weighted_topomodal_recovery_v1/generate_prelabel.py)" = 'a4d0a0de18f9a7cc894640a6adaa8066c876f959'
          test "$(git hash-object orbittrace_station_weighted_topomodal_recovery_v1/evaluate_prelabel.py)" = '93c53ce5c7b64769f665135861cf0063c21c465f'
          test "$(git -C frozen-rdtm hash-object orbittrace_rankdensity_topomodal_v1/generate_prelabel.py)" = '189e50ed27e0e62ce275a41f6a46baf1f2c48baa'
          test "$(git -C frozen-intrinsic hash-object orbittrace_topomodal_sparse_recovery_v1/run_development.py)" = '752df8212ce601227f6e9170b0fe994ba06b515d'
          test "$(git -C frozen-local hash-object orbittrace_local_orderstat_scale_v1/run_diagnostic.py)" = 'd3bf781ba697447beb8f695dca21a137c7212408'
          test "$(git hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_station_weighted_topomodal_recovery_v1/generate_prelabel.py orbittrace_station_weighted_topomodal_recovery_v1/evaluate_prelabel.py
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py)
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-hierarchy-scale-v1
          path: input/structural
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31955621864
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-topomodal-numstat-availability-v1
          path: input/numstat
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31972929547
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-station-weighted-topomodal-scale-v1
          path: input/station
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31973153123

      - name: Verify immutable prerequisites
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json | cut -d' ' -f1)" = 'e8cf7d92e96db9a1c99578f6efc63baf1534b94ab975e94f789fa6bc4a718497'
          test "$(sha256sum input/numstat/audited_union_numstat_mapping.json | cut -d' ' -f1)" = '92f6ce1961b0e8642f6bdd1cc455b07785ed8224c8f8f3d467d69fac2b82921c'
          test "$(sha256sum input/station/STATION_WEIGHTED_TOPOMODAL_SCALE_V1.json | cut -d' ' -f1)" = 'a7cc8921a9431028f08c92479a001021160ee0e8cce6ed346a80d0d2510a8bb8'
          python - <<'PY'
          import json
          a=json.load(open('input/numstat/TOPOMODAL_NUMSTAT_AVAILABILITY_V1.json')); s=json.load(open('input/station/STATION_WEIGHTED_TOPOMODAL_SCALE_V1.json'))
          assert a['verdict']=='PASS_TOPOMODAL_NUMSTAT_AVAILABILITY_V1' and a['audited_mapping_sha256']=='92f6ce1961b0e8642f6bdd1cc455b07785ed8224c8f8f3d467d69fac2b82921c'
          assert all(v['all_events_usable'] is True for v in a['subset_stats'].values())
          assert s['interpretation']=='SUPPORTS_STATION_WEIGHTED_TOPOMODAL_CROSS_SCALE_COHERENCE'
          assert s['availability_mapping_sha256']=='92f6ce1961b0e8642f6bdd1cc455b07785ed8224c8f8f3d467d69fac2b82921c'
          assert s['shower_truth_used'] is False and s['target_information_access'] is False
          print('PASS_STATION_WEIGHTED_RECOVERY_PREREQUISITES')
          PY

      - name: Generate immutable prelabel
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_station_weighted_topomodal_recovery_v1/generate_prelabel.py \
            --base-generator frozen-rdtm/orbittrace_rankdensity_topomodal_v1/generate_prelabel.py \
            --intrinsic-runner frozen-intrinsic/orbittrace_topomodal_sparse_recovery_v1/run_development.py \
            --structural-runner orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --original-structural-result input/structural/TOPOMODAL_HIERARCHY_SCALE_V1.json \
            --station-structural-result input/station/STATION_WEIGHTED_TOPOMODAL_SCALE_V1.json \
            --numstat-mapping input/numstat/audited_union_numstat_mapping.json \
            --availability-result input/numstat/TOPOMODAL_NUMSTAT_AVAILABILITY_V1.json \
            --local-orderstat-source frozen-local/orbittrace_local_orderstat_scale_v1/run_diagnostic.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Seal prelabel before truth
        run: |
          set -euo pipefail
          sha256sum output/STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1_PRELABEL.json | cut -d' ' -f1 > output/prelabel_sha256.txt
          python - <<'PY'
          import hashlib,json
          raw=open('output/STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1_PRELABEL.json','rb').read(); d=hashlib.sha256(raw).hexdigest(); p=json.loads(raw)
          assert d==open('output/prelabel_sha256.txt').read().strip()
          assert p['schema']=='ORBITTRACE_STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1_PRELABEL'
          assert p['scientific_role']=='PRELABEL_STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1'
          assert p['station_structural_result_sha256']=='a7cc8921a9431028f08c92479a001021160ee0e8cce6ed346a80d0d2510a8bb8'
          assert p['availability_mapping_sha256']=='92f6ce1961b0e8642f6bdd1cc455b07785ed8224c8f8f3d467d69fac2b82921c'
          assert p['intrinsic_source_blob']=='752df8212ce601227f6e9170b0fe994ba06b515d'
          assert p['candidate_budget_shortage_any_panel'] is False and len(p['subsets'])==8
          assert p['structural_prerequisite_pass'] is True
          assert p['blind_exclusion']==[20.0,55.0] and p['shower_truth_used'] is False and p['target_information_access'] is False
          print('immutable_prelabel_sha256',d)
          PY

      - name: Evaluate sealed prelabel
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_station_weighted_topomodal_recovery_v1/evaluate_prelabel.py \
            --intrinsic-runner frozen-intrinsic/orbittrace_topomodal_sparse_recovery_v1/run_development.py \
            --prelabel output/STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1_PRELABEL.json \
            --station-structural-result input/station/STATION_WEIGHTED_TOPOMODAL_SCALE_V1.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce truth-result contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='output/STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1_PRELABEL.json'; r=json.load(open('output/STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1.json'))
          assert r['schema']=='ORBITTRACE_STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1'
          assert r['verdict'] in {'PASS_STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1','FAIL_STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1'}
          assert r['prelabel_sha256']==hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert len(r['gates'])==10 and len(r['panels'])==16
          assert r['station_structural_result_sha256']=='a7cc8921a9431028f08c92479a001021160ee0e8cce6ed346a80d0d2510a8bb8'
          assert r['availability_mapping_sha256']=='92f6ce1961b0e8642f6bdd1cc455b07785ed8224c8f8f3d467d69fac2b82921c'
          assert r['blind_exclusion']==[20.0,55.0] and r['target_information_access'] is False and r['target_region_events_accessed'] is False
          print(r['verdict']); print(json.dumps({'scales':r['scale_aggregates'],'gates':r['gates']},indent=2,sort_keys=True))
          PY

      - name: Preserve exact provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_station_weighted_topomodal_recovery_v1/PROTOCOL.md orbittrace_station_weighted_topomodal_recovery_v1/generate_prelabel.py orbittrace_station_weighted_topomodal_recovery_v1/evaluate_prelabel.py frozen-rdtm/orbittrace_rankdensity_topomodal_v1/generate_prelabel.py frozen-intrinsic/orbittrace_topomodal_sparse_recovery_v1/run_development.py input/numstat/audited_union_numstat_mapping.json input/station/STATION_WEIGHTED_TOPOMODAL_SCALE_V1.json output/STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1_PRELABEL.json output/STATION_WEIGHTED_TOPOMODAL_RECOVERY_V1.json > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-station-weighted-topomodal-recovery-v1
          path: output
          if-no-files-found: error
          retention-days: 90
