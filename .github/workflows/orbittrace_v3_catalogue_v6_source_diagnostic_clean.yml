name: OrbitTrace v3 catalogue v6 source-only diagnostic

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - .github/workflows/orbittrace_v3_catalogue_v6_source_diagnostic_clean.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-catalogue-v6-source-diagnostic-clean
          path: diagnostic

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6

      - name: Reconstruct exact frozen v6 source only
        run: |
          set -euo pipefail
          test ! -e input
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 \
            | tr -d '\n\r' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/run_v3_primary_catalogue_v6.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/run_v3_primary_catalogue_v6.py' | sha256sum -c -

      - name: Audit missing component construction without catalogue access
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          p = Path('/tmp/run_v3_primary_catalogue_v6.py')
          text = p.read_text()
          tree = ast.parse(text)
          lines = text.splitlines()
          scan = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'scan_year_v6')
          builder = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'component_records_track_v6')

          print(f'SCAN_YEAR_V6_LINES={scan.lineno}-{scan.end_lineno}')
          for i in range(416, 462):
              print(f'{i:04d}: {lines[i-1]}')

          print(f'COMPONENT_RECORDS_TRACK_V6_LINES={builder.lineno}-{builder.end_lineno}')
          for i in range(builder.lineno, builder.end_lineno + 1):
              print(f'{i:04d}: {lines[i-1]}')

          args = [a.arg for a in builder.args.args]
          defaults = [ast.get_source_segment(text, d) for d in builder.args.defaults]
          print('COMPONENT_BUILDER_ARGS=', args)
          print('COMPONENT_BUILDER_DEFAULTS=', defaults)

          stores = {}
          loads = []
          for node in ast.walk(scan):
              if isinstance(node, ast.Name):
                  if isinstance(node.ctx, ast.Store):
                      stores.setdefault(node.id, []).append(node.lineno)
                  elif isinstance(node.ctx, ast.Load):
                      loads.append((node.id, node.lineno))

          assert not stores.get('primary_components')
          assert not stores.get('rescue_components')
          assert any(n == 'primary_components' for n, _ in loads)
          assert any(n == 'rescue_components' for n, _ in loads)
          assert 'component_records_track_v6' in [n.name for n in tree.body if isinstance(n, ast.FunctionDef)]
          print('PASS_V6_COMPONENT_BUILDER_SIGNATURE_DIAGNOSTIC')
          PY

      - name: Assert source-only boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          echo 'NO_CATALOGUE_ACCESS_NO_LABEL_ACCESS_NO_TARGET_ACCESS'
