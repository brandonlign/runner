name: OrbitTrace M2D SACV recurrence-first v1 GMN development

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/orbittrace-m2d-sacv-v1-gmn-development]
    paths:
      - 'orbittrace_m2d_sacv_recurrence_first_v1/source_parts/**'
      - '.github/workflows/orbittrace_m2d_sacv_recurrence_first_v1_gmn.yml'

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: orbittrace-m2d-sacv-recurrence-first-v1-gmn-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reassemble and verify frozen successor source
        run: |
          set -euo pipefail
          cat orbittrace_m2d_sacv_recurrence_first_v1/source_parts/part*.b64 > /tmp/rf_source.tgz.b64
          test "$(wc -c < /tmp/rf_source.tgz.b64)" = '17488'
          base64 -d /tmp/rf_source.tgz.b64 > /tmp/rf_source.tgz
          echo '30776891519a9884c36eb322f2308a9ced3f60ddbe93073f9437e61794ba9885  /tmp/rf_source.tgz' | sha256sum -c -
          tar -xzf /tmp/rf_source.tgz
          test "$(sha256sum orbittrace_m2d_sacv_recurrence_first_v1/PROTOCOL.md | cut -d' ' -f1)" = 'ba6621e9661a00d0bd4b9ca61ceeae222842683654c325683b570dba56e2fe65'
          test "$(sha256sum orbittrace_m2d_sacv_recurrence_first_v1/build_pretruth.py | cut -d' ' -f1)" = '86ee44526e65fd0a6c7ed6fb96de223ffde3f555e43b19188993ab4917e6d35c'
          test "$(sha256sum orbittrace_m2d_sacv_recurrence_first_v1/evaluate_truth.py | cut -d' ' -f1)" = 'daee0f0e83b580f13375dbdec6ef34b4ff38204d98c3a373f3b9803760cdcb39'
          test "$(sha256sum orbittrace_m2d_sacv_recurrence_first_v1/run_binding.sh | cut -d' ' -f1)" = 'dcdec673bf5a84f35013292a1b4053e3f3d0b68f6a2e1ffa45e0afa80db0aef3'
          echo 'd75b76a36911c916620da5e029f82c7987718b1610eb6bd61922015b5ab50d4a  orbittrace_m2d_sacv_v1_source.tgz' | sha256sum -c -
          tar -xzf orbittrace_m2d_sacv_v1_source.tgz
          python -m py_compile orbittrace_m2d_sacv_recurrence_first_v1/build_pretruth.py orbittrace_m2d_sacv_recurrence_first_v1/evaluate_truth.py
          bash -n orbittrace_m2d_sacv_recurrence_first_v1/run_binding.sh
          echo PASS_SOURCE_AND_TRANSPORT_FREEZE

      - name: Execute one-shot target-excluded GMN recurrence-first v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash orbittrace_m2d_sacv_recurrence_first_v1/run_binding.sh | tee /tmp/rf-run.log

      - name: Publish binding scientific result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          P=output/m2d-sacv-recurrence-first-v1-gmn/truth/M2D_SACV_RECURRENCE_FIRST_V1_GMN_RESULT.json
          if [ -f "$P" ]; then
            python - <<'PY' > /tmp/result-comment.md
          import hashlib,json
          from pathlib import Path
          p=Path('output/m2d-sacv-recurrence-first-v1-gmn/truth/M2D_SACV_RECURRENCE_FIRST_V1_GMN_RESULT.json')
          r=json.loads(p.read_text())
          print('## M2D SACV recurrence-first v1 — binding target-excluded GMN development')
          print()
          print(f"Verdict: **`{r['verdict']}`**")
          print(f"- result SHA-256: `{hashlib.sha256(p.read_bytes()).hexdigest()}`")
          for comp in ('sugar2017','hdbscan2025'):
              s=r['aggregates'][comp]['paired_same_discovery']
              g=r['aggregates'][comp]['gates']
              print(f"- {comp}: paired n `{s['count']}`; precision parent/RF `{s['parent_mean_precision']:.6f} / {s['extraction_mean_precision']:.6f}`; F1 `{s['parent_mean_f1']:.6f} / {s['extraction_mean_f1']:.6f}`; refined `{s['strict_refined_assignment_count']}`; SACV-v1 nonregression `{g['precision_nonregression_vs_frozen_sacv_v1'] and g['f1_nonregression_vs_frozen_sacv_v1']}`")
          print('- OrbitTrace target information accessed: `false`')
          print('- Scientific role: `post-target-reveal development`; this cannot retroactively alter #1406.')
          PY
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result-comment.md
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Recurrence-first v1 execution ended before a valid scientific result. Treat as technical no-result only; scientific rule/gates remain frozen."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-sacv-recurrence-first-v1-gmn-development
          path: output/m2d-sacv-recurrence-first-v1-gmn
          if-no-files-found: warn
          retention-days: 90
