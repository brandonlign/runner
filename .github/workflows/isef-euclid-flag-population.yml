name: ISEF Euclid population flag audit

on:
  push:
    branches: [main]
    paths:
      - 'isef/euclid_stage0_flag_population.py'
      - '.github/workflows/isef-euclid-flag-population.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8' 'photutils>=2.2'
      - name: Rebuild Stage-0 real stamps
        id: stage0
        continue-on-error: true
        run: python isef/euclid_shiftwide_feasibility.py
      - name: Audit released flags for high excursions
        id: audit
        if: steps.stage0.outcome == 'success'
        continue-on-error: true
        run: python isef/euclid_stage0_flag_population.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-euclid-flag-population
          path: results/euclid_stage0_flag_population.json
          if-no-files-found: warn
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python - <<'PY' > /tmp/audit.md
          import json,os
          from pathlib import Path
          print('## Euclid Q2 high-excursion flag population audit')
          print('Outcome:',f"`{os.environ.get('OUTCOME')}`")
          p=Path('results/euclid_stage0_flag_population.json')
          if p.exists(): print('```json');print(json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:50000]);print('```')
          else: print('_result not produced_')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/audit.md
