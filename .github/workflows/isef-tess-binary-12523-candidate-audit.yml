name: ISEF TESS binary 12523 candidate audit
on:
  push:
    branches: [main]
    paths:
      - 'isef/TESS_BINARY_12523_CANDIDATE_AUDIT_TRIGGER'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy scipy astropy requests
      - name: Verify syntax
        run: python -m py_compile isef/tess_binary_stage0_detector.py isef/tess_binary_stage1_detector.py isef/tess_binary_12523_candidate_audit.py
      - name: Run candidate audit
        run: |
          cd isef
          python tess_binary_12523_candidate_audit.py
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-tess-binary-12523-candidate-audit
          path: isef/results/tess_binary_12523_candidate_audit/
          if-no-files-found: warn
