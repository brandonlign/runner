name: LUNARSHIFT primary source 41 published lunar events
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/isef4-xiao-primary-event-registry.yml"
      - "scripts/isef4_xiao_positive_registry.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate primary-source parser syntax
        run: python -m py_compile scripts/isef4_xiao_positive_registry.py
      - name: Crosswalk Tables S1/S2 and Figure S source EDR panels
        shell: bash
        run: |
          set +e
          python scripts/isef4_xiao_positive_registry.py > registry_result.log 2>&1
          rc=$?
          tail -c 12500 registry_result.log
          exit "$rc"
      - name: Retain parser diagnostic on failed crosswalk
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f registry_result.log ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          log=Path("registry_result.log").read_text()
          Path("diagnostics/isef4_xiao_registry_failure.json").write_text(
              json.dumps({"schema":"source-registry-run-failure-v1",
                          "error_tail":log[-8000:],
                          "scientific_status":"not a valid 41-event crosswalk"},indent=2)+"\n")
          PY
          fi
      - name: Retain original row and ambiguity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef4-xiao2025-primary-41-event-registry
          path: |
            diagnostics/isef4_xiao_41_published_event_registry.json
            diagnostics/isef4_xiao_registry_failure.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit validated published ground-truth audit
        if: always()
        run: |
          set -euo pipefail
          if [[ -f diagnostics/isef4_xiao_registry_failure.json && ! -f diagnostics/isef4_xiao_41_published_event_registry.json ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add diagnostics/isef4_xiao_registry_failure.json
            git commit -m "Diagnose original Figure S panel registry validation failure" || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          if [[ -f diagnostics/isef4_xiao_41_published_event_registry.json ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add diagnostics/isef4_xiao_41_published_event_registry.json
            if ! git diff --cached --quiet; then
              git commit -m "Record 41 source-attributed lunar events and exact published EDR-panel provenance"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
