name: OrbitTrace DTb68 ECO continuity audit

on:
  push:
    branches:
      - research/orbittrace-new-discovery-screen-20260828
    paths:
      - orbittrace_new_discovery_screen/dtb68_eco_continuity.py
      - orbittrace_new_discovery_screen/dtb68_eco_continuity_v2.py
      - .github/workflows/orbittrace_dtb68_eco_continuity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity-year:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROTOCOL_ID: 'orbittrace-raw/DTB68_ECO_CONTINUITY_AUDIT@4b78780a'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 \
            requests==2.32.5 beautifulsoup4==4.12.3 click==8.0.4 future==1.0.0
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Compile frozen audit and repair
        run: |
          python -m py_compile \
            orbittrace_new_discovery_screen/dtb68_eco_continuity.py \
            orbittrace_new_discovery_screen/dtb68_eco_continuity_v2.py
      - name: Execute frozen continuity year
        run: |
          set -euo pipefail
          echo "Executing ${PROTOCOL_ID}: year=${{ matrix.year }}"
          python -m orbittrace_new_discovery_screen.dtb68_eco_continuity_v2 \
            --year '${{ matrix.year }}' \
            --out continuity_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dtb68-eco-continuity-${{ matrix.year }}
          path: continuity_output/
          if-no-files-found: error
          retention-days: 60
