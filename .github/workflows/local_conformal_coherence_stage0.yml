name: Local conformal coherence Stage-0

on:
  pull_request:
    branches:
      - agent/real-shower-meta-stage0
    paths:
      - .github/workflows/local_conformal_coherence_stage0.yml
      - local_conformal_coherence_stage0/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: local-conformal-coherence-stage0
  cancel-in-progress: true

jobs:
  null-calibration-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-conformal-coherence-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: pip install -r real_shower_meta_stage0/requirements.txt
      - name: Retrieve frozen PR14 data artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download 30855193522 --repo "$GITHUB_REPOSITORY" --name real-shower-meta-data-audit --dir input
          test -s input/selected_events.jsonl.gz
          test -s input/audit.json
      - name: Decode candidate implementation
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path('local_conformal_coherence_stage0/run_event_conformal_audit.py.gz.b64').read_text().split())
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          Path('local_conformal_coherence_stage0/run_event_conformal_audit.py').write_bytes(raw)
          print('source sha256:', hashlib.sha256(raw).hexdigest())
          PY
          python -m py_compile local_conformal_coherence_stage0/run_event_conformal_audit.py
      - name: Run frozen null-calibration audit
        run: |
          python local_conformal_coherence_stage0/run_event_conformal_audit.py \
            --events input/selected_events.jsonl.gz \
            --output output
          cat output/EVENT_CONFORMAL_AUDIT.md
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-conformal-coherence-stage0
          path: output
          if-no-files-found: error
          retention-days: 30
