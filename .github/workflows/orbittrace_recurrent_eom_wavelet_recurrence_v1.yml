name: OrbitTrace recurrent-EOM wavelet-recurrence GMN v1

on:
  push:
    branches:
      - agent/orbittrace-recurrent-eom-wavelet-recurrence-v1
    paths:
      - '.github/workflows/orbittrace_recurrent_eom_wavelet_recurrence_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  development:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/v8 input/ranker input/parent-binding output

          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          cp frozen-v8/orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py input/v3/wavelet_episode_comparator.py

          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_recurrent_eom_wavelet_recurrence_v1/PROTOCOL.md)" = '0e59fc48edd5bfb71e4576b74e37de19a1802caa'
          test "$(git hash-object orbittrace_recurrent_eom_wavelet_recurrence_v1/GEOMETRY_ALIAS_REPAIR.md)" = 'f5b1a7d416db6b1d5614119c286ce2cc539ddb62'
          test "$(git hash-object orbittrace_recurrent_eom_wavelet_recurrence_v1/EXACT_ACCELERATION_REPAIR.md)" = 'd1ca1f174e7e7e06775bfcd3fca07a34d32f5d43'
          test "$(git hash-object orbittrace_recurrent_eom_wavelet_recurrence_v1/wavelet_recurrence.py)" = 'eb33710e7e13e4a3d1d2b1a5eccea0dcf841dd46'
          test "$(git hash-object orbittrace_recurrent_eom_wavelet_recurrence_v1/audit_synthetic.py)" = 'd90052285a25d742d2b2e4f07e13a1d62dda39b2'
          test "$(git hash-object orbittrace_recurrent_eom_wavelet_recurrence_v1/exact_v3_accelerator.py)" = 'f63a5525bac7bef4509b1f79c0ac1e37c1cfff63'
          test "$(git hash-object orbittrace_recurrent_eom_wavelet_recurrence_v1/audit_exact_v3_accelerator.py)" = 'c0173d56d69bdd21e6765857604a70466a9b63b5'
          test "$(git hash-object orbittrace_recurrent_eom_wavelet_recurrence_v1/run_development.py)" = 'fd96d066ae48b940ffec13fc29507e21a17a75ae'

          python -m py_compile \
            input/v3/multi_anchor_energy_v3.py \
            input/v3/wavelet_episode_comparator.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/wavelet_recurrence.py \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/audit_synthetic.py \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/exact_v3_accelerator.py \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/audit_exact_v3_accelerator.py \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/run_development.py

      - name: Run zero-truth wavelet-recurrence audit
        env:
          PYTHONPATH: input/v3:orbittrace_recurrent_eom_wavelet_recurrence_v1
        run: |
          set -euo pipefail
          python orbittrace_recurrent_eom_wavelet_recurrence_v1/audit_synthetic.py | tee output/WAVELET_RECURRENCE_SYNTHETIC_AUDIT.json
          grep -q 'PASS_RECURRENT_EOM_WAVELET_RECURRENCE_V1_SYNTHETIC_AUDIT' output/WAVELET_RECURRENCE_SYNTHETIC_AUDIT.json

      - name: Prove exact accelerator equivalence before GMN execution
        env:
          PYTHONPATH: input/v3:orbittrace_recurrent_eom_wavelet_recurrence_v1
        run: |
          set -euo pipefail
          python orbittrace_recurrent_eom_wavelet_recurrence_v1/audit_exact_v3_accelerator.py | tee output/EXACT_V3_ACCELERATOR_AUDIT.json
          grep -q 'PASS_EXACT_V3_ACCELERATOR_AUDIT' output/EXACT_V3_ACCELERATOR_AUDIT.json

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - name: Verify frozen GMN runtime utility
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify frozen runtime-support artifact
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-recurrent-eom-hdbscan-v1-gmn-development
          path: input/parent-binding
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31827903547

      - name: Verify exact binding recurrent-EOM evidence
        run: |
          set -euo pipefail
          test "$(sha256sum input/parent-binding/RECURRENT_EOM_HDBSCAN_V1_PRELABEL.json | cut -d' ' -f1)" = 'e304f6660697ed27a7e2e546ba2b9f2ecdb43f923745cb7424a3781ad55b9ad1'
          test "$(sha256sum input/parent-binding/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = '433c641f57122b244b9476f5cbcb5e6f82956d9467270a9f24945600a32d2106'

      - name: Run first technically valid binding wavelet-recurrence GMN outcome
        env:
          PYTHONPATH: input/ranker:input/v3:.:orbittrace_recurrent_eom_hdbscan_v1:orbittrace_recurrent_eom_wavelet_recurrence_v1:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_eom_wavelet_recurrence_v1/run_development.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --parent-prelabel-json input/parent-binding/RECURRENT_EOM_HDBSCAN_V1_PRELABEL.json \
            --parent-result-json input/parent-binding/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json \
            --v3-source input/v3/multi_anchor_energy_v3.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce binding verdict and scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/RECURRENT_EOM_WAVELET_RECURRENCE_V1_GMN_DEVELOPMENT.json'))
          p=json.load(open('output/RECURRENT_EOM_WAVELET_RECURRENCE_V1_PRELABEL.json'))
          assert r['verdict'] in {
              'PASS_RECURRENT_EOM_WAVELET_RECURRENCE_V1_GMN_DEVELOPMENT',
              'FAIL_RECURRENT_EOM_WAVELET_RECURRENCE_V1_GMN_DEVELOPMENT',
          }
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_DEVELOPMENT_ONLY'
          assert p['scientific_role']=='PRELABEL_FROZEN_RECURRENT_EOM_WAVELET_RECURRENCE_V1'
          assert r['candidate_count']==p['candidate_count']==2097
          assert r['membership_universe_identical'] is True and p['membership_universe_identical'] is True
          assert r['required_total_recovered_at_100_gain']==2
          assert r['blind_exclusion']==p['blind_exclusion']==[20.0,55.0]
          for x in (r,p):
              assert x['target_information_access'] is False
              assert x['target_region_events_accessed'] is False
              assert x['sonotaco_2013_2014_access'] is False
              assert x['amos_scientific_access'] is False
              assert x['maarsy_scientific_access'] is False
              assert x['dms_scientific_access'] is False
          print(r['verdict'], 'total_100_gain=', r['total_recovered_at_100_gain'])
          PY

      - name: Preserve exact provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/PROTOCOL.md \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/GEOMETRY_ALIAS_REPAIR.md \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/EXACT_ACCELERATION_REPAIR.md \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/wavelet_recurrence.py \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/audit_synthetic.py \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/exact_v3_accelerator.py \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/audit_exact_v3_accelerator.py \
            orbittrace_recurrent_eom_wavelet_recurrence_v1/run_development.py \
            input/v3/multi_anchor_energy_v3.py \
            input/v3/wavelet_episode_comparator.py \
            /tmp/run_wavelet_catalogue_v3_development.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            input/parent-binding/RECURRENT_EOM_HDBSCAN_V1_PRELABEL.json \
            input/parent-binding/RECURRENT_EOM_HDBSCAN_V1_GMN_DEVELOPMENT.json \
            output/WAVELET_RECURRENCE_SYNTHETIC_AUDIT.json \
            output/EXACT_V3_ACCELERATOR_AUDIT.json \
            output/RECURRENT_EOM_WAVELET_RECURRENCE_V1_PRELABEL.json \
            output/RECURRENT_EOM_WAVELET_RECURRENCE_V1_GMN_DEVELOPMENT.json \
            > output/source_input_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-wavelet-recurrence-v1-gmn-development
          path: output
          if-no-files-found: error
          retention-days: 90
