name: OrbitTrace P17 methodology-branch relay source audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/orbittrace_p17_methodology_branch_relay.yml
      - .github/workflows/orbittrace_p17_methodology_branch_relay_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove relay only authenticates child and executes exact base run block
        run: |
          set -euo pipefail
          r=.github/workflows/orbittrace_p17_methodology_branch_relay.yml
          for x in \
            'pull_request_target:' \
            'agent/orbittrace-p15-support-safe-halo-freeze' \
            'orbittrace_reciprocal_support_closure_p17/MATCHED_PRETRUTH_RUN.md' \
            'github.event.pull_request.head.repo.full_name == github.repository' \
            'test "${#files[@]}" -eq 2' \
            '# P17_CHILD_ACTIVATION_NONCE=SELF_TRIGGER_V1' \
            'cmp -s /tmp/p17_base_workflow.yml /tmp/p17_child_without_nonce.yml' \
            'EXECUTE_P17_MATCHED_PRETRUTH' \
            '31332157812' '9043232586' \
            'cac4c68e329ad06a802fbdc5ab12b7526f64720065000d5b3c094c49d57eb5dd' \
            'c0c39d1bd660efbe5e5353b5a33185428a6f60f4a3759be3acd16a15a063012a' \
            "step='      - name: Bind exact P17 development PASS, freeze both checkpoints, stop pretruth'" \
            "src=Path('/tmp/p17_base_workflow.yml').read_text().splitlines()" \
            "Path('/tmp/p17_exact_base_run.sh').write_text(out)" \
            'bash -n /tmp/p17_exact_base_run.sh' \
            '/tmp/p17_exact_base_run.sh' \
            'orbittrace-p17-matched-pretruth-checkpoints-relay'; do
            grep -F "$x" "$r"
          done
          python - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/orbittrace_p17_methodology_branch_relay.yml').read_text()
          assert '  pull_request_target:\n' in t
          assert '  pull_request:\n' not in t
          assert 'branches:\n      - agent/orbittrace-p15-support-safe-halo-freeze' in t
          assert 'paths:\n      - orbittrace_reciprocal_support_closure_p17/MATCHED_PRETRUTH_RUN.md' in t
          forbidden=(
            'MIN_DIRECTION_NEGATIVES','P17_FAIL_CLOSED_RECIPROCAL_SUPPORT_CLOSURE',
            'SPARSE_STREAM_SUPERIORITY','macro_f1_delta','MAARSY',
          )
          for x in forbidden: assert x not in t,x
          for x in ('evaluate_frozen_blindsafe.py','finalize_p3_evaluator_result.py','OrbitTrace-April','target_coordinate'):
              assert t.count(x)==1,(x,t.count(x))
          assert 'git show "$BASE_SHA:$wf" > /tmp/p17_base_workflow.yml' in t
          assert "src=Path('/tmp/p17_base_workflow.yml').read_text().splitlines()" in t
          assert 'git show "$HEAD_SHA:$wf" > /tmp/p17_child_workflow.yml' in t
          assert 'cmp -s /tmp/p17_base_workflow.yml /tmp/p17_child_without_nonce.yml' in t
          assert "if: github.event.pull_request.head.repo.full_name == github.repository" in t
          # pull_request_target is safe here because the same-repo guard is mandatory,
          # permissions are read-only, PR workflow code is never executed, and the only
          # executed scientific/data block is extracted from the authenticated BASE ref.
          assert 'contents: read' in t and 'actions: read' in t and 'pull-requests: read' in t
          print('PASS_P17_PULL_REQUEST_TARGET_RELAY_SOURCE_AUDIT')
          PY
          echo RELAY_EXECUTES_AUTHENTICATED_FROZEN_BASE_RUN_BLOCK_NOT_PR_SCIENCE
          echo NO_MATCHED_RESULT_NO_EXTERNAL_NO_TARGET_ACCESS
