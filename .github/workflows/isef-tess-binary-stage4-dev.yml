name: ISEF TESS binary Stage-4 consumed development
on:
  push:
    branches: [main]
    paths:
      - 'isef/TESS_BINARY_STAGE4_DEV_TRIGGER'
  workflow_dispatch:
jobs:
  develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy scipy astropy requests
      - name: Verify syntax
        run: python -m py_compile isef/tess_binary_stage0_detector.py isef/tess_binary_stage4_dev_diagnostics.py
      - name: Run Stage-4 diagnostics only on consumed data
        run: |
          cd isef
          python tess_binary_stage4_dev_diagnostics.py
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-tess-binary-stage4-dev-diagnostics
          path: isef/results/tess_binary_stage4_dev_diagnostics/
          if-no-files-found: warn
