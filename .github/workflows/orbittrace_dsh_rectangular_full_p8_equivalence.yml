name: OrbitTrace rectangular DSH full P8 equivalence

on:
  pull_request:
    branches:
      - agent/orbittrace-dsh-rectangular-equivalence-audit-v1
    paths:
      - orbittrace_dsh_rectangular_equivalence/run_p8_rectangular_equivalence.py
      - .github/workflows/orbittrace_dsh_rectangular_full_p8_equivalence.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  full-equivalence:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: exact-v8
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct exact authoritative P8 source and inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/{v3,v6,v8,dsh} accelerated authoritative
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2_v1.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2_v1.py /tmp/p2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2.py' | sha256sum -c -
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          echo 'f6c4c5a76b8b3f35d434aed4f1fb15035be05c40d0e0531c343ff620f3ba8185  /tmp/p3.py' | sha256sum -c -
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          echo '290c4f1b6401eaab6f182760eaeaa2f91cc994854febf465f58f7cacc5d73b2a  /tmp/p4.py' | sha256sum -c -
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          echo 'b48b3e6a45a7a371eb8e73c70ee217a33a96c596c61b51ebb7dc9c7b60100456  /tmp/p5.py' | sha256sum -c -
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          echo 'd32648136b58e2f777912d6403d9de3cbd091a8c23e16aedcda0b146f09f38c2  /tmp/p6.py' | sha256sum -c -
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          echo '89cf23c9d58692aedfaf12a9c2b7de4a08d641e6326794d82872f2e18608df54  /tmp/p7.py' | sha256sum -c -
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/run_p8.py
          echo 'd3bdcdaf18639e36cc02f5106b3a3c816f5e51eb19543f425717ba1c48a26470  /tmp/run_p8.py' | sha256sum -c -
          python -m py_compile /tmp/run_p8.py orbittrace_dsh_rectangular_equivalence/rectangular_dsh.py orbittrace_dsh_rectangular_equivalence/run_p8_rectangular_equivalence.py

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          test "$(git -C exact-v8 rev-parse HEAD)" = 'c9d6c44704013ba0c9430100e98a29a56b453304'
          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          cp exact-v8/orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py input/v3/wavelet_episode_comparator.py
          test "$(git hash-object input/v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" -o input/v6.zip
          echo '3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v6.zip' | sha256sum -c -
          unzip -q input/v6.zip -d input/v6
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009728299/zip" -o input/v8.zip
          echo '88d2d607e05d027015c338f7e23b64a6195e55ae24f1b2ac745f5e9bc6df599e  input/v8.zip' | sha256sum -c -
          unzip -q input/v8.zip -d input/v8
          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > input/dsh/literature_comparators.py
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  input/dsh/literature_comparators.py' | sha256sum -c -

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9033444168/zip" -o authoritative/p8.zip
          echo 'f9d91b1633022a2ca7d5386d3b8de2e9b81a4237fc115eb4cbf668edc0317979  authoritative/p8.zip' | sha256sum -c -
          unzip -q authoritative/p8.zip -d authoritative/p8
          echo PASS_RECTANGULAR_FULL_EQUIV_EXACT_INPUTS

      - name: Execute exact P8 with rectangular DSH only
        env:
          PYTHONPATH: exact-v8:input/v3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          date +%s > /tmp/start_epoch
          python -u orbittrace_dsh_rectangular_equivalence/run_p8_rectangular_equivalence.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --v6-structural-families-json-gz input/v6/label_free_sparse_support_v6_families.json.gz \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --v8-runner exact-v8/orbittrace_pooled_year_centroid_v8/run_development.py \
            --dsh-comparator input/dsh/literature_comparators.py \
            --output accelerated
          echo $(( $(date +%s) - $(cat /tmp/start_epoch) )) > accelerated/elapsed_seconds.txt

      - name: Require complete downstream identity with authoritative P8
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          a=json.loads(Path('accelerated/finite_sample_10pct_order_stat_membership_p8_development.json').read_text())
          b=json.loads(Path('authoritative/p8/finite_sample_10pct_order_stat_membership_p8_development.json').read_text())
          for key in ('verdict','configuration','baseline_v8','p8','baseline_large_shower','p8_large_shower','gates','diagnostics','crossfit_pretruth_sha256','model_pretruth_sha256','membership_pretruth_sha256','decisions_pretruth_sha256'):
              assert a[key]==b[key], key
          expected={
            'crossfit_pretruth_sha256':'904e35b1d2260f6cb2dbc76b534276fbcf5e288d8324016c6a51a61e6328a71b',
            'model_pretruth_sha256':'0cc5e2472f65e586cb18febffdbe3109e9e4041a6e09da07aa0bd4903a78c85f',
            'membership_pretruth_sha256':'8e3ca00d09bdaa0d8c760c540c18b1abd04f61b72a3252f319907377a1cbd518',
            'decisions_pretruth_sha256':'2e6a6f321d50afc82718c69bec134e21a09bd334de27ceb88cf62252c9142ba2',
          }
          for k,v in expected.items(): assert a[k]==v,(k,a[k])
          assert a['verdict']=='FAIL_FINITE_SAMPLE_10PCT_ORDER_STAT_MEMBERSHIP_P8_NO_GO'
          assert a['p8']['qualified_matches']==92
          assert a['p8']['recovered_at_100']==58
          assert a['diagnostics']['assigned_nonseed_events']==23483
          # Also compare logical pretruth payloads, not gzip container bytes.
          assert json.loads(Path('accelerated/p3_crossfit_pretruth.json').read_text())==json.loads(Path('authoritative/p8/p3_crossfit_pretruth.json').read_text())
          assert json.loads(Path('accelerated/p2_model_pretruth.json').read_text())==json.loads(Path('authoritative/p8/p2_model_pretruth.json').read_text())
          with gzip.open('accelerated/p8_decisions_pretruth.json.gz','rt') as f: ad=json.load(f)
          with gzip.open('authoritative/p8/p8_decisions_pretruth.json.gz','rt') as f: bd=json.load(f)
          assert ad==bd
          with gzip.open('accelerated/p8_expanded_families.json.gz','rt') as f: am=json.load(f)
          with gzip.open('authoritative/p8/p8_expanded_families.json.gz','rt') as f: bm=json.load(f)
          assert am==bm
          print('PASS_RECTANGULAR_DSH_FULL_P8_DOWNSTREAM_EQUIVALENCE')
          print('ELAPSED_SECONDS='+Path('accelerated/elapsed_seconds.txt').read_text().strip())
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-rectangular-dsh-full-p8-equivalence
          path: accelerated
          if-no-files-found: error
          retention-days: 90
