name: StreamFDR Stage-0

on:
  push:
    branches:
      - agent/stream-fdr-stage0
    paths:
      - stream_fdr_stage0/**
      - .github/workflows/stream_fdr_stage0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stream-fdr-stage0
  cancel-in-progress: true

jobs:
  stage0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stream-fdr-stage0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect real shower-removed meteor background
        run: python stream_fdr_stage0/inspect_data.py
      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: stream-fdr-stage0-inspection
          path: stream_fdr_stage0/results
          if-no-files-found: error
          retention-days: 30
      - name: Preserve inspection result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stream_fdr_stage0/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Preserve StreamFDR Stage-0 inspection'
            git pull --rebase origin agent/stream-fdr-stage0
            git push origin HEAD:agent/stream-fdr-stage0
          fi
