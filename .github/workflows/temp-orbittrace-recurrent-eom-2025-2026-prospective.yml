name: Temporary OrbitTrace recurrent-EOM 2025-2026 prospective search

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/temp-orbittrace-recurrent-eom-2025-2026-prospective.yml'

permissions:
  contents: read
  actions: read

jobs:
  search:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Check out frozen prospective science
        uses: actions/checkout@v4
        with:
          repository: brandonlign/orbittrace-raw
          ref: 6c66616d9956c360bcd8df987d842f079ffee3f5
          token: ${{ secrets.ISEF_REPO_TOKEN }}
          path: orbittrace-raw
          persist-credentials: false
          fetch-depth: 1

      - name: Check out exact selected recurrent-EOM kernel provenance
        uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 0bda79b28c66c03f55155f15e88f1cef087fa724
          path: recurrent-frozen
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact recurrent-EOM runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 \
            pandas==2.2.3 \
            scipy==1.14.1 \
            requests==2.32.5 \
            scikit-learn==1.7.1 \
            hdbscan==0.8.43 \
            click==8.0.4 \
            future==1.0.0
          python -m pip install --no-deps gmn-python-api==0.0.13
          python - <<'PY'
          import hdbscan, numpy, pandas, scipy, sklearn
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('scipy', scipy.__version__)
          print('sklearn', sklearn.__version__)
          print('hdbscan', getattr(hdbscan, '__version__', '0.8.43-package'))
          PY

      - name: Verify and compile frozen implementation
        working-directory: orbittrace-raw
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6c66616d9956c360bcd8df987d842f079ffee3f5"
          python -m py_compile \
            pipeline/discovery_search/recurrent_eom_2025_2026_prospective.py \
            pipeline/discovery_search/recurrent_eom_2025_2026_run.py \
            pipeline/discovery_search/association.py \
            pipeline/discovery_search/distance.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('../recurrent-frozen/orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py')
          b=p.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob == '30ac3fa3bc47910370df528fcf3ae8ecb6277b47', blob
          print('exact recurrent-EOM kernel blob PASS', blob)
          PY

      - name: Download authoritative 2019-2021 access ledger v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ledger_source
          gh run download 33220715975 \
            --repo brandonlign/runner \
            --name orbittrace-heldout-2019-2021-access-ledger-v2 \
            --dir ledger_source
          test -f ledger_source/HELDOUT_2019_2021_ACCESS_LEDGER_V2.json

      - name: Generate and freeze recurrent-EOM candidate family
        working-directory: orbittrace-raw
        run: |
          set -euo pipefail
          mkdir -p recurrent_eom_2025_2026
          python -m pipeline.discovery_search.recurrent_eom_2025_2026_run generate \
            --kernel ../recurrent-frozen/orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            --out recurrent_eom_2025_2026/RECURRENT_EOM_2025_2026_PRE_ADJUDICATION.json
          sha256sum recurrent_eom_2025_2026/RECURRENT_EOM_2025_2026_PRE_ADJUDICATION.json \
            | tee recurrent_eom_2025_2026/PRE_ADJUDICATION_SHA256.txt

      - name: Upload pre-adjudication freeze
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-recurrent-eom-2025-2026-pre-adjudication
          path: |
            orbittrace-raw/recurrent_eom_2025_2026/RECURRENT_EOM_2025_2026_PRE_ADJUDICATION.json
            orbittrace-raw/recurrent_eom_2025_2026/PRE_ADJUDICATION_SHA256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Adjudicate frozen candidates after membership/rank freeze
        working-directory: orbittrace-raw
        run: |
          set -euo pipefail
          python -m pipeline.discovery_search.recurrent_eom_2025_2026_run adjudicate \
            --pre recurrent_eom_2025_2026/RECURRENT_EOM_2025_2026_PRE_ADJUDICATION.json \
            --ledger ../ledger_source/HELDOUT_2019_2021_ACCESS_LEDGER_V2.json \
            --out recurrent_eom_2025_2026/RECURRENT_EOM_2025_2026_ADJUDICATION.json
          sha256sum recurrent_eom_2025_2026/RECURRENT_EOM_2025_2026_ADJUDICATION.json \
            | tee recurrent_eom_2025_2026/ADJUDICATION_SHA256.txt

      - name: Summarize frozen result
        working-directory: orbittrace-raw
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='recurrent_eom_2025_2026/RECURRENT_EOM_2025_2026_ADJUDICATION.json'
          d=json.load(open(p))
          print('AUDITED_FAMILIES', d['audited_family_count'])
          print('PRECONFIRM_LEADS', d['preconfirm_lead_count'])
          print('SECONDARY_GAPS', d['secondary_gap_count'])
          for x in d['preconfirm_leads']:
              print('LEAD', x)
          PY

      - name: Upload complete prospective adjudication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-recurrent-eom-2025-2026-adjudication
          path: orbittrace-raw/recurrent_eom_2025_2026/
          if-no-files-found: warn
          retention-days: 90
