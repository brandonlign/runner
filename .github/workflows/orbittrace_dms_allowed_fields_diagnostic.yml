name: OrbitTrace DMS allowed-fields diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 1374 &&
      github.event.comment.user.login == 'brandonlign' &&
      github.event.comment.body == 'DIAG_ORBITTRACE_DMS_ALLOWED_FIELDS_V1'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v15-dms-coverage-eligibility-run-v5
          fetch-depth: 1

      - name: Inspect only Yr/Mn/Day/LS positions and header structure
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY' > output/dms_allowed_fields.json
          import csv, hashlib, io, json, math, urllib.request, zipfile
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          PAGE='https://ceres.ta3.sk/iaumdcdb/home/catalog/video'; ANCHOR='DMS1991-1998 - ZIP archive'
          IDX=(3,4,5,7)
          class P(HTMLParser):
              def __init__(self):super().__init__();self.href=None;self.parts=[];self.a=[]
              def handle_starttag(self,t,attrs):
                  if t.lower()=='a':self.href=dict(attrs).get('href');self.parts=[]
              def handle_data(self,d):
                  if self.href is not None:self.parts.append(d)
              def handle_endtag(self,t):
                  if t.lower()=='a' and self.href is not None:self.a.append((''.join(self.parts).strip(),self.href));self.href=None;self.parts=[]
          def get(u):
              r=urllib.request.Request(u,headers={'User-Agent':'OrbitTrace-DMS-allowed-only/1.0'})
              with urllib.request.urlopen(r,timeout=60) as f:return f.read()
          page=get(PAGE);p=P();p.feed(page.decode());links=[h for text,h in p.a if text==ANCHOR];assert len(links)==1
          raw=get(urljoin(PAGE,links[0]));assert raw[:4]==b'PK\x03\x04'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              names=[i.filename for i in z.infolist() if not i.is_dir()];assert len(names)==1
              member=z.read(names[0]); text=member.decode('utf-8-sig')
          rows=[r for r in csv.reader(io.StringIO(text),delimiter=';') if r and any(c.strip() for c in r)]
          result={'archive_sha256':hashlib.sha256(raw).hexdigest(),'member_sha256':hashlib.sha256(member).hexdigest(),'row_count':len(rows),'widths':sorted(set(map(len,rows))),'allowed_positions_zero_based':list(IDX),'first_two_allowed_raw':[[r[i] for i in IDX] for r in rows[:2]],'first_ten_data_allowed_raw':[[r[i] for i in IDX] for r in rows[2:12]],'data_rows_after_two':max(0,len(rows)-2),'parse_summary':{},'forbidden_columns_accessed':False,'radiant_velocity_orbit_shower_accessed':False}
          ok=0;errors={}
          years=[];months=[];days=[];lsvals=[]
          for r in rows[2:]:
              try:
                  vals=[r[i].strip() for i in IDX]
                  yf=float(vals[0].replace(',','.')); mf=float(vals[1].replace(',','.')); df=float(vals[2].replace(',','.')); lf=float(vals[3].replace(',','.'))
                  y=round(yf);m=round(mf)
                  assert abs(yf-y)<1e-9 and 1991<=y<=1998
                  assert abs(mf-m)<1e-9 and 1<=m<=12
                  assert math.isfinite(df) and 0<df<32
                  assert math.isfinite(lf)
                  years.append(int(y));months.append(int(m));days.append(df);lsvals.append(lf%360);ok+=1
              except Exception as e:
                  k=type(e).__name__;errors[k]=errors.get(k,0)+1
          result['parse_summary']={'ok_rows':ok,'error_counts':errors,'year_min':min(years) if years else None,'year_max':max(years) if years else None,'month_min':min(months) if months else None,'month_max':max(months) if months else None,'day_min':min(days) if days else None,'day_max':max(days) if days else None,'ls_min':min(lsvals) if lsvals else None,'ls_max':max(lsvals) if lsvals else None}
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          cat output/dms_allowed_fields.json

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-dms-allowed-fields-v1-${{ github.run_id }}
          path: output/dms_allowed_fields.json
          retention-days: 30

      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1374 --repo "${{ github.repository }}" --body "ORBITTRACE_DMS_ALLOWED_FIELDS_DIAGNOSTIC=${GITHUB_RUN_ID}"
