name: ISEF TESS binary frozen 6764 TSSYS positive
on:
  push:
    branches: [main]
    paths:
      - 'isef/TESS_BINARY_6764_TSSYS_POSITIVE_TRIGGER'
  workflow_dispatch:
jobs:
  positive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen detector dependencies
        run: pip install numpy scipy astropy requests
      - name: Verify frozen code syntax
        run: python -m py_compile isef/tess_binary_stage0_detector.py isef/tess_binary_6764_tssys_positive.py
      - name: Run exact frozen detector on 6764 historical positive
        run: |
          cd isef
          python tess_binary_6764_tssys_positive.py
      - name: Preserve complete positive-control result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-tess-binary-6764-tssys-positive
          path: isef/results/tess_binary_6764_tssys_positive/
          if-no-files-found: warn
