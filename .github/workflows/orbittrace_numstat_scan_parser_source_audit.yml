name: OrbitTrace num-stat scan-parser static audit

on:
  push:
    branches:
      - agent/orbittrace-topomodal-numstat-availability-v1
    paths:
      - '.github/workflows/orbittrace_numstat_scan_parser_source_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct frozen support source and inspect parser without executing it
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,base64,gzip,pathlib
          root=pathlib.Path('frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts')
          raw=''.join(p.read_text().strip() for p in sorted(root.glob('part*.b64')))
          src=gzip.decompress(base64.b64decode(raw)).decode('utf-8')
          tree=ast.parse(src)
          funcs={n.name:n for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          wanted=['parse_catalogue']
          seen=set()
          while wanted:
              name=wanted.pop(0)
              if name in seen or name not in funcs: continue
              seen.add(name)
              node=funcs[name]
              text=ast.get_source_segment(src,node) or ''
              print(f'===== {name} =====')
              print(text)
              calls=[]
              for q in ast.walk(node):
                  if isinstance(q,ast.Call) and isinstance(q.func,ast.Name) and q.func.id in funcs:
                      calls.append(q.func.id)
              for cand in calls:
                  if cand not in seen and cand not in wanted: wanted.append(cand)
          print('===== RELEVANT TOP-LEVEL ASSIGNMENTS =====')
          for n in tree.body:
              if isinstance(n,(ast.Assign,ast.AnnAssign)):
                  names=[]
                  targets=n.targets if isinstance(n,ast.Assign) else [n.target]
                  for t in targets:
                      if isinstance(t,ast.Name): names.append(t.id)
                  if any(any(x in k.upper() for x in ('BLIND','SCAN','QUALITY','YEAR','MONTH')) for k in names):
                      print(ast.get_source_segment(src,n))
          PY

# registration retry after replacing import-based inspection with AST-only inspection
