name: Mondrian clique untouched 2018 confirmation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/real_shower_meta_data_audit.yml
      - mondrian_clique_2018/**
      - mondrian_clique_development/**
      - real_shower_meta_stage0/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mondrian-clique-2018-registered-confirmation
  cancel-in-progress: true

jobs:
  data_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mondrian-clique-2018-main-launch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen data-only extraction
        run: python mondrian_clique_2018/prepare_2018_audit.py
      - name: Enforce frozen data and coverage gates
        run: python mondrian_clique_2018/check_2018_data_gate.py
      - name: Record data provenance
        if: always()
        run: |
          mkdir -p mondrian_clique_2018/results/data_audit
          find mondrian_clique_2018/results/data_audit -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            > mondrian_clique_2018/results/data_audit/generated_sha256.txt
          sha256sum \
            mondrian_clique_2018/PROTOCOL.md \
            mondrian_clique_2018/prepare_2018_audit.py \
            mondrian_clique_2018/check_2018_data_gate.py \
            real_shower_meta_stage0/audit_real_shower_data.py \
            > mondrian_clique_2018/results/data_audit/source_sha256.txt
          python --version > mondrian_clique_2018/results/data_audit/python_version.txt
      - name: Upload frozen 2018 data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-clique-2018-data-registered
          path: mondrian_clique_2018/results/data_audit
          if-no-files-found: error
          retention-days: 90

  confirmation:
    needs: data_gate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mondrian-clique-2018-main-launch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: mondrian-clique-2018-data-registered
          path: input
      - name: Run exact passed method once
        run: python mondrian_clique_2018/run_2018_confirmation.py
      - name: Enforce frozen scientific gates
        run: python mondrian_clique_2018/check_2018_confirmation.py
      - name: Record confirmation provenance
        if: always()
        run: |
          mkdir -p output
          find output -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            > output/generated_sha256.txt
          sha256sum \
            mondrian_clique_2018/PROTOCOL.md \
            mondrian_clique_2018/run_2018_confirmation.py \
            mondrian_clique_2018/check_2018_confirmation.py \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            > output/source_sha256.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload one-shot 2018 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-clique-2018-confirmation-registered
          path: output
          if-no-files-found: error
          retention-days: 90
