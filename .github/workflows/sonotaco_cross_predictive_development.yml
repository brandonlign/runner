name: SonotaCo cross-predictive development

on:
  pull_request:
    branches:
      - agent/sonotaco-cross-predictive-source-audit
    paths:
      - .github/workflows/sonotaco_cross_predictive_development.yml
      - sonotaco_cross_predictive_development/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sonotaco-cross-predictive-development
  cancel-in-progress: true

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sonotaco-cross-predictive-development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - name: Decode, verify, and self-test frozen candidate
        run: |
          set -euo pipefail
          mkdir -p input output
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          parts = sorted(Path('sonotaco_cross_predictive_development/source_parts').glob('part*.b64'))
          expected_parts = [f'part{i:02d}.b64' for i in range(7)]
          if [part.name for part in parts] != expected_parts:
              raise RuntimeError(f'unexpected source parts: {[part.name for part in parts]}')
          encoded = ''.join(''.join(part.read_text(encoding='ascii').split()) for part in parts)
          if len(encoded) != 9076:
              raise RuntimeError(f'encoded length mismatch: {len(encoded)}')
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = '3c4e019586e300a236d6f181eb82d72a521e1fe0be6b269ebd1faee23b117e5a'
          if digest != expected:
              raise RuntimeError(f'candidate source mismatch: {digest}')
          Path('/tmp/run_sonotaco_cross_predictive_development.py').write_bytes(source)
          print('candidate bytes:', len(source))
          print('candidate SHA-256:', digest)
          PY
          python -m py_compile /tmp/run_sonotaco_cross_predictive_development.py
          python - <<'PY'
          import importlib.util
          import types
          import numpy as np

          spec = importlib.util.spec_from_file_location('cross_candidate', '/tmp/run_sonotaco_cross_predictive_development.py')
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          base = types.SimpleNamespace(wrap180=lambda values: (np.asarray(values) + 180.0) % 360.0 - 180.0)
          phase = np.asarray([-3.0, -1.0, 1.0, 3.0])
          episode = types.SimpleNamespace(
              rel_sol=phase,
              sun_lon=100.0 + 0.5 * phase,
              ecl_lat=10.0 + 0.2 * phase,
              vg=np.full(4, 30.0),
          )
          q1 = np.asarray([[0, 1, 2, 3]], dtype=np.int64)
          q2 = np.asarray([[2, 0, 3, 1]], dtype=np.int64)
          d1, _ = module.cross_predictive_diameters(base, episode, q1)
          d2, _ = module.cross_predictive_diameters(base, episode, q2)
          if not (d1[0] <= 1.0e-10 and abs(d1[0] - d2[0]) <= 1.0e-12):
              raise RuntimeError(f'linear/permutation self-test failed: {d1}, {d2}')
          perturbed = types.SimpleNamespace(
              rel_sol=phase,
              sun_lon=np.asarray(episode.sun_lon).copy(),
              ecl_lat=np.asarray(episode.ecl_lat).copy(),
              vg=np.asarray(episode.vg).copy(),
          )
          perturbed.sun_lon[3] += 2.0
          d3, _ = module.cross_predictive_diameters(base, perturbed, q1)
          if not d3[0] > 0.5:
              raise RuntimeError(f'held-out perturbation self-test failed: {d3}')
          print('cross-predictive physics self-tests passed')
          PY
      - name: Retrieve exact GMN-MDC mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -
      - name: Download exact SonotaCo 2025 development archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output input/025a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/025a.zip
          echo 'f4eb716a4b900658fcc658a633d918eca28946f59da75935f1fd5f6bc539bf52  input/025a.zip' | sha256sum -c -
      - name: Run frozen cross-predictive development benchmark
        run: |
          set -euo pipefail
          python /tmp/run_sonotaco_cross_predictive_development.py \
            --archive input/025a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --adapter-parts sonotaco_mondrian_development/source_parts \
            --phase-source-parts sonotaco_phase_gated_3d/source_parts \
            --workers 4 \
            --output output
          cat output/SONOTACO_CROSS_PREDICTIVE_DEVELOPMENT.md
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            sonotaco_cross_predictive_development/PROTOCOL.md \
            sonotaco_cross_predictive_development/source_parts/part00.b64 \
            sonotaco_cross_predictive_development/source_parts/part01.b64 \
            sonotaco_cross_predictive_development/source_parts/part02.b64 \
            sonotaco_cross_predictive_development/source_parts/part03.b64 \
            sonotaco_cross_predictive_development/source_parts/part04.b64 \
            sonotaco_cross_predictive_development/source_parts/part05.b64 \
            sonotaco_cross_predictive_development/source_parts/part06.b64 \
            sonotaco_phase_gated_3d/source_parts/part00.b64 \
            sonotaco_mondrian_development/source_parts/part00.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            input/025a.zip input/audit.json \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload frozen development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonotaco-cross-predictive-development
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Enforce frozen continuation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/sonotaco_cross_predictive_development.json').read_text())
          print(json.dumps({
              'candidate': result['candidate'],
              'phase3_control': result['phase3_control'],
              'original': result['original'],
              'fixed_comparator_weak_auc': result['fixed_comparator_weak_auc'],
              'detection_anatomy': result['detection_anatomy'],
              'gates': result['gates'],
              'verdict': result['verdict'],
          }, indent=2))
          if not all(result['gates'].values()):
              raise SystemExit('Frozen cross-predictive development gate failed')
          PY
