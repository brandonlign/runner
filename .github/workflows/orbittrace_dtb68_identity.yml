name: OrbitTrace DTb68 identity audit

on:
  push:
    branches:
      - research/orbittrace-new-discovery-screen-20260828
    paths:
      - orbittrace_new_discovery_screen/dtb68_identity_audit.py
      - .github/workflows/orbittrace_dtb68_identity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROTOCOL_ID: 'orbittrace-raw/DTB68_IDENTITY_AUDIT_PROTOCOL@4a358eb2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 pandas==2.2.3 requests==2.32.5
      - name: Compile exact audit
        run: python -m py_compile orbittrace_new_discovery_screen/dtb68_identity_audit.py
      - name: Execute identity audit
        run: |
          set -euo pipefail
          echo "Executing ${PROTOCOL_ID}"
          python -m orbittrace_new_discovery_screen.dtb68_identity_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dtb68-identity-audit
          path: identity_output/
          if-no-files-found: error
          retention-days: 60
