name: OrbitTrace internal-mass source hash diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 1372 &&
      github.event.comment.user.login == 'brandonlign' &&
      github.event.comment.body == 'DIAG_ORBITTRACE_INTERNAL_MASS_SOURCE_HASHES'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-internal-mass-sonotaco-development-v1
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-topomodal-hierarchy-scale-v1
          path: fixed-topology
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-symmetric-tuned-literature-benchmark-v2
          path: benchmark
          fetch-depth: 1
      - name: Print exact identities
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PROTOCOL_BLOB=$(git hash-object orbittrace_internal_mass_sonotaco_development_v1/PROTOCOL.md)"
          echo "CPP_SHA256=$(sha256sum orbittrace_internal_mass_sonotaco_development_v1/internal_mass_exact.cpp | cut -d' ' -f1)"
          echo "RUN_BINDING_SHA256=$(sha256sum orbittrace_internal_mass_sonotaco_development_v1/run_binding.py | cut -d' ' -f1)"
          echo "STRUCTURAL_BLOB=$(git -C fixed-topology hash-object orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)"
          echo "BENCHMARK_RESULT_BLOB=$(git -C benchmark hash-object orbittrace_symmetric_tuned_literature_v2/RESULT.json)"
      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1372 --repo "${{ github.repository }}" --body "ORBITTRACE_INTERNAL_MASS_SOURCE_HASH_DIAGNOSTIC=${GITHUB_RUN_ID}"
