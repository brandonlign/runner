name: OrbitTrace post-v46 joint inheritance-gap diagnostic v1

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v31_joint_inheritance_gap_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v31_joint_inheritance_gap_diagnostic_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v31-joint-inheritance-gap-diagnostic-v1
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 31704c312c09be2765ad3f65a0685d1acfd2b055
          path: frozen-v40
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and pin frozen diagnostic source
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/source input/payload input/truth output/freeze output/diag
          test "$(git hash-object orbittrace_v31_joint_inheritance_gap_diagnostic_v1/PROTOCOL.md)" = '5289b023d065d468c33b62416d3b27e9e9d3dc31'
          test "$(git hash-object orbittrace_v31_joint_inheritance_gap_diagnostic_v1/diagnose.py)" = 'a880c34bb0a34331cb5ce873dbc00ad8072086bb'
          test "$(git -C frozen-v40 rev-parse HEAD)" = '31704c312c09be2765ad3f65a0685d1acfd2b055'
          test "$(git -C frozen-v40 hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          test "$(git -C frozen-v40 hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          python -m py_compile orbittrace_v31_joint_inheritance_gap_diagnostic_v1/diagnose.py

      - name: Restore authoritative #1098 truth-blind signal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9088724826/zip' -o input/source.zip
          echo '11498b73237304f4175f37910596700ed78284bc6106d0c21dcaab66f97b7978  input/source.zip' | sha256sum -c -
          unzip -q input/source.zip -d input/source
          echo 'a3bcea66b72003a38cc492ea3b182d92cd20f3d1b94a43acbc8a0cbdd465ed07  input/source/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json' | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('input/source/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json'))
          assert r['verdict']=='PASS_V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL_FREEZE'
          assert r['scientific_role']=='FULL_FIXED_HDB_FAMILY_SIGNAL_VECTOR_NO_OUTCOME_USED_FOR_DEFINITION'
          assert r['family_count']==229 and len(r['families'])==229
          assert sum(bool(x['joint_signal']) for x in r['families'])==60
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_V46_GAP_SOURCE_PIN')
          PY

      - name: Freeze exact 60-family inheritance-gap vector before truth
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:.
        run: |
          set -euo pipefail
          python -u orbittrace_v31_joint_inheritance_gap_diagnostic_v1/diagnose.py freeze \
            --signal-file input/source/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json \
            --output output/freeze
          python - <<'PY'
          import hashlib,json
          p='output/freeze/V46_JOINT_INHERITANCE_GAP_VECTOR.json'
          r=json.load(open(p))
          assert r['verdict']=='PASS_V46_JOINT_INHERITANCE_GAP_VECTOR_FREEZE'
          assert r['scientific_role']=='EXACT_60_JOINT_FAMILY_INHERITANCE_GAP_FROZEN_BEFORE_OUTCOME_TRUTH'
          assert r['joint_family_count']==60 and len(r['families'])==60
          assert all(float(x['inheritance_gap'])>0 for x in r['families'])
          assert r['truth_accessed'] is False and r['literature_budget_used'] is False and r['boundary_identity_used'] is False
          for k in ('new_rank_or_score_evaluated','selector_evaluated','successor_selected','threshold_selected','top_k_selected','rank_window_selected','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['blind_exclusion']==[20.0,55.0]
          print('PASS_V46_GAP_VECTOR_FREEZE',hashlib.sha256(open(p,'rb').read()).hexdigest(),r['canonical_sha256_without_self_field'])
          PY

      - name: Restore immutable #950 HDB pretruth payload before truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -q input/payload.zip -d input/payload
          python - <<'PY'
          import json
          m=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          f=json.load(open('input/payload/hdbscan/family_memberships.json'))
          assert m['truth_accessed'] is False and f['truth_accessed'] is False
          assert m['feature_dimension']==71 and len(m['family_ids'])==229 and len(f['families'])==229
          assert [str(x['family_id']) for x in f['families']]==list(map(str,m['family_ids']))
          assert m['target_information_access'] is False
          assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_V46_GAP_PRETRUTH_PAYLOAD')
          PY

      - name: Load immutable exposed SonotaCo truth only after vector freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth

      - name: Run sole frozen inheritance-gap diagnostic
        env:
          PYTHONPATH: frozen-v40/orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:frozen-v40:.
        run: |
          set -euo pipefail
          python -u orbittrace_v31_joint_inheritance_gap_diagnostic_v1/diagnose.py diagnose \
            --vector-file output/freeze/V46_JOINT_INHERITANCE_GAP_VECTOR.json \
            --hdb-root input/payload/hdbscan \
            --truth-root input/truth \
            --output output/diag

      - name: Enforce diagnostic-only scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V46_JOINT_INHERITANCE_GAP_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V46_JOINT_INHERITANCE_GAP_DIAGNOSTIC','FAIL_V46_JOINT_INHERITANCE_GAP_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_V46_DIAGNOSTIC_ONLY_JOINT_INHERITANCE_GAP_NO_SUCCESSOR_EVALUATED'
          assert r['source_1098_run']==31457923695 and r['source_1098_artifact']==9088724826
          assert r['source_signal_sha256']=='a3bcea66b72003a38cc492ea3b182d92cd20f3d1b94a43acbc8a0cbdd465ed07'
          assert r['joint_family_count']==60 and set(r['annual_diagnostics'])=={'2013','2014'}
          for y in ('2013','2014'):
              assert set(r['annual_diagnostics'][y])=={'recoverable','nonrecoverable','median_difference_recoverable_minus_nonrecoverable','direction_pass'}
          for k in ('new_rank_or_score_evaluated','selector_evaluated','replacement_rule_evaluated','successor_selected','group_aggregation_evaluated','auc_evaluated','correlation_evaluated','regression_evaluated','p_value_evaluated','threshold_search','quantile_search','top_k_search','rank_window_search','alternate_statistic_search','alternate_direction_test','component_size_rule_search','quality_rank_placement_retry','component_placement_retry','component_representative_retry','pareto_layer_evaluated','pairwise_dominance_evaluated','boundary_identity_used','boundary_rescue_list_created','oracle_identity_used_for_ranking','truth_aware_group_identity_used_for_ranking','feature_search','model_search','k_search','scaling_search','diversity_search','fusion_search','source_quota_selected','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['annual_diagnostics'])
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v31_joint_inheritance_gap_diagnostic_v1/PROTOCOL.md \
            orbittrace_v31_joint_inheritance_gap_diagnostic_v1/diagnose.py \
            input/source/diag/V31_QUALITY_COMPONENT_JOINT_UNIVERSE_SIGNAL.json \
            output/freeze/V46_JOINT_INHERITANCE_GAP_VECTOR.json \
            input/payload.zip input/truth.zip \
            > output/V46_JOINT_INHERITANCE_GAP_SOURCE_SHA256.txt 2>/dev/null || true
          git -C frozen-v40 rev-parse HEAD > output/frozen_v40_execution_commit.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-joint-inheritance-gap-diagnostic-v1
          path: output
          if-no-files-found: error
          retention-days: 90
