name: OrbitTrace recurrent-EOM NASA ASFN 2018-2019 pristine validation v1

on:
  push:
    branches:
      - agent/orbittrace-recurrent-eom-asfn-2018-2019-validation-v1
    paths:
      - '.github/workflows/orbittrace_recurrent_eom_asfn_2018_2019_validation_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pristine-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact HDBSCAN runtime and verify frozen science
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p output
          test "$(git hash-object orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/PROTOCOL.md)" = '0d90b3db461ff65da3780d507506e4618a2cbf52'
          test "$(git hash-object orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/run_validation.py)" = '8f5699326758dd11cc46f9a209049a8ed61dee3a'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          python -m py_compile orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/run_validation.py orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py
          echo 'READMЕ_PREACCESS_RUN=31834608514'
          echo 'README_PREACCESS_ARTIFACT=9231986592'
          echo 'README_PREACCESS_DIGEST=sha256:bf8e75a39cf1bbd1fba988181c7fc77824cc50f8165b6b7a2617fac00ac1fa34'
      - name: Acquire exact frozen ASFN archive
        run: |
          set -euo pipefail
          curl --fail --location --max-time 60 --user-agent 'OrbitTrace-ASFN-Pristine-Validation/1.0' \
            'https://fireballs.ndc.nasa.gov/public_data/nasfn_2013-2019.zip' -o ASFN_2013_2019.zip
          test "$(sha256sum ASFN_2013_2019.zip | cut -d' ' -f1)" = 'c091b0f3f87f10badbe5fa38e6c45ba818af99f1c27c2fd6a23be286074c89a4'
      - name: Run sole binding pristine ASFN validation outcome
        env:
          PYTHONPATH: orbittrace_recurrent_eom_hdbscan_v1:.
        run: |
          set -euo pipefail
          python -u orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/run_validation.py \
            --archive ASFN_2013_2019.zip --output output
      - name: Enforce binding role and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/RECURRENT_EOM_ASFN_2018_2019_VALIDATION.json'))
          p=json.load(open('output/RECURRENT_EOM_ASFN_2018_2019_PRELABEL.json'))
          assert r['scientific_role']=='PRISTINE_CROSS_SURVEY_ASFN_2018_2019_VALIDATION'
          assert r['verdict'] in {'PASS_RECURRENT_EOM_HDBSCAN_V1_ASFN_2018_2019_PRISTINE_VALIDATION','FAIL_RECURRENT_EOM_HDBSCAN_V1_ASFN_2018_2019_PRISTINE_VALIDATION'}
          assert r['validation_years']==[2018,2019]
          assert r['blind_exclusion']==[20.0,55.0]
          assert r['nonvalidation_year_scientific_fields_decoded'] is False
          assert r['post_result_parameter_search'] is False
          assert p['shw_accessed'] is False
          for x in (r,p):
              assert x['target_information_access'] is False
              assert x['target_region_events_accessed'] is False
              assert x['sonotaco_2013_2014_access'] is False
              assert x['gmn_2020_2021_access'] is False
              assert x['maarsy_scientific_access'] is False
              assert x['dms_scientific_access'] is False
          print(r['verdict'])
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/PROTOCOL.md \
            orbittrace_recurrent_eom_asfn_2018_2019_validation_v1/run_validation.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            output/RECURRENT_EOM_ASFN_2018_2019_PRELABEL.json \
            output/RECURRENT_EOM_ASFN_2018_2019_VALIDATION.json \
            > output/source_output_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-recurrent-eom-asfn-2018-2019-pristine-validation-v1
          path: output
          if-no-files-found: error
          retention-days: 90
