name: OrbitTrace P5 finite-sample seed-envelope source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p4-dual-view-seed-envelope-freeze
    paths:
      - orbittrace_finite_sample_seed_envelope_p5/**
      - .github/workflows/orbittrace_p5_finite_sample_seed_envelope_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact P4 and audit minimal P5 transform
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py \
            orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2_v1.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py \
            /tmp/p2_v1.py /tmp/p2_canonical_v2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/p2_canonical_v2.py' | sha256sum -c -
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py \
            /tmp/p2_canonical_v2.py /tmp/run_p3.py
          echo 'f6c4c5a76b8b3f35d434aed4f1fb15035be05c40d0e0531c343ff620f3ba8185  /tmp/run_p3.py' | sha256sum -c -
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py \
            /tmp/run_p3.py /tmp/run_p4.py
          echo '290c4f1b6401eaab6f182760eaeaa2f91cc994854febf465f58f7cacc5d73b2a  /tmp/run_p4.py' | sha256sum -c -
          python orbittrace_finite_sample_seed_envelope_p5/apply_p5_patch.py \
            /tmp/run_p4.py /tmp/run_p5.py
          python -m py_compile /tmp/run_p5.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/run_p5.py').read_text()
          protocol=Path('orbittrace_finite_sample_seed_envelope_p5/PROTOCOL.md').read_text()
          required=(
              'P5_ENVELOPE_MIN_SEEDS = 19',
              'envelope_applied = bool(seed_count >= P5_ENVELOPE_MIN_SEEDS)',
              'allowed = seed_floor_allowed & raw_within_envelope',
              'allowed = seed_floor_allowed',
              'p5_finite_sample_min_seed_count_exactly_19',
              'p5_high_support_survivors_inside_exact_p4_envelope',
              'p5_low_support_survivors_use_p3_seed_floor_only',
              'PASS_FINITE_SAMPLE_SEED_ENVELOPE_MEMBERSHIP_P5_DEVELOPMENT',
              'FAIL_FINITE_SAMPLE_SEED_ENVELOPE_MEMBERSHIP_P5_NO_GO',
              '"p5_parameter_search": False',
              'finite_sample_seed_envelope_membership_p5_development.json',
              'p5_membership_pretruth.sha256',
              'p5_decisions_pretruth.sha256',
          )
          for token in required:
              assert token in p, token
          protocol_required=(
              '2/(n+1) <= 0.10',
              'n >= 19',
              'No alternative seed-count cutoffs may be evaluated',
              'qualified known-shower matches >=95',
              'recovery@100 >=58',
              'large-shower mean precision >=0.85',
              'There is exactly one primary P5 configuration',
          )
          for token in protocol_required:
              assert token in protocol, token
          # Scientific invariants inherited from P3/P4.
          assert 'RESPONSIBILITY_THRESHOLD = 0.5' in p
          assert 'P3_FOLD_COUNT = 5' in p
          assert 'P3_NEGATIVE_TAIL_MAX = 0.10' in p
          assert 'P3_SEED_FLOOR_MIN = 0.5' in p
          assert 'new_members_can_seed_growth' in p
          assert 'ranking_after_membership' in p
          # P5 changes only whether the already-frozen P4 envelope is applied;
          # it does not alter either feature, classifier, seed floor, or responsibility.
          assert 'feature_ceiling = np.max(xp, axis=0)' in p
          assert 'LogisticRegression(' in p
          assert 'probabilities >= float(gate["seed_floor"])' in p
          forbidden=('OrbitTrace-April','target_coordinate')
          for token in forbidden:
              assert token not in p, token
          print('PASS_P5_FINITE_SAMPLE_ENVELOPE_SOURCE_AUDIT')
          PY
          sha256sum /tmp/run_p5.py
      - name: Assert source-only firewall
        run: |
          set -euo pipefail
          test ! -e orbittrace_finite_sample_seed_envelope_p5/RUN.md
          echo NO_P5_TRUTH_EXECUTION_NO_TARGET_ACCESS
