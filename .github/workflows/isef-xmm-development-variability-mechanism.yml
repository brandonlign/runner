name: ISEF XMM development variability mechanism
on:
  push:
    paths:
      - 'isef/xmm_development_variability_mechanism.py'
      - '.github/workflows/isef-xmm-development-variability-mechanism.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'scipy>=1.16' 'astropy>=7.1,<8' 'statsmodels>=0.14.5'
      - run: timeout 1500s python isef/xmm_development_variability_mechanism.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-xmm-development-variability-mechanism
          path: results/xmm_development_variability_mechanism.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY' >/tmp/r.md
          import json
          from pathlib import Path
          print('## XMM preregistered variability-loss mechanism')
          p=Path('results/xmm_development_variability_mechanism.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:60000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
