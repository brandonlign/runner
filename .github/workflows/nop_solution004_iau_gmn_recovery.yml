name: NOP solution 004 IAU GMN archive recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - nop_solution004_iau_gmn_recovery/**
      - nop_solution004_gmn_recovery/recover_exact_gmn_orbits.py
      - nop_solution004_gmn_recovery/requirements.txt
      - .github/workflows/nop_solution004_iau_gmn_recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nop-solution004-iau-gmn-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_ARTIFACT_ID: '8874517049'
      SOURCE_ARTIFACT_SHA256: '2707a7be1152967960703245e62049e74f4eb778c84098f27c2486385acd512c'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-classification-stage0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nop_solution004_gmn_recovery/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r nop_solution004_gmn_recovery/requirements.txt
      - name: Download exact solution-004 lookup artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p nop_solution004_iau_gmn_recovery/input \
                   nop_solution004_iau_gmn_recovery/cache \
                   nop_solution004_iau_gmn_recovery/results
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o nop_solution004_iau_gmn_recovery/input/source_artifact.zip
          echo "${SOURCE_ARTIFACT_SHA256}  nop_solution004_iau_gmn_recovery/input/source_artifact.zip" | sha256sum -c -
          unzip -q nop_solution004_iau_gmn_recovery/input/source_artifact.zip \
            -d nop_solution004_iau_gmn_recovery/input/source_artifact
          lookup="$(find nop_solution004_iau_gmn_recovery/input/source_artifact -name '0149NOP_004.csv' -print -quit)"
          test -n "${lookup}"
          cp "${lookup}" nop_solution004_iau_gmn_recovery/input/0149NOP_004.csv
          echo "9ec720202966f1eda18c99c8decaa338d9be0bae913be4c2ff6ed34f2661282e  nop_solution004_iau_gmn_recovery/input/0149NOP_004.csv" | sha256sum -c -
      - name: Compile archive recovery audit
        run: |
          python -m py_compile \
            nop_solution004_gmn_recovery/recover_exact_gmn_orbits.py \
            nop_solution004_iau_gmn_recovery/recover_iau_gmn_archive_orbits.py \
            nop_solution004_iau_gmn_recovery/run_archive_recovery.py
      - name: Run frozen IAU-GMN snapshot gate
        run: |
          python nop_solution004_iau_gmn_recovery/run_archive_recovery.py \
            --lookup nop_solution004_iau_gmn_recovery/input/0149NOP_004.csv \
            --cache nop_solution004_iau_gmn_recovery/cache \
            --output nop_solution004_iau_gmn_recovery/results
      - name: Preserve archive structure and raw headers
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('nop_solution004_iau_gmn_recovery/cache')
          output = Path('nop_solution004_iau_gmn_recovery/results/archive_probe.txt')
          chunks = []
          for archive in sorted(root.glob('*.zip')):
              chunks.append(f'ARCHIVE {archive.name} {archive.stat().st_size} bytes')
              with zipfile.ZipFile(archive) as bundle:
                  for member in bundle.infolist():
                      chunks.append(
                          f'MEMBER {member.filename!r} compressed={member.compress_size} uncompressed={member.file_size}'
                      )
                      if member.is_dir():
                          continue
                      with bundle.open(member) as handle:
                          sample = handle.read(8192)
                      chunks.append('SAMPLE_HEX ' + sample[:128].hex())
                      chunks.append('SAMPLE_TEXT_START')
                      chunks.append(sample.decode('utf-8-sig', 'replace'))
                      chunks.append('SAMPLE_TEXT_END')
          output.write_text('\n'.join(chunks), encoding='utf-8')
          PY
      - name: Record provenance
        run: |
          sha256sum \
            nop_solution004_iau_gmn_recovery/recover_iau_gmn_archive_orbits.py \
            nop_solution004_iau_gmn_recovery/run_archive_recovery.py \
            nop_solution004_iau_gmn_recovery/ARCHIVE_GATE.md \
            nop_solution004_gmn_recovery/recover_exact_gmn_orbits.py \
            nop_solution004_gmn_recovery/requirements.txt \
            > nop_solution004_iau_gmn_recovery/results/source_sha256.txt
          sha256sum \
            nop_solution004_iau_gmn_recovery/input/source_artifact.zip \
            nop_solution004_iau_gmn_recovery/input/0149NOP_004.csv \
            > nop_solution004_iau_gmn_recovery/results/input_sha256.txt
          find nop_solution004_iau_gmn_recovery/cache -type f -print0 | sort -z | xargs -0 sha256sum \
            > nop_solution004_iau_gmn_recovery/results/iau_archive_sha256.txt
          python --version > nop_solution004_iau_gmn_recovery/results/python_version.txt
          python -m pip freeze > nop_solution004_iau_gmn_recovery/results/environment.txt
      - name: Upload IAU-GMN archive recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: nop-solution004-iau-gmn-archive-recovery
          path: nop_solution004_iau_gmn_recovery/results
          if-no-files-found: error
          retention-days: 90
