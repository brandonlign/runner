name: Affine stream-tube quartet preflight

on:
  pull_request:
    branches:
      - agent/mondrian-clique-coverage-normalized-development
    paths:
      - .github/workflows/affine_stream_tube_preflight.yml
      - affine_stream_tube_preflight/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: affine-stream-tube-preflight
  cancel-in-progress: true

jobs:
  development-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SOURCE_SHA256: '1a9a69e7968840703f9a4199ef211bc597d318ac54f4602c6524b0028aa37759'
      SOURCE_ENCODED_LENGTH: '8608'
      EVENTS_SHA256: '63e1389e2666d10b05138044f428609266b367cabab2542295c154a510e40f01'
      AUDIT_SHA256: 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778'
      BASELINE_PAYLOAD_SHA256: '2cb82a8c12913a6176ddd7c6333b57a4d672334934c0d2ca4b572e878590cfa2'
      BASELINE_SOURCE_SHA256: '7718ac5229475f4240305ad9c1e073c49702c771df36612d9be5baa877b46a50'
      SCORER_SOURCE_SHA256: 'f1c121e97a660a3820a11814c4325eb3ab33d34a031e83bdfb03b4b392e259b8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/affine-stream-tube-preflight
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt
      - name: Retrieve exact retired development artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo "${EVENTS_SHA256}  input/selected_events.jsonl.gz" | sha256sum -c -
          echo "${AUDIT_SHA256}  input/audit.json" | sha256sum -c -
          echo "${BASELINE_PAYLOAD_SHA256}  real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64" | sha256sum -c -
      - name: Decode and verify frozen candidate and inherited sources
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path

          parts=sorted(Path('affine_stream_tube_preflight/source_parts_v5').glob('part*.b64'))
          expected=[f'part{i:02d}.b64' for i in range(12)]
          if [p.name for p in parts] != expected:
              raise RuntimeError(f'unexpected candidate parts: {[p.name for p in parts]}')
          chunks=[''.join(p.read_text().split()) for p in parts]
          expected_chunk_lengths=[720] * 11 + [688]
          actual_chunk_lengths=[len(chunk) for chunk in chunks]
          if actual_chunk_lengths != expected_chunk_lengths:
              raise RuntimeError(f'unexpected source chunk lengths: {actual_chunk_lengths}')
          encoded=''.join(chunks)
          expected_length=int(os.environ['SOURCE_ENCODED_LENGTH'])
          if len(encoded) != expected_length:
              raise RuntimeError(f'unexpected encoded source length: {len(encoded)}')
          source=gzip.decompress(base64.b64decode(encoded,validate=True))
          digest=hashlib.sha256(source).hexdigest()
          if digest != os.environ['SOURCE_SHA256']:
              raise RuntimeError(f'candidate source mismatch: {digest}')
          Path('/tmp/run_affine_tube_preflight.py').write_bytes(source)

          scorer_parts=sorted(Path('mondrian_clique_development/source_parts_v2').glob('part*.b64'))
          scorer=gzip.decompress(base64.b64decode(''.join(''.join(p.read_text().split()) for p in scorer_parts),validate=True))
          scorer_digest=hashlib.sha256(scorer).hexdigest()
          if scorer_digest != os.environ['SCORER_SOURCE_SHA256']:
              raise RuntimeError(f'scorer source mismatch: {scorer_digest}')

          baseline_encoded=''.join(Path('real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64').read_text().split())
          baseline=gzip.decompress(base64.b64decode(baseline_encoded,validate=True))
          baseline_digest=hashlib.sha256(baseline).hexdigest()
          if baseline_digest != os.environ['BASELINE_SOURCE_SHA256']:
              raise RuntimeError(f'baseline source mismatch: {baseline_digest}')

          print('candidate source sha256:',digest)
          print('candidate chunk lengths:',actual_chunk_lengths)
          print('scorer source sha256:',scorer_digest)
          print('baseline source sha256:',baseline_digest)
          PY
          python -m py_compile /tmp/run_affine_tube_preflight.py
      - name: Run frozen affine stream-tube preflight
        run: |
          python /tmp/run_affine_tube_preflight.py \
            --events input/selected_events.jsonl.gz \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --output output \
            --workers 4
          cat output/AFFINE_TUBE_PREFLIGHT.md
      - name: Enforce frozen continuation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('output/affine_tube_preflight.json').read_text())
          summary={
            'counts':result.get('counts'),
            'weak_auc':result.get('weak_auc'),
            'false_positive':result.get('false_positive'),
            'worst_bin_fpr_005':result.get('worst_bin_fpr_005'),
            'recall':result.get('recall'),
            'fold_auc':result.get('fold_auc'),
            'gates':result.get('gates'),
            'verdict':result.get('verdict'),
            'error':result.get('error'),
          }
          print(json.dumps(summary,indent=2))
          gates=result.get('gates',{})
          if not gates or not all(gates.values()):
              raise SystemExit('Frozen affine stream-tube preflight failed')
          if result.get('verdict') != 'PROCEED_TO_FULL_AFFINE_TUBE_BENCHMARK':
              raise SystemExit(f"Unexpected verdict: {result.get('verdict')}")
          PY
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            affine_stream_tube_preflight/PROTOCOL.md \
            affine_stream_tube_preflight/source_parts_v5/*.b64 \
            input/selected_events.jsonl.gz \
            input/audit.json \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/*.b64 \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload frozen preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affine-stream-tube-preflight
          path: output
          if-no-files-found: error
          retention-days: 90
