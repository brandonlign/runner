name: Observe OrbitTrace recurrent local TopoModal trunk v1

# child v2 trigger: import-repair metadata/artifact read only
on:
  pull_request:
    branches: [agent/orbittrace-recurrent-local-topomodal-trunk-v1-activate]
    paths:
      - '.github/workflows/orbittrace_recurrent_local_topomodal_trunk_v1_observer.yml'

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

env:
  TARGET_SHA: 7ba5d8f9f791f45f9804828acedfbff1101632e1
  TARGET_BRANCH: agent/orbittrace-recurrent-local-topomodal-trunk-v1-activate
  TARGET_WORKFLOW_NAME: OrbitTrace recurrent local TopoModal trunk v1 import repair
  TARGET_ARTIFACT: orbittrace-recurrent-local-topomodal-trunk-v1-binding-import-repair

jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 295
    steps:
      - name: Observe the already-started repaired binding run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          exec > >(tee observer_report.md) 2>&1
          echo OBSERVER_ONLY_NO_SCIENTIFIC_EXECUTION
          echo "TARGET_SHA=$TARGET_SHA"
          run_id=''
          for _ in $(seq 1 40); do
            runs="$(gh api -X GET "repos/$REPO/actions/runs" -f branch="$TARGET_BRANCH" -f event=push -f per_page=100 2>/dev/null || true)"
            run_id="$(printf '%s' "$runs" | jq -r --arg sha "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" '.workflow_runs[]? | select(.head_sha==$sha and .name==$name) | .id' | head -n1)"
            if [ -n "$run_id" ] && [ "$run_id" != null ]; then break; fi
            sleep 15
          done
          if [ -z "$run_id" ] || [ "$run_id" = null ]; then
            echo "BINDING_RUN_NOT_FOUND target_sha=$TARGET_SHA"
            exit 0
          fi
          echo "BINDING_RUN_ID=$run_id"
          for _ in $(seq 1 570); do
            meta="$(gh api "repos/$REPO/actions/runs/$run_id" 2>/dev/null || true)"
            status="$(printf '%s' "$meta" | jq -r '.status // "unknown"')"
            conclusion="$(printf '%s' "$meta" | jq -r '.conclusion // ""')"
            echo "BINDING_STATUS=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then break; fi
            sleep 30
          done
          meta="$(gh api "repos/$REPO/actions/runs/$run_id" 2>/dev/null || true)"
          printf '%s\n' "$meta" | jq '{id,name,event,status,conclusion,head_branch,head_sha,run_attempt,created_at,updated_at,html_url}' || true
          status="$(printf '%s' "$meta" | jq -r '.status // "unknown"')"
          conclusion="$(printf '%s' "$meta" | jq -r '.conclusion // ""')"
          if [ "$status" != completed ]; then
            echo "BINDING_OBSERVER_TIMEOUT run_id=$run_id"
            exit 0
          fi
          echo 'BINDING_ARTIFACTS:'
          gh api "repos/$REPO/actions/runs/$run_id/artifacts" | jq '.artifacts[]? | {id,name,size_in_bytes,digest,expired,created_at,expires_at}' || true
          rm -rf observed && mkdir -p observed
          gh run download "$run_id" -R "$REPO" -n "$TARGET_ARTIFACT" -D observed || true
          if [ -f observed/truth/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_BINDING_RESULT.json ]; then
            echo 'BINDING_RESULT_SHA256:'
            sha256sum observed/truth/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_BINDING_RESULT.json
            echo 'BINDING_RESULT_JSON:'
            cat observed/truth/RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1_BINDING_RESULT.json
          else
            echo 'BINDING_RESULT_NOT_PRESENT'
          fi
          if [ -f observed/prelabel/PRELABEL_SHA256.txt ]; then
            echo 'PRELABEL_SHA_RECORD:'
            cat observed/prelabel/PRELABEL_SHA256.txt
          fi
          if [ "$conclusion" != success ]; then
            echo 'BINDING_FAILED_LOG_TAIL:'
            gh run view "$run_id" -R "$REPO" --log-failed 2>&1 | tail -n 500 || true
          fi
      - name: Post observer report to this draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f observer_report.md ]; then printf '%s\n' 'OBSERVER_REPORT_MISSING' > observer_report.md; fi
          { echo '```text'; cat observer_report.md; echo '```'; } > observer_comment.md
          gh pr comment "$PR_NUMBER" -R "$REPO" --body-file observer_comment.md
