name: OrbitTrace survey-null calibrated persistence v1 GMN

on:
  push:
    branches:
      - agent/orbittrace-null-calibrated-persistence-v1
    paths:
      - 'orbittrace_null_calibrated_persistence_v1/GMN_ACTIVATE.md'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  development:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify immutable science plus repair bytes
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/v8 input/ranker input/parent input/noresult output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          cp frozen-v8/orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py input/v3/wavelet_episode_comparator.py
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

          test "$(git hash-object orbittrace_null_calibrated_persistence_v1/PROTOCOL.md)" = '4c90c09f472a08a6dedb230df8141d5fd1460d0b'
          test "$(git hash-object orbittrace_null_calibrated_persistence_v1/null_calibration.py)" = '7937cda056fcd84f94bc347b153457cc0e500861'
          test "$(git hash-object orbittrace_null_calibrated_persistence_v1/audit_synthetic.py)" = '472b10dda5c7500473ddbe69162bf14246b184ee'
          test "$(git hash-object orbittrace_null_calibrated_persistence_v1/run_development.py)" = '1df9edbfb49d19a9561f3107303324d98a0c25a1'
          test "$(git hash-object orbittrace_null_calibrated_persistence_v1/EXECUTION_FREEZE.json)" = '39e073f019f44e4c630a88f8f238de5fd9ac8010'
          test "$(git hash-object orbittrace_null_calibrated_persistence_v1/TECHNICAL_NO_RESULT_1.md)" = '3257a8e8668ab842bc61abe28e9bb5f3ad7d9870'
          test "$(git hash-object orbittrace_null_calibrated_persistence_v1/PARENT_REHYDRATION_FREEZE.json)" = 'f72d4cecd4d7c38d99991c91f16de80b824278ad'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          python -m py_compile orbittrace_null_calibrated_persistence_v1/*.py orbittrace_recurrent_eom_hdbscan_v1/*.py orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py input/v3/*.py

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-null-calibrated-persistence-v1-gmn-development
          path: input/noresult
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31905740588

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: input/parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852836840

      - name: Authorize exact parent-artifact rehydration before retry
        run: |
          set -euo pipefail
          test ! -e input/noresult/NULL_CALIBRATED_PERSISTENCE_V1_PRELABEL.json
          test ! -e input/noresult/NULL_CALIBRATED_PERSISTENCE_V1_GMN_DEVELOPMENT.json
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json | cut -d' ' -f1)" = 'efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          test "$(sha256sum input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json | cut -d' ' -f1)" = 'ca6aeed2b82739003ea5d39b59e869df876de2962164344a938fe4935ea38711'
          python - <<'PY'
          import json
          f=json.load(open('orbittrace_null_calibrated_persistence_v1/PARENT_REHYDRATION_FREEZE.json'))
          assert f['schema']=='NULL_CALIBRATED_PERSISTENCE_V1_PARENT_REHYDRATION_FREEZE'
          assert f['scientific_status']=='PRE_FIRST_TECHNICALLY_VALID_NULL_OUTCOME'
          assert f['scientific_method_changed'] is False
          t=f['technical_no_result']
          assert t['run_id']==31905740588
          assert t['artifact_id']==9252324916
          assert t['artifact_digest']=='sha256:5ccb55c094400c75cf8463f0a15894be5d0a9053986a2bc6fb774e3ca698740f'
          assert t['classification']=='TECHNICAL_NO_RESULT_PARENT_RECONSTRUCTION_MISMATCH'
          assert t['null_replicates_started'] is False
          assert t['successor_order_created'] is False
          assert t['prelabel_created'] is False and t['scientific_result_created'] is False
          assert t['hidden_truth_accessed'] is False
          r=f['repair']
          assert r['strategy']=='REHYDRATE_EXACT_BINDING_PARENT_ARTIFACT_NO_REAL_PARENT_REFIT'
          assert r['development_runner_blob']=='1df9edbfb49d19a9561f3107303324d98a0c25a1'
          assert r['parent_binding_run']==31852836840 and r['parent_binding_artifact']==9238142199
          assert r['parent_binding_artifact_digest']=='sha256:918992863d019baf3bbb5eadd83ecaa32cabea3d9bd7d9d43735b26474e8ed60'
          assert r['parent_candidate_count']==2094 and r['parent_total_recovered_at_100']==179
          assert all(r[k] is False for k in ['changes_null_seeds','changes_null_permutation','changes_pareto_tail_score','changes_successor_ranking_rule','changes_success_gate','changes_protected_data_rules'])
          assert f['retry_authorized'] is True and f['first_technically_valid_endpoint_binding'] is True
          assert f['no_scientific_rescue_authorized'] is True
          for k in ['sonotaco_access','asfn_access','efn_access','amos_access','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access']:
              assert f[k] is False, (k,f[k])

          p=json.load(open('input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json'))
          q=json.load(open('input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json'))
          assert p['scientific_role']=='PRELABEL_FROZEN_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1'
          assert p['successor_candidate_count']==2094
          assert len(p['successor_candidates'])==2094
          assert q['verdict']=='PASS_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT'
          assert q['successor_candidate_count']==2094
          assert q['successor_metrics']['2022']['recovered_at_100']==89
          assert q['successor_metrics']['2023']['recovered_at_100']==90
          print('PASS_NULL_PARENT_REHYDRATION_RETRY_AUTHORIZER')
          PY

      - name: Re-run zero-data null audit before scientific access
        env:
          PYTHONPATH: orbittrace_null_calibrated_persistence_v1
        run: |
          set -euo pipefail
          python -u orbittrace_null_calibrated_persistence_v1/audit_synthetic.py | tee output/NULL_CALIBRATED_SYNTHETIC_RECHECK.log
          grep -q PASS_NULL_CALIBRATED_PERSISTENCE_V1_SYNTHETIC_AUDIT output/NULL_CALIBRATED_SYNTHETIC_RECHECK.log

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify frozen GMN runtime utility
        run: test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - name: Verify frozen runtime-support artifact
        run: test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Run first technically valid survey-null GMN outcome
        env:
          PYTHONPATH: input/ranker:input/v3:orbittrace_null_calibrated_persistence_v1:orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8:.
        run: |
          set -euo pipefail
          python -u orbittrace_null_calibrated_persistence_v1/run_development.py \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --parent-prelabel-json input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            --parent-result-json input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce binding gate and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('output/NULL_CALIBRATED_PERSISTENCE_V1_PRELABEL.json'))
          r=json.load(open('output/NULL_CALIBRATED_PERSISTENCE_V1_GMN_DEVELOPMENT.json'))
          assert r['verdict'] in {'PASS_NULL_CALIBRATED_PERSISTENCE_V1_GMN_DEVELOPMENT','FAIL_NULL_CALIBRATED_PERSISTENCE_V1_GMN_DEVELOPMENT'}
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_DEVELOPMENT_ONLY'
          assert r['events_total']==738682 and r['events_by_year']=={'2022':315024,'2023':423658}
          assert p['events_total']==738682 and p['events_by_year']=={'2022':315024,'2023':423658}
          assert p['truth_evaluated_when_written'] is False
          assert p['parent_candidate_count']==r['parent_candidate_count']==2094
          assert p['successor_candidate_count']==r['successor_candidate_count']==2094
          assert p['membership_universe_identical'] is True and r['membership_universe_identical'] is True
          assert p['parent_source']['binding_run']==r['parent_source']['binding_run']==31852836840
          assert p['parent_source']['artifact']==r['parent_source']['artifact']==9238142199
          assert p['parent_source']['prelabel_sha256']==r['parent_source']['prelabel_sha256']=='efce0617a738a0372ec5b007fb87b46912accd8419f0f768829c4c0cb7d62993'
          assert p['parent_source']['result_sha256']==r['parent_source']['result_sha256']=='ca6aeed2b82739003ea5d39b59e869df876de2962164344a938fe4935ea38711'
          assert p['null_replicates']==r['null_replicates']==16
          assert len(p['null_evidence'])==16 and len(r['null_candidate_counts'])==16
          assert r['parent_total_recovered_at_100']==179
          assert r['required_total_recovered_at_100_gain']==5
          assert r['post_result_parameter_search'] is False
          assert p['blind_exclusion']==r['blind_exclusion']==[20.0,55.0]
          for x in (p,r):
              for k in ['target_information_access','target_region_events_accessed','sonotaco_2013_2014_access','asfn_access','efn_access','amos_access','maarsy_scientific_access','dms_scientific_access']:
                  assert x[k] is False, (k,x[k])
          if r['verdict'].startswith('PASS_'):
              assert r['total_recovered_at_100_gain'] >= 5
              assert r['successor_total_recovered_at_100'] >= 184
              assert all(all(g.values()) for g in r['annual_gates'].values())
          print(r['verdict'], 'gain=', r['total_recovered_at_100_gain'])
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          sha256sum orbittrace_null_calibrated_persistence_v1/PROTOCOL.md orbittrace_null_calibrated_persistence_v1/null_calibration.py orbittrace_null_calibrated_persistence_v1/audit_synthetic.py orbittrace_null_calibrated_persistence_v1/run_development.py orbittrace_null_calibrated_persistence_v1/EXECUTION_FREEZE.json orbittrace_null_calibrated_persistence_v1/TECHNICAL_NO_RESULT_1.md orbittrace_null_calibrated_persistence_v1/PARENT_REHYDRATION_FREEZE.json orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py orbittrace_recurrent_eom_hdbscan_v1/run_development.py orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json input/parent/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json input/ranker/run_urc_union_ranker.py input/v8/pooled_year_centroid_v8_development.json output/NULL_CALIBRATED_PERSISTENCE_V1_PRELABEL.json output/NULL_CALIBRATED_PERSISTENCE_V1_GMN_DEVELOPMENT.json > output/provenance_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-null-calibrated-persistence-v1-gmn-development-rehydration-retry
          path: output
          if-no-files-found: error
          retention-days: 90
