name: LUNARSHIFT Ryder four exact original NASA source CSM cameras
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/isef4-ryder-exact-source-camera-years.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isef4-ryder-four-exact-original-cameras
  cancel-in-progress: false
jobs:
  original-Ryder-sources:
    strategy:
      fail-fast: false
      matrix:
        target: [ryder_2022_2024, ryder_2026]
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - name: Verify source camera program and guard exact Ryder source IDs
        run: python -m py_compile scripts/isef4_isis_camera_triage.py
      - name: Install authenticated original NASA camera model
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lunar-isis10
          create-args: >-
            -c usgs-astrogeology
            -c conda-forge
            python=3.13
            isis=10.0.0
            usgscsm
          init-shell: bash
          post-cleanup: all
      - name: Hash-download both NASA original EDRs and camera-ground exact Ryder site
        shell: bash -el {0}
        run: |
          set -euo pipefail
          export ISISROOT="$CONDA_PREFIX"
          export ISISDATA="$GITHUB_WORKSPACE/isisdata"
          mkdir -p "$ISISDATA/base/kernels/lsk"
          curl --fail --location --retry 3 --silent --show-error \
            "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls" \
            --output "$ISISDATA/base/kernels/lsk/naif0012.tls"
          grep -q 'KPL/LSK' "$ISISDATA/base/kernels/lsk/naif0012.tls"
          python -m pip install --quiet 'setuptools<81'
          export ISEF4_DEVELOPMENT_EVENT="${{ matrix.target }}"
          for role in before after; do
            export ISEF4_PRODUCT_ROLE="$role"
            if [[ "$ISEF4_DEVELOPMENT_EVENT" == ryder_2022_2024 ]]; then
              if [[ "$role" == before ]]; then suffix=isis10_r22; else suffix=isis10_r24; fi
            else
              if [[ "$role" == before ]]; then suffix=isis10_r26a; else suffix=isis10_r26m; fi
            fi
            export ISEF4_DIAGNOSTIC_SUFFIX="$suffix"
            python scripts/isef4_isis_camera_triage.py
          done
      - name: Preserve actual original source camera proofs and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef4-${{ matrix.target }}-exact-Ryder-CSM-cameras
          path: |
            diagnostics/isef4_${{ matrix.target }}_camera_status_isis10_r*.json
            output/triage_isis10_r*/csm_event_campt.pvl
          retention-days: 30
          if-no-files-found: warn
      - name: Commit both bounded real source-camera records with push-conflict retry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f diagnostics/isef4_${{ matrix.target }}_camera_status_isis10_r*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record original Ryder ${{ matrix.target }} camera-ground pixel evidence'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep "$attempt"
            done
            exit 1
          fi
