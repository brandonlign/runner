name: NOP solution 004 nominal orbit reconstruction

on:
  pull_request:
    branches:
      - agent/ghoststream-classification-stage0
    paths:
      - nop004_orbit_reconstruction_stage1/**
      - .github/workflows/nop004_orbit_reconstruction.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nop004-orbit-reconstruction-stage1
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_ARTIFACT_ID: '8874489453'
      SOURCE_ARTIFACT_SHA256: '85ab59ef342afc2723ad1642426433d2dedf020abe17caf36815c096b098c6be'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nop004-orbit-reconstruction-stage1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nop004_orbit_reconstruction_stage1/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r nop004_orbit_reconstruction_stage1/requirements.txt
      - name: Download exact solution-004 audit artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p nop004_orbit_reconstruction_stage1/input nop004_orbit_reconstruction_stage1/results
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o nop004_orbit_reconstruction_stage1/input/source_artifact.zip
          echo "${SOURCE_ARTIFACT_SHA256}  nop004_orbit_reconstruction_stage1/input/source_artifact.zip" | sha256sum -c -
          unzip -q nop004_orbit_reconstruction_stage1/input/source_artifact.zip \
            -d nop004_orbit_reconstruction_stage1/input/source_artifact
          test -s nop004_orbit_reconstruction_stage1/input/source_artifact/results/0149NOP_004.csv
      - name: Compile frozen reconstruction
        run: python -m py_compile nop004_orbit_reconstruction_stage1/reconstruct_nominal_orbits.py
      - name: Run nominal orbit reconstruction gate
        run: |
          python nop004_orbit_reconstruction_stage1/reconstruct_nominal_orbits.py \
            --lookup nop004_orbit_reconstruction_stage1/input/source_artifact/results/0149NOP_004.csv \
            --output nop004_orbit_reconstruction_stage1/results
      - name: Record provenance
        if: always()
        run: |
          mkdir -p nop004_orbit_reconstruction_stage1/results
          sha256sum \
            nop004_orbit_reconstruction_stage1/reconstruct_nominal_orbits.py \
            nop004_orbit_reconstruction_stage1/PROTOCOL.md \
            nop004_orbit_reconstruction_stage1/requirements.txt \
            > nop004_orbit_reconstruction_stage1/results/source_sha256.txt
          sha256sum \
            nop004_orbit_reconstruction_stage1/input/source_artifact.zip \
            nop004_orbit_reconstruction_stage1/input/source_artifact/results/0149NOP_004.csv \
            > nop004_orbit_reconstruction_stage1/results/input_sha256.txt
          python --version > nop004_orbit_reconstruction_stage1/results/python_version.txt
          python -m pip freeze > nop004_orbit_reconstruction_stage1/results/environment.txt
      - name: Upload reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nop004-nominal-orbit-reconstruction
          path: nop004_orbit_reconstruction_stage1/results
          if-no-files-found: error
          retention-days: 90
