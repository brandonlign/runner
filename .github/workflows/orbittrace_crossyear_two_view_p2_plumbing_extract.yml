name: OrbitTrace P2 frozen plumbing source extract

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - orbittrace_crossyear_two_view_membership_p2/PROTOCOL.md
      - .github/workflows/orbittrace_crossyear_two_view_p2_plumbing_extract.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-probabilistic-membership-p1-freeze-v2
          path: p1
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-recurrent-core-expansion-r1
          path: r1
      - name: Reconstruct and verify exact frozen sources only
        run: |
          set -euo pipefail
          mkdir -p extracted
          cat p1/orbittrace_probabilistic_membership_p1/source_parts/part*.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress \
            > extracted/p1.py
          echo 'e7847e067bab8d07038c998359ccbf0ca6e2ccf257f27f27f4aef999cc7a0508  extracted/p1.py' | sha256sum -c -

          cat r1/orbittrace_recurrent_core_expansion_r1/source_parts/part*.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress \
            > extracted/r1.py
          echo '806e6577b19f5771d58531b036fdb991526999aa6d83795d3e5c864d7c2e8a15  extracted/r1.py' | sha256sum -c -

          python -m py_compile extracted/p1.py extracted/r1.py
          sha256sum extracted/*.py > extracted/source_sha256.txt
          echo PASS_P2_FROZEN_PLUMBING_SOURCE_EXTRACT
      - name: Assert source-only boundary
        run: |
          test ! -e input
          test ! -e output
          echo NO_METEOR_DATA_NO_LABEL_VALUES_NO_TARGET_ACCESS
      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-p2-frozen-plumbing-sources
          path: extracted
          if-no-files-found: error
          retention-days: 7
