name: OrbitTrace v3 catalogue v6 performance source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - .github/workflows/orbittrace_v3_catalogue_v6_performance_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-catalogue-v6-performance-audit
          path: audit

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6

      - name: Reconstruct and inspect exact frozen source only
        run: |
          set -euo pipefail
          test ! -e input
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 \
            | tr -d '\n\r' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/run_v3_primary_catalogue_v6.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/run_v3_primary_catalogue_v6.py' | sha256sum -c -
          python - <<'PY'
          import ast
          from pathlib import Path
          text = Path('/tmp/run_v3_primary_catalogue_v6.py').read_text()
          tree = ast.parse(text)
          lines = text.splitlines()

          for name in ['exact_rescore_window_v6', 'calibrate_year_v6', 'main']:
              fn = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == name)
              print(f'FUNCTION {name} LINES={fn.lineno}-{fn.end_lineno}')
              if name == 'main':
                  for i in range(fn.lineno, fn.end_lineno + 1):
                      line = lines[i-1]
                      if any(token in line for token in ['scan_year_v6', 'YEARS', 'year_', 'famil', 'evaluate', 'build_', 'for year']):
                          lo=max(fn.lineno,i-3); hi=min(fn.end_lineno,i+5)
                          for j in range(lo,hi+1): print(f'{j:04d}: {lines[j-1]}')
                          print('---')

          main = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'main')
          scan_calls=[]
          for node in ast.walk(main):
              if isinstance(node, ast.Call):
                  f=node.func
                  name=f.id if isinstance(f,ast.Name) else (f.attr if isinstance(f,ast.Attribute) else '<dynamic>')
                  if name == 'scan_year_v6':
                      scan_calls.append((node.lineno, ast.get_source_segment(text,node)))
          print('SCAN_YEAR_V6_CALLS=', scan_calls)
          assert scan_calls, 'main has no scan_year_v6 calls'
          print('PASS_V6_YEAR_SCAN_INDEPENDENCE_SOURCE_AUDIT')
          PY

      - name: Assert source-only boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          echo 'NO_CATALOGUE_ACCESS_NO_LABEL_ACCESS_NO_TARGET_ACCESS'
