name: ISEF XMM eRASS3 DR2 reality
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_erass3_dr2_reality.py'
      - '.github/workflows/isef-xmm-erass3-dr2-reality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install astropy numpy scipy
      - run: python isef/xmm_erass3_dr2_reality.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-erass3-dr2-reality
          path: results/xmm_erass3_dr2_reality.json
          if-no-files-found: error
