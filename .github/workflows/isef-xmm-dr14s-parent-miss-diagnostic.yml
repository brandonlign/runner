name: ISEF DR14s parent miss diagnostic
on:
  push:
    paths:
      - 'isef/xmm_dr14s_parent_miss_diagnostic.py'
      - '.github/workflows/isef-xmm-dr14s-parent-miss-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8'
      - run: timeout 480s python isef/xmm_dr14s_parent_miss_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-xmm-dr14s-parent-miss-diagnostic
          path: results/xmm_dr14s_parent_miss_diagnostic.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY' >/tmp/r.md
          import json
          from pathlib import Path
          print('## DR14s parent-miss diagnostic')
          p=Path('results/xmm_dr14s_parent_miss_diagnostic.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:60000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
