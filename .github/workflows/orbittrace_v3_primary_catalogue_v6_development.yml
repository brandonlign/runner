name: OrbitTrace v3-primary catalogue v6 development

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - .github/workflows/orbittrace_v3_primary_catalogue_v6_development.yml
      - orbittrace_v3_catalogue_v6/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-v3-primary-catalogue-v6-development
  cancel-in-progress: true

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PYTHONPATH: orbittrace_wavelet_catalogue_v3:orbittrace_multi_anchor_energy_v3:/tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct frozen catalogue sources and audit v6 before data access
        run: |
          set -euo pipefail
          mkdir -p input/fixed4 output

          # Reuse the already-audited target-excluded catalogue source reconstruction.
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -

          echo 'ae3a72212add083f2641ed16e61765837dd9471d5322da83db772e98550b4f81  orbittrace_v3_catalogue_v6/source_parts/part00.b64' | sha256sum -c -
          echo '92ea370df41df9d12a4f31922390683822dbab60bddc87e146c5a08d4fba3417  orbittrace_v3_catalogue_v6/source_parts/part01.b64' | sha256sum -c -
          echo 'b7aae5534afdddee3c9b74d4f66611f7a0829e7c72fc8253e917253232efbe26  orbittrace_v3_catalogue_v6/source_parts/part02.b64' | sha256sum -c -
          echo 'f6cb2e84e797804113c5e3f4e8367a57042ffd5fc5d985074047a625a3e478b5  orbittrace_v3_catalogue_v6/source_parts/part03.b64' | sha256sum -c -
          cat orbittrace_v3_catalogue_v6/source_parts/part*.b64 \
            | tr -d '\n' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/run_v3_primary_catalogue_v6.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/run_v3_primary_catalogue_v6.py' | sha256sum -c -

          test "$(git hash-object orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"
          python -m py_compile \
            /tmp/run_wavelet_catalogue_v3_development.py \
            /tmp/run_v3_primary_catalogue_v6.py \
            orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py

          python - <<'PY'
          import importlib.util
          import pathlib
          import sys
          sys.path.insert(0, 'orbittrace_wavelet_catalogue_v3')
          sys.path.insert(0, 'orbittrace_multi_anchor_energy_v3')
          import multi_anchor_energy_v3 as v3

          spec = importlib.util.spec_from_file_location('v6', '/tmp/run_v3_primary_catalogue_v6.py')
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          assert all(v3.self_test().values()), v3.self_test()
          assert all(module.v3_membership_self_test().values()), module.v3_membership_self_test()
          old = module.load_base_runner(pathlib.Path('/tmp/run_wavelet_catalogue_v3_development.py'))
          assert old.YEARS == (2022, 2023)
          assert old.MAX_COMPONENTS_PER_BIN == 128
          assert module.PROPOSALS_PER_WINDOW_FACTOR == 4
          assert old.MAX_COMPONENTS_PER_BIN * module.PROPOSALS_PER_WINDOW_FACTOR == 512
          assert 72 * 512 == 36 * (128 * 8) == 36864
          protocol = pathlib.Path('orbittrace_v3_catalogue_v6/PROTOCOL.md').read_text()
          assert '20°–55° removed before label normalization/storage/candidate generation' in protocol
          assert 'never mixed when building connected components' in protocol
          assert 'No 2024–2026 catalogue' in protocol
          print('PASS_V6_PRE_DATA_SOURCE_AUDIT')
          PY

          sha256sum \
            orbittrace_v3_catalogue_v6/PROTOCOL.md \
            orbittrace_v3_catalogue_v6/source_parts/part00.b64 \
            orbittrace_v3_catalogue_v6/source_parts/part01.b64 \
            orbittrace_v3_catalogue_v6/source_parts/part02.b64 \
            orbittrace_v3_catalogue_v6/source_parts/part03.b64 \
            orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py \
            /tmp/run_wavelet_catalogue_v3_development.py \
            /tmp/run_v3_primary_catalogue_v6.py \
            > output/v6_source_sha256.txt
          git rev-parse HEAD | tee output/v6_commit.txt
          git diff --exit-code
          git diff --cached --exit-code

      - name: Retrieve exact frozen fixed4 catalogue baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 31106001133 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-fixed4-support-normalized-wrapper-development \
            --dir input/fixed4
          test -f input/fixed4/orbittrace_fixed4_support_wrapper_development.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('input/fixed4/orbittrace_fixed4_support_wrapper_development.json').read_text())
          assert result['verdict'] == 'FAIL_SUPPORT_NORMALIZED_WRAPPER_DEVELOPMENT'
          baseline = result['development']['panel_evaluations']['development']['metrics']['persistence']
          assert baseline['recovered_at_100'] == 61
          assert baseline['qualified_matches'] == 90
          assert abs(baseline['top100_dominant_precision'] - 0.6809376504699393) < 1e-15
          print('PASS_V6_FIXED4_BASELINE_GUARD')
          PY

      - name: Execute target-excluded v3-primary catalogue development
        run: |
          set -euo pipefail
          python /tmp/run_v3_primary_catalogue_v6.py \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --fixed4-baseline-json input/fixed4/orbittrace_fixed4_support_wrapper_development.json \
            --output output
          cat output/V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT.md

      - name: Enforce v6 development result integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/v3_primary_catalogue_v6_development.json').read_text())
          assert result['verdict'] in {
              'PASS_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT',
              'FAIL_V3_PRIMARY_CATALOGUE_V6_DEVELOPMENT',
          }
          config = result['configuration']
          assert config['years'] == [2022, 2023]
          assert config['blind_exclusion'] == [20.0, 55.0]
          assert config['primary_alpha'] == 0.05
          assert config['rescue_queue'] == 'fixed4 p <= 1/129; never inserted into v3 primary ranking'
          assert all(audit['proposal_cap_per_window'] == 512 for audit in result['year_audits'])
          assert all(audit['max_primary_proposals_per_year'] == 36864 for audit in result['year_audits'])
          print(json.dumps({
              'verdict': result['verdict'],
              'evaluation': {k: v for k, v in result['evaluation'].items() if k != 'per_label'},
              'gates': result['gates'],
              'year_audits': result['year_audits'],
          }, indent=2))
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output
          sha256sum \
            .github/workflows/orbittrace_v3_primary_catalogue_v6_development.yml \
            orbittrace_v3_catalogue_v6/PROTOCOL.md \
            orbittrace_v3_catalogue_v6/source_parts/part00.b64 \
            orbittrace_v3_catalogue_v6/source_parts/part01.b64 \
            orbittrace_v3_catalogue_v6/source_parts/part02.b64 \
            orbittrace_v3_catalogue_v6/source_parts/part03.b64 \
            orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py \
            orbittrace_fixed4_support_wrapper_development/source_parts/part00.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part01.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part02.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part03.b64 \
            sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            input/fixed4/orbittrace_fixed4_support_wrapper_development.json \
            >> output/v6_source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v3-primary-catalogue-v6-development
          path: output
          if-no-files-found: error
          retention-days: 90
