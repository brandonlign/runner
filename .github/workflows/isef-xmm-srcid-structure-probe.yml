name: ISEF XMM SRCID structure probe
on:
  push:
    paths:
      - 'isef/xmm_srcid_structure_probe.py'
      - '.github/workflows/isef-xmm-srcid-structure-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8'
      - run: timeout 420s python isef/xmm_srcid_structure_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-xmm-srcid-structure-probe
          path: results/xmm_srcid_structure_probe.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY' >/tmp/r.md
          import json
          from pathlib import Path
          print('## XMM SRCID structure probe')
          p=Path('results/xmm_srcid_structure_probe.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:60000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
