name: LUNARSHIFT actual-footprint Heis 2021-2024 original sources
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/isef4-heis-2021-2024-overlap-headers.yml"
      - "scripts/isef4_heis_2021_2024_headers.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isef4-heis-2021-2024-overlap-headers
  cancel-in-progress: false
jobs:
  real-covering-products:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify footprint-filtered source program
        run: python -m py_compile scripts/isef4_heis_2021_2024_headers.py
      - name: Strict public ODE polygon and NASA original NAC EDR/CDR headers
        run: |
          python scripts/isef4_heis_2021_2024_headers.py \
            --inventory diagnostics/isef4_heis_unsearched_epoch_inventory.json \
            --out diagnostics/isef4_heis_2021_2024_original_source_headers.json
      - name: Preserve both successful and negative source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef4-Heis-2021-2024-verified-coverage-archive
          path: diagnostics/isef4_heis_2021_2024_original_source_headers.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit exact original image metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f=diagnostics/isef4_heis_2021_2024_original_source_headers.json
          if [[ -f "$f" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$f"
            if ! git diff --cached --quiet; then
              git commit -m 'Record Heis 2021-2024 true-overlap original NAC headers'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
