name: OrbitTrace v31 source-density suppression completion v3

on:
  pull_request:
    branches:
      - agent/orbittrace-v31-local-geometry-margin-oof-v1
    paths:
      - 'orbittrace_v31_source_density_suppression_diagnostic_v1/**'
      - '.github/workflows/orbittrace_v31_source_density_suppression_completion_v3.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v31-source-density-suppression-diagnostic-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin frozen diagnostic and pre-status-only provenance repairs
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3'
          mkdir -p input/prestatus input/payload/hdbscan input/rankgap output/freeze output/diag
          test "$(git hash-object orbittrace_v31_source_density_suppression_diagnostic_v1/PROTOCOL.md)" = 'daf8ec99379285a034ea4790f5a015697509ccfc'
          test "$(git hash-object orbittrace_v31_source_density_suppression_diagnostic_v1/diagnose.py)" = 'd32cd7724e110d72e3db9b7e6f703b59a00482c6'
          test "$(git hash-object orbittrace_v31_source_density_suppression_diagnostic_v1/PRETRUTH_SOURCE_COUNT_CORRECTION.md)" = '5974c07f9f1ad26d0f9337b8c360cc60df1d014a'
          test "$(git hash-object orbittrace_v31_source_density_suppression_diagnostic_v1/PRESTATUS_IMPORT_CORRECTION.md)" = 'e1688c58e3e21aef53d19af167d19c8501e31947'
          test "$(git hash-object orbittrace_v31_source_density_suppression_diagnostic_v1/PRESTATUS_ORDER_HASH_CORRECTION.md)" = 'ddd67210e27855842e25eae848871ab97dce38e2'
          test "$(git hash-object orbittrace_v31_source_density_suppression_diagnostic_v1/prestatus_provenance_repair_v3.py)" = '8599a21ed18e63bce206d49a7c4b3518bbe64b81'
          python -m py_compile orbittrace_v31_source_density_suppression_diagnostic_v1/diagnose.py orbittrace_v31_source_density_suppression_diagnostic_v1/prestatus_provenance_repair_v3.py
          echo PASS_SOURCE_DENSITY_V3_PINS

      - name: Restore cryptographically pinned pre-status exact-v31 rank vector from non-scientific v2 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9107398170/zip' -o input/prestatus.zip
          echo '9cb100ea4a7737111f7cd06a32ed07e0f3c87167a000aa6429a0a43ad675d10a  input/prestatus.zip' | sha256sum -c -
          unzip -q input/prestatus.zip -d input/prestatus
          echo '5ba4426fb626170e9a23e2acd74e22aad0d9f8552be50e82c67680dfa25b7d35  input/prestatus/rankref/V31_SAME_ROUTE_REFERENCE_COUNTERFACTUAL_VECTOR.json' | sha256sum -c -
          test "$(tr -d '\r\n' < input/prestatus/execution_commit.txt)" = 'ccd0a5f201b3207e1933f99f1ed9e969c6bd73af'
          python - <<'PY'
          import json
          v=json.load(open('input/prestatus/rankref/V31_SAME_ROUTE_REFERENCE_COUNTERFACTUAL_VECTOR.json'))
          assert v['verdict']=='PASS_V31_SAME_ROUTE_REFERENCE_COUNTERFACTUAL_VECTOR_FREEZE'
          assert v['scientific_role']=='FULL_229_HDB_MIXED_VS_HDB_ONLY_REFERENCE_VECTOR_FROZEN_BEFORE_1046_STATUS_ATTACHMENT'
          assert v['family_count']==229 and len(v['families'])==229
          assert v['canonical_family_vector_sha256']=='3c3e7d8d9a19e9ceee191901f14fec6b0ff8678fa4e67b65b1a78572df008301'
          assert v['rankgap_1046_loaded_before_vector_freeze'] is False
          assert v['candidate_order_evaluated'] is False and v['literature_panel_evaluated'] is False
          assert v['successor_selected'] is False and v['post_result_second_search'] is False
          assert v['target_information_access'] is False and v['target_region_events_accessed'] is False
          assert v['maarsy_scientific_access'] is False and v['dms_scientific_access'] is False
          assert v['blind_exclusion']==[20.0,55.0]
          print('PASS_SOURCE_DENSITY_V3_PRESTATUS_RANK_VECTOR')
          PY

      - name: Restore immutable #950 pretruth source metadata before #1046 status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/payload.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/payload.zip' | sha256sum -c -
          unzip -p input/payload.zip hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json > input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json
          python - <<'PY'
          import collections,json
          m=json.load(open('input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json'))
          assert m['truth_accessed'] is False and len(m['family_ids'])==229 and len(m['sources'])==229
          assert dict(collections.Counter(map(str,m['sources'])))=={'hard':19,'p19':53,'p20':157}
          assert m['target_information_access'] is False
          assert m['maarsy_scientific_access'] is False and m['dms_scientific_access'] is False
          print('PASS_SOURCE_DENSITY_V3_PRETRUTH_SOURCE_COUNTS')
          PY

      - name: Freeze complete 229-family source-density vector before #1046 status
        run: |
          set -euo pipefail
          test ! -e input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json
          python -u orbittrace_v31_source_density_suppression_diagnostic_v1/prestatus_provenance_repair_v3.py freeze \
            --manifest-file input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json \
            --rank-vector-file input/prestatus/rankref/V31_SAME_ROUTE_REFERENCE_COUNTERFACTUAL_VECTOR.json \
            --output output/freeze
          python - <<'PY'
          import json
          v=json.load(open('output/freeze/V31_SOURCE_DENSITY_VECTOR.json'))
          assert v['verdict']=='PASS_V31_SOURCE_DENSITY_VECTOR_FREEZE'
          assert v['scientific_role']=='FULL_229_HDB_V31_WITHIN_SOURCE_PERCENTILE_VECTOR_FROZEN_BEFORE_1046_STATUS_ATTACHMENT'
          assert v['family_count']==229 and len(v['families'])==229
          assert v['source_counts']=={'hard':19,'p19':53,'p20':157}
          assert v['v31_fused_order_sha256']=='85ac3f29a443c35b3812cf28c99ef13474fc3e0455458e20b41cec64d942073d'
          assert v['rankgap_1046_loaded_before_vector_freeze'] is False
          assert v['source_quota_evaluated'] is False and v['source_weight_evaluated'] is False
          assert v['candidate_order_evaluated'] is False and v['literature_panel_evaluated'] is False
          assert v['successor_selected'] is False and v['post_result_second_search'] is False
          assert v['target_information_access'] is False and v['target_region_events_accessed'] is False
          assert v['maarsy_scientific_access'] is False and v['dms_scientific_access'] is False
          assert v['blind_exclusion']==[20.0,55.0]
          print('PASS_SOURCE_DENSITY_V3_VECTOR_FROZEN',v['canonical_family_vector_sha256'])
          PY

      - name: Restore authoritative #1046 status only after source-density vector is frozen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s output/freeze/V31_SOURCE_DENSITY_VECTOR.json
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9086399760/zip' -o input/rankgap.zip
          echo 'a2c373df77ef7e0065c1d8aceb1f6e5826f1e30b6286f2331c362d959f1d7f69  input/rankgap.zip' | sha256sum -c -
          unzip -p input/rankgap.zip diag/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json > input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json
          echo 'e4e09546e17b9a5da7ce12ad9af4bb7129533fd9b5be846ebc859719f01a9758  input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json' | sha256sum -c -
          echo PASS_SOURCE_DENSITY_V3_STATUS_LOADED_AFTER_FREEZE

      - name: Run unchanged source-density median diagnostic
        run: |
          set -euo pipefail
          python -u orbittrace_v31_source_density_suppression_diagnostic_v1/prestatus_provenance_repair_v3.py diagnose \
            --vector-file output/freeze/V31_SOURCE_DENSITY_VECTOR.json \
            --rankgap-file input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json \
            --output output/diag

      - name: Enforce unchanged scientific gate and protected-data firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/diag/V31_SOURCE_DENSITY_SUPPRESSION_DIAGNOSTIC.json'))
          assert r['verdict'] in {'PASS_V31_SOURCE_DENSITY_SUPPRESSION_DIAGNOSTIC','FAIL_V31_SOURCE_DENSITY_SUPPRESSION_DIAGNOSTIC'}
          assert r['scientific_role']=='POST_V60_PROPOSAL_SOURCE_DENSITY_MECHANISM_DIAGNOSTIC_ONLY_NO_SOURCE_NORMALIZED_ORDER_EVALUATED'
          assert set(r['annual_diagnostics'])=={'2013','2014'}
          for k in ('source_normalized_candidate_order_evaluated','source_quota_search','source_weight_search','source_specific_outcome_subset_search','threshold_search','top_k_search','rank_window_search','feature_search','metric_search','k_search','scaling_search','annual_combiner_search','diversity_search','fusion_search','alternate_representative_search','budget_specific_rule','year_specific_rule','oracle_identity_used_for_ranking','successor_selected','post_result_second_search','target_information_access','target_region_events_accessed','maarsy_scientific_access','dms_scientific_access'):
              assert r[k] is False
          assert r['sonotaco_role']=='EXPOSED_DEVELOPMENT_ONLY' and r['blind_exclusion']==[20.0,55.0]
          print(r['verdict'],r['annual_diagnostics'])
          PY

      - name: Record v3 completion provenance
        if: always()
        run: |
          set +e
          sha256sum \
            orbittrace_v31_source_density_suppression_diagnostic_v1/PROTOCOL.md \
            orbittrace_v31_source_density_suppression_diagnostic_v1/diagnose.py \
            orbittrace_v31_source_density_suppression_diagnostic_v1/PRETRUTH_SOURCE_COUNT_CORRECTION.md \
            orbittrace_v31_source_density_suppression_diagnostic_v1/PRESTATUS_IMPORT_CORRECTION.md \
            orbittrace_v31_source_density_suppression_diagnostic_v1/PRESTATUS_ORDER_HASH_CORRECTION.md \
            orbittrace_v31_source_density_suppression_diagnostic_v1/prestatus_provenance_repair_v3.py \
            input/prestatus/rankref/V31_SAME_ROUTE_REFERENCE_COUNTERFACTUAL_VECTOR.json \
            input/payload/hdbscan/V22_PRETRUTH_FEATURE_MANIFEST.json \
            output/freeze/V31_SOURCE_DENSITY_VECTOR.json \
            input/rankgap/V31_HDB_MISSED_LABEL_RANKGAP_DIAGNOSTIC.json \
            output/diag/V31_SOURCE_DENSITY_SUPPRESSION_DIAGNOSTIC.json \
            > output/V31_SOURCE_DENSITY_SUPPRESSION_COMPLETION_V3_SOURCE_SHA256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-source-density-suppression-completion-v3
          path: output
          if-no-files-found: error
          retention-days: 90
