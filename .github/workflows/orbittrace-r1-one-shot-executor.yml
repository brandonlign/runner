name: OrbitTrace R1 one-shot target-excluded executor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'orbittrace_r1_executor/RUN.json'

permissions:
  contents: read
  actions: read

jobs:
  execute:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Enforce exact one-file request and frozen bindings
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "orbittrace_r1_executor/RUN.json"
          git show "$HEAD_SHA:orbittrace_r1_executor/RUN.json" > /tmp/RUN.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/RUN.json').read_text())
          expected={
            'kind':'EXECUTE_FROZEN_R1_SCHEMAFIX',
            'frozen_parent_sha':'2330d655a7294bf6ffcdebdd1d070b1b83c419fd',
            'scientific_source_sha256':'806e6577b19f5771d58531b036fdb991526999aa6d83795d3e5c864d7c2e8a15',
            'schema_audit_artifact_id':9014633429,
            'schema_audit_digest':'sha256:c748ead99c08f69a80f1c2a5202c9d4fe08579dba0a961f078fcc389b9058113',
            'comparator_git_blob':'ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2',
            'comparator_sha256':'85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a',
            'years':[2022,2023],
            'blind_exclusion':[20.0,55.0],
            'target_access':False,
            'stage_a':False,
            'stage_b':False,
          }
          assert r==expected,(r,expected)
          print('PASS_EXACT_R1_EXECUTION_REQUEST')
          PY

      - name: Switch to exact frozen R1 parent
        run: |
          set -euo pipefail
          git fetch --no-tags origin 2330d655a7294bf6ffcdebdd1d070b1b83c419fd
          git checkout --detach 2330d655a7294bf6ffcdebdd1d070b1b83c419fd
          test "$(git rev-parse HEAD)" = "2330d655a7294bf6ffcdebdd1d070b1b83c419fd"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Header-only preflight using approved schema-audit locator
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from gmn_python_api import data_directory as dd

          KNOWN_MARKERS=(
              'unique trajectory identifier','sol lon','solar longitude',
              'lamgeo','betgeo','vgeo',
          )
          ORBIT_TERMS=(
              'perihelion','eccentric','inclination','argument','ascending',
              'node','semimajor','semi-major','q au','omega',
          )
          def locate(text):
              matches=[]
              for raw in text.splitlines():
                  low=raw.lower()
                  if (sum(marker in low for marker in KNOWN_MARKERS)>=2 or
                      (any(marker in low for marker in KNOWN_MARKERS) and any(term in low for term in ORBIT_TERMS))):
                      line=raw.strip().lstrip('\ufeff')
                      line=re.sub(r'\s+',' ',line)
                      numeric=re.findall(r'(?<![A-Za-z])[-+]?\d+(?:\.\d+)?(?:[Ee][-+]?\d+)?(?![A-Za-z])',line)
                      if len(numeric)>3:
                          raise RuntimeError('candidate schema line contains too many numeric tokens')
                      if line:
                          matches.append(line)
              matches=sorted(set(matches))
              if len(matches)!=1:
                  raise RuntimeError(f'raw schema header not unique under approved locator: {len(matches)}')
              line=matches[0]
              if not line.startswith('#'):
                  raise RuntimeError('sanitized schema line missing comment prefix')
              fields=[x.strip() for x in line[1:].split(';')]
              def exact(name):
                  hits=[i for i,x in enumerate(fields) if x==name]
                  if len(hits)!=1:
                      raise RuntimeError(f'raw schema field {name!r} not unique: {hits}')
                  return hits[0]
              pos={name:exact(name) for name in ('q','e','i','peri','node')}
              if pos['q']!=37 or fields[43]!='Q':
                  raise RuntimeError(f'unexpected q/Q schema positions: q={pos["q"]}, Q43={fields[43]!r}')
              return pos
          text=dd.get_monthly_file_content_by_date('2022-01')
          pos=locate(text)
          print('PASS_R1_HEADER_ONLY_PREFLIGHT',pos)
          PY

      - name: Restore and verify frozen prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/{v3,v6,centroid,schema,source_audit,dsh,r1} output
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          parts=sorted(Path('orbittrace_recurrent_core_expansion_r1/source_parts').glob('part*.b64'))
          assert [p.name for p in parts]==['part00.b64']
          src=gzip.decompress(base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts),validate=True))
          assert hashlib.sha256(src).hexdigest()=='806e6577b19f5771d58531b036fdb991526999aa6d83795d3e5c864d7c2e8a15'
          Path('input/r1/run_development.py').write_bytes(src)
          PY

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = "2ba4835db23f8f623cdd28d0a4e6113b7954ecb2"

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9005846925/zip" -o input/v6.zip
          echo "3c636b05cbfc88c6d6b2b8289b309412174b0025c305ae2f2532678927b2232b  input/v6.zip" | sha256sum -c -
          unzip -q input/v6.zip -d input/v6

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009091129/zip" -o input/centroid.zip
          echo "a1faacf51e1f4ca2a3a92b20e27d1f07f00e1d32ab33993916379ff36acea062  input/centroid.zip" | sha256sum -c -
          unzip -q input/centroid.zip -d input/centroid

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9014633429/zip" -o input/schema.zip
          echo "c748ead99c08f69a80f1c2a5202c9d4fe08579dba0a961f078fcc389b9058113  input/schema.zip" | sha256sum -c -
          unzip -q input/schema.zip -d input/schema

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9014714033/zip" -o input/source_audit.zip
          echo "a6986603a373c9364e1a8a383ed3a37abb5a7b0db8a38c932a207939e3f379e9  input/source_audit.zip" | sha256sum -c -
          unzip -q input/source_audit.zip -d input/source_audit

          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > input/dsh/literature_comparators.py
          test "$(git hash-object input/dsh/literature_comparators.py)" = "ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2"
          echo "85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  input/dsh/literature_comparators.py" | sha256sum -c -

          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          test "$(cat output/development_source_sha256.txt)" = "ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          sa=json.loads(Path('input/source_audit/recurrent_core_expansion_r1_source_audit.json').read_text())
          assert sa['verdict']=='PASS_RECURRENT_CORE_EXPANSION_R1_SOURCE_AUDIT'
          assert sa['source_sha256']=='806e6577b19f5771d58531b036fdb991526999aa6d83795d3e5c864d7c2e8a15'
          assert sa['catalogue_access'] is False and sa['scientific_value_access'] is False
          assert sa['shower_label_access'] is False and sa['orbittrace_target_access'] is False
          sc=json.loads(Path('input/schema/gmn_schema_only_orbit_column_audit.json').read_text())
          assert sc['verdict']=='PASS_GMN_SCHEMA_ONLY_ORBIT_COLUMN_AUDIT'
          assert sc['event_row_values_parsed'] is False and sc['shower_label_values_accessed'] is False
          assert sc['orbittrace_target_accessed'] is False and sc['target_region_event_accessed'] is False
          fields=[x.strip() for x in sc['schema_lines'][0][1:].split(';')]
          assert fields.count('q')==1 and fields.index('q')==37
          assert fields.count('Q')==1 and fields.index('Q')==43
          raw=Path('input/r1/run_development.py').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='806e6577b19f5771d58531b036fdb991526999aa6d83795d3e5c864d7c2e8a15'
          text=raw.decode()
          for token in ('D_SH(candidate, partner medoid) <= 0.05','unchanged exact v8 multiplicity order','no_threshold_search','no_radius_search','no_weight_search','no_variant_search'):
              assert token in text,token
          print('PASS_R1_FROZEN_SOURCE_AND_SCHEMA_BINDINGS')
          PY

      - name: Execute frozen R1 with runtime-only implementation repairs
        env:
          PYTHONPATH: input/v3:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          cat > /tmp/run_r1_wrapper.py <<'PY'
          import hashlib,importlib.util,json,re,sys
          from pathlib import Path
          SOURCE=Path('input/r1/run_development.py')
          SOURCE_SHA='806e6577b19f5771d58531b036fdb991526999aa6d83795d3e5c864d7c2e8a15'
          OLD_BLOB='ab17e1205d72d8ab8361d8ba6cdad2e4c31fdcb2'
          COMPARATOR_SHA='85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a'
          KNOWN_MARKERS=('unique trajectory identifier','sol lon','solar longitude','lamgeo','betgeo','vgeo')
          ORBIT_TERMS=('perihelion','eccentric','inclination','argument','ascending','node','semimajor','semi-major','q au','omega')
          raw=SOURCE.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==SOURCE_SHA
          spec=importlib.util.spec_from_file_location('frozen_r1',SOURCE)
          mod=importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)
          assert mod.LITERATURE_COMPARATOR_SHA256==OLD_BLOB
          mod.LITERATURE_COMPARATOR_SHA256=COMPARATOR_SHA

          def exact_case_raw_header_positions(text: str):
              matches=[]
              for raw_line in text.splitlines():
                  low=raw_line.lower()
                  if (sum(marker in low for marker in KNOWN_MARKERS)>=2 or
                      (any(marker in low for marker in KNOWN_MARKERS) and any(term in low for term in ORBIT_TERMS))):
                      line=raw_line.strip().lstrip('\ufeff')
                      line=re.sub(r'\s+',' ',line)
                      numeric=re.findall(r'(?<![A-Za-z])[-+]?\d+(?:\.\d+)?(?:[Ee][-+]?\d+)?(?![A-Za-z])',line)
                      mod.require(len(numeric)<=3,'candidate schema line contains too many numeric tokens')
                      if line:
                          matches.append(line)
              matches=sorted(set(matches))
              mod.require(len(matches)==1,f'raw schema header not unique under approved locator: {len(matches)}')
              line=matches[0]
              mod.require(line.startswith('#'),'sanitized raw schema line missing comment prefix')
              header_fields=[field.strip() for field in line[1:].split(';')]
              def exact(name: str):
                  hits=[idx for idx,field in enumerate(header_fields) if field==name]
                  mod.require(len(hits)==1,f'raw schema field {name!r} not unique: {hits}')
                  return hits[0]
              positions={name:exact(name) for name in ('q','e','i','peri','node')}
              mod.require(positions['q']==37,f"unexpected lowercase q position: {positions['q']}")
              mod.require(len(header_fields)>43 and header_fields[43]=='Q',f"unexpected uppercase Q position/value")
              return header_fields,positions

          mod.raw_header_positions=exact_case_raw_header_positions
          repair={
              'original_frozen_source_sha256':SOURCE_SHA,
              'source_bytes_modified':False,
              'runtime_override_1':'LITERATURE_COMPARATOR_SHA256 git-blob literal -> independently verified raw SHA-256',
              'runtime_override_2':'raw_header_positions uses approved schema-audit marker locator plus exact case-sensitive fields; q != Q',
              'header_locator_source':'frozen audit_gmn_schema.py marker logic',
              'schema_audit_artifact_id':9014633429,
              'schema_audit_digest':'sha256:c748ead99c08f69a80f1c2a5202c9d4fe08579dba0a961f078fcc389b9058113',
              'scientific_rule_changed':False,
              'promotion_gate_changed':False,
              'target_access':False,
          }
          Path('output/r1_runtime_repair.json').write_text(json.dumps(repair,indent=2,sort_keys=True)+'\n')
          sys.argv=[str(SOURCE),
            '--support-source-parts','orbittrace_fixed4_support_wrapper_development/source_parts',
            '--candidate-payload','sonotaco_fixed4_final_development/candidate.py.gz.b64',
            '--baseline-payload','real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64',
            '--scorer-parts','mondrian_clique_development/source_parts_v2',
            '--source-audit-json','output/wavelet_catalogue_v3_source_audit.json',
            '--v6-result-json','input/v6/label_free_sparse_support_v6_development.json',
            '--centroid-audit-json','input/centroid/component_centroid_source_audit.json',
            '--schema-audit-json','input/schema/gmn_schema_only_orbit_column_audit.json',
            '--dsh-comparator','input/dsh/literature_comparators.py',
            '--output','output']
          raise SystemExit(mod.main())
          PY
          python /tmp/run_r1_wrapper.py
          cat output/RECURRENT_CORE_EXPANSION_R1_DEVELOPMENT.md

      - name: Enforce frozen scientific verdict and claim boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('output/recurrent_core_expansion_r1_development.json').read_text())
          assert r['verdict'] in {'PASS_RECURRENT_CORE_EXPANSION_R1_DEVELOPMENT','FAIL_RECURRENT_CORE_EXPANSION_R1_NO_GO'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['physical_acceptance']=='D_SH(candidate, partner medoid) <= 0.05'
          assert r['configuration']['new_members_can_seed_further_growth'] is False
          assert r['configuration']['ranking_after_expansion']=='unchanged exact v8 multiplicity order'
          assert r['configuration']['no_threshold_search'] is True
          assert r['configuration']['no_radius_search'] is True
          assert r['configuration']['no_weight_search'] is True
          assert r['configuration']['no_variant_search'] is True
          assert r['configuration']['competitor_results_used_for_parameter_selection'] is False
          assert all(r['integrity_gates'].values())
          assert 'does not establish superiority over Sugar/HDBSCAN' in r['claim_boundary']
          repair=json.loads(Path('output/r1_runtime_repair.json').read_text())
          assert repair['source_bytes_modified'] is False
          assert repair['scientific_rule_changed'] is False
          assert repair['promotion_gate_changed'] is False
          assert repair['target_access'] is False
          assert repair['header_locator_source']=='frozen audit_gmn_schema.py marker logic'
          assert hashlib.sha256(Path('input/r1/run_development.py').read_bytes()).hexdigest()=='806e6577b19f5771d58531b036fdb991526999aa6d83795d3e5c864d7c2e8a15'
          print('ORBITTRACE_R1_RESULT_BEGIN')
          print(json.dumps(r,indent=2,sort_keys=True))
          print('ORBITTRACE_R1_RESULT_END')
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_parent_commit.txt
          sha256sum input/r1/run_development.py input/dsh/literature_comparators.py > output/execution_source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-r1-one-shot-target-excluded-development
          path: output
          if-no-files-found: error
          retention-days: 90
