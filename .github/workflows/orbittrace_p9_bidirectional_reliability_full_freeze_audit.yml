name: OrbitTrace P9 bidirectional reliability full freeze audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p8-full-finite-sample-order-stat-freeze
    paths:
      - orbittrace_bidirectional_reliability_p9/**
      - .github/workflows/orbittrace_p9_bidirectional_reliability_development.yml
      - .github/workflows/orbittrace_p9_bidirectional_reliability_full_freeze_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Audit pinned source, execution prerequisite, and target firewall
        run: |
          set -euo pipefail
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2a.py
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2a.py /tmp/p2.py
          python orbittrace_crossfit_seed_floor_membership_p3/apply_p3_patch_v2.py /tmp/p2.py /tmp/p3.py
          python orbittrace_dual_view_seed_envelope_p4/apply_p4_patch.py /tmp/p3.py /tmp/p4.py
          python orbittrace_joint_seed_support_p5/apply_p5_patch.py /tmp/p4.py /tmp/p5.py
          python orbittrace_same_model_crossfit_p6/apply_p6_patch.py /tmp/p5.py /tmp/p6.py
          python orbittrace_finite_sample_robust_floor_p7/apply_p7_patch.py /tmp/p6.py /tmp/p7.py
          python orbittrace_full_finite_sample_order_stat_p8/apply_p8_patch.py /tmp/p7.py /tmp/p8.py
          echo 'd3bdcdaf18639e36cc02f5106b3a3c816f5e51eb19543f425717ba1c48a26470  /tmp/p8.py' | sha256sum -c -
          python orbittrace_bidirectional_reliability_p9/apply_p9_patch.py /tmp/p8.py /tmp/p9.py
          echo '58330c61cf4039f07e80a9746d00eb7281b4e28e674a131d6333e6378695ae31  /tmp/p9.py' | sha256sum -c -
          python -m py_compile /tmp/p9.py orbittrace_bidirectional_reliability_p9/run_header_compatible.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p9.py').read_text()
          w=Path('.github/workflows/orbittrace_p9_bidirectional_reliability_development.yml').read_text()
          protocol=Path('orbittrace_bidirectional_reliability_p9/PROTOCOL.md').read_text()
          assert Path('orbittrace_bidirectional_reliability_p9/SOURCE_SHA256').read_text().strip()=='58330c61cf4039f07e80a9746d00eb7281b4e28e674a131d6333e6378695ae31'
          for token in (
              'if not (bool(gate["reliable"]) and bool(reciprocal_gate["reliable"])):',
              'p9_pretruth_family_reliability_pattern_reproduced','p9_only_bidirectionally_reliable_families_can_propose',
              'PASS_BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P9_DEVELOPMENT','FAIL_BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P9_NO_GO',
              '"p9_parameter_search": False','p9_membership_pretruth.sha256','p9_decisions_pretruth.sha256',
          ):
              assert token in p,token
          for token in (
              'EXECUTE_P9_AFTER_AUTHORITATIVE_P8_SCIENTIFIC_NO_GO','31296889081','9033444168',
              'f9d91b1633022a2ca7d5386d3b8de2e9b81a4237fc115eb4cbf668edc0317979',
              '58330c61cf4039f07e80a9746d00eb7281b4e28e674a131d6333e6378695ae31',
              "assert r['p8']['qualified_matches']==92","assert r['p8']['recovered_at_100']==58",
              "assert r['diagnostics']['p9_bidirectionally_reliable_families']==218",
              "assert r['diagnostics']['p9_one_sided_reliable_families']==3",
              "assert r['diagnostics']['p9_zero_sided_reliable_families']==5",
              "assert r['diagnostics']['p9_proposals_from_non_bidirectionally_reliable_families']==0",
              'BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P9_DEVELOPMENT.md',
              'orbittrace-bidirectional-reliability-membership-p9-development',
          ):
              assert token in w,token
          assert 'comment `5230013045`' in protocol
          for token in ('OrbitTrace-April','target_coordinate'):
              assert token not in p and token not in w and token not in protocol,token
          assert not Path('orbittrace_bidirectional_reliability_p9/RUN.md').exists()
          assert not Path('target').exists()
          print('PASS_P9_FULL_FREEZE_AUDIT_NO_TRUTH_NO_TARGET')
          PY
