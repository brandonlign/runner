name: OrbitTrace SonotaCo 2023 wavelet episode transfer

on:
  pull_request:
    branches:
      - agent/orbittrace-wavelet-episode-development
    paths:
      - .github/workflows/orbittrace_sonotaco_2023_wavelet_episode_transfer.yml
      - orbittrace_literature_comparison/build_wavelet_2023_runner.py
      - orbittrace_literature_comparison/wavelet_episode_comparator.py
      - orbittrace_literature_freeze/SONOTACO_2025_WAVELET_EPISODE_FREEZE.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-sonotaco-2023-wavelet-episode-transfer
  cancel-in-progress: true

jobs:
  one-shot-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-wavelet-episode-2023-transfer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt

      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt

      - name: Reconstruct and audit the frozen transfer before 2023 catalogue access
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: /tmp:orbittrace_literature_comparison
        run: |
          set -euo pipefail
          mkdir -p input/repaired output
          test "$(git hash-object orbittrace_literature_comparison/wavelet_episode_comparator.py)" = "493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8"
          test "$(git hash-object orbittrace_literature_comparison/build_wavelet_2023_runner.py)" = "169c4d03ffcb179951197a0f93c4bc5d63354748"
          test "$(git hash-object orbittrace_literature_freeze/SONOTACO_2025_WAVELET_EPISODE_FREEZE.json)" = "b861c9b42fa0375937e8063b92fdf51745f38f6e"
          echo '5ef0f7b33a1c3ed87885ee70be0cdd184055d819eb1196c65eebc7e867f747e2  orbittrace_literature_comparison/wavelet_episode_comparator.py' | sha256sum -c -
          python -m py_compile \
            orbittrace_literature_comparison/wavelet_episode_comparator.py \
            orbittrace_literature_comparison/build_wavelet_2023_runner.py

          gh api \
            "repos/$GITHUB_REPOSITORY/contents/orbittrace_literature_comparison/literature_comparators.py?ref=eddcf9bb432b92e4f9707d0b2ce58ca21b4faf34" \
            --jq .content \
            | tr -d '\n' \
            | base64 -d \
            > /tmp/literature_comparators.py
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  /tmp/literature_comparators.py' | sha256sum -c -

          echo '0e3af3c5f2b8f2265f5f67cbbd3e43616e3ccc7ca7cd3b5ebfe01f920fbb18ca  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part00.b64' | sha256sum -c -
          echo 'ccfbed79a2c50f0e9768badb58700696ce6401961d1e85f412d3962211d2b8f1  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part01_sub00.b64' | sha256sum -c -
          echo '2904c359c237671e4a20d3d18606f7a4ca91b472d1298c8c5d8c5c6d4753c5aa  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part01_sub01.b64' | sha256sum -c -
          echo '721719076fd28015b2ff7ff0d299b69b77e3bd774fc9adf1705cbfce52702a3c  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part01_sub02.b64' | sha256sum -c -
          echo '8bfbfd7e5deb22d64c1687767b9c7a10ecb28573c6b4dac01548e7d9102a54d1  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part01_sub03.b64' | sha256sum -c -
          echo 'a1c0da4f5a52ff9495b578e6becd4e58bb902b3b38251ffd04cb1fbc31f463e0  orbittrace_literature_freeze/sonotaco_2023_runner_parts/part02.b64' | sha256sum -c -
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path
          import wavelet_episode_comparator as wavelet

          freeze = json.loads(Path('orbittrace_literature_freeze/SONOTACO_2025_WAVELET_EPISODE_FREEZE.json').read_text())
          assert freeze['verdict'] == 'PASS_SONOTACO_2025_WAVELET_EPISODE_COMPARISON'
          assert freeze['source_commit'] == '97e3b1f99b08e6bd98e021c69e7b06d81f0500e1'
          assert freeze['workflow_run'] == 31104654956
          assert freeze['artifact_id'] == 8969020016
          assert freeze['result_sha256'] == '526544fc39fd441fd73472c36e8d563b245728b3d33e858f0b1da11aa024070a'
          assert freeze['frozen_before_sonotaco_2023_execution'] is True
          assert freeze['configuration']['angular_probe_deg'] == 4.0
          assert freeze['configuration']['speed_probe_fraction'] == 0.10
          assert freeze['configuration']['truncation_radius'] == 4.0
          assert freeze['configuration']['parameter_tuning'] is False
          assert all(wavelet.self_test().values())

          root = Path('orbittrace_literature_freeze/sonotaco_2023_runner_parts')
          names = (
              'part00.b64',
              'part01_sub00.b64', 'part01_sub01.b64', 'part01_sub02.b64', 'part01_sub03.b64',
              'part02.b64',
          )
          encoded = ''.join(''.join((root / name).read_text().split()) for name in names)
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          if digest != '582c2bc4c9d947d3d0b86aaf201e30b57eb85d24fd587dbbcd49b483065fc747':
              raise RuntimeError(f'2023 base runner source mismatch: {digest}')
          Path('/tmp/run_sonotaco_2023_literature_comparison.py').write_bytes(source)
          compile(source, 'run_sonotaco_2023_literature_comparison.py', 'exec')
          print('PASS_PRE_2023_WAVELET_FREEZE', digest)
          PY

          python orbittrace_literature_comparison/build_wavelet_2023_runner.py \
            --base /tmp/run_sonotaco_2023_literature_comparison.py \
            --output /tmp/run_sonotaco_2023_wavelet_episode_transfer.py \
            | tee output/runner_build.txt
          python -m py_compile /tmp/run_sonotaco_2023_wavelet_episode_transfer.py
          sha256sum /tmp/run_sonotaco_2023_wavelet_episode_transfer.py | tee output/adapted_runner_sha256.txt
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/run_sonotaco_2023_wavelet_episode_transfer.py').read_text()
          assert source.count('brown2010_wavelet_episode_core') == 3
          assert 'wavelet.wavelet_episode_score(episode)' in source
          assert 'wavelet_parameters_unchanged' in source
          assert 'PASS_SONOTACO_2025_WAVELET_EPISODE_COMPARISON' in source
          assert 'frozen_before_sonotaco_2023_execution' in source
          print('PASS_ADAPTED_2023_WAVELET_RUNNER_AUDIT')
          PY

      - name: Retrieve exact repaired 2023 parser and confirmation source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30920687116 \
            --repo "$GITHUB_REPOSITORY" \
            --name sonotaco-2023-confirmation-source-repair-v2 \
            --dir input/repaired
          echo '9619dfc0b339b39d287833778769f12a643e2b0157fdcd6115cd9c40be528322  input/repaired/audit_sonotaco_2023_v2.py' | sha256sum -c -
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/repaired/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          echo '882c21f2ac48689ab7a0d7a990496f7e055ab571b10c6f00bb63d8a18f8f7b3f  input/repaired/sonotaco_2023_confirmation_source_repair_v2.json' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          repair = json.loads(Path('input/repaired/sonotaco_2023_confirmation_source_repair_v2.json').read_text())
          assert repair['verdict'] == 'PASS_SONOTACO_2023_CONFIRMATION_SOURCE_REPAIR_V2'
          assert all(repair['gates'].values())
          assert repair['opaque_structure']['expected_data_rows'] == 47087
          PY

      - name: Retrieve exact GMN-MDC mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -

      - name: Download exact SonotaCo 2023 replacement archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output input/023a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/023a.zip
          echo '9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430  input/023a.zip' | sha256sum -c -

      - name: Execute one-shot frozen wavelet transfer
        env:
          PYTHONPATH: /tmp:orbittrace_literature_comparison
        run: |
          set -euo pipefail
          python /tmp/run_sonotaco_2023_wavelet_episode_transfer.py \
            --archive input/023a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --confirmation-source input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            --freeze orbittrace_literature_freeze/SONOTACO_2025_WAVELET_EPISODE_FREEZE.json \
            --workers 4 \
            --output output
          cat output/SONOTACO_2023_LITERATURE_TRANSFER.md

      - name: Record immutable provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output
          sha256sum \
            orbittrace_literature_freeze/SONOTACO_2025_WAVELET_EPISODE_FREEZE.json \
            orbittrace_literature_comparison/wavelet_episode_comparator.py \
            orbittrace_literature_comparison/build_wavelet_2023_runner.py \
            /tmp/literature_comparators.py \
            input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            input/audit.json input/023a.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          if [ -f /tmp/run_sonotaco_2023_wavelet_episode_transfer.py ]; then
            sha256sum /tmp/run_sonotaco_2023_wavelet_episode_transfer.py >> output/source_and_input_sha256.txt
          fi
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload one-shot wavelet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-sonotaco-2023-wavelet-episode-transfer
          path: output
          if-no-files-found: error
          retention-days: 90
