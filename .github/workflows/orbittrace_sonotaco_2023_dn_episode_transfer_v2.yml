name: OrbitTrace SonotaCo 2023 D_N one-shot transfer v2

on:
  pull_request:
    branches:
      - agent/orbittrace-dn-episode-development
    paths:
      - .github/workflows/orbittrace_sonotaco_2023_dn_episode_transfer_v2.yml
      - orbittrace_literature_freeze/SONOTACO_2025_DN_EPISODE_FREEZE.json
      - orbittrace_literature_comparison/dn_comparator.py
      - orbittrace_literature_comparison/literature_comparators.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-sonotaco-2023-dn-episode-transfer-v2
  cancel-in-progress: true

jobs:
  one-shot-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-dn-episode-2023-transfer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: real_shower_meta_stage0/requirements.txt

      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip -r real_shower_meta_stage0/requirements.txt

      - name: Reconstruct and audit implementation-only runner repairs before data access
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: orbittrace_literature_comparison
        run: |
          set -euo pipefail
          mkdir -p input/repaired output
          echo '28a900dcd43143291dfa1259cb7b3363277f76133e3c53c65b38dc988a5dbacc  orbittrace_literature_comparison/dn_comparator.py' | sha256sum -c -
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  orbittrace_literature_comparison/literature_comparators.py' | sha256sum -c -
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/orbittrace_literature_freeze/dn_2023_runner_parts/part00.b64?ref=0acc7cf785b17d77d9560197f99d908a233340e6" \
            --jq .content \
            | tr -d '\n' \
            | base64 -d \
            > /tmp/original_dn_2023_runner.b64
          echo '9badc559756141b638b14e8116df8b35b040630e713a466234a6ab19c486316f  /tmp/original_dn_2023_runner.b64' | sha256sum -c -
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path
          import dn_comparator as dn

          freeze = json.loads(Path('orbittrace_literature_freeze/SONOTACO_2025_DN_EPISODE_FREEZE.json').read_text())
          assert freeze['verdict'] == 'PASS_SONOTACO_2025_DN_EPISODE_COMPARISON'
          assert freeze['source_commit'] == '974843e8120031f35e8ddf40457f6a98086edc0b'
          assert freeze['workflow_run'] == 31073086886
          assert freeze['artifact_id'] == 8956382792
          assert freeze['artifact_digest'] == 'sha256:8410c0805c659a4e7755908578e9ba3a5d9b7c9c6f0d97fca5e28fc90f35803b'
          assert freeze['result_sha256'] == '22de6690ebfaeabb2aec7de825ecf1c8ccd691ee00f98bcd2efa6aa4a29f4aa8'
          assert freeze['protocol_sha256'] == '255510179136629ed479b3cbbac4622fe79861cf816e4392d820a6e2aab4490e'
          assert freeze['dn_comparator_source_sha256'] == '28a900dcd43143291dfa1259cb7b3363277f76133e3c53c65b38dc988a5dbacc'
          assert freeze['development_runner_source_sha256'] == 'b8a7bfe55e3ad921b22aa0c0512a7b38016ea837b0ae98e5981e9f5466c83a84'
          assert freeze['frozen_before_sonotaco_2023_execution'] is True
          assert freeze['configuration']['weights'] == [1.0, 1.0, 1.0]
          assert freeze['configuration']['dn6_target_members'] == 6
          assert freeze['configuration']['dn4_target_members'] == 4
          assert tuple(dn.DN_WEIGHTS) == (1.0, 1.0, 1.0)
          assert dn.DN_PARITY_MEMBERS == 6 and dn.DN_SPARSE_MEMBERS == 4
          assert all(dn.self_test().values())

          encoded = ''.join(Path('/tmp/original_dn_2023_runner.b64').read_text().split())
          original = gzip.decompress(base64.b64decode(encoded, validate=True))
          original_sha = hashlib.sha256(original).hexdigest()
          if original_sha != 'b4c3a469fc4f63c2108671571a2c00f8c383d99c565ce3d97233912cf5fdf910':
              raise RuntimeError(f'original 2023 runner source mismatch: {original_sha}')

          text = original.decode('utf-8')
          replacements = [
              (
                  'float(scorer.auc((row["scores"][method] for row in weak), negative_scores))',
                  'float(scorer.auc([row["scores"][method] for row in weak], negative_scores))',
                  'weak-AUROC generator to list'
              ),
              (
                  '(row["scores"][method] for row in weak if row["fold"] == fold),',
                  '[row["scores"][method] for row in weak if row["fold"] == fold],',
                  'fold-AUROC generator to list'
              ),
              (
                  '"all_fold_units_nonempty": all(bool(units) for units in fold_units),',
                  '"all_fold_units_nonempty": all(any(row["fold"] == fold for row in positive_rows) for fold in range(base.N_FOLDS)),',
                  'iterate observed positive episodes rather than dictionary keys for fold audit'
              )
          ]
          descriptions = []
          for old, new, description in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f'unexpected repair target count for {description}: {text.count(old)}')
              text = text.replace(old, new)
              descriptions.append(description)
          repaired = text.encode('utf-8')
          repaired_sha = hashlib.sha256(repaired).hexdigest()
          if repaired_sha != 'f454f558391154c2ae15ec951c0fbb40fa6998ad3d13db8fd2fb573a5e1d0fff':
              raise RuntimeError(f'repaired 2023 runner source mismatch: {repaired_sha}')
          compile(repaired, 'run_sonotaco_2023_dn_episode.py', 'exec')
          Path('/tmp/run_sonotaco_2023_dn_episode.py').write_bytes(repaired)
          Path('output/runner_repair.json').write_text(json.dumps({
              'classification': 'implementation-only iterator and fold-audit repairs',
              'immutable_original_commit': '0acc7cf785b17d77d9560197f99d908a233340e6',
              'original_source_sha256': original_sha,
              'repaired_source_sha256': repaired_sha,
              'scientific_parameter_changes': [],
              'score_changes': [],
              'data_access_before_repairs': False,
              'fold_audit_evidence_from_failed_run': {
                  'positive_episode_counts_by_fold': {'0': 32, '1': 32, '2': 192, '3': 192, '4': 208},
                  'fixed4_auc_reproduced': True,
                  'all_scores_finite': True
              },
              'replacements': descriptions
          }, indent=2) + '\n')
          print('PASS_PRE_2023_DN_REPAIR_FREEZE', repaired_sha)
          PY

      - name: Retrieve exact repaired 2023 confirmation source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30920687116 \
            --repo "$GITHUB_REPOSITORY" \
            --name sonotaco-2023-confirmation-source-repair-v2 \
            --dir input/repaired
          echo 'bc2636005cc25da33e8accb6bdb70beea6ab900862cd1e6342a481395ac8f3e6  input/repaired/run_sonotaco_2023_fixed4_confirmation.py' | sha256sum -c -
          echo '882c21f2ac48689ab7a0d7a990496f7e055ab571b10c6f00bb63d8a18f8f7b3f  input/repaired/sonotaco_2023_confirmation_source_repair_v2.json' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          repair = json.loads(Path('input/repaired/sonotaco_2023_confirmation_source_repair_v2.json').read_text())
          assert repair['verdict'] == 'PASS_SONOTACO_2023_CONFIRMATION_SOURCE_REPAIR_V2'
          assert all(repair['gates'].values())
          assert repair['opaque_structure']['expected_data_rows'] == 47087
          PY

      - name: Retrieve exact GMN-MDC mapping audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 30855193522 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-shower-meta-data-audit \
            --dir input
          echo 'f8ba2446dce96d69652727092189903c40493e2fe741eb746f7fb5181edea778  input/audit.json' | sha256sum -c -

      - name: Download exact SonotaCo 2023 archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output input/023a.zip \
            https://www.astro.sk/iaumdcDB/public/data/SNMv3/023a.zip
          echo '9f44696f99164801ff405dab90f68df3666b0d6734fed464a95e7ed0d6f5f430  input/023a.zip' | sha256sum -c -

      - name: Execute one-shot frozen D_N transfer
        env:
          PYTHONPATH: orbittrace_literature_comparison
        run: |
          set -euo pipefail
          python /tmp/run_sonotaco_2023_dn_episode.py \
            --archive input/023a.zip \
            --audit input/audit.json \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --confirmation-source input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            --freeze orbittrace_literature_freeze/SONOTACO_2025_DN_EPISODE_FREEZE.json \
            --workers 4 \
            --output output
          cat output/SONOTACO_2023_DN_EPISODE_TRANSFER.md

      - name: Record immutable provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output
          sha256sum \
            orbittrace_literature_freeze/SONOTACO_2025_DN_EPISODE_FREEZE.json \
            orbittrace_literature_comparison/dn_comparator.py \
            orbittrace_literature_comparison/literature_comparators.py \
            input/repaired/run_sonotaco_2023_fixed4_confirmation.py \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            input/audit.json input/023a.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          if [ -f /tmp/run_sonotaco_2023_dn_episode.py ]; then
            sha256sum /tmp/run_sonotaco_2023_dn_episode.py >> output/source_and_input_sha256.txt
          fi
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - name: Upload one-shot D_N evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-sonotaco-2023-dn-episode-transfer-v2
          path: output
          if-no-files-found: error
          retention-days: 90
