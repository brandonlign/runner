name: OrbitTrace Harvard 1968-1969 full-history freshness audit

on:
  pull_request:
    branches:
      - agent/orbittrace-harvard-1968-1969-freshness-audit
    paths:
      - 'orbittrace_harvard_1968_1969_freshness_audit/RUN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out frozen Harvard freshness parent
        uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-harvard-1968-1969-freshness-audit
          fetch-depth: 1

      - name: Enforce source and fetch complete remote branch history
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_harvard_1968_1969_freshness_audit/PROTOCOL.md)" = "a56ab78fc9f12748e3590fb59a7b90dd19e328b3"
          test "$(git hash-object orbittrace_harvard_1968_1969_freshness_audit/audit_history.py)" = "bf4d593cf85e1ebef437f5b1fa77f97f4abdaabc"
          python -m py_compile orbittrace_harvard_1968_1969_freshness_audit/audit_history.py
          git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          echo "remote refs: $(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -v '/HEAD$' | wc -l)"

      - name: Run zero-data Harvard full-history audit
        run: |
          set -euo pipefail
          python orbittrace_harvard_1968_1969_freshness_audit/audit_history.py

      - name: Enforce zero-data boundary
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/harvard_1968_1969_repo_freshness_audit.json')
          if p.exists():
              r=json.loads(p.read_text())
              assert r['catalogue_contacted'] is False
              assert r['scientific_record_access'] is False
              assert r['source_label_access'] is False
              assert r['orbittrace_target_information_access'] is False
              assert r['positive_controls']['amor_external_history_detected'] is True
              assert r['positive_controls']['ukmon_external_history_detected'] is True
          PY

      - name: Record provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/audit_commit.txt
          sha256sum orbittrace_harvard_1968_1969_freshness_audit/PROTOCOL.md orbittrace_harvard_1968_1969_freshness_audit/audit_history.py > output/source_sha256.txt
          python --version > output/python_version.txt

      - name: Upload Harvard freshness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-harvard-1968-1969-freshness-audit
          path: output
          if-no-files-found: error
          retention-days: 90
