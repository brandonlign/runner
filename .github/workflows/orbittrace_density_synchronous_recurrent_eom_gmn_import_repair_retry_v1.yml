name: OrbitTrace density-synchronous recurrent-EOM GMN import-repair retry v1

on:
  push:
    branches:
      - agent/orbittrace-density-synchronous-recurrent-eom-v1
    paths:
      - '.github/workflows/orbittrace_density_synchronous_recurrent_eom_gmn_import_repair_retry_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  clean-retry:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-density-synchronous-recurrent-eom-v1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact promoted-parent runtime and verify immutable science plus repair bytes
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          mkdir -p input/v3 input/v8 input/ranker input/audits/synthetic input/audits/source input/audits/import-repair input/noresult output

          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/PROTOCOL.md)" = '1187cbba37372c834bdbbf7eb05b1f7c31f8dcf9'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/run_development.py)" = '157813ca331165180a6d20aa71bfc78d5984396f'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/EXECUTION_FREEZE.json)" = '620fa5185ff331e8d3befd4395370df5e35fec83'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/IMPORT_REPAIR_FREEZE.md)" = 'bfd64e1b66663565343e1e05202631a0aca06fa7'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/run_with_parent_import.py)" = 'df024a3d724be8688ca45f77c02dc4bd2e0bd5b5'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/IMPORT_REPAIR_EXECUTION_FREEZE.json)" = 'd33d361f5d752952c4db790bda9cb559835d68b6'
          python -m py_compile \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            orbittrace_density_synchronous_recurrent_eom_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/run_with_parent_import.py

          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-development
          path: input/noresult
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852571788

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-synthetic-audit-v1
          path: input/audits/synthetic
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852283069

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-recurrent-eom-source-audit-v1
          path: input/audits/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852419659

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-density-synchronous-import-repair-zero-data-audit-v1
          path: input/audits/import-repair
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31852739265

      - name: Pre-access authorize clean retry and prove first activation had no endpoint
        run: |
          set -euo pipefail
          test ! -e input/noresult/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json
          test ! -e input/noresult/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json
          test -e input/noresult/execution_commit.txt
          test "$(cat input/noresult/execution_commit.txt)" = 'e4bba8dbe17af2cf530ded0c2ee1322525e87fcd'
          python - <<'PY'
          import json

          freeze=json.load(open('orbittrace_density_synchronous_recurrent_eom_v1/EXECUTION_FREEZE.json'))
          assert freeze['schema']=='DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_EXECUTION_FREEZE'
          assert freeze['scientific_status']=='PRE_GMN_OUTCOME'
          assert freeze['no_rescue_after_first_technically_valid_gmn_outcome'] is True

          repair=json.load(open('orbittrace_density_synchronous_recurrent_eom_v1/IMPORT_REPAIR_EXECUTION_FREEZE.json'))
          assert repair['schema']=='DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_IMPORT_REPAIR_EXECUTION_FREEZE'
          assert repair['scientific_status']=='PRE_FIRST_TECHNICALLY_VALID_GMN_OUTCOME'
          assert repair['scientific_method_changed'] is False
          first=repair['first_activation']
          assert first['run_id']==31852571788
          assert first['artifact_id']==9237971344
          assert first['artifact_digest']=='sha256:30ad75c1fde8e7345532557d53ca338035a2ef7948c002d5330dadd620121198'
          assert first['classification']=='TECHNICAL_NO_RESULT_PRE_MAIN_IMPORT_COLLISION'
          assert first['prelabel_created'] is False
          assert first['scientific_result_created'] is False
          assert first['gmn_catalogue_parsed'] is False
          assert first['truth_accessed'] is False
          assert repair['repair']['wrapper_blob']=='df024a3d724be8688ca45f77c02dc4bd2e0bd5b5'
          assert repair['repair_audit']['run_id']==31852739265
          assert repair['repair_audit']['artifact_id']==9238020439
          assert repair['repair_audit']['artifact_digest']=='sha256:beda03ebb4d1f4c0385c0f687b4766ef330a4376bd2549768d5bc4fe4bb452b8'
          assert repair['retry_authorized'] is True
          assert repair['first_technically_valid_endpoint_binding'] is True
          assert repair['no_scientific_rescue_authorized'] is True

          syn=json.load(open('input/audits/synthetic/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_SYNTHETIC_AUDIT.json'))
          assert syn['verdict']=='PASS_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_SYNTHETIC_AUDIT'
          assert all(syn['tests'].values())
          src=json.load(open('input/audits/source/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_SOURCE_FIREWALL_AUDIT.json'))
          assert src['verdict']=='PASS_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_SOURCE_FIREWALL_AUDIT'
          assert all(src['checks'].values())
          imp=json.load(open('input/audits/import-repair/DENSITY_SYNCHRONOUS_IMPORT_REPAIR_ZERO_DATA_AUDIT.json'))
          assert imp['verdict']=='PASS_DENSITY_SYNCHRONOUS_IMPORT_REPAIR_ZERO_DATA_AUDIT'
          assert imp['parent_module_bound_exactly'] is True
          assert imp['successor_parent_runner_identity_exact'] is True
          assert imp['inherited_constants_exact'] is True
          for obj in (syn,src,imp):
              for k in ['sonotaco_access','efn_access','asfn_access','amos_access','maarsy_scientific_access','dms_scientific_access','target_information_access','target_region_events_accessed']:
                  assert obj[k] is False, (k,obj[k])
          assert imp['gmn_access'] is False
          assert imp['hdbscan_fit_executed'] is False
          assert imp['hidden_truth_accessed'] is False
          print('PASS_DENSITY_SYNCHRONOUS_IMPORT_REPAIR_RETRY_AUTHORIZER')
          PY

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify immutable GMN runtime-support inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Run first technically valid candidate endpoint through audited import wrapper
        env:
          PYTHONPATH: orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:input/ranker:.:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_density_synchronous_recurrent_eom_v1/run_with_parent_import.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce binding schema and scientific firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json'))
          p=json.load(open('output/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json'))
          assert r['verdict'] in {
              'PASS_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT',
              'FAIL_DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT'
          }
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_DEVELOPMENT_ONLY'
          assert r['events_by_year']=={'2022':315024,'2023':423658}
          assert p['events_by_year']=={'2022':315024,'2023':423658}
          assert r['parent_candidate_count']==2097
          assert p['parent_candidate_count']==2097
          assert r['sole_successor_objective']=='integral_min_normalized_annual_alive_mass_over_lambda'
          assert r['blind_exclusion']==[20.0,55.0]
          assert p['blind_exclusion']==[20.0,55.0]
          for x in (r,p):
              for k in ['target_information_access','target_region_events_accessed','sonotaco_2013_2014_access','efn_access','asfn_access','amos_access','maarsy_scientific_access','dms_scientific_access']:
                  assert x[k] is False, (k,x[k])
          print(json.dumps({
              'verdict':r['verdict'],
              'mechanism_active':r['mechanism_active'],
              'parent_candidate_count':r['parent_candidate_count'],
              'successor_candidate_count':r['successor_candidate_count'],
              'strict_100':r['strict_recovered_at_100_improvement_some_year'],
              'parent':{y:{k:v for k,v in m.items() if k!='first_rank_by_label'} for y,m in r['parent_metrics'].items()},
              'successor':{y:{k:v for k,v in m.items() if k!='first_rank_by_label'} for y,m in r['successor_metrics'].items()},
              'annual_gates':r['annual_gates'],
          },indent=2,sort_keys=True))
          PY

      - name: Preserve binding provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum \
            orbittrace_density_synchronous_recurrent_eom_v1/PROTOCOL.md \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            orbittrace_density_synchronous_recurrent_eom_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/EXECUTION_FREEZE.json \
            orbittrace_density_synchronous_recurrent_eom_v1/IMPORT_REPAIR_FREEZE.md \
            orbittrace_density_synchronous_recurrent_eom_v1/run_with_parent_import.py \
            orbittrace_density_synchronous_recurrent_eom_v1/IMPORT_REPAIR_EXECUTION_FREEZE.json \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            input/ranker/run_urc_union_ranker.py \
            input/v8/pooled_year_centroid_v8_development.json \
            output/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_PRELABEL.json \
            output/DENSITY_SYNCHRONOUS_RECURRENT_EOM_V1_GMN_DEVELOPMENT.json \
            > output/binding_provenance_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-density-synchronous-recurrent-eom-v1-gmn-import-repair-retry
          path: output
          if-no-files-found: error
          retention-days: 90
