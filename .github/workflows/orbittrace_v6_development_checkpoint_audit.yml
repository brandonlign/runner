name: OrbitTrace v6 development checkpoint source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - .github/workflows/orbittrace_v6_development_checkpoint_audit.yml
      - orbittrace_v6_development_checkpoint/**

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-development-checkpoint-final-audit
          path: recovery

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6

      - name: Run final source-only recovery audit
        run: |
          set -euo pipefail
          test ! -e input
          python recovery/orbittrace_v6_development_checkpoint/audit_source.py \
            --recovery-root recovery \
            --frozen-root frozen-v6

      - name: Assert no-data boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          echo 'NO_GMN_CATALOGUE_NO_LABEL_VALUE_NO_TARGET_ACCESS'
