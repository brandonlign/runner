name: ISEF XMM TAP probe
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_tap_probe.py'
      - '.github/workflows/isef-xmm-tap-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python isef/xmm_tap_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-tap-probe
          path: results/xmm_tap_probe.json
          if-no-files-found: error
