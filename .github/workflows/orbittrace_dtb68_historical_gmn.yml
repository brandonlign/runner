name: OrbitTrace DTb68 historical GMN extension

on:
  push:
    branches:
      - research/orbittrace-new-discovery-screen-20260828
    paths:
      - orbittrace_new_discovery_screen/dtb68_historical_gmn.py
      - .github/workflows/orbittrace_dtb68_historical_gmn.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOCOL_ID: 'orbittrace-raw/DTB68_HISTORICAL_GMN_PROTOCOL@eb175271'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 requests==2.32.5 beautifulsoup4==4.12.3 click==8.0.4 future==1.0.0
          python -m pip install --no-deps gmn-python-api==0.0.13
      - run: python -m py_compile orbittrace_new_discovery_screen/dtb68_historical_gmn.py
      - name: Execute frozen historical extension
        run: |
          set -euo pipefail
          echo "Executing ${PROTOCOL_ID}"
          python -m orbittrace_new_discovery_screen.dtb68_historical_gmn --out historical_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dtb68-historical-gmn
          path: historical_output/
          if-no-files-found: warn
          retention-days: 60
