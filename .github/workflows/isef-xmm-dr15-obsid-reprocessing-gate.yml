name: ISEF XMM DR15 ObsID reprocessing gate
on:
  push:
    branches: [main]
    paths:
      - 'isef/xmm_dr15_obsid_reprocessing_gate.py'
      - '.github/workflows/isef-xmm-dr15-obsid-reprocessing-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install astropy numpy
      - run: python isef/xmm_dr15_obsid_reprocessing_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-xmm-dr15-obsid-reprocessing-gate
          path: results/xmm_dr15_obsid_reprocessing_gate.json
          if-no-files-found: warn
