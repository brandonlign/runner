name: ISEF MATLAS frozen HST sample manifest

on:
  push:
    branches: [main]
    paths:
      - 'isef/MATLAS_HST_SAMPLE_MANIFEST_TRIGGER'
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata dependency
        run: pip install astroquery
      - name: Freeze exact published 74-target metadata manifest
        run: |
          python -m py_compile isef/matlas_hst_sample_manifest_metadata.py
          cd isef
          python matlas_hst_sample_manifest_metadata.py
      - name: Preserve manifest and split
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-matlas-hst-frozen-sample-manifest
          path: isef/results/matlas_hst_sample_manifest_metadata/
          if-no-files-found: error
