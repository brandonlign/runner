name: OrbitTrace parent-anchored DCR v1

on:
  pull_request:
    branches: [agent/orbittrace-m2d-support-pruned-cut-v1]
    paths:
      - orbittrace_parent_anchored_dcr_v1/**
      - .github/workflows/orbittrace_parent_anchored_dcr_v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  pretruth:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      pretruth_sha: ${{ steps.seal.outputs.pretruth_sha }}
      structural_pass: ${{ steps.seal.outputs.structural_pass }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact pretruth runtime and verify sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3'
          test "$(git hash-object orbittrace_parent_anchored_dcr_v1/build_pretruth.py)" = '573aedd2c5359f2abe61060f6cc142ffd3f4ac22'
          test "$(git hash-object orbittrace_parent_anchored_dcr_v1/evaluate_gmn.py)" = '96857d5a1e281ac9f423c0d43f4d99ebeb8c1cb4'
          python -m py_compile orbittrace_parent_anchored_dcr_v1/build_pretruth.py orbittrace_parent_anchored_dcr_v1/evaluate_gmn.py
          mkdir -p input/dcr output/pretruth
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-dominant-core-regrowth-v1-pretruth
          path: input/dcr
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32304040190'
      - name: Verify immutable frozen DCR membership source
        run: |
          set -euo pipefail
          echo '92e91dfa5fc8557f26d4be0238b3379e49c0845513e7f3e0e9ffc471343813c5  input/dcr/DOMINANT_CORE_REGROWTH_V1_PRETRUTH.json' | sha256sum -c -
      - name: Restore exact support-pruned parent ordering
        run: |
          set -euo pipefail
          python -u orbittrace_parent_anchored_dcr_v1/build_pretruth.py \
            --dcr-pretruth input/dcr/DOMINANT_CORE_REGROWTH_V1_PRETRUTH.json \
            --output output/pretruth/PARENT_ANCHORED_DCR_V1_PRETRUTH.json
      - name: Seal exact ranking before evaluator truth access
        id: seal
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          p='output/pretruth/PARENT_ANCHORED_DCR_V1_PRETRUTH.json'
          raw=open(p,'rb').read(); h=hashlib.sha256(raw).hexdigest(); r=json.loads(raw)
          assert r['schema']=='ORBITTRACE_PARENT_ANCHORED_DCR_V1_PRETRUTH'
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_PADCR_V1_DEVELOPMENT_RANKING'
          assert r['configuration']['ranking_rule']=='exact promoted support-pruned parent M2D order; child M2D cannot change discovery rank'
          assert r['configuration']['new_tuned_parameters']==[] and r['configuration']['one_candidate_per_parent'] is True
          assert r['mechanism_summary']['ranking_changed_from_support_pruned'] is False and r['mechanism_summary']['memberships_changed_from_dcr'] is False
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False and r['sonotaco_scientific_access'] is False
          sp='true' if r['structural_pass'] else 'false'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('pretruth_sha='+h+'\n'); f.write('structural_pass='+sp+'\n')
          open('output/pretruth/PRETRUTH_SHA256.txt','w').write(h+'  PARENT_ANCHORED_DCR_V1_PRETRUTH.json\n')
          print('PADCR_PRETRUTH_SHA='+h); print('STRUCTURAL_PASS='+sp)
          print(json.dumps(r['mechanism_summary'],sort_keys=True)); print(json.dumps(r['size_summary'],sort_keys=True)); print(json.dumps(r['structural_gates'],sort_keys=True))
          PY
      - name: Preserve pretruth provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/pretruth/execution_commit.txt
          python --version > output/pretruth/python_version.txt
          python -m pip freeze > output/pretruth/environment.txt
          sha256sum orbittrace_parent_anchored_dcr_v1/PROTOCOL.md orbittrace_parent_anchored_dcr_v1/build_pretruth.py orbittrace_parent_anchored_dcr_v1/evaluate_gmn.py input/dcr/DOMINANT_CORE_REGROWTH_V1_PRETRUTH.json output/pretruth/PARENT_ANCHORED_DCR_V1_PRETRUTH.json > output/pretruth/provenance_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-parent-anchored-dcr-v1-pretruth
          path: output/pretruth
          if-no-files-found: error
          retention-days: 90

  truth:
    needs: pretruth
    if: needs.pretruth.outputs.structural_pass == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 0960edd77ea29b29b70d05f389dce312d451f0d2
          path: frozen-bwm
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact hidden-label runtime and verify frozen evaluator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          test "$(git hash-object orbittrace_parent_anchored_dcr_v1/build_pretruth.py)" = '573aedd2c5359f2abe61060f6cc142ffd3f4ac22'
          test "$(git hash-object orbittrace_parent_anchored_dcr_v1/evaluate_gmn.py)" = '96857d5a1e281ac9f423c0d43f4d99ebeb8c1cb4'
          echo '1578f5eb28fc7e66a2c73f3ef66a6697e20b53b992a7fc979276720047e534d6  frozen-bwm/orbittrace_bif_witness_modularity_v1/evaluate_gmn.py' | sha256sum -c -
          mkdir -p input/pretruth input/fairness input/ranker input/v8 input/v3 output/truth
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          (cd frozen-v8 && python orbittrace_wavelet_catalogue_v3/audit_development_source.py && test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51')
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-parent-anchored-dcr-v1-pretruth
          path: input/pretruth
      - name: Verify exact sealed PADCR ranking
        run: |
          set -euo pipefail
          echo '${{ needs.pretruth.outputs.pretruth_sha }}  input/pretruth/PARENT_ANCHORED_DCR_V1_PRETRUTH.json' | sha256sum -c -
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-gmn-sparse-literature-fairness-v1-pretruth
          path: input/fairness
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '32268943692'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '31344632499'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: brandonlign/runner
          run-id: '31217916558'
      - name: Score frozen PADCR on exposed GMN development truth
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_parent_anchored_dcr_v1/evaluate_gmn.py \
            --padcr-pretruth input/pretruth/PARENT_ANCHORED_DCR_V1_PRETRUTH.json \
            --expected-pretruth-sha '${{ needs.pretruth.outputs.pretruth_sha }}' \
            --frozen-bwm-evaluator frozen-bwm/orbittrace_bif_witness_modularity_v1/evaluate_gmn.py \
            --literature-pretruth input/fairness/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output/truth/PARENT_ANCHORED_DCR_V1_GMN_RESULT.json
      - name: Print exact development verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          p='output/truth/PARENT_ANCHORED_DCR_V1_GMN_RESULT.json'; r=json.load(open(p))
          assert r['verdict'] in {'PASS_PARENT_ANCHORED_DCR_V1_GMN_DEVELOPMENT','FAIL_PARENT_ANCHORED_DCR_V1_GMN_DEVELOPMENT'}
          assert r['padcr_pretruth_sha256']=='${{ needs.pretruth.outputs.pretruth_sha }}'
          assert r['post_result_parameter_search'] is False and r['target_information_access'] is False and r['target_region_events_accessed'] is False and r['orbittrace_reveal_access'] is False and r['sonotaco_scientific_access'] is False
          print(r['verdict']); print('RESULT_SHA256='+hashlib.sha256(open(p,'rb').read()).hexdigest())
          print(json.dumps({'routes':r['routes'],'scales':r['scales'],'gates':r['gates'],'size_summary':r['size_summary'],'mechanism_summary':r['mechanism_summary']},indent=2,sort_keys=True))
          PY
      - name: Preserve truth provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/truth/execution_commit.txt
          python --version > output/truth/python_version.txt
          python -m pip freeze > output/truth/environment.txt
          sha256sum orbittrace_parent_anchored_dcr_v1/PROTOCOL.md orbittrace_parent_anchored_dcr_v1/build_pretruth.py orbittrace_parent_anchored_dcr_v1/evaluate_gmn.py frozen-bwm/orbittrace_bif_witness_modularity_v1/evaluate_gmn.py input/pretruth/PARENT_ANCHORED_DCR_V1_PRETRUTH.json input/fairness/GMN_INTERNAL_MASS_SPARSE_LITERATURE_FAIRNESS_V1_PRETRUTH.json output/truth/PARENT_ANCHORED_DCR_V1_GMN_RESULT.json > output/truth/provenance_sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-parent-anchored-dcr-v1-gmn-result
          path: output/truth
          if-no-files-found: error
          retention-days: 90
