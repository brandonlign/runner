name: OrbitTrace support-cut bifiltration internal mass GMN v1

on:
  push:
    branches: [agent/orbittrace-support-cut-bifiltration-internal-mass-gmn-v1]
    paths: ['.github/workflows/orbittrace_support_cut_bifiltration_internal_mass_gmn_v1.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt

      - name: Install exact runtime and verify truth freeze
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/v3 input/v8 input/ranker input/prelabel output
          test "$(git hash-object orbittrace_support_cut_bifiltration_internal_mass_gmn_v1/PROTOCOL.md)" = '908de6088683f31771cb2f91b60fabaf306f4a89'
          test "$(git hash-object orbittrace_support_cut_bifiltration_internal_mass_gmn_v1/evaluate.py)" = 'ce7bdc3bd0aa644f511e95de03bc2a5f545d7cfc'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          python -m py_compile orbittrace_support_cut_bifiltration_internal_mass_gmn_v1/evaluate.py

          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-support-cut-bifiltration-internal-mass-v1
          path: input/prelabel
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32041661731

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558

      - name: Verify immutable pretruth inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/prelabel/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json | cut -d' ' -f1)" = '7b1ddfcd32cd0b52321e3b3dfc614a88dd9b973f947c1d4d0de74fddf26b59cd'
          test "$(sha256sum input/prelabel/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_STRUCTURAL.json | cut -d' ' -f1)" != ''
          python - <<'PY'
          import json
          r=json.load(open('input/prelabel/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_STRUCTURAL.json'))
          assert r['verdict']=='PASS_SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_STRUCTURAL'
          assert r['prelabel_sha256']=='7b1ddfcd32cd0b52321e3b3dfc614a88dd9b973f947c1d4d0de74fddf26b59cd'
          assert all(r['gates'].values())
          assert r['shower_truth_used'] is False
          PY
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'

      - name: Evaluate sealed internal-mass catalogue against GMN development truth
        env:
          PYTHONPATH: input/ranker:.:orbittrace_recurrent_eom_hdbscan_v1:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_support_cut_bifiltration_internal_mass_gmn_v1/evaluate.py \
            --prelabel input/prelabel/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json \
            --parent-runner orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            --quality-source input/ranker/run_urc_union_ranker.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --output output

      - name: Enforce binding verdict and firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_GMN.json'))
          assert r['scientific_role']=='TARGET_EXCLUDED_GMN_2022_2023_SPARSE_RECOVERY_DEVELOPMENT'
          assert r['verdict'] in {'PASS_SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_GMN','FAIL_SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_GMN'}
          assert r['prelabel_sha256']=='7b1ddfcd32cd0b52321e3b3dfc614a88dd9b973f947c1d4d0de74fddf26b59cd'
          assert len(r['panels'])==16 and len(r['gates'])==10
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['sonotaco_2013_2014_access'] is False
          assert r['amos_scientific_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          assert r['post_result_parameter_search'] is False
          print(r['verdict'])
          print(json.dumps({'scales':r['scale_aggregates'],'gates':r['gates']},indent=2,sort_keys=True))
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          sha256sum orbittrace_support_cut_bifiltration_internal_mass_gmn_v1/PROTOCOL.md orbittrace_support_cut_bifiltration_internal_mass_gmn_v1/evaluate.py input/prelabel/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_PRELABEL.json output/SUPPORT_CUT_BIFILTRATION_INTERNAL_MASS_V1_GMN.json > output/provenance_sha256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-support-cut-bifiltration-internal-mass-gmn-v1
          path: output
          if-no-files-found: error
          retention-days: 90
