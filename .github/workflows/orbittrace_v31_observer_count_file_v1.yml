name: OrbitTrace v31 observer-count file availability
on: [push, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - name: Execute frozen truth-free availability audit
        run: |
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
          mkdir -p output
          python -u orbittrace_v31_observer_count_file_v1/audit.py --p19-prelabel-json input/p19/p19_prelabel_payload.json --output output
      - name: Enforce no-science boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('output/GMN_V31_OBSERVER_COUNT_FILE_AVAILABILITY_RESULT.json'))
          assert r['verdict'] in {'PASS_GMN_V31_OBSERVER_COUNT_FILE_AVAILABILITY_V1','FAIL_GMN_V31_OBSERVER_COUNT_FILE_AVAILABILITY_V1'}
          assert r['family_count']==226 and r['unique_member_count']==8794 and r['minimum_complete_fraction']==0.95
          assert r['per_event_counts_emitted'] is False and r['shower_truth_accessed'] is False and r['scientific_ranking_computed'] is False
          assert r['sonotaco_scientific_access'] is False and r['target_information_access'] is False and r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          print('OBSERVER_COUNT_FILE_BINDING',r['verdict'],r['year_stats'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-observer-count-file-v1
          path: output
          if-no-files-found: error
          retention-days: 90
