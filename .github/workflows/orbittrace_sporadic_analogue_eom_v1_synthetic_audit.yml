name: OrbitTrace sporadic-analogue EOM v1 synthetic audit

on:
  push:
    branches:
      - agent/orbittrace-sporadic-analogue-eom-v1
    paths:
      - 'orbittrace_sporadic_analogue_eom_v1/AUDIT_ACTIVATE.md'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  synthetic-zero-data:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-sporadic-analogue-eom-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact numerical runtime and verify frozen sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'
          test "$(git hash-object orbittrace_sporadic_analogue_eom_v1/PROTOCOL.md)" = '0087c417e36b77c93daf869921219c7487f770ac'
          test "$(git hash-object orbittrace_sporadic_analogue_eom_v1/sporadic_analogue_eom.py)" = 'd5e4e3192b5566c545ec4c14a2728a01d974011c'
          test "$(git hash-object orbittrace_sporadic_analogue_eom_v1/audit_synthetic.py)" = '81e8368b747e480ec55243aa5310b71e73e97ff4'
          test "$(git hash-object orbittrace_sporadic_analogue_eom_v1/run_development.py)" = '4fc3f4eb7c5c85951e49d813be4f598ef137667d'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          python -m py_compile \
            orbittrace_sporadic_analogue_eom_v1/*.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py

      - name: Run zero-data synthetic audit
        env:
          PYTHONPATH: orbittrace_sporadic_analogue_eom_v1:orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:.
        run: |
          set -euo pipefail
          rm -rf output
          python -u orbittrace_sporadic_analogue_eom_v1/audit_synthetic.py | tee audit.log
          grep -q PASS_SPORADIC_ANALOGUE_EOM_V1_SYNTHETIC_AUDIT audit.log

      - name: Enforce zero-data firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/SPORADIC_ANALOGUE_EOM_V1_SYNTHETIC_AUDIT.json'))
          assert r['verdict']=='PASS_SPORADIC_ANALOGUE_EOM_V1_SYNTHETIC_AUDIT'
          for k in ['scientific_data_access','gmn_access','sonotaco_access','asfn_access','efn_access','amos_access','maarsy_scientific_access','dms_scientific_access','target_information_access','target_region_events_accessed']:
              assert r[k] is False, (k,r[k])
          print('PASS_SPORADIC_ANALOGUE_ZERO_DATA_FIREWALL')
          PY

      - name: Preserve provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum \
            orbittrace_sporadic_analogue_eom_v1/PROTOCOL.md \
            orbittrace_sporadic_analogue_eom_v1/sporadic_analogue_eom.py \
            orbittrace_sporadic_analogue_eom_v1/audit_synthetic.py \
            orbittrace_sporadic_analogue_eom_v1/run_development.py \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            output/SPORADIC_ANALOGUE_EOM_V1_SYNTHETIC_AUDIT.json \
            > output/provenance_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-sporadic-analogue-eom-v1-synthetic-audit
          path: output
          if-no-files-found: error
          retention-days: 90
