name: OrbitTrace local-trunk literature fairness source audit

on:
  push:
    branches:
      - agent/orbittrace-local-trunk-gmn-literature-fairness-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_local_trunk_gmn_literature_fairness_v1/PROTOCOL.md)" = '140fda762054279c9cc49107a29a26a53262b07a'
          test "$(git hash-object orbittrace_local_trunk_gmn_literature_fairness_v1/evaluate_fairness.py)" = 'bb6a18de51796f33a00fe7c53f3e93f8658757b0'
          test "$(git hash-object .github/workflows/orbittrace_local_trunk_gmn_literature_fairness_exec_v1.yml)" = '4afa544de68aaf9b128202280793f5a0608e4a6a'
          python -m py_compile orbittrace_local_trunk_gmn_literature_fairness_v1/evaluate_fairness.py
      - name: Verify dormant firewall declaration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('orbittrace_local_trunk_gmn_literature_fairness_v1/FREEZE.json').read_text())
          assert p['scientific_status'] == 'DORMANT_PRE_OUTCOME'
          assert p['activation_condition'] == 'PASS_RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1'
          assert p['pairwise_gate_count'] == 4
          assert p['comparators'] == ['sugar2017', 'hdbscan2025']
          for key in (
              'target_information_access', 'target_region_events_accessed',
              'sonotaco_scientific_access', 'amos_scientific_access',
              'asfn_efn_event_access', 'maarsy_scientific_access',
              'dms_scientific_access', 'post_result_parameter_search'):
              assert p[key] is False, key
          print('PASS_LOCAL_TRUNK_LITERATURE_FAIRNESS_SOURCE_AUDIT')
          PY
      - name: Verify execution wrapper remains conditional on binding PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/orbittrace_local_trunk_gmn_literature_fairness_exec_v1.yml').read_text()
          assert 'run-id: 32191925070' in text
          assert 'orbittrace-recurrent-local-topomodal-trunk-v1-prelabel-exact-row' in text
          assert 'orbittrace-recurrent-local-topomodal-trunk-v1-binding-exact-row' in text
          assert "r['verdict']=='PASS_RECURRENT_LOCAL_TOPOMODAL_TRUNK_V1'" in text
          assert "r['passed_gate_count']==r['total_gate_count']==16" in text
          assert 'PASS_LOCAL_TRUNK_GMN_MATCHED_CAPACITY_LITERATURE_4_OF_4' in text
          assert 'NO_LOCAL_TRUNK_GMN_MATCHED_CAPACITY_4_OF_4_SUPERIORITY' in text
          print('PASS_LOCAL_TRUNK_LITERATURE_EXECUTION_WRAPPER_AUDIT')
          PY
