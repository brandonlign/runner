name: OrbitTrace fixed4 cross-year linkage v3

on:
  pull_request:
    branches:
      - agent/orbittrace-fixed4-wrapper-development-v2
    paths:
      - orbittrace_fixed4_linkage_v3/**
      - .github/workflows/orbittrace_fixed4_linkage_v3.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-fixed4-cross-year-linkage-v3
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_SHA256: '6eacd65dd4eb094288a05ab542666667e7d392646307d6cd6e72a9035706f20f'
      SOURCE_BYTES: '42749'
      ENCODED_LENGTH: '14956'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-fixed4-family-linkage-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Reconstruct and audit target-blinded linkage source
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import ast, base64, gzip, hashlib, os
          from pathlib import Path

          parts = sorted(Path('orbittrace_fixed4_linkage_v3/source_parts').glob('part*.b64'))
          expected = [f'part{i:02d}.b64' for i in range(4)]
          if [part.name for part in parts] != expected:
              raise RuntimeError(f'wrong source parts: {[part.name for part in parts]}')
          encoded = ''.join(''.join(part.read_text(encoding='ascii').split()) for part in parts)
          if len(encoded) != int(os.environ['ENCODED_LENGTH']):
              raise RuntimeError(f'encoded length mismatch: {len(encoded)}')
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          if len(source) != int(os.environ['SOURCE_BYTES']):
              raise RuntimeError(f'source byte mismatch: {len(source)}')
          digest = hashlib.sha256(source).hexdigest()
          if digest != os.environ['SOURCE_SHA256']:
              raise RuntimeError(f'source SHA mismatch: {digest}')
          text = source.decode('utf-8')
          forbidden = [
              'F0059', '8958194010', '8957230278', '8814798136',
              '20220425100930_QG7RH', '247.17', '-14.34', '37.62',
              'PARTIAL_BLIND_ORBITTRACE_RECOVERY', 'GhostStream_Expert_Review_Bundle'
          ]
          found = [value for value in forbidden if value in text]
          if found:
              raise RuntimeError(f'OrbitTrace information present: {found}')
          required_literals = [
              'BLIND_LOW = 20.0', 'BLIND_HIGH = 55.0',
              'LINKAGE_VARIANTS', 'single_link', 'mutual_nearest', 'seed_complete',
              'linkage_blind_families.json.gz',
              'PASS_CROSS_YEAR_LINKAGE_DEVELOPMENT',
              'FAIL_CROSS_YEAR_LINKAGE_DEVELOPMENT'
          ]
          missing = [value for value in required_literals if value not in text]
          if missing:
              raise RuntimeError(f'missing frozen literals: {missing}')
          tree = ast.parse(text)
          names = {node.name for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.ClassDef))}
          required_names = {
              'parse_catalogue', 'scan_year', 'component_records', 'build_distance_context',
              'build_single_link', 'build_mutual_nearest', 'build_seed_complete',
              'build_linkage_variants', 'label_profiles', 'exact_anchor_distances'
          }
          if not required_names.issubset(names):
              raise RuntimeError(f'missing interfaces: {sorted(required_names - names)}')
          Path('/tmp/run_fixed4_linkage_v3.py').write_bytes(source)
          print('source bytes:', len(source))
          print('source SHA-256:', digest)
          PY
          python -m py_compile /tmp/run_fixed4_linkage_v3.py
      - name: Run target-blinded linkage development
        run: |
          set -euo pipefail
          python /tmp/run_fixed4_linkage_v3.py \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --output output
          cat output/ORBITTRACE_FIXED4_LINKAGE_DEVELOPMENT.md
      - name: Enforce declared verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/orbittrace_fixed4_linkage_development.json').read_text())
          allowed = {'PASS_CROSS_YEAR_LINKAGE_DEVELOPMENT', 'FAIL_CROSS_YEAR_LINKAGE_DEVELOPMENT'}
          if result.get('verdict') not in allowed:
              raise SystemExit(f"invalid verdict: {result.get('verdict')}")
          if not result.get('blind_family_payload_sha256'):
              raise SystemExit('missing pre-label family payload hash')
          print(json.dumps({
              'verdict': result['verdict'],
              'selected_variant': result['development']['selected_variant'],
              'family_counts': result['family_counts'],
              'blind_family_payload_sha256': result['blind_family_payload_sha256'],
          }, indent=2))
          PY
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            orbittrace_fixed4_linkage_v3/PROTOCOL.md \
            orbittrace_fixed4_linkage_v3/source_parts/part00.b64 \
            orbittrace_fixed4_linkage_v3/source_parts/part01.b64 \
            orbittrace_fixed4_linkage_v3/source_parts/part02.b64 \
            orbittrace_fixed4_linkage_v3/source_parts/part03.b64 \
            sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            > output/source_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - name: Upload linkage-development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-fixed4-cross-year-linkage-v3
          path: output
          if-no-files-found: error
          retention-days: 90
