name: OrbitTrace wavelet catalogue v3 development

on:
  pull_request:
    branches:
      - agent/orbittrace-fixed4-support-normalized-wrapper-development
    paths:
      - orbittrace_wavelet_catalogue_v3/**
      - .github/workflows/orbittrace_wavelet_catalogue_v3_development.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-wavelet-catalogue-v3-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: orbittrace_wavelet_catalogue_v3
      DEVELOPMENT_SOURCE_SHA256: b3dd3ab96ac18113eff32e3403e0080d9f7b287708e61dde0dbf2bebdb664c4b
      DEVELOPMENT_SOURCE_BYTES: '33069'
      DEVELOPMENT_ENCODED_LENGTH: '11132'
      SUPPORT_SOURCE_SHA256: fa18a19c08c6824c66606cbd92095dc3605cbcc30f17a468c9e525e7c6ff4a62
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-wavelet-catalogue-v3-development

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct and audit target-free development source
        run: |
          set -euo pipefail
          mkdir -p input/fixed4 output
          test "$(git hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = "493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8"
          test "$(git hash-object orbittrace_wavelet_catalogue_v3/PROTOCOL.md)" = "43b1f3670934426d52c60d7270f8fd753fc6ed2a"
          python - <<'PY'
          import ast
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          def decode_parts(root: str, count: int) -> tuple[str, bytes]:
              paths = sorted(Path(root).glob('part*.b64'))
              expected = [f'part{i:02d}.b64' for i in range(count)]
              if [path.name for path in paths] != expected:
                  raise RuntimeError(f'wrong source parts under {root}: {[path.name for path in paths]}')
              encoded = ''.join(''.join(path.read_text(encoding='ascii').split()) for path in paths)
              return encoded, gzip.decompress(base64.b64decode(encoded, validate=True))

          encoded, source = decode_parts('orbittrace_wavelet_catalogue_v3/source_parts', 4)
          if len(encoded) != int(os.environ['DEVELOPMENT_ENCODED_LENGTH']):
              raise RuntimeError(f'encoded length mismatch: {len(encoded)}')
          if len(source) != int(os.environ['DEVELOPMENT_SOURCE_BYTES']):
              raise RuntimeError(f'source byte mismatch: {len(source)}')
          digest = hashlib.sha256(source).hexdigest()
          if digest != os.environ['DEVELOPMENT_SOURCE_SHA256']:
              raise RuntimeError(f'development source mismatch: {digest}')

          _, support_source = decode_parts('orbittrace_fixed4_support_wrapper_development/source_parts', 4)
          support_digest = hashlib.sha256(support_source).hexdigest()
          if support_digest != os.environ['SUPPORT_SOURCE_SHA256']:
              raise RuntimeError(f'support source mismatch: {support_digest}')

          text = source.decode('utf-8')
          support_text = support_source.decode('utf-8')
          protocol = Path('orbittrace_wavelet_catalogue_v3/PROTOCOL.md').read_text()
          wavelet_text = Path('orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py').read_text()

          forbidden = [
              '247.17', '-14.34', '37.62', 'F0059', '8958194010', '8814798136',
              'april_candidate_members.csv', 'GhostStream_Expert_Review_Bundle',
          ]
          found = [value for value in forbidden if value in text or value in protocol or value in wavelet_text]
          if found:
              raise RuntimeError(f'target information present: {found}')

          tree = ast.parse(text)
          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required_functions = {
              'load_support_module', 'calibrate_year', 'scan_year', 'exact_rescore',
              'component_records', 'build_families', 'evaluate_families', 'main',
          }
          if not required_functions.issubset(functions):
              raise RuntimeError(f'missing functions: {sorted(required_functions - functions.keys())}')

          scan_args = [arg.arg for arg in functions['scan_year'].args.args]
          component_args = [arg.arg for arg in functions['component_records'].args.args]
          family_args = [arg.arg for arg in functions['build_families'].args.args]
          if 'hidden_labels' in scan_args + component_args + family_args:
              raise RuntimeError('labels enter candidate generation')
          if [arg.arg for arg in functions['evaluate_families'].args.args][0] != 'hidden_labels':
              raise RuntimeError('label lookup is not isolated to final evaluation')

          required_literals = [
              'YEARS = (2022, 2023)',
              'WINDOW_WIDTH_DEG = 10.0',
              'WINDOW_STEP_DEG = 5.0',
              'PREFILTER_K = 32',
              'SHORTLIST_K = 256',
              'EPISODE_SIZE = 128',
              'POSITIVE_LOBE_R2 = 3.0',
              'CALIBRATION_PER_BIN = 128',
              'FAMILY_LINK_RADIUS = 1.5',
              'BASE_ALPHA = 0.05',
              'RESCUE_ALPHA = 1.0 / 129.0',
              'PASS_WAVELET_CATALOGUE_V3_DEVELOPMENT',
              'FAIL_WAVELET_CATALOGUE_V3_DEVELOPMENT',
          ]
          absent = [value for value in required_literals if value not in text]
          if absent:
              raise RuntimeError(f'missing frozen literals: {absent}')
          if '2024-' in text or '2025-' in text or '2026-' in text:
              raise RuntimeError('held-out catalogue month key present in development source')

          parse_block = support_text[
              support_text.index('def parse_catalogue'):
              support_text.index('def circular_mean_deg')
          ]
          if parse_block.index('between(BLIND_LOW, BLIND_HIGH') >= parse_block.index('map(normalize_label)'):
              raise RuntimeError('blind interval is not removed before label normalization')
          if 'scan_year(' not in text or 'hidden_labels, families' not in text:
              raise RuntimeError('candidate/evaluation interface missing')
          if 'fixed4_metrics = baseline["development"]["panel_evaluations"]["development"]' not in text:
              raise RuntimeError('wrong fixed4 comparison panel')

          wavelet_tree = ast.parse(wavelet_text)
          wavelet_constants = {}
          for node in wavelet_tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  try:
                      wavelet_constants[node.targets[0].id] = ast.literal_eval(node.value)
                  except Exception:
                      pass
          expected_wavelet = {
              'ANGULAR_PROBE_DEG': 4.0,
              'SPEED_PROBE_FRACTION': 0.10,
              'TRUNCATION_RADIUS': 4.0,
              'KERNEL_DIMENSION': 3.0,
          }
          if {key: wavelet_constants.get(key) for key in expected_wavelet} != expected_wavelet:
              raise RuntimeError('wavelet parameters changed')

          Path('/tmp/run_wavelet_catalogue_v3_development.py').write_bytes(source)
          Path('output/development_source_sha256.txt').write_text(digest + '\n')
          Path('output/run_wavelet_catalogue_v3_development.py').write_bytes(source)
          print('PASS_WAVELET_CATALOGUE_V3_SOURCE_GUARD', digest, support_digest)
          PY
          python -m py_compile \
            /tmp/run_wavelet_catalogue_v3_development.py \
            orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'orbittrace_wavelet_catalogue_v3')
          import wavelet_episode_comparator as wavelet
          checks = wavelet.self_test()
          print(checks)
          if not all(checks.values()):
              raise SystemExit('wavelet self-test failed')
          PY

      - name: Retrieve exact frozen fixed4 development baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 31106001133 \
            --repo "$GITHUB_REPOSITORY" \
            --name orbittrace-fixed4-support-normalized-wrapper-development \
            --dir input/fixed4
          echo '01a7158ee5cf79e212689b3eb24438bbf98f959dc3588141f073412b1a9c5999  /tmp/fixed4_artifact_digest_record' > /dev/null
          test -f input/fixed4/orbittrace_fixed4_support_wrapper_development.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('input/fixed4/orbittrace_fixed4_support_wrapper_development.json').read_text())
          assert result['verdict'] == 'FAIL_SUPPORT_NORMALIZED_WRAPPER_DEVELOPMENT'
          baseline = result['development']['panel_evaluations']['development']['metrics']['persistence']
          assert baseline['recovered_at_100'] == 61
          assert baseline['qualified_matches'] == 90
          assert abs(baseline['top100_dominant_precision'] - 0.6809376504699393) < 1e-15
          print('PASS_FIXED4_DEVELOPMENT_BASELINE_GUARD')
          PY

      - name: Run target-excluded wavelet catalogue development
        run: |
          set -euo pipefail
          python /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --fixed4-baseline-json input/fixed4/orbittrace_fixed4_support_wrapper_development.json \
            --output output
          cat output/WAVELET_CATALOGUE_V3_DEVELOPMENT.md

      - name: Enforce development result integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/wavelet_catalogue_v3_development.json').read_text())
          allowed = {
              'PASS_WAVELET_CATALOGUE_V3_DEVELOPMENT',
              'FAIL_WAVELET_CATALOGUE_V3_DEVELOPMENT',
          }
          if result.get('verdict') not in allowed:
              raise SystemExit(f"invalid verdict: {result.get('verdict')}")
          config = result['configuration']
          if config['years'] != [2022, 2023]:
              raise SystemExit('development years changed')
          if config['blind_exclusion'] != [20.0, 55.0]:
              raise SystemExit('blind exclusion changed')
          if config['rescue_alpha'] != 1.0 / 129.0:
              raise SystemExit('rescue threshold changed')
          if config['rescue_queue'] != 'fixed4 p <= 1/129; never inserted into wavelet ranking':
              raise SystemExit('fixed4 changed wavelet ranking')
          print(json.dumps({
              'verdict': result['verdict'],
              'evaluation': {key: value for key, value in result['evaluation'].items() if key != 'per_label'},
              'fixed4_baseline': result['fixed4_development_baseline'],
              'gates': result['gates'],
          }, indent=2))
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            orbittrace_wavelet_catalogue_v3/PROTOCOL.md \
            orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py \
            orbittrace_wavelet_catalogue_v3/source_parts/part00.b64 \
            orbittrace_wavelet_catalogue_v3/source_parts/part01.b64 \
            orbittrace_wavelet_catalogue_v3/source_parts/part02.b64 \
            orbittrace_wavelet_catalogue_v3/source_parts/part03.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part00.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part01.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part02.b64 \
            orbittrace_fixed4_support_wrapper_development/source_parts/part03.b64 \
            sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            input/fixed4/orbittrace_fixed4_support_wrapper_development.json \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-wavelet-catalogue-v3-development
          path: output
          if-no-files-found: error
          retention-days: 90
