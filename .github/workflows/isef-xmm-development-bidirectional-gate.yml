name: ISEF XMM development bidirectional gate
on:
  push:
    paths:
      - 'isef/xmm_development_bidirectional_gate.py'
      - '.github/workflows/isef-xmm-development-bidirectional-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'scipy>=1.16' 'astropy>=7.1,<8'
      - run: timeout 1200s python isef/xmm_development_bidirectional_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-xmm-development-bidirectional-gate
          path: results/xmm_development_bidirectional_gate.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY' >/tmp/r.md
          import json
          from pathlib import Path
          print('## XMM development bidirectional gate')
          p=Path('results/xmm_development_bidirectional_gate.json')
          if p.exists(): print('```json\n'+json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)[:50000]+'\n```')
          PY
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
