name: ISEF MATLAS Oyashio Gaussian profile significance
on:
  push:
    branches: [main]
    paths: ['isef/MATLAS_OYASHIO_GAUSSIAN_PROFILE_TRIGGER']
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy astropy astroquery scikit-image requests
      - run: |
          python -m py_compile isef/matlas_oyashio_blind_detector_pilot.py isef/matlas_oyashio_gaussian_profile_significance.py
          cd isef
          python matlas_oyashio_gaussian_profile_significance.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-matlas-oyashio-gaussian-profile-significance
          path: isef/results/matlas_oyashio_gaussian_profile_significance/report.json
          if-no-files-found: error
