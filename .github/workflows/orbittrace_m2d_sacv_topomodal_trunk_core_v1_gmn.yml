name: OrbitTrace M2D SACV TopoModal trunk core v1 GMN development

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [agent/orbittrace-m2d-sacv-dual-output-core-v1]
    paths:
      - 'orbittrace_m2d_sacv_topomodal_trunk_core_v1/ACTIVATE_GMN.md'

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: orbittrace-m2d-sacv-topomodal-trunk-core-v1-gmn-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and verify exact frozen executable
        run: |
          set -euo pipefail
          grep -Fx 'BINDING_GMN_ACTIVATION_V1' orbittrace_m2d_sacv_topomodal_trunk_core_v1/ACTIVATE_GMN.md
          echo 'd75b76a36911c916620da5e029f82c7987718b1610eb6bd61922015b5ab50d4a  orbittrace_m2d_sacv_v1_source.tgz' | sha256sum -c -
          tar -xzf orbittrace_m2d_sacv_v1_source.tgz
          cat orbittrace_m2d_sacv_edge_consensus_v1/source_parts/part*.b64 > /tmp/ec.b64
          test "$(wc -c < /tmp/ec.b64)" = '16844'
          base64 -d /tmp/ec.b64 > /tmp/ec.tgz
          echo 'f7d9fc168fb5f8a589a5d965252979951ae9659ded4dc6662a562276c6273d28  /tmp/ec.tgz' | sha256sum -c -
          tar -xzf /tmp/ec.tgz
          echo 'f6c5b2a89d70003b058e772b753c531cb5072b2c1eb52d77166d7a5cbd566ca7  orbittrace_m2d_sacv_fallback_recurrence_v1/patch_source.py' | sha256sum -c -
          python orbittrace_m2d_sacv_fallback_recurrence_v1/patch_source.py >/dev/null
          cp orbittrace_m2d_sacv_edge_consensus_v1/build_pretruth.py orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py
          cp orbittrace_m2d_sacv_edge_consensus_v1/evaluate_truth.py orbittrace_m2d_sacv_fallback_recurrence_v1/evaluate_truth.py
          cp orbittrace_m2d_sacv_edge_consensus_v1/run_binding.sh orbittrace_m2d_sacv_fallback_recurrence_v1/run_binding.sh

          echo '474a9b082376365834c1d59020f0e6b35e4e2dcdb455a82e535a093a3b562cd1  orbittrace_m2d_sacv_topomodal_trunk_core_v1/PROTOCOL.md' | sha256sum -c -
          echo 'e00cab798ba3a0224afedf81dedd191bb55bc35398c3d10f1b36237421636213  orbittrace_m2d_sacv_topomodal_trunk_core_v1/instrument_runtime.py' | sha256sum -c -
          echo 'eaa146b1b04f2a30bbe86ffc4393a9b2e10580f7ed09ef7a22dd1dc8f280069c  orbittrace_m2d_sacv_topomodal_trunk_core_v1/build_pretruth.py' | sha256sum -c -
          echo '050c6a7aa4acdb868f73667a427fdc5f9e2e3f3a7c9e15e0f1b5ee03c2368a87  orbittrace_m2d_sacv_topomodal_trunk_core_v1/evaluate_truth.py' | sha256sum -c -
          echo '9ef6b20bda4acb27a317ef440db25fbd8c2137d01d5847ef6d80cd931985079d  orbittrace_m2d_sacv_topomodal_trunk_core_v1/make_runner.py' | sha256sum -c -

          echo 'ac7960c944b881b02e47572e767e97eaafde1074831446be3a410f9a87e0ae0a  orbittrace_m2d_sacv_dual_output_core_v1/make_runner.py' | sha256sum -c -
          python orbittrace_m2d_sacv_dual_output_core_v1/make_runner.py
          echo '9e0d533ddfd89bfa9a53fbbedafcb11a62bf4e33e69d7c31a9500633f8c5d8c0  orbittrace_m2d_sacv_dual_output_core_v1/run_binding.generated.sh' | sha256sum -c -

          python orbittrace_m2d_sacv_topomodal_trunk_core_v1/instrument_runtime.py
          echo '7beb50b31dd0e4b440bf5b62e5da14a9e92e82497b2576d8006dcb934453ceaa  orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py' | sha256sum -c -
          python orbittrace_m2d_sacv_topomodal_trunk_core_v1/make_runner.py
          echo '07f96390a0a02cf8fc7d0976823cb7aed37d0530004ad9e59705249c648fa60f  orbittrace_m2d_sacv_topomodal_trunk_core_v1/run_binding.generated.sh' | sha256sum -c -
          python -m py_compile orbittrace_m2d_sacv_fallback_recurrence_v1/build_pretruth.py orbittrace_m2d_sacv_topomodal_trunk_core_v1/build_pretruth.py orbittrace_m2d_sacv_topomodal_trunk_core_v1/evaluate_truth.py
          bash -n orbittrace_m2d_sacv_topomodal_trunk_core_v1/run_binding.generated.sh
          echo PASS_FROZEN_TOPOMODAL_TRUNK_CORE_EXECUTABLE
      - name: Install frozen TopoModal dependency
        run: |
          set -euo pipefail
          python -m pip install 'gudhi==3.12.0'
          python - <<'PY'
          import gudhi
          assert gudhi.__version__ == '3.12.0', gudhi.__version__
          print('GUDHI_VERSION', gudhi.__version__)
          PY
      - name: Execute one-shot target-excluded GMN binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash orbittrace_m2d_sacv_topomodal_trunk_core_v1/run_binding.generated.sh | tee /tmp/topomodal-binding.log
      - name: Publish binding result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          P=output/m2d-sacv-topomodal-trunk-core-v1-gmn/truth/M2D_SACV_TOPOMODAL_TRUNK_CORE_V1_GMN_RESULT.json
          PRE=output/m2d-sacv-topomodal-trunk-core-v1-gmn/pretruth/M2D_SACV_TOPOMODAL_TRUNK_CORE_V1_GMN_PRETRUTH.json
          if [ -f "$P" ]; then
            python - <<'PY' > /tmp/result.md
          import hashlib,json
          from pathlib import Path
          p=Path('output/m2d-sacv-topomodal-trunk-core-v1-gmn/truth/M2D_SACV_TOPOMODAL_TRUNK_CORE_V1_GMN_RESULT.json')
          pre=Path('output/m2d-sacv-topomodal-trunk-core-v1-gmn/pretruth/M2D_SACV_TOPOMODAL_TRUNK_CORE_V1_GMN_PRETRUTH.json')
          r=json.loads(p.read_text()); q=json.loads(pre.read_text())
          print('## M2D SACV TopoModal trunk core v1 — binding target-excluded GMN development')
          print();print(f"Verdict: **`{r['verdict']}`**")
          print(f"- result SHA-256: `{hashlib.sha256(p.read_bytes()).hexdigest()}`")
          print(f"- pretruth SHA-256: `{hashlib.sha256(pre.read_bytes()).hexdigest()}`")
          print(f"- primary exact-ID equality: `{r['primary_oracle_exact_id_equal_occurrences']}/328`")
          print(f"- recurrence fallbacks: `{q['summary']['recurrence_fallback_occurrences']}`; reportable TopoModal cores: `{q['summary']['topomodal_trunk_core_occurrences']}`; no-reportable-trunk: `{q['summary']['topomodal_no_reportable_trunk_occurrences']}`")
          for comp in ('sugar2017','hdbscan2025'):
              a=r['aggregates'][comp]; pri=a['primary_same_discovery']; c=a['nested_core']; cs=c['paired_same_discovery']
              print(f"- {comp} primary: precision `{pri['extraction_mean_precision']:.6f}`, F1 `{pri['extraction_mean_f1']:.6f}`; core paired n `{cs['count']}`; core status `{c['status']}`; primary/core precision `{cs['parent_mean_precision']:.6f} / {cs['extraction_mean_precision']:.6f}`; primary/core F1 `{cs['parent_mean_f1']:.6f} / {cs['extraction_mean_f1']:.6f}`")
          print('- OrbitTrace target information accessed: `false`')
          print('- SonotaCo scientific access: `false`')
          PY
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "TopoModal trunk core v1 ended before a valid scientific result. Treat as technical no-result only; frozen science remains unchanged."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-m2d-sacv-topomodal-trunk-core-v1-gmn-development
          path: output/m2d-sacv-topomodal-trunk-core-v1-gmn
          if-no-files-found: warn
          retention-days: 90
