name: Mog reference-face validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mog_reference_face_validation.yml
      - mog_reference_face_validation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mog-reference-face-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mog_reference_face_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mog-reference-face-validation

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install validation dependencies
        run: npm install --no-audit --no-fund

      - name: Assemble exact Mog renderer mirror
        run: npm run assemble

      - name: Verify exact source identity and renderer invariants
        run: npm test

      - name: Typecheck isolated Next app
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render all four views
        run: npm run test:e2e

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mog-reference-face-renderings
          path: mog_reference_face_validation/artifacts
          if-no-files-found: warn
          retention-days: 30
