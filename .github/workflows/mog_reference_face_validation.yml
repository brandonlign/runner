name: Mog reference-face validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mog_reference_face_validation.yml
      - mog_reference_face_validation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mog-reference-face-finalize
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mog_reference_face_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mog-reference-face-finalize

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Extract and render Apache-2.0 GNM reference assets
        run: |
          python -m pip install --disable-pip-version-check numpy matplotlib pillow
          python scripts/extract_gnm_head.py
          python scripts/render_gnm_reference_assets.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install validation dependencies
        run: npm install --no-audit --no-fund

      - name: Assemble exact private-branch renderer mirror
        run: npm run assemble

      - name: Verify geometry and rendering invariants
        run: npm test

      - name: Typecheck isolated Next app
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render all four views
        run: npm run test:e2e

      - name: Upload visual evidence and licensed assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mog-reference-face-final-evidence
          path: |
            mog_reference_face_validation/artifacts
            mog_reference_face_validation/generated/gnm_reference_front.webp
            mog_reference_face_validation/generated/gnm_reference_profile.webp
            mog_reference_face_validation/generated/gnm_reference_assets.json
            mog_reference_face_validation/generated/gnm_head_skin_report.json
          if-no-files-found: warn
          retention-days: 30
