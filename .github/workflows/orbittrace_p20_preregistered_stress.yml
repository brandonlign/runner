name: OrbitTrace P20 preregistered thinning stress

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - orbittrace_p20_recurrent_isolated_quartet/STRESS_RUN.md

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: orbittrace-p20-preregistered-thinning-stress
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  stress:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          path: execution
      - name: Require one-file stress activation from exact frozen P20 base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd execution
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'orbittrace_p20_recurrent_isolated_quartet/STRESS_RUN.md'
          test "$(git show "$HEAD_SHA":orbittrace_p20_recurrent_isolated_quartet/STRESS_RUN.md)" = 'RUN_FROZEN_P20_PREREGISTERED_THINNING_STRESS'
          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_p20_recurrent_isolated_quartet/STRESS_RUN.md
          test "$(git hash-object orbittrace_p20_recurrent_isolated_quartet/run_development.py)" = '6c5c8e02ac7a377ca8253f1e1fc0ad6e60e5e69f'
          test "$(git hash-object orbittrace_p20_recurrent_isolated_quartet/run_stress.py)" = '63c15023226595614cc6a11363839911dc5c783a'
          test "$(git hash-object orbittrace_p20_recurrent_isolated_quartet/P20_PROTOCOL.md)" = '94b732a303bd03d74317cf1101a0af5816bc06fd'
          test "$(git hash-object orbittrace_p20_recurrent_isolated_quartet/P20_STRESS_PROTOCOL.md)" = '3a18a9aebd179f6e214bd92cd54fec08fa51e56a'
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Restore exact promoted-v8 runtime module
        run: |
          set -euo pipefail
          mkdir -p input/v3
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py)" = '493fcc7f2d2cc75ee35acf17e142e7ce7c1e03e8'
          python -m py_compile input/v3/multi_anchor_energy_v3.py frozen-v8/orbittrace_wavelet_catalogue_v3/wavelet_episode_comparator.py
      - name: Decode exact promoted-v8 catalogue runtime
        run: |
          set -euo pipefail
          test "$(git -C frozen-v8 hash-object orbittrace_wavelet_catalogue_v3/audit_development_source.py)" = '7035daf3e670ab89c66c87035540419f549bab09'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test -f /tmp/run_wavelet_catalogue_v3_development.py
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p20-recurrent-isolated-quartet-development
          path: input/p20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31341591263
      - name: Require exact preregistered P20 primary PASS before stress data access
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('input/p20/p20_recurrent_isolated_quartet_development.json')
          raw=p.read_bytes()
          r=json.loads(raw)
          assert r['verdict']=='PASS_P20_RECURRENT_ISOLATED_QUARTET_DEVELOPMENT'
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['hard_family_count']==226
          assert r['v8_predecessor']['result_sha256']=='fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          assert r['integrity_gates']['no_target_information_access'] is True
          assert all(r['integrity_gates'].values())
          assert all(r['scientific_gates'].values())
          print('P20_PRIMARY_RESULT_SHA256',hashlib.sha256(raw).hexdigest())
          print('PASS_EXACT_PREREGISTERED_P20_PRIMARY')
          PY
      - name: Verify exact stress ancestry before development data access
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(git -C frozen-v8 rev-parse HEAD)" = 'c9d6c44704013ba0c9430100e98a29a56b453304'
          test "$(git -C execution hash-object orbittrace_p20_recurrent_isolated_quartet/run_development.py)" = '6c5c8e02ac7a377ca8253f1e1fc0ad6e60e5e69f'
          test "$(git -C execution hash-object orbittrace_p20_recurrent_isolated_quartet/run_stress.py)" = '63c15023226595614cc6a11363839911dc5c783a'
          test "$(git -C execution hash-object orbittrace_p20_recurrent_isolated_quartet/P20_STRESS_PROTOCOL.md)" = '3a18a9aebd179f6e214bd92cd54fec08fa51e56a'
          test "$(sha256sum /tmp/run_wavelet_catalogue_v3_development.py | cut -d' ' -f1)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          python -m py_compile execution/orbittrace_p20_recurrent_isolated_quartet/run_stress.py /tmp/run_wavelet_catalogue_v3_development.py
          echo PASS_P20_STRESS_EXACT_ANCESTRY_AND_PREREGISTRATION
      - name: Execute exact preregistered P20 thinning stress
        env:
          PYTHONPATH: execution:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          mkdir -p output
          python -u execution/orbittrace_p20_recurrent_isolated_quartet/run_stress.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p20-primary-result-json input/p20/p20_recurrent_isolated_quartet_development.json \
            --output output
          cat output/P20_PREREGISTERED_THINNING_STRESS.md
      - name: Enforce frozen stress result boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/p20_preregistered_thinning_stress.json').read_text())
          assert r['verdict'] in {
            'PASS_P20_PREREGISTERED_THINNING_STRESS',
            'FAIL_P20_PREREGISTERED_THINNING_STRESS',
          }
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert len(r['configuration']['panels'])==4
          assert r['v8_result_sha256']=='fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          assert r['p20_primary_verdict']=='PASS_P20_RECURRENT_ISOLATED_QUARTET_DEVELOPMENT'
          assert r['stress_gates']['no_target_information_access'] is True
          print(r['verdict'])
          PY
      - name: Record provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          printf '%s\n' 'p20_primary_run=31341591263' > output/p20_stress_provenance.txt
          printf '%s\n' 'v8_run=31217916558' >> output/p20_stress_provenance.txt
          printf '%s\n' "stress_base_sha=${{ github.event.pull_request.base.sha }}" >> output/p20_stress_provenance.txt
          if [ -f input/p20/p20_recurrent_isolated_quartet_development.json ]; then
            sha256sum input/p20/p20_recurrent_isolated_quartet_development.json >> output/p20_stress_provenance.txt
          fi
          sha256sum execution/orbittrace_p20_recurrent_isolated_quartet/run_development.py \
            execution/orbittrace_p20_recurrent_isolated_quartet/run_stress.py \
            execution/orbittrace_p20_recurrent_isolated_quartet/P20_STRESS_PROTOCOL.md \
            input/v3/multi_anchor_energy_v3.py \
            /tmp/run_wavelet_catalogue_v3_development.py \
            input/v8/pooled_year_centroid_v8_development.json \
            >> output/p20_stress_provenance.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-p20-preregistered-thinning-stress
          path: output
          if-no-files-found: error
          retention-days: 90
