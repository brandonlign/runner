name: Temporary OrbitTrace release audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-orbittrace-release-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out runner
        uses: actions/checkout@v4

      - name: Check out exact OrbitTrace release candidate
        uses: actions/checkout@v4
        with:
          repository: brandonlign/orbittrace
          ref: 8f4db92126bf6c05a96872eac06adaa8d851f120
          token: ${{ secrets.ISEF_REPO_TOKEN }}
          path: orbittrace
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orbittrace/requirements.txt

      - name: Verify exact source commit
        run: |
          set -euo pipefail
          test "$(git -C orbittrace rev-parse HEAD)" = "8f4db92126bf6c05a96872eac06adaa8d851f120"
          git -C orbittrace rev-parse HEAD

      - name: Install pinned release environment
        working-directory: orbittrace
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile public Python sources
        working-directory: orbittrace
        run: |
          set -euo pipefail
          python -m compileall -q acrf analysis benchmarks figures tests reproduce.py

      - name: Run core regression tests
        working-directory: orbittrace
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee ../orbittrace-tests.log

      - name: Run full release reproduction check
        working-directory: orbittrace
        run: |
          set -euo pipefail
          rm -rf .reproduction
          python reproduce.py --all --out .reproduction 2>&1 | tee ../orbittrace-reproduce.log

      - name: Verify release tree stays clean
        working-directory: orbittrace
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --short)"

      - name: Record environment and source identity
        if: always()
        run: |
          set -euo pipefail
          mkdir -p release-audit
          git -C orbittrace rev-parse HEAD > release-audit/orbittrace_commit.txt
          python --version > release-audit/python_version.txt
          python -m pip freeze > release-audit/environment.txt
          cp orbittrace-tests.log release-audit/ 2>/dev/null || true
          cp orbittrace-reproduce.log release-audit/ 2>/dev/null || true
          if [ -d orbittrace/.reproduction ]; then
            cp -a orbittrace/.reproduction release-audit/reproduction
          fi
          sha256sum orbittrace/requirements.txt orbittrace/CITATION.cff orbittrace/README.md > release-audit/release_files_sha256.txt

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbittrace-release-audit-8f4db921
          path: release-audit
          if-no-files-found: error
          retention-days: 90
