name: OrbitTrace support-cut annual-confirm SonotaCo dev v1 prep relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: orbittrace-supportcut-annual-confirm-sonotaco-dev-v1-prep
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  BENCH_BRANCH: agent/orbittrace-supportcut-annual-confirm-sonotaco-dev-v1

jobs:
  prep:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 1373 &&
      github.event.comment.user.login == 'brandonlign' &&
      github.event.comment.body == 'RUN_ORBITTRACE_SUPPORTCUT_ANNUAL_CONFIRM_SONOTACO_DEV_V1_PREP'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Announce exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1373 --repo "${{ github.repository }}" --body "ORBITTRACE_SUPPORTCUT_ANNUAL_CONFIRM_PREP_STARTED=${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BENCH_BRANCH }}
          fetch-depth: 1

      - name: Bind frozen prep head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1e5ecefd316880ee47005903e0e47efcbfe07a9d'
          test "$(git hash-object orbittrace_supportcut_annual_confirm_sonotaco_dev_v1/PROTOCOL.md)" = 'ee590573564e42622d7c1ad14453d3d02adb4c3f'
          test "$(git hash-object orbittrace_supportcut_annual_confirm_sonotaco_dev_v1/prepare_pretruth.py)" = '62e0d36fa63d9dd4ce60b98899179ff7b4da69e9'
          test "$(git hash-object orbittrace_symmetric_tuned_literature_v2/run_benchmark.py)" = 'd9b2af130580b74ca97e549d474860869e01a502'

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-topomodal-support-resolved-cut-v1
          path: support-method
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: agent/orbittrace-topomodal-hierarchy-scale-v1
          path: structural-method
          fetch-depth: 1

      - name: Verify exact method sources
        run: |
          set -euo pipefail
          test "$(git hash-object support-method/orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py)" = '4988997c023d9df2b504372b4290dcab379a6dcc'
          test "$(git hash-object structural-method/orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py)" = 'c1efa8da34dea140726a4c2fe4943eb29a304538'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43' 'gudhi==3.12.0'
          mkdir -p input/rows input/reference output

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-final-sonotaco-label-free-preparation-v2
          path: input/rows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31354363306

      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-internal-mass-sonotaco-development-v1-prep-32229888368
          path: input/reference
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32229888368

      - name: Verify fixed candidate reference
        run: |
          set -euo pipefail
          test "$(sha256sum input/reference/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_PRETRUTH_SUPPORT.json | cut -d' ' -f1)" = '19828089363280d37aed17aacc9561e60c185abda61b2b7c0dead0226d2740b9'

      - name: Generate zero-label annual-confirm ranking
        run: |
          set -euo pipefail
          python -u orbittrace_supportcut_annual_confirm_sonotaco_dev_v1/prepare_pretruth.py \
            --rows-root input/rows \
            --benchmark-module orbittrace_symmetric_tuned_literature_v2/run_benchmark.py \
            --support-source support-method/orbittrace_topomodal_support_resolved_cut_v1/generate_prelabel.py \
            --structural-source structural-method/orbittrace_topomodal_hierarchy_scale_v1/run_diagnostic.py \
            --fixed-candidate-reference input/reference/INTERNAL_MASS_SONOTACO_DEVELOPMENT_V1_PRETRUTH_SUPPORT.json \
            --output output

      - name: Enforce pretruth firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p=json.load(open('output/SUPPORTCUT_ANNUAL_CONFIRM_SONOTACO_DEV_V1_PRELABEL.json'))
          assert p['schema']=='ORBITTRACE_SUPPORTCUT_ANNUAL_CONFIRM_SONOTACO_DEV_V1_PRELABEL'
          assert p['scientific_role']=='PRELABEL_SUPPORTCUT_ANNUAL_CONFIRM_SONOTACO_DEVELOPMENT_V1'
          assert p['pooled_candidate_count']==888
          assert p['shower_truth_used'] is False and p['shower_truth_parsed'] is False
          assert p['labels_used_for_ranking'] is False and p['post_result_parameter_search'] is False
          assert p['universe']['common_counts']=={'2013':15988,'2014':13258}
          raw=open('output/SUPPORTCUT_ANNUAL_CONFIRM_SONOTACO_DEV_V1_PRELABEL.json','rb').read()
          print('PRELABEL_SHA256='+hashlib.sha256(raw).hexdigest())
          print(json.dumps({'annual_topology_counts':{y:p['annual_topology_summary'][y]['candidate_count'] for y in ('2013','2014')},'positive_confirmation_count':sum(float(r['annual_confirmation'])>0 for r in p['ranked_candidates'])},indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: orbittrace-supportcut-annual-confirm-sonotaco-dev-v1-prep-${{ github.run_id }}
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum output/SUPPORTCUT_ANNUAL_CONFIRM_SONOTACO_DEV_V1_PRELABEL.json | cut -d' ' -f1)
          gh pr comment 1373 --repo "${{ github.repository }}" --body "ORBITTRACE_SUPPORTCUT_ANNUAL_CONFIRM_PREP_SUCCESS=${GITHUB_RUN_ID};PRELABEL_SHA256=${sha}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1373 --repo "${{ github.repository }}" --body "ORBITTRACE_SUPPORTCUT_ANNUAL_CONFIRM_PREP_FAILED=${GITHUB_RUN_ID}"
