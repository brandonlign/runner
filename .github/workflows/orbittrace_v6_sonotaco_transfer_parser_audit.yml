name: OrbitTrace v6 SonotaCo transfer source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-v6-catalogue-base
    paths:
      - orbittrace_v6_sonotaco_2017_2019_transfer/parser_transport.py
      - orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer_corrected.py
      - orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer_frozen.py
      - .github/workflows/orbittrace_v6_sonotaco_transfer_parser_audit.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-v6-sonotaco-transfer-source-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v6-sonotaco-2017-2019-transfer-freeze

      - name: Download and verify exact frozen parser sources only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source17 source19
          gh run download 31199214174 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2015-2017-parser-transport --dir source17
          gh run download 31203088669 --repo "$GITHUB_REPOSITORY" --name orbittrace-sonotaco-2019-parser-transport --dir source19
          echo 'ee81d66b318ed2fa473ddfcee4c1cea0ef8ba08cba33da47103fd7c53ee625dc  source17/run_sonotaco_2017_transport_parser.py' | sha256sum -c -
          echo '301a711e4de43566ba434f2d4a94fc38a85714a33dcee45e26cb19340101ea43  source19/run_sonotaco_2019_transport_parser.py' | sha256sum -c -

      - name: Prove exact parser transport and blind boundary
        run: |
          set -euo pipefail
          python -m py_compile orbittrace_v6_sonotaco_2017_2019_transfer/parser_transport.py
          python - <<'PY'
          from pathlib import Path
          from orbittrace_v6_sonotaco_2017_2019_transfer import parser_transport as t
          for year,path in ((2017,Path('source17/run_sonotaco_2017_transport_parser.py')),(2019,Path('source19/run_sonotaco_2019_transport_parser.py'))):
              text=path.read_text()
              assert t.sha256_path(path)==t.PARSER_SHA256[year]
              assert text.count(t.OBSOLETE_GATE_LINE)==1
              changed=text.replace(t.OBSOLETE_GATE_LINE,t.V6_NONBINDING_LINE,1)
              assert changed.replace(t.V6_NONBINDING_LINE,t.OBSOLETE_GATE_LINE,1)==text
              assert changed.count(t.V6_NONBINDING_LINE)==1
              assert '"blind_interval_removed_before_label_access": True' in text
              assert text.index('if BLIND_SOLAR_MIN <= sol <= BLIND_SOLAR_MAX:') < text.index('token = row[index["shower"]]')
              compile(changed,f'transported_{year}.py','exec')
          assert t.ARCHIVE_SHA256=={2017:'1db43348806a44490fde8936529541754411b16825f2caea240378cda11c77cf',2019:'d49c37f5a9f7f089973d7029b840283f26ca9d915c137152a6f4368bbf5aabb4'}
          print('PASS_EXACT_PARSER_TRANSPORT_AND_BLIND_BOUNDARY')
          PY

      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v3-primary-catalogue-v6
          path: frozen-v6

      - name: Reconstruct exact repaired v6 and prove calibration preflight interface
        run: |
          set -euo pipefail
          cat frozen-v6/orbittrace_v3_catalogue_v6/exact_parts/part*.b64 | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/v6.frozen.py
          echo 'a139802f328e0721a6b48b9b41e098660d03e0e218cec49f1d6251981a2828c9  /tmp/v6.frozen.py' | sha256sum -c -
          python - <<'PY'
          import ast,hashlib
          from pathlib import Path
          text=Path('/tmp/v6.frozen.py').read_text()
          before='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    components = primary_components + rescue_components
'''
          after='''    primary_capped = cap_anchor_track(list(primary_by_anchor.values()), "v3")
    rescue_capped = cap_anchor_track(list(rescue_by_anchor.values()), "fixed4_rescue")
    capped = primary_capped + rescue_capped

    primary_components = component_records_track_v6(old, year, primary_capped, event_lookup, base, "v3")
    rescue_components = component_records_track_v6(old, year, rescue_capped, event_lookup, base, "fixed4_rescue")
    components = primary_components + rescue_components
'''
          assert text.count(before)==1
          repaired=text.replace(before,after,1)
          assert repaired.replace(after,before,1)==text
          Path('/tmp/v6.repaired.py').write_text(repaired)
          assert hashlib.sha256(repaired.encode()).hexdigest()=='257aab9d0f4d710a1b62af6088cfb9c0939062018d44dbacd074b4e7898eaa24'
          tree=ast.parse(repaired); defs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          assert 'calibrate_year_v6' in defs and 'scan_year_v6' in defs
          cal=ast.get_source_segment(repaired,defs['calibrate_year_v6'])
          scan=ast.get_source_segment(repaired,defs['scan_year_v6'])
          assert 'for bin_index in range(36)' in cal
          assert 'range(old.CALIBRATION_PER_BIN)' in cal
          assert 'if len(v3_calibration) < 30:' in cal
          assert 'insufficient supported calibration bins' in cal
          assert scan.index('calibrate_year_v6(') < scan.index('event_lookup =')
          print('PASS_EXACT_V6_NULL_CALIBRATION_PREFLIGHT_INTERFACE')
          PY
          python -m py_compile /tmp/v6.repaired.py

      - name: Prove corrected transfer protocol and chronology
        run: |
          set -euo pipefail
          python -m py_compile \
            orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer_corrected.py \
            orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer_frozen.py
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer_corrected.py')
          text=p.read_text(); tree=ast.parse(text)
          vals={}
          for n in tree.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name):
                  try: vals[n.targets[0].id]=ast.literal_eval(n.value)
                  except Exception: pass
          assert vals['YEARS']==(2017,2019)
          assert vals['MIN_BACKGROUND_EVENTS']==10000
          assert vals['MIN_DISTINCT_MAPPED_SHOWERS']==30
          assert vals['MIN_SUPPORTED_V6_CALIBRATION_BINS']==30
          assert vals['MIN_V3_PRIMARY_FAMILIES']==40
          assert vals['RECOVERY100_RETENTION']==0.80
          assert vals['QUALIFIED_RETENTION']==0.60
          assert vals['TOP100_PRECISION_FLOOR']==0.50
          assert vals['MRR_RETENTION']==0.80
          assert vals['IMPROVEMENT_ENDPOINTS']==('recovered_at_25','recovered_at_50','recovered_at_100','mrr','macro_f1')
          defs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          pre=ast.get_source_segment(text,defs['preflight_before_survey_scoring'])
          assert 'v6.calibrate_year_v6(' in pre
          assert 'current_v6_transfer(' not in pre and 'exact_v8_transfer(' not in pre and 'scan_year_v6(' not in pre
          assert 'survey_candidate_scores_computed": False' in pre
          main=ast.get_source_segment(text,defs['main'])
          i_pre=main.index('preflight_before_survey_scoring(')
          i_v6=main.index('legacy.current_v6_transfer(')
          i_v8=main.index('run_true_v8_same_universe(')
          i_freeze=main.index('(args.output / "current_v6_pretruth.sha256").write_text')
          i_truth=main.index('current_full = v6.evaluate_families_v6(')
          assert i_pre < i_v6 < i_freeze < i_truth
          assert i_pre < i_v8 < i_freeze < i_truth
          assert 'math.floor(RECOVERY100_RETENTION * int(v8_metrics["recovered_at_100"]))' in main
          assert 'math.floor(QUALIFIED_RETENTION * int(v8_metrics["qualified_matches"]))' in main
          assert 'MRR_RETENTION * float(v8_metrics["mrr"])' in main
          assert 'any(strict_improvements.values())' in main
          assert 'development_v6_mrr' not in main
          for gate in (
              'at_least_40_recurrent_v3_primary_families',
              'recovery100_at_least_floor_080_v8',
              'qualified_at_least_floor_060_v8',
              'top100_dominant_precision_at_least_050',
              'mrr_at_least_080_v8',
              'at_least_one_frozen_endpoint_strictly_exceeds_v8',
          ):
              assert gate in main,gate
          wrapper=Path('orbittrace_v6_sonotaco_2017_2019_transfer/run_transfer_frozen.py').read_text()
          assert 'old.CORPUS = corrected.legacy.CORPUS_V6' in wrapper
          assert wrapper.index('old.CORPUS = corrected.legacy.CORPUS_V6') < wrapper.index('return _ORIGINAL_PREFLIGHT')
          print('PASS_PROTOCOL_EXACT_V6_SONOTACO_TRANSFER_SOURCE_AUDIT')
          PY

      - name: Assert source-only boundary
        if: always()
        run: |
          test ! -e archive
          test ! -e input
          test ! -e output
          echo NO_SONOTACO_ARCHIVE_NO_LABEL_VALUE_NO_TARGET_REGION_NO_ORBITTRACE_TARGET
