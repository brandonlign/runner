name: GhostStream frozen fixed4 application

on:
  pull_request:
    branches:
      - agent/ghoststream-fixed4-execution-interface-audit
    paths:
      - ghoststream_fixed4_application/**
      - .github/workflows/ghoststream_fixed4_frozen_application.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ghoststream-frozen-fixed4-application
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CANONICAL_ARTIFACT_ID: '8814798136'
      CANONICAL_ARTIFACT_SHA256: '716b70313465d5df4bfb092a85a81680e6f618606b71e25470c63c480b6449f5'
      APPLICATION_SOURCE_SHA256: '0e24addac98ca8c55ac4cd4d457a390eea629a91838c05cb73a758b980691453'
      APPLICATION_SOURCE_BYTES: '24357'
      APPLICATION_ENCODED_LENGTH: '9052'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-fixed4-frozen-application
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
          python - <<'PY'
          from gmn_python_api import data_directory, meteor_trajectory_reader
          print('GMN adapter import passed')
          PY
      - name: Decode and verify frozen application
        run: |
          set -euo pipefail
          mkdir -p input output
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          payload = Path('ghoststream_fixed4_application/run_application.py.gz.b64')
          encoded = ''.join(payload.read_text(encoding='ascii').split())
          expected_length = int(os.environ['APPLICATION_ENCODED_LENGTH'])
          if len(encoded) != expected_length:
              raise RuntimeError(f'encoded length mismatch: {len(encoded)}')
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected_bytes = int(os.environ['APPLICATION_SOURCE_BYTES'])
          if len(source) != expected_bytes:
              raise RuntimeError(f'source byte mismatch: {len(source)}')
          digest = hashlib.sha256(source).hexdigest()
          if digest != os.environ['APPLICATION_SOURCE_SHA256']:
              raise RuntimeError(f'application source mismatch: {digest}')
          Path('/tmp/run_ghoststream_fixed4_application.py').write_bytes(source)
          print('application bytes:', len(source))
          print('application SHA-256:', digest)
          PY
          python -m py_compile /tmp/run_ghoststream_fixed4_application.py
      - name: Retrieve exact canonical GhostStream evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANONICAL_ARTIFACT_ID}/zip" \
            -o input/ghoststream-canonical.zip
          echo "${CANONICAL_ARTIFACT_SHA256}  input/ghoststream-canonical.zip" | sha256sum -c -
      - name: Run one-shot frozen candidate recovery
        run: |
          set -euo pipefail
          python /tmp/run_ghoststream_fixed4_application.py \
            --canonical-zip input/ghoststream-canonical.zip \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --output output
          cat output/GHOSTSTREAM_FIXED4_APPLICATION.md
      - name: Record provenance
        if: always()
        run: |
          mkdir -p output
          sha256sum \
            ghoststream_fixed4_application/AUDIT_PROTOCOL.md \
            ghoststream_fixed4_application/EXECUTION_PROTOCOL.md \
            ghoststream_fixed4_application/run_application.py.gz.b64 \
            ghoststream_fixed4_application/requirements.txt \
            sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            mondrian_clique_development/source_parts_v2/part00.b64 \
            mondrian_clique_development/source_parts_v2/part01.b64 \
            mondrian_clique_development/source_parts_v2/part02.b64 \
            mondrian_clique_development/source_parts_v2/part03.b64 \
            input/ghoststream-canonical.zip \
            > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
          gzip -f output/candidate_records.jsonl 2>/dev/null || true
          gzip -f output/negative_records.jsonl 2>/dev/null || true
          gzip -f output/calibration_records.jsonl 2>/dev/null || true
      - name: Upload frozen application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-fixed4-frozen-application
          path: output
          if-no-files-found: error
          retention-days: 90
