name: OrbitTrace exact v31 parent-order provenance export v1

on:
  push:
    branches:
      - agent/orbittrace-v61-predictive-consistency-rank-fusion-v1
    paths:
      - 'orbittrace_v31_parent_order_export_v1/**'
      - '.github/workflows/orbittrace_v31_parent_order_export_v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-v61-predictive-consistency-rank-fusion-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact runtime and verify provenance source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'joblib==1.5.3'
          mkdir -p input/ranker input/payload input/truth output
          test "$(git hash-object orbittrace_v31_parent_order_export_v1/export_orders.py)" = '4b5a0c6a30276d2fb94155529f6ba32f755c30d4'
          test "$(git hash-object orbittrace_v31_local_geometry_margin_oof_v1/train_evaluate.py)" = '917e3cd6f9310ca1282e0efa58ed0924d03ed4da'
          test "$(git hash-object orbittrace_v24_twohead_worst_prediction_v1/train_evaluate.py)" = 'cb981af547f74664a0956a72547a4ee6037cd438'
          test "$(git hash-object orbittrace_v22_sonotaco_grouped_oof_ranker_v1/train_evaluate.py)" = '88e67cbb3429de701f7e774ad108f2080b4ffb1b'
          python -m py_compile orbittrace_v31_parent_order_export_v1/export_orders.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-active-urc-ranker-source-export-v1
          path: input/ranker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31344632499
      - name: Verify immutable ranker
        run: |
          set -euo pipefail
          test "$(sha256sum input/ranker/run_urc_union_ranker.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
      - name: Restore immutable v24 pretruth payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9074742322/zip' -o input/v24.zip
          echo 'd940fa255804866f14bc34b1d72467d17adddcfb7d82c954ed5a8d1668aa307a  input/v24.zip' | sha256sum -c -
          unzip -q input/v24.zip -d input/payload
      - name: Restore already-exposed truth solely for parent reconstruction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/brandonlign/runner/actions/artifacts/9069505548/zip' -o input/truth.zip
          echo 'cdea3297c234b0b3a8f09c2208649c8607bb3e9a9004d299f6dcc18536ebb797  input/truth.zip' | sha256sum -c -
          unzip -q input/truth.zip -d input/truth
      - name: Reconstruct exact existing v31 parent orders
        env:
          PYTHONPATH: orbittrace_v22_sonotaco_grouped_oof_ranker_v1/stubs:.:input/ranker
        run: |
          set -euo pipefail
          python -u orbittrace_v31_parent_order_export_v1/export_orders.py \
            --sugar-root input/payload/sugar --hdbscan-root input/payload/hdbscan \
            --truth-root input/truth --ranker-source input/ranker/run_urc_union_ranker.py \
            --output output
      - name: Enforce provenance-only reconstruction
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/V31_PARENT_ORDERS_EXPORT_V1.json'))
          assert r['verdict']=='PASS_EXACT_V31_PARENT_ORDER_RECONSTRUCTION'
          assert r['scientific_change'] is False
          assert r['routes']['sugar']['candidate_count']==267
          assert r['routes']['hdbscan']['candidate_count']==229
          assert r['routes']['sugar']['v31_fused_order_sha256']=='5b3d27e11079f36148bbfb8bfdab60882fae380143fcfd84c6dc290c53295aae'
          assert r['routes']['hdbscan']['v31_fused_order_sha256']=='85ac3f29a443c35b3812cf28c99ef13474fc3e0455458e20b41cec64d942073d'
          assert r['target_information_access'] is False and r['target_region_events_accessed'] is False
          assert r['maarsy_scientific_access'] is False and r['dms_scientific_access'] is False
          PY
      - name: Preserve provenance
        if: always()
        run: |
          set +e
          sha256sum orbittrace_v31_parent_order_export_v1/export_orders.py input/ranker/run_urc_union_ranker.py > output/source_input_sha256.txt 2>/dev/null || true
          git rev-parse HEAD > output/execution_commit.txt
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-v31-parent-orders-export-v1
          path: output
          if-no-files-found: error
          retention-days: 90
