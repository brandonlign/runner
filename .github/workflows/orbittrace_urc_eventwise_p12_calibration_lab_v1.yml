name: OrbitTrace URC eventwise P12 calibration lab v1

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - 'orbittrace_urc_eventwise_p12_calibration_lab_v1/**'
      - '.github/workflows/orbittrace_urc_eventwise_p12_calibration_lab_v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: orbittrace-urc-eventwise-p12-calibration-lab-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  develop:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: 63dc5b552d5217601003f738996477fb019ff7c8
          path: urc-source
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frozen-v8/ghoststream_fixed4_application/requirements.txt
      - name: Install exact development dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r frozen-v8/ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13
      - name: Restore exact frozen runtimes and #839 ranker
        run: |
          set -euo pipefail
          mkdir -p input/v3 output
          git -C frozen-v8 fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git -C frozen-v8 show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          rm -f /tmp/run_wavelet_catalogue_v3_development.py /tmp/run_urc_union.py
          (
            cd frozen-v8
            python orbittrace_wavelet_catalogue_v3/audit_development_source.py
            test "$(cat output/development_source_sha256.txt)" = 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51'
          )
          test "$(sha256sum urc-source/orbittrace_urc_union_ranking_lab_v1/run_lab.py.gz.b64 | cut -d' ' -f1)" = '9704c91336c71a468c5e7da1aecf16919936eb159ab4c7bb594909e3751af51a'
          base64 -d urc-source/orbittrace_urc_union_ranking_lab_v1/run_lab.py.gz.b64 | gzip -dc > /tmp/run_urc_union.py
          test "$(sha256sum /tmp/run_urc_union.py | cut -d' ' -f1)" = 'dd14e899ac08c4081cfee7d2dac2e54d2f25f78427cc4bee30f30296cd24b990'
          python -m py_compile \
            orbittrace_urc_eventwise_p12_calibration_lab_v1/run_lab.py \
            orbittrace_urc_eventwise_p12_calibration_lab_v1/run_artifact_hash_compatible.py \
            /tmp/run_urc_union.py \
            urc-source/orbittrace_unified_recurrent_catalogue_lab_v1/run_lab.py \
            urc-source/orbittrace_unified_recurrent_catalogue_lab_v2/run_lab.py
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-pooled-year-centroid-v8-development
          path: input/v8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31217916558
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p19-subthreshold-reciprocal-recurrence-development
          path: input/p19
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31340446086
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-p20-recurrent-isolated-quartet-development
          path: input/p20
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31341591263
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-urc-union-ranking-lab-v1
          path: input/union
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31342891394
      - uses: actions/download-artifact@v4
        with:
          name: orbittrace-drift-conditioned-two-view-membership-p12-development
          path: input/p12
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31302353678
      - name: Verify exact frozen scientific inputs
        run: |
          set -euo pipefail
          test "$(sha256sum input/v8/pooled_year_centroid_v8_development.json | cut -d' ' -f1)" = 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b'
          test "$(sha256sum input/p19/p19_subthreshold_reciprocal_recurrence_development.json | cut -d' ' -f1)" = '6f1ad0626b8a8bda03f18e7f3435f0651af8bebf65cfd1d970a6b61a8ba52319'
          test "$(sha256sum input/p19/p19_prelabel_payload.json | cut -d' ' -f1)" = '276129ef8f9f31a1f8e7b1570c15f5e67ed1a7274f293f5da65bab60f86e32b8'
          test "$(sha256sum input/p20/p20_recurrent_isolated_quartet_development.json | cut -d' ' -f1)" = '9ec53f29281b11002a9e22b1086d12e054392e466ea74fe82ead0187289ba303'
          test "$(sha256sum input/p20/p20_prelabel_payload.json | cut -d' ' -f1)" = '8ca358ae0f3ac96b188de9eac7bcfd6f870470873a2b7ee73b7ae76497c12734'
          test "$(sha256sum input/union/urc_union_ranking_lab_v1.json | cut -d' ' -f1)" = 'e932ad2507f6305a96c9d442a556593e470c966f1adfc2f4f2098adbc8f9dbcd'
          test "$(sha256sum input/p12/drift_conditioned_two_view_membership_p12_development.json | cut -d' ' -f1)" = '96698c1a7ba700716a79e7bc8b7bc9acb2f9aec653095a5d7e33b14000b87a38'
          test "$(sha256sum input/p12/p12_decisions_pretruth.json.gz | cut -d' ' -f1)" = '8b304db4f878c2ec8388348b72c22bfa5ff37317fba8c5ea1932b085bb1964d3'
          test "$(sha256sum input/p12/p12_expanded_families.json.gz | cut -d' ' -f1)" = '0377eaf640a7b3215d2d79f34394b84370e60519edb55f9fb57a8ff29844d6a7'
          test "$(cat input/p12/p12_decisions_pretruth.sha256)" = '6e11671cfb176302a58dd329d9fb09fc380a19e4ff9669bc444d5ce9624f00f5'
          test "$(cat input/p12/p12_membership_pretruth.sha256)" = 'f158ebfa3a9a3c8006a7c81cbf0b47f7307aa7f2537e8046621b08037230cca3'
          python - <<'PY'
          import gzip, hashlib, json
          assert hashlib.sha256(gzip.decompress(open('input/p12/p12_decisions_pretruth.json.gz','rb').read())).hexdigest() == '6e11671cfb176302a58dd329d9fb09fc380a19e4ff9669bc444d5ce9624f00f5'
          assert hashlib.sha256(gzip.decompress(open('input/p12/p12_expanded_families.json.gz','rb').read())).hexdigest() == 'f158ebfa3a9a3c8006a7c81cbf0b47f7307aa7f2537e8046621b08037230cca3'
          u=json.load(open('input/union/urc_union_ranking_lab_v1.json'))
          assert u['verdict']=='PASS_URC_UNION_RANKING_FEASIBILITY'
          assert u['best_cross_validated']['order_sha256']=='ffc97f7bc4fbc8f13170ffe8a71260e1596190e39e9324c24e8ba7719f427449'
          p=json.load(open('input/p12/drift_conditioned_two_view_membership_p12_development.json'))
          assert p['verdict']=='FAIL_DRIFT_CONDITIONED_TWO_VIEW_MEMBERSHIP_P12_NO_GO'
          assert p['decisions_pretruth_sha256']=='6e11671cfb176302a58dd329d9fb09fc380a19e4ff9669bc444d5ce9624f00f5'
          print('PASS_EXACT_URC_AND_P12_FREEZE')
          PY
      - name: Run target-excluded eventwise P12 calibration lab
        env:
          PYTHONPATH: .:urc-source:input/v3:frozen-v8/orbittrace_wavelet_catalogue_v3:frozen-v8
        run: |
          set -euo pipefail
          python -u orbittrace_urc_eventwise_p12_calibration_lab_v1/run_artifact_hash_compatible.py \
            --support-source-parts frozen-v8/orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload frozen-v8/sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload frozen-v8/real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts frozen-v8/mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --p19-result-json input/p19/p19_subthreshold_reciprocal_recurrence_development.json \
            --p19-prelabel-json input/p19/p19_prelabel_payload.json \
            --p20-result-json input/p20/p20_recurrent_isolated_quartet_development.json \
            --p20-prelabel-json input/p20/p20_prelabel_payload.json \
            --p12-result-json input/p12/drift_conditioned_two_view_membership_p12_development.json \
            --p12-decisions-json-gz input/p12/p12_decisions_pretruth.json.gz \
            --p12-expanded-json-gz input/p12/p12_expanded_families.json.gz \
            --union-ranker /tmp/run_urc_union.py \
            --union-reference-json input/union/urc_union_ranking_lab_v1.json \
            --output output
          cat output/URC_EVENTWISE_P12_CALIBRATION_LAB_V1.md
      - name: Record provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/lab_commit.txt
          sha256sum \
            orbittrace_urc_eventwise_p12_calibration_lab_v1/run_lab.py \
            orbittrace_urc_eventwise_p12_calibration_lab_v1/run_artifact_hash_compatible.py \
            /tmp/run_urc_union.py \
            input/union/urc_union_ranking_lab_v1.json \
            input/p12/drift_conditioned_two_view_membership_p12_development.json \
            > output/source_and_freeze_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-urc-eventwise-p12-calibration-lab-v1
          path: output
          if-no-files-found: error
          retention-days: 90
