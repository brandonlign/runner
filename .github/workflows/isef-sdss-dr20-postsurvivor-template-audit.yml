name: ISEF SDSS DR20 survivor template audit
on:
  push:
    paths:
      - 'isef/sdss_dr20_postsurvivor_template_audit.py'
      - '.github/workflows/isef-sdss-dr20-postsurvivor-template-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8'
      - run: timeout 600s python isef/sdss_dr20_postsurvivor_template_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isef-sdss-dr20-postsurvivor-template-audit
          path: results/sdss_dr20_postsurvivor_template_audit.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## SDSS DR20 survivor template audit'; echo '```json'; cat results/sdss_dr20_postsurvivor_template_audit.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
