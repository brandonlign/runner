name: OrbitTrace P6 schema-only technical recovery

on:
  pull_request:
    branches:
      - agent/orbittrace-p6-bidirectional-reliability-freeze
    paths:
      - orbittrace_bidirectional_reliability_p6/RUN_RECOVER.md

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require one-file recovery child and prove prior technical no-result
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'orbittrace_bidirectional_reliability_p6/RUN_RECOVER.md'
          content="$(git show "$HEAD_SHA":orbittrace_bidirectional_reliability_p6/RUN_RECOVER.md)"
          test "$(printf '%s\n' "$content" | sed -n '1p')" = 'RECOVER_P6_AFTER_SCHEMA_ONLY_TECHNICAL_NO_RESULT'
          test "$(printf '%s\n' "$content" | sed -n '2p')" = '31294634617'
          test "$(printf '%s\n' "$content" | sed -n '3p')" = '31293431873'
          test "$(printf '%s\n' "$content" | sed -n '4p')" = '9032407268'
          test "$(printf '%s\n' "$content" | wc -l)" -eq 4

          gh run view 31294634617 --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/p6_failed.log
          grep -Fq "KeyError: 'hashes'" /tmp/p6_failed.log
          ! grep -Fq 'PASS_P6_AUTHORITATIVE_P5_SCIENTIFIC_NO_GO_PREREQUISITE' /tmp/p6_failed.log
          ! grep -Fq 'PASS_P6_PRETRUTH_MEMBERSHIP_FROZEN_BEFORE_TRUTH' /tmp/p6_failed.log
          ! grep -Fq 'BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P6_DEVELOPMENT.md' /tmp/p6_failed.log
          ! grep -Fq 'ORBITTRACE_P6_RESULT_BEGIN' /tmp/p6_failed.log
          echo PASS_P6_SCHEMA_ONLY_TECHNICAL_NO_RESULT

          rm -rf input/p5 input/p6 && mkdir -p input/p5 input/p6
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9032407268/zip" -o input/p5.zip
          echo '39ba9b6f40c0a07f326ae61f9f1dc06d9d3ed3d11c4400f41a75dfb4473c3ea6  input/p5.zip' | sha256sum -c -
          unzip -q input/p5.zip -d input/p5
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          r=json.loads(Path('input/p5/joint_seed_support_membership_p5_development.json').read_text())
          assert r['verdict']=='FAIL_JOINT_SEED_SUPPORT_MEMBERSHIP_P5_NO_GO',r['verdict']
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['family_count']==226
          assert r['configuration']['parameter_search'] is False
          assert r['baseline_v8']['qualified_matches']==95
          assert r['baseline_v8']['recovered_at_100']==58
          assert r['p5']['qualified_matches']==92
          assert r['p5']['recovered_at_100']==58
          assert abs(r['p5']['macro_f1']-0.4097058447573806)<1e-12
          assert abs(r['p5']['top100_dominant_precision']-0.6914072664585)<1e-12
          assert abs(r['p5_large_shower']['mean_precision']-0.8841143378483354)<1e-12
          assert r['crossfit_pretruth_sha256']=='55defa606101cfc0e0f9038d326fd19cfd99d0c423b68602ecd5581e00ff8ac1'
          assert r['model_pretruth_sha256']=='8ac8b13ab025a636884d44a2b19d478c9de5c138c3da190f3dfe3d73490257eb'
          assert r['membership_pretruth_sha256']=='933be44170bc91cf8e92a38b84689d590610ecdf809e911ac40022b5d4e806c9'
          assert r['decisions_pretruth_sha256']=='b9b87427e8d5521e92bca3d27ef9528da7509f2c9d5a647764789abc65323711'
          raw=gzip.decompress(Path('input/p5/p5_expanded_families.json.gz').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='933be44170bc91cf8e92a38b84689d590610ecdf809e911ac40022b5d4e806c9'
          print('PASS_P6_RECOVERY_AUTHORITATIVE_P5_PREREQUISITE')
          PY

          python orbittrace_bidirectional_reliability_p6/transform_frozen_p5.py \
            --p5-expanded-families input/p5/p5_expanded_families.json.gz \
            --p5-membership-sha input/p5/p5_membership_pretruth.sha256 \
            --p5-decisions input/p5/p5_decisions_pretruth.json.gz \
            --p5-decisions-sha input/p5/p5_decisions_pretruth.sha256 \
            --crossfit-json input/p5/p3_crossfit_pretruth.json \
            --crossfit-sha input/p5/p3_crossfit_pretruth.sha256 \
            --model-sha input/p5/p2_model_pretruth.sha256 \
            --output input/p6
          test "$(cat input/p6/p6_membership_pretruth.sha256)" = '40b0b720ef37427bc2d89aeb71c145683cbc69eff9b56ac5516e87fc34348ff6'
          test "$(cat input/p6/p6_decisions_pretruth.sha256)" = '5e76bbf2fd75acdf1d1bc770dc3c60de338a6388524c956544afe4c1aabc8490'
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('input/p6/p6_pretruth_transform.json').read_text())
          assert r['bidirectionally_reliable_families']==218
          assert r['ineligible_families']==8
          assert r['dropped_assignments']==3320
          assert r['retained_assignments']==21626
          assert r['families_gaining_members']==214
          assert r['known_shower_truth_accessed'] is False
          assert r['target_information_accessed'] is False
          print('PASS_P6_RECOVERY_PRETRUTH_MEMBERSHIP_FROZEN_BEFORE_TRUTH')
          PY

          git checkout --detach "$BASE_SHA"
          test ! -e orbittrace_bidirectional_reliability_p6/RUN_RECOVER.md

      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: exact-v8
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ghoststream_fixed4_application/requirements.txt

      - name: Install exact frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r ghoststream_fixed4_application/requirements.txt
          python -m pip install --no-deps gmn-python-api==0.0.13

      - name: Reconstruct exact frozen evaluator identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/{v3,v8,dsh} output
          echo '7637b6fb310ee3f24f1de8479a34d10c594dc55471eee55b8854e1c28787e8dd  orbittrace_crossyear_two_view_membership_p2/run_development.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_compliance_patch.py orbittrace_crossyear_two_view_membership_p2/run_development.py /tmp/p2_v1.py
          echo '169ed0a276cdcae628cd830130cfb03d6511a972df50d4dc10ffddfc1c8e05da  /tmp/p2_v1.py' | sha256sum -c -
          python orbittrace_crossyear_two_view_membership_p2/apply_protocol_precision_patch_v2.py /tmp/p2_v1.py /tmp/run_p2_canonical_v2.py
          echo 'f19500f6b0dfe481d845af57f3b4d7ec35e678e2191388b7ff4611f8fb2c4eeb  /tmp/run_p2_canonical_v2.py' | sha256sum -c -
          python -m py_compile /tmp/run_p2_canonical_v2.py orbittrace_bidirectional_reliability_p6/evaluate_frozen_p6.py
          python orbittrace_wavelet_catalogue_v3/audit_development_source.py
          echo 'ef3e69317af59fdac7a030edc77f742fc4772473d7f16b719b5d804cd4117f51  /tmp/run_wavelet_catalogue_v3_development.py' | sha256sum -c -
          test "$(git -C exact-v8 rev-parse HEAD)" = 'c9d6c44704013ba0c9430100e98a29a56b453304'

          git fetch --no-tags --depth=1 origin d8258581af143308495bd97bedcc142abbbd951a
          git show FETCH_HEAD:orbittrace_multi_anchor_energy_v3/multi_anchor_energy_v3.py > input/v3/multi_anchor_energy_v3.py
          test "$(git hash-object input/v3/multi_anchor_energy_v3.py)" = '2ba4835db23f8f623cdd28d0a4e6113b7954ecb2'
          python -m py_compile input/v3/multi_anchor_energy_v3.py

          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9009728299/zip" -o input/v8.zip
          echo '88d2d607e05d027015c338f7e23b64a6195e55ae24f1b2ac745f5e9bc6df599e  input/v8.zip' | sha256sum -c -
          unzip -q input/v8.zip -d input/v8
          echo 'fa8f52cf046ced499a378cc6b7d04c52ef92bf0fa3f801049211d190f1c3919b  input/v8/pooled_year_centroid_v8_development.json' | sha256sum -c -

          git fetch --no-tags --depth=1 origin agent/orbittrace-literature-comparison-2023-replication
          git show FETCH_HEAD:orbittrace_literature_comparison/literature_comparators.py > input/dsh/literature_comparators.py
          echo '85cd11afbdebc4a0315ebf1daf42d10d4993d7ab088dd05301e3234b18340a5a  input/dsh/literature_comparators.py' | sha256sum -c -
          python -m py_compile input/dsh/literature_comparators.py
          echo PASS_P6_RECOVERY_EXACT_EVALUATOR_IDENTITIES

      - name: Evaluate exact frozen P6 membership against unchanged target-excluded truth
        env:
          PYTHONPATH: input/v3:exact-v8:orbittrace_wavelet_catalogue_v3:.
        run: |
          set -euo pipefail
          python -u orbittrace_bidirectional_reliability_p6/evaluate_frozen_p6.py \
            --p2-source /tmp/run_p2_canonical_v2.py \
            --p6-expanded-families input/p6/p6_expanded_families.json.gz \
            --p6-membership-sha input/p6/p6_membership_pretruth.sha256 \
            --p6-decisions input/p6/p6_decisions_pretruth.json.gz \
            --p6-decisions-sha input/p6/p6_decisions_pretruth.sha256 \
            --p6-transform-json input/p6/p6_pretruth_transform.json \
            --base-runner /tmp/run_wavelet_catalogue_v3_development.py \
            --support-source-parts orbittrace_fixed4_support_wrapper_development/source_parts \
            --candidate-payload sonotaco_fixed4_final_development/candidate.py.gz.b64 \
            --baseline-payload real_shower_meta_stage0/run_baseline_ceiling.py.gz.b64 \
            --scorer-parts mondrian_clique_development/source_parts_v2 \
            --v8-result-json input/v8/pooled_year_centroid_v8_development.json \
            --v8-runner exact-v8/orbittrace_pooled_year_centroid_v8/run_development.py \
            --dsh-comparator input/dsh/literature_comparators.py \
            --output output
          cat output/BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P6_DEVELOPMENT.md

      - name: Enforce exact frozen P6 result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/bidirectional_reliability_membership_p6_development.json').read_text())
          assert r['verdict'] in {'PASS_BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P6_DEVELOPMENT','FAIL_BIDIRECTIONAL_RELIABILITY_MEMBERSHIP_P6_NO_GO'}
          assert r['configuration']['years']==[2022,2023]
          assert r['configuration']['blind_exclusion']==[20.0,55.0]
          assert r['configuration']['family_count']==226
          assert r['configuration']['parameter_search'] is False
          assert r['baseline_v8']['qualified_matches']==95
          assert r['baseline_v8']['recovered_at_100']==58
          assert r['hashes']['p6_membership_pretruth_sha256']=='40b0b720ef37427bc2d89aeb71c145683cbc69eff9b56ac5516e87fc34348ff6'
          assert r['hashes']['p6_decisions_pretruth_sha256']=='5e76bbf2fd75acdf1d1bc770dc3c60de338a6388524c956544afe4c1aabc8490'
          for key in ('exact_v8_226_family_order','exact_v8_seed_members_preserved','v8_baseline_reproduced','exact_dsh_source_identity','p6_membership_frozen_before_truth','p6_decisions_frozen_before_truth','p6_exact_bidirectionally_reliable_family_count','p6_no_expansion_if_either_direction_unreliable','p6_strict_subset_of_p5','expansion_nonvacuous'):
              assert r['gates'][key] is True,key
          assert r['diagnostics']['assigned_nonseed_events']==21626
          assert r['diagnostics']['dropped_p5_assignments']==3320
          print('ORBITTRACE_P6_RESULT_BEGIN')
          print(json.dumps({'verdict':r['verdict'],'baseline_v8':r['baseline_v8'],'p6':r['p6'],'baseline_large_shower':r['baseline_large_shower'],'p6_large_shower':r['p6_large_shower'],'gates':r['gates'],'diagnostics':r['diagnostics'],'hashes':r['hashes']},indent=2,sort_keys=True))
          print('ORBITTRACE_P6_RESULT_END')
          PY

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          cp input/p6/p6_pretruth_transform.json output/ 2>/dev/null || true
          cp input/p6/p6_membership_pretruth.sha256 output/ 2>/dev/null || true
          cp input/p6/p6_decisions_pretruth.sha256 output/ 2>/dev/null || true
          cp input/p6/p6_expanded_families.json.gz output/ 2>/dev/null || true
          cp input/p6/p6_decisions_pretruth.json.gz output/ 2>/dev/null || true
          sha256sum orbittrace_bidirectional_reliability_p6/transform_frozen_p5.py orbittrace_bidirectional_reliability_p6/evaluate_frozen_p6.py /tmp/run_p2_canonical_v2.py input/p5/p5_expanded_families.json.gz input/p5/p5_decisions_pretruth.json.gz > output/source_and_input_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-bidirectional-reliability-membership-p6-development-recovery
          path: output
          if-no-files-found: error
          retention-days: 90
