name: ISEF SDSS DR20 APO visit RV calibration
on:
  push:
    paths:
      - '.github/workflows/isef-sdss-dr20-apo-visit-rv-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=2.2' 'astropy>=7.1,<8'
      - run: timeout 1200s python isef/sdss_dr20_apo_visit_rv_calibration.py
      - uses: actions/upload-artifact@v4
        with:
          name: isef-sdss-dr20-apo-visit-rv-calibration
          path: results/sdss_dr20_apo_visit_rv_calibration.json
      - if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## SDSS DR20 APO visit RV calibration'; echo '```json'; cat results/sdss_dr20_apo_visit_rv_calibration.json 2>/dev/null || true; echo '```'; } >/tmp/r.md
          gh issue comment 1447 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r.md
