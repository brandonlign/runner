name: Observe OrbitTrace validated lazy binding status

on:
  pull_request:
    branches: [agent/orbittrace-recurrent-local-topomodal-trunk-v1-activate]
    paths:
      - '.github/workflows/orbittrace_local_trunk_valid_lazy_binding_status.yml'

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

env:
  TARGET_BRANCH: agent/orbittrace-recurrent-local-topomodal-trunk-v1-activate
  TARGET_WORKFLOW_NAME: OrbitTrace recurrent local TopoModal trunk v1 validated lazy binding

jobs:
  status:
    runs-on: ubuntu-22.04
    steps:
      - name: Report latest binding run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          runs="$(gh api -X GET "repos/$REPO/actions/runs" -f branch="$TARGET_BRANCH" -f event=push -f per_page=100)"
          run_id="$(printf '%s' "$runs" | jq -r --arg name "$TARGET_WORKFLOW_NAME" '.workflow_runs[]? | select(.name==$name) | .id' | head -n1)"
          test -n "$run_id"
          meta="$(gh api "repos/$REPO/actions/runs/$run_id")"
          jobs="$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100")"
          {
            echo '```text'
            echo "BINDING_RUN_ID=$run_id"
            printf '%s\n' "$meta" | jq -c '{status,conclusion,head_sha,run_attempt,created_at,updated_at,html_url}'
            printf '%s\n' "$jobs" | jq -c '.jobs[] | {id,name,status,conclusion,steps:[.steps[]?|{name,status,conclusion}]}'
            echo '```'
          } > status.md
          gh pr comment "$PR_NUMBER" -R "$REPO" --body-file status.md
