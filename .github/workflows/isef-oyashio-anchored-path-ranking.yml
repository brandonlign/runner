name: ISEF Oyashio frozen anchored path ranking
on:
  push:
    branches: [main]
    paths: ['isef/OYASHIO_ANCHORED_PATH_RANKING_TRIGGER']
  workflow_dispatch:
jobs:
  rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy astropy astroquery sep requests acstools
      - name: Verify frozen analyzer syntax
        run: python -m py_compile isef/oyashio_broad_anchor_count_pilot.py isef/oyashio_broad_anchor_exactzp.py isef/oyashio_anchored_path_ranking.py isef/oyashio_anchored_path_ranking_locked.py
      - name: Run whole-field all-anchor F814W ranking
        run: |
          cd isef
          python oyashio_anchored_path_ranking_locked.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isef-oyashio-frozen-anchored-path-ranking
          path: isef/results/oyashio_anchored_path_ranking/
          if-no-files-found: warn
