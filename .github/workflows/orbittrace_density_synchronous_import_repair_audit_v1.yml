name: OrbitTrace density-synchronous import repair zero-data audit v1

on:
  push:
    branches:
      - agent/orbittrace-density-synchronous-recurrent-eom-v1
    paths:
      - '.github/workflows/orbittrace_density_synchronous_import_repair_audit_v1.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  import-repair-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbittrace-density-synchronous-recurrent-eom-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact import-time numerical runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.7.1' 'hdbscan==0.8.43'

      - name: Verify frozen science and repair bytes
        run: |
          set -euo pipefail
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py)" = '30ac3fa3bc47910370df528fcf3ae8ecb6277b47'
          test "$(git hash-object orbittrace_recurrent_eom_hdbscan_v1/run_development.py)" = 'fdc4f3f6e037014aadfcc3ce41b7344aa0a80b2c'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/PROTOCOL.md)" = '1187cbba37372c834bdbbf7eb05b1f7c31f8dcf9'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py)" = '587a304f451e41b9503272f1783a6c6ebb295000'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/run_development.py)" = '157813ca331165180a6d20aa71bfc78d5984396f'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/EXECUTION_FREEZE.json)" = '620fa5185ff331e8d3befd4395370df5e35fec83'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/run_with_parent_import.py)" = 'df024a3d724be8688ca45f77c02dc4bd2e0bd5b5'
          test "$(git hash-object orbittrace_density_synchronous_recurrent_eom_v1/audit_import_repair.py)" = '3bc00457c23874e527e82317d3e0049c7e5f98b0'
          python -m py_compile \
            orbittrace_recurrent_eom_hdbscan_v1/recurrent_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            orbittrace_density_synchronous_recurrent_eom_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/run_with_parent_import.py \
            orbittrace_density_synchronous_recurrent_eom_v1/audit_import_repair.py

      - name: Run zero-data import repair audit
        env:
          PYTHONPATH: orbittrace_recurrent_eom_hdbscan_v1:orbittrace_density_synchronous_recurrent_eom_v1:.
        run: |
          set -euo pipefail
          rm -rf output
          python -u orbittrace_density_synchronous_recurrent_eom_v1/audit_import_repair.py

      - name: Enforce repair audit firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('output/DENSITY_SYNCHRONOUS_IMPORT_REPAIR_ZERO_DATA_AUDIT.json'))
          assert r['verdict']=='PASS_DENSITY_SYNCHRONOUS_IMPORT_REPAIR_ZERO_DATA_AUDIT'
          assert r['technical_no_result_run']==31852571788
          assert r['technical_no_result_artifact']==9237971344
          assert r['technical_no_result_artifact_digest']=='sha256:30ad75c1fde8e7345532557d53ca338035a2ef7948c002d5330dadd620121198'
          for k in [
              'parent_module_bound_exactly','successor_parent_runner_identity_exact','inherited_constants_exact',
              'scientific_runner_blob_unchanged','scientific_kernel_blob_unchanged'
          ]:
              assert r[k] is True, (k,r[k])
          for k in [
              'scientific_data_access','gmn_access','sonotaco_access','efn_access','asfn_access','amos_access',
              'maarsy_scientific_access','dms_scientific_access','target_information_access','target_region_events_accessed',
              'hdbscan_fit_executed','hidden_truth_accessed','prelabel_created','scientific_result_created'
          ]:
              assert r[k] is False, (k,r[k])
          print('PASS_DENSITY_SYNCHRONOUS_IMPORT_REPAIR_ZERO_DATA_AUDIT_WORKFLOW')
          PY

      - name: Preserve audit provenance
        if: always()
        run: |
          set +e
          mkdir -p output
          git rev-parse HEAD > output/execution_commit.txt
          sha256sum \
            orbittrace_density_synchronous_recurrent_eom_v1/IMPORT_REPAIR_FREEZE.md \
            orbittrace_density_synchronous_recurrent_eom_v1/run_with_parent_import.py \
            orbittrace_density_synchronous_recurrent_eom_v1/audit_import_repair.py \
            orbittrace_density_synchronous_recurrent_eom_v1/run_development.py \
            orbittrace_density_synchronous_recurrent_eom_v1/density_synchronous_eom.py \
            orbittrace_recurrent_eom_hdbscan_v1/run_development.py \
            > output/import_repair_provenance_sha256.txt 2>/dev/null || true
          python --version > output/python_version.txt
          python -m pip freeze > output/environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbittrace-density-synchronous-import-repair-zero-data-audit-v1
          path: output
          if-no-files-found: error
          retention-days: 90
