name: OrbitTrace v15 SonotaCo engineering applicability source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-p15-support-safe-halo-freeze
    paths:
      - 'orbittrace_v15_sonotaco_applicability_v1/**'
      - '.github/workflows/orbittrace_v15_sonotaco_applicability_v1_source_audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brandonlign/runner
          ref: c9d6c44704013ba0c9430100e98a29a56b453304
          path: frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit source-only SonotaCo applicability freeze
        run: |
          set -euo pipefail
          test "$(git -C frozen-v8 hash-object orbittrace_label_free_sparse_support_v6/run_development.py)" = '7995fc6b75d1fd51eb4b304ace39db28a5a1e876'
          test "$(git -C frozen-v8 hash-object orbittrace_pooled_year_centroid_v8/run_development.py)" = 'f248df78e1258b132b41aecca6a985a5eb782654'
          test "$(git hash-object orbittrace_v15_canonical_application_v1/application.py)" = '5b3244dfbcc7bc931925aea42866edc8205113a8'
          test "$(git hash-object orbittrace_v15_canonical_events_v1/canonical.py)" = '674eaec2acd8bf908bde797243c9414f0fa9559d'
          python -m py_compile orbittrace_v15_sonotaco_applicability_v1/run_applicability.py
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('orbittrace_v15_sonotaco_applicability_v1/run_applicability.py').read_text()
          d=Path('orbittrace_v15_sonotaco_applicability_v1/PROTOCOL.md').read_text()
          tree=ast.parse(p); imports=set()
          for n in ast.walk(tree):
              if isinstance(n,ast.Import): imports.update(x.name.split('.')[0] for x in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module: imports.add(n.module.split('.')[0])
          forbidden={'requests','urllib','http','socket','subprocess','h5py','tarfile','zipfile','pandas','gmn_python_api'}
          assert not imports.intersection(forbidden), imports.intersection(forbidden)
          for token in (
              'YEARS = (2013, 2014)',
              'EXPECTED_PREP_ARTIFACT_ID = 9050107352',
              'sha256:1296d757b5ea1dd94f9c9077fd769fdc8f00ec06d0881d8548fd1df4608344cc',
              'f84e6db4166be065a73c7d030d66fdf796c1c6c2b5ee692f1e3299e8ae7c05ce',
              '1fab29c7368b63cc9c9d172dcadec5918d6514bfbb09f0f71e54eebb9bf32f00',
              'EXPECTED_BASE_COUNTS = {2013: 24899, 2014: 20575}',
              'v6.label_free_scan_year',
              'v8.repair_year_centroids',
              'application.run_pretruth',
              'truth_mapping_accessed": False',
              'comparator_output_accessed": False',
              'mrr_computed": False',
          ):
              assert token in p, token
          for phrase in (
              'PASS_V15_LABEL_FREE_V8_DEPLOYMENT_QUALIFICATION',
              'use exactly `base_2013.json` and `base_2014.json`',
              'do **not** use the Sugar-matched or HDBSCAN-matched subsets',
              'engineering applicability only',
              'no SonotaCo truth or comparator evaluation',
          ):
              assert phrase.lower() in d.lower(), phrase
          assert not Path('orbittrace_v15_sonotaco_applicability_v1/RUN.md').exists()
          for surface in ('https://', 'http://', 'requests.', 'urlopen(', 'gmn-python-api'):
              assert surface not in p.lower(), surface
          print('PASS_V15_SONOTACO_ENGINEERING_APPLICABILITY_SOURCE_AUDIT')
          print('DORMANT_NO_SONOTACO_ARTIFACT_READ_NO_TRUTH_NO_EXTERNAL_CLAIM')
          PY
