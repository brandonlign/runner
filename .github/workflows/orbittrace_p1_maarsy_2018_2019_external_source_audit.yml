name: OrbitTrace P1 MAARSY 2018/2019 external source audit

on:
  pull_request:
    branches:
      - agent/orbittrace-probabilistic-membership-p1-freeze-v2
    paths:
      - orbittrace_probabilistic_membership_p1/MAARSY_2018_2019_EXTERNAL_PROTOCOL.md
      - .github/workflows/orbittrace_p1_maarsy_2018_2019_external_source_audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove frozen external membership-validation contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('orbittrace_probabilistic_membership_p1/MAARSY_2018_2019_EXTERNAL_PROTOCOL.md').read_text()
          for token in (
              'MAARSY 2018/2019','PASS_PROBABILISTIC_MEMBERSHIP_P1_DEVELOPMENT',
              'BROAD_CATALOGUE_SUPERIORITY','SPARSE_STREAM_SUPERIORITY','20°–55°','10,000',
              'D_SH','0.05','0.50','200','30','Q_P1','Q_seed','0.60','0.15','0.01',
              '`coherent_P1_members >= 1.20 * coherent_seed_members`',
              'PASS_P1_MAARSY_2018_2019_EXTERNAL_VALIDATION',
          ):
              assert token in p, token
          assert 'kepler_std' in p and 'forbidden' in p.lower()
          assert 'opposite-year immutable v8 seed orbit' in p
          assert 'No OrbitTrace target coordinate' in p
          assert '2018/2019 scientific-value access' in p
          print('PASS_P1_MAARSY_2018_2019_EXTERNAL_PROTOCOL_AUDIT')
          PY
      - name: Assert source-only no-data boundary
        run: |
          set -euo pipefail
          test ! -e input
          test ! -e output
          test ! -e data
          echo NO_MAARSY_2018_2019_VALUES_NO_TARGET_ACCESS
